<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burn or Store Fat — Section 3: Creatine, the book, and the next lesson</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:640px;margin:20px auto;padding:0 16px;color:#111;line-height:1.6}
h1{font-size:19px;line-height:1.4;margin:0 0 12px}
button{font-size:18px;padding:8px 12px;margin:0;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.controls select{flex-shrink:0}
button.primary{background:#111;color:#fff;border-color:#111}
select{font-size:16px;padding:8px 6px;margin:0}
input[type=range]{width:100%;margin:12px 0}
.time{font-variant-numeric:tabular-nums;color:#444;white-space:nowrap}
.controls .time{margin-right:auto;margin-left:0}
#transcript{border:1px solid #ddd;border-radius:12px;padding:8px 12px;height:340px;overflow-y:auto;background:#fafafa;scroll-behavior:smooth}
.line{padding:8px 10px;border-radius:8px;opacity:.45;font-size:19px;line-height:1.55;cursor:pointer}
.line.active{opacity:1;font-weight:700;background:#111;color:#fff}

#zh{border:1px solid #e6d9a8;border-radius:12px;padding:10px 12px;margin-top:12px;margin-bottom:14px;background:#fffbe6;line-height:1.6;min-height:52px}

.controls #speedBtn{font-size:16px;padding:8px 10px}
.speed-menu{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:center;justify-content:center}
.speed-menu[hidden]{display:none}
.speed-list{background:#fff;border-radius:16px;width:min(320px,86vw);max-height:70vh;overflow-y:auto;padding:8px}
.speed-opt{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:19px;padding:14px 16px;border:none;border-bottom:1px solid #eee;background:#fff;color:#111}

</style>

<body>
<h1>Burn or Store Fat — Section 3: Creatine, the book, and the next lesson</h1>
<p style="color:#666;margin:0 0 12px">From the YouTube video “First 60 Minutes After Waking Decides Whether You Burn Or Store Fat” by Ben Azadi. Original English audio, with Chinese translation.</p>
<audio id="player" preload="metadata" src="sec3.m4a"></audio>
<div id="transcript"></div>
<div id="zh"></div>
<div class="controls">
<span class="time"><span id="cur">0:00</span> / <span id="dur">3:59</span></span>

<button class="primary" id="playBtn" aria-label="Play or pause" title="Play">▶</button></div>
<div id="speedMenu" class="speed-menu" hidden><div class="speed-list"><button class="speed-opt" data-rate="0.75">0.75×<span>○</span></button><button class="speed-opt" data-rate="0.8">0.8×<span>○</span></button><button class="speed-opt" data-rate="0.85">0.85×<span>○</span></button><button class="speed-opt" data-rate="0.9">0.9×<span>○</span></button><button class="speed-opt" data-rate="0.95">0.95×<span>○</span></button><button class="speed-opt sel" data-rate="1">1×<span>●</span></button><button class="speed-opt" data-rate="1.1">1.1×<span>○</span></button><button class="speed-opt" data-rate="1.2">1.2×<span>○</span></button><button class="speed-opt" data-rate="1.3">1.3×<span>○</span></button><button class="speed-opt" data-rate="1.4">1.4×<span>○</span></button><button class="speed-opt" data-rate="1.5">1.5×<span>○</span></button><button class="speed-opt" data-rate="1.6">1.6×<span>○</span></button><button class="speed-opt" data-rate="1.7">1.7×<span>○</span></button><button class="speed-opt" data-rate="1.8">1.8×<span>○</span></button><button class="speed-opt" data-rate="1.9">1.9×<span>○</span></button><button class="speed-opt" data-rate="2">2×<span>○</span></button></div></div>

<script>
const LINES=[{"start": 0.17, "end": 5.05, "text": "One of the most common complaints when people take creatine is that they feel bloated.", "zh": "人们服用肌酸时最常见的抱怨之一是他们觉得腹胀。"}, {"start": 5.2, "end": 6.71, "text": "Well, that doesn't happen with micronized creatine.", "zh": "嗯，微粉化肌酸就不会这样。"}, {"start": 6.85, "end": 14.03, "text": "So, when you go to that link, you're going to see this here, their MyoScience micronized creatine.", "zh": "所以，当你打开那个链接时，你会在这里看到这个，他们的 MyoScience 微粉化肌酸。"}, {"start": 14.03, "end": 17.4, "text": "You can see subscribe and save, one-time purchase, add to cart.", "zh": "你可以看到订阅省钱、一次性购买、加入购物车。"}, {"start": 17.57, "end": 19.29, "text": "The coupon code for 20% off is automatically applied.", "zh": "20% 折扣的优惠码是自动应用的。"}, {"start": 19.48, "end": 25.0, "text": "And if you're over 40, there's one thing I personally pair this creatine with every single day.", "zh": "而且如果你超过 40 岁，有一件事是我每天亲自把它跟这种肌酸搭配使用的。"}, {"start": 25.15, "end": 32.14, "text": "It's you can see in the bottom here, it goes perfectly with their vitamin D3 and their K2 option.", "zh": "你可以在下面这里看到，它跟他们的维生素 D3 和 K2 选项搭配得非常完美。"}, {"start": 32.14, "end": 32.19, "text": "Personally, I take both.", "zh": "我个人两个都服用。"}, {"start": 32.33, "end": 39.24, "text": "See, creatine helps support the engine, vitamin D helps support many of the signals that keep that engine running naturally and efficiently.", "zh": "你看，肌酸帮助支持引擎，维生素 D 帮助支持让那个引擎自然高效运转的许多信号。"}, {"start": 39.38, "end": 42.32, "text": "It's one of my favorite aging combinations.", "zh": "这是我最喜欢的老龄化组合之一。"}, {"start": 42.46, "end": 49.32, "text": "So, it's an option, but you can just add it to the cart like I'm going to do here, and the coupon code is applied to your entire order, by the way.", "zh": "所以，这是一个选项，但你也可以像我接下来要做的这样直接把它加入购物车，而且顺便说一句，优惠码适用于你的整个订单。"}, {"start": 49.48, "end": 55.11, "text": "And the best part, every order from MyoScience is backed by their 100% money-back guarantee.", "zh": "而最棒的是，MyoScience 的每一份订单都有他们 100% 退款保证作为后盾。"}, {"start": 55.3, "end": 55.8, "text": "So, there's really no risk.", "zh": "所以，真的没有风险。"}, {"start": 55.8, "end": 56.6, "text": "Try it for 30 days.", "zh": "试用 30 天。"}, {"start": 56.78, "end": 60.88, "text": "Watch what it does to support your energy, your recovery, and your muscle.", "zh": "看看它对支持你的能量、恢复和肌肉有什么作用。"}, {"start": 61.03, "end": 63.44, "text": "And most importantly, notice how you feel after you take it.", "zh": "最重要的是，注意服用后你的感觉。"}, {"start": 63.58, "end": 70.31, "text": "Click the first link in the description box below, or scan the QR code on the screen to get this product.", "zh": "点击下面描述框里的第一个链接，或者扫描屏幕上的二维码来获得这个产品。"}, {"start": 70.51, "end": 71.18, "text": "But, let me leave you with this.", "zh": "但是，让我最后再跟你说这一点。"}, {"start": 71.33, "end": 72.94, "text": "Look, you're not lazy.", "zh": "你看，你不是懒。"}, {"start": 73.09, "end": 74.38, "text": "You're not broken.", "zh": "你没有坏掉。"}, {"start": 74.54, "end": 76.21, "text": "Your metabolism is not secretly working against you.", "zh": "你的新陈代谢不是在暗中跟你作对。"}, {"start": 76.37, "end": 78.14, "text": "Your body has been doing what it's designed to do.", "zh": "你的身体一直在做它被设计要做的事。"}, {"start": 78.31, "end": 82.28, "text": "It's responding to the signals you've given it.", "zh": "它正在回应你给它的信号。"}, {"start": 82.45, "end": 84.73, "text": "You change the signal, you get a different response.", "zh": "你改变信号，就会得到不同的回应。"}, {"start": 84.89, "end": 92.44, "text": "The phone, the coffee, the absence of sunlight, the high carbs, no movement, all of this is stress on top of stress.", "zh": "手机、咖啡、缺乏阳光、高碳水、没有运动，所有这些都是压力叠加压力。"}, {"start": 92.61, "end": 94.79, "text": "All of those send signals to your body to store fat.", "zh": "所有这些都在向你的身体发送储存脂肪的信号。"}, {"start": 94.99, "end": 99.19, "text": "Change the signal and fat loss stops feeling like a battle you keep losing.", "zh": "改变信号，减脂就不再感觉像一场你一直在输的战斗。"}, {"start": 99.35, "end": 102.17, "text": "Try this routine, at least one of the tips here for the next 7 days.", "zh": "至少尝试这个流程中的一个技巧，坚持接下来的 7 天。"}, {"start": 102.29, "end": 105.3, "text": "Then come back and let me know how it went for you in the comment section.", "zh": "然后回来，在评论区告诉我你做得怎么样。"}, {"start": 105.43, "end": 112.62, "text": "And if you want to take this to the next level, I have a brand new book coming out called Keto Flex Revised.", "zh": "而且如果你想把这提升到下一个水平，我有一本全新的书要出版，叫《Keto Flex Revised》。"}, {"start": 112.84, "end": 126.34, "text": "This book has a 45-day plan that's designed to help you lower inflammation, lower insulin, tap into belly fat, dietary food swaps, how to practice fasting and keto the right way, meaning customized for men versus women.", "zh": "这本书有一个 45 天计划，旨在帮助你降低炎症、降低胰岛素、利用肚子上的脂肪、饮食食物替换、如何正确地实行断食和生酮，也就是说针对男性和女性分别定制。"}, {"start": 126.53, "end": 133.17, "text": "There's an entire chapter on how women who have a menstrual cycle do keto and fasting versus women who have or postmenopausal.", "zh": "整整有一章是关于有月经周期的女性如何做生酮和断食，而对比已经绝经或绝经后的女性。"}, {"start": 133.32, "end": 136.62, "text": "There's a chapter for you ladies out there who are postmenopausal as well.", "zh": "也有一章是给你们这些绝经后的女士的。"}, {"start": 136.78, "end": 146.07, "text": "There's also a section on how diabetics do it, a section on how men do it, troubleshooting tips for you, and fat-burning recipes at the end of this book.", "zh": "还有一节是关于糖尿病患者怎么做，一节是关于男性怎么做，给你的故障排除技巧，以及这本书最后的燃脂食谱。"}, {"start": 146.24, "end": 149.91, "text": "This book is coming out July 21st, but you could pre-order it today.", "zh": "这本书将在 7 月 21 日出版，但你今天就可以预订。"}, {"start": 150.09, "end": 154.27, "text": "It's available, going to be available on paperback, Kindle, Audible, and Spotify.", "zh": "它将以平装本、Kindle、Audible 和 Spotify 的形式提供。"}, {"start": 154.45, "end": 156.96, "text": "I narrated the entire Audible myself, the audios myself.", "zh": "我亲自为整个 Audible 进行了旁白。"}, {"start": 157.12, "end": 164.62, "text": "And for anybody who pre-orders it today, we're giving you some exclusive bonuses sent to your email right away.", "zh": "而对于今天预订的任何人，我们会立即通过邮件给你发送一些独家奖励。"}, {"start": 164.81, "end": 166.22, "text": "Number one is a Keto Flex Jumpstart Guide.", "zh": "第一是《Keto Flex Jumpstart Guide》。"}, {"start": 166.46, "end": 171.7, "text": "Number two is an exclusive Keto Flex Revised PDF and audio series.", "zh": "第二是独家的《Keto Flex Revised》PDF 和音频系列。"}, {"start": 171.86, "end": 174.63, "text": "So, you can get started on the process before you even get the book.", "zh": "所以，你甚至可以在拿到书之前就开始这个过程。"}, {"start": 174.83, "end": 185.46, "text": "Go to ketoflexbook.com or scan the QR code on the screen or click the second link in the description box below to pre-order the book and get your free bonuses right now.", "zh": "去 ketoflexbook.com，或者扫描屏幕上的二维码，或者点击下面描述框里的第二个链接来预订这本书，并立即获得你的免费奖励。"}, {"start": 185.64, "end": 195.29, "text": "And if this lesson has reframed how you see your body, share it with at least one person you know who's been blaming themselves for something that was never really their fault.", "zh": "而且如果这节课重新塑造了你看待身体的方式，那就把它分享给至少一个你认识的、一直在为一件从来都不是他们真正错的事情责怪自己的人。"}, {"start": 195.44, "end": 198.06, "text": "Send it to them right now, and I'll see you in the next one.", "zh": "现在就发给他们，我会在下一节课里见到你。"}, {"start": 198.22, "end": 209.06, "text": "And if you enjoyed this lesson, I just published a video on 400 mg of a certain nutrient that lowers cortisol and helps you get quality fat-burning sleep and prevents you from getting up to pee in the middle of the night.", "zh": "而且如果你喜欢这节课，我刚刚发布了一个视频，讲的是 400 毫克的某种营养素，它可以降低皮质醇，帮助你获得优质的燃脂睡眠，并防止你在半夜起床上厕所。"}, {"start": 209.19, "end": 216.29, "text": "Here's a clip from that lesson, then click the video on the screen coming up, and I'll see you in that next lesson.", "zh": "这里有一段那节课的片段，然后点击屏幕上即将出现的视频，我会在下一节课里见到你。"}, {"start": 216.46, "end": 219.09, "text": "Because this isn't a sleep problem, it's a hormone problem.", "zh": "因为这不是一个睡眠问题，而是一个激素问题。"}, {"start": 219.3, "end": 219.84, "text": "So, let's fix it.", "zh": "所以，让我们来解决它。"}, {"start": 220.03, "end": 228.47, "text": "You see, you have two opposing hormones, cortisol, which is a morning hormone, and melatonin, which is a night hormone.", "zh": "你看，你有两种对立的激素，皮质醇，它是一种早晨激素，和褪黑素，它是一种夜间激素。"}, {"start": 228.66, "end": 230.49, "text": "They cannot coexist.", "zh": "它们不能共存。"}, {"start": 230.49, "end": 232.83, "text": "When cortisol rises, melatonin decreases.", "zh": "当皮质醇上升时，褪黑素就会下降。"}, {"start": 233.05, "end": 238.75, "text": "Now, here's what triggers that two to three", "zh": "现在，这就是触发那两到三个"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    a.currentTime = Math.max(0, a.currentTime - 5);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
