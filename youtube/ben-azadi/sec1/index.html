<p style="color:#666;margin:0 0 12px">From the YouTube video “First 60 Minutes After Waking Decides Whether You Burn Or Store Fat” by Ben Azadi. Original English audio, with Chinese translation.</p>

<script>
const LINES=[{"start": 0, "end": 6.17, "text": "Most people think they gain belly fat because of what they eat.", "zh": "大多数人以为自己长肚子上的脂肪，是因为吃的东西。"}, {"start": 6.37, "end": 7.66, "text": "They're wrong.", "zh": "他们错了。"}, {"start": 7.66, "end": 17.83, "text": "In fact, before 9:00 a.m. tomorrow, millions of Americans will accidentally trigger the exact biological switch that tells their body to store more fat around their organs.", "zh": "事实上，在明天早上 9 点之前，数百万美国人会不小心触发一个确切的生物开关，让身体在内脏周围储存更多脂肪。"}, {"start": 18.02, "end": 19.79, "text": "Fat just like this.", "zh": "就像这样的脂肪。"}, {"start": 19.99, "end": 21.76, "text": "And the scary part?", "zh": "而可怕的是什么？"}, {"start": 21.95, "end": 24.83, "text": "Most of them will do it before eating a single bite of food.", "zh": "他们中的大多数人甚至还没吃一口东西就已经这样做了。"}, {"start": 25.04, "end": 28.89, "text": "No donuts, no junk food, no cheating.", "zh": "没有甜甜圈，没有垃圾食品，没有作弊。"}, {"start": 28.89, "end": 37.53, "text": "Just one completely normal habit that's quietly increasing insulin resistance, raising cortisol, and making fat loss feel impossible.", "zh": "只是一个完全正常的习惯，它正在悄悄增加胰岛素抵抗，抬高皮质醇，让减脂感觉不可能。"}, {"start": 37.71, "end": 38.37, "text": "This might be the missing piece.", "zh": "这可能就是缺失的那一块。"}, {"start": 38.51, "end": 41.77, "text": "Because what I'm about to show you has almost nothing to do with calories.", "zh": "因为我接下来要给你看的东西，几乎跟卡路里无关。"}, {"start": 41.94, "end": 45.45, "text": "It has almost nothing to do with exercise.", "zh": "也几乎跟运动无关。"}, {"start": 45.62, "end": 49.79, "text": "And it has everything to do with the first 60 minutes after you open your eyes.", "zh": "而是跟你睁开眼睛后的第一个 60 分钟息息相关。"}, {"start": 49.96, "end": 55.04, "text": "You see, within minutes of waking up, your metabolism makes a critical decision.", "zh": "你看，醒来几分钟内，你的新陈代谢就会做出一个关键决定。"}, {"start": 55.23, "end": 60.63, "text": "It decides whether today is the day to burn stored fat or to protect that stored fat.", "zh": "它决定今天是要燃烧储存的脂肪，还是要保护这些储存的脂肪。"}, {"start": 60.83, "end": 65.52, "text": "And most people unknowingly send the wrong signals to their metabolism before they even brush their teeth.", "zh": "而大多数人在还没刷牙之前，就已经不知不觉地给新陈代谢发出了错误的信号。"}, {"start": 65.69, "end": 72.02, "text": "I'm going to show you right now the seven morning mistakes that silently tell your body hold on to belly fat.", "zh": "我现在就给你看七个早晨错误，它们会悄悄告诉你的身体留住肚子上的脂肪。"}, {"start": 72.18, "end": 73.42, "text": "And one of them is considered healthy.", "zh": "其中一个被认为是健康的。"}, {"start": 73.58, "end": 77.14, "text": "One of them is recommended by wellness influencers on your TikTok feed.", "zh": "其中一个是 TikTok 上那些健康网红推荐的。"}, {"start": 77.31, "end": 80.35, "text": "And the last one is the hidden villain tying it all together.", "zh": "而最后一个是把这一切串联起来的隐藏反派。"}, {"start": 80.5, "end": 84.04, "text": "Once you learn this, you'll never look at the morning the same way again.", "zh": "一旦你学会了这些，你再看早晨就永远不一样了。"}, {"start": 84.23, "end": 96.29, "text": "And stay with me to the end because I'm going to show you the exact first hour fat burning routine I personally use to flip this biological switch in your favor every single day.", "zh": "而且请跟我看到最后，因为我会给你看我每天亲自使用的、确切的第一个小时燃脂流程，用它每天把这个生物开关拨向对你有利的一边。"}, {"start": 96.47, "end": 98.71, "text": "Here's a quick gut check.", "zh": "先快速自测一下。"}, {"start": 98.9, "end": 100.43, "text": "Just answer this in your head right now.", "zh": "现在就在心里回答这个问题。"}, {"start": 100.6, "end": 102.81, "text": "Do you wake up tired even after a full night of sleep?", "zh": "你睡了一整夜之后醒来还是觉得累吗？"}, {"start": 103.0, "end": 107.19, "text": "Do you need coffee to function like a human?", "zh": "你需要靠咖啡才能像个人一样正常运转吗？"}, {"start": 107.38, "end": 109.52, "text": "Do you crash around 2:00 p.m. and start looking for sugar?", "zh": "你会在下午 2 点左右犯困，然后开始找糖吃吗？"}, {"start": 109.7, "end": 114.14, "text": "Do you carry stubborn fat on your body that doesn't move no matter what you do?", "zh": "不管你做什么，身上都有怎么都减不掉的顽固脂肪吗？"}, {"start": 114.3, "end": 117.4, "text": "And are you hungry two to three hours after you've eaten a full meal?", "zh": "而且你在吃完一顿饱饭两三个小时后又饿了吗？"}, {"start": 117.56, "end": 124.15, "text": "If you said yes to even a couple of those, I bet money that you're making the same mistakes I'm about to show you.", "zh": "如果你其中有几项都答了是，我敢打赌，你正在犯我接下来要讲的那些错误。"}, {"start": 124.28, "end": 126.53, "text": "But, the good news is that none of them are your fault.", "zh": "但好消息是，这些都不是你的错。"}, {"start": 126.67, "end": 127.39, "text": "You were never told how to correct it.", "zh": "从来没有人告诉过你该怎么纠正。"}, {"start": 127.57, "end": 130.76, "text": "Let's start with mistake number one.", "zh": "我们从第一个错误开始。"}, {"start": 130.94, "end": 133.67, "text": "That's going to be checking your phone the second you wake up.", "zh": "那就是一醒来就看手机。"}, {"start": 133.85, "end": 134.67, "text": "Be honest.", "zh": "说实话。"}, {"start": 134.85, "end": 137.03, "text": "Your phone is your alarm.", "zh": "手机就是你的闹钟。"}, {"start": 137.21, "end": 141.26, "text": "So, the first thing your hand does every morning is to grab it.", "zh": "所以每天早上你的手做的第一件事就是去拿它。"}, {"start": 141.44, "end": 141.94, "text": "And then you catch yourself scrolling.", "zh": "然后你发现自己开始刷手机了。"}, {"start": 142.02, "end": 146.72, "text": "Email, text messages, Instagram, the news telling you the world is on fire.", "zh": "邮件、短信、Instagram、告诉你世界正在着火的新闻。"}, {"start": 146.86, "end": 150.01, "text": "But, here's what your brain doesn't understand.", "zh": "但是，你的大脑不明白这一点。"}, {"start": 150.14, "end": 152.26, "text": "It doesn't know you're just checking Instagram.", "zh": "它不知道你只是在看 Instagram。"}, {"start": 152.41, "end": 156.83, "text": "It can't tell the difference between a notification and an actual threat.", "zh": "它分不清一条通知和一个真正的威胁。"}, {"start": 157.05, "end": 161.97, "text": "All it sees is stimulation, urgency, and stress before your feet even hit the floor.", "zh": "在你的脚还没落地之前，它看到的只有刺激、紧迫感和压力。"}, {"start": 162.15, "end": 168.03, "text": "You see, there's a hormone that naturally spikes within 30 to 45 minutes after you've woken up.", "zh": "你看，有一种激素会在你醒来后 30 到 45 分钟内自然飙升。"}, {"start": 168.03, "end": 170.24, "text": "It's called the cortisol awakening response.", "zh": "它叫皮质醇觉醒反应。"}, {"start": 170.44, "end": 173.02, "text": "And it's supposed to happen.", "zh": "而它本来就应该发生。"}, {"start": 173.02, "end": 174.32, "text": "It's your body's built-in jump-start.", "zh": "这是你身体内置的启动程序。"}, {"start": 174.53, "end": 178.51, "text": "The problem is when you pile artificial stress on top of it.", "zh": "问题在于，当你在它上面再叠加人为的压力时。"}, {"start": 178.79, "end": 190.77, "text": "And get this, in February 2025, researchers published a study in PNAS Nexus, where they had people block their mobile internet on their phones for 2 weeks.", "zh": "而且你听我说，2025 年 2 月，研究人员在《PNAS Nexus》上发表了一项研究，他们让人们连续 2 周屏蔽手机上的移动网络。"}, {"start": 191.01, "end": 193.5, "text": "Just 2 weeks, 14 days.", "zh": "就 2 周，14 天。"}, {"start": 193.73, "end": 198.96, "text": "And that one change improved their sustained attention, their mental health, and their overall well-being.", "zh": "而这一个改变就改善了他们的持续注意力、心理健康和整体幸福感。"}, {"start": 199.15, "end": 209.44, "text": "Their attention scores improved by an amount the researchers compared to reversing about a decade of age-related decline from not staring at a screen.", "zh": "他们的注意力分数提高的幅度，研究人员把它比作逆转了大约十年因盯着屏幕而导致的与年龄相关的衰退。"}, {"start": 209.62, "end": 211.54, "text": "Now, flip that around.", "zh": "现在反过来想。"}, {"start": 211.73, "end": 220.67, "text": "If removing it does that much good, what do you think staring at your phone every single morning is doing to your stress hormones, your focus, and yeah, your waistline?", "zh": "如果去掉它有这么大的好处，你觉得每天早上盯着手机会对你的压力激素、专注力和腰围造成什么影响？"}, {"start": 220.83, "end": 224.56, "text": "See, when you do this, you're walking into survival mode on purpose.", "zh": "你看，当你这样做的时候，你就是在主动走进生存模式。"}, {"start": 224.73, "end": 227.09, "text": "And survival mode and fat-burning mode are not the same thing.", "zh": "而生存模式和燃脂模式不是一回事。"}, {"start": 227.24, "end": 232.3, "text": "It turns out the fat around your organs, called the visceral fat, kind of looks like this.", "zh": "事实证明，内脏周围的脂肪，也就是所谓的内脏脂肪，大概长这样。"}, {"start": 232.45, "end": 234.56, "text": "This is 5 lb of visceral fat.", "zh": "这是 5 磅内脏脂肪。"}, {"start": 234.56, "end": 240.92, "text": "The receptor sites for cortisol are triple in your belly fat in your visceral fat compared to other areas of your body.", "zh": "与身体其他部位相比，你肚子上的脂肪、内脏脂肪里的皮质醇受体位点要多出三倍。"}, {"start": 241.07, "end": 249.24, "text": "That's why it's called the cortisol belly, and it's one of the things I get on my wife's case every morning because she has the tendency to grab her phone.", "zh": "这就是为什么它叫皮质醇肚，也是我每天早上都要唠叨我妻子的事情之一，因为她有拿手机的习惯。"}, {"start": 249.38, "end": 251.2, "text": "Yet, she doesn't really listen to my advice.", "zh": "不过，她其实不太听我的建议。"}, {"start": 251.39, "end": 254.2, "text": "Maybe she'll watch this video.", "zh": "也许她会看这个视频。"}, {"start": 254.39, "end": 254.89, "text": "Let's get into mistake number two.", "zh": "我们来讲第二个错误。"}, {"start": 254.89, "end": 258.22, "text": "Drinking coffee before water.", "zh": "在喝水之前喝咖啡。"}, {"start": 258.45, "end": 259.11, "text": "When you wake up, you're dehydrated.", "zh": "当你醒来时，你是脱水的。"}, {"start": 259.29, "end": 270.05, "text": "You just went 7, 8, maybe 9 hours without a single sip of water, and you were breathing out the moisture the whole time, which means your blood is literally thicker in the morning.", "zh": "你刚刚 7、8、甚至 9 个小时没有喝一口水，而且整个过程中你一直在通过呼吸排出水分，这意味着你的血液在早上 literally 变得更浓稠。"}, {"start": 270.2, "end": 273.18, "text": "So, what do most people reach for first?", "zh": "那么，大多数人最先伸手拿什么？"}, {"start": 273.33, "end": 273.83, "text": "Not water.", "zh": "不是水。"}, {"start": 273.83, "end": 276.94, "text": "They reach for coffee, caffeine.", "zh": "他们拿的是咖啡、咖啡因。"}, {"start": 277.17, "end": 281.97, "text": "When you do that, you're pouring a stimulant on top of an already stressed, already dehydrated system.", "zh": "当你这样做的时候，你就是在一个已经有压力、已经脱水的系统上再倒一种兴奋剂。"}, {"start": 282.18, "end": 290.19, "text": "It's like throwing gasoline on a fire and wondering why you feel jittery and starving by 10:00 a.m.", "zh": "这就像往火上浇汽油，然后还纳闷为什么到了早上 10 点你会觉得心慌又饿得要命。"}, {"start": 290.19, "end": 292.7, "text": "And look, I'm not anti-coffee.", "zh": "而且你听我说，我不是反对咖啡。"}, {"start": 292.91, "end": 298.86, "text": "I love coffee, but I am anti-coffee as your first input first thing in the morning.", "zh": "我喜欢咖啡，但我反对把咖啡作为你早上起床后的第一种摄入。"}, {"start": 298.86, "end": 302.6, "text": "Look, even mild dehydration messes with your energy, your mood, and how hungry you feel.", "zh": "你看，即使是轻微脱水也会影响你的精力、情绪和饥饿感。"}, {"start": 302.82, "end": 308.26, "text": "A lot of what people call hunger at 11:00 a.m. is just thirst wearing a costume.", "zh": "很多人所说的早上 11 点的饥饿感，其实只是口渴在伪装。"}, {"start": 308.45, "end": 312.46, "text": "So, water first and add some minerals in it.", "zh": "所以，先喝水，并且在水里加一点矿物质。"}, {"start": 312.64, "end": 318.63, "text": "Then your coffee a little later, and I'll give you the exact best timing for that coffee towards the end of this lesson.", "zh": "然后过一会儿再喝咖啡，我会在这节课快结束时告诉你喝咖啡的确切最佳时间。"}, {"start": 318.8, "end": 321.6, "text": "And it changes everything about how the rest of your day feels.", "zh": "而这会彻底改变你一天剩下的时间的感觉。"}, {"start": 321.8, "end": 327.02, "text": "Mistake number three, never getting morning sunlight.", "zh": "第三个错误，从来不晒早晨的阳光。"}, {"start": 327.22, "end": 331.71, "text": "This is one of the most underrated items on the entire list, and this one is free.", "zh": "这是整个清单上最被低估的一项，而且这一项是免费的。"}, {"start": 331.88, "end": 333.52, "text": "You see, your body runs on an internal clock.", "zh": "你看，你的身体是按照一个内部时钟运转的。"}, {"start": 333.68, "end": 334.9, "text": "Scientists call it your circadian rhythm.", "zh": "科学家称它为昼夜节律。"}, {"start": 335.07, "end": 339.09, "text": "That clock controls when you release cortisol, when you release melatonin.", "zh": "这个时钟控制着你什么时候释放皮质醇，什么时候释放褪黑素。"}, {"start": 339.29, "end": 346.04, "text": "And here's the kicker, it also controls how sensitive you are to insulin throughout the day.", "zh": "而关键在于，它还控制着你全天对胰岛素的敏感程度。"}, {"start": 346.28, "end": 358.7, "text": "Insulin is the only fat storage hormone inside of your body and about 93% of Americans are insulin resistant and a big part of it is their circadian rhythm is thrown off.", "zh": "胰岛素是你体内唯一的脂肪储存激素，而大约 93% 的美国人都有胰岛素抵抗，其中很大一部分原因就是他们的昼夜节律被打乱了。"}, {"start": 358.88, "end": 359.89, "text": "You see most people never set that clock.", "zh": "你看，大多数人从来没有设定过这个时钟。"}, {"start": 360.09, "end": 366.28, "text": "They roll out of bed, walk around their house that's lit by light bulbs, artificial light.", "zh": "他们起床后在屋里走来走去，屋里亮着灯泡，是人造光。"}, {"start": 366.44, "end": 372.82, "text": "They drive to work and or work from home and sit behind computer screens and fluorescent lights all day long.", "zh": "他们开车去上班，或者在家工作，整天坐在电脑屏幕和荧光灯后面。"}, {"start": 372.97, "end": 376.68, "text": "Their body literally never gets the signal that the day has started.", "zh": "他们的身体 literally 从来没有收到白天已经开始的信号。"}, {"start": 376.85, "end": 388.95, "text": "There's research showing that people who get natural sunlight during the day have lower fasting insulin and better insulin sensitivity even after you account for body fat and the season.", "zh": "有研究表明，白天能晒到自然阳光的人空腹胰岛素更低，胰岛素敏感性更好，即使在考虑了体脂和季节因素之后也是如此。"}, {"start": 388.95, "end": 393.3, "text": "So your body simply handles sugar and carbohydrates better from getting light at the right time.", "zh": "所以你的身体仅仅因为在正确的时间获得光照，就能更好地处理糖和碳水化合物。"}, {"start": 393.46, "end": 396.07, "text": "Oh, and it goes the other way too.", "zh": "哦，反过来也一样。"}, {"start": 396.22, "end": 405.17, "text": "When researchers exposed people to bright light at the wrong time like in the evening, it can actually increase their insulin resistance and spike their blood sugar higher after a meal.", "zh": "当研究人员在错误的时间，比如晚上，让人们暴露在强光下，这实际上会增加他们的胰岛素抵抗，并在餐后让血糖升得更高。"}, {"start": 405.35, "end": 408.66, "text": "So light is not just about your mood.", "zh": "所以光照不仅仅关乎你的心情。"}, {"start": 408.85, "end": 411.33, "text": "Light is a blood sugar tool.", "zh": "光照是一种血糖工具。"}, {"start": 411.51, "end": 413.91, "text": "It's a fat loss tool and almost nobody's using it.", "zh": "它是一种减脂工具，而几乎没有人在用它。"}, {"start": 414.11, "end": 419.05, "text": "10 to 30 minutes of real sunlight in your eyes within the first hour of waking up, meaning take off your sunglasses.", "zh": "在醒来后的第一个小时内，让真正的阳光照进你的眼睛 10 到 30 分钟，也就是说要摘掉墨镜。"}, {"start": 419.21, "end": 420.91, "text": "That's the whole hack.", "zh": "这就是全部诀窍。"}, {"start": 421.08, "end": 423.15, "text": "You see your grandmother did it without even knowing it.", "zh": "你看，你奶奶就是在不知不觉中这样做的。"}, {"start": 423.29, "end": 426.48, "text": "We forget and if you have a dog, it's perfect.", "zh": "我们忘了这一点，如果你有狗，那就太完美了。"}, {"start": 426.63, "end": 428.53, "text": "Go walk your dog outside first thing in the morning.", "zh": "早上第一件事就是带你的狗出去散步。"}, {"start": 428.65, "end": 434.11, "text": "That's exactly what I do and that's how I get my sunlight first thing in the morning.", "zh": "这正是我做的，我就是这样早上第一件事获得阳光的。"}, {"start": 434.32, "end": 437.2, "text": "Mistake number four, eating a healthy high carbohydrate breakfast.", "zh": "第四个错误，吃一顿健康的、高碳水化合物的早餐。"}, {"start": 437.38, "end": 439.51, "text": "Okay, this is a big one.", "zh": "好吧，这是一个大问题。"}, {"start": 439.69, "end": 444.74, "text": "This is the one that's going to sting because you've been told it's the healthy choice pretty much your entire life.", "zh": "这一个会让你难受，因为你几乎一辈子都被告知这是健康的选择。"}, {"start": 444.91, "end": 455.89, "text": "The cereal, the oatmeal, the whole grain toast, the yogurt with the fruit at the bottom, the granola and the orange juice, the healthy muffin at your favorite coffee place.", "zh": "麦片、燕麦片、全麦吐司、底部带水果的酸奶、格兰诺拉麦片和橙汁、你最喜欢的咖啡店里的健康松饼。"}, {"start": 456.1, "end": 459.16, "text": "Look, the average breakfast is dessert disguised as health food.", "zh": "你看，普通的早餐就是伪装成健康食品的甜点。"}, {"start": 459.33, "end": 462.31, "text": "When you wake up, your body is calm, your blood sugar is stable.", "zh": "当你醒来时，你的身体很平静，血糖很稳定。"}, {"start": 462.48, "end": 468.98, "text": "But when you eat a giant pile of carbohydrates first thing in the morning, your blood sugar shoots up.", "zh": "但是当你早上第一件事就吃一大堆碳水化合物时，你的血糖就会飙升。"}, {"start": 469.14, "end": 473.08, "text": "Your pancreas has to release insulin to deal with that extra blood sugar.", "zh": "你的胰腺必须释放胰岛素来处理这些多余的血糖。"}, {"start": 473.26, "end": 474.7, "text": "And when insulin is high, you are storing fat.", "zh": "而当胰岛素高的时候，你就是在储存脂肪。"}, {"start": 474.86, "end": 481.74, "text": "Then, what happens an hour and a half later, that blood sugar drops steeply because of the insulin production.", "zh": "然后，一个半小时后会发生什么？由于胰岛素的分泌，血糖会急剧下降。"}, {"start": 481.9, "end": 482.4, "text": "So, then your blood sugar crashes.", "zh": "于是你的血糖崩了。"}, {"start": 482.4, "end": 484.84, "text": "What does that crash feel like?", "zh": "这种崩溃是什么感觉？"}, {"start": 485.01, "end": 486.37, "text": "Shakeness, foggy.", "zh": "发抖、头脑昏沉。"}, {"start": 486.54, "end": 488.03, "text": "Your brain tells the body, \"Go get more carbs.", "zh": "你的大脑告诉身体：“去吃更多碳水化合物吧。"}, {"start": 488.17, "end": 491.3, "text": "Go get more sugar.\" So, you grab another snack.", "zh": "去吃更多糖。”于是你又抓起一份零食。"}, {"start": 491.44, "end": 496.82, "text": "And then you're on a blood sugar roller coaster all day long, and you're in fat storage mode from morning to night time.", "zh": "然后你一整天都在血糖过山车上，从早上到晚上都处于脂肪储存模式。"}, {"start": 496.97, "end": 502.09, "text": "Now, here's the flip side, and I want you to share this with somebody cuz it's very fascinating.", "zh": "现在，反过来看，我希望你把这一点分享给别人，因为这非常有意思。"}, {"start": 502.22, "end": 511.69, "text": "There's a study out of the University of Missouri where they fed young people a high protein breakfast, and they watched their brains on an fMRI scanner.", "zh": "密苏里大学有一项研究，他们给年轻人吃了一顿高蛋白早餐，然后用功能性核磁共振扫描仪观察他们的大脑。"}, {"start": 511.88, "end": 519.81, "text": "The protein breakfast actually reduced the brain signals tied to food cravings and reward-driven eating, not willpower.", "zh": "高蛋白早餐实际上降低了与食物渴望和奖赏驱动进食相关的大脑信号，不是靠意志力。"}, {"start": 520.06, "end": 522.64, "text": "It was brain activity.", "zh": "而是大脑活动。"}, {"start": 522.88, "end": 528.56, "text": "They literally wanted less junk food for hours because of what they ate first thing.", "zh": "他们 literally 在几个小时内对垃圾食品的渴望减少了，因为他们早上第一顿吃了什么。"}, {"start": 528.76, "end": 542.71, "text": "In another body of research, women eating protein at breakfast instead of a carb-based breakfast lost significantly more weight and shaved significantly more off their waist circumference in just over 8 weeks.", "zh": "在另一项研究中，吃早餐时吃蛋白质而不是以碳水化合物为主的早餐的女性，在仅仅 8 周多一点的时间里就显著减掉了更多体重，腰围也显著缩小了。"}, {"start": 542.98, "end": 544.44, "text": "Same calories, different first meal.", "zh": "同样的卡路里，不同的第一餐。"}, {"start": 544.61, "end": 549.68, "text": "So, the issue isn't that you're eating breakfast, it's what you're putting in first.", "zh": "所以问题不在于你吃不吃早餐，而在于你最先吃的是什么。"}, {"start": 549.86, "end": 553.0, "text": "Protein first changes the entire day.", "zh": "蛋白质优先会改变一整天。"}, {"start": 553.17, "end": 554.28, "text": "And we'll get to the how in just a minute.", "zh": "我们一会儿就会讲到具体怎么做。"}, {"start": 554.45, "end": 558.35, "text": "But first, let's get to mistake number five, eating too soon after you wake up.", "zh": "但首先，我们来讲第五个错误，醒来后吃东西吃得太早。"}, {"start": 558.49, "end": 560.77, "text": "Now, this one's subtle and it's connected to the last one.", "zh": "这个比较微妙，而且跟上一个有关。"}, {"start": 560.94, "end": 567.11, "text": "Most people wake up and they eat within 5 to 15 minutes after they've woken up every single day.", "zh": "大多数人醒来后每天都在醒来后 5 到 15 分钟内吃东西。"}, {"start": 567.28, "end": 571.23, "text": "They never give their body an extra window to tap into stored body fat for fuel.", "zh": "他们从来没有给身体一个额外的窗口，让身体利用储存的体脂作为燃料。"}, {"start": 571.4, "end": 572.53, "text": "Think about it.", "zh": "想想看。"}, {"start": 572.69, "end": 577.39, "text": "Overnight, while you slept, your insulin came down, your body finally started tapping into fat for fuel.", "zh": "在你睡觉的夜里，你的胰岛素下降了，身体终于开始利用脂肪作为燃料。"}, {"start": 577.54, "end": 578.83, "text": "That's the window.", "zh": "那就是那个窗口。"}, {"start": 578.99, "end": 580.51, "text": "That's the good part.", "zh": "那就是好的部分。"}, {"start": 580.66, "end": 586.07, "text": "But when you wake up and eat immediately, especially carbohydrates, insulin spikes and that window gets slammed shut.", "zh": "但是当你醒来后马上吃东西，尤其是碳水化合物，胰岛素就会飙升，那个窗口就被砰地关上了。"}, {"start": 586.22, "end": 593.09, "text": "You shut off fat burning before heading out the door and then you do it again tomorrow and the next day after that.", "zh": "你在出门之前就关掉了燃脂，然后第二天、再第二天又重复一次。"}, {"start": 593.25, "end": 596.56, "text": "Now, this isn't about starving yourself or doing some extreme fasting.", "zh": "现在，这不是要你饿着自己，或者做什么极端的断食。"}, {"start": 596.72, "end": 600.63, "text": "It's simply about not sprinting to the fridge the second you open your eyes.", "zh": "这只是说不要在你一睁开眼睛就冲向冰箱。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
