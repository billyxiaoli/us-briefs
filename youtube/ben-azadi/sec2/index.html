<h1>Burn or Store Fat — Section 2: Mistakes 6–7, the 7-step routine, and creatine</h1>
<p style="color:#666;margin:0 0 12px">From the YouTube video “First 60 Minutes After Waking Decides Whether You Burn Or Store Fat” by Ben Azadi. Original English audio, with Chinese translation.</p>

<script>
const LINES=[{"start": 0.16, "end": 8.44, "text": "Just simply pushing your first meal back a little bit while you hydrate, get sunshine and hopefully move your body and go for a short walk.", "zh": "只要把第一餐稍微往后推一点，同时补水、晒太阳，最好再动动身体，出去短暂地散散步。"}, {"start": 8.61, "end": 11.65, "text": "This lets your body stay in fat burning mode a little bit longer.", "zh": "这能让你的身体在燃脂模式里多待一会儿。"}, {"start": 11.81, "end": 14.86, "text": "Most people have never given their body that chance, not once.", "zh": "大多数人从来没有给过身体这个机会，一次都没有。"}, {"start": 15.05, "end": 17.55, "text": "But we're going to fix that.", "zh": "但我们要来解决这个问题。"}, {"start": 17.73, "end": 20.22, "text": "Mistake number six, sitting down right after you eat.", "zh": "第六个错误，吃完东西马上就坐下。"}, {"start": 20.37, "end": 24.11, "text": "You eat breakfast, then you do what everybody does.", "zh": "你吃完早餐，然后就做每个人都会做的事。"}, {"start": 24.26, "end": 27.11, "text": "You sit at your desk, in your car, on the couch with your laptop.", "zh": "你坐在办公桌前、车里，或者抱着笔记本电脑坐在沙发上。"}, {"start": 27.26, "end": 32.6, "text": "And while you're sitting still, the glucose from that meal is just floating around in your bloodstream with nowhere to go.", "zh": "而当你静止不动地坐着时，那顿饭带来的葡萄糖就只是在你的血液里漂浮着，无处可去。"}, {"start": 32.79, "end": 36.98, "text": "So, insulin keeps climbing to force it into storage, fat storage.", "zh": "于是，胰岛素不断攀升，强行把它送进储存，也就是脂肪储存。"}, {"start": 37.19, "end": 39.33, "text": "Here's a fascinating study I want you to remember.", "zh": "这里有一项很有意思的研究，我希望你记住。"}, {"start": 39.55, "end": 50.87, "text": "A study in Diabetes Care took older adults at risk for diabetes and had them take three short 15-minute walks, one after each meal.", "zh": "《Diabetes Care》上的一项研究让有糖尿病风险的老年人每餐后都散步三次，每次 15 分钟。"}, {"start": 51.09, "end": 51.59, "text": "Just a 15-minute walk.", "zh": "就 15 分钟的散步。"}, {"start": 51.59, "end": 58.71, "text": "And those three little walks controlled their blood sugar over 24 hours as well as one long 45-minute walk.", "zh": "而这三次短短的散步在 24 小时内控制血糖的效果，跟一次 45 分钟的长散步一样好。"}, {"start": 58.94, "end": 61.45, "text": "It was the after-meal walk that was the magic.", "zh": "起作用的是餐后散步。"}, {"start": 61.65, "end": 70.59, "text": "And in another study, walking right after meals lowered blood sugar significantly more than the same amount of walking done at other times of the day.", "zh": "而在另一项研究中，餐后马上散步比在一天中其他时间做同样时长的散步更能显著降低血糖。"}, {"start": 70.76, "end": 75.27, "text": "Same minutes, but it was better timing, better results.", "zh": "同样的分钟数，但更好的时机，更好的结果。"}, {"start": 75.44, "end": 75.94, "text": "Here's why this works.", "zh": "这就是为什么它有效。"}, {"start": 75.94, "end": 77.52, "text": "This is the cool part.", "zh": "这是很酷的部分。"}, {"start": 77.7, "end": 86.01, "text": "When your muscles contract during a light walk, they pull glucose out of your blood without needing insulin.", "zh": "当你的肌肉在轻度散步中收缩时，它们会把葡萄糖从血液中拉出来，而不需要胰岛素。"}, {"start": 86.24, "end": 88.19, "text": "It's kind of like a sponge to absorb the glucose.", "zh": "这有点像一块海绵，可以吸收葡萄糖。"}, {"start": 88.37, "end": 98.47, "text": "So, you're kind of clearing the extra glucose in the bloodstream through a side door that doesn't ask your fat storage hormone insulin for permission.", "zh": "所以，你有点像是通过一个不需要向你的脂肪储存激素胰岛素请示的侧门，把血液中多余的葡萄糖清除掉。"}, {"start": 98.68, "end": 101.35, "text": "So, simply one walk after eating, 10 to 15 minutes.", "zh": "所以，吃完东西后简单地散一次步，10 到 15 分钟。"}, {"start": 101.53, "end": 102.34, "text": "That's it.", "zh": "就是这样。"}, {"start": 102.52, "end": 108.36, "text": "And this one is the single easiest win on this entire list, and you could start it tomorrow.", "zh": "而这一个是整个清单上最容易做到的胜利，你明天就可以开始。"}, {"start": 108.53, "end": 111.48, "text": "Mistake number seven, starting the day in full survival mode.", "zh": "第七个错误，以完全的生存模式开始新的一天。"}, {"start": 111.65, "end": 113.87, "text": "This is the master villain.", "zh": "这是最大的反派。"}, {"start": 114.05, "end": 125.74, "text": "The phone in your face, the coffee first thing in the morning on empty stomach, rushing, skipping the light, listening to the news, getting stuck in traffic, notifications buzzing the entire morning, the entire day.", "zh": "脸前的手机、空腹时早上第一件事就喝咖啡、匆匆忙忙、错过阳光、听新闻、堵在路上、整个早上、整天通知不停地响。"}, {"start": 125.88, "end": 128.32, "text": "Look, your body doesn't know you're just late for a meeting.", "zh": "你看，你的身体不知道你只是开会要迟到了。"}, {"start": 128.5, "end": 131.3, "text": "It reads all of these stressors as one thing, danger, run.", "zh": "它把所有这些压力源都解读为一件事：危险，快跑。"}, {"start": 131.46, "end": 136.92, "text": "So, it floods you with cortisol, and it keeps it high all day long.", "zh": "于是，它会让你体内充满皮质醇，而且让它一整天都保持高位。"}, {"start": 137.08, "end": 140.4, "text": "And chronically high levels of cortisol does something specific.", "zh": "而长期高水平的皮质醇会做一件特定的事。"}, {"start": 140.58, "end": 152.39, "text": "As I mentioned earlier, it tells your metabolism to store fat in one specific spot, around your organs, your heart, your kidneys, your liver, your pancreas, your precious vital organs, deep in your belly.", "zh": "就像我前面提到的，它告诉你的新陈代谢把脂肪储存在一个特定的地方，围绕着你的器官、心脏、肾脏、肝脏、胰腺、你珍贵的重要器官，深藏在你的肚子里。"}, {"start": 152.56, "end": 154.81, "text": "This is called visceral fat.", "zh": "这叫内脏脂肪。"}, {"start": 154.97, "end": 165.39, "text": "It's like a parasite inside of your belly, and it's the most dangerous type of fat linked to inflammation, cancer, heart disease, and other scary metabolic syndrome diseases out there.", "zh": "它就像你肚子里的一只寄生虫，是最危险的一种脂肪，与炎症、癌症、心脏病以及其他可怕的代谢综合征疾病有关。"}, {"start": 165.57, "end": 170.89, "text": "Look, survival mode is not the same thing as fat burning mode.", "zh": "你看，生存模式跟燃脂模式不是一回事。"}, {"start": 171.06, "end": 174.55, "text": "Your body will never let go of fat when it thinks you're being chased.", "zh": "当你的身体觉得自己正在被人追赶时，它永远不会放手脂肪。"}, {"start": 174.72, "end": 178.69, "text": "It just won't, because the number one priority for the human body is survival.", "zh": "它就是不会，因为人体的头号优先事项就是生存。"}, {"start": 178.84, "end": 182.78, "text": "So, why would it want you to burn fat when it thinks it needs to survive.", "zh": "那么，既然它觉得自己需要生存，它为什么还想燃烧脂肪呢？"}, {"start": 182.95, "end": 190.24, "text": "So, if your whole morning is one huge stress signal stacked after another, you're telling your body to hold on to every pound of fat.", "zh": "所以，如果你整个早上就是一个接一个巨大的压力信号，你就是在告诉你的身体留住每一磅脂肪。"}, {"start": 190.44, "end": 193.72, "text": "And then we blame ourselves for not having enough discipline.", "zh": "然后我们又责怪自己没有足够的自律。"}, {"start": 193.86, "end": 195.08, "text": "Well, it was never about the willpower.", "zh": "嗯，这从来都不是意志力的问题。"}, {"start": 195.23, "end": 197.69, "text": "It was never about the discipline.", "zh": "也从来都不是自律的问题。"}, {"start": 197.84, "end": 198.35, "text": "Now, stop and notice something.", "zh": "现在，停下来注意一件事。"}, {"start": 198.52, "end": 203.65, "text": "As we go back through all seven of these mistakes, not one of them was about overeating.", "zh": "当我们回顾所有这七个错误时，其中没有一个是关于吃得过多。"}, {"start": 203.83, "end": 206.21, "text": "Not one was about junk food.", "zh": "没有一个是关于垃圾食品。"}, {"start": 206.39, "end": 206.89, "text": "Not one was even about exercise.", "zh": "甚至没有一个是关于运动。"}, {"start": 206.89, "end": 212.65, "text": "All of them happened before breakfast, before calories, before the day even really got started.", "zh": "它们都发生在早餐之前、卡路里之前，甚至在一天真正开始之前。"}, {"start": 212.83, "end": 214.41, "text": "So, understand that your metabolism is not broken.", "zh": "所以，要明白，你的新陈代谢没有坏。"}, {"start": 214.59, "end": 217.2, "text": "Your body is not betraying you.", "zh": "你的身体没有背叛你。"}, {"start": 217.37, "end": 218.77, "text": "It's doing exactly what it's designed to do.", "zh": "它正在完全按照它的设计来做。"}, {"start": 218.93, "end": 224.53, "text": "It's responding to the signals you're handing it every single morning.", "zh": "它正在回应你每天早上交给它的信号。"}, {"start": 224.53, "end": 229.33, "text": "Which means the moment you change the signals, the body changes its answer.", "zh": "这意味着，一旦你改变信号，身体就会改变它的答案。"}, {"start": 229.33, "end": 230.47, "text": "So, you're not fighting your biology.", "zh": "所以，你不是在对抗你的生物学。"}, {"start": 230.63, "end": 236.29, "text": "You've been accidentally voting against yourself before 9:00 a.m. So, let's flip every vote here.", "zh": "你在早上 9 点之前一直在不知不觉地投票反对自己。所以，让我们把每一票都翻过来。"}, {"start": 236.47, "end": 236.97, "text": "Here's the exact routine.", "zh": "这是确切的流程。"}, {"start": 236.97, "end": 240.37, "text": "Seven steps, one for each of the mistakes I've outlined.", "zh": "七个步骤，对应我讲过的每一个错误。"}, {"start": 240.56, "end": 246.32, "text": "You can do this whole thing within the first hour of your day.", "zh": "你可以在一天的第一个小时内完成这一整套。"}, {"start": 246.51, "end": 248.48, "text": "Step one, no phone for at least the first 30 minutes.", "zh": "第一步，至少在起床后的前 30 分钟内不看手机。"}, {"start": 248.69, "end": 253.68, "text": "Let that natural cortisol rise do its job without you dumping extra stress on top of it.", "zh": "让那种自然的皮质醇上升发挥它的作用，而不要在上面再倾倒额外的压力。"}, {"start": 253.84, "end": 257.79, "text": "Your nervous system gets to wake up calm instead of concerned.", "zh": "你的神经系统可以平静地醒来，而不是提心吊胆地醒来。"}, {"start": 257.99, "end": 259.44, "text": "Just 30 minutes.", "zh": "就 30 分钟。"}, {"start": 259.64, "end": 260.45, "text": "Look, your inbox will survive, I promise.", "zh": "你看，你的收件箱会活下来的，我保证。"}, {"start": 260.65, "end": 262.88, "text": "Step two, water with minerals before anything else.", "zh": "第二步，在其他任何东西之前先喝加了矿物质的水。"}, {"start": 263.11, "end": 266.51, "text": "Hydrate before you caffeinate.", "zh": "先补水，再摄入咖啡因。"}, {"start": 266.74, "end": 268.79, "text": "Rehydrate the system before you stimulate it.", "zh": "在刺激系统之前先给系统补水。"}, {"start": 268.98, "end": 275.42, "text": "A big glass of water, a pinch of high-quality salt, mineral mix, or unflavored electrolytes.", "zh": "一大杯水，加一小撮优质盐、矿物质混合物或无味电解质。"}, {"start": 275.62, "end": 279.67, "text": "This alone kills a surprising amount of the hunger you feel mid-morning.", "zh": "光是这一项就能消除你上午感觉到的很多饥饿感。"}, {"start": 279.86, "end": 285.55, "text": "Step three, sunlight in your eyes within the first 30 minutes after waking up.", "zh": "第三步，在醒来后的前 30 分钟内让阳光照进你的眼睛。"}, {"start": 285.78, "end": 288.33, "text": "Step outside, no sunglasses, 10 to 30 minutes.", "zh": "走到户外，不戴墨镜，10 到 30 分钟。"}, {"start": 288.48, "end": 292.85, "text": "Even if it's overcast outside, you're going to benefit here.", "zh": "即使外面是阴天，你也会从中受益。"}, {"start": 292.99, "end": 297.95, "text": "See, you're setting the clock that controls your insulin sensitivity, your energy, and your sleep tonight.", "zh": "你看，你正在设定那个控制你的胰岛素敏感性、精力和今晚睡眠的时钟。"}, {"start": 298.13, "end": 302.19, "text": "And it's free, and it's ridiculously powerful.", "zh": "而且它是免费的，而且强大得离谱。"}, {"start": 302.37, "end": 302.87, "text": "Step four, a 10-to-15-minute walk.", "zh": "第四步，散步 10 到 15 分钟。"}, {"start": 302.99, "end": 306.87, "text": "Might as well get your body moving while you're getting that light.", "zh": "不妨在获得光照的同时也让身体动起来。"}, {"start": 307.02, "end": 309.6, "text": "So, you're stacking two wins at once.", "zh": "这样你就是一次收获两个胜利。"}, {"start": 309.74, "end": 316.74, "text": "And if you go for that walk after you eat your first meal of the day, you're pulling glucose out of the blood through that insulin-free side door that we spoke about earlier.", "zh": "而且如果你是在吃了当天第一餐之后去散步，你就是通过我们前面讲过的那个不需要胰岛素的侧门，把葡萄糖从血液中拉出来。"}, {"start": 316.93, "end": 319.72, "text": "Step five, delay the caffeine.", "zh": "第五步，推迟咖啡因。"}, {"start": 319.92, "end": 321.72, "text": "Wait 90 minutes to have your cup of coffee.", "zh": "等 90 分钟再喝你的那杯咖啡。"}, {"start": 321.86, "end": 325.94, "text": "Get your water, your minerals, get your light and movement.", "zh": "先喝水、补充矿物质、获得光照和运动。"}, {"start": 325.94, "end": 331.16, "text": "Then when you have your coffee an hour and a half after you wake up, that coffee is going to have a bigger bang for its buck.", "zh": "然后当你在醒来一个半小时后喝咖啡时，那杯咖啡会发挥更大的作用。"}, {"start": 331.31, "end": 340.71, "text": "It's going to give you more energy and sustainable energy throughout the rest of the day because at that point cortisol begins to taper down and that's where your body will maximize the caffeine benefits.", "zh": "它会给你更多的能量，而且是全天持续的能量，因为到了那个时候皮质醇开始逐渐下降，而那正是你的身体会最大化咖啡因益处的时候。"}, {"start": 340.88, "end": 348.85, "text": "Step six, when you have your first meal, whether it's breakfast or maybe you practice fasting, so maybe it's lunch.", "zh": "第六步，当你吃第一餐时，不管是早餐，还是你可能实行断食，所以也许是午餐。"}, {"start": 348.85, "end": 350.96, "text": "But either way, make sure it's protein first.", "zh": "但不管怎样，一定要确保蛋白质优先。"}, {"start": 351.15, "end": 351.86, "text": "Build that first meal around protein.", "zh": "把第一餐围绕蛋白质来安排。"}, {"start": 352.03, "end": 358.12, "text": "Eggs with the yolk and half an avocado or a high-quality protein shake.", "zh": "带蛋黄的鸡蛋加半个牛油果，或者一杯优质蛋白奶昔。"}, {"start": 358.12, "end": 358.48, "text": "Whatever fits your life.", "zh": "不管什么适合你的生活。"}, {"start": 358.64, "end": 365.2, "text": "When you do this, you're blunting the blood sugar roller coaster and quietly shutting down the craving signals in your brain for hours.", "zh": "当你这样做的时候，你就是在缓和血糖过山车，并且悄悄地关闭大脑里持续数小时的渴望信号。"}, {"start": 365.39, "end": 371.48, "text": "Aim to get at least 30 g of protein at that first meal of the day.", "zh": "目标是在当天的第一餐中至少摄入 30 克蛋白质。"}, {"start": 371.48, "end": 376.81, "text": "When you do that, this is the difference between chasing food all day long and forgetting you were even hungry.", "zh": "当你这样做的时候，这就是一整天都在追着食物跑和甚至忘了自己曾经饿过之间的区别。"}, {"start": 376.99, "end": 380.2, "text": "Step seven, build a calm nervous system before you start work.", "zh": "第七步，在开始工作之前建立一个平静的神经系统。"}, {"start": 380.38, "end": 383.61, "text": "A few slow breaths through your nose, a minute of quietness.", "zh": "几次缓慢地用鼻子呼吸，一分钟的安静。"}, {"start": 383.79, "end": 393.53, "text": "Whatever gets you out of survival mode before the day grabs you because remember, survival mode and fat burning mode cannot coexist together.", "zh": "不管什么能让你在一天抓住你之前脱离生存模式，因为请记住，生存模式和燃脂模式不能共存。"}, {"start": 393.53, "end": 396.92, "text": "For every step here, you're answering one question for your body.", "zh": "对于这里的每一步，你都是在为你的身体回答一个问题。"}, {"start": 397.08, "end": 397.58, "text": "Are we safe or are we burning?", "zh": "我们是安全的，还是在燃烧？"}, {"start": 397.76, "end": 402.55, "text": "When the answer is yes, fat loss stops being a fight.", "zh": "当答案是肯定的时候，减脂就不再是一场斗争。"}, {"start": 402.73, "end": 403.78, "text": "Now here's something most people never hear.", "zh": "现在这里有一些大多数人从来没有听过的事情。"}, {"start": 403.92, "end": 405.92, "text": "Let's say you actually do everything we talked about today.", "zh": "假设你真的做了我们今天讲的所有事情。"}, {"start": 406.07, "end": 408.99, "text": "You stop checking your phone first thing.", "zh": "你不再一醒来就看手机。"}, {"start": 409.13, "end": 412.45, "text": "You get your sunlight, you hydrate, you walk, you delay caffeine.", "zh": "你获得了阳光、补水、散步、推迟了咖啡因。"}, {"start": 412.61, "end": 413.11, "text": "You start eating protein.", "zh": "你开始吃蛋白质。"}, {"start": 413.11, "end": 413.27, "text": "Fantastic.", "zh": "太棒了。"}, {"start": 413.44, "end": 417.7, "text": "You're finally sending your body the right signals.", "zh": "你终于在给身体发送正确的信号。"}, {"start": 417.87, "end": 421.5, "text": "But there is another piece to the puzzle here because the signals are about half of the equation.", "zh": "但是这里还有拼图的另一块，因为信号大约只占等式的一半。"}, {"start": 421.67, "end": 425.52, "text": "The other half is giving your body the right fuel to respond to those signals.", "zh": "另一半是给你的身体正确的燃料，让它对这些信号做出回应。"}, {"start": 425.67, "end": 429.72, "text": "And after age 30, that's where most people start running into trouble.", "zh": "而在 30 岁之后，大多数人就是从这里开始遇到麻烦的。"}, {"start": 429.9, "end": 437.95, "text": "You see, your body's natural creatine production gradually declines as you age, which means the exact things we're trying to improve in this lesson.", "zh": "你看，你身体天然的肌酸产量会随着年龄增长而逐渐下降，这意味着我们在这节课中试图改善的那些东西。"}, {"start": 438.15, "end": 446.79, "text": "Energy, metabolic health, muscle maintenance, recovery, brain performance, and healthy aging all become harder to support when creatine reserves drop.", "zh": "能量、代谢健康、肌肉维持、恢复、大脑表现和健康老龄化，当肌酸储备下降时，所有这些都变得更难维持。"}, {"start": 446.95, "end": 450.2, "text": "It's not because your metabolism is broken.", "zh": "这不是因为你的新陈代谢坏了。"}, {"start": 450.35, "end": 453.32, "text": "It's not because aging automatically means decline.", "zh": "也不是因为衰老就自动意味着衰退。"}, {"start": 453.52, "end": 458.9, "text": "It's simply because your body has less of this key compound it used to make more naturally when you were younger.", "zh": "只是因为你的身体拥有的这种关键化合物的量变少了，而它在你年轻的时候自然产生的量更多。"}, {"start": 459.07, "end": 464.81, "text": "So, that's the reason I personally take creatine every single day, but not just any creatine.", "zh": "所以，这就是我每天亲自服用肌酸的原因，但不是随便哪种肌酸。"}, {"start": 464.96, "end": 467.72, "text": "The one that I use is from MyoScience.", "zh": "我用的那一种来自 MyoScience。"}, {"start": 467.87, "end": 469.81, "text": "It's called their micronized creatine monohydrate.", "zh": "它叫他们的微粉化一水肌酸。"}, {"start": 469.98, "end": 473.99, "text": "And it's not because supplements replace the healthy habits we spoke about today.", "zh": "而且这不是因为补充剂能替代我们今天讲的健康习惯。"}, {"start": 474.12, "end": 474.88, "text": "Like, that's the most important thing.", "zh": "就像，这是最重要的事情。"}, {"start": 475.04, "end": 476.07, "text": "Do that first.", "zh": "先做那些。"}, {"start": 476.23, "end": 477.17, "text": "Because those morning habits create the signal.", "zh": "因为那些早晨习惯创造了信号。"}, {"start": 477.36, "end": 482.31, "text": "But creatine helps answer the signal more efficiently.", "zh": "但肌酸能帮助更有效地回应信号。"}, {"start": 482.5, "end": 492.62, "text": "See, the sunlight says, \"Create more energy.\" The walk says, \"Use glucose more efficiently.\" The protein says, \"Maintain and build muscle.\" And creatine helps support the cellular energy needed to make all of this happen.", "zh": "你看，阳光说：“创造更多能量。”散步说：“更有效地利用葡萄糖。”蛋白质说：“维持和增长肌肉。”而肌酸帮助支持实现这一切所需的细胞能量。"}, {"start": 492.8, "end": 497.32, "text": "That's why it's become a part of my morning routine.", "zh": "这就是为什么它成了我早晨流程的一部分。"}, {"start": 497.5, "end": 498.0, "text": "I simply take one scoop a day.", "zh": "我每天就是简单地服用一勺。"}, {"start": 498.0, "end": 498.31, "text": "This is 5 g.", "zh": "这是 5 克。"}, {"start": 498.46, "end": 501.69, "text": "I put it in my water with minerals or sometimes I put it in my coffee.", "zh": "我把它放进加了矿物质的水里，或者有时我把它放进咖啡里。"}, {"start": 501.83, "end": 504.39, "text": "Takes a few seconds and then I'm done.", "zh": "只需要几秒钟，然后我就完成了。"}, {"start": 504.52, "end": 505.15, "text": "That's it.", "zh": "就是这样。"}, {"start": 505.29, "end": 506.15, "text": "And the beautiful thing is this.", "zh": "而美妙的是这一点。"}, {"start": 506.34, "end": 511.41, "text": "One of the biggest predictors of staying lean as you age isn't how much cardio you do.", "zh": "随着年龄增长，保持苗条的最大预测因素之一不是你做了多少有氧运动。"}, {"start": 511.61, "end": 515.32, "text": "It's the muscle mass you have cuz muscle is your metabolic engine.", "zh": "而是你拥有的肌肉量，因为肌肉就是你的代谢引擎。"}, {"start": 515.47, "end": 517.76, "text": "It's where glucose gets stored.", "zh": "它是葡萄糖被储存的地方。"}, {"start": 517.91, "end": 518.79, "text": "It's where energy gets produced.", "zh": "它是能量被产生的地方。"}, {"start": 518.95, "end": 522.96, "text": "And it's one of the biggest defenses we have against age-related weight gain.", "zh": "而且它是我们对抗与年龄相关的体重增加的最大防御之一。"}, {"start": 523.13, "end": 529.2, "text": "Which is exactly why creatine is one of the most researched supplements in the entire world.", "zh": "而这正是肌酸成为全世界研究最多的补充剂之一的原因。"}, {"start": 529.41, "end": 531.77, "text": "There are over 6,000 published studies on creatine.", "zh": "关于肌酸已经发表了超过 6000 项研究。"}, {"start": 531.93, "end": 536.17, "text": "Now, I want to take the next 5 hours to go over every single study with you.", "zh": "现在，我想用接下来的 5 个小时跟你逐一讲完每一项研究。"}, {"start": 536.37, "end": 537.93, "text": "I'm just kidding.", "zh": "我只是开玩笑。"}, {"start": 538.12, "end": 543.78, "text": "But the studies show it helps benefit strength, recovery, healthy aging, brain function.", "zh": "但研究表明它有助于提高力量、恢复、健康老龄化、大脑功能。"}, {"start": 543.98, "end": 545.13, "text": "But not all creatine is created equal.", "zh": "但不是所有的肌酸都是一样的。"}, {"start": 545.3, "end": 553.37, "text": "About 90% of the creatine supplements out there comes from China and it's contaminated, chalked with fillers, and it doesn't get you the results we want here.", "zh": "市面上大约 90% 的肌酸补充剂来自中国，而且被污染、掺了填充物，并不能给你带来我们在这里想要的结果。"}, {"start": 553.5, "end": 561.52, "text": "If you want to use the exact creatine that I use and recommend to all my clients and students, then click the first link in the description box below.", "zh": "如果你想用我用的、并且推荐给我所有客户和学生的确切肌酸，那就点击下面描述框里的第一个链接。"}, {"start": 561.68, "end": 567.33, "text": "Or if you're watching on YouTube, grab your phone and scan the QR code on the screen.", "zh": "或者如果你是在 YouTube 上看，那就拿起你的手机，扫描屏幕上的二维码。"}, {"start": 567.58, "end": 572.72, "text": "MyoScience has given my community, you, an exclusive offer to get 20% off your creatine.", "zh": "MyoScience 给我的社区，也就是你，提供了一个独家优惠，可以享受肌酸 8 折。"}, {"start": 572.89, "end": 577.32, "text": "And honestly, I don't know how long they're going to keep this discount available.", "zh": "而且说实话，我不知道他们会把这个折扣保留多久。"}, {"start": 577.45, "end": 577.95, "text": "So, hopefully you see this in time.", "zh": "所以，希望你能及时看到。"}, {"start": 577.95, "end": 582.04, "text": "What I love about MyoScience and this creatine is that it comes from Germany.", "zh": "我喜欢 MyoScience 和这种肌酸的地方在于它来自德国。"}, {"start": 582.24, "end": 586.6, "text": "It's their premium German Creapure creatine.", "zh": "它是他们优质的德国 Creapure 肌酸。"}, {"start": 586.8, "end": 587.3, "text": "Say that about five times fast.", "zh": "把这句话快速说五遍试试。"}, {"start": 587.3, "end": 593.38, "text": "It's third-party tested, no contaminants, no fillers, no junk.", "zh": "它经过第三方检测，没有污染物，没有填充物，没有垃圾。"}, {"start": 593.59, "end": 599.82, "text": "And because this one is what's called micronized, it mixes easier, and it's more gentle on your digestive system.", "zh": "而且因为这一种是所谓的微粉化，它更容易溶解，而且对你的消化系统更温和。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
