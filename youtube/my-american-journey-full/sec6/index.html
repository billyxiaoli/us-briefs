<script>
const LINES=[{"start": 0.0, "end": 21.0, "text": "Looking at that sea, my heart was actually very unsettled, very unsettled, because we know very well that San Francisco, on the other side of San Francisco, is China, is Shanghai, actually Shanghai and San Francisco are very close in latitude, that is to say, on the other side of that sea, my parents are there.", "zh": "这个看过去，那个一看到大海，我心里其实是很不平静的，很不平静的，因为我们很清楚，就是旧金山，旧金山那一面就是中国，就是上海，其实上海和旧金山的纬度很接近吗，也就是说，在那个海的另外一边，就是我的父母亲在那边。"}, {"start": 21.0, "end": 27.0, "text": "On the first day I arrived there, seeing that sea, my mood began to become very unsettled.", "zh": "第一天到了那的时候，看到那个海，我的心情就开始很不平静了。"}, {"start": 27.0, "end": 41.0, "text": "At that time, that post office should have been around 34th Street, 34th Street, and the seaside was around 48th Street, a total of about ten-odd blocks apart, but anyway I had nothing to do, and it was downhill, so I walked along this road, always walking downhill.", "zh": "那时候，那个邮局应该是在三十四街左右，三十四街，而海边大概在四十八街，一共离开大概十几个街口，但是反正我没有什么事，而且是下坡，我就沿着这条路，一直朝下走。"}, {"start": 41.0, "end": 61.0, "text": "And before I walked, I did another thing. What was it? I found something, just outside the post office, next to it, there was a free map of San Francisco, a free map, actually later I learned it was the San Francisco transit map, the San Francisco bus map, free, and I took one, a free map.", "zh": "而且走之前，我做了另外一件事，什么呢，我发现了一样东西，就在邮局的外面的一个旁边，有一张旧金山的免费地图，不需要买的，是免费地图，其实在后来我就知道，是这个旧金山交通图，就是旧金山的公共汽车的一个地图来的，免费的，我就拿了一张免费地图。"}, {"start": 61.0, "end": 70.0, "text": "Then, according to the big characters and the direction, I began to know roughly where I was, and I knew very clearly that going down this way was the Pacific Ocean.", "zh": "然后又根据大字和方位，我开始知道我大概是什么地方，而且我很清楚，就这个下去，这个就是太平洋了。"}, {"start": 70.0, "end": 79.0, "text": "Finally, I came from Shanghai, I had seen the Huangpu River, and I had taken a night cruise on the Huangpu River, but I had never really been to the seaside.", "zh": "最后，我来自上海，我见过黄浦江，我也做过黄浦江的夜游的游轮，但是我从来没有真正的到过海边。"}, {"start": 79.0, "end": 93.0, "text": "At that time, the farthest I had gone was taking a ferry on the Huangpu River, all the way to the mouth of the Yangtze River, going around in a circle and coming back. That was the farthest I had gone. I had never seen the seaside or a beach.", "zh": "那时候最远的就是黄浦江一个渡轮，一直开到长江出海口，绕个圈回来，这是我走的最远的，海边、海滩从来没见过。"}, {"start": 93.0, "end": 109.0, "text": "In Shanghai in the 1980s, by the Huangpu River, it was basically impossible for you to stand there. You went to the Bund, on the Bund there was nothing, the Bund, all sorts of things, at that time the Huangpu River was black, it was impossible to go down and walk there.", "zh": "上海八几年的时候，黄浦江那个旁边，根本就不可能让你立足，你出外滩，外滩上面没有啥的，就是外滩，那时候黄浦江是黑的，这不可能下去让你什么走的。"}, {"start": 109.0, "end": 116.0, "text": "So I kept walking toward the sea, walking, walking, walking, and I did not know how long I walked.", "zh": "所以我一直朝大海走啊，走啊，走啊，走，我也不知道走了多久。"}, {"start": 116.0, "end": 131.0, "text": "At that time, people were still a bit bolder, after all, it was the first time I had communicated with some people in San Francisco, and I felt a little more relaxed, and I dared to raise my head, looking at the sea, walking all the way down, all the way to the seaside.", "zh": "那时候人还胆子大一点，毕竟第一次和旧金山的一些人交流过了，我感觉略微放松了一点，我敢抬着头，看着海，一路走下去，一直走到海边。"}, {"start": 131.0, "end": 150.0, "text": "At the San Francisco seaside, the wind was very, very strong. At that time my clothes were not very thick, and I felt a bit cold, but standing at that seaside, walking in the sand, walking in the sandy ground, watching the waves of the sea surging up, looking at the other side of the sea, I was absolutely lost.", "zh": "旧金山的海边，风很大很大，我那时候衣服穿得并不是很厚，我觉得有点冷，但是站在那个海边，走在那个沙里面，走在沙地里面，看着那个大海的波浪涌上来，看着海的另外一边，我是绝对迷茫的。"}, {"start": 150.0, "end": 157.0, "text": "Because I did not know what would happen in the future, and I did not know how my future path should go. I was at a loss.", "zh": "因为我不知道以后会发生一件什么样的事情，我也不清楚，我以后的路是该怎么样走，我不知所措的。"}, {"start": 157.0, "end": 164.0, "text": "After all, in Shanghai I was a university student, a university student, but in America, I really knew nothing at all.", "zh": "再怎么样说，我在上海也是个大学生，一个大学生，在美国，我根本就什么都不知道。"}, {"start": 164.0, "end": 180.0, "text": "Should I go to study, or find a job? What kind of job should I look for? What kind of work could I do? I really knew nothing at all. How should I look for a job? Who should I look for? I did not know how to do it either. I did not know, and my university did not tell me either.", "zh": "我去读书还找工作，找什么样的工作，我能做什么样的工作，我真的什么都不知道，找工作该怎么找，找谁去，我也不知道我怎么做，我也不知道，我大学也没和我说。"}, {"start": 180.0, "end": 189.0, "text": "Around me at that time, there was only the money my family in Shanghai and my younger aunt in Hong Kong had put together, about 1,000 US dollars.", "zh": "身边那时候只有我上海和我香港的小姑妈凑在一起，大概1000美元。"}, {"start": 189.0, "end": 197.0, "text": "1,000 US dollars, I did not know how long I could last on 1,000 US dollars. What would happen after I used up the 1,000 US dollars?", "zh": "1000美元，我不知道这1000美元我能撑多久，1000美元用完之后，我会怎么样。"}, {"start": 197.0, "end": 218.0, "text": "In 1989, America did not recognize any Chinese medical university at all. At that time, now it does recognize them, and you have to know, at that time I had not graduated from university, so I had no diploma, so at that time it was basically impossible. Later I will slowly tell you about my diploma problem.", "zh": "在美国，在1989年的时候，是不承认中国任何一所医科大学的，那时候，现在承认，而且你要知道，那时候我大学没有毕业，所以我没有文凭的，所以那时候根本就这个，以后我会慢慢和你说我的文凭的问题。"}, {"start": 218.0, "end": 226.0, "text": "At that seaside, I did not know how long I stood, how long I walked, how long I stood, really I did not know.", "zh": "在那海边，我也不知道站了多久，走了多久，站了多久，真的我不知道。"}, {"start": 226.0, "end": 229.0, "text": "Then I started to turn around and walk back to my eldest uncle's home.", "zh": "然后我就开始转身，走回我大舅家。"}, {"start": 229.0, "end": 245.0, "text": "On the way back to my eldest uncle's home, I encountered something else. Today I have already talked for more than an hour, so I will not talk today. Next time, I will tell you what I encountered after I came back from the seaside, what interesting thing I encountered, or what kind of experience I had.", "zh": "走回我大舅家的路上，我又遇到了一样东西，今天已经讲了一个多小时了，今天不讲了，下一次，那我再讲讲我从海边回来之后，我碰到了什么，碰到了什么样一个有趣的事情，或者碰到了怎么样的一个经历。"}, {"start": 245.0, "end": 271.0, "text": "Then, after returning to my eldest uncle's home, what happened in my eldest uncle's home, at the beginning, in the first year in America, I will talk about it in very, very fine detail, just like this, basically one day, or one month, one process, and later, of course, for my whole situation, because I cannot finish telling it today, even if I talked for 24 hours, I cannot finish it.", "zh": "然后回到我大舅家之后，我又在我大舅家里面，又怎么样的一个情况，刚开始的呢，就是在美国的第一年的东西，我讲的非常非常细，就像这样子，基本上一天或者一个月，一个过程，那么以后来，当然是为了我整个呢，整个这个情况，因为我怎么讲不完，今天哪怕我在24小时，我都讲不完。"}, {"start": 271.0, "end": 288.0, "text": "1,000 US dollars in Shanghai at that time was really a huge sum of money. If it were not for my younger aunt in Hong Kong helping me a little, my parents could not come up with this money. They, putting it together, at most had about 500 US dollars, at most, at most, really that much.", "zh": "都讲不完，1000美元在上海那时候真的是巨款，如果不是我香港的小姑妈帮我一点，我父母亲拿不出这个钱了，他们离凑在一起的话，大概最多这500美元，最多最多，这都真的那么多。"}, {"start": 288.0, "end": 296.0, "text": "So next time, I do not know when I will have time, I may do another livestream next Tuesday or Wednesday, to tell you about this beginning experience.", "zh": "那么下一次吧，我也不知道什么时候有空，我可能下个星期二或者星期三再直播一次，就把这个刚开始的一个经历给大家讲讲。"}, {"start": 296.0, "end": 309.0, "text": "If you think it is interesting, then come back and listen. If you think what I am saying is just an old man nagging here, then you do not need to, because I am not relying on this, not relying on this for anything, I just want to share it with you.", "zh": "如果大家觉得有趣的话呢，那么就回来听，如果大家觉得我说的那种东西，就是一个老头子在这里唠叨的话呢，那么就说就不用了，因为反正我也不是靠这个，不是靠这个怎么样的，我只是想和大家分享一下。"}, {"start": 309.0, "end": 315.0, "text": "Because I think some things later on are worth considering, because everyone's life has a certain course, a certain journey.", "zh": "因为我觉得后面有些东西呢，有些东西呢，就是值得大家考虑一下，因为每个人的人生都有一定的播种，有一定的历程。"}, {"start": 315.0, "end": 328.0, "text": "Just like someone just said, if you graduate and cannot find a job, what will happen? I will tell everyone one saying, which is: where there is a will, there is a way, Heaven never seals off all exits.", "zh": "就像刚才有一位就说，如果毕业找不到工作会怎么样，我告诉大家一句话，就叫天无绝人之路，天无绝人之路。"}, {"start": 328.0, "end": 338.0, "text": "In my first ten years in America, I encountered despair many times, many times despair, and in that despair, I walked step by step to where I am now.", "zh": "我在美国的前面10年当中，我遇到过很多次绝望，很多次绝望，在这个绝望当中，我一步一步地走到了现在。"}, {"start": 338.0, "end": 343.0, "text": "Of course, I cannot say I am doing very well now, but I can only say I am very stable now.", "zh": "当然，我现在不能说自己很好，但是我现在只能说，我是很稳定。"}, {"start": 343.0, "end": 351.0, "text": "But what is the cost of this stability? Why did I choose my current profession? I will slowly start telling you about that.", "zh": "但是这个稳定的代价是什么，我为什么选择了我现在这个职业，这个我要和大家慢慢地开始讲。"}, {"start": 351.0, "end": 362.0, "text": "If you think there is anything in what I say that you can consider, because I think that in any era, in any era, in any situation, there will always be many people who will have great difficulties.", "zh": "如果觉得我说的东西里面，有什么东西，大家都可以考虑一下，因为我觉得呢，就是在任何一个时代，任何一个时代，在任何一个情况之下，总会有很多人会有很大的困难的。"}, {"start": 362.0, "end": 374.0, "text": "Like my situation, actually in the 1980s, when we had ration coupons in China, when China had rationed supply, you should also know many people were either in despair or very numb, numb.", "zh": "像我那个在，其实像一九八几年的时候，当我们凭票供应东西的时候，在中国凭票供应的时候，你应该也知道，很多人也是，不是绝望了，就是很麻木的，麻木的。"}, {"start": 374.0, "end": 389.0, "text": "Most importantly, what I want to say to today's graduates is this: going to university does not necessarily mean that when you come out, you must do exactly the same work, that is, whatever you studied, you must do work in that field. Open up your thinking a little.", "zh": "最主要的，我对于现在的毕业生就说，读大学，你并不一定要就是出来，一定要做你完全一模一样的工作，就是你读什么，一定要做这方面工作，要把自己的思路敞开一点。"}, {"start": 389.0, "end": 402.0, "text": "University only teaches you some basic skills, learning skills, and for many things, a skill of understanding. After you come out, what kind of work should you do? Broaden your thinking a little. That is the first point.", "zh": "大学只是教你们一些基本的技能，学习的技能，对于很多东西，一个理解的技能，走出来之后，该怎么样的工作，把思路放宽一点，这是第一个。"}, {"start": 402.0, "end": 410.0, "text": "Second, do not care about face. Face is the least valuable thing. The least valuable thing in this world is face.", "zh": "第二个，就不要讲面子，面子最不值钱了，这个世界上最不值钱的就是面子。"}, {"start": 410.0, "end": 421.0, "text": "Of course, this is easier for me to say, because in America, there are no aunts and gossips behind your back, gossiping. That is a good thing. I can go whichever way I want, that is a good thing.", "zh": "当然，这个我说些比较容易，因为在美国，美国没有三姑六婆在背后说三道四，这是个好事，我想怎么走就怎么走，这是个好事。"}, {"start": 421.0, "end": 427.0, "text": "But, that is to say, do not live for other people's eyes, live for yourself.", "zh": "但是就是说，不要就是为了别人的眼光而活着，为自己而活着。"}, {"start": 427.0, "end": 437.0, "text": "You say you want to smuggle yourself into America, I dare not say this is something illegal, but I have indeed met many people like that, who came here and worked in restaurants or something. I have seen many.", "zh": "你说要偷渡到美国，这个我不敢说是违反的东西，但是我确实遇到过很多就这种来的人，跑到这里来，在餐馆里面工作，或者怎么样的，我见过，我见过很多。"}, {"start": 437.0, "end": 445.0, "text": "Actually, wherever you go, anywhere, actually for us, for me, as long as you can settle down peacefully, that is a good place.", "zh": "其实你到任何地方，任何地方，其实对于我们，对于我来说的话，只要能安静下来，就是一个好地方。"}, {"start": 445.0, "end": 450.0, "text": "Many times it may not be for yourself, it may be for the next generation, for the next generation.", "zh": "很多时候也许不是为了自己，也许为了后面的下一代，又要下一代。"}, {"start": 450.0, "end": 460.0, "text": "So for some confused young people, I would say, you will one day find your own path. Everyone's path is different. Do not be discouraged.", "zh": "所以我对一些迷茫的年轻人来说的话，你总有一天会找到自己的路，每一个的路都不一样，不要沮丧。"}, {"start": 460.0, "end": 466.0, "text": "Now the general environment is indeed difficult, but that does not mean there is completely no way out. That is one thing.", "zh": "现在大环境确实有困难，但是也并不是说完全没有出路，就这么一件事情。"}, {"start": 466.0, "end": 477.0, "text": "Try to open up your thinking a little, and see what is relatively suitable and relatively close to your major, but which you also like, and you can take another path. Especially since you are still young.", "zh": "尽量就是把自己的思路打开一下，看一看有哪些和你的专业比较合适、比较接近的，但是你又比较喜欢的，可以走另外一条路，特别你们还年轻。"}, {"start": 477.0, "end": 488.0, "text": "Remember, if you want to go abroad, China, of course, still has a bit of, oh, when you reach a certain age, how about it, but in America there is no age problem, no age problem. I will talk about that later.", "zh": "记住，如果说你要出国的话，中国当然还是有一点，就是哎呀，到了一定年龄怎么样怎么样的，在美国没有年龄的问题，年龄问题，这个以后我会说。"}, {"start": 488.0, "end": 496.0, "text": "If you are confused, and your major is not good enough, then can you take further courses? Can you consider doing some other things, other things?", "zh": "你迷茫，你专业不够好，那么是不是可以进修课，是不是可以考虑一下，做一些其他的东西，其他的东西。"}, {"start": 496.0, "end": 511.0, "text": "Let me say one more thing: Heaven never seals off all exits. When I have told you all of my first ten years of experience, just the beginning ten years of experience, you will find how many dead ends were in front of me, and walking on, they opened up.", "zh": "再说一句话，天无绝人之路，等我把我所有的十年的经历，就刚刚开始十年经历，你就和你们说完，你就会发现，有多少在我面前的绝路，走下去就走通了。"}, {"start": 511.0, "end": 519.0, "text": "Walking on, sometimes it is an open field. When I felt the road ahead was a cliff, I just turned a small corner, and the road ahead opened up.", "zh": "走下去，有些时候就是一个开阔地，当我觉得前面这是悬崖峭壁的时候，我只是转了一个小弯，前面的路就开阔了。"}, {"start": 519.0, "end": 537.0, "text": "Now, now, I tell you, when you are at your most confused, at your most, most confused time, you feel everything ahead is blocking the way, but really walk past it, and when you look back, like I now look back at those ten years, I just smile, I came through.", "zh": "你现在，现在，啊，我现在我告诉你，你现在最迷茫的时候，最最迷茫的时候，你觉得前面都是挡路的，真的走过去，你在回头看的话，像我现在我回头看刚才十年的话，我只是笑笑，我过来了。"}, {"start": 537.0, "end": 542.0, "text": "I dare not say I succeeded, but I came through. That is the idea.", "zh": "我不敢说自己成功了，但是我过来了，就这么一个概念。"}, {"start": 542.0, "end": 554.0, "text": "All right, then today we will stop here. We have talked for an hour and fifteen minutes. Next time there will be a preview. I estimate it will be next Wednesday, next Wednesday I will have time, at the same time, I will chat with you again.", "zh": "好了，那么今天就讲到这里，也讲一个小时15分钟时间了，那么我下次会有预告，我估计是下星期三，下星期三我有空，同一个时间，我再和大家聊聊。"}, {"start": 554.0, "end": 566.0, "text": "If you think what I said is good, then everyone, please come back, and you can even bring questions. If, from what I said earlier, you do not understand what I am saying, bring your questions, and I am willing to communicate with everyone.", "zh": "如果大家觉得我说的东西好的话，那么大家叫回来啊，甚至可以带着问题，如果拿前面我说的那些东西，我不明白你在说什么，带的问题，我愿意和大家交流。"}, {"start": 566.0, "end": 581.0, "text": "Do you want to communicate? As long as a person is alive, there cannot be a dead end. I have always said this. As long as you are alive, there will be no dead end. I have always thought like this, and I have walked to where I am now with this mindset.", "zh": "要不要交流，人只要活着，就不可能有绝路，我一直这样说，只要活着，不会绝，我就一直这样想的，我就靠这个心情走到现在的。"}, {"start": 581.0, "end": 582.24, "text": "All right, goodbye, everyone.", "zh": "好，和大家再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
