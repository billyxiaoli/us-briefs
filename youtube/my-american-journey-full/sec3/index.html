<script>
const LINES=[{"start": 0.0, "end": 6.4, "text": "I found they did not even have a kettle, a kettle for boiling water, I did not know how to boil water.", "zh": "我发现他们连那个水壶都没有，烧开水的那个水壶都没有，我都不知道该怎么烧水。"}, {"start": 6.4, "end": 8.4, "text": "So I just sat there, stuck.", "zh": "我就在那边，愣住了。"}, {"start": 8.96, "end": 29.12, "text": "And my eldest uncle probably never thought about this problem, because he had only returned to Shanghai twice, and each time he was surrounded by people and stayed in a hotel, so he had no idea that our living situation was like that. He did not understand, so he never taught me.", "zh": "而我大舅可能从来没想过这个问题，因为他后期回上海的只有两次，被人这样簇拥着，而且住在宾馆里面，他根本就不知道我们的生活情况是这么样的一种情况，他不清楚，所以他也没教过我。"}, {"start": 29.12, "end": 39.44, "text": "Then, opening the freezer compartment above, it was full of boxes, box after box of things, and I did not know how those boxes were supposed to be used. Should they be taken out and cooked in a pot, or eaten cold just like that?", "zh": "然后，打开上面那个速冻箱里面，都是一个一个盒子的东西，一盒的东西我也不知道这盒东西应该怎么样用，是拿出来在锅里煮呢，还是就这样吃冷的。"}, {"start": 39.44, "end": 44.32, "text": "To be honest, at that time in Shanghai, people said Americans eat cold food, they never eat hot food. I was not sure.", "zh": "确实在上海那时候，老实说，美国人都吃冷的，他从来不吃热的，我也不清楚。"}, {"start": 44.32, "end": 55.44, "text": "So I just sat there, unpacked my luggage, made my quilt, hungry as I was, but I did not know what to do. I had absolutely no concept of it.", "zh": "所以我就在那边坐着，坐着就把那个行李打开，把被子铺好，肚子饿是饿，但是我也不知道该怎么办，一点没有这个概念。"}, {"start": 55.44, "end": 65.04, "text": "Then, roughly, I arrived in San Francisco and got to my uncle's home at around one o'clock in the afternoon, a little after noon, around one o'clock, and by around three o'clock, my eldest uncle's three sons came home.", "zh": "然后大概，我到了旧金山，然后到我大舅家的话，应该中午多一点点，应该是下午一点钟左右，然后到三点多的时候，我的大舅三个儿子回家了。"}, {"start": 65.04, "end": 74.72, "text": "The eldest and second sons, because they were born in Hong Kong, could speak Cantonese, they understood Shanghainese, but their Mandarin was no good, so I could only say hi to them.", "zh": "三个孩子回家了，这个大儿子、二儿子呢，因为他在香港出生的，会说广东话，上海话他听得懂，普通话不行，所以我跟他说只能说嗨。"}, {"start": 74.72, "end": 78.16, "text": "At that time I learned something: I watched what they were doing.", "zh": "那当时我就学了一样事情，就是我看他们在干什么。"}, {"start": 78.16, "end": 93.44, "text": "In 1989, many families in Chinese cities had fridges. I say I had seen a fridge, indeed many families had fridges at that time, but our family did not, because my parents were primary school teachers and could not afford one.", "zh": "89年，在城市里面，中国很多家庭有冰箱，我说我冰箱我见过，确实那时候好多家庭有冰箱，我们家没有，因为我父母亲是小学老师，买不起，没有。"}, {"start": 93.44, "end": 102.88, "text": "But the main use of a fridge in China at that time was to put leftover food in after dinner at night, or in summer to chill some watermelon. That was its main use.", "zh": "但是中国那时候的冰箱，最主要是晚上吃完饭剩菜放冰箱里面，或者说夏天冷一些，放一些西瓜，最主要这个作用。"}, {"start": 102.88, "end": 116.96, "text": "It was not like in America, where the fridge is stuffed full of a week's worth of food, at least several days' worth of food. That was different from Shanghai, because in Shanghai you bought vegetables at the market, and in 1989 it was all markets, you went out every day to buy that day's vegetables.", "zh": "而不是像美国，美国他里面冰箱里面塞满东西，要塞一个星期吃的的东西，最起码几天吃的的东西，和上海不一样，因为上海买菜，你有菜市场，89年的时候都是菜市场，你跑出去每天买，当天买菜的。"}, {"start": 116.96, "end": 124.56, "text": "But leftover food, they did put in the fridge, that use existed in 1989, it was not the same. You have to consider that point.", "zh": "但是剩菜，他们有放冰箱这个作用，在89年的时候是不一样的，要考虑到这一点。"}, {"start": 124.56, "end": 141.84, "text": "Frozen food, what we call frozen food, in 1989 China did not have it, or had very little of it, or it was very expensive. There was no such thing, because microwave food, microwave food, in 1989, if you were in 1989, you did not have it, right?", "zh": "那种速冻食品，我们叫做速冻食品，89年中国是没有的，或者说极少的，又或者极贵的，这种东西没有的，因为这种叫微波炉食品吗，微波炉食品，那时候你在89年，你如果在89年，没有的，对不对。"}, {"start": 141.84, "end": 158.24, "text": "The drink bottles in the American fridge were indeed in English. Do you think I could not read them? I could read them, I could read Coca-Cola and things like that, but I did not dare to drink them.", "zh": "美国的冰箱里面的饮料瓶子上面，确实是英文，你说我看不懂吗，我也看得懂，可口可乐这种东西我都看得懂，但是我不敢喝。"}, {"start": 158.24, "end": 159.24, "text": "Why? Because in 1989, Coca-Cola in China was very expensive, it was a luxury.", "zh": "为什么，因为89年的时候，可口可乐在中国非常贵，是奢侈品来的。"}, {"start": 159.24, "end": 169.12, "text": "So after I arrived at my eldest uncle's home, my first idea, now called my first idea, was that my eldest uncle's home was very poor, living in the suburbs, such a poor idea.", "zh": "所以我到我大舅家之后，我刚开始第一个概念，现在叫我第一个概念，是我大舅家很穷，住的郊区，是这么一个穷的概念。"}, {"start": 169.12, "end": 173.04, "text": "So my feeling was that I should not add to my eldest uncle's burden.", "zh": "所以说我的感觉，我不应该为我大舅增加负担。"}, {"start": 173.04, "end": 185.28, "text": "There were indeed several cans of those drinks inside, Coca-Cola, Sprite, and so on, but I did not dare to drink them, because I was afraid those expensive things would cause difficulties for my eldest uncle's life.", "zh": "这种饮料里面确实有好几罐在，可口可乐、雪碧什么都在，但是我不敢喝，我怕太贵的东西，然后给我大舅造成生活的困难。"}, {"start": 185.28, "end": 188.48, "text": "So I thought he probably just put them there for the children to use, or as something to drink only rarely.", "zh": "所以我想，他可能只是摆在给孩子们用，或者说是难得喝一口的那种东西。"}, {"start": 188.48, "end": 201.28, "text": "They were just for show. Nobody at home was allowed to touch them, they were just there for other people to see, to show that our home had this, as if it were very high-class. Actually, my husband and I never dared to touch them.", "zh": "就装样子，家里谁都不能碰的，就给别人看，就是我家里有这个，好像很高档一样，其实我们从来不敢碰的。"}, {"start": 201.28, "end": 217.44, "text": "There were two cans that my younger aunt brought from Hong Kong. Actually she did not bring them herself, they were given to her when she got off the plane, two cans of that stuff, and she put them at home like an exhibition piece, to show that our home had them.", "zh": "有两罐是我这个小姑从香港带过来的，他其实也不自己带过来，就是下飞机的时候送了两罐那个东西，他放在家里像一个展览品一样的了，就显得我们家里有啊。"}, {"start": 217.44, "end": 222.16, "text": "So in that situation, I did not dare to drink, I did not dare to drink. I just thought, a little water would do, just drink a little water.", "zh": "所以这种情况的话，在这种情况下，我不敢喝，我不敢喝，我就想，有点水就可以了，喝点水就可以了。"}, {"start": 222.72, "end": 232.72, "text": "Later, I really could not hold out any longer. You sit there for such a long time, and then I thought, I must drink some water.", "zh": "后来呢，就是我实在忍不住了，你坐在那边坐这么长时间啊，然后呢，就是我想，一定要喝点水吧。"}, {"start": 232.72, "end": 244.08, "text": "So I held back and asked my two cousins, one older than me and two younger than me, actually one older cousin and two younger cousins, and I asked them, I said water, water, I still understood that word.", "zh": "所以我就问我的两个表哥表弟，一个比我大，两个比我小，一个是表哥，两个表弟啊，然后我就问他们，我说 water，水，我还懂啊，就这样子。"}, {"start": 244.64, "end": 254.0, "text": "Then my cousins understood water, and they very casually took a cup, opened the tap, and gave me a cup of water.", "zh": "然后我那两个表哥表弟都听懂了 water，他们就很随便地就拿一个杯子，在自来水里面打开一杯水给我了。"}, {"start": 254.0, "end": 267.36, "text": "Because at that time, this is how I was thinking, and you have to understand how I was thinking at the time: were they looking down on me, thinking I should just drink this kind of tap water? Because in Shanghai, from childhood, we were always told absolutely never to drink raw water.", "zh": "因为那么当时我是怎么样想法的，你要理解我当时想法，我当时想法，他们是不是看不起我，觉得我应该就喝这种自来水，因为在上海，我们从小到大老是都叫绝对不能喝生水。"}, {"start": 267.36, "end": 280.72, "text": "But after waiting a while, I saw that they also drank tap water like that, so I gritted my teeth and took a sip. Indeed, there was no bleach taste, indeed no strange taste, it was quite normal, so I drank it.", "zh": "可是我在等一会的话，我看见他们两个也是自来水这样一喝了，那我就咬咬牙就喝了一口，确实没有漂白水的味道，确实没有怪的味道，确实很正常，我就喝了。"}, {"start": 280.72, "end": 298.48, "text": "After drinking it, I was still worried I would get diarrhea. I told myself again and again that I must not get sick, but I had brought some berberine with me, and I was prepared, in case my stomach felt uncomfortable, I still had a remedy. I must not go to hospital, that would be another big burden.", "zh": "喝完之后，我还很担心我会拉肚子，我再三告诉自己不能生病，但是我带了一些黄连素在，我还准备好了，万一肚子不舒服，我还是有办法，千万不能去医院，这也是大的负担，又是一个大的负担。"}, {"start": 298.48, "end": 299.48, "text": "After drinking it, nothing happened.", "zh": "喝下去没什么事情。"}, {"start": 299.48, "end": 310.72, "text": "My cousins were also very nice. When they came back, they opened a packet of something, which I now know was potato chips, and each of them took a handful and ate them there, and then did their homework.", "zh": "两个表哥表弟也挺好，他们回来的时候，就是他们打开了一包东西，就是现在我知道是薯片，薯片一人一把，就在那边吃了，吃了就做功课。"}, {"start": 310.72, "end": 323.6, "text": "Actually, I did not know what was going on, and they just showed me and let me take some myself. I watched them eating a big packet, the economical big packet they had bought, opened and eaten there, not a small packet, a big packet, because the three sons at home ate a lot.", "zh": "其实我都不知道什么事情了，他们就直接给我看，让我自己去拿，我看他们在吃一大包，就是他们买了那种经济的一大包，打开就在那边吃，也不是那种小包的，大包，因为他们三个儿子在家里的食量大。"}, {"start": 323.6, "end": 330.16, "text": "So I grabbed a handful and ate it, and with the water I had drunk, I had something in my stomach, and because it was salty, I felt at ease all at once.", "zh": "我就抓了一把吃了，喝了那个水，吃了吃完之后，那肚子里面有点东西，而且这个是咸的东西，一下子，那就心安了下来。"}, {"start": 330.72, "end": 344.96, "text": "Once I felt at ease, I still did not dare to walk around or run around. I just sat in the room, in the house, and then walked around the backyard roughly, and then sat inside. I did not dare to move around randomly.", "zh": "心安了下来，但是我也不敢乱走，也不敢乱跑，我就坐在房子里面，房间里面，然后去我的后院大致走了一圈，就坐在里面，我不敢乱动。"}, {"start": 344.96, "end": 353.76, "text": "I did not dare to talk or move randomly, because there was no one to talk to, and at that time my language communication was still a problem.", "zh": "我不敢乱说乱动，说也没人说，我表明到那时候，和我那个语言交流还是有问题的。"}, {"start": 353.76, "end": 358.56, "text": "So I waited like that until around ten or eleven o'clock at night, when my eldest uncle roughly came back.", "zh": "就这样子一直等到了晚上10点、11点的时候，10点、11点的时候，我大舅才回来。"}, {"start": 358.56, "end": 369.36, "text": "After my eldest uncle came back, he probably asked my cousins upstairs about how I was doing. When I heard my eldest uncle had come back, I went upstairs to greet him. I had not eaten dinner.", "zh": "我大舅回来之后，他在楼上可能是和我那个表哥表弟问了一下，就是说我怎么样情况，那我听到我大舅回来，我上楼打招呼，我晚饭都没吃。"}, {"start": 369.36, "end": 377.36, "text": "Oh, I did not know what to eat. It was not that, well, everyone saw me and said, hey, did I not tell you there is food in the fridge? Why did you not eat?", "zh": "哎呦，我不知道吃什么，不是吧，那大家就看到我了，他说，哎，我不是告诉你冰箱里有，你为什么不吃。"}, {"start": 377.36, "end": 381.84, "text": "I said, I do not know what to eat. My eldest uncle originally thought that those things did not suit my taste.", "zh": "那我说，我不知道吃什么，我大舅本来以为呢，就是说，这些东西不合胃口。"}, {"start": 381.84, "end": 389.44, "text": "He said, this is beef, pork, you can eat all of them, is there anything you do not eat? I said, I eat everything.", "zh": "他说，这是牛肉啊，猪肉啊，你都可以吃的，你什么东西不吃吗，我说，我什么东西都吃啊。"}, {"start": 389.44, "end": 401.44, "text": "He said, have you eaten like this? He knew I did not know how to eat them. I told my eldest uncle quite frankly, I said, I do not know what it is, you tell me what to eat.", "zh": "他说，你这样吃了吗，就知道我不知道怎么吃，我就和大舅相当坦白地说，我说，我不知道是什么，你让我吃什么。"}, {"start": 401.44, "end": 409.84, "text": "Only then did my eldest uncle react. He said, oh, you have never seen this, you do not know what this is. It is very simple. He took out box after box of things.", "zh": "哦，我大舅那时候才反应过来，他说，哦，你没见过，你不知道这种东西啊，这很简单，哎呀，他去拿出一盒一盒东西。"}, {"start": 409.84, "end": 423.6, "text": "That thing, I still remember it now: one piece was minced beef, a beef patty, and next to it was mashed potato, a mashed potato sauce, and then a sauce, and also a lot of corn and things like that.", "zh": "那个东西，现在我自己还记得啊，是一块牛肉碎的牛肉饼，然后旁边呢，是一颗土豆泥，土豆泥酱啊，然后一个酱，然后呢，还有好多那个玉米这种东西。"}, {"start": 423.6, "end": 434.48, "text": "My eldest uncle took out a box, put it in the microwave, and after about an hour or so, well, he took it out and gave it to me to eat. Then he told me, if you want to eat this meal, there is bread below, you take it yourself.", "zh": "我大舅就拿出一盒，放在微波炉里面，大概过了一个多小时，热了，就给拿出来给我吃，当他就告诉我，你想吃这餐，他说，下面还有面包，你要自己拿。"}, {"start": 435.12, "end": 441.36, "text": "That was when I ate my first proper meal in America, my first proper meal, and it was microwave food.", "zh": "那我那时候才是在美国吃了正式的第一餐，正式的第一餐，是微波炉食品。"}, {"start": 441.36, "end": 449.52, "text": "And it was all right, also because of the ingredients, my stomach at that time was not that hungry anymore, not too hungry, and the ingredients were good.", "zh": "而且一直还好，就是食材的关系嘛，食材的关系，我肚子那时候反而不饿了，不是太饿了，那食材的好。"}, {"start": 450.16, "end": 455.36, "text": "After eating, after eating my first meal in America, I could finally sleep peacefully.", "zh": "吃完，吃完我在美国的第一餐之后，终于可以安心的睡觉了。"}, {"start": 455.36, "end": 459.44, "text": "My first day in America passed in this completely unfamiliar environment.", "zh": "我在美国的第一天，就在这个完全不懂的环境当中，过去了。"}, {"start": 459.44, "end": 466.0, "text": "That night, I remember very clearly, it rained in San Francisco. San Francisco generally rarely rains.", "zh": "那天晚上，我记得很清楚，旧金山下了一场雨，旧金山一般很少下雨。"}, {"start": 466.48, "end": 474.08, "text": "Someone in the audience asked me whether that microwave food was tasty. Yes, it was tasty, so tasty. I am not saying the opposite.", "zh": "有位观众问我，那个微波炉食品好吃吗，好吃，太好吃了，我这个倒不是说反话。"}, {"start": 474.64, "end": 489.36, "text": "First, I was hungry. Second, in Shanghai at that time, and I will say this again, please do not argue with me about it, it is not that Shanghai had no beef, Shanghai did have beef, but our family could not afford it, our family could not afford it.", "zh": "一是饿了，第二个，在上海的时候，我再说，大家千万不要顶我啊，不是上海没有牛肉，上海是有牛肉，我们家买不起，我们家买不起。"}, {"start": 489.36, "end": 512.08, "text": "In our family, we ate beef only at Chinese New Year, at New Year, normally pork and fish were the main foods, never beef. Beef was definitely only at New Year, when we cooked a big pot of beef, and it was a big piece of beef, not sliced beef, just a big pot of beef soup, and when relatives and friends came, every day we would take out a pot for everyone to eat. Only then could we eat beef.", "zh": "我们家吃牛肉，只有过年的时候，过新年的时候，平时猪肉、鱼肉为主，从来没有牛肉的，牛肉一定是在过年的时候，煮一大锅牛肉，而且是一大块牛肉，不是切那个牛肉片的，就是一大锅牛肉汤，亲戚朋友来的时候，每天就是拿一锅出来，大家吃，那时候才能吃牛肉。"}, {"start": 512.64, "end": 528.64, "text": "It is completely different now. Everyone, please remember, that was in the 1980s, my parents were primary school teachers, their wages were extremely low, and my grandmother had no retirement pay, nothing, no retirement wages. That was the product of such a family situation.", "zh": "和现在完全不一样啊，大家千万记住，那是在1980年代的时候，我父母亲是小学老师，工资是极低的，我奶奶是没有什么退休工资的，是这么一个家庭情况之下的一种产物。"}, {"start": 529.2, "end": 539.12, "text": "If you say, oh, in my place we can eat beef every day, I believe you, because different places in China, different family backgrounds, different incomes are different.", "zh": "如果你们说，哎呀，我这个地方每天都可以吃牛肉，我相信你，因为在中国不同地方，不同家庭的背景，不同的收入情况不一样。"}, {"start": 539.12, "end": 547.12, "text": "I never said Chinese people cannot afford beef. Do not argue with me about that. It is that our family could not afford it, right?", "zh": "我从来没有说过中国人吃不起牛肉啊，别顶我啊，是我们家吃不起啊，是吧。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
