<script>
const SECTIONS=[{"slug": "sec1", "title": "AI Bubble Warning — Section 1: Air, water, and the bottleneck chain", "mp3": "ai-bubble/sec1/sec1.mp3", "dur": "10:16", "lines": [{"start": 0.0, "end": 11.96, "text": "Here is a deeply counterintuitive truth: when a technology becomes as indispensable as air and water, as long as there is no monopoly, its commercial value becomes just as cheap and profitless as air and water.", "zh": "有一个非常反直觉的真相：当某种技术变得像空气和水一样不可或缺时，只要没有垄断，那么它的商业价值恰恰也就像空气和水一样，廉价且无利可图。"}, {"start": 11.96, "end": 19.56, "text": "Railways are like this, electricity is like this, the internet is like this, and artificial intelligence in the future will be no different.", "zh": "铁路如此，电力如此，互联网如此，未来的人工智能也一样会如此。"}, {"start": 19.56, "end": 33.56, "text": "A train ticket across thousands of kilometres costs just over a hundred yuan, the electricity to smelt tens of kilograms of steel costs less than three bottles of drinks, and a high-definition video from the other side of the planet costs just a few mao in data.", "zh": "跨越上千公里的火车票只需要百来块钱，能够冶炼几十公斤钢铁的电费还不到三瓶饮料的钱，来自地球另一端的高清视频只需要几毛钱的流量费就能获得。"}, {"start": 33.56, "end": 43.8, "text": "In the internet era, data traffic is as common as tap water, which is why telecom companies that produce traffic, all over the world, can never beat internet companies that use traffic.", "zh": "互联网时代，流量就像自来水一样常见，这也就是为什么全世界范围内，造流量的电信公司永远干不过用流量的互联网公司。"}, {"start": 43.8, "end": 58.96, "text": "Some say AI is different, that it is new technology, but do not forget: going online 30 years ago was cutting-edge technology, electricity 100 years ago was hailed as black magic from God, and trains 200 years ago were high technology too.", "zh": "有人说AI不一样，它是新科技，但是大家可别忘了，30年前的上网也是妥妥的前沿技术，100年前的电在当时更是号称上帝魔法的黑科技，200年前的火车也一样是高科技。"}, {"start": 58.96, "end": 68.36, "text": "In essence, AI is no different from the internet, electricity, railways, or even the steam engine before it; all of them depend on a massive infrastructure build-out.", "zh": "AI在本质上和曾经的互联网、电力、铁路甚至是蒸汽机没有任何的区别，都依赖于一场声势浩大的基础设施建设。"}, {"start": 68.36, "end": 80.24, "text": "And the pattern of history tells us that every company and industry at the infrastructure layer is destined in the end to become a three-high industry: asset-heavy, high-risk, and highly leveraged.", "zh": "而历史的规律告诉我们，所有属于基础设施层面的企业和行业，注定最后都会沦为重资产、高风险、高杠杆的三高行业。"}, {"start": 80.24, "end": 90.24, "text": "Without exception, they share the same traits: enormous capital expenditure, extremely low returns on assets, and a payback period so long it is despair-inducing.", "zh": "他们的特点无一例外，都是背负着极其庞大的资本开支，承受着极低的资产回报率，面临着漫长到令人绝望的回报周期。"}, {"start": 90.24, "end": 99.08, "text": "Once the initial frenzy of speculation passes, they all end up as mediocre earners, public utilities that can only earn the average profit rate of society.", "zh": "度过最初的疯狂炒作期后，他们最终都会沦为盈利平庸、只能赚取社会平均利润率的公用事业。"}, {"start": 99.08, "end": 115.36, "text": "In every technological revolution, the core infrastructure providers at the very bottom, after an early surge in valuation and profits driven by sentiment, are eventually brought back down to earth by massive capital expenditure, asset depreciation, overcapacity, and the cycle.", "zh": "在任何一场技术革命里面，最底层的核心基建商在经过初期由情绪催动的估值和盈利大规模增长之后，终究会被庞大的资本开支、资产折旧、产能内卷和周期率给打回地上。"}, {"start": 115.36, "end": 125.2, "text": "But as Buffett said, most people cannot wait to get rich slowly; too many people want to win it all in the very first second of the race and turn their fortunes around overnight.", "zh": "但是就像巴菲特所说的，绝大多数人等不及慢慢变富，太多人渴望在赛跑的第一秒就一击必胜、直接翻身暴富。"}, {"start": 125.2, "end": 131.48, "text": "So they all choose the new-technology infrastructure chain where certainty appears earliest, and stake most of their net worth on it.", "zh": "因此都会选择确定性出现最早的新科技基建产业链，去赌上自己大部分的身家。"}, {"start": 131.48, "end": 147.92, "text": "Every time a disruptive technology first appears, people, afraid of missing the train, quickly fall into a frenzy over the related infrastructure, and then pour all their energy into extreme speculation on supply-chain bottlenecks; there has never been an exception, and that is human nature.", "zh": "每一次颠覆性技术刚开始出现的时候，人们都会因为害怕错过上车的机会而迅速陷入对相关基建的狂热，紧接着把全部的精力投入到对供应链瓶颈的极端炒作之中，没有一次是例外，这就是人性。"}, {"start": 147.92, "end": 167.24, "text": "If you peel back the roaring AI rally in global stock markets over the past three years, you will suddenly see it clearly: what Wall Street and the A-share market have been bidding up these past few years is not artificial intelligence itself, but bottlenecks, found by taking a magnifying glass and feeling their way along the infrastructure pipeline.", "zh": "大家如果把过去三年全球股市轰轰烈烈的AI行情扒开来看，就会恍然大悟，华尔街和A股这几年炒的根本就不是人工智能本身，而是拿着放大镜顺着基建流水线一路摸过去，在炒瓶颈。"}, {"start": 167.24, "end": 171.84, "text": "Whoever chokes the expansion of computing power, capital bids up to the sky.", "zh": "谁卡住了算力扩张的脖子，资本就把谁炒上天。"}, {"start": 171.84, "end": 179.76, "text": "By the logic of the shortest plank, every time the computing-power chain solves an old bottleneck, a new physical limit is immediately exposed.", "zh": "根据木桶原理，算力产业链每解决一个旧卡点，下一个物理极限就会立刻暴露出来。"}, {"start": 179.76, "end": 195.72, "text": "Do not believe me? Just look: counting this year, AI hardware, or rather bottlenecks, has been hyped for more than three full years, and every time people think it is almost time for AI applications to explode, the market still circles back to hardware hype.", "zh": "不信你看，算上今年，AI硬件或者说瓶颈已经炒作了足足三年多，每次大家觉得快要轮到AI应用爆发了，市场都还是会绕回到硬件炒作上面去。"}, {"start": 195.72, "end": 211.24, "text": "At first it was the bottleneck in wafers and advanced packaging; in 2022 and 2023, when large models had just exploded, chip packaging capacity could not keep up and graphics cards could not be delivered, so money bid up Nvidia and TSMC.", "zh": "刚开始炒的是晶圆与先进封装的瓶颈，2022、2023年大模型刚刚爆发的时候，芯片封装产能跟不上，显卡交不上货，资金就炒作英伟达与台积电。"}, {"start": 211.24, "end": 221.16, "text": "Once packaging capacity doubled, you could not just leave the chips you bought sitting on a table; servers, racks, and switches all had to keep up, so the market bid up servers and data centres.", "zh": "等封装产能翻倍了，芯片买回来总不能摆在桌子上面，服务器、机架、交换机都得跟上，于是炒服务器和数据中心。"}, {"start": 221.16, "end": 233.08, "text": "Once the machines were piled up, power was not enough and cooling could not keep up, so the market went on to hype power and power-smart equipment, and there was even a saying at the time: the end of AI is electricity.", "zh": "机器堆起来，发现电不够用了，散热跟不上，接着炒作电力和电力智能设备，甚至当时出现过一句话：AI的尽头是电力。"}, {"start": 233.08, "end": 252.2, "text": "Later still, as inference and agent workloads consumed more and more, computing fast was not enough, you also had to store it and move it, so high-bandwidth memory, high-speed interconnects, and custom chips, and even CPUs that had once been neglected, became objects of pursuit for capital one after another.", "zh": "再往后，推理和Agent的消耗越来越大，算得快还得存得下、传得动，高带宽存储、高速互联、定制芯片，甚至一度被冷落的CPU，又陆续成了资金追逐的对象。"}, {"start": 252.2, "end": 264.0, "text": "Once chips and memory were assembled, they hit the physical bottleneck of copper cabling, so money poured into wildly bidding up 800G and 1.6T optical modules and CPO silicon photonics.", "zh": "等芯片和内存凑齐了，又撞上了铜缆的物理瓶颈，于是资金又涌去暴炒800G、1.6T光模块和CPO硅光。"}, {"start": 264.0, "end": 275.04, "text": "Once the optical modules were plugged in too, they got stuck again on the power and cooling bottleneck, and money turned back around to frantically grab liquid-cooling equipment, transformers, and nuclear power plants.", "zh": "等光模块也插上了，又卡在电力散热的瓶颈之上，资金便转回头了，又去疯抢液冷设备、变压器和核电站。"}, {"start": 275.04, "end": 290.24, "text": "Throughout human history, after every new technology is born, these physical and capacity bottlenecks quickly become the sexiest kind of wealth code in speculators' eyes, and that is a core reason why picks-and-shovels stocks have repeatedly been the main theme over the past three years.", "zh": "在人类历史上，每一次新技术诞生之后，这种物理瓶颈和产能瓶颈都会迅速成为投机客眼中最性感的一种财富密码，这就是过去三年铲子股反复成为主线的一个核心原因。"}, {"start": 290.24, "end": 298.6, "text": "While everyone is still arguing about who can make big money from AI, the people selling shovels have already taken money from the people building AI.", "zh": "大家都还在争论谁能靠AI赚到大钱，卖铲子的人已经先从建设AI的人手里面收到钱了。"}, {"start": 298.6, "end": 315.32, "text": "Two hundred years ago, with the explosion of steam engines and railways, all Western capital chased steel, rail manufacturing, carriage manufacturing, and railway construction, and physical and capacity bottlenecks likewise became the wealth code in every investor's eyes.", "zh": "200年前，随着蒸汽机和铁路的爆发，整个西方的资本都在追逐钢铁、轨道制造、车厢制造以及铁路铺设这些基础设施领域，物理瓶颈和产能瓶颈同样成了所有投资人眼中的财富密码。"}, {"start": 315.32, "end": 326.4, "text": "The wrought-iron crisis is a perfect example: as trains got heavier and faster, people suddenly realised a problem, the rails of the time were made of wrought iron, which was too soft.", "zh": "熟铁危机就是一个绝佳的例子，随着火车越来越重、速度越来越快，人们突然意识到一个问题：当时的铁轨是熟铁做的，质地太软。"}, {"start": 326.4, "end": 337.04, "text": "On some busy railways, every few months the rails would start to deform and crack and had to be scrapped and replaced; this was a physical bottleneck of wrought-iron material that no craftsmanship could fix.", "zh": "一些繁忙的铁路每隔几个月，铁轨就会开始变形开裂，必须报废更换，这是熟铁材料的物理瓶颈，没有办法通过工艺修补来改变。"}, {"start": 337.04, "end": 348.68, "text": "So capital immediately bought into a narrative: all of society's wrought-iron capacity would be used to repeatedly cast and repair these rails, and wrought-iron capacity was destined to be in short supply for a long time.", "zh": "于是资本立刻相信了一套叙事逻辑：全社会的熟铁产能将会被用来反复铸造和修补这些铁轨，熟铁产能注定长期供不应求。"}, {"start": 348.68, "end": 358.92, "text": "What followed was the familiar story of supply-chain tightness and soaring share prices: ironworks' orders stretched years ahead, and iron prices tripled over five years.", "zh": "随之而来的就是熟悉的供应链吃紧与股价的飙涨，铁厂的订单排到了几年之后，铁料价格在五年的时间里面连翻了三倍。"}, {"start": 358.92, "end": 369.36, "text": "Everyone's logic was simple: as long as humans still exist, rails will have to be repaired constantly, so wrought-iron works were almost a golden industry that would never lack business.", "zh": "大家的逻辑很简单：只要人类还在，铁轨就得不停地修，熟铁厂几乎就是永远不愁业务的黄金行业。"}, {"start": 369.36, "end": 377.04, "text": "On the London Stock Exchange, ironworks' shares rose on average nearly tenfold, and some leading companies rose nearly twentyfold.", "zh": "伦敦证券交易所里面，铁厂股价平均上涨了将近十倍，部分龙头企业涨幅更是接近二十倍。"}, {"start": 377.04, "end": 386.64, "text": "British speculators at the time did not even look at financial reports or companies; as soon as they heard a company name containing the word iron or casting, they would buy frantically.", "zh": "当时英国投机者甚至不看财报也不看公司，只要听到公司名字里面带个铁或者铸造字样，就会疯狂地抢购。"}, {"start": 386.64, "end": 396.76, "text": "As for today's capital market wildly bidding up HBM memory, optical modules, and transformers by following the supply-chain list, the underlying logic is exactly the same.", "zh": "至于今天资本市场按着供应链名单疯炒HBM存储、光模块和变压器的底层逻辑，如出一辙。"}, {"start": 396.76, "end": 412.52, "text": "In the early days of the electricity revolution a hundred years ago, the same bottleneck-hype script as the wrought-iron crisis was replayed: everyone was still staring at upstream power-machinery names, such as Edison generators, copper wire, and utility poles.", "zh": "一百年前的电力革命初期，同样复刻了熟铁危机的炒瓶颈剧本，那个时候所有人盯着的依然是上游电力机械相关标的，比如爱迪生发电机、铜导线和电线杆."}, {"start": 412.52, "end": 420.8, "text": "Capital bid every concept related to electrical machinery up to the sky, and one physical constraint completely ignited the market's speculative mood.", "zh": "资本把一切与电力机械相关的概念都炒上了天，一个物理上的约束条件彻底点燃了市场炒作的情绪。"}, {"start": 420.8, "end": 435.52, "text": "Under Edison's direct-current system, if you wanted long-distance power transmission, you had to use copper cables thicker than a person's waist to reduce resistance, otherwise a single power station could only supply an area of one to two kilometres.", "zh": "在爱迪生直流电的环境之下，如果想要完成远距离的输电，就必须要用到比腰还粗的铜缆来降低电阻，否则一座发电站就只能为一到两公里的范围内去供电。"}, {"start": 435.52, "end": 446.8, "text": "This drove the entire Western world's imagination about copper demand to a terrifying state, and newspaper headlines said: all the world's copper mines put together are not enough to build America's power grid.", "zh": "这让当时的整个西方世界对铜的需求的想象达到了恐怖的状态，报纸头条就是：全世界的铜矿加起来都不够给美国架电网。"}, {"start": 446.8, "end": 452.2, "text": "Whoever controlled copper controlled the power supply, and copper-mining shares soared overnight.", "zh": "谁掌握了铜，谁就掌握了电力供应，铜矿股股价一夜之间一飞冲天。"}, {"start": 452.2, "end": 462.44, "text": "Capital, having tasted success, did the same thing again, taking a magnifying glass and checking along the power supply chain one by one, trying to find more bottlenecks.", "zh": "尝到甜头的资本如法炮制，拿着放大镜顺着电力供应链去逐个检查，试图发现更多的瓶颈。"}, {"start": 462.44, "end": 476.48, "text": "Soon they made a new discovery: modern synthetic plastics had not yet been invented, but high-voltage wires, transformers, and generator coils all needed high-strength insulating materials, otherwise a short circuit at best, or a fire at worst.", "zh": "很快他们就有了新的发现：当时还没有发明现代合成塑料，但是高压电线、变压器以及发电机线圈里面都需要高强度的绝缘材料，否则轻则短路、重则失火。"}, {"start": 476.48, "end": 489.48, "text": "The best insulator all of humanity could find at that time was natural Para rubber from the Amazon in South America; this wild natural rubber had extremely low output and simply could not supply the world's demand for electrical insulation.", "zh": "那个时候全人类能找到最好的绝缘体，就是产自南美亚马逊的天然帕拉橡胶，这种野生天然橡胶产能极少，根本无法供应全世界的电力绝缘需求。"}, {"start": 489.48, "end": 501.72, "text": "The stock market's hype logic was once again astonishingly identical to today's: the market firmly believed that without rubber, no matter how well generators and power plants were built, they were just a pile of scrap iron.", "zh": "股市的炒作逻辑再次和今天的如出一辙，当时市场笃信：没有橡胶，发电机、发电厂造得再好也是一堆废铁。"}, {"start": 501.72, "end": 512.4, "text": "Whoever monopolised insulating materials held the lifeblood of the electrical age by the throat, and from 1895 to 1910, the price of insulating rubber surged 500 percent.", "zh": "谁垄断了绝缘材料，谁就掐住了电气时代的命根子，从1895年到1910年，绝缘橡胶的价格暴涨了500%。"}, {"start": 512.4, "end": 520.52, "text": "And on the London and New York stock exchanges, the shares of some core companies in insulation rose twenty to thirty times in just four or five years.", "zh": "而在伦敦和纽约证券交易所里面，一些绝缘领域的核心公司的股价在短短四到五年里面翻了二十到三十倍。"}, {"start": 520.52, "end": 533.6, "text": "The reasons the market gave at the time were equally unassailable: in the future, every light bulb and every electrical appliance of all humanity would need a rubber insulation layer for protection, and demand was so large there was no top in sight.", "zh": "当时市场给的理由同样是无懈可击：未来全人类的每个灯泡、每一台电器都要用到橡胶绝缘层来保护，需求大到根本看不到顶。"}, {"start": 533.6, "end": 542.16, "text": "Shares were so hot at the time that a dedicated market for trading insulation-material stocks even appeared, for speculators to trade the related shares wildly.", "zh": "当时股价之火爆，甚至专门出现了绝缘材料股票交易市场，供投机客大肆炒卖相关股票。"}, {"start": 542.16, "end": 554.84, "text": "Twenty-five years ago, during the internet bubble, humanity fell into the same pit again: the prevailing narrative firmly believed that internet traffic would double every hundred days, and that bandwidth would be king in the future internet.", "zh": "25年前互联网泡沫时期，人类依然在同一个坑里面重蹈覆辙，当时市场坚信：互联网流量每一百天就会翻一倍，认定未来互联网带宽为王。"}, {"start": 554.84, "end": 569.16, "text": "Global capital poured 500 billion US dollars into the telecom industry in five years, laying 39 million miles of optical fibre under the sea and on land, a total length enough to circle the Earth 1,500 times.", "zh": "全球资本在五年里面向电信行业狂砸了5000亿美元，在海底和陆地铺设了3900万英里的光纤，总长度足够绕地球1500圈。"}, {"start": 569.16, "end": 577.6, "text": "To sustain the myth of bandwidth scarcity, telecom giants such as Global Crossing and WorldCom even played the trick of swapping bandwidth with each other.", "zh": "为了维持带宽紧缺的神话，环球电讯与世通公司等电信巨头之间，甚至玩起了带宽对倒的把戏。"}, {"start": 577.6, "end": 594.8, "text": "Company A spent 100 million dollars buying Company B's fibre capacity, and Company B turned around and spent 100 million dollars buying Company A's capacity; in reality not a cent of cash moved, yet each company's financial statements magically gained 100 million dollars in revenue.", "zh": "甲公司花1亿美元买乙公司的光纤容量，乙公司反手也花1亿美元买甲公司的容量，实际上一分钱现金都没流动，两家公司的财报上却各自凭空多出了1亿美元的营收。"}, {"start": 594.8, "end": 607.96, "text": "This is exactly the same trick as today, and at the same time, to support the so-called doubling of traffic, every company was frantically grabbing switches, and giants such as Cisco and Lucent had orders stretching more than ten months ahead.", "zh": "这和今天的套路也是如出一辙，与此同时，为了支撑所谓的流量翻倍，所有的企业都在疯抢交换机，思科与朗讯等巨头的订单排到了十几个月之后。"}, {"start": 607.96, "end": 616.24, "text": "Cisco's share price even surged to 80 dollars in March 2000, at one point surpassing Microsoft to become the most valuable company in human history at the time.", "zh": "思科的股价更是在2000年的3月份冲上了80美元，一度超过微软，成为当时人类史上估值最高的公司。"}]}, {"slug": "sec2", "title": "AI Bubble Warning — Section 2: Breakthroughs, shovels, and latecomers", "mp3": "ai-bubble/sec2/sec2.mp3", "dur": "9:38", "lines": [{"start": 0.0, "end": 12.08, "text": "But the market economy always reveals its charm at moments like this: when a threshold set by some link in the chain generates absurdly excessive profits, that profit itself becomes the most powerful bounty in the world.", "zh": "但市场经济总是在这种时刻显露出它的魅力：当某个环节设下的门槛产生过于离谱的超额利润的时候，这个利润本身就成了全天下最强大的悬赏令。"}, {"start": 12.08, "end": 20.96, "text": "It spontaneously mobilises society's top minds and vast amounts of capital to keep trying to smash that threshold completely, and that is the pattern.", "zh": "它会自发地调动全社会的顶级智慧和海量的资本，去不断地尝试彻底砸碎这道门槛，这是规律。"}, {"start": 20.96, "end": 39.28, "text": "After the wrought-iron crisis, capital could no longer bear handing its profits to wrought-iron works year after year, so money poured into research and development, and finally, seven years later in 1856, the British inventor Bessemer announced his new patent: the acid Bessemer converter steelmaking process.", "zh": "熟铁危机发生之后，资本再也无法忍受年复一年地把利润拱手送给熟铁厂，资金大量地涌向研发，终于在7年之后的1856年，英国发明家贝塞麦宣布了自己的新专利：酸性转炉炼钢法。"}, {"start": 39.28, "end": 50.0, "text": "Blowing air directly into molten pig iron could quickly burn off impurities, and for the first time in human history, the problem of mass-producing liquid steel at low cost was completely solved.", "zh": "往熔融生铁里面直接吹入空气，就能快速烧掉杂质，人类历史上第一次彻底解决了液态钢无法低成本量产的问题。"}, {"start": 50.56, "end": 58.0, "text": "Steel rails were more than ten times as tough and durable as wrought-iron rails, and humanity quickly replaced iron rails with steel rails.", "zh": "钢轨的韧性与耐用寿命是熟铁轨的十倍以上，人类迅速把铁轨换成了钢轨。"}, {"start": 58.0, "end": 74.72, "text": "The ironworks giants whose valuations had been sky-high in 1853 saw their share prices cut down to their ankles, eventually falling back to where they had been just before the mania of 1848, and 95 percent of traditional wrought-iron works in Europe and America declared bankruptcy.", "zh": "曾经在1853年估值高到天上的铁厂巨头们，股价一路被砍到脚脖子，最终跌回到1848年狂热前夕的原地，95%的欧美传统熟铁厂宣布破产。"}, {"start": 74.72, "end": 86.72, "text": "The supposedly insurmountable copper-cable bottleneck and direct-current transmission limits of the electrical revolution also, six years later, forced out a once-in-a-millennium inventive genius: Tesla.", "zh": "电气革命时期所谓无法克服的铜缆瓶颈和直流电传输限制，也在六年之后逼出了千年一遇的发明鬼才特斯拉。"}, {"start": 86.72, "end": 96.08, "text": "Tesla discovered alternating current, and combined with the transformer he invented, it fundamentally overcame the huge loss problem in Edison's direct-current transmission.", "zh": "特斯拉发现了交流电，和他所发明的变压器结合之后，从根源上克服了爱迪生直流电传输中巨大的损耗问题。"}, {"start": 96.08, "end": 115.44, "text": "As voltage kept rising, resistance losses naturally fell, and once Westinghouse and General Electric had fully mastered three-phase alternating-current high-voltage transmission technology, humanity only needed transformers to raise voltage to tens of thousands of volts, and losses on the wires would automatically fall to a negligible level.", "zh": "随着电压的不断提高，电阻损耗就会自然下降，当西屋电气和通用电气彻底攻克三相交流高压输电技术之后，人类只需要通过变压器把电压升到几万伏特，电线上的损耗就会自动降低到可以忽略的地步。"}, {"start": 115.44, "end": 123.84, "text": "From then on, there was no longer any need to rely on copper wire to reduce resistance, and ordinary thin cables could achieve long-distance transmission.", "zh": "从此再也不需要依赖铜导线来降低电阻了，普通的细电缆就能够实现远距离输电。"}, {"start": 123.84, "end": 137.92, "text": "At the same time, the high price of natural rubber also brought a major breakthrough in chemistry: in 1907, the chemist Baekeland used cheap phenol and formaldehyde to synthesise the first fully synthetic plastic in human history, Bakelite.", "zh": "与此同时，高昂的天然橡胶价格也引来了化学界的重大突破，1907年，化学家贝克兰用廉价的苯酚和甲醛合成出了人类历史上第一款全合成塑料：酚醛树脂。"}, {"start": 137.92, "end": 146.56, "text": "Combined with extremely cheap ceramic insulators, insulation performance improved more than tenfold, while the price was only one-tenth that of traditional natural rubber.", "zh": "配合极其廉价的陶瓷绝缘子，绝缘性能提升了十几倍，而价格只有传统天然橡胶的十分之一。"}, {"start": 147.12, "end": 160.48, "text": "Once this series of technological bottlenecks had been eliminated, laying power grids and building power plants were no longer high technology, and finally the entire power industry underwent the most thorough reshuffle in business history.", "zh": "当这一系列的技术瓶颈被消灭之后，铺设电网、建造发电厂就不再是一种高科技，最后整个电力行业迎来一次商业史上最彻底的大洗牌。"}, {"start": 160.48, "end": 176.4, "text": "As excess capital poured in, electricity prices began to avalanche, the industry entered a frenzy of mass bankruptcies, and in the end, the once-glorious power infrastructure stocks became the most boring dividend stocks and old-economy stocks on the secondary market.", "zh": "随着资本的过剩涌入，电价开始雪崩，行业进入了批量破产的狂潮之中，最终，曾经风光全盛的电力基建股变成了二级市场最无聊的红利股和老旧股。"}, {"start": 176.4, "end": 181.36, "text": "Burdened with enormous equipment depreciation pressure, they had almost no growth at all.", "zh": "背负着极其庞大的设备折旧压力，几乎没有任何成长性。"}, {"start": 181.36, "end": 197.44, "text": "The same story played out during the millennium internet boom: as dense wavelength division multiplexing technology was commercialised, engineers only needed to add multiplexers at both ends of a fibre to shoot more than 160 different colours of laser light into the same glass strand at once.", "zh": "一样的故事也发生在千禧年互联网繁荣期间，随着密集波分复用技术的商业化落地，工程师只需要在光纤的两头加装分波器，就能把160多种不同颜色的激光同时打进同一根玻璃丝里面。"}, {"start": 198.08, "end": 215.52, "text": "In that case, the communication capacity of each old fibre instantly equalled more than 100 fibres of the past, and by 2002, as much as 97.5 percent of the world's fibre lay under the sea and underground, unused by anyone, becoming dark fibre with no signal.", "zh": "这样的话，每根旧光纤的通信容量瞬间顶得上过去100多根，到2002年，全球高达97.5%的光纤都躺在海底和地下，根本没人去用，成了没有信号的暗光纤。"}, {"start": 215.52, "end": 227.92, "text": "Fibre bandwidth prices plunged 90 percent, more than 60 telecom giants including Global Crossing and WorldCom lined up for bankruptcy, and the entire industry lost 2 trillion dollars in market value.", "zh": "光纤带宽价格暴跌了90%，环球电讯与世通公司等超过60家电信巨头排队破产，整个行业蒸发了2万亿美元的市值。"}, {"start": 227.92, "end": 242.96, "text": "And buying up the switches needed for internet infrastructure seemed logically correct, but when the Federal Reserve's rate-hike cycle arrived and downstream companies collapsed one after another, the switches of that era instantly became bricks held in hand that could not be turned into cash.", "zh": "而抢购互联网基建所必须的交换机，逻辑看似正确，但是当遇到美联储加息周期、下游企业纷纷崩溃之后，那个年代的交换机瞬间也成了攥在手里无法变现的砖头。"}, {"start": 242.96, "end": 258.56, "text": "At the time, discounted switch listings were scattered all over the American market, and this originally expensive high-tech hardware became electronic waste within a few short months; Cisco's share price also plunged all the way from 80 dollars to 10 dollars, a drop of nearly 90 percent.", "zh": "当时美国市面上到处都散落着交换机折价出售的单子，这些原本昂贵的高科技硬件在短短几个月之内就变成了电子垃圾，思科的股价也从80美元一路暴跌到10美元，跌幅接近90%。"}, {"start": 259.6, "end": 268.96, "text": "Everyone says that during the American West gold rush, the surest money was made by those selling shovels, and that is where the nickname of AI shovel-sellers today comes from.", "zh": "所有人都说，在美国西部淘金热期间，最稳赚不赔的就是那些卖铲子的，因为到如今AI卖铲人的外号就是这么来的。"}, {"start": 268.96, "end": 282.56, "text": "But few people know the second half of the story: shovel-sellers only made quick money in the first few years of the gold rush, and once the mining areas had been surveyed or tools were upgraded, warehouses full of iron shovels became scrap metal.", "zh": "但是很少人知道故事的后半截真相：卖铲子赚的只是淘金热前几年的快钱，一旦矿区勘探完毕或者工具迭代，满仓库的铁铲就会沦为废铁。"}, {"start": 282.56, "end": 292.48, "text": "Those who truly built century-old business empires on the back of the gold rush were never the asset-heavy road-builders who went first, but the asset-light latecomers who followed.", "zh": "真正依靠淘金热建立起来百年商业帝国的，从来都不是重资产的先行修路人，而是后来轻资产的后发跟进者。"}, {"start": 292.48, "end": 304.64, "text": "During the 19th-century gold rush, the Americans Henry Wells and William Fargo found that the US postal service of the time was very unreliable and simply could not safely send the gold miners had dug up back to their hometowns.", "zh": "19世纪淘金热期间，美国人亨利·威尔斯和威廉·法戈发现当时的美国邮政很不靠谱，根本没有办法把淘金者挖出来的金子安全寄回自己的老家。"}, {"start": 305.2, "end": 316.08, "text": "So on the one hand they used armed stagecoaches to help miners transport gold and goods, and on the other hand they bought gold directly in the mining areas and exchanged it for paper drafts for the miners.", "zh": "于是他们一方面用马车武装押运，帮助淘金者运送黄金和货物，另外一方面直接在矿区收购黄金，给淘金客兑换成纸质汇票。"}, {"start": 316.08, "end": 328.08, "text": "No one expected that these two businesses, dependent on gold miners, would explode with huge potential and successively give birth to the famous American Express and Wells Fargo, named after the two men.", "zh": "谁也没有想到，这两项依附于淘金客的生意爆发出了巨大的潜能，先后孵化出了大名鼎鼎的美国运通和以两人姓氏命名的美国富国银行。"}, {"start": 328.08, "end": 346.48, "text": "Today these two companies together earn more than 32 billion dollars in annual net profit, with a combined market value once exceeding 410 billion dollars, while more than 90 percent of the countless mining companies and shovel merchants that rose during the Western gold rush have long since gone bankrupt and disappeared.", "zh": "如今这两家公司合计年净利润超过320亿美元，总市值一度超过4100亿美元，而从当年西部淘金热崛起的无数矿业公司与铁铲商，后来超过90%早就破产消失了。"}, {"start": 346.48, "end": 356.96, "text": "But dialectically, this is like a forest fire: it burns away the great trees that dominate the sky and block the sunlight, so that the young saplings below finally get a chance to shoot up.", "zh": "但是我们辩证地看，这就像是森林大火，烧掉了统治高空、遮蔽阳光的大树，下面的新生代小树才得以有机会拔地而起。"}, {"start": 356.96, "end": 368.4, "text": "So the capital frenzy under feverish infrastructure building is a madness that cannot be stopped and is also very necessary, because the essence of infrastructure is to exchange a high premium for compressing time.", "zh": "所以狂热基建之下的资本疯狂，是一场无法阻挡、也非常必要的疯狂，因为基建的本质就是用高昂的溢价去换取时间的压缩。"}, {"start": 368.4, "end": 382.48, "text": "For example, the reason China's high-speed rail, metro, and urbanisation miracle could cover in 30 years the road Western countries took 200 years to travel is that the premium brought by surrounding land development was attractive enough.", "zh": "比如说我们中国的高铁、地铁和城市化奇迹，之所以能在30年内走完西方国家200年的路，就是因为周边土地开发所带来的溢价足够诱人。"}, {"start": 382.48, "end": 395.52, "text": "The logic is simple: under a heavy reward there will always be brave men, and if building a high-speed rail station could not drive up surrounding land prices, most routes in China's high-speed rail network might still be on paper today.", "zh": "道理很简单：重赏之下必有勇夫，如果建设高铁站无法带动周边的地价，中国的高铁网里面的绝大部分路线可能至今还停留在图纸上。"}, {"start": 395.52, "end": 413.04, "text": "These massive infrastructure projects, whether funded by capital bets or government borrowing, would be hard to land without excess returns; without oversized infrastructure there would be no economies of scale, new technologies could not become cheap, and entirely new business forms would be doomed never to unfold.", "zh": "这些巨量的基建，无论是资本押注还是政府举债，如果没有超额利益都将难以落地，没有超量的基建就无法产生规模效应，新技术就无法变得廉价，全新的业态注定不能展开。"}, {"start": 413.04, "end": 426.4, "text": "And those who truly captured the greatest dividends of the era, and even pushed the era forward, were the ecosystem builders who used these cheap and ubiquitous infrastructure facilities to reconstruct the flows of money, information, and services in human society.", "zh": "而真正获得时代最大红利、甚至推动时代前进的，正是利用了这些廉价且普及的基建设施，重构了人类社会资金流、信息流、服务流的生态布局者。"}, {"start": 426.4, "end": 438.0, "text": "The railway mania of 200 years ago was not entirely worthless; in its ruins it left an efficient, cheap railway network that connected the whole of the United States into a single unified market.", "zh": "200年前的那场铁路狂热并非一无是处，它在废墟中留下了高效、廉价的铁路网络，将整个美国连接成了一个统一的大市场。"}, {"start": 438.0, "end": 450.72, "text": "Using this cheap transport network, the world retail pioneer Sears was born, specialising in mail-order goods, laying the foundation for modern chain retail, a combination, a hundred years ago, of Taobao and department stores.", "zh": "利用这张廉价运输网络，诞生出了主打邮购商品的世界零售先驱希尔斯百货，奠定了现代连锁零售业的雏形，是100年前的淘宝与商超百货的集合体。"}, {"start": 450.72, "end": 459.68, "text": "And of course there were those who used railways to open up a nationwide distribution network and created consumer-goods empires like Coca-Cola that have lasted a hundred years.", "zh": "当然还有借助铁路打通全国分销网络，创造出像可口可乐这样绵延百年的消费品帝国。"}, {"start": 459.68, "end": 475.76, "text": "Likewise, when the price of electricity became like tap water, with no money-making power left, people finally realised that the true overlords of the electricity revolution were not at all the hardware merchants people had thought, those selling light bulbs, laying copper wire, or hyping rubber.", "zh": "同样的，当电力的价格变得像自来水一样、吸金性全无的时候，大家才发现，电力革命真正催生的时代霸主根本不是当初人们以为的那些卖灯泡的、铺铜线的、炒橡胶的硬件商。"}, {"start": 475.76, "end": 491.44, "text": "Instead, they were the automobile giant Ford, which used extremely cheap and ubiquitous electricity to create the modern industrial assembly line, and white goods that freed countless households from labour, plus trillion-dollar Hollywood and other film and entertainment industries.", "zh": "而是利用了极度廉价且无处不在的电力，创造了现代工业流水线的汽车巨头福特，以及解放了无数家庭劳动力的白色家电与万亿级别的好莱坞等影视娱乐业。"}, {"start": 491.44, "end": 508.8, "text": "Before the electricity revolution swept through power grids, aluminium, because it was extremely difficult to refine, was a precious metal more expensive than gold, and Napoleon III, to show off his status, even ate with an aluminium fork himself, while other nobles could only use gold forks.", "zh": "在电力革命浪潮席卷电网之前，铝因为提炼极其困难，是比黄金还要昂贵的贵金属，拿破仑三世为了彰显自己的身份，甚至自己吃饭的时候专门用铝叉子，其余的贵族只能用金叉子。"}, {"start": 508.8, "end": 521.52, "text": "But Alcoa used extremely cheap electricity to turn the price of aluminium into cabbage prices through electrolytic aluminium, thereby giving birth to the modern aviation and construction industries, which no longer depend on wood.", "zh": "但是美铝公司利用极度廉价的电能，通过电解铝把铝的价格变成了白菜价，从而催生出了不再依赖木头的现代航空业与现代建筑业。"}, {"start": 521.52, "end": 528.96, "text": "The aviation industry alone, derived from this, has now grown into a huge industry with annual operating revenue exceeding one trillion dollars.", "zh": "单单是由此而衍生出来的航空业，如今就已经成长为一个年营业收入超过一万亿美元的庞大产业。"}, {"start": 529.52, "end": 541.68, "text": "Then, 25 years ago, after the internet bubble, when telecom giants went bankrupt one after another, the 39 million miles of dark fibre left under the sea were picked up by latecomers at cabbage prices.", "zh": "再到25年前的互联网泡沫，当年电信巨头纷纷破产之后，留在海底的3900万英里的暗光纤被后来者以白菜价接盘。"}, {"start": 541.68, "end": 553.52, "text": "Precisely because data costs plunged 90 percent, on the ruins of this dark fibre grew Google, Netflix, Amazon, AWS cloud services, and China's Taobao, WeChat, and ByteDance.", "zh": "正是因为流量成本暴跌了90%，这片暗光纤的废墟上才长出了谷歌、奈飞、亚马逊、AWS云服务，以及中国的淘宝、微信和字节跳动。"}, {"start": 553.52, "end": 562.08, "text": "Before infrastructure led by new technology was completed and made cheap, these new industries were almost unimaginable blind spots for humanity at the time.", "zh": "在新科技主导的基建落成并廉价化之前，这些新型产业在当年几乎都是人类无法想象的盲区。"}, {"start": 562.08, "end": 578.64, "text": "All that can be said is that, whether railways, electricity, or the internet, the fate of infrastructure industries is always to go from frenzy to overinvestment, from oversupply to de-bubbling and collapse, and finally to nourish great latecomers with their own cheapness.", "zh": "只能说，无论是铁路、电力还是互联网，基建行业的宿命永远是在狂热中走向过度投资，在过剩中走向去泡沫和破灭，最终用自身的廉价去滋养出伟大的后来者们。"}]}, {"slug": "sec3", "title": "AI Bubble Warning — Section 3: Anthropic's debt and the cycle now", "mp3": "ai-bubble/sec3/sec3.mp3", "dur": "6:26", "lines": [{"start": 0.0, "end": 10.5, "text": "Back to today's investment environment: since the AI explosion, global capital has been repeatedly pricing and bidding up computing power and the so-called AI industry chain.", "zh": "回到当下的投资环境，自从AI爆发以来，全球资本一直围绕着算力和所谓的AI产业链反复定价、互相拉抬。"}, {"start": 10.5, "end": 17.0, "text": "This precisely shows that we are now at a critical juncture in this great infrastructure cycle, a prisoner's dilemma.", "zh": "这恰恰说明我们现在正处于这个大基建周期中囚徒困境的关键节点。"}, {"start": 17.0, "end": 39.0, "text": "On the one hand, everyone knows in their hearts that the endgame of overinvestment is oversupply, and what is more, the steel rails left by the railways of the past and the dark fibre lying under the sea can still be used for decades, while the computing chips bought today for tens of billions of dollars may have an iteration cycle of only one or two years.", "zh": "一方面，所有人心里都很清楚，超额投资的终局便是过剩，更何况当年的铁路留下的钢轨和海底躺着的暗光纤还能用上几十年，如今花几百亿美元买来的算力芯片迭代周期可能只有一到两年。"}, {"start": 39.0, "end": 52.0, "text": "But on the other hand, the world's major economies are all printing money recklessly and taking on debt; there is too much money now, and the sweep of liquidity and the panic of losing a seat at the table force everyone to stay at this gambling table.", "zh": "但另外一方面，全球主要经济体都在滥发货币、举债，钱现在太多了，流动性的裹挟和对失去入场券的恐慌让所有人不得不继续留在这个赌桌上。"}, {"start": 52.0, "end": 57.0, "text": "Some people are here to get rich overnight, and some just want their money to lose value a little more slowly.", "zh": "有些人是为了暴富，有些人只是想让自己的钱贬值得慢一些。"}, {"start": 57.0, "end": 66.0, "text": "Yet over a longer cycle, the crazier investment is now, the more violently the process of underlying technology becoming like air and water is being accelerated.", "zh": "然而拉长周期来看，现在的投资越是疯狂，底层技术的空气与水化进程越是在被暴力加速。"}, {"start": 66.0, "end": 78.0, "text": "When capital wildly bids up even transformers and liquid-cooling panels as if they were core-technology beliefs, it shows that this hot-potato game of hyping bottlenecks has already reached the end of the supply chain.", "zh": "当资金连变压器和液冷散热板都当成核心科技信仰去暴炒的时候，说明这场炒瓶颈的击鼓传花游戏已经摸到了供应链的末端。"}, {"start": 78.0, "end": 83.0, "text": "Truly excess returns are definitely not in those money-guzzling beasts being wildly hyped.", "zh": "真正的超额收益绝对不在那些被疯狂炒作的吞金兽上面。"}, {"start": 83.0, "end": 90.0, "text": "Now everyone's worry about the cycle peaking is rising sharply as stock markets keep hitting new highs and interest rates rise.", "zh": "现在大家对周期见顶的担忧正在随着股市不断创新高和利率上涨而猛烈地增加。"}, {"start": 90.0, "end": 100.0, "text": "As the United States has had to raise interest rates to fight inflation, AI stocks, which are extremely sensitive to funding costs, have once again been hit hard worldwide.", "zh": "随着美国不得不加息抗通胀，对资金成本极度敏感的AI股票在全球范围内再一次迎来了重挫。"}, {"start": 100.0, "end": 110.0, "text": "The AI giant Anthropic revealed in October a 60-billion-dollar chip-financing debt, of which 42 billion dollars in senior debt had to be guaranteed by its chip partner Broadcom.", "zh": "AI巨头Anthropic在10月份爆出了一笔600亿美元的芯片融资债，其中420亿美元优先债不得不找芯片合作方博通来提供担保。"}, {"start": 110.0, "end": 118.0, "text": "And in the 18-billion-dollar subordinated debt financing, Blackstone took a 9-billion-dollar share, demanding a yield of more than 10 percent.", "zh": "而在180亿美元次级债融资中，由黑石集团认购了90亿美元的份额，被要求提供超过10%的收益率。"}, {"start": 118.0, "end": 129.0, "text": "Bear in mind that companies with the same rating borrow in the public bond market at only around 7 percent, and anything over 10 percent is basically considered high-risk junk-bond territory.", "zh": "要知道，同评级的企业在公开债券市场的借款利率只有7%左右，超过10%基本上就被认为是高风险垃圾债的水平。"}, {"start": 129.0, "end": 136.0, "text": "This means Wall Street is demanding a hefty premium for the rapidly depreciating value of computing chips and for default risk.", "zh": "这就意味着华尔街正在为算力芯片急速贬值与违约风险索要高昂的溢价。"}, {"start": 136.0, "end": 156.0, "text": "Anthropic, a world first-tier company whose quarterly revenue alone reaches 16.8 billion dollars, in order to buy TPU chips from its major shareholder Google, not only could not get a preferential interest rate, but instead had to use its chip leases for the next five years as collateral to pay junk-bond interest of more than 10 percent.", "zh": "堂堂世界第一梯队、一个季度的营收就高达168亿美元的Anthropic，为了买大股东谷歌的TPU芯片，不仅拿不到优惠的利率，反而要拿着未来五年的芯片租约当抵押，去付超过10%的垃圾债利息。"}, {"start": 156.0, "end": 165.0, "text": "What irony this is; as soon as this news came out, it nearly sent the already nervous global stock market, walking the AI tightrope, straight over the edge.", "zh": "这是何等的讽刺，这个消息一出，差点把本就提心吊胆、走AI钢丝的全球股市给当场送走。"}, {"start": 165.0, "end": 171.0, "text": "This is actually a clear signal that AI infrastructure construction is encountering serious problems.", "zh": "这其实就是AI的基础设施建设正在遭遇严重问题的明确信号。"}, {"start": 171.0, "end": 188.0, "text": "Over the past two years, cheap money was everywhere in the market, and giants such as Amazon, Google, and Meta, with huge cash piles accumulated over more than twenty years, were not afraid to burn it, so the major model companies could finance, buy chips, and refinance almost without restraint.", "zh": "过去两年里面，市场上到处都是便宜的钱，亚马逊、谷歌、Meta等巨头攒了二十多年的巨额现金根本不怕烧，所以各大模型公司几乎可以不受制约地去融资、买卡、再融资。"}, {"start": 188.0, "end": 196.0, "text": "But now there are signs of being stretched thin: first, continuing to improve model capability requires computing costs that rise severalfold.", "zh": "但是现在已经有点捉襟见肘的迹象了，首先，继续提升模型能力需要的是成倍上升的算力成本。"}, {"start": 196.0, "end": 211.0, "text": "In addition, the major giants have probably burned down to the bottom: Google, in the 22 years since its listing in 2004, even through the 2008 subprime crisis and the 2020 market meltdown, never had negative free cash flow.", "zh": "此外，各大巨头恐怕已经烧到见底了，谷歌自从2004年上市的22年以来，哪怕经历了08年次贷危机和2020年股市熔断，都没有出现过负自由现金流的情况。"}, {"start": 211.0, "end": 222.0, "text": "Yet in the second quarter of this year, for the first time, it posted negative free cash flow of 5.855 billion dollars, and with no money, it can only go to the market to raise funds itself.", "zh": "今年二季度却首次出现了58.55亿美元的负自由现金流，没钱，那就只能自己去市场上融资。"}, {"start": 222.0, "end": 241.0, "text": "And just now the Federal Reserve has restarted rate hikes, US Treasury yields keep climbing, and Anthropic, including 35 billion dollars borrowed from Apollo in June this year, has within a year taken on 95 billion dollars in chip debt and 51.8 billion dollars in long-term computing procurement commitments.", "zh": "偏偏现在美联储重启加息，美债收益率一路走高，Anthropic今年加上6月份找阿波罗借了350亿美元，一年之内已经背上了950亿美元的芯片债和518亿美元的长期算力采购承诺。"}, {"start": 241.0, "end": 250.0, "text": "So today's large model companies are stuck at both ends: the tech giants want to give money but do not have it, and the market has money but it is very expensive.", "zh": "所以现在的大模型公司就是一根筋两头堵：科技巨头想给钱，但是没有钱，市场上有钱，但是非常贵。"}, {"start": 250.0, "end": 254.0, "text": "This is the core logic and the biggest trap of today's global technology theme.", "zh": "这就是当下全球科技主线的核心逻辑和最大的一个陷阱。"}, {"start": 254.0, "end": 270.0, "text": "What I am telling you today is definitely not bearish on the AI industry; the AI era has only just gone through its earliest budding stage, and many truly phenomenal AI applications have not yet appeared at all, and even now we cannot imagine them.", "zh": "我今天给大家说这些，绝对不是在看空人工智能产业，人工智能时代才刚刚经历了最初的萌芽阶段，众多真正的现象级AI应用还远远没有出现，甚至现在我们都无法想象。"}, {"start": 270.0, "end": 280.0, "text": "The value and market rallies created by AI in capital markets are also far from over in the long run, but in the future they are destined to go through periodic slumps and even crashes.", "zh": "资本市场因为AI创造出的价值和行情，长期看也远远没有结束，但未来注定会经历阶段性的萧条甚至崩盘。"}, {"start": 280.0, "end": 292.0, "text": "Ultimate success definitely does not mean the road will be smooth: before the wrought-iron crisis, the railway asset carnival lasted four years, before converter steelmaking technology shattered the myth of rail demand.", "zh": "最终的成功绝对不代表道路是一帆风顺，熟铁危机前铁路资产狂欢持续了四年，然后被转炉炼钢技术击毁了铁轨需求的神话。"}, {"start": 292.0, "end": 304.0, "text": "Before Tesla's alternating current and synthetic plastics were widely applied, the early electricity stock boom lasted six years, and before the internet crisis broke out, the network and fibre carnival lasted five years.", "zh": "在特斯拉交流电与合成塑料被大规模应用之前，早期的电力股繁荣持续了六年，互联网危机爆发之前，网络与光纤狂欢持续了五年。"}, {"start": 304.0, "end": 311.0, "text": "So how long can this AI rally, propped up by hyping bottlenecks, last? Certainly not too long either.", "zh": "那么这次靠炒瓶颈撑起来的AI行情能够挺多久呢？一定也不会太久。"}, {"start": 311.0, "end": 323.0, "text": "Where has the new technology that cracks the computing bottleneck got to? It cannot be seen yet, but it will come soon, and once it arrives, it will be creative destruction like a dead tree pulled down with ease.", "zh": "破解算力瓶颈的新技术走到哪里了呢？现在看不出来，但是会很快，而且一旦来了，就是摧枯拉朽般的创造性破坏。"}, {"start": 323.0, "end": 333.0, "text": "And after the AI infrastructure frenzy collapses, the future AI giant applications that will truly shine may well still be struggling to start up in some small warehouse today.", "zh": "而等到AI基建狂热崩盘之后，未来那些将要真正大放异彩的AI巨无霸应用，如今说不定还在哪个小仓库里面艰难创业呢。"}, {"start": 333.0, "end": 344.0, "text": "We must remember the iron law verified repeatedly over hundreds of years: when a technology is so expensive that only giants can afford it, it is actually just capital dancing alone.", "zh": "我们一定要记住几百年来被反复验证的铁律：当一项技术昂贵到只有巨头才能用得起的时候，它实际上只是资本的独舞。"}, {"start": 344.0, "end": 350.0, "text": "Only when even the corner shop thinks it is not worth anything can it truly be called a new era for humanity.", "zh": "只有当它连街边小店都嫌它不值钱的时候，它才可以真正被称为是人类的新时代。"}, {"start": 350.0, "end": 364.0, "text": "Back then, the gamblers who tried to change the world saw their stocks fall 90 percent, but their judgment about the industry's prospects was not wrong at all; it is just that the road-builders went bankrupt and the car-sellers got rich, two different things.", "zh": "当年那批押注改变世界的人，手里的股票跌了90%，但是他们对行业前景的判断一点都没错，只是修路的人破产了、卖车的人发财了，两码事。"}, {"start": 364.0, "end": 370.0, "text": "The market finally proving you right, and whether the market killed you midway, are also two different things.", "zh": "市场最后证明你是对的，和市场中途有没有把你弄死，也是两码事。"}, {"start": 370.0, "end": 378.0, "text": "Technological revolutions never let all of humanity down, but each time they need to find a batch of the most fanatical gamblers to pay the bill first.", "zh": "技术革命从来都不会辜负全人类，但是它每次都需要找到一批最狂热的赌徒，先把单给买了。"}, {"start": 378.0, "end": 386.0, "text": "Well, friends, that is all for today's topic; thank you all for watching and for your likes and support, I am Tangshan Laowang, see you next time.", "zh": "好了，朋友们，关于今天的话题，我们就聊这么多，感谢大家的观看和点赞支持，我是汤山老王，我们下期再见。"}]}, {"slug": "sec1", "title": "Beijing Home Prices Still Falling — Section 1: Districts — Haidian, Chaoyang, Fengtai, Tongzhou", "mp3": "beijing-housing/sec1/sec1.mp3", "dur": "9:26", "lines": [{"start": 0.0, "end": 2.32, "text": "Today is Sunday, October 18th.", "zh": "今天是周日，今天是10月18日。"}, {"start": 2.32, "end": 5.12, "text": "Today's episode comes from a message a viewer left us.", "zh": "我们今天来说一期节目，是一个网友给我们留言。"}, {"start": 5.12, "end": 15.12, "text": "His exact words were: could you talk about whether there are any second-hand homes in Beijing whose prices have stopped falling, and what to watch out for when buying a second-hand home?", "zh": "他的原话是说，能不能讲一讲北京现在有没有止跌的二手房，或者买二手房购买时注意的事项。"}, {"start": 15.12, "end": 22.4, "text": "Some people say, what's there to talk about? Nothing has stopped falling; they're all more or less the same, all still falling.", "zh": "有人说，这个有啥可说的，没有止跌的，都大差不差，都在跌。"}, {"start": 22.4, "end": 26.8, "text": "But today we'll go through the main districts one by one, and specific areas within them.", "zh": "但是我们今天分几个主要城区跟大家来说一说，还有具体的板块。"}, {"start": 26.8, "end": 30.72, "text": "The second question is what to watch out for when buying a second-hand home.", "zh": "第二个问题，就是二手房购买时注意的事项。"}, {"start": 30.72, "end": 34.72, "text": "First of all, we've actually been doing this show for nearly two years now.", "zh": "我们首先，现在我们其实做了将近两年节目了。"}, {"start": 34.72, "end": 42.8, "text": "Our core message throughout has been to advise everyone: don't make a move, or first do your research, first wait and see.", "zh": "宗旨呢，核心思想就是劝大家，不出手，或者是你先研究，先观望。"}, {"start": 42.8, "end": 45.84, "text": "In short, we're still advising everyone not to buy.", "zh": "那么就是，还是劝大家不要买。"}, {"start": 45.84, "end": 50.16, "text": "Why do we update the actual transaction prices everyone cares about every day?", "zh": "为什么每天要更新大家关心的实际的成交价格？"}, {"start": 50.16, "end": 71.28, "text": "Because this information — whether in mainland China, or for ordinary homebuyers in the UK, Europe, or the US — may look transparent on paper in some places, but if you, as an ordinary person, don't do the analysis, don't follow the specific area and the specific development, it's actually very hard to know what the market trend really is.", "zh": "因为这个信息，就在中国大陆也好，或者说我们就是普通的买房人，不管是在英国、欧洲还是美国，有的地方是形式上很透明，但是真正的老百姓，你不去做分析，你不去跟这个板块，不去跟这个楼盘的话，其实你也很难知道它是一个什么样的行情走势。"}, {"start": 71.28, "end": 75.44, "text": "And we know that abroad, although house prices are public, the data lags.", "zh": "而且其实我们知道，在国外，他的房价虽然说是公开的，但是它是滞后的。"}, {"start": 75.44, "end": 81.2, "text": "It comes a step late, possibly lagging by two years, and usually a lot of it isn't even accurate.", "zh": "他就是晚这么一手，可能滞后两年，而且通常呢，很多还不准确。"}, {"start": 81.2, "end": 91.12, "text": "Take myself: I bought a house in the UK, and when I later looked at the public records, none of them matched exactly the actual price I paid, the real money I handed over.", "zh": "我自己就是，我在英国买的房子，那我后来再去看公开的资料呢，没有特别跟我的那个实际的购买、真金白银掏出钱的购买价格是一模一样的。"}, {"start": 91.12, "end": 95.68, "text": "Because there are many different calculation methods — the statistical basis differs.", "zh": "因为它里面有很多计算方式吧，口径不同。"}, {"start": 95.68, "end": 98.32, "text": "In mainland China, it's even harder now.", "zh": "那在中国大陆呢，就现在就更难。"}, {"start": 98.32, "end": 104.24, "text": "Everyone knows prices have fallen; if you ask an agent, the agent will tell you roughly what the transaction price is.", "zh": "大家都知道跌了，你去问中介，中介也会告诉你，大概成交是一个什么样的价格。"}, {"start": 104.24, "end": 107.68, "text": "But this kind of information disclosure is far too passive.", "zh": "但是呢，这种信息披露呢，就太被动了。"}, {"start": 107.68, "end": 112.16, "text": "So our show tells everyone: don't buy, and tells you what the situation is right now.", "zh": "所以说我们的节目就是告诉大家，不买，告诉你现在是一个什么形势。"}, {"start": 112.16, "end": 124.24, "text": "From the housing situation, you look at the overall macroeconomic picture; how ordinary people manage the little money they have, and their financial planning and risk management for the next 20 years, are all very important.", "zh": "由房产的形势，你看整体宏观的经济的状况，老百姓自己手里这点钱，和今后20年的财务的规划，风险管理，都是非常重要的。"}, {"start": 124.24, "end": 125.68, "text": "So watch our show more.", "zh": "所以多看我们节目。"}, {"start": 125.68, "end": 132.24, "text": "Today I've also made some small notes — let's talk about whether there are any homes in Beijing whose prices have stopped falling now.", "zh": "那我们今天也是做了一个小的笔记，我们来说一说，讲讲现在北京有没有止跌的房子。"}, {"start": 132.24, "end": 140.24, "text": "I've picked out the main districts — Chaoyang, Haidian, Tongzhou, and Fengtai — and we'll look at each of these four districts in turn.", "zh": "我们呢，我自己是拿出主要几个城区，就是朝阳、海淀、通州和丰台，我们来分别看看这四个城区的情况。"}, {"start": 140.24, "end": 143.52, "text": "There's no district where prices have stopped falling across the board.", "zh": "没有说全区统一都止跌的。"}, {"start": 143.76, "end": 149.2, "text": "These four places all have decent transaction volumes, and ordinary people pay a lot of attention to them.", "zh": "我说这四个地方都算是成交不错的，老百姓比较关注的。"}, {"start": 149.2, "end": 157.92, "text": "If you were thinking of buying somewhere yourself, transactions are basically concentrated in these areas — they're relatively hot, and their developments get a lot of attention.", "zh": "后来你可能自己就想买个地方，基本上成交主要集中在这几个地区，比较火热，楼盘都比较受关注。"}, {"start": 157.92, "end": 161.6, "text": "Name any one of these places — even if you've never been there, you've heard of it.", "zh": "我说一个地方，你没去过，你也都知道这样的一个地方。"}, {"start": 162.16, "end": 168.48, "text": "Only a small number of so-called quality homes are exceptions, and we'll talk in a moment about why they aren't falling.", "zh": "那只有一些少数的所谓我们所谓的优质房源，但我们一会儿来说说它为什么不跌。"}, {"start": 168.48, "end": 172.4, "text": "But most ordinary older homes are still sliding down slowly.", "zh": "就大多数的普通的老房子还是在阴跌。"}, {"start": 172.48, "end": 177.6, "text": "Let's start with Haidian. In Haidian, the homes that have stopped falling are a minority.", "zh": "我们先看海淀，海淀是止跌的，是少数。"}, {"start": 177.6, "end": 184.48, "text": "We've summed it up: in core areas like Wanliu, Zhongguancun, and Shangdi, everyone knows why — for the children's schooling.", "zh": "我们总结了一下，像万柳、中关村、上地的核心区域，大家都知道为了什么，为了孩子上学。"}, {"start": 184.96, "end": 194.08, "text": "So homes with so-called top school-district status, newer buildings, and relatively square layouts — these newer homes — hold up better against price falls.", "zh": "那么带优质的所谓优质学区的，楼龄较新的，户型呢，所谓比较方正的次新房，它就比较抗跌。"}, {"start": 194.08, "end": 199.52, "text": "But let me tell you, from another angle, they have no transaction volume at all — it's dead still water.", "zh": "但是我告诉你，如果从另外一个口径来说，它也没有成交量，死水一潭。"}, {"start": 199.52, "end": 201.68, "text": "You can understand what that means, right?", "zh": "大家能够理解这个意思吧。"}, {"start": 201.68, "end": 208.16, "text": "For these so-called quality homes, transactions over the past six months show unit prices have basically held steady.", "zh": "那这种所谓的优质房源，近半年的成交呢，单价基本上就是稳住了。"}, {"start": 208.16, "end": 216.08, "text": "In half a year there might be one sale, or five sales — for one compound, one development, five sales in half a year is already a lot.", "zh": "就是半年可能来一套，来五套，就说一个小区，一个盘，来五套，这就已经非常多了。"}, {"start": 216.64, "end": 219.84, "text": "All the agents, all the property brokers are helping sell it.", "zh": "所有的中介，所有的房产经纪人都在帮它卖。"}, {"start": 219.84, "end": 222.24, "text": "That's a pace of about one sale a month.", "zh": "那就是一个月成交一套这样的节奏。"}, {"start": 222.24, "end": 224.8, "text": "And its price is probably just at that level.", "zh": "它可能价格也就是那个样子。"}, {"start": 224.8, "end": 227.76, "text": "Because it has a very, very small buyer pool.", "zh": "因为它是有极少数极少数的客群。"}, {"start": 227.76, "end": 232.0, "text": "Those buyers think: I just want this particular home, so I can accept this price.", "zh": "那我就想要这个房子，那我就能接受这个价格。"}, {"start": 232.56, "end": 241.68, "text": "They feel that compared with two years ago — wow, it's down 40%, even around 55% — so they think it's great value, and they go ahead and buy.", "zh": "他们就觉得比前两年来说，哇，跌了40%，甚至55%左右，那他们觉得就很值啊，所以就下手了。"}, {"start": 241.68, "end": 245.28, "text": "But how many such buyers are there? They're not representative at all.", "zh": "但是这样的客群又有多少呢？这些没有什么代表性。"}, {"start": 245.84, "end": 250.4, "text": "Look at it this way: these homes have basically no room for price negotiation.", "zh": "那我们看，这种房子呢，就没有什么议价空间。"}, {"start": 250.4, "end": 258.0, "text": "Let me tell you why: many of these sellers aren't the original owners — they're selling at a loss; it's only a question of how much they lose.", "zh": "我告诉大家为什么，就是因为很多也不是一手业主，都是赔着卖的，只是赔多少的问题。"}, {"start": 258.56, "end": 262.8, "text": "What room for negotiation can you talk about with them? They're already selling at a loss.", "zh": "你跟他讲什么议价空间，他本来就是赔着卖的。"}, {"start": 263.44, "end": 285.84, "text": "And then there are the older, run-down small homes on Haidian's edges — the old, run-down small homes in Shangdi we used to talk about, the old public housing without school-district status, some around Qinghe and Xiaoying, the developments further out, and the ones further out on the Western Hills side — they're all cutting prices to get sales, selling at reduced prices, and prices just won't hold.", "zh": "那还有呢，像海淀的一些边缘的老破小，我们原来说的这个上地的这种老破小啊，没有学区的这种老公房啊，像清河、小营这一带也有一些，就远一点的楼盘，还有就是西山这边远一点的楼盘，就是以价换量，降价卖房，价格稳不住。"}, {"start": 285.84, "end": 291.28, "text": "Look at the rate of decline: basically falling 5% or 8% a year — and that's the good case.", "zh": "你看它的这个降幅，基本上一年5%、8%这样的跌，这都是好的啊。"}, {"start": 291.92, "end": 299.12, "text": "Now let's look at Chaoyang. The areas I've picked out are Wangjing, Panjiayuan, Yayuancun, and Shuangjing.", "zh": "我们再看看朝阳啊，朝阳呢，我拿出来看，望京、潘家园、亚运村、双井。"}, {"start": 299.12, "end": 306.08, "text": "Of these, let's first look at Wangjing and Panjiayuan: they've actually already fallen a lot — the falls have been brutal.", "zh": "其中我们先看望京和潘家园，其实跌得已经可以了，就是已经跌得很惨烈了。"}, {"start": 306.08, "end": 309.76, "text": "And now, they've paused for a bit, caught their breath, you know?", "zh": "然后到现在呢，就是止一止，歇一歇，你知道吗？"}, {"start": 309.76, "end": 316.16, "text": "It's like playing a video game: you recover a bit of health, save up a little, and then keep falling — that's what it means.", "zh": "就像打游戏似的，你在回血，然后存一点血，然后再继续跌，就这个意思。"}, {"start": 316.72, "end": 319.52, "text": "It keeps falling — cutting prices to get sales.", "zh": "继续地在跌，就是以价换量。"}, {"start": 320.08, "end": 323.28, "text": "As for Yayuancun, transactions there aren't good.", "zh": "那亚运村呢，就成交不太好。"}, {"start": 323.28, "end": 336.24, "text": "Overall transactions — look, Wangjing, Panjiayuan, Yayuancun, and Shuangjing are all places in Chaoyang that ordinary people pay a lot of attention to; you could call them the core of the core of Chaoyang.", "zh": "成交的整体的，你看我拿出望京、潘家园、亚运村、双井，这都是朝阳算是，就老百姓比较关注的地方了，算是朝阳的核心中的核心了。"}, {"start": 336.24, "end": 340.88, "text": "But Yayuancun, compared with the other three locations, has poor transactions.", "zh": "但是亚运村呢，就在这三个，其他的三个位置比较的，它成交不好。"}, {"start": 340.88, "end": 345.84, "text": "The homes themselves are actually good — many are near the subway, newer, and the amenities are good too.", "zh": "房子其实不错，好多都是什么，临地铁的，次新的，然后配套也不错。"}, {"start": 346.24, "end": 359.68, "text": "Think about it: in Yayuancun, needless to say, there are banks, commercial amenities, it's quite safe, and it's often close to the Olympic Bird's Nest, so security there is very good, the roads are good, and there's not much traffic congestion.", "zh": "你想，亚运村这边不用说，就是银行啊，商业配套啊，又比较安全，而且它离着，很多时候离着奥运鸟巢啊，这边安防级别也非常好，然后路况也好，不怎么堵车。"}, {"start": 359.68, "end": 368.48, "text": "So for these upgraded commodity homes — good layouts, good floors, quality homes — prices have held steady, but there are no transactions. That's the situation.", "zh": "那这种改善的商品房，好户型，好楼层，优质房源，价格稳住，没有成交，就是这样一个状况。"}, {"start": 369.04, "end": 382.64, "text": "And then, look at areas like Jiuxianqiao and Dingfuzhuang: large communities without school-district status, or old run-down small homes, or old tower blocks — high-density communities like these have a very large number of listings.", "zh": "那还有呢，再看看就是像酒仙桥，定福庄这片区也可以吧，就是没有学区的这种大社区，或者老破小，或者老塔楼，高密度的这种社区，挂牌，挂牌量呢，非常大。"}, {"start": 383.2, "end": 387.2, "text": "Owners who genuinely want to sell are offering very good prices.", "zh": "业主呢，只要是诚心卖的，价格给得都非常好。"}, {"start": 387.2, "end": 396.16, "text": "We talked about Gaojiayuan before, didn't we? The tower block in Gaojiayuan we mentioned a couple of days ago is similar — it's also sliding down slowly.", "zh": "我们之前说的是不是高家园啊，前两天说高家园的那个塔楼，也类似这种，就是在阴跌。"}, {"start": 396.16, "end": 399.12, "text": "But we think there's still a big chance it could fall another 20%.", "zh": "但是我们认为它还是有很大的，就是还有很大的可能性，百分之二十可能还是往下走。"}, {"start": 400.16, "end": 403.44, "text": "So just keep watching, and watching, and watching.", "zh": "随着你就再再再再看看吧。"}, {"start": 403.44, "end": 407.36, "text": "Even if you go house-hunting now, there should be no shortage of homes to choose from.", "zh": "你就算即便现在去选房，你能够选的房源，应该也不老少。"}, {"start": 407.92, "end": 423.84, "text": "Now Fengtai — we've been talking about it for the past couple of days: in areas like Lize, Caoqiao, and the Headquarters Base, homes that are near the subway and newer, good quality, with manageable holding costs, can basically hold their prices, and there are some steady transactions.", "zh": "那丰台呢，丰台我们前两天一直在说，像丽泽啊，草桥啊，总部基地这块呢，地铁加上次新的这种房子，品质好，持有成本还可以，价格基本上是能稳住，然后有一些稳定的成交。"}, {"start": 424.4, "end": 430.64, "text": "Because compared with Haidian in the north and the northern urban areas we just talked about, their prices aren't on the same level at all.", "zh": "因为这些房子呢，和我们刚才说的北边的海淀和北部城区来说呢，它的价格就还不是一个水平的。"}, {"start": 431.2, "end": 439.6, "text": "Now, some people are still waiting and watching, and they want to look at commercial-residential properties — commercial-residential homes in this area are quite popular.", "zh": "那我们现在看，有一些人还在观望啊，而且呢，还想看一下什么商业住宅，就这边的商业住宅也是比较受欢迎的。"}, {"start": 439.6, "end": 447.44, "text": "Because commercial-residential prices have fallen quite a bit — some are now at unit prices of just over 20,000 yuan, and they're still falling.", "zh": "因为商业住宅现在跌的，跌得不小，基本上有的就两万多这样的这种单价，现在还在跌的呢。"}, {"start": 448.0, "end": 459.84, "text": "In Fengtai, further down south, there are old public housing units along the West Fourth Ring Road, places without subway access, with many listings, larger room for negotiation, and plenty to choose from.", "zh": "就是丰台的，再往下就是南部了，西四环的这种老旧的公房，还有没有地铁的，然后挂盘多，议价空间也比较大，然后可选的也比较大。"}, {"start": 459.84, "end": 465.92, "text": "But ordinary people, how to put it — there just isn't that large a buyer pool to go pick homes over there.", "zh": "但是老百姓可能，怎么说就是，他也没有那么大的体量的客群，再去挑那边的房子。"}, {"start": 465.92, "end": 476.72, "text": "Because Fengtai is quite big — in the areas we just mentioned, Lize, Caoqiao, the Headquarters Base, and around there, plus places like Xihongmen, there are already plenty of homes to choose from.", "zh": "因为丰台啊，挺大的，我们像刚才说的，丽泽、草桥，总部基地，然后一带，什么西红门这些，就是能挑的房子已经很多了。"}, {"start": 476.72, "end": 491.52, "text": "Or to put it another way: ordinary people can afford to buy now, but holding onto their wallets, they're too afraid — afraid that if they buy this year, next year prices will drop back by 200,000 or 300,000 yuan — so everyone is quite cautious now.", "zh": "说不然老百姓呢，买得起了现在，但是买得起呢，捂着这个兜呢，太害怕，害怕，我今年买了，明年又倒回去，二十万，三十万，所以说大家现在就比较谨慎嘛。"}, {"start": 493.44, "end": 495.76, "text": "Tongzhou — Tongzhou is still grinding along the bottom.", "zh": "通州，通州就还是在磨底。"}, {"start": 495.76, "end": 500.88, "text": "Tongzhou's falls have been very large; only a very small range of places can hold steady.", "zh": "通州的跌幅非常大，极小的范围是可以稳住的。"}, {"start": 500.88, "end": 513.28, "text": "For example, the compounds near Beiguan subway station, like that K2 one — K2 Baihewan, I think — the compound on the northwest side near Gengzhuang Bridge, that's K2 Baihewan, I believe.", "zh": "比如说北关地铁的小区，像那个K2，K2百合湾吧，就是这个在耿庄桥那边的西北角的那个小区，是K2百合湾吧。"}, {"start": 513.28, "end": 519.68, "text": "This compound fell quite a lot before, and now it has somewhat stopped falling — it can't really fall much further.", "zh": "像这个小区呢，之前跌得挺多，然后现在呢，有点跌不动了。"}, {"start": 519.68, "end": 524.88, "text": "And before, when prices were falling sharply, there were actually quite a lot of transactions.", "zh": "然后呢，之前呢，也成交的，就大跌的时候，其实成交得挺多的。"}, {"start": 524.88, "end": 530.16, "text": "But later it turned out that didn't work — the price couldn't be held, and it kept falling.", "zh": "但是后来才发现不行，这个价格搂不住，还在往下跌。"}, {"start": 530.16, "end": 537.12, "text": "But by this point, fewer and fewer people were willing to take over, inventory was still quite large, and prices were still falling.", "zh": "但是这个时候接盘的人就越来越少了，你库存还是挺大，然后还在跌的。"}, {"start": 537.12, "end": 548.08, "text": "And in Tongzhou's outer areas, some older compounds, super-large just-need developments like Huaye Dongfang Meigui, are still sliding down slowly, and inventory is large.", "zh": "你就是这些通州外围啊，一些老小区啊，超大的刚需盘，比如说华业东方玫瑰这种，就还是在阴跌，然后库存又大。"}, {"start": 549.12, "end": 556.48, "text": "Many owners are actually quite anxious: even if they cut prices, there isn't a large enough buyer pool to absorb homes in those locations.", "zh": "很多业主呢，其实挺着急的，他即便是把价格打下去了，他没有那么大的客群去承接那个这个位置。"}, {"start": 556.48, "end": 565.68, "text": "So Tongzhou as a whole is far from finished falling; there are plenty of basic homes — take your time picking, though they don't really hold their value. Anyway, that's how it is.", "zh": "所以说通州啊，整体远没有跌完，就简陋的房源多，你就慢慢挑吧，当然也不怎么保值，反正就是这样子。"}]}, {"slug": "sec2", "title": "Beijing Home Prices Still Falling — Section 2: Budget, eligibility, loans and real prices", "mp3": "beijing-housing/sec2/sec2.mp3", "dur": "8:53", "lines": [{"start": 0.0, "end": 12.08, "text": "There's another thing: I don't know about this friend — listening to his question, I get the feeling he may not know Beijing's housing market very well, or maybe he just asked casually and didn't care much about how he phrased the question.", "zh": "还有就是很多，我不知道这位朋友呢，我听他那个问题呢，我就感觉，有可能他不是很了解北京的房源，也有可能是他随便问了一下，没有太在乎这种提问的方式。"}, {"start": 12.08, "end": 19.92, "text": "But I still want to remind everyone: prices stopping their fall does not mean they'll immediately rise — so stop thinking about prices going up.", "zh": "就是我还是要提醒大家，就止跌，它不是说就马上涨价啊，就是你不要再想这个什么涨价的事了。"}, {"start": 19.92, "end": 27.76, "text": "In China, in Beijing, prices have stopped falling — but from when they really started falling until now, it's actually been nearly four years.", "zh": "中国，北京止跌了，从到现在来说，其实从真正开始跌，到现在我们说，其实是应该也将近4年的时间。"}, {"start": 27.76, "end": 39.12, "text": "At first some people didn't know, then they refused to admit it, then they knew but stubbornly still refused to admit it, and finally everyone silently accepted it — and now it's become a fact everyone can openly discuss.", "zh": "就是刚开始有的人不知道，然后是不承认，然后是知道了，嘴硬还是不承认，到最后大家默默地接受了，到现在就已经变成大家就公开可以谈论的事实啊。"}, {"start": 39.68, "end": 45.52, "text": "Homes have lost money, they've gotten cheaper, prices have dropped — there's been a process to it.", "zh": "房子就是亏了，我就是便宜了，就是降价了，就这样有个过程的。"}, {"start": 45.52, "end": 50.0, "text": "Even the way information and public opinion have been presented has gone through a process.", "zh": "就信息的这种舆论宣传也是有个过程的。"}, {"start": 50.0, "end": 57.76, "text": "But we think it's basically been four years — and four years is far from enough for Beijing's homes to be pulled back down the way they went up.", "zh": "但我们觉得基本上还是4年的时间，4年的时间远不止，就北京的房子怎么涨上去的，再怎么给它拉下来。"}, {"start": 57.76, "end": 66.48, "text": "Now let's look at the pitfalls to avoid in second-hand home transactions — as we say, we ordinary people are paying out of our own pockets, with real money.", "zh": "那我们看看就是二手房交易的避坑，就咱们说，咱老百姓咱自己掏兜，真金白银地拿出钱来。"}, {"start": 66.48, "end": 69.04, "text": "First of all, you need to be clear about your budget.", "zh": "首先第一个啊，就是你要清楚预算。"}, {"start": 69.04, "end": 76.64, "text": "And don't easily tell agents your budget, because agents often start by asking, in this area — hey, what's your budget? Don't fall for that.", "zh": "你的预算呢，不要轻易地告诉中介，因为中介经常上来就是，这个区域，哎，那您这个预算是多少钱，你不要，就是不要上他们这个套。"}, {"start": 77.2, "end": 81.36, "text": "Don't tell them your real budget — that is, don't tell them how much you want to spend.", "zh": "不要把你真正的预算告诉他们，也就是不要告诉他们你想花多少钱去买。"}, {"start": 81.92, "end": 88.64, "text": "Also, work out your own numbers — don't stretch your cash flow beyond its limit; that's the easiest pitfall to fall into.", "zh": "另外你自己这个账算好，就是说不透支现金流了，这是最大容易踩坑的事。"}, {"start": 88.64, "end": 95.84, "text": "Especially the young people who bought homes in the 2023 wave — the physical and psychological pressure they're under now is really enormous.", "zh": "尤其是2023年这波年轻人买房子，其实现在真的是这个身体和这个心理上承受的压力啊，非常大。"}, {"start": 96.4, "end": 103.68, "text": "They're now repaying their mortgages by overdrawing, and there's nothing they can do about it — though those who can still repay are dutifully repaying.", "zh": "就现在都在透支的这样子还房贷，那也没有办法，反而能还的还是在本本分分地还。"}, {"start": 104.24, "end": 117.44, "text": "As for the monthly mortgage payment not exceeding some percentage of household after-tax income — we won't go into that; you can just look up basic financial common sense online: 30%, and keep enough household emergency funds, and so on.", "zh": "那像月供啊，不超过家庭税后收入的多少多少，这个我们都不说了，你可以随便去找一些，网上去找一些这种，就是财务的这种，30%吧，我告诉大家，就是财务的这种基本的，叫什么，就是常识去看一看啊，你基本上有一个常识，30%，然后留够多少家庭的备用金等等。"}, {"start": 117.44, "end": 122.72, "text": "But these rules may not fully fit the financial structure of middle-class families in mainland China today.", "zh": "但是这些可能并不完全就是符合中国大陆的这些中产，现在的家庭的这种财务结构。"}, {"start": 122.72, "end": 127.2, "text": "And don't put all your cash into the down payment, especially if it's your first home purchase.", "zh": "然后，就是别把所有现金都砸到首付里面，尤其是你第一次买房子。"}, {"start": 127.76, "end": 137.68, "text": "For example, your child may need to start school, you might lose your job, you might fall ill — and if your mortgage payments stop, it could affect the down payment you've already made.", "zh": "比如说你孩子要上学呀，自己的可能失业呀，可能生病啊，房子断供可能都会影响到你的首付啊。"}, {"start": 137.68, "end": 143.52, "text": "And there's also the direct loss — if you pay too much down payment upfront, you may find you can't hold on.", "zh": "还有呢，就是直接亏，就是直接你这个首付可能就付得太多嘛，你就有点撑不住啊。"}, {"start": 143.52, "end": 154.72, "text": "The second point, and I really want everyone to pay attention to this, is that buying a home in mainland China has a special rule: they check your home-purchase eligibility — your credit record, your bank statements.", "zh": "第二点呢，就是我想，大家就一定要注意，尤其是在中国大陆买房子，它是一个特殊的规矩，就是要查你的购房资格，就是你的征信呢，银行流水啊。"}, {"start": 155.36, "end": 162.32, "text": "Usually, you give your ID card to the agent, or you just swipe your ID card, and everything can be seen, and they'll print you a statement.", "zh": "一般的，你把身份证给中介，或者一般我们拿身份证去一刷，全部能够看到，他会给你打一个单子。"}, {"start": 162.32, "end": 170.72, "text": "Including any overdue payments in the past twenty years — overdue consumer payments, overdue mortgage payments, overdue payments on all kinds of loans.", "zh": "包括你近二十年内的逾期，就是消费的逾期，房贷的逾期，各种贷款的逾期。"}, {"start": 170.72, "end": 183.12, "text": "For example, a relative of mine: in 2022 he planned to buy a home, so he went to check, and — hey — he actually had one overdue payment. He'd simply forgotten to repay it; he just hadn't managed it well.", "zh": "我像我家一个亲戚就是，他在2022年的时候，然后呢，打算买房子，然后他就去查了一下，哎，他居然有一期的逾期，其实就是忘了还了，就是没搞好嘛。"}, {"start": 183.12, "end": 194.72, "text": "He didn't want to deposit all the money at once — he wanted to deposit it month by month, and didn't want to put a whole year's mortgage payments in at once, since he wanted to earn interest — and as a result he messed this up.", "zh": "他又不想把钱当时都存在里面，就是每年每个月去存一次，然后不想一年把这个房贷全存进去，还想赚利息嘛，结果可能就没搞好这个事。"}, {"start": 194.72, "end": 198.08, "text": "And just that one time got recorded, very clearly.", "zh": "哎，就这一次还被记上了，非常清楚啊。"}, {"start": 198.08, "end": 205.52, "text": "But it doesn't really matter — banks now still want you to borrow more; they want ordinary people to take on leverage. So that's just how it is.", "zh": "但是这也无所谓啊，银行现在还是希望你能够多贷款的，能够希望老百姓接杠杆的，所以说这个就是那么个形式。"}, {"start": 205.52, "end": 210.72, "text": "But do watch out — don't have too many of these problems; they're really annoying sometimes.", "zh": "但你要注意，就不要太多这种问题，挺恶心人的，有时候。"}, {"start": 210.72, "end": 216.56, "text": "And then, often, what happens is that many people pay a deposit, and then their loan doesn't get approved.", "zh": "然后很多呢，但有的时候呢，是什么，就是很多人交了定金之后，贷款批不下来。"}, {"start": 216.56, "end": 229.84, "text": "For example, the level of your housing provident fund contributions: if you work in the public system, your contributions should be very stable — with 15 years or 10-plus years of service, your contribution record looks very good.", "zh": "比如说你公积金的缴存的程度，如果你是体制内的，那你公积金缴存应该是非常稳定的，你15年工龄、10年工龄以上，你的公积金缴存的这个记录是非常漂亮的。"}, {"start": 229.84, "end": 248.4, "text": "But if you work in a private company and may have changed jobs three or four times, your provident fund contributions themselves may not be high, and there may be gaps in your social insurance payments — within the five insurances and one fund, including the provident fund, gaps in social insurance and provident fund payments don't look so good.", "zh": "但如果你是私企，可能换过三四次工作了，公积金本身缴的就不高，然后可能还有社保的断缴，就五险一金里面，就包括公积金，你的社保的这个断缴，公积金的断缴，就看起来不是那么漂亮。"}, {"start": 248.4, "end": 266.96, "text": "You can't borrow that much money — provident fund loans themselves don't lend that much. What's the maximum now — 1.2 million yuan? It used to be 800,000, then 1.1 million for civil servants, and central-government civil servants got 1.2 million. I don't know if it's been raised further since.", "zh": "你就贷不了那么多钱，本身公积金贷款就贷不了多少钱出来，现在是多少，最高是120万吗，原先是80万，然后110万，公务员，然后中央级公务员给到120万，现在我不知道是不是还继续往上抬。"}, {"start": 266.96, "end": 273.68, "text": "But for people buying homes in Beijing, many can't use the provident fund, because the provident fund loan amount is too small.", "zh": "但是对于在北京买房子的人，很多他用不了公积金，因为公积金贷款额度少了。"}, {"start": 273.68, "end": 290.48, "text": "Here's a new piece of information for everyone: last month there was this loan subsidy, wasn't there? We looked into it: in Beijing, it only subsidizes a loan of 1 million yuan — for example, if you borrow 1 million, they'll subsidize it, and it seems the rate after subsidy is 2.2% interest.", "zh": "还有给大家一个新的信息，就大家看这个上个月不是有这个贷款补贴吗，那我们也是去了解了一下，在北京它只是给你补贴贷款100万的部分，比如说你要贷100万，他会给你补贴，好像现在是2.2%，就补贴完是2.2%的这个利息。"}, {"start": 290.48, "end": 299.44, "text": "That's very tempting, but it's very limited — it only subsidizes your 1 million loan, and the rest follows the normal commercial or provident fund loan interest rate.", "zh": "那非常诱人，但是它非常少，它只补你贷100万，后边你正常的这个商业，或者是什么公积金的这个贷款利率去走。"}, {"start": 299.44, "end": 303.28, "text": "So actually you don't save that much money — it's just for show.", "zh": "所以说其实省也省不了太多钱，就是那么个形式。"}, {"start": 303.28, "end": 308.96, "text": "Also, when you're buying a home, look at real transaction prices — just watch our show more.", "zh": "另外呢，就是你在买房的时候，看真实的成交价，你就多看我们节目吧。"}, {"start": 308.96, "end": 320.0, "text": "Listing prices are definitely not to be trusted: basically, take the listing price and subtract at least 8% to 12%, or even 15%, and that's its real transaction price.", "zh": "挂牌价肯定是不可信的，基本上挂牌价，你再减去个，至少你给他们减去8%到12%，然后甚至15%，是它真实的成交价。"}, {"start": 320.0, "end": 324.48, "text": "But you can't just apply this mechanically — you still have to look at the specific home.", "zh": "但是这个也不能机械地就现成地那么去算，你还要看具体是哪个房源。"}, {"start": 324.48, "end": 330.72, "text": "Watch our show more, or tell us which developments you want to know about, and we'll investigate and tell you a transaction price.", "zh": "多看我们节目，或者是给我们提，你想知道的那些楼盘，然后我们都会去排查，去给你告诉你一个成交价。"}, {"start": 331.28, "end": 334.56, "text": "The listing prices agents quote you are all relatively high.", "zh": "中介给你画的这个挂牌价，他都是比较高的。"}, {"start": 334.56, "end": 344.08, "text": "But fortunately, agents now — I think they must have had new training, because not long ago I went back to Beijing and stayed for a week, and did some on-the-ground visits with agents.", "zh": "但是好在，现在中介，我觉得他们应该是接受了新的培训，因为我不是前一阵回北京，也待了一周嘛，然后跟中介有一个实地的前线的这种探访。"}, {"start": 344.08, "end": 355.52, "text": "In the past, I trained them — in the early years I gave them training on marketing techniques, like their 'million-yuan sales' programs, training for their senior salespeople — so we know they have training programs.", "zh": "我从前因为我培训过他们，就是早年给他们做就是营销的进化的培训，就他们这个什么什么百万销售啊，这种就给他们那些高级销售去做培训，所以我们知道他们会有一些培训计划。"}, {"start": 355.52, "end": 360.24, "text": "Actually all salespeople have training programs, whether they sell clothes or furniture.", "zh": "其实所有的销售都有培训计划，不管是卖衣服的还是卖家具的，都有。"}, {"start": 360.24, "end": 365.76, "text": "I think they must have had new training, because their line now is: tell you the price, tell you the actual price.", "zh": "我觉得他们应该是做了新的培训，因为他们的口径现在变成什么呢，就是告诉你价格，告诉你实际的价格。"}, {"start": 366.24, "end": 377.28, "text": "Whether you're here to sell a home or to buy one, they'll tell you the home's actual current price — so the moment ordinary people walk into the shop, within two minutes, as soon as you ask the price, it sobers you right up.", "zh": "不管你是来卖房的还是来买房的，都会告诉你现在这个房子的实际的价格，让老百姓就一下子进店啊，两分钟，你只要问价格，一下子就给你打清醒。"}, {"start": 377.84, "end": 379.52, "text": "They don't let you hold any illusions.", "zh": "不要让你抱任何的幻想。"}, {"start": 380.08, "end": 384.08, "text": "Owners shouldn't quote high prices — you definitely won't sell.", "zh": "业主不要报高价，你肯定卖不出去啊。"}, {"start": 384.08, "end": 395.2, "text": "And buyers, don't think you can grab a bargain either — on the contrary, the price now is just the price: if you're willing to buy, buy; otherwise, look for other homes, homes in other communities.", "zh": "然后呢，买家呢，你也不要就说想着说能占什么便宜，反而现在这个价格就是这个价格，你愿意买就买，要不然你就再找其他的房源，其他社区的房源。"}, {"start": 395.76, "end": 401.76, "text": "It's all very, very supposedly sincere — but actually it's also one of their tactics.", "zh": "非常非常地所谓的真诚，但其实这也是一种他们的套路。"}, {"start": 401.76, "end": 409.28, "text": "And let me tell you, in mainland China recently, I've also noticed another issue: all consumer purchases come with unconditional refunds.", "zh": "而且我告诉大家，就在中国内地最近，我也发现了一个另外一个问题，就是所有的消费无条件退款。"}, {"start": 409.84, "end": 418.72, "text": "Even when some say no returns, or that opened items can't be returned — let me tell you, as long as you ask, all services, all goods, unconditional refund.", "zh": "即便有些可能写着不能退货啊，或者是说开封不能退货，我告诉你，只要你去要求，所有的服务也好，所有的商品也好，无条件退款。"}, {"start": 419.28, "end": 425.2, "text": "Whether you ordered and paid on WeChat, or bought it on an app, or bought it in a physical store — unconditional refund.", "zh": "不管你是从微信上订的钱，订的然后转账的，或者是APP上买到的，还是在实际店里买到的，无条件退。"}, {"start": 425.76, "end": 442.64, "text": "As long as the customer asks — I'm talking about consumer goods here — as long as the customer requests a refund, we can't even ask for a legitimate reason; if there's a reason, or if they haven't used it or whatever, no nonsense at all, full refund across the board, very, very straightforward.", "zh": "就是只要客户说，我说的是这种消费品啊，只要客户要求退款，有我们都不能说正当理由，就是有理由，如果他没有使用或者怎么样，没有任何的废话，全部一律退款，非常非常痛快。"}, {"start": 442.64, "end": 448.24, "text": "Why? Because the economy now is very tight for everyone, especially as year-end approaches.", "zh": "为什么，就现在这个经济大家就非常地紧张，尤其到年底了。"}, {"start": 448.24, "end": 452.8, "text": "For ordinary people to spend money, frankly, is already very difficult.", "zh": "老百姓能花钱，说白了，就是已经非常之不容易了。"}, {"start": 452.8, "end": 465.28, "text": "And recently I went to a shop to buy clothes, in mainland China. Only when I lived in Japan did Japanese merchants thank you — they even have thank-you seasons, bowing and kowtowing to thank you for spending money at their shop.", "zh": "而且最近我也是，到一个店面去买衣服，中国大陆，我只有在日本生活的时候，只有日本的这些商家会感谢，他们还有感谢季啊，给你鞠躬磕头的，感谢你在他们这里消费。"}, {"start": 465.84, "end": 479.84, "text": "If you were once their customer, and you tell them, twenty years ago I used to shop regularly at one of your stores, which seems to have closed now, and you chat with them, they'll be very grateful — because they know how to keep old customers. Only Japan has this tradition.", "zh": "曾经是他们的顾客，你告诉他，我二十年前在你某一个店里经常消费，那个店好像撤掉了，你跟他聊一聊，他就会非常地感谢你，因为他知道留住老客户，只有在日本有这种传统。"}, {"start": 479.84, "end": 496.64, "text": "But now I've found this in mainland China too: not long ago I went to buy clothes — clothes costing just over a thousand yuan, not expensive clothes at all, just bought a lot, five or six pieces, five or six sets, more than five or six pieces — and the merchant thanked me.", "zh": "但是现在我在中国大陆也发现了，我前一阵去买衣服，一千多块的衣服，其实也不是什么贵价衣服，只不过买得多，五六件而已，五六套而已，套件而已，都不止五六件了，然后商家会感谢你。"}, {"start": 497.2, "end": 505.92, "text": "Why? Because it's rare — in a day, or a week, suddenly one day a customer like that comes along, and that alone can make their whole day's sales.", "zh": "为什么，因为可能很少，他一天或者说一星期，突然一天来了这样一个客户，可能他就一天的销量就有了。"}, {"start": 505.92, "end": 513.92, "text": "They rarely get someone who can still take out a thousand-odd yuan to buy clothes at a no-name shop — this kind of customer is rare, so they'll thank you.", "zh": "他很少有，就是还现在能够拿出千十来块钱，去一个没有什么品牌的店去买衣服，就是这种客源比较少，就是他会感谢你。"}, {"start": 513.92, "end": 520.4, "text": "All of this is something you can objectively see from the marketing side: China's overall consumer economy has changed a lot.", "zh": "这都是一种，你从营销上客观上能看到，就是中国现在整体的消费经济环境有大的改观。"}, {"start": 520.96, "end": 523.76, "text": "Of course, these things are good for customers.", "zh": "当然这些对客户来说是好的。"}, {"start": 523.76, "end": 532.96, "text": "Let's continue: you need to really be able to bargain — although now you may not even need to bargain, because agents will directly tell you what the price is, as long as you ask.", "zh": "我们接着来说，就是你要真正能去砍价，然后呢，当然你现在的可能也不需要砍价了，因为中介就直接告诉你房价是多少钱了，只要你去问。"}]}, {"slug": "sec3", "title": "Beijing Home Prices Still Falling — Section 3: Title, hukou, old homes and the buyer's market", "mp3": "beijing-housing/sec3/sec3.mp3", "dur": "5:39", "lines": [{"start": 0.0, "end": 10.64, "text": "Also, title verification — this is the top priority: things like seizures, mortgages, shared ownership, and so on.", "zh": "另外呢，就是产权核验，重中之重啊，这个呢，就是什么查封啊，抵押呀，什么共有产权，这些东西啊。"}, {"start": 10.64, "end": 36.4, "text": "But generally, agents nowadays handle these quite thoroughly — as long as you don't... Let me give you an example: a distant relative of my family, on the edge of Beijing, in Changping District, had an old house. Back then it was a small-property-rights house — his house might have been worth 1.3 million yuan, but in the end the buyer could only get a loan of just over 500,000 for it, because the house was old and had various issues, and he went to a local agent to handle it.", "zh": "但是这些一般现在的中介都不会太，就说，他们都会做得比较完整，只要是你不要，因为我有一个例子，就我家里呢，在有一个老的这个亲戚，就是在北京的这个边缘，就昌平区，然后有个老房子，当年还是小产权的房子，因为他那个房子可能是130万，但最终只给他贷50几万，就是他那个买家只给贷50几万，因为房子又老，然后各种情况，他就找的是地方的中介去做。"}, {"start": 36.4, "end": 53.76, "text": "Local agents, though, can sometimes sort
