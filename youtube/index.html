"zh": "首先，我想跟进一下你刚才的评论，Susan。"}, {"start": 15.09, "end": 32.47, "text": "Just around as Muse evolves and more businesses adopt agents, just wanted to get your sense of how things change and shift as you go to more permission-based and agent-to-agent transactions, and what does that really unlock over time.", "zh": "关于随着 Muse 的发展和更多企业采用智能体，你如何看待向更多基于许可的、智能体与智能体之间的交易转变，以及这长期来看真正释放了什么。"}, {"start": 32.47, "end": 62.09, "text": "Then secondly, just on expenses and CapEx, thinking about 2027, I know you're not really there yet, but if I go back to some previous comments, you've talked about maximizing compute in 2026 and 2027 and then having more flexibility in 2028. A year ago, you talked about notably larger dollar increase in 2026 than 2025, and then you've also used growing operating income on an annual basis as well.", "zh": "然后第二个问题是关于费用和资本支出，考虑到 2027 年，我知道你们还没有真正到那一步，但回顾你们之前的评论，你们谈过在 2026 年和 2027 年最大化算力，然后在 2028 年有更大的灵活性。一年前，你们谈过 2026 年比 2025 年有明显更大的美元增长，你们也一直用年度运营利润增长作为衡量标准。"}, {"start": 62.09, "end": 69, "text": "Just curious if there's any of those that you can tie or to help us think about 2027. Thanks.", "zh": "我只是好奇，你们能否把其中任何一点联系起来，或者帮助我们思考 2027 年。谢谢。"}, {"start": 69, "end": 69.8, "text": "Susan Li: Thanks, Doug.", "zh": "Susan Li：谢谢 Doug。"}, {"start": 69.8, "end": 77.05, "text": "So on your first question about how the agentic ecosystem evolves, I wish I could sort of predict that more perfectly.", "zh": "关于你的第一个问题，即智能生态系统如何演变，我希望我能更准确地预测这一点。"}, {"start": 77.05, "end": 81.85, "text": "I think it will take some time, and again, I think it will be a little uneven.", "zh": "我认为这需要一些时间，再说一次，我认为这会有些不均衡。"}, {"start": 81.85, "end": 95.43, "text": "But I definitely think that, when I use Muse today, it's clear that there are a lot of parts of the experience that would be even better if Muse was able to interact more seamlessly with business agents on the other side.", "zh": "但我确实认为，当我今天使用 Muse 时，很明显，如果 Muse 能够与另一边的商务智能体更无缝地互动，体验的许多部分会变得更好。"}, {"start": 95.43, "end": 106, "text": "For example, if Muse has to call a business on my behalf, I think it would be easier for the business if that call was handled by business agents that were representing it.", "zh": "例如，如果 Muse 需要代表我给一家企业打电话，我认为如果这个电话由代表该企业的商务智能体来处理，对企业来说会更容易。"}, {"start": 106, "end": 118.86, "text": "Susan Li: I think also one of the things that is really distinctive about Muse, and one of the things that makes the product experience so great, is the degree of proactivity that it exhibits on my behalf, right?", "zh": "Susan Li：我认为 Muse 的一个非常独特之处，也是让产品体验如此出色的原因之一，就是它代表我表现出的主动性，对吧？"}, {"start": 118.86, "end": 133, "text": "I can give it a task and Muse is going to go execute against that task for me, even as it encounters some obstacles or can't quite find the right thing and needs to chart a new path to helping me look for the thing I want.", "zh": "我可以给它一个任务，Muse 就会去执行这个任务，即使它遇到一些障碍，或者不太能找到正确的东西，需要开辟一条新路径来帮助我寻找我想要的东西。"}, {"start": 133, "end": 166.39, "text": "Susan Li: I think that sort of dimension of proactivity exhibited by either consumer agents or business agents, I think, are going to enable more transactions to happen or more activity to happen broadly than happens today where when more actions are taken, primarily when the latent demand expresses itself versus things where I can have Muse searching for things for me on an ongoing basis, giving me regular updates on things I'm looking for, sending me 10 new books a month.", "zh": "Susan Li：我认为，无论是消费者智能体还是商务智能体表现出的这种主动性，都会让更多的交易发生，或者更广泛的活动发生，相比今天——当更多的行动被采取时，主要是当潜在需求表达出来时，而不是我让 Muse 持续为我搜索东西，定期向我更新我在寻找的东西，每月给我发 10 本新书。"}, {"start": 166.39, "end": 181.23, "text": "Agents should be doing similar things for businesses, and I think that creates sort of opportunities again for a new, more proactive sort of framework for what agent-to-agent interactions look like over time.", "zh": "智能体也应该为企业做类似的事情，我认为这再次为智能体与智能体互动在未来是什么样子创造了一个新的、更主动的框架的机会。"}, {"start": 181.23, "end": 190, "text": "On your second question, which is about 2027, we are quite early in developing our budget and capacity plans for next year.", "zh": "关于你的第二个问题，即 2027 年，我们在制定明年的预算和产能计划方面还处于非常早期的阶段。"}, {"start": 190, "end": 200.83, "text": "Susan Li: We are, I would say, at the point where we are both evaluating a lot of investment proposals that have attractive return profiles over different time horizons.", "zh": "Susan Li：我想说，我们正处于评估许多投资提案的阶段，这些提案在不同时间范围内都有吸引人的回报。"}, {"start": 200.83, "end": 209.69, "text": "We want to figure out how we can fund as many of those as possible within the construct of our overall budget and financial goals.", "zh": "我们希望弄清楚，在整体预算和财务目标的框架内，我们如何能够为尽可能多的提案提供资金。"}, {"start": 209.69, "end": 224, "text": "But it's very dynamic, and it's still pretty early, and so we don't have anything more specific or quantitative to share until we get to the Q4 call, which is typically when we share guidance for the next year.", "zh": "但情况非常动态，而且还很早，所以在第四季度电话会议之前，我们没有什么更具体或量化的内容可以分享，而第四季度电话会议通常是我们分享下一年度指引的时候。"}, {"start": 224, "end": 228.95, "text": "Operator: Your next question comes from the line of Justin Post with Bank of America.", "zh": "Operator：下一个问题来自美国银行的 Justin Post。"}, {"start": 228.95, "end": 230, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 230, "end": 230.92, "text": "Justin Post: Great, thanks.", "zh": "Justin Post：很好，谢谢。"}, {"start": 230.92, "end": 232.76, "text": "One for Mark, one for Susan.", "zh": "一个问题给 Mark，一个给 Susan。"}, {"start": 232.76, "end": 241.45, "text": "Mark, you've got this powerful new model on your hands, and it seems like there is a lot you could do internally besides externally.", "zh": "Mark，你手头有一个强大的新模型，似乎除了外部应用之外，你在内部也可以做很多事情。"}, {"start": 241.45, "end": 246.51, "text": "Specifically to the ad business, you've rearchitected your systems around AI.", "zh": "具体到广告业务，你们已经围绕 AI 重新设计了系统。"}, {"start": 246.51, "end": 250.99, "text": "How much room is there for improvement as you deploy that new model?", "zh": "随着你们部署这个新模型，还有多大的改进空间？"}, {"start": 250.99, "end": 253.09, "text": "How are you thinking about that?", "zh": "你们是如何思考这个问题的？"}, {"start": 253.09, "end": 257.17, "text": "Then for Susan, you mentioned strong revenue growth next year.", "zh": "然后对于 Susan，你提到了明年强劲的收入增长。"}, {"start": 257.17, "end": 264.34, "text": "Just wondering if that's advertising or does that incorporate some incremental AI revenues hitting next year?", "zh": "我想知道那是广告，还是也包括明年开始的一些增量 AI 收入？"}, {"start": 264.34, "end": 265, "text": "Thank you.", "zh": "谢谢。"}, {"start": 265, "end": 268, "text": "Susan Li: I'm happy to take both of those.", "zh": "Susan Li：我很乐意回答这两个问题。"}, {"start": 268, "end": 268, "text": "Justin Post: Go for it.", "zh": "Justin Post：请讲。"}, {"start": 268, "end": 268.42, "text": "Susan Li: Great.", "zh": "Susan Li：很好。"}, {"start": 268.42, "end": 286.11, "text": "On your first question, I think our ads business has been benefiting for now many years from our ongoing investments in both what we would have called traditional AI machine learning models, and then, of course, from the more recent generation of models.", "zh": "关于你的第一个问题，我认为我们的广告业务多年来一直受益于我们在传统 AI 机器学习模型方面的持续投资，当然还有更新一代的模型。"}, {"start": 286.11, "end": 291.61, "text": "I would say that there are three themes there that I think are worth outlining.", "zh": "我想说，有三个主题值得概述。"}, {"start": 291.61, "end": 299.07, "text": "The first is just the kind of traditional roadmap of performance improvements that we have in the pipeline.", "zh": "第一个就是传统的、基于我们现有产品线的业绩改进路线图。"}, {"start": 299.07, "end": 304.5, "text": "That is what I would describe more as business-as-usual machine learning work.", "zh": "这就是我所说的更像是日常机器学习工作。"}, {"start": 304.5, "end": 327, "text": "That continues to be a robust and healthy pipeline, and as we are looking into 2027, again, we're not providing an outlook, but I would say that our investments and product improvements across both engagement and ads initiatives give us confidence that we have a meaningful runway to grow our core business throughout 2027.", "zh": "这仍然是一个稳健健康的渠道，随着我们展望 2027 年，再说一次，我们没有提供展望，但我想说，我们在互动和广告方面的投资和产品改进让我们有信心，在 2027 年全年我们的核心业务有显著的增长空间。"}, {"start": 327, "end": 329.82, "text": "Susan Li: That also gets to your second question also.", "zh": "Susan Li：这也回答了你的第二个问题。"}, {"start": 329.82, "end": 335.26, "text": "I should say, basically, I think the ranking and recommendations pipeline is healthy.", "zh": "我想说，基本上，我认为排序和推荐渠道是健康的。"}, {"start": 335.26, "end": 354.27, "text": "The second theme I would say is that we are excited about some of the new research bets that we have as we move into sort of a more LLM-oriented AI infrastructure to help us more deeply reason about people's preferences, what they're interested in, both across organic content and recommendations.", "zh": "第二个主题是，我们对一些新的研究押注感到兴奋，随着我们转向更面向大语言模型的 AI 基础设施，以更深入地推理人们的偏好、他们感兴趣的东西，涵盖自然内容和推荐。"}, {"start": 354.27, "end": 361.64, "text": "We expect that we will be able to unlock benefits to our ranking and recommendations engine from that research too.", "zh": "我们预计，我们也将能够从这项研究中为我们的排序和推荐引擎释放好处。"}, {"start": 361.64, "end": 377, "text": "The third thing is that we expect that generative AI tools, which have already been very valuable for advertisers, will continue to grow in terms of the features that we make available to advertisers, primarily through the Advantage+ suite.", "zh": "第三件事是，我们预计生成式 AI 工具已经对广告主非常有价值，未来将继续在功能上增长，主要是通过 Advantage+ 套件。"}, {"start": 377, "end": 394.85, "text": "Susan Li: Features that make it easier for advertisers to quickly and seamlessly generate, whether it is creative or take an image and generate video or generate sound, all, I think, in service of making the ads increasingly personalized for the person that they're being served to.", "zh": "Susan Li：这些功能让广告主能够快速、无缝地生成，无论是创意，还是拿一张图片生成视频或生成声音，所有这些，我认为都是为了让广告对接受者来说越来越个性化。"}, {"start": 394.85, "end": 400.62, "text": "So I would say we feel like there is meaningful runway across all three of those things.", "zh": "所以我想说，我们觉得在这三个方面都有显著的增长空间。"}, {"start": 400.62, "end": 415.25, "text": "Your second question was about revenue growth next year, and so as I mentioned, I think we're both feeling good about the budget investments that we expect we will make in both core ads and engagement initiatives next year.", "zh": "你的第二个问题是关于明年的收入增长，正如我提到的，我认为我们对明年核心广告和互动方面的预算投资都感觉良好。"}, {"start": 415.25, "end": 427, "text": "We're also building several new AI businesses, and we expect that those can begin contributing incremental revenue in 2027, but more importantly, can scale meaningfully over time.", "zh": "我们也在打造几个新的 AI 业务，我们预计它们可以在 2027 年开始贡献增量收入，但更重要的是，随着时间的推移能够 显著 地扩大规模。"}, {"start": 427, "end": 437.81, "text": "Susan Li: Those will include monetizing our AI products through subscriptions, transactions, advertising, developing enterprise offerings, as we talked about in one of the earlier questions.", "zh": "Susan Li：这些将包括通过订阅、交易、广告、开发企业产品来变现我们的 AI 产品，正如我们在之前的一个问题中谈到的。"}, {"start": 437.81, "end": 461, "text": "So I would say while many of these opportunities remain early and our near-term focus is really on building high-quality products and achieving product market fit and scaled product market fit, I think our track record of reaching billions of people and building businesses at scale makes us feel good that AI is going to become a meaningful source of revenue diversification over time.", "zh": "所以我想说，虽然许多这些机会还处于早期，我们近期的重点确实是打造高质量产品、实现产品市场契合和规模化的产品市场契合，但我认为我们在触达数十亿人和大规模打造业务方面的记录让我们感到有信心，AI 将随着时间的推移成为收入多元化的重要来源。"}, {"start": 461, "end": 465.88, "text": "Operator: Your next question comes from the line of Mark Shmulik with Bernstein.", "zh": "Operator：下一个问题来自 Bernstein 的 Mark Shmulik。"}, {"start": 465.88, "end": 467, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 467, "end": 467.24, "text": "Mark Shmulik: Yes.", "zh": "Mark Shmulik：是的。"}, {"start": 467.24, "end": 469.07, "text": "Thanks for taking my questions.", "zh": "感谢接受我的提问。"}, {"start": 469.07, "end": 478.99, "text": "Mark, coming out of Connect, it kind of felt like we were ushering in the next era of the company, and the business reorienting around Muse at the center of everything.", "zh": "Mark，从 Connect 大会出来后，感觉我们似乎正在进入公司的新时代，业务围绕 Muse 重新定位。"}, {"start": 478.99, "end": 482.59, "text": "Is that a fair assessment of how things are going internally?", "zh": "这是对内部情况的公平评估吗？"}, {"start": 482.59, "end": 489.27, "text": "If so, can you just talk a little bit more about how some of the business mandates and outcomes may have changed?", "zh": "如果是，你能否多谈谈一些业务授权和成果可能发生了怎样的变化？"}, {"start": 489.27, "end": 497.07, "text": "Susan, it was interesting to see the launch cadence where enterprise announcements kind of preceded some of the small business ones.", "zh": "Susan，看到企业公告的发布节奏先于一些小企业公告很有意思。"}, {"start": 497.07, "end": 508.41, "text": "I appreciate your comments on some of what's going on there around the SMB agent opportunity, but can you just share more details on the work required to serve and scale the offerings to SMBs?", "zh": "我很感谢你对 SMB 智能体机会的评论，但你能否分享更多关于服务和扩展面向中小企业的产品所需工作的细节？"}, {"start": 508.41, "end": 509, "text": "Thank you.", "zh": "谢谢。"}, {"start": 509, "end": 512.34, "text": "Mark Zuckerberg: Yeah, I can talk briefly about the first one.", "zh": "Mark Zuckerberg：是的，我可以简要谈谈第一个问题。"}, {"start": 512.34, "end": 523.6, "text": "Look, it was more than a year ago that I think I wrote the letter about personal superintelligence as the North Star for the work that we're doing here.", "zh": "你看，一年多以前，我想我写过一封关于个人超级智能的信，把它作为我们工作的北极星。"}, {"start": 523.6, "end": 540.13, "text": "It basically fits with this line of work that we've done for more than 20 years at the company that is focused on empowering individuals, giving people a voice, giving people the tools to connect in the ways that they want.", "zh": "它基本上符合我们 20 多年来一直专注的工作，即赋予个人权力，给人们发声的机会，给人们提供以他们想要的方式连接的工具。"}, {"start": 540.13, "end": 560, "text": "When you extend that to the work around AI now, we think that the most important thing that we can be building for this next generation of technology is basically putting the power of this technology in everyone's hands, which is the personal superintelligence vision.", "zh": "当你把这一点延伸到现在的 AI 工作时，我们认为，对于这一代技术，我们能打造的最重要的东西基本上就是把这项技术的力量交到每个人手中，这就是个人超级智能的愿景。"}, {"start": 560, "end": 567.61, "text": "Mark Zuckerberg: We've been working on this for a while, and this is when we did the reboot around MSL and building the lab.", "zh": "Mark Zuckerberg：我们已经为此工作了一段时间，这就是我们围绕 MSL 进行重组并建立实验室的时候。"}, {"start": 567.61, "end": 583.19, "text": "A lot of it was this idea that we need to build models specifically to be good as personal agents, that we'd be able to build the best experience by owning and building and designing ourselves the end-to-end technology.", "zh": "很多想法是，我们需要打造专门擅长作为个人智能体的模型，这样通过拥有并自己设计端到端技术，我们就能够打造最佳体验。"}, {"start": 583.19, "end": 586.6, "text": "So that includes the models and then the agents.", "zh": "这包括模型，然后是智能体。"}, {"start": 586.6, "end": 589.95, "text": "This has kind of been in the works for a while.", "zh": "这已经酝酿了一段时间。"}, {"start": 589.95, "end": 593.43, "text": "The vision around the glasses has also been this.", "zh": "围绕眼镜的愿景也是如此。"}, {"start": 593.43, "end": 602.61, "text": "We've wanted to build the next generation of hardware platforms so that we can deliver the best end-to-end experiences to people.", "zh": "我们一直想打造下一代硬件平台，以便提供最佳的端到端体验。"}, {"start": 602.61, "end": 610.01, "text": "I think that that's starting to come together as well, and I think will even more over the coming years.", "zh": "我认为这一点也开始汇聚，我认为在未来几年还会更加如此。"}, {"start": 610.01, "end": 612, "text": "So these are long-term bets.", "zh": "我的意思是，这些都是长期押注。"}, {"start": 612, "end": 621.35, "text": "Mark Zuckerberg: I feel like this is what we're here to do, is make long-term technology bets and design the best experiences end to end that we can for billions of people around the world.", "zh": "Mark Zuckerberg：我觉得这就是我们在这里要做的事情，就是做出长期的技术押注，设计我们能够为全球数十亿人提供的最佳端到端体验。"}, {"start": 621.35, "end": 632, "text": "I think as long as we continue to do that, then over time, the business takes care of itself, as long as we continue executing well, which I'm really proud of the team for how we're doing on that.", "zh": "我认为，只要我们继续这样做，随着时间的推移，业务自然会好起来，只要我们继续执行得好，我为团队在这方面的表现感到非常自豪。"}, {"start": 632, "end": 632.84, "text": "Susan Li: Thanks, Mark.", "zh": "Susan Li：谢谢 Mark。"}, {"start": 632.84, "end": 636.48, "text": "Your second question was around Muse for small business.", "zh": "你的第二个问题是关于面向小企业的 Muse。"}, {"start": 636.48, "end": 641.99, "text": "We launched that, which you can think of as an expansion for Muse, in late September.", "zh": "我们是在 9 月下旬推出的，你可以把它看作是 Muse 的一个扩展。"}, {"start": 641.99, "end": 653.21, "text": "Rather than a separate product, it is kind of a set of new skills and connectors inside the existing Muse app aimed at helping SMB owners run operations, find new customers.", "zh": "它不是一个独立的产品，而是一套新的技能和连接器，内置在现有的 Muse 应用中，旨在帮助中小企业主运营业务、寻找新客户。"}, {"start": 653.21, "end": 669.03, "text": "It connects to a business's, for example, Instagram account analytics or Facebook pages or Meta ad accounts in a few clicks, along with dozens of third-party connectors that businesses already run on, like Shopify, QuickBooks, Canva, et cetera.", "zh": "它可以连接企业的 Instagram 账号分析或 Facebook 主页或 Meta 广告账号，只需点击几下，还有企业已经在使用的几十个第三方连接器，例如 Shopify、QuickBooks、Canva 等。"}, {"start": 669.03, "end": 675, "text": "It already understands what businesses sell, its brand voice, what customers are asking for.", "zh": "它已经了解企业销售什么、品牌声音、客户在问什么。"}, {"start": 675, "end": 683.33, "text": "Susan Li: Muse can take actions, including analyze ad and content performance, draft campaigns, customer responses, flag issues.", "zh": "Susan Li：Muse 可以采取行动，包括分析广告和内容表现、起草广告活动、客户回复、标记问题。"}, {"start": 683.33, "end": 689.41, "text": "We are actively listening to our SMB users to understand what their top use cases are.", "zh": "我们正在积极倾听我们的中小企业用户，了解他们的首要使用场景。"}, {"start": 689.41, "end": 706, "text": "We are seeing them use it for ads optimization, for direct message organizing, use it to expand their sales footprint, to keep their website current based on things like inventory and new products, to deal with employee load balancing.", "zh": "我们看到他们用它来优化广告、整理直接消息、扩大销售版图、根据库存和新产品保持网站更新、处理员工工作量平衡。"}, {"start": 706, "end": 719.33, "text": "Susan Li: We are pretty closely following how businesses use Muse to make sure that we are being thoughtful about new features that we release in Muse to make it maximally useful and productive for SMBs.", "zh": "Susan Li：我们正在密切关注企业如何使用 Muse，以确保我们对在 Muse 中发布的新功能深思熟虑，使其对中小企业尽可能有用和高效。"}, {"start": 719.33, "end": 738.18, "text": "I would also say we have unique touch points to, again, I mentioned in my opening remarks, 500 million self-identified small businesses, and we think that many of the investments that we make in consumer products are going to carry over to help power those businesses also.", "zh": "我还想说，我们有独特的触点，再说一次，我在开场白中提到，5 亿自认为是小企业的企业，我们认为我们在消费产品方面的许多投资也将延续，帮助这些企业。"}, {"start": 738.18, "end": 744.81, "text": "We have multiple excellent channels to surface those opportunities to small businesses globally.", "zh": "我们有多个出色的渠道，可以在全球范围内向小企业展示这些机会。"}, {"start": 744.81, "end": 752.75, "text": "This is a place where we feel like we have an existing extremely strong platform, and we are very excited about it.", "zh": "这是一个我们觉得已经拥有非常强大的平台的地方，我们对此非常兴奋。"}, {"start": 752.75, "end": 760, "text": "We also believe the transition to AI has broadly unlocked enterprise as a new opportunity for us as well.", "zh": "我们也相信，向 AI 的过渡已经广泛地为企业开启了新的机会。"}, {"start": 760, "end": 764.87, "text": "Operator: Your next question comes from the line of Ross Sandler with Barclays.", "zh": "Operator：下一个问题来自巴克莱的 Ross Sandler。"}, {"start": 764.87, "end": 766, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 766, "end": 766.45, "text": "Ross Sandler: Great.", "zh": "Ross Sandler：很好。"}, {"start": 766.45, "end": 782.92, "text": "Mark, you touched on this earlier, but could you elaborate a little bit on maybe some high-level metrics around the per-user cost structure of Muse today, and then how you see that cost curve coming down as you go forward?", "zh": "Mark，你之前提到过这一点，但你能否详细说明一下今天 Muse 的每用户成本结构的一些高层指标，以及你如何看待这条成本曲线在未来下降？"}, {"start": 782.92, "end": 788.26, "text": "What are some of the things you are doing to bring that cost curve down?", "zh": "你们正在做些什么来降低这条成本曲线？"}, {"start": 788.26, "end": 789, "text": "Thank you.", "zh": "谢谢。"}, {"start": 789, "end": 790.82, "text": "Susan Li: I am happy to answer that.", "zh": "Susan Li：我很乐意回答这个问题。"}, {"start": 790.82, "end": 795.15, "text": "Mark, you should add anything that you feel like I am missing.", "zh": "Mark，你应该补充任何你觉得我遗漏的内容。"}, {"start": 795.15, "end": 805.09, "text": "We do not have specific numbers to share around the cost structure of Muse today, but of course it is, as Mark said, pretty compute expensive.", "zh": "我们目前没有关于今天 Muse 成本结构的具体数字可以分享，但当然，正如 Mark 所说，它的算力成本相当高。"}, {"start": 805.09, "end": 817.19, "text": "Making sure that we are focused on compute efficiency is going to be one of the key vectors towards being able to both scale Muse and grow it into the business that we want.", "zh": "确保我们专注于算力效率将是能够扩大 Muse 规模并将其发展成我们想要的业务的关键因素之一。"}, {"start": 817.19, "end": 821.87, "text": "I think there are a couple dimensions of achieving that efficiency.", "zh": "我认为实现这种效率有几个维度。"}, {"start": 821.87, "end": 832.92, "text": "I think some of the more nearer-term pieces include things like leveraging off-peak or spare computing capacity to run some sets of jobs using smaller models.", "zh": "我认为一些更近期的部分包括利用非高峰或闲置计算能力来运行一些使用较小模型的作业。"}, {"start": 832.92, "end": 846, "text": "There is a lot of work to be done across different inference efficiency initiatives, all in service effectively of higher GPU utilization and other product efficiency work we can do also.", "zh": "在不同的推理效率举措方面还有很多工作要做，所有这些实际上都是为了提高 GPU 利用率和其他我们也可以做的产品效率工作。"}, {"start": 846, "end": 866.32, "text": "Susan Li: I think over the longer term, I think this is a place where we expect that we are going to be able to, over time, as LLM scale, get more tasks done with fewer tokens and also rely on AI models themselves to help us improve the efficiency of the software that we use to run the models.", "zh": "Susan Li：我认为从长远来看，我认为这是一个我们预计能够随着时间的推移，随着大语言模型的扩展，用更少的 token 完成更多的任务，并且依靠 AI 模型本身来帮助我们提高运行模型所用软件的效率的地方。"}, {"start": 866.32, "end": 876.48, "text": "I think it is a place where we both feel like there is a lot more work on our efficiency roadmap that is going to help us bend the curve here.", "zh": "我认为这是一个我们都觉得在效率路线图上还有很多工作要做的地方，这将帮助我们压低成本曲线。"}, {"start": 876.48, "end": 887, "text": "We also expect that the arc of how the AI-driven technological advances are going to apply here will also help us achieve larger savings over time.", "zh": "我们也预计，AI 驱动的技术进步将如何应用的弧线也将帮助我们随着时间的推移实现更大的节约。"}, {"start": 887, "end": 891.92, "text": "Operator: Your next question comes from the line of Mark Mahaney with Evercore ISI.", "zh": "Operator：下一个问题来自 Evercore ISI 的 Mark Mahaney。"}, {"start": 891.92, "end": 893, "text": "Please go ahead.", "zh": "请提问。"}]}, {"slug": "meta-s5", "title": "Meta Q3 2026 Earnings Call — Part 5 of 5", "mp3": "https://billyxiaoli.github.io/us-briefs/meta-q3-2026/section-5/section-5.mp3", "dur": "4:15", "lines": [{"start": 0, "end": 0.97, "text": "Mark Mahaney: Okay, thanks.", "zh": "Mark Mahaney：好的，谢谢。"}, {"start": 0.97, "end": 2.02, "text": "Two questions.", "zh": "两个问题。"}, {"start": 2.02, "end": 15.23, "text": "There is a bit of a playbook, or there has been at Meta over the years when you surface new surfaces and you build up the user growth engagement, then you layer in monetization.", "zh": "Meta 多年来一直有一个套路：当你们推出新的版块、积累用户增长和互动，然后再叠加变现。"}, {"start": 15.23, "end": 32.1, "text": "Do you think it is sort of a similar playbook here, or does it have to be a little bit faster with Muse, just given that the costs associated with it are materially greater, arguably, than launching those surfaces in the past?", "zh": "你认为这里也是类似的套路吗？还是说，由于 Muse 的相关成本可以说比过去推出这些版块时要大得多，所以必须稍微快一点？"}, {"start": 32.1, "end": 40.98, "text": "Then just a clarification on that commerce data point that you provided about 25% of users and the $200 or greater ASP.", "zh": "然后只是澄清一下你们提供的关于 25% 用户和 200 美元或以上平均售价的商务数据点。"}, {"start": 40.98, "end": 47.25, "text": "Are you including in commerce travel purchases, or is that just a retail data point?", "zh": "你们在商务中是否包括旅行购买，还是说那只是一个零售数据点？"}, {"start": 47.25, "end": 48, "text": "Thank you.", "zh": "谢谢。"}, {"start": 48, "end": 57.18, "text": "Mark Zuckerberg: My guess, I think that we are going to work on monetization somewhat sooner on this than our normal playbook for a couple of reasons.", "zh": "Mark Zuckerberg：我的猜测是，我认为我们将在变现方面比我们通常的套路稍微早一些，原因有几个。"}, {"start": 57.18, "end": 70.5, "text": "One is just the size of the numbers that we are talking about in terms of both the costs and the opportunity, I think make it important to make progress on that in order to be able to scale it.", "zh": "一个原因是，我们谈论的数字规模，无论是成本还是机会，都让我认为取得进展对于扩大规模很重要。"}, {"start": 70.5, "end": 75.88, "text": "The other is just that such a large part of what people are doing is commerce.", "zh": "另一个原因是，人们所做的事情中有很大一部分是商务。"}, {"start": 75.88, "end": 79.13, "text": "To your question, that does include travel too.", "zh": "关于你的问题，那也包括旅行。"}, {"start": 79.13, "end": 97, "text": "I think we might consider travel a different case, but travel is actually one of the other top use cases for Muse, is basically people planning that out and planning different kinds of things that they would get than they might get through our family of apps.", "zh": "我认为我们可能会把旅行看作一个不同的案例，但旅行实际上是 Muse 的另一个主要使用场景，基本上是人们规划行程以及规划通过我们的应用家族可能获得的不同种类的东西。"}, {"start": 97, "end": 105.17, "text": "Mark Zuckerberg: I think that this is going to be an important thing for us to work on to deliver the consumer value that people want.", "zh": "Mark Zuckerberg：我认为，这将是我们为提供人们想要的消费者价值而努力的重要事情。"}, {"start": 105.17, "end": 114.33, "text": "In doing so, I think we will be able to build a model where we get a percent of the value that we are helping to create for people.", "zh": "在这样做的过程中，我认为我们将能够建立一个模式，让我们获得我们帮助人们创造的价值的一部分。"}, {"start": 114.33, "end": 129, "text": "I think that it is going to be very important to get the math on all of this to work out, so that way we can continue the compute build-out that we want to build in order to get this to reach everyone at scale.", "zh": "我认为，让所有这些数学算得通将非常重要，这样我们才能继续我们想要的算力建设，以达到每个人的规模。"}, {"start": 129, "end": 152.43, "text": "Mark Zuckerberg: In addition to everything that Susan said in response to the last answer, I would also just add that we just see this trend that year-over-year, I just expect that we will be able to deliver the same intelligence that we have now in Muse Wonder or frankly, any of the current frontier models at a fraction of the cost in a smaller model a year from today.", "zh": "Mark Zuckerberg：除了 Susan 在回答上一个问题时说的所有内容，我还想补充一点，我们只是看到这样一个趋势：同比来看，我只是预计，我们将能够以今天一小部分的成本，在一年后的更小模型中提供我们现在在 Muse Wonder 或坦率地说任何当前前沿模型中拥有的相同智能。"}, {"start": 152.43, "end": 168, "text": "To the extent that represents some kind of baseline level that people seem to, that is sufficient for product market fit for Muse, I think that we will just continue through continued model development, make progress on that efficiency.", "zh": "就这一点代表了人们似乎认为足以实现 Muse 产品市场契合的某种基线水平而言，我认为我们将通过持续的模型开发，在效率方面继续取得进展。"}, {"start": 168, "end": 179.38, "text": "Mark Zuckerberg: The thing that is, and of course less clear, is that I don't think in a year from now, most people are going to want to use the current model level of intelligence because that's also going to make progress.", "zh": "Mark Zuckerberg：不太清楚的是，我认为一年后，大多数人不会想使用当前的模型智能水平，因为那也将取得进展。"}, {"start": 179.38, "end": 199, "text": "I think we're going to need to work on all of these things, both the revenue pieces of it and scaling the different aspects of that, as well as progressing on the model development and all the efficiency in order to be able to both fund and support the compute build-out and reach billions of people, which again, we want to get to that as soon as possible.", "zh": "我认为我们需要在所有这些事情上努力，包括收入部分和扩大不同方面的规模，以及在模型开发和所有效率方面取得进展，以便既能资助又能支持算力建设，并触达数十亿人，再说一次，我们希望尽快做到这一点。"}, {"start": 199, "end": 215.74, "text": "Mark Zuckerberg: Part of the reason why we're not just charging everyone upfront to use this is we want to establish this Muse network, and we think that it's going to be more valuable for people at scale when there are a lot of people and businesses using Muse, so that way they can collaborate and work together.", "zh": "Mark Zuckerberg：我们之所以不只是向每个人预先收费，部分原因是我们想建立这个 Muse 网络，我们认为当有很多人和企业使用 Muse 时，它在规模上会更有价值，这样他们就可以协作和共同工作。"}, {"start": 215.74, "end": 221.32, "text": "I think that that's really a very important state to get to and one that we're quite excited about.", "zh": "我认为，达到这样一个状态真的非常重要，我们对此非常兴奋。"}, {"start": 221.32, "end": 228.76, "text": "Again, I don't think that there are many companies in the world that are well-situated to be able to do that in the way that we are.", "zh": "再说一次，我不认为世界上有很多公司能够像我们这样很好地做到这一点。"}, {"start": 228.76, "end": 234, "text": "I think we are very well-situated to do that, and we plan to push on that quite aggressively.", "zh": "我认为我们在这一点上位置非常好，我们计划非常积极地推进这一点。"}, {"start": 234, "end": 237.68, "text": "Operator: That does conclude our question-and-answer session.", "zh": "Operator：这就结束了我们的问答环节。"}, {"start": 237.68, "end": 242, "text": "Rob Bevegni, I would like to turn the call back over to you.", "zh": "Rob Bevegni，我想把电话交还给你。"}, {"start": 242, "end": 248, "text": "Rob Bevegni: Thank you for joining us today, and we look forward to speaking with you again soon.", "zh": "Rob Bevegni：感谢大家今天参加，我们期待很快再次与你们交流。"}, {"start": 248, "end": 251.1, "text": "Operator: Ladies and gentlemen, this does conclude today's conference call.", "zh": "Operator：女士们、先生们，今天的电话会议到此结束。"}, {"start": 251.1, "end": 254, "text": "Thank you for your participation, and you may now disconnect.", "zh": "感谢大家的参与，现在可以挂断了。"}]}, {"slug": "sec1", "title": "Section 1: Hello, September 11th, and leaving Shanghai", "mp3": "my-american-journey-full/sec1/sec1.mp3", "dur": "9:17", "lines": [{"start": 0.0, "end": 3.84, "text": "Hello, everyone. Can you hear me? Is the sound all right?", "zh": "大家好，听得见我说话吗？声音可以吗？"}, {"start": 3.84, "end": 9.6, "text": "I will wait a moment for your responses, because my microphone suddenly stopped working just now, for some reason.", "zh": "我再等一下大家的回应，因为我那个话筒刚才突然不工作了，不知道为什么。"}, {"start": 9.6, "end": 15.6, "text": "I did not have time to change microphones, so I am just using my phone's microphone. I did not go looking for another microphone.", "zh": "我还来不及换一个话筒，所以我直接用手机的话筒就算了，我没有再去找话筒。"}, {"start": 15.6, "end": 18.0, "text": "I just want to see whether everyone can hear me.", "zh": "我就想看看大家听不听得见我说话。"}, {"start": 18.0, "end": 25.12, "text": "Hello, everyone. If anyone can hear me, just type a line below saying you can hear me. I just want to see whether you can hear me.", "zh": "大家好，如果有听得到我说话的人，就在下面打一行，说听得到我。我就想看看大家听不听得到我说话。"}, {"start": 25.12, "end": 28.24, "text": "The sound is good. Thank you, thank you, thank you.", "zh": "声音很好，谢谢，谢谢，谢谢。"}, {"start": 28.24, "end": 36.88, "text": "Last time, during my previous livestream, I told you all this. If you are interested, I will talk about my experience coming to America, about that era.", "zh": "上一次直播的时候，我就告诉大家了，如果大家有兴趣，我就谈一谈我到美国的经历，就是那个时代。"}, {"start": 36.88, "end": 43.84, "text": "Some people wanted to know, and later a lot of people left comments saying they wanted to know, so I decided to do it as a livestream.", "zh": "因为有些人想知道，后来好多人留言都想知道，那么我就做直播吧。"}, {"start": 43.84, "end": 53.28, "text": "A livestream makes sense for this kind of thing. A video would not quite work, and writing an article on YouTube would not quite work either, so let us just chat casually.", "zh": "这种东西，做视频也不合适，在 YouTube 上面写文章也不是太合适，那么就随便聊聊。"}, {"start": 53.28, "end": 61.52, "text": "And if, as I am talking, you have any questions, or if anything I say is not clear to you, feel free to interrupt me. Just treat this as a casual chat.", "zh": "如果我说当中，大家觉得有什么疑问，或者觉得我说的东西不太明白，也可以打断我，就当大家闲聊吧。"}, {"start": 61.52, "end": 69.68, "text": "One thing is certain, though. One episode will definitely not be enough. It will probably take many episodes, so I will try to share a little bit every week.", "zh": "肯定的是，一期绝对说不完，估计要做好多期，我今天争取每个星期说一点。"}, {"start": 69.68, "end": 78.08, "text": "That way you can get a sense of this period of history, and of what it is like for someone who has just arrived in America, and also get some background on the work I do.", "zh": "让大家对这段历史，或者对于刚刚到美国来的人，有一个了解，同时也对我做的一些科普的东西，有些了解。"}, {"start": 78.08, "end": 92.56, "text": "Because a lot of people say, at your level, you do not understand poor people, you do not understand the middle class. So let me tell you. My experience after coming to America is similar to many people's, and also different from many people's.", "zh": "因为很多人说，到你这个阶层，你对于贫穷的人不了解，对于中产阶层不了解，那么我就告诉你一下，因为我到美国之后的经历，应该和很多人相似，也有很多人不一样。"}, {"start": 92.56, "end": 96.88, "text": "Now let me start with today, which is a special day: September 11th.", "zh": "那么我现在先说一说今天这个特殊的日子，9月11日。"}, {"start": 96.88, "end": 99.76, "text": "September 11th has a special meaning for me as well.", "zh": "9月11日这个特殊日子，对我来说还有一些特殊的意义。"}, {"start": 99.76, "end": 105.04, "text": "As you all know, in September 11th there was a very brave flight attendant named Betty Ong.", "zh": "大家也知道，在9月11日当中，有一个非常勇敢的飞行乘务员，叫Betty Ong。"}, {"start": 105.04, "end": 109.68, "text": "Betty Ong was born and raised in San Francisco, and I have some connection with her family.", "zh": "Betty Ong是旧金山土生土长的，和我呢，我和他们的家庭还是有一些关系的。"}, {"start": 109.68, "end": 113.36, "text": "What connection? Her brother Harry Ong was my colleague at the time.", "zh": "什么关系呢？就是她的哥哥Harry Ong，当时是我的同事。"}, {"start": 113.36, "end": 118.48, "text": "I remember September 11th very clearly. That day I was actually not supposed to go to work.", "zh": "那时候，9月11日那天，我记得很清楚，9月11日那天，我其实不上班的。"}, {"start": 118.48, "end": 127.44, "text": "In the morning I saw the news at home, and after seeing it, my wife was also very frightened at the time and said, do not go out, everyone just stay home.", "zh": "早上的时候，我在家里看到了这个新闻，看到这个新闻之后，我太太那时候也很害怕，就说你不要出去了，大家就在家里待着。"}, {"start": 128.0, "end": 136.16, "text": "Because at that time there were constant radio reports that a plane was flying toward San Francisco, so everyone in San Francisco had to be careful.", "zh": "因为那时候，一直有广播说，有一架飞机是朝着旧金山方向飞过来的，所以让旧金山大家的人都要小心。"}, {"start": 136.16, "end": 143.28, "text": "So at that time I was not going to work, but then the manager called and said, Harry cannot come to work, can you cover his shift?", "zh": "所以说那时候，我就不去上班，但是那个经理打电话过来，她说Harry不能来上班，你能带班一下吗？"}, {"start": 143.28, "end": 147.84, "text": "She did not say the reason at the time, she just said Harry cannot come to work.", "zh": "具体没说原因，那时候也没说具体原因，就说Harry不能来上班。"}, {"start": 147.84, "end": 152.24, "text": "I said, if you need me, I will come right away, and I went to work.", "zh": "我说，有需要吗，我就马上来，去上班。"}, {"start": 152.24, "end": 156.16, "text": "That day at work, the atmosphere in the whole hospital was very heavy.", "zh": "上班当天，整个医院里面的气氛也是非常压抑。"}, {"start": 156.16, "end": 161.68, "text": "Later everyone found out that Harry's younger sister was on that plane, that brave flight attendant.", "zh": "后来大家知道了，Harry的妹妹就在那个飞机上面，就是那位勇敢的女乘务员。"}, {"start": 161.68, "end": 168.88, "text": "About a week later Harry came back, after everything had been arranged, and our hospital colleagues did everything we could to help with Betty's funeral.", "zh": "大概过了一个星期左右，Harry才回来，把事情都安排好了再回来，我们医院的人对Betty的葬礼都想尽办法帮忙。"}, {"start": 168.88, "end": 174.64, "text": "Of course, help came from many, many people, from the federal level, to the city level, to the Chinese community.", "zh": "当然了，从联邦程度，一直到市的程度，到华人群体，我们帮助的人很多很多。"}, {"start": 175.2, "end": 180.88, "text": "Later, because we were colleagues, we would generally help Harry with memorial events for Betty around this time of year.", "zh": "后来，因为是同事，大家一般的情况之下，到这个时间，都是和Harry一起，帮Betty做一些纪念活动。"}, {"start": 180.88, "end": 183.6, "text": "That is my closest connection to September 11th.", "zh": "这就是我对9月11日关系最近的一个地方。"}, {"start": 183.6, "end": 190.0, "text": "And the sad part is that, because the plane crashed directly into the World Trade Center, her remains were not found.", "zh": "这悲痛的是，因为这个飞机直接撞到世贸中心上面，所以她的遗体是没有发现的。"}, {"start": 190.0, "end": 198.48, "text": "Later, outside the World Trade Center site, a piece of bone belonging to Betty was found among the remains, and DNA testing confirmed it was part of Betty.", "zh": "后来在世贸中心外围，在一些遗骨上面，发现了一段Betty的骨头，然后做DNA对比，确定这是Betty的一部分。"}, {"start": 198.48, "end": 203.76, "text": "So now, in Betty's coffin, only that one piece of bone is buried. That is how it is.", "zh": "所以现在Betty的木棺里面，就是埋了这么一块骨头在里面，就这么一个情况。"}, {"start": 204.32, "end": 208.08, "text": "So this whole story is my closest connection to September 11th.", "zh": "所以整件事情，是我对9月11日当中关系最近的一个。"}, {"start": 208.08, "end": 217.52, "text": "All right, now that more people are here, let me start talking about my own story. I have just told you about September 11th, so now let me talk about myself.", "zh": "好了，现在人也多了，那么就开始聊我的吧，这种9月11日的事情，我和大家聊了一下。"}, {"start": 217.52, "end": 224.72, "text": "I came to America in 1989, in mid-October 1989. If I remember correctly, it was October 17th.", "zh": "我是1989年的时候到美国的，到美国的时间是1989年10月中旬，如果我没记错的话，是10月17号。"}, {"start": 225.44, "end": 234.16, "text": "Why do I say if I remember correctly? Because of the time difference, I cannot say for sure whether that 17th was China time or America time.", "zh": "为什么说我没记错的话呢，因为有时差问题，我也说不清楚那个17号到底是中国的时间还是美国的时间。"}, {"start": 234.16, "end": 239.76, "text": "My family was like this: my parents in Shanghai were both primary school teachers, and their pay was not high.", "zh": "我们家里是这样子的，我父母亲在上海是一个小学老师，两个都是小学老师，他们的收入工资都不高。"}, {"start": 240.4, "end": 245.92, "text": "You know, in 1989, a primary school teacher in Shanghai would not have earned very much.", "zh": "你们知道，在1989年的时候，在上海的小学老师的收入不会很高。"}, {"start": 245.92, "end": 248.64, "text": "And our living conditions were also very poor.", "zh": "而我们的居住环境也是非常差的。"}, {"start": 248.64, "end": 255.84, "text": "Our family of three generations lived together: my parents, my younger sister, me, and my grandmother, all in one small room.", "zh": "我们一家三代同堂，我父母亲，我妹妹，我，还有我奶奶，就住在一个小房间里面。"}, {"start": 255.84, "end": 262.0, "text": "Our home life was like this: there was a big bed and a small bed. The small bed was where my grandmother slept.", "zh": "我们家里的生活情况就是说，有一张大床，一张小床，小床是我奶奶睡的。"}, {"start": 262.0, "end": 265.92, "text": "The big bed was where my parents slept, sometimes with my younger sister.", "zh": "大床是我父母亲，有时是我妹妹一起睡的。"}, {"start": 265.92, "end": 273.28, "text": "At night I usually slept on a folding camp bed. I would pull it open to sleep, and in the morning I would fold it away. That was how we slept.", "zh": "我晚上一般是一个折叠床，像行军折叠床，把它拉开睡觉，早上起来把折叠床收起来，是这样睡觉的。"}, {"start": 273.28, "end": 278.88, "text": "Apart from those two beds, there was a wardrobe and a table, a dining table. That was how we lived.", "zh": "家里除了这两张床之外，还有一个衣柜，还有一张桌子，饭桌，就这么过日子。"}, {"start": 278.88, "end": 283.68, "text": "There was no flush toilet. We used a chamber pot. That was the way of life.", "zh": "抽水马桶是没有的，都是拎的马桶，这样一个生活方式。"}, {"start": 283.68, "end": 290.24, "text": "As for my family, on my father's side, apart from my younger aunt who went to Hong Kong early on, basically everyone was in Shanghai.", "zh": "而我的家族，我父亲那边，除了我的小姑妈在早期的时候去了香港，基本都在上海。"}, {"start": 290.8, "end": 298.08, "text": "On my mother's side, her elder brother went to Hong Kong very early, then worked as a seaman in Hong Kong, and later went to America.", "zh": "我母亲那边，她的哥哥很早就去香港，然后在香港做海员之后，去到了美国。"}, {"start": 298.08, "end": 306.48, "text": "He settled in America, and around 1985, when I was in middle school, he asked, do you want to immigrate to America? If you do, I will sponsor you.", "zh": "到了美国，然后在美国定下来之后，大概在1985年左右，我在上初中的时候，他就说，你们想不想移民到美国来，想的话，我就把你们办。"}, {"start": 306.48, "end": 319.6, "text": "Thinking back to 1985, given China's economic situation at the time, if there was a possibility of going to America, we were already applying for family-based immigration, which was quite common then, though it is much less so now.", "zh": "当时想到1985年的时候，中国的经济情况，整个情况来说的话，直到有去美国的可能性的话，那时候其实我们已经在申请作为亲属移民，现在这个当然是不大有的了，那时候挺多，就在亲属移民到美国，我们已经申请了。"}, {"start": 319.6, "end": 323.52, "text": "As family-based immigrants, the waiting time in line was very long.", "zh": "作为这个亲属移民，那时候就是排队时间很长的。"}, {"start": 323.52, "end": 340.32, "text": "During that waiting time, I entered high school, and the question of taking the university entrance exam came up, so the original plan was this: my parents and my younger sister would go to America first if they had the chance, and I would finish university in China, get my degree, and then move to America.", "zh": "在排队的时间当中，我进入高中，要考大学，所以当时一早的计划是这样子的，我父母亲和我妹妹如果有机会先到美国，然后我在中国读完大学，拿到大学文凭之后，再移居美国。"}, {"start": 340.32, "end": 346.48, "text": "That was the original plan. Then in 1989, after the June Fourth movement that everyone knows about, things changed.", "zh": "本来的计划是这样子的。然后1989年的时候，就是大家所知道的六四民运的情况之后，事情就改变了。"}, {"start": 347.04, "end": 360.24, "text": "At that time everyone felt the future was very uncertain. Do not ask me whether I took part at the time, because young university students at that time, more or less, had some involvement in that respect. I will not say much about that specifically.", "zh": "大家觉得以后的变数很大，你们也不要问我当时我是不是参与，因为那时候的年轻了，大学的年轻了，或多或少都有这方面的参与，具体我这些我就不多说了。"}, {"start": 360.24, "end": 365.2, "text": "After that happened, I went to Hong Kong, to my younger aunt's place. So I departed from Hong Kong.", "zh": "这件事情发生之后，我就到了香港去了我的小姑妈那边，所以我是从香港出发的。"}, {"start": 365.2, "end": 367.28, "text": "I came to America alone, in October.", "zh": "单独的一个人，10月份的时候就来到了美国。"}, {"start": 367.84, "end": 372.64, "text": "When I arrived in America, the first problem, as everyone knows, was English.", "zh": "到了美国的时候，第一个问题就是大家知道英文的问题。"}, {"start": 372.64, "end": 382.0, "text": "You probably know that Chinese education, including education today, is like this: generally speaking, a lot of attention is paid to vocabulary and grammar.", "zh": "你们应该可能知道，中国的教育，包括现在的教育，都是这样子，一般来说是背单词、语法这方面他们很注重。"}, {"start": 382.0, "end": 390.72, "text": "As for speaking, to be honest, teachers in China at that time, including teachers today, may not even be good at speaking themselves, let alone teaching it to students.", "zh": "口语这些，说实在话，中国那时候的老师，包括现在的老师，口语上面其实可能还自己都不行，更加不要说去教学生了。"}, {"start": 391.28, "end": 393.6, "text": "I hope everyone can understand that point.", "zh": "这点希望大家能理解。"}, {"start": 393.6, "end": 406.08, "text": "In that situation, later, when I was in medical school in Shanghai, I had already finished the entrance exams and entered medical school, and there was a situation: Western countries restricted Chinese access to medical information.", "zh": "在这种情况之下，我后来就是在医学院吧，我在上海的时候已经考完了，进入医学院，进去医学院的时候，当时有一个情况，就是欧美国家对于中国的医学资料是有限制的。"}, {"start": 406.08, "end": 413.2, "text": "A lot of advanced medical information had not yet entered China very well at that time, and it was hard to find advanced medical material.", "zh": "很多医学的先进资料那时候还是没有很好的进入到中国，很难找到先进的医学东西。"}, {"start": 413.2, "end": 418.8, "text": "But the library did have a large collection of medical journals and magazines, and those journals were Japanese.", "zh": "但是图书馆确实有很大一批的医学报、医学杂志，那些杂志是日本的。"}, {"start": 419.44, "end": 424.64, "text": "At that time, Japan was the only country that opened its medical material to China on a large scale.", "zh": "那时候，唯一向中国大规模开放那些医学东西的是日本。"}, {"start": 424.64, "end": 435.12, "text": "To be fair, and Japan, with the hatred from the Second World War and the war of resistance, that we must not forget, but to be fair, at that time the medical material really did come from Japan.", "zh": "这个要实事求是，和日本有过去二战的时候，或者说抗战的时候的仇恨，这点我们不能忘记，但是需要实事求是，那时候医学的那些东西确实是来自于日本。"}, {"start": 435.68, "end": 442.32, "text": "So in university, when we studied languages, we had a choice: you could study English, or you could choose Japanese.", "zh": "所以我们大学里面学语言有选择的，你可以学英文，也可以选日文。"}, {"start": 442.32, "end": 448.96, "text": "At the time, in order to understand those medical journals, I chose Japanese, so my English actually fell behind somewhat.", "zh": "当时为了看懂那些医学杂志，我选的是日文，所以说我那时候英文反而有一些放下来了。"}, {"start": 448.96, "end": 454.56, "text": "Of course, even the English I learned in medical school was all medical terminology, not everyday language.", "zh": "当然了，哪怕是在医学院学的英文，那时候学的英文都是医学的专有名词，不是生活的。"}, {"start": 455.2, "end": 467.68, "text": "So when I had just arrived in America, I was completely unprepared. After getting off the plane, I was actually very busy, and at that time I only had two suitcases, two big suitcases, basically full of my clothes.", "zh": "所以刚刚到了美国，我一点准备都没有，下了飞机之后，其实很忙了，我那时候只有两个皮箱，两个大的皮箱，皮箱里面基本上都是一些我的衣服。"}, {"start": 468.24, "end": 474.32, "text": "Luckily I departed from Hong Kong, so my younger aunt stuffed some money into my hand, and in Hong Kong she bought me some clothes.", "zh": "还好我从香港出发的，所以我的小姑妈塞了一笔钱给我，然后在香港帮我买了一些衣服。"}, {"start": 474.88, "end": 485.76, "text": "To be honest, my clothes from China could have been worn, because in America there was not that much fuss about clothes, but my younger aunt bought me some clothes she thought were more suitable for life in America.", "zh": "本来我中国的那些衣服，说实在话，你说不能穿吧，倒也能穿，因为在美国没有太多的那个衣服的讲究，但是我小姑妈就帮我买了一些她认为比较合适于美国生活的衣服。"}, {"start": 486.24, "end": 500.08, "text": "So the most important things in my suitcases were quilts, two quilts, and some simple daily necessities. I did not bring pots, bowls, ladles and basins, because I knew that the first thing after I arrived was to stay at my eldest uncle's home.", "zh": "所以说我的皮箱里面最主要是什么呢，是被子，两床被子，然后一些简单的生活用品，我倒没有带锅碗瓢盆，因为我是知道我去了之后，第一件事是我在大舅家。"}, {"start": 500.08, "end": 512.88, "text": "After landing, I was actually very worried, because after landing I had no idea where I was supposed to go. It was my first time on a plane in my life, flying across the Pacific to America, and I had never flown on a plane before, even within China.", "zh": "下来之后，我其实是很担心的，因为下来之后，我根本就不知道那个时候我应该往什么地方走。我是第一次坐飞机，人生第一次坐飞机就跨过太平洋到美国，我从来没坐过飞机，在中国国内。"}, {"start": 512.88, "end": 516.48, "text": "When I got off the plane at the airport, I was very worried at the time.", "zh": "那时候下了飞机之后，在机场里面，我当时是非常担心的。"}, {"start": 516.48, "end": 528.08, "text": "But after getting off the plane, I was very surprised, because San Francisco is an international airport, and as I later learned, there are many Chinese people there, so the signs above basically all had Chinese on them.", "zh": "可是下了飞机之后，我很吃惊，因为旧金山是国际机场嘛，旧金山后来我才知道有很多华人，所以上面的标志牌基本上都有中文的。"}, {"start": 528.08, "end": 540.24, "text": "Even if it was not Chinese, even if it was Japanese, it was definitely there, because Japanese writing is similar to Chinese, so at a glance you could recognize it, and you immediately knew where customs was and how to get there.", "zh": "哪怕不是中文，哪怕是日文，他肯定有的，因为日文的写法和中文差不多，所以一眼就认出来了，马上就知道什么地方是海关，应该怎么样去。"}, {"start": 540.8, "end": 544.88, "text": "However, the Chinese on those signs was basically traditional characters.", "zh": "然而那时候，那个中文上面基本都是繁体字。"}, {"start": 544.88, "end": 557.2, "text": "For those traditional characters, I have to thank Mr. Jin Yong, because when we were studying at that time, we basically used simplified characters, and the only large-scale exposure to traditional characters was reading Jin Yong's novels.", "zh": "那个繁体字，我要感谢金庸先生，因为那时候我们读书，基本上都是简体字，唯一大规模接触那个繁体字，是看金庸的小说。"}]}, {"slug": "sec2", "title": "Section 2: Customs, the highway, and first hours at home", "mp3": "my-american-journey-full/sec2/sec2.mp3", "dur": "9:30", "lines": [{"start": 0.0, "end": 8.8, "text": "At that time, many people in Hong Kong smuggled them in, and they were all in traditional characters. Reading them, I gradually understood traditional characters.", "zh": "金庸先生的小说那时候从香港好多人就是偷过来，都是繁体字的，看着看着，繁体字都懂了。"}, {"start": 8.8, "end": 14.32, "text": "So when I got off the plane and saw those traditional characters, I had no problem with them, and I got through.", "zh": "所以说一下飞机看到那些繁体字，我没有问题就过去了。"}, {"start": 14.32, "end": 21.84, "text": "When I got to customs, the thing that gave me the biggest headache was the face-to-face questions from the customs officer, who took your passport and asked you questions.", "zh": "到了海关那边，最最让我头疼的就是海关的官员对你的一个面对面的问答，就是他拿了你的护照，一问。"}, {"start": 22.48, "end": 30.8, "text": "Actually it is very simple now: why did you come to America, and what are you going to do in America? Just two very, very simple questions.", "zh": "其实现在很简单，就是你为什么来美国，准备在美国做什么，其实就是两个很简单很简单的问题。"}, {"start": 30.8, "end": 36.24, "text": "I do not know whether it was nervousness or something else, but I did not understand him. I just looked at him.", "zh": "我不知道是紧张还是什么问题，就是我没听懂，然后我就看着他。"}, {"start": 36.24, "end": 45.68, "text": "He asked me a question, and now, looking back, what he was asking was: Why did you come to the United States? That is, what is the purpose of coming to America?", "zh": "那时候他就问我一个问题，现在我回来想一想，他是问什么呢，就是 Why did you come to the United States? 就是你为什么来美国，就是来问美国的目的。"}, {"start": 45.68, "end": 49.6, "text": "Although I had an immigrant visa at that time, he still had to ask you.", "zh": "虽然我是移民签证，那时候是一种移民签证，但是他还要问你。"}, {"start": 49.6, "end": 68.16, "text": "At that time I did not know how to answer. After he asked two or three times, I roughly understood what he meant. He spoke very slowly, and I understood his meaning, but I did not know how to answer. I could not put together a single word, and after holding it in for a long time, I finally managed two words: to live.", "zh": "那时候我就不知道怎么回答，后来他问了两遍三遍以后，我大致明白他的意思了，他说得很慢，我明白他意思了，但是我不知道怎么回答，我组织不出一个词来，然后憋了很久，就是憋出两个字，就是 to live。"}, {"start": 68.88, "end": 74.16, "text": "What I originally meant was that I came to America to live, to settle in America and live here.", "zh": "我本来的意思就是说，我到美国来生活，就是移居美国，到美国来生活。"}, {"start": 74.16, "end": 85.92, "text": "Now, if I had to answer, I would say: I immigrated to the United States, I will live here, I will go to school, or whatever. Anything would do. But at the time I could not get it out, I only managed to live.", "zh": "现在如果要我回答，我就说 I immigrated to the United States, I will live here, I will go to school or whatever，就什么都可以说，当时我就憋不出来，当时就憋出两个字，就是 to live。"}, {"start": 86.56, "end": 91.04, "text": "Looking back now, that sentence can also mean the same thing: for survival.", "zh": "现在看回来，其实这句话可以有个一样的意思，就是说为了生存。"}, {"start": 91.04, "end": 102.48, "text": "For survival, so at the time I could only say it like that. The immigration officer did not make things difficult for me, and did not ask more. He stamped my passport and let me through American customs.", "zh": "为了生存，所以当时就是只能这样说，那个移民官也没为难我，也没有多问，他打了一个图章，就让我进美国海关了。"}, {"start": 102.48, "end": 107.04, "text": "There was no big problem. It went much, much more smoothly than I had imagined.", "zh": "没有什么大的问题，比我想象当中顺利了很多很多。"}, {"start": 107.04, "end": 111.12, "text": "After picking up my luggage and coming out, my eldest uncle came to pick me up.", "zh": "拿好我的行李出来，是我大舅来接我的。"}, {"start": 111.2, "end": 119.44, "text": "My relationship with my eldest uncle was actually that of strangers. Why do I say strangers? Before coming to America, I had only met my eldest uncle twice.", "zh": "我和我大舅的关系其实是陌生人关系，为什么说陌生人关系呢，我一共在这个到美国之前，和我大舅只见过两次面。"}, {"start": 120.0, "end": 128.56, "text": "Once was when my maternal grandfather passed away. That was the first time I met him. He flew over from America to attend the funeral. That was the first time.", "zh": "一次是我外公去世的时候，这是他第一次见他，他从美国飞过来参加这个葬礼，这是第一次。"}, {"start": 128.56, "end": 139.84, "text": "The second time was about a year or two later, when he came again, for some paperwork and to ask about some things, and then he went back. I do not remember the details very clearly, because I was young at the time and could not manage so much.", "zh": "第二次是大概再过了一两年之后，他又来过一次，来过一次就是为了一些手续，问了一些东西，他又回来过一次，具体情况我就不大清楚，因为那时候小，我也管不了这么多。"}, {"start": 140.4, "end": 160.16, "text": "And each time, basically, when someone came back from America, it was a big deal, with relatives crowding around, like my mother's third aunt, second aunt, and all sorts of relatives I had never met suddenly appearing to see him. So I basically never spoke with my eldest uncle. We just recognized each other's faces, he recognized me and I recognized him, that was it.", "zh": "而且每一次呢，基本上就是，那时候美国回来不了起，都是前呼后拥的，像我母亲那边的三姑、二大姨什么乱七八糟的亲戚，本来就是从来没见过的，都一下都拥来了，都来见我大舅，所以我基本没和大舅说过话，就是脸说我认识他，他认识我，就这么回事。"}, {"start": 160.72, "end": 170.24, "text": "So when I came out of the airport, my eldest uncle came to pick me up. He drove his own car to pick me up, and since I only had two suitcases, once the suitcases were put in, he drove off.", "zh": "那么我出了飞机场的时候，我的大舅就来接我了，接我了，他开了自己一辆车就来接我，因为我就两个皮箱吧，皮箱一放放好之后，他开车就走了。"}, {"start": 170.24, "end": 192.48, "text": "Because, as I said, it was my first time on a plane, and I had never been on a plane at an airport. The airport in Shanghai at that time was called Hongqiao Airport, which still exists now, though it is no longer the main airport. Now Pudong Airport is the main one. At that time it was Hongqiao Airport, and I had never flown from Hongqiao Airport, because I flew from Hong Kong.", "zh": "因为我就说过了，我是第一次坐飞机，我从来没在机场坐过飞机，上海的那个机场，那时候这个机场叫虹桥机场，现在还在，现在不是主要机场了，现在浦东机场是主要的，那时候是虹桥机场，那时候虹桥机场，我没有在虹桥机场坐过飞机，因为我从香港飞的。"}, {"start": 193.12, "end": 199.6, "text": "Generally speaking, my idea was that an airport should be very far from the city, and you should have to drive a long time.", "zh": "一般的时候，我的概念就是机场离市区应该是很远的，应该很远，要开很长时间。"}, {"start": 199.6, "end": 221.84, "text": "After getting on the car, sure enough, he drove onto the San Francisco highway. At that time China did not have expressways yet, I do not mean to look down on China, it is just that in 1989 China really did not have many expressways. Once we got onto the San Francisco highway, I saw the car going very fast, with no traffic lights. My first thought was: how come America has no traffic lights?", "zh": "上去之后，果然他车在旧金山那个上去，那时候中国还没有高速公路，没有看不起中国的意思，就是确实在1989年那个时候，中国是没有什么高速公路了，一下就开上了旧金山的高速公路，我就看到这个车开得很快，没有红绿灯，我当时第一个想法就是，美国怎么没有红绿灯，就是我第一个想法。"}, {"start": 222.4, "end": 231.6, "text": "My second thought was that all along the way there were trees. Even now, if you go to San Francisco and take a plane, you will see trees all along the way, and basically you cannot see houses.", "zh": "第二个想法就是他一路开过去的话，旁边都是树，你们现在去看，就到旧金山坐飞机，你们也看到，旁边都是树木，基本上看不到房子的。"}, {"start": 231.6, "end": 237.84, "text": "So I thought, wow, America is so remote, this airport is so remote, so remote.", "zh": "我就想，哇，美国也是好偏僻啊，这个机场好偏僻好偏僻。"}, {"start": 238.4, "end": 246.0, "text": "He drove for about half an hour, and after about half an hour I started to see traffic lights, because now I know we were coming off the highway.", "zh": "他开了大概半个小时左右，半个小时左右，我开始看到红绿灯了，因为现在我知道，现在是从高速下去了。"}, {"start": 246.0, "end": 262.32, "text": "After coming off, although I saw traffic lights, I still did not see many houses, just clusters of low houses. I thought, wow, this must be a suburb, because you have to know I came from Shanghai, and by Shanghai standards, the taller the building, the more high-class it is.", "zh": "下来之后，虽然看到红绿灯，我还是没有看到太多的房子，就看到矮房子集中的矮房子，那我想，哇，这应该是个郊区，因为你要知道我是从上海出来的，上海的标准就是说，房子越高越高级。"}, {"start": 262.88, "end": 271.44, "text": "High-rise buildings, including now, many people still call them high-rise buildings. I was thinking, San Francisco is a very famous city, is it not?", "zh": "高楼，包括现在也是，好多人叫高楼大厦就是高楼大厦，我现在想，旧金山是个非常有名的一个城市吗，非常有名的城市。"}, {"start": 271.44, "end": 283.76, "text": "But I was still thinking, San Francisco is a very famous city, is it not? Yet when I looked, there were only two- or three-storey houses. The houses looked quite new, but they were completely different from the big city in my mind.", "zh": "但是就是，我想，旧金山是个非常有名的城市吗，非常有名的城市，但是就是，我一看，只有两三层楼的房子，房子都挺新的，但是和我脑子里面的一个大都市完全是两个概念。"}, {"start": 284.32, "end": 288.4, "text": "So I thought, maybe we still have to drive a long time, we are still in the suburbs.", "zh": "那我再想，可能还要开好长一段时间，我们现在还在郊区。"}, {"start": 288.96, "end": 296.72, "text": "Then, after driving for about another ten or twenty minutes, we turned a corner, and after turning, I saw a house with a door below that was open.", "zh": "然后大概又开了十几二十分钟之后，转了一个弯，转了一个弯之后，我就看到一桩房子，那个下面有一扇门是打开了。"}, {"start": 296.72, "end": 307.6, "text": "I did not know how it opened at the time. Now I know, because there was a remote control, and with one press the garage door opened, so when he drove up to it, the garage door was already open, and he drove the car in.", "zh": "我也不知道怎么打开，那时候我不知道，现在我是知道，因为那时候有一个遥控器，一按的话，那个车库门就打开了，所以他开到他前面的时候，车库门已经开着了，开着了，他就把车开进去了。"}, {"start": 308.16, "end": 310.96, "text": "Even as slow as I was, I knew we had arrived home.", "zh": "那我那时候再笨，我也知道就到家了。"}, {"start": 311.36, "end": 318.0, "text": "But inside I felt very sad, because I thought, oh, my eldest uncle's life is too, too difficult.", "zh": "但是心里就是觉得很难受，因为我觉得，哎呀，我的大舅的生活太太困难了。"}, {"start": 318.56, "end": 328.16, "text": "Why did I think that? Because my eldest uncle actually lived in the suburbs, and looking around, there were no high-rise buildings at all, just two-storey houses, one after another.", "zh": "为什么我会这样想呢，就是说，我大舅其实住在郊区，附近连高楼都没有，因为一眼看过去，没有一种高楼，都是两层楼的房子，一栋栋还在那边。"}, {"start": 328.16, "end": 333.6, "text": "To be honest, in Shanghai, those houses would basically count as bungalows. That was my feeling.", "zh": "这种房子，说实在话，在上海的话，在我们上海的话，基本上是算一种平房来的嘛，就这么一个感觉。"}, {"start": 333.6, "end": 340.4, "text": "This bungalow, oh, my eldest uncle's life is too miserable. He cannot even afford a high-rise, he can only live in this kind of house.", "zh": "这个平房，哎呀，我的大舅这个生活太惨了，高楼都住不起，只能住这种房子。"}, {"start": 340.96, "end": 352.24, "text": "Although this kind of house looked quite tidy, it must be in the suburbs, far from downtown, a bit like what Shanghai people at that time called the lower corner, that is, a place very far from downtown.", "zh": "这种房子虽然看上去还挺整洁的，但是一定是郊区，离开市区远的，就有点像上海我们那时候叫下只角，也就是说，离市区很远的一个地方。"}, {"start": 352.8, "end": 359.12, "text": "At the time, my verdict on my eldest uncle was that he was a very, very poor man, a poor family.", "zh": "当时我对我的大舅的评价，就叫他是一个非常苦的一个穷苦人家，一个穷苦人家。"}, {"start": 359.12, "end": 363.84, "text": "After arriving home, my eldest uncle briefly showed me around the house. It had two floors.", "zh": "到了家之后，我大舅就略微带我在房子里面转一圈，他是上下两层。"}, {"start": 363.84, "end": 374.0, "text": "Upstairs were the main rooms: a living room, a dining room, a kitchen, a bathroom, and two bedrooms. One bedroom was, of course, my eldest uncle and aunt's, and the other was next to it.", "zh": "楼上是主要的，楼上有一个客厅，一个饭厅，一个厨房，一个洗手间，还有两间睡房，一间睡房当然是我的大舅和大舅妈睡的，另外一个呢。"}, {"start": 374.56, "end": 386.8, "text": "My eldest uncle had three sons. Two sons were born when he was working hard in Hong Kong, and were brought to America. The youngest son was born in America, so there was quite a big age gap between him and his two elder brothers.", "zh": "我的大舅有三个儿子，两个儿子是当时他在香港打拼的时候生的，然后带到美国的，小儿子是在美国出生的，这个小儿子所以和两个大儿子年龄相差还是比较大一点。"}, {"start": 387.36, "end": 390.64, "text": "So the youngest son lived upstairs, right next to his parents' room.", "zh": "所以那个小儿子是住在楼上，就在父母亲的房间隔壁。"}, {"start": 391.2, "end": 457.76, "text": "Downstairs was originally a garage that could hold two cars, and he partitioned off the back part, turning it into living space, with a bathroom and three ordinary rooms.", "zh": "楼下其实本来是停车的一个车库，可以停两辆车，然后他把后面一截全部隔起来，就变成了一个居住地方，有一个洗手间，有三间房，有三间普通的房间。"}, {"start": 457.76, "end": 466.48, "text": "His two sons lived downstairs, one room each, and there was one room that was originally a living room, left empty. That room became my temporary living place, with a mattress and a table in it, just that simple.", "zh": "他两个儿子就在楼下住，一人一间房间，然后有一间房间本来是客厅，还空出一间房间，那么这间房间就是变成了我一个临时的居住的地方，有一个床垫在，有一张桌子在，就这么简单。"}, {"start": 467.04, "end": 489.52, "text": "After my eldest uncle showed me around, he told me, just live here, and said he had to go back to his shop to look after it, because he ran his own shop, though I did not understand what kind of shop it was at the time. He said he had to go to the shop to have a look, because now my aunt was watching it, and then he said I could just live there, and if I wanted to eat anything, there was food in the fridge, I could just take it myself.", "zh": "然后我大舅在带我转了一圈之后，就告诉我，你就在这住吧，他说我还要回我自己的店里去照顾一下，因为他是他告诉我他自己开店的，具体什么店当时我还不了解，他说我要去店里面看一看，因为现在是我的大舅妈看着，然后他就说我就在里面住的就可以了，如果想吃什么，冰箱里面有，你自己拿吧。"}, {"start": 490.08, "end": 499.52, "text": "After entering the house, once my eldest uncle left, I was the only person in the whole house, because his three children had not finished school yet. I was alone at home.", "zh": "进入到了那个房子里面之后，我大舅走了之后，整个房间里面只有我一个人了，因为我大舅的三个孩子还没下课，家里就一个人。"}, {"start": 499.52, "end": 510.16, "text": "I did not know what I should do. Some things I understood: I knew how to use a flush toilet, because some families in Shanghai had them, and I had seen them and knew how. But I did not know how to use the shower switch.", "zh": "我也不知道该怎么样动，虽然有些东西我懂，抽水马桶会用吗，会，因为上海有些家庭还是有的，我见过，我会，洗澡的开关我不会动。"}, {"start": 510.72, "end": 534.56, "text": "I did not know, because I had no concept at that time that a house should have hot water, because in Shanghai, to take a bath at that time you had to boil water first, and only then could you bathe, or else you went to a bathhouse. There was no hot water at home. Now, of course, that is nothing unusual, but at that time there was none.", "zh": "我不知道，因为我那时候没有概念，房子里面要有热水，因为上海洗澡的话，那时候要烧开水，然后才洗澡的，没有，要么去澡堂里面，没有家里有热水的，现在当然就不稀罕了，那个时候是没有的。"}, {"start": 534.56, "end": 540.4, "text": "So I did not know you could bathe like that. Actually, after getting off the plane, I really wanted to wash up, but I did not know there was hot water inside.", "zh": "所以我不知道是可以这样洗澡，其实我那时候下飞机，我确实想洗一洗，但是我不知道里面有热水。"}, {"start": 540.4, "end": 551.36, "text": "Was I hungry? I was indeed a bit hungry, because before getting off the plane I had eaten a little on the plane, but the food on the plane was not that filling, especially for a twenty-year-old young man, was it not?", "zh": "饿吗，我确实有点饿了，因为飞机上，下飞机之前有一点吃的，但是到了之后，飞机上的东西并不是这么饱，那时候像个二十岁的小伙子，是不是。"}, {"start": 551.36, "end": 561.6, "text": "I had seen a fridge before, and I knew how to use one, that was no problem, but when I opened the fridge he mentioned, I did not recognize a single thing inside, not one thing.", "zh": "冰箱我见过，冰箱我也见过，也知道怎么样用，这倒无所谓，但是我打开他说的那个冰箱里面的东西，我一样都不认识，一样都不认识。"}, {"start": 561.6, "end": 569.76, "text": "I did not know where to get water, and I did not know which water was drinkable, because tap water in Shanghai at that time could not be drunk, you had to boil it first.", "zh": "说去哪里倒水，我都不知道在什么地方倒水，不知道哪些水是可以喝的，因为上海那时候的自来水是不能喝的，你一定要烧开。"}]}, {"slug": "sec3", "title": "Section 3: Fridge, first meal, and beef at New Year", "mp3": "my-american-journey-full/sec3/sec3.mp3", "dur": "9:07", "lines": [{"start": 0.0, "end": 6.4, "text": "I found they did not even have a kettle, a kettle for boiling water, I did not know how to boil water.", "zh": "我发现他们连那个水壶都没有，烧开水的那个水壶都没有，我都不知道该怎么烧水。"}, {"start": 6.4, "end": 8.4, "text": "So I just sat there, stuck.", "zh": "我就在那边，愣住了。"}, {"start": 8.96, "end": 29.12, "text": "And my eldest uncle probably never thought about this problem, because he had only returned to Shanghai twice, and each time he was surrounded by people and stayed in a hotel, so he had no idea that our living situation was like that. He did not understand, so he never taught me.", "zh": "而我大舅可能从来没想过这个问题，因为他后期回上海的只有两次，被人这样簇拥着，而且住在宾馆里面，他根本就不知道我们的生活情况是这么样的一种情况，他不清楚，所以他也没教过我。"}, {"start": 29.12, "end": 39.44, "text": "Then, opening the freezer compartment above, it was full of boxes, box after box of things, and I did not know how those boxes were supposed to be used. Should they be taken out and cooked in a pot, or eaten cold just like that?", "zh": "然后，打开上面那个速冻箱里面，都是一个一个盒子的东西，一盒的东西我也不知道这盒东西应该怎么样用，是拿出来在锅里煮呢，还是就这样吃冷的。"}, {"start": 39.44, "end": 44.32, "text": "To be honest, at that time in Shanghai, people said Americans eat cold food, they never eat hot food. I was not sure.", "zh": "确实在上海那时候，老实说，美国人都吃冷的，他从来不吃热的，我也不清楚。"}, {"start": 44.32, "end": 55.44, "text": "So I just sat there, unpacked my luggage, made my quilt, hungry as I was, but I did not know what to do. I had absolutely no concept of it.", "zh": "所以我就在那边坐着，坐着就把那个行李打开，把被子铺好，肚子饿是饿，但是我也不知道该怎么办，一点没有这个概念。"}, {"start": 55.44, "end": 65.04, "text": "Then, roughly, I arrived in San Francisco and got to my uncle's home at around one o'clock in the afternoon, a little after noon, around one o'clock, and by around three o'clock, my eldest uncle's three sons came home.", "zh": "然后大概，我到了旧金山，然后到我大舅家的话，应该中午多一点点，应该是下午一点钟左右，然后到三点多的时候，我的大舅三个儿子回家了。"}, {"start": 65.04, "end": 74.72, "text": "The eldest and second sons, because they were born in Hong Kong, could speak Cantonese, they understood Shanghainese, but their Mandarin was no good, so I could only say hi to them.", "zh": "三个孩子回家了，这个大儿子、二儿子呢，因为他在香港出生的，会说广东话，上海话他听得懂，普通话不行，所以我跟他说只能说嗨。"}, {"start": 74.72, "end": 78.16, "text": "At that time I learned something: I watched what they were doing.", "zh": "那当时我就学了一样事情，就是我看他们在干什么。"}, {"start": 78.16, "end": 93.44, "text": "In 1989, many families in Chinese cities had fridges. I say I had seen a fridge, indeed many families had fridges at that time, but our family did not, because my parents were primary school teachers and could not afford one.", "zh": "89年，在城市里面，中国很多家庭有冰箱，我说我冰箱我见过，确实那时候好多家庭有冰箱，我们家没有，因为我父母亲是小学老师，买不起，没有。"}, {"start": 93.44, "end": 102.88, "text": "But the main use of a fridge in China at that time was to put leftover food in after dinner at night, or in summer to chill some watermelon. That was its main use.", "zh": "但是中国那时候的冰箱，最主要是晚上吃完饭剩菜放冰箱里面，或者说夏天冷一些，放一些西瓜，最主要这个作用。"}, {"start": 102.88, "end": 116.96, "text": "It was not like in America, where the fridge is stuffed full of a week's worth of food, at least several days' worth of food. That was different from Shanghai, because in Shanghai you bought vegetables at the market, and in 1989 it was all markets, you went out every day to buy that day's vegetables.", "zh": "而不是像美国，美国他里面冰箱里面塞满东西，要塞一个星期吃的的东西，最起码几天吃的的东西，和上海不一样，因为上海买菜，你有菜市场，89年的时候都是菜市场，你跑出去每天买，当天买菜的。"}, {"start": 116.96, "end": 124.56, "text": "But leftover food, they did put in the fridge, that use existed in 1989, it was not the same. You have to consider that point.", "zh": "但是剩菜，他们有放冰箱这个作用，在89年的时候是不一样的，要考虑到这一点。"}, {"start": 124.56, "end": 141.84, "text": "Frozen food, what we call frozen food, in 1989 China did not have it, or had very little of it, or it was very expensive. There was no such thing, because microwave food, microwave food, in 1989, if you were in 1989, you did not have it, right?", "zh": "那种速冻食品，我们叫做速冻食品，89年中国是没有的，或者说极少的，又或者极贵的，这种东西没有的，因为这种叫微波炉食品吗，微波炉食品，那时候你在89年，你如果在89年，没有的，对不对。"}, {"start": 141.84, "end": 158.24, "text": "The drink bottles in the American fridge were indeed in English. Do you think I could not read them? I could read them, I could read Coca-Cola and things like that, but I did not dare to drink them.", "zh": "美国的冰箱里面的饮料瓶子上面，确实是英文，你说我看不懂吗，我也看得懂，可口可乐这种东西我都看得懂，但是我不敢喝。"}, {"start": 158.24, "end": 159.24, "text": "Why? Because in 1989, Coca-Cola in China was very expensive, it was a luxury.", "zh": "为什么，因为89年的时候，可口可乐在中国非常贵，是奢侈品来的。"}, {"start": 159.24, "end": 169.12, "text": "So after I arrived at my eldest uncle's home, my first idea, now called my first idea, was that my eldest uncle's home was very poor, living in the suburbs, such a poor idea.", "zh": "所以我到我大舅家之后，我刚开始第一个概念，现在叫我第一个概念，是我大舅家很穷，住的郊区，是这么一个穷的概念。"}, {"start": 169.12, "end": 173.04, "text": "So my feeling was that I should not add to my eldest uncle's burden.", "zh": "所以说我的感觉，我不应该为我大舅增加负担。"}, {"start": 173.04, "end": 185.28, "text": "There were indeed several cans of those drinks inside, Coca-Cola, Sprite, and so on, but I did not dare to drink them, because I was afraid those expensive things would cause difficulties for my eldest uncle's life.", "zh": "这种饮料里面确实有好几罐在，可口可乐、雪碧什么都在，但是我不敢喝，我怕太贵的东西，然后给我大舅造成生活的困难。"}, {"start": 185.28, "end": 188.48, "text": "So I thought he probably just put them there for the children to use, or as something to drink only rarely.", "zh": "所以我想，他可能只是摆在给孩子们用，或者说是难得喝一口的那种东西。"}, {"start": 188.48, "end": 201.28, "text": "They were just for show. Nobody at home was allowed to touch them, they were just there for other people to see, to show that our home had this, as if it were very high-class. Actually, my husband and I never dared to touch them.", "zh": "就装样子，家里谁都不能碰的，就给别人看，就是我家里有这个，好像很高档一样，其实我们从来不敢碰的。"}, {"start": 201.28, "end": 217.44, "text": "There were two cans that my younger aunt brought from Hong Kong. Actually she did not bring them herself, they were given to her when she got off the plane, two cans of that stuff, and she put them at home like an exhibition piece, to show that our home had them.", "zh": "有两罐是我这个小姑从香港带过来的，他其实也不自己带过来，就是下飞机的时候送了两罐那个东西，他放在家里像一个展览品一样的了，就显得我们家里有啊。"}, {"start": 217.44, "end": 222.16, "text": "So in that situation, I did not dare to drink, I did not dare to drink. I just thought, a little water would do, just drink a little water.", "zh": "所以这种情况的话，在这种情况下，我不敢喝，我不敢喝，我就想，有点水就可以了，喝点水就可以了。"}, {"start": 222.72, "end": 232.72, "text": "Later, I really could not hold out any longer. You sit there for such a long time, and then I thought, I must drink some water.", "zh": "后来呢，就是我实在忍不住了，你坐在那边坐这么长时间啊，然后呢，就是我想，一定要喝点水吧。"}, {"start": 232.72, "end": 244.08, "text": "So I held back and asked my two cousins, one older than me and two younger than me, actually one older cousin and two younger cousins, and I asked them, I said water, water, I still understood that word.", "zh": "所以我就问我的两个表哥表弟，一个比我大，两个比我小，一个是表哥，两个表弟啊，然后我就问他们，我说 water，水，我还懂啊，就这样子。"}, {"start": 244.64, "end": 254.0, "text": "Then my cousins understood water, and they very casually took a cup, opened the tap, and gave me a cup of water.", "zh": "然后我那两个表哥表弟都听懂了 water，他们就很随便地就拿一个杯子，在自来水里面打开一杯水给我了。"}, {"start": 254.0, "end": 267.36, "text": "Because at that time, this is how I was thinking, and you have to understand how I was thinking at the time: were they looking down on me, thinking I should just drink this kind of tap water? Because in Shanghai, from childhood, we were always told absolutely never to drink raw water.", "zh": "因为那么当时我是怎么样想法的，你要理解我当时想法，我当时想法，他们是不是看不起我，觉得我应该就喝这种自来水，因为在上海，我们从小到大老是都叫绝对不能喝生水。"}, {"start": 267.36, "end": 280.72, "text": "But after waiting a while, I saw that they also drank tap water like that, so I gritted my teeth and took a sip. Indeed, there was no bleach taste, indeed no strange taste, it was quite normal, so I drank it.", "zh": "可是我在等一会的话，我看见他们两个也是自来水这样一喝了，那我就咬咬牙就喝了一口，确实没有漂白水的味道，确实没有怪的味道，确实很正常，我就喝了。"}, {"start": 280.72, "end": 298.48, "text": "After drinking it, I was still worried I would get diarrhea. I told myself again and again that I must not get sick, but I had brought some berberine with me, and I was prepared, in case my stomach felt uncomfortable, I still had a remedy. I must not go to hospital, that would be another big burden.", "zh": "喝完之后，我还很担心我会拉肚子，我再三告诉自己不能生病，但是我带了一些黄连素在，我还准备好了，万一肚子不舒服，我还是有办法，千万不能去医院，这也是大的负担，又是一个大的负担。"}, {"start": 298.48, "end": 299.48, "text": "After drinking it, nothing happened.", "zh": "喝下去没什么事情。"}, {"start": 299.48, "end": 310.72, "text": "My cousins were also very nice. When they came back, they opened a packet of something, which I now know was potato chips, and each of them took a handful and ate them there, and then did their homework.", "zh": "两个表哥表弟也挺好，他们回来的时候，就是他们打开了一包东西，就是现在我知道是薯片，薯片一人一把，就在那边吃了，吃了就做功课。"}, {"start": 310.72, "end": 323.6, "text": "Actually, I did not know what was going on, and they just showed me and let me take some myself. I watched them eating a big packet, the economical big packet they had bought, opened and eaten there, not a small packet, a big packet, because the three sons at home ate a lot.", "zh": "其实我都不知道什么事情了，他们就直接给我看，让我自己去拿，我看他们在吃一大包，就是他们买了那种经济的一大包，打开就在那边吃，也不是那种小包的，大包，因为他们三个儿子在家里的食量大。"}, {"start": 323.6, "end": 330.16, "text": "So I grabbed a handful and ate it, and with the water I had drunk, I had something in my stomach, and because it was salty, I felt at ease all at once.", "zh": "我就抓了一把吃了，喝了那个水，吃了吃完之后，那肚子里面有点东西，而且这个是咸的东西，一下子，那就心安了下来。"}, {"start": 330.72, "end": 344.96, "text": "Once I felt at ease, I still did not dare to walk around or run around. I just sat in the room, in the house, and then walked around the backyard roughly, and then sat inside. I did not dare to move around randomly.", "zh": "心安了下来，但是我也不敢乱走，也不敢乱跑，我就坐在房子里面，房间里面，然后去我的后院大致走了一圈，就坐在里面，我不敢乱动。"}, {"start": 344.96, "end": 353.76, "text": "I did not dare to talk or move randomly, because there was no one to talk to, and at that time my language communication was still a problem.", "zh": "我不敢乱说乱动，说也没人说，我表明到那时候，和我那个语言交流还是有问题的。"}, {"start": 353.76, "end": 358.56, "text": "So I waited like that until around ten or eleven o'clock at night, when my eldest uncle roughly came back.", "zh": "就这样子一直等到了晚上10点、11点的时候，10点、11点的时候，我大舅才回来。"}, {"start": 358.56, "end": 369.36, "text": "After my eldest uncle came back, he probably asked my cousins upstairs about how I was doing. When I heard my eldest uncle had come back, I went upstairs to greet him. I had not eaten dinner.", "zh": "我大舅回来之后，他在楼上可能是和我那个表哥表弟问了一下，就是说我怎么样情况，那我听到我大舅回来，我上楼打招呼，我晚饭都没吃。"}, {"start": 369.36, "end": 377.36, "text": "Oh, I did not know what to eat. It was not that, well, everyone saw me and said, hey, did I not tell you there is food in the fridge? Why did you not eat?", "zh": "哎呦，我不知道吃什么，不是吧，那大家就看到我了，他说，哎，我不是告诉你冰箱里有，你为什么不吃。"}, {"start": 377.36, "end": 381.84, "text": "I said, I do not know what to eat. My eldest uncle originally thought that those things did not suit my taste.", "zh": "那我说，我不知道吃什么，我大舅本来以为呢，就是说，这些东西不合胃口。"}, {"start": 381.84, "end": 389.44, "text": "He said, this is beef, pork, you can eat all of them, is there anything you do not eat? I said, I eat everything.", "zh": "他说，这是牛肉啊，猪肉啊，你都可以吃的，你什么东西不吃吗，我说，我什么东西都吃啊。"}, {"start": 389.44, "end": 401.44, "text": "He said, have you eaten like this? He knew I did not know how to eat them. I told my eldest uncle quite frankly, I said, I do not know what it is, you tell me what to eat.", "zh": "他说，你这样吃了吗，就知道我不知道怎么吃，我就和大舅相当坦白地说，我说，我不知道是什么，你让我吃什么。"}, {"start": 401.44, "end": 409.84, "text": "Only then did my eldest uncle react. He said, oh, you have never seen this, you do not know what this is. It is very simple. He took out box after box of things.", "zh": "哦，我大舅那时候才反应过来，他说，哦，你没见过，你不知道这种东西啊，这很简单，哎呀，他去拿出一盒一盒东西。"}, {"start": 409.84, "end": 423.6, "text": "That thing, I still remember it now: one piece was minced beef, a beef patty, and next to it was mashed potato, a mashed potato sauce, and then a sauce, and also a lot of corn and things like that.", "zh": "那个东西，现在我自己还记得啊，是一块牛肉碎的牛肉饼，然后旁边呢，是一颗土豆泥，土豆泥酱啊，然后一个酱，然后呢，还有好多那个玉米这种东西。"}, {"start": 423.6, "end": 434.48, "text": "My eldest uncle took out a box, put it in the microwave, and after about an hour or so, well, he took it out and gave it to me to eat. Then he told me, if you want to eat this meal, there is bread below, you take it yourself.", "zh": "我大舅就拿出一盒，放在微波炉里面，大概过了一个多小时，热了，就给拿出来给我吃，当他就告诉我，你想吃这餐，他说，下面还有面包，你要自己拿。"}, {"start": 435.12, "end": 441.36, "text": "That was when I ate my first proper meal in America, my first proper meal, and it was microwave food.", "zh": "那我那时候才是在美国吃了正式的第一餐，正式的第一餐，是微波炉食品。"}, {"start": 441.36, "end": 449.52, "text": "And it was all right, also because of the ingredients, my stomach at that time was not that hungry anymore, not too hungry, and the ingredients were good.", "zh": "而且一直还好，就是食材的关系嘛，食材的关系，我肚子那时候反而不饿了，不是太饿了，那食材的好。"}, {"start": 450.16, "end": 455.36, "text": "After eating, after eating my first meal in America, I could finally sleep peacefully.", "zh": "吃完，吃完我在美国的第一餐之后，终于可以安心的睡觉了。"}, {"start": 455.36, "end": 459.44, "text": "My first day in America passed in this completely unfamiliar environment.", "zh": "我在美国的第一天，就在这个完全不懂的环境当中，过去了。"}, {"start": 459.44, "end": 466.0, "text": "That night, I remember very clearly, it rained in San Francisco. San Francisco generally rarely rains.", "zh": "那天晚上，我记得很清楚，旧金山下了一场雨，旧金山一般很少下雨。"}, {"start": 466.48, "end": 474.08, "text": "Someone in the audience asked me whether that microwave food was tasty. Yes, it was tasty, so tasty. I am not saying the opposite.", "zh": "有位观众问我，那个微波炉食品好吃吗，好吃，太好吃了，我这个倒不是说反话。"}, {"start": 474.64, "end": 489.36, "text": "First, I was hungry. Second, in Shanghai at that time, and I will say this again, please do not argue with me about it, it is not that Shanghai had no beef, Shanghai did have beef, but our family could not afford it, our family could not afford it.", "zh": "一是饿了，第二个，在上海的时候，我再说，大家千万不要顶我啊，不是上海没有牛肉，上海是有牛肉，我们家买不起，我们家买不起。"}, {"start": 489.36, "end": 512.08, "text": "In our family, we ate beef only at Chinese New Year, at New Year, normally pork and fish were the main foods, never beef. Beef was definitely only at New Year, when we cooked a big pot of beef, and it was a big piece of beef, not sliced beef, just a big pot of beef soup, and when relatives and friends came, every day we would take out a pot for everyone to eat. Only then could we eat beef.", "zh": "我们家吃牛肉，只有过年的时候，过新年的时候，平时猪肉、鱼肉为主，从来没有牛肉的，牛肉一定是在过年的时候，煮一大锅牛肉，而且是一大块牛肉，不是切那个牛肉片的，就是一大锅牛肉汤，亲戚朋友来的时候，每天就是拿一锅出来，大家吃，那时候才能吃牛肉。"}, {"start": 512.64, "end": 528.64, "text": "It is completely different now. Everyone, please remember, that was in the 1980s, my parents were primary school teachers, their wages were extremely low, and my grandmother had no retirement pay, nothing, no retirement wages. That was the product of such a family situation.", "zh": "和现在完全不一样啊，大家千万记住，那是在1980年代的时候，我父母亲是小学老师，工资是极低的，我奶奶是没有什么退休工资的，是这么一个家庭情况之下的一种产物。"}, {"start": 529.2, "end": 539.12, "text": "If you say, oh, in my place we can eat beef every day, I believe you, because different places in China, different family backgrounds, different incomes are different.", "zh": "如果你们说，哎呀，我这个地方每天都可以吃牛肉，我相信你，因为在中国不同地方，不同家庭的背景，不同的收入情况不一样。"}, {"start": 539.12, "end": 547.12, "text": "I never said Chinese people cannot afford beef. Do not argue with me about that. It is that our family could not afford it, right?", "zh": "我从来没有说过中国人吃不起牛肉啊，别顶我啊，是我们家吃不起啊，是吧。"}]}, {"slug": "sec4", "title": "Section 4: Second morning and setting out for the post office", "mp3": "my-american-journey-full/sec4/sec4.mp3", "dur": "8:58", "lines": [{"start": 0.0, "end": 16.32, "text": "So first, that beef, I thought it was very fresh and fragrant. Of course, it may have had a lot of seasonings or chemicals in it, I do not care about that, I only know it was tasty. That is all there is to it.", "zh": "所以第一个，他那个牛肉，我觉得很鲜很香，当然了，里面放了可能有很多调味品啊，或者化学品啊，这个我不管了，我只知道好吃，就这么一回事情。"}, {"start": 16.32, "end": 26.64, "text": "Then, after sleeping, after sleeping, the next morning I woke up. The next morning when I woke up, because you know my eldest uncle said yesterday that he generally does not come home until eleven at night, he had not woken up yet, because I had jet lag and woke up early.", "zh": "那么，睡了一觉之后，睡了一觉之后，我第二天早上醒来，第二天早上醒来的时候，因为你知道我大舅昨天说了吗，一般晚上到11点才回家，他都没起来，因为我有时差，早就醒过来了。"}, {"start": 26.64, "end": 37.6, "text": "And the other reason I woke up was that my cousins woke up to go to class, to go to school, so early in the morning they left, and their sounds woke me up.", "zh": "醒过来，我也因为，我醒过来的另外两个原因呢，是我的那个表哥表弟呢，他醒过来要去上课了，要去上学了，所以大清早他们就走了，啊，所以呢，他们的声音呢，把我吵醒了。"}, {"start": 37.6, "end": 42.48, "text": "Once I woke up, I did not dare to talk or move randomly, because I was afraid of waking my eldest uncle and them while they were sleeping.", "zh": "吵醒了，我又不敢乱说乱动，因为我怕吵着我的大舅他们睡觉。"}, {"start": 42.48, "end": 56.48, "text": "At that time, breakfast was another problem, an
