other problem. What about breakfast in the morning? Should I still use the microwave? Because at that time, the microwave was upstairs, there was no microwave downstairs, there was a microwave upstairs.", "zh": "那时候，早餐呢，又是一个问题了，又是个问题了，早上是什么，还是拿微波炉吗，因为我那时候，那个微波炉呢，他是放在楼上的，楼下没有微波炉，楼上有一台微波炉在。"}, {"start": 56.48, "end": 66.64, "text": "If I went upstairs to use the microwave, would I wake my eldest uncle? I did not dare. Downstairs there was also a fridge, but no microwave.", "zh": "那我上去去微波炉呢，会不会吵醒我的大舅，我又不敢，他楼下也有个冰箱，但是没有微波炉。"}, {"start": 66.64, "end": 81.36, "text": "Someone asked whether, if you study medical imaging, radiology, you can stay in America now. The demand for medical personnel in America is very large, very large. Whether you can stay in America mainly depends on whether you can find someone willing to sponsor your job. It is possible.", "zh": "有一位问，现在去读医疗影像类的 radiology，还能留在美国吗，美国医疗方面的需求是很大的，医疗人员需求很大的，能不能留在美国，最主要看你能不能找到有人愿意负担你的工作，有可能。"}, {"start": 81.36, "end": 97.28, "text": "Someone said, do those cousins not speak Mandarin? My cousins, my eldest cousin and second cousin, were born in Hong Kong, they speak Cantonese, they do not speak Mandarin. The youngest son was born in America, and he cannot speak either language very well.", "zh": "有一位说，那个表哥表弟不说普通话吗，表哥表弟，因为我的两个表哥，大表哥和二表弟呢，他们是香港出生的，他们说广东话，普通话不会说的，小儿子是在美国出生的，两方面都说不得来的。"}, {"start": 97.28, "end": 106.88, "text": "But because my eldest uncle and aunt communicated in Shanghainese, they understood Shanghainese, they just could not speak it. That is how it was.", "zh": "但是因为我大舅和大舅妈呢，是用上海话交流的，所以他们听得懂上海话，他们说不来，说不来是这么一回事。"}, {"start": 106.88, "end": 111.76, "text": "So in the morning I was there, not knowing what I should eat. Later I happened to discover that downstairs there was a bundle, a big packet of bread.", "zh": "那么，我早上就在那边，我不知道应该吃什么好，后来呢，我偶然发现的就是那个下面有一捆，一大包的面包。"}, {"start": 112.32, "end": 128.24, "text": "At the time I absolutely felt like I was stealing, taking just one or two slices of the crust, the edge pieces, because bread has crusts on the sides, and I did not even dare to eat the middle part, because in Shanghai bread was very expensive.", "zh": "当时呢，我绝对是一种偷偷的感觉，就是拿了，就是因为面包一长条嘛，它旁边有边料的嘛，我就拿了一两片那个边边的料，当中那个我都不敢吃啊，因为上海买面包很贵的。"}, {"start": 128.24, "end": 142.8, "text": "Let me tell you again, at that time in the 1980s, buying bread in Shanghai was very expensive, and this kind of sliced bread was expensive. My mother would only buy a small kind of bread, not a cream cake, on my or my younger sister's birthday, for us to eat. That was how it was.", "zh": "再告诉你啊，当时我们在八几年，在上海买面包是很贵的，而且这种方包是贵的啊，我母亲只有在我或者我妹妹生日的时候，她不买那个奶油蛋糕，就是买一个小小的一种面包，给我们吃，就这么回事情的啊。"}, {"start": 143.36, "end": 157.6, "text": "And at that time, there was a famous bakery, they would buy one, and on top there was no cream, just for our birthday, to eat one like that. In my mind, bread was an expensive thing, not a cheap thing.", "zh": "而且在那时候，是老新闻吧，老新闻那有一个糕点店，他们就买了一个，而上面没有奶油的，就生日给我们这样吃一个，在我脑子里面，面包是贵的东西啊，不是便宜东西啊。"}, {"start": 157.6, "end": 166.88, "text": "At the time, of course, I do not eat it now, I took two slices, and with tap water, I just ate and drank like that. That was the first breakfast in the morning, or you could say it was just to fill my stomach.", "zh": "当时情况，现在当然是我吃都不吃了，拿了两片，或者就自来水，就这么喝了吃了，这早上的第一顿早餐，或者说你可以说就是填肚子。"}, {"start": 166.88, "end": 183.36, "text": "Of course, at around ten o'clock, my eldest uncle got up. After he got up, he looked at what he wanted for breakfast. At that time I thought about breakfast, and I said I did not know what you had, and then my eldest uncle said, well, let us fry an egg.", "zh": "当然，我就呢，就大概十点多的时候起来了，十点多起来之后，他又看看他早餐想吃什么，那个时候才想早餐什么，我说我也不知道你们有什么，是不是，后来我的大舅就说，那么就煎个蛋吧。"}, {"start": 183.36, "end": 187.92, "text": "He very simply fried an egg, one egg, and then the bread was no longer cold bread like that, he toasted it, toasted it until it was a little burnt.", "zh": "他就很简单的，就是煎了一个蛋，一个蛋，然后又那个面包，就是不是这样子冷的面包了，他就烤一下，烤一下，有点焦。"}, {"start": 188.48, "end": 198.72, "text": "Then he took out a box of something. What is this thing? Now we call it butter, butter, and he spread the butter on top.", "zh": "然后呢，就是拿出了一盒东西，这个东西是什么呢，现在我们叫 butter，就是牛油嘛，牛油，把那个牛油上面一涂。"}, {"start": 198.72, "end": 203.68, "text": "Then think about it, that freshly toasted, crispy bread, with a layer of butter spread on top, once you spread it on, the aroma came out all at once.", "zh": "那么你想想看，那个刚刚烤出来的脆脆的，然后上面涂一层牛油，这么一涂涂上去之后，一下子香味就出来了。"}, {"start": 204.24, "end": 219.2, "text": "My eldest uncle had no milk at home. Why did my eldest uncle have no milk? Because everyone in our family has lactose intolerance, lactose intolerance, so my eldest uncle and his family could not drink milk, and they did not prepare any at home.", "zh": "我大舅家没有牛奶，为什么大舅家没有牛奶的，因为我们家族的人，所有的人都是那个乳糖不耐症，lactose intolerance，所以呢，我大舅他们喝不了牛奶的，喝不了牛奶，所以他家里也没准备。"}, {"start": 219.2, "end": 238.88, "text": "Luckily they did not prepare any, because at that time I did not know I was lactose intolerant either, lactose intolerant. If there had been milk at the time and I had drunk milk, I would really have had to run to the bathroom. Luckily, luckily, I only found out later, later I slowly understood and then discovered this problem.", "zh": "还好没有准备，因为那时候我也不知道自己是 lactose intolerance，就是乳糖不耐症的，如果当时有牛奶，我喝了牛奶的话，那么真的要跑洗手间了，还好还好，后来我才知道，后来我后来就是自己慢慢懂了之后，才发现这个问题。"}, {"start": 238.88, "end": 252.96, "text": "My eldest uncle at that time had no milk. In the morning they drank directly, what did they drink? They drank cola. At that time my eldest uncle asked me what I wanted to drink, cola or Sprite or something, and my eldest uncle gave it to us, and of course I ate it, and my taste still preferred Sprite, and in the end I took Sprite.", "zh": "我大舅那时没有牛奶，早上他们直接喝什么，就喝可乐，那时我大舅就问我要喝什么，可乐还是雪碧还是什么，那我大舅给我们嘛，我当然就吃了，我的口感还是喜欢雪碧，我最后来拿了雪碧。"}, {"start": 252.96, "end": 263.28, "text": "So it was two slices of bread, one egg, butter spread on thickly, plus a cup of Sprite. That was my breakfast that day.", "zh": "就是两片面包，一个蛋，牛油一涂，再加一杯那个雪碧，这就是我的早餐，那天早餐。"}, {"start": 263.28, "end": 272.32, "text": "Oh, I really thought that butter smelled wonderful, I spread the butter on thickly, and my eldest uncle looked at me, he cooked so much, and I said it was not necessary, it was tasty, in the end it was tasty.", "zh": "哎呀，我真的觉得那个牛油香啊，我牛油涂得厚厚一层，我大舅就看着我，他都煮这么多，我说我没必要，好吃，我最后好吃。"}, {"start": 272.32, "end": 282.88, "text": "That was my first morning in America. In the morning, then my eldest uncle said, you rest first, rest, and he gave me a key to the house.", "zh": "这就是我在美国的第一个早上，早上，那我然后大舅说，你们先休息吧，休息吧，他就把家里的钥匙给了我一把。"}, {"start": 282.88, "end": 294.64, "text": "He said, remember where home is, and then my eldest uncle told me, turn left, turn right, do not get it wrong. At that time my memory was still all right, I would not get it badly wrong.", "zh": "他说，你记住家里是什么地方，然后大舅他就告诉我啊，你左转右转，你别搞错了，那时候记忆力还行，不会大大的搞错。"}, {"start": 294.64, "end": 303.2, "text": "Then I asked my eldest uncle, where is the post office? Where is the post office? Why did I ask where the post office was? Can anyone guess why I asked where the post office was?", "zh": "那么我就问了我大舅，我说，邮局在哪，邮局在哪，为什么要问邮局在哪，有多少人猜不猜得出，为什么要问邮局在哪。"}, {"start": 303.76, "end": 324.24, "text": "Because at that time, in Shanghai, there were telephones, but a telephone was connected like this: you made a call back to Shanghai, in a telephone booth they would say, oh, I want such-and-such family, and then you had to hang up and wait twenty minutes, wait until your family members arrived at that telephone booth, and then you called back, and only then could you talk to them.", "zh": "因为当时情况之下的话，没有上海有电话吧，有电话是接到电话来的，也就是说，你打一个电话回到上海，一个电话亭里面，他们就说，哎呀，我要谁哪一家哪一家，接电话，然后要把电话挂断，再等二十分钟的时间，等我家里的人到了那个电话厅，我再打回去，再可以和他说电话。"}, {"start": 324.24, "end": 338.96, "text": "And international long-distance calls were very, very expensive. My eldest uncle also told me, do not call back, because one call would become two calls just to report that you are safe.", "zh": "而且那个电话国际长途是非常非常昂贵的，我大舅也和我告诉我，那你们不要打电话回，一打就变成打两个电话，才能报一个平安。"}, {"start": 338.96, "end": 353.6, "text": "So at that time, the only communication, well, do not talk to me about WeChat at that time, that definitely did not exist, definitely did not exist. The only communication method at that time that we thought was most convenient was writing letters.", "zh": "所以说当时情况之下的话，唯一的一个通讯过去，那时候微信什么，你就不要和我谈了，这肯定没有的啊，肯定没有的，那个时候唯一的一个通讯方法，我们觉得最方便的是写信。"}, {"start": 353.6, "end": 356.72, "text": "But at that time, writing a letter from America back to Shanghai often took one to two weeks. That was the situation.", "zh": "但是呢，当时从美国写信回上海，所需要的时间，往往是在一到两个星期，是这么一个情况。"}, {"start": 356.72, "end": 365.04, "text": "So my thinking at the time was that, since I had already arrived, arrived at my eldest uncle's place safely, I must, no matter what, report to my parents that I was safe.", "zh": "所以说呢，我当时的想法呢，就是已经到了，已经到了那个我大舅家报平安了，我无论如何要和我父母亲他们要报个平安。"}, {"start": 365.04, "end": 379.52, "text": "I really could not send a telegram, I did not know where to send a telegram, to be honest. I asked, I said, how do I send a telegram? My eldest uncle looked at me, telegram, he did not know either, he did not know what a telegram was.", "zh": "发电报，我真的发不了，我都不知道在什么电话电报，说实在话，我问了，我说，怎么发电报，我大舅看着我，电报，他都不知道，他都不知道什么发电报。"}, {"start": 379.6, "end": 387.84, "text": "Americans did not send telegrams, because by that time in America, telephones were already widespread, and generally one phone call solved the problem.", "zh": "美国人没有发电报，因为到美国那时候，已经电话已经普及了嘛，一般的情况，都是一个电话就解决问题了。"}, {"start": 387.84, "end": 401.92, "text": "So I thought, go to the post office, go to the post office and find a way, I wanted to write a letter to my parents telling them I had arrived, I had arrived safely, and to tell them I was doing very well.", "zh": "所以我就想，邮局，到邮局想办法，想写一封信给我父母亲，告诉他们我到了，我平安到了，要告诉他我过得很好。"}, {"start": 401.92, "end": 422.96, "text": "Because before I came to America, what my family could discuss was that I would come first, I had already come first, I had arrived, and then, being young, if I could find a job or something, then my parents, seeing that I had settled down, would then bring my younger sister over together. Together, that was the idea.", "zh": "因为什么呢，我那时候到美国来之前，那时候我家里能讨论，就是我先到，我反正已经先到了，我按下来了，然后我年轻，如果能找到一份工作，或者怎么样的话，那么我父母亲看我安定下来，然后再带我妹妹一起过来，一起过来，是这么样一个想法。"}, {"start": 423.52, "end": 435.12, "text": "So I must go to the post office. Then my uncle said, as for the post office, he said, just walk a few blocks like this, then turn and walk a few more blocks, and you will see a post office, a post office.", "zh": "所以我必须去邮局，那么我的舅舅说呢，就说啊，邮局呢，他说，你就这样去走几个街口，然后又转，再走几个街口，你就看到了一个邮局，邮局。"}, {"start": 435.68, "end": 459.92, "text": "Then, before I went out, because I had brought a small English-Chinese dictionary, a so-called English-Chinese small dictionary, that dictionary, is it still there or not? I think that dictionary may still be there, no, it is not there, we are here, it was an English-Chinese small dictionary, a Chinese-to-English dictionary, and in it I looked up what the English word for post office was.", "zh": "那么我在出门之前呢，因为我带了一本英汉字典，小字典，那所谓是个英汉的小字典，那不还在不在，我应该可能那本字典还在，不在了，不在了，我们也在这里，是一个英汉的一本小字典，出门汉英字典，就是汉语换的英文的一个汉英字典，然后我在里面就找了邮局的英文是什么。"}, {"start": 459.92, "end": 471.84, "text": "I did not dare to just walk around randomly. Then I started walking. After my eldest uncle went to work, I went out, and the first thing I had to do was to report to my family that I was safe.", "zh": "我都不敢就是乱乱走，然后然后呢，就开始走了啊，开始就是我大舅去上班之后呢，我就出门了，第一件事情，我一定要和家里报平安。"}, {"start": 471.84, "end": 487.36, "text": "Someone said, in the 1980s there were no passports at all, how could you get a passport? In the 1980s there were passports, at that time China had passports, it is just that applying for a passport was very strict, very strict, that was the situation at the time.", "zh": "八十年代连护照都没有，那怎么把价格吧，八十年代有护照，那时候中国有护照，就是他的护照要申请很严格，很严格，就是当时的情况之下。"}, {"start": 487.36, "end": 504.32, "text": "My eldest uncle had to issue a certificate, a certificate to prove he was helping us immigrate, and only then was a passport issued. There were passports, there were passports, it is just not as widespread as now. At that time the requirements for issuing a passport were very, very strict, very strict. All right.", "zh": "我大舅要发出一个证明，就是证明要帮助我们移民，然后才发护照，有的啊，有的啊，就是不是像现在这么普及，那时候发护照的要求是非常非常严格的，非常严格的好。"}, {"start": 504.88, "end": 516.56, "text": "So I went to the post office, the post office, and just as I had just arrived, my eldest uncle said, I was alone, and I thought, as long as I could get back to my eldest uncle's home, I would just wander around outside.", "zh": "那么我们，我就去邮局，邮局嘛，就是我刚到我的大舅说，我只有一个人嘛，那我想，反正只要能回到我大舅家，我就外面就瞎晃荡一下。"}, {"start": 516.56, "end": 533.82, "text": "How did I wander around? Just going out and turning, also walking along the street, not daring to look at anyone, basically walking with my head slightly lowered, because I was very worried that other people would see me like this and come up and ask me some questions, and I would not know what they were saying, and I would not know how to respond.", "zh": "瞎晃荡怎么瞎晃荡呢，就是出门又转，也得接一只走，不敢看任何人，基本上就是有一点点低着头这样走路的，因为我很担心，就是说别人看我这个样子，一桌部队问我一些问题，我不知道在说什么，我不知道什么应付。"}, {"start": 533.82, "end": 538.42, "text": "So I walked like that, with my head lowered, walking along.", "zh": "所以呢，我就这样低着头一边走过去。"}]}, {"slug": "sec5", "title": "Section 5: Walking to the post office and sending the letter", "mp3": "my-american-journey-full/sec5/sec5.mp3", "dur": "8:46", "lines": [{"start": 0.0, "end": 8.56, "text": "There were basically no people on the street. That made me even more convinced that my eldest uncle lived in a large suburb far from the city, very far away.", "zh": "街上基本上没有人的，这让我更加相信，我大舅是住在一个偏离城市的大郊区，很远的。"}, {"start": 8.56, "end": 16.24, "text": "It felt a bit like, my feeling was, where did my eldest uncle live? It was like Chongming Island in Shanghai, that feeling.", "zh": "有点像，就是我的感觉就是说，我大舅住在什么地方，就在上海的那个叫崇明岛，这个感觉。"}, {"start": 16.24, "end": 21.6, "text": "At that time I thought, oh, my eldest uncle really had it hard, it was all two-storey houses.", "zh": "那时候我觉得，哎呀，我大舅真的太难了，都是两层楼的房子。"}, {"start": 21.6, "end": 27.68, "text": "I walked up a slope, then turned a corner, and after turning, I started to see relatively more people.", "zh": "我就走上一个上坡，然后转弯，转弯的，我开始看到人相对多了。"}, {"start": 27.68, "end": 40.16, "text": "Someone asked me, if I had not gone to America, what work would I have done in Shanghai? I was at a medical university in Shanghai, and if I had graduated, I would definitely have become a doctor in Shanghai, that is certain, really certain.", "zh": "有一位问我，如果我没有去美国，在上海是从事什么工作，我是在上海医科大学，如果毕业的话，一定是上海做医生的，这是肯定的，真肯定的。"}, {"start": 40.72, "end": 64.08, "text": "Then, after I turned right, this street was relatively bigger, and I started to see some vehicles, big vehicles, a bit like buses in Shanghai, of course, those cannot be compared with buses in Shanghai at that time, of course, I saw a big character, and I guessed it should be a bus, different from a car, but there were also more cars on the road, because that was a main road.", "zh": "那么我那个右转之后呢，开始这条街相对比较大，开始看到有一些车辆，就是大的车辆了，有点像上海的公交车，当然了，这个和那时候上海的公交车，和这个不能比了，当然就看到了一大字，我也猜得到，这应该是公共汽车来的，和轿车不一样，但是马路上开始车也比较多，因为那条是个主干道。"}, {"start": 64.08, "end": 74.8, "text": "Then I walked up, and after walking, I walked about five or six blocks, about five or six blocks, and I found a building that was rather special, special in that it had a blue sign on it.", "zh": "然后我就朝上走，走了之后，大概走了五六个街口吧，五六个街口，我发现了有一个一段房子也比较特殊，特殊，那上面有个蓝色的标志。"}, {"start": 74.8, "end": 90.48, "text": "That blue sign, because it was the post office sign, was relatively close to the Chinese one, still a bit close, so I suspected that was the post office, and then after looking carefully, according to the English-Chinese dictionary translation I had just done, I confirmed this was the post office.", "zh": "蓝色的标志呢，因为邮局的那个标志了，相对来说和中国还是有点接近的，还是有点接近，所以呢，我怀疑那边就是邮局，然后再仔细看一看，根据我刚才汉英字典翻译，我确定这是邮局。"}, {"start": 91.12, "end": 122.64, "text": "Then came an even more severe test, which was that I had to write a letter in English, that is, to ask others how to write a letter, how to send a letter, because my main concern was that I did not want to add to my uncle's burden, because stamps and things like that, do not forget, let me emphasize again and again, you have to understand, at that time in 1989, or at that time, China's economic situation, income, at that time in Shanghai, writing a letter to America, an international letter, was quite expensive, quite expensive relative to my parents' income.", "zh": "那时候就接下去一个更加严酷的考验，就是我必须要用英语写信了，就是要问别人怎么样写信了，怎么样寄信，因为我最主要的就是不想增加我舅舅的负担，因为写信、邮票之类的，你别忘了啊，再想着，就我一定要反复强调，就是要明白，当时1989年时，或当时中国的经济情况、收入，那时候在上海写一封信，写到美国，国际信件，挺贵的，按照我父母的收入是挺贵的。"}, {"start": 123.28, "end": 135.2, "text": "So at that time I was also thinking, if I wrote this letter, how many stamps would it need? I did not dare to ask about stamps, I felt it would add to his burden, one stamp, I felt, was a big burden.", "zh": "所以当时我也在想，我写这封信的话，到底要多少邮票，我不敢问邮票，我觉得会增加他的负担，一张邮票，我觉得很大的负担。"}, {"start": 135.76, "end": 166.32, "text": "Someone asked, are you a family immigrant? You say it has nothing to do with June Fourth? It has something to do with it, but you absolutely cannot say I left completely because of June Fourth, because before that I was already applying for family immigration, because I immigrated over, came to America, relatively speaking, you say it has completely nothing to do with it? In that era, in that year, which university student had nothing to do with June Fourth? Go and find one who had completely nothing to do with June Fourth.", "zh": "我是家属移民，你说和六四没关系吗，有点关系，但是你绝对不能说，我是因为完全是因为六四走的，因为我在那之前已经在申请家属移民了，因为我是移民过来的，到美国来的，这个相对来说，你说完全没有关系吗，那个年代，那一年，哪一个大学生和六四没关系，你去找一个完全和六四没关系的。"}, {"start": 166.88, "end": 184.08, "text": "Later, when I arrived at the post office door, I braced myself and went in. That post office, because it was only the first few days, left a particularly deep impression on me, one I will never forget in my life, because of the mood at the time, and the problems at the time, many, many problems.", "zh": "后来就是，那么到了邮局门口，我硬着头皮进去，那个邮局，那时候因为刚刚开始几天了，那个对我印象是特别深的，我一辈子都忘不了的，因为当时那个心情，当时的那个问题，很多很多。"}, {"start": 184.64, "end": 198.88, "text": "Walking into the post office, I remember, at that time there were about five or six people in the post office, five or six people waiting, queuing, waiting, and inside there were about three staff members, three staff members, two were Asian, and one, I remember, was a Black woman, a Black woman.", "zh": "走进邮局，邮局里面是我记得，当时邮局一共大概有五六个人，五六个人在等，排队等，等着，里面大概有三个服务员，三个服务员，两个是亚洲人，一个呢，一个是我记得是一个黑人女的，黑人女的。"}, {"start": 199.2, "end": 215.52, "text": "Then I queued up. I thought, no matter what, I would just ask, I would just ask, even though my sentences were not really proper, and in my mind I desperately thought about how to ask, which sentence, organizing the grammar in my mind for a long time.", "zh": "那我就排队了，我想，不管怎么样，我就要问一问吧，我又问一问吧，我反正我句子也不大成立，然后在脑子里面拼命想，应该怎么问哪一句话，把这句话在脑子里面，语法什么组织了半天。"}, {"start": 216.0, "end": 240.8, "text": "When I got to the front of the counter, I could not squeeze out a single word, I did not know what to say. I was just very nervous, this was the first time I started using English to communicate with a person, and to communicate with an ordinary person, and I thought, would he give me a cold look, would he drive me away, and I was even a little worried he would call the police, thinking I was a suspicious person. All those thoughts went through my mind.", "zh": "到了那个柜台前面，一个字都挤不出来了，不知道该怎么说，我就是很紧张嘛，就第一次开始用英语和一个人交流了，而且是普通人交流了，我觉得就是，他会不会给我白眼，会不会赶我走，甚至于，有一点担心他会不会再去叫警察，觉得我这个人很可疑，所有的念头在脑子里面全部都过一遍了。"}, {"start": 241.36, "end": 254.64, "text": "Then finally, gritting my teeth, I do not know how long passed, I felt it was very, very long, maybe only one minute, but in my mind it was very long, and I finally said, Letter to China, Letter to China.", "zh": "然后最后咬着牙，我又不知道过了多长时间，我觉得是很漫长很漫长，可能只有一分钟，可是我的脑子里面就很漫长，我就终于说，我就说，Letter to China，Letter to China。"}, {"start": 255.2, "end": 267.76, "text": "Then that person immediately said, he said, Do you want to mail something, or you just want to buy a stamp? Now, recalling it, I am sure what he asked me was, do you want to send a letter, or do you just want to buy stamps?", "zh": "那么，那个人就马上就说了，他说，Do you want to mail something, or you just want to buy a stamp，他就，现在我回忆过来，他问我这个问题，他当时的意思就是说，你到底是想寄一封信啊，还是只想买邮票。"}, {"start": 267.76, "end": 288.64, "text": "All right, I got stuck. What got stuck? Stamps, I got stuck on stamps. I was indeed stuck there at that time. The person serving me was an Asian woman, and funnily enough, this person was indeed Chinese, this Chinese person could only speak Cantonese, and her Mandarin, what we call Mandarin, was only a little bit.", "zh": "好，我卡住了，什么东西卡住了，邮票我卡住了，我又那时候确实是站在那边了，接待我呢，那是一个亚洲女性，好玩的是，这个人呢，确实是中国人，这个中国人呢，只会说广东话，国语呢，普通话，我们叫普通话，会一点点。"}, {"start": 288.64, "end": 304.8, "text": "Then she also saw my embarrassment, and she probably had experienced this kind of problem herself, so she started to speak in her very broken Mandarin, asking, in other words, write a letter, back to China, she also had words coming out one by one, letter to China.", "zh": "那么他也看出我的尴尬了，估计他也经历过这种问题，他就开始用他说起来，非常蹩脚的普通话，就问，就是，写信，回中国，他也是一个字蹦出来的，信去中国。"}, {"start": 304.8, "end": 311.68, "text": "I understood him, I said yes, yes, yes, I nodded desperately, nodded desperately.", "zh": "我听懂他，我说对对对，我拼命点头，拼命点头。"}, {"start": 311.68, "end": 316.72, "text": "Then he took out a bunch of stamps and said, this, and asked me whether I wanted to buy these stamps.", "zh": "然后呢，他就拿出一批邮票出来，他说，this，他就问我是不是要买这个邮票。"}, {"start": 317.2, "end": 327.28, "text": "At that time I was thinking, how many stamps should I buy, how many should I stick on? I wanted to ask how many, I asked how many, what I meant was, how many stamps should I buy?", "zh": "当时我就想，这个邮票到底要买几张，要贴几张，我就想问 how many，我就问 how many，我的意思就是我买几张邮票。"}, {"start": 327.84, "end": 340.8, "text": "He looked at me, because his feeling was that he should ask me how many stamps I wanted to buy, and here I was asking him how many, so the two of us started, in Cantonese terms, talking like a chicken to a duck, talking past each other.", "zh": "他看着我，因为他的感觉是，应该要问我，我要买几张邮票，我怎么反而问他要几张，所以我们两个人就开始，就是现在用广东话来说的，鸡同鸭讲。"}, {"start": 340.8, "end": 354.48, "text": "Then later, another Asian woman next to him, whose Mandarin, that is, whose Mandarin was a little better, at that time, that one next to him, her Mandarin was a little better, she came over to help, and only then could I communicate with her.", "zh": "后来那就是，旁边另外一个亚洲的一个女的，她的国语，就是普通话，好一点，那个时候呢，就是旁边那个呢，她普通话好了一点点，她过来帮忙了，这个时候才可以我交流。"}, {"start": 354.48, "end": 364.56, "text": "She asked me, at that time she asked me in Chinese, do you want to send a letter, or do you want to buy stamps? I said, I want to write a letter, back to China, what should I buy?", "zh": "她就问我，她那时候就用中国话叫，你要寄信，还是要买邮票，我说，我想写信，回中国，应该买什么。"}, {"start": 364.56, "end": 391.44, "text": "Then this woman was quite nice, this time she was quite nice, she took it and then she told me, she said, you need an envelope over there, you need to buy an envelope, you need to buy stamps, these stamps are enough to send to China, what kind of things do you want to send, how many things do you want to send? At that time she knew how much I was sending, she thought I wanted to send a large batch of documents, documents are heavy, so the stamps would cost more.", "zh": "那么这个女的倒挺好，我这一次她这个人挺好，她拿，然后她就告诉我，她说，你要那边有信封，你要买个信封，你要买邮票，这些邮票寄中国够了，你想寄什么样的一些东西，要寄多少东西，她就当时寄的就知道我寄多少，她以为我要寄一大批文件，文件重嘛，那个邮票要付得多嘛。"}, {"start": 391.44, "end": 398.96, "text": "I said, write a simple letter, the cheaper the better. At that time I did not know the cheaper the better, I asked her what was cheapest.", "zh": "我就说，写简单的信，越便宜，我当时我不知道越便宜越好，我就问她最便宜什么。"}, {"start": 399.52, "end": 419.28, "text": "That woman was very nice, she said, she took that thing away, she said, do you want to buy stamps? She took out a sheet of paper, a sheet like this, a large sheet of paper, and this sheet was very strange, it had many marks on it, folding marks, that is to say, how you should fold it, now like a dotted line, a big dotted line.", "zh": "那女的很好，她说，她把这个随意拿开，她说，你要不要买邮票，她就拿出一张纸，一张就像这种，大开面的一张纸，这张纸呢，很奇怪的，她上面有好多的印记，这个折痕的印记，就是说你应该怎么样，现在就像一个虚线一样的，她大大虚线。"}, {"start": 419.84, "end": 428.8, "text": "That woman told me, that is to say, she said, on this side you can write a letter, and then fold it like this, fold it up, and give it to me, that will do.", "zh": "那个女的就告诉我，就是说，她说，你在这一面，你可以写信，然后这样折叠了，捏好，给我就行了。"}, {"start": 428.8, "end": 443.76, "text": "Because this is not a postcard, I do not know whether it still exists now, it should not exist now, and it is not an ordinary letter, not an ordinary letter, but a kind of prepaid letter, but it is not a postcard, because it is confidential, it can be folded up.", "zh": "因为，这个不是明信片，现在不知道有没有，现在应该没有了，也不是普通的信，不是普通的信，而是一个我们叫做一个叫做预付邮资的一种信，但是她又不是明信片，因为她有保密的，她可以折叠起来的。"}, {"start": 444.32, "end": 459.52, "text": "Then I was right there at the post office, there were pens next to her, and I started writing, I started writing, telling my parents I had arrived, everyone was very good to me, everything was normal, but, that is to say, wait until I find a job, I will notify them, and then they will come over.", "zh": "然后呢，我就在当邮局那个地方，她旁边有笔的，我就开始写，我就开始写，然后呢，就写，就是告诉我父母亲，我到了，大家对我很好，我一切都正常，但是呢，就是说，等我找到工作，我再通知他们，然后他们再过来。"}, {"start": 460.08, "end": 464.96, "text": "Every day, help me wait for these things. Then I folded it the way that woman had shown me.", "zh": "一天天帮我等这些东西，然后呢，我就把它按照那个女的样子把它折好了。"}, {"start": 464.96, "end": 482.72, "text": "After folding it, I went back to the front of the counter, because at that time I had already paid, and I remember, if she let me send stamps, if I wrote stamps and sent them back, it would be about fifty cents, fifty cents in US dollars or sixty cents in US dollars, but this folding one was cheaper, about a third cheaper, and it was already a letter with postage attached.", "zh": "折好了之后，我又回到那个柜台前面，因为那时候我已经付了那个，那时候我记得是，他让我寄邮票的话，如果说是写邮票寄回去的话，大概是五毛，五毛美金还是六毛美金，但是这个折叠的大概要便宜三分之一，然后呢，就是这个就已经贴了那个邮费的那个信封。"}, {"start": 483.28, "end": 491.52, "text": "Then I stuck it well, and after sticking it well, I went to the front of the counter and asked that woman, is it right? OK, it was accepted.", "zh": "然后我就把它粘好，粘好之后，我就到了柜台前面，问那个，你对吗，OK，收了。"}, {"start": 492.0, "end": 500.4, "text": "At the time I was not sure whether my parents would receive this letter, but I felt I had already written it, and I had already completed the biggest project of my life in America.", "zh": "当时我是不清楚这封信是不是我父母亲收得到，但是我觉得我已经写了，我已经完成了人生当中在美国最大的一件工程了。"}, {"start": 500.4, "end": 507.52, "text": "That is, I really breathed a big sigh of relief. I stepped out of the post office, and the post office finally breathed a sigh of relief.", "zh": "那是不是我确实送了一大口气，我踏出这个邮局，他说邮局终于松了一口气。"}, {"start": 508.08, "end": 525.44, "text": "Then, coming out of the post office, actually, when I came out of the post office and looked out again, I saw where my eldest uncle lived. My eldest uncle lived by the sea, not directly seeing the sea, but coming out of the post office, at a glance, I saw the Pacific Ocean, a whole sea.", "zh": "然后从邮局出来，其实这个邮局出来的时候，我再看出去，我才看到我大舅住的地方到底在什么地方，我大舅是住在海边，其实不是直接看到海边，就是从邮局出来，一眼看出去的话，就看到了太平洋，就是一片海。"}]}, {"slug": "sec6", "title": "Section 6: The sea, the first ten years, and closing", "mp3": "my-american-journey-full/sec6/sec6.mp3", "dur": "9:42", "lines": [{"start": 0.0, "end": 21.0, "text": "Looking at that sea, my heart was actually very unsettled, very unsettled, because we know very well that San Francisco, on the other side of San Francisco, is China, is Shanghai, actually Shanghai and San Francisco are very close in latitude, that is to say, on the other side of that sea, my parents are there.", "zh": "这个看过去，那个一看到大海，我心里其实是很不平静的，很不平静的，因为我们很清楚，就是旧金山，旧金山那一面就是中国，就是上海，其实上海和旧金山的纬度很接近吗，也就是说，在那个海的另外一边，就是我的父母亲在那边。"}, {"start": 21.0, "end": 27.0, "text": "On the first day I arrived there, seeing that sea, my mood began to become very unsettled.", "zh": "第一天到了那的时候，看到那个海，我的心情就开始很不平静了。"}, {"start": 27.0, "end": 41.0, "text": "At that time, that post office should have been around 34th Street, 34th Street, and the seaside was around 48th Street, a total of about ten-odd blocks apart, but anyway I had nothing to do, and it was downhill, so I walked along this road, always walking downhill.", "zh": "那时候，那个邮局应该是在三十四街左右，三十四街，而海边大概在四十八街，一共离开大概十几个街口，但是反正我没有什么事，而且是下坡，我就沿着这条路，一直朝下走。"}, {"start": 41.0, "end": 61.0, "text": "And before I walked, I did another thing. What was it? I found something, just outside the post office, next to it, there was a free map of San Francisco, a free map, actually later I learned it was the San Francisco transit map, the San Francisco bus map, free, and I took one, a free map.", "zh": "而且走之前，我做了另外一件事，什么呢，我发现了一样东西，就在邮局的外面的一个旁边，有一张旧金山的免费地图，不需要买的，是免费地图，其实在后来我就知道，是这个旧金山交通图，就是旧金山的公共汽车的一个地图来的，免费的，我就拿了一张免费地图。"}, {"start": 61.0, "end": 70.0, "text": "Then, according to the big characters and the direction, I began to know roughly where I was, and I knew very clearly that going down this way was the Pacific Ocean.", "zh": "然后又根据大字和方位，我开始知道我大概是什么地方，而且我很清楚，就这个下去，这个就是太平洋了。"}, {"start": 70.0, "end": 79.0, "text": "Finally, I came from Shanghai, I had seen the Huangpu River, and I had taken a night cruise on the Huangpu River, but I had never really been to the seaside.", "zh": "最后，我来自上海，我见过黄浦江，我也做过黄浦江的夜游的游轮，但是我从来没有真正的到过海边。"}, {"start": 79.0, "end": 93.0, "text": "At that time, the farthest I had gone was taking a ferry on the Huangpu River, all the way to the mouth of the Yangtze River, going around in a circle and coming back. That was the farthest I had gone. I had never seen the seaside or a beach.", "zh": "那时候最远的就是黄浦江一个渡轮，一直开到长江出海口，绕个圈回来，这是我走的最远的，海边、海滩从来没见过。"}, {"start": 93.0, "end": 109.0, "text": "In Shanghai in the 1980s, by the Huangpu River, it was basically impossible for you to stand there. You went to the Bund, on the Bund there was nothing, the Bund, all sorts of things, at that time the Huangpu River was black, it was impossible to go down and walk there.", "zh": "上海八几年的时候，黄浦江那个旁边，根本就不可能让你立足，你出外滩，外滩上面没有啥的，就是外滩，那时候黄浦江是黑的，这不可能下去让你什么走的。"}, {"start": 109.0, "end": 116.0, "text": "So I kept walking toward the sea, walking, walking, walking, and I did not know how long I walked.", "zh": "所以我一直朝大海走啊，走啊，走啊，走，我也不知道走了多久。"}, {"start": 116.0, "end": 131.0, "text": "At that time, people were still a bit bolder, after all, it was the first time I had communicated with some people in San Francisco, and I felt a little more relaxed, and I dared to raise my head, looking at the sea, walking all the way down, all the way to the seaside.", "zh": "那时候人还胆子大一点，毕竟第一次和旧金山的一些人交流过了，我感觉略微放松了一点，我敢抬着头，看着海，一路走下去，一直走到海边。"}, {"start": 131.0, "end": 150.0, "text": "At the San Francisco seaside, the wind was very, very strong. At that time my clothes were not very thick, and I felt a bit cold, but standing at that seaside, walking in the sand, walking in the sandy ground, watching the waves of the sea surging up, looking at the other side of the sea, I was absolutely lost.", "zh": "旧金山的海边，风很大很大，我那时候衣服穿得并不是很厚，我觉得有点冷，但是站在那个海边，走在那个沙里面，走在沙地里面，看着那个大海的波浪涌上来，看着海的另外一边，我是绝对迷茫的。"}, {"start": 150.0, "end": 157.0, "text": "Because I did not know what would happen in the future, and I did not know how my future path should go. I was at a loss.", "zh": "因为我不知道以后会发生一件什么样的事情，我也不清楚，我以后的路是该怎么样走，我不知所措的。"}, {"start": 157.0, "end": 164.0, "text": "After all, in Shanghai I was a university student, a university student, but in America, I really knew nothing at all.", "zh": "再怎么样说，我在上海也是个大学生，一个大学生，在美国，我根本就什么都不知道。"}, {"start": 164.0, "end": 180.0, "text": "Should I go to study, or find a job? What kind of job should I look for? What kind of work could I do? I really knew nothing at all. How should I look for a job? Who should I look for? I did not know how to do it either. I did not know, and my university did not tell me either.", "zh": "我去读书还找工作，找什么样的工作，我能做什么样的工作，我真的什么都不知道，找工作该怎么找，找谁去，我也不知道我怎么做，我也不知道，我大学也没和我说。"}, {"start": 180.0, "end": 189.0, "text": "Around me at that time, there was only the money my family in Shanghai and my younger aunt in Hong Kong had put together, about 1,000 US dollars.", "zh": "身边那时候只有我上海和我香港的小姑妈凑在一起，大概1000美元。"}, {"start": 189.0, "end": 197.0, "text": "1,000 US dollars, I did not know how long I could last on 1,000 US dollars. What would happen after I used up the 1,000 US dollars?", "zh": "1000美元，我不知道这1000美元我能撑多久，1000美元用完之后，我会怎么样。"}, {"start": 197.0, "end": 218.0, "text": "In 1989, America did not recognize any Chinese medical university at all. At that time, now it does recognize them, and you have to know, at that time I had not graduated from university, so I had no diploma, so at that time it was basically impossible. Later I will slowly tell you about my diploma problem.", "zh": "在美国，在1989年的时候，是不承认中国任何一所医科大学的，那时候，现在承认，而且你要知道，那时候我大学没有毕业，所以我没有文凭的，所以那时候根本就这个，以后我会慢慢和你说我的文凭的问题。"}, {"start": 218.0, "end": 226.0, "text": "At that seaside, I did not know how long I stood, how long I walked, how long I stood, really I did not know.", "zh": "在那海边，我也不知道站了多久，走了多久，站了多久，真的我不知道。"}, {"start": 226.0, "end": 229.0, "text": "Then I started to turn around and walk back to my eldest uncle's home.", "zh": "然后我就开始转身，走回我大舅家。"}, {"start": 229.0, "end": 245.0, "text": "On the way back to my eldest uncle's home, I encountered something else. Today I have already talked for more than an hour, so I will not talk today. Next time, I will tell you what I encountered after I came back from the seaside, what interesting thing I encountered, or what kind of experience I had.", "zh": "走回我大舅家的路上，我又遇到了一样东西，今天已经讲了一个多小时了，今天不讲了，下一次，那我再讲讲我从海边回来之后，我碰到了什么，碰到了什么样一个有趣的事情，或者碰到了怎么样的一个经历。"}, {"start": 245.0, "end": 271.0, "text": "Then, after returning to my eldest uncle's home, what happened in my eldest uncle's home, at the beginning, in the first year in America, I will talk about it in very, very fine detail, just like this, basically one day, or one month, one process, and later, of course, for my whole situation, because I cannot finish telling it today, even if I talked for 24 hours, I cannot finish it.", "zh": "然后回到我大舅家之后，我又在我大舅家里面，又怎么样的一个情况，刚开始的呢，就是在美国的第一年的东西，我讲的非常非常细，就像这样子，基本上一天或者一个月，一个过程，那么以后来，当然是为了我整个呢，整个这个情况，因为我怎么讲不完，今天哪怕我在24小时，我都讲不完。"}, {"start": 271.0, "end": 288.0, "text": "1,000 US dollars in Shanghai at that time was really a huge sum of money. If it were not for my younger aunt in Hong Kong helping me a little, my parents could not come up with this money. They, putting it together, at most had about 500 US dollars, at most, at most, really that much.", "zh": "都讲不完，1000美元在上海那时候真的是巨款，如果不是我香港的小姑妈帮我一点，我父母亲拿不出这个钱了，他们离凑在一起的话，大概最多这500美元，最多最多，这都真的那么多。"}, {"start": 288.0, "end": 296.0, "text": "So next time, I do not know when I will have time, I may do another livestream next Tuesday or Wednesday, to tell you about this beginning experience.", "zh": "那么下一次吧，我也不知道什么时候有空，我可能下个星期二或者星期三再直播一次，就把这个刚开始的一个经历给大家讲讲。"}, {"start": 296.0, "end": 309.0, "text": "If you think it is interesting, then come back and listen. If you think what I am saying is just an old man nagging here, then you do not need to, because I am not relying on this, not relying on this for anything, I just want to share it with you.", "zh": "如果大家觉得有趣的话呢，那么就回来听，如果大家觉得我说的那种东西，就是一个老头子在这里唠叨的话呢，那么就说就不用了，因为反正我也不是靠这个，不是靠这个怎么样的，我只是想和大家分享一下。"}, {"start": 309.0, "end": 315.0, "text": "Because I think some things later on are worth considering, because everyone's life has a certain course, a certain journey.", "zh": "因为我觉得后面有些东西呢，有些东西呢，就是值得大家考虑一下，因为每个人的人生都有一定的播种，有一定的历程。"}, {"start": 315.0, "end": 328.0, "text": "Just like someone just said, if you graduate and cannot find a job, what will happen? I will tell everyone one saying, which is: where there is a will, there is a way, Heaven never seals off all exits.", "zh": "就像刚才有一位就说，如果毕业找不到工作会怎么样，我告诉大家一句话，就叫天无绝人之路，天无绝人之路。"}, {"start": 328.0, "end": 338.0, "text": "In my first ten years in America, I encountered despair many times, many times despair, and in that despair, I walked step by step to where I am now.", "zh": "我在美国的前面10年当中，我遇到过很多次绝望，很多次绝望，在这个绝望当中，我一步一步地走到了现在。"}, {"start": 338.0, "end": 343.0, "text": "Of course, I cannot say I am doing very well now, but I can only say I am very stable now.", "zh": "当然，我现在不能说自己很好，但是我现在只能说，我是很稳定。"}, {"start": 343.0, "end": 351.0, "text": "But what is the cost of this stability? Why did I choose my current profession? I will slowly start telling you about that.", "zh": "但是这个稳定的代价是什么，我为什么选择了我现在这个职业，这个我要和大家慢慢地开始讲。"}, {"start": 351.0, "end": 362.0, "text": "If you think there is anything in what I say that you can consider, because I think that in any era, in any era, in any situation, there will always be many people who will have great difficulties.", "zh": "如果觉得我说的东西里面，有什么东西，大家都可以考虑一下，因为我觉得呢，就是在任何一个时代，任何一个时代，在任何一个情况之下，总会有很多人会有很大的困难的。"}, {"start": 362.0, "end": 374.0, "text": "Like my situation, actually in the 1980s, when we had ration coupons in China, when China had rationed supply, you should also know many people were either in despair or very numb, numb.", "zh": "像我那个在，其实像一九八几年的时候，当我们凭票供应东西的时候，在中国凭票供应的时候，你应该也知道，很多人也是，不是绝望了，就是很麻木的，麻木的。"}, {"start": 374.0, "end": 389.0, "text": "Most importantly, what I want to say to today's graduates is this: going to university does not necessarily mean that when you come out, you must do exactly the same work, that is, whatever you studied, you must do work in that field. Open up your thinking a little.", "zh": "最主要的，我对于现在的毕业生就说，读大学，你并不一定要就是出来，一定要做你完全一模一样的工作，就是你读什么，一定要做这方面工作，要把自己的思路敞开一点。"}, {"start": 389.0, "end": 402.0, "text": "University only teaches you some basic skills, learning skills, and for many things, a skill of understanding. After you come out, what kind of work should you do? Broaden your thinking a little. That is the first point.", "zh": "大学只是教你们一些基本的技能，学习的技能，对于很多东西，一个理解的技能，走出来之后，该怎么样的工作，把思路放宽一点，这是第一个。"}, {"start": 402.0, "end": 410.0, "text": "Second, do not care about face. Face is the least valuable thing. The least valuable thing in this world is face.", "zh": "第二个，就不要讲面子，面子最不值钱了，这个世界上最不值钱的就是面子。"}, {"start": 410.0, "end": 421.0, "text": "Of course, this is easier for me to say, because in America, there are no aunts and gossips behind your back, gossiping. That is a good thing. I can go whichever way I want, that is a good thing.", "zh": "当然，这个我说些比较容易，因为在美国，美国没有三姑六婆在背后说三道四，这是个好事，我想怎么走就怎么走，这是个好事。"}, {"start": 421.0, "end": 427.0, "text": "But, that is to say, do not live for other people's eyes, live for yourself.", "zh": "但是就是说，不要就是为了别人的眼光而活着，为自己而活着。"}, {"start": 427.0, "end": 437.0, "text": "You say you want to smuggle yourself into America, I dare not say this is something illegal, but I have indeed met many people like that, who came here and worked in restaurants or something. I have seen many.", "zh": "你说要偷渡到美国，这个我不敢说是违反的东西，但是我确实遇到过很多就这种来的人，跑到这里来，在餐馆里面工作，或者怎么样的，我见过，我见过很多。"}, {"start": 437.0, "end": 445.0, "text": "Actually, wherever you go, anywhere, actually for us, for me, as long as you can settle down peacefully, that is a good place.", "zh": "其实你到任何地方，任何地方，其实对于我们，对于我来说的话，只要能安静下来，就是一个好地方。"}, {"start": 445.0, "end": 450.0, "text": "Many times it may not be for yourself, it may be for the next generation, for the next generation.", "zh": "很多时候也许不是为了自己，也许为了后面的下一代，又要下一代。"}, {"start": 450.0, "end": 460.0, "text": "So for some confused young people, I would say, you will one day find your own path. Everyone's path is different. Do not be discouraged.", "zh": "所以我对一些迷茫的年轻人来说的话，你总有一天会找到自己的路，每一个的路都不一样，不要沮丧。"}, {"start": 460.0, "end": 466.0, "text": "Now the general environment is indeed difficult, but that does not mean there is completely no way out. That is one thing.", "zh": "现在大环境确实有困难，但是也并不是说完全没有出路，就这么一件事情。"}, {"start": 466.0, "end": 477.0, "text": "Try to open up your thinking a little, and see what is relatively suitable and relatively close to your major, but which you also like, and you can take another path. Especially since you are still young.", "zh": "尽量就是把自己的思路打开一下，看一看有哪些和你的专业比较合适、比较接近的，但是你又比较喜欢的，可以走另外一条路，特别你们还年轻。"}, {"start": 477.0, "end": 488.0, "text": "Remember, if you want to go abroad, China, of course, still has a bit of, oh, when you reach a certain age, how about it, but in America there is no age problem, no age problem. I will talk about that later.", "zh": "记住，如果说你要出国的话，中国当然还是有一点，就是哎呀，到了一定年龄怎么样怎么样的，在美国没有年龄的问题，年龄问题，这个以后我会说。"}, {"start": 488.0, "end": 496.0, "text": "If you are confused, and your major is not good enough, then can you take further courses? Can you consider doing some other things, other things?", "zh": "你迷茫，你专业不够好，那么是不是可以进修课，是不是可以考虑一下，做一些其他的东西，其他的东西。"}, {"start": 496.0, "end": 511.0, "text": "Let me say one more thing: Heaven never seals off all exits. When I have told you all of my first ten years of experience, just the beginning ten years of experience, you will find how many dead ends were in front of me, and walking on, they opened up.", "zh": "再说一句话，天无绝人之路，等我把我所有的十年的经历，就刚刚开始十年经历，你就和你们说完，你就会发现，有多少在我面前的绝路，走下去就走通了。"}, {"start": 511.0, "end": 519.0, "text": "Walking on, sometimes it is an open field. When I felt the road ahead was a cliff, I just turned a small corner, and the road ahead opened up.", "zh": "走下去，有些时候就是一个开阔地，当我觉得前面这是悬崖峭壁的时候，我只是转了一个小弯，前面的路就开阔了。"}, {"start": 519.0, "end": 537.0, "text": "Now, now, I tell you, when you are at your most confused, at your most, most confused time, you feel everything ahead is blocking the way, but really walk past it, and when you look back, like I now look back at those ten years, I just smile, I came through.", "zh": "你现在，现在，啊，我现在我告诉你，你现在最迷茫的时候，最最迷茫的时候，你觉得前面都是挡路的，真的走过去，你在回头看的话，像我现在我回头看刚才十年的话，我只是笑笑，我过来了。"}, {"start": 537.0, "end": 542.0, "text": "I dare not say I succeeded, but I came through. That is the idea.", "zh": "我不敢说自己成功了，但是我过来了，就这么一个概念。"}, {"start": 542.0, "end": 554.0, "text": "All right, then today we will stop here. We have talked for an hour and fifteen minutes. Next time there will be a preview. I estimate it will be next Wednesday, next Wednesday I will have time, at the same time, I will chat with you again.", "zh": "好了，那么今天就讲到这里，也讲一个小时15分钟时间了，那么我下次会有预告，我估计是下星期三，下星期三我有空，同一个时间，我再和大家聊聊。"}, {"start": 554.0, "end": 566.0, "text": "If you think what I said is good, then everyone, please come back, and you can even bring questions. If, from what I said earlier, you do not understand what I am saying, bring your questions, and I am willing to communicate with everyone.", "zh": "如果大家觉得我说的东西好的话，那么大家叫回来啊，甚至可以带着问题，如果拿前面我说的那些东西，我不明白你在说什么，带的问题，我愿意和大家交流。"}, {"start": 566.0, "end": 581.0, "text": "Do you want to communicate? As long as a person is alive, there cannot be a dead end. I have always said this. As long as you are alive, there will be no dead end. I have always thought like this, and I have walked to where I am now with this mindset.", "zh": "要不要交流，人只要活着，就不可能有绝路，我一直这样说，只要活着，不会绝，我就一直这样想的，我就靠这个心情走到现在的。"}, {"start": 581.0, "end": 582.24, "text": "All right, goodbye, everyone.", "zh": "好，和大家再见。"}]}];
let LINES=SECTIONS[0].lines;
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh'),audioSelect=document.getElementById('audioSelect'),secTitle=document.getElementById('secTitle');
let els=[];let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function buildLines(){box.innerHTML='';LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});els=[...box.children];curIdx=-1;box.scrollTop=0;}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
function loadSection(idx){const s=SECTIONS[idx];a.pause();playBtn.textContent='▶';LINES=s.lines;secTitle.textContent=s.title;a.src=s.mp3;a.load();seek.value=0;cur.textContent='0:00';dur.textContent=s.dur;zhBox.textContent='';buildLines();}
audioSelect.onchange=()=>{loadSection(parseInt(audioSelect.value,10));};
buildLines();
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
</body>
</html>
