想知道那是广告，还是也包括明年开始的一些增量 AI 收入？"}, {"start": 264.34, "end": 265, "text": "Thank you.", "zh": "谢谢。"}, {"start": 265, "end": 268, "text": "Susan Li: I'm happy to take both of those.", "zh": "Susan Li：我很乐意回答这两个问题。"}, {"start": 268, "end": 268, "text": "Justin Post: Go for it.", "zh": "Justin Post：请讲。"}, {"start": 268, "end": 268.42, "text": "Susan Li: Great.", "zh": "Susan Li：很好。"}, {"start": 268.42, "end": 286.11, "text": "On your first question, I think our ads business has been benefiting for now many years from our ongoing investments in both what we would have called traditional AI machine learning models, and then, of course, from the more recent generation of models.", "zh": "关于你的第一个问题，我认为我们的广告业务多年来一直受益于我们在传统 AI 机器学习模型方面的持续投资，当然还有更新一代的模型。"}, {"start": 286.11, "end": 291.61, "text": "I would say that there are three themes there that I think are worth outlining.", "zh": "我想说，有三个主题值得概述。"}, {"start": 291.61, "end": 299.07, "text": "The first is just the kind of traditional roadmap of performance improvements that we have in the pipeline.", "zh": "第一个就是传统的、基于我们现有产品线的业绩改进路线图。"}, {"start": 299.07, "end": 304.5, "text": "That is what I would describe more as business-as-usual machine learning work.", "zh": "这就是我所说的更像是日常机器学习工作。"}, {"start": 304.5, "end": 327, "text": "That continues to be a robust and healthy pipeline, and as we are looking into 2027, again, we're not providing an outlook, but I would say that our investments and product improvements across both engagement and ads initiatives give us confidence that we have a meaningful runway to grow our core business throughout 2027.", "zh": "这仍然是一个稳健健康的渠道，随着我们展望 2027 年，再说一次，我们没有提供展望，但我想说，我们在互动和广告方面的投资和产品改进让我们有信心，在 2027 年全年我们的核心业务有显著的增长空间。"}, {"start": 327, "end": 329.82, "text": "Susan Li: That also gets to your second question also.", "zh": "Susan Li：这也回答了你的第二个问题。"}, {"start": 329.82, "end": 335.26, "text": "I should say, basically, I think the ranking and recommendations pipeline is healthy.", "zh": "我想说，基本上，我认为排序和推荐渠道是健康的。"}, {"start": 335.26, "end": 354.27, "text": "The second theme I would say is that we are excited about some of the new research bets that we have as we move into sort of a more LLM-oriented AI infrastructure to help us more deeply reason about people's preferences, what they're interested in, both across organic content and recommendations.", "zh": "第二个主题是，我们对一些新的研究押注感到兴奋，随着我们转向更面向大语言模型的 AI 基础设施，以更深入地推理人们的偏好、他们感兴趣的东西，涵盖自然内容和推荐。"}, {"start": 354.27, "end": 361.64, "text": "We expect that we will be able to unlock benefits to our ranking and recommendations engine from that research too.", "zh": "我们预计，我们也将能够从这项研究中为我们的排序和推荐引擎释放好处。"}, {"start": 361.64, "end": 377, "text": "The third thing is that we expect that generative AI tools, which have already been very valuable for advertisers, will continue to grow in terms of the features that we make available to advertisers, primarily through the Advantage+ suite.", "zh": "第三件事是，我们预计生成式 AI 工具已经对广告主非常有价值，未来将继续在功能上增长，主要是通过 Advantage+ 套件。"}, {"start": 377, "end": 394.85, "text": "Susan Li: Features that make it easier for advertisers to quickly and seamlessly generate, whether it is creative or take an image and generate video or generate sound, all, I think, in service of making the ads increasingly personalized for the person that they're being served to.", "zh": "Susan Li：这些功能让广告主能够快速、无缝地生成，无论是创意，还是拿一张图片生成视频或生成声音，所有这些，我认为都是为了让广告对接受者来说越来越个性化。"}, {"start": 394.85, "end": 400.62, "text": "So I would say we feel like there is meaningful runway across all three of those things.", "zh": "所以我想说，我们觉得在这三个方面都有显著的增长空间。"}, {"start": 400.62, "end": 415.25, "text": "Your second question was about revenue growth next year, and so as I mentioned, I think we're both feeling good about the budget investments that we expect we will make in both core ads and engagement initiatives next year.", "zh": "你的第二个问题是关于明年的收入增长，正如我提到的，我认为我们对明年核心广告和互动方面的预算投资都感觉良好。"}, {"start": 415.25, "end": 427, "text": "We're also building several new AI businesses, and we expect that those can begin contributing incremental revenue in 2027, but more importantly, can scale meaningfully over time.", "zh": "我们也在打造几个新的 AI 业务，我们预计它们可以在 2027 年开始贡献增量收入，但更重要的是，随着时间的推移能够 显著 地扩大规模。"}, {"start": 427, "end": 437.81, "text": "Susan Li: Those will include monetizing our AI products through subscriptions, transactions, advertising, developing enterprise offerings, as we talked about in one of the earlier questions.", "zh": "Susan Li：这些将包括通过订阅、交易、广告、开发企业产品来变现我们的 AI 产品，正如我们在之前的一个问题中谈到的。"}, {"start": 437.81, "end": 461, "text": "So I would say while many of these opportunities remain early and our near-term focus is really on building high-quality products and achieving product market fit and scaled product market fit, I think our track record of reaching billions of people and building businesses at scale makes us feel good that AI is going to become a meaningful source of revenue diversification over time.", "zh": "所以我想说，虽然许多这些机会还处于早期，我们近期的重点确实是打造高质量产品、实现产品市场契合和规模化的产品市场契合，但我认为我们在触达数十亿人和大规模打造业务方面的记录让我们感到有信心，AI 将随着时间的推移成为收入多元化的重要来源。"}, {"start": 461, "end": 465.88, "text": "Operator: Your next question comes from the line of Mark Shmulik with Bernstein.", "zh": "Operator：下一个问题来自 Bernstein 的 Mark Shmulik。"}, {"start": 465.88, "end": 467, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 467, "end": 467.24, "text": "Mark Shmulik: Yes.", "zh": "Mark Shmulik：是的。"}, {"start": 467.24, "end": 469.07, "text": "Thanks for taking my questions.", "zh": "感谢接受我的提问。"}, {"start": 469.07, "end": 478.99, "text": "Mark, coming out of Connect, it kind of felt like we were ushering in the next era of the company, and the business reorienting around Muse at the center of everything.", "zh": "Mark，从 Connect 大会出来后，感觉我们似乎正在进入公司的新时代，业务围绕 Muse 重新定位。"}, {"start": 478.99, "end": 482.59, "text": "Is that a fair assessment of how things are going internally?", "zh": "这是对内部情况的公平评估吗？"}, {"start": 482.59, "end": 489.27, "text": "If so, can you just talk a little bit more about how some of the business mandates and outcomes may have changed?", "zh": "如果是，你能否多谈谈一些业务授权和成果可能发生了怎样的变化？"}, {"start": 489.27, "end": 497.07, "text": "Susan, it was interesting to see the launch cadence where enterprise announcements kind of preceded some of the small business ones.", "zh": "Susan，看到企业公告的发布节奏先于一些小企业公告很有意思。"}, {"start": 497.07, "end": 508.41, "text": "I appreciate your comments on some of what's going on there around the SMB agent opportunity, but can you just share more details on the work required to serve and scale the offerings to SMBs?", "zh": "我很感谢你对 SMB 智能体机会的评论，但你能否分享更多关于服务和扩展面向中小企业的产品所需工作的细节？"}, {"start": 508.41, "end": 509, "text": "Thank you.", "zh": "谢谢。"}, {"start": 509, "end": 512.34, "text": "Mark Zuckerberg: Yeah, I can talk briefly about the first one.", "zh": "Mark Zuckerberg：是的，我可以简要谈谈第一个问题。"}, {"start": 512.34, "end": 523.6, "text": "Look, it was more than a year ago that I think I wrote the letter about personal superintelligence as the North Star for the work that we're doing here.", "zh": "你看，一年多以前，我想我写过一封关于个人超级智能的信，把它作为我们工作的北极星。"}, {"start": 523.6, "end": 540.13, "text": "It basically fits with this line of work that we've done for more than 20 years at the company that is focused on empowering individuals, giving people a voice, giving people the tools to connect in the ways that they want.", "zh": "它基本上符合我们 20 多年来一直专注的工作，即赋予个人权力，给人们发声的机会，给人们提供以他们想要的方式连接的工具。"}, {"start": 540.13, "end": 560, "text": "When you extend that to the work around AI now, we think that the most important thing that we can be building for this next generation of technology is basically putting the power of this technology in everyone's hands, which is the personal superintelligence vision.", "zh": "当你把这一点延伸到现在的 AI 工作时，我们认为，对于这一代技术，我们能打造的最重要的东西基本上就是把这项技术的力量交到每个人手中，这就是个人超级智能的愿景。"}, {"start": 560, "end": 567.61, "text": "Mark Zuckerberg: We've been working on this for a while, and this is when we did the reboot around MSL and building the lab.", "zh": "Mark Zuckerberg：我们已经为此工作了一段时间，这就是我们围绕 MSL 进行重组并建立实验室的时候。"}, {"start": 567.61, "end": 583.19, "text": "A lot of it was this idea that we need to build models specifically to be good as personal agents, that we'd be able to build the best experience by owning and building and designing ourselves the end-to-end technology.", "zh": "很多想法是，我们需要打造专门擅长作为个人智能体的模型，这样通过拥有并自己设计端到端技术，我们就能够打造最佳体验。"}, {"start": 583.19, "end": 586.6, "text": "So that includes the models and then the agents.", "zh": "这包括模型，然后是智能体。"}, {"start": 586.6, "end": 589.95, "text": "This has kind of been in the works for a while.", "zh": "这已经酝酿了一段时间。"}, {"start": 589.95, "end": 593.43, "text": "The vision around the glasses has also been this.", "zh": "围绕眼镜的愿景也是如此。"}, {"start": 593.43, "end": 602.61, "text": "We've wanted to build the next generation of hardware platforms so that we can deliver the best end-to-end experiences to people.", "zh": "我们一直想打造下一代硬件平台，以便提供最佳的端到端体验。"}, {"start": 602.61, "end": 610.01, "text": "I think that that's starting to come together as well, and I think will even more over the coming years.", "zh": "我认为这一点也开始汇聚，我认为在未来几年还会更加如此。"}, {"start": 610.01, "end": 612, "text": "So these are long-term bets.", "zh": "我的意思是，这些都是长期押注。"}, {"start": 612, "end": 621.35, "text": "Mark Zuckerberg: I feel like this is what we're here to do, is make long-term technology bets and design the best experiences end to end that we can for billions of people around the world.", "zh": "Mark Zuckerberg：我觉得这就是我们在这里要做的事情，就是做出长期的技术押注，设计我们能够为全球数十亿人提供的最佳端到端体验。"}, {"start": 621.35, "end": 632, "text": "I think as long as we continue to do that, then over time, the business takes care of itself, as long as we continue executing well, which I'm really proud of the team for how we're doing on that.", "zh": "我认为，只要我们继续这样做，随着时间的推移，业务自然会好起来，只要我们继续执行得好，我为团队在这方面的表现感到非常自豪。"}, {"start": 632, "end": 632.84, "text": "Susan Li: Thanks, Mark.", "zh": "Susan Li：谢谢 Mark。"}, {"start": 632.84, "end": 636.48, "text": "Your second question was around Muse for small business.", "zh": "你的第二个问题是关于面向小企业的 Muse。"}, {"start": 636.48, "end": 641.99, "text": "We launched that, which you can think of as an expansion for Muse, in late September.", "zh": "我们是在 9 月下旬推出的，你可以把它看作是 Muse 的一个扩展。"}, {"start": 641.99, "end": 653.21, "text": "Rather than a separate product, it is kind of a set of new skills and connectors inside the existing Muse app aimed at helping SMB owners run operations, find new customers.", "zh": "它不是一个独立的产品，而是一套新的技能和连接器，内置在现有的 Muse 应用中，旨在帮助中小企业主运营业务、寻找新客户。"}, {"start": 653.21, "end": 669.03, "text": "It connects to a business's, for example, Instagram account analytics or Facebook pages or Meta ad accounts in a few clicks, along with dozens of third-party connectors that businesses already run on, like Shopify, QuickBooks, Canva, et cetera.", "zh": "它可以连接企业的 Instagram 账号分析或 Facebook 主页或 Meta 广告账号，只需点击几下，还有企业已经在使用的几十个第三方连接器，例如 Shopify、QuickBooks、Canva 等。"}, {"start": 669.03, "end": 675, "text": "It already understands what businesses sell, its brand voice, what customers are asking for.", "zh": "它已经了解企业销售什么、品牌声音、客户在问什么。"}, {"start": 675, "end": 683.33, "text": "Susan Li: Muse can take actions, including analyze ad and content performance, draft campaigns, customer responses, flag issues.", "zh": "Susan Li：Muse 可以采取行动，包括分析广告和内容表现、起草广告活动、客户回复、标记问题。"}, {"start": 683.33, "end": 689.41, "text": "We are actively listening to our SMB users to understand what their top use cases are.", "zh": "我们正在积极倾听我们的中小企业用户，了解他们的首要使用场景。"}, {"start": 689.41, "end": 706, "text": "We are seeing them use it for ads optimization, for direct message organizing, use it to expand their sales footprint, to keep their website current based on things like inventory and new products, to deal with employee load balancing.", "zh": "我们看到他们用它来优化广告、整理直接消息、扩大销售版图、根据库存和新产品保持网站更新、处理员工工作量平衡。"}, {"start": 706, "end": 719.33, "text": "Susan Li: We are pretty closely following how businesses use Muse to make sure that we are being thoughtful about new features that we release in Muse to make it maximally useful and productive for SMBs.", "zh": "Susan Li：我们正在密切关注企业如何使用 Muse，以确保我们对在 Muse 中发布的新功能深思熟虑，使其对中小企业尽可能有用和高效。"}, {"start": 719.33, "end": 738.18, "text": "I would also say we have unique touch points to, again, I mentioned in my opening remarks, 500 million self-identified small businesses, and we think that many of the investments that we make in consumer products are going to carry over to help power those businesses also.", "zh": "我还想说，我们有独特的触点，再说一次，我在开场白中提到，5 亿自认为是小企业的企业，我们认为我们在消费产品方面的许多投资也将延续，帮助这些企业。"}, {"start": 738.18, "end": 744.81, "text": "We have multiple excellent channels to surface those opportunities to small businesses globally.", "zh": "我们有多个出色的渠道，可以在全球范围内向小企业展示这些机会。"}, {"start": 744.81, "end": 752.75, "text": "This is a place where we feel like we have an existing extremely strong platform, and we are very excited about it.", "zh": "这是一个我们觉得已经拥有非常强大的平台的地方，我们对此非常兴奋。"}, {"start": 752.75, "end": 760, "text": "We also believe the transition to AI has broadly unlocked enterprise as a new opportunity for us as well.", "zh": "我们也相信，向 AI 的过渡已经广泛地为企业开启了新的机会。"}, {"start": 760, "end": 764.87, "text": "Operator: Your next question comes from the line of Ross Sandler with Barclays.", "zh": "Operator：下一个问题来自巴克莱的 Ross Sandler。"}, {"start": 764.87, "end": 766, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 766, "end": 766.45, "text": "Ross Sandler: Great.", "zh": "Ross Sandler：很好。"}, {"start": 766.45, "end": 782.92, "text": "Mark, you touched on this earlier, but could you elaborate a little bit on maybe some high-level metrics around the per-user cost structure of Muse today, and then how you see that cost curve coming down as you go forward?", "zh": "Mark，你之前提到过这一点，但你能否详细说明一下今天 Muse 的每用户成本结构的一些高层指标，以及你如何看待这条成本曲线在未来下降？"}, {"start": 782.92, "end": 788.26, "text": "What are some of the things you are doing to bring that cost curve down?", "zh": "你们正在做些什么来降低这条成本曲线？"}, {"start": 788.26, "end": 789, "text": "Thank you.", "zh": "谢谢。"}, {"start": 789, "end": 790.82, "text": "Susan Li: I am happy to answer that.", "zh": "Susan Li：我很乐意回答这个问题。"}, {"start": 790.82, "end": 795.15, "text": "Mark, you should add anything that you feel like I am missing.", "zh": "Mark，你应该补充任何你觉得我遗漏的内容。"}, {"start": 795.15, "end": 805.09, "text": "We do not have specific numbers to share around the cost structure of Muse today, but of course it is, as Mark said, pretty compute expensive.", "zh": "我们目前没有关于今天 Muse 成本结构的具体数字可以分享，但当然，正如 Mark 所说，它的算力成本相当高。"}, {"start": 805.09, "end": 817.19, "text": "Making sure that we are focused on compute efficiency is going to be one of the key vectors towards being able to both scale Muse and grow it into the business that we want.", "zh": "确保我们专注于算力效率将是能够扩大 Muse 规模并将其发展成我们想要的业务的关键因素之一。"}, {"start": 817.19, "end": 821.87, "text": "I think there are a couple dimensions of achieving that efficiency.", "zh": "我认为实现这种效率有几个维度。"}, {"start": 821.87, "end": 832.92, "text": "I think some of the more nearer-term pieces include things like leveraging off-peak or spare computing capacity to run some sets of jobs using smaller models.", "zh": "我认为一些更近期的部分包括利用非高峰或闲置计算能力来运行一些使用较小模型的作业。"}, {"start": 832.92, "end": 846, "text": "There is a lot of work to be done across different inference efficiency initiatives, all in service effectively of higher GPU utilization and other product efficiency work we can do also.", "zh": "在不同的推理效率举措方面还有很多工作要做，所有这些实际上都是为了提高 GPU 利用率和其他我们也可以做的产品效率工作。"}, {"start": 846, "end": 866.32, "text": "Susan Li: I think over the longer term, I think this is a place where we expect that we are going to be able to, over time, as LLM scale, get more tasks done with fewer tokens and also rely on AI models themselves to help us improve the efficiency of the software that we use to run the models.", "zh": "Susan Li：我认为从长远来看，我认为这是一个我们预计能够随着时间的推移，随着大语言模型的扩展，用更少的 token 完成更多的任务，并且依靠 AI 模型本身来帮助我们提高运行模型所用软件的效率的地方。"}, {"start": 866.32, "end": 876.48, "text": "I think it is a place where we both feel like there is a lot more work on our efficiency roadmap that is going to help us bend the curve here.", "zh": "我认为这是一个我们都觉得在效率路线图上还有很多工作要做的地方，这将帮助我们压低成本曲线。"}, {"start": 876.48, "end": 887, "text": "We also expect that the arc of how the AI-driven technological advances are going to apply here will also help us achieve larger savings over time.", "zh": "我们也预计，AI 驱动的技术进步将如何应用的弧线也将帮助我们随着时间的推移实现更大的节约。"}, {"start": 887, "end": 891.92, "text": "Operator: Your next question comes from the line of Mark Mahaney with Evercore ISI.", "zh": "Operator：下一个问题来自 Evercore ISI 的 Mark Mahaney。"}, {"start": 891.92, "end": 893, "text": "Please go ahead.", "zh": "请提问。"}]}, {"title": "Meta Q3 2026 — Part 5 of 5: Q&A: Mahaney and close", "mp3": "https://billyxiaoli.github.io/us-briefs/meta-q3-2026/section-5/section-5.mp3", "dur": "4:14", "lines": [{"start": 0, "end": 0.97, "text": "Mark Mahaney: Okay, thanks.", "zh": "Mark Mahaney：好的，谢谢。"}, {"start": 0.97, "end": 2.02, "text": "Two questions.", "zh": "两个问题。"}, {"start": 2.02, "end": 15.23, "text": "There is a bit of a playbook, or there has been at Meta over the years when you surface new surfaces and you build up the user growth engagement, then you layer in monetization.", "zh": "Meta 多年来一直有一个套路：当你们推出新的版块、积累用户增长和互动，然后再叠加变现。"}, {"start": 15.23, "end": 32.1, "text": "Do you think it is sort of a similar playbook here, or does it have to be a little bit faster with Muse, just given that the costs associated with it are materially greater, arguably, than launching those surfaces in the past?", "zh": "你认为这里也是类似的套路吗？还是说，由于 Muse 的相关成本可以说比过去推出这些版块时要大得多，所以必须稍微快一点？"}, {"start": 32.1, "end": 40.98, "text": "Then just a clarification on that commerce data point that you provided about 25% of users and the $200 or greater ASP.", "zh": "然后只是澄清一下你们提供的关于 25% 用户和 200 美元或以上平均售价的商务数据点。"}, {"start": 40.98, "end": 47.25, "text": "Are you including in commerce travel purchases, or is that just a retail data point?", "zh": "你们在商务中是否包括旅行购买，还是说那只是一个零售数据点？"}, {"start": 47.25, "end": 48, "text": "Thank you.", "zh": "谢谢。"}, {"start": 48, "end": 57.18, "text": "Mark Zuckerberg: My guess, I think that we are going to work on monetization somewhat sooner on this than our normal playbook for a couple of reasons.", "zh": "Mark Zuckerberg：我的猜测是，我认为我们将在变现方面比我们通常的套路稍微早一些，原因有几个。"}, {"start": 57.18, "end": 70.5, "text": "One is just the size of the numbers that we are talking about in terms of both the costs and the opportunity, I think make it important to make progress on that in order to be able to scale it.", "zh": "一个原因是，我们谈论的数字规模，无论是成本还是机会，都让我认为取得进展对于扩大规模很重要。"}, {"start": 70.5, "end": 75.88, "text": "The other is just that such a large part of what people are doing is commerce.", "zh": "另一个原因是，人们所做的事情中有很大一部分是商务。"}, {"start": 75.88, "end": 79.13, "text": "To your question, that does include travel too.", "zh": "关于你的问题，那也包括旅行。"}, {"start": 79.13, "end": 97, "text": "I think we might consider travel a different case, but travel is actually one of the other top use cases for Muse, is basically people planning that out and planning different kinds of things that they would get than they might get through our family of apps.", "zh": "我认为我们可能会把旅行看作一个不同的案例，但旅行实际上是 Muse 的另一个主要使用场景，基本上是人们规划行程以及规划通过我们的应用家族可能获得的不同种类的东西。"}, {"start": 97, "end": 105.17, "text": "Mark Zuckerberg: I think that this is going to be an important thing for us to work on to deliver the consumer value that people want.", "zh": "Mark Zuckerberg：我认为，这将是我们为提供人们想要的消费者价值而努力的重要事情。"}, {"start": 105.17, "end": 114.33, "text": "In doing so, I think we will be able to build a model where we get a percent of the value that we are helping to create for people.", "zh": "在这样做的过程中，我认为我们将能够建立一个模式，让我们获得我们帮助人们创造的价值的一部分。"}, {"start": 114.33, "end": 129, "text": "I think that it is going to be very important to get the math on all of this to work out, so that way we can continue the compute build-out that we want to build in order to get this to reach everyone at scale.", "zh": "我认为，让所有这些数学算得通将非常重要，这样我们才能继续我们想要的算力建设，以达到每个人的规模。"}, {"start": 129, "end": 152.43, "text": "Mark Zuckerberg: In addition to everything that Susan said in response to the last answer, I would also just add that we just see this trend that year-over-year, I just expect that we will be able to deliver the same intelligence that we have now in Muse Wonder or frankly, any of the current frontier models at a fraction of the cost in a smaller model a year from today.", "zh": "Mark Zuckerberg：除了 Susan 在回答上一个问题时说的所有内容，我还想补充一点，我们只是看到这样一个趋势：同比来看，我只是预计，我们将能够以今天一小部分的成本，在一年后的更小模型中提供我们现在在 Muse Wonder 或坦率地说任何当前前沿模型中拥有的相同智能。"}, {"start": 152.43, "end": 168, "text": "To the extent that represents some kind of baseline level that people seem to, that is sufficient for product market fit for Muse, I think that we will just continue through continued model development, make progress on that efficiency.", "zh": "就这一点代表了人们似乎认为足以实现 Muse 产品市场契合的某种基线水平而言，我认为我们将通过持续的模型开发，在效率方面继续取得进展。"}, {"start": 168, "end": 179.38, "text": "Mark Zuckerberg: The thing that is, and of course less clear, is that I don't think in a year from now, most people are going to want to use the current model level of intelligence because that's also going to make progress.", "zh": "Mark Zuckerberg：不太清楚的是，我认为一年后，大多数人不会想使用当前的模型智能水平，因为那也将取得进展。"}, {"start": 179.38, "end": 199, "text": "I think we're going to need to work on all of these things, both the revenue pieces of it and scaling the different aspects of that, as well as progressing on the model development and all the efficiency in order to be able to both fund and support the compute build-out and reach billions of people, which again, we want to get to that as soon as possible.", "zh": "我认为我们需要在所有这些事情上努力，包括收入部分和扩大不同方面的规模，以及在模型开发和所有效率方面取得进展，以便既能资助又能支持算力建设，并触达数十亿人，再说一次，我们希望尽快做到这一点。"}, {"start": 199, "end": 215.74, "text": "Mark Zuckerberg: Part of the reason why we're not just charging everyone upfront to use this is we want to establish this Muse network, and we think that it's going to be more valuable for people at scale when there are a lot of people and businesses using Muse, so that way they can collaborate and work together.", "zh": "Mark Zuckerberg：我们之所以不只是向每个人预先收费，部分原因是我们想建立这个 Muse 网络，我们认为当有很多人和企业使用 Muse 时，它在规模上会更有价值，这样他们就可以协作和共同工作。"}, {"start": 215.74, "end": 221.32, "text": "I think that that's really a very important state to get to and one that we're quite excited about.", "zh": "我认为，达到这样一个状态真的非常重要，我们对此非常兴奋。"}, {"start": 221.32, "end": 228.76, "text": "Again, I don't think that there are many companies in the world that are well-situated to be able to do that in the way that we are.", "zh": "再说一次，我不认为世界上有很多公司能够像我们这样很好地做到这一点。"}, {"start": 228.76, "end": 234, "text": "I think we are very well-situated to do that, and we plan to push on that quite aggressively.", "zh": "我认为我们在这一点上位置非常好，我们计划非常积极地推进这一点。"}, {"start": 234, "end": 237.68, "text": "Operator: That does conclude our question-and-answer session.", "zh": "Operator：这就结束了我们的问答环节。"}, {"start": 237.68, "end": 242, "text": "Rob Bevegni, I would like to turn the call back over to you.", "zh": "Rob Bevegni，我想把电话交还给你。"}, {"start": 242, "end": 248, "text": "Rob Bevegni: Thank you for joining us today, and we look forward to speaking with you again soon.", "zh": "Rob Bevegni：感谢大家今天参加，我们期待很快再次与你们交流。"}, {"start": 248, "end": 251.1, "text": "Operator: Ladies and gentlemen, this does conclude today's conference call.", "zh": "Operator：女士们、先生们，今天的电话会议到此结束。"}, {"start": 251.1, "end": 254, "text": "Thank you for your participation, and you may now disconnect.", "zh": "感谢大家的参与，现在可以挂断了。"}]}];
let LINES=SECTIONS[0].lines;
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh'),audioSelect=document.getElementById('audioSelect'),secTitle=document.getElementById('secTitle');
let els=[];let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function buildLines(){box.innerHTML='';LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;const p=a.play();if(p&&p.catch)p.catch(()=>{playBtn.textContent='▶';});playBtn.textContent='⏸';};box.appendChild(d);});els=[...box.children];curIdx=-1;box.scrollTop=0;}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
function loadSection(idx){const s=SECTIONS[idx];a.pause();playBtn.textContent='▶';LINES=s.lines;secTitle.textContent=s.title;a.src=s.mp3;a.load();seek.value=0;cur.textContent='0:00';dur.textContent=s.dur;zhBox.textContent='';buildLines();}
audioSelect.onchange=()=>{loadSection(parseInt(audioSelect.value,10));};
buildLines();
playBtn.onclick=()=>{if(a.paused){const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';const p=a.play();if(p&&p.catch){p.catch(()=>{playBtn.textContent='▶';if(st)st.textContent='音频无法播放：请刷新页面，或换 Safari/Chrome 打开（不要用微信/WhatsApp 内嵌浏览器）。';});}playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
a.onplaying=()=>{const st=document.getElementById('status');if(st)st.textContent='';};
a.onwaiting=()=>{const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';};
a.onerror=()=>{playBtn.textContent='▶';const st=document.getElementById('status');if(st)st.textContent='音频加载失败：请刷新页面，或换 Safari/Chrome 打开。';};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
</body>
</html>
