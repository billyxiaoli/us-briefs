<script>
const SECTIONS=[{"title": "Meta Q3 2026 — Part 1 of 5: Opening and Zuckerberg remarks", "mp3": "https://billyxiaoli.github.io/us-briefs/meta-q3-2026/section-1/section-1.mp3", "dur": "14:24", "lines": [{"start": 0, "end": 1.0, "text": "Operator: Good afternoon.", "zh": "Operator：下午好。"}, {"start": 1.0, "end": 5.18, "text": "My name is Krista and I will be your conference operator today.", "zh": "我是 Krista，今天担任本次电话会议的主持人。"}, {"start": 5.18, "end": 11.89, "text": "At this time, I would like to welcome everyone to Meta's third quarter 2026 earnings conference call.", "zh": "现在，我欢迎大家参加 Meta 2026 年第三季度财报电话会议。"}, {"start": 11.89, "end": 16.35, "text": "All lines have been placed on mute to prevent any background noise.", "zh": "所有线路已静音，以防背景噪音。"}, {"start": 16.35, "end": 21.2, "text": "After the speaker's remarks, there will be a question and answer session.", "zh": "在发言结束后，将进行问答环节。"}, {"start": 21.2, "end": 26.78, "text": "If you would like to ask a question, please press star one on your telephone keypad.", "zh": "如果您想提问，请按电话键盘上的星号键加 1。"}, {"start": 26.78, "end": 30.04, "text": "To withdraw your question, again, press star one.", "zh": "如需撤回问题，请再次按星号键加 1。"}, {"start": 30.04, "end": 35.29, "text": "We ask that you limit yourself to one question, and this call will be recorded.", "zh": "我们请您只提一个问题，本次电话会议将被录音。"}, {"start": 35.29, "end": 36.61, "text": "Thank you very much.", "zh": "非常感谢。"}, {"start": 36.61, "end": 41, "text": "Rob Bevegni, Meta's Director of Investor Relations, you may begin.", "zh": "下面有请 Meta 投资者关系总监 Rob Bevegni 开始。"}, {"start": 41, "end": 41.53, "text": "Rob Bevegni: Thank you.", "zh": "Rob Bevegni：谢谢。"}, {"start": 41.53, "end": 46.33, "text": "Good afternoon, and welcome to Meta Platforms third quarter 2026 earnings conference call.", "zh": "下午好，欢迎参加 Meta Platforms 2026 年第三季度财报电话会议。"}, {"start": 46.33, "end": 50.82, "text": "Joining me today to discuss our results are Mark Zuckerberg, CEO, and Susan Li, CFO.", "zh": "今天与我一起讨论业绩的是首席执行官 Mark Zuckerberg 和首席财务官 Susan Li。"}, {"start": 50.82, "end": 56.2, "text": "Our remarks today will include forward-looking statements which are based on assumptions as of today.", "zh": "我们今天的发言将包含基于今天假设的前瞻性陈述。"}, {"start": 56.2, "end": 66.29, "text": "Actual results may differ materially as a result of various factors, including those set forth in today's earnings press release and in our quarterly report on Form 10-Q filed with the SEC.", "zh": "实际结果可能因多种因素而与预期有重大差异，包括今天财报新闻稿以及向美国证券交易委员会提交的 10-Q 季报中列出的因素。"}, {"start": 66.29, "end": 69.86, "text": "We undertake no obligation to update any forward-looking statement.", "zh": "我们没有义务更新任何前瞻性陈述。"}, {"start": 69.86, "end": 74.34, "text": "During this call, we will present both GAAP and certain non-GAAP financial measures.", "zh": "在本次电话会议中，我们将介绍通用会计准则以及某些非通用会计准则财务指标。"}, {"start": 74.34, "end": 79.25, "text": "A reconciliation of GAAP to non-GAAP measures is included in today's earnings press release.", "zh": "通用会计准则与非通用会计准则指标的调节表包含在今天的财报新闻稿中。"}, {"start": 79.25, "end": 85.71, "text": "The earnings press release and an accompanying investor presentation are available on our website at investor.atmeta.com.", "zh": "财报新闻稿及随附的投资者演示文稿可在我们的网站 investor.atmeta.com 上查阅。"}, {"start": 85.71, "end": 88, "text": "I would like to turn the call over to Mark.", "zh": "现在，我把电话交给 Mark。"}, {"start": 88, "end": 88.65, "text": "Mark Zuckerberg: All right.", "zh": "Mark Zuckerberg：好的。"}, {"start": 88.65, "end": 89.57, "text": "Hey, everyone.", "zh": "大家好。"}, {"start": 89.57, "end": 91.2, "text": "Thanks for joining today.", "zh": "感谢大家今天参加。"}, {"start": 91.2, "end": 94.14, "text": "This has been a busy and exciting few months.", "zh": "过去几个月非常忙碌，也令人振奋。"}, {"start": 94.14, "end": 105.64, "text": "Our family of apps is now used by 3.64 billion people each day, and we are seeing all-time highs in engagement on both Facebook and Instagram, driven by strong growth in video.", "zh": "我们的应用家族每天已有 36.4 亿人使用，Facebook 和 Instagram 的互动均创历史新高，这主要得益于视频的强劲增长。"}, {"start": 105.64, "end": 110.67, "text": "Threads has now overtaken X in monthly actives and continues to grow quickly.", "zh": "Threads 的月活跃用户已超过 X，并继续快速增长。"}, {"start": 110.67, "end": 118.37, "text": "WhatsApp is hitting all-time highs in messaging and is becoming an increasingly important platform for agents as well.", "zh": "WhatsApp 的消息量也创历史新高，并且正日益成为智能体的重要平台。"}, {"start": 118.37, "end": 126.93, "text": "In the last few months, we have had several major milestones towards our goal of delivering personal superintelligence to everyone.", "zh": "在过去几个月里，我们在实现向每个人提供个人超级智能的目标方面取得了几个重大里程碑。"}, {"start": 126.93, "end": 131.96, "text": "We had one of our most successful launches ever with the Muse personal agent.", "zh": "我们最成功的发布之一就是 Muse 个人智能体。"}, {"start": 131.96, "end": 143, "text": "We shipped Muse Wonder as our first frontier model, and we shipped several new glasses and gadgets with Muse integration, including coming soon to our new audio glasses.", "zh": "我们发布了首个前沿模型 Muse Wonder，还发布了多款集成 Muse 的新眼镜和小设备，包括即将推出的新款音频眼镜。"}, {"start": 143, "end": 148.48, "text": "Mark Zuckerberg: We have been discussing our vision for personal superintelligence for more than a year now.", "zh": "Mark Zuckerberg：一年多来，我们一直在讨论个人超级智能的愿景。"}, {"start": 148.48, "end": 168.68, "text": "We want to help every person have an extremely capable personal agent that understands their goals and can help you achieve them and improve your life in whatever ways you want, whether that is improving your relationships, helping you save time, save money, build a business, create new things, or anything else that you can dream of.", "zh": "我们希望帮助每个人拥有一个极其强大的个人智能体，它了解你的目标，能帮助你实现目标、改善生活，无论是改善人际关系、节省时间、省钱、创业、创造新事物，还是你能想到的任何事。"}, {"start": 168.68, "end": 171.09, "text": "Muse is the product form of this vision.", "zh": "Muse 就是这一愿景的产品形态。"}, {"start": 171.09, "end": 175.06, "text": "Now, we have the foundational technology in place to deliver this.", "zh": "现在，我们已经具备了实现这一愿景的基础技术。"}, {"start": 175.06, "end": 179.64, "text": "There is still a lot of work ahead, but our initial position is very strong.", "zh": "前面还有很多工作要做，但我们的初始位置非常强。"}, {"start": 179.64, "end": 186.39, "text": "In just a month and a half, more than 10 million people in the U.S. and Canada have set up Muse personal agents.", "zh": "仅一个半月，就有超过 1000 万美国和加拿大用户设置了 Muse 个人智能体。"}, {"start": 186.39, "end": 192, "text": "Growth continues to be strong, and we have been number one in the App Store almost every day.", "zh": "增长势头依然强劲，我们几乎每天都位居 App Store 第一名。"}, {"start": 192, "end": 195.54, "text": "Mark Zuckerberg: Engagement and retention are also off to a strong start.", "zh": "Mark Zuckerberg：互动和留存也有了一个良好的开端。"}, {"start": 195.54, "end": 199.64, "text": "About 25% of people who have set up Muse use it on any given day.", "zh": "设置了 Muse 的用户中，约 25% 每天都会使用它。"}, {"start": 199.64, "end": 205.71, "text": "For our earliest adopters, the longer that they use Muse, the better the retention seems to get.", "zh": "对于最早的用户来说，使用时间越长，留存似乎越好。"}, {"start": 205.71, "end": 214.86, "text": "To put this in perspective, this is more than twice the level that Threads started at, or where we believe that other AI apps started at as well.", "zh": "换个角度看，这一水平是 Threads 起步水平的两倍多，也高于我们认为的其他 AI 应用的起步水平。"}, {"start": 214.86, "end": 232.29, "text": "The most common use case for Muse is shopping, with more than a quarter of people who are using Muse engaging in this with an average purchase size of over $200. Plaid told us that they hadn't seen activity like they're seeing with their connector on any other service before.", "zh": "Muse 最常见的使用场景是购物，超过四分之一的 Muse 用户参与其中，平均购买金额超过 200 美元。Plaid 告诉我们，他们从未在其他服务的连接器上看到过这样的活跃度。"}, {"start": 232.29, "end": 240, "text": "In the first week, we had to work with Stripe to raise credit limits since the volumes were above what any of us expected.", "zh": "第一周，我们不得不与 Stripe 合作提高信用额度，因为交易量超出了我们所有人的预期。"}, {"start": 240, "end": 248.93, "text": "Mark Zuckerberg: Beyond shopping, the most common connectors are for personal productivity and connecting Muse to your other services like email and calendar.", "zh": "Mark Zuckerberg：除了购物，最常见的连接器是个人生产力类，以及将 Muse 连接到你的其他服务，例如电子邮件和日历。"}, {"start": 248.93, "end": 264.97, "text": "This shows the importance of the Muse secure VM that we've built to provide state-of-the-art privacy and security, and we are looking forward to following up soon with a Muse confidential VM, which will make it so that even Meta cannot see your content.", "zh": "这凸显了我们打造的 Muse 安全虚拟机的重要性，它提供最先进的隐私和安全保护，我们期待很快推出 Muse 机密虚拟机，届时连 Meta 也无法看到你的内容。"}, {"start": 264.97, "end": 277.13, "text": "We've also seen that Muse Wonder improves quality, engagement, and retention further, which suggests that as we continue to improve intelligence, Muse will perform better and better over time.", "zh": "我们还看到，Muse Wonder 进一步提升了质量、互动和留存，这表明随着智能水平的不断提升，Muse 的表现会越来越好。"}, {"start": 277.13, "end": 285.43, "text": "Now that Muse has clear product market fit, we are entering a new phase and a more operational phase that is focused on scaling it.", "zh": "现在 Muse 已明显找到产品与市场的契合点，我们正进入一个更注重规模化的新阶段、更运营化的阶段。"}, {"start": 285.43, "end": 289.42, "text": "The goals for this next phase play to many of Meta's strengths.", "zh": "下一阶段的目标契合 Meta 的许多优势。"}, {"start": 289.42, "end": 295, "text": "We need to do three things: scale the product, grow revenue, and optimize compute costs.", "zh": "我们需要做三件事：扩大产品规模、增加收入、优化算力成本。"}, {"start": 295, "end": 298.1, "text": "Mark Zuckerberg: We expect to grow Muse to serve billions of people.", "zh": "Mark Zuckerberg：我们预计将把 Muse 扩展到服务数十亿人。"}, {"start": 298.1, "end": 300.65, "text": "This is both our mission and our strategy.", "zh": "这既是我们的使命，也是我们的战略。"}, {"start": 300.65, "end": 307.15, "text": "It's our mission in that we believe in putting the power of personal superintelligence in everyone's hands.", "zh": "之所以是使命，是因为我们相信要把个人超级智能的力量交到每个人手中。"}, {"start": 307.15, "end": 318.22, "text": "We believe that that is the path to ensuring a positive future for everyone with individual empowerment as the source of prosperity and balance of power as the foundation for safety.", "zh": "我们相信，这是确保每个人都有美好未来的道路，个人赋权是繁荣之源，权力制衡是安全之基。"}, {"start": 318.22, "end": 324.78, "text": "On a values level, we believe that delivering this capability widely is the best thing that we can be doing.", "zh": "从价值观层面看，我们相信广泛地提供这一能力是我们能做的最好的事。"}, {"start": 324.78, "end": 334.75, "text": "This is also our strategy because we think that billions of Muses in a network at scale will be able to get more done for people and businesses by working together.", "zh": "之所以也是战略，是因为我们认为，规模化网络中的数十亿个 Muse 协同工作，能为人们和企业完成更多事情。"}, {"start": 334.75, "end": 339, "text": "We'd like to create a large-scale Muse network as quickly as possible.", "zh": "我们希望尽快创建一个大规模的 Muse 网络。"}, {"start": 339, "end": 360.7, "text": "Mark Zuckerberg: From a business perspective, the average revenue per American user for our existing Muse users, sorry, for our existing family of apps users, is several hundreds of dollars annually, and we expect that Muse will reach an even higher level over time due to the amount of commerce that we already see taking place.", "zh": "Mark Zuckerberg：从商业角度看，我们现有 Muse 用户（抱歉，是现有应用家族用户）中每位美国用户的年均收入为数百美元，由于我们已经看到的大量交易，我们预计 Muse 未来会达到更高的水平。"}, {"start": 360.7, "end": 365.22, "text": "This will take some time, but we're starting to work on this now.", "zh": "这需要一些时间，但我们现在已经开始着手了。"}, {"start": 365.22, "end": 368.42, "text": "Our business model will have a few components.", "zh": "我们的商业模式将有几个组成部分。"}, {"start": 368.42, "end": 378.78, "text": "For most people, the product should be free, and we will build commerce tools so we get paid a fee based on the transactions that we help facilitate.", "zh": "对大多数人来说，产品应该是免费的，我们将打造商务工具，根据我们帮助促成的交易收取费用。"}, {"start": 378.78, "end": 381.98, "text": "We expect this will be paid for by businesses.", "zh": "我们预计这部分费用将由企业支付。"}, {"start": 381.98, "end": 389, "text": "For people who want the most advanced models or to use extra tokens, they subscribe directly and pay.", "zh": "对于想要最先进模型或使用额外 token 的用户，他们可以直接订阅并付费。"}, {"start": 389, "end": 400.09, "text": "Mark Zuckerberg: For business owners who want additional features to use Muse to grow their businesses or for companies that want people to use Muse for work, they will be able to subscribe directly and pay as well.", "zh": "Mark Zuckerberg：对于想要更多功能、用 Muse 发展业务的企业主，或者希望员工使用 Muse 工作的公司，他们也可以直接订阅并付费。"}, {"start": 400.09, "end": 409.5, "text": "For those who want Muse to help improve the personalization and quality of their content and ads across Meta, they will be able to connect to those experiences as well.", "zh": "对于希望 Muse 帮助提升其在 Meta 的内容和广告的个性化与质量的用户，他们也可以连接到这些体验。"}, {"start": 409.5, "end": 416.61, "text": "Just to clarify, the average revenue that I was talking about before is the family of apps revenue for our existing Muse users.", "zh": "澄清一下，我之前说的平均收入是指我们现有 Muse 用户的应用家族收入。"}, {"start": 416.61, "end": 423, "text": "On the compute side, we are building out the capacity to serve more than 1 billion people over the next few years.", "zh": "在算力方面，我们正在建设未来几年服务超过 10 亿人的能力。"}, {"start": 423, "end": 436.32, "text": "Mark Zuckerberg: In the near term, Muse is very compute-intensive to run, but we expect to improve its cost efficiency by more than 10x in the next year, which will enable it to be profitable once the revenue lines are at scale.", "zh": "Mark Zuckerberg：短期内，Muse 的运行非常耗费算力，但我们预计明年将其成本效率提高 10 倍以上，这将使它在收入规模上来后实现盈利。"}, {"start": 436.32, "end": 446.54, "text": "If compute efficiency continues improving quickly for another few years, which we think is highly likely, then Muse will be highly profitable over multiple years.", "zh": "如果算力效率在未来几年继续快速提升——我们认为这很有可能——那么 Muse 将在多年内实现高盈利。"}, {"start": 446.54, "end": 457.97, "text": "In the near term, the strength of our core business enables us to scale the Muse network before then, and we believe that we are the best-positioned company to pursue this strategy.", "zh": "短期内，核心业务的实力使我们能够在此之前扩大 Muse 网络的规模，我们相信我们是追求这一战略的最佳位置的公司。"}, {"start": 457.97, "end": 469.39, "text": "One other note on compute economics is that since training is a large fixed cost, now that we have leading models, we want to serve as much high-margin inference demand as possible.", "zh": "关于算力经济学的另一点是，由于训练是一项很大的固定成本，现在我们有了领先的模型，我们希望尽可能多地服务高利润的推理需求。"}, {"start": 469.39, "end": 474, "text": "That is why we are building the Meta Enterprise platform led by CJ Desai.", "zh": "这就是我们正在打造由 CJ Desai 领导的 Meta 企业平台的原因。"}, {"start": 474, "end": 486.15, "text": "Mark Zuckerberg: Muse Wonder and even more advanced models that we're training can serve additional high-margin services beyond the Muse network, including our API, Muse Code, and other enterprise services.", "zh": "Mark Zuckerberg：Muse Wonder 以及我们正在训练的更先进模型，可以服务 Muse 网络之外的其他高利润服务，包括我们的 API、Muse Code 和其他企业服务。"}, {"start": 486.15, "end": 491.67, "text": "A fundamental feature of our business is that we have many good uses for this compute.", "zh": "我们业务的一个基本特征是，我们的算力有很多好的用途。"}, {"start": 491.67, "end": 502.66, "text": "It is difficult to forecast the exact growth rates for the Muse network, for our Enterprise platform, and for how Muse Wonder and beyond will accelerate our core business.", "zh": "很难准确预测 Muse 网络、企业平台以及 Muse Wonder 及后续模型加速核心业务的增长率。"}, {"start": 502.66, "end": 513.14, "text": "But through building up multiple ways to deploy these advanced models, we increase the chances that one or more of them significantly outperforms our expectations.", "zh": "但通过打造多种部署这些先进模型的方式，我们增加了其中一个或多个大幅超出预期的机会。"}, {"start": 513.14, "end": 522.32, "text": "Beyond serving other businesses, we have not yet found the limit of how effectively we can apply compute to accelerating our own core business.", "zh": "除了服务其他企业，我们还没有找到算力在加速自身核心业务方面的有效性上限。"}, {"start": 522.32, "end": 531, "text": "We have implemented an eval with Muse Wonder to improve how effectively it can autonomously improve our recommendations and ad systems.", "zh": "我们已经用 Muse Wonder 做了一个评估，以提高它自主改善我们的推荐和广告系统的有效性。"}, {"start": 531, "end": 539.55, "text": "Mark Zuckerberg: As our upcoming models get even more advanced, I expect that we're going to see an increasing rate of improvement in these systems.", "zh": "Mark Zuckerberg：随着我们未来的模型变得更加先进，我预计这些系统的改善速度会越来越快。"}, {"start": 539.55, "end": 540.21, "text": "All right.", "zh": "好的。"}, {"start": 540.21, "end": 542.3, "text": "Let's talk about the models now.", "zh": "现在谈谈模型。"}, {"start": 542.3, "end": 548.7, "text": "Muse Wonder is state-of-the-art across many dimensions that matter for personal superintelligence.", "zh": "Muse Wonder 在与个人超级智能相关的许多维度上都达到了最先进水平。"}, {"start": 548.7, "end": 554.57, "text": "This validates the importance of training models ourselves to deliver the best experience.", "zh": "这验证了我们自己训练模型以提供最佳体验的重要性。"}, {"start": 554.57, "end": 564.63, "text": "In addition to Muse, we have also seen that engagement per person in Meta AI has more than doubled since April when we started rolling out our new models.", "zh": "除了 Muse，我们还看到，自 4 月开始推出新模型以来，Meta AI 的人均互动已经翻了一番多。"}, {"start": 564.63, "end": 571.81, "text": "While Muse Wonder has been our most important release, I've been very pleased with our pace of execution here.", "zh": "虽然 Muse Wonder 是我们最重要的发布，但我对我们在这里的执行速度非常满意。"}, {"start": 571.81, "end": 582, "text": "In the last few months, we've shipped Muse Spark 1.2 and 1.3, Muse Code, two open weights models with Muse Glimmer and Muse Spark Open, and also Muse Voice.", "zh": "在过去几个月里，我们发布了 Muse Spark 1.2 和 1.3、Muse Code、两个开放权重模型 Muse Glimmer 和 Muse Spark Open，还有 Muse Voice。"}, {"start": 582, "end": 595.71, "text": "Mark Zuckerberg: Going forward, with the field advancing quickly, we plan to focus on both pushing the frontier of intelligence and distilling those models into much smaller and more efficient product models that will be optimized for personal agents.", "zh": "Mark Zuckerberg：展望未来，随着领域快速发展，我们计划既推动智能前沿，也把这些模型蒸馏成更小、更高效、为个人智能体优化的产品模型。"}, {"start": 595.71, "end": 603.62, "text": "My view is that we will be able to build superintelligence through scaling, so we are methodically working our way up the ladder there.", "zh": "我的看法是，我们可以通过规模化来打造超级智能，所以我们正在有条不紊地沿着这条路往上走。"}, {"start": 603.62, "end": 610.19, "text": "We are already working on larger models after Muse Wonder, and they are going to be very impressive and capable.", "zh": "我们已经在开发 Muse Wonder 之后的更大模型，它们将非常令人印象深刻、非常强大。"}, {"start": 610.19, "end": 617.98, "text": "We are also working on new smaller models that are coming out soon that will deliver Muse Wonder-level intelligence more efficiently.", "zh": "我们也在开发即将推出的新款更小模型，它们将更高效地提供 Muse Wonder 级别的智能。"}, {"start": 617.98, "end": 623.14, "text": "Moving on, our work on personal superintelligence is now also the focus of Reality Labs.", "zh": "接下来，我们在个人超级智能方面的工作现在也是 Reality Labs 的重点。"}, {"start": 623.14, "end": 629, "text": "Muse is coming to Meta Glasses starting next month, and that will be an important step towards this.", "zh": "从下个月开始，Muse 将登陆 Meta 眼镜，这将是重要的一步。"}, {"start": 629, "end": 636.36, "text": "Mark Zuckerberg: People already love many features of the glasses already, music, calling, capturing moments, hearing assistance, and more.", "zh": "Mark Zuckerberg：人们已经非常喜欢眼镜的许多功能，音乐、通话、记录瞬间、助听等等。"}, {"start": 636.36, "end": 645.46, "text": "But over time, we expect Muse and having your personal superintelligence with you throughout the day will be the most important part of the experience.", "zh": "但随着时间的推移，我们预计 Muse 以及全天陪伴你的个人超级智能将成为体验中最重要的部分。"}, {"start": 645.46, "end": 649.02, "text": "Muse is also central to the business model for the glasses.", "zh": "Muse 也是眼镜商业模式的核心。"}, {"start": 649.02, "end": 652.58, "text": "Again, our mission and strategy are to serve everyone here.", "zh": "再说一次，我们的使命和战略就是服务所有人。"}, {"start": 652.58, "end": 656.86, "text": "We believe in putting the power of this technology in everyone's hands.", "zh": "我们相信要把这项技术的力量交到每个人手中。"}, {"start": 656.86, "end": 666.51, "text": "So we have priced our devices not to make a large profit on the hardware, but to build a large software and superintelligence business on top of them over time.", "zh": "因此，我们为设备定价时并不是为了在硬件上赚取高额利润，而是为了长期在其之上打造大型的软件和超级智能业务。"}, {"start": 666.51, "end": 677, "text": "Glasses sales continue to grow rapidly, and now with Muse, we expect that paid subscriptions will increase and that this business will begin improving meaningfully from here.", "zh": "眼镜销量继续快速增长，现在有了 Muse，我们预计付费订阅会增加，这项业务将从此开始明显改善。"}, {"start": 677, "end": 693.03, "text": "Mark Zuckerberg: I also shared at Connect that we are changing our approach to virtual reality to only ship new devices when we have major breakthroughs like we had with the Meta VR Glasses this year, which of course are the first VR experience ever in a pair of glasses.", "zh": "Mark Zuckerberg：我在 Connect 大会上也分享过，我们正在改变虚拟现实的做法，只在有重大突破时才发布新设备，就像今年的 Meta VR 眼镜，这是第一款真正装进一副眼镜里的 VR 体验。"}, {"start": 693.03, "end": 710.83, "text": "I continue to believe that the path to delivering holographic experience of bringing together the physical and digital worlds in everyday glasses will come through VR first, but we will pace this aspect of our investment more to focus on delivering personal superintelligence first.", "zh": "我仍然相信，通过 VR 率先实现将物理世界和数字世界结合的全息体验、并装进日常眼镜的道路是可行的，但我们会放缓这方面的投资节奏，优先实现个人超级智能。"}, {"start": 710.83, "end": 723.57, "text": "So with these factors combined, we expect that the P&L of Reality Labs to improve from here with operating loss coming down to around $15 billion next year and trending towards profitability from there.", "zh": "综合这些因素，我们预计 Reality Labs 的损益将从此改善，明年运营亏损将降至约 150 亿美元左右，并从此趋向盈利。"}, {"start": 723.57, "end": 729, "text": "Before we conclude, I want to spend a moment on the sheer velocity that we are seeing.", "zh": "在结束之前，我想花一点时间谈谈我们看到的惊人速度。"}, {"start": 729, "end": 736.09, "text": "Mark Zuckerberg: An important part of our approach has always been to move fast so we can learn quickly and serve people better at scale.", "zh": "Mark Zuckerberg：我们方法的一个重要部分一直是快速行动，这样我们就能快速学习、更好地大规模服务人们。"}, {"start": 736.09, "end": 738.05, "text": "Recently things have accelerated.", "zh": "最近，事情加速了。"}, {"start": 738.05, "end": 742.83, "text": "In the last year, we shipped Edits, and it has already passed 50 million actives.", "zh": "过去一年，我们发布了 Edits，它已经超过 5000 万活跃用户。"}, {"start": 742.83, "end": 748.86, "text": "New apps like Forum and Seller were built by small teams and are scaling quickly to serve power users.", "zh": "像 Forum 和 Seller 这样的新应用由小团队打造，正快速扩展，服务重度用户。"}, {"start": 748.86, "end": 754.18, "text": "Muse went from an idea on a whiteboard to a successful product in just about eight months.", "zh": "Muse 从白板上的一个想法到一款成功的产品只用了大约八个月。"}, {"start": 754.18, "end": 761.75, "text": "We are about to ship Muse Charm, which will have gone from concept to a hardware device in people's pockets in less than a year.", "zh": "我们即将发布 Muse Charm，它从概念到装进口袋的硬件设备不到一年。"}, {"start": 761.75, "end": 763.82, "text": "I am proud of what we are building.", "zh": "我为我们正在打造的东西感到自豪。"}, {"start": 763.82, "end": 774.46, "text": "People have all kinds of different opinions about the future, but at Meta, we believe that the future is for everyone, and that putting power in people's hands is how we get there.", "zh": "人们对未来有各种各样的看法，但在 Meta，我们相信未来属于每个人，相信把力量交到人们手中就是实现这一未来的方式。"}, {"start": 774.46, "end": 776, "text": "I think that this matters.", "zh": "我认为这很重要。"}, {"start": 776, "end": 780.41, "text": "Mark Zuckerberg: There needs to be a company out there that represents these ideas.", "zh": "Mark Zuckerberg：需要有一家公司代表这些理念。"}, {"start": 780.41, "end": 784.09, "text": "This isn't just about ideas, it's also about execution.", "zh": "这不仅仅是理念问题，也是执行问题。"}, {"start": 784.09, "end": 791.58, "text": "I am grateful for everyone who is working so hard to deliver all of this to billions of people around the world.", "zh": "我感谢所有为把这一切带给全球数十亿人而努力工作的人。"}, {"start": 791.58, "end": 795.86, "text": "As always, thank you to everyone who is on this journey with us.", "zh": "一如既往，感谢所有与我们同行的人。"}, {"start": 795.86, "end": 797, "text": "Now here's Susan.", "zh": "现在有请 Susan。"}, {"start": 797, "end": 800.15, "text": "Susan Li: Thanks, Mark, and good afternoon, everyone.", "zh": "Susan Li：谢谢 Mark，大家下午好。"}, {"start": 800.15, "end": 802.85, "text": "Let's begin with our segment results.", "zh": "让我们从分部业绩开始。"}, {"start": 802.85, "end": 807.9, "text": "All comparisons are on a year-over-year basis unless otherwise noted.", "zh": "除非另有说明，所有比较均为同比。"}, {"start": 807.9, "end": 812.14, "text": "Q3 total family of apps revenue was $64.2 billion, up 26%.", "zh": "第三季度应用家族总收入为 642 亿美元，同比增长 26%。"}, {"start": 812.14, "end": 819.6, "text": "Q3 family of apps ad revenue was $63.1 billion, up 26% on both a reported and constant currency basis.", "zh": "第三季度应用家族广告收入为 631 亿美元，按报告口径和固定汇率口径均同比增长 26%。"}, {"start": 819.6, "end": 825.67, "text": "In Q3, the total number of ad impressions served across our services increased 10%.", "zh": "第三季度，我们各服务上展示的广告总展示次数增加了 10%。"}, {"start": 825.67, "end": 834.82, "text": "Impression growth was healthy across all regions, driven by growth in engagement and users, as well as ad load optimizations.", "zh": "展示次数增长在各个地区都很健康，这得益于互动和用户增长以及广告加载优化。"}, {"start": 834.82, "end": 846.37, "text": "The global average price per ad increased 14% year-over-year, driven by ad performance gains and improvements in macro conditions relative to Q3 of last year.", "zh": "全球每条广告的平均价格同比上涨 14%，这得益于广告效果提升以及相对于去年第三季度宏观环境的改善。"}, {"start": 846.37, "end": 854.49, "text": "This was partially offset by strong impression growth, particularly from lower monetizing surfaces and regions.", "zh": "这部分被强劲的展示次数增长所抵消，尤其是来自变现能力较低的版块和地区。"}, {"start": 854.49, "end": 864, "text": "Family of apps other revenue was $1.1 billion and grew 59%, driven primarily by WhatsApp paid messaging and subscriptions revenue.", "zh": "应用家族其他收入为 11 亿美元，增长 59%，主要得益于 WhatsApp 付费消息和订阅收入。"}]}, {"title": "Meta Q3 2026 — Part 2 of 5: Susan Li results and outlook", "mp3": "https://billyxiaoli.github.io/us-briefs/meta-q3-2026/section-2/section-2.mp3", "dur": "15:17", "lines": [{"start": 0, "end": 14.5, "text": "Susan Li: Within our Reality Labs segment, Q3 revenue was $443 million, down 6% due to lower Quest headset sales, which were partially offset by continued strong growth in AI glasses revenue.", "zh": "Susan Li：在 Reality Labs 分部，第三季度收入为 4.43 亿美元，同比下降 6%，原因是 Quest 头显销量下降，部分被 AI 眼镜收入的持续强劲增长所抵消。"}, {"start": 14.5, "end": 17.62, "text": "Moving now to our consolidated results.", "zh": "现在来看我们的合并业绩。"}, {"start": 17.62, "end": 24.83, "text": "Q3 total revenue was $64.6 billion, up 26% on both a reported and constant currency basis.", "zh": "第三季度总收入为 646 亿美元，按报告口径和固定汇率口径均同比增长 26%。"}, {"start": 24.83, "end": 38.44, "text": "Q3 total expenses were $51.6 billion, up 68% compared to last year, and included a $9.9 billion charge related to the August 2026 multi-state attorneys general agreement.", "zh": "第三季度总费用为 516 亿美元，同比增长 68%，其中包括与 2026 年 8 月多州总检察长协议相关的 99 亿美元费用。"}, {"start": 38.44, "end": 48.05, "text": "Year-over-year growth was primarily driven by legal-related costs, infrastructure costs, and third-party AI token costs.", "zh": "同比增长主要由法律相关成本、基础设施成本和第三方 AI token 成本推动。"}, {"start": 48.05, "end": 58.22, "text": "The growth in infrastructure costs was driven by higher third-party cloud spend, depreciation, and data center operating costs.", "zh": "基础设施成本的增长主要由第三方云支出增加、折旧和数据中心运营成本推动。"}, {"start": 58.22, "end": 66.23, "text": "We ended Q3 with over 66,000 employees, down 12% from Q2 following the May 2026 headcount reduction.", "zh": "第三季度末，我们的员工超过 6.6 万人，较第二季度下降 12%，这是 2026 年 5 月裁员后的结果。"}, {"start": 66.23, "end": 76, "text": "Third quarter GAAP operating income was $13 billion, representing a 37% decline year-over-year and a 20% operating margin.", "zh": "第三季度通用会计准则运营利润为 130 亿美元，同比下降 37%，运营利润率为 20%。"}, {"start": 76, "end": 86.74, "text": "Susan Li: Excluding the Q3 legal charges related to the aforementioned legal settlement, our third quarter operating income would have increased 11% year-over-year.", "zh": "Susan Li：剔除与上述法律和解相关的第三季度法律费用，我们第三季度的运营利润本应同比增长 11%。"}, {"start": 86.74, "end": 95.66, "text": "Our tax rate for the quarter was 24%, above our outlook range, primarily driven by the non-deductible portion of legal expenses.", "zh": "本季度税率为 24%，高于我们的展望区间，主要原因是法律费用的不可抵扣部分。"}, {"start": 95.66, "end": 99.01, "text": "Net income was $9.9 billion, or $3.83 per share.", "zh": "净利润为 99 亿美元，即每股 3.83 美元。"}, {"start": 99.01, "end": 110.51, "text": "Capital expenditures, including principal payments on finance leases, were $34.9 billion, driven by investments in servers, data centers, and network infrastructure.", "zh": "资本支出（包括融资租赁本金支付）为 349 亿美元，主要用于服务器、数据中心和网络基础设施投资。"}, {"start": 110.51, "end": 113.37, "text": "Free cash flow was negative $2.1 billion.", "zh": "自由现金流为负 21 亿美元。"}, {"start": 113.37, "end": 120.34, "text": "We ended the quarter with $82.4 billion in cash and marketable securities and $83.7 billion in debt.", "zh": "本季度末，我们持有 824 亿美元现金和有价证券，债务为 837 亿美元。"}, {"start": 120.34, "end": 123.13, "text": "Turning now to the business performance.", "zh": "现在来看业务表现。"}, {"start": 123.13, "end": 136.38, "text": "There are two primary factors that drive our revenue performance: our ability to deliver engaging experiences for our community and our effectiveness at monetizing that engagement over time.", "zh": "推动我们收入表现的主要因素有两个：为社区提供引人入胜体验的能力，以及随着时间的推移将这种互动变现的有效性。"}, {"start": 136.38, "end": 143, "text": "On the first, we continue to see significant gains from our content recommendation initiatives.", "zh": "首先，我们在内容推荐方面的举措继续取得显著成效。"}, {"start": 143, "end": 152.16, "text": "Susan Li: On Instagram, global time spent per user reached an all-time high and grew double digits year-over-year in Q3, with strength across both Reels and Feed.", "zh": "Susan Li：在 Instagram 上，全球每用户使用时长创历史新高，第三季度同比增长两位数，Reels 和 Feed 均表现强劲。"}, {"start": 152.16, "end": 160.06, "text": "On Facebook, Reels time spent reached all-time highs both globally and in the U.S., with both growing double digits year-over-year.", "zh": "在 Facebook 上，Reels 使用时长在全球和美国均创历史新高，同比均增长两位数。"}, {"start": 160.06, "end": 165.49, "text": "Threads also continued to scale, with time spent per user growing over 20% year-over-year.", "zh": "Threads 也继续扩大规模，每用户使用时长同比增长超过 20%。"}, {"start": 165.49, "end": 175.56, "text": "Engagement gains across our services continue to be driven by improvements we are making to the relevance, personalization, and timeliness of the content we recommend.", "zh": "我们各服务的互动增长持续得益于我们在推荐内容的关联性、个性化和时效性方面的改进。"}, {"start": 175.56, "end": 184, "text": "Investments into our recommendations engine across retrieval and ranking have continued to yield positive results on Instagram and Facebook.", "zh": "我们在检索和排序方面的推荐引擎投资在 Instagram 和 Facebook 上继续取得积极成果。"}, {"start": 184, "end": 204.31, "text": "Susan Li: For instance, on Instagram Reels, our relevance launches in Q3 increased Reels time spent by over 4%, driven in part by our upgraded model architecture that ranks sequences of Reels at a time instead of evaluating each Reel independently, as well as improvements we made to add richer watch time signals.", "zh": "Susan Li：例如，在 Instagram Reels 上，第三季度我们的相关性发布使 Reels 使用时长增加了 4% 以上，部分得益于我们升级的模型架构（一次对一系列 Reels 排序，而不是逐条评估），以及我们为增加更丰富的观看时长信号所做的改进。"}, {"start": 204.31, "end": 225.9, "text": "On Facebook Feed and Reels, we completed the global launch of a new generative retrieval architecture, which, inspired by LLMs, labels pieces of content with semantic representations and generates potential recommendations, helping our systems surface relevant new posts before they have accumulated significant engagement.", "zh": "在 Facebook Feed 和 Reels 上，我们完成了新一代生成式检索架构的全球发布，该架构受大语言模型启发，用语义表征标记内容并生成潜在推荐，帮助我们的系统在新帖子积累大量互动之前就展示相关的帖子。"}, {"start": 225.9, "end": 235.99, "text": "This new architecture is now rolled out to roughly one-quarter of unconnected feed views and half of Reels views, and increased Reels watch time by 1%.", "zh": "这一新架构现已覆盖约四分之一的非关联 Feed 浏览量和一半的 Reels 浏览量，并使 Reels 观看时长增加了 1%。"}, {"start": 235.99, "end": 242, "text": "Our recommendations work is also helping us deliver fresher and more personalized content.", "zh": "我们在推荐方面的工作也有助于提供更新鲜、更个性化的内容。"}, {"start": 242, "end": 261.87, "text": "Susan Li: Nearly 45% of recommended Instagram Reels are now less than one day old, up more than 11 percentage points from Q2. On Facebook Reels, we doubled the amount of history our ranking model can consider, driving a 1% increase in Reels watch time in the U.S. LLMs are also helping us understand content more deeply.", "zh": "Susan Li：近 45% 的推荐 Instagram Reels 现在不到 1 天，比较第二季度提高了 11 个百分点以上。在 Facebook Reels 上，我们将排序模型可考虑的历史量翻了一番，使美国 Reels 观看时长增加了 1%。大语言模型也帮助我们更深入地理解内容。"}, {"start": 261.87, "end": 268.47, "text": "We continue to process public Instagram posts each day through LLM-based content understanding systems.", "zh": "我们每天继续通过基于大语言模型的内容理解系统处理公开的 Instagram 帖子。"}, {"start": 268.47, "end": 275.58, "text": "These signals have improved the engagement with Instagram search results by 1% through the end of this quarter.", "zh": "这些信号使截至本季度末 Instagram 搜索结果的互动提升了 1%。"}, {"start": 275.58, "end": 282.44, "text": "This quarter, we also began moving our content understanding models onto our first-party Muse model family.", "zh": "本季度，我们还开始将内容理解模型迁移到我们自有的 Muse 模型家族。"}, {"start": 282.44, "end": 295, "text": "In offline evaluations, these models are outperforming our prior production models and are reducing per-unit content processing costs by more than 80% across Instagram, Threads, Facebook, and ads.", "zh": "在离线评估中，这些模型优于我们之前的生产模型，并使 Instagram、Threads、Facebook 和广告的单位内容处理成本降低了 80% 以上。"}, {"start": 295, "end": 305.32, "text": "Susan Li: Beyond improving quality, owning more of this stack gives us greater flexibility to develop models around the signals that matter the most for personalization.", "zh": "Susan Li：除了提升质量，拥有更多技术栈还给了我们更大的灵活性，可以围绕对个性化最重要的信号来开发模型。"}, {"start": 305.32, "end": 311.3, "text": "Turning to the second driver of our revenue performance, increasing monetization efficiency.", "zh": "现在来看推动我们收入表现的第二个因素：提高变现效率。"}, {"start": 311.3, "end": 318.12, "text": "We see significant opportunity to continue improving performance for the businesses who use our services.", "zh": "我们看到，在继续改善使用我们服务的企业的业绩方面有重大机会。"}, {"start": 318.12, "end": 335.19, "text": "Within our ad systems, we are continuing to drive performance gains as we deploy more predictive models that understand users more deeply and deliver ad experiences better aligned with their unique preferences, while also making our infrastructure more efficient.", "zh": "在广告系统内，随着我们部署更深入理解用户、提供更符合其独特偏好的广告体验的预测模型，同时提高基础设施效率，我们继续推动业绩提升。"}, {"start": 335.19, "end": 345.65, "text": "Last quarter, we introduced Meta Generative Recommender, which uses LLMs to reason across ad content and user preferences to predict the best ad for each person.", "zh": "上个季度，我们推出了 Meta 生成式推荐器，它利用大语言模型对广告内容和用户偏好进行推理，以预测最适合每个人的广告。"}, {"start": 345.65, "end": 355, "text": "In Q3, we launched this approach to generative retrieval on Facebook Feed, driving a nearly 2% increase in conversions across targeted segments.", "zh": "第三季度，我们在 Facebook Feed 上推出了这种生成式检索方法，使目标细分市场的转化率提高了近 2%。"}, {"start": 355, "end": 368.68, "text": "Susan Li: In addition, we expanded our GEM model for ads ranking to additional surfaces, driving a 1.7% increase in conversions for off-site conversion campaigns and a 9.6% increase in app ad conversions.", "zh": "Susan Li：此外，我们将用于广告排序的 GEM 模型扩展到更多版块，使站外转化活动的转化率提高了 1.7%，应用广告转化率提高了 9.6%。"}, {"start": 368.68, "end": 372.56, "text": "We continue to scale our retrieval systems efficiently.", "zh": "我们继续高效地扩展检索系统。"}, {"start": 372.56, "end": 381.37, "text": "In Q3, improvements to Andromeda, such as scaling model complexity and throughput, increased conversions by 1.4% on Facebook.", "zh": "第三季度，Andromeda 的改进（例如扩大模型复杂度和吞吐量）使 Facebook 的转化率提高了 1.4%。"}, {"start": 381.37, "end": 390.89, "text": "We are also leveraging AI to make it easier for businesses to manage campaigns, develop creative, and act on performance opportunities.", "zh": "我们也在利用 AI，让企业更轻松地管理广告活动、开发创意并把握业绩机会。"}, {"start": 390.89, "end": 397.38, "text": "Meta AI Business Assistant is becoming a more proactive and capable partner for advertisers.", "zh": "Meta AI 商务助手正成为广告主更积极、更有能力的合作伙伴。"}, {"start": 397.38, "end": 412.19, "text": "We estimate that advertisers who adopted its recommendations drove almost 5% more conversions at the same cost per conversion and increased their advertising investment by 9% compared with similar non-adopters.", "zh": "我们估计，采用其建议的广告主在相同每次转化成本下多获得了近 5% 的转化，广告投资比类似的非采用者增加了 9%。"}, {"start": 412.19, "end": 421, "text": "We are rolling out additional capabilities, including creative insights, stronger business context, and more agentic actions.", "zh": "我们正在推出更多功能，包括创意洞察、更强的业务背景和更智能的行动。"}, {"start": 421, "end": 435.47, "text": "Susan Li: These features will allow marketers to plan, create, and optimize campaigns as well as schedule tasks and alerts through a conversational experience with approvals and previews that keep them in control.", "zh": "Susan Li：这些功能将使营销人员能够通过对话体验来规划、创建和优化广告活动，并安排任务和提醒，同时通过审批和预览保持控制。"}, {"start": 435.47, "end": 441.81, "text": "I will share one example of how Meta AI Business Assistant is empowering our advertisers.", "zh": "我将分享一个 Meta AI 商务助手如何赋能广告主的例子。"}, {"start": 441.81, "end": 451.36, "text": "Simply Organic Maple, a family-run maple syrup producer in Vermont, used Meta AI Business Assistant to improve its campaign messaging.", "zh": "Simply Organic Maple 是一家位于佛蒙特州的家族枫糖浆生产商，它使用 Meta AI 商务助手来改善广告活动信息。"}, {"start": 451.36, "end": 464.04, "text": "After the business assistant recommended testing longer, more descriptive advertising copy, the business saw a 57% increase in purchases and a 36% reduction in cost per purchase.", "zh": "在商务助手建议测试更长、更具描述性的广告文案后，该企业的购买量增加了 57%，每次购买成本降低了 36%。"}, {"start": 464.04, "end": 470.88, "text": "Its strongest revised ad delivered a 3x return on ad spend, a 52% improvement from the original.", "zh": "其效果最强的修订广告实现了 3 倍的广告支出回报，比原广告提高了 52%。"}, {"start": 470.88, "end": 476.01, "text": "Adoption of our generative AI ad creative tools also continues to scale.", "zh": "我们生成式 AI 广告创意工具的采用也在继续扩大。"}, {"start": 476.01, "end": 481, "text": "In Q3, nearly 10 million advertisers used at least one of these tools.", "zh": "第三季度，近 1000 万广告主至少使用了一种此类工具。"}, {"start": 481, "end": 493.29, "text": "Susan Li: Advertiser adoption of our video generation features grew 25% quarter-over-quarter, driven in part by ready-made videos that reduce generation time to just a few seconds from a single image upload.", "zh": "Susan Li：广告主对视频生成功能的采用环比增长了 25%，部分得益于即用型视频：仅凭一张图片上传，生成时间就缩短到短短几秒。"}, {"start": 493.29, "end": 498.65, "text": "We are also expanding the opportunity at the intersection of creators and advertising.", "zh": "我们也在扩大创作者与广告交汇处的机会。"}, {"start": 498.65, "end": 513.68, "text": "Partnership ads, which allow advertisers to run ads with creators, brands, and other businesses, continued to scale rapidly in Q3. Our partnership ads product grew over 97% year-over-year and surpassed $15 billion in annual revenue run rate.", "zh": "合作广告（允许广告主与创作者、品牌和其他企业一起投放广告）在第三季度继续快速扩大。我们的合作广告产品同比增长超过 97%，年化收入运行率已超过 150 亿美元。"}, {"start": 513.68, "end": 528.4, "text": "In Q3, we also completed the global rollout of Creator Marketing Hub to all advertisers, bringing creator discovery, content organization, and partnership ad activation into one place with more than 10 million creators now discoverable.", "zh": "第三季度，我们还完成了 Creator Marketing Hub 向所有广告主的全球推广，将创作者发现、内容组织和合作广告激活整合到一个地方，现在已有超过 1000 万创作者可被发现。"}, {"start": 528.4, "end": 542, "text": "We are integrating Meta AI Business Assistant into the hub so advertisers can conversationally search for creators, identify content to use in partnership ads, and get guidance across their creator marketing workflows.", "zh": "我们正在将 Meta AI 商务助手集成到该中心，以便广告主能够对话式地搜索创作者、识别可用于合作广告的内容，并在整个创作者营销工作流程中获得指导。"}, {"start": 542, "end": 548.03, "text": "Susan Li: Outside of ads, we are also building out additional ways to monetize engagement across our ecosystem.", "zh": "Susan Li：在广告之外，我们也在打造更多方式，将整个生态系统中的互动变现。"}, {"start": 548.03, "end": 556.02, "text": "In September, we announced the global expansion of Meta One, our unified subscription service for consumers, creators, and businesses.", "zh": "9 月，我们宣布了 Meta One 的全球扩展，这是我们面向消费者、创作者和企业的统一订阅服务。"}, {"start": 556.02, "end": 568.43, "text": "Meta One is rolling out gradually with more than 50 features across Instagram, Facebook, and WhatsApp, including Meta Business Agent and Meta AI, and has surpassed 15 million subscriptions and trials to date.", "zh": "Meta One 正在逐步推广，在 Instagram、Facebook 和 WhatsApp 上提供 50 多项功能，包括 Meta 商务代理和 Meta AI，迄今已超过 1500 万订阅和试用。"}, {"start": 568.43, "end": 577.03, "text": "The core experience across our apps and Meta AI will remain free, while subscriptions offer more specialized capabilities and expanded AI usage.", "zh": "我们各应用和 Meta AI 的核心体验将保持免费，订阅则提供更专业的功能和更广泛的 AI 使用。"}, {"start": 577.03, "end": 585.02, "text": "Beyond monetizing engagement across our existing services, we are building new experiences and revenue streams around consumer agents.", "zh": "除了在现有服务上变现互动，我们还在围绕消费者智能体打造新的体验和收入来源。"}, {"start": 585.02, "end": 588.42, "text": "Mark highlighted the impressive early momentum with Muse.", "zh": "Mark 强调了 Muse 令人印象深刻的早期势头。"}, {"start": 588.42, "end": 596, "text": "Users have found many reasons to use Muse, with the top three categories being shopping, personal productivity, and creativity.", "zh": "用户使用 Muse 的原因有很多，前三大类别是购物、个人生产力和创造力。"}, {"start": 596, "end": 603.41, "text": "Susan Li: We're encouraged by the breadth of use cases, with shopping in particular being used by over 25% of Muse weekly actives.", "zh": "Susan Li：我们对使用场景的广度感到鼓舞，其中购物尤其受到超过 25% 的 Muse 周活跃用户的欢迎。"}, {"start": 603.41, "end": 612.18, "text": "While our near-term priority is to grow adoption and expand Muse's reach, we see multiple paths to monetization, beginning with subscriptions.", "zh": "虽然我们的近期重点是扩大采用率和扩展 Muse 的覆盖面，但我们看到了多种变现途径，首先是订阅。"}, {"start": 612.18, "end": 616.68, "text": "We also see a significant opportunity to extend Muse to small businesses.", "zh": "我们还看到将 Muse 扩展到小企业的重要机会。"}, {"start": 616.68, "end": 627.06, "text": "Based on a recent user survey, we estimate that at least 500 million self-identified small businesses use Meta's family of apps to reach customers and generate revenue.", "zh": "根据最近的一项用户调查，我们估计至少有 5 亿自认为是小企业的企业使用 Meta 的应用家族来接触客户并创造收入。"}, {"start": 627.06, "end": 634.65, "text": "Muse could help these businesses acquire customers and operate more efficiently while helping people complete transactions.", "zh": "Muse 可以帮助这些企业获得客户并更高效地运营，同时帮助人们完成交易。"}, {"start": 634.65, "end": 643.97, "text": "Over time, consumer and business agents could connect and transact directly, creating opportunities around paid usage, commerce, and business services.", "zh": "随着时间的推移，消费者智能体和企业智能体可以直接连接和交易，创造围绕付费使用、商务和商业服务的机会。"}, {"start": 643.97, "end": 648.42, "text": "Alongside growth, we are focused on building sustainable unit economics.", "zh": "在增长的同时，我们专注于打造可持续的单位经济。"}, {"start": 648.42, "end": 657, "text": "Muse's compute intensity means that expanding its user base will require significant investment, and we expect total serving costs to rise.", "zh": "Muse 的算力强度意味着扩大用户群将需要大量投资，我们预计总服务成本将上升。"}, {"start": 657, "end": 672.42, "text": "Susan Li: At the same time, we expect to improve compute cost efficiency by more than tenfold over the next year, driven by better utilization of off-peak capacity, more efficient models, and inference optimization.", "zh": "Susan Li：与此同时，我们预计明年将算力成本效率提高 10 倍以上，这得益于更好地利用非高峰产能、更高效的模型和推理优化。"}, {"start": 672.42, "end": 681.74, "text": "As revenue scales, these efficiency gains give us confidence in our ability to build a highly profitable business over time.", "zh": "随着收入规模的扩大，这些效率提升让我们有信心长期打造高盈利业务。"}, {"start": 681.74, "end": 684.45, "text": "Moving now to our financial outlook.", "zh": "现在来看我们的财务展望。"}, {"start": 684.45, "end": 691.22, "text": "We expect fourth quarter 2026 total revenue to be in the range of $73 billion-$76 billion.", "zh": "我们预计 2026 年第四季度总收入在 730 亿至 760 亿美元之间。"}, {"start": 691.22, "end": 701.82, "text": "Our guidance assumes foreign currency is an approximately 1% headwind to year-over-year total revenue growth based on current exchange rates.", "zh": "我们的指引假设，按当前汇率计算，外汇对同比总收入增长大约有 1% 的不利影响。"}, {"start": 701.82, "end": 704.98, "text": "Turning to the expense and CapEx outlooks.", "zh": "现在来看费用和资本支出展望。"}, {"start": 704.98, "end": 721, "text": "We are raising our expense outlook to incorporate the $9.9 billion charge related to legal proceedings recognized in Q3. We now expect full year 2026 total expenses to be in the range of $175 billion-$179 billion.", "zh": "我们正在上调费用展望，以纳入第三季度确认的与法律诉讼相关的 99 亿美元费用。现在，我们预计 2026 年全年总费用在 1750 亿至 1790 亿美元之间。"}, {"start": 721, "end": 728.86, "text": "Susan Li: Excluding the Q3 legal charge, we continue to expect 2026 operating income to be above 2025 operating income.", "zh": "Susan Li：剔除第三季度的法律费用，我们仍预计 2026 年运营利润将高于 2025 年。"}, {"start": 728.86, "end": 737.51, "text": "At a segment level, we now expect Reality Labs losses to decline compared to 2025 to a range of $18 billion-$19 billion.", "zh": "在分部层面，我们现在预计 Reality Labs 的亏损较 2025 年有所下降，范围在 180 亿至 190 亿美元之间。"}, {"start": 737.51, "end": 751.86, "text": "We anticipate 2026 capital expenditures, including principal payments on finance leases, to be in the range of $135 billion-$145 billion, narrowed from our prior outlook of $130 billion-$145 billion.", "zh": "我们预计 2026 年资本支出（包括融资租赁本金支付）在 1350 亿至 1450 亿美元之间，较之前 1300 亿至 1450 亿美元的展望有所收窄。"}, {"start": 751.86, "end": 759.79, "text": "Absent any changes to our tax landscape, we expect our fourth quarter 2026 tax rate to be between 15% and 17%.", "zh": "在税法没有变化的情况下，我们预计 2026 年第四季度税率在 15% 至 17% 之间。"}, {"start": 759.79, "end": 769.89, "text": "Additionally, we continue to monitor active legal and regulatory matters that could significantly impact our business and financial results.", "zh": "此外，我们继续关注可能对业务和财务业绩产生重大影响的活跃法律和监管事项。"}, {"start": 769.89, "end": 782, "text": "For example, we continue to see scrutiny on youth-related issues in several markets and have a number of youth-related trials scheduled in the coming months in the U.S.", "zh": "例如，我们继续看到多个市场对青少年相关问题的审查，美国未来几个月还安排了多起与青少年相关的审判。"}, {"start": 782, "end": 793.71, "text": "Susan Li: Looking beyond 2026, we are still developing our budget and capacity plans for next year, but we expect to continue investing aggressively to support both our core business and emerging AI initiatives.", "zh": "Susan Li：展望 2026 年之后，我们仍在制定明年的预算和产能计划，但我们预计将继续大力投资，以支持核心业务和新兴 AI 计划。"}, {"start": 793.71, "end": 805.25, "text": "Our current capacity and what is scheduled to come online gives us the flexibility to allocate resources across model training, core business growth, and the development and support of new products.", "zh": "我们目前的产能以及计划上线的内容使我们能够灵活地在模型训练、核心业务增长以及新产品的开发和支持之间分配资源。"}, {"start": 805.25, "end": 815.22, "text": "Our AI investments are already delivering substantial incremental advertising revenue through stronger engagement, better recommendations, and more efficient monetization.", "zh": "我们的 AI 投资已经通过更强的互动、更好的推荐和更高效的变现带来了可观的增量广告收入。"}, {"start": 815.22, "end": 826.7, "text": "Building on this progress, our MSL investments are creating the technology and infrastructure needed to unlock significant new revenue opportunities and strengthen capabilities across the business.", "zh": "在此进展的基础上，我们的 MSL 投资正在打造解锁重大新收入机会所需的技术和基础设施，并加强整个业务的能力。"}, {"start": 826.7, "end": 839, "text": "While these investments will take longer to generate returns than those in our core business, the breadth of monetization opportunities and internal efficiencies gives us confidence in their long-term potential.", "zh": "虽然这些投资比核心业务需要更长时间才能产生回报，但变现机会的广度和内部效率让我们对它们的长期潜力充满信心。"}, {"start": 839, "end": 863.25, "text": "Susan Li: Looking ahead, although we are not providing a full year 2027 revenue outlook, the benefits our AI investments are delivering to the core business, combined with emerging opportunities from model advances and product launches, position us to sustain strong overall revenue growth throughout 2027. Separately, we remain focused on improving Reality Labs profitability.", "zh": "Susan Li：展望未来，尽管我们没有提供 2027 年全年的收入展望，但我们的 AI 投资给核心业务带来的好处，加上模型进步和产品发布带来的新兴机会，使我们能够在 2027 年全年保持强劲的总体收入增长。另外，我们仍专注于提高 Reality Labs 的盈利能力。"}, {"start": 863.25, "end": 873.1, "text": "As Mark mentioned, we expect losses to narrow next year to around $15 billion as we reallocate investment towards other priority areas, primarily AI.", "zh": "正如 Mark 所说，我们预计明年亏损将收窄至约 150 亿美元左右，因为我们将投资重新分配到其他优先领域，主要是 AI。"}, {"start": 873.1, "end": 884, "text": "Finally, today we announced plans to create a new class of non-voting capital stock, which will be distributed to all existing shareholders through a stock dividend.", "zh": "最后，今天我们宣布了创建新类别无投票权股本的计划，该股本将通过股票股息分配给所有现有股东。"}, {"start": 884, "end": 894.29, "text": "Susan Li: For each existing share held, stockholders will receive one share of the new non-voting stock, effectively resulting in a two-for-one stock split.", "zh": "Susan Li：对于持有的每一股现有股份，股东将获得一股新的无投票权股票，实际上相当于 2 拆 1 的股票分割。"}, {"start": 894.29, "end": 912.98, "text": "We expect trading to begin in late January 2027. In closing, our business momentum continued in Q3 with strong execution across our core ads and engagement initiatives, and we are also excited by our progress towards bringing personal superintelligence to everyone.", "zh": "我们预计交易将于 2027 年 1 月下旬开始。总之，第三季度的业务势头持续，核心广告和互动计划执行强劲，我们也对在向每个人提供个人超级智能方面的进展感到兴奋。"}, {"start": 912.98, "end": 917, "text": "With that, Krista, let us open up the call for questions.", "zh": "就此而言，Krista，让我们开始提问环节吧。"}]}, {"title": "Meta Q3 2026 — Part 3 of 5: Q&A: Nowak and Sheridan", "mp3": "https://billyxiaoli.github.io/us-briefs/meta-q3-2026/section-3/section-3.mp3", "dur": "12:28", "lines": [{"start": 0, "end": 0.6, "text": "Operator: Thank you.", "zh": "Operator：谢谢。"}, {"start": 0.6, "end": 4.27, "text": "We will now open the lines for a question and answer session.", "zh": "现在我们将开放提问环节。"}, {"start": 4.27, "end": 8.23, "text": "To ask a question, please press star one on your touch-tone phone.", "zh": "如需提问，请按按键电话上的星号键加 1。"}, {"start": 8.23, "end": 11.6, "text": "To withdraw your question, you may press star one again.", "zh": "如需撤回问题，可以再次按星号键加 1。"}, {"start": 11.6, "end": 13.88, "text": "Please limit yourself to one question.", "zh": "请只提一个问题。"}, {"start": 13.88, "end": 18.33, "text": "Please pick up your handset before asking your question to ensure clarity.", "zh": "提问前请拿起话筒，以确保清晰。"}, {"start": 18.33, "end": 22.53, "text": "If you are streaming today's call, please mute your computer speakers.", "zh": "如果您正在流式收听今天的电话会议，请将电脑扬声器静音。"}, {"start": 22.53, "end": 27.04, "text": "Your first question comes from the line of Brian Nowak with Morgan Stanley.", "zh": "第一个问题来自摩根士丹利的 Brian Nowak。"}, {"start": 27.04, "end": 28, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 28, "end": 29.8, "text": "Brian Nowak: Thanks for taking my questions.", "zh": "Brian Nowak：感谢接受我的提问。"}, {"start": 29.8, "end": 32.3, "text": "I have two, one on Muse, one on Enterprise.", "zh": "我有两个问题，一个关于 Muse，一个关于企业业务。"}, {"start": 32.3, "end": 35.09, "text": "Maybe at first, congrats on the success of Muse.", "zh": "首先，祝贺 Muse 取得成功。"}, {"start": 35.09, "end": 55.73, "text": "As you analyze the user behavior and the product, can you talk with us a little bit about any of the constraints to the slope of forward user growth that you're most focused on addressing, whether it's capabilities, model efficiency, capacity, et cetera, just so we understand what are the limiting factors to forward user growth that you want to address?", "zh": "在分析用户行为和产品时，您能否谈谈您最关注的、制约未来用户增长斜率的因素，无论是能力、模型效率、算力等等，让我们了解您想解决的、限制未来用户增长的因素？"}, {"start": 55.73, "end": 57.59, "text": "The second one is on enterprise.", "zh": "第二个问题是关于企业业务的。"}, {"start": 57.59, "end": 68, "text": "Mark, can you sort of walk us through your vision for the Meta Enterprise platform offering and the key value drivers you hope to provide for the enterprises adopting the service?", "zh": "Mark，您能否介绍一下您对 Meta 企业平台产品的愿景，以及您希望为采用该服务的企业提供的主要价值驱动因素？"}, {"start": 68, "end": 74.16, "text": "Mark Zuckerberg: Yeah, I think I can talk about both of those, and then Susan can jump in with anything else.", "zh": "Mark Zuckerberg：是的，我想我可以谈谈这两个问题，然后 Susan 可以补充其他内容。"}, {"start": 74.16, "end": 92.99, "text": "Right now for Muse, one of the things I pointed out is we have more than 10 million people in the U.S. and Canada who have set it up, but I think one of the biggest constraints so far is that because this is a compute-intensive service to run, we have not launched it globally yet.", "zh": "现在对于 Muse，我指出的一点是，我们已有超过 1000 万美国和加拿大用户设置了它，但我认为迄今最大的制约因素之一是，由于这是一项算力密集型服务，我们还没有在全球推出它。"}, {"start": 92.99, "end": 100.7, "text": "That's partially because of wanting to optimize it for each place, and there's some workaround connectors for that.", "zh": "部分原因是想为每个地方进行优化，还有一些连接器方面的工作。"}, {"start": 100.7, "end": 105.59, "text": "But it's partially that we want to make sure that we do this efficiently.", "zh": "但部分原因也是我们想确保高效地做到这一点。"}, {"start": 105.59, "end": 108, "text": "I mean, there's pros and cons there.", "zh": "我的意思是，这有利有弊。"}, {"start": 108, "end": 123.94, "text": "Mark Zuckerberg: The pro, of course, is that just makes it even more impressive that you have 10 million people using it and signing up to use it in the first six weeks, because those are all Americans and Canadians in a small number of markets.", "zh": "Mark Zuckerberg：当然，好的一面是，仅仅这一点就更令人印象深刻：头六周就有 1000 万人使用并注册它，因为这些人全部是少数市场中的美国人和加拿大人。"}, {"start": 123.94, "end": 133.37, "text": "If we actually did roll it out more broadly, then you would expect that number to be significantly larger than what we're seeing today.", "zh": "如果我们真的更广泛地推出它，那么这个数字预计会比我们今天看到的要大得多。"}, {"start": 133.37, "end": 140.99, "text": "On the flip side, we actually have to go do the work to bring the efficiency in line to make that make sense.", "zh": "另一方面，我们确实需要去做工作，使效率达到合理水平。"}, {"start": 140.99, "end": 144, "text": "That's a big part of it that we need to do.", "zh": "这是我们需要做的一大部分工作。"}, {"start": 144, "end": 158.83, "text": "Mark Zuckerberg: The compute efficiency work is going to be important on this also because we want to make sure that we've built enough compute to be able to serve what we think is going to be a billion plus people if we can achieve certain compute efficiency targets.", "zh": "Mark Zuckerberg：算力效率工作也很重要，因为我们希望确保我们已经建设了足够的算力，能够服务我们认为的 10 亿以上用户——如果我们能够实现某些算力效率目标的话。"}, {"start": 158.83, "end": 165.86, "text": "But we obviously have a lot of work to do there as well, and that'll be one of the limiting factors over the next year.", "zh": "但显然我们在这方面也有很多工作要做，这将是明年的一个限制因素。"}, {"start": 165.86, "end": 168.46, "text": "We want to build out the business around it.", "zh": "我们希望围绕它打造业务。"}, {"start": 168.46, "end": 182.4, "text": "I mean, I talked about that, and I think doing that in tandem with bringing down the compute or increasing the compute efficiency is going to be important for getting this to work from a business perspective, which I'm optimistic about.", "zh": "我的意思是，我谈过这一点，我认为与降低算力成本或提高算力效率同步推进业务建设，对于从商业角度让这一切行得通很重要，我对此感到乐观。"}, {"start": 182.4, "end": 186, "text": "But I think that that's one of the things that we need to do.", "zh": "但我认为这是我们需要做的事情之一。"}, {"start": 186, "end": 194.34, "text": "Mark Zuckerberg: There's just continuing to increase the value in the product, which I think we will largely do by continuing to develop new models.", "zh": "Mark Zuckerberg：还有就是不断提升产品价值，我认为这在很大程度上将通过不断开发新模型来实现。"}, {"start": 194.34, "end": 202.49, "text": "That's why I mentioned that we launched Muse first on Muse Spark, and that's what is currently the default across the free tier.", "zh": "这就是为什么我说我们首先在 Muse Spark 上推出了 Muse，这也是目前免费版的默认模型。"}, {"start": 202.49, "end": 207.39, "text": "We rolled out Muse Wonder, and people can access that in the paid tier today.", "zh": "我们推出了 Muse Wonder，人们今天可以在付费版中使用它。"}, {"start": 207.39, "end": 217, "text": "We know that it performs a lot better, so we're working on getting a more efficient version of Muse Wonder that we'll be able to roll out more broadly.", "zh": "我们知道它的表现要好得多，所以我们正在努力推出一个更高效的 Muse Wonder 版本，以便更广泛地推广。"}, {"start": 217, "end": 237.61, "text": "Mark Zuckerberg: You can imagine just as we iterate forward and two, three models into the future, when you have significantly higher intelligence and capability to solve many more problems for people and the ability to deliver that at a much more affordable price point, I think that that's going to just unlock a lot more value to people.", "zh": "Mark Zuckerberg：你可以想象，随着我们向前迭代，再经过两三个模型，当智能和能力显著提高、能为人们解决更多问题，并且价格更加实惠时，我认为这将为人们释放更多的价值。"}, {"start": 237.61, "end": 239.71, "text": "So we're very excited about that.", "zh": "所以我们对此非常兴奋。"}, {"start": 239.71, "end": 253.69, "text": "Transitioning to talking about the enterprise piece, because I think that these two pieces, there is some connection here, in that the main enterprise offering in the near term is going to be the model API in Muse Code.", "zh": "转向企业业务部分，因为我认为这两部分之间存在一些联系，近期主要的企业产品将是模型 API 和 Muse Code。"}, {"start": 253.69, "end": 263, "text": "We have business agents that we've been scaling for a while, and each of those three things is growing quite quickly, so we're excited about that.", "zh": "我们已经扩展了一段时间的商务智能体，这三项业务都在快速增长，所以我们对此感到兴奋。"}, {"start": 263, "end": 269.42, "text": "Mark Zuckerberg: Over time, we would like to make it so that we have a whole business network of Muse agents as well.", "zh": "Mark Zuckerberg：随着时间的推移，我们希望能够打造一个完整的 Muse 商务智能体网络。"}, {"start": 269.42, "end": 278.34, "text": "There's the business agent, which we've talked about on previous earnings calls for businesses to help out with sales and customer support.", "zh": "其中有商务智能体，我们在之前的财报电话会议上谈过，它帮助企业进行销售和客户支持。"}, {"start": 278.34, "end": 284.82, "text": "What we see is a lot of people are actually using Muse today to help run especially small businesses.", "zh": "我们看到，实际上很多人今天都在使用 Muse 来帮助经营尤其是小企业。"}, {"start": 284.82, "end": 302.35, "text": "We think that there's both an opportunity to help create an agent that people use to really enable them to automate and do a lot of the parts of spinning up a small business that are just difficult and time-consuming but aren't the core thing that a person is trying to do.", "zh": "我们认为，有机会帮助打造一个智能体，让人们真正能够自动化处理创办小企业过程中许多困难且耗时、但并非一个人真正想做的部分。"}, {"start": 302.35, "end": 304.27, "text": "So we think that's a big deal.", "zh": "所以我们认为这是一件大事。"}, {"start": 304.27, "end": 313, "text": "Making a version of Muse that people can bring into different corporate environments and work there, we think is going to be a big deal.", "zh": "打造一个人们可以带入不同企业环境中工作的 Muse 版本，我们认为也将是一件大事。"}, {"start": 313, "end": 326.45, "text": "Mark Zuckerberg: Beyond that, building what I refer to as the Muse network, which is making it so that Muse is not just a single-player game where you have your Muse, but making it so that your Muses can work with your friends and your families.", "zh": "Mark Zuckerberg：除此之外，打造我所说的 Muse 网络，也就是让 Muse 不仅仅是一个单人游戏——你有你的 Muse——而是让你的 Muse 能与朋友和家人的 Muse 协同工作。"}, {"start": 326.45, "end": 333.0, "text": "If you want to buy something, it's not just navigating to that business's website, it's talking to their agent.", "zh": "如果你想买东西，不只是浏览那家企业的网站，而是与他们的智能体对话。"}, {"start": 333.0, "end": 338.72, "text": "I think that getting that all to work well together is going to unlock tremendous value at scale.", "zh": "我认为，让这一切很好地协同工作，将在规模上释放巨大的价值。"}, {"start": 338.72, "end": 340.97, "text": "So I'm very excited about all of that.", "zh": "所以我对此非常兴奋。"}, {"start": 340.97, "end": 349.64, "text": "I think the enterprise use is going to be a big part of it, but it's also going to have this very valuable boost in the utility for consumers, too.", "zh": "我认为企业用途将是其中很大一部分，但它也会为消费者带来非常有价值的效用提升。"}, {"start": 349.64, "end": 352, "text": "So I'm very excited about both of those.", "zh": "所以我对这两方面都非常兴奋。"}, {"start": 352, "end": 354.66, "text": "Susan Li: I would add to Mark's comments on enterprise.", "zh": "Susan Li：我想补充一下 Mark 关于企业业务的评论。"}, {"start": 354.66, "end": 358.32, "text": "AI is creating huge amounts of disruption in enterprise today.", "zh": "AI 今天正在企业领域造成巨大的颠覆。"}, {"start": 358.32, "end": 364.59, "text": "From what we can see, we really don't believe that traditional enterprise companies have this locked down.", "zh": "从我们看到的情况来看，我们真的不认为传统企业公司已经锁定了这一领域。"}, {"start": 364.59, "end": 369.79, "text": "In fact, some of the leading companies in this space today didn't exist a few years ago.", "zh": "事实上，今天这一领域的一些领先公司几年前还不存在。"}, {"start": 369.79, "end": 383.8, "text": "Those companies made large investments in model development, and we've done the same, and we have increasingly competitive models to bring to bear for the benefit of all of our users, including small businesses and including enterprises.", "zh": "这些公司在模型开发上进行了大量投资，我们也同样如此，我们有越来越有竞争力的模型，可以为所有用户（包括小企业和企业）带来好处。"}, {"start": 383.8, "end": 387.58, "text": "Already today, we have 500 million businesses using our product.", "zh": "今天，我们已经有 5 亿企业在使用我们的产品。"}, {"start": 387.58, "end": 391.66, "text": "We really believe that AI is going to reshape how businesses operate.", "zh": "我们真的相信 AI 将重塑企业的运营方式。"}, {"start": 391.66, "end": 401, "text": "We expect that businesses of all sizes are going to use AI agents across software development and productivity, sales, marketing, customer service, et cetera.", "zh": "我们预计，各种规模的企业都将在软件开发和生产力、销售、营销、客户服务等方面使用 AI 智能体。"}, {"start": 401, "end": 411.29, "text": "Susan Li: We have differentiated assets to serve this market, bringing together models, infrastructure, global distribution, and long-standing relationships with businesses.", "zh": "Susan Li：我们拥有差异化的资产来服务这一市场，汇集了模型、基础设施、全球分发以及与企业的长期关系。"}, {"start": 411.29, "end": 425.88, "text": "It's our hope that this will be able to be a new diversified, recurring revenue stream for us that will be able to support multiple business models, including subscriptions and usage-based API and messaging and other revenue lines.", "zh": "我们希望这能成为一个新的多元化、经常性收入来源，能够支持多种商业模式，包括订阅、基于使用量的 API、消息传递和其他收入来源。"}, {"start": 425.88, "end": 438, "text": "We expect that this will be an opportunity that will develop over multiple years, and we intend to scale our investment behind demonstrated customer demand and product market fit in this area.", "zh": "我们预计这将是一个多年发展的机会，我们打算根据已证明的客户需求和产品市场契合度来扩大投资。"}, {"start": 438, "end": 442.95, "text": "Operator: Your next question comes from the line of Eric Sheridan with Goldman Sachs.", "zh": "Operator：下一个问题来自高盛的 Eric Sheridan。"}, {"start": 442.95, "end": 444, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 444, "end": 446.31, "text": "Eric Sheridan: Thanks so much for taking the questions.", "zh": "Eric Sheridan：非常感谢接受提问。"}, {"start": 446.31, "end": 478, "text": "Maybe just the first one building on Brian's question, when you think about the friction points around agentic commerce, how do you guys as a company think about solving for friction that's rising where there are aggregators or suppliers that don't want agents to interact with their platforms or their services, and how you think about lowering that friction or creating the right balance between the existing services that consumers access today relative to how this might all be changed or altered by agentic behavior over the medium to long term?", "zh": "也许第一个问题是基于 Brian 的问题，当你们思考智能商务的摩擦点时，作为一家公司，你们如何看待解决聚合商或供应商不希望智能体与其平台或服务互动所带来的摩擦，以及你们如何看待降低这种摩擦，或在消费者今天使用的现有服务与未来几年智能行为可能带来的变化之间创造适当的平衡？"}, {"start": 478, "end": 500.03, "text": "Eric Sheridan: And the second one would be with the announcement of the new class of shares tonight with earnings, any updated thoughts broadly about how you think about sources of capital and optimizing your capital structure to make sure you invest the proper amounts to capitalize on the opportunities that AI are presenting in the next couple of years?", "zh": "Eric Sheridan：第二个问题是关于今晚与财报一起宣布的新股类别，关于资本来源和优化资本结构，以确保你们投入适当的资金来把握 AI 在未来几年带来的机会，你们有什么最新的想法？"}, {"start": 500.03, "end": 501, "text": "Thanks so much.", "zh": "非常感谢。"}, {"start": 501, "end": 504.97, "text": "Mark Zuckerberg: I can answer the first one.", "zh": "Mark Zuckerberg：我可以回答第一个问题。"}, {"start": 504.97, "end": 511, "text": "Sorry, what was the first question there?", "zh": "抱歉，第一个问题是什么？"}, {"start": 511, "end": 513, "text": "Susan Li: Friction points around agentic commerce.", "zh": "Susan Li：智能商务的摩擦点。"}, {"start": 513, "end": 513.39, "text": "Mark Zuckerberg: Yeah.", "zh": "Mark Zuckerberg：是的。"}, {"start": 513.39, "end": 513.93, "text": "Got it.", "zh": "明白了。"}, {"start": 513.93, "end": 514.7, "text": "All right.", "zh": "好的。"}, {"start": 514.7, "end": 515.08, "text": "Yeah.", "zh": "是的。"}, {"start": 515.08, "end": 539.02, "text": "So right now what we're seeing is that overwhelmingly businesses are very excited about enabling this because they recognize that it's going to be a new opportunity for them not only to increase the sales and the quality of the experience for existing customers, but also potentially to bring in new customers.", "zh": "所以现在我们看到的是，绝大多数企业都非常热衷于实现这一点，因为他们认识到，这不仅是增加现有客户销售额和体验质量的新机会，也可能带来新客户。"}, {"start": 539.02, "end": 547.36, "text": "So I mean, across the whole business ecosystem, different people will kind of adopt this at different paces.", "zh": "所以我的意思是，在整个商业生态系统中，不同的人会以不同的速度采用。"}, {"start": 547.36, "end": 554.38, "text": "And how our strategy evolves on that to develop the ecosystem will depend on how that goes.", "zh": "我们的战略如何演变以发展生态系统将取决于这一进展。"}, {"start": 554.38, "end": 575, "text": "But overall, I would say we've been very positively surprised by how quickly, I think a huge amount of businesses have wanted to not only figure out how to make it so that Muse can use their services more effectively but have reached out to us to integrate around it.", "zh": "但总体而言，我要说的是，我们对企业希望不仅弄清楚如何让 Muse 更有效地使用他们的服务，而且主动联系我们进行整合的速度感到非常惊喜。"}, {"start": 575, "end": 576.8, "text": "Mark Zuckerberg: I view that as a very good sign.", "zh": "Mark Zuckerberg：我认为这是一个非常好的信号。"}, {"start": 576.8, "end": 579.15, "text": "Not everyone wants to be an early adopter.", "zh": "不是每个人都想成为早期采用者。"}, {"start": 579.15, "end": 579.88, "text": "That is fine.", "zh": "这没关系。"}, {"start": 579.88, "end": 583.42, "text": "We will work with folks on the terms that makes sense for them.", "zh": "我们将按照对他们有意义的条款与他们合作。"}, {"start": 583.42, "end": 592, "text": "I do think that over time this is going to be quite valuable for everyone to make this work well, and I think we are on a good trajectory on that so far.", "zh": "我确实认为，随着时间的推移，让这一切很好地运转对每个人来说都将非常有价值，我认为到目前为止我们走在正确的轨道上。"}, {"start": 592, "end": 606.76, "text": "Susan Li: I would add to that, and I will also answer your second question and just say I think agents are going to be an important part of how reality evolves, and I think everyone is going to have to adapt to what that means, the new age of agentic commerce.", "zh": "Susan Li：我想补充一下，我也将回答你的第二个问题，我想说的是，智能体将成为现实演变的重要组成部分，我认为每个人都必须适应这意味着什么，即智能商务的新时代。"}, {"start": 606.76, "end": 611.6, "text": "We obviously have had a lot of businesses who are very excited to partner with us.", "zh": "显然，我们有很多企业非常热衷于与我们合作。"}, {"start": 611.6, "end": 625.05, "text": "There are also businesses that are understandably focused on protecting customer relationships, and we expect the market I think ultimately to evolve away from agents attempting to navigate every digital experience like a human.", "zh": "也有一些企业可以理解地专注于保护客户关系，我们预计市场最终会演变，不再是智能体像人类一样试图浏览每一种数字体验。"}, {"start": 625.05, "end": 639.99, "text": "I think over the long run, this will move towards more permissioned, structured interactions, and that will include authenticated APIs, approved agent partnerships, or direct communications between a consumer's personal agent and a business's own agent.", "zh": "我认为从长远来看，这将转向更多基于许可的、结构化的互动，包括经过认证的 API、经批准的智能体合作关系，或者消费者个人智能体与企业自有智能体之间的直接沟通。"}, {"start": 639.99, "end": 644, "text": "We are helping establish the standards needed to support that model.", "zh": "我们正在帮助建立支持这种模式所需的标准。"}, {"start": 644, "end": 658.68, "text": "Susan Li: Earlier this month, we previewed the Personal Agent Protocol, an open standard across Muse and Meta Business Agents that we are developing with industry partners like Sierra, Walmart, Stripe, Shopify, et cetera.", "zh": "Susan Li：本月早些时候，我们预览了个人智能体协议，这是一个跨 Muse 和 Meta 商务智能体的开放标准，我们正在与 Sierra、沃尔玛、Stripe、Shopify 等行业伙伴共同开发。"}, {"start": 658.68, "end": 672.39, "text": "The protocol is intended to define how a consumer's personal agent can interact securely and reliably with the business's agent and preserve appropriate controls for both the business and customer.", "zh": "该协议旨在定义消费者的个人智能体如何安全可靠地与企业的智能体互动，并为企业和客户保留适当的控制权。"}, {"start": 672.39, "end": 684.01, "text": "Again, I think adoption will likely be uneven and will take time, and in the near term we expect many experiences will remain AI-assisted rather than fully autonomous.", "zh": "再说一次，我认为采用可能会不均衡，需要时间，近期我们预计许多体验仍将是 AI 辅助的，而不是完全自主的。"}, {"start": 684.01, "end": 697.78, "text": "As trusted integrations develop and agents demonstrate that they can generate incremental value and demand and operate safely, we expect that more and more businesses will be excited to participate.", "zh": "随着可信集成的开发，以及智能体证明它们能够创造增量价值和需求并安全运行，我们预计越来越多的企业会热衷于参与。"}, {"start": 697.78, "end": 703, "text": "Your second question was about the announcement of the new class of shares.", "zh": "你的第二个问题是关于新股类别的公告。"}, {"start": 703, "end": 720.34, "text": "Susan Li: I should say we created this new class of shares with the purpose of creating a publicly traded non-voting stock usable for capital raising, employee compensation, acquisitions, other general corporate purposes while preserving the voting power of existing Class A and B shareholders.", "zh": "Susan Li：我要说的是，我们创建这个新股类别的目的是创建一个可公开交易的无投票权股票，可用于融资、员工薪酬、收购和其他一般公司用途，同时保留现有 A 类和 B 类股东的投票权。"}, {"start": 720.34, "end": 724.43, "text": "We believe the share class will maintain our founder-led structure.", "zh": "我们相信该股类别将维持我们创始人主导的结构。"}, {"start": 724.43, "end": 734.32, "text": "It will expand our funding tools and give us flexibility to invest behind the unprecedented momentum we are seeing across every part of our business driven by AI.", "zh": "它将扩大我们的融资工具，并给我们灵活性，以投资于我们在 AI 驱动的业务各个部分看到的前所未有的势头。"}, {"start": 734.32, "end": 748, "text": "We do not have any specific financing plans to announce at this time, but we thought it was prudent to establish the appropriate capital structure framework to ensure that we have access to a diverse pool of funding sources.", "zh": "我们目前没有具体的融资计划要宣布，但我们认为建立适当的资本结构框架是审慎的，以确保我们能够获得多样化的资金来源。"}]}, {"title": "Meta Q3 2026 — Part 4 of 5: Q&A: Anmuth, Post, Shmulik and Sandler", "mp3": "https://billyxiaoli.github.io/us-briefs/meta-q3-2026/section-4/section-4.mp3", "dur": "14:53", "lines": [{"start": 0, "end": 5.71, "text": "Operator: Your next question comes from the line of Doug Anmuth with J.P. Morgan.", "zh": "Operator：下一个问题来自摩根大通的 Doug Anmuth。"}, {"start": 5.71, "end": 7, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 7, "end": 7.45, "text": "Doug Anmuth: Great.", "zh": "Doug Anmuth：很好。"}, {"start": 7.45, "end": 9.82, "text": "Thanks for taking the questions.", "zh": "感谢接受提问。"}, {"start": 9.82, "end": 10.64, "text": "I have two.", "zh": "我有两个问题。"}, {"start": 10.64, "end": 15.09, "text": "First, just wanted to follow up on your last comment, Susan.", "zh": "首先，我想跟进一下你刚才的评论，Susan。"}, {"start": 15.09, "end": 32.47, "text": "Just around as Muse evolves and more businesses adopt agents, just wanted to get your sense of how things change and shift as you go to more permission-based and agent-to-agent transactions, and what does that really unlock over time.", "zh": "关于随着 Muse 的发展和更多企业采用智能体，你如何看待向更多基于许可的、智能体与智能体之间的交易转变，以及这长期来看真正释放了什么。"}, {"start": 32.47, "end": 62.09, "text": "Then secondly, just on expenses and CapEx, thinking about 2027, I know you're not really there yet, but if I go back to some previous comments, you've talked about maximizing compute in 2026 and 2027 and then having more flexibility in 2028. A year ago, you talked about notably larger dollar increase in 2026 than 2025, and then you've also used growing operating income on an annual basis as well.", "zh": "然后第二个问题是关于费用和资本支出，考虑到 2027 年，我知道你们还没有真正到那一步，但回顾你们之前的评论，你们谈过在 2026 年和 2027 年最大化算力，然后在 2028 年有更大的灵活性。一年前，你们谈过 2026 年比 2025 年有明显更大的美元增长，你们也一直用年度运营利润增长作为衡量标准。"}, {"start": 62.09, "end": 69, "text": "Just curious if there's any of those that you can tie or to help us think about 2027. Thanks.", "zh": "我只是好奇，你们能否把其中任何一点联系起来，或者帮助我们思考 2027 年。谢谢。"}, {"start": 69, "end": 69.8, "text": "Susan Li: Thanks, Doug.", "zh": "Susan Li：谢谢 Doug。"}, {"start": 69.8, "end": 77.05, "text": "So on your first question about how the agentic ecosystem evolves, I wish I could sort of predict that more perfectly.", "zh": "关于你的第一个问题，即智能生态系统如何演变，我希望我能更准确地预测这一点。"}, {"start": 77.05, "end": 81.85, "text": "I think it will take some time, and again, I think it will be a little uneven.", "zh": "我认为这需要一些时间，再说一次，我认为这会有些不均衡。"}, {"start": 81.85, "end": 95.43, "text": "But I definitely think that, when I use Muse today, it's clear that there are a lot of parts of the experience that would be even better if Muse was able to interact more seamlessly with business agents on the other side.", "zh": "但我确实认为，当我今天使用 Muse 时，很明显，如果 Muse 能够与另一边的商务智能体更无缝地互动，体验的许多部分会变得更好。"}, {"start": 95.43, "end": 106, "text": "For example, if Muse has to call a business on my behalf, I think it would be easier for the business if that call was handled by business agents that were representing it.", "zh": "例如，如果 Muse 需要代表我给一家企业打电话，我认为如果这个电话由代表该企业的商务智能体来处理，对企业来说会更容易。"}, {"start": 106, "end": 118.86, "text": "Susan Li: I think also one of the things that is really distinctive about Muse, and one of the things that makes the product experience so great, is the degree of proactivity that it exhibits on my behalf, right?", "zh": "Susan Li：我认为 Muse 的一个非常独特之处，也是让产品体验如此出色的原因之一，就是它代表我表现出的主动性，对吧？"}, {"start": 118.86, "end": 133, "text": "I can give it a task and Muse is going to go execute against that task for me, even as it encounters some obstacles or can't quite find the right thing and needs to chart a new path to helping me look for the thing I want.", "zh": "我可以给它一个任务，Muse 就会去执行这个任务，即使它遇到一些障碍，或者不太能找到正确的东西，需要开辟一条新路径来帮助我寻找我想要的东西。"}, {"start": 133, "end": 166.39, "text": "Susan Li: I think that sort of dimension of proactivity exhibited by either consumer agents or business agents, I think, are going to enable more transactions to happen or more activity to happen broadly than happens today where when more actions are taken, primarily when the latent demand expresses itself versus things where I can have Muse searching for things for me on an ongoing basis, giving me regular updates on things I'm looking for, sending me 10 new books a month.", "zh": "Susan Li：我认为，无论是消费者智能体还是商务智能体表现出的这种主动性，都会让更多的交易发生，或者更广泛的活动发生，相比今天——当更多的行动被采取时，主要是当潜在需求表达出来时，而不是我让 Muse 持续为我搜索东西，定期向我更新我在寻找的东西，每月给我发 10 本新书。"}, {"start": 166.39, "end": 181.23, "text": "Agents should be doing similar things for businesses, and I think that creates sort of opportunities again for a new, more proactive sort of framework for what agent-to-agent interactions look like over time.", "zh": "智能体也应该为企业做类似的事情，我认为这再次为智能体与智能体互动在未来是什么样子创造了一个新的、更主动的框架的机会。"}, {"start": 181.23, "end": 190, "text": "On your second question, which is about 2027, we are quite early in developing our budget and capacity plans for next year.", "zh": "关于你的第二个问题，即 2027 年，我们在制定明年的预算和产能计划方面还处于非常早期的阶段。"}, {"start": 190, "end": 200.83, "text": "Susan Li: We are, I would say, at the point where we are both evaluating a lot of investment proposals that have attractive return profiles over different time horizons.", "zh": "Susan Li：我想说，我们正处于评估许多投资提案的阶段，这些提案在不同时间范围内都有吸引人的回报。"}, {"start": 200.83, "end": 209.69, "text": "We want to figure out how we can fund as many of those as possible within the construct of our overall budget and financial goals.", "zh": "我们希望弄清楚，在整体预算和财务目标的框架内，我们如何能够为尽可能多的提案提供资金。"}, {"start": 209.69, "end": 224, "text": "But it's very dynamic, and it's still pretty early, and so we don't have anything more specific or quantitative to share until we get to the Q4 call, which is typically when we share guidance for the next year.", "zh": "但情况非常动态，而且还很早，所以在第四季度电话会议之前，我们没有什么更具体或量化的内容可以分享，而第四季度电话会议通常是我们分享下一年度指引的时候。"}, {"start": 224, "end": 228.95, "text": "Operator: Your next question comes from the line of Justin Post with Bank of America.", "zh": "Operator：下一个问题来自美国银行的 Justin Post。"}, {"start": 228.95, "end": 230, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 230, "end": 230.92, "text": "Justin Post: Great, thanks.", "zh": "Justin Post：很好，谢谢。"}, {"start": 230.92, "end": 232.76, "text": "One for Mark, one for Susan.", "zh": "一个问题给 Mark，一个给 Susan。"}, {"start": 232.76, "end": 241.45, "text": "Mark, you've got this powerful new model on your hands, and it seems like there is a lot you could do internally besides externally.", "zh": "Mark，你手头有一个强大的新模型，似乎除了外部应用之外，你在内部也可以做很多事情。"}, {"start": 241.45, "end": 246.51, "text": "Specifically to the ad business, you've rearchitected your systems around AI.", "zh": "具体到广告业务，你们已经围绕 AI 重新设计了系统。"}, {"start": 246.51, "end": 250.99, "text": "How much room is there for improvement as you deploy that new model?", "zh": "随着你们部署这个新模型，还有多大的改进空间？"}, {"start": 250.99, "end": 253.09, "text": "How are you thinking about that?", "zh": "你们是如何思考这个问题的？"}, {"start": 253.09, "end": 257.17, "text": "Then for Susan, you mentioned strong revenue growth next year.", "zh": "然后对于 Susan，你提到了明年强劲的收入增长。"}, {"start": 257.17, "end": 264.34, "text": "Just wondering if that's advertising or does that incorporate some incremental AI revenues hitting next year?", "zh": "我
