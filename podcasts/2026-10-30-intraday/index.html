<script>
const LINES=[{"start": 0.0, "end": 6.05, "text": "Welcome to the U.S. Stocks Intraday Brief for Friday, October 30th, 2026. I'm Alex.", "zh": "欢迎收听2026年10月30日星期五美股盘中简报，我是Alex。"}, {"start": 6.05, "end": 12.41, "text": "And I'm Jordan. It's about half past eleven Eastern, two hours into the session, and it's a rough one for tech.", "zh": "我是Jordan。现在美东时间约十一点半，开盘两小时，科技股日子很难过。"}, {"start": 12.41, "end": 17.5, "text": "The headline in one sentence: the AI cash-flow test failed for a second straight day.", "zh": "一句话概括：AI现金流考验连续第二天没通过。"}, {"start": 17.5, "end": 25.78, "text": "After Alphabet's record twelve-point-six percent drop on Thursday, Amazon and Intel reported after the close, and the market's verdict was the same.", "zh": "继Alphabet周四创纪录下跌12.6%之后，亚马逊和英特尔盘后公布财报，市场的结论是一样的。"}, {"start": 25.78, "end": 31.94, "text": "Hundreds of billions in AI spending, with weakening cash generation, is being repriced, not forgiven.", "zh": "数千亿美元的AI支出伴随着现金流走弱，正在被重新定价，而不是被原谅。"}, {"start": 31.94, "end": 39.98, "text": "Let's start with the tape. The Nasdaq is down about two-point-nine percent midday. The QQQ is around 695 dollars.", "zh": "先看盘面。纳指盘中跌约2.9%，QQQ在695美元附近。"}, {"start": 39.98, "end": 48.79, "text": "The S&P 500 ETF, SPY, is down one to one-point-four percent, near 760. The Dow is only down about a third of a percent.", "zh": "标普500 ETF SPY跌1%到1.4%，在760附近。道指只跌约0.3%。"}, {"start": 48.79, "end": 54.26, "text": "Small caps gave back Thursday's gain. The IWM is down about one-point-five percent.", "zh": "小盘股回吐了周四的涨幅，IWM跌约1.5%。"}, {"start": 54.26, "end": 60.67, "text": "And volatility is expanding for real. The VIX jumped about fifteen percent to near 19.8.", "zh": "波动率在真正扩张，VIX跳涨约15%至19.8附近。"}, {"start": 60.67, "end": 71.47, "text": "Thursday's close, for context: the S&P fell zero-point-three percent, the Nasdaq one-point-four, the Dow zero-point-two-five, while the Russell gained one percent.", "zh": "回顾周四收盘：标普跌0.3%，纳指跌1.4%，道指跌0.25%，罗素2000涨1%。"}, {"start": 71.47, "end": 78.38, "text": "Nine of eleven S&P sectors rose Thursday. Only communication services and tech fell. That rotation is fading today.", "zh": "周四11个板块有9个上涨，只有通信服务和科技下跌。今天这种轮动正在消退。"}, {"start": 78.38, "end": 85.66, "text": "On macro: the data was quiet. The employment cost index rose zero-point-eight percent, exactly as forecast.", "zh": "宏观数据方面比较平静：就业成本指数上涨0.8%，与预期完全一致。"}, {"start": 85.66, "end": 96.89, "text": "Chicago PMI came in at 55.3, below the 56.1 expected and the prior 58.8. Still expansion, but a growth miss that added to the selling.", "zh": "芝加哥PMI为55.3，低于预期的56.1和前值58.8。仍在扩张，但增长不及预期，加剧了抛售。"}, {"start": 96.89, "end": 103.85, "text": "The Fed held rates on Wednesday at three-point-seven-five to four percent, ten to two, with two dissenters wanting a hike now.", "zh": "美联储周三按兵不动，利率维持在3.75%至4%，10比2，两位委员主张立即加息。"}, {"start": 103.85, "end": 113.16, "text": "The market now prices roughly a 74 to 80 percent chance of a hike in December. That's the slow-burn backdrop, but earnings are today's trigger.", "zh": "市场目前预计12月加息的概率约为74%到80%。这是缓慢发酵的背景，但今天的触发因素是财报。"}, {"start": 113.16, "end": 118.25, "text": "Two Fed speakers come this afternoon: Daly at noon, Musalem at twelve-thirty Eastern.", "zh": "今天下午还有两位美联储官员讲话：Daly中午12点，Musalem 12点半。"}, {"start": 118.25, "end": 124.85, "text": "Rates are calm. The ten-year yield is near 4.93 percent, the dollar just below 102.", "zh": "利率方面比较平静，十年期收益率在4.93%附近，美元在102下方。"}, {"start": 124.85, "end": 134.98, "text": "Gold is around 4,000 to 4,015 dollars an ounce. Oil is the mover: WTI near 103 and a half dollars, up about one-point-six percent.", "zh": "黄金在每盎司4000至4015美元附近。原油是波动的一方：WTI在103.5美元附近，涨约1.6%。"}, {"start": 134.98, "end": 139.9, "text": "Oil's driver is geopolitical: Houthi attacks on Saudi Arabia lifted crude.", "zh": "油价的驱动因素是地缘政治：胡塞武装袭击沙特推高了原油。"}, {"start": 139.9, "end": 147.62, "text": "One item to flag as unconfirmed: the Wall Street Journal reported a top US commander briefed the President on military options against Iran.", "zh": "需要标注为未确认的一条消息：《华尔街日报》报道称，一位美军高级指挥官向总统汇报了针对伊朗的军事选项。"}, {"start": 147.62, "end": 154.94, "text": "A possible strike as soon as next week, after the midterms, was reported. That is reported speculation, not a confirmed plan.", "zh": "报道称最早可能下周、中期选举后采取行动。这是报道中的推测，不是已确认的计划。"}, {"start": 154.94, "end": 163.03, "text": "Crypto had its own shock. Binance suffered a 6.3 billion dollar heist on Thursday and froze withdrawals, possibly until Sunday.", "zh": "加密货币也有自己的冲击。币安周四遭遇63亿美元被盗，冻结提款，可能持续到周日。"}, {"start": 163.03, "end": 170.64, "text": "Bitcoin is near 78,669 dollars, down about two percent. Coinbase fell almost eight percent.", "zh": "比特币在78669美元附近，跌约2%。Coinbase跌了近8%。"}, {"start": 170.64, "end": 177.05, "text": "Now the sectors. Semiconductors are the worst hit. The SOXX is down 4.8 percent overnight.", "zh": "再看行业。半导体受创最重，SOXX隔夜跌4.8%。"}, {"start": 177.05, "end": 184.08, "text": "Intel warned on weak PC demand, cash burn and capacity bottlenecks, and fell roughly 25 to 29 percent.", "zh": "英特尔警告PC需求疲软、现金消耗和产能瓶颈，跌了约25%到29%。"}, {"start": 184.08, "end": 191.95, "text": "The memory story is remarkable. SanDisk beat and raised, announced an eight-for-one split, and still fell ten-point-five percent.", "zh": "存储的故事很能说明问题。闪迪业绩超预期并上调指引，还宣布了1拆8，股价仍然跌了10.5%。"}, {"start": 191.95, "end": 198.38, "text": "The market is not debating fundamentals today. It is debating whether anyone's AI spend earns a return.", "zh": "市场今天不是在争论基本面，而是在争论任何人的AI支出是否能赚到回报。"}, {"start": 198.38, "end": 205.46, "text": "Microsoft is the exception. Azure grew 48 percent, disclosed for the first time, and free cash flow stayed positive.", "zh": "微软是例外。Azure增长48%，首次披露，自由现金流仍为正。"}, {"start": 205.46, "end": 210.07, "text": "Microsoft is the most resilient big tech name, down only one-point-six percent.", "zh": "微软是大型科技股中最抗跌的，只跌1.6%。"}, {"start": 210.07, "end": 217.44, "text": "Meta's free cash flow turned negative, and it is selling about 35 billion dollars of stock now, with up to 60 billion more to follow.", "zh": "Meta的自由现金流转为负值，正在出售约350亿美元股票，未来还可能再出售600亿美元。"}, {"start": 217.44, "end": 228.41, "text": "Korea is a rout. The KOSPI fell 5.25 percent to 5,626. SK Hynix fell 8.65 percent in Seoul, Samsung 6 percent.", "zh": "韩国市场大跌，KOSPI跌5.25%至5626点。SK海力士在首尔跌8.65%，三星跌6%。"}, {"start": 228.41, "end": 235.49, "text": "Biotech is the relative refuge. Healthcare was the best sector Thursday, and LABU is only down 3.2 percent today.", "zh": "生物科技是相对避风港。医疗保健是周四表现最好的板块，LABU今天只跌3.2%。"}, {"start": 235.49, "end": 244.49, "text": "Now the watchlist, all 24 names. The big movers first. SOXL is down 23.4 percent to about 78 dollars.", "zh": "现在看自选股，全部24只。先看大波动：SOXL跌23.4%至约78美元。"}, {"start": 244.49, "end": 251.93, "text": "KORU is down 15 percent, almost exactly three times the KOSPI drop, as the daily-reset maths dictates.", "zh": "KORU跌15%，几乎正好是KOSPI跌幅的三倍，符合每日重置的数学规律。"}, {"start": 251.93, "end": 262.61, "text": "TECL is down 13.2 percent. TQQQ is down seven to eight percent. UVXY, the vol product, is up 11.9 percent.", "zh": "TECL跌13.2%，TQQQ跌7%到8%，波动率产品UVXY涨11.9%。"}, {"start": 262.61, "end": 268.92, "text": "AMD is down 9.4 percent with no company news. Jefferies reiterated a buy on October 29th.", "zh": "AMD跌9.4%，没有公司消息。Jefferies在10月29日重申买入评级。"}, {"start": 268.92, "end": 276.43, "text": "Micron is down 4.8 percent. Nvidia is down 3.4 percent. Palantir is down 5.1 percent.", "zh": "美光跌4.8%，英伟达跌3.4%，Palantir跌5.1%。"}, {"start": 276.43, "end": 284.71, "text": "Bloom Energy is down 7.8 percent, pulling back after its October 22nd earnings beat. Its focus now is negative operating cash flow.", "zh": "Bloom Energy跌7.8%，在10月22日财报超预期后回落，市场现在关注其经营现金流为负。"}, {"start": 284.71, "end": 294.12, "text": "Alphabet is down about one percent, still digesting Thursday's record fall of 12.6 percent and roughly 500 billion dollars of value lost.", "zh": "Alphabet跌约1%，仍在消化周四创纪录的12.6%跌幅和约5000亿美元市值蒸发。"}, {"start": 294.12, "end": 299.81, "text": "Apple is quiet, down just zero-point-three percent, into earnings Monday after the close.", "zh": "苹果很平静，只跌0.3%，等待周一盘后财报。"}, {"start": 299.81, "end": 304.01, "text": "Tesla is down only zero-point-six percent, holding up well against tech.", "zh": "特斯拉只跌0.6%，相对科技股表现坚挺。"}, {"start": 304.01, "end": 310.97, "text": "AppLovin is down 8.2 percent, after hitting a 52-week low on Thursday. Earnings come November 4th.", "zh": "AppLovin跌8.2%，周四刚创52周新低，财报在11月4日。"}, {"start": 310.97, "end": 318.05, "text": "Walmart is the only real gainer besides UVXY and Moderna, up 1.8 percent on defensive rotation.", "zh": "沃尔玛是除UVXY和Moderna之外唯一真正上涨的股票，涨1.8%，受益于防御性轮动。"}, {"start": 318.05, "end": 324.82, "text": "Moderna is flat. Strategy, the Bitcoin name, is down seven to nine percent despite a record third quarter on paper.", "zh": "Moderna持平。比特币概念股Strategy跌7%到9%，尽管纸面上的三季度业绩创下纪录。"}, {"start": 324.82, "end": 333.05, "text": "Gold miners fell 5.1 percent, roughly twice the gold price move. SpaceX token SPCX is down 3.9 percent.", "zh": "金矿股跌5.1%，约为金价跌幅的两倍。SpaceX代币SPCX跌3.9%。"}, {"start": 333.05, "end": 338.62, "text": "Strategy chapter now, and this is read-only analysis. No trading action has been taken.", "zh": "现在是策略章节，这是只读分析，没有进行任何交易操作。"}, {"start": 338.62, "end": 349.25, "text": "The regime is clear: vol is expanding, and this is not a day to add size into the fade. Premiums are richer because the underlying is falling 7 to 23 percent a day.", "zh": "市场状态很明确：波动率在扩张，今天不是追跌加仓的日子。权利金变贵是因为标的每天跌7%到23%。"}, {"start": 349.25, "end": 357.7, "text": "The playbook rule is sell the rip, not the crash. Any new spread sold into this tape is selling into a trend that has already run two days.", "zh": "手册的规则是卖反弹，不是卖崩盘。在这轮行情中卖出新的价差，是在追一个已经跑了两天的趋势。"}, {"start": 357.7, "end": 367.01, "text": "For KORU, the bear call spread remains the default. No signal to flip to bull puts. That needs an uptrend plus shrinking vol, and today is the opposite.", "zh": "KORU方面，看跌价差仍是默认方向。没有翻转为看涨价差的信号，那需要上升趋势加波动率收缩，而今天正好相反。"}, {"start": 367.01, "end": 375.46, "text": "For LABU, the calmer 3x, the trend still favours put spreads, but no new size before the weekend. Wait for the tape to stabilise.", "zh": "LABU是比较温和的3倍ETF，趋势仍有利于看跌价差，但周末前不要加仓，等盘面企稳。"}, {"start": 375.46, "end": 385.1, "text": "For SOXL, TECL and TQQQ, two down days on a daily-reset 3x product is where compounding does its worst damage.", "zh": "SOXL、TECL和TQQQ方面，每日重置的3倍产品连续两天下跌，正是复利效应伤害最大的时候。"}, {"start": 385.1, "end": 395.14, "text": "And for UVXY, only short-dated bear call spreads, or avoid. Selling vol into a VIX that just inverted its front end, ahead of a weekend, is the wrong side.", "zh": "UVXY只做短期看跌价差或回避。在VIX前端已经倒挂、周末临近时卖波动率，是错误的一边。"}, {"start": 395.14, "end": 401.3, "text": "The calendar: Apple reports Monday after the close. ISM manufacturing is Monday at ten Eastern.", "zh": "日历方面：苹果周一盘后公布财报，ISM制造业指数周一美东时间上午10点。"}, {"start": 401.3, "end": 406.66, "text": "Tuesday is the US midterm election. Friday brings October payrolls at eight-thirty Eastern.", "zh": "周二是美国中期选举，周五上午8点半公布10月非农就业数据。"}, {"start": 406.66, "end": 414.86, "text": "Risk checkpoints into the close: QQQ at 708, the 30-week line. A reclaim reframes the day as a one-sector flush.", "zh": "收盘前的风险点：QQQ的708美元30周均线。如果收复，意味着今天只是一次行业性抛售。"}, {"start": 414.86, "end": 422.3, "text": "VIX at 20: a push through with widening new lows confirms broad selling. And watch the Fed speakers at noon and twelve-thirty.", "zh": "VIX的20关口：如果突破并伴随新低扩大，意味着全面抛售。还要关注中午和12点半的美联储官员讲话。"}, {"start": 422.3, "end": 429.22, "text": "The weekend gap is the unpriceable part: midterms Tuesday, Apple Monday, possible Iran headlines.", "zh": "周末跳空是无法定价的部分：周二中期选举、周一苹果财报、可能的伊朗消息。"}, {"start": 429.22, "end": 436.58, "text": "That's the intraday brief for Friday, October 30th. The full report and podcast links are on the briefs hub. See you at the post-market.", "zh": "这就是10月30日星期五的盘中简报。完整报告和播客链接在简报主页。盘后再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
