<script>
const LINES=[{"start":0.0,"end":6.07,"text":"Welcome to the U.S. Stocks Post-Market Brief, for Wednesday, October 28, 2026. I'm Alex.","zh":"欢迎收听美国股市盘后简报，2026年10月28日星期三。我是 Alex。"},{"start":6.07,"end":14.06,"text":"And I'm Jordan. This is pure market research. No account data, no trading orders, just what happened today and what to watch next.","zh":"我是 Jordan。这是纯市场研究，没有账户数据，没有交易指令，只有今天发生了什么和接下来要关注什么。"},{"start":14.06,"end":18.38,"text":"Here is the headline. Wednesday was a sorting day, not a rally day.","zh":"先说结论。星期三是分化的一天，而不是普涨的一天。"},{"start":18.38,"end":27.46,"text":"The Nasdaq rose about zero point nine five percent, the S and P five hundred added about zero point five eight percent, and the Dow gained about half a percent.","zh":"纳斯达克上涨约0.95%，标普500上涨约0.58%，道琼斯上涨约0.5%。"},{"start":27.46,"end":35.02,"text":"Memory stocks did the heavy lifting, the Fed did exactly what was priced, and then the after-hours tape drew the line the market had been waiting for.","zh":"存储股扛起了大旗，美联储的决定完全符合预期，随后盘后交易划出了市场一直在等的那条线。"},{"start":35.02,"end":42.5,"text":"Microsoft beat on Azure and jumped about five percent after the bell. Alphabet missed on earnings and fell about seven to eight percent.","zh":"微软凭借 Azure 的表现超出预期，盘后上涨约5%。Alphabet 盈利不及预期，盘后下跌约7%至8%。"},{"start":42.5,"end":47.35,"text":"The AI trade is no longer being bought as a basket. It is being graded name by name.","zh":"AI 交易不再是按篮子买入，而是逐只股票打分。"},{"start":47.35,"end":54.19,"text":"Let's start with the Fed. The committee held the federal funds target range unchanged at three point seven five to four percent.","zh":"先说美联储。委员会维持联邦基金目标利率区间不变，为3.75%至4%。"},{"start":54.19,"end":62.42,"text":"The vote was ten to two. Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented, preferring another quarter-point increase.","zh":"投票结果为10比2。理事 Lisa Cook 和克利夫兰联储主席 Beth Hammack 持反对意见，她们倾向于再加息25个基点。"},{"start":62.42,"end":68.66,"text":"Chair Kevin Warsh said politics played no role in the decision, and that the coming period is information-rich.","zh":"主席 Kevin Warsh 表示政治在决策中没有起任何作用，并称未来一段时间信息密集。"},{"start":68.66,"end":73.9,"text":"Traders raised December hike odds to roughly eighty percent, according to CME FedWatch.","zh":"根据 CME FedWatch，交易员把12月加息的概率提高到约80%。"},{"start":73.9,"end":82.13,"text":"Warsh also announced a calendar change. From 2027, one of the Fed's eight annual meetings will be a strategy-only session with no rate vote.","zh":"Warsh 还宣布了一项日程调整。从2027年起，美联储每年八次会议中将有一次只讨论战略，不进行利率表决。"},{"start":82.13,"end":88.13,"text":"A second strategy-only meeting follows in 2028, cutting rate-setting meetings from eight to six per year.","zh":"2028年还将再增加一次纯战略会议，利率决策会议将从每年八次减少到六次。"},{"start":88.13,"end":95.4,"text":"That landed on a day when September inflation printed three point seven percent year over year, well above the Fed's two percent target.","zh":"这一宣布恰逢9月通胀同比录得3.7%，远高于美联储2%的目标。"},{"start":95.4,"end":102.43,"text":"Rates stayed parked near five percent. The ten-year yield spent the day around four point nine nine to five point zero three percent.","zh":"利率维持在5%附近。十年期国债收益率全天在4.99%至5.03%之间波动。"},{"start":102.43,"end":109.39,"text":"The dollar index eased zero point one eight percent to one hundred two point one four, after touching a two-week high in the morning.","zh":"美元指数回落0.18%至102.14，早盘曾触及两周高点。"},{"start":109.39,"end":116.52,"text":"The VIX fell three point four eight percent to sixteen point nine one, as the Fed hold resolved the day's known binary.","zh":"VIX 下跌3.48%至16.91，因为美联储维持利率不变消除了当天已知的变数。"},{"start":116.52,"end":126.77,"text":"Oil stayed elevated. WTI rose about two point nine percent intraday to near one hundred three dollars, after a crude inventory draw of one point nine million barrels.","zh":"油价保持高位。WTI 盘中上涨约2.9%至103美元附近，此前原油库存减少190万桶。"},{"start":126.77,"end":135.05,"text":"One caution here. The Houthi claim of a missile hit on a Saudi refinery is still unconfirmed. Saudi authorities had not confirmed the strike.","zh":"这里要提醒一点。胡塞武装称导弹击中沙特炼油厂的消息仍未得到证实，沙特官方尚未确认此次袭击。"},{"start":135.05,"end":140.45,"text":"Gold held near four thousand seventy dollars, and gold miners rose zero point nine one percent.","zh":"黄金维持在4070美元附近，金矿股上涨0.91%。"},{"start":140.45,"end":148.97,"text":"Now the day's engine: memory. SK Hynix reported a record quarter, with revenue up three hundred twenty-eight percent year over year.","zh":"再说当天的引擎：存储。SK 海力士公布了创纪录的季度业绩，营收同比增长328%。"},{"start":148.97,"end":158.76,"text":"Operating profit jumped about six hundred thirty-one percent, an eighty percent margin, and the company announced about one hundred trillion won of shareholder returns for 2026.","zh":"营业利润跃升约631%，利润率达80%，公司还宣布2026年约100万亿韩元的股东回报计划。"},{"start":158.76,"end":166.92,"text":"Seoul's KOSPI surged six point six three percent through six thousand, and SK Hynix rose ten point eight nine percent in Seoul.","zh":"韩国 KOSPI 指数大涨6.63%，突破6000点，SK 海力士在首尔上涨10.89%。"},{"start":166.92,"end":175.2,"text":"But note the nuance. Net profit missed a FactSet consensus. The operating beat and the net miss are both true, on different lines.","zh":"但要注意一个细节。净利润低于 FactSet 的一致预期。营业利润超预期和净利润不及预期都是事实，只是口径不同。"},{"start":175.2,"end":184.56,"text":"In the U.S., SK Hynix shares jumped thirteen point three percent, Micron rose five point eight six percent, and SanDisk added seven point six six percent.","zh":"在美国，SK 海力士股价上涨13.3%，美光上涨5.86%，闪迪上涨7.66%。"},{"start":184.56,"end":191.81,"text":"That carried the leveraged ETFs. KORU jumped sixteen point one nine percent, and SOXL rose six point two percent.","zh":"这带动了杠杆 ETF。KORU 大涨16.19%，SOXL 上涨6.2%。"},{"start":191.81,"end":201.65,"text":"TECL added two point two eight percent, LABU rose four point nine one percent, and TQQQ was nearly flat, up just zero point zero seven percent.","zh":"TECL 上涨2.28%，LABU 上涨4.91%，TQQQ 几乎持平，仅上涨0.07%。"},{"start":201.65,"end":208.37,"text":"UVXY fell two point nine seven percent, exactly what you expect when the VIX drops after a resolved event.","zh":"UVXY 下跌2.97%，这正是 VIX 在已知变数消除后回落时的典型表现。"},{"start":208.37,"end":214.06,"text":"Nvidia was the exception in chips, falling one point one seven percent while memory names rallied.","zh":"英伟达是芯片股中的例外，在存储股大涨的同时下跌1.17%。"},{"start":214.06,"end":221.33,"text":"AMD rose three point two four percent, helped by the chip bid and headlines about a one-billion-dollar investment in Meta's equity raise.","zh":"AMD 上涨3.24%，受益于芯片板块的买盘，以及向 Meta 股权融资投资10亿美元的消息。"},{"start":221.33,"end":229.49,"text":"Among megacaps, Apple fell zero point nine four percent, Meta fell one point two four percent, and Tesla slipped zero point eight percent.","zh":"大盘科技股方面，苹果下跌0.94%，Meta 下跌1.24%，特斯拉下跌0.8%。"},{"start":229.49,"end":238.01,"text":"Palantir eased zero point nine seven percent, AppLovin fell one point zero eight percent, and Walmart slipped zero point four six percent.","zh":"Palantir 下跌0.97%，AppLovin 下跌1.08%，沃尔玛下跌0.46%。"},{"start":238.01,"end":247.2,"text":"Moderna rose two point nine eight percent with biotech, and Strategy gained two point six six percent even as bitcoin stayed near eighty-one thousand dollars.","zh":"Moderna 随生物科技板块上涨2.98%，Strategy 在比特币维持在81000美元附近时仍上涨2.66%。"},{"start":247.2,"end":255.19,"text":"Now after the bell. Microsoft reported fiscal first-quarter revenue of ninety-two point two eight billion dollars, beating consensus.","zh":"再说盘后。微软公布财年第一季度营收922.8亿美元，超出预期。"},{"start":255.19,"end":261.55,"text":"Adjusted earnings were four dollars eighty-nine cents a share, against a consensus near four dollars seventy-two cents.","zh":"调整后每股收益为4.89美元，而预期约为4.72美元。"},{"start":261.55,"end":270.02,"text":"Azure revenue grew forty-eight percent, well ahead of the forty-four point eight percent estimate, and total Microsoft Cloud revenue rose thirty percent.","zh":"Azure 营收增长48%，远高于44.8%的预期，微软云总营收增长30%。"},{"start":270.02,"end":277.06,"text":"Microsoft shares traded to five hundred fifty-six dollars sixty-six cents in extended trading, up about four point eight percent.","zh":"微软股价在盘后交易中达到556.66美元，上涨约4.8%。"},{"start":277.06,"end":288.17,"text":"Alphabet went the other way. Revenue of one hundred twenty-seven point six billion dollars was slightly below estimates, and earnings of two dollars twelve cents missed a consensus near three dollars.","zh":"Alphabet 则走了相反方向。1276亿美元的营收略低于预期，2.12美元的每股收益远低于约3美元的预期。"},{"start":288.17,"end":296.86,"text":"An eight point seven billion dollar loss on equity securities swung other income negative, and free cash flow was negative nine point one billion dollars.","zh":"87亿美元的股权证券亏损使其他收入转为负值，自由现金流为负91亿美元。"},{"start":296.86,"end":303.86,"text":"Search and YouTube advertising both missed estimates, even as Cloud revenue more than doubled to thirty point seven billion dollars.","zh":"搜索和 YouTube 广告均不及预期，尽管云业务营收翻倍多，达到307亿美元。"},{"start":303.86,"end":312.14,"text":"Alphabet also issued twenty-eight point seven billion dollars in senior notes, sold twelve point four billion dollars of stock, and suspended buybacks for the quarter.","zh":"Alphabet 还发行了287亿美元的高级债券，出售了124亿美元股票，并暂停了当季的回购。"},{"start":312.14,"end":317.9,"text":"Shares fell about seven percent immediately after the print, about eight percent on one after-hours board.","zh":"财报公布后股价立即下跌约7%，在一个盘后报价板上跌幅约为8%。"},{"start":317.9,"end":322.66,"text":"This is only Alphabet's second earnings miss in five years, and the market's message is clear.","zh":"这是 Alphabet 五年来第二次盈利不及预期，市场的信号很明确。"},{"start":322.66,"end":329.81,"text":"Spending is fine when it converts to profit, and punished when it does not. Microsoft showed that, and Alphabet did not.","zh":"支出能转化为利润时受到奖励，不能时受到惩罚。微软做到了，Alphabet 没有。"},{"start":329.81,"end":337.61,"text":"ServiceNow posted its first earnings miss since Zacks began tracking it in 2014, and fell about sixteen percent after hours.","zh":"ServiceNow 出现了自 Zacks 2014年开始追踪以来的首次盈利不及预期，盘后下跌约16%。"},{"start":337.61,"end":344.09,"text":"Fortinet fell nearly twenty-two percent despite a raised forecast. Beats and misses were both sold in software.","zh":"Fortinet 尽管上调了预期仍下跌近22%。在软件板块，超预期和不及预期的股票都被抛售。"},{"start":344.09,"end":350.98,"text":"Now strategy, and remember, this is analysis only. No trading action was taken, and nothing here is an order.","zh":"再说策略，请记住这只是分析。没有进行任何交易操作，这里的内容也不是下单指令。"},{"start":350.98,"end":360.02,"text":"The regime is calm index volatility with violent single-name gaps. That is where short spreads earn on the index side and get hurt on the single-name side.","zh":"当前环境是指数波动率平静，但个股出现剧烈跳空。这正是 short 价差在指数端赚钱、在个股端受伤的环境。"},{"start":360.02,"end":368.98,"text":"KORU's sixteen percent day is both a warning and an opportunity. The playbook default stays bear call spread: sell the rip, not the crash.","zh":"KORU 单日16%的涨幅既是警告也是机会。手册的默认方向仍是 bear call spread：在反弹时卖出，而不是在暴跌后追卖。"},{"start":368.98,"end":377.09,"text":"A day like today is the rip to sell into, with wide wings and far out-of-the-money strikes, and sized for a ten percent day in either direction.","zh":"像今天这样的日子正是可以卖出的反弹，翅膀要宽、行权价要足够虚值，仓位要按双向10%的波动来安排。"},{"start":377.09,"end":385.01,"text":"For LABU, the trend is intact, so put spreads keep the wind at their back, but new spreads into Thursday's data should be smaller than usual.","zh":"LABU 方面趋势完好，put spread 仍顺风，但赶在周四数据前新开的 spread 规模应比平时小。"},{"start":385.01,"end":394.68,"text":"For SOXL, SanDisk reports Thursday after the close, with about eight point three percent implied. A short spread there is an earnings bet, not rent collection.","zh":"SOXL 方面，闪迪周四盘后公布财报，隐含波动约8.3%。在那里做 short spread 是在赌财报，而不是收租。"},{"start":394.68,"end":403.63,"text":"For UVXY, the easy vol compression is already banked. Do not chase short vol into Thursday's data, which can re-inflate volatility fast.","zh":"UVXY 方面，轻松的波动率压缩行情已经被市场消化。不要在周四数据前追逐 short 波动率，数据可能迅速推高波动率。"},{"start":403.63,"end":412.58,"text":"And for Microsoft and Alphabet, the after-hours gaps reprice both names overnight. Spreads struck off Wednesday's closes are stale by Thursday's open.","zh":"微软和 Alphabet 方面，盘后跳空会在一夜之间重定两只股票的波动率。按周三收盘价设置的 spread 到周四开盘时已经过时。"},{"start":412.58,"end":421.34,"text":"Thursday is the other half of the exam. At eight thirty Eastern, we get third-quarter GDP, September PCE inflation, and jobless claims.","zh":"周四是考试的另一半。美东时间8点30分将公布第三季度 GDP、9月 PCE 通胀和初请失业金人数。"},{"start":421.34,"end":430.75,"text":"Before the open, Eli Lilly, Mastercard, Merck and Caterpillar report. After the close, Amazon, Intel, SanDisk and Gilead report.","zh":"开盘前，礼来、万事达、默克和卡特彼勒公布财报。收盘后，亚马逊、英特尔、闪迪和吉利德公布财报。"},{"start":430.75,"end":438.43,"text":"Friday brings the Bank of Japan decision, ExxonMobil and Chevron before the open, the Employment Cost Index, and Chicago PMI.","zh":"周五将有日本央行决议、开盘前埃克森美孚和雪佛龙的财报、就业成本指数和芝加哥 PMI。"},{"start":438.43,"end":449.76,"text":"One more flag. Some vendor prices disagree by more than a point on names like Palantir, AMD and Apple, and one EOD table mixes after-hours prices into its regular closes.","zh":"再提醒一点。部分数据商在 Palantir、AMD、苹果等股票的价格上相差超过1个百分点，还有一张收盘表把盘后价混进了常规收盘价。"},{"start":449.76,"end":455.81,"text":"We anchored regular closes to Finnhub and named the disagreements in the report, rather than smoothing them over.","zh":"我们以 Finnhub 作为常规收盘价的基准，并在报告中列出了这些分歧，而不是把它们抹平。"},{"start":455.81,"end":463.66,"text":"Also unconfirmed: the reported OpenAI plan to buy Google TPUs, and the claimed refinery strike behind part of the oil premium.","zh":"另外仍未证实的消息包括：据报道 OpenAI 计划购买谷歌 TPU，以及导致部分油价溢价的所谓炼油厂遇袭说法。"},{"start":463.66,"end":470.9,"text":"Bottom line: keep spreads wide, strikes far, and size for a post-earnings gap, not for this morning's memory bounce.","zh":"总结：保持宽翅膀、远行权价，仓位要按财报后跳空来安排，而不是按今天早上的存储股反弹来安排。"},{"start":470.9,"end":478.75,"text":"That is the post-market brief for October 28, 2026. Read-only, no trades placed. See you at the pre-market brief.","zh":"这就是2026年10月28日的盘后简报。只读分析，没有下单。盘前简报再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
