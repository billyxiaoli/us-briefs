<script>
const LINES=[{"start": 0.0, "end": 6.79, "text": "Welcome to the U.S. Stocks Post-Market Brief, for Tuesday, October 27, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘后简报，2026年10月27日星期二。我是Alex。"}, {"start": 6.79, "end": 17.06, "text": "And I'm Jordan. This is the post-market edition, recorded after the close, and it is pure market research. No account data, no trading orders, just what happened and what to watch.", "zh": "我是Jordan。这是盘后版，收盘后录制，纯市场研究。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 17.06, "end": 21.7, "text": "Tuesday was a second straight risk-on day, led by chips, memory, and Korea.", "zh": "星期二是连续第二个风险偏好回升的日子，由芯片、存储和韩国市场领涨。"}, {"start": 21.7, "end": 23.9, "text": "How did the headline indexes close?", "zh": "主要指数收盘如何？"}, {"start": 23.9, "end": 44.42, "text": "The S&P 500 rose 0.60% to 7,722.60. The Nasdaq Composite rose 1.18% to 26,477.81, and the Russell 2000 rose 1.16% to 2,818.87.", "zh": "标普500上涨0.60%，至7722.60点。纳斯达克综合指数上涨1.18%，至26477.81点，罗素2000上涨1.16%，至2818.87点。"}, {"start": 44.42, "end": 45.43, "text": "And the Dow?", "zh": "道指呢？"}, {"start": 45.43, "end": 53.88, "text": "The Dow was essentially flat, up just 0.03% to 52,377.57, dragged down by Boeing.", "zh": "道指基本持平，仅上涨0.03%，至52377.57点，受到波音拖累。"}, {"start": 53.88, "end": 55.01, "text": "Why Boeing?", "zh": "波音怎么了？"}, {"start": 55.01, "end": 64.97, "text": "Boeing fell 10.69% to about 168 dollars, on a third-quarter loss and a 737 Max delivery shortfall. It was the main Dow drag.", "zh": "波音下跌10.69%，至约168美元，原因是三季度亏损和737 Max交付不足。它是道指的主要拖累。"}, {"start": 64.97, "end": 79.85, "text": "The ETF tape told the same story. SPY rose 0.58% to 769 dollars and 71 cents, and QQQ rose 1.27% to 721 dollars and 25 cents.", "zh": "ETF方面也一样。SPY上涨0.58%，至769.71美元，QQQ上涨1.27%，至721.25美元。"}, {"start": 79.85, "end": 81.72, "text": "Volatility came down too?", "zh": "波动率也下来了？"}, {"start": 81.72, "end": 91.51, "text": "Yes. The VIX fell 4.73% to 17.52. That is calmer, but Wednesday's event wall means it is not a low-risk calm.", "zh": "是的。VIX下跌4.73%，至17.52。虽然更平静，但周三的事件墙意味着这不是低风险的平静。"}, {"start": 91.51, "end": 94.63, "text": "What about rates, oil, gold, and Bitcoin?", "zh": "利率、油价、黄金和比特币呢？"}, {"start": 94.63, "end": 107.35, "text": "The 10-year yield held just under 5.00%, essentially flat. WTI crude fell about 1.4 to 1.9% to around 100 dollars and 30 cents, a second down day.", "zh": "10年期收益率基本持平，略低于5.00%。WTI原油下跌约1.4%至1.9%，至约100.30美元，连续第二天下跌。"}, {"start": 107.35, "end": 118.22, "text": "Gold futures rose about 0.9% to roughly 4,075 dollars an ounce, and Bitcoin recovered to about 80,600 dollars, up around 1%.", "zh": "黄金期货上涨约0.9%，至约4075美元一盎司，比特币回升至约80600美元，上涨约1%。"}, {"start": 118.22, "end": 120.43, "text": "But breadth was narrow, right?", "zh": "但市场广度很窄，对吧？"}, {"start": 120.43, "end": 136.63, "text": "Right. Only 5 of 11 S&P sectors rose at the close, and the equal-weight S&P rose just 0.11%, far behind the cap-weighted 0.56%. This was a selective, large-cap-led rally, not a broad melt-up.", "zh": "没错。收盘时标普11个板块中只有5个上涨，等权重标普仅上涨0.11%，远落后于市值加权指数的0.56%。这是选择性的大盘股领涨，不是全面上涨。"}, {"start": 136.63, "end": 138.14, "text": "What did the morning data show?", "zh": "上午的数据如何？"}, {"start": 138.14, "end": 148.34, "text": "September durable goods orders rose 1.8%, above expectations, and October consumer confidence jumped to 91.7, well above the roughly 81 expected.", "zh": "9月耐用品订单增长1.8%，高于预期，10月消费者信心指数跳升至91.7，远高于预期的约81。"}, {"start": 148.34, "end": 162.26, "text": "New-home sales edged down to a 676,000 annual pace, and a 5-year Treasury auction cleared at 4.845%, well below last month's 5.033%. That helped rates stay put.", "zh": "新屋销售小幅回落至年化67.6万套，5年期国债拍卖收益率为4.845%，远低于上月的5.033%。这帮助利率保持稳定。"}, {"start": 162.26, "end": 163.3, "text": "And the Fed?", "zh": "美联储呢？"}, {"start": 163.3, "end": 179.93, "text": "The FOMC meets October 27 to 28. The decision lands Wednesday at 2 p.m. Eastern, with Chair Warsh speaking at 2:30. A hold at 3.75 to 4.00% is widely expected, around 90%.", "zh": "联邦公开市场委员会10月27日至28日开会。决议将于周三东部时间下午2点公布，Warsh主席2点半讲话。市场普遍预计维持3.75%至4.00%不变，概率约90%。"}, {"start": 179.93, "end": 185.21, "text": "There is no dot plot at this meeting, and there were no Fed speakers on Tuesday. It is a blackout period.", "zh": "这次会议没有点阵图，周二也没有美联储官员讲话，正处于静默期。"}, {"start": 185.21, "end": 188.21, "text": "So what actually drove the day, if not the data?", "zh": "那么真正推动当天行情的是什么，如果不是数据？"}, {"start": 188.21, "end": 203.4, "text": "The Anthropic IPO filing. Its October 26 S-1 showed first-half revenue of 16.29 billion dollars, versus 1.16 billion a year earlier, and a narrowed operating loss of about 693 million dollars.", "zh": "是Anthropic的IPO申请。它10月26日的S-1文件显示，上半年营收162.9亿美元，而一年前是11.6亿美元，经营亏损收窄至约6.93亿美元。"}, {"start": 203.4, "end": 209.76, "text": "That filing repriced the whole AI funding chain for a second day: enablers up, funders down.", "zh": "这份文件连续第二天重估了整个AI资金链：赋能者上涨，出资者下跌。"}, {"start": 209.76, "end": 211.68, "text": "How did semis and memory do?", "zh": "半导体和存储股表现如何？"}, {"start": 211.68, "end": 224.33, "text": "The SOXX semiconductor index rose almost 4%, and the Roundhill Memory ETF rose about 4.5%. Western Digital rose 6.9%, and SanDisk rose 3.9%.", "zh": "SOXX半导体指数上涨近4%，Roundhill存储ETF上涨约4.5%。西部数据上涨6.9%，闪迪上涨3.9%。"}, {"start": 224.33, "end": 238.42, "text": "BofA sees tight memory supply into 2027 and 2028, with 3- to 5-year customer deals. But remember the counterpoint: memory names are still down 22 to 44% since July, despite strong earnings.", "zh": "美银认为存储供应在2027至2028年仍紧张，客户签约3至5年。但别忘了反面：尽管业绩强劲，存储股自7月以来仍下跌22%至44%。"}, {"start": 238.42, "end": 240.53, "text": "What about the AI compute deals?", "zh": "AI算力交易呢？"}, {"start": 240.53, "end": 253.73, "text": "Broadcom rose 4.04%. BofA, Blackstone, Citi, and Morgan Stanley announced a 63 billion dollar transaction for Broadcom computing capacity for Anthropic, with deliveries from 2027.", "zh": "博通上涨4.04%。美银、黑石、花旗和摩根士丹利宣布了一笔630亿美元的交易，为Anthropic提供博通算力，2027年起交付。"}, {"start": 253.73, "end": 264.22, "text": "Oracle rose about 3.6% on an expanded chip-supply deal with Nvidia, and CoreWeave rose 7.9% and Nebius rose 11.2%.", "zh": "甲骨文因与英伟达扩大的芯片供应协议上涨约3.6%，CoreWeave上涨7.9%，Nebius上涨11.2%。"}, {"start": 264.22, "end": 265.25, "text": "And Korea?", "zh": "韩国呢？"}, {"start": 265.25, "end": 280.78, "text": "The KOSPI closed up 3.1% at 5,638, after opening so strongly that the exchange briefly paused program trading. Samsung rose 4.23% in Seoul, and SK hynix rose 5.18%.", "zh": "韩国综合指数收涨3.1%，至5638点，开盘强劲到交易所一度暂停程序化交易。三星在首尔上涨4.23%，SK海力士上涨5.18%。"}, {"start": 280.78, "end": 283.34, "text": "How did the watchlist's leveraged funds do?", "zh": "自选股里的杠杆基金表现如何？"}, {"start": 283.34, "end": 301.1, "text": "SOXL, the 3x semiconductor fund, jumped 11.69% to 101 dollars and 8 cents. But it is still down 33.26% over the past month, and below its 20-day average near 125 dollars. A rebound inside a downtrend.", "zh": "3倍半导体基金SOXL大涨11.69%，至101.08美元。但过去一个月仍下跌33.26%，且低于20日均线约125美元。这是在下跌趋势中的反弹。"}, {"start": 301.1, "end": 314.5, "text": "KORU, the 3x Korea fund, rose 8.91% to 11 dollars and 86 cents, but it is still down 45.07% over the past month. Violent rebound, damaged trend.", "zh": "3倍韩国基金KORU上涨8.91%，至11.86美元，但过去一个月仍下跌45.07%。反弹剧烈，趋势仍受损。"}, {"start": 314.5, "end": 331.1, "text": "LABU, the 3x biotech fund, rose 8.39% to 242 dollars and 25 cents, its best 5-day momentum in the group. TECL rose 4.94%, and TQQQ rose 3.81%.", "zh": "3倍生物科技基金LABU上涨8.39%，至242.25美元，5日动量为组内最强。TECL上涨4.94%，TQQQ上涨3.81%。"}, {"start": 331.1, "end": 343.27, "text": "The volatility fund UVXY fell just 1.27% to 17 dollars and 86 cents, a small move versus the VIX drop, which reflects futures-term structure, not a 3x spot move.", "zh": "波动率基金UVXY仅下跌1.27%，至17.86美元，相比VIX的跌幅很小，这反映的是期货期限结构，不是3倍现货变动。"}, {"start": 343.27, "end": 345.79, "text": "Single names next. Who stood out?", "zh": "接下来是个股。谁表现突出？"}, {"start": 345.79, "end": 357.31, "text": "AMD rose 5.45% to 560 dollars and 26 cents, on its expanded partnership to power Meta's superintelligence infrastructure. It was the busiest chip stock by volume.", "zh": "AMD上涨5.45%，至560.26美元，因其扩大了为Meta超级智能基础设施提供动力的合作。它是成交量最大的芯片股。"}, {"start": 357.31, "end": 368.52, "text": "Bloom Energy rose 7.15% to 218 dollars and 50 cents, on AI data-center power demand, after Barclays raised its target to 316 dollars.", "zh": "Bloom Energy上涨7.15%，至218.50美元，受AI数据中心电力需求推动，此前巴克莱将其目标价上调至316美元。"}, {"start": 368.52, "end": 387.31, "text": "Tesla rose 4.04% to 407 dollars and 43 cents, a second straight strong day. Micron rose 2.77% to 928 dollars and 76 cents, and SanDisk rose 3.92% to 1,304 dollars and 84 cents.", "zh": "特斯拉上涨4.04%，至407.43美元，连续第二个强劲日。美光上涨2.77%，至928.76美元，闪迪上涨3.92%，至1304.84美元。"}, {"start": 387.31, "end": 401.4, "text": "Nvidia rose just 0.90% to 217 dollars and 94 cents, even as it put 3 billion dollars into Meta's offering. Apple rose 0.93%, and Alphabet's Class C shares rose 0.84%.", "zh": "英伟达仅上涨0.90%，至217.94美元，尽管它向Meta的增发投入了30亿美元。苹果上涨0.93%，Alphabet的C类股上涨0.84%。"}, {"start": 401.4, "end": 402.36, "text": "Who fell?", "zh": "谁下跌了？"}, {"start": 402.36, "end": 418.49, "text": "Meta fell 1.65% to 620 dollars and 13 cents, a second down day on its upsized 95 to 97.5 billion dollar equity raise for AI. Microsoft was flat, down 0.24% into Wednesday's earnings.", "zh": "Meta下跌1.65%，至620.13美元，因其为AI增发的规模扩大至950至975亿美元，连续第二天下跌。微软基本持平，下跌0.24%，等待周三财报。"}, {"start": 418.49, "end": 436.13, "text": "Palantir was essentially flat, down 0.06%, lagging the tech rally, and Walmart fell 0.81%. AppLovin rose just 0.80%, near its 52-week low.", "zh": "Palantir基本持平，下跌0.06%，跑输科技股涨势，沃尔玛下跌0.81%。AppLovin仅上涨0.80%，接近52周低点。"}, {"start": 436.13, "end": 438.46, "text": "Moderna had a wild day, I heard.", "zh": "听说Moderna当天波动很大。"}, {"start": 438.46, "end": 454.54, "text": "Yes, and this is a flagged divergence. Moderna fell about 3% in the morning on a William Blair downgrade, then closed up 4.59% at 207 dollars and 97 cents, after trading as low as 179 dollars and 53 cents.", "zh": "是的，这是一个标记的分化。Moderna上午因William Blair下调评级下跌约3%，随后收涨4.59%，至207.97美元，盘中最低曾到179.53美元。"}, {"start": 454.54, "end": 469.73, "text": "SK hynix's U.S. listing rose 1.92% to 145 dollars and 36 cents. Its reported special dividend of around 12 billion dollars is UNCONFIRMED. The company says it is reviewing options, and it reports on Wednesday in Korea.", "zh": "SK海力士美股上涨1.92%，至145.36美元。据传约120亿美元的特别股息尚未确认。公司表示正在评估方案，并将于周三在韩国公布财报。"}, {"start": 469.73, "end": 471.82, "text": "After hours, anything notable?", "zh": "盘后有什么值得注意的？"}, {"start": 471.82, "end": 484.42, "text": "Visa beat expectations: adjusted earnings of 3 dollars and 48 cents a share, versus 3 dollars and 44 cents expected, and revenue of 12.14 billion dollars, up 13%.", "zh": "Visa超出预期：调整后每股收益3.48美元，而预期为3.44美元，营收121.4亿美元，增长13%。"}, {"start": 484.42, "end": 496.85, "text": "But Visa shares still fell 1.1 to 1.8% after hours, on slower fiscal 2027 earnings guidance. Microsoft rose 0.36% after hours, and SK hynix was flat.", "zh": "但Visa盘后仍下跌1.1%至1.8%，因2027财年盈利指引放缓。微软盘后上涨0.36%，SK海力士持平。"}, {"start": 496.85, "end": 502.06, "text": "Now the strategy part. This brief is read-only, but what posture does it describe?", "zh": "现在说策略部分。这份简报是只读的，但它描述了什么姿态？"}, {"start": 502.06, "end": 516.1, "text": "Spreads only, never naked. Fourteen to 30 days to expiry, far strikes, wide wings, and small size. Take profit at 50 to 70% of the credit, and keep any single trade's maximum loss to 1 to 2%.", "zh": "只做价差，绝不裸卖。14至30天到期，远离行权价，宽翼，小仓位。止盈在权利金的50%至70%，单笔最大亏损控制在1%至2%。"}, {"start": 516.1, "end": 526.42, "text": "The playbook default for KORU remains a bear call spread, given its very high volatility and overnight gap risk. Selling after the event wall is cleaner than chasing Tuesday's rip.", "zh": "根据策略手册，KORU的默认策略仍是熊市看涨价差，因为其波动率非常高且有隔夜跳空风险。等事件墙过去再卖，比追逐周二的涨势更干净。"}, {"start": 526.42, "end": 542.3, "text": "Why the extra caution? Because single-name gap risk is the binding constraint this week, not index direction. Microsoft and Alphabet report after Wednesday's close, and their historical day-after moves average 4.2 and 4.3%, either direction.", "zh": "为什么要格外谨慎？因为本周的约束是单只股票的跳空风险，而不是指数方向。微软和Alphabet将于周三收盘后公布财报，历史上它们财报次日的平均波动分别为4.2%和4.3%，方向不定。"}, {"start": 542.3, "end": 556.27, "text": "Thursday adds third-quarter GDP and September PCE inflation at 8:30 a.m. Eastern, plus Amazon and SanDisk earnings after the close. Friday brings the Bank of Japan decision and the October 30 options expiry.", "zh": "周四还有三季度GDP和9月PCE通胀（东部时间上午8点半），以及亚马逊和闪迪收盘后财报。周五有日本央行决议和10月30日期权到期。"}, {"start": 556.27, "end": 558.96, "text": "So, to recap Tuesday in one sentence?", "zh": "那么，用一句话总结周二？"}, {"start": 558.96, "end": 568.13, "text": "An AI funding boom revived chips, memory, and Korea for a second day, while a narrow tape and a binary Wednesday will decide whether the rebound holds.", "zh": "AI融资热潮连续第二天提振了芯片、存储和韩国市场，而狭窄的市场广度和二元化的周三将决定反弹能否持续。"}, {"start": 568.13, "end": 574.08, "text": "Thanks for listening. This was a market research summary only, not investment advice, and not a trade recommendation.", "zh": "谢谢收听。这只是市场研究总结，不是投资建议，也不是交易推荐。"}, {"start": 574.08, "end": 582.84, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "对于只有券商才能确认的事情，比如持仓、到期、行权或保证金，请查看你的券商App。我们下期简报再见。"}, {"start": 582.84, "end": 583.85, "text": "See you then.", "zh": "再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
