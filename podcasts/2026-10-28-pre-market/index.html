<script>
const LINES=[{"start": 0.0, "end": 6.6, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Wednesday, October 28, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘前简报，2026年10月28日星期三。我是 Alex。"}, {"start": 6.6, "end": 14.95, "text": "And I'm Jordan. This is pure market research, recorded before the open. No account data, no trading orders, just what is happening and what to watch.", "zh": "我是 Jordan。这是纯市场研究，开盘前录制。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 14.95, "end": 23.3, "text": "Here is the headline. Wednesday is the hinge day of the week, and the tape knows it: futures are mixed, memory is on fire, and everything else is waiting.", "zh": "先说头条。周三是本周的转折日，盘面也清楚这一点：期货涨跌互现，存储股火热，其他一切都在等待。"}, {"start": 23.3, "end": 26.74, "text": "Tuesday was a strong day. How strong, exactly?", "zh": "周二表现强劲。具体有多强？"}, {"start": 26.74, "end": 37.85, "text": "The S and P 500 rose zero point six percent to seven thousand seven hundred twenty-two, and the Nasdaq jumped one point one eight percent to twenty-six thousand four hundred seventy-seven.", "zh": "标普500上涨0.6%，收于7722点；纳斯达克上涨1.18%，收于26477点。"}, {"start": 37.85, "end": 46.2, "text": "And the Dow barely moved, up just zero point zero three percent, because Boeing fell about eleven percent after a bigger than expected quarterly loss.", "zh": "道指仅微涨0.03%，因为波音在季度亏损超预期后跌了约11%。"}, {"start": 46.2, "end": 55.97, "text": "Mixed. Dow futures are down about zero point two percent, S and P futures up about zero point one percent, and Nasdaq futures up about zero point four percent.", "zh": "涨跌互现。道指期货跌约0.2%，标普期货涨约0.1%，纳指期货涨约0.4%。"}, {"start": 55.97, "end": 62.74, "text": "That is hesitation before the Fed, not a directional break. And Asia gave the bulls a big overnight gift.", "zh": "这是在美联储决议前的犹豫，不是方向性突破。而亚洲隔夜给多头送了一份大礼。"}, {"start": 62.74, "end": 71.21, "text": "South Korea's KOSPI surged six point six three percent to six thousand twelve, back above six thousand for the first time since October fourteenth.", "zh": "韩国KOSPI大涨6.63%，收于6012点，为10月14日以来首次重回6000点上方。"}, {"start": 71.21, "end": 76.37, "text": "The driver was SK Hynix, and the numbers are extraordinary. What did it report?", "zh": "推动力是SK海力士，数字非常惊人。它公布了什么？"}, {"start": 76.37, "end": 89.57, "text": "Record third quarter revenue of one hundred four point six trillion won, up more than three hundred percent from a year earlier, and operating profit of eighty-three point three trillion won, up more than seven times.", "zh": "创纪录的三季度营收104.6万亿韩元，同比增长超300%；营业利润83.3万亿韩元，增长超7倍。"}, {"start": 89.57, "end": 97.49, "text": "That is roughly an eighty percent operating margin, driven by AI demand for high end memory chips. But we have to flag a split in the story.", "zh": "这相当于约80%的营业利润率，由AI高端存储需求驱动。但我们必须指出故事里的分歧。"}, {"start": 97.49, "end": 112.13, "text": "Yes. Operating profit beat expectations, but net profit of thirty-nine point eight trillion won missed the FactSet consensus of about sixty-one trillion. So headlines saying beat and headlines saying miss are both true, on different lines.", "zh": "是的。营业利润超预期，但39.8万亿韩元的净利润低于约61.4万亿韩元的FactSet预期。所以说超预期和说不及预期的标题都对，只是针对不同项目。"}, {"start": 112.13, "end": 122.52, "text": "SK Hynix also announced about one hundred trillion won in 2026 shareholder returns, including dividends and buybacks, with a special dividend linked to its Kioxia gain.", "zh": "SK海力士还宣布约100万亿韩元的2026年股东回报，包括分红和回购，其中有与铠侠收益相关的特别分红。"}, {"start": 122.52, "end": 132.05, "text": "And it said HBM4 shipments and revenue will pass HBM3E in the fourth quarter, and that it expects demand to exceed memory supply through twenty thirty.", "zh": "它还表示HBM4的出货和收入将在四季度超过HBM3E，并预计需求超过存储供给的局面将持续到2030年。"}, {"start": 132.05, "end": 134.81, "text": "How did U.S. memory stocks react before the open?", "zh": "美国存储股盘前如何反应？"}, {"start": 134.81, "end": 148.61, "text": "Strongly. SK Hynix's U.S. listing was up about eight point four percent, Micron up about three point six percent, SanDisk up about four point nine percent, and the semiconductor triple leveraged fund SOXL up about three percent.", "zh": "反应强烈。SK海力士美股盘前涨约8.4%，美光涨约3.6%，闪迪涨约4.9%，半导体三倍做多基金SOXL涨约3%。"}, {"start": 148.61, "end": 157.49, "text": "And the Korea triple leveraged fund, KORU, was the wildest of all, up about twelve point four percent pre-market after closing Tuesday up almost nine percent.", "zh": "而韩国三倍做多基金KORU最为剧烈，盘前涨约12.4%，此前周二已涨近9%。"}, {"start": 157.49, "end": 169.61, "text": "Remember the context, though. KORU had fallen about twenty-three percent over the prior seven days before this bounce. A product that gaps this hard in both directions is a gap regime, not a trend.", "zh": "不过别忘了背景。KORU在此轮反弹前7天跌了约23%。这样双向大幅跳空的产品处于跳空格局，而不是趋势。"}, {"start": 169.61, "end": 176.86, "text": "Now to the main event. The Federal Reserve decides at two p.m. Eastern today, with Chair Warsh speaking at two thirty.", "zh": "现在说主角。美联储今天美东时间下午2点公布决议，主席Warsh在2点半讲话。"}, {"start": 176.86, "end": 186.05, "text": "A hold is overwhelmingly expected, with about ninety to ninety-four percent priced, keeping the target range at three point seven five to four percent.", "zh": "维持利率不变几乎已成定局，定价概率约90%至94%，目标区间维持在3.75%至4%。"}, {"start": 186.05, "end": 194.4, "text": "So the real question is December, where a further hike is priced at roughly eighty to eighty-three percent, and what Warsh's tone signals about it.", "zh": "所以真正的问题是12月，进一步加息的定价概率约80%至83%，以及Warsh的措辞对此释放什么信号。"}, {"start": 194.4, "end": 205.73, "text": "This is a meeting without new projections, so his words and any dissents carry the signal. September's data frame the dilemma: inflation at three point seven percent, but only twenty-nine thousand jobs added.", "zh": "这次会议没有新的预测，所以他的措辞和任何异议票就是信号。9月数据凸显两难：通胀3.7%，但新增就业仅2.9万人。"}, {"start": 205.73, "end": 215.14, "text": "Rates are already high into the decision. The ten year Treasury is just at or above five percent, and the dollar is near a two week high around one hundred two point four.", "zh": "决议前利率已经很高。10年期美债收益率刚好在5%上下，美元在约102.4的两年……两周高位附近。"}, {"start": 215.14, "end": 223.3, "text": "Gold slipped Wednesday morning to around four thousand to four thousand fifty dollars, after closing Tuesday near four thousand seventy-three.", "zh": "黄金周三早盘回落至约4009至4051美元，此前周二收于约4073美元。"}, {"start": 223.3, "end": 229.49, "text": "And oil is back above one hundred one dollars, after falling Tuesday on diplomacy hopes. What pushed it back up?", "zh": "原油在周二因外交希望下跌后，周三重回101美元上方。是什么把它推回去的？"}, {"start": 229.49, "end": 239.38, "text": "A claim by Yemen's Houthis that they hit Saudi Arabia's largest refinery with a missile. We must mark this clearly as unconfirmed, because Saudi authorities had not confirmed the strike.", "zh": "也门胡塞武装声称用导弹袭击了沙特最大的炼油厂。我们必须明确标注这一点尚未确认，因为沙特方面尚未证实这次袭击。"}, {"start": 239.38, "end": 247.01, "text": "So the oil spike is risk premium on a claim, not a confirmed outage. That distinction matters for how long the premium lasts.", "zh": "所以油价上涨是基于一则声明的风险溢价，不是已确认的供应中断。这个区别决定了溢价能持续多久。"}, {"start": 247.01, "end": 258.29, "text": "Away from commodities, the AI power trade also printed strong. Vertiv beat expectations with revenue up sixty-one percent and raised guidance, jumping about sixteen percent pre-market.", "zh": "大宗商品之外，AI电力板块也表现强劲。Vertiv业绩超预期，营收增长61%并上调指引，盘前涨约16%。"}, {"start": 258.29, "end": 265.08, "text": "GE Vernova also beat, and Bloom Energy rides that same power beta, up about four point three percent pre-market.", "zh": "GE Vernova也超预期，Bloom Energy受益于同样的电力主题，盘前涨约4.3%。"}, {"start": 265.08, "end": 270.07, "text": "Then tonight, the two biggest tests arrive after the close: Microsoft and Alphabet.", "zh": "然后今晚，最大的两场考验在收盘后到来：微软和Alphabet。"}, {"start": 270.07, "end": 280.22, "text": "Microsoft is expected to report revenue around ninety point six billion dollars and earnings near four dollars seventy-one cents, with Azure growth guided near forty-five percent.", "zh": "微软预计营收约906亿美元，每股收益约4.71美元，Azure增长指引接近45%。"}, {"start": 280.22, "end": 288.02, "text": "And its quarterly capital spending is guided above fifty billion dollars. The question is whether cloud growth converts that spending into cash.", "zh": "其季度资本开支指引超过500亿美元。问题在于云增长能否把这些开支转化为现金。"}, {"start": 288.02, "end": 299.26, "text": "Alphabet is expected to report revenue near one hundred twenty-seven point nine billion dollars, with 2026 capital spending guided at one hundred ninety-five to two hundred five billion.", "zh": "Alphabet预计营收接近1279亿美元，2026年资本开支指引为1950至2050亿美元。"}, {"start": 299.26, "end": 306.29, "text": "Options price big moves tonight: about plus or minus five percent for Microsoft, and about plus or minus six percent for Alphabet.", "zh": "期权市场为今晚定价了大幅波动：微软约正负5%，Alphabet约正负6%。"}, {"start": 306.29, "end": 316.32, "text": "There is also an unconfirmed report that OpenAI plans to buy Google's TPUs. No terms, and neither company has confirmed it, so we report it as a plan, not a deal.", "zh": "还有一则未确认的报道称OpenAI计划购买谷歌的TPU。没有条款，两家公司均未证实，所以我们把它报道为计划，而不是已达成的交易。"}, {"start": 316.32, "end": 327.55, "text": "Meanwhile Meta's financing story keeps growing. Its equity offering was upsized to ninety-seven point five billion dollars, with Nvidia investing three billion and AMD one billion.", "zh": "与此同时，Meta的融资故事还在扩大。其股票发行规模上调至975亿美元，英伟达投资30亿美元，AMD投资10亿美元。"}, {"start": 327.55, "end": 337.92, "text": "Critics call that circular, vendors funding their largest customer. Bulls call it demand insurance. Either way, it is now the template for how the AI build-out gets paid for.", "zh": "批评者称这是循环融资，即供应商资助其最大客户。看多者称这是需求保险。无论如何，这已成为AI建设如何筹资的模板。"}, {"start": 337.92, "end": 347.04, "text": "In other single names, Apple acknowledged display problems on a small number of its first folding iPhones and said it will replace affected units. No cause was given.", "zh": "其他个股方面，苹果承认首批折叠iPhone中有少量出现屏幕问题，并表示将更换受影响的设备。没有给出原因。"}, {"start": 347.04, "end": 358.2, "text": "Tesla hit a three month high Tuesday, closing up about four percent, and is up only modestly pre-market. We discarded one board figure near five percent because it appeared to mix up Tuesday's close move.", "zh": "特斯拉周二创三个月新高，收涨约4%，盘前仅小幅上涨。我们弃用了一个接近5%的盘前数据，因为它似乎混淆了周二的收盘涨幅。"}, {"start": 358.2, "end": 365.21, "text": "Palantir was flat Tuesday, lagging the Nasdaq, with no company event tied to the slip. It reports earnings on November second.", "zh": "Palantir周二持平，跑输纳斯达克，没有与此相关的公司事件。它将于11月2日公布财报。"}, {"start": 365.21, "end": 377.62, "text": "Moderna split analysts in opposite directions. William Blair downgraded it on valuation, while Piper Sandler raised its target to two hundred thirty dollars. The stock rebounded about four point six percent Tuesday.", "zh": "Moderna让分析师看法两极分化。William Blair以估值为由下调评级，而Piper Sandler将目标价上调至230美元。该股周二反弹约4.6%。"}, {"start": 377.62, "end": 388.97, "text": "The biotech triple leveraged fund LABU closed Tuesday up eight point three nine percent, but its Friday options still price about a ten percent move in two days. Calmer does not mean quiet.", "zh": "生物科技三倍做多基金LABU周二收涨8.39%，但其周五期权仍定价两天内约10%的波动。更平静不等于安静。"}, {"start": 388.97, "end": 401.02, "text": "Strategy reports Thursday. Its October filing confirmed no Bitcoin bought or sold in the week of October nineteenth to twenty-fifth, with holdings unchanged at eight hundred forty-eight thousand five hundred seventeen coins.", "zh": "Strategy将于周四公布财报。其10月文件确认，在10月19日至25日当周没有买卖比特币，持仓维持在848517枚不变。"}, {"start": 401.02, "end": 409.78, "text": "Instead it spent about two hundred five million dollars buying back its preferred shares. Bitcoin itself is back above eighty thousand dollars this morning.", "zh": "相反，它花了约2.05亿美元回购优先股。比特币今早重回8万美元上方。"}, {"start": 409.78, "end": 419.98, "text": "AppLovin faces class actions filed October twenty-seventh, plus two target cuts, with earnings due November fourth. Walmart is quiet, with earnings estimated November nineteenth.", "zh": "AppLovin面临10月27日提起的集体诉讼和两次目标价下调，财报将于11月4日公布。沃尔玛则平静，财报预计在11月19日。"}, {"start": 419.98, "end": 428.14, "text": "After the close, besides Microsoft and Alphabet, Ford, T-Mobile, eBay, ServiceNow, FedEx and Chipotle also report.", "zh": "收盘后，除了微软和Alphabet，福特、T-Mobile、eBay、ServiceNow、联邦快递和Chipotle也将公布财报。"}, {"start": 428.14, "end": 438.98, "text": "Thursday is just as heavy: third quarter GDP, September PCE inflation, the European Central Bank decision, and Amazon, SanDisk and Strategy earnings after the close.", "zh": "周四同样繁重：三季度GDP、9月PCE通胀、欧洲央行决议，以及收盘后的亚马逊、闪迪和Strategy财报。"}, {"start": 438.98, "end": 448.54, "text": "Friday brings the Bank of Japan decision, euro area GDP, the U.S. employment cost index, and the weekly options expiry that has those large moves priced.", "zh": "周五有日本央行决议、欧元区GDP、美国就业成本指数，以及已定价大幅波动的周度期权到期。"}, {"start": 448.54, "end": 461.69, "text": "Now the strategy chapter. This is analysis only, read-only, no trading action taken. Spreads only, never naked shorts, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit.", "zh": "现在说策略章节。这只是分析，只读，没有任何交易操作。只做价差，绝不裸卖，剩余14至30天，在赚到50%至70%权利金时离场。"}, {"start": 461.69, "end": 474.34, "text": "The regime is simple to state and hard to trade: selling premium this morning means collecting Tuesday's volatility for Wednesday's three binary events. Size for the gap, or wait for the post-print volatility crush.", "zh": "格局说起来简单、做起来难：今早卖出权利金，等于用周二的波动率去赌周三的三重二元事件。要按跳空来控制仓位，或者等待财报后的波动率回落。"}, {"start": 474.34, "end": 487.58, "text": "For KORU, the playbook default stays a bear call spread: far out of the money, ten to fifteen delta, three to five dollar wing width. A twelve percent pre-market gap is a rip to sell into, not strength to chase with puts.", "zh": "对于KORU，手册默认方向仍是熊市看涨价差：深度虚值、10至15 delta、3至5美元翼宽。盘前12%的跳空是逢高卖出的机会，不是追涨卖看跌期权的好时机。"}, {"start": 487.58, "end": 501.1, "text": "For LABU, the calmer triple leveraged fund, the put spread side is the trend side, with fifteen to twenty delta and slightly narrower wings. But with the Fed at two p.m., there is no new reason to add size before the prints.", "zh": "对于更平静的三倍基金LABU，看跌价差一侧顺应趋势，15至20 delta、翼宽略窄。但美联储决议在下午2点，之前没有新增仓位的理由。"}, {"start": 501.1, "end": 513.7, "text": "For SOXL, TECL and TQQQ, the same logic applies: keep strikes far and wings wide enough to survive a one day gap, or wait. The memory bounce is the event, not the entry.", "zh": "对于SOXL、TECL和TQQQ，逻辑相同：行权价要远、翼宽要能承受一日跳空，或者干脆等待。存储股的反弹是事件本身，不是入场点。"}, {"start": 513.7, "end": 522.53, "text": "For SK Hynix, the event has resolved and the gap has happened, so any new spread should be priced off post-print volatility, not off Tuesday's Seoul move.", "zh": "对于SK海力士，事件已经落地、跳空已经发生，所以任何新的价差都应按财报后的波动率定价，而不是按周二首尔的走势定价。"}, {"start": 522.53, "end": 533.88, "text": "For SanDisk, avoid a tight spread into Thursday's print, where options imply about a nine point four percent move. For Microsoft and Alphabet, do not build a thesis on a directional guess into tonight.", "zh": "对于闪迪，避免在周四财报前做过紧的价差，期权隐含波动约9.4%。对于微软和Alphabet，不要基于对今晚方向的猜测来构建策略。"}, {"start": 533.88, "end": 546.36, "text": "And for UVXY, only short dated bear call spreads, or avoid it entirely. A volatility fade after the Fed works only if Warsh sounds patient; a hawkish surprise inverts it fast.", "zh": "对于UVXY，只做短期熊市看涨价差，或者完全回避。美联储后的波动率回落只有在Warsh措辞偏鸽时才成立；偏鹰的意外会迅速逆转它。"}, {"start": 546.36, "end": 555.84, "text": "Let's close with five things before the open. One, Tuesday was strong but Wednesday futures are mixed. Two, memory is the trade, with an earnings anchor this time.", "zh": "最后总结开盘前五件事。第一，周二强劲，但周三期货涨跌互现。第二，存储股是主线，这次有了财报支撑。"}, {"start": 555.84, "end": 569.33, "text": "Three, the Fed decides at two p.m., and December is the real question. Four, Microsoft and Alphabet price five to six percent moves tonight. Five, oil's premium rests on an unconfirmed claim.", "zh": "第三，美联储下午2点决议，12月才是真正的问题。第四，微软和Alphabet今晚定价5%至6%的波动。第五，原油溢价建立在一则未确认的声明之上。"}, {"start": 569.33, "end": 577.01, "text": "And the three things that matter most. One, SK Hynix validated memory demand and exposed the accounting split in the same release.", "zh": "而最重要的三件事。第一，SK海力士在同一份财报中既验证了存储需求，又暴露了会计口径的分歧。"}, {"start": 577.01, "end": 590.69, "text": "Two, Wednesday stacks three binary events into one session, with Thursday almost as heavy. Three, Korea is again the highest beta expression of the same trade, and the playbook's bear call default exists for exactly this tape.", "zh": "第二，周三把三重二元事件叠加在一个交易日，周四也几乎同样繁重。第三，韩国再次是同一交易中贝塔最高的表现形式，手册的熊市看涨价差默认方向正是为这种盘面而设。"}, {"start": 590.69, "end": 606.41, "text": "A final word on data gaps. Pre-market percentages vary by snapshot time and source, Meta's direction conflicts across boards, and the Saudi strike, the OpenAI TPU report, and chatter about a Strategy Bitcoin sale are all unconfirmed against primary sources.", "zh": "最后说一下数据缺口。盘前涨跌幅因快照时间和来源而异，Meta的方向在不同平台上冲突，沙特炼油厂遇袭、OpenAI购买TPU以及Strategy出售比特币的传言均未得到一手来源证实。"}, {"start": 606.41, "end": 616.54, "text": "This brief is market research only, not investment advice and not an order. Leveraged funds reset daily and decay over time, and Korean names carry overnight gap risk.", "zh": "本简报仅为市场研究，不是投资建议，也不是交易指令。杠杆基金每日重置、长期衰减，韩国标的带有隔夜跳空风险。"}, {"start": 616.54, "end": 625.9, "text": "Read-only, no trading action was taken. For positions, expiry or margin, check the broker app. Thanks for listening, and we will see you at the intraday brief.", "zh": "只读，没有进行任何交易操作。如需了解持仓、到期或保证金，请查看券商App。感谢收听，盘中简报再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
