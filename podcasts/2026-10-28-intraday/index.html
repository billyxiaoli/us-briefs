<script>
const LINES=[{"start": 0.0, "end": 5.23, "text": "Welcome to the U.S. Stocks Intraday Brief, for Wednesday, October twenty eighth. I am Alex.", "zh": "欢迎收听美国股市盘中简报，2026年10月28日星期三。我是 Alex。"}, {"start": 5.23, "end": 14.42, "text": "And I am Jordan. This is the mid-session edition, recorded around eleven thirty Eastern. It is pure market research: no account data, and no trading orders.", "zh": "我是 Jordan。这是盘中版，美东时间约11点半录制，纯市场研究：没有账户数据，也没有下单。"}, {"start": 14.42, "end": 26.71, "text": "At the open, the Dow slipped forty two points, while the S and P five hundred rose point one seven percent and the Nasdaq rose point two four percent. Memory chips lifted the open; the Dow lagged.", "zh": "开盘时，道指跌42点，标普500涨0.17%，纳指涨0.24%。存储芯片带起了开盘，道指落后。"}, {"start": 26.71, "end": 39.67, "text": "By mid-morning, the broad tape went flat and narrow. The S P Y was up just point one six percent, the Q Q Q up point one percent, and small caps flat. Breadth was split, not strong.", "zh": "到上午中段，大盘走平收窄：SPY仅涨0.16%，QQQ涨0.10%，小盘股持平。市场广度分化，并不强劲。"}, {"start": 39.67, "end": 53.04, "text": "The one real trade today is memory. S K Hynix reported record revenue of one hundred four point six trillion won, up three hundred twenty eight percent, and operating profit of eighty three point three trillion won.", "zh": "今天唯一真正的主线是存储。SK海力士一季度营收104.6万亿韩元，同比增长328%，营业利润83.3万亿韩元，创纪录。"}, {"start": 53.04, "end": 65.04, "text": "It also announced about one hundred trillion won of shareholder returns for twenty twenty six, and said H B M four will pass H B M three E in the fourth quarter, with demand outrunning supply through twenty thirty.", "zh": "它还宣布2026年约100万亿韩元的股东回报，并表示HBM4将在第四季度超过HBM3E，需求到2030年都将超过供给。"}, {"start": 65.04, "end": 77.47, "text": "But keep both halves of that print in mind. Net profit of thirty nine point eight trillion won missed a FactSet consensus of about sixty one point four trillion, and fell fifty eight percent from the prior quarter.", "zh": "但要记住这份财报的两面：净利润39.8万亿韩元低于约61.4万亿韩元的市场预期，且环比下跌58%。"}, {"start": 77.47, "end": 89.71, "text": "Seoul still loved it. The KOSPI closed up six point six three percent at six thousand twelve, its first close above six thousand since October fourteenth, with a buy-side sidecar pause for a second straight session.", "zh": "首尔市场依然买账：KOSPI收涨6.63%至6012点，为10月14日以来首次收于6000点上方，连续第二天触发买方熔断暂停机制。"}, {"start": 89.71, "end": 101.16, "text": "In the U.S. session, that carried KORU up thirteen point six percent intraday to thirteen dollars forty seven, and S K H Y up twelve point one percent to one hundred sixty two dollars ninety five.", "zh": "美股盘中，KORU涨13.6%至13.47美元，SKHY涨12.1%至162.95美元。"}, {"start": 101.16, "end": 114.0, "text": "Micron rose four point seven percent to nine hundred seventy two dollars seventy seven, with an intraday high near nine hundred eighty. SanDisk rose five point five percent to one thousand three hundred seventy six dollars eighty nine.", "zh": "美光涨4.7%至972.77美元，盘中最高接近980美元；闪迪涨5.5%至1376.89美元。"}, {"start": 114.0, "end": 127.2, "text": "The broader chip tape is thinner, though. Nvidia is flat intraday, and A M D is up just one point four percent. Morning flow put about thirteen point six billion dollars into memory names, far more than Nvidia's two point eight billion.", "zh": "但更广的芯片板块要弱得多：英伟达盘中持平，AMD仅涨1.4%。上午资金流约136亿美元涌入存储股，远超英伟达的28亿美元。"}, {"start": 127.2, "end": 135.17, "text": "So this is a memory trade, not a chip trade. Seagate is the outlier, down after earnings, with Morgan Stanley cutting its target.", "zh": "所以这是存储行情，不是芯片行情。希捷是个例外，财报后下跌，摩根士丹利下调了其目标价。"}, {"start": 135.17, "end": 148.61, "text": "The other big morning story is power. Vertiv soared fourteen percent to two hundred thirty seven dollars eighty six, after earnings of two dollars twenty one a share on revenue of four point three one billion, up sixty one percent.", "zh": "上午另一个大故事是电力基建：Vertiv暴涨14%至237.86美元，每股收益2.21美元，营收43.1亿美元，同比增长61%。"}, {"start": 148.61, "end": 159.17, "text": "G E Vernova also beat, with earnings of four dollars eighty one and orders up ninety six percent. But its stock faded from up three percent pre-market to down two point two percent intraday.", "zh": "GE Vernova同样超预期，每股收益4.81美元，订单增长96%。但其股价从盘前涨3%转为盘中跌2.2%。"}, {"start": 159.17, "end": 171.41, "text": "Barron's read is simple: faster growth and a lower multiple explain why the market paid for Vertiv and not for Vernova. For Bloom Energy, up two point six percent, the theme is still positive, just selective.", "zh": "巴伦周刊的解读很简单：更快的增长和更低的估值，解释了市场为何买Vertiv而不买Vernova。对涨2.6%的Bloom Energy来说，主题仍是正面的，只是更挑剔。"}, {"start": 171.41, "end": 180.84, "text": "Now the macro clock. The Bank of Canada raised its rate twenty five basis points to two point five percent this morning, its first hike since July twenty twenty three.", "zh": "再看宏观时钟：加拿大央行今天上午加息25个基点至2.5%，为2023年7月以来首次加息。"}, {"start": 180.84, "end": 195.48, "text": "Governor Macklem said oil prices are expected to stay higher for longer, and the hike was needed so energy inflation does not spill over into generalised inflation. Canada's September inflation was three point one percent, driven almost entirely by energy.", "zh": "行长麦克勒姆表示，油价预计将在更长时间内保持高位，加息是为了防止能源通胀蔓延为全面通胀。加拿大9月通胀为3.1%，几乎完全由能源推动。"}, {"start": 195.48, "end": 202.99, "text": "That matters because it is the clearest live example of an energy-inflation hawkish pivot, and it arrived hours before the Fed speaks.", "zh": "这很重要，因为这是能源通胀下鹰派转向最鲜活的例子，而且它出现在美联储讲话前几小时。"}, {"start": 202.99, "end": 212.28, "text": "Oil itself is holding its premium. W T I is near one hundred one dollars seventy five, up about two percent, and Brent near one hundred fifteen dollars sixty.", "zh": "油价本身维持着溢价：WTI约101.75美元，涨约2%，布伦特约115.6美元。"}, {"start": 212.28, "end": 224.76, "text": "But a caution we must repeat: the spike rests on a Houthi claim of a missile hit on a Saudi refinery, which Saudi authorities had not confirmed at the time of writing. Treat it as risk premium, not a confirmed outage.", "zh": "但必须重复一个提醒：油价上涨基于胡塞武装声称导弹击中沙特炼厂，而沙特方面在发稿时尚未证实。应将其视为风险溢价，而非已确认的供应中断。"}, {"start": 224.76, "end": 235.03, "text": "Rates and the dollar are firm into the Fed. The ten year yield is near five point zero one percent, the dollar index near one hundred two point four, and gold slipped to about four thousand sixty dollars after Tuesday's gain.", "zh": "利率和美元在美联储决议前保持坚挺：10年期收益率约5.01%，美元指数约102.4，黄金在周二上涨后回落至约4060美元。"}, {"start": 235.03, "end": 244.51, "text": "The V I X eased to about seventeen point three five, and U V X Y fell three point one percent to seventeen dollars thirty one. Nobody is paying up to hedge the Fed.", "zh": "VIX回落至约17.35，UVXY跌3.1%至17.31美元。没人愿意花大价钱对冲美联储决议。"}, {"start": 244.51, "end": 257.04, "text": "The Fed decision lands at two p.m. Eastern, with Chair Warsh's press conference at two thirty. A hold at three point seven five to four percent is about ninety to ninety four percent priced.", "zh": "美联储决议将于美东时间下午2点公布，沃什主席记者会2点半开始。维持3.75%至4%利率区间的概率约90%至94%。"}, {"start": 257.04, "end": 271.25, "text": "The real question is December. All one hundred economists in a Reuters poll expect a December hike, while futures price only about seventy one to eighty three percent. That gap, plus any dissent for a hike, is what the statement can move.", "zh": "真正的问题是12月：路透调查的100位经济学家全部预计12月加息，而期货定价仅约71%至83%。这一差距，加上任何主张加息的异议票，才是声明能撼动的东西。"}, {"start": 271.25, "end": 282.48, "text": "Then, after the close, Microsoft and Alphabet report. Options imply a move of five point zero nine percent for Microsoft, and five point nine four to five point nine nine percent for Alphabet.", "zh": "收盘后，微软和Alphabet将公布财报。期权隐含波动为微软±5.09%，Alphabet±5.94%至5.99%。"}, {"start": 282.48, "end": 295.73, "text": "Consensus is about ninety point six billion dollars of revenue for Microsoft, and about one hundred twenty seven point nine billion for Alphabet. The exam is the same for both: does cloud growth convert A I spending into cash?", "zh": "市场预期微软营收约906亿美元，Alphabet约1279亿美元。对两家公司的考题相同：云增长能否把AI支出转化为现金？"}, {"start": 295.73, "end": 306.1, "text": "Intraday, Alphabet is the only megacap gainer, up one point one percent to three hundred twenty dollars twenty, helped by the reported OpenAI plan to buy Google T P Us.", "zh": "盘中，Alphabet是唯一上涨的大型科技股，涨1.1%至320.20美元，受OpenAI计划购买谷歌TPU的报道提振。"}, {"start": 306.1, "end": 314.14, "text": "That T P U report is unconfirmed: a single source, no terms, no confirmation from either company. Do not trade it as fact.", "zh": "但这份TPU报道尚未证实：单一信源、无条款、双方均未确认。不要把它当事实来交易。"}, {"start": 314.14, "end": 330.82, "text": "Microsoft faded point five percent to five hundred twenty eight dollars seventy five, and Meta faded one point two percent to six hundred twelve dollars seventy five, as the dilution debate around its ninety seven point five billion dollar offering won the session so far.", "zh": "微软跌0.5%至528.75美元，Meta跌1.2%至612.75美元，因其975亿美元增发带来的稀释争议在盘中占了上风。"}, {"start": 330.82, "end": 343.13, "text": "Elsewhere in the watchlist, Palantir fell two point four percent to one hundred ninety three dollars ninety, with no company news, extending Tuesday's lag. Tesla reversed its pre-market gain to fall one point five percent.", "zh": "自选股其他个股中，Palantir无公司消息却跌2.4%至193.90美元，延续周二的落后表现；特斯拉则由盘前上涨转为跌1.5%。"}, {"start": 343.13, "end": 355.42, "text": "Biotech ran with no new company news: L A B U up four point one percent to two hundred fifty two dollars sixteen, and Moderna up three point seven percent to two hundred fifteen dollars fifty six.", "zh": "生物科技在无新公司消息的情况下上涨：LABU涨4.1%至252.16美元，Moderna涨3.7%至215.56美元。"}, {"start": 355.42, "end": 366.89, "text": "Bitcoin holds above eighty thousand, near eighty one thousand three hundred, but crypto stocks faded: Strategy down point seven percent to one hundred forty dollars thirty five, ahead of its Thursday earnings.", "zh": "比特币守在8万美元上方，约81300美元，但加密股回落：Strategy跌0.7%至140.35美元，周四将公布财报。"}, {"start": 366.89, "end": 380.45, "text": "Gold miners gave back part of Tuesday's gain: G D X down one percent to eighty two dollars thirty three. And S P C X, the session's weakest watchlist name outside U V X Y, fell two point nine percent.", "zh": "金矿股回吐周二部分涨幅：GDX跌1%至82.33美元。SPCX跌2.9%，为除UVXY外盘中最弱的自选股。"}, {"start": 380.45, "end": 392.76, "text": "Now the strategy update, read-only, no trading action taken. Spreads only, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit, max loss one to two percent per trade.", "zh": "现在是策略更新，仅供研究，没有任何交易操作：只做价差，剩余14至30天，在50%至70%权利金处离场，单笔最大亏损1%至2%。"}, {"start": 392.76, "end": 406.01, "text": "Premium sold at midday is still pre-Fed premium. The cleaner premium is the post-print vol crush, not this morning's memory-led rip. If you sell at all today, size it so a post-Fed, post-earnings gap does not matter.", "zh": "中午卖出的权利金仍是美联储决议前的权利金。更干净的权利金来自财报公布后的波动率回落，而非上午存储股的跳涨。今天如要卖出，仓位要小到能承受决议和财报后的跳空。"}, {"start": 406.01, "end": 422.5, "text": "For KORU, the default remains a bear call spread: ten to fifteen delta, far out of the money, three to five dollar wings. A thirteen point six percent intraday print, after a twenty three percent fall over the prior seven days, is a rip to sell into, not strength to chase.", "zh": "对KORU，默认仍是熊市看涨价差：10至15 delta、深度虚值、3至5美元翼宽。盘中涨13.6%，而此前7天跌约23%，这是反弹卖点，不是追涨信号。"}, {"start": 422.5, "end": 434.42, "text": "Do not run cash-secured puts or a wheel on a decaying three-x fund. And before any first trade in a new expiry, confirm the listed months and strike spacing in the broker app; do not assume weeklies exist.", "zh": "不要对不断衰减的3倍基金做现金担保看跌期权或wheel策略。在新到期月份首次交易前，先在券商App确认挂牌月份和行权价间距，不要假设有周度期权。"}, {"start": 434.42, "end": 446.42, "text": "For L A B U, the framework is unchanged: fifteen to twenty delta strikes, slightly narrower wings than KORU, fourteen to thirty days. The biotech bounce is not a reason to add size before the Fed.", "zh": "对LABU，框架不变：15至20 delta行权价，翼宽略窄于KORU，剩余14至30天。生物科技反弹不是在美联储决议前加仓的理由。"}, {"start": 446.42, "end": 465.38, "text": "For S O X L, T E C L and T Q Q Q, keep the two books separate. S O X L's three point two percent is a memory-book gain; T E C L and T Q Q Q are flat-tape gains. Both share tonight's clock, and S O X L adds Thursday's SanDisk print.", "zh": "对SOXL、TECL和TQQQ，要分开看两本账：SOXL涨3.2%是存储账，TECL和TQQQ是平盘账。两者都面临今晚的财报，SOXL还叠加周四闪迪财报。"}, {"start": 465.38, "end": 478.82, "text": "For single names: S K H Y's gap has happened and held, but price new spreads off post-print vol, not Tuesday's Seoul move. SanDisk into Thursday is a tight-spread trap; wait for the post-print crush.", "zh": "个股方面：SKHY的跳空已经发生并守住，但新价差要按财报后的波动率定价，而非周二首尔的走势。闪迪在周四财报前是紧价差陷阱，等财报后的波动率回落。"}, {"start": 478.82, "end": 488.47, "text": "Microsoft and Alphabet tonight are positioning, not information: Alphabet up one percent, Microsoft down half a percent, tells you nothing about which way either print gaps.", "zh": "今晚的微软和Alphabet盘中走势只是仓位调整，不是信息：Alphabet涨1%、微软跌0.5%，说明不了财报会向哪个方向跳空。"}, {"start": 488.47, "end": 500.3, "text": "And for U V X Y, only short-dated bear call spreads, or avoid entirely. Today's fade is the expected decay path, not a new edge, and a hawkish dissent count inverts it fast.", "zh": "对UVXY，只做短期熊市看涨价差，或干脆回避。今天的回落是预期的衰减路径，不是新机会，而鹰派异议票数量会迅速逆转它。"}, {"start": 500.3, "end": 514.75, "text": "Risk checkpoints into the close. First, S P Y's twenty one day average at seven hundred sixty eight point eight, and Tuesday's high at seven hundred seventy one point one four. Holding above the average keeps the orderly-hold setup.", "zh": "收盘前的风险检查点：第一，SPY的21日均线768.8美元和周二高点771.14美元。守住均线，才能维持“有序等待决议”的格局。"}, {"start": 514.75, "end": 525.67, "text": "Second, Q Q Q's ten day at seven hundred twenty point one versus its twenty one day at seven hundred twenty five point three. A close above the twenty one day needs the Fed's help.", "zh": "第二，QQQ的10日均线720.1美元对21日均线725.3美元。收于21日均线上方需要美联储的配合。"}, {"start": 525.67, "end": 536.52, "text": "Third, the two p.m. vote count: a unanimous hold is priced; one hawkish dissent is noise, three or more is a signal. Fourth, Warsh's tone on December at two thirty.", "zh": "第三，下午2点的投票数：一致维持利率已被定价，一张鹰派异议票是噪音，三张以上就是信号。第四，沃什2点半对12月的措辞。"}, {"start": 536.52, "end": 546.05, "text": "Fifth, the Microsoft and Alphabet prints after the close: watch Azure, guided near forty five percent, and Google Cloud margins, not just headline earnings.", "zh": "第五，收盘后的微软和Alphabet财报：看Azure（指引约45%）和谷歌云的利润率，而不只是 headline 盈利。"}, {"start": 546.05, "end": 558.17, "text": "Sixth, oil above one hundred one dollars for W T I: a confirmed Saudi outage reprices the whole inflation trade overnight, and an official denial takes the premium back out just as fast.", "zh": "第六，WTI高于101美元：若沙特供应中断得到证实，整个通胀交易将隔夜重定价；若官方否认，溢价同样会迅速消失。"}, {"start": 558.17, "end": 577.42, "text": "Seventh, memory names into Samsung's Thursday print: Micron's intraday high near nine hundred eighty, S K H Y's near one hundred sixty three, SanDisk's near one thousand three hundred eighty eight. A fade into Samsung is profit-taking, not a thesis break, unless it breaks Tuesday's closes.", "zh": "第七，存储股迎接三星周四财报：美光盘中高点近980美元、SKHY近163美元、闪迪近1388美元。在三星财报前回落只是获利了结，除非跌破周二收盘价，否则不是逻辑破裂。"}, {"start": 577.42, "end": 591.26, "text": "Rest of the session: the Fed at two, Warsh at two thirty, Microsoft and Alphabet after the close. Thursday brings Q three G D P and P C E at eight thirty, the E C B, and Amazon, SanDisk and Strategy after the close.", "zh": "剩余时段：下午2点美联储决议，2点半沃什讲话，收盘后微软和Alphabet财报。周四有8点半的第三季度GDP和PCE、欧洲央行决议，以及收盘后的亚马逊、闪迪和Strategy财报。"}, {"start": 591.26, "end": 604.78, "text": "This brief is market research only, not investment advice, and not an order. Leveraged E T Fs reset daily and decay over holding periods; they are not buy-and-hold instruments. Read-only: no trading action was taken.", "zh": "本简报仅为市场研究，不是投资建议，也不是下单指令。杠杆ETF每日重置、长期持有会衰减，不适合买入持有。只读：未做任何交易操作。"}, {"start": 604.78, "end": 612.17, "text": "That is the intraday brief for October twenty eighth. The full report, with sources, is on the briefs hub. See you at the post-market edition.", "zh": "这就是10月28日的盘中简报。附来源的完整报告在简报总页。盘后版再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
