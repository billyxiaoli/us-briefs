<script>
const LINES=[{"start": 0.0, "end": 6.53, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Tuesday, October 27, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘前简报，2026年10月27日星期二。我是 Alex。"}, {"start": 6.53, "end": 17.5, "text": "And I'm Jordan. This is the pre-market edition, recorded before the open, and it is pure market research. No account data, no trading orders, just what is happening and what to watch.", "zh": "我是 Jordan。这是盘前版，开盘前录制，纯市场研究。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 17.5, "end": 24.77, "text": "Let's start with the headline. Monday was a strong day, and Tuesday opens modestly higher — but the real test is still a day away.", "zh": "先从头条开始。周一表现强劲，周二小幅高开，但真正的考验还要再等一天。"}, {"start": 24.77, "end": 26.26, "text": "How strong was Monday?", "zh": "周一有多强？"}, {"start": 26.26, "end": 46.06, "text": "The S&P 500 rose 0.70% to 7,676.77. The Nasdaq rose 0.82% to 26,169.38, and the Dow rose 0.28% to 52,361.58.", "zh": "标普500涨0.70%，至7676.77点。纳指涨0.82%，至26169.38点。道指涨0.28%，至52361.58点。"}, {"start": 46.06, "end": 47.54, "text": "And Tuesday's futures?", "zh": "周二的期货呢？"}, {"start": 47.54, "end": 65.38, "text": "Modestly higher. Early snapshots showed the Dow up 0.14% and the S&P up 0.05%, with later snapshots a bit stronger — Dow up about 0.2 to 0.29%, Nasdaq up 0.4 to 0.46%.", "zh": "小幅走高。早期数据显示道指涨0.14%，标普涨0.05%，稍晚的数据稍强，道指涨约0.2%至0.29%，纳指涨0.4%至0.46%。"}, {"start": 65.38, "end": 73.3, "text": "Exactly — positioning, not resolution. The overnight catalyst was Anthropic's S-1 filing, made public on Monday.", "zh": "没错，这只是仓位调整，不是尘埃落定。隔夜的催化剂是 Anthropic 周一公开的招股文件。"}, {"start": 73.3, "end": 74.78, "text": "What did the filing show?", "zh": "文件里有什么？"}, {"start": 74.78, "end": 88.34, "text": "First-half revenue of 16.29 billion dollars, versus 1.16 billion a year earlier. And a first-half net loss of 80.7 billion, though about 72.4 billion of that is a non-cash revaluation.", "zh": "上半年收入162.9亿美元，而一年前只有11.6亿美元。上半年净亏损807亿美元，不过其中约724亿美元是非现金重估。"}, {"start": 88.34, "end": 90.5, "text": "And the number everyone is arguing about?", "zh": "大家争论的那个数字呢？"}, {"start": 90.5, "end": 102.58, "text": "Compute commitments. One scope puts purchase commitments at 265.6 billion dollars at June 30. Other sources cite 450 to 518 billion in multi-year cloud commitments.", "zh": "算力承诺。一个口径下，6月30日的采购承诺为2656亿美元。另一些来源则称多年云承诺为4500亿至5180亿美元。"}, {"start": 102.58, "end": 104.09, "text": "Can we add those together?", "zh": "能把它们加起来吗？"}, {"start": 104.09, "end": 112.97, "text": "No — and this matters. They differ by scope, so adding them would double-count. Treat them as a range with that warning, not a single figure.", "zh": "不能，这一点很重要。它们的口径不同，加起来会重复计算。只能当作一个带警告的区间，而不是单一数字。"}, {"start": 112.97, "end": 114.84, "text": "What did the market do with the filing?", "zh": "市场怎么消化这份文件？"}, {"start": 114.84, "end": 120.31, "text": "It revived the AI trade. Chip stocks led on Monday, and Tuesday's pre-market is led by memory.", "zh": "它让AI交易回暖了。周一芯片股领涨，周二盘前则由存储股领涨。"}, {"start": 120.31, "end": 121.92, "text": "Give us the memory numbers.", "zh": "说说存储股的数字。"}, {"start": 121.92, "end": 136.37, "text": "The semiconductor 3x fund SOXL is up 4.77% pre-market, to 94.82. Micron is up about 1.72%, and SK Hynix's American listing is up 2.67%.", "zh": "半导体3倍基金 SOXL 盘前涨4.77%，至94.82美元。美光涨约1.72%，SK海力士美股上市涨2.67%。"}, {"start": 136.37, "end": 137.88, "text": "And Korea itself?", "zh": "韩国市场本身呢？"}, {"start": 137.88, "end": 150.36, "text": "Korea's KOSPI closed up 3.1%, at 5,638.34. That came after a 1.46% fall on Monday — a two-day round trip of about 4.5 points.", "zh": "韩国综合指数收涨3.1%，至5638.34点。而周一它还跌了1.46%，两天来回约4.5个点。"}, {"start": 150.36, "end": 153.05, "text": "The surge even paused trading briefly, right?", "zh": "这次大涨甚至短暂暂停过交易，对吧？"}, {"start": 153.05, "end": 159.1, "text": "Yes. The surge briefly triggered a program-trading pause, known as a sidecar, on the Korea Exchange.", "zh": "是的。这次大涨短暂触发了韩国交易所的程序化交易暂停，也就是 sidecar 机制。"}, {"start": 159.1, "end": 161.54, "text": "What about the SK Hynix dividend story?", "zh": "SK海力士的分红传闻呢？"}, {"start": 161.54, "end": 172.3, "text": "This is important, and it is UNCONFIRMED. A Korean newspaper reported a possible special dividend of around 12 billion dollars, funded by gains on a Kioxia stake.", "zh": "这一点很重要，而且尚未确认。一家韩国报纸报道称，可能派发约120亿美元的特别股息，资金来自铠侠股权的收益。"}, {"start": 172.3, "end": 173.78, "text": "Did the company confirm it?", "zh": "公司确认了吗？"}, {"start": 173.78, "end": 182.86, "text": "No. SK Hynix said on October 26 that no specific measure has been approved, and it will unveil shareholder-return plans with earnings on Wednesday.", "zh": "没有。SK海力士10月26日表示，没有任何具体措施获批，将在周三财报时公布股东回报计划。"}, {"start": 182.86, "end": 185.9, "text": "So Wednesday is binary for SK Hynix.", "zh": "所以周三对SK海力士来说是二元事件。"}, {"start": 185.9, "end": 192.14, "text": "Completely. Confirmation rallies it, denial gaps it down. Treat Wednesday as a two-way event.", "zh": "完全是。确认就上涨，否认就跳空下跌。把周三当作双向事件来对待。"}, {"start": 192.14, "end": 194.59, "text": "Let's talk about Meta's giant raise.", "zh": "说说 Meta 的巨额融资。"}, {"start": 194.59, "end": 201.98, "text": "Meta's equity offering has been upsized to 97.5 billion dollars — the largest ever — to fund AI infrastructure.", "zh": "Meta 的股权融资已扩大到975亿美元，是有史以来最大的一次，用于资助AI基础设施。"}, {"start": 201.98, "end": 203.74, "text": "And Nvidia is participating?", "zh": "英伟达也参与了吗？"}, {"start": 203.74, "end": 213.77, "text": "Yes. Nvidia will invest 3 billion dollars in Meta's offering, and expand their Muse partnership. Meta will deploy more Nvidia infrastructure, including Vera Rubin systems.", "zh": "是的。英伟达将向 Meta 的融资投入30亿美元，并扩大双方的 Muse 合作。Meta 将部署更多英伟达基础设施，包括 Vera Rubin 系统。"}, {"start": 213.77, "end": 215.62, "text": "How is Meta stock reacting?", "zh": "Meta 股价反应如何？"}, {"start": 215.62, "end": 226.42, "text": "Flat to down about 0.68% pre-market, depending on the snapshot. The size is now consistently reported, but it is still a reported figure until the offering documents settle.", "zh": "盘前持平至下跌约0.68%，取决于数据时点。规模现在报道一致，但在发行文件落地前仍是传闻数字。"}, {"start": 226.42, "end": 228.38, "text": "What about rates and the Fed?", "zh": "利率和美联储呢？"}, {"start": 228.38, "end": 236.23, "text": "The Fed's two-day meeting starts today. The decision lands Wednesday at 2 p.m. Eastern, with Chair Warsh speaking at 2:30.", "zh": "美联储为期两天的会议今天开始。决议将于周三东部时间下午2点公布，Warsh 主席2点半讲话。"}, {"start": 236.23, "end": 237.62, "text": "What is expected?", "zh": "市场预期是什么？"}, {"start": 237.62, "end": 248.98, "text": "A hold at 3.75 to 4.00%, priced at about 89 to 90%. A December hike is the base case, priced at roughly 73 to 82%.", "zh": "维持在3.75%至4.00%不变，定价约89%至90%。12月加息是基准情形，定价约73%至82%。"}, {"start": 248.98, "end": 250.46, "text": "And yields and gold?", "zh": "收益率和黄金呢？"}, {"start": 250.46, "end": 265.9, "text": "The 10-year yield is around 4.98 to 4.99% Tuesday morning. The dollar is firmer, near 102.1 to 102.2, and spot gold is testing 4,000 dollars, at about 4,000 to 4,014.", "zh": "10年期收益率周二早上约4.98%至4.99%。美元走强，约102.1至102.2，现货黄金正在测试4000美元，约4000至4014美元。"}, {"start": 265.9, "end": 267.53, "text": "Oil is still volatile?", "zh": "油价仍然波动吗？"}, {"start": 267.53, "end": 281.86, "text": "Very. West Texas crude traded between about 100.88 and 102.07 dollars on Tuesday, and Brent between 114.81 and 116.24. Do not quote a single oil level today.", "zh": "非常波动。西德州原油周二在约100.88至102.07美元之间交易，布伦特在114.81至116.24美元之间。今天不要引用单一油价。"}, {"start": 281.86, "end": 283.25, "text": "Why the swings?", "zh": "为什么波动？"}, {"start": 283.25, "end": 294.12, "text": "Diplomacy and attacks pulling opposite ways. Talks with Iranian officials continued in Tehran on Monday, while Houthi attacks on Saudi Arabia keep the supply-risk premium in place.", "zh": "外交与袭击在往相反方向拉。周一与伊朗官员在德黑兰的会谈继续进行，而胡塞武装对沙特的袭击让供应风险溢价依然存在。"}, {"start": 294.12, "end": 295.08, "text": "Bitcoin?", "zh": "比特币呢？"}, {"start": 295.08, "end": 302.16, "text": "Below 80,000 dollars, around 79,750 to 79,900 on Tuesday morning.", "zh": "低于80000美元，周二早上约79750至79900美元。"}, {"start": 302.16, "end": 304.2, "text": "Let's run the rest of the watchlist quickly.", "zh": "快速过一下其余自选股。"}, {"start": 304.2, "end": 313.8, "text": "Tesla rose 5.21% on Monday to 391.62, after Barclays upgraded it to Overweight and raised its target to 450.", "zh": "特斯拉周一涨5.21%，至391.62美元，此前巴克莱将其上调至超配，目标价提高到450美元。"}, {"start": 313.8, "end": 314.76, "text": "And Apple?", "zh": "苹果呢？"}, {"start": 314.76, "end": 325.08, "text": "Apple fell 1.10% on Monday to 343.91, after Loop Capital cut its target to 330. Apple's earnings are due November 2.", "zh": "苹果周一下跌1.10%，至343.91美元，此前 Loop Capital 将其目标价下调至330美元。苹果财报将于11月2日公布。"}, {"start": 325.08, "end": 327.96, "text": "Strategy, the company formerly MicroStrategy?", "zh": "Strategy，也就是以前的 MicroStrategy 呢？"}, {"start": 327.96, "end": 341.35, "text": "Its October 26 filing says it bought zero bitcoin from October 19 to 25, ending a five-week buying streak. Instead it repurchased preferred shares for 204.9 million dollars.", "zh": "它10月26日的文件称，10月19日至25日没有买入任何比特币，结束了连续五周的买入。相反，它以2.049亿美元回购了优先股。"}, {"start": 341.35, "end": 342.67, "text": "And Bloom Energy?", "zh": "Bloom Energy 呢？"}, {"start": 342.67, "end": 356.95, "text": "Bloom jumped about 5.5% on Monday to around 203.90, after falling 11.24% on Friday. But its full-year guidance figures conflict across sources, so verify them from the company release before quoting.", "zh": "Bloom 周一涨约5.5%，至约203.90美元，此前周五跌了11.24%。但其全年指引数字在不同来源间存在冲突，引用前请以公司公告为准。"}, {"start": 356.95, "end": 362.16, "text": "Now the strategy part. This brief is read-only, but what posture does it describe?", "zh": "现在说策略部分。这份简报是只读的，但它描述了什么姿态？"}, {"start": 362.16, "end": 375.36, "text": "Spreads only, 14 to 30 days to expiry, far strikes, wide wings, and small size. Take profit at 50 to 70% of the credit, and keep any single trade's maximum loss to 1 to 2%.", "zh": "只做价差，14至30天到期，远离行权价，宽翼，小仓位。止盈为权利金的50%至70%，任何单笔交易的最大亏损控制在1%至2%。"}, {"start": 375.36, "end": 377.23, "text": "Why the extra caution this week?", "zh": "为什么本周要格外谨慎？"}, {"start": 377.23, "end": 391.87, "text": "Because Wednesday is the hinge: the Fed decision, Microsoft and Alphabet earnings after the close, and SK Hynix earnings. If you sell premium at all, the cleaner expression is to sell it after the event wall, or to size it so a Wednesday gap does not matter.", "zh": "因为周三就是关键：美联储决议，微软和 Alphabet 收盘后公布财报，还有 SK海力士财报。如果一定要卖权利金，更干净的做法是尽可能在事件墙过去之后再卖，或者把仓位小到周三跳空也无所谓。"}, {"start": 391.87, "end": 393.12, "text": "And KORU?", "zh": "KORU 呢？"}, {"start": 393.12, "end": 405.84, "text": "The playbook default for KORU remains a bear call spread, given its very high volatility and overnight gap risk. Tuesday's 5.51% pre-market jump is a rip to sell into, not strength to chase.", "zh": "根据策略手册，KORU 的默认策略仍是熊市看涨价差，因为其波动率非常高且有隔夜跳空风险。周二盘前5.51%的跳涨是用来卖的涨势，不是用来追的强势。"}, {"start": 405.84, "end": 408.53, "text": "So, to recap Tuesday in one sentence?", "zh": "那么，用一句话总结周二？"}, {"start": 408.53, "end": 419.74, "text": "A memory-led bounce on Anthropic's filing, into a week where Wednesday's Fed decision and Microsoft and Alphabet earnings will decide whether the AI financing repricing continues or pauses.", "zh": "Anthropic 文件带来的存储股领涨反弹，而本周周三的美联储决议和微软、Alphabet 财报，将决定 AI 融资重定价是继续还是暂停。"}, {"start": 419.74, "end": 425.86, "text": "Thanks for listening. This was a market research summary only, not investment advice, and not a trade recommendation.", "zh": "谢谢收听。这只是市场研究总结，不是投资建议，也不是交易推荐。"}, {"start": 425.86, "end": 434.54, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "对于只有券商才能确认的事情，比如持仓、到期、行权或保证金，请查看你的券商 App。我们下期简报再见。"}, {"start": 434.54, "end": 435.55, "text": "See you then.", "zh": "再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
