<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:640px;margin:20px auto;padding:0 16px;color:#111;line-height:1.6}
h1{font-size:19px;line-height:1.4;margin:0 0 12px}
button{font-size:18px;padding:8px 12px;margin:0;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.controls{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.controls select{flex-shrink:0}
button.primary{background:#111;color:#fff;border-color:#111}
select{font-size:16px;padding:8px 6px;margin:0}
input[type=range]{width:100%;margin:12px 0}
.time{font-variant-numeric:tabular-nums;color:#444;white-space:nowrap}

#transcript{border:1px solid #ddd;border-radius:12px;padding:8px 12px;height:340px;overflow-y:auto;background:#fafafa;scroll-behavior:smooth}

.controls #speedBtn{font-size:16px;padding:8px 10px}

.speed-list{background:#fff;border-radius:16px;width:min(320px,86vw);max-height:70vh;overflow-y:auto;padding:8px}
.speed-opt{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:19px;padding:14px 16px;border:none;border-bottom:1px solid #eee;background:#fff;color:#111}

<body>
<h1>U.S. Stocks Pre-Market Brief — October 26, 2026</h1>

<div id="speedMenu" class="speed-menu" hidden><div class="speed-list"><button class="speed-opt" data-rate="0.75">0.75×<span>○</span></button><button class="speed-opt" data-rate="0.8">0.8×<span>○</span></button><button class="speed-opt" data-rate="0.85">0.85×<span>○</span></button><button class="speed-opt" data-rate="0.9">0.9×<span>○</span></button><button class="speed-opt" data-rate="0.95">0.95×<span>○</span></button><button class="speed-opt sel" data-rate="1">1×<span>●</span></button><button class="speed-opt" data-rate="1.1">1.1×<span>○</span></button><button class="speed-opt" data-rate="1.2">1.2×<span>○</span></button><button class="speed-opt" data-rate="1.3">1.3×<span>○</span></button><button class="speed-opt" data-rate="1.4">1.4×<span>○</span></button><button class="speed-opt" data-rate="1.5">1.5×<span>○</span></button><button class="speed-opt" data-rate="1.6">1.6×<span>○</span></button><button class="speed-opt" data-rate="1.7">1.7×<span>○</span></button><button class="speed-opt" data-rate="1.8">1.8×<span>○</span></button><button class="speed-opt" data-rate="1.9">1.9×<span>○</span></button><button class="speed-opt" data-rate="2">2×<span>○</span></button></div></div>
<input type="range" id="seek" value="0" min="0" max="100" step="0.1">

<script>
const LINES=[{"start": 0.0, "end": 7.27, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Monday, October 26, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘前简报，2026年10月26日星期一。我是 Alex。"}, {"start": 7.27, "end": 17.88, "text": "And I'm Jordan. This is the pre-market edition, recorded before the open, and it is pure market research. No account data, no trading orders, just what is happening and what to watch.", "zh": "我是 Jordan。这是盘前版，开盘前录制，纯市场研究。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 17.88, "end": 25.63, "text": "Let us start with the headline. Futures are modestly higher, but this is a relief bounce, not a clean all-clear.", "zh": "先从头条开始。期货小幅走高，但这只是一次缓解反弹，不是全面解除警报。"}, {"start": 25.63, "end": 27.36, "text": "How modest are we talking?", "zh": "小幅是有多小？"}, {"start": 27.36, "end": 37.51, "text": "At 05:19 ET, Dow futures were up 0.49%, S&P futures up 0.30%, and Nasdaq futures up 0.25%.", "zh": "东部时间5点19分，道指期货涨0.49%，标普期货涨0.30%，纳指期货涨0.25%。"}, {"start": 37.51, "end": 40.2, "text": "And the driver was oil pulling back, right?", "zh": "推动因素是油价回落，对吧？"}, {"start": 40.2, "end": 50.81, "text": "Partly. Brent crude settled Friday at $116.72, and WTI was around $101 on Monday morning, down about 2%.", "zh": "部分是。布伦特原油周五收于116.72美元，周一早上西德州原油约101美元，下跌约2%。"}, {"start": 50.81, "end": 52.97, "text": "But Friday itself was a down day.", "zh": "但周五本身是下跌的一天。"}, {"start": 52.97, "end": 67.08, "text": "Yes, and a broad one. The Dow fell 1.23% to 52,215.16. The S&P 500 fell 0.52% to 7,623.68.", "zh": "是的，而且跌面很广。道指下跌1.23%，至52215.16点。标普500下跌0.52%，至7623.68点。"}, {"start": 67.08, "end": 68.76, "text": "The Nasdaq held up better?", "zh": "纳指表现好一些？"}, {"start": 68.76, "end": 85.51, "text": "Relatively. The Nasdaq Composite fell 0.21%, and the Russell 2000 fell 0.29%. For the week, the S&P lost 0.5% and the Nasdaq 0.7%, while the Dow gained 0.4%.", "zh": "相对而言。纳斯达克综合指数跌0.21%，罗素2000跌0.29%。全周来看，标普跌0.5%，纳指跌0.7%，而道指涨0.4%。"}, {"start": 85.51, "end": 88.22, "text": "What made Friday different from the earlier selloffs?", "zh": "周五和之前的抛售有什么不同？"}, {"start": 88.22, "end": 97.06, "text": "The selloff broadened beyond technology. Defensives fell too, so there was nowhere obvious to hide. That is why Monday's bounce should not be read as risk-on.", "zh": "抛售扩散到了科技股之外。防御股也跌了，所以没有明显的避风港。这就是为什么周一的反弹不应被解读为风险偏好回归。"}, {"start": 97.06, "end": 99.34, "text": "What about volatility and rates?", "zh": "波动率和利率呢？"}, {"start": 99.34, "end": 109.25, "text": "The VIX closed Friday at 19.45. Realized volatility is only around 10–12%, so the market is paying up for event risk that has not arrived yet.", "zh": "VIX周五收于19.45。实际波动率只有10%到12%左右，所以市场正在为尚未到来的事件风险支付溢价。"}, {"start": 109.25, "end": 110.33, "text": "And yields?", "zh": "收益率呢？"}, {"start": 110.33, "end": 116.21, "text": "The 10-year Treasury yield ended Friday around 4.99–5.00%.", "zh": "10年期国债收益率周五收于4.99%至5.00%左右。"}, {"start": 116.21, "end": 118.49, "text": "Asia overnight was mixed, was it not?", "zh": "隔夜亚洲市场涨跌互现，对吧？"}, {"start": 118.49, "end": 130.8, "text": "Yes. Japan's Nikkei fell 0.80%, on chip selling. Korea's KOSPI fell 1.46%, with net foreign selling of ₩816.5B.", "zh": "是的。日本日经指数因芯片股抛售下跌0.80%。韩国综合指数下跌1.46%，外资净卖出8165亿韩元。"}, {"start": 130.8, "end": 132.29, "text": "But China was higher?", "zh": "但中国市场上涨了？"}, {"start": 132.29, "end": 137.45, "text": "Shanghai rose 0.19% and Hong Kong rose 0.51%.", "zh": "上证涨0.19%，恒生涨0.51%。"}, {"start": 137.45, "end": 139.37, "text": "Memory was the bright spot again.", "zh": "存储又是亮点。"}, {"start": 139.37, "end": 152.76, "text": "Yes. Micron was up 1.38% pre-market, to $889.66. SK Hynix's American listing was up 2.86%, and SanDisk was up 1.32%.", "zh": "是的。美光盘前涨1.38%，至889.66美元。SK海力士美股上市涨2.86%，闪迪涨1.32%。"}, {"start": 152.76, "end": 154.8, "text": "What is behind the memory strength?", "zh": "存储走强的原因是什么？"}, {"start": 154.8, "end": 165.53, "text": "Tight pricing, and TrendForce expects fourth-quarter DRAM prices up 20% from the third quarter. But SanDisk reports earnings on Thursday, so that caps how far to chase the move.", "zh": "价格紧张，TrendForce预计四季度DRAM价格比三季度涨20%。但闪迪周四公布财报，这限制了追涨的空间。"}, {"start": 165.53, "end": 167.16, "text": "And Korea more broadly?", "zh": "韩国市场整体呢？"}, {"start": 167.16, "end": 174.96, "text": "Korea is weak into its own earnings. The KOSPI proxy is negative, and SK Hynix reports on Wednesday, with a possible shareholder-return announcement.", "zh": "韩国市场在自身财报前走弱。韩国综合指数相关的基金表现偏负，SK海力士周三公布财报，可能同时宣布股东回报。"}, {"start": 174.96, "end": 177.24, "text": "Possible, meaning unconfirmed?", "zh": "可能，意思是还没确认？"}, {"start": 177.24, "end": 186.84, "text": "Exactly, and this is important. A reported special dividend of around $12B for SK Hynix is UNCONFIRMED. Treat it as a rumor until the company says it.", "zh": "正是如此，这一点很重要。据传SK海力士约120亿美元的特别股息尚未确认。在公司正式宣布之前，只能当作传闻。"}, {"start": 186.84, "end": 189.31, "text": "That brings us to the big question of the week.", "zh": "这就说到本周的大问题了。"}, {"start": 189.31, "end": 204.43, "text": "The AI-financing question. Hyperscaler capital spending is around $800B in 2026, and one estimate puts it above $7T from 2025 to 2030, with negative free cash flow until at least next year.", "zh": "AI融资问题。超大规模厂商2026年资本开支约8000亿美元，有估计认为2025至2030年将超过7万亿美元，且自由现金流至少到明年都为负。"}, {"start": 204.43, "end": 205.99, "text": "So the question flipped.", "zh": "所以问题变了。"}, {"start": 205.99, "end": 219.12, "text": "Yes, from how fast can they build, to who pays, with what cash flow, and at what borrowing cost. A weekend post about neocloud funding knocked CoreWeave and Nebius about 3% lower pre-market.", "zh": "是的，从能建多快，变成了谁来买单、用什么现金流、以什么融资成本。周末一则关于新云厂商融资的帖子让CoreWeave和Nebius盘前跌约3%。"}, {"start": 219.12, "end": 220.75, "text": "Wednesday is the hinge, then.", "zh": "那么周三就是关键。"}, {"start": 220.75, "end": 231.79, "text": "Wednesday is the hinge. The Federal Reserve decision is at 14:00 ET, with Chair Warsh speaking at 14:30. After the close, Microsoft and Alphabet report earnings.", "zh": "周三就是关键。美联储决议在东部时间下午2点，Warsh主席2点半讲话。收盘后，微软和Alphabet公布财报。"}, {"start": 231.79, "end": 233.59, "text": "What are the expectations there?", "zh": "市场对它们的预期是什么？"}, {"start": 233.59, "end": 248.16, "text": "Microsoft is expected to earn $4.71 a share on about $90.63B of revenue. Alphabet is expected to earn $3.03 on about $127.91B.", "zh": "微软预期每股盈利4.71美元，收入约906.3亿美元。Alphabet预期每股盈利3.03美元，收入约1279.1亿美元。"}, {"start": 248.16, "end": 249.31, "text": "And Thursday?", "zh": "周四呢？"}, {"start": 249.31, "end": 259.46, "text": "Thursday brings advance third-quarter GDP, expected around 3%, plus September PCE inflation, and after the close, Amazon and SanDisk report.", "zh": "周四有提前公布的三季度GDP，预期约3%，还有9月PCE通胀，收盘后亚马逊和闪迪公布财报。"}, {"start": 259.46, "end": 262.46, "text": "Two overnight shocks are still repricing, right?", "zh": "两个隔夜冲击还在重定价，对吧？"}, {"start": 262.46, "end": 279.5, "text": "Yes. First, Brazil. Lula won the runoff with about 51.8%, against about 48.2%. The Brazil fund's pre-market range of −19% to −27% is an UNVERIFIED single print, so do not trade on it alone.", "zh": "是的。第一是巴西。卢拉以约51.8%赢得第二轮，对手约48.2%。巴西基金盘前-19%至-27%的区间是未经核实的单一数据，不要仅凭它交易。"}, {"start": 279.5, "end": 280.75, "text": "And the second shock?", "zh": "第二个冲击呢？"}, {"start": 280.75, "end": 294.96, "text": "SpaceX. A reported $40B GPU debt deal is UNRESOLVED, with reports disagreeing on whether it is closed or not yet priced. Separately, the SpaceX-linked fund has 328.4M shares unlocking today.", "zh": "SpaceX。据传400亿美元的GPU债务交易尚未定论，各方报道对是否已完成或尚未定价存在分歧。另外，与SpaceX相关的基金今天有3.284亿股解禁。"}, {"start": 294.96, "end": 297.31, "text": "Meta also had a confusing headline.", "zh": "Meta也有一个令人困惑的消息。"}, {"start": 297.31, "end": 313.34, "text": "Yes. A reported Meta equity raise has CONFLICTING figures, $22.5B versus $95B. That is UNCONFIRMED, and a single-source pre-market gain of 2.61% should be treated with the same caution.", "zh": "是的。据传Meta的股权融资数字相互冲突，225亿美元对950亿美元。这是未经确认的，单一来源的盘前2.61%涨幅也应同样谨慎对待。"}, {"start": 313.34, "end": 318.79, "text": "Now the strategy part. This brief is read-only, but what posture does it describe?", "zh": "现在说策略部分。这份简报是只读的，但它描述了什么姿态？"}, {"start": 318.79, "end": 332.16, "text": "Spreads only, 14–30 days to expiry, far strikes, wide wings, and small size. Take profit at 50–70% of the credit, and keep any single trade's maximum loss to 1–2%.", "zh": "只做价差，14至30天到期，远离行权价，宽翼，小仓位。止盈为权利金的50%至70%，任何单笔交易的最大亏损控制在1%至2%。"}, {"start": 332.16, "end": 334.03, "text": "Why the extra caution this week?", "zh": "为什么本周要格外谨慎？"}, {"start": 334.03, "end": 345.48, "text": "Because volatility is elevated and the event wall is binary. If you sell premium at all, the cleaner expression is to sell it after the event wall where possible, or to size it so a Wednesday gap does not matter.", "zh": "因为波动率高企，而且事件墙是二元的。如果一定要卖权利金，更干净的做法是尽可能在事件墙过去之后再卖，或者把仓位小到周三跳空也无所谓。"}, {"start": 345.48, "end": 346.73, "text": "And KORU?", "zh": "KORU呢？"}, {"start": 346.73, "end": 359.88, "text": "The playbook default for KORU remains a bear call spread, given its very high volatility and overnight gap risk. Selling the rip into Wednesday's close, rather than selling strength on Monday morning, is the cleaner version of the same view.", "zh": "根据策略手册，KORU的默认策略仍是熊市看涨价差，因为其波动率非常高且有隔夜跳空风险。在周三收盘前卖涨势，比周一早上卖强势是更干净的同一种看法。"}, {"start": 359.88, "end": 362.64, "text": "So, to recap Monday in one sentence?", "zh": "那么，用一句话总结周一？"}, {"start": 362.64, "end": 373.39, "text": "A relief bounce on softer oil, into a week where Wednesday's Fed decision and Microsoft and Alphabet earnings will decide whether the AI financing repricing continues or pauses.", "zh": "油价回落带来一次缓解反弹，而本周周三的美联储决议和微软、Alphabet财报，将决定AI融资重定价是继续还是暂停。"}, {"start": 373.39, "end": 379.51, "text": "Thanks for listening. This was a market research summary only, not investment advice, and not a trade recommendation.", "zh": "谢谢收听。这只是市场研究总结，不是投资建议，也不是交易推荐。"}, {"start": 379.51, "end": 388.2, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "对于只有券商才能确认的事情，比如持仓、到期、行权或保证金，请查看你的券商App。我们下期简报再见。"}, {"start": 388.2, "end": 389.21, "text": "See you then.", "zh": "再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
