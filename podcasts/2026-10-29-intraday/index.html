<script>
const LINES=[{"start": 0.0, "end": 5.28, "text": "Welcome to the U.S. Stocks Intraday Brief, for Thursday, October twenty ninth. I am Alex.", "zh": "欢迎收听美国股市盘中简报，2026年10月29日星期四。我是 Alex。"}, {"start": 5.28, "end": 13.85, "text": "And I am Jordan. This is the mid-session edition, recorded around eleven thirty Eastern. It is pure market research: no account data, and no trading orders.", "zh": "我是 Jordan。这是盘中版，美东时间约11点半录制，纯市场研究：没有账户数据，也没有下单。"}, {"start": 13.85, "end": 21.22, "text": "The headline today is one question: is AI spending paying for itself? Alphabet just failed that test in public.", "zh": "今天的核心问题只有一个：AI 支出到底能不能赚钱？Alphabet 刚刚公开交了不及格的答卷。"}, {"start": 21.22, "end": 35.54, "text": "Alphabet fell eleven and a half percent intraday, to about two hundred eighty five dollars. Revenue was one hundred twenty seven point six billion dollars, a miss, and earnings were two dollars twelve cents, well below the three dollars two cents expected.", "zh": "Alphabet 盘中跌11.5%，约285美元。营收1276亿美元不及预期，每股收益2.12美元，远低于预期的3.02美元。"}, {"start": 35.54, "end": 46.42, "text": "Search advertising grew only twelve percent, to sixty three point three five billion dollars, missing expectations. The company said its AI Mode monetizes below traditional search.", "zh": "搜索广告仅增长12%，至633.5亿美元，不及预期。公司表示 AI Mode 的变现能力低于传统搜索。"}, {"start": 46.42, "end": 53.98, "text": "Cloud was the bright spot, more than doubling, up one hundred three percent to thirty point seven billion dollars. But it was not enough.", "zh": "云业务是亮点，翻了一倍多，增长103%至307亿美元。但这还不够。"}, {"start": 53.98, "end": 67.82, "text": "Free cash flow was negative nine point zero seven billion dollars, a second straight negative quarter. Capital spending hit fifty one point three six billion dollars, and management said twenty twenty seven spending will increase significantly.", "zh": "自由现金流为负90.7亿美元，已是连续第二个季度为负。资本支出达513.6亿美元，管理层还表示2027年支出将显著增加。"}, {"start": 67.82, "end": 76.46, "text": "Earnings were also hit by an eight point six six billion dollar equity investment loss, largely linked to SpaceX, which the company describes as noncash.", "zh": "财报还受到86.6亿美元股权投资亏损的拖累，主要与 SpaceX 相关，公司称其为非现金项目。"}, {"start": 76.46, "end": 81.82, "text": "If the drop holds, it would be Alphabet's steepest one-day fall in seventy nine months.", "zh": "如果跌幅保持到收盘，这将是 Alphabet 79个月以来最大的单日跌幅。"}, {"start": 81.82, "end": 93.82, "text": "Now the company that passed the same test: Microsoft. Revenue of ninety two point three billion dollars, up nineteen percent, and earnings of four dollars eighty nine cents, both beating expectations.", "zh": "再说通过同一考验的公司：微软。营收923亿美元，增长19%，每股收益4.89美元，均超预期。"}, {"start": 93.82, "end": 104.9, "text": "Azure grew forty eight percent to thirty three point two billion dollars, and next quarter's Azure growth is guided at forty nine to fifty percent. Free cash flow was eighteen point six billion dollars.", "zh": "Azure 增长48%至332亿美元，下季度 Azure 增速指引为49%至50%。自由现金流186亿美元。"}, {"start": 104.9, "end": 117.34, "text": "And yet Microsoft still faded. It rose about five percent after hours, then fell to minus one point four nine percent intraday. The tape is not rewarding beats today; it is repricing the whole AI bill.", "zh": "然而微软还是回落了。盘后一度涨约5%，盘中却跌至-1.49%。今天的市场不是在奖励超预期的财报，而是在重估整个 AI 账单。"}, {"start": 117.34, "end": 124.85, "text": "Microsoft also announced its first U.S. bond sale since twenty seventeen, at least twenty five billion dollars, to fund the AI buildout.", "zh": "微软还宣布了自2017年以来首次美国债券发行，至少250亿美元，用于 AI 建设。"}, {"start": 124.85, "end": 136.32, "text": "The broad tape shows the split. The S P Y is roughly flat, down point zero four percent, while the Q Q Q is down about one point three percent, below all its key moving averages.", "zh": "大盘呈现分化：SPY 基本持平，跌0.04%；QQQ 跌约1.3%，已跌破全部关键均线。"}, {"start": 136.32, "end": 145.85, "text": "Small caps are the refuge. The I W M is up one point three two percent, and Walmart is up one point eight one percent on defensive rotation, with no company news at all.", "zh": "小盘股成了避风港：IWM 涨1.32%，沃尔玛在没有任何公司消息的情况下，靠防御性轮动涨1.81%。"}, {"start": 145.85, "end": 155.86, "text": "Meta is also bucking the decline, up two point five percent, rebounding after a fifteen percent slide over the past month. Apple is up one point four two percent.", "zh": "Meta 也逆势上涨2.5%，此前一个月已跌15%，正在反弹。苹果涨1.42%。"}, {"start": 155.86, "end": 160.61, "text": "Tesla is holding up too, up point four one percent, with no notable news today.", "zh": "特斯拉也表现坚挺，涨0.41%，今天没有重要消息。"}, {"start": 160.61, "end": 171.22, "text": "Let's turn to macro. The Federal Reserve held rates at three point seven five to four percent on Wednesday, by a ten to two vote. Two officials dissented in favor of an immediate hike.", "zh": "再看宏观。美联储周三维持利率在3.75%至4%，以10比2通过，两位官员因主张立即加息而投了反对票。"}, {"start": 171.22, "end": 178.97, "text": "December hike odds are now priced near eighty three to eighty five percent. The story is hike risk, not rate cut expectations.", "zh": "12月加息概率现已定价在83%至85%附近。当前的故事是加息风险，而不是降息预期。"}, {"start": 178.97, "end": 188.98, "text": "This morning's data dump was mixed. Third quarter G D P grew three point four percent annualized, beating expectations, driven by consumer spending and AI-related investment.", "zh": "今早的数据喜忧参半：三季度 GDP 年化增长3.4%，超预期，由消费支出和 AI 相关投资推动。"}, {"start": 188.98, "end": 198.89, "text": "But September inflation stayed sticky. Headline P C E was three point six percent year over year, and core was three point one percent, both essentially in line with expectations.", "zh": "但9月通胀依然顽固：PCE 总体同比3.6%，核心同比3.1%，基本符合预期。"}, {"start": 198.89, "end": 213.94, "text": "Energy is the wedge. Gasoline rose nine point two percent in the month, and thirty five point four percent year over year. Personal income rose only point two percent, and the saving rate fell to three point eight percent, the lowest since October twenty twenty two.", "zh": "能源是分化点：汽油单月涨9.2%，同比涨35.4%。个人收入仅增0.2%，储蓄率降至3.8%，为2022年10月以来最低。"}, {"start": 213.94, "end": 223.7, "text": "Initial jobless claims were one hundred ninety four thousand, better than expected. Growth is not the problem; inflation is not cooling fast, and the consumer's buffer is thinning.", "zh": "初请失业金人数为19.4万，好于预期。问题不在增长，而在于通胀降温不够快，消费者的缓冲正在变薄。"}, {"start": 223.7, "end": 234.98, "text": "In Europe, the E C B held its deposit rate at two point five percent. The bigger story is succession: President Christine Lagarde announced she will leave on February seventh, twenty twenty seven.", "zh": "欧洲方面，欧洲央行维持存款利率2.5%不变。更大的新闻是人事：行长拉加德宣布将于2027年2月7日离任。"}, {"start": 234.98, "end": 246.98, "text": "The ten year Treasury is near five percent, straddling it through the morning, and the dollar is near one hundred two point two. Gold is around four thousand to four thousand sixty seven dollars, giving back part of its recent run.", "zh": "10年期美债收益率在5%附近徘徊，美元约102.2，黄金在4027至4067美元之间，回吐了部分近期涨幅。"}, {"start": 246.98, "end": 260.71, "text": "Oil is still above one hundred dollars. The premium is Middle East supply risk: Houthi attacks on Saudi energy infrastructure continue, though Saudi defenses intercepted a missile aimed at the Eastern Province early Thursday, with no damage reported.", "zh": "油价仍高于100美元，溢价来自中东供应风险：胡塞武装对沙特能源设施的袭击仍在继续，不过沙特防空系统周四清晨拦截了一枚射向东部省的导弹，未造成损失。"}, {"start": 260.71, "end": 275.88, "text": "One quiet divergence is worth noting. Treasury volatility is near one hundred four, its highest since March, while equity volatility sits near yearly lows. The rates market, not the stock market, is carrying the inflation worry.", "zh": "一个安静的分化值得注意：美债波动率约104，为3月以来最高，而股市波动率却接近年内低点。承担通胀担忧的是利率市场，而不是股市。"}, {"start": 275.88, "end": 283.08, "text": "Now Korea. The KOSPI closed down one point two four percent, giving back six thousand just one day after reclaiming it.", "zh": "再看韩国：KOSPI 收跌1.24%，在重新站上6000点仅一天后又失守了。"}, {"start": 283.08, "end": 295.13, "text": "Samsung's detailed results disappointed: net profit missed consensus, and shareholder return details were deferred to a board meeting in late January twenty twenty seven. Samsung fell four to six percent in Seoul.", "zh": "三星的详细财报令人失望：净利润不及预期，股东回报细节推迟到2027年1月底的董事会。三星在首尔跌4%至6%。"}, {"start": 295.13, "end": 303.0, "text": "SK Hynix was the exception, up two point six two percent in Seoul on its record quarter and a buyback of about twenty trillion won.", "zh": "SK海力士是例外，凭借创纪录的季度业绩和约20万亿韩元的回购，在首尔涨2.62%。"}, {"start": 303.0, "end": 313.97, "text": "For the watchlist, that means KORU is down seven point two two percent intraday, to about twelve dollars seventy nine cents, one day after a sixteen point one nine percent Wednesday close.", "zh": "对自选股而言，这意味着 KORU 盘中跌7.22%，约12.79美元，而周三收盘时它刚涨了16.19%。"}, {"start": 313.97, "end": 325.25, "text": "That two-way gap regime is exactly what the strategy playbook prices. KORU's annualized volatility is about one hundred ninety three percent, and sixty three percent of days move more than five percent.", "zh": "这种双向跳空正是策略手册所定价的 regime：KORU 年化波动率约193%，63%的交易日波动超过5%。"}, {"start": 325.25, "end": 336.0, "text": "Memory in the U.S. faded with Samsung. Micron is down three point two seven percent, and SanDisk is down two point seven one percent, ahead of its earnings after the close tonight.", "zh": "美国存储股也随三星回落：美光跌3.27%，闪迪跌2.71%，而闪迪今晚收盘后就要公布财报。"}, {"start": 336.0, "end": 348.79, "text": "Nvidia is down point seven eight percent and A M D down one point one two percent, with no company news for either today. The chip tape is weak, and software de-rated too, with some names down twenty percent or more pre-market.", "zh": "英伟达跌0.78%，AMD 跌1.12%，两家今天都没有公司消息。芯片板块整体疲软，软件股也遭到重估，个别名字盘前跌20%以上。"}, {"start": 348.79, "end": 361.08, "text": "The three times tech funds show the same tape. SOXL is down three point three eight percent, TECL down three point five percent, and T Q Q Q down three point nine two percent.", "zh": "三倍科技 ETF 走势一致：SOXL 跌3.38%，TECL 跌3.50%，TQQQ 跌3.92%。"}, {"start": 361.08, "end": 371.69, "text": "Biotech is the other side of the rotation. LABU is up three point three eight percent, and Moderna is up two point eight eight percent, after full trial data confirmed August's positive results.", "zh": "生物科技是轮动的另一面：LABU 涨3.38%，Moderna 涨2.88%，此前完整试验数据证实了8月的积极结果。"}, {"start": 371.69, "end": 383.86, "text": "Volatility itself faded after the open. UVXY is down two point five seven percent, even with Alphabet down eleven and a half percent. The selloff is being treated as stock-specific, not systemic.", "zh": "波动率本身在开盘后回落：UVXY 跌2.57%，尽管 Alphabet 跌了11.5%。市场把这次抛售看作个股问题，而非系统性问题。"}, {"start": 383.86, "end": 393.58, "text": "Gold miners fell with gold. G D X is down two point six six percent. Strategy is down one point one eight percent, with Bitcoin soft, ahead of its earnings tonight.", "zh": "金矿股随黄金下跌：GDX 跌2.66%。Strategy 跌1.18%，比特币疲软，而它今晚也要公布财报。"}, {"start": 393.58, "end": 403.97, "text": "Palantir is down one point two seven percent with no company news, just valuation commentary. Bloom Energy is down point six six percent, drifting with the AI power tape.", "zh": "Palantir 跌1.27%，没有公司消息，只有估值方面的评论。Bloom Energy 跌0.66%，随 AI 电力板块漂移。"}, {"start": 403.97, "end": 411.48, "text": "AppLovin is down point eight eight percent, a mild tech tape drag, with its lawsuit overhang and November fourth earnings unchanged.", "zh": "AppLovin 跌0.88%，受科技板块拖累，诉讼阴影和11月4日的财报未变。"}, {"start": 411.48, "end": 422.33, "text": "Space Exploration, the watchlist's space name, is down point five eight percent on no specific news. Its ticker identity is ambiguous across data vendors, so we use the watchlist label.", "zh": "自选股中的航天名字 Space Exploration 跌0.58%，没有具体消息。该代码在不同数据商处的身份并不一致，我们沿用自选股标签。"}, {"start": 422.33, "end": 434.52, "text": "Now the strategy update, and this is analysis only, not a trade order. Spreads only, never naked short puts or calls, fourteen to thirty days to expiry, and exit at fifty to seventy percent of credit.", "zh": "接下来是策略更新，这只是分析，不是下单建议：只做价差，绝不裸卖看跌或看涨期权，剩余14至30天，在赚到50%至70%权利金时离场。"}, {"start": 434.52, "end": 448.97, "text": "The options market still prices tonight's binaries in full: SanDisk plus or minus eight point zero nine percent, Amazon seven point nine six percent, Intel nine point one six percent, and Strategy six point three six percent.", "zh": "期权市场仍在为今晚的财报充分定价：闪迪正负8.09%，亚马逊7.96%，英特尔9.16%，Strategy 6.36%。"}, {"start": 448.97, "end": 459.72, "text": "Selling premium at midday means collecting pre-print volatility for a post-print gap. The cleaner premium is usually the post-print volatility crush, not this morning's Alphabet-led slide.", "zh": "在午盘卖出权利金，等于用财报前的波动率去换财报后的跳空。更干净的权利金通常来自财报后的波动率崩塌，而不是今早 Alphabet 带领的下跌。"}, {"start": 459.72, "end": 474.79, "text": "For KORU, the default stays a bear call spread: ten to fifteen delta, far out of the money, three to five dollar wing width. Sell the rip, do not chase the gap, and never run cash-secured puts or a wheel on a decaying three times fund.", "zh": "对 KORU，默认仍是熊市看涨价差：10至15 delta、深度虚值、3至5美元翼宽。卖反弹，不要追跳空，绝不要对一只持续衰减的三倍基金做现金担保看跌或 wheel 策略。"}, {"start": 474.79, "end": 488.47, "text": "For LABU, the calmer three times fund, the framework is unchanged: fifteen to twenty delta strikes, slightly narrower wings than KORU, same fourteen to thirty day window. There is no new reason to add size before tonight's prints.", "zh": "对 LABU 这只更温和的三倍基金，框架不变：15至20 delta 行权价，翼宽略小于 KORU，同样是14至30天窗口。今晚财报前没有新增理由加仓。"}, {"start": 488.47, "end": 504.91, "text": "For SOXL, TECL, and T Q Q Q, use LABU-level parameters, with direction set by each underlying's trend. If selling into tonight's wall, keep strikes far, wings wide enough to survive a one-day gap, and size small.", "zh": "对 SOXL、TECL 和 TQQQ，采用 LABU 级别的参数，方向看各自标的的趋势。如果要在今晚财报墙之前卖出，行权价要远，翼宽要能承受一日跳空，仓位要小。"}, {"start": 504.91, "end": 516.12, "text": "For UVXY, only short-dated bear call spreads, or avoid it entirely. Today's fade is the expected decay path, not a new edge, and tonight's prints can invert the fade fast.", "zh": "对 UVXY，只做短期限的熊市看涨价差，或者干脆回避。今天的回落是预期的衰减路径，不是新的优势，今晚的财报可以迅速逆转它。"}, {"start": 516.12, "end": 527.4, "text": "Tonight after the close: Amazon, Intel, SanDisk, and Strategy, plus Coinbase, Gilead, Starbucks, and Rivian. Amazon's A W S growth and capital spending guide are the ones to watch.", "zh": "今晚收盘后：亚马逊、英特尔、闪迪和 Strategy，以及 Coinbase、吉利德、星巴克和 Rivian。其中亚马逊的 AWS 增速和资本支出指引最值得关注。"}, {"start": 527.4, "end": 538.73, "text": "Friday brings the Bank of Japan decision overnight, the Employment Cost Index at eight thirty Eastern, and Chicago P M I at nine forty five, plus Exxon, Chevron, and AbbVie before the open.", "zh": "周五有日本央行隔夜决议、美东8点半的就业成本指数、9点45分的芝加哥 PMI，以及开盘前埃克森美孚、雪佛龙和艾伯维的财报。"}, {"start": 538.73, "end": 548.98, "text": "Risk checkpoints into the close: watch whether the S P Y holds seven hundred sixty six, its fifty-day average, and whether the Q Q Q reclaims its seven hundred twenty four pivot.", "zh": "收盘前的风险检查点：看 SPY 能否守住766（50日均线），以及 QQQ 能否收复724的枢轴位。"}, {"start": 548.98, "end": 558.89, "text": "Watch the ten year at five percent: a sustained break above five point zero four pressures growth and gold further, while a fall back below five percent eases the tape.", "zh": "看10年期收益率在5%的位置：持续突破5.04%会进一步压制成长股和黄金，而回落到5%以下则会缓解盘面压力。"}, {"start": 558.89, "end": 570.36, "text": "Watch memory into SanDisk tonight: Micron's nine hundred forty to one thousand ten dollar base range is the line, and SanDisk's print decides whether eight hundred eighty or one thousand one hundred opens.", "zh": "看存储板块在闪迪财报前的表现：美光940至1010美元的基础区间就是界线，闪迪的财报将决定880美元还是1100美元先出现。"}, {"start": 570.36, "end": 579.29, "text": "And watch whether the Alphabet selloff stays contained. If it broadens into the close, the rotation story breaks, and tonight's prints gap the tape either way.", "zh": "还要看 Alphabet 的抛售是否保持可控。如果它在收盘前扩散，轮动故事就会破裂，而今晚的财报无论如何都会让盘面跳空。"}, {"start": 579.29, "end": 593.52, "text": "Two data notes, flagged rather than smoothed. The V I X flipped direction after the open, from up pre-market to down by mid-morning, and Alphabet's revenue basis differs across vendors: we use one hundred twenty seven point six billion dollars.", "zh": "两个数据说明，不做平滑处理：VIX 在开盘后改变了方向，从盘前上涨转为上午中段下跌；Alphabet 的营收口径在不同数据商处不一致，我们采用1276亿美元。"}, {"start": 593.52, "end": 602.28, "text": "Apple's earnings date is also unverified: one calendar lists Monday, November second, another lists it with tonight's prints. We do not assert either.", "zh": "苹果的财报日期也未核实：一个日历列为11月2日周一，另一个列在今晚的财报名单里。我们不确认任何一个。"}, {"start": 602.28, "end": 613.32, "text": "This brief is market research only, not investment advice, and not a trade recommendation. Leveraged funds reset daily and decay over holding periods; they are not buy-and-hold instruments.", "zh": "本简报仅为市场研究，不是投资建议，也不是交易推荐。杠杆基金每日重置、长期持有会衰减，不是买入持有型工具。"}, {"start": 613.32, "end": 622.08, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "对于只有券商才能确认的事情，比如持仓、到期、行权或保证金，请查看你的券商App。我们下期简报再见。"}, {"start": 622.08, "end": 622.92, "text": "See you then.", "zh": "再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
