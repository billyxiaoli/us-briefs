<script>
const LINES=[{"start": 0.0, "end": 6.18, "text": "Welcome to the United States Stocks Post Market Brief for Friday, October 23, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘后简报，2026年10月23日星期五。我是 Alex。"}, {"start": 6.72, "end": 10.48, "text": "And I'm Jordan. This is the Post Market Edition, recorded after the close,", "zh": "我是 Jordan。这是盘后版，收盘后录制，"}, {"start": 10.84, "end": 14.72, "text": "and it is pure market research. No account data, no trading orders,", "zh": "纯市场研究。没有账户数据，没有交易指令，"}, {"start": 15.26, "end": 18.6, "text": "just what happened and what to watch next. Let us start with the headline.", "zh": "只有发生了什么和接下来要关注什么。先从头条开始。"}, {"start": 19.1, "end": 28.16, "text": "It was a down day, but not a panic day. The S&P 500 closed at 7,623.68, down 0.52%.", "zh": "今天是下跌的一天，但不是恐慌的一天。标普500收于7623.68点，下跌0.52%。"}, {"start": 28.16, "end": 38.98, "text": "The NASDAQ composite was down 0.21%. The Dow Jones fell harder, down 1.23% to 52,215.16.", "zh": "纳斯达克综合指数下跌0.21%。道琼斯跌幅更大，下跌1.23%，至52215.16点。"}, {"start": 39.3, "end": 44.4, "text": "So why did the Dow fall more than the NASDAQ? Because Thursday's defensive cushion did not repeat.", "zh": "那么为什么道指跌得比纳指多？因为周四的防御性缓冲没有重现。"}, {"start": 44.94, "end": 48.66, "text": "Staples, health care, and financials all gave back their safe haven bid on Friday.", "zh": "必需消费品、医疗保健和金融股周五都回吐了避险买盘。"}, {"start": 49.28, "end": 54.22, "text": "Energy was the leader, up 2.51%, and technology eked out a small gain.", "zh": "能源股领涨，上涨2.51%，科技股勉强小涨。"}, {"start": 54.22, "end": 58.82, "text": "The story of the week is still the same. The market is repricing how the artificial", "zh": "本周的故事还是一样。市场正在重新定价人工智能建设如何融资，"}, {"start": 58.82, "end": 62.3, "text": "intelligence build out gets financed, not whether the demand exists.", "zh": "而不是需求是否存在。"}, {"start": 62.82, "end": 65.04, "text": "That brings us to volatility and rates, right?", "zh": "这就说到波动率和利率了，对吧？"}, {"start": 65.58, "end": 71.52, "text": "Yes. The VIX, the fear gauge, rose to 19.45, its second straight up day.", "zh": "是的。VIX恐慌指数升至19.45，连续第二天上涨。"}, {"start": 72.14, "end": 79.74, "text": "The 10-year treasury yield went back to 5.00%. Brent Crude settled at $116.72,", "zh": "10年期国债收益率回到5.00%。布伦特原油收于116.72美元，"}, {"start": 79.74, "end": 85.98, "text": "its highest since April. Hot oil and hot economic data together mean higher for longer.", "zh": "为4月以来最高。油价高企加上经济数据火热，意味着利率将在更长时间内保持高位。"}, {"start": 86.48, "end": 87.56, "text": "How hot was the data?", "zh": "数据有多火热？"}, {"start": 88.06, "end": 94.28, "text": "The October Flash Manufacturing Purchasing Managers Index hit 56.0, a 53-month high.", "zh": "10月制造业PMI初值达到56.0，创53个月新高。"}, {"start": 94.76, "end": 99.98, "text": "The composite index was 57.6, consistent with about 5% annualized growth.", "zh": "综合指数为57.6，相当于约5%的年化增长。"}, {"start": 100.56, "end": 104.36, "text": "But selling price inflation rose at the fastest pace in more than four years,", "zh": "但销售价格通胀以四年来最快速度上升，"}, {"start": 104.36, "end": 106.52, "text": "driven by oil costs passing through.", "zh": "主要受油价传导推动。"}, {"start": 107.26, "end": 111.9, "text": "University of Michigan's sentiment was 48.0, a beat versus expectations,", "zh": "密歇根大学消费者信心指数为48.0，好于预期，"}, {"start": 112.56, "end": 117.48, "text": "but still the second lowest on record. One-year inflation expectations were 4.7%.", "zh": "但仍是有记录以来第二低。一年期通胀预期为4.7%。"}, {"start": 118.18, "end": 123.04, "text": "So growth is strong, but inflation worry is back. What does that mean for next week?", "zh": "所以增长强劲，但通胀担忧回来了。这对下周意味着什么？"}, {"start": 123.58, "end": 128.28, "text": "It sets up a huge week. The Federal Reserve decision is Wednesday, October 28th at", "zh": "这将迎来重要的一周。美联储决议在10月28日星期三，"}, {"start": 128.28, "end": 133.74, "text": "2 o'clock p.m. Eastern Time. The market expects a hawkish hold, no new economic projections,", "zh": "东部时间下午2点。市场预期是鹰派按兵不动，没有新的经济预测，"}, {"start": 134.06, "end": 138.78, "text": "and a press conference at 2.30. The same evening after the close, Microsoft and", "zh": "2点半有新闻发布会。当晚收盘后，微软和"}, {"start": 138.78, "end": 143.9, "text": "Google report earnings. Then on Thursday, October 29th at 8.30 a.m.,", "zh": "谷歌公布财报。然后在10月29日星期四上午8点半，"}, {"start": 143.9, "end": 148.14, "text": "third quarter gross domestic product and core personal consumption expenditures arrive.", "zh": "第三季度GDP和核心PCE将公布。"}, {"start": 148.78, "end": 150.72, "text": "That is a lot to digest in two days.", "zh": "两天内要消化的信息很多。"}, {"start": 151.28, "end": 154.7, "text": "Let us talk about memory, because that was the bright spot on Friday.", "zh": "说说存储吧，因为那是周五的亮点。"}, {"start": 155.26, "end": 159.86, "text": "Yes, SK Hynix scrapped its review of a United States initial public offering for its", "zh": "是的。SK海力士取消了对其美国IPO的审查，涉及的"}, {"start": 159.86, "end": 166.5, "text": "Solidigm unit, citing deteriorating capital markets. Seoul shares rose 4.4%, and the KOSPI", "zh": "是Solidigm部门，理由是资本市场恶化。首尔股市上涨4.4%，韩国综合指数"}, {"start": 166.5, "end": 173.14, "text": "recovered from a 4.1% intraday plunge to close up 0.30%. In the United States,", "zh": "从盘中4.1%的暴跌中收复，收涨0.30%。在美国，"}, {"start": 173.5, "end": 180.78, "text": "micron rose about 2.3%. SK Hynix American listing rose 4.05%, and the leveraged Korea", "zh": "美光上涨约2.3%。SK海力士的美股上市上涨4.05%，杠杆韩国基金"}, {"start": 180.78, "end": 186.32, "text": "fund, KORU, rose 3.83%. But not every memory name won, right?", "zh": "KORU上涨3.83%。但不是所有存储股都赢了，对吧？"}, {"start": 186.88, "end": 193.38, "text": "Right. Western Digital fell 2.97%, even though it reported revenue up 55% and raised its", "zh": "对。西部数据下跌2.97%，尽管它报告收入增长55%并上调了"}, {"start": 193.38, "end": 197.9, "text": "guidance. The market did not care, because the debate is now about capital expenditure,", "zh": "指引。市场不在乎，因为现在的争论是资本开支，"}, {"start": 198.2, "end": 203.2, "text": "not just earnings. That is a key lesson from Friday. Earnings do not matter when the debate", "zh": "而不仅仅是盈利。这是周五的一个关键教训。盈利不重要，当争论"}, {"start": 203.2, "end": 206.74, "text": "is capital expenditure. The other big loser was Bloom Energy.", "zh": "是资本开支时。另一个大输家是Bloom Energy。"}, {"start": 207.3, "end": 215.54, "text": "Yes, Bloom Energy fell 11.24% to $193.30, even after a beat in a raised forecast.", "zh": "是的，Bloom Energy下跌11.24%，至193.30美元，即使在业绩超预期并上调预测之后。"}, {"start": 216.18, "end": 223.94, "text": "Revenue rose 138%, but free cash flow was negative $181 million, and operating cash", "zh": "收入增长138%，但自由现金流为负1.81亿美元，经营现金流"}, {"start": 223.94, "end": 230.7, "text": "flow was also negative. Investors sold the news. JP Morgan cut its price target from $314", "zh": "也为负。投资者抛售了这条消息。摩根大通将其目标价从314美元"}, {"start": 230.7, "end": 237.1, "text": "to $292, while keeping its overweight rating. What about the rest of the watch list?", "zh": "下调至292美元，同时维持增持评级。其他观察名单股票呢？"}, {"start": 237.6, "end": 243.98, "text": "A few quick highlights. The leveraged biotech fund, LABU, fell 4.18%, as healthcare took its turn", "zh": "快速看几个亮点。杠杆生物科技基金LABU下跌4.18%，医疗保健轮到下跌，"}, {"start": 243.98, "end": 251.84, "text": "lower, with no single catalyst. The leveraged semiconductor fund, SOXL, rose 1.77%, a partial", "zh": "没有单一催化剂。杠杆半导体基金SOXL上涨1.77%，部分"}, {"start": 251.84, "end": 258.66, "text": "rebound after Thursday's steep plunge. Nvidia was down 0.59%, still chopping near one month", "zh": "反弹，此前周四大幅下跌。英伟达下跌0.59%，仍在一个月低点附近震荡。"}, {"start": 258.66, "end": 265.16, "text": "lows. Meta fell 0.96%, still digesting its first-ever negative free cash flow quarter,", "zh": "低点。Meta下跌0.96%，仍在消化其史上首次自由现金流为负的季度，"}, {"start": 265.48, "end": 272.38, "text": "and a much higher capital expenditure plan. Apple was almost flat, down 0.14%. On the day,", "zh": "以及大幅提高的资本开支计划。苹果几乎持平，下跌0.14%。当天，"}, {"start": 272.46, "end": 277.48, "text": "its new foldable iPhone went on sale, and briefly reclaimed the title of the world's most valuable", "zh": "其新款折叠iPhone开售，并短暂重夺全球市值最高公司的头衔"}, {"start": 277.48, "end": 283.52, "text": "company. And Moderna? Moderna fell 1.25% after Thursday's sharp fall on a leaked", "zh": "公司。Moderna呢？Moderna下跌1.25%，此前周四因泄露的"}, {"start": 283.52, "end": 289.2, "text": "Phase 3 result. The full data were due Saturday, October 24th, at 10.30 a.m. Eastern time,", "zh": "三期结果大幅下跌。完整数据定于10月24日星期六东部时间上午10点半，"}, {"start": 289.54, "end": 294.04, "text": "at the European Society for Medical Oncology meeting. That is one to watch over the weekend.", "zh": "在欧洲肿瘤内科学会会议上公布。这是周末值得关注的一件事。"}, {"start": 294.72, "end": 299.52, "text": "Now the strategy part. This brief is read only, but what posture does it describe?", "zh": "现在说策略部分。这份简报是只读的，但它描述了什么姿态？"}, {"start": 300.14, "end": 307.02, "text": "Spreads only, 14 to 30 days to expiry, far strikes, and take profit at 50 to 70%.", "zh": "只做价差，14至30天到期，远离行权价，止盈50%至70%。"}, {"start": 307.02, "end": 314.28, "text": "Do not chase either bounce. The brief calls KORU's 3.8% rip-bear call spread territory,", "zh": "不要追任何一边的反弹。简报称KORU 3.8%的上涨属于熊市看涨价差区域，"}, {"start": 314.7, "end": 319.36, "text": "according to the playbook, because of its very high volatility and overnight gap risk.", "zh": "根据策略手册，因为其波动率非常高且有隔夜跳空风险。"}, {"start": 320.28, "end": 327.0, "text": "LABU's dip needs stabilization first. In short, be patient, be selective, and keep risk defined.", "zh": "LABU的下跌需要先企稳。简而言之，要耐心、有选择性，并保持风险有定义。"}, {"start": 327.64, "end": 329.98, "text": "So, to recap Friday in one sentence.", "zh": "那么，用一句话总结周五？"}, {"start": 330.68, "end": 336.36, "text": "Rotation broadened, technology stabilized, but hot growth, hot oil, and a 5% 10-year yield", "zh": "轮动扩大，科技股企稳，但强劲增长、油价高企和5%的10年期收益率"}, {"start": 336.36, "end": 340.0, "text": "kept the market on edge ahead of the Federal Reserve and big technology earnings.", "zh": "让市场在美联储和大型科技股财报前保持紧张。"}, {"start": 340.78, "end": 344.96, "text": "Thanks for listening. This was a market research summary only, not investment advice,", "zh": "谢谢收听。这只是市场研究总结，不是投资建议，"}, {"start": 345.34, "end": 348.88, "text": "and not a trade recommendation. For anything only a broker can confirm,", "zh": "也不是交易推荐。对于只有券商才能确认的事情，"}, {"start": 349.26, "end": 354.48, "text": "like positions, expiry, assignment, or margin, check your broker app. We will be back with", "zh": "比如持仓、到期、行权或保证金，请查看你的券商App。我们下期"}, {"start": 354.48, "end": 356.08, "text": "the next brief. See you then.", "zh": "简报再见。再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speed=document.getElementById('speed'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speed.onchange=()=>{a.playbackRate=parseFloat(speed.value);};
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>

</html>
