<script>
const LINES=[{"start": 0.0, "end": 5.93, "text": "Welcome to the U.S. Stocks Post-Market Brief for Friday, October 30th, 2026. I'm Alex.", "zh": "欢迎收听2026年10月30日星期五美股盘后简报，我是Alex。"}, {"start": 5.93, "end": 11.57, "text": "And I'm Jordan. The market is closed, and this was the worst day for U.S. equities since June.", "zh": "我是Jordan。市场已经收盘，这是自6月以来美股最糟糕的一天。"}, {"start": 11.57, "end": 16.8, "text": "The headline: the AI trade failed its cash-flow test for a second straight day.", "zh": "一句话概括：AI交易连续第二天没通过现金流考验。"}, {"start": 16.8, "end": 23.95, "text": "After Alphabet's record twelve-point-six percent drop on Thursday, Amazon and Intel reported, and the verdict was the same.", "zh": "继Alphabet周四创纪录下跌12.6%之后，亚马逊和英特尔公布财报，市场的结论是一样的。"}, {"start": 23.95, "end": 32.4, "text": "Heavy spending, weakening cash generation. Intel plunged twenty-eight-point-six percent, its worst day since the 1970s.", "zh": "巨额支出加上现金流走弱。英特尔暴跌28.6%，创下自20世纪70年代以来最糟糕的一天。"}, {"start": 32.4, "end": 43.56, "text": "The S&P 500 finished at 7,580, down one-point-eight-two percent. The Nasdaq fell two-point-eight-six percent to 25,437.", "zh": "标普500收于7580点，跌1.82%。纳斯达克跌2.86%至25437点。"}, {"start": 43.56, "end": 51.89, "text": "The Nasdaq 100 dropped three-point-four-six percent and is now in a technical correction. The Dow fell one-point-zero-nine percent.", "zh": "纳斯达克100指数跌3.46%，已进入技术性调整。道指跌1.09%。"}, {"start": 51.89, "end": 61.49, "text": "One item to flag as unconfirmed: the S&P close itself is disputed. One source prints 7,561 instead of 7,580.", "zh": "需要标注为未确认的一点：标普收盘价本身存在争议。有一家来源报7561点，而不是7580点。"}, {"start": 61.49, "end": 70.44, "text": "Volatility jumped. The VIX rose about thirteen percent to roughly 19.4, but one source prints 20.3. That is also unconfirmed.", "zh": "波动率跳升。VIX上涨约13%至19.4附近，但有一家来源报20.3，这同样未确认。"}, {"start": 70.44, "end": 75.67, "text": "We use 19 to 20 as the range, and flag both numbers rather than pretend one is certain.", "zh": "我们采用19到20这个区间，并同时标注这两个数字，而不是假装其中一个是确定的。"}, {"start": 75.67, "end": 82.2, "text": "The ten-year yield fell six basis points to 4.93 percent, a classic risk-off bid into bonds.", "zh": "十年期美债收益率跌6个基点至4.93%，是典型的避险资金流入债市。"}, {"start": 82.2, "end": 89.83, "text": "Gold fell two-point-nine-seven percent to 3,884 dollars and 90 cents. Silver fell four-point-two-nine percent.", "zh": "黄金跌2.97%至每盎司3884.90美元，白银跌4.29%。"}, {"start": 89.83, "end": 95.54, "text": "Gold falling while Treasuries rallied points to broad liquidation, not a simple flight to safety.", "zh": "黄金与国债反向而行，说明这是普遍的抛售，而不是简单的避险。"}, {"start": 95.54, "end": 103.06, "text": "Oil stayed above 100 dollars. WTI closed at 102 dollars and 95 cents after the tanker attack in the Strait of Hormuz.", "zh": "油价守在100美元上方。WTI收于102.95美元，此前霍尔木兹海峡发生油轮袭击。"}, {"start": 103.06, "end": 113.42, "text": "Bitcoin traded below 77,000 dollars, around 76,700, after reports of a massive hack at Binance. That hack is reported, not yet fully verified.", "zh": "比特币在币安遭大规模黑客攻击的消息后跌破77000美元，在76700美元附近。该事件是已报道的消息，尚未完全核实。"}, {"start": 113.42, "end": 122.02, "text": "Now the cash-flow story. Alphabet's free cash flow was negative 9.1 billion dollars after 51.4 billion in capex.", "zh": "现在讲现金流的故事。Alphabet在514亿美元资本开支之后，自由现金流为负91亿美元。"}, {"start": 122.02, "end": 133.49, "text": "Revenue grew 25 percent, but missed estimates, and management held a 195 to 205 billion capex range for 2026, with a big step-up in 2027.", "zh": "营收增长25%，但不及预期，管理层维持2026年1950亿至2050亿美元的资本开支区间，并表示2027年将大幅增加。"}, {"start": 133.49, "end": 141.48, "text": "Amazon reported a third straight quarter of negative free cash flow, while keeping a 220 billion dollar capex plan for 2026.", "zh": "亚马逊连续第三个季度自由现金流为负，同时维持2026年2200亿美元的资本开支计划。"}, {"start": 141.48, "end": 149.64, "text": "Microsoft was the exception. Azure grew 48 percent and free cash flow stayed positive at about 18.6 billion dollars.", "zh": "微软是例外。Azure增长48%，自由现金流保持正值，约186亿美元。"}, {"start": 149.64, "end": 155.83, "text": "The market's verdict is now explicit: spending is not disqualifying, but the cash has to keep flowing.", "zh": "市场的判断现在已经很明确：花钱本身不是问题，但现金必须持续流入。"}, {"start": 155.83, "end": 165.38, "text": "Intel's guidance triggered the semiconductor collapse. Fourth-quarter revenue of 15 to 16 billion, earnings of 25 cents, both below expectations.", "zh": "英特尔的指引是半导体崩盘的导火索。四季度营收150亿至160亿美元，每股收益0.25美元，均低于预期。"}, {"start": 165.38, "end": 172.58, "text": "Management cited PC softness, rising memory prices hurting PC demand, and an accident at its Israeli plant.", "zh": "管理层提到PC疲软、内存涨价压制PC需求，以及以色列工厂发生事故。"}, {"start": 172.58, "end": 181.82, "text": "The Philadelphia Semiconductor Index fell roughly 8 to 10 percent intraday. AMD dropped ten-point-nine percent. Micron fell five-point-three.", "zh": "费城半导体指数盘中跌约8%到10%。AMD跌10.9%，美光跌5.3%。"}, {"start": 181.82, "end": 191.54, "text": "SanDisk is the day's clearest good-news, bad-price case. It beat earnings, raised guidance, announced an eight-for-one split, and still fell thirteen-point-five percent.", "zh": "闪迪是今天最典型的“好消息、坏价格”案例。业绩超预期、上调指引、宣布1拆8，股价仍然跌了13.5%。"}, {"start": 191.54, "end": 200.11, "text": "Analysts flagged valuation after a rally of more than 300 percent this year. Bank of America cut its target to 2,000 dollars, but kept a buy.", "zh": "分析师认为年内涨超300%后估值过高。美国银行将目标价下调至2000美元，但维持买入评级。"}, {"start": 200.11, "end": 209.95, "text": "SK Hynix fell seven-point-nine-five percent, even though it reported record third-quarter results two days earlier, with operating profit up 632 percent.", "zh": "SK海力士跌7.95%，尽管它两天前刚公布创纪录的三季度业绩，营业利润增长632%。"}, {"start": 209.95, "end": 217.34, "text": "In Seoul, the KOSPI fell three-point-four-eight percent, and the exchange triggered a rare five-minute sell-side trading halt.", "zh": "在首尔，KOSPI跌3.48%，交易所触发了罕见的五分钟卖方交易熔断。"}, {"start": 217.34, "end": 223.87, "text": "Now the watchlist, all 24 names. Twenty-one fell, one rose, two were near flat.", "zh": "现在看自选股，全部24只：21只下跌，1只上涨，2只基本持平。"}, {"start": 223.87, "end": 232.58, "text": "The 3x leveraged ETFs took the worst damage. SOXL fell twenty-four-point-seven-five percent to 77 dollars and 5 cents.", "zh": "3倍杠杆ETF受创最重。SOXL跌24.75%至77.05美元。"}, {"start": 232.58, "end": 241.87, "text": "KORU, the 3x Korea bull, fell sixteen-point-five percent to 10 dollars and 63 cents. It is down almost 50 percent in a month.", "zh": "3倍做多韩国的KORU跌16.5%至10.63美元，一个月内跌了近50%。"}, {"start": 241.87, "end": 252.62, "text": "TECL fell fourteen-point-eight percent. TQQQ fell ten-point-four-seven. LABU fell three-point-seven-nine, the mildest of the 3x names.", "zh": "TECL跌14.8%，TQQQ跌10.47%，LABU跌3.79%，是3倍ETF中跌幅最小的。"}, {"start": 252.62, "end": 260.23, "text": "UVXY, the volatility product, rose fifteen-point-four percent to 19 dollars and 33 cents. The hedge worked.", "zh": "波动率产品UVXY涨15.4%至19.33美元，对冲起到了作用。"}, {"start": 260.23, "end": 267.74, "text": "Nvidia fell four-point-two-two percent to 204 dollars and 64 cents, but held above the 200 dollar level.", "zh": "英伟达跌4.22%至204.64美元，但守住了200美元关口。"}, {"start": 267.74, "end": 276.43, "text": "Palantir fell six-point-two-seven percent into its Monday earnings, despite JPMorgan's new overweight rating and a 262 dollar target.", "zh": "Palantir在周一财报前跌6.27%，尽管摩根大通刚给予增持评级，目标价262美元。"}, {"start": 276.43, "end": 284.71, "text": "Apple fell one-point-two-three percent ahead of its Monday report. Tesla fell just zero-point-eight-seven percent, the most resilient mega-cap.", "zh": "苹果在周一财报前跌1.23%。特斯拉只跌0.87%，是大型股中最抗跌的。"}, {"start": 284.71, "end": 291.6, "text": "Walmart was the watchlist's only gainer, up one-point-eight-six percent on defensive rotation. Moderna was near flat.", "zh": "沃尔玛是自选股中唯一上涨的，涨1.86%，受益于防御性轮动。Moderna基本持平。"}, {"start": 291.6, "end": 299.76, "text": "Strategy fell seven-point-eight-four percent with bitcoin. Gold miners fell five-point-two-one percent, harder than gold itself.", "zh": "Strategy随比特币跌7.84%。金矿股跌5.21%，跌幅超过黄金本身。"}, {"start": 299.76, "end": 311.09, "text": "One more unconfirmed item: the SPCX close varies by provider, around 134 dollars and 70 cents, down about six-point-four percent. Treat that as approximate.", "zh": "还有一个未确认项：SPCX的收盘价因数据商而异，约134.70美元，跌约6.4%，请按近似值看待。"}, {"start": 311.09, "end": 319.2, "text": "After hours, the tape was quiet. Most names were up zero-point-one to zero-point-five percent, and none moved more than half a percent.", "zh": "盘后市场很平静。大多数股票上涨0.1%到0.5%，没有一只波动超过0.5%。"}, {"start": 319.2, "end": 326.11, "text": "On macro: the Fed held rates at three-point-seven-five to four percent this week, with two dissenters favouring a hike now.", "zh": "宏观方面：美联储本周维持利率在3.75%至4%，两位委员主张立即加息。"}, {"start": 326.11, "end": 335.28, "text": "On Friday, Dallas Fed President Logan said the FOMC needs at least two more 25-basis-point hikes. St. Louis President Musalem agreed.", "zh": "周五，达拉斯联储主席Logan表示FOMC至少还需要两次25个基点的加息。圣路易斯联储主席Musalem也表示赞同。"}, {"start": 335.28, "end": 342.24, "text": "December hike odds sit near 70 percent. Third-quarter GDP grew three-point-four percent, but inflation is sticky.", "zh": "12月加息概率接近70%。三季度GDP增长3.4%，但通胀依然顽固。"}, {"start": 342.24, "end": 350.47, "text": "The Fed's preferred PCE measure is running at three-point-six percent, core PCE at three-point-one, both well above the 2 percent target.", "zh": "美联储青睐的PCE指标为3.6%，核心PCE为3.1%，均远高于2%的目标。"}, {"start": 350.47, "end": 357.12, "text": "Strategy chapter now, and this is read-only analysis. No trading action has been taken, and no order was placed.", "zh": "现在是策略章节，这是只读分析。没有进行任何交易操作，也没有下单。"}, {"start": 357.12, "end": 366.55, "text": "The playbook is spreads only, never naked, max loss one to two percent per trade, 14 to 30 days to expiry, take profit at 50 to 70 percent of credit.", "zh": "手册规则是只做价差、绝不裸卖，单笔最大亏损1%到2%，到期14到30天，盈利达到权利金的50%到70%就止盈。"}, {"start": 366.55, "end": 374.04, "text": "Volatility is expanding, not panicking. The VIX front end inverted overnight, but credit stayed calm and the ten-year fell.", "zh": "波动率在扩张，但不是恐慌。VIX前端隔夜倒挂，但信贷保持平静、十年期收益率下跌。"}, {"start": 374.04, "end": 380.88, "text": "For KORU, the bear call spread remains the default, but Friday's close is not a rip. Sell the rip, not the crash.", "zh": "KORU方面，看跌价差仍是默认方向，但周五收盘不是反弹。卖反弹，不是卖崩盘。"}, {"start": 380.88, "end": 388.99, "text": "For SOXL, it closed below the 80 dollar invalidation line. Oversold is not a floor, and a bull put here would be catching a falling knife.", "zh": "SOXL收在80美元失效线下方。超卖不是底部，在这里做看涨价差等于接飞刀。"}, {"start": 388.99, "end": 395.66, "text": "For LABU, the trend is still intact, up 55 percent this year, but wait for the tape to stabilise before any new size.", "zh": "LABU趋势仍在，今年涨55%，但在加仓之前要等盘面企稳。"}, {"start": 395.66, "end": 403.15, "text": "For TECL and TQQQ, the bear-call side fits the downtrend, but only on a rip, with wide wings and far strikes.", "zh": "TECL和TQQQ方面，看跌价差符合下跌趋势，但只在反弹时做，用宽翼和远行权价。"}, {"start": 403.15, "end": 412.44, "text": "And UVXY: after a 15 percent day, chasing short premium into it means shorting the instrument that just proved it can spike. Avoid it.", "zh": "UVXY方面：在涨了15%之后追着卖波动率，等于做空刚刚证明自己能飙升的工具。回避它。"}, {"start": 412.44, "end": 420.29, "text": "Next week is an event wall. Monday: Apple and Palantir report after the close, plus ISM Manufacturing at 10 Eastern.", "zh": "下周是一堵事件墙。周一：苹果和Palantir盘后公布财报，美东上午10点公布ISM制造业指数。"}, {"start": 420.29, "end": 427.49, "text": "Tuesday: the U.S. midterm elections, plus AMD earnings after the close. Wednesday: Arm and Qualcomm report.", "zh": "周二：美国中期选举，AMD盘后公布财报。周三：Arm和高通公布财报。"}, {"start": 427.49, "end": 434.98, "text": "Friday brings the October jobs report, the week's most important macro release. September payrolls grew just 29,000.", "zh": "周五公布10月非农就业报告，是本周最重要的宏观数据。9月新增就业仅2.9万人。"}, {"start": 434.98, "end": 444.14, "text": "For a short-premium book, the read is smaller size, wider wings, farther strikes, and no new exposure into the event wall unless the tape first stabilises.", "zh": "对卖出权利金的组合来说，结论是：更小的仓位、更宽的翼、更远的行权价，在盘面出现企稳信号之前，不要在事件墙前新增敞口。"}, {"start": 444.14, "end": 451.22, "text": "One more note: the U.S. clocks go back on Sunday. From Monday, the U.S. open is 22:30 Beijing time.", "zh": "再提醒一点：美国周日调回冬令时。从周一起，美股开盘时间为北京时间22:30。"}, {"start": 451.22, "end": 460.1, "text": "That's the post-market brief for Friday, October 30th. A brutal close to October, a correction in the Nasdaq 100, and a week of binary events ahead.", "zh": "这就是10月30日星期五的盘后简报。10月以惨烈收尾，纳斯达克100进入调整，前方是一周的二元事件。"}, {"start": 460.1, "end": 466.9, "text": "This brief is read-only analysis. No trading action was taken and no order was placed. See you at the pre-market on Monday.", "zh": "本简报为只读分析，没有进行任何交易操作，也没有下单。周一盘前见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
