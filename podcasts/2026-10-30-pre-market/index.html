<script>
const LINES=[{"start": 0.0, "end": 5.83, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Friday, October 30, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘前简报，2026年10月30日星期五。我是 Alex。"}, {"start": 5.83, "end": 14.23, "text": "And I'm Jordan. This is pure market research, recorded before the open. No account data, no trading orders, just what is happening and what to watch.", "zh": "我是 Jordan。这是纯市场研究，开盘前录制。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 14.23, "end": 20.9, "text": "Thursday's exam is now Friday's rout. The market graded the big tech earnings harshly, and the selloff deepened overnight.", "zh": "周四的考试，如今变成了周五的溃败。市场对大型科技股财报的打分非常严厉，抛售隔夜进一步加深。"}, {"start": 20.9, "end": 33.22, "text": "Thursday's closes tell the story. The S and P 500 fell zero point three percent to seven thousand seven hundred twenty. The Nasdaq fell one point three eight percent to twenty-six thousand one hundred eighty-five.", "zh": "周四收盘讲述了故事。标普500跌0.3%，收于7720点；纳斯达克跌1.38%，收于26185点。"}, {"start": 33.22, "end": 41.74, "text": "The Dow slipped zero point two five percent to fifty-two thousand three hundred forty-three. Small caps held up, with the Russell essentially flat.", "zh": "道指微跌0.25%，收于52343点。小盘股表现坚挺，罗素指数基本持平。"}, {"start": 41.74, "end": 52.22, "text": "And Friday pre-market, the split widened. Nasdaq futures are down about two point two percent. S and P futures are down about one percent. But Dow futures are flat.", "zh": "而周五盘前，分化加剧。纳指期货跌约2.2%，标普期货跌约1%，但道指期货持平。"}, {"start": 52.22, "end": 58.9, "text": "This is a tech and AI spending repricing, not a broad market panic. The VIX is only around eighteen and a half.", "zh": "这是一场科技股和AI开支的重新定价，不是全面的市场恐慌。VIX仅在18.5左右。"}, {"start": 58.9, "end": 67.34, "text": "Start with Alphabet, the name that set the test. It fell twelve point six percent on Thursday, its steepest one-day fall on record.", "zh": "先说Alphabet，它设定了这场考验。周四它跌12.6%，创下史上最大单日跌幅。"}, {"start": 67.34, "end": 77.02, "text": "Revenue was one hundred twenty-seven point six billion dollars, but earnings per share were two dollars twelve cents, versus about three dollars expected.", "zh": "营收1276亿美元，但每股收益2.12美元，远低于约3.02美元的预期。"}, {"start": 77.02, "end": 86.3, "text": "Google Cloud more than doubled, up one hundred three percent. But search and ads missed, and capital spending hit fifty-one point four billion dollars in the quarter.", "zh": "谷歌云收入翻了一倍多，增长103%。但搜索和广告不及预期，当季资本开支达514亿美元。"}, {"start": 86.3, "end": 97.06, "text": "Free cash flow was negative nine point one billion dollars, the second straight negative quarter. The market's question is now who pays for the AI buildout, and how fast the cash comes back.", "zh": "自由现金流为负91亿美元，已是连续第二个季度为负。市场现在的问题是：谁来为AI建设买单，现金又多快能回流。"}, {"start": 97.06, "end": 105.74, "text": "Amazon failed the same test after the close. Revenue of two hundred one point nine billion dollars and earnings of one dollar eighty-nine cents both missed.", "zh": "亚马逊收盘后同样没通过这场考验。营收2019亿美元、每股收益1.89美元，双双不及预期。"}, {"start": 105.74, "end": 118.18, "text": "Amazon Web Services grew thirty-nine percent, its fastest in nearly five years. But trailing free cash flow was negative forty-two point four billion dollars, and shares are down about seven percent pre-market.", "zh": "亚马逊云服务增长39%，为近五年最快。但过去十二个月自由现金流为负424亿美元，股价盘前跌约7%。"}, {"start": 118.18, "end": 128.74, "text": "Intel became the day's second shock. It guided fourth-quarter earnings of twenty-five cents a share, versus forty-three cents expected, and warned the PC correction could last into next year.", "zh": "英特尔成为当天的第二重冲击。它指引四季度每股收益0.25美元，低于预期的0.43美元，并警告PC调整可能延续到明年。"}, {"start": 128.74, "end": 137.86, "text": "Intel is down about twenty-five percent pre-market. AMD, which competes with Intel in PC chips, is down six to nine percent, and reports earnings on Tuesday.", "zh": "英特尔盘前跌约25%。在PC芯片领域与英特尔竞争的AMD跌6%至9%，将于周二公布财报。"}, {"start": 137.86, "end": 147.34, "text": "Microsoft was the one name that passed. Revenue of ninety-two point three billion dollars, earnings of four dollars eighty-nine cents, and Azure up forty-eight percent.", "zh": "微软是唯一通过考验的公司。营收923亿美元，每股收益4.89美元，Azure增长48%。"}, {"start": 147.34, "end": 155.9, "text": "Microsoft's free cash flow was eighteen point six billion dollars. Even so, the shares closed essentially flat, after fading from an intraday high.", "zh": "微软自由现金流达186亿美元。即便如此，股价收盘基本持平，盘中高点回落。"}, {"start": 155.9, "end": 164.86, "text": "Now the Fed. It held rates at three point seven five to four percent, in a ten to two vote, with two officials dissenting in favour of an immediate hike.", "zh": "接下来是美联储。它维持利率在3.75%至4%，以10比2投票通过，两位官员主张立即加息而投了反对票。"}, {"start": 164.86, "end": 173.38, "text": "A December hike is largely priced in, and no rate cuts are expected in 2026. The repricing is toward hikes, not cuts.", "zh": "12月加息已基本定价，2026年预计不会降息。重新定价的方向是加息，而不是降息。"}, {"start": 173.38, "end": 183.53, "text": "Growth and inflation data backed the hawkish hold. Third-quarter GDP printed three point four percent, and September core PCE was three point one percent year over year.", "zh": "增长和通胀数据支持了偏鹰的按兵不动。三季度GDP增长3.4%，9月核心PCE同比增长3.1%。"}, {"start": 183.53, "end": 194.4, "text": "The European Central Bank also held, at two point five percent, and a December hike there is now about eighty-eight percent priced. The Bank of Japan held at one point two five percent.", "zh": "欧洲央行也按兵不动，维持在2.5%，12月加息概率现已定价约88%。日本央行维持在1.25%。"}, {"start": 194.4, "end": 202.99, "text": "Rates are rallying on safety. The ten-year Treasury is near four point nine percent, its lowest in weeks, and the dollar is down about zero point two percent.", "zh": "避险推动美债上涨。10年期收益率接近4.9%，为数周最低；美元跌约0.2%。"}, {"start": 202.99, "end": 210.43, "text": "Gold slipped below four thousand dollars, down about one percent, in forced selling as equities fell. Silver hit a new low for the year.", "zh": "黄金在股市下跌引发的强制抛售中跌破4000美元，跌约1%。白银创下年内新低。"}, {"start": 210.43, "end": 219.0, "text": "Oil is the counter-move. WTI crude is up about two percent, near one hundred four dollars, and Brent is up about one point six percent.", "zh": "原油走势相反。WTI涨约2%，接近104美元；布伦特涨约1.6%。"}, {"start": 219.0, "end": 225.19, "text": "Brent is up twelve to thirteen percent in October. The driver is geopolitics, and we will come back to that.", "zh": "布伦特10月累计涨12%至13%。推动力是地缘政治，稍后我们会回到这个话题。"}, {"start": 225.19, "end": 234.43, "text": "Asia was hit hard overnight. The KOSPI crashed five percent intraday and triggered a rare five-minute trading curb, before closing down three point five percent.", "zh": "亚洲隔夜重挫。KOSPI盘中暴跌5%，触发罕见的5分钟交易熔断，最终收跌3.5%。"}, {"start": 234.43, "end": 240.62, "text": "Samsung fell about three percent and SK Hynix about seven percent, despite both reporting record quarters.", "zh": "三星跌约3%，SK海力士跌约7%，尽管两家都公布了创纪录的季度业绩。"}, {"start": 240.62, "end": 250.51, "text": "SK Hynix revenue jumped three hundred twenty-eight percent, with HBM and DRAM effectively sold out through 2029. Record earnings did not protect the shares.", "zh": "SK海力士营收增长328%，HBM和DRAM到2029年基本售罄。创纪录的业绩也没能保护股价。"}, {"start": 250.51, "end": 261.74, "text": "SanDisk is the morning's cleanest beat and fall. Revenue jumped three hundred seventy-eight percent, earnings beat, guidance was raised, and the stock is still down nine point five percent pre-market.", "zh": "闪迪是今早最典型的“超预期却下跌”。营收增长378%，盈利超预期、上调指引，股价盘前仍跌9.5%。"}, {"start": 261.74, "end": 272.02, "text": "The debate has flipped from sold out to is pricing peaking. Morningstar cut its SanDisk fair value to eight hundred seventy dollars, warning of a downcycle as new capacity arrives.", "zh": "争论已从“售罄”转向“价格是否见顶”。晨星将闪迪公允价值下调至870美元，警告新产能投产后可能进入下行周期。"}, {"start": 272.02, "end": 283.82, "text": "In other single names, Nvidia is down two to three percent pre-market. The Justice Department is reported to be probing its Hugging Face deal, but that is reported, not confirmed by the department or by Nvidia.", "zh": "其他个股方面，英伟达盘前跌2%至3%。有报道称司法部正在调查其收购Hugging Face的交易，但这只是报道，未经司法部或英伟达证实。"}, {"start": 283.82, "end": 296.3, "text": "Palantir reports Monday. JPMorgan initiated with an Overweight rating and a two hundred sixty-two dollar target. RBC kept its Sell rating at ninety dollars. That is the widest analyst split in the watchlist.", "zh": "Palantir将于周一公布财报。摩根大通新给予增持评级、目标价262美元；RBC维持卖出、目标价90美元。这是自选股中分析师分歧最大的一只。"}, {"start": 296.3, "end": 305.62, "text": "Apple also reports Monday, after the close, its first earnings under new chief executive John Ternus. Consensus is about one dollar ninety-eight cents a share.", "zh": "苹果也将于周一收盘后公布财报，是新任首席执行官John Ternus上任后的首份财报。市场预期每股收益约1.98美元。"}, {"start": 305.62, "end": 317.57, "text": "In biotech, Moderna reported strong melanoma vaccine data, a forty-two percent reduction in recurrence or death risk. But shares plunged as much as twenty-five percent after partial data leaked early.", "zh": "生物科技方面，Moderna公布了强劲的黑色素瘤疫苗数据，复发或死亡风险降低42%。但部分数据提前泄露后，股价一度暴跌25%。"}, {"start": 317.57, "end": 325.85, "text": "And a preprint reanalysis attacking Moderna's flu vaccine is contested, not a regulatory action. We flag it as unconfirmed.", "zh": "而一篇质疑Moderna流感疫苗的预印本再分析存在争议，不是监管行动。我们将其标注为未确认。"}, {"start": 325.85, "end": 337.01, "text": "Strategy reported a record quarter on paper, almost entirely from a Bitcoin gain, but Bitcoin per share fell three point seven percent this year. The shares closed down two point four percent.", "zh": "Strategy账面公布了创纪录的季度业绩，几乎全部来自比特币估值收益，但每股比特币数量今年下降了3.7%。股价收跌2.4%。"}, {"start": 337.01, "end": 343.56, "text": "Bitcoin itself is near seventy-seven to seventy-eight thousand dollars, a six-week low, after the Binance hack.", "zh": "比特币本身在币安被黑后跌至约7.7万至7.8万美元，创六周新低。"}, {"start": 343.56, "end": 355.15, "text": "Binance's own estimate is a six point three billion dollar impact, the largest crypto theft on record if confirmed. But the loss figures differ across trackers, and none is a final audited loss.", "zh": "币安自身的估计是损失约63亿美元，如果属实将是加密货币史上最大盗窃案。但各追踪机构的数字不一，没有一个是最终审计损失。"}, {"start": 355.15, "end": 362.95, "text": "Attribution to a North Korean group comes from one research firm only. It is not confirmed by Binance. We mark it as unconfirmed.", "zh": "归咎于朝鲜团伙的说法仅来自一家研究机构，未经币安证实。我们将其标注为未确认。"}, {"start": 362.95, "end": 371.83, "text": "Gold miners are also sliding. GDX is down about three percent pre-market, with about ninety-two percent of its constituents below their fifty-day moving average.", "zh": "金矿股也在下滑。GDX盘前跌约3%，约92%的成分股低于50日均线。"}, {"start": 371.83, "end": 386.66, "text": "One name needs a flag. Vendors treat SpaceX, ticker SPCX, as a public company that listed in June. That conflicts with the long-standing fact that SpaceX was private, so we treat its IPO and earnings figures as vendor-reported, not settled fact.", "zh": "有一只标的需要标注。供应商把SpaceX（代码SPCX）当作6月上市的上市公司，这与SpaceX长期为私营公司的事实相冲突，因此我们将其IPO和财报数字视为供应商口径，而非既定事实。"}, {"start": 386.66, "end": 398.35, "text": "Now the leveraged names. SOXL fell four point six percent Thursday and is on track to fall more than forty-three percent in October. TECL is down eight to ten percent pre-market.", "zh": "再看杠杆基金。SOXL周四跌4.6%，10月累计跌幅有望超过43%。TECL盘前跌8%至10%。"}, {"start": 398.35, "end": 408.31, "text": "TQQQ fell four point three percent Thursday. UVXY, the volatility fund, is up about seven point eight percent pre-market to eighteen dollars.", "zh": "TQQQ周四跌4.3%。波动率基金UVXY盘前涨约7.8%，至18美元。"}, {"start": 408.31, "end": 420.6, "text": "Now the strategy chapter. This is analysis only, read-only, no trading action taken. Spreads only, never naked shorts, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit.", "zh": "现在说策略章节。这只是分析，只读，没有任何交易操作。只做价差，绝不裸卖，剩余14至30天，在赚到50%至70%权利金时离场。"}, {"start": 420.6, "end": 431.11, "text": "The regime is split. Index volatility is contained, with the VIX near eighteen and a half, while single-name volatility is exploding. The names paying the most premium are the ones gapping.", "zh": "当前格局是分化的。指数波动率受控，VIX在18.5附近，而个股波动率正在爆发。权利金最丰厚的标的，正是那些跳空的标的。"}, {"start": 431.11, "end": 442.51, "text": "For KORU, the bear call spread remains the default. Korea trades while U.S. markets are closed, so the gap risk is structural, not episodic. Sell the rip after a bounce, not into the hole.", "zh": "对于KORU，熊市看涨价差仍是默认方向。韩国在美国市场休市时交易，因此跳空风险是结构性的，不是偶发的。应在反弹后卖出，而不是在低点追卖。"}, {"start": 442.51, "end": 452.23, "text": "For LABU, the one leveraged name that rose Thursday, put spreads are the trend-following side. There is no overnight gap risk, since all its holdings trade in U.S. hours.", "zh": "对于周四唯一上涨的杠杆基金LABU，看跌价差一侧顺应趋势。由于全部持仓都在美国交易时段交易，不存在隔夜跳空风险。"}, {"start": 452.23, "end": 465.14, "text": "For SOXL, TECL and TQQQ, the posture is bear call spreads on bounces, not bull put spreads into a falling tape. Put spreads only after a support level is tested and holds.", "zh": "对于SOXL、TECL和TQQQ，策略是在反弹时做熊市看涨价差，而不是在下跌趋势中做牛市看跌价差。只有支撑位经受考验并守住后，才考虑看跌价差。"}, {"start": 465.14, "end": 473.11, "text": "For UVXY, only short-dated bear call spreads, or avoid it entirely. A volatility spike reprices it violently.", "zh": "对于UVXY，只做短期熊市看涨价差，或者完全回避。波动率飙升会让它剧烈重定价。"}, {"start": 473.11, "end": 479.66, "text": "And do not hold short premium across AMD's earnings on Tuesday without wings sized for a move of ten percent or more.", "zh": "并且，不要在没有为10%或更大波动预留足够翼宽的情况下，持有跨越周二AMD财报的空头权利金头寸。"}, {"start": 479.66, "end": 488.98, "text": "Let's close with five things before the open. One, Nasdaq futures down two point two percent while the Dow is flat. A tech repricing, not a broad panic.", "zh": "最后总结开盘前五件事。第一，纳指期货跌2.2%，道指持平。这是科技股重新定价，不是全面恐慌。"}, {"start": 488.98, "end": 498.1, "text": "Two, Amazon down seven percent and Intel down twenty-five percent pre-market are the overnight verdicts. Three, memory names are falling on record earnings.", "zh": "第二，亚马逊盘前跌7%、英特尔跌25%，是隔夜的裁决。第三，存储股在创纪录业绩下仍在下跌。"}, {"start": 498.1, "end": 510.98, "text": "Four, oil is the hedge that is working, up on reports the U.S. may resume strikes on Iran after the November third midterms. Five, the Employment Cost Index lands at eight thirty Eastern, minutes before the open.", "zh": "第四，原油是正在起作用的对冲工具，因有报道称美国可能在11月3日中期选举后恢复对伊朗的打击而上涨。第五，就业成本指数将于美东时间8点半、开盘前几分钟公布。"}, {"start": 510.98, "end": 521.54, "text": "On Iran, only that military options were briefed has been reported. No decision has been confirmed, and a report of cargo aircraft to Israeli bases has no U.S. confirmation.", "zh": "关于伊朗，报道的只是军方选项已向总统汇报。没有任何决定得到证实，关于军用运输机飞往以色列基地的报道也没有美国方面的证实。"}, {"start": 521.54, "end": 529.66, "text": "And the three things that matter most. One, the market's test changed. Cloud growth is no longer enough. Cash flow is the test.", "zh": "而最重要的三件事。第一，市场的考验变了。云增长已不够，现金流才是考验。"}, {"start": 529.66, "end": 539.9, "text": "Two, Korea is the highest-beta warning in the watchlist, and it just fired. Leveraged Korea exposure is a gap trade, not a trend trade, until volatility contracts.", "zh": "第二，韩国是自选股中贝塔最高的警示，它刚刚触发。在波动率收缩之前，杠杆韩国敞口是跳空交易，不是趋势交易。"}, {"start": 539.9, "end": 550.58, "text": "Three, geopolitics is now a market input, not background. Oil, the Binance hack, and the midterms on Tuesday carry more event risk than the next weeks of earnings.", "zh": "第三，地缘政治现在是市场变量，不是背景。原油、币安被黑和周二的中期选举，蕴含的事件风险超过未来数周的财报。"}, {"start": 550.58, "end": 563.95, "text": "A final word on data gaps. Pre-market percentages vary by snapshot time, KORU has conflicting prices across vendors, and the Meta twenty-five billion dollar figure is unconfirmed, with two different stories attached to it.", "zh": "最后说一下数据缺口。盘前涨跌幅因快照时间而异，KORU在不同供应商的价格相互冲突，Meta的250亿美元数字未经证实，且对应着两个不同的说法。"}, {"start": 563.95, "end": 573.96, "text": "This brief is market research only, not investment advice and not an order. Leveraged funds reset daily and decay over time, and Korean names carry overnight gap risk.", "zh": "本简报仅为市场研究，不是投资建议，也不是交易指令。杠杆基金每日重置、长期衰减，韩国标的带有隔夜跳空风险。"}, {"start": 573.96, "end": 583.27, "text": "Read-only, no trading action was taken. For positions, expiry or margin, check the broker app. Thanks for listening, and we will see you at the intraday brief.", "zh": "只读，没有进行任何交易操作。如需了解持仓、到期或保证金，请查看券商App。感谢收听，盘中简报再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
