<script>
const LINES=[{"start": 0.0, "end": 5.16, "text": "Welcome to the U.S. Stocks Intraday Brief, for Tuesday, October twenty seventh. I am Alex.", "zh": "欢迎收听美国股市盘中简报，2026年10月27日星期二。我是 Alex。"}, {"start": 5.16, "end": 14.52, "text": "And I am Jordan. This is the mid-session edition, recorded around eleven thirty Eastern. It is pure market research: no account data, no trading orders.", "zh": "我是 Jordan。这是盘中版，美东时间约11点半录制，纯市场研究：没有账户数据，没有交易指令。"}, {"start": 14.52, "end": 22.97, "text": "The headline is a two-speed session. The Nasdaq and chip stocks lead again, but the Dow is flat to down, and the S and P has faded most of its gap.", "zh": "头条是双速行情。纳指和芯片股再次领涨，但道指持平偏弱，标普已回吐大部分开盘涨幅。"}, {"start": 22.97, "end": 24.29, "text": "Give me the morning tape.", "zh": "说说上午的盘面。"}, {"start": 24.29, "end": 34.01, "text": "At nine fifty seven Eastern, the Dow was down zero point one four percent, the S and P up zero point one six, and the Nasdaq up zero point three eight percent.", "zh": "美东时间9点57分，道指跌0.14%，标普涨0.16%，纳指涨0.38%。"}, {"start": 34.01, "end": 44.88, "text": "The semiconductor index was up one point eight percent, its third straight up day. Monday set it up: the S and P closed up zero point seven percent, the Nasdaq up zero point eight two.", "zh": "半导体指数涨1.8%，连续第三天上涨。周一打下了基础：标普涨0.7%，纳指涨0.82%。"}, {"start": 44.88, "end": 57.91, "text": "Exactly. Now the data: strong headline, soft core. Durable goods rose one point eight percent in September, above expectations, but orders excluding transport rose only zero point five percent.", "zh": "正是如此。再看数据：headline 强劲，核心偏软。9月耐用品订单增长1.8%，高于预期，但不含运输的订单只增长0.5%。"}, {"start": 57.91, "end": 60.38, "text": "Consumer confidence was the real beat, though.", "zh": "但消费者信心是真正的超预期。"}, {"start": 60.38, "end": 70.7, "text": "It was. The Conference Board index jumped to ninety one point seven in October, against expectations near eighty one. September was revised up to eighty four point two.", "zh": "确实如此。世界大型企业联合会指数10月跳升至91.7，预期在81附近。9月上修至84.2。"}, {"start": 70.7, "end": 75.62, "text": "So why are yields up? The ten-year is near four point nine nine seven percent.", "zh": "那收益率为什么还涨？十年期在4.997%附近。"}, {"start": 75.62, "end": 84.98, "text": "A strong headline plus a Fed decision tomorrow is enough. The two-year is near four point seven three one percent. That caps long-duration tech into tomorrow.", "zh": "强劲的 headline 数据加上明天的美联储决议就够了。两年期在4.731%附近。这限制了长久期科技股在明天之前的空间。"}, {"start": 84.98, "end": 88.18, "text": "Today is day one of the Fed meeting, and nobody is speaking.", "zh": "今天是美联储会议第一天，而且没人讲话。"}, {"start": 88.18, "end": 99.46, "text": "Right, it is the blackout period. The decision comes Wednesday at two p.m. Eastern, with Chair Warsh at two thirty. The base case is a hold at three point seven five to four percent.", "zh": "没错，正处在静默期。决议周三美东时间下午2点公布，Warsh 主席2点半讲话。基本情形是维持利率在3.75%至4%不变。"}, {"start": 99.46, "end": 103.9, "text": "And tomorrow is not just the Fed. Microsoft and Google report after the close.", "zh": "而且明天不只是美联储。微软和谷歌都在收盘后发布财报。"}, {"start": 103.9, "end": 118.73, "text": "Exactly. That is why today's calm volatility is misleading. The VIX is near seventeen point eight, down about three percent, and the one-day gauge has fallen to about ten point five. The session is priced as quiet, but the week is not.", "zh": "正是如此。这就是为什么今天平静的波动率具有误导性。VIX 约17.8，跌约3%，一日波动率指标已跌至约10.5。今天被定价为平静的一天，但这一周并不平静。"}, {"start": 118.73, "end": 122.28, "text": "To sectors. Semiconductors and memory lead again.", "zh": "说说行业。半导体和存储再次领涨。"}, {"start": 122.28, "end": 139.01, "text": "By far. Micron is up two point two eight percent, SanDisk up two point seven five, and SK Hynix up about one point seven percent. Bank of America has a buy on Micron, target one thousand five hundred fifty dollars, citing tight supply.", "zh": "遥遥领先。美光涨2.28%，闪迪涨2.75%，SK 海力士涨约1.7%。美国银行给予美光买入评级，目标价1550美元，理由是供应紧张。"}, {"start": 139.01, "end": 141.34, "text": "Korea itself had a huge day.", "zh": "韩国市场本身涨幅很大。"}, {"start": 141.34, "end": 152.45, "text": "The Kospi rose about three to three point seven five percent, helped by third-quarter GDP of one percent, beating expectations. The surge even triggered a brief program-trading pause.", "zh": "Kospi 涨约3%至3.75%，得益于三季度 GDP 增长1%，超预期。涨势甚至一度触发程序化交易暂停。"}, {"start": 152.45, "end": 155.69, "text": "That explains the leveraged funds. What are they doing?", "zh": "这就解释了杠杆基金。它们表现如何？"}, {"start": 155.69, "end": 169.97, "text": "SOXL is up eight point eight five percent, KORU up seven point five four, and LABU up five point five nine. TECL is up four point six five, and TQQQ up three point three eight percent.", "zh": "SOXL 涨8.85%，KORU 涨7.54%，LABU 涨5.59%。TECL 涨4.65%，TQQQ 涨3.38%。"}, {"start": 169.97, "end": 173.81, "text": "What about UVXY? The brief gives no clean number.", "zh": "UVXY 呢？简报没有给出干净数字。"}, {"start": 173.81, "end": 185.76, "text": "Deliberately. No reliable intraday UVXY quote was retrieved, and vendor prints were inconsistent. With the VIX down, UVXY should be down, but we will not quote a percentage we cannot stand behind.", "zh": "这是有意的。没有找到可靠的盘中 UVXY 报价，供应商数据也不一致。VIX 下跌，UVXY 应该下跌，但我们不会引用站不住脚的百分比。"}, {"start": 185.76, "end": 199.01, "text": "AMD is up four point six seven percent, with cornerstone interest in Meta's offering, a warrant tied to its Instinct processors, and a raised target of six hundred twenty dollars. It reports on November third.", "zh": "AMD 涨4.67%，参与 Meta 发行的基石投资，有与 Instinct 处理器挂钩的认股权证，目标价上调至620美元。它将于11月3日发布财报。"}, {"start": 199.01, "end": 200.88, "text": "Nvidia is quieter today.", "zh": "英伟达今天比较安静。"}, {"start": 200.88, "end": 211.8, "text": "Nvidia is up zero point eight percent. It took a three billion dollar stake in Meta's offering and expanded its Muse partnership, but it is still about ten percent below its October sixth record close.", "zh": "英伟达涨0.8%。它认购了 Meta 发行中的30亿美元股份，并扩大了 Muse 合作，但仍比10月6日的历史收盘高点低约10%。"}, {"start": 211.8, "end": 215.59, "text": "Meta itself lags, down zero point eight six percent.", "zh": "Meta 本身落后，跌0.86%。"}, {"start": 215.59, "end": 225.07, "text": "Yes, and below its two hundred day average. The offering was upsized to ninety seven point five billion dollars, and the close is expected on October twenty ninth.", "zh": "是的，而且跌破了200日均线。发行规模扩大至975亿美元，预计10月29日完成。"}, {"start": 225.07, "end": 229.56, "text": "There is also a Meta earnings-date conflict, which we must not state as settled.", "zh": "Meta 的财报日期也有冲突，我们不能把它说成已确定。"}, {"start": 229.56, "end": 238.97, "text": "Correct. One wire radar lists Meta for tomorrow after the close, while other summaries say it already reported on October twenty first. That conflict is unresolved.", "zh": "正确。一个资讯雷达把 Meta 列在明天收盘后，而其他摘要说它已在10月21日发布财报。这个冲突尚未解决。"}, {"start": 238.97, "end": 240.6, "text": "Tesla is the other big winner.", "zh": "特斯拉是另一个大赢家。"}, {"start": 240.6, "end": 250.92, "text": "Tesla is up three point four three percent, building on Monday's five point two one percent, with no single confirmed catalyst found today. Treat it as momentum, not a company announcement.", "zh": "特斯拉涨3.43%，延续了周一5.21%的涨幅，今天没有找到单一已确认催化剂。把它看作动量，而不是公司公告。"}, {"start": 250.92, "end": 263.64, "text": "Apple is up one point zero seven percent after Monday's fall. Google's Nasdaq listing is up one point zero seven percent as well. Microsoft is nearly flat, up about zero point one percent, into earnings tomorrow.", "zh": "苹果在周一下跌后涨1.07%。谷歌纳斯达克上市股票也涨1.07%。微软基本持平，涨约0.1%，同样在明天财报前。"}, {"start": 263.64, "end": 268.15, "text": "Palantir is quiet, but Bloom Energy is up eight point three four percent.", "zh": "Palantir 比较安静，但 Bloom Energy 涨8.34%。"}, {"start": 268.15, "end": 279.48, "text": "It is the largest single-stock gain after the leveraged funds, but no new Bloom company news was found today. Treat it as inferred continuation after its strong third-quarter report, not as an announcement.", "zh": "它是杠杆基金之后涨幅最大的个股，但今天没有找到 Bloom 的新公司新闻。把它看作三季度强劲财报后的推断性延续，而不是公告。"}, {"start": 279.48, "end": 282.79, "text": "Now the losers. Moderna is down sharply.", "zh": "现在说下跌的股票。Moderna 大幅下跌。"}, {"start": 282.79, "end": 294.72, "text": "William Blair downgraded Moderna on valuation, after a Merck-partnered melanoma trial win. Snapshots ranged from about minus three to about minus seven percent, so the brief gives a range, not a single point.", "zh": "William Blair 在与默克合作的黑色素瘤试验成功后，以估值为由下调了 Moderna 评级。不同时间的快照从约跌3%到约跌7%不等，所以简报给出的是区间，而不是单一数字。"}, {"start": 294.72, "end": 297.31, "text": "Walmart lagged, and gold miners rose.", "zh": "沃尔玛落后，金矿股上涨。"}, {"start": 297.31, "end": 308.52, "text": "Walmart is down zero point eight one percent, after pushing toward a three-month high on Monday. GDX is up one point nine eight percent, as gold held near four thousand dollars despite a firmer dollar.", "zh": "沃尔玛跌0.81%，此前周一刚冲向三个月高点。GDX 涨1.98%，尽管美元走强，金价仍守在4000美元附近。"}, {"start": 308.52, "end": 312.48, "text": "Strategy, the bitcoin proxy, is up zero point six percent.", "zh": "比特币概念股 Strategy 涨0.6%。"}, {"start": 312.48, "end": 322.97, "text": "Yes, with bitcoin near eighty thousand dollars. It paused bitcoin buying last week and repurchased about two hundred five million dollars of preferred stock. It reports on Thursday.", "zh": "是的，比特币在80000美元附近。它上周暂停购买比特币，转而回购了约2.05亿美元优先股。它将于周四发布财报。"}, {"start": 322.97, "end": 327.12, "text": "We must handle SPCX carefully. Its label is unresolved.", "zh": "SPCX 我们必须谨慎处理。它的标签尚未解决。"}, {"start": 327.12, "end": 338.28, "text": "Exactly. Vendors label it differently: a listed SpaceX stock, a SPAC fund, or a tokenised share with no ownership rights. Do not present it as a verified listed SpaceX common stock.", "zh": "正是如此。不同供应商的标注不同：上市的 SpaceX 股票、SPAC 基金，或没有所有权的代币化股票。不要把它说成已验证的上市 SpaceX 普通股。"}, {"start": 338.28, "end": 348.17, "text": "To strategy. Analysis only, spreads only, fourteen to thirty days to expiry, take fifty to seventy percent of the credit. No orders, no trades.", "zh": "说说策略。只是分析，仅限价差，剩余14至30天，到手50%至70%的权利金就离场。没有指令，没有交易。"}, {"start": 348.17, "end": 362.69, "text": "Right. The key point is compressed premium. Friday expiry holds the Fed, the European Central Bank, the Bank of Japan, and three mega-cap earnings in only about one hundred five S and P points of premium. A surprise hits a short spread hard.", "zh": "没错。关键是权利金已被压缩。周五到期的期权把美联储、欧洲央行、日本央行和三家巨头财报都装进了仅约105个标普点数的权利金里。意外会对空头价差造成重击。"}, {"start": 362.69, "end": 368.33, "text": "For KORU, up seven point five percent, the playbook default is still a bear call spread?", "zh": "对于涨7.5%的 KORU，手册的默认方向仍是熊市看涨价差吗？"}, {"start": 368.33, "end": 383.86, "text": "Yes. Collect decay and defend against the overnight gap. But a second strong Seoul session, with SK Hynix earnings on Wednesday, can keep running. And never run a cash-secured put or a wheel here: assignment means catching a decaying triple-leveraged fund.", "zh": "是的。收取时间价值，并防范隔夜跳空。但 SK 海力士周三财报可能带来第二个强劲的首尔交易日。而且绝不要在这里做现金担保看跌期权或 wheel：被行权就等于接住一只不断衰减的三倍杠杆基金。"}, {"start": 383.86, "end": 386.69, "text": "And LABU, up even as Moderna fell?", "zh": "LABU 呢？即使 Moderna 下跌，它仍上涨？"}, {"start": 386.69, "end": 402.84, "text": "That is the point. The fund is not one stock. The playbook allows put spreads more comfortably for LABU, with fifteen to twenty delta strikes, because it has no overnight gap and lower volatility than KORU. In an uptrend, put spreads ride trend plus decay.", "zh": "这正是关键。该基金不是一只股票。手册对 LABU 更宽容地允许看跌价差，行权价在15至20 delta，因为它没有隔夜跳空，波动率也低于 KORU。在上升趋势中，看跌价差同时享受趋势和时间价值。"}, {"start": 402.84, "end": 410.47, "text": "And for SOXL, TECL, and TQQQ: do not add size into tomorrow's earnings gap for little credit.", "zh": "对于 SOXL、TECL 和 TQQQ：不要为了微薄的权利金，在明天的财报跳空前加仓。"}, {"start": 410.47, "end": 418.7, "text": "Exactly. If a spread is already near fifty to seventy percent of its credit, take it. Do not hold for the last slice through a Fed decision.", "zh": "正是如此。如果价差已接近权利金的50%至70%，就离场。不要为了最后一点权利金，扛过美联储决议。"}, {"start": 418.7, "end": 423.1, "text": "What about Bloom, with no catalyst, or Moderna, a falling knife?", "zh": "对于没有催化剂的 Bloom，或者像 Moderna 这样下跌中的刀子呢？"}, {"start": 423.1, "end": 437.33, "text": "Wide wings and far strikes are the only playbook-consistent frame for Bloom, because there is no event to price, only flow. For Moderna, strike distance matters more than direction: a spread struck near today's price has no margin for error.", "zh": "对于 Bloom，只有宽翅膀、远行权价才符合手册，因为没有事件可以定价，只有资金流。对于 Moderna，行权价距离比方向更重要：行权价贴近今天价格的价差没有任何容错空间。"}, {"start": 437.33, "end": 439.37, "text": "Let us finish with the rest of the session.", "zh": "最后说说今天剩余时段。"}, {"start": 439.37, "end": 453.29, "text": "At one p.m. Eastern, a seventy billion dollar five-year note auction, the day's key yield test. The close is at four p.m., then crude stocks at four thirty. After the close, Visa, Seagate, and Robinhood report.", "zh": "美东时间下午1点，700亿美元五年期国债拍卖，是今天关键的收益率考验。收盘在下午4点，之后4点半公布原油库存。收盘后，Visa、Seagate 和 Robinhood 发布财报。"}, {"start": 453.29, "end": 455.09, "text": "And the checkpoints into the close?", "zh": "收盘前的检查点呢？"}, {"start": 455.09, "end": 472.97, "text": "Watch SPY's fifty-day average near seven hundred sixty five point eight two, and whether the ten-year pushes back above five percent after the auction. Watch any Houthi or Hormuz headline: that reverses the two-day oil decline fast. Calm intraday volatility does not mean low event risk.", "zh": "关注 SPY 的50日均线约765.82，以及拍卖后十年期是否重新突破5%。关注任何胡塞或霍尔木兹的消息，那会迅速逆转两天的油价下跌。盘中波动率平静不等于事件风险低。"}, {"start": 472.97, "end": 480.7, "text": "That is the intraday brief. Selective risk-on, compressed premium, and tomorrow is the event. Read-only, no trading action taken.", "zh": "这就是盘中简报。选择性风险偏好、权利金压缩，明天才是重头戏。只读，没有采取任何交易操作。"}, {"start": 480.7, "end": 486.7, "text": "Thanks for listening. We will be back with the post-market edition. Good luck into the close, and stay disciplined.", "zh": "感谢收听。盘后版再见。祝收盘顺利，保持纪律。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
</html>
