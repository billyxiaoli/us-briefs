<div id="volMenu" class="speed-menu" hidden><div class="speed-list" style="text-align:center;padding:20px"><div id="volLabel">音量 100%</div><input type="range" id="volRange" min="0" max="100" value="100" style="width:100%"></div></div><script>const SECTIONS=[{"slug": "2026-10-28-pre-market", "title": "U.S. Stocks Pre-Market Brief \u2014 October 28, 2026", "mp3": "2026-10-28-pre-market/2026-10-28-pre-market.mp3", "dur": "10:26", "lines": [{"start": 0.0, "end": 6.6, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Wednesday, October 28, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u524d\u7b80\u62a5\uff0c2026\u5e7410\u670828\u65e5\u661f\u671f\u4e09\u3002\u6211\u662f Alex\u3002"}, {"start": 6.6, "end": 14.95, "text": "And I'm Jordan. This is pure market research, recorded before the open. No account data, no trading orders, just what is happening and what to watch.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u7eaf\u5e02\u573a\u7814\u7a76\uff0c\u5f00\u76d8\u524d\u5f55\u5236\u3002\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 14.95, "end": 23.3, "text": "Here is the headline. Wednesday is the hinge day of the week, and the tape knows it: futures are mixed, memory is on fire, and everything else is waiting.", "zh": "\u5148\u8bf4\u5934\u6761\u3002\u5468\u4e09\u662f\u672c\u5468\u7684\u8f6c\u6298\u65e5\uff0c\u76d8\u9762\u4e5f\u6e05\u695a\u8fd9\u4e00\u70b9\uff1a\u671f\u8d27\u6da8\u8dcc\u4e92\u73b0\uff0c\u5b58\u50a8\u80a1\u706b\u70ed\uff0c\u5176\u4ed6\u4e00\u5207\u90fd\u5728\u7b49\u5f85\u3002"}, {"start": 23.3, "end": 26.74, "text": "Tuesday was a strong day. How strong, exactly?", "zh": "\u5468\u4e8c\u8868\u73b0\u5f3a\u52b2\u3002\u5177\u4f53\u6709\u591a\u5f3a\uff1f"}, {"start": 26.74, "end": 37.85, "text": "The S and P 500 rose zero point six percent to seven thousand seven hundred twenty-two, and the Nasdaq jumped one point one eight percent to twenty-six thousand four hundred seventy-seven.", "zh": "\u6807\u666e500\u4e0a\u6da80.6%\uff0c\u6536\u4e8e7722\u70b9\uff1b\u7eb3\u65af\u8fbe\u514b\u4e0a\u6da81.18%\uff0c\u6536\u4e8e26477\u70b9\u3002"}, {"start": 37.85, "end": 46.2, "text": "And the Dow barely moved, up just zero point zero three percent, because Boeing fell about eleven percent after a bigger than expected quarterly loss.", "zh": "\u9053\u6307\u4ec5\u5fae\u6da80.03%\uff0c\u56e0\u4e3a\u6ce2\u97f3\u5728\u5b63\u5ea6\u4e8f\u635f\u8d85\u9884\u671f\u540e\u8dcc\u4e86\u7ea611%\u3002"}, {"start": 46.2, "end": 55.97, "text": "Mixed. Dow futures are down about zero point two percent, S and P futures up about zero point one percent, and Nasdaq futures up about zero point four percent.", "zh": "\u6da8\u8dcc\u4e92\u73b0\u3002\u9053\u6307\u671f\u8d27\u8dcc\u7ea60.2%\uff0c\u6807\u666e\u671f\u8d27\u6da8\u7ea60.1%\uff0c\u7eb3\u6307\u671f\u8d27\u6da8\u7ea60.4%\u3002"}, {"start": 55.97, "end": 62.74, "text": "That is hesitation before the Fed, not a directional break. And Asia gave the bulls a big overnight gift.", "zh": "\u8fd9\u662f\u5728\u7f8e\u8054\u50a8\u51b3\u8bae\u524d\u7684\u72b9\u8c6b\uff0c\u4e0d\u662f\u65b9\u5411\u6027\u7a81\u7834\u3002\u800c\u4e9a\u6d32\u9694\u591c\u7ed9\u591a\u5934\u9001\u4e86\u4e00\u4efd\u5927\u793c\u3002"}, {"start": 62.74, "end": 71.21, "text": "South Korea's KOSPI surged six point six three percent to six thousand twelve, back above six thousand for the first time since October fourteenth.", "zh": "\u97e9\u56fdKOSPI\u5927\u6da86.63%\uff0c\u6536\u4e8e6012\u70b9\uff0c\u4e3a10\u670814\u65e5\u4ee5\u6765\u9996\u6b21\u91cd\u56de6000\u70b9\u4e0a\u65b9\u3002"}, {"start": 71.21, "end": 76.37, "text": "The driver was SK Hynix, and the numbers are extraordinary. What did it report?", "zh": "\u63a8\u52a8\u529b\u662fSK\u6d77\u529b\u58eb\uff0c\u6570\u5b57\u975e\u5e38\u60ca\u4eba\u3002\u5b83\u516c\u5e03\u4e86\u4ec0\u4e48\uff1f"}, {"start": 76.37, "end": 89.57, "text": "Record third quarter revenue of one hundred four point six trillion won, up more than three hundred percent from a year earlier, and operating profit of eighty-three point three trillion won, up more than seven times.", "zh": "\u521b\u7eaa\u5f55\u7684\u4e09\u5b63\u5ea6\u8425\u6536104.6\u4e07\u4ebf\u97e9\u5143\uff0c\u540c\u6bd4\u589e\u957f\u8d85300%\uff1b\u8425\u4e1a\u5229\u6da683.3\u4e07\u4ebf\u97e9\u5143\uff0c\u589e\u957f\u8d857\u500d\u3002"}, {"start": 89.57, "end": 97.49, "text": "That is roughly an eighty percent operating margin, driven by AI demand for high end memory chips. But we have to flag a split in the story.", "zh": "\u8fd9\u76f8\u5f53\u4e8e\u7ea680%\u7684\u8425\u4e1a\u5229\u6da6\u7387\uff0c\u7531AI\u9ad8\u7aef\u5b58\u50a8\u9700\u6c42\u9a71\u52a8\u3002\u4f46\u6211\u4eec\u5fc5\u987b\u6307\u51fa\u6545\u4e8b\u91cc\u7684\u5206\u6b67\u3002"}, {"start": 97.49, "end": 112.13, "text": "Yes. Operating profit beat expectations, but net profit of thirty-nine point eight trillion won missed the FactSet consensus of about sixty-one trillion. So headlines saying beat and headlines saying miss are both true, on different lines.", "zh": "\u662f\u7684\u3002\u8425\u4e1a\u5229\u6da6\u8d85\u9884\u671f\uff0c\u4f4639.8\u4e07\u4ebf\u97e9\u5143\u7684\u51c0\u5229\u6da6\u4f4e\u4e8e\u7ea661.4\u4e07\u4ebf\u97e9\u5143\u7684FactSet\u9884\u671f\u3002\u6240\u4ee5\u8bf4\u8d85\u9884\u671f\u548c\u8bf4\u4e0d\u53ca\u9884\u671f\u7684\u6807\u9898\u90fd\u5bf9\uff0c\u53ea\u662f\u9488\u5bf9\u4e0d\u540c\u9879\u76ee\u3002"}, {"start": 112.13, "end": 122.52, "text": "SK Hynix also announced about one hundred trillion won in 2026 shareholder returns, including dividends and buybacks, with a special dividend linked to its Kioxia gain.", "zh": "SK\u6d77\u529b\u58eb\u8fd8\u5ba3\u5e03\u7ea6100\u4e07\u4ebf\u97e9\u5143\u76842026\u5e74\u80a1\u4e1c\u56de\u62a5\uff0c\u5305\u62ec\u5206\u7ea2\u548c\u56de\u8d2d\uff0c\u5176\u4e2d\u6709\u4e0e\u94e0\u4fa0\u6536\u76ca\u76f8\u5173\u7684\u7279\u522b\u5206\u7ea2\u3002"}, {"start": 122.52, "end": 132.05, "text": "And it said HBM4 shipments and revenue will pass HBM3E in the fourth quarter, and that it expects demand to exceed memory supply through twenty thirty.", "zh": "\u5b83\u8fd8\u8868\u793aHBM4\u7684\u51fa\u8d27\u548c\u6536\u5165\u5c06\u5728\u56db\u5b63\u5ea6\u8d85\u8fc7HBM3E\uff0c\u5e76\u9884\u8ba1\u9700\u6c42\u8d85\u8fc7\u5b58\u50a8\u4f9b\u7ed9\u7684\u5c40\u9762\u5c06\u6301\u7eed\u52302030\u5e74\u3002"}, {"start": 132.05, "end": 134.81, "text": "How did U.S. memory stocks react before the open?", "zh": "\u7f8e\u56fd\u5b58\u50a8\u80a1\u76d8\u524d\u5982\u4f55\u53cd\u5e94\uff1f"}, {"start": 134.81, "end": 148.61, "text": "Strongly. SK Hynix's U.S. listing was up about eight point four percent, Micron up about three point six percent, SanDisk up about four point nine percent, and the semiconductor triple leveraged fund SOXL up about three percent.", "zh": "\u53cd\u5e94\u5f3a\u70c8\u3002SK\u6d77\u529b\u58eb\u7f8e\u80a1\u76d8\u524d\u6da8\u7ea68.4%\uff0c\u7f8e\u5149\u6da8\u7ea63.6%\uff0c\u95ea\u8fea\u6da8\u7ea64.9%\uff0c\u534a\u5bfc\u4f53\u4e09\u500d\u505a\u591a\u57fa\u91d1SOXL\u6da8\u7ea63%\u3002"}, {"start": 148.61, "end": 157.49, "text": "And the Korea triple leveraged fund, KORU, was the wildest of all, up about twelve point four percent pre-market after closing Tuesday up almost nine percent.", "zh": "\u800c\u97e9\u56fd\u4e09\u500d\u505a\u591a\u57fa\u91d1KORU\u6700\u4e3a\u5267\u70c8\uff0c\u76d8\u524d\u6da8\u7ea612.4%\uff0c\u6b64\u524d\u5468\u4e8c\u5df2\u6da8\u8fd19%\u3002"}, {"start": 157.49, "end": 169.61, "text": "Remember the context, though. KORU had fallen about twenty-three percent over the prior seven days before this bounce. A product that gaps this hard in both directions is a gap regime, not a trend.", "zh": "\u4e0d\u8fc7\u522b\u5fd8\u4e86\u80cc\u666f\u3002KORU\u5728\u6b64\u8f6e\u53cd\u5f39\u524d7\u5929\u8dcc\u4e86\u7ea623%\u3002\u8fd9\u6837\u53cc\u5411\u5927\u5e45\u8df3\u7a7a\u7684\u4ea7\u54c1\u5904\u4e8e\u8df3\u7a7a\u683c\u5c40\uff0c\u800c\u4e0d\u662f\u8d8b\u52bf\u3002"}, {"start": 169.61, "end": 176.86, "text": "Now to the main event. The Federal Reserve decides at two p.m. Eastern today, with Chair Warsh speaking at two thirty.", "zh": "\u73b0\u5728\u8bf4\u4e3b\u89d2\u3002\u7f8e\u8054\u50a8\u4eca\u5929\u7f8e\u4e1c\u65f6\u95f4\u4e0b\u53482\u70b9\u516c\u5e03\u51b3\u8bae\uff0c\u4e3b\u5e2dWarsh\u57282\u70b9\u534a\u8bb2\u8bdd\u3002"}, {"start": 176.86, "end": 186.05, "text": "A hold is overwhelmingly expected, with about ninety to ninety-four percent priced, keeping the target range at three point seven five to four percent.", "zh": "\u7ef4\u6301\u5229\u7387\u4e0d\u53d8\u51e0\u4e4e\u5df2\u6210\u5b9a\u5c40\uff0c\u5b9a\u4ef7\u6982\u7387\u7ea690%\u81f394%\uff0c\u76ee\u6807\u533a\u95f4\u7ef4\u6301\u57283.75%\u81f34%\u3002"}, {"start": 186.05, "end": 194.4, "text": "So the real question is December, where a further hike is priced at roughly eighty to eighty-three percent, and what Warsh's tone signals about it.", "zh": "\u6240\u4ee5\u771f\u6b63\u7684\u95ee\u9898\u662f12\u6708\uff0c\u8fdb\u4e00\u6b65\u52a0\u606f\u7684\u5b9a\u4ef7\u6982\u7387\u7ea680%\u81f383%\uff0c\u4ee5\u53caWarsh\u7684\u63aa\u8f9e\u5bf9\u6b64\u91ca\u653e\u4ec0\u4e48\u4fe1\u53f7\u3002"}, {"start": 194.4, "end": 205.73, "text": "This is a meeting without new projections, so his words and any dissents carry the signal. September's data frame the dilemma: inflation at three point seven percent, but only twenty-nine thousand jobs added.", "zh": "\u8fd9\u6b21\u4f1a\u8bae\u6ca1\u6709\u65b0\u7684\u9884\u6d4b\uff0c\u6240\u4ee5\u4ed6\u7684\u63aa\u8f9e\u548c\u4efb\u4f55\u5f02\u8bae\u7968\u5c31\u662f\u4fe1\u53f7\u30029\u6708\u6570\u636e\u51f8\u663e\u4e24\u96be\uff1a\u901a\u80c03.7%\uff0c\u4f46\u65b0\u589e\u5c31\u4e1a\u4ec52.9\u4e07\u4eba\u3002"}, {"start": 205.73, "end": 215.14, "text": "Rates are already high into the decision. The ten year Treasury is just at or above five percent, and the dollar is near a two week high around one hundred two point four.", "zh": "\u51b3\u8bae\u524d\u5229\u7387\u5df2\u7ecf\u5f88\u9ad8\u300210\u5e74\u671f\u7f8e\u503a\u6536\u76ca\u7387\u521a\u597d\u57285%\u4e0a\u4e0b\uff0c\u7f8e\u5143\u5728\u7ea6102.4\u7684\u4e24\u5e74\u2026\u2026\u4e24\u5468\u9ad8\u4f4d\u9644\u8fd1\u3002"}, {"start": 215.14, "end": 223.3, "text": "Gold slipped Wednesday morning to around four thousand to four thousand fifty dollars, after closing Tuesday near four thousand seventy-three.", "zh": "\u9ec4\u91d1\u5468\u4e09\u65e9\u76d8\u56de\u843d\u81f3\u7ea64009\u81f34051\u7f8e\u5143\uff0c\u6b64\u524d\u5468\u4e8c\u6536\u4e8e\u7ea64073\u7f8e\u5143\u3002"}, {"start": 223.3, "end": 229.49, "text": "And oil is back above one hundred one dollars, after falling Tuesday on diplomacy hopes. What pushed it back up?", "zh": "\u539f\u6cb9\u5728\u5468\u4e8c\u56e0\u5916\u4ea4\u5e0c\u671b\u4e0b\u8dcc\u540e\uff0c\u5468\u4e09\u91cd\u56de101\u7f8e\u5143\u4e0a\u65b9\u3002\u662f\u4ec0\u4e48\u628a\u5b83\u63a8\u56de\u53bb\u7684\uff1f"}, {"start": 229.49, "end": 239.38, "text": "A claim by Yemen's Houthis that they hit Saudi Arabia's largest refinery with a missile. We must mark this clearly as unconfirmed, because Saudi authorities had not confirmed the strike.", "zh": "\u4e5f\u95e8\u80e1\u585e\u6b66\u88c5\u58f0\u79f0\u7528\u5bfc\u5f39\u88ad\u51fb\u4e86\u6c99\u7279\u6700\u5927\u7684\u70bc\u6cb9\u5382\u3002\u6211\u4eec\u5fc5\u987b\u660e\u786e\u6807\u6ce8\u8fd9\u4e00\u70b9\u5c1a\u672a\u786e\u8ba4\uff0c\u56e0\u4e3a\u6c99\u7279\u65b9\u9762\u5c1a\u672a\u8bc1\u5b9e\u8fd9\u6b21\u88ad\u51fb\u3002"}, {"start": 239.38, "end": 247.01, "text": "So the oil spike is risk premium on a claim, not a confirmed outage. That distinction matters for how long the premium lasts.", "zh": "\u6240\u4ee5\u6cb9\u4ef7\u4e0a\u6da8\u662f\u57fa\u4e8e\u4e00\u5219\u58f0\u660e\u7684\u98ce\u9669\u6ea2\u4ef7\uff0c\u4e0d\u662f\u5df2\u786e\u8ba4\u7684\u4f9b\u5e94\u4e2d\u65ad\u3002\u8fd9\u4e2a\u533a\u522b\u51b3\u5b9a\u4e86\u6ea2\u4ef7\u80fd\u6301\u7eed\u591a\u4e45\u3002"}, {"start": 247.01, "end": 258.29, "text": "Away from commodities, the AI power trade also printed strong. Vertiv beat expectations with revenue up sixty-one percent and raised guidance, jumping about sixteen percent pre-market.", "zh": "\u5927\u5b97\u5546\u54c1\u4e4b\u5916\uff0cAI\u7535\u529b\u677f\u5757\u4e5f\u8868\u73b0\u5f3a\u52b2\u3002Vertiv\u4e1a\u7ee9\u8d85\u9884\u671f\uff0c\u8425\u6536\u589e\u957f61%\u5e76\u4e0a\u8c03\u6307\u5f15\uff0c\u76d8\u524d\u6da8\u7ea616%\u3002"}, {"start": 258.29, "end": 265.08, "text": "GE Vernova also beat, and Bloom Energy rides that same power beta, up about four point three percent pre-market.", "zh": "GE Vernova\u4e5f\u8d85\u9884\u671f\uff0cBloom Energy\u53d7\u76ca\u4e8e\u540c\u6837\u7684\u7535\u529b\u4e3b\u9898\uff0c\u76d8\u524d\u6da8\u7ea64.3%\u3002"}, {"start": 265.08, "end": 270.07, "text": "Then tonight, the two biggest tests arrive after the close: Microsoft and Alphabet.", "zh": "\u7136\u540e\u4eca\u665a\uff0c\u6700\u5927\u7684\u4e24\u573a\u8003\u9a8c\u5728\u6536\u76d8\u540e\u5230\u6765\uff1a\u5fae\u8f6f\u548cAlphabet\u3002"}, {"start": 270.07, "end": 280.22, "text": "Microsoft is expected to report revenue around ninety point six billion dollars and earnings near four dollars seventy-one cents, with Azure growth guided near forty-five percent.", "zh": "\u5fae\u8f6f\u9884\u8ba1\u8425\u6536\u7ea6906\u4ebf\u7f8e\u5143\uff0c\u6bcf\u80a1\u6536\u76ca\u7ea64.71\u7f8e\u5143\uff0cAzure\u589e\u957f\u6307\u5f15\u63a5\u8fd145%\u3002"}, {"start": 280.22, "end": 288.02, "text": "And its quarterly capital spending is guided above fifty billion dollars. The question is whether cloud growth converts that spending into cash.", "zh": "\u5176\u5b63\u5ea6\u8d44\u672c\u5f00\u652f\u6307\u5f15\u8d85\u8fc7500\u4ebf\u7f8e\u5143\u3002\u95ee\u9898\u5728\u4e8e\u4e91\u589e\u957f\u80fd\u5426\u628a\u8fd9\u4e9b\u5f00\u652f\u8f6c\u5316\u4e3a\u73b0\u91d1\u3002"}, {"start": 288.02, "end": 299.26, "text": "Alphabet is expected to report revenue near one hundred twenty-seven point nine billion dollars, with 2026 capital spending guided at one hundred ninety-five to two hundred five billion.", "zh": "Alphabet\u9884\u8ba1\u8425\u6536\u63a5\u8fd11279\u4ebf\u7f8e\u5143\uff0c2026\u5e74\u8d44\u672c\u5f00\u652f\u6307\u5f15\u4e3a1950\u81f32050\u4ebf\u7f8e\u5143\u3002"}, {"start": 299.26, "end": 306.29, "text": "Options price big moves tonight: about plus or minus five percent for Microsoft, and about plus or minus six percent for Alphabet.", "zh": "\u671f\u6743\u5e02\u573a\u4e3a\u4eca\u665a\u5b9a\u4ef7\u4e86\u5927\u5e45\u6ce2\u52a8\uff1a\u5fae\u8f6f\u7ea6\u6b63\u8d1f5%\uff0cAlphabet\u7ea6\u6b63\u8d1f6%\u3002"}, {"start": 306.29, "end": 316.32, "text": "There is also an unconfirmed report that OpenAI plans to buy Google's TPUs. No terms, and neither company has confirmed it, so we report it as a plan, not a deal.", "zh": "\u8fd8\u6709\u4e00\u5219\u672a\u786e\u8ba4\u7684\u62a5\u9053\u79f0OpenAI\u8ba1\u5212\u8d2d\u4e70\u8c37\u6b4c\u7684TPU\u3002\u6ca1\u6709\u6761\u6b3e\uff0c\u4e24\u5bb6\u516c\u53f8\u5747\u672a\u8bc1\u5b9e\uff0c\u6240\u4ee5\u6211\u4eec\u628a\u5b83\u62a5\u9053\u4e3a\u8ba1\u5212\uff0c\u800c\u4e0d\u662f\u5df2\u8fbe\u6210\u7684\u4ea4\u6613\u3002"}, {"start": 316.32, "end": 327.55, "text": "Meanwhile Meta's financing story keeps growing. Its equity offering was upsized to ninety-seven point five billion dollars, with Nvidia investing three billion and AMD one billion.", "zh": "\u4e0e\u6b64\u540c\u65f6\uff0cMeta\u7684\u878d\u8d44\u6545\u4e8b\u8fd8\u5728\u6269\u5927\u3002\u5176\u80a1\u7968\u53d1\u884c\u89c4\u6a21\u4e0a\u8c03\u81f3975\u4ebf\u7f8e\u5143\uff0c\u82f1\u4f1f\u8fbe\u6295\u8d4430\u4ebf\u7f8e\u5143\uff0cAMD\u6295\u8d4410\u4ebf\u7f8e\u5143\u3002"}, {"start": 327.55, "end": 337.92, "text": "Critics call that circular, vendors funding their largest customer. Bulls call it demand insurance. Either way, it is now the template for how the AI build-out gets paid for.", "zh": "\u6279\u8bc4\u8005\u79f0\u8fd9\u662f\u5faa\u73af\u878d\u8d44\uff0c\u5373\u4f9b\u5e94\u5546\u8d44\u52a9\u5176\u6700\u5927\u5ba2\u6237\u3002\u770b\u591a\u8005\u79f0\u8fd9\u662f\u9700\u6c42\u4fdd\u9669\u3002\u65e0\u8bba\u5982\u4f55\uff0c\u8fd9\u5df2\u6210\u4e3aAI\u5efa\u8bbe\u5982\u4f55\u7b79\u8d44\u7684\u6a21\u677f\u3002"}, {"start": 337.92, "end": 347.04, "text": "In other single names, Apple acknowledged display problems on a small number of its first folding iPhones and said it will replace affected units. No cause was given.", "zh": "\u5176\u4ed6\u4e2a\u80a1\u65b9\u9762\uff0c\u82f9\u679c\u627f\u8ba4\u9996\u6279\u6298\u53e0iPhone\u4e2d\u6709\u5c11\u91cf\u51fa\u73b0\u5c4f\u5e55\u95ee\u9898\uff0c\u5e76\u8868\u793a\u5c06\u66f4\u6362\u53d7\u5f71\u54cd\u7684\u8bbe\u5907\u3002\u6ca1\u6709\u7ed9\u51fa\u539f\u56e0\u3002"}, {"start": 347.04, "end": 358.2, "text": "Tesla hit a three month high Tuesday, closing up about four percent, and is up only modestly pre-market. We discarded one board figure near five percent because it appeared to mix up Tuesday's close move.", "zh": "\u7279\u65af\u62c9\u5468\u4e8c\u521b\u4e09\u4e2a\u6708\u65b0\u9ad8\uff0c\u6536\u6da8\u7ea64%\uff0c\u76d8\u524d\u4ec5\u5c0f\u5e45\u4e0a\u6da8\u3002\u6211\u4eec\u5f03\u7528\u4e86\u4e00\u4e2a\u63a5\u8fd15%\u7684\u76d8\u524d\u6570\u636e\uff0c\u56e0\u4e3a\u5b83\u4f3c\u4e4e\u6df7\u6dc6\u4e86\u5468\u4e8c\u7684\u6536\u76d8\u6da8\u5e45\u3002"}, {"start": 358.2, "end": 365.21, "text": "Palantir was flat Tuesday, lagging the Nasdaq, with no company event tied to the slip. It reports earnings on November second.", "zh": "Palantir\u5468\u4e8c\u6301\u5e73\uff0c\u8dd1\u8f93\u7eb3\u65af\u8fbe\u514b\uff0c\u6ca1\u6709\u4e0e\u6b64\u76f8\u5173\u7684\u516c\u53f8\u4e8b\u4ef6\u3002\u5b83\u5c06\u4e8e11\u67082\u65e5\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 365.21, "end": 377.62, "text": "Moderna split analysts in opposite directions. William Blair downgraded it on valuation, while Piper Sandler raised its target to two hundred thirty dollars. The stock rebounded about four point six percent Tuesday.", "zh": "Moderna\u8ba9\u5206\u6790\u5e08\u770b\u6cd5\u4e24\u6781\u5206\u5316\u3002William Blair\u4ee5\u4f30\u503c\u4e3a\u7531\u4e0b\u8c03\u8bc4\u7ea7\uff0c\u800cPiper Sandler\u5c06\u76ee\u6807\u4ef7\u4e0a\u8c03\u81f3230\u7f8e\u5143\u3002\u8be5\u80a1\u5468\u4e8c\u53cd\u5f39\u7ea64.6%\u3002"}, {"start": 377.62, "end": 388.97, "text": "The biotech triple leveraged fund LABU closed Tuesday up eight point three nine percent, but its Friday options still price about a ten percent move in two days. Calmer does not mean quiet.", "zh": "\u751f\u7269\u79d1\u6280\u4e09\u500d\u505a\u591a\u57fa\u91d1LABU\u5468\u4e8c\u6536\u6da88.39%\uff0c\u4f46\u5176\u5468\u4e94\u671f\u6743\u4ecd\u5b9a\u4ef7\u4e24\u5929\u5185\u7ea610%\u7684\u6ce2\u52a8\u3002\u66f4\u5e73\u9759\u4e0d\u7b49\u4e8e\u5b89\u9759\u3002"}, {"start": 388.97, "end": 401.02, "text": "Strategy reports Thursday. Its October filing confirmed no Bitcoin bought or sold in the week of October nineteenth to twenty-fifth, with holdings unchanged at eight hundred forty-eight thousand five hundred seventeen coins.", "zh": "Strategy\u5c06\u4e8e\u5468\u56db\u516c\u5e03\u8d22\u62a5\u3002\u517610\u6708\u6587\u4ef6\u786e\u8ba4\uff0c\u572810\u670819\u65e5\u81f325\u65e5\u5f53\u5468\u6ca1\u6709\u4e70\u5356\u6bd4\u7279\u5e01\uff0c\u6301\u4ed3\u7ef4\u6301\u5728848517\u679a\u4e0d\u53d8\u3002"}, {"start": 401.02, "end": 409.78, "text": "Instead it spent about two hundred five million dollars buying back its preferred shares. Bitcoin itself is back above eighty thousand dollars this morning.", "zh": "\u76f8\u53cd\uff0c\u5b83\u82b1\u4e86\u7ea62.05\u4ebf\u7f8e\u5143\u56de\u8d2d\u4f18\u5148\u80a1\u3002\u6bd4\u7279\u5e01\u4eca\u65e9\u91cd\u56de8\u4e07\u7f8e\u5143\u4e0a\u65b9\u3002"}, {"start": 409.78, "end": 419.98, "text": "AppLovin faces class actions filed October twenty-seventh, plus two target cuts, with earnings due November fourth. Walmart is quiet, with earnings estimated November nineteenth.", "zh": "AppLovin\u9762\u4e3410\u670827\u65e5\u63d0\u8d77\u7684\u96c6\u4f53\u8bc9\u8bbc\u548c\u4e24\u6b21\u76ee\u6807\u4ef7\u4e0b\u8c03\uff0c\u8d22\u62a5\u5c06\u4e8e11\u67084\u65e5\u516c\u5e03\u3002\u6c83\u5c14\u739b\u5219\u5e73\u9759\uff0c\u8d22\u62a5\u9884\u8ba1\u572811\u670819\u65e5\u3002"}, {"start": 419.98, "end": 428.14, "text": "After the close, besides Microsoft and Alphabet, Ford, T-Mobile, eBay, ServiceNow, FedEx and Chipotle also report.", "zh": "\u6536\u76d8\u540e\uff0c\u9664\u4e86\u5fae\u8f6f\u548cAlphabet\uff0c\u798f\u7279\u3001T-Mobile\u3001eBay\u3001ServiceNow\u3001\u8054\u90a6\u5feb\u9012\u548cChipotle\u4e5f\u5c06\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 428.14, "end": 438.98, "text": "Thursday is just as heavy: third quarter GDP, September PCE inflation, the European Central Bank decision, and Amazon, SanDisk and Strategy earnings after the close.", "zh": "\u5468\u56db\u540c\u6837\u7e41\u91cd\uff1a\u4e09\u5b63\u5ea6GDP\u30019\u6708PCE\u901a\u80c0\u3001\u6b27\u6d32\u592e\u884c\u51b3\u8bae\uff0c\u4ee5\u53ca\u6536\u76d8\u540e\u7684\u4e9a\u9a6c\u900a\u3001\u95ea\u8fea\u548cStrategy\u8d22\u62a5\u3002"}, {"start": 438.98, "end": 448.54, "text": "Friday brings the Bank of Japan decision, euro area GDP, the U.S. employment cost index, and the weekly options expiry that has those large moves priced.", "zh": "\u5468\u4e94\u6709\u65e5\u672c\u592e\u884c\u51b3\u8bae\u3001\u6b27\u5143\u533aGDP\u3001\u7f8e\u56fd\u5c31\u4e1a\u6210\u672c\u6307\u6570\uff0c\u4ee5\u53ca\u5df2\u5b9a\u4ef7\u5927\u5e45\u6ce2\u52a8\u7684\u5468\u5ea6\u671f\u6743\u5230\u671f\u3002"}, {"start": 448.54, "end": 461.69, "text": "Now the strategy chapter. This is analysis only, read-only, no trading action taken. Spreads only, never naked shorts, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit.", "zh": "\u73b0\u5728\u8bf4\u7b56\u7565\u7ae0\u8282\u3002\u8fd9\u53ea\u662f\u5206\u6790\uff0c\u53ea\u8bfb\uff0c\u6ca1\u6709\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002\u53ea\u505a\u4ef7\u5dee\uff0c\u7edd\u4e0d\u88f8\u5356\uff0c\u5269\u4f5914\u81f330\u5929\uff0c\u5728\u8d5a\u523050%\u81f370%\u6743\u5229\u91d1\u65f6\u79bb\u573a\u3002"}, {"start": 461.69, "end": 474.34, "text": "The regime is simple to state and hard to trade: selling premium this morning means collecting Tuesday's volatility for Wednesday's three binary events. Size for the gap, or wait for the post-print volatility crush.", "zh": "\u683c\u5c40\u8bf4\u8d77\u6765\u7b80\u5355\u3001\u505a\u8d77\u6765\u96be\uff1a\u4eca\u65e9\u5356\u51fa\u6743\u5229\u91d1\uff0c\u7b49\u4e8e\u7528\u5468\u4e8c\u7684\u6ce2\u52a8\u7387\u53bb\u8d4c\u5468\u4e09\u7684\u4e09\u91cd\u4e8c\u5143\u4e8b\u4ef6\u3002\u8981\u6309\u8df3\u7a7a\u6765\u63a7\u5236\u4ed3\u4f4d\uff0c\u6216\u8005\u7b49\u5f85\u8d22\u62a5\u540e\u7684\u6ce2\u52a8\u7387\u56de\u843d\u3002"}, {"start": 474.34, "end": 487.58, "text": "For KORU, the playbook default stays a bear call spread: far out of the money, ten to fifteen delta, three to five dollar wing width. A twelve percent pre-market gap is a rip to sell into, not strength to chase with puts.", "zh": "\u5bf9\u4e8eKORU\uff0c\u624b\u518c\u9ed8\u8ba4\u65b9\u5411\u4ecd\u662f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff1a\u6df1\u5ea6\u865a\u503c\u300110\u81f315 delta\u30013\u81f35\u7f8e\u5143\u7ffc\u5bbd\u3002\u76d8\u524d12%\u7684\u8df3\u7a7a\u662f\u9022\u9ad8\u5356\u51fa\u7684\u673a\u4f1a\uff0c\u4e0d\u662f\u8ffd\u6da8\u5356\u770b\u8dcc\u671f\u6743\u7684\u597d\u65f6\u673a\u3002"}, {"start": 487.58, "end": 501.1, "text": "For LABU, the calmer triple leveraged fund, the put spread side is the trend side, with fifteen to twenty delta and slightly narrower wings. But with the Fed at two p.m., there is no new reason to add size before the prints.", "zh": "\u5bf9\u4e8e\u66f4\u5e73\u9759\u7684\u4e09\u500d\u57fa\u91d1LABU\uff0c\u770b\u8dcc\u4ef7\u5dee\u4e00\u4fa7\u987a\u5e94\u8d8b\u52bf\uff0c15\u81f320 delta\u3001\u7ffc\u5bbd\u7565\u7a84\u3002\u4f46\u7f8e\u8054\u50a8\u51b3\u8bae\u5728\u4e0b\u53482\u70b9\uff0c\u4e4b\u524d\u6ca1\u6709\u65b0\u589e\u4ed3\u4f4d\u7684\u7406\u7531\u3002"}, {"start": 501.1, "end": 513.7, "text": "For SOXL, TECL and TQQQ, the same logic applies: keep strikes far and wings wide enough to survive a one day gap, or wait. The memory bounce is the event, not the entry.", "zh": "\u5bf9\u4e8eSOXL\u3001TECL\u548cTQQQ\uff0c\u903b\u8f91\u76f8\u540c\uff1a\u884c\u6743\u4ef7\u8981\u8fdc\u3001\u7ffc\u5bbd\u8981\u80fd\u627f\u53d7\u4e00\u65e5\u8df3\u7a7a\uff0c\u6216\u8005\u5e72\u8106\u7b49\u5f85\u3002\u5b58\u50a8\u80a1\u7684\u53cd\u5f39\u662f\u4e8b\u4ef6\u672c\u8eab\uff0c\u4e0d\u662f\u5165\u573a\u70b9\u3002"}, {"start": 513.7, "end": 522.53, "text": "For SK Hynix, the event has resolved and the gap has happened, so any new spread should be priced off post-print volatility, not off Tuesday's Seoul move.", "zh": "\u5bf9\u4e8eSK\u6d77\u529b\u58eb\uff0c\u4e8b\u4ef6\u5df2\u7ecf\u843d\u5730\u3001\u8df3\u7a7a\u5df2\u7ecf\u53d1\u751f\uff0c\u6240\u4ee5\u4efb\u4f55\u65b0\u7684\u4ef7\u5dee\u90fd\u5e94\u6309\u8d22\u62a5\u540e\u7684\u6ce2\u52a8\u7387\u5b9a\u4ef7\uff0c\u800c\u4e0d\u662f\u6309\u5468\u4e8c\u9996\u5c14\u7684\u8d70\u52bf\u5b9a\u4ef7\u3002"}, {"start": 522.53, "end": 533.88, "text": "For SanDisk, avoid a tight spread into Thursday's print, where options imply about a nine point four percent move. For Microsoft and Alphabet, do not build a thesis on a directional guess into tonight.", "zh": "\u5bf9\u4e8e\u95ea\u8fea\uff0c\u907f\u514d\u5728\u5468\u56db\u8d22\u62a5\u524d\u505a\u8fc7\u7d27\u7684\u4ef7\u5dee\uff0c\u671f\u6743\u9690\u542b\u6ce2\u52a8\u7ea69.4%\u3002\u5bf9\u4e8e\u5fae\u8f6f\u548cAlphabet\uff0c\u4e0d\u8981\u57fa\u4e8e\u5bf9\u4eca\u665a\u65b9\u5411\u7684\u731c\u6d4b\u6765\u6784\u5efa\u7b56\u7565\u3002"}, {"start": 533.88, "end": 546.36, "text": "And for UVXY, only short dated bear call spreads, or avoid it entirely. A volatility fade after the Fed works only if Warsh sounds patient; a hawkish surprise inverts it fast.", "zh": "\u5bf9\u4e8eUVXY\uff0c\u53ea\u505a\u77ed\u671f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u6216\u8005\u5b8c\u5168\u56de\u907f\u3002\u7f8e\u8054\u50a8\u540e\u7684\u6ce2\u52a8\u7387\u56de\u843d\u53ea\u6709\u5728Warsh\u63aa\u8f9e\u504f\u9e3d\u65f6\u624d\u6210\u7acb\uff1b\u504f\u9e70\u7684\u610f\u5916\u4f1a\u8fc5\u901f\u9006\u8f6c\u5b83\u3002"}, {"start": 546.36, "end": 555.84, "text": "Let's close with five things before the open. One, Tuesday was strong but Wednesday futures are mixed. Two, memory is the trade, with an earnings anchor this time.", "zh": "\u6700\u540e\u603b\u7ed3\u5f00\u76d8\u524d\u4e94\u4ef6\u4e8b\u3002\u7b2c\u4e00\uff0c\u5468\u4e8c\u5f3a\u52b2\uff0c\u4f46\u5468\u4e09\u671f\u8d27\u6da8\u8dcc\u4e92\u73b0\u3002\u7b2c\u4e8c\uff0c\u5b58\u50a8\u80a1\u662f\u4e3b\u7ebf\uff0c\u8fd9\u6b21\u6709\u4e86\u8d22\u62a5\u652f\u6491\u3002"}, {"start": 555.84, "end": 569.33, "text": "Three, the Fed decides at two p.m., and December is the real question. Four, Microsoft and Alphabet price five to six percent moves tonight. Five, oil's premium rests on an unconfirmed claim.", "zh": "\u7b2c\u4e09\uff0c\u7f8e\u8054\u50a8\u4e0b\u53482\u70b9\u51b3\u8bae\uff0c12\u6708\u624d\u662f\u771f\u6b63\u7684\u95ee\u9898\u3002\u7b2c\u56db\uff0c\u5fae\u8f6f\u548cAlphabet\u4eca\u665a\u5b9a\u4ef75%\u81f36%\u7684\u6ce2\u52a8\u3002\u7b2c\u4e94\uff0c\u539f\u6cb9\u6ea2\u4ef7\u5efa\u7acb\u5728\u4e00\u5219\u672a\u786e\u8ba4\u7684\u58f0\u660e\u4e4b\u4e0a\u3002"}, {"start": 569.33, "end": 577.01, "text": "And the three things that matter most. One, SK Hynix validated memory demand and exposed the accounting split in the same release.", "zh": "\u800c\u6700\u91cd\u8981\u7684\u4e09\u4ef6\u4e8b\u3002\u7b2c\u4e00\uff0cSK\u6d77\u529b\u58eb\u5728\u540c\u4e00\u4efd\u8d22\u62a5\u4e2d\u65e2\u9a8c\u8bc1\u4e86\u5b58\u50a8\u9700\u6c42\uff0c\u53c8\u66b4\u9732\u4e86\u4f1a\u8ba1\u53e3\u5f84\u7684\u5206\u6b67\u3002"}, {"start": 577.01, "end": 590.69, "text": "Two, Wednesday stacks three binary events into one session, with Thursday almost as heavy. Three, Korea is again the highest beta expression of the same trade, and the playbook's bear call default exists for exactly this tape.", "zh": "\u7b2c\u4e8c\uff0c\u5468\u4e09\u628a\u4e09\u91cd\u4e8c\u5143\u4e8b\u4ef6\u53e0\u52a0\u5728\u4e00\u4e2a\u4ea4\u6613\u65e5\uff0c\u5468\u56db\u4e5f\u51e0\u4e4e\u540c\u6837\u7e41\u91cd\u3002\u7b2c\u4e09\uff0c\u97e9\u56fd\u518d\u6b21\u662f\u540c\u4e00\u4ea4\u6613\u4e2d\u8d1d\u5854\u6700\u9ad8\u7684\u8868\u73b0\u5f62\u5f0f\uff0c\u624b\u518c\u7684\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\u9ed8\u8ba4\u65b9\u5411\u6b63\u662f\u4e3a\u8fd9\u79cd\u76d8\u9762\u800c\u8bbe\u3002"}, {"start": 590.69, "end": 606.41, "text": "A final word on data gaps. Pre-market percentages vary by snapshot time and source, Meta's direction conflicts across boards, and the Saudi strike, the OpenAI TPU report, and chatter about a Strategy Bitcoin sale are all unconfirmed against primary sources.", "zh": "\u6700\u540e\u8bf4\u4e00\u4e0b\u6570\u636e\u7f3a\u53e3\u3002\u76d8\u524d\u6da8\u8dcc\u5e45\u56e0\u5feb\u7167\u65f6\u95f4\u548c\u6765\u6e90\u800c\u5f02\uff0cMeta\u7684\u65b9\u5411\u5728\u4e0d\u540c\u5e73\u53f0\u4e0a\u51b2\u7a81\uff0c\u6c99\u7279\u70bc\u6cb9\u5382\u9047\u88ad\u3001OpenAI\u8d2d\u4e70TPU\u4ee5\u53caStrategy\u51fa\u552e\u6bd4\u7279\u5e01\u7684\u4f20\u8a00\u5747\u672a\u5f97\u5230\u4e00\u624b\u6765\u6e90\u8bc1\u5b9e\u3002"}, {"start": 606.41, "end": 616.54, "text": "This brief is market research only, not investment advice and not an order. Leveraged funds reset daily and decay over time, and Korean names carry overnight gap risk.", "zh": "\u672c\u7b80\u62a5\u4ec5\u4e3a\u5e02\u573a\u7814\u7a76\uff0c\u4e0d\u662f\u6295\u8d44\u5efa\u8bae\uff0c\u4e5f\u4e0d\u662f\u4ea4\u6613\u6307\u4ee4\u3002\u6760\u6746\u57fa\u91d1\u6bcf\u65e5\u91cd\u7f6e\u3001\u957f\u671f\u8870\u51cf\uff0c\u97e9\u56fd\u6807\u7684\u5e26\u6709\u9694\u591c\u8df3\u7a7a\u98ce\u9669\u3002"}, {"start": 616.54, "end": 625.9, "text": "Read-only, no trading action was taken. For positions, expiry or margin, check the broker app. Thanks for listening, and we will see you at the intraday brief.", "zh": "\u53ea\u8bfb\uff0c\u6ca1\u6709\u8fdb\u884c\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002\u5982\u9700\u4e86\u89e3\u6301\u4ed3\u3001\u5230\u671f\u6216\u4fdd\u8bc1\u91d1\uff0c\u8bf7\u67e5\u770b\u5238\u5546App\u3002\u611f\u8c22\u6536\u542c\uff0c\u76d8\u4e2d\u7b80\u62a5\u518d\u89c1\u3002"}]},{"slug": "2026-10-27-post-market", "title": "Post-Market Brief, October 27, 2026", "mp3": "2026-10-27-post-market/2026-10-27-post-market.mp3", "dur": "9:44", "lines": [{"start": 0.0, "end": 6.79, "text": "Welcome to the U.S. Stocks Post-Market Brief, for Tuesday, October 27, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u540e\u7b80\u62a5\uff0c2026\u5e7410\u670827\u65e5\u661f\u671f\u4e8c\u3002\u6211\u662fAlex\u3002"}, {"start": 6.79, "end": 17.06, "text": "And I'm Jordan. This is the post-market edition, recorded after the close, and it is pure market research. No account data, no trading orders, just what happened and what to watch.", "zh": "\u6211\u662fJordan\u3002\u8fd9\u662f\u76d8\u540e\u7248\uff0c\u6536\u76d8\u540e\u5f55\u5236\uff0c\u7eaf\u5e02\u573a\u7814\u7a76\u3002\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 17.06, "end": 21.7, "text": "Tuesday was a second straight risk-on day, led by chips, memory, and Korea.", "zh": "\u661f\u671f\u4e8c\u662f\u8fde\u7eed\u7b2c\u4e8c\u4e2a\u98ce\u9669\u504f\u597d\u56de\u5347\u7684\u65e5\u5b50\uff0c\u7531\u82af\u7247\u3001\u5b58\u50a8\u548c\u97e9\u56fd\u5e02\u573a\u9886\u6da8\u3002"}, {"start": 21.7, "end": 23.9, "text": "How did the headline indexes close?", "zh": "\u4e3b\u8981\u6307\u6570\u6536\u76d8\u5982\u4f55\uff1f"}, {"start": 23.9, "end": 44.42, "text": "The S&P 500 rose 0.60% to 7,722.60. The Nasdaq Composite rose 1.18% to 26,477.81, and the Russell 2000 rose 1.16% to 2,818.87.", "zh": "\u6807\u666e500\u4e0a\u6da80.60%\uff0c\u81f37722.60\u70b9\u3002\u7eb3\u65af\u8fbe\u514b\u7efc\u5408\u6307\u6570\u4e0a\u6da81.18%\uff0c\u81f326477.81\u70b9\uff0c\u7f57\u7d202000\u4e0a\u6da81.16%\uff0c\u81f32818.87\u70b9\u3002"}, {"start": 44.42, "end": 45.43, "text": "And the Dow?", "zh": "\u9053\u6307\u5462\uff1f"}, {"start": 45.43, "end": 53.88, "text": "The Dow was essentially flat, up just 0.03% to 52,377.57, dragged down by Boeing.", "zh": "\u9053\u6307\u57fa\u672c\u6301\u5e73\uff0c\u4ec5\u4e0a\u6da80.03%\uff0c\u81f352377.57\u70b9\uff0c\u53d7\u5230\u6ce2\u97f3\u62d6\u7d2f\u3002"}, {"start": 53.88, "end": 55.01, "text": "Why Boeing?", "zh": "\u6ce2\u97f3\u600e\u4e48\u4e86\uff1f"}, {"start": 55.01, "end": 64.97, "text": "Boeing fell 10.69% to about 168 dollars, on a third-quarter loss and a 737 Max delivery shortfall. It was the main Dow drag.", "zh": "\u6ce2\u97f3\u4e0b\u8dcc10.69%\uff0c\u81f3\u7ea6168\u7f8e\u5143\uff0c\u539f\u56e0\u662f\u4e09\u5b63\u5ea6\u4e8f\u635f\u548c737 Max\u4ea4\u4ed8\u4e0d\u8db3\u3002\u5b83\u662f\u9053\u6307\u7684\u4e3b\u8981\u62d6\u7d2f\u3002"}, {"start": 64.97, "end": 79.85, "text": "The ETF tape told the same story. SPY rose 0.58% to 769 dollars and 71 cents, and QQQ rose 1.27% to 721 dollars and 25 cents.", "zh": "ETF\u65b9\u9762\u4e5f\u4e00\u6837\u3002SPY\u4e0a\u6da80.58%\uff0c\u81f3769.71\u7f8e\u5143\uff0cQQQ\u4e0a\u6da81.27%\uff0c\u81f3721.25\u7f8e\u5143\u3002"}, {"start": 79.85, "end": 81.72, "text": "Volatility came down too?", "zh": "\u6ce2\u52a8\u7387\u4e5f\u4e0b\u6765\u4e86\uff1f"}, {"start": 81.72, "end": 91.51, "text": "Yes. The VIX fell 4.73% to 17.52. That is calmer, but Wednesday's event wall means it is not a low-risk calm.", "zh": "\u662f\u7684\u3002VIX\u4e0b\u8dcc4.73%\uff0c\u81f317.52\u3002\u867d\u7136\u66f4\u5e73\u9759\uff0c\u4f46\u5468\u4e09\u7684\u4e8b\u4ef6\u5899\u610f\u5473\u7740\u8fd9\u4e0d\u662f\u4f4e\u98ce\u9669\u7684\u5e73\u9759\u3002"}, {"start": 91.51, "end": 94.63, "text": "What about rates, oil, gold, and Bitcoin?", "zh": "\u5229\u7387\u3001\u6cb9\u4ef7\u3001\u9ec4\u91d1\u548c\u6bd4\u7279\u5e01\u5462\uff1f"}, {"start": 94.63, "end": 107.35, "text": "The 10-year yield held just under 5.00%, essentially flat. WTI crude fell about 1.4 to 1.9% to around 100 dollars and 30 cents, a second down day.", "zh": "10\u5e74\u671f\u6536\u76ca\u7387\u57fa\u672c\u6301\u5e73\uff0c\u7565\u4f4e\u4e8e5.00%\u3002WTI\u539f\u6cb9\u4e0b\u8dcc\u7ea61.4%\u81f31.9%\uff0c\u81f3\u7ea6100.30\u7f8e\u5143\uff0c\u8fde\u7eed\u7b2c\u4e8c\u5929\u4e0b\u8dcc\u3002"}, {"start": 107.35, "end": 118.22, "text": "Gold futures rose about 0.9% to roughly 4,075 dollars an ounce, and Bitcoin recovered to about 80,600 dollars, up around 1%.", "zh": "\u9ec4\u91d1\u671f\u8d27\u4e0a\u6da8\u7ea60.9%\uff0c\u81f3\u7ea64075\u7f8e\u5143\u4e00\u76ce\u53f8\uff0c\u6bd4\u7279\u5e01\u56de\u5347\u81f3\u7ea680600\u7f8e\u5143\uff0c\u4e0a\u6da8\u7ea61%\u3002"}, {"start": 118.22, "end": 120.43, "text": "But breadth was narrow, right?", "zh": "\u4f46\u5e02\u573a\u5e7f\u5ea6\u5f88\u7a84\uff0c\u5bf9\u5427\uff1f"}, {"start": 120.43, "end": 136.63, "text": "Right. Only 5 of 11 S&P sectors rose at the close, and the equal-weight S&P rose just 0.11%, far behind the cap-weighted 0.56%. This was a selective, large-cap-led rally, not a broad melt-up.", "zh": "\u6ca1\u9519\u3002\u6536\u76d8\u65f6\u6807\u666e11\u4e2a\u677f\u5757\u4e2d\u53ea\u67095\u4e2a\u4e0a\u6da8\uff0c\u7b49\u6743\u91cd\u6807\u666e\u4ec5\u4e0a\u6da80.11%\uff0c\u8fdc\u843d\u540e\u4e8e\u5e02\u503c\u52a0\u6743\u6307\u6570\u76840.56%\u3002\u8fd9\u662f\u9009\u62e9\u6027\u7684\u5927\u76d8\u80a1\u9886\u6da8\uff0c\u4e0d\u662f\u5168\u9762\u4e0a\u6da8\u3002"}, {"start": 136.63, "end": 138.14, "text": "What did the morning data show?", "zh": "\u4e0a\u5348\u7684\u6570\u636e\u5982\u4f55\uff1f"}, {"start": 138.14, "end": 148.34, "text": "September durable goods orders rose 1.8%, above expectations, and October consumer confidence jumped to 91.7, well above the roughly 81 expected.", "zh": "9\u6708\u8010\u7528\u54c1\u8ba2\u5355\u589e\u957f1.8%\uff0c\u9ad8\u4e8e\u9884\u671f\uff0c10\u6708\u6d88\u8d39\u8005\u4fe1\u5fc3\u6307\u6570\u8df3\u5347\u81f391.7\uff0c\u8fdc\u9ad8\u4e8e\u9884\u671f\u7684\u7ea681\u3002"}, {"start": 148.34, "end": 162.26, "text": "New-home sales edged down to a 676,000 annual pace, and a 5-year Treasury auction cleared at 4.845%, well below last month's 5.033%. That helped rates stay put.", "zh": "\u65b0\u5c4b\u9500\u552e\u5c0f\u5e45\u56de\u843d\u81f3\u5e74\u531667.6\u4e07\u5957\uff0c5\u5e74\u671f\u56fd\u503a\u62cd\u5356\u6536\u76ca\u7387\u4e3a4.845%\uff0c\u8fdc\u4f4e\u4e8e\u4e0a\u6708\u76845.033%\u3002\u8fd9\u5e2e\u52a9\u5229\u7387\u4fdd\u6301\u7a33\u5b9a\u3002"}, {"start": 162.26, "end": 163.3, "text": "And the Fed?", "zh": "\u7f8e\u8054\u50a8\u5462\uff1f"}, {"start": 163.3, "end": 179.93, "text": "The FOMC meets October 27 to 28. The decision lands Wednesday at 2 p.m. Eastern, with Chair Warsh speaking at 2:30. A hold at 3.75 to 4.00% is widely expected, around 90%.", "zh": "\u8054\u90a6\u516c\u5f00\u5e02\u573a\u59d4\u5458\u4f1a10\u670827\u65e5\u81f328\u65e5\u5f00\u4f1a\u3002\u51b3\u8bae\u5c06\u4e8e\u5468\u4e09\u4e1c\u90e8\u65f6\u95f4\u4e0b\u53482\u70b9\u516c\u5e03\uff0cWarsh\u4e3b\u5e2d2\u70b9\u534a\u8bb2\u8bdd\u3002\u5e02\u573a\u666e\u904d\u9884\u8ba1\u7ef4\u63013.75%\u81f34.00%\u4e0d\u53d8\uff0c\u6982\u7387\u7ea690%\u3002"}, {"start": 179.93, "end": 185.21, "text": "There is no dot plot at this meeting, and there were no Fed speakers on Tuesday. It is a blackout period.", "zh": "\u8fd9\u6b21\u4f1a\u8bae\u6ca1\u6709\u70b9\u9635\u56fe\uff0c\u5468\u4e8c\u4e5f\u6ca1\u6709\u7f8e\u8054\u50a8\u5b98\u5458\u8bb2\u8bdd\uff0c\u6b63\u5904\u4e8e\u9759\u9ed8\u671f\u3002"}, {"start": 185.21, "end": 188.21, "text": "So what actually drove the day, if not the data?", "zh": "\u90a3\u4e48\u771f\u6b63\u63a8\u52a8\u5f53\u5929\u884c\u60c5\u7684\u662f\u4ec0\u4e48\uff0c\u5982\u679c\u4e0d\u662f\u6570\u636e\uff1f"}, {"start": 188.21, "end": 203.4, "text": "The Anthropic IPO filing. Its October 26 S-1 showed first-half revenue of 16.29 billion dollars, versus 1.16 billion a year earlier, and a narrowed operating loss of about 693 million dollars.", "zh": "\u662fAnthropic\u7684IPO\u7533\u8bf7\u3002\u5b8310\u670826\u65e5\u7684S-1\u6587\u4ef6\u663e\u793a\uff0c\u4e0a\u534a\u5e74\u8425\u6536162.9\u4ebf\u7f8e\u5143\uff0c\u800c\u4e00\u5e74\u524d\u662f11.6\u4ebf\u7f8e\u5143\uff0c\u7ecf\u8425\u4e8f\u635f\u6536\u7a84\u81f3\u7ea66.93\u4ebf\u7f8e\u5143\u3002"}, {"start": 203.4, "end": 209.76, "text": "That filing repriced the whole AI funding chain for a second day: enablers up, funders down.", "zh": "\u8fd9\u4efd\u6587\u4ef6\u8fde\u7eed\u7b2c\u4e8c\u5929\u91cd\u4f30\u4e86\u6574\u4e2aAI\u8d44\u91d1\u94fe\uff1a\u8d4b\u80fd\u8005\u4e0a\u6da8\uff0c\u51fa\u8d44\u8005\u4e0b\u8dcc\u3002"}, {"start": 209.76, "end": 211.68, "text": "How did semis and memory do?", "zh": "\u534a\u5bfc\u4f53\u548c\u5b58\u50a8\u80a1\u8868\u73b0\u5982\u4f55\uff1f"}, {"start": 211.68, "end": 224.33, "text": "The SOXX semiconductor index rose almost 4%, and the Roundhill Memory ETF rose about 4.5%. Western Digital rose 6.9%, and SanDisk rose 3.9%.", "zh": "SOXX\u534a\u5bfc\u4f53\u6307\u6570\u4e0a\u6da8\u8fd14%\uff0cRoundhill\u5b58\u50a8ETF\u4e0a\u6da8\u7ea64.5%\u3002\u897f\u90e8\u6570\u636e\u4e0a\u6da86.9%\uff0c\u95ea\u8fea\u4e0a\u6da83.9%\u3002"}, {"start": 224.33, "end": 238.42, "text": "BofA sees tight memory supply into 2027 and 2028, with 3- to 5-year customer deals. But remember the counterpoint: memory names are still down 22 to 44% since July, despite strong earnings.", "zh": "\u7f8e\u94f6\u8ba4\u4e3a\u5b58\u50a8\u4f9b\u5e94\u57282027\u81f32028\u5e74\u4ecd\u7d27\u5f20\uff0c\u5ba2\u6237\u7b7e\u7ea63\u81f35\u5e74\u3002\u4f46\u522b\u5fd8\u4e86\u53cd\u9762\uff1a\u5c3d\u7ba1\u4e1a\u7ee9\u5f3a\u52b2\uff0c\u5b58\u50a8\u80a1\u81ea7\u6708\u4ee5\u6765\u4ecd\u4e0b\u8dcc22%\u81f344%\u3002"}, {"start": 238.42, "end": 240.53, "text": "What about the AI compute deals?", "zh": "AI\u7b97\u529b\u4ea4\u6613\u5462\uff1f"}, {"start": 240.53, "end": 253.73, "text": "Broadcom rose 4.04%. BofA, Blackstone, Citi, and Morgan Stanley announced a 63 billion dollar transaction for Broadcom computing capacity for Anthropic, with deliveries from 2027.", "zh": "\u535a\u901a\u4e0a\u6da84.04%\u3002\u7f8e\u94f6\u3001\u9ed1\u77f3\u3001\u82b1\u65d7\u548c\u6469\u6839\u58eb\u4e39\u5229\u5ba3\u5e03\u4e86\u4e00\u7b14630\u4ebf\u7f8e\u5143\u7684\u4ea4\u6613\uff0c\u4e3aAnthropic\u63d0\u4f9b\u535a\u901a\u7b97\u529b\uff0c2027\u5e74\u8d77\u4ea4\u4ed8\u3002"}, {"start": 253.73, "end": 264.22, "text": "Oracle rose about 3.6% on an expanded chip-supply deal with Nvidia, and CoreWeave rose 7.9% and Nebius rose 11.2%.", "zh": "\u7532\u9aa8\u6587\u56e0\u4e0e\u82f1\u4f1f\u8fbe\u6269\u5927\u7684\u82af\u7247\u4f9b\u5e94\u534f\u8bae\u4e0a\u6da8\u7ea63.6%\uff0cCoreWeave\u4e0a\u6da87.9%\uff0cNebius\u4e0a\u6da811.2%\u3002"}, {"start": 264.22, "end": 265.25, "text": "And Korea?", "zh": "\u97e9\u56fd\u5462\uff1f"}, {"start": 265.25, "end": 280.78, "text": "The KOSPI closed up 3.1% at 5,638, after opening so strongly that the exchange briefly paused program trading. Samsung rose 4.23% in Seoul, and SK hynix rose 5.18%.", "zh": "\u97e9\u56fd\u7efc\u5408\u6307\u6570\u6536\u6da83.1%\uff0c\u81f35638\u70b9\uff0c\u5f00\u76d8\u5f3a\u52b2\u5230\u4ea4\u6613\u6240\u4e00\u5ea6\u6682\u505c\u7a0b\u5e8f\u5316\u4ea4\u6613\u3002\u4e09\u661f\u5728\u9996\u5c14\u4e0a\u6da84.23%\uff0cSK\u6d77\u529b\u58eb\u4e0a\u6da85.18%\u3002"}, {"start": 280.78, "end": 283.34, "text": "How did the watchlist's leveraged funds do?", "zh": "\u81ea\u9009\u80a1\u91cc\u7684\u6760\u6746\u57fa\u91d1\u8868\u73b0\u5982\u4f55\uff1f"}, {"start": 283.34, "end": 301.1, "text": "SOXL, the 3x semiconductor fund, jumped 11.69% to 101 dollars and 8 cents. But it is still down 33.26% over the past month, and below its 20-day average near 125 dollars. A rebound inside a downtrend.", "zh": "3\u500d\u534a\u5bfc\u4f53\u57fa\u91d1SOXL\u5927\u6da811.69%\uff0c\u81f3101.08\u7f8e\u5143\u3002\u4f46\u8fc7\u53bb\u4e00\u4e2a\u6708\u4ecd\u4e0b\u8dcc33.26%\uff0c\u4e14\u4f4e\u4e8e20\u65e5\u5747\u7ebf\u7ea6125\u7f8e\u5143\u3002\u8fd9\u662f\u5728\u4e0b\u8dcc\u8d8b\u52bf\u4e2d\u7684\u53cd\u5f39\u3002"}, {"start": 301.1, "end": 314.5, "text": "KORU, the 3x Korea fund, rose 8.91% to 11 dollars and 86 cents, but it is still down 45.07% over the past month. Violent rebound, damaged trend.", "zh": "3\u500d\u97e9\u56fd\u57fa\u91d1KORU\u4e0a\u6da88.91%\uff0c\u81f311.86\u7f8e\u5143\uff0c\u4f46\u8fc7\u53bb\u4e00\u4e2a\u6708\u4ecd\u4e0b\u8dcc45.07%\u3002\u53cd\u5f39\u5267\u70c8\uff0c\u8d8b\u52bf\u4ecd\u53d7\u635f\u3002"}, {"start": 314.5, "end": 331.1, "text": "LABU, the 3x biotech fund, rose 8.39% to 242 dollars and 25 cents, its best 5-day momentum in the group. TECL rose 4.94%, and TQQQ rose 3.81%.", "zh": "3\u500d\u751f\u7269\u79d1\u6280\u57fa\u91d1LABU\u4e0a\u6da88.39%\uff0c\u81f3242.25\u7f8e\u5143\uff0c5\u65e5\u52a8\u91cf\u4e3a\u7ec4\u5185\u6700\u5f3a\u3002TECL\u4e0a\u6da84.94%\uff0cTQQQ\u4e0a\u6da83.81%\u3002"}, {"start": 331.1, "end": 343.27, "text": "The volatility fund UVXY fell just 1.27% to 17 dollars and 86 cents, a small move versus the VIX drop, which reflects futures-term structure, not a 3x spot move.", "zh": "\u6ce2\u52a8\u7387\u57fa\u91d1UVXY\u4ec5\u4e0b\u8dcc1.27%\uff0c\u81f317.86\u7f8e\u5143\uff0c\u76f8\u6bd4VIX\u7684\u8dcc\u5e45\u5f88\u5c0f\uff0c\u8fd9\u53cd\u6620\u7684\u662f\u671f\u8d27\u671f\u9650\u7ed3\u6784\uff0c\u4e0d\u662f3\u500d\u73b0\u8d27\u53d8\u52a8\u3002"}, {"start": 343.27, "end": 345.79, "text": "Single names next. Who stood out?", "zh": "\u63a5\u4e0b\u6765\u662f\u4e2a\u80a1\u3002\u8c01\u8868\u73b0\u7a81\u51fa\uff1f"}, {"start": 345.79, "end": 357.31, "text": "AMD rose 5.45% to 560 dollars and 26 cents, on its expanded partnership to power Meta's superintelligence infrastructure. It was the busiest chip stock by volume.", "zh": "AMD\u4e0a\u6da85.45%\uff0c\u81f3560.26\u7f8e\u5143\uff0c\u56e0\u5176\u6269\u5927\u4e86\u4e3aMeta\u8d85\u7ea7\u667a\u80fd\u57fa\u7840\u8bbe\u65bd\u63d0\u4f9b\u52a8\u529b\u7684\u5408\u4f5c\u3002\u5b83\u662f\u6210\u4ea4\u91cf\u6700\u5927\u7684\u82af\u7247\u80a1\u3002"}, {"start": 357.31, "end": 368.52, "text": "Bloom Energy rose 7.15% to 218 dollars and 50 cents, on AI data-center power demand, after Barclays raised its target to 316 dollars.", "zh": "Bloom Energy\u4e0a\u6da87.15%\uff0c\u81f3218.50\u7f8e\u5143\uff0c\u53d7AI\u6570\u636e\u4e2d\u5fc3\u7535\u529b\u9700\u6c42\u63a8\u52a8\uff0c\u6b64\u524d\u5df4\u514b\u83b1\u5c06\u5176\u76ee\u6807\u4ef7\u4e0a\u8c03\u81f3316\u7f8e\u5143\u3002"}, {"start": 368.52, "end": 387.31, "text": "Tesla rose 4.04% to 407 dollars and 43 cents, a second straight strong day. Micron rose 2.77% to 928 dollars and 76 cents, and SanDisk rose 3.92% to 1,304 dollars and 84 cents.", "zh": "\u7279\u65af\u62c9\u4e0a\u6da84.04%\uff0c\u81f3407.43\u7f8e\u5143\uff0c\u8fde\u7eed\u7b2c\u4e8c\u4e2a\u5f3a\u52b2\u65e5\u3002\u7f8e\u5149\u4e0a\u6da82.77%\uff0c\u81f3928.76\u7f8e\u5143\uff0c\u95ea\u8fea\u4e0a\u6da83.92%\uff0c\u81f31304.84\u7f8e\u5143\u3002"}, {"start": 387.31, "end": 401.4, "text": "Nvidia rose just 0.90% to 217 dollars and 94 cents, even as it put 3 billion dollars into Meta's offering. Apple rose 0.93%, and Alphabet's Class C shares rose 0.84%.", "zh": "\u82f1\u4f1f\u8fbe\u4ec5\u4e0a\u6da80.90%\uff0c\u81f3217.94\u7f8e\u5143\uff0c\u5c3d\u7ba1\u5b83\u5411Meta\u7684\u589e\u53d1\u6295\u5165\u4e8630\u4ebf\u7f8e\u5143\u3002\u82f9\u679c\u4e0a\u6da80.93%\uff0cAlphabet\u7684C\u7c7b\u80a1\u4e0a\u6da80.84%\u3002"}, {"start": 401.4, "end": 402.36, "text": "Who fell?", "zh": "\u8c01\u4e0b\u8dcc\u4e86\uff1f"}, {"start": 402.36, "end": 418.49, "text": "Meta fell 1.65% to 620 dollars and 13 cents, a second down day on its upsized 95 to 97.5 billion dollar equity raise for AI. Microsoft was flat, down 0.24% into Wednesday's earnings.", "zh": "Meta\u4e0b\u8dcc1.65%\uff0c\u81f3620.13\u7f8e\u5143\uff0c\u56e0\u5176\u4e3aAI\u589e\u53d1\u7684\u89c4\u6a21\u6269\u5927\u81f3950\u81f3975\u4ebf\u7f8e\u5143\uff0c\u8fde\u7eed\u7b2c\u4e8c\u5929\u4e0b\u8dcc\u3002\u5fae\u8f6f\u57fa\u672c\u6301\u5e73\uff0c\u4e0b\u8dcc0.24%\uff0c\u7b49\u5f85\u5468\u4e09\u8d22\u62a5\u3002"}, {"start": 418.49, "end": 436.13, "text": "Palantir was essentially flat, down 0.06%, lagging the tech rally, and Walmart fell 0.81%. AppLovin rose just 0.80%, near its 52-week low.", "zh": "Palantir\u57fa\u672c\u6301\u5e73\uff0c\u4e0b\u8dcc0.06%\uff0c\u8dd1\u8f93\u79d1\u6280\u80a1\u6da8\u52bf\uff0c\u6c83\u5c14\u739b\u4e0b\u8dcc0.81%\u3002AppLovin\u4ec5\u4e0a\u6da80.80%\uff0c\u63a5\u8fd152\u5468\u4f4e\u70b9\u3002"}, {"start": 436.13, "end": 438.46, "text": "Moderna had a wild day, I heard.", "zh": "\u542c\u8bf4Moderna\u5f53\u5929\u6ce2\u52a8\u5f88\u5927\u3002"}, {"start": 438.46, "end": 454.54, "text": "Yes, and this is a flagged divergence. Moderna fell about 3% in the morning on a William Blair downgrade, then closed up 4.59% at 207 dollars and 97 cents, after trading as low as 179 dollars and 53 cents.", "zh": "\u662f\u7684\uff0c\u8fd9\u662f\u4e00\u4e2a\u6807\u8bb0\u7684\u5206\u5316\u3002Moderna\u4e0a\u5348\u56e0William Blair\u4e0b\u8c03\u8bc4\u7ea7\u4e0b\u8dcc\u7ea63%\uff0c\u968f\u540e\u6536\u6da84.59%\uff0c\u81f3207.97\u7f8e\u5143\uff0c\u76d8\u4e2d\u6700\u4f4e\u66fe\u5230179.53\u7f8e\u5143\u3002"}, {"start": 454.54, "end": 469.73, "text": "SK hynix's U.S. listing rose 1.92% to 145 dollars and 36 cents. Its reported special dividend of around 12 billion dollars is UNCONFIRMED. The company says it is reviewing options, and it reports on Wednesday in Korea.", "zh": "SK\u6d77\u529b\u58eb\u7f8e\u80a1\u4e0a\u6da81.92%\uff0c\u81f3145.36\u7f8e\u5143\u3002\u636e\u4f20\u7ea6120\u4ebf\u7f8e\u5143\u7684\u7279\u522b\u80a1\u606f\u5c1a\u672a\u786e\u8ba4\u3002\u516c\u53f8\u8868\u793a\u6b63\u5728\u8bc4\u4f30\u65b9\u6848\uff0c\u5e76\u5c06\u4e8e\u5468\u4e09\u5728\u97e9\u56fd\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 469.73, "end": 471.82, "text": "After hours, anything notable?", "zh": "\u76d8\u540e\u6709\u4ec0\u4e48\u503c\u5f97\u6ce8\u610f\u7684\uff1f"}, {"start": 471.82, "end": 484.42, "text": "Visa beat expectations: adjusted earnings of 3 dollars and 48 cents a share, versus 3 dollars and 44 cents expected, and revenue of 12.14 billion dollars, up 13%.", "zh": "Visa\u8d85\u51fa\u9884\u671f\uff1a\u8c03\u6574\u540e\u6bcf\u80a1\u6536\u76ca3.48\u7f8e\u5143\uff0c\u800c\u9884\u671f\u4e3a3.44\u7f8e\u5143\uff0c\u8425\u6536121.4\u4ebf\u7f8e\u5143\uff0c\u589e\u957f13%\u3002"}, {"start": 484.42, "end": 496.85, "text": "But Visa shares still fell 1.1 to 1.8% after hours, on slower fiscal 2027 earnings guidance. Microsoft rose 0.36% after hours, and SK hynix was flat.", "zh": "\u4f46Visa\u76d8\u540e\u4ecd\u4e0b\u8dcc1.1%\u81f31.8%\uff0c\u56e02027\u8d22\u5e74\u76c8\u5229\u6307\u5f15\u653e\u7f13\u3002\u5fae\u8f6f\u76d8\u540e\u4e0a\u6da80.36%\uff0cSK\u6d77\u529b\u58eb\u6301\u5e73\u3002"}, {"start": 496.85, "end": 502.06, "text": "Now the strategy part. This brief is read-only, but what posture does it describe?", "zh": "\u73b0\u5728\u8bf4\u7b56\u7565\u90e8\u5206\u3002\u8fd9\u4efd\u7b80\u62a5\u662f\u53ea\u8bfb\u7684\uff0c\u4f46\u5b83\u63cf\u8ff0\u4e86\u4ec0\u4e48\u59ff\u6001\uff1f"}, {"start": 502.06, "end": 516.1, "text": "Spreads only, never naked. Fourteen to 30 days to expiry, far strikes, wide wings, and small size. Take profit at 50 to 70% of the credit, and keep any single trade's maximum loss to 1 to 2%.", "zh": "\u53ea\u505a\u4ef7\u5dee\uff0c\u7edd\u4e0d\u88f8\u5356\u300214\u81f330\u5929\u5230\u671f\uff0c\u8fdc\u79bb\u884c\u6743\u4ef7\uff0c\u5bbd\u7ffc\uff0c\u5c0f\u4ed3\u4f4d\u3002\u6b62\u76c8\u5728\u6743\u5229\u91d1\u768450%\u81f370%\uff0c\u5355\u7b14\u6700\u5927\u4e8f\u635f\u63a7\u5236\u57281%\u81f32%\u3002"}, {"start": 516.1, "end": 526.42, "text": "The playbook default for KORU remains a bear call spread, given its very high volatility and overnight gap risk. Selling after the event wall is cleaner than chasing Tuesday's rip.", "zh": "\u6839\u636e\u7b56\u7565\u624b\u518c\uff0cKORU\u7684\u9ed8\u8ba4\u7b56\u7565\u4ecd\u662f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u56e0\u4e3a\u5176\u6ce2\u52a8\u7387\u975e\u5e38\u9ad8\u4e14\u6709\u9694\u591c\u8df3\u7a7a\u98ce\u9669\u3002\u7b49\u4e8b\u4ef6\u5899\u8fc7\u53bb\u518d\u5356\uff0c\u6bd4\u8ffd\u9010\u5468\u4e8c\u7684\u6da8\u52bf\u66f4\u5e72\u51c0\u3002"}, {"start": 526.42, "end": 542.3, "text": "Why the extra caution? Because single-name gap risk is the binding constraint this week, not index direction. Microsoft and Alphabet report after Wednesday's close, and their historical day-after moves average 4.2 and 4.3%, either direction.", "zh": "\u4e3a\u4ec0\u4e48\u8981\u683c\u5916\u8c28\u614e\uff1f\u56e0\u4e3a\u672c\u5468\u7684\u7ea6\u675f\u662f\u5355\u53ea\u80a1\u7968\u7684\u8df3\u7a7a\u98ce\u9669\uff0c\u800c\u4e0d\u662f\u6307\u6570\u65b9\u5411\u3002\u5fae\u8f6f\u548cAlphabet\u5c06\u4e8e\u5468\u4e09\u6536\u76d8\u540e\u516c\u5e03\u8d22\u62a5\uff0c\u5386\u53f2\u4e0a\u5b83\u4eec\u8d22\u62a5\u6b21\u65e5\u7684\u5e73\u5747\u6ce2\u52a8\u5206\u522b\u4e3a4.2%\u548c4.3%\uff0c\u65b9\u5411\u4e0d\u5b9a\u3002"}, {"start": 542.3, "end": 556.27, "text": "Thursday adds third-quarter GDP and September PCE inflation at 8:30 a.m. Eastern, plus Amazon and SanDisk earnings after the close. Friday brings the Bank of Japan decision and the October 30 options expiry.", "zh": "\u5468\u56db\u8fd8\u6709\u4e09\u5b63\u5ea6GDP\u548c9\u6708PCE\u901a\u80c0\uff08\u4e1c\u90e8\u65f6\u95f4\u4e0a\u53488\u70b9\u534a\uff09\uff0c\u4ee5\u53ca\u4e9a\u9a6c\u900a\u548c\u95ea\u8fea\u6536\u76d8\u540e\u8d22\u62a5\u3002\u5468\u4e94\u6709\u65e5\u672c\u592e\u884c\u51b3\u8bae\u548c10\u670830\u65e5\u671f\u6743\u5230\u671f\u3002"}, {"start": 556.27, "end": 558.96, "text": "So, to recap Tuesday in one sentence?", "zh": "\u90a3\u4e48\uff0c\u7528\u4e00\u53e5\u8bdd\u603b\u7ed3\u5468\u4e8c\uff1f"}, {"start": 558.96, "end": 568.13, "text": "An AI funding boom revived chips, memory, and Korea for a second day, while a narrow tape and a binary Wednesday will decide whether the rebound holds.", "zh": "AI\u878d\u8d44\u70ed\u6f6e\u8fde\u7eed\u7b2c\u4e8c\u5929\u63d0\u632f\u4e86\u82af\u7247\u3001\u5b58\u50a8\u548c\u97e9\u56fd\u5e02\u573a\uff0c\u800c\u72ed\u7a84\u7684\u5e02\u573a\u5e7f\u5ea6\u548c\u4e8c\u5143\u5316\u7684\u5468\u4e09\u5c06\u51b3\u5b9a\u53cd\u5f39\u80fd\u5426\u6301\u7eed\u3002"}, {"start": 568.13, "end": 574.08, "text": "Thanks for listening. This was a market research summary only, not investment advice, and not a trade recommendation.", "zh": "\u8c22\u8c22\u6536\u542c\u3002\u8fd9\u53ea\u662f\u5e02\u573a\u7814\u7a76\u603b\u7ed3\uff0c\u4e0d\u662f\u6295\u8d44\u5efa\u8bae\uff0c\u4e5f\u4e0d\u662f\u4ea4\u6613\u63a8\u8350\u3002"}, {"start": 574.08, "end": 582.84, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "\u5bf9\u4e8e\u53ea\u6709\u5238\u5546\u624d\u80fd\u786e\u8ba4\u7684\u4e8b\u60c5\uff0c\u6bd4\u5982\u6301\u4ed3\u3001\u5230\u671f\u3001\u884c\u6743\u6216\u4fdd\u8bc1\u91d1\uff0c\u8bf7\u67e5\u770b\u4f60\u7684\u5238\u5546App\u3002\u6211\u4eec\u4e0b\u671f\u7b80\u62a5\u518d\u89c1\u3002"}, {"start": 582.84, "end": 583.85, "text": "See you then.", "zh": "\u518d\u89c1\u3002"}]},{"slug": "2026-10-27-intraday", "title": "U.S. Stocks Intraday Brief \u2014 October 27, 2026", "mp3": "2026-10-27-intraday/2026-10-27-intraday.mp3", "dur": "8:07", "lines": [{"start": 0.0, "end": 5.16, "text": "Welcome to the U.S. Stocks Intraday Brief, for Tuesday, October twenty seventh. I am Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u4e2d\u7b80\u62a5\uff0c2026\u5e7410\u670827\u65e5\u661f\u671f\u4e8c\u3002\u6211\u662f Alex\u3002"}, {"start": 5.16, "end": 14.52, "text": "And I am Jordan. This is the mid-session edition, recorded around eleven thirty Eastern. It is pure market research: no account data, no trading orders.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u76d8\u4e2d\u7248\uff0c\u7f8e\u4e1c\u65f6\u95f4\u7ea611\u70b9\u534a\u5f55\u5236\uff0c\u7eaf\u5e02\u573a\u7814\u7a76\uff1a\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\u3002"}, {"start": 14.52, "end": 22.97, "text": "The headline is a two-speed session. The Nasdaq and chip stocks lead again, but the Dow is flat to down, and the S and P has faded most of its gap.", "zh": "\u5934\u6761\u662f\u53cc\u901f\u884c\u60c5\u3002\u7eb3\u6307\u548c\u82af\u7247\u80a1\u518d\u6b21\u9886\u6da8\uff0c\u4f46\u9053\u6307\u6301\u5e73\u504f\u5f31\uff0c\u6807\u666e\u5df2\u56de\u5410\u5927\u90e8\u5206\u5f00\u76d8\u6da8\u5e45\u3002"}, {"start": 22.97, "end": 24.29, "text": "Give me the morning tape.", "zh": "\u8bf4\u8bf4\u4e0a\u5348\u7684\u76d8\u9762\u3002"}, {"start": 24.29, "end": 34.01, "text": "At nine fifty seven Eastern, the Dow was down zero point one four percent, the S and P up zero point one six, and the Nasdaq up zero point three eight percent.", "zh": "\u7f8e\u4e1c\u65f6\u95f49\u70b957\u5206\uff0c\u9053\u6307\u8dcc0.14%\uff0c\u6807\u666e\u6da80.16%\uff0c\u7eb3\u6307\u6da80.38%\u3002"}, {"start": 34.01, "end": 44.88, "text": "The semiconductor index was up one point eight percent, its third straight up day. Monday set it up: the S and P closed up zero point seven percent, the Nasdaq up zero point eight two.", "zh": "\u534a\u5bfc\u4f53\u6307\u6570\u6da81.8%\uff0c\u8fde\u7eed\u7b2c\u4e09\u5929\u4e0a\u6da8\u3002\u5468\u4e00\u6253\u4e0b\u4e86\u57fa\u7840\uff1a\u6807\u666e\u6da80.7%\uff0c\u7eb3\u6307\u6da80.82%\u3002"}, {"start": 44.88, "end": 57.91, "text": "Exactly. Now the data: strong headline, soft core. Durable goods rose one point eight percent in September, above expectations, but orders excluding transport rose only zero point five percent.", "zh": "\u6b63\u662f\u5982\u6b64\u3002\u518d\u770b\u6570\u636e\uff1aheadline \u5f3a\u52b2\uff0c\u6838\u5fc3\u504f\u8f6f\u30029\u6708\u8010\u7528\u54c1\u8ba2\u5355\u589e\u957f1.8%\uff0c\u9ad8\u4e8e\u9884\u671f\uff0c\u4f46\u4e0d\u542b\u8fd0\u8f93\u7684\u8ba2\u5355\u53ea\u589e\u957f0.5%\u3002"}, {"start": 57.91, "end": 60.38, "text": "Consumer confidence was the real beat, though.", "zh": "\u4f46\u6d88\u8d39\u8005\u4fe1\u5fc3\u662f\u771f\u6b63\u7684\u8d85\u9884\u671f\u3002"}, {"start": 60.38, "end": 70.7, "text": "It was. The Conference Board index jumped to ninety one point seven in October, against expectations near eighty one. September was revised up to eighty four point two.", "zh": "\u786e\u5b9e\u5982\u6b64\u3002\u4e16\u754c\u5927\u578b\u4f01\u4e1a\u8054\u5408\u4f1a\u6307\u657010\u6708\u8df3\u5347\u81f391.7\uff0c\u9884\u671f\u572881\u9644\u8fd1\u30029\u6708\u4e0a\u4fee\u81f384.2\u3002"}, {"start": 70.7, "end": 75.62, "text": "So why are yields up? The ten-year is near four point nine nine seven percent.", "zh": "\u90a3\u6536\u76ca\u7387\u4e3a\u4ec0\u4e48\u8fd8\u6da8\uff1f\u5341\u5e74\u671f\u57284.997%\u9644\u8fd1\u3002"}, {"start": 75.62, "end": 84.98, "text": "A strong headline plus a Fed decision tomorrow is enough. The two-year is near four point seven three one percent. That caps long-duration tech into tomorrow.", "zh": "\u5f3a\u52b2\u7684 headline \u6570\u636e\u52a0\u4e0a\u660e\u5929\u7684\u7f8e\u8054\u50a8\u51b3\u8bae\u5c31\u591f\u4e86\u3002\u4e24\u5e74\u671f\u57284.731%\u9644\u8fd1\u3002\u8fd9\u9650\u5236\u4e86\u957f\u4e45\u671f\u79d1\u6280\u80a1\u5728\u660e\u5929\u4e4b\u524d\u7684\u7a7a\u95f4\u3002"}, {"start": 84.98, "end": 88.18, "text": "Today is day one of the Fed meeting, and nobody is speaking.", "zh": "\u4eca\u5929\u662f\u7f8e\u8054\u50a8\u4f1a\u8bae\u7b2c\u4e00\u5929\uff0c\u800c\u4e14\u6ca1\u4eba\u8bb2\u8bdd\u3002"}, {"start": 88.18, "end": 99.46, "text": "Right, it is the blackout period. The decision comes Wednesday at two p.m. Eastern, with Chair Warsh at two thirty. The base case is a hold at three point seven five to four percent.", "zh": "\u6ca1\u9519\uff0c\u6b63\u5904\u5728\u9759\u9ed8\u671f\u3002\u51b3\u8bae\u5468\u4e09\u7f8e\u4e1c\u65f6\u95f4\u4e0b\u53482\u70b9\u516c\u5e03\uff0cWarsh \u4e3b\u5e2d2\u70b9\u534a\u8bb2\u8bdd\u3002\u57fa\u672c\u60c5\u5f62\u662f\u7ef4\u6301\u5229\u7387\u57283.75%\u81f34%\u4e0d\u53d8\u3002"}, {"start": 99.46, "end": 103.9, "text": "And tomorrow is not just the Fed. Microsoft and Google report after the close.", "zh": "\u800c\u4e14\u660e\u5929\u4e0d\u53ea\u662f\u7f8e\u8054\u50a8\u3002\u5fae\u8f6f\u548c\u8c37\u6b4c\u90fd\u5728\u6536\u76d8\u540e\u53d1\u5e03\u8d22\u62a5\u3002"}, {"start": 103.9, "end": 118.73, "text": "Exactly. That is why today's calm volatility is misleading. The VIX is near seventeen point eight, down about three percent, and the one-day gauge has fallen to about ten point five. The session is priced as quiet, but the week is not.", "zh": "\u6b63\u662f\u5982\u6b64\u3002\u8fd9\u5c31\u662f\u4e3a\u4ec0\u4e48\u4eca\u5929\u5e73\u9759\u7684\u6ce2\u52a8\u7387\u5177\u6709\u8bef\u5bfc\u6027\u3002VIX \u7ea617.8\uff0c\u8dcc\u7ea63%\uff0c\u4e00\u65e5\u6ce2\u52a8\u7387\u6307\u6807\u5df2\u8dcc\u81f3\u7ea610.5\u3002\u4eca\u5929\u88ab\u5b9a\u4ef7\u4e3a\u5e73\u9759\u7684\u4e00\u5929\uff0c\u4f46\u8fd9\u4e00\u5468\u5e76\u4e0d\u5e73\u9759\u3002"}, {"start": 118.73, "end": 122.28, "text": "To sectors. Semiconductors and memory lead again.", "zh": "\u8bf4\u8bf4\u884c\u4e1a\u3002\u534a\u5bfc\u4f53\u548c\u5b58\u50a8\u518d\u6b21\u9886\u6da8\u3002"}, {"start": 122.28, "end": 139.01, "text": "By far. Micron is up two point two eight percent, SanDisk up two point seven five, and SK Hynix up about one point seven percent. Bank of America has a buy on Micron, target one thousand five hundred fifty dollars, citing tight supply.", "zh": "\u9065\u9065\u9886\u5148\u3002\u7f8e\u5149\u6da82.28%\uff0c\u95ea\u8fea\u6da82.75%\uff0cSK \u6d77\u529b\u58eb\u6da8\u7ea61.7%\u3002\u7f8e\u56fd\u94f6\u884c\u7ed9\u4e88\u7f8e\u5149\u4e70\u5165\u8bc4\u7ea7\uff0c\u76ee\u6807\u4ef71550\u7f8e\u5143\uff0c\u7406\u7531\u662f\u4f9b\u5e94\u7d27\u5f20\u3002"}, {"start": 139.01, "end": 141.34, "text": "Korea itself had a huge day.", "zh": "\u97e9\u56fd\u5e02\u573a\u672c\u8eab\u6da8\u5e45\u5f88\u5927\u3002"}, {"start": 141.34, "end": 152.45, "text": "The Kospi rose about three to three point seven five percent, helped by third-quarter GDP of one percent, beating expectations. The surge even triggered a brief program-trading pause.", "zh": "Kospi \u6da8\u7ea63%\u81f33.75%\uff0c\u5f97\u76ca\u4e8e\u4e09\u5b63\u5ea6 GDP \u589e\u957f1%\uff0c\u8d85\u9884\u671f\u3002\u6da8\u52bf\u751a\u81f3\u4e00\u5ea6\u89e6\u53d1\u7a0b\u5e8f\u5316\u4ea4\u6613\u6682\u505c\u3002"}, {"start": 152.45, "end": 155.69, "text": "That explains the leveraged funds. What are they doing?", "zh": "\u8fd9\u5c31\u89e3\u91ca\u4e86\u6760\u6746\u57fa\u91d1\u3002\u5b83\u4eec\u8868\u73b0\u5982\u4f55\uff1f"}, {"start": 155.69, "end": 169.97, "text": "SOXL is up eight point eight five percent, KORU up seven point five four, and LABU up five point five nine. TECL is up four point six five, and TQQQ up three point three eight percent.", "zh": "SOXL \u6da88.85%\uff0cKORU \u6da87.54%\uff0cLABU \u6da85.59%\u3002TECL \u6da84.65%\uff0cTQQQ \u6da83.38%\u3002"}, {"start": 169.97, "end": 173.81, "text": "What about UVXY? The brief gives no clean number.", "zh": "UVXY \u5462\uff1f\u7b80\u62a5\u6ca1\u6709\u7ed9\u51fa\u5e72\u51c0\u6570\u5b57\u3002"}, {"start": 173.81, "end": 185.76, "text": "Deliberately. No reliable intraday UVXY quote was retrieved, and vendor prints were inconsistent. With the VIX down, UVXY should be down, but we will not quote a percentage we cannot stand behind.", "zh": "\u8fd9\u662f\u6709\u610f\u7684\u3002\u6ca1\u6709\u627e\u5230\u53ef\u9760\u7684\u76d8\u4e2d UVXY \u62a5\u4ef7\uff0c\u4f9b\u5e94\u5546\u6570\u636e\u4e5f\u4e0d\u4e00\u81f4\u3002VIX \u4e0b\u8dcc\uff0cUVXY \u5e94\u8be5\u4e0b\u8dcc\uff0c\u4f46\u6211\u4eec\u4e0d\u4f1a\u5f15\u7528\u7ad9\u4e0d\u4f4f\u811a\u7684\u767e\u5206\u6bd4\u3002"}, {"start": 185.76, "end": 199.01, "text": "AMD is up four point six seven percent, with cornerstone interest in Meta's offering, a warrant tied to its Instinct processors, and a raised target of six hundred twenty dollars. It reports on November third.", "zh": "AMD \u6da84.67%\uff0c\u53c2\u4e0e Meta \u53d1\u884c\u7684\u57fa\u77f3\u6295\u8d44\uff0c\u6709\u4e0e Instinct \u5904\u7406\u5668\u6302\u94a9\u7684\u8ba4\u80a1\u6743\u8bc1\uff0c\u76ee\u6807\u4ef7\u4e0a\u8c03\u81f3620\u7f8e\u5143\u3002\u5b83\u5c06\u4e8e11\u67083\u65e5\u53d1\u5e03\u8d22\u62a5\u3002"}, {"start": 199.01, "end": 200.88, "text": "Nvidia is quieter today.", "zh": "\u82f1\u4f1f\u8fbe\u4eca\u5929\u6bd4\u8f83\u5b89\u9759\u3002"}, {"start": 200.88, "end": 211.8, "text": "Nvidia is up zero point eight percent. It took a three billion dollar stake in Meta's offering and expanded its Muse partnership, but it is still about ten percent below its October sixth record close.", "zh": "\u82f1\u4f1f\u8fbe\u6da80.8%\u3002\u5b83\u8ba4\u8d2d\u4e86 Meta \u53d1\u884c\u4e2d\u768430\u4ebf\u7f8e\u5143\u80a1\u4efd\uff0c\u5e76\u6269\u5927\u4e86 Muse \u5408\u4f5c\uff0c\u4f46\u4ecd\u6bd410\u67086\u65e5\u7684\u5386\u53f2\u6536\u76d8\u9ad8\u70b9\u4f4e\u7ea610%\u3002"}, {"start": 211.8, "end": 215.59, "text": "Meta itself lags, down zero point eight six percent.", "zh": "Meta \u672c\u8eab\u843d\u540e\uff0c\u8dcc0.86%\u3002"}, {"start": 215.59, "end": 225.07, "text": "Yes, and below its two hundred day average. The offering was upsized to ninety seven point five billion dollars, and the close is expected on October twenty ninth.", "zh": "\u662f\u7684\uff0c\u800c\u4e14\u8dcc\u7834\u4e86200\u65e5\u5747\u7ebf\u3002\u53d1\u884c\u89c4\u6a21\u6269\u5927\u81f3975\u4ebf\u7f8e\u5143\uff0c\u9884\u8ba110\u670829\u65e5\u5b8c\u6210\u3002"}, {"start": 225.07, "end": 229.56, "text": "There is also a Meta earnings-date conflict, which we must not state as settled.", "zh": "Meta \u7684\u8d22\u62a5\u65e5\u671f\u4e5f\u6709\u51b2\u7a81\uff0c\u6211\u4eec\u4e0d\u80fd\u628a\u5b83\u8bf4\u6210\u5df2\u786e\u5b9a\u3002"}, {"start": 229.56, "end": 238.97, "text": "Correct. One wire radar lists Meta for tomorrow after the close, while other summaries say it already reported on October twenty first. That conflict is unresolved.", "zh": "\u6b63\u786e\u3002\u4e00\u4e2a\u8d44\u8baf\u96f7\u8fbe\u628a Meta \u5217\u5728\u660e\u5929\u6536\u76d8\u540e\uff0c\u800c\u5176\u4ed6\u6458\u8981\u8bf4\u5b83\u5df2\u572810\u670821\u65e5\u53d1\u5e03\u8d22\u62a5\u3002\u8fd9\u4e2a\u51b2\u7a81\u5c1a\u672a\u89e3\u51b3\u3002"}, {"start": 238.97, "end": 240.6, "text": "Tesla is the other big winner.", "zh": "\u7279\u65af\u62c9\u662f\u53e6\u4e00\u4e2a\u5927\u8d62\u5bb6\u3002"}, {"start": 240.6, "end": 250.92, "text": "Tesla is up three point four three percent, building on Monday's five point two one percent, with no single confirmed catalyst found today. Treat it as momentum, not a company announcement.", "zh": "\u7279\u65af\u62c9\u6da83.43%\uff0c\u5ef6\u7eed\u4e86\u5468\u4e005.21%\u7684\u6da8\u5e45\uff0c\u4eca\u5929\u6ca1\u6709\u627e\u5230\u5355\u4e00\u5df2\u786e\u8ba4\u50ac\u5316\u5242\u3002\u628a\u5b83\u770b\u4f5c\u52a8\u91cf\uff0c\u800c\u4e0d\u662f\u516c\u53f8\u516c\u544a\u3002"}, {"start": 250.92, "end": 263.64, "text": "Apple is up one point zero seven percent after Monday's fall. Google's Nasdaq listing is up one point zero seven percent as well. Microsoft is nearly flat, up about zero point one percent, into earnings tomorrow.", "zh": "\u82f9\u679c\u5728\u5468\u4e00\u4e0b\u8dcc\u540e\u6da81.07%\u3002\u8c37\u6b4c\u7eb3\u65af\u8fbe\u514b\u4e0a\u5e02\u80a1\u7968\u4e5f\u6da81.07%\u3002\u5fae\u8f6f\u57fa\u672c\u6301\u5e73\uff0c\u6da8\u7ea60.1%\uff0c\u540c\u6837\u5728\u660e\u5929\u8d22\u62a5\u524d\u3002"}, {"start": 263.64, "end": 268.15, "text": "Palantir is quiet, but Bloom Energy is up eight point three four percent.", "zh": "Palantir \u6bd4\u8f83\u5b89\u9759\uff0c\u4f46 Bloom Energy \u6da88.34%\u3002"}, {"start": 268.15, "end": 279.48, "text": "It is the largest single-stock gain after the leveraged funds, but no new Bloom company news was found today. Treat it as inferred continuation after its strong third-quarter report, not as an announcement.", "zh": "\u5b83\u662f\u6760\u6746\u57fa\u91d1\u4e4b\u540e\u6da8\u5e45\u6700\u5927\u7684\u4e2a\u80a1\uff0c\u4f46\u4eca\u5929\u6ca1\u6709\u627e\u5230 Bloom \u7684\u65b0\u516c\u53f8\u65b0\u95fb\u3002\u628a\u5b83\u770b\u4f5c\u4e09\u5b63\u5ea6\u5f3a\u52b2\u8d22\u62a5\u540e\u7684\u63a8\u65ad\u6027\u5ef6\u7eed\uff0c\u800c\u4e0d\u662f\u516c\u544a\u3002"}, {"start": 279.48, "end": 282.79, "text": "Now the losers. Moderna is down sharply.", "zh": "\u73b0\u5728\u8bf4\u4e0b\u8dcc\u7684\u80a1\u7968\u3002Moderna \u5927\u5e45\u4e0b\u8dcc\u3002"}, {"start": 282.79, "end": 294.72, "text": "William Blair downgraded Moderna on valuation, after a Merck-partnered melanoma trial win. Snapshots ranged from about minus three to about minus seven percent, so the brief gives a range, not a single point.", "zh": "William Blair \u5728\u4e0e\u9ed8\u514b\u5408\u4f5c\u7684\u9ed1\u8272\u7d20\u7624\u8bd5\u9a8c\u6210\u529f\u540e\uff0c\u4ee5\u4f30\u503c\u4e3a\u7531\u4e0b\u8c03\u4e86 Moderna \u8bc4\u7ea7\u3002\u4e0d\u540c\u65f6\u95f4\u7684\u5feb\u7167\u4ece\u7ea6\u8dcc3%\u5230\u7ea6\u8dcc7%\u4e0d\u7b49\uff0c\u6240\u4ee5\u7b80\u62a5\u7ed9\u51fa\u7684\u662f\u533a\u95f4\uff0c\u800c\u4e0d\u662f\u5355\u4e00\u6570\u5b57\u3002"}, {"start": 294.72, "end": 297.31, "text": "Walmart lagged, and gold miners rose.", "zh": "\u6c83\u5c14\u739b\u843d\u540e\uff0c\u91d1\u77ff\u80a1\u4e0a\u6da8\u3002"}, {"start": 297.31, "end": 308.52, "text": "Walmart is down zero point eight one percent, after pushing toward a three-month high on Monday. GDX is up one point nine eight percent, as gold held near four thousand dollars despite a firmer dollar.", "zh": "\u6c83\u5c14\u739b\u8dcc0.81%\uff0c\u6b64\u524d\u5468\u4e00\u521a\u51b2\u5411\u4e09\u4e2a\u6708\u9ad8\u70b9\u3002GDX \u6da81.98%\uff0c\u5c3d\u7ba1\u7f8e\u5143\u8d70\u5f3a\uff0c\u91d1\u4ef7\u4ecd\u5b88\u57284000\u7f8e\u5143\u9644\u8fd1\u3002"}, {"start": 308.52, "end": 312.48, "text": "Strategy, the bitcoin proxy, is up zero point six percent.", "zh": "\u6bd4\u7279\u5e01\u6982\u5ff5\u80a1 Strategy \u6da80.6%\u3002"}, {"start": 312.48, "end": 322.97, "text": "Yes, with bitcoin near eighty thousand dollars. It paused bitcoin buying last week and repurchased about two hundred five million dollars of preferred stock. It reports on Thursday.", "zh": "\u662f\u7684\uff0c\u6bd4\u7279\u5e01\u572880000\u7f8e\u5143\u9644\u8fd1\u3002\u5b83\u4e0a\u5468\u6682\u505c\u8d2d\u4e70\u6bd4\u7279\u5e01\uff0c\u8f6c\u800c\u56de\u8d2d\u4e86\u7ea62.05\u4ebf\u7f8e\u5143\u4f18\u5148\u80a1\u3002\u5b83\u5c06\u4e8e\u5468\u56db\u53d1\u5e03\u8d22\u62a5\u3002"}, {"start": 322.97, "end": 327.12, "text": "We must handle SPCX carefully. Its label is unresolved.", "zh": "SPCX \u6211\u4eec\u5fc5\u987b\u8c28\u614e\u5904\u7406\u3002\u5b83\u7684\u6807\u7b7e\u5c1a\u672a\u89e3\u51b3\u3002"}, {"start": 327.12, "end": 338.28, "text": "Exactly. Vendors label it differently: a listed SpaceX stock, a SPAC fund, or a tokenised share with no ownership rights. Do not present it as a verified listed SpaceX common stock.", "zh": "\u6b63\u662f\u5982\u6b64\u3002\u4e0d\u540c\u4f9b\u5e94\u5546\u7684\u6807\u6ce8\u4e0d\u540c\uff1a\u4e0a\u5e02\u7684 SpaceX \u80a1\u7968\u3001SPAC \u57fa\u91d1\uff0c\u6216\u6ca1\u6709\u6240\u6709\u6743\u7684\u4ee3\u5e01\u5316\u80a1\u7968\u3002\u4e0d\u8981\u628a\u5b83\u8bf4\u6210\u5df2\u9a8c\u8bc1\u7684\u4e0a\u5e02 SpaceX \u666e\u901a\u80a1\u3002"}, {"start": 338.28, "end": 348.17, "text": "To strategy. Analysis only, spreads only, fourteen to thirty days to expiry, take fifty to seventy percent of the credit. No orders, no trades.", "zh": "\u8bf4\u8bf4\u7b56\u7565\u3002\u53ea\u662f\u5206\u6790\uff0c\u4ec5\u9650\u4ef7\u5dee\uff0c\u5269\u4f5914\u81f330\u5929\uff0c\u5230\u624b50%\u81f370%\u7684\u6743\u5229\u91d1\u5c31\u79bb\u573a\u3002\u6ca1\u6709\u6307\u4ee4\uff0c\u6ca1\u6709\u4ea4\u6613\u3002"}, {"start": 348.17, "end": 362.69, "text": "Right. The key point is compressed premium. Friday expiry holds the Fed, the European Central Bank, the Bank of Japan, and three mega-cap earnings in only about one hundred five S and P points of premium. A surprise hits a short spread hard.", "zh": "\u6ca1\u9519\u3002\u5173\u952e\u662f\u6743\u5229\u91d1\u5df2\u88ab\u538b\u7f29\u3002\u5468\u4e94\u5230\u671f\u7684\u671f\u6743\u628a\u7f8e\u8054\u50a8\u3001\u6b27\u6d32\u592e\u884c\u3001\u65e5\u672c\u592e\u884c\u548c\u4e09\u5bb6\u5de8\u5934\u8d22\u62a5\u90fd\u88c5\u8fdb\u4e86\u4ec5\u7ea6105\u4e2a\u6807\u666e\u70b9\u6570\u7684\u6743\u5229\u91d1\u91cc\u3002\u610f\u5916\u4f1a\u5bf9\u7a7a\u5934\u4ef7\u5dee\u9020\u6210\u91cd\u51fb\u3002"}, {"start": 362.69, "end": 368.33, "text": "For KORU, up seven point five percent, the playbook default is still a bear call spread?", "zh": "\u5bf9\u4e8e\u6da87.5%\u7684 KORU\uff0c\u624b\u518c\u7684\u9ed8\u8ba4\u65b9\u5411\u4ecd\u662f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\u5417\uff1f"}, {"start": 368.33, "end": 383.86, "text": "Yes. Collect decay and defend against the overnight gap. But a second strong Seoul session, with SK Hynix earnings on Wednesday, can keep running. And never run a cash-secured put or a wheel here: assignment means catching a decaying triple-leveraged fund.", "zh": "\u662f\u7684\u3002\u6536\u53d6\u65f6\u95f4\u4ef7\u503c\uff0c\u5e76\u9632\u8303\u9694\u591c\u8df3\u7a7a\u3002\u4f46 SK \u6d77\u529b\u58eb\u5468\u4e09\u8d22\u62a5\u53ef\u80fd\u5e26\u6765\u7b2c\u4e8c\u4e2a\u5f3a\u52b2\u7684\u9996\u5c14\u4ea4\u6613\u65e5\u3002\u800c\u4e14\u7edd\u4e0d\u8981\u5728\u8fd9\u91cc\u505a\u73b0\u91d1\u62c5\u4fdd\u770b\u8dcc\u671f\u6743\u6216 wheel\uff1a\u88ab\u884c\u6743\u5c31\u7b49\u4e8e\u63a5\u4f4f\u4e00\u53ea\u4e0d\u65ad\u8870\u51cf\u7684\u4e09\u500d\u6760\u6746\u57fa\u91d1\u3002"}, {"start": 383.86, "end": 386.69, "text": "And LABU, up even as Moderna fell?", "zh": "LABU \u5462\uff1f\u5373\u4f7f Moderna \u4e0b\u8dcc\uff0c\u5b83\u4ecd\u4e0a\u6da8\uff1f"}, {"start": 386.69, "end": 402.84, "text": "That is the point. The fund is not one stock. The playbook allows put spreads more comfortably for LABU, with fifteen to twenty delta strikes, because it has no overnight gap and lower volatility than KORU. In an uptrend, put spreads ride trend plus decay.", "zh": "\u8fd9\u6b63\u662f\u5173\u952e\u3002\u8be5\u57fa\u91d1\u4e0d\u662f\u4e00\u53ea\u80a1\u7968\u3002\u624b\u518c\u5bf9 LABU \u66f4\u5bbd\u5bb9\u5730\u5141\u8bb8\u770b\u8dcc\u4ef7\u5dee\uff0c\u884c\u6743\u4ef7\u572815\u81f320 delta\uff0c\u56e0\u4e3a\u5b83\u6ca1\u6709\u9694\u591c\u8df3\u7a7a\uff0c\u6ce2\u52a8\u7387\u4e5f\u4f4e\u4e8e KORU\u3002\u5728\u4e0a\u5347\u8d8b\u52bf\u4e2d\uff0c\u770b\u8dcc\u4ef7\u5dee\u540c\u65f6\u4eab\u53d7\u8d8b\u52bf\u548c\u65f6\u95f4\u4ef7\u503c\u3002"}, {"start": 402.84, "end": 410.47, "text": "And for SOXL, TECL, and TQQQ: do not add size into tomorrow's earnings gap for little credit.", "zh": "\u5bf9\u4e8e SOXL\u3001TECL \u548c TQQQ\uff1a\u4e0d\u8981\u4e3a\u4e86\u5fae\u8584\u7684\u6743\u5229\u91d1\uff0c\u5728\u660e\u5929\u7684\u8d22\u62a5\u8df3\u7a7a\u524d\u52a0\u4ed3\u3002"}, {"start": 410.47, "end": 418.7, "text": "Exactly. If a spread is already near fifty to seventy percent of its credit, take it. Do not hold for the last slice through a Fed decision.", "zh": "\u6b63\u662f\u5982\u6b64\u3002\u5982\u679c\u4ef7\u5dee\u5df2\u63a5\u8fd1\u6743\u5229\u91d1\u768450%\u81f370%\uff0c\u5c31\u79bb\u573a\u3002\u4e0d\u8981\u4e3a\u4e86\u6700\u540e\u4e00\u70b9\u6743\u5229\u91d1\uff0c\u625b\u8fc7\u7f8e\u8054\u50a8\u51b3\u8bae\u3002"}, {"start": 418.7, "end": 423.1, "text": "What about Bloom, with no catalyst, or Moderna, a falling knife?", "zh": "\u5bf9\u4e8e\u6ca1\u6709\u50ac\u5316\u5242\u7684 Bloom\uff0c\u6216\u8005\u50cf Moderna \u8fd9\u6837\u4e0b\u8dcc\u4e2d\u7684\u5200\u5b50\u5462\uff1f"}, {"start": 423.1, "end": 437.33, "text": "Wide wings and far strikes are the only playbook-consistent frame for Bloom, because there is no event to price, only flow. For Moderna, strike distance matters more than direction: a spread struck near today's price has no margin for error.", "zh": "\u5bf9\u4e8e Bloom\uff0c\u53ea\u6709\u5bbd\u7fc5\u8180\u3001\u8fdc\u884c\u6743\u4ef7\u624d\u7b26\u5408\u624b\u518c\uff0c\u56e0\u4e3a\u6ca1\u6709\u4e8b\u4ef6\u53ef\u4ee5\u5b9a\u4ef7\uff0c\u53ea\u6709\u8d44\u91d1\u6d41\u3002\u5bf9\u4e8e Moderna\uff0c\u884c\u6743\u4ef7\u8ddd\u79bb\u6bd4\u65b9\u5411\u66f4\u91cd\u8981\uff1a\u884c\u6743\u4ef7\u8d34\u8fd1\u4eca\u5929\u4ef7\u683c\u7684\u4ef7\u5dee\u6ca1\u6709\u4efb\u4f55\u5bb9\u9519\u7a7a\u95f4\u3002"}, {"start": 437.33, "end": 439.37, "text": "Let us finish with the rest of the session.", "zh": "\u6700\u540e\u8bf4\u8bf4\u4eca\u5929\u5269\u4f59\u65f6\u6bb5\u3002"}, {"start": 439.37, "end": 453.29, "text": "At one p.m. Eastern, a seventy billion dollar five-year note auction, the day's key yield test. The close is at four p.m., then crude stocks at four thirty. After the close, Visa, Seagate, and Robinhood report.", "zh": "\u7f8e\u4e1c\u65f6\u95f4\u4e0b\u53481\u70b9\uff0c700\u4ebf\u7f8e\u5143\u4e94\u5e74\u671f\u56fd\u503a\u62cd\u5356\uff0c\u662f\u4eca\u5929\u5173\u952e\u7684\u6536\u76ca\u7387\u8003\u9a8c\u3002\u6536\u76d8\u5728\u4e0b\u53484\u70b9\uff0c\u4e4b\u540e4\u70b9\u534a\u516c\u5e03\u539f\u6cb9\u5e93\u5b58\u3002\u6536\u76d8\u540e\uff0cVisa\u3001Seagate \u548c Robinhood \u53d1\u5e03\u8d22\u62a5\u3002"}, {"start": 453.29, "end": 455.09, "text": "And the checkpoints into the close?", "zh": "\u6536\u76d8\u524d\u7684\u68c0\u67e5\u70b9\u5462\uff1f"}, {"start": 455.09, "end": 472.97, "text": "Watch SPY's fifty-day average near seven hundred sixty five point eight two, and whether the ten-year pushes back above five percent after the auction. Watch any Houthi or Hormuz headline: that reverses the two-day oil decline fast. Calm intraday volatility does not mean low event risk.", "zh": "\u5173\u6ce8 SPY \u768450\u65e5\u5747\u7ebf\u7ea6765.82\uff0c\u4ee5\u53ca\u62cd\u5356\u540e\u5341\u5e74\u671f\u662f\u5426\u91cd\u65b0\u7a81\u78345%\u3002\u5173\u6ce8\u4efb\u4f55\u80e1\u585e\u6216\u970d\u5c14\u6728\u5179\u7684\u6d88\u606f\uff0c\u90a3\u4f1a\u8fc5\u901f\u9006\u8f6c\u4e24\u5929\u7684\u6cb9\u4ef7\u4e0b\u8dcc\u3002\u76d8\u4e2d\u6ce2\u52a8\u7387\u5e73\u9759\u4e0d\u7b49\u4e8e\u4e8b\u4ef6\u98ce\u9669\u4f4e\u3002"}, {"start": 472.97, "end": 480.7, "text": "That is the intraday brief. Selective risk-on, compressed premium, and tomorrow is the event. Read-only, no trading action taken.", "zh": "\u8fd9\u5c31\u662f\u76d8\u4e2d\u7b80\u62a5\u3002\u9009\u62e9\u6027\u98ce\u9669\u504f\u597d\u3001\u6743\u5229\u91d1\u538b\u7f29\uff0c\u660e\u5929\u624d\u662f\u91cd\u5934\u620f\u3002\u53ea\u8bfb\uff0c\u6ca1\u6709\u91c7\u53d6\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002"}, {"start": 480.7, "end": 486.7, "text": "Thanks for listening. We will be back with the post-market edition. Good luck into the close, and stay disciplined.", "zh": "\u611f\u8c22\u6536\u542c\u3002\u76d8\u540e\u7248\u518d\u89c1\u3002\u795d\u6536\u76d8\u987a\u5229\uff0c\u4fdd\u6301\u7eaa\u5f8b\u3002"}]},{"slug": "2026-10-27-pre-market", "title": "U.S. Stocks Pre-Market Brief \u2014 October 27, 2026", "mp3": "2026-10-27-pre-market/2026-10-27-pre-market.mp3", "dur": "7:15", "lines": [{"start": 0.0, "end": 6.53, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Tuesday, October 27, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u524d\u7b80\u62a5\uff0c2026\u5e7410\u670827\u65e5\u661f\u671f\u4e8c\u3002\u6211\u662f Alex\u3002"}, {"start": 6.53, "end": 17.5, "text": "And I'm Jordan. This is the pre-market edition, recorded before the open, and it is pure market research. No account data, no trading orders, just what is happening and what to watch.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u76d8\u524d\u7248\uff0c\u5f00\u76d8\u524d\u5f55\u5236\uff0c\u7eaf\u5e02\u573a\u7814\u7a76\u3002\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 17.5, "end": 24.77, "text": "Let's start with the headline. Monday was a strong day, and Tuesday opens modestly higher \u2014 but the real test is still a day away.", "zh": "\u5148\u4ece\u5934\u6761\u5f00\u59cb\u3002\u5468\u4e00\u8868\u73b0\u5f3a\u52b2\uff0c\u5468\u4e8c\u5c0f\u5e45\u9ad8\u5f00\uff0c\u4f46\u771f\u6b63\u7684\u8003\u9a8c\u8fd8\u8981\u518d\u7b49\u4e00\u5929\u3002"}, {"start": 24.77, "end": 26.26, "text": "How strong was Monday?", "zh": "\u5468\u4e00\u6709\u591a\u5f3a\uff1f"}, {"start": 26.26, "end": 46.06, "text": "The S&P 500 rose 0.70% to 7,676.77. The Nasdaq rose 0.82% to 26,169.38, and the Dow rose 0.28% to 52,361.58.", "zh": "\u6807\u666e500\u6da80.70%\uff0c\u81f37676.77\u70b9\u3002\u7eb3\u6307\u6da80.82%\uff0c\u81f326169.38\u70b9\u3002\u9053\u6307\u6da80.28%\uff0c\u81f352361.58\u70b9\u3002"}, {"start": 46.06, "end": 47.54, "text": "And Tuesday's futures?", "zh": "\u5468\u4e8c\u7684\u671f\u8d27\u5462\uff1f"}, {"start": 47.54, "end": 65.38, "text": "Modestly higher. Early snapshots showed the Dow up 0.14% and the S&P up 0.05%, with later snapshots a bit stronger \u2014 Dow up about 0.2 to 0.29%, Nasdaq up 0.4 to 0.46%.", "zh": "\u5c0f\u5e45\u8d70\u9ad8\u3002\u65e9\u671f\u6570\u636e\u663e\u793a\u9053\u6307\u6da80.14%\uff0c\u6807\u666e\u6da80.05%\uff0c\u7a0d\u665a\u7684\u6570\u636e\u7a0d\u5f3a\uff0c\u9053\u6307\u6da8\u7ea60.2%\u81f30.29%\uff0c\u7eb3\u6307\u6da80.4%\u81f30.46%\u3002"}, {"start": 65.38, "end": 73.3, "text": "Exactly \u2014 positioning, not resolution. The overnight catalyst was Anthropic's S-1 filing, made public on Monday.", "zh": "\u6ca1\u9519\uff0c\u8fd9\u53ea\u662f\u4ed3\u4f4d\u8c03\u6574\uff0c\u4e0d\u662f\u5c18\u57c3\u843d\u5b9a\u3002\u9694\u591c\u7684\u50ac\u5316\u5242\u662f Anthropic \u5468\u4e00\u516c\u5f00\u7684\u62db\u80a1\u6587\u4ef6\u3002"}, {"start": 73.3, "end": 74.78, "text": "What did the filing show?", "z
