<div id="volMenu" class="speed-menu" hidden><div class="speed-list" style="text-align:center;padding:20px"><div id="volLabel">音量 100%</div><input type="range" id="volRange" min="0" max="100" value="100" style="width:100%"></div></div><script>const SECTIONS=[{"slug": "2026-10-30-intraday", "title": "U.S. Stocks Intraday Brief \u2014 October 30, 2026", "mp3": "2026-10-30-intraday/2026-10-30-intraday.mp3", "dur": "7:17", "lines": [{"start": 0.0, "end": 6.05, "text": "Welcome to the U.S. Stocks Intraday Brief for Friday, October 30th, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c2026\u5e7410\u670830\u65e5\u661f\u671f\u4e94\u7f8e\u80a1\u76d8\u4e2d\u7b80\u62a5\uff0c\u6211\u662fAlex\u3002"}, {"start": 6.05, "end": 12.41, "text": "And I'm Jordan. It's about half past eleven Eastern, two hours into the session, and it's a rough one for tech.", "zh": "\u6211\u662fJordan\u3002\u73b0\u5728\u7f8e\u4e1c\u65f6\u95f4\u7ea6\u5341\u4e00\u70b9\u534a\uff0c\u5f00\u76d8\u4e24\u5c0f\u65f6\uff0c\u79d1\u6280\u80a1\u65e5\u5b50\u5f88\u96be\u8fc7\u3002"}, {"start": 12.41, "end": 17.5, "text": "The headline in one sentence: the AI cash-flow test failed for a second straight day.", "zh": "\u4e00\u53e5\u8bdd\u6982\u62ec\uff1aAI\u73b0\u91d1\u6d41\u8003\u9a8c\u8fde\u7eed\u7b2c\u4e8c\u5929\u6ca1\u901a\u8fc7\u3002"}, {"start": 17.5, "end": 25.78, "text": "After Alphabet's record twelve-point-six percent drop on Thursday, Amazon and Intel reported after the close, and the market's verdict was the same.", "zh": "\u7ee7Alphabet\u5468\u56db\u521b\u7eaa\u5f55\u4e0b\u8dcc12.6%\u4e4b\u540e\uff0c\u4e9a\u9a6c\u900a\u548c\u82f1\u7279\u5c14\u76d8\u540e\u516c\u5e03\u8d22\u62a5\uff0c\u5e02\u573a\u7684\u7ed3\u8bba\u662f\u4e00\u6837\u7684\u3002"}, {"start": 25.78, "end": 31.94, "text": "Hundreds of billions in AI spending, with weakening cash generation, is being repriced, not forgiven.", "zh": "\u6570\u5343\u4ebf\u7f8e\u5143\u7684AI\u652f\u51fa\u4f34\u968f\u7740\u73b0\u91d1\u6d41\u8d70\u5f31\uff0c\u6b63\u5728\u88ab\u91cd\u65b0\u5b9a\u4ef7\uff0c\u800c\u4e0d\u662f\u88ab\u539f\u8c05\u3002"}, {"start": 31.94, "end": 39.98, "text": "Let's start with the tape. The Nasdaq is down about two-point-nine percent midday. The QQQ is around 695 dollars.", "zh": "\u5148\u770b\u76d8\u9762\u3002\u7eb3\u6307\u76d8\u4e2d\u8dcc\u7ea62.9%\uff0cQQQ\u5728695\u7f8e\u5143\u9644\u8fd1\u3002"}, {"start": 39.98, "end": 48.79, "text": "The S&P 500 ETF, SPY, is down one to one-point-four percent, near 760. The Dow is only down about a third of a percent.", "zh": "\u6807\u666e500 ETF SPY\u8dcc1%\u52301.4%\uff0c\u5728760\u9644\u8fd1\u3002\u9053\u6307\u53ea\u8dcc\u7ea60.3%\u3002"}, {"start": 48.79, "end": 54.26, "text": "Small caps gave back Thursday's gain. The IWM is down about one-point-five percent.", "zh": "\u5c0f\u76d8\u80a1\u56de\u5410\u4e86\u5468\u56db\u7684\u6da8\u5e45\uff0cIWM\u8dcc\u7ea61.5%\u3002"}, {"start": 54.26, "end": 60.67, "text": "And volatility is expanding for real. The VIX jumped about fifteen percent to near 19.8.", "zh": "\u6ce2\u52a8\u7387\u5728\u771f\u6b63\u6269\u5f20\uff0cVIX\u8df3\u6da8\u7ea615%\u81f319.8\u9644\u8fd1\u3002"}, {"start": 60.67, "end": 71.47, "text": "Thursday's close, for context: the S&P fell zero-point-three percent, the Nasdaq one-point-four, the Dow zero-point-two-five, while the Russell gained one percent.", "zh": "\u56de\u987e\u5468\u56db\u6536\u76d8\uff1a\u6807\u666e\u8dcc0.3%\uff0c\u7eb3\u6307\u8dcc1.4%\uff0c\u9053\u6307\u8dcc0.25%\uff0c\u7f57\u7d202000\u6da81%\u3002"}, {"start": 71.47, "end": 78.38, "text": "Nine of eleven S&P sectors rose Thursday. Only communication services and tech fell. That rotation is fading today.", "zh": "\u5468\u56db11\u4e2a\u677f\u5757\u67099\u4e2a\u4e0a\u6da8\uff0c\u53ea\u6709\u901a\u4fe1\u670d\u52a1\u548c\u79d1\u6280\u4e0b\u8dcc\u3002\u4eca\u5929\u8fd9\u79cd\u8f6e\u52a8\u6b63\u5728\u6d88\u9000\u3002"}, {"start": 78.38, "end": 85.66, "text": "On macro: the data was quiet. The employment cost index rose zero-point-eight percent, exactly as forecast.", "zh": "\u5b8f\u89c2\u6570\u636e\u65b9\u9762\u6bd4\u8f83\u5e73\u9759\uff1a\u5c31\u4e1a\u6210\u672c\u6307\u6570\u4e0a\u6da80.8%\uff0c\u4e0e\u9884\u671f\u5b8c\u5168\u4e00\u81f4\u3002"}, {"start": 85.66, "end": 96.89, "text": "Chicago PMI came in at 55.3, below the 56.1 expected and the prior 58.8. Still expansion, but a growth miss that added to the selling.", "zh": "\u829d\u52a0\u54e5PMI\u4e3a55.3\uff0c\u4f4e\u4e8e\u9884\u671f\u768456.1\u548c\u524d\u503c58.8\u3002\u4ecd\u5728\u6269\u5f20\uff0c\u4f46\u589e\u957f\u4e0d\u53ca\u9884\u671f\uff0c\u52a0\u5267\u4e86\u629b\u552e\u3002"}, {"start": 96.89, "end": 103.85, "text": "The Fed held rates on Wednesday at three-point-seven-five to four percent, ten to two, with two dissenters wanting a hike now.", "zh": "\u7f8e\u8054\u50a8\u5468\u4e09\u6309\u5175\u4e0d\u52a8\uff0c\u5229\u7387\u7ef4\u6301\u57283.75%\u81f34%\uff0c10\u6bd42\uff0c\u4e24\u4f4d\u59d4\u5458\u4e3b\u5f20\u7acb\u5373\u52a0\u606f\u3002"}, {"start": 103.85, "end": 113.16, "text": "The market now prices roughly a 74 to 80 percent chance of a hike in December. That's the slow-burn backdrop, but earnings are today's trigger.", "zh": "\u5e02\u573a\u76ee\u524d\u9884\u8ba112\u6708\u52a0\u606f\u7684\u6982\u7387\u7ea6\u4e3a74%\u523080%\u3002\u8fd9\u662f\u7f13\u6162\u53d1\u9175\u7684\u80cc\u666f\uff0c\u4f46\u4eca\u5929\u7684\u89e6\u53d1\u56e0\u7d20\u662f\u8d22\u62a5\u3002"}, {"start": 113.16, "end": 118.25, "text": "Two Fed speakers come this afternoon: Daly at noon, Musalem at twelve-thirty Eastern.", "zh": "\u4eca\u5929\u4e0b\u5348\u8fd8\u6709\u4e24\u4f4d\u7f8e\u8054\u50a8\u5b98\u5458\u8bb2\u8bdd\uff1aDaly\u4e2d\u534812\u70b9\uff0cMusalem 12\u70b9\u534a\u3002"}, {"start": 118.25, "end": 124.85, "text": "Rates are calm. The ten-year yield is near 4.93 percent, the dollar just below 102.", "zh": "\u5229\u7387\u65b9\u9762\u6bd4\u8f83\u5e73\u9759\uff0c\u5341\u5e74\u671f\u6536\u76ca\u7387\u57284.93%\u9644\u8fd1\uff0c\u7f8e\u5143\u5728102\u4e0b\u65b9\u3002"}, {"start": 124.85, "end": 134.98, "text": "Gold is around 4,000 to 4,015 dollars an ounce. Oil is the mover: WTI near 103 and a half dollars, up about one-point-six percent.", "zh": "\u9ec4\u91d1\u5728\u6bcf\u76ce\u53f84000\u81f34015\u7f8e\u5143\u9644\u8fd1\u3002\u539f\u6cb9\u662f\u6ce2\u52a8\u7684\u4e00\u65b9\uff1aWTI\u5728103.5\u7f8e\u5143\u9644\u8fd1\uff0c\u6da8\u7ea61.6%\u3002"}, {"start": 134.98, "end": 139.9, "text": "Oil's driver is geopolitical: Houthi attacks on Saudi Arabia lifted crude.", "zh": "\u6cb9\u4ef7\u7684\u9a71\u52a8\u56e0\u7d20\u662f\u5730\u7f18\u653f\u6cbb\uff1a\u80e1\u585e\u6b66\u88c5\u88ad\u51fb\u6c99\u7279\u63a8\u9ad8\u4e86\u539f\u6cb9\u3002"}, {"start": 139.9, "end": 147.62, "text": "One item to flag as unconfirmed: the Wall Street Journal reported a top US commander briefed the President on military options against Iran.", "zh": "\u9700\u8981\u6807\u6ce8\u4e3a\u672a\u786e\u8ba4\u7684\u4e00\u6761\u6d88\u606f\uff1a\u300a\u534e\u5c14\u8857\u65e5\u62a5\u300b\u62a5\u9053\u79f0\uff0c\u4e00\u4f4d\u7f8e\u519b\u9ad8\u7ea7\u6307\u6325\u5b98\u5411\u603b\u7edf\u6c47\u62a5\u4e86\u9488\u5bf9\u4f0a\u6717\u7684\u519b\u4e8b\u9009\u9879\u3002"}, {"start": 147.62, "end": 154.94, "text": "A possible strike as soon as next week, after the midterms, was reported. That is reported speculation, not a confirmed plan.", "zh": "\u62a5\u9053\u79f0\u6700\u65e9\u53ef\u80fd\u4e0b\u5468\u3001\u4e2d\u671f\u9009\u4e3e\u540e\u91c7\u53d6\u884c\u52a8\u3002\u8fd9\u662f\u62a5\u9053\u4e2d\u7684\u63a8\u6d4b\uff0c\u4e0d\u662f\u5df2\u786e\u8ba4\u7684\u8ba1\u5212\u3002"}, {"start": 154.94, "end": 163.03, "text": "Crypto had its own shock. Binance suffered a 6.3 billion dollar heist on Thursday and froze withdrawals, possibly until Sunday.", "zh": "\u52a0\u5bc6\u8d27\u5e01\u4e5f\u6709\u81ea\u5df1\u7684\u51b2\u51fb\u3002\u5e01\u5b89\u5468\u56db\u906d\u904763\u4ebf\u7f8e\u5143\u88ab\u76d7\uff0c\u51bb\u7ed3\u63d0\u6b3e\uff0c\u53ef\u80fd\u6301\u7eed\u5230\u5468\u65e5\u3002"}, {"start": 163.03, "end": 170.64, "text": "Bitcoin is near 78,669 dollars, down about two percent. Coinbase fell almost eight percent.", "zh": "\u6bd4\u7279\u5e01\u572878669\u7f8e\u5143\u9644\u8fd1\uff0c\u8dcc\u7ea62%\u3002Coinbase\u8dcc\u4e86\u8fd18%\u3002"}, {"start": 170.64, "end": 177.05, "text": "Now the sectors. Semiconductors are the worst hit. The SOXX is down 4.8 percent overnight.", "zh": "\u518d\u770b\u884c\u4e1a\u3002\u534a\u5bfc\u4f53\u53d7\u521b\u6700\u91cd\uff0cSOXX\u9694\u591c\u8dcc4.8%\u3002"}, {"start": 177.05, "end": 184.08, "text": "Intel warned on weak PC demand, cash burn and capacity bottlenecks, and fell roughly 25 to 29 percent.", "zh": "\u82f1\u7279\u5c14\u8b66\u544aPC\u9700\u6c42\u75b2\u8f6f\u3001\u73b0\u91d1\u6d88\u8017\u548c\u4ea7\u80fd\u74f6\u9888\uff0c\u8dcc\u4e86\u7ea625%\u523029%\u3002"}, {"start": 184.08, "end": 191.95, "text": "The memory story is remarkable. SanDisk beat and raised, announced an eight-for-one split, and still fell ten-point-five percent.", "zh": "\u5b58\u50a8\u7684\u6545\u4e8b\u5f88\u80fd\u8bf4\u660e\u95ee\u9898\u3002\u95ea\u8fea\u4e1a\u7ee9\u8d85\u9884\u671f\u5e76\u4e0a\u8c03\u6307\u5f15\uff0c\u8fd8\u5ba3\u5e03\u4e861\u62c68\uff0c\u80a1\u4ef7\u4ecd\u7136\u8dcc\u4e8610.5%\u3002"}, {"start": 191.95, "end": 198.38, "text": "The market is not debating fundamentals today. It is debating whether anyone's AI spend earns a return.", "zh": "\u5e02\u573a\u4eca\u5929\u4e0d\u662f\u5728\u4e89\u8bba\u57fa\u672c\u9762\uff0c\u800c\u662f\u5728\u4e89\u8bba\u4efb\u4f55\u4eba\u7684AI\u652f\u51fa\u662f\u5426\u80fd\u8d5a\u5230\u56de\u62a5\u3002"}, {"start": 198.38, "end": 205.46, "text": "Microsoft is the exception. Azure grew 48 percent, disclosed for the first time, and free cash flow stayed positive.", "zh": "\u5fae\u8f6f\u662f\u4f8b\u5916\u3002Azure\u589e\u957f48%\uff0c\u9996\u6b21\u62ab\u9732\uff0c\u81ea\u7531\u73b0\u91d1\u6d41\u4ecd\u4e3a\u6b63\u3002"}, {"start": 205.46, "end": 210.07, "text": "Microsoft is the most resilient big tech name, down only one-point-six percent.", "zh": "\u5fae\u8f6f\u662f\u5927\u578b\u79d1\u6280\u80a1\u4e2d\u6700\u6297\u8dcc\u7684\uff0c\u53ea\u8dcc1.6%\u3002"}, {"start": 210.07, "end": 217.44, "text": "Meta's free cash flow turned negative, and it is selling about 35 billion dollars of stock now, with up to 60 billion more to follow.", "zh": "Meta\u7684\u81ea\u7531\u73b0\u91d1\u6d41\u8f6c\u4e3a\u8d1f\u503c\uff0c\u6b63\u5728\u51fa\u552e\u7ea6350\u4ebf\u7f8e\u5143\u80a1\u7968\uff0c\u672a\u6765\u8fd8\u53ef\u80fd\u518d\u51fa\u552e600\u4ebf\u7f8e\u5143\u3002"}, {"start": 217.44, "end": 228.41, "text": "Korea is a rout. The KOSPI fell 5.25 percent to 5,626. SK Hynix fell 8.65 percent in Seoul, Samsung 6 percent.", "zh": "\u97e9\u56fd\u5e02\u573a\u5927\u8dcc\uff0cKOSPI\u8dcc5.25%\u81f35626\u70b9\u3002SK\u6d77\u529b\u58eb\u5728\u9996\u5c14\u8dcc8.65%\uff0c\u4e09\u661f\u8dcc6%\u3002"}, {"start": 228.41, "end": 235.49, "text": "Biotech is the relative refuge. Healthcare was the best sector Thursday, and LABU is only down 3.2 percent today.", "zh": "\u751f\u7269\u79d1\u6280\u662f\u76f8\u5bf9\u907f\u98ce\u6e2f\u3002\u533b\u7597\u4fdd\u5065\u662f\u5468\u56db\u8868\u73b0\u6700\u597d\u7684\u677f\u5757\uff0cLABU\u4eca\u5929\u53ea\u8dcc3.2%\u3002"}, {"start": 235.49, "end": 244.49, "text": "Now the watchlist, all 24 names. The big movers first. SOXL is down 23.4 percent to about 78 dollars.", "zh": "\u73b0\u5728\u770b\u81ea\u9009\u80a1\uff0c\u5168\u90e824\u53ea\u3002\u5148\u770b\u5927\u6ce2\u52a8\uff1aSOXL\u8dcc23.4%\u81f3\u7ea678\u7f8e\u5143\u3002"}, {"start": 244.49, "end": 251.93, "text": "KORU is down 15 percent, almost exactly three times the KOSPI drop, as the daily-reset maths dictates.", "zh": "KORU\u8dcc15%\uff0c\u51e0\u4e4e\u6b63\u597d\u662fKOSPI\u8dcc\u5e45\u7684\u4e09\u500d\uff0c\u7b26\u5408\u6bcf\u65e5\u91cd\u7f6e\u7684\u6570\u5b66\u89c4\u5f8b\u3002"}, {"start": 251.93, "end": 262.61, "text": "TECL is down 13.2 percent. TQQQ is down seven to eight percent. UVXY, the vol product, is up 11.9 percent.", "zh": "TECL\u8dcc13.2%\uff0cTQQQ\u8dcc7%\u52308%\uff0c\u6ce2\u52a8\u7387\u4ea7\u54c1UVXY\u6da811.9%\u3002"}, {"start": 262.61, "end": 268.92, "text": "AMD is down 9.4 percent with no company news. Jefferies reiterated a buy on October 29th.", "zh": "AMD\u8dcc9.4%\uff0c\u6ca1\u6709\u516c\u53f8\u6d88\u606f\u3002Jefferies\u572810\u670829\u65e5\u91cd\u7533\u4e70\u5165\u8bc4\u7ea7\u3002"}, {"start": 268.92, "end": 276.43, "text": "Micron is down 4.8 percent. Nvidia is down 3.4 percent. Palantir is down 5.1 percent.", "zh": "\u7f8e\u5149\u8dcc4.8%\uff0c\u82f1\u4f1f\u8fbe\u8dcc3.4%\uff0cPalantir\u8dcc5.1%\u3002"}, {"start": 276.43, "end": 284.71, "text": "Bloom Energy is down 7.8 percent, pulling back after its October 22nd earnings beat. Its focus now is negative operating cash flow.", "zh": "Bloom Energy\u8dcc7.8%\uff0c\u572810\u670822\u65e5\u8d22\u62a5\u8d85\u9884\u671f\u540e\u56de\u843d\uff0c\u5e02\u573a\u73b0\u5728\u5173\u6ce8\u5176\u7ecf\u8425\u73b0\u91d1\u6d41\u4e3a\u8d1f\u3002"}, {"start": 284.71, "end": 294.12, "text": "Alphabet is down about one percent, still digesting Thursday's record fall of 12.6 percent and roughly 500 billion dollars of value lost.", "zh": "Alphabet\u8dcc\u7ea61%\uff0c\u4ecd\u5728\u6d88\u5316\u5468\u56db\u521b\u7eaa\u5f55\u768412.6%\u8dcc\u5e45\u548c\u7ea65000\u4ebf\u7f8e\u5143\u5e02\u503c\u84b8\u53d1\u3002"}, {"start": 294.12, "end": 299.81, "text": "Apple is quiet, down just zero-point-three percent, into earnings Monday after the close.", "zh": "\u82f9\u679c\u5f88\u5e73\u9759\uff0c\u53ea\u8dcc0.3%\uff0c\u7b49\u5f85\u5468\u4e00\u76d8\u540e\u8d22\u62a5\u3002"}, {"start": 299.81, "end": 304.01, "text": "Tesla is down only zero-point-six percent, holding up well against tech.", "zh": "\u7279\u65af\u62c9\u53ea\u8dcc0.6%\uff0c\u76f8\u5bf9\u79d1\u6280\u80a1\u8868\u73b0\u575a\u633a\u3002"}, {"start": 304.01, "end": 310.97, "text": "AppLovin is down 8.2 percent, after hitting a 52-week low on Thursday. Earnings come November 4th.", "zh": "AppLovin\u8dcc8.2%\uff0c\u5468\u56db\u521a\u521b52\u5468\u65b0\u4f4e\uff0c\u8d22\u62a5\u572811\u67084\u65e5\u3002"}, {"start": 310.97, "end": 318.05, "text": "Walmart is the only real gainer besides UVXY and Moderna, up 1.8 percent on defensive rotation.", "zh": "\u6c83\u5c14\u739b\u662f\u9664UVXY\u548cModerna\u4e4b\u5916\u552f\u4e00\u771f\u6b63\u4e0a\u6da8\u7684\u80a1\u7968\uff0c\u6da81.8%\uff0c\u53d7\u76ca\u4e8e\u9632\u5fa1\u6027\u8f6e\u52a8\u3002"}, {"start": 318.05, "end": 324.82, "text": "Moderna is flat. Strategy, the Bitcoin name, is down seven to nine percent despite a record third quarter on paper.", "zh": "Moderna\u6301\u5e73\u3002\u6bd4\u7279\u5e01\u6982\u5ff5\u80a1Strategy\u8dcc7%\u52309%\uff0c\u5c3d\u7ba1\u7eb8\u9762\u4e0a\u7684\u4e09\u5b63\u5ea6\u4e1a\u7ee9\u521b\u4e0b\u7eaa\u5f55\u3002"}, {"start": 324.82, "end": 333.05, "text": "Gold miners fell 5.1 percent, roughly twice the gold price move. SpaceX token SPCX is down 3.9 percent.", "zh": "\u91d1\u77ff\u80a1\u8dcc5.1%\uff0c\u7ea6\u4e3a\u91d1\u4ef7\u8dcc\u5e45\u7684\u4e24\u500d\u3002SpaceX\u4ee3\u5e01SPCX\u8dcc3.9%\u3002"}, {"start": 333.05, "end": 338.62, "text": "Strategy chapter now, and this is read-only analysis. No trading action has been taken.", "zh": "\u73b0\u5728\u662f\u7b56\u7565\u7ae0\u8282\uff0c\u8fd9\u662f\u53ea\u8bfb\u5206\u6790\uff0c\u6ca1\u6709\u8fdb\u884c\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002"}, {"start": 338.62, "end": 349.25, "text": "The regime is clear: vol is expanding, and this is not a day to add size into the fade. Premiums are richer because the underlying is falling 7 to 23 percent a day.", "zh": "\u5e02\u573a\u72b6\u6001\u5f88\u660e\u786e\uff1a\u6ce2\u52a8\u7387\u5728\u6269\u5f20\uff0c\u4eca\u5929\u4e0d\u662f\u8ffd\u8dcc\u52a0\u4ed3\u7684\u65e5\u5b50\u3002\u6743\u5229\u91d1\u53d8\u8d35\u662f\u56e0\u4e3a\u6807\u7684\u6bcf\u5929\u8dcc7%\u523023%\u3002"}, {"start": 349.25, "end": 357.7, "text": "The playbook rule is sell the rip, not the crash. Any new spread sold into this tape is selling into a trend that has already run two days.", "zh": "\u624b\u518c\u7684\u89c4\u5219\u662f\u5356\u53cd\u5f39\uff0c\u4e0d\u662f\u5356\u5d29\u76d8\u3002\u5728\u8fd9\u8f6e\u884c\u60c5\u4e2d\u5356\u51fa\u65b0\u7684\u4ef7\u5dee\uff0c\u662f\u5728\u8ffd\u4e00\u4e2a\u5df2\u7ecf\u8dd1\u4e86\u4e24\u5929\u7684\u8d8b\u52bf\u3002"}, {"start": 357.7, "end": 367.01, "text": "For KORU, the bear call spread remains the default. No signal to flip to bull puts. That needs an uptrend plus shrinking vol, and today is the opposite.", "zh": "KORU\u65b9\u9762\uff0c\u770b\u8dcc\u4ef7\u5dee\u4ecd\u662f\u9ed8\u8ba4\u65b9\u5411\u3002\u6ca1\u6709\u7ffb\u8f6c\u4e3a\u770b\u6da8\u4ef7\u5dee\u7684\u4fe1\u53f7\uff0c\u90a3\u9700\u8981\u4e0a\u5347\u8d8b\u52bf\u52a0\u6ce2\u52a8\u7387\u6536\u7f29\uff0c\u800c\u4eca\u5929\u6b63\u597d\u76f8\u53cd\u3002"}, {"start": 367.01, "end": 375.46, "text": "For LABU, the calmer 3x, the trend still favours put spreads, but no new size before the weekend. Wait for the tape to stabilise.", "zh": "LABU\u662f\u6bd4\u8f83\u6e29\u548c\u76843\u500dETF\uff0c\u8d8b\u52bf\u4ecd\u6709\u5229\u4e8e\u770b\u8dcc\u4ef7\u5dee\uff0c\u4f46\u5468\u672b\u524d\u4e0d\u8981\u52a0\u4ed3\uff0c\u7b49\u76d8\u9762\u4f01\u7a33\u3002"}, {"start": 375.46, "end": 385.1, "text": "For SOXL, TECL and TQQQ, two down days on a daily-reset 3x product is where compounding does its worst damage.", "zh": "SOXL\u3001TECL\u548cTQQQ\u65b9\u9762\uff0c\u6bcf\u65e5\u91cd\u7f6e\u76843\u500d\u4ea7\u54c1\u8fde\u7eed\u4e24\u5929\u4e0b\u8dcc\uff0c\u6b63\u662f\u590d\u5229\u6548\u5e94\u4f24\u5bb3\u6700\u5927\u7684\u65f6\u5019\u3002"}, {"start": 385.1, "end": 395.14, "text": "And for UVXY, only short-dated bear call spreads, or avoid. Selling vol into a VIX that just inverted its front end, ahead of a weekend, is the wrong side.", "zh": "UVXY\u53ea\u505a\u77ed\u671f\u770b\u8dcc\u4ef7\u5dee\u6216\u56de\u907f\u3002\u5728VIX\u524d\u7aef\u5df2\u7ecf\u5012\u6302\u3001\u5468\u672b\u4e34\u8fd1\u65f6\u5356\u6ce2\u52a8\u7387\uff0c\u662f\u9519\u8bef\u7684\u4e00\u8fb9\u3002"}, {"start": 395.14, "end": 401.3, "text": "The calendar: Apple reports Monday after the close. ISM manufacturing is Monday at ten Eastern.", "zh": "\u65e5\u5386\u65b9\u9762\uff1a\u82f9\u679c\u5468\u4e00\u76d8\u540e\u516c\u5e03\u8d22\u62a5\uff0cISM\u5236\u9020\u4e1a\u6307\u6570\u5468\u4e00\u7f8e\u4e1c\u65f6\u95f4\u4e0a\u534810\u70b9\u3002"}, {"start": 401.3, "end": 406.66, "text": "Tuesday is the US midterm election. Friday brings October payrolls at eight-thirty Eastern.", "zh": "\u5468\u4e8c\u662f\u7f8e\u56fd\u4e2d\u671f\u9009\u4e3e\uff0c\u5468\u4e94\u4e0a\u53488\u70b9\u534a\u516c\u5e0310\u6708\u975e\u519c\u5c31\u4e1a\u6570\u636e\u3002"}, {"start": 406.66, "end": 414.86, "text": "Risk checkpoints into the close: QQQ at 708, the 30-week line. A reclaim reframes the day as a one-sector flush.", "zh": "\u6536\u76d8\u524d\u7684\u98ce\u9669\u70b9\uff1aQQQ\u7684708\u7f8e\u514330\u5468\u5747\u7ebf\u3002\u5982\u679c\u6536\u590d\uff0c\u610f\u5473\u7740\u4eca\u5929\u53ea\u662f\u4e00\u6b21\u884c\u4e1a\u6027\u629b\u552e\u3002"}, {"start": 414.86, "end": 422.3, "text": "VIX at 20: a push through with widening new lows confirms broad selling. And watch the Fed speakers at noon and twelve-thirty.", "zh": "VIX\u768420\u5173\u53e3\uff1a\u5982\u679c\u7a81\u7834\u5e76\u4f34\u968f\u65b0\u4f4e\u6269\u5927\uff0c\u610f\u5473\u7740\u5168\u9762\u629b\u552e\u3002\u8fd8\u8981\u5173\u6ce8\u4e2d\u5348\u548c12\u70b9\u534a\u7684\u7f8e\u8054\u50a8\u5b98\u5458\u8bb2\u8bdd\u3002"}, {"start": 422.3, "end": 429.22, "text": "The weekend gap is the unpriceable part: midterms Tuesday, Apple Monday, possible Iran headlines.", "zh": "\u5468\u672b\u8df3\u7a7a\u662f\u65e0\u6cd5\u5b9a\u4ef7\u7684\u90e8\u5206\uff1a\u5468\u4e8c\u4e2d\u671f\u9009\u4e3e\u3001\u5468\u4e00\u82f9\u679c\u8d22\u62a5\u3001\u53ef\u80fd\u7684\u4f0a\u6717\u6d88\u606f\u3002"}, {"start": 429.22, "end": 436.58, "text": "That's the intraday brief for Friday, October 30th. The full report and podcast links are on the briefs hub. See you at the post-market.", "zh": "\u8fd9\u5c31\u662f10\u670830\u65e5\u661f\u671f\u4e94\u7684\u76d8\u4e2d\u7b80\u62a5\u3002\u5b8c\u6574\u62a5\u544a\u548c\u64ad\u5ba2\u94fe\u63a5\u5728\u7b80\u62a5\u4e3b\u9875\u3002\u76d8\u540e\u518d\u89c1\u3002"}]},{"slug": "2026-10-30-pre-market", "title": "U.S. Stocks Pre-Market Brief, October 30, 2026", "mp3": "2026-10-30-pre-market/2026-10-30-pre-market.mp3", "dur": "9:43", "lines": [{"start": 0.0, "end": 5.83, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Friday, October 30, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u524d\u7b80\u62a5\uff0c2026\u5e7410\u670830\u65e5\u661f\u671f\u4e94\u3002\u6211\u662f Alex\u3002"}, {"start": 5.83, "end": 14.23, "text": "And I'm Jordan. This is pure market research, recorded before the open. No account data, no trading orders, just what is happening and what to watch.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u7eaf\u5e02\u573a\u7814\u7a76\uff0c\u5f00\u76d8\u524d\u5f55\u5236\u3002\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 14.23, "end": 20.9, "text": "Thursday's exam is now Friday's rout. The market graded the big tech earnings harshly, and the selloff deepened overnight.", "zh": "\u5468\u56db\u7684\u8003\u8bd5\uff0c\u5982\u4eca\u53d8\u6210\u4e86\u5468\u4e94\u7684\u6e83\u8d25\u3002\u5e02\u573a\u5bf9\u5927\u578b\u79d1\u6280\u80a1\u8d22\u62a5\u7684\u6253\u5206\u975e\u5e38\u4e25\u5389\uff0c\u629b\u552e\u9694\u591c\u8fdb\u4e00\u6b65\u52a0\u6df1\u3002"}, {"start": 20.9, "end": 33.22, "text": "Thursday's closes tell the story. The S and P 500 fell zero point three percent to seven thousand seven hundred twenty. The Nasdaq fell one point three eight percent to twenty-six thousand one hundred eighty-five.", "zh": "\u5468\u56db\u6536\u76d8\u8bb2\u8ff0\u4e86\u6545\u4e8b\u3002\u6807\u666e500\u8dcc0.3%\uff0c\u6536\u4e8e7720\u70b9\uff1b\u7eb3\u65af\u8fbe\u514b\u8dcc1.38%\uff0c\u6536\u4e8e26185\u70b9\u3002"}, {"start": 33.22, "end": 41.74, "text": "The Dow slipped zero point two five percent to fifty-two thousand three hundred forty-three. Small caps held up, with the Russell essentially flat.", "zh": "\u9053\u6307\u5fae\u8dcc0.25%\uff0c\u6536\u4e8e52343\u70b9\u3002\u5c0f\u76d8\u80a1\u8868\u73b0\u575a\u633a\uff0c\u7f57\u7d20\u6307\u6570\u57fa\u672c\u6301\u5e73\u3002"}, {"start": 41.74, "end": 52.22, "text": "And Friday pre-market, the split widened. Nasdaq futures are down about two point two percent. S and P futures are down about one percent. But Dow futures are flat.", "zh": "\u800c\u5468\u4e94\u76d8\u524d\uff0c\u5206\u5316\u52a0\u5267\u3002\u7eb3\u6307\u671f\u8d27\u8dcc\u7ea62.2%\uff0c\u6807\u666e\u671f\u8d27\u8dcc\u7ea61%\uff0c\u4f46\u9053\u6307\u671f\u8d27\u6301\u5e73\u3002"}, {"start": 52.22, "end": 58.9, "text": "This is a tech and AI spending repricing, not a broad market panic. The VIX is only around eighteen and a half.", "zh": "\u8fd9\u662f\u4e00\u573a\u79d1\u6280\u80a1\u548cAI\u5f00\u652f\u7684\u91cd\u65b0\u5b9a\u4ef7\uff0c\u4e0d\u662f\u5168\u9762\u7684\u5e02\u573a\u6050\u614c\u3002VIX\u4ec5\u572818.5\u5de6\u53f3\u3002"}, {"start": 58.9, "end": 67.34, "text": "Start with Alphabet, the name that set the test. It fell twelve point six percent on Thursday, its steepest one-day fall on record.", "zh": "\u5148\u8bf4Alphabet\uff0c\u5b83\u8bbe\u5b9a\u4e86\u8fd9\u573a\u8003\u9a8c\u3002\u5468\u56db\u5b83\u8dcc12.6%\uff0c\u521b\u4e0b\u53f2\u4e0a\u6700\u5927\u5355\u65e5\u8dcc\u5e45\u3002"}, {"start": 67.34, "end": 77.02, "text": "Revenue was one hundred twenty-seven point six billion dollars, but earnings per share were two dollars twelve cents, versus about three dollars expected.", "zh": "\u8425\u65361276\u4ebf\u7f8e\u5143\uff0c\u4f46\u6bcf\u80a1\u6536\u76ca2.12\u7f8e\u5143\uff0c\u8fdc\u4f4e\u4e8e\u7ea63.02\u7f8e\u5143\u7684\u9884\u671f\u3002"}, {"start": 77.02, "end": 86.3, "text": "Google Cloud more than doubled, up one hundred three percent. But search and ads missed, and capital spending hit fifty-one point four billion dollars in the quarter.", "zh": "\u8c37\u6b4c\u4e91\u6536\u5165\u7ffb\u4e86\u4e00\u500d\u591a\uff0c\u589e\u957f103%\u3002\u4f46\u641c\u7d22\u548c\u5e7f\u544a\u4e0d\u53ca\u9884\u671f\uff0c\u5f53\u5b63\u8d44\u672c\u5f00\u652f\u8fbe514\u4ebf\u7f8e\u5143\u3002"}, {"start": 86.3, "end": 97.06, "text": "Free cash flow was negative nine point one billion dollars, the second straight negative quarter. The market's question is now who pays for the AI buildout, and how fast the cash comes back.", "zh": "\u81ea\u7531\u73b0\u91d1\u6d41\u4e3a\u8d1f91\u4ebf\u7f8e\u5143\uff0c\u5df2\u662f\u8fde\u7eed\u7b2c\u4e8c\u4e2a\u5b63\u5ea6\u4e3a\u8d1f\u3002\u5e02\u573a\u73b0\u5728\u7684\u95ee\u9898\u662f\uff1a\u8c01\u6765\u4e3aAI\u5efa\u8bbe\u4e70\u5355\uff0c\u73b0\u91d1\u53c8\u591a\u5feb\u80fd\u56de\u6d41\u3002"}, {"start": 97.06, "end": 105.74, "text": "Amazon failed the same test after the close. Revenue of two hundred one point nine billion dollars and earnings of one dollar eighty-nine cents both missed.", "zh": "\u4e9a\u9a6c\u900a\u6536\u76d8\u540e\u540c\u6837\u6ca1\u901a\u8fc7\u8fd9\u573a\u8003\u9a8c\u3002\u8425\u65362019\u4ebf\u7f8e\u5143\u3001\u6bcf\u80a1\u6536\u76ca1.89\u7f8e\u5143\uff0c\u53cc\u53cc\u4e0d\u53ca\u9884\u671f\u3002"}, {"start": 105.74, "end": 118.18, "text": "Amazon Web Services grew thirty-nine percent, its fastest in nearly five years. But trailing free cash flow was negative forty-two point four billion dollars, and shares are down about seven percent pre-market.", "zh": "\u4e9a\u9a6c\u900a\u4e91\u670d\u52a1\u589e\u957f39%\uff0c\u4e3a\u8fd1\u4e94\u5e74\u6700\u5feb\u3002\u4f46\u8fc7\u53bb\u5341\u4e8c\u4e2a\u6708\u81ea\u7531\u73b0\u91d1\u6d41\u4e3a\u8d1f424\u4ebf\u7f8e\u5143\uff0c\u80a1\u4ef7\u76d8\u524d\u8dcc\u7ea67%\u3002"}, {"start": 118.18, "end": 128.74, "text": "Intel became the day's second shock. It guided fourth-quarter earnings of twenty-five cents a share, versus forty-three cents expected, and warned the PC correction could last into next year.", "zh": "\u82f1\u7279\u5c14\u6210\u4e3a\u5f53\u5929\u7684\u7b2c\u4e8c\u91cd\u51b2\u51fb\u3002\u5b83\u6307\u5f15\u56db\u5b63\u5ea6\u6bcf\u80a1\u6536\u76ca0.25\u7f8e\u5143\uff0c\u4f4e\u4e8e\u9884\u671f\u76840.43\u7f8e\u5143\uff0c\u5e76\u8b66\u544aPC\u8c03\u6574\u53ef\u80fd\u5ef6\u7eed\u5230\u660e\u5e74\u3002"}, {"start": 128.74, "end": 137.86, "text": "Intel is down about twenty-five percent pre-market. AMD, which competes with Intel in PC chips, is down six to nine percent, and reports earnings on Tuesday.", "zh": "\u82f1\u7279\u5c14\u76d8\u524d\u8dcc\u7ea625%\u3002\u5728PC\u82af\u7247\u9886\u57df\u4e0e\u82f1\u7279\u5c14\u7ade\u4e89\u7684AMD\u8dcc6%\u81f39%\uff0c\u5c06\u4e8e\u5468\u4e8c\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 137.86, "end": 147.34, "text": "Microsoft was the one name that passed. Revenue of ninety-two point three billion dollars, earnings of four dollars eighty-nine cents, and Azure up forty-eight percent.", "zh": "\u5fae\u8f6f\u662f\u552f\u4e00\u901a\u8fc7\u8003\u9a8c\u7684\u516c\u53f8\u3002\u8425\u6536923\u4ebf\u7f8e\u5143\uff0c\u6bcf\u80a1\u6536\u76ca4.89\u7f8e\u5143\uff0cAzure\u589e\u957f48%\u3002"}, {"start": 147.34, "end": 155.9, "text": "Microsoft's free cash flow was eighteen point six billion dollars. Even so, the shares closed essentially flat, after fading from an intraday high.", "zh": "\u5fae\u8f6f\u81ea\u7531\u73b0\u91d1\u6d41\u8fbe186\u4ebf\u7f8e\u5143\u3002\u5373\u4fbf\u5982\u6b64\uff0c\u80a1\u4ef7\u6536\u76d8\u57fa\u672c\u6301\u5e73\uff0c\u76d8\u4e2d\u9ad8\u70b9\u56de\u843d\u3002"}, {"start": 155.9, "end": 164.86, "text": "Now the Fed. It held rates at three point seven five to four percent, in a ten to two vote, with two officials dissenting in favour of an immediate hike.", "zh": "\u63a5\u4e0b\u6765\u662f\u7f8e\u8054\u50a8\u3002\u5b83\u7ef4\u6301\u5229\u7387\u57283.75%\u81f34%\uff0c\u4ee510\u6bd42\u6295\u7968\u901a\u8fc7\uff0c\u4e24\u4f4d\u5b98\u5458\u4e3b\u5f20\u7acb\u5373\u52a0\u606f\u800c\u6295\u4e86\u53cd\u5bf9\u7968\u3002"}, {"start": 164.86, "end": 173.38, "text": "A December hike is largely priced in, and no rate cuts are expected in 2026. The repricing is toward hikes, not cuts.", "zh": "12\u6708\u52a0\u606f\u5df2\u57fa\u672c\u5b9a\u4ef7\uff0c2026\u5e74\u9884\u8ba1\u4e0d\u4f1a\u964d\u606f\u3002\u91cd\u65b0\u5b9a\u4ef7\u7684\u65b9\u5411\u662f\u52a0\u606f\uff0c\u800c\u4e0d\u662f\u964d\u606f\u3002"}, {"start": 173.38, "end": 183.53, "text": "Growth and inflation data backed the hawkish hold. Third-quarter GDP printed three point four percent, and September core PCE was three point one percent year over year.", "zh": "\u589e\u957f\u548c\u901a\u80c0\u6570\u636e\u652f\u6301\u4e86\u504f\u9e70\u7684\u6309\u5175\u4e0d\u52a8\u3002\u4e09\u5b63\u5ea6GDP\u589e\u957f3.4%\uff0c9\u6708\u6838\u5fc3PCE\u540c\u6bd4\u589e\u957f3.1%\u3002"}, {"start": 183.53, "end": 194.4, "text": "The European Central Bank also held, at two point five percent, and a December hike there is now about eighty-eight percent priced. The Bank of Japan held at one point two five percent.", "zh": "\u6b27\u6d32\u592e\u884c\u4e5f\u6309\u5175\u4e0d\u52a8\uff0c\u7ef4\u6301\u57282.5%\uff0c12\u6708\u52a0\u606f\u6982\u7387\u73b0\u5df2\u5b9a\u4ef7\u7ea688%\u3002\u65e5\u672c\u592e\u884c\u7ef4\u6301\u57281.25%\u3002"}, {"start": 194.4, "end": 202.99, "text": "Rates are rallying on safety. The ten-year Treasury is near four point nine percent, its lowest in weeks, and the dollar is down about zero point two percent.", "zh": "\u907f\u9669\u63a8\u52a8\u7f8e\u503a\u4e0a\u6da8\u300210\u5e74\u671f\u6536\u76ca\u7387\u63a5\u8fd14.9%\uff0c\u4e3a\u6570\u5468\u6700\u4f4e\uff1b\u7f8e\u5143\u8dcc\u7ea60.2%\u3002"}, {"start": 202.99, "end": 210.43, "text": "Gold slipped below four thousand dollars, down about one percent, in forced selling as equities fell. Silver hit a new low for the year.", "zh": "\u9ec4\u91d1\u5728\u80a1\u5e02\u4e0b\u8dcc\u5f15\u53d1\u7684\u5f3a\u5236\u629b\u552e\u4e2d\u8dcc\u78344000\u7f8e\u5143\uff0c\u8dcc\u7ea61%\u3002\u767d\u94f6\u521b\u4e0b\u5e74\u5185\u65b0\u4f4e\u3002"}, {"start": 210.43, "end": 219.0, "text": "Oil is the counter-move. WTI crude is up about two percent, near one hundred four dollars, and Brent is up about one point six percent.", "zh": "\u539f\u6cb9\u8d70\u52bf\u76f8\u53cd\u3002WTI\u6da8\u7ea62%\uff0c\u63a5\u8fd1104\u7f8e\u5143\uff1b\u5e03\u4f26\u7279\u6da8\u7ea61.6%\u3002"}, {"start": 219.0, "end": 225.19, "text": "Brent is up twelve to thirteen percent in October. The driver is geopolitics, and we will come back to that.", "zh": "\u5e03\u4f26\u727910\u6708\u7d2f\u8ba1\u6da812%\u81f313%\u3002\u63a8\u52a8\u529b\u662f\u5730\u7f18\u653f\u6cbb\uff0c\u7a0d\u540e\u6211\u4eec\u4f1a\u56de\u5230\u8fd9\u4e2a\u8bdd\u9898\u3002"}, {"start": 225.19, "end": 234.43, "text": "Asia was hit hard overnight. The KOSPI crashed five percent intraday and triggered a rare five-minute trading curb, before closing down three point five percent.", "zh": "\u4e9a\u6d32\u9694\u591c\u91cd\u632b\u3002KOSPI\u76d8\u4e2d\u66b4\u8dcc5%\uff0c\u89e6\u53d1\u7f55\u89c1\u76845\u5206\u949f\u4ea4\u6613\u7194\u65ad\uff0c\u6700\u7ec8\u6536\u8dcc3.5%\u3002"}, {"start": 234.43, "end": 240.62, "text": "Samsung fell about three percent and SK Hynix about seven percent, despite both reporting record quarters.", "zh": "\u4e09\u661f\u8dcc\u7ea63%\uff0cSK\u6d77\u529b\u58eb\u8dcc\u7ea67%\uff0c\u5c3d\u7ba1\u4e24\u5bb6\u90fd\u516c\u5e03\u4e86\u521b\u7eaa\u5f55\u7684\u5b63\u5ea6\u4e1a\u7ee9\u3002"}, {"start": 240.62, "end": 250.51, "text": "SK Hynix revenue jumped three hundred twenty-eight percent, with HBM and DRAM effectively sold out through 2029. Record earnings did not protect the shares.", "zh": "SK\u6d77\u529b\u58eb\u8425\u6536\u589e\u957f328%\uff0cHBM\u548cDRAM\u52302029\u5e74\u57fa\u672c\u552e\u7f44\u3002\u521b\u7eaa\u5f55\u7684\u4e1a\u7ee9\u4e5f\u6ca1\u80fd\u4fdd\u62a4\u80a1\u4ef7\u3002"}, {"start": 250.51, "end": 261.74, "text": "SanDisk is the morning's cleanest beat and fall. Revenue jumped three hundred seventy-eight percent, earnings beat, guidance was raised, and the stock is still down nine point five percent pre-market.", "zh": "\u95ea\u8fea\u662f\u4eca\u65e9\u6700\u5178\u578b\u7684\u201c\u8d85\u9884\u671f\u5374\u4e0b\u8dcc\u201d\u3002\u8425\u6536\u589e\u957f378%\uff0c\u76c8\u5229\u8d85\u9884\u671f\u3001\u4e0a\u8c03\u6307\u5f15\uff0c\u80a1\u4ef7\u76d8\u524d\u4ecd\u8dcc9.5%\u3002"}, {"start": 261.74, "end": 272.02, "text": "The debate has flipped from sold out to is pricing peaking. Morningstar cut its SanDisk fair value to eight hundred seventy dollars, warning of a downcycle as new capacity arrives.", "zh": "\u4e89\u8bba\u5df2\u4ece\u201c\u552e\u7f44\u201d\u8f6c\u5411\u201c\u4ef7\u683c\u662f\u5426\u89c1\u9876\u201d\u3002\u6668\u661f\u5c06\u95ea\u8fea\u516c\u5141\u4ef7\u503c\u4e0b\u8c03\u81f3870\u7f8e\u5143\uff0c\u8b66\u544a\u65b0\u4ea7\u80fd\u6295\u4ea7\u540e\u53ef\u80fd\u8fdb\u5165\u4e0b\u884c\u5468\u671f\u3002"}, {"start": 272.02, "end": 283.82, "text": "In other single names, Nvidia is down two to three percent pre-market. The Justice Department is reported to be probing its Hugging Face deal, but that is reported, not confirmed by the department or by Nvidia.", "zh": "\u5176\u4ed6\u4e2a\u80a1\u65b9\u9762\uff0c\u82f1\u4f1f\u8fbe\u76d8\u524d\u8dcc2%\u81f33%\u3002\u6709\u62a5\u9053\u79f0\u53f8\u6cd5\u90e8\u6b63\u5728\u8c03\u67e5\u5176\u6536\u8d2dHugging Face\u7684\u4ea4\u6613\uff0c\u4f46\u8fd9\u53ea\u662f\u62a5\u9053\uff0c\u672a\u7ecf\u53f8\u6cd5\u90e8\u6216\u82f1\u4f1f\u8fbe\u8bc1\u5b9e\u3002"}, {"start": 283.82, "end": 296.3, "text": "Palantir reports Monday. JPMorgan initiated with an Overweight rating and a two hundred sixty-two dollar target. RBC kept its Sell rating at ninety dollars. That is the widest analyst split in the watchlist.", "zh": "Palantir\u5c06\u4e8e\u5468\u4e00\u516c\u5e03\u8d22\u62a5\u3002\u6469\u6839\u5927\u901a\u65b0\u7ed9\u4e88\u589e\u6301\u8bc4\u7ea7\u3001\u76ee\u6807\u4ef7262\u7f8e\u5143\uff1bRBC\u7ef4\u6301\u5356\u51fa\u3001\u76ee\u6807\u4ef790\u7f8e\u5143\u3002\u8fd9\u662f\u81ea\u9009\u80a1\u4e2d\u5206\u6790\u5e08\u5206\u6b67\u6700\u5927\u7684\u4e00\u53ea\u3002"}, {"start": 296.3, "end": 305.62, "text": "Apple also reports Monday, after the close, its first earnings under new chief executive John Ternus. Consensus is about one dollar ninety-eight cents a share.", "zh": "\u82f9\u679c\u4e5f\u5c06\u4e8e\u5468\u4e00\u6536\u76d8\u540e\u516c\u5e03\u8d22\u62a5\uff0c\u662f\u65b0\u4efb\u9996\u5e2d\u6267\u884c\u5b98John Ternus\u4e0a\u4efb\u540e\u7684\u9996\u4efd\u8d22\u62a5\u3002\u5e02\u573a\u9884\u671f\u6bcf\u80a1\u6536\u76ca\u7ea61.98\u7f8e\u5143\u3002"}, {"start": 305.62, "end": 317.57, "text": "In biotech, Moderna reported strong melanoma vaccine data, a forty-two percent reduction in recurrence or death risk. But shares plunged as much as twenty-five percent after partial data leaked early.", "zh": "\u751f\u7269\u79d1\u6280\u65b9\u9762\uff0cModerna\u516c\u5e03\u4e86\u5f3a\u52b2\u7684\u9ed1\u8272\u7d20\u7624\u75ab\u82d7\u6570\u636e\uff0c\u590d\u53d1\u6216\u6b7b\u4ea1\u98ce\u9669\u964d\u4f4e42%\u3002\u4f46\u90e8\u5206\u6570\u636e\u63d0\u524d\u6cc4\u9732\u540e\uff0c\u80a1\u4ef7\u4e00\u5ea6\u66b4\u8dcc25%\u3002"}, {"start": 317.57, "end": 325.85, "text": "And a preprint reanalysis attacking Moderna's flu vaccine is contested, not a regulatory action. We flag it as unconfirmed.", "zh": "\u800c\u4e00\u7bc7\u8d28\u7591Moderna\u6d41\u611f\u75ab\u82d7\u7684\u9884\u5370\u672c\u518d\u5206\u6790\u5b58\u5728\u4e89\u8bae\uff0c\u4e0d\u662f\u76d1\u7ba1\u884c\u52a8\u3002\u6211\u4eec\u5c06\u5176\u6807\u6ce8\u4e3a\u672a\u786e\u8ba4\u3002"}, {"start": 325.85, "end": 337.01, "text": "Strategy reported a record quarter on paper, almost entirely from a Bitcoin gain, but Bitcoin per share fell three point seven percent this year. The shares closed down two point four percent.", "zh": "Strategy\u8d26\u9762\u516c\u5e03\u4e86\u521b\u7eaa\u5f55\u7684\u5b63\u5ea6\u4e1a\u7ee9\uff0c\u51e0\u4e4e\u5168\u90e8\u6765\u81ea\u6bd4\u7279\u5e01\u4f30\u503c\u6536\u76ca\uff0c\u4f46\u6bcf\u80a1\u6bd4\u7279\u5e01\u6570\u91cf\u4eca\u5e74\u4e0b\u964d\u4e863.7%\u3002\u80a1\u4ef7\u6536\u8dcc2.4%\u3002"}, {"start": 337.01, "end": 343.56, "text": "Bitcoin itself is near seventy-seven to seventy-eight thousand dollars, a six-week low, after the Binance hack.", "zh": "\u6bd4\u7279\u5e01\u672c\u8eab\u5728\u5e01\u5b89\u88ab\u9ed1\u540e\u8dcc\u81f3\u7ea67.7\u4e07\u81f37.8\u4e07\u7f8e\u5143\uff0c\u521b\u516d\u5468\u65b0\u4f4e\u3002"}, {"start": 343.56, "end": 355.15, "text": "Binance's own estimate is a six point three billion dollar impact, the largest crypto theft on record if confirmed. But the loss figures differ across trackers, and none is a final audited loss.", "zh": "\u5e01\u5b89\u81ea\u8eab\u7684\u4f30\u8ba1\u662f\u635f\u5931\u7ea663\u4ebf\u7f8e\u5143\uff0c\u5982\u679c\u5c5e\u5b9e\u5c06\u662f\u52a0\u5bc6\u8d27\u5e01\u53f2\u4e0a\u6700\u5927\u76d7\u7a83\u6848\u3002\u4f46\u5404\u8ffd\u8e2a\u673a\u6784\u7684\u6570\u5b57\u4e0d\u4e00\uff0c\u6ca1\u6709\u4e00\u4e2a\u662f\u6700\u7ec8\u5ba1\u8ba1\u635f\u5931\u3002"}, {"start": 355.15, "end": 362.95, "text": "Attribution to a North Korean group comes from one research firm only. It is not confirmed by Binance. We mark it as unconfirmed.", "zh": "\u5f52\u548e\u4e8e\u671d\u9c9c\u56e2\u4f19\u7684\u8bf4\u6cd5\u4ec5\u6765\u81ea\u4e00\u5bb6\u7814\u7a76\u673a\u6784\uff0c\u672a\u7ecf\u5e01\u5b89\u8bc1\u5b9e\u3002\u6211\u4eec\u5c06\u5176\u6807\u6ce8\u4e3a\u672a\u786e\u8ba4\u3002"}, {"start": 362.95, "end": 371.83, "text": "Gold miners are also sliding. GDX is down about three percent pre-market, with about ninety-two percent of its constituents below their fifty-day moving average.", "zh": "\u91d1\u77ff\u80a1\u4e5f\u5728\u4e0b\u6ed1\u3002GDX\u76d8\u524d\u8dcc\u7ea63%\uff0c\u7ea692%\u7684\u6210\u5206\u80a1\u4f4e\u4e8e50\u65e5\u5747\u7ebf\u3002"}, {"start": 371.83, "end": 386.66, "text": "One name needs a flag. Vendors treat SpaceX, ticker SPCX, as a public company that listed in June. That conflicts with the long-standing fact that SpaceX was private, so we treat its IPO and earnings figures as vendor-reported, not settled fact.", "zh": "\u6709\u4e00\u53ea\u6807\u7684\u9700\u8981\u6807\u6ce8\u3002\u4f9b\u5e94\u5546\u628aSpaceX\uff08\u4ee3\u7801SPCX\uff09\u5f53\u4f5c6\u6708\u4e0a\u5e02\u7684\u4e0a\u5e02\u516c\u53f8\uff0c\u8fd9\u4e0eSpaceX\u957f\u671f\u4e3a\u79c1\u8425\u516c\u53f8\u7684\u4e8b\u5b9e\u76f8\u51b2\u7a81\uff0c\u56e0\u6b64\u6211\u4eec\u5c06\u5176IPO\u548c\u8d22\u62a5\u6570\u5b57\u89c6\u4e3a\u4f9b\u5e94\u5546\u53e3\u5f84\uff0c\u800c\u975e\u65e2\u5b9a\u4e8b\u5b9e\u3002"}, {"start": 386.66, "end": 398.35, "text": "Now the leveraged names. SOXL fell four point six percent Thursday and is on track to fall more than forty-three percent in October. TECL is down eight to ten percent pre-market.", "zh": "\u518d\u770b\u6760\u6746\u57fa\u91d1\u3002SOXL\u5468\u56db\u8dcc4.6%\uff0c10\u6708\u7d2f\u8ba1\u8dcc\u5e45\u6709\u671b\u8d85\u8fc743%\u3002TECL\u76d8\u524d\u8dcc8%\u81f310%\u3002"}, {"start": 398.35, "end": 408.31, "text": "TQQQ fell four point three percent Thursday. UVXY, the volatility fund, is up about seven point eight percent pre-market to eighteen dollars.", "zh": "TQQQ\u5468\u56db\u8dcc4.3%\u3002\u6ce2\u52a8\u7387\u57fa\u91d1UVXY\u76d8\u524d\u6da8\u7ea67.8%\uff0c\u81f318\u7f8e\u5143\u3002"}, {"start": 408.31, "end": 420.6, "text": "Now the strategy chapter. This is analysis only, read-only, no trading action taken. Spreads only, never naked shorts, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit.", "zh": "\u73b0\u5728\u8bf4\u7b56\u7565\u7ae0\u8282\u3002\u8fd9\u53ea\u662f\u5206\u6790\uff0c\u53ea\u8bfb\uff0c\u6ca1\u6709\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002\u53ea\u505a\u4ef7\u5dee\uff0c\u7edd\u4e0d\u88f8\u5356\uff0c\u5269\u4f5914\u81f330\u5929\uff0c\u5728\u8d5a\u523050%\u81f370%\u6743\u5229\u91d1\u65f6\u79bb\u573a\u3002"}, {"start": 420.6, "end": 431.11, "text": "The regime is split. Index volatility is contained, with the VIX near eighteen and a half, while single-name volatility is exploding. The names paying the most premium are the ones gapping.", "zh": "\u5f53\u524d\u683c\u5c40\u662f\u5206\u5316\u7684\u3002\u6307\u6570\u6ce2\u52a8\u7387\u53d7\u63a7\uff0cVIX\u572818.5\u9644\u8fd1\uff0c\u800c\u4e2a\u80a1\u6ce2\u52a8\u7387\u6b63\u5728\u7206\u53d1\u3002\u6743\u5229\u91d1\u6700\u4e30\u539a\u7684\u6807\u7684\uff0c\u6b63\u662f\u90a3\u4e9b\u8df3\u7a7a\u7684\u6807\u7684\u3002"}, {"start": 431.11, "end": 442.51, "text": "For KORU, the bear call spread remains the default. Korea trades while U.S. markets are closed, so the gap risk is structural, not episodic. Sell the rip after a bounce, not into the hole.", "zh": "\u5bf9\u4e8eKORU\uff0c\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\u4ecd\u662f\u9ed8\u8ba4\u65b9\u5411\u3002\u97e9\u56fd\u5728\u7f8e\u56fd\u5e02\u573a\u4f11\u5e02\u65f6\u4ea4\u6613\uff0c\u56e0\u6b64\u8df3\u7a7a\u98ce\u9669\u662f\u7ed3\u6784\u6027\u7684\uff0c\u4e0d\u662f\u5076\u53d1\u7684\u3002\u5e94\u5728\u53cd\u5f39\u540e\u5356\u51fa\uff0c\u800c\u4e0d\u662f\u5728\u4f4e\u70b9\u8ffd\u5356\u3002"}, {"start": 442.51, "end": 452.23, "text": "For LABU, the one leveraged name that rose Thursday, put spreads are the trend-following side. There is no overnight gap risk, since all its holdings trade in U.S. hours.", "zh": "\u5bf9\u4e8e\u5468\u56db\u552f\u4e00\u4e0a\u6da8\u7684\u6760\u6746\u57fa\u91d1LABU\uff0c\u770b\u8dcc\u4ef7\u5dee\u4e00\u4fa7\u987a\u5e94\u8d8b\u52bf\u3002\u7531\u4e8e\u5168\u90e8\u6301\u4ed3\u90fd\u5728\u7f8e\u56fd\u4ea4\u6613\u65f6\u6bb5\u4ea4\u6613\uff0c\u4e0d\u5b58\u5728\u9694\u591c\u8df3\u7a7a\u98ce\u9669\u3002"}, {"start": 452.23, "end": 465.14, "text": "For SOXL, TECL and TQQQ, the posture is bear call spreads on bounces, not bull put spreads into a falling tape. Put spreads only after a support level is tested and holds.", "zh": "\u5bf9\u4e8eSOXL\u3001TECL\u548cTQQQ\uff0c\u7b56\u7565\u662f\u5728\u53cd\u5f39\u65f6\u505a\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u800c\u4e0d\u662f\u5728\u4e0b\u8dcc\u8d8b\u52bf\u4e2d\u505a\u725b\u5e02\u770b\u8dcc\u4ef7\u5dee\u3002\u53ea\u6709\u652f\u6491\u4f4d\u7ecf\u53d7\u8003\u9a8c\u5e76\u5b88\u4f4f\u540e\uff0c\u624d\u8003\u8651\u770b\u8dcc\u4ef7\u5dee\u3002"}, {"start": 465.14, "end": 473.11, "text": "For UVXY, only short-dated bear call spreads, or avoid it entirely. A volatility spike reprices it violently.", "zh": "\u5bf9\u4e8eUVXY\uff0c\u53ea\u505a\u77ed\u671f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u6216\u8005\u5b8c\u5168\u56de\u907f\u3002\u6ce2\u52a8\u7387\u98d9\u5347\u4f1a\u8ba9\u5b83\u5267\u70c8\u91cd\u5b9a\u4ef7\u3002"}, {"start": 473.11, "end": 479.66, "text": "And do not hold short premium across AMD's earnings on Tuesday without wings sized for a move of ten percent or more.", "zh": "\u5e76\u4e14\uff0c\u4e0d\u8981\u5728\u6ca1\u6709\u4e3a10%\u6216\u66f4\u5927\u6ce2\u52a8\u9884\u7559\u8db3\u591f\u7ffc\u5bbd\u7684\u60c5\u51b5\u4e0b\uff0c\u6301\u6709\u8de8\u8d8a\u5468\u4e8cAMD\u8d22\u62a5\u7684\u7a7a\u5934\u6743\u5229\u91d1\u5934\u5bf8\u3002"}, {"start": 479.66, "end": 488.98, "text": "Let's close with five things before the open. One, Nasdaq futures down two point two percent while the Dow is flat. A tech repricing, not a broad panic.", "zh": "\u6700\u540e\u603b\u7ed3\u5f00\u76d8\u524d\u4e94\u4ef6\u4e8b\u3002\u7b2c\u4e00\uff0c\u7eb3\u6307\u671f\u8d27\u8dcc2.2%\uff0c\u9053\u6307\u6301\u5e73\u3002\u8fd9\u662f\u79d1\u6280\u80a1\u91cd\u65b0\u5b9a\u4ef7\uff0c\u4e0d\u662f\u5168\u9762\u6050\u614c\u3002"}, {"start": 488.98, "end": 498.1, "text": "Two, Amazon down seven percent and Intel down twenty-five percent pre-market are the overnight verdicts. Three, memory names are falling on record earnings.", "zh": "\u7b2c\u4e8c\uff0c\u4e9a\u9a6c\u900a\u76d8\u524d\u8dcc7%\u3001\u82f1\u7279\u5c14\u8dcc25%\uff0c\u662f\u9694\u591c\u7684\u88c1\u51b3\u3002\u7b2c\u4e09\uff0c\u5b58\u50a8\u80a1\u5728\u521b\u7eaa\u5f55\u4e1a\u7ee9\u4e0b\u4ecd\u5728\u4e0b\u8dcc\u3002"}, {"start": 498.1, "end": 510.98, "text": "Four, oil is the hedge that is working, up on reports the U.S. may resume strikes on Iran after the November third midterms. Five, the Employment Cost Index lands at eight thirty Eastern, minutes before the open.", "zh": "\u7b2c\u56db\uff0c\u539f\u6cb9\u662f\u6b63\u5728\u8d77\u4f5c\u7528\u7684\u5bf9\u51b2\u5de5\u5177\uff0c\u56e0\u6709\u62a5\u9053\u79f0\u7f8e\u56fd\u53ef\u80fd\u572811\u67083\u65e5\u4e2d\u671f\u9009\u4e3e\u540e\u6062\u590d\u5bf9\u4f0a\u6717\u7684\u6253\u51fb\u800c\u4e0a\u6da8\u3002\u7b2c\u4e94\uff0c\u5c31\u4e1a\u6210\u672c\u6307\u6570\u5c06\u4e8e\u7f8e\u4e1c\u65f6\u95f48\u70b9\u534a\u3001\u5f00\u76d8\u524d\u51e0\u5206\u949f\u516c\u5e03\u3002"}, {"start": 510.98, "end": 521.54, "text": "On Iran, only that military options were briefed has been reported. No decision has been confirmed, and a report of cargo aircraft to Israeli bases has no U.S. confirmation.", "zh": "\u5173\u4e8e\u4f0a\u6717\uff0c\u62a5\u9053\u7684\u53ea\u662f\u519b\u65b9\u9009\u9879\u5df2\u5411\u603b\u7edf\u6c47\u62a5\u3002\u6ca1\u6709\u4efb\u4f55\u51b3\u5b9a\u5f97\u5230\u8bc1\u5b9e\uff0c\u5173\u4e8e\u519b\u7528\u8fd0\u8f93\u673a\u98de\u5f80\u4ee5\u8272\u5217\u57fa\u5730\u7684\u62a5\u9053\u4e5f\u6ca1\u6709\u7f8e\u56fd\u65b9\u9762\u7684\u8bc1\u5b9e\u3002"}, {"start": 521.54, "end": 529.66, "text": "And the three things that matter most. One, the market's test changed. Cloud growth is no longer enough. Cash flow is the test.", "zh": "\u800c\u6700\u91cd\u8981\u7684\u4e09\u4ef6\u4e8b\u3002\u7b2c\u4e00\uff0c\u5e02\u573a\u7684\u8003\u9a8c\u53d8\u4e86\u3002\u4e91\u589e\u957f\u5df2\u4e0d\u591f\uff0c\u73b0\u91d1\u6d41\u624d\u662f\u8003\u9a8c\u3002"}, {"start": 529.66, "end": 539.9, "text": "Two, Korea is the highest-beta warning in the watchlist, and it just fired. Leveraged Korea exposure is a gap trade, not a trend trade, until volatility contracts.", "zh": "\u7b2c\u4e8c\uff0c\u97e9\u56fd\u662f\u81ea\u9009\u80a1\u4e2d\u8d1d\u5854\u6700\u9ad8\u7684\u8b66\u793a\uff0c\u5b83\u521a\u521a\u89e6\u53d1\u3002\u5728\u6ce2\u52a8\u7387\u6536\u7f29\u4e4b\u524d\uff0c\u6760\u6746\u97e9\u56fd\u655e\u53e3\u662f\u8df3\u7a7a\u4ea4\u6613\uff0c\u4e0d\u662f\u8d8b\u52bf\u4ea4\u6613\u3002"}, {"start": 539.9, "end": 550.58, "text": "Three, geopolitics is now a market input, not background. Oil, the Binance hack, and the midterms on Tuesday carry more event risk than the next weeks of earnings.", "zh": "\u7b2c\u4e09\uff0c\u5730\u7f18\u653f\u6cbb\u73b0\u5728\u662f\u5e02\u573a\u53d8\u91cf\uff0c\u4e0d\u662f\u80cc\u666f\u3002\u539f\u6cb9\u3001\u5e01\u5b89\u88ab\u9ed1\u548c\u5468\u4e8c\u7684\u4e2d\u671f\u9009\u4e3e\uff0c\u8574\u542b\u7684\u4e8b\u4ef6\u98ce\u9669\u8d85\u8fc7\u672a\u6765\u6570\u5468\u7684\u8d22\u62a5\u3002"}, {"start": 550.58, "end": 563.95, "text": "A final word on data gaps. Pre-market percentages vary by snapshot time, KORU has conflicting prices across vendors, and the Meta twenty-five billion dollar figure is unconfirmed, with two different stories attached to it.", "zh": "\u6700\u540e\u8bf4\u4e00\u4e0b\u6570\u636e\u7f3a\u53e3\u3002\u76d8\u524d\u6da8\u8dcc\u5e45\u56e0\u5feb\u7167\u65f6\u95f4\u800c\u5f02\uff0cKORU\u5728\u4e0d\u540c\u4f9b\u5e94\u5546\u7684\u4ef7\u683c\u76f8\u4e92\u51b2\u7a81\uff0cMeta\u7684250\u4ebf\u7f8e\u5143\u6570\u5b57\u672a\u7ecf\u8bc1\u5b9e\uff0c\u4e14\u5bf9\u5e94\u7740\u4e24\u4e2a\u4e0d\u540c\u7684\u8bf4\u6cd5\u3002"}, {"start": 563.95, "end": 573.96, "text": "This brief is market research only, not investment advice and not an order. Leveraged funds reset daily and decay over time, and Korean names carry overnight gap risk.", "zh": "\u672c\u7b80\u62a5\u4ec5\u4e3a\u5e02\u573a\u7814\u7a76\uff0c\u4e0d\u662f\u6295\u8d44\u5efa\u8bae\uff0c\u4e5f\u4e0d\u662f\u4ea4\u6613\u6307\u4ee4\u3002\u6760\u6746\u57fa\u91d1\u6bcf\u65e5\u91cd\u7f6e\u3001\u957f\u671f\u8870\u51cf\uff0c\u97e9\u56fd\u6807\u7684\u5e26\u6709\u9694\u591c\u8df3\u7a7a\u98ce\u9669\u3002"}, {"start": 573.96, "end": 583.27, "text": "Read-only, no trading action was taken. For positions, expiry or margin, check the broker app. Thanks for listening, and we will see you at the intraday brief.", "zh": "\u53ea\u8bfb\uff0c\u6ca1\u6709\u8fdb\u884c\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002\u5982\u9700\u4e86\u89e3\u6301\u4ed3\u3001\u5230\u671f\u6216\u4fdd\u8bc1\u91d1\uff0c\u8bf7\u67e5\u770b\u5238\u5546App\u3002\u611f\u8c22\u6536\u542c\uff0c\u76d8\u4e2d\u7b80\u62a5\u518d\u89c1\u3002"}]},{"slug": "2026-10-29-post-market", "title": "U.S. Stocks Post-Market Brief \u2014 October 29, 2026", "mp3": "2026-10-29-post-market/2026-10-29-post-market.mp3", "dur": "9:02", "lines": [{"start": 0.0, "end": 6.55, "text": "Welcome to the U.S. Stocks Post-Market Brief, for Thursday, October 29, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u540e\u7b80\u62a5\uff0c2026\u5e7410\u670829\u65e5\u661f\u671f\u56db\u3002\u6211\u662f Alex\u3002"}, {"start": 6.55, "end": 14.18, "text": "And I'm Jordan. This is pure market research. No account data, no trading orders, just what happened today and what to watch next.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u7eaf\u5e02\u573a\u7814\u7a76\uff0c\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u4eca\u5929\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u63a5\u4e0b\u6765\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 14.18, "end": 20.42, "text": "Here is the headline. Thursday completed the exam Wednesday started, and the AI trade failed the second half.", "zh": "\u5148\u8bf4\u7ed3\u8bba\u3002\u661f\u671f\u56db\u5b8c\u6210\u4e86\u661f\u671f\u4e09\u5f00\u59cb\u7684\u8003\u8bd5\uff0c\u800c AI \u4ea4\u6613\u5728\u4e0b\u534a\u573a\u4e0d\u53ca\u683c\u3002"}, {"start": 20.42, "end": 31.87, "text": "The S and P five hundred ETF slipped zero point three eight percent, the Nasdaq one hundred ETF fell one point four two percent, but the Russell two thousand ETF gained zero point nine seven percent.", "zh": "\u6807\u666e500 ETF \u4e0b\u8dcc0.38%\uff0c\u7eb3\u65af\u8fbe\u514b100 ETF \u4e0b\u8dcc1.42%\uff0c\u4f46\u7f57\u7d202000 ETF \u4e0a\u6da80.97%\u3002"}, {"start": 31.87, "end": 37.39, "text": "Nine of eleven sectors rose, even as tech fell. That is a rotation day, not a panic.", "zh": "11\u4e2a\u677f\u5757\u4e2d\u67099\u4e2a\u4e0a\u6da8\uff0c\u5c3d\u7ba1\u79d1\u6280\u80a1\u4e0b\u8dcc\u3002\u8fd9\u662f\u4e00\u4e2a\u8f6e\u52a8\u65e5\uff0c\u800c\u4e0d\u662f\u6050\u614c\u65e5\u3002"}, {"start": 37.39, "end": 44.54, "text": "The VIX ended near seventeen, up only about one percent. Vol stayed contained while single stocks moved violently.", "zh": "VIX \u6536\u4e8e17\u9644\u8fd1\uff0c\u4ec5\u4e0a\u6da8\u7ea61%\u3002\u6307\u6570\u6ce2\u52a8\u7387\u4fdd\u6301\u5e73\u9759\uff0c\u4f46\u4e2a\u80a1\u6ce2\u52a8\u5267\u70c8\u3002"}, {"start": 44.54, "end": 54.5, "text": "Let's start with the macro data, released at eight thirty Eastern. Third-quarter GDP grew three point four percent annualized, above the three point two percent consensus.", "zh": "\u5148\u8bf4\u5b8f\u89c2\u6570\u636e\uff0c\u7f8e\u4e1c\u65f6\u95f48\u70b930\u5206\u516c\u5e03\u3002\u7b2c\u4e09\u5b63\u5ea6 GDP \u5e74\u5316\u589e\u957f3.4%\uff0c\u9ad8\u4e8e3.2%\u7684\u9884\u671f\u3002"}, {"start": 54.5, "end": 62.66, "text": "September PCE inflation was in line with expectations: headline three point six percent year over year, core three point one percent.", "zh": "9\u6708 PCE \u901a\u80c0\u7b26\u5408\u9884\u671f\uff1a\u603b\u4f53\u540c\u6bd43.6%\uff0c\u6838\u5fc3\u540c\u6bd43.1%\u3002"}, {"start": 62.66, "end": 68.59, "text": "Jobless claims came in at one hundred ninety-four thousand, below the one hundred ninety-nine thousand expected.", "zh": "\u521d\u8bf7\u5931\u4e1a\u91d1\u4eba\u6570\u4e3a19.4\u4e07\uff0c\u4f4e\u4e8e\u9884\u671f\u768419.9\u4e07\u3002"}, {"start": 68.59, "end": 76.58, "text": "Strong growth plus sticky core inflation kept the December hike story alive, with hike odds still priced near eighty to eighty-five percent.", "zh": "\u5f3a\u52b2\u589e\u957f\u52a0\u4e0a\u9ecf\u6027\u7684\u6838\u5fc3\u901a\u80c0\uff0c\u8ba912\u6708\u52a0\u606f\u7684\u9884\u671f\u7ee7\u7eed\u5b58\u5728\uff0c\u52a0\u606f\u6982\u7387\u4ecd\u5b9a\u4ef7\u572880%\u81f385%\u9644\u8fd1\u3002"}, {"start": 76.58, "end": 81.34, "text": "In Europe, the ECB held its deposit rate at two point five percent, unanimously.", "zh": "\u5728\u6b27\u6d32\uff0c\u6b27\u6d32\u592e\u884c\u4e00\u81f4\u51b3\u5b9a\u7ef4\u6301\u5b58\u6b3e\u5229\u7387\u57282.5%\u4e0d\u53d8\u3002"}, {"start": 81.34, "end": 88.01, "text": "And President Christine Lagarde announced she will step down on February seventh, 2027, about nine months early.", "zh": "\u884c\u957f Christine Lagarde \u5ba3\u5e03\u5c06\u4e8e2027\u5e742\u67087\u65e5\u63d0\u524d\u7ea6\u4e5d\u4e2a\u6708\u79bb\u4efb\u3002"}, {"start": 88.01, "end": 95.09, "text": "Rates fell. The ten-year yield ended around four point nine four to four point nine nine percent, and the dollar eased.", "zh": "\u5229\u7387\u56de\u843d\u3002\u5341\u5e74\u671f\u56fd\u503a\u6536\u76ca\u7387\u6536\u4e8e4.94%\u81f34.99%\u9644\u8fd1\uff0c\u7f8e\u5143\u8d70\u5f31\u3002"}, {"start": 95.09, "end": 102.12, "text": "Gold slipped to about four thousand thirty-nine dollars, and oil was essentially flat near one hundred two dollars eighty-two cents.", "zh": "\u9ec4\u91d1\u8dcc\u81f3\u7ea64039\u7f8e\u5143\uff0c\u6cb9\u4ef7\u57fa\u672c\u6301\u5e73\u4e8e102.82\u7f8e\u5143\u9644\u8fd1\u3002"}, {"start": 102.12, "end": 112.92, "text": "One caution on oil headlines. Reports of tankers hitting mines near the Strait of Hormuz are unconfirmed as a closure, and sources did not establish any sustained interruption to oil flows.", "zh": "\u5173\u4e8e\u6cb9\u4ef7\u6d88\u606f\u8981\u63d0\u9192\u4e00\u70b9\u3002\u6cb9\u8f6e\u5728\u970d\u5c14\u6728\u5179\u6d77\u5ce1\u9644\u8fd1\u89e6\u96f7\u7684\u62a5\u9053\u5c1a\u672a\u8bc1\u5b9e\u6784\u6210\u5c01\u9501\uff0c\u4e5f\u6ca1\u6709\u8bc1\u5b9e\u77f3\u6cb9\u6d41\u52a8\u6301\u7eed\u4e2d\u65ad\u3002"}, {"start": 112.92, "end": 120.84, "text": "Now the day's key stock: Alphabet. It fell twelve point two nine percent in the regular session, its worst day since 2020.", "zh": "\u518d\u8bf4\u5f53\u5929\u7684\u5173\u952e\u80a1\u7968\uff1aAlphabet\u3002\u5b83\u5728\u5e38\u89c4\u4ea4\u6613\u65f6\u6bb5\u4e0b\u8dcc12.29%\uff0c\u662f2020\u5e74\u4ee5\u6765\u6700\u7cdf\u7cd5\u7684\u4e00\u5929\u3002"}, {"start": 120.84, "end": 131.21, "text": "Revenue of one hundred twenty-seven point five eight billion dollars missed estimates, and free cash flow was negative nine point one billion dollars, despite Cloud revenue more than doubling.", "zh": "1275.8\u4ebf\u7f8e\u5143\u7684\u8425\u6536\u4e0d\u53ca\u9884\u671f\uff0c\u81ea\u7531\u73b0\u91d1\u6d41\u4e3a\u8d1f91\u4ebf\u7f8e\u5143\uff0c\u5c3d\u7ba1\u4e91\u4e1a\u52a1\u8425\u6536\u7ffb\u500d\u8fd8\u591a\u3002"}, {"start": 131.21, "end": 138.22, "text": "Microsoft gave back its post-earnings pop, slipping zero point one six percent, even though Azure grew forty-eight percent.", "zh": "\u5fae\u8f6f\u56de\u5410\u4e86\u8d22\u62a5\u540e\u7684\u6da8\u5e45\uff0c\u4e0b\u8dcc0.16%\uff0c\u5c3d\u7ba1 Azure \u589e\u957f\u4e8648%\u3002"}, {"start": 138.22, "end": 147.1, "text": "Meta rebounded one point nine six percent, snapping a five-session slide, and Apple rose one point four eight percent on defensive rotation.", "zh": "Meta \u53cd\u5f391.96%\uff0c\u7ed3\u675f\u4e86\u8fde\u7eed\u4e94\u4e2a\u4ea4\u6613\u65e5\u7684\u4e0b\u8dcc\uff0c\u82f9\u679c\u5728\u9632\u5fa1\u6027\u8f6e\u52a8\u4e2d\u4e0a\u6da81.48%\u3002"}, {"start": 147.1, "end": 156.02, "text": "Now memory, the reversal. The SOX semiconductor index fell one point four percent, and Samsung fell four point one three percent in Seoul.", "zh": "\u518d\u8bf4\u5b58\u50a8\u677f\u5757\u7684\u9006\u8f6c\u3002SOX \u534a\u5bfc\u4f53\u6307\u6570\u4e0b\u8dcc1.4%\uff0c\u4e09\u661f\u5728\u9996\u5c14\u4e0b\u8dcc4.13%\u3002"}, {"start": 156.02, "end": 163.75, "text": "Samsung reported a record quarter, but slightly below consensus, and deferred shareholder-return details to a January board meeting.", "zh": "\u4e09\u661f\u516c\u5e03\u4e86\u521b\u7eaa\u5f55\u7684\u5b63\u5ea6\u4e1a\u7ee9\uff0c\u4f46\u7565\u4f4e\u4e8e\u9884\u671f\uff0c\u5e76\u628a\u80a1\u4e1c\u56de\u62a5\u7ec6\u8282\u63a8\u8fdf\u52301\u6708\u7684\u8463\u4e8b\u4f1a\u3002"}, {"start": 163.75, "end": 172.46, "text": "Micron fell four point nine eight percent, SanDisk fell five point three two percent into its earnings, and AMD fell two point zero eight percent.", "zh": "\u7f8e\u5149\u4e0b\u8dcc4.98%\uff0c\u95ea\u8fea\u5728\u8d22\u62a5\u524d\u4e0b\u8dcc5.32%\uff0cAMD \u4e0b\u8dcc2.08%\u3002"}, {"start": 172.46, "end": 179.71, "text": "Nvidia held up better, down only zero point eight percent, partly offset by Oracle's Vera Rubin systems news.", "zh": "\u82f1\u4f1f\u8fbe\u8868\u73b0\u76f8\u5bf9\u8f83\u597d\uff0c\u4ec5\u4e0b\u8dcc0.8%\uff0c\u90e8\u5206\u5f97\u76ca\u4e8e\u7532\u9aa8\u6587 Vera Rubin \u7cfb\u7edf\u7684\u6d88\u606f\u3002"}, {"start": 179.71, "end": 189.02, "text": "SK hynix in the U.S. fell one point five eight percent, even though SK hynix rose two point six two percent in Seoul. Do not merge the two listings.", "zh": "SK \u6d77\u529b\u58eb\u7f8e\u80a1\u4e0b\u8dcc1.58%\uff0c\u5c3d\u7ba1\u5176\u5728\u9996\u5c14\u4e0a\u6da82.62%\u3002\u4e0d\u8981\u628a\u4e24\u4e2a\u4e0a\u5e02\u5730\u6df7\u4e3a\u4e00\u8c08\u3002"}, {"start": 189.02, "end": 198.26, "text": "That carried the leveraged ETFs down. KORU fell seven point six two percent, a round-trip after Wednesday's sixteen point one nine percent surge.", "zh": "\u8fd9\u5e26\u52a8\u6760\u6746 ETF \u4e0b\u8dcc\u3002KORU \u4e0b\u8dcc7.62%\uff0c\u5728\u661f\u671f\u4e09\u4e0a\u6da816.19%\u4e4b\u540e\u8d70\u4e86\u4e2a\u6765\u56de\u3002"}, {"start": 198.26, "end": 208.39, "text": "SOXL fell four point six two percent, TECL fell three point four two percent, and TQQQ fell five point two percent to sixty-eight dollars sixty cents.", "zh": "SOXL \u4e0b\u8dcc4.62%\uff0cTECL \u4e0b\u8dcc3.42%\uff0cTQQQ \u4e0b\u8dcc5.2%\u81f368.60\u7f8e\u5143\u3002"}, {"start": 208.39, "end": 215.71, "text": "UVXY fell three point three five percent, despite the Nasdaq selloff. That tells you this was not a vol event.", "zh": "UVXY \u4e0b\u8dcc3.35%\uff0c\u5c3d\u7ba1\u7eb3\u65af\u8fbe\u514b\u5927\u8dcc\u3002\u8fd9\u8bf4\u660e\u8fd9\u4e0d\u662f\u4e00\u6b21\u6ce2\u52a8\u7387\u4e8b\u4ef6\u3002"}, {"start": 215.71, "end": 224.95, "text": "Biotech was the exception. Health care rose two point four percent, the best sector, led by Eli Lilly, up six point six three percent on raised guidance.", "zh": "\u751f\u7269\u79d1\u6280\u662f\u4e2a\u4f8b\u5916\u3002\u533b\u7597\u4fdd\u5065\u677f\u5757\u4e0a\u6da82.4%\uff0c\u8868\u73b0\u6700\u4f73\uff0c\u793c\u6765\u56e0\u4e0a\u8c03\u6307\u5f15\u800c\u4e0a\u6da86.63%\u3002"}, {"start": 224.95, "end": 232.8, "text": "Moderna rose four point zero one percent, and LABU rose one point one one percent, the only leveraged ETF in the green.", "zh": "Moderna \u4e0a\u6da84.01%\uff0cLABU \u4e0a\u6da81.11%\uff0c\u662f\u552f\u4e00\u6536\u7ea2\u7684\u6760\u6746 ETF\u3002"}, {"start": 232.8, "end": 242.47, "text": "Walmart rose two point zero nine percent on the defensive rotation, Tesla was essentially flat, and AppLovin fell one point nine five percent, near its fifty-two-week low.", "zh": "\u6c83\u5c14\u739b\u5728\u9632\u5fa1\u6027\u8f6e\u52a8\u4e2d\u4e0a\u6da82.09%\uff0c\u7279\u65af\u62c9\u57fa\u672c\u6301\u5e73\uff0cAppLovin \u4e0b\u8dcc1.95%\uff0c\u63a5\u8fd152\u5468\u4f4e\u70b9\u3002"}, {"start": 242.47, "end": 250.39, "text": "Gold miners fell three point one two percent, harder than gold itself, and Strategy fell two point four four percent as bitcoin slipped.", "zh": "\u91d1\u77ff\u80a1\u4e0b\u8dcc3.12%\uff0c\u8dcc\u5e45\u5927\u4e8e\u9ec4\u91d1\u672c\u8eab\uff0cStrategy \u968f\u6bd4\u7279\u5e01\u8d70\u5f31\u4e0b\u8dcc2.44%\u3002"}, {"start": 250.39, "end": 262.7, "text": "Now after the bell. Amazon missed on both lines: earnings of one dollar eighty-nine cents against about one dollar ninety-seven expected, and revenue of two hundred one point nine billion dollars.", "zh": "\u518d\u8bf4\u76d8\u540e\u3002\u4e9a\u9a6c\u900a\u53cc\u53cc\u4e0d\u53ca\u9884\u671f\uff1a\u6bcf\u80a1\u6536\u76ca1.89\u7f8e\u5143\uff0c\u9884\u671f\u7ea61.97\u7f8e\u5143\uff1b\u8425\u65362019\u4ebf\u7f8e\u5143\u3002"}, {"start": 262.7, "end": 273.67, "text": "AWS grew thirty-nine percent to forty-six billion dollars, its fastest in about five years, but that was not enough. Shares fell six percent or more after hours.", "zh": "AWS \u589e\u957f39%\u81f3460\u4ebf\u7f8e\u5143\uff0c\u7ea6\u4e94\u5e74\u6765\u6700\u5feb\uff0c\u4f46\u8fd9\u8fd8\u4e0d\u591f\u3002\u80a1\u4ef7\u76d8\u540e\u4e0b\u8dcc6%\u6216\u66f4\u591a\u3002"}, {"start": 273.67, "end": 284.66, "text": "Amazon's fourth-quarter sales guide of two hundred forty to two hundred forty-seven billion dollars, and a reaffirmed two hundred twenty billion dollar capex plan, kept the cash-flow pressure in focus.", "zh": "\u4e9a\u9a6c\u900a\u7b2c\u56db\u5b63\u5ea6\u8425\u6536\u6307\u5f15\u4e3a2400\u4ebf\u81f32470\u4ebf\u7f8e\u5143\uff0c\u5e76\u91cd\u75332200\u4ebf\u7f8e\u5143\u7684\u8d44\u672c\u5f00\u652f\u8ba1\u5212\uff0c\u4f7f\u73b0\u91d1\u6d41\u538b\u529b\u7ee7\u7eed\u6210\u4e3a\u7126\u70b9\u3002"}, {"start": 284.66, "end": 294.34, "text": "Intel beat on the quarter, with adjusted earnings of fifty-two cents, but guided the fourth quarter far below consensus, and fell seventeen to twenty-two percent after hours.", "zh": "\u82f1\u7279\u5c14\u672c\u5b63\u5ea6\u8d85\u51fa\u9884\u671f\uff0c\u8c03\u6574\u540e\u6bcf\u80a1\u6536\u76ca52\u7f8e\u5206\uff0c\u4f46\u7b2c\u56db\u5b63\u5ea6\u6307\u5f15\u8fdc\u4f4e\u4e8e\u9884\u671f\uff0c\u76d8\u540e\u4e0b\u8dcc17%\u81f322%\u3002"}, {"start": 294.34, "end": 301.13, "text": "Intel also cited a factory explosion in Israel, costing about six hundred million dollars of revenue over two quarters.", "zh": "\u82f1\u7279\u5c14\u8fd8\u63d0\u5230\u4ee5\u8272\u5217\u5de5\u5382\u7206\u70b8\u4e8b\u4ef6\uff0c\u5c06\u5728\u4e24\u4e2a\u5b63\u5ea6\u5185\u9020\u6210\u7ea66\u4ebf\u7f8e\u5143\u7684\u8425\u6536\u635f\u5931\u3002"}, {"start": 301.13, "end": 312.46, "text": "Chip contagion followed. AMD fell about four percent after hours, Broadcom about two percent, and SOXL fell a further nine to thirteen percent, depending on the timestamp.", "zh": "\u82af\u7247\u80a1\u968f\u540e\u5168\u7ebf\u4e0b\u8dcc\u3002AMD \u76d8\u540e\u4e0b\u8dcc\u7ea64%\uff0c\u535a\u901a\u7ea62%\uff0cSOXL \u518d\u8dcc9%\u81f313%\uff0c\u5177\u4f53\u53d6\u51b3\u4e8e\u62a5\u4ef7\u65f6\u95f4\u3002"}, {"start": 312.46, "end": 323.26, "text": "SanDisk beat: revenue of eleven point zero three billion dollars, adjusted earnings of forty-nine dollars fifty-one cents, plus an eight-for-one split and a five billion dollar buyback.", "zh": "\u95ea\u8fea\u8d85\u51fa\u9884\u671f\uff1a\u8425\u6536110.3\u4ebf\u7f8e\u5143\uff0c\u8c03\u6574\u540e\u6bcf\u80a1\u6536\u76ca49.51\u7f8e\u5143\uff0c\u5916\u52a08\u62c61\u62c6\u80a1\u548c50\u4ebf\u7f8e\u5143\u56de\u8d2d\u3002"}, {"start": 323.26, "end": 333.86, "text": "But SanDisk whipsawed after hours: it popped about three percent, then faded to about minus four point three percent by six eighteen Eastern. Do not quote a single after-hours figure for it.", "zh": "\u4f46\u95ea\u8fea\u76d8\u540e\u5927\u5e45\u9707\u8361\uff1a\u5148\u6da8\u7ea63%\uff0c\u5230\u7f8e\u4e1c\u65f6\u95f46\u70b918\u5206\u53c8\u8dcc\u81f3\u7ea6\u8d1f4.3%\u3002\u4e0d\u8981\u53ea\u5f15\u7528\u5b83\u7684\u67d0\u4e00\u4e2a\u76d8\u540e\u4ef7\u683c\u3002"}, {"start": 333.86, "end": 343.87, "text": "Strategy reported a record accounting profit of nineteen point five three billion dollars, almost entirely a bitcoin revaluation gain, and shares were roughly flat after hours.", "zh": "Strategy \u516c\u5e03\u4e86195.3\u4ebf\u7f8e\u5143\u7684\u521b\u7eaa\u5f55\u8d26\u9762\u5229\u6da6\uff0c\u51e0\u4e4e\u5168\u90e8\u6765\u81ea\u6bd4\u7279\u5e01\u91cd\u4f30\u6536\u76ca\uff0c\u80a1\u4ef7\u76d8\u540e\u57fa\u672c\u6301\u5e73\u3002"}, {"start": 343.87, "end": 351.67, "text": "Elsewhere after hours, Reddit fell sixteen percent, Pinterest fell eleven percent, and Gilead rose about two point six percent.", "zh": "\u5176\u4ed6\u76d8\u540e\u4e2a\u80a1\u65b9\u9762\uff0cReddit \u4e0b\u8dcc16%\uff0cPinterest \u4e0b\u8dcc11%\uff0c\u5409\u5229\u5fb7\u4e0a\u6da8\u7ea62.6%\u3002"}, {"start": 351.67, "end": 358.46, "text": "Now strategy, and remember, this is analysis only. No trading action was taken, and nothing here is an order.", "zh": "\u518d\u8bf4\u7b56\u7565\uff0c\u8bf7\u8bb0\u4f4f\u8fd9\u53ea\u662f\u5206\u6790\u3002\u6ca1\u6709\u8fdb\u884c\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\uff0c\u8fd9\u91cc\u7684\u5185\u5bb9\u4e5f\u4e0d\u662f\u4e0b\u5355\u6307\u4ee4\u3002"}, {"start": 358.46, "end": 366.22, "text": "The regime is contained index volatility with violent single-name gaps. Short spreads earn on the index side and get hurt on the single-name side.", "zh": "\u5f53\u524d\u73af\u5883\u662f\u6307\u6570\u6ce2\u52a8\u7387\u5e73\u9759\uff0c\u4f46\u4e2a\u80a1\u51fa\u73b0\u5267\u70c8\u8df3\u7a7a\u3002Short \u4ef7\u5dee\u5728\u6307\u6570\u7aef\u8d5a\u94b1\u3001\u5728\u4e2a\u80a1\u7aef\u53d7\u4f24\u3002"}, {"start": 366.22, "end": 375.1, "text": "KORU's two-day round-trip is the warning. The playbook default stays bear call spread: sell the rip, not the crash, with wide wings and far strikes.", "zh": "KORU \u4e24\u5929\u7684\u6765\u56de\u5c31\u662f\u8b66\u544a\u3002\u624b\u518c\u7684\u9ed8\u8ba4\u65b9\u5411\u4ecd\u662f bear call spread\uff1a\u5728\u53cd\u5f39\u65f6\u5356\u51fa\uff0c\u800c\u4e0d\u662f\u5728\u66b4\u8dcc\u540e\u8ffd\u5356\uff0c\u7fc5\u8180\u8981\u5bbd\u3001\u884c\u6743\u4ef7\u8981\u8db3\u591f\u865a\u503c\u3002"}, {"start": 375.1, "end": 386.14, "text": "For LABU, the trend is intact, but options into Friday's expiry carried extreme implied volatility, about two hundred thirty-three percent. That is expiry-event vol, not rent.", "zh": "LABU \u65b9\u9762\u8d8b\u52bf\u5b8c\u597d\uff0c\u4f46\u5468\u4e94\u5230\u671f\u671f\u6743\u7684\u9690\u542b\u6ce2\u52a8\u7387\u6781\u9ad8\uff0c\u7ea6233%\u3002\u90a3\u662f\u5230\u671f\u4e8b\u4ef6\u6ce2\u52a8\u7387\uff0c\u4e0d\u662f\u6536\u79df\u3002"}, {"start": 386.14, "end": 396.34, "text": "For SOXL, TECL and TQQQ, spreads struck off Thursday's closes are stale by Friday's open. Re-mark any existing spread before assuming its risk.", "zh": "SOXL\u3001TECL \u548c TQQQ \u65b9\u9762\uff0c\u6309\u5468\u56db\u6536\u76d8\u4ef7\u8bbe\u7f6e\u7684 spread \u5230\u5468\u4e94\u5f00\u76d8\u65f6\u5df2\u7ecf\u8fc7\u65f6\u3002\u5148\u91cd\u65b0\u4f30\u503c\uff0c\u518d\u5047\u8bbe\u5176\u98ce\u9669\u3002"}, {"start": 396.34, "end": 404.14, "text": "For UVXY, do not chase short vol now. Friday's data can re-inflate volatility faster than contango decays it.", "zh": "UVXY \u65b9\u9762\uff0c\u73b0\u5728\u4e0d\u8981\u8ffd\u9010 short \u6ce2\u52a8\u7387\u3002\u5468\u4e94\u7684\u6570\u636e\u53ef\u80fd\u8fc5\u901f\u63a8\u9ad8\u6ce2\u52a8\u7387\uff0c\u901f\u5ea6\u8d85\u8fc7 contango \u7684\u8870\u51cf\u3002"}, {"start": 404.14, "end": 414.58, "text": "Friday brings the Bank of Japan decision, expected to hold at one point two five percent, plus the Employment Cost Index at eight thirty Eastern and Chicago PMI at nine forty-five.", "zh": "\u5468\u4e94\u5c06\u6709\u65e5\u672c\u592e\u884c\u51b3\u8bae\uff0c\u9884\u8ba1\u7ef4\u63011.25%\u4e0d\u53d8\uff0c\u8fd8\u6709\u7f8e\u4e1c\u65f6\u95f48\u70b930\u5206\u7684\u5c31\u4e1a\u6210\u672c\u6307\u6570\u548c9\u70b945\u5206\u7684\u829d\u52a0\u54e5 PMI\u3002"}, {"start": 414.58, "end": 421.78, "text": "ExxonMobil and Chevron report before the open, and the market must digest the Amazon, Intel and SanDisk after-hours moves.", "zh": "\u57c3\u514b\u68ee\u7f8e\u5b5a\u548c\u96ea\u4f5b\u9f99\u5c06\u5728\u5f00\u76d8\u524d\u516c\u5e03\u8d22\u62a5\uff0c\u5e02\u573a\u8fd8\u5fc5\u987b\u6d88\u5316\u4e9a\u9a6c\u900a\u3001\u82f1\u7279\u5c14\u548c\u95ea\u8fea\u7684\u76d8\u540e\u8d70\u52bf\u3002"}, {"start": 421.78, "end": 429.38, "text": "Next week, Palantir's earnings window opens November second, the midterms arrive November third, and Moderna reports November sixth.", "zh": "\u4e0b\u5468\uff0cPalantir \u7684\u8d22\u62a5\u7a97\u53e3\u4e8e11\u67082\u65e5\u5f00\u542f\uff0c\u4e2d\u671f\u9009\u4e3e\u572811\u67083\u65e5\u4e3e\u884c\uff0cModerna \u5c06\u4e8e11\u67086\u65e5\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 429.38, "end": 482.71, "text": "Two data flags. One vendor's TQQQ close differs from the dated history we used, and the SPCX ticker remains instrument-ambiguous across vendors.", "zh": "\u4e24\u4e2a\u6570\u636e\u63d0\u9192\u3002\u67d0\u6570\u636e\u5546\u7684 TQQQ \u6536\u76d8\u4ef7\u4e0e\u6211\u4eec\u91c7\u7528\u7684\u5386\u53f2\u6570\u636e\u4e0d\u540c\uff0cSPCX \u4ee3\u7801\u5728\u4e0d\u540c\u6570\u636e\u5546\u5904\u7684\u6807\u7684\u4ecd\u4e0d\u660e\u786e\u3002"}, {"start": 482.71, "end": 492.55, "text": "Also unconfirmed: a reported Nvidia CEO espionage story had no corroborating source, and a reported bitcoin options expiry size is single-source only.", "zh": "\u53e6\u5916\u4ecd\u672a\u8bc1\u5b9e\u7684\u6d88\u606f\u5305\u62ec\uff1a\u636e\u62a5\u9053\u7684\u82f1\u4f1f\u8fbe CEO \u95f4\u8c0d\u4e8b\u4ef6\u6ca1\u6709\u4f50\u8bc1\u6765\u6e90\uff0c\u67d0\u6bd4\u7279\u5e01\u671f\u6743\u5230\u671f\u89c4\u6a21\u4e5f\u53ea\u6709\u4e00\u4e2a\u6765\u6e90\u3002"}, {"start": 492.55, "end": 498.6, "text": "Bottom line: keep spreads wide, strikes far, and size for a gap, not for today's rotation.", "zh": "\u603b\u7ed3\uff1a\u4fdd\u6301\u5bbd\u7fc5\u8180\u3001\u8fdc\u884c\u6743\u4ef7\uff0c\u4ed3\u4f4d\u8981\u6309\u8df3\u7a7a\u6765\u5b89\u6392\uff0c\u800c\u4e0d\u662f\u6309\u4eca\u5929\u7684\u8f6e\u52a8\u6765\u5b89\u6392\u3002"}, {"start": 498.6, "end": 506.76, "text": "In Korea, the KOSPI gave back six thousand, falling one point two four percent, as institutions sold while foreigners and retail bought.", "zh": "\u5728\u97e9\u56fd\uff0cKOSPI \u8dcc\u56de6000\u70b9\u4ee5\u4e0b\uff0c\u4e0b\u8dcc1.24%\uff0c\u673a\u6784\u5356\u51fa\u800c\u5916\u8d44\u548c\u6563\u6237\u4e70\u5165\u3002"}, {"start": 506.76, "end": 516.96, "text": "Breadth actually improved into the close, with advancers beating decliners on both the NYSE and the Nasdaq. That is why this reads as repositioning, not panic.", "zh": "\u6536\u76d8\u65f6\u5e02\u573a\u5e7f\u5ea6\u5b9e\u9645\u6709\u6240\u6539\u5584\uff0c\u7ebd\u4ea4\u6240\u548c\u7eb3\u65af\u8fbe\u514b\u7684\u4e0a\u6da8\u80a1\u90fd\u591a\u4e8e\u4e0b\u8dcc\u80a1\u3002\u8fd9\u5c31\u662f\u4e3a\u4ec0\u4e48\u8fd9\u770b\u8d77\u6765\u662f\u8c03\u4ed3\uff0c\u800c\u4e0d\u662f\u6050\u614c\u3002"}, {"start": 516.96, "end": 526.63, "text": "One more macro flag. A hot Employment Cost Index on Friday would strengthen December hike pricing and lift the long end, the main macro risk to short put spreads in growth names.", "zh": "\u518d\u63d0\u9192\u4e00\u4e2a\u5b8f\u89c2\u98ce\u9669\u3002\u5468\u4e94\u5c31\u4e1a\u6210\u672c\u6307\u6570\u82e5\u504f\u70ed\uff0c\u5c06\u5f3a\u531612\u6708\u52a0\u606f\u5b9a\u4ef7\u5e76\u63a8\u9ad8\u957f\u7aef\u5229\u7387\uff0c\u8fd9\u662f growth \u80a1 short put spread \u9762\u4e34\u7684\u4e3b\u8981\u5b8f\u89c2\u98ce\u9669\u3002"}, {"start": 526.63, "end": 534.19, "text": "And a reminder on risk. Leveraged ETFs decay and gap, and a single session can move them double digits in either direction.", "zh": "\u8fd8\u8981\u63d0\u9192\u98ce\u9669\u3002\u6760\u6746 ETF \u4f1a\u8870\u51cf\u4e5f\u4f1a\u8df3\u7a7a\uff0c\u5355\u4e2a\u4ea4\u6613\u65e5\u5c31\u53ef\u80fd\u53cc\u5411\u6ce2\u52a8\u4e24\u4f4d\u6570\u3002"}, {"start": 534.19, "end": 542.18, "text": "That is the post-market brief for October 29, 2026. Read-only, no trades placed. See you at the pre-market brief.", "zh": "\u8fd9\u5c31\u662f2026\u5e7410\u670829\u65e5\u7684\u76d8\u540e\u7b80\u62a5\u3002\u53ea\u8bfb\u5206\u6790\uff0c\u6ca1\u6709\u4e0b\u5355\u3002\u76d8\u524d\u7b80\u62a5\u518d\u89c1\u3002"}]},{"slug": "2026-10-29-intraday", "title": "U.S. Stocks Intraday Brief \u2014 October 29, 2026", "mp3": "2026-10-29-intraday/2026-10-29-intraday.mp3", "dur": "10:23", "lines": [{"start": 0.0, "end": 5.28, "text": "Welcome to the U.S. Stocks Intraday Brief, for Thursday, October twenty ninth. I am Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u4e2d\u7b80\u62a5\uff0c2026\u5e7410\u670829\u65e5\u661f\u671f\u56db\u3002\u6211\u662f Alex\u3002"}, {"start": 5.28, "end": 13.85, "text": "And I am Jordan. This is the mid-session edition, recorded around eleven thirty Eastern. It is pure market research: no account data, and no trading orders.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u76d8\u4e2d\u7248\uff0c\u7f8e\u4e1c\u65f6\u95f4\u7ea611\u70b9\u534a\u5f55\u5236\uff0c\u7eaf\u5e02\u573a\u7814\u7a76\uff1a\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u4e5f\u6ca1\u6709\u4e0b\u5355\u3002"}, {"start": 13.85, "end": 21.22, "text": "The headline today is one question: is AI spending paying for itself? Alphabet just failed that test in public.", "zh": "\u4eca\u5929\u7684\u6838\u5fc3\u95ee\u9898\u53ea\u6709\u4e00\u4e2a\uff1aAI \u652f\u51fa\u5230\u5e95\u80fd\u4e0d\u80fd\u8d5a\u94b1\uff1fAlphabet \u521a\u521a\u516c\u5f00\u4ea4\u4e86\u4e0d\u53ca\u683c\u7684\u7b54\u5377\u3002"}, {"start": 21.22, "end": 35.54, "text": "Alphabet fell eleven and a half percent intraday, to about two hundred eighty five dollars. Revenue was one hundred twenty seven point six billion dollars, a miss, and earnings were two dollars twelve cents, well below the three dollars two cents expected.", "zh": "Alphabet \u76d8\u4e2d\u8dcc11.5%\uff0c\u7ea6285\u7f8e\u5143\u3002\u8425\u65361276\u4ebf\u7f8e\u5143\u4e0d\u53ca\u9884\u671f\uff0c\u6bcf\u80a1\u6536\u76ca2.12\u7f8e\u5143\uff0c\u8fdc\u4f4e\u4e8e\u9884\u671f\u76843.02\u7f8e\u5143\u3002"}, {"start": 35.54, "end": 46.42, "text": "Search advertising grew only twelve percent, to sixty three point three five billion dollars, missing expectations. The company said its AI Mode monetizes below traditional search.", "zh": "\u641c\u7d22\u5e7f\u544a\u4ec5\u589e\u957f12%\uff0c\u81f3633.5\u4ebf\u7f8e\u5143\uff0c\u4e0d\u53ca\u9884\u671f\u3002\u516c\u53f8\u8868\u793a AI Mode \u7684\u53d8\u73b0\u80fd\u529b\u4f4e\u4e8e\u4f20\u7edf\u641c\u7d22\u3002"}, {"start": 46.42, "end": 53.98, "text": "Cloud was the bright spot, more than doubling, up one hundred three percent to thirty point seven billion dollars. But it was not enough.", "zh": "\u4e91\u4e1a\u52a1\u662f\u4eae\u70b9\uff0c\u7ffb\u4e86\u4e00\u500d\u591a\uff0c\u589e\u957f103%\u81f3307\u4ebf\u7f8e\u5143\u3002\u4f46\u8fd9\u8fd8\u4e0d\u591f\u3002"}, {"start": 53.98, "end": 67.82, "text": "Free cash flow was negative nine point zero seven billion dollars, a second straight negative quarter. Capital spending hit fifty one point three six billion dollars, and management said twenty twenty seven spending will increase significantly.", "zh": "\u81ea\u7531\u73b0\u91d1\u6d41\u4e3a\u8d1f90.7\u4ebf\u7f8e\u5143\uff0c\u5df2\u662f\u8fde\u7eed\u7b2c\u4e8c\u4e2a\u5b63\u5ea6\u4e3a\u8d1f\u3002\u8d44\u672c\u652f\u51fa\u8fbe513.6\u4ebf\u7f8e\u5143\uff0c\u7ba1\u7406\u5c42\u8fd8\u8868\u793a2027\u5e74\u652f\u51fa\u5c06\u663e\u8457\u589e\u52a0\u3002"}, {"start": 67.82, "end": 76.46, "text": "Earnings were also hit by an eight point six six billion dollar equity investment loss, largely linked to SpaceX, which the company describes as noncash.", "zh": "\u8d22\u62a5\u8fd8\u53d7\u523086.6\u4ebf\u7f8e\u5143\u80a1\u6743\u6295\u8d44\u4e8f\u635f\u7684\u62d6\u7d2f\uff0c\u4e3b\u8981\u4e0e SpaceX \u76f8\u5173\uff0c\u516c\u53f8\u79f0\u5176\u4e3a\u975e\u73b0\u91d1\u9879\u76ee\u3002"}, {"start": 76.46, "end": 81.82, "text": "If the drop holds, it would be Alphabet's steepest one-day fall in seventy nine months.", "zh": "\u5982\u679c\u8dcc\u5e45\u4fdd\u6301\u5230\u6536\u76d8\uff0c\u8fd9\u5c06\u662f Alphabet 79\u4e2a\u6708\u4ee5\u6765\u6700\u5927\u7684\u5355\u65e5\u8dcc\u5e45\u3002"}, {"start": 81.82, "end": 93.82, "text": "Now the company that passed the same test: Microsoft. Revenue of ninety two point three billion dollars, up nineteen percent, and earnings of four dollars eighty nine cents, both beating expectations.", "zh": "\u518d\u8bf4\u901a\u8fc7\u540c\u4e00\u8003\u9a8c\u7684\u516c\u53f8\uff1a\u5fae\u8f6f\u3002\u8425\u6536923\u4ebf\u7f8e\u5143\uff0c\u589e\u957f19%\uff0c\u6bcf\u80a1\u6536\u76ca4.89\u7f8e\u5143\uff0c\u5747\u8d85\u9884\u671f\u3002"}, {"start": 93.82, "end": 104.9, "text": "Azure grew forty eight percent to thirty three point two billion dollars, and next quarter's Azure growth is guided at forty nine to fifty percent. Free cash flow was eighteen point six billion dollars.", "zh": "Azure \u589e\u957f48%\u81f3332\u4ebf\u7f8e\u5143\uff0c\u4e0b\u5b63\u5ea6 Azure \u589e\u901f\u6307\u5f15\u4e3a49%\u81f350%\u3002\u81ea\u7531\u73b0\u91d1\u6d41186\u4ebf\u7f8e\u5143\u3002"}, {"start": 104.9, "end": 117.34, "text": "And yet Microsoft still faded. It rose about five percent after hours, then fell to minus one point four nine percent intraday. The tape is not rewarding beats today; it is repricing the whole AI bill.", "zh": "\u7136\u800c\u5fae\u8f6f\u8fd8\u662f\u56de\u843d\u4e86\u3002\u76d8\u540e\u4e00\u5ea6\u6da8\u7ea65%\uff0c\u76d8\u4e2d\u5374\u8dcc\u81f3-1.49%\u3002\u4eca\u5929\u7684\u5e02\u573a\u4e0d\u662f\u5728\u5956\u52b1\u8d85\u9884\u671f\u7684\u8d22\u62a5\uff0c\u800c\u662f\u5728\u91cd\u4f30\u6574\u4e2a AI \u8d26\u5355\u3002"}, {"start": 117.34, "end": 124.85, "text": "Microsoft also announced its first U.S. bond sale since twenty seventeen, at least twenty five billion dollars, to fund the AI buildout.", "zh": "\u5fae\u8f6f\u8fd8\u5ba3\u5e03\u4e86\u81ea2017\u5e74\u4ee5\u6765\u9996\u6b21\u7f8e\u56fd\u503a\u5238\u53d1\u884c\uff0c\u81f3\u5c11250\u4ebf\u7f8e\u5143\uff0c\u7528\u4e8e AI \u5efa\u8bbe\u3002"}, {"start": 124.85, "end": 136.32, "text": "The broad tape shows the split. The S P Y is roughly flat, down point zero four percent, while the Q Q Q is down about one point three percent, below all its key moving averages.", "zh": "\u5927\u76d8\u5448\u73b0\u5206\u5316\uff1aSPY \u57fa\u672c\u6301\u5e73\uff0c\u8dcc0.04%\uff1bQQQ \u8dcc\u7ea61.3%\uff0c\u5df2\u8dcc\u7834\u5168\u90e8\u5173\u952e\u5747\u7ebf\u3002"}, {"start": 136.32, "end": 145.85, "text": "Small caps are the refuge. The I W M is up one point three two percent, and Walmart is up one point eight one percent on defensive rotation, with no company news at all.", "zh": "\u5c0f\u76d8\u80a1\u6210\u4e86\u907f\u98ce\u6e2f\uff1aIWM \u6da81.32%\uff0c\u6c83\u5c14\u739b\u5728\u6ca1\u6709\u4efb\u4f55\u516c\u53f8\u6d88\u606f\u7684\u60c5\u51b5\u4e0b\uff0c\u9760\u9632\u5fa1\u6027\u8f6e\u52a8\u6da81.81%\u3002"}, {"start": 145.85, "end": 155.86, "text": "Meta is also bucking the decline, up two point five percent, rebounding after a fifteen percent slide over the past month. Apple is up one point four two percent.", "zh": "Meta \u4e5f\u9006\u52bf\u4e0a\u6da82.5%\uff0c\u6b64\u524d\u4e00\u4e2a\u6708\u5df2\u8dcc15%\uff0c\u6b63\u5728\u53cd\u5f39\u3002\u82f9\u679c\u6da81.42%\u3002"}, {"start": 155.86, "end": 160.61, "text": "Tesla is holding up too, up point four one percent, with no notable news today.", "zh": "\u7279\u65af\u62c9\u4e5f\u8868\u73b0\u575a\u633a\uff0c\u6da80.41%\uff0c\u4eca\u5929\u6ca1\u6709\u91cd\u8981\u6d88\u606f\u3002"}, {"start": 160.61, "end": 171.22, "text": "Let's turn to macro. The Federal Reserve held rates at three point seven five to four percent on Wednesday, by a ten to two vote. Two officials dissented in favor of an immediate hike.", "zh": "\u518d\u770b\u5b8f\u89c2\u3002\u7f8e\u8054\u50a8\u5468\u4e09\u7ef4\u6301\u5229\u7387\u57283.75%\u81f34%\uff0c\u4ee510\u6bd42\u901a\u8fc7\uff0c\u4e24\u4f4d\u5b98\u5458\u56e0\u4e3b\u5f20\u7acb\u5373\u52a0
