<div id="volMenu" class="speed-menu" hidden><div class="speed-list" style="text-align:center;padding:20px"><div id="volLabel">音量 100%</div><input type="range" id="volRange" min="0" max="100" value="100" style="width:100%"></div></div><script>const SECTIONS=[{"slug": "2026-10-26-post-market", "title": "U.S. Stocks Post-Market Brief \u2014 October 26, 2026", "mp3": "2026-10-26-post-market/2026-10-26-post-market.mp3", "dur": "7:11", "lines": [{"start": 0.0, "end": 6.65, "text": "Welcome to the U.S. Stocks Post-Market Brief, for Monday, October 26, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u540e\u7b80\u62a5\uff0c2026\u5e7410\u670826\u65e5\u661f\u671f\u4e00\u3002\u6211\u662f Alex\u3002"}, {"start": 6.65, "end": 17.88, "text": "And I'm Jordan. This is the post-market edition, recorded after the close, and it is pure market research. No account data, no trading orders, just what happened and what to watch.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u76d8\u540e\u7248\uff0c\u6536\u76d8\u540e\u5f55\u5236\uff0c\u7eaf\u5e02\u573a\u7814\u7a76\u3002\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 17.88, "end": 23.16, "text": "Monday was a rebound day, led by technology and semiconductors, after Friday's broad selloff.", "zh": "\u5468\u4e00\u662f\u53cd\u5f39\u7684\u4e00\u5929\uff0c\u5728\u79d1\u6280\u80a1\u548c\u534a\u5bfc\u4f53\u80a1\u5e26\u9886\u4e0b\uff0c\u6b64\u524d\u5468\u4e94\u66fe\u5927\u9762\u79ef\u4e0b\u8dcc\u3002"}, {"start": 23.16, "end": 24.79, "text": "How strong was the rebound?", "zh": "\u53cd\u5f39\u6709\u591a\u5f3a\uff1f"}, {"start": 24.79, "end": 41.47, "text": "The S&P 500 rose 0.70% to 7,676.77. The Nasdaq Composite rose 0.82% to 26,169.38, and the Nasdaq-100 rose 1.09%.", "zh": "\u6807\u666e500\u4e0a\u6da80.70%\uff0c\u81f37676.77\u70b9\u3002\u7eb3\u65af\u8fbe\u514b\u7efc\u5408\u6307\u6570\u6da80.82%\uff0c\u81f326169.38\u70b9\uff0c\u7eb3\u65af\u8fbe\u514b100\u6307\u6570\u6da81.09%\u3002"}, {"start": 41.47, "end": 43.22, "text": "And the Dow lagged again?", "zh": "\u9053\u6307\u53c8\u843d\u540e\u4e86\uff1f"}, {"start": 43.22, "end": 57.31, "text": "Yes. The Dow rose just 0.28% to 52,361.58, and the Russell 2000 rose 0.38% to 2,786.42.", "zh": "\u662f\u7684\u3002\u9053\u6307\u4ec5\u6da80.28%\uff0c\u81f352361.58\u70b9\uff0c\u7f57\u7d202000\u6da80.38%\uff0c\u81f32786.42\u70b9\u3002"}, {"start": 57.31, "end": 59.16, "text": "Volatility came down too.", "zh": "\u6ce2\u52a8\u7387\u4e5f\u4e0b\u6765\u4e86\u3002"}, {"start": 59.16, "end": 68.52, "text": "The VIX fell 5.45% to 18.39. That is still elevated, but it is a clear step down from Friday's 19.45.", "zh": "VIX\u4e0b\u8dcc5.45%\uff0c\u81f318.39\u3002\u867d\u7136\u4ecd\u5904\u9ad8\u4f4d\uff0c\u4f46\u6bd4\u5468\u4e94\u768419.45\u660e\u663e\u56de\u843d\u3002"}, {"start": 68.52, "end": 72.17, "text": "What drove the day? Three huge AI deals, right?", "zh": "\u662f\u4ec0\u4e48\u63a8\u52a8\u4e86\u8fd9\u4e00\u5929\uff1f\u662f\u4e09\u7b14\u5de8\u5927\u7684AI\u4ea4\u6613\uff0c\u5bf9\u5427\uff1f"}, {"start": 72.17, "end": 80.38, "text": "Exactly. First, Anthropic filed for an IPO, under the ticker ANT, the first frontier AI lab to file publicly.", "zh": "\u6b63\u662f\u3002\u7b2c\u4e00\uff0cAnthropic\u63d0\u4ea4\u4e86IPO\u7533\u8bf7\uff0c\u80a1\u7968\u4ee3\u7801ANT\uff0c\u662f\u9996\u5bb6\u516c\u5f00\u63d0\u4ea4\u7533\u8bf7\u7684\u524d\u6cbfAI\u5b9e\u9a8c\u5ba4\u3002"}, {"start": 80.38, "end": 81.86, "text": "What did the filing show?", "zh": "\u62db\u80a1\u6587\u4ef6\u663e\u793a\u4e86\u4ec0\u4e48\uff1f"}, {"start": 81.86, "end": 90.31, "text": "First-half revenue of 16.29 billion dollars, versus 1.2 billion a year earlier. That is roughly thirteen-fold growth.", "zh": "\u4e0a\u534a\u5e74\u6536\u5165162.9\u4ebf\u7f8e\u5143\uff0c\u800c\u4e00\u5e74\u524d\u662f12\u4ebf\u7f8e\u5143\uff0c\u5927\u7ea6\u589e\u957f\u4e8613\u500d\u3002"}, {"start": 90.31, "end": 92.59, "text": "But also a huge loss, I heard.", "zh": "\u4f46\u6211\u542c\u8bf4\u4e8f\u635f\u4e5f\u5f88\u5927\u3002"}, {"start": 92.59, "end": 105.79, "text": "A net loss of 80.7 billion dollars, but most of it was a 72.4 billion dollar non-cash charge from revaluing convertible notes. The operating loss was 693 million dollars.", "zh": "\u51c0\u4e8f\u635f807\u4ebf\u7f8e\u5143\uff0c\u4f46\u5176\u4e2d\u5927\u90e8\u5206\u662f724\u4ebf\u7f8e\u5143\u7684\u975e\u73b0\u91d1\u652f\u51fa\uff0c\u6765\u81ea\u53ef\u8f6c\u6362\u7968\u636e\u91cd\u4f30\u3002\u7ecf\u8425\u4e8f\u635f\u4e3a6.93\u4ebf\u7f8e\u5143\u3002"}, {"start": 105.79, "end": 107.11, "text": "And the valuation?", "zh": "\u4f30\u503c\u5462\uff1f"}, {"start": 107.11, "end": 115.75, "text": "Reported at 1.5 trillion dollars or more, possibly up to 2 trillion, but that is UNCONFIRMED. Treat it as a report, not a fact.", "zh": "\u636e\u4f20\u4e3a1.5\u4e07\u4ebf\u7f8e\u5143\u6216\u66f4\u9ad8\uff0c\u53ef\u80fd\u9ad8\u8fbe2\u4e07\u4ebf\u7f8e\u5143\uff0c\u4f46\u8fd9\u5c1a\u672a\u786e\u8ba4\u3002\u8bf7\u628a\u5b83\u5f53\u4f5c\u4f20\u95fb\uff0c\u800c\u975e\u4e8b\u5b9e\u3002"}, {"start": 115.75, "end": 117.62, "text": "Second deal: Meta.", "zh": "\u7b2c\u4e8c\u7b14\u4ea4\u6613\uff1aMeta\u3002"}, {"start": 117.62, "end": 128.5, "text": "Meta announced plans to raise up to 95 billion dollars, its largest-ever equity fundraising: about 35 billion launched on Monday, plus a 60 billion dollar at-the-market program.", "zh": "Meta\u5ba3\u5e03\u8ba1\u5212\u878d\u8d44\u9ad8\u8fbe950\u4ebf\u7f8e\u5143\uff0c\u662f\u5176\u6709\u53f2\u4ee5\u6765\u6700\u5927\u89c4\u6a21\u7684\u80a1\u6743\u878d\u8d44\uff1a\u5468\u4e00\u542f\u52a8\u7ea6350\u4ebf\u7f8e\u5143\uff0c\u53e6\u52a0600\u4ebf\u7f8e\u5143\u7684\u5e02\u4ef7\u53d1\u884c\u8ba1\u5212\u3002"}, {"start": 128.5, "end": 131.26, "text": "That resolves the confusing numbers from the morning, then.", "zh": "\u8fd9\u5c31\u6f84\u6e05\u4e86\u65e9\u4e0a\u90a3\u4e9b\u4ee4\u4eba\u56f0\u60d1\u7684\u6570\u5b57\u3002"}, {"start": 131.26, "end": 138.58, "text": "Yes. The 95 billion dollar total is the right frame. Meta shares still fell 1.88% on dilution fears.", "zh": "\u662f\u7684\u3002950\u4ebf\u7f8e\u5143\u7684\u603b\u989d\u624d\u662f\u6b63\u786e\u7684\u53e3\u5f84\u3002Meta\u80a1\u4ef7\u4ecd\u56e0\u7a00\u91ca\u62c5\u5fe7\u4e0b\u8dcc1.88%\u3002"}, {"start": 138.58, "end": 139.85, "text": "And the third deal?", "zh": "\u7b2c\u4e09\u7b14\u5462\uff1f"}, {"start": 139.85, "end": 147.41, "text": "SpaceX struck a roughly 40 billion dollar deal with an Apollo affiliate, which will buy AI chips and servers and lease them to SpaceX.", "zh": "SpaceX\u4e0e\u963f\u6ce2\u7f57\u7684\u4e00\u5bb6\u5173\u8054\u516c\u53f8\u8fbe\u6210\u7ea6400\u4ebf\u7f8e\u5143\u7684\u4ea4\u6613\uff0c\u7531\u5bf9\u65b9\u8d2d\u4e70AI\u82af\u7247\u548c\u670d\u52a1\u5668\uff0c\u518d\u79df\u7ed9SpaceX\u3002"}, {"start": 147.41, "end": 150.1, "text": "Plus Anthropic buying compute from SpaceX?", "zh": "\u8fd8\u6709Anthropic\u5411SpaceX\u8d2d\u4e70\u7b97\u529b\uff1f"}, {"start": 150.1, "end": 158.26, "text": "Yes. Anthropic agreed to spend up to 120.5 billion dollars with SpaceX on computing capacity, running into 2029.", "zh": "\u662f\u7684\u3002Anthropic\u540c\u610f\u5411SpaceX\u652f\u4ed8\u9ad8\u8fbe1205\u4ebf\u7f8e\u5143\u7684\u7b97\u529b\u8d39\u7528\uff0c\u6301\u7eed\u52302029\u5e74\u3002"}, {"start": 158.26, "end": 161.66, "text": "So the market split AI into funders and enablers.", "zh": "\u6240\u4ee5\u5e02\u573a\u628aAI\u5206\u6210\u4e86\u51fa\u8d44\u65b9\u548c\u8d4b\u80fd\u65b9\u3002"}, {"start": 161.66, "end": 170.3, "text": "That is the key insight. Chip and memory stocks rallied, while Meta, the funder, fell. The market is now charging funders for their spending.", "zh": "\u8fd9\u5c31\u662f\u5173\u952e\u3002\u82af\u7247\u548c\u5b58\u50a8\u80a1\u4e0a\u6da8\uff0c\u800c\u51fa\u8d44\u65b9Meta\u4e0b\u8dcc\u3002\u5e02\u573a\u73b0\u5728\u5f00\u59cb\u5411\u51fa\u8d44\u65b9\u6536\u53d6\u878d\u8d44\u6210\u672c\u3002"}, {"start": 170.3, "end": 171.55, "text": "How did chips do?", "zh": "\u82af\u7247\u80a1\u8868\u73b0\u5982\u4f55\uff1f"}, {"start": 171.55, "end": 186.07, "text": "The Philadelphia Semiconductor Index rose 2.82%. Nvidia rose 2.39%, AMD rose 2.80%, and Micron rose 2.98% to 903 dollars and 70 cents.", "zh": "\u8d39\u57ce\u534a\u5bfc\u4f53\u6307\u6570\u6da82.82%\u3002\u82f1\u4f1f\u8fbe\u6da82.39%\uff0cAMD\u6da82.80%\uff0c\u7f8e\u5149\u6da82.98%\uff0c\u81f3903.70\u7f8e\u5143\u3002"}, {"start": 186.07, "end": 187.75, "text": "And the leveraged chip fund?", "zh": "\u6760\u6746\u82af\u7247\u57fa\u91d1\u5462\uff1f"}, {"start": 187.75, "end": 199.1, "text": "SOXL rose 8.31% to 90 dollars and 50 cents, fading from a 10.48% intraday print, then adding another 2.12% after hours.", "zh": "SOXL\u6da88.31%\uff0c\u81f390.50\u7f8e\u5143\uff0c\u76d8\u4e2d\u4e00\u5ea6\u6da810.48%\u540e\u56de\u843d\uff0c\u76d8\u540e\u518d\u6da82.12%\u3002"}, {"start": 199.1, "end": 201.1, "text": "Memory was strong across the board?", "zh": "\u5b58\u50a8\u80a1\u666e\u904d\u8d70\u5f3a\uff1f"}, {"start": 201.1, "end": 214.37, "text": "Yes. SK Hynix's American listing rose 4.09% to 142 dollars and 62 cents, and SanDisk rose 1.42% to 1,255 dollars and 58 cents.", "zh": "\u662f\u7684\u3002SK\u6d77\u529b\u58eb\u7f8e\u80a1\u6da84.09%\uff0c\u81f3142.62\u7f8e\u5143\uff0c\u95ea\u8fea\u6da81.42%\uff0c\u81f31255.58\u7f8e\u5143\u3002"}, {"start": 214.37, "end": 217.8, "text": "But SK Hynix's dividend story is still unconfirmed?", "zh": "\u4f46SK\u6d77\u529b\u58eb\u7684\u5206\u7ea2\u4f20\u95fb\u4ecd\u672a\u786e\u8ba4\uff1f"}, {"start": 217.8, "end": 227.4, "text": "Correct. A reported special dividend of around 12 billion dollars is UNCONFIRMED. The company reports earnings on Wednesday, and that is the verification event.", "zh": "\u6ca1\u9519\u3002\u636e\u4f20\u7ea6120\u4ebf\u7f8e\u5143\u7684\u7279\u522b\u80a1\u606f\u5c1a\u672a\u786e\u8ba4\u3002\u516c\u53f8\u5468\u4e09\u516c\u5e03\u8d22\u62a5\uff0c\u90a3\u624d\u662f\u9a8c\u8bc1\u7684\u65f6\u523b\u3002"}, {"start": 227.4, "end": 229.32, "text": "What about the rest of the watchlist?", "zh": "\u81ea\u9009\u80a1\u5176\u4ed6\u80a1\u7968\u5462\uff1f"}, {"start": 229.32, "end": 241.75, "text": "Seventeen of the 24 names rose. TECL rose 5.01%, TQQQ rose 3.23%, and Bloom Energy rose 5.49% on data-center power demand.", "zh": "24\u53ea\u80a1\u7968\u4e2d\u670917\u53ea\u4e0a\u6da8\u3002TECL\u6da85.01%\uff0cTQQQ\u6da83.23%\uff0cBloom Energy\u56e0\u6570\u636e\u4e2d\u5fc3\u7535\u529b\u9700\u6c42\u6da85.49%\u3002"}, {"start": 241.75, "end": 242.76, "text": "And Tesla?", "zh": "\u7279\u65af\u62c9\u5462\uff1f"}, {"start": 242.76, "end": 255.96, "text": "Tesla rose 5.21% to 391 dollars and 62 cents, after Barclays upgraded it to Overweight and raised its price target to 450 dollars, citing a possible SpaceX merger in its bull case.", "zh": "\u7279\u65af\u62c9\u6da85.21%\uff0c\u81f3391.62\u7f8e\u5143\uff0c\u6b64\u524d\u5df4\u514b\u83b1\u5c06\u5176\u4e0a\u8c03\u4e3a\u8d85\u914d\uff0c\u76ee\u6807\u4ef7\u4e0a\u8c03\u81f3450\u7f8e\u5143\uff0c\u4e50\u89c2\u60c5\u5f62\u4e2d\u63d0\u5230\u4e0eSpaceX\u5408\u5e76\u7684\u53ef\u80fd\u3002"}, {"start": 255.96, "end": 256.87, "text": "Who fell?", "zh": "\u8c01\u8dcc\u4e86\uff1f"}, {"start": 256.87, "end": 271.99, "text": "Apple fell 1.10% to 343 dollars and 91 cents, Alphabet fell 1.06%, and Moderna fell 0.62%. The volatility fund UVXY fell 3.57%.", "zh": "\u82f9\u679c\u8dcc1.10%\uff0c\u81f3343.91\u7f8e\u5143\uff0cAlphabet\u8dcc1.06%\uff0cModerna\u8dcc0.62%\u3002\u6ce2\u52a8\u7387\u57fa\u91d1UVXY\u8dcc3.57%\u3002"}, {"start": 271.99, "end": 273.48, "text": "And the crypto proxy?", "zh": "\u52a0\u5bc6\u6982\u5ff5\u80a1\u5462\uff1f"}, {"start": 273.48, "end": 284.35, "text": "Strategy fell about 5%, as Bitcoin slipped below 80,000 dollars. Roughly 200 billion dollars of capital is being absorbed by the Meta raise and a possible Anthropic IPO instead.", "zh": "Strategy\u8dcc\u7ea65%\uff0c\u6bd4\u7279\u5e01\u8dcc\u783480000\u7f8e\u5143\u3002\u7ea62000\u4ebf\u7f8e\u5143\u7684\u8d44\u91d1\u6b63\u88abMeta\u878d\u8d44\u548c\u53ef\u80fd\u7684Anthropic IPO\u5438\u8d70\uff0c\u800c\u4e0d\u662f\u6d41\u5411\u52a0\u5bc6\u8d44\u4ea7\u3002"}, {"start": 284.35, "end": 285.74, "text": "Oil and rates?", "zh": "\u6cb9\u4ef7\u548c\u5229\u7387\u5462\uff1f"}, {"start": 285.74, "end": 301.27, "text": "WTI settled at 101 dollars and 76 cents, down 1.46%, and Brent settled at 115 dollars and 81 cents, down 0.78%, as Saudi-Iran talks eased some war premium.", "zh": "WTI\u6536\u4e8e101.76\u7f8e\u5143\uff0c\u8dcc1.46%\uff0c\u5e03\u4f26\u7279\u6536\u4e8e115.81\u7f8e\u5143\uff0c\u8dcc0.78%\uff0c\u56e0\u6c99\u7279\u4e0e\u4f0a\u6717\u4f1a\u8c08\u7f13\u89e3\u4e86\u90e8\u5206\u6218\u4e89\u6ea2\u4ef7\u3002"}, {"start": 301.27, "end": 302.4, "text": "And the 10-year?", "zh": "10\u5e74\u671f\u56fd\u503a\u5462\uff1f"}, {"start": 302.4, "end": 310.97, "text": "The 10-year yield held at 5.00%, flat on the day. The 2-year eased to 4.68%. Five percent is acting as a valuation ceiling.", "zh": "10\u5e74\u671f\u6536\u76ca\u7387\u6301\u5e73\u4e8e5.00%\u30022\u5e74\u671f\u56de\u843d\u81f34.68%\u30025%\u6b63\u5728\u6210\u4e3a\u4f30\u503c\u7684\u4e0a\u9650\u3002"}, {"start": 310.97, "end": 312.94, "text": "Brazil was the other big story.", "zh": "\u5df4\u897f\u662f\u53e6\u4e00\u4e2a\u5927\u65b0\u95fb\u3002"}, {"start": 312.94, "end": 321.74, "text": "Yes. Lula won Sunday's runoff, the first candidate ever to win the second round after losing the first. Markets had priced the opposite result.", "zh": "\u662f\u7684\u3002\u5362\u62c9\u8d62\u5f97\u5468\u65e5\u7684\u7b2c\u4e8c\u8f6e\u6295\u7968\uff0c\u662f\u5386\u53f2\u4e0a\u9996\u4f4d\u5728\u9996\u8f6e\u5931\u5229\u540e\u8d62\u5f97\u51b3\u80dc\u8f6e\u7684\u5019\u9009\u4eba\u3002\u5e02\u573a\u539f\u672c\u62bc\u6ce8\u7684\u662f\u76f8\u53cd\u7684\u7ed3\u679c\u3002"}, {"start": 321.74, "end": 323.38, "text": "How bad was the selloff?", "zh": "\u629b\u552e\u6709\u591a\u4e25\u91cd\uff1f"}, {"start": 323.38, "end": 337.06, "text": "The Ibovespa fell 13.88%, and the US-listed Brazil fund fell 19.82%. Contagion to US stocks was limited, but it is a reminder that elections can still reprice a whole market in a day.", "zh": "\u5df4\u897f\u80a1\u6307\u8dcc13.88%\uff0c\u7f8e\u56fd\u4e0a\u5e02\u7684\u5df4\u897f\u57fa\u91d1\u8dcc19.82%\u3002\u5bf9\u7f8e\u80a1\u7684\u4f20\u67d3\u6709\u9650\uff0c\u4f46\u8fd9\u63d0\u9192\u4eba\u4eec\uff0c\u9009\u4e3e\u4ecd\u80fd\u5728\u4e00\u5929\u5185\u91cd\u4f30\u6574\u4e2a\u5e02\u573a\u3002"}, {"start": 337.06, "end": 339.14, "text": "After hours, anything notable?", "zh": "\u76d8\u540e\u6709\u4ec0\u4e48\u503c\u5f97\u6ce8\u610f\u7684\uff1f"}, {"start": 339.14, "end": 350.23, "text": "Verizon beat expectations, earning 1 dollar and 31 cents a share versus 1 dollar and 27 cents expected. DoorDash fell about 6% on reported buyout talks with Instacart.", "zh": "Verizon\u8d85\u51fa\u9884\u671f\uff0c\u6bcf\u80a1\u76c8\u52291.31\u7f8e\u5143\uff0c\u800c\u9884\u671f\u4e3a1.27\u7f8e\u5143\u3002DoorDash\u56e0\u636e\u4f20\u4e0eInstacart\u7684\u6536\u8d2d\u8c08\u5224\u8dcc\u7ea66%\u3002"}, {"start": 350.23, "end": 355.44, "text": "Now the strategy part. This brief is read-only, but what posture does it describe?", "zh": "\u73b0\u5728\u8bf4\u7b56\u7565\u90e8\u5206\u3002\u8fd9\u4efd\u7b80\u62a5\u662f\u53ea\u8bfb\u7684\uff0c\u4f46\u5b83\u63cf\u8ff0\u4e86\u4ec0\u4e48\u59ff\u6001\uff1f"}, {"start": 355.44, "end": 368.64, "text": "Spreads only, 14 to 30 days to expiry, far strikes, wide wings, and small size. Take profit at 50 to 70% of the credit, and keep any single trade's maximum loss to 1 to 2%.", "zh": "\u53ea\u505a\u4ef7\u5dee\uff0c14\u81f330\u5929\u5230\u671f\uff0c\u8fdc\u79bb\u884c\u6743\u4ef7\uff0c\u5bbd\u7ffc\uff0c\u5c0f\u4ed3\u4f4d\u3002\u6b62\u76c8\u4e3a\u6743\u5229\u91d1\u768450%\u81f370%\uff0c\u5355\u7b14\u6700\u5927\u4e8f\u635f\u63a7\u5236\u57281%\u81f32%\u3002"}, {"start": 368.64, "end": 370.51, "text": "Why the extra caution this week?", "zh": "\u4e3a\u4ec0\u4e48\u672c\u5468\u8981\u683c\u5916\u8c28\u614e\uff1f"}, {"start": 370.51, "end": 380.83, "text": "Because Wednesday is a binary wall. The Federal Reserve decision is at 2 p.m. Eastern, with Chair Warsh speaking at 2:30, and after the close, Microsoft and Alphabet report earnings.", "zh": "\u56e0\u4e3a\u5468\u4e09\u662f\u4e00\u9053\u4e8c\u5143\u4e8b\u4ef6\u5899\u3002\u7f8e\u8054\u50a8\u51b3\u8bae\u5728\u4e1c\u90e8\u65f6\u95f4\u4e0b\u53482\u70b9\uff0cWarsh\u4e3b\u5e2d2\u70b9\u534a\u8bb2\u8bdd\uff0c\u6536\u76d8\u540e\u5fae\u8f6f\u548cAlphabet\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 380.83, "end": 382.08, "text": "And KORU?", "zh": "KORU\u5462\uff1f"}, {"start": 382.08, "end": 392.04, "text": "The playbook default for KORU remains a bear call spread, given its very high volatility and overnight gap risk. Selling after the event wall is cleaner than chasing Monday's rip.", "zh": "\u6839\u636e\u7b56\u7565\u624b\u518c\uff0cKORU\u7684\u9ed8\u8ba4\u7b56\u7565\u4ecd\u662f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u56e0\u4e3a\u5176\u6ce2\u52a8\u7387\u975e\u5e38\u9ad8\u4e14\u6709\u9694\u591c\u8df3\u7a7a\u98ce\u9669\u3002\u7b49\u4e8b\u4ef6\u5899\u8fc7\u53bb\u518d\u5356\uff0c\u6bd4\u8ffd\u9010\u5468\u4e00\u7684\u6da8\u52bf\u66f4\u5e72\u51c0\u3002"}, {"start": 392.04, "end": 393.31, "text": "What comes next?", "zh": "\u63a5\u4e0b\u6765\u662f\u4ec0\u4e48\uff1f"}, {"start": 393.31, "end": 405.02, "text": "Tuesday brings Boeing, Coca-Cola, PayPal and UPS earnings, plus consumer confidence. Thursday brings third-quarter GDP, September PCE inflation, and Amazon and SanDisk earnings.", "zh": "\u5468\u4e8c\u6709\u6ce2\u97f3\u3001\u53ef\u53e3\u53ef\u4e50\u3001PayPal\u548cUPS\u8d22\u62a5\uff0c\u4ee5\u53ca\u6d88\u8d39\u8005\u4fe1\u5fc3\u6570\u636e\u3002\u5468\u56db\u6709\u4e09\u5b63\u5ea6GDP\u30019\u6708PCE\u901a\u80c0\uff0c\u4ee5\u53ca\u4e9a\u9a6c\u900a\u548c\u95ea\u8fea\u8d22\u62a5\u3002"}, {"start": 405.02, "end": 407.78, "text": "So, to recap Monday in one sentence?", "zh": "\u90a3\u4e48\uff0c\u7528\u4e00\u53e5\u8bdd\u603b\u7ed3\u5468\u4e00\uff1f"}, {"start": 407.78, "end": 415.1, "text": "An AI funding blitz revived chips and memory, punished the funders, and left a binary Wednesday to decide whether the rebound holds.", "zh": "\u4e00\u573aAI\u878d\u8d44\u70ed\u6f6e\u8ba9\u82af\u7247\u548c\u5b58\u50a8\u80a1\u590d\u82cf\uff0c\u60e9\u7f5a\u4e86\u51fa\u8d44\u65b9\uff0c\u5e76\u628a\u51b3\u5b9a\u53cd\u5f39\u80fd\u5426\u6301\u7eed\u7684\u60ac\u5ff5\u7559\u7ed9\u4e86\u4e8c\u5143\u5316\u7684\u5468\u4e09\u3002"}, {"start": 415.1, "end": 421.22, "text": "Thanks for listening. This was a market research summary only, not investment advice, and not a trade recommendation.", "zh": "\u8c22\u8c22\u6536\u542c\u3002\u8fd9\u53ea\u662f\u5e02\u573a\u7814\u7a76\u603b\u7ed3\uff0c\u4e0d\u662f\u6295\u8d44\u5efa\u8bae\uff0c\u4e5f\u4e0d\u662f\u4ea4\u6613\u63a8\u8350\u3002"}, {"start": 421.22, "end": 429.91, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "\u5bf9\u4e8e\u53ea\u6709\u5238\u5546\u624d\u80fd\u786e\u8ba4\u7684\u4e8b\u60c5\uff0c\u6bd4\u5982\u6301\u4ed3\u3001\u5230\u671f\u3001\u884c\u6743\u6216\u4fdd\u8bc1\u91d1\uff0c\u8bf7\u67e5\u770b\u4f60\u7684\u5238\u5546App\u3002\u6211\u4eec\u4e0b\u671f\u7b80\u62a5\u518d\u89c1\u3002"}, {"start": 429.91, "end": 430.92, "text": "See you then.", "zh": "\u518d\u89c1\u3002"}]},{"slug": "2026-10-26-pre-market", "title": "U.S. Stocks Pre-Market Brief — October 26, 2026", "mp3": "2026-10-26-pre-market/2026-10-26-pre-market.mp3", "dur": "6:29", "lines": [{"start": 0.0, "end": 7.27, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Monday, October 26, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘前简报，2026年10月26日星期一。我是 Alex。"}, {"start": 7.27, "end": 17.88, "text": "And I'm Jordan. This is the pre-market edition, recorded before the open, and it is pure market research. No account data, no trading orders, just what is happening and what to watch.", "zh": "我是 Jordan。这是盘前版，开盘前录制，纯市场研究。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 17.88, "end": 25.63, "text": "Let us start with the headline. Futures are modestly higher, but this is a relief bounce, not a clean all-clear.", "zh": "先从头条开始。期货小幅走高，但这只是一次缓解反弹，不是全面解除警报。"}, {"start": 25.63, "end": 27.36, "text": "How modest are we talking?", "zh": "小幅是有多小？"}, {"start": 27.36, "end": 37.51, "text": "At 05:19 ET, Dow futures were up 0.49%, S&P futures up 0.30%, and Nasdaq futures up 0.25%.", "zh": "东部时间5点19分，道指期货涨0.49%，标普期货涨0.30%，纳指期货涨0.25%。"}, {"start": 37.51, "end": 40.2, "text": "And the driver was oil pulling back, right?", "zh": "推动因素是油价回落，对吧？"}, {"start": 40.2, "end": 50.81, "text": "Partly. Brent crude settled Friday at $116.72, and WTI was around $101 on Monday morning, down about 2%.", "zh": "部分是。布伦特原油周五收于116.72美元，周一早上西德州原油约101美元，下跌约2%。"}, {"start": 50.81, "end": 52.97, "text": "But Friday itself was a down day.", "zh": "但周五本身是下跌的一天。"}, {"start": 52.97, "end": 67.08, "text": "Yes, and a broad one. The Dow fell 1.23% to 52,215.16. The S&P 500 fell 0.52% to 7,623.68.", "zh": "是的，而且跌面很广。道指下跌1.23%，至52215.16点。标普500下跌0.52%，至7623.68点。"}, {"start": 67.08, "end": 68.76, "text": "The Nasdaq held up better?", "zh": "纳指表现好一些？"}, {"start": 68.76, "end": 85.51, "text": "Relatively. The Nasdaq Composite fell 0.21%, and the Russell 2000 fell 0.29%. For the week, the S&P lost 0.5% and the Nasdaq 0.7%, while the Dow gained 0.4%.", "zh": "相对而言。纳斯达克综合指数跌0.21%，罗素2000跌0.29%。全周来看，标普跌0.5%，纳指跌0.7%，而道指涨0.4%。"}, {"start": 85.51, "end": 88.22, "text": "What made Friday different from the earlier selloffs?", "zh": "周五和之前的抛售有什么不同？"}, {"start": 88.22, "end": 97.06, "text": "The selloff broadened beyond technology. Defensives fell too, so there was nowhere obvious to hide. That is why Monday's bounce should not be read as risk-on.", "zh": "抛售扩散到了科技股之外。防御股也跌了，所以没有明显的避风港。这就是为什么周一的反弹不应被解读为风险偏好回归。"}, {"start": 97.06, "end": 99.34, "text": "What about volatility and rates?", "zh": "波动率和利率呢？"}, {"start": 99.34, "end": 109.25, "text": "The VIX closed Friday at 19.45. Realized volatility is only around 10–12%, so the market is paying up for event risk that has not arrived yet.", "zh": "VIX周五收于19.45。实际波动率只有10%到12%左右，所以市场正在为尚未到来的事件风险支付溢价。"}, {"start": 109.25, "end": 110.33, "text": "And yields?", "zh": "收益率呢？"}, {"start": 110.33, "end": 116.21, "text": "The 10-year Treasury yield ended Friday around 4.99–5.00%.", "zh": "10年期国债收益率周五收于4.99%至5.00%左右。"}, {"start": 116.21, "end": 118.49, "text": "Asia overnight was mixed, was it not?", "zh": "隔夜亚洲市场涨跌互现，对吧？"}, {"start": 118.49, "end": 130.8, "text": "Yes. Japan's Nikkei fell 0.80%, on chip selling. Korea's KOSPI fell 1.46%, with net foreign selling of ₩816.5B.", "zh": "是的。日本日经指数因芯片股抛售下跌0.80%。韩国综合指数下跌1.46%，外资净卖出8165亿韩元。"}, {"start": 130.8, "end": 132.29, "text": "But China was higher?", "zh": "但中国市场上涨了？"}, {"start": 132.29, "end": 137.45, "text": "Shanghai rose 0.19% and Hong Kong rose 0.51%.", "zh": "上证涨0.19%，恒生涨0.51%。"}, {"start": 137.45, "end": 139.37, "text": "Memory was the bright spot again.", "zh": "存储又是亮点。"}, {"start": 139.37, "end": 152.76, "text": "Yes. Micron was up 1.38% pre-market, to $889.66. SK Hynix's American listing was up 2.86%, and SanDisk was up 1.32%.", "zh": "是的。美光盘前涨1.38%，至889.66美元。SK海力士美股上市涨2.86%，闪迪涨1.32%。"}, {"start": 152.76, "end": 154.8, "text": "What is behind the memory strength?", "zh": "存储走强的原因是什么？"}, {"start": 154.8, "end": 165.53, "text": "Tight pricing, and TrendForce expects fourth-quarter DRAM prices up 20% from the third quarter. But SanDisk reports earnings on Thursday, so that caps how far to chase the move.", "zh": "价格紧张，TrendForce预计四季度DRAM价格比三季度涨20%。但闪迪周四公布财报，这限制了追涨的空间。"}, {"start": 165.53, "end": 167.16, "text": "And Korea more broadly?", "zh": "韩国市场整体呢？"}, {"start": 167.16, "end": 174.96, "text": "Korea is weak into its own earnings. The KOSPI proxy is negative, and SK Hynix reports on Wednesday, with a possible shareholder-return announcement.", "zh": "韩国市场在自身财报前走弱。韩国综合指数相关的基金表现偏负，SK海力士周三公布财报，可能同时宣布股东回报。"}, {"start": 174.96, "end": 177.24, "text": "Possible, meaning unconfirmed?", "zh": "可能，意思是还没确认？"}, {"start": 177.24, "end": 186.84, "text": "Exactly, and this is important. A reported special dividend of around $12B for SK Hynix is UNCONFIRMED. Treat it as a rumor until the company says it.", "zh": "正是如此，这一点很重要。据传SK海力士约120亿美元的特别股息尚未确认。在公司正式宣布之前，只能当作传闻。"}, {"start": 186.84, "end": 189.31, "text": "That brings us to the big question of the week.", "zh": "这就说到本周的大问题了。"}, {"start": 189.31, "end": 204.43, "text": "The AI-financing question. Hyperscaler capital spending is around $800B in 2026, and one estimate puts it above $7T from 2025 to 2030, with negative free cash flow until at least next year.", "zh": "AI融资问题。超大规模厂商2026年资本开支约8000亿美元，有估计认为2025至2030年将超过7万亿美元，且自由现金流至少到明年都为负。"}, {"start": 204.43, "end": 205.99, "text": "So the question flipped.", "zh": "所以问题变了。"}, {"start": 205.99, "end": 219.12, "text": "Yes, from how fast can they build, to who pays, with what cash flow, and at what borrowing cost. A weekend post about neocloud funding knocked CoreWeave and Nebius about 3% lower pre-market.", "zh": "是的，从能建多快，变成了谁来买单、用什么现金流、以什么融资成本。周末一则关于新云厂商融资的帖子让CoreWeave和Nebius盘前跌约3%。"}, {"start": 219.12, "end": 220.75, "text": "Wednesday is the hinge, then.", "zh": "那么周三就是关键。"}, {"start": 220.75, "end": 231.79, "text": "Wednesday is the hinge. The Federal Reserve decision is at 14:00 ET, with Chair Warsh speaking at 14:30. After the close, Microsoft and Alphabet report earnings.", "zh": "周三就是关键。美联储决议在东部时间下午2点，Warsh主席2点半讲话。收盘后，微软和Alphabet公布财报。"}, {"start": 231.79, "end": 233.59, "text": "What are the expectations there?", "zh": "市场对它们的预期是什么？"}, {"start": 233.59, "end": 248.16, "text": "Microsoft is expected to earn $4.71 a share on about $90.63B of revenue. Alphabet is expected to earn $3.03 on about $127.91B.", "zh": "微软预期每股盈利4.71美元，收入约906.3亿美元。Alphabet预期每股盈利3.03美元，收入约1279.1亿美元。"}, {"start": 248.16, "end": 249.31, "text": "And Thursday?", "zh": "周四呢？"}, {"start": 249.31, "end": 259.46, "text": "Thursday brings advance third-quarter GDP, expected around 3%, plus September PCE inflation, and after the close, Amazon and SanDisk report.", "zh": "周四有提前公布的三季度GDP，预期约3%，还有9月PCE通胀，收盘后亚马逊和闪迪公布财报。"}, {"start": 259.46, "end": 262.46, "text": "Two overnight shocks are still repricing, right?", "zh": "两个隔夜冲击还在重定价，对吧？"}, {"start": 262.46, "end": 279.5, "text": "Yes. First, Brazil. Lula won the runoff with about 51.8%, against about 48.2%. The Brazil fund's pre-market range of −19% to −27% is an UNVERIFIED single print, so do not trade on it alone.", "zh": "是的。第一是巴西。卢拉以约51.8%赢得第二轮，对手约48.2%。巴西基金盘前-19%至-27%的区间是未经核实的单一数据，不要仅凭它交易。"}, {"start": 279.5, "end": 280.75, "text": "And the second shock?", "zh": "第二个冲击呢？"}, {"start": 280.75, "end": 294.96, "text": "SpaceX. A reported $40B GPU debt deal is UNRESOLVED, with reports disagreeing on whether it is closed or not yet priced. Separately, the SpaceX-linked fund has 328.4M shares unlocking today.", "zh": "SpaceX。据传400亿美元的GPU债务交易尚未定论，各方报道对是否已完成或尚未定价存在分歧。另外，与SpaceX相关的基金今天有3.284亿股解禁。"}, {"start": 294.96, "end": 297.31, "text": "Meta also had a confusing headline.", "zh": "Meta也有一个令人困惑的消息。"}, {"start": 297.31, "end": 313.34, "text": "Yes. A reported Meta equity raise has CONFLICTING figures, $22.5B versus $95B. That is UNCONFIRMED, and a single-source pre-market gain of 2.61% should be treated with the same caution.", "zh": "是的。据传Meta的股权融资数字相互冲突，225亿美元对950亿美元。这是未经确认的，单一来源的盘前2.61%涨幅也应同样谨慎对待。"}, {"start": 313.34, "end": 318.79, "text": "Now the strategy part. This brief is read-only, but what posture does it describe?", "zh": "现在说策略部分。这份简报是只读的，但它描述了什么姿态？"}, {"start": 318.79, "end": 332.16, "text": "Spreads only, 14–30 days to expiry, far strikes, wide wings, and small size. Take profit at 50–70% of the credit, and keep any single trade's maximum loss to 1–2%.", "zh": "只做价差，14至30天到期，远离行权价，宽翼，小仓位。止盈为权利金的50%至70%，任何单笔交易的最大亏损控制在1%至2%。"}, {"start": 332.16, "end": 334.03, "text": "Why the extra caution this week?", "zh": "为什么本周要格外谨慎？"}, {"start": 334.03, "end": 345.48, "text": "Because volatility is elevated and the event wall is binary. If you sell premium at all, the cleaner expression is to sell it after the event wall where possible, or to size it so a Wednesday gap does not matter.", "zh": "因为波动率高企，而且事件墙是二元的。如果一定要卖权利金，更干净的做法是尽可能在事件墙过去之后再卖，或者把仓位小到周三跳空也无所谓。"}, {"start": 345.48, "end": 346.73, "text": "And KORU?", "zh": "KORU呢？"}, {"start": 346.73, "end": 359.88, "text": "The playbook default for KORU remains a bear call spread, given its very high volatility and overnight gap risk. Selling the rip into Wednesday's close, rather than selling strength on Monday morning, is the cleaner version of the same view.", "zh": "根据策略手册，KORU的默认策略仍是熊市看涨价差，因为其波动率非常高且有隔夜跳空风险。在周三收盘前卖涨势，比周一早上卖强势是更干净的同一种看法。"}, {"start": 359.88, "end": 362.64, "text": "So, to recap Monday in one sentence?", "zh": "那么，用一句话总结周一？"}, {"start": 362.64, "end": 373.39, "text": "A relief bounce on softer oil, into a week where Wednesday's Fed decision and Microsoft and Alphabet earnings will decide whether the AI financing repricing continues or pauses.", "zh": "油价回落带来一次缓解反弹，而本周周三的美联储决议和微软、Alphabet财报，将决定AI融资重定价是继续还是暂停。"}, {"start": 373.39, "end": 379.51, "text": "Thanks for listening. This was a market research summary only, not investment advice, and not a trade recommendation.", "zh": "谢谢收听。这只是市场研究总结，不是投资建议，也不是交易推荐。"}, {"start": 379.51, "end": 388.2, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "对于只有券商才能确认的事情，比如持仓、到期、行权或保证金，请查看你的券商App。我们下期简报再见。"}, {"start": 388.2, "end": 389.21, "text": "See you then.", "zh": "再见。"}]}];
let LINES=SECTIONS[0].lines;
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh'),audioSelect=document.getElementById('audioSelect'),secTitle=document.getElementById('secTitle');
let els=[];let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function buildLines(){box.innerHTML='';LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;const p=a.play();if(p&&p.catch)p.catch(()=>{playBtn.textContent='▶';});playBtn.textContent='⏸';};box.appendChild(d);});els=[...box.children];curIdx=-1;box.scrollTop=0;}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
function loadSection(idx){const s=SECTIONS[idx];a.pause();playBtn.textContent='▶';LINES=s.lines;secTitle.textContent=s.title;a.src=s.mp3;a.load();seek.value=0;cur.textContent='0:00';dur.textContent=s.dur;zhBox.textContent='';buildLines();}
audioSelect.onchange=()=>{loadSection(parseInt(audioSelect.value,10));};
buildLines();
playBtn.onclick=()=>{if(a.paused){const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';const p=a.play();if(p&&p.catch){p.catch(()=>{playBtn.textContent='▶';if(st)st.textContent='音频无法播放：请刷新页面，或换 Safari/Chrome 打开（不要用微信/WhatsApp 内嵌浏览器）。';});}playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};a.onplaying=()=>{const st=document.getElementById('status');if(st)st.textContent='';};a.onwaiting=()=>{const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';};a.onerror=()=>{playBtn.textContent='▶';const st=document.getElementById('status');if(st)st.textContent='音频加载失败：请刷新页面，或换 Safari/Chrome 打开。';};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
<script>
(function(){
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var KEY = 'lastAudio:' + location.pathname;
  function save(){ try { localStorage.setItem(KEY, sel.value); } catch (e) {} }
  sel.addEventListener('change', save);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', save);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved !== null && saved !== '' && saved !== sel.value) {
      var ok = false;
      for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === saved) { ok = true; break; } }
      if (ok) { sel.value = saved; sel.dispatchEvent(new Event('change')); }
    }
  } catch (e) {}
})();
</script>
