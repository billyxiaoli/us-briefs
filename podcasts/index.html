\u606f\u800c\u6295\u4e86\u53cd\u5bf9\u7968\u3002"}, {"start": 171.22, "end": 178.97, "text": "December hike odds are now priced near eighty three to eighty five percent. The story is hike risk, not rate cut expectations.", "zh": "12\u6708\u52a0\u606f\u6982\u7387\u73b0\u5df2\u5b9a\u4ef7\u572883%\u81f385%\u9644\u8fd1\u3002\u5f53\u524d\u7684\u6545\u4e8b\u662f\u52a0\u606f\u98ce\u9669\uff0c\u800c\u4e0d\u662f\u964d\u606f\u9884\u671f\u3002"}, {"start": 178.97, "end": 188.98, "text": "This morning's data dump was mixed. Third quarter G D P grew three point four percent annualized, beating expectations, driven by consumer spending and AI-related investment.", "zh": "\u4eca\u65e9\u7684\u6570\u636e\u559c\u5fe7\u53c2\u534a\uff1a\u4e09\u5b63\u5ea6 GDP \u5e74\u5316\u589e\u957f3.4%\uff0c\u8d85\u9884\u671f\uff0c\u7531\u6d88\u8d39\u652f\u51fa\u548c AI \u76f8\u5173\u6295\u8d44\u63a8\u52a8\u3002"}, {"start": 188.98, "end": 198.89, "text": "But September inflation stayed sticky. Headline P C E was three point six percent year over year, and core was three point one percent, both essentially in line with expectations.", "zh": "\u4f469\u6708\u901a\u80c0\u4f9d\u7136\u987d\u56fa\uff1aPCE \u603b\u4f53\u540c\u6bd43.6%\uff0c\u6838\u5fc3\u540c\u6bd43.1%\uff0c\u57fa\u672c\u7b26\u5408\u9884\u671f\u3002"}, {"start": 198.89, "end": 213.94, "text": "Energy is the wedge. Gasoline rose nine point two percent in the month, and thirty five point four percent year over year. Personal income rose only point two percent, and the saving rate fell to three point eight percent, the lowest since October twenty twenty two.", "zh": "\u80fd\u6e90\u662f\u5206\u5316\u70b9\uff1a\u6c7d\u6cb9\u5355\u6708\u6da89.2%\uff0c\u540c\u6bd4\u6da835.4%\u3002\u4e2a\u4eba\u6536\u5165\u4ec5\u589e0.2%\uff0c\u50a8\u84c4\u7387\u964d\u81f33.8%\uff0c\u4e3a2022\u5e7410\u6708\u4ee5\u6765\u6700\u4f4e\u3002"}, {"start": 213.94, "end": 223.7, "text": "Initial jobless claims were one hundred ninety four thousand, better than expected. Growth is not the problem; inflation is not cooling fast, and the consumer's buffer is thinning.", "zh": "\u521d\u8bf7\u5931\u4e1a\u91d1\u4eba\u6570\u4e3a19.4\u4e07\uff0c\u597d\u4e8e\u9884\u671f\u3002\u95ee\u9898\u4e0d\u5728\u589e\u957f\uff0c\u800c\u5728\u4e8e\u901a\u80c0\u964d\u6e29\u4e0d\u591f\u5feb\uff0c\u6d88\u8d39\u8005\u7684\u7f13\u51b2\u6b63\u5728\u53d8\u8584\u3002"}, {"start": 223.7, "end": 234.98, "text": "In Europe, the E C B held its deposit rate at two point five percent. The bigger story is succession: President Christine Lagarde announced she will leave on February seventh, twenty twenty seven.", "zh": "\u6b27\u6d32\u65b9\u9762\uff0c\u6b27\u6d32\u592e\u884c\u7ef4\u6301\u5b58\u6b3e\u5229\u73872.5%\u4e0d\u53d8\u3002\u66f4\u5927\u7684\u65b0\u95fb\u662f\u4eba\u4e8b\uff1a\u884c\u957f\u62c9\u52a0\u5fb7\u5ba3\u5e03\u5c06\u4e8e2027\u5e742\u67087\u65e5\u79bb\u4efb\u3002"}, {"start": 234.98, "end": 246.98, "text": "The ten year Treasury is near five percent, straddling it through the morning, and the dollar is near one hundred two point two. Gold is around four thousand to four thousand sixty seven dollars, giving back part of its recent run.", "zh": "10\u5e74\u671f\u7f8e\u503a\u6536\u76ca\u7387\u57285%\u9644\u8fd1\u5f98\u5f8a\uff0c\u7f8e\u5143\u7ea6102.2\uff0c\u9ec4\u91d1\u57284027\u81f34067\u7f8e\u5143\u4e4b\u95f4\uff0c\u56de\u5410\u4e86\u90e8\u5206\u8fd1\u671f\u6da8\u5e45\u3002"}, {"start": 246.98, "end": 260.71, "text": "Oil is still above one hundred dollars. The premium is Middle East supply risk: Houthi attacks on Saudi energy infrastructure continue, though Saudi defenses intercepted a missile aimed at the Eastern Province early Thursday, with no damage reported.", "zh": "\u6cb9\u4ef7\u4ecd\u9ad8\u4e8e100\u7f8e\u5143\uff0c\u6ea2\u4ef7\u6765\u81ea\u4e2d\u4e1c\u4f9b\u5e94\u98ce\u9669\uff1a\u80e1\u585e\u6b66\u88c5\u5bf9\u6c99\u7279\u80fd\u6e90\u8bbe\u65bd\u7684\u88ad\u51fb\u4ecd\u5728\u7ee7\u7eed\uff0c\u4e0d\u8fc7\u6c99\u7279\u9632\u7a7a\u7cfb\u7edf\u5468\u56db\u6e05\u6668\u62e6\u622a\u4e86\u4e00\u679a\u5c04\u5411\u4e1c\u90e8\u7701\u7684\u5bfc\u5f39\uff0c\u672a\u9020\u6210\u635f\u5931\u3002"}, {"start": 260.71, "end": 275.88, "text": "One quiet divergence is worth noting. Treasury volatility is near one hundred four, its highest since March, while equity volatility sits near yearly lows. The rates market, not the stock market, is carrying the inflation worry.", "zh": "\u4e00\u4e2a\u5b89\u9759\u7684\u5206\u5316\u503c\u5f97\u6ce8\u610f\uff1a\u7f8e\u503a\u6ce2\u52a8\u7387\u7ea6104\uff0c\u4e3a3\u6708\u4ee5\u6765\u6700\u9ad8\uff0c\u800c\u80a1\u5e02\u6ce2\u52a8\u7387\u5374\u63a5\u8fd1\u5e74\u5185\u4f4e\u70b9\u3002\u627f\u62c5\u901a\u80c0\u62c5\u5fe7\u7684\u662f\u5229\u7387\u5e02\u573a\uff0c\u800c\u4e0d\u662f\u80a1\u5e02\u3002"}, {"start": 275.88, "end": 283.08, "text": "Now Korea. The KOSPI closed down one point two four percent, giving back six thousand just one day after reclaiming it.", "zh": "\u518d\u770b\u97e9\u56fd\uff1aKOSPI \u6536\u8dcc1.24%\uff0c\u5728\u91cd\u65b0\u7ad9\u4e0a6000\u70b9\u4ec5\u4e00\u5929\u540e\u53c8\u5931\u5b88\u4e86\u3002"}, {"start": 283.08, "end": 295.13, "text": "Samsung's detailed results disappointed: net profit missed consensus, and shareholder return details were deferred to a board meeting in late January twenty twenty seven. Samsung fell four to six percent in Seoul.", "zh": "\u4e09\u661f\u7684\u8be6\u7ec6\u8d22\u62a5\u4ee4\u4eba\u5931\u671b\uff1a\u51c0\u5229\u6da6\u4e0d\u53ca\u9884\u671f\uff0c\u80a1\u4e1c\u56de\u62a5\u7ec6\u8282\u63a8\u8fdf\u52302027\u5e741\u6708\u5e95\u7684\u8463\u4e8b\u4f1a\u3002\u4e09\u661f\u5728\u9996\u5c14\u8dcc4%\u81f36%\u3002"}, {"start": 295.13, "end": 303.0, "text": "SK Hynix was the exception, up two point six two percent in Seoul on its record quarter and a buyback of about twenty trillion won.", "zh": "SK\u6d77\u529b\u58eb\u662f\u4f8b\u5916\uff0c\u51ed\u501f\u521b\u7eaa\u5f55\u7684\u5b63\u5ea6\u4e1a\u7ee9\u548c\u7ea620\u4e07\u4ebf\u97e9\u5143\u7684\u56de\u8d2d\uff0c\u5728\u9996\u5c14\u6da82.62%\u3002"}, {"start": 303.0, "end": 313.97, "text": "For the watchlist, that means KORU is down seven point two two percent intraday, to about twelve dollars seventy nine cents, one day after a sixteen point one nine percent Wednesday close.", "zh": "\u5bf9\u81ea\u9009\u80a1\u800c\u8a00\uff0c\u8fd9\u610f\u5473\u7740 KORU \u76d8\u4e2d\u8dcc7.22%\uff0c\u7ea612.79\u7f8e\u5143\uff0c\u800c\u5468\u4e09\u6536\u76d8\u65f6\u5b83\u521a\u6da8\u4e8616.19%\u3002"}, {"start": 313.97, "end": 325.25, "text": "That two-way gap regime is exactly what the strategy playbook prices. KORU's annualized volatility is about one hundred ninety three percent, and sixty three percent of days move more than five percent.", "zh": "\u8fd9\u79cd\u53cc\u5411\u8df3\u7a7a\u6b63\u662f\u7b56\u7565\u624b\u518c\u6240\u5b9a\u4ef7\u7684 regime\uff1aKORU \u5e74\u5316\u6ce2\u52a8\u7387\u7ea6193%\uff0c63%\u7684\u4ea4\u6613\u65e5\u6ce2\u52a8\u8d85\u8fc75%\u3002"}, {"start": 325.25, "end": 336.0, "text": "Memory in the U.S. faded with Samsung. Micron is down three point two seven percent, and SanDisk is down two point seven one percent, ahead of its earnings after the close tonight.", "zh": "\u7f8e\u56fd\u5b58\u50a8\u80a1\u4e5f\u968f\u4e09\u661f\u56de\u843d\uff1a\u7f8e\u5149\u8dcc3.27%\uff0c\u95ea\u8fea\u8dcc2.71%\uff0c\u800c\u95ea\u8fea\u4eca\u665a\u6536\u76d8\u540e\u5c31\u8981\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 336.0, "end": 348.79, "text": "Nvidia is down point seven eight percent and A M D down one point one two percent, with no company news for either today. The chip tape is weak, and software de-rated too, with some names down twenty percent or more pre-market.", "zh": "\u82f1\u4f1f\u8fbe\u8dcc0.78%\uff0cAMD \u8dcc1.12%\uff0c\u4e24\u5bb6\u4eca\u5929\u90fd\u6ca1\u6709\u516c\u53f8\u6d88\u606f\u3002\u82af\u7247\u677f\u5757\u6574\u4f53\u75b2\u8f6f\uff0c\u8f6f\u4ef6\u80a1\u4e5f\u906d\u5230\u91cd\u4f30\uff0c\u4e2a\u522b\u540d\u5b57\u76d8\u524d\u8dcc20%\u4ee5\u4e0a\u3002"}, {"start": 348.79, "end": 361.08, "text": "The three times tech funds show the same tape. SOXL is down three point three eight percent, TECL down three point five percent, and T Q Q Q down three point nine two percent.", "zh": "\u4e09\u500d\u79d1\u6280 ETF \u8d70\u52bf\u4e00\u81f4\uff1aSOXL \u8dcc3.38%\uff0cTECL \u8dcc3.50%\uff0cTQQQ \u8dcc3.92%\u3002"}, {"start": 361.08, "end": 371.69, "text": "Biotech is the other side of the rotation. LABU is up three point three eight percent, and Moderna is up two point eight eight percent, after full trial data confirmed August's positive results.", "zh": "\u751f\u7269\u79d1\u6280\u662f\u8f6e\u52a8\u7684\u53e6\u4e00\u9762\uff1aLABU \u6da83.38%\uff0cModerna \u6da82.88%\uff0c\u6b64\u524d\u5b8c\u6574\u8bd5\u9a8c\u6570\u636e\u8bc1\u5b9e\u4e868\u6708\u7684\u79ef\u6781\u7ed3\u679c\u3002"}, {"start": 371.69, "end": 383.86, "text": "Volatility itself faded after the open. UVXY is down two point five seven percent, even with Alphabet down eleven and a half percent. The selloff is being treated as stock-specific, not systemic.", "zh": "\u6ce2\u52a8\u7387\u672c\u8eab\u5728\u5f00\u76d8\u540e\u56de\u843d\uff1aUVXY \u8dcc2.57%\uff0c\u5c3d\u7ba1 Alphabet \u8dcc\u4e8611.5%\u3002\u5e02\u573a\u628a\u8fd9\u6b21\u629b\u552e\u770b\u4f5c\u4e2a\u80a1\u95ee\u9898\uff0c\u800c\u975e\u7cfb\u7edf\u6027\u95ee\u9898\u3002"}, {"start": 383.86, "end": 393.58, "text": "Gold miners fell with gold. G D X is down two point six six percent. Strategy is down one point one eight percent, with Bitcoin soft, ahead of its earnings tonight.", "zh": "\u91d1\u77ff\u80a1\u968f\u9ec4\u91d1\u4e0b\u8dcc\uff1aGDX \u8dcc2.66%\u3002Strategy \u8dcc1.18%\uff0c\u6bd4\u7279\u5e01\u75b2\u8f6f\uff0c\u800c\u5b83\u4eca\u665a\u4e5f\u8981\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 393.58, "end": 403.97, "text": "Palantir is down one point two seven percent with no company news, just valuation commentary. Bloom Energy is down point six six percent, drifting with the AI power tape.", "zh": "Palantir \u8dcc1.27%\uff0c\u6ca1\u6709\u516c\u53f8\u6d88\u606f\uff0c\u53ea\u6709\u4f30\u503c\u65b9\u9762\u7684\u8bc4\u8bba\u3002Bloom Energy \u8dcc0.66%\uff0c\u968f AI \u7535\u529b\u677f\u5757\u6f02\u79fb\u3002"}, {"start": 403.97, "end": 411.48, "text": "AppLovin is down point eight eight percent, a mild tech tape drag, with its lawsuit overhang and November fourth earnings unchanged.", "zh": "AppLovin \u8dcc0.88%\uff0c\u53d7\u79d1\u6280\u677f\u5757\u62d6\u7d2f\uff0c\u8bc9\u8bbc\u9634\u5f71\u548c11\u67084\u65e5\u7684\u8d22\u62a5\u672a\u53d8\u3002"}, {"start": 411.48, "end": 422.33, "text": "Space Exploration, the watchlist's space name, is down point five eight percent on no specific news. Its ticker identity is ambiguous across data vendors, so we use the watchlist label.", "zh": "\u81ea\u9009\u80a1\u4e2d\u7684\u822a\u5929\u540d\u5b57 Space Exploration \u8dcc0.58%\uff0c\u6ca1\u6709\u5177\u4f53\u6d88\u606f\u3002\u8be5\u4ee3\u7801\u5728\u4e0d\u540c\u6570\u636e\u5546\u5904\u7684\u8eab\u4efd\u5e76\u4e0d\u4e00\u81f4\uff0c\u6211\u4eec\u6cbf\u7528\u81ea\u9009\u80a1\u6807\u7b7e\u3002"}, {"start": 422.33, "end": 434.52, "text": "Now the strategy update, and this is analysis only, not a trade order. Spreads only, never naked short puts or calls, fourteen to thirty days to expiry, and exit at fifty to seventy percent of credit.", "zh": "\u63a5\u4e0b\u6765\u662f\u7b56\u7565\u66f4\u65b0\uff0c\u8fd9\u53ea\u662f\u5206\u6790\uff0c\u4e0d\u662f\u4e0b\u5355\u5efa\u8bae\uff1a\u53ea\u505a\u4ef7\u5dee\uff0c\u7edd\u4e0d\u88f8\u5356\u770b\u8dcc\u6216\u770b\u6da8\u671f\u6743\uff0c\u5269\u4f5914\u81f330\u5929\uff0c\u5728\u8d5a\u523050%\u81f370%\u6743\u5229\u91d1\u65f6\u79bb\u573a\u3002"}, {"start": 434.52, "end": 448.97, "text": "The options market still prices tonight's binaries in full: SanDisk plus or minus eight point zero nine percent, Amazon seven point nine six percent, Intel nine point one six percent, and Strategy six point three six percent.", "zh": "\u671f\u6743\u5e02\u573a\u4ecd\u5728\u4e3a\u4eca\u665a\u7684\u8d22\u62a5\u5145\u5206\u5b9a\u4ef7\uff1a\u95ea\u8fea\u6b63\u8d1f8.09%\uff0c\u4e9a\u9a6c\u900a7.96%\uff0c\u82f1\u7279\u5c149.16%\uff0cStrategy 6.36%\u3002"}, {"start": 448.97, "end": 459.72, "text": "Selling premium at midday means collecting pre-print volatility for a post-print gap. The cleaner premium is usually the post-print volatility crush, not this morning's Alphabet-led slide.", "zh": "\u5728\u5348\u76d8\u5356\u51fa\u6743\u5229\u91d1\uff0c\u7b49\u4e8e\u7528\u8d22\u62a5\u524d\u7684\u6ce2\u52a8\u7387\u53bb\u6362\u8d22\u62a5\u540e\u7684\u8df3\u7a7a\u3002\u66f4\u5e72\u51c0\u7684\u6743\u5229\u91d1\u901a\u5e38\u6765\u81ea\u8d22\u62a5\u540e\u7684\u6ce2\u52a8\u7387\u5d29\u584c\uff0c\u800c\u4e0d\u662f\u4eca\u65e9 Alphabet \u5e26\u9886\u7684\u4e0b\u8dcc\u3002"}, {"start": 459.72, "end": 474.79, "text": "For KORU, the default stays a bear call spread: ten to fifteen delta, far out of the money, three to five dollar wing width. Sell the rip, do not chase the gap, and never run cash-secured puts or a wheel on a decaying three times fund.", "zh": "\u5bf9 KORU\uff0c\u9ed8\u8ba4\u4ecd\u662f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff1a10\u81f315 delta\u3001\u6df1\u5ea6\u865a\u503c\u30013\u81f35\u7f8e\u5143\u7ffc\u5bbd\u3002\u5356\u53cd\u5f39\uff0c\u4e0d\u8981\u8ffd\u8df3\u7a7a\uff0c\u7edd\u4e0d\u8981\u5bf9\u4e00\u53ea\u6301\u7eed\u8870\u51cf\u7684\u4e09\u500d\u57fa\u91d1\u505a\u73b0\u91d1\u62c5\u4fdd\u770b\u8dcc\u6216 wheel \u7b56\u7565\u3002"}, {"start": 474.79, "end": 488.47, "text": "For LABU, the calmer three times fund, the framework is unchanged: fifteen to twenty delta strikes, slightly narrower wings than KORU, same fourteen to thirty day window. There is no new reason to add size before tonight's prints.", "zh": "\u5bf9 LABU \u8fd9\u53ea\u66f4\u6e29\u548c\u7684\u4e09\u500d\u57fa\u91d1\uff0c\u6846\u67b6\u4e0d\u53d8\uff1a15\u81f320 delta \u884c\u6743\u4ef7\uff0c\u7ffc\u5bbd\u7565\u5c0f\u4e8e KORU\uff0c\u540c\u6837\u662f14\u81f330\u5929\u7a97\u53e3\u3002\u4eca\u665a\u8d22\u62a5\u524d\u6ca1\u6709\u65b0\u589e\u7406\u7531\u52a0\u4ed3\u3002"}, {"start": 488.47, "end": 504.91, "text": "For SOXL, TECL, and T Q Q Q, use LABU-level parameters, with direction set by each underlying's trend. If selling into tonight's wall, keep strikes far, wings wide enough to survive a one-day gap, and size small.", "zh": "\u5bf9 SOXL\u3001TECL \u548c TQQQ\uff0c\u91c7\u7528 LABU \u7ea7\u522b\u7684\u53c2\u6570\uff0c\u65b9\u5411\u770b\u5404\u81ea\u6807\u7684\u7684\u8d8b\u52bf\u3002\u5982\u679c\u8981\u5728\u4eca\u665a\u8d22\u62a5\u5899\u4e4b\u524d\u5356\u51fa\uff0c\u884c\u6743\u4ef7\u8981\u8fdc\uff0c\u7ffc\u5bbd\u8981\u80fd\u627f\u53d7\u4e00\u65e5\u8df3\u7a7a\uff0c\u4ed3\u4f4d\u8981\u5c0f\u3002"}, {"start": 504.91, "end": 516.12, "text": "For UVXY, only short-dated bear call spreads, or avoid it entirely. Today's fade is the expected decay path, not a new edge, and tonight's prints can invert the fade fast.", "zh": "\u5bf9 UVXY\uff0c\u53ea\u505a\u77ed\u671f\u9650\u7684\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u6216\u8005\u5e72\u8106\u56de\u907f\u3002\u4eca\u5929\u7684\u56de\u843d\u662f\u9884\u671f\u7684\u8870\u51cf\u8def\u5f84\uff0c\u4e0d\u662f\u65b0\u7684\u4f18\u52bf\uff0c\u4eca\u665a\u7684\u8d22\u62a5\u53ef\u4ee5\u8fc5\u901f\u9006\u8f6c\u5b83\u3002"}, {"start": 516.12, "end": 527.4, "text": "Tonight after the close: Amazon, Intel, SanDisk, and Strategy, plus Coinbase, Gilead, Starbucks, and Rivian. Amazon's A W S growth and capital spending guide are the ones to watch.", "zh": "\u4eca\u665a\u6536\u76d8\u540e\uff1a\u4e9a\u9a6c\u900a\u3001\u82f1\u7279\u5c14\u3001\u95ea\u8fea\u548c Strategy\uff0c\u4ee5\u53ca Coinbase\u3001\u5409\u5229\u5fb7\u3001\u661f\u5df4\u514b\u548c Rivian\u3002\u5176\u4e2d\u4e9a\u9a6c\u900a\u7684 AWS \u589e\u901f\u548c\u8d44\u672c\u652f\u51fa\u6307\u5f15\u6700\u503c\u5f97\u5173\u6ce8\u3002"}, {"start": 527.4, "end": 538.73, "text": "Friday brings the Bank of Japan decision overnight, the Employment Cost Index at eight thirty Eastern, and Chicago P M I at nine forty five, plus Exxon, Chevron, and AbbVie before the open.", "zh": "\u5468\u4e94\u6709\u65e5\u672c\u592e\u884c\u9694\u591c\u51b3\u8bae\u3001\u7f8e\u4e1c8\u70b9\u534a\u7684\u5c31\u4e1a\u6210\u672c\u6307\u6570\u30019\u70b945\u5206\u7684\u829d\u52a0\u54e5 PMI\uff0c\u4ee5\u53ca\u5f00\u76d8\u524d\u57c3\u514b\u68ee\u7f8e\u5b5a\u3001\u96ea\u4f5b\u9f99\u548c\u827e\u4f2f\u7ef4\u7684\u8d22\u62a5\u3002"}, {"start": 538.73, "end": 548.98, "text": "Risk checkpoints into the close: watch whether the S P Y holds seven hundred sixty six, its fifty-day average, and whether the Q Q Q reclaims its seven hundred twenty four pivot.", "zh": "\u6536\u76d8\u524d\u7684\u98ce\u9669\u68c0\u67e5\u70b9\uff1a\u770b SPY \u80fd\u5426\u5b88\u4f4f766\uff0850\u65e5\u5747\u7ebf\uff09\uff0c\u4ee5\u53ca QQQ \u80fd\u5426\u6536\u590d724\u7684\u67a2\u8f74\u4f4d\u3002"}, {"start": 548.98, "end": 558.89, "text": "Watch the ten year at five percent: a sustained break above five point zero four pressures growth and gold further, while a fall back below five percent eases the tape.", "zh": "\u770b10\u5e74\u671f\u6536\u76ca\u7387\u57285%\u7684\u4f4d\u7f6e\uff1a\u6301\u7eed\u7a81\u78345.04%\u4f1a\u8fdb\u4e00\u6b65\u538b\u5236\u6210\u957f\u80a1\u548c\u9ec4\u91d1\uff0c\u800c\u56de\u843d\u52305%\u4ee5\u4e0b\u5219\u4f1a\u7f13\u89e3\u76d8\u9762\u538b\u529b\u3002"}, {"start": 558.89, "end": 570.36, "text": "Watch memory into SanDisk tonight: Micron's nine hundred forty to one thousand ten dollar base range is the line, and SanDisk's print decides whether eight hundred eighty or one thousand one hundred opens.", "zh": "\u770b\u5b58\u50a8\u677f\u5757\u5728\u95ea\u8fea\u8d22\u62a5\u524d\u7684\u8868\u73b0\uff1a\u7f8e\u5149940\u81f31010\u7f8e\u5143\u7684\u57fa\u7840\u533a\u95f4\u5c31\u662f\u754c\u7ebf\uff0c\u95ea\u8fea\u7684\u8d22\u62a5\u5c06\u51b3\u5b9a880\u7f8e\u5143\u8fd8\u662f1100\u7f8e\u5143\u5148\u51fa\u73b0\u3002"}, {"start": 570.36, "end": 579.29, "text": "And watch whether the Alphabet selloff stays contained. If it broadens into the close, the rotation story breaks, and tonight's prints gap the tape either way.", "zh": "\u8fd8\u8981\u770b Alphabet \u7684\u629b\u552e\u662f\u5426\u4fdd\u6301\u53ef\u63a7\u3002\u5982\u679c\u5b83\u5728\u6536\u76d8\u524d\u6269\u6563\uff0c\u8f6e\u52a8\u6545\u4e8b\u5c31\u4f1a\u7834\u88c2\uff0c\u800c\u4eca\u665a\u7684\u8d22\u62a5\u65e0\u8bba\u5982\u4f55\u90fd\u4f1a\u8ba9\u76d8\u9762\u8df3\u7a7a\u3002"}, {"start": 579.29, "end": 593.52, "text": "Two data notes, flagged rather than smoothed. The V I X flipped direction after the open, from up pre-market to down by mid-morning, and Alphabet's revenue basis differs across vendors: we use one hundred twenty seven point six billion dollars.", "zh": "\u4e24\u4e2a\u6570\u636e\u8bf4\u660e\uff0c\u4e0d\u505a\u5e73\u6ed1\u5904\u7406\uff1aVIX \u5728\u5f00\u76d8\u540e\u6539\u53d8\u4e86\u65b9\u5411\uff0c\u4ece\u76d8\u524d\u4e0a\u6da8\u8f6c\u4e3a\u4e0a\u5348\u4e2d\u6bb5\u4e0b\u8dcc\uff1bAlphabet \u7684\u8425\u6536\u53e3\u5f84\u5728\u4e0d\u540c\u6570\u636e\u5546\u5904\u4e0d\u4e00\u81f4\uff0c\u6211\u4eec\u91c7\u75281276\u4ebf\u7f8e\u5143\u3002"}, {"start": 593.52, "end": 602.28, "text": "Apple's earnings date is also unverified: one calendar lists Monday, November second, another lists it with tonight's prints. We do not assert either.", "zh": "\u82f9\u679c\u7684\u8d22\u62a5\u65e5\u671f\u4e5f\u672a\u6838\u5b9e\uff1a\u4e00\u4e2a\u65e5\u5386\u5217\u4e3a11\u67082\u65e5\u5468\u4e00\uff0c\u53e6\u4e00\u4e2a\u5217\u5728\u4eca\u665a\u7684\u8d22\u62a5\u540d\u5355\u91cc\u3002\u6211\u4eec\u4e0d\u786e\u8ba4\u4efb\u4f55\u4e00\u4e2a\u3002"}, {"start": 602.28, "end": 613.32, "text": "This brief is market research only, not investment advice, and not a trade recommendation. Leveraged funds reset daily and decay over holding periods; they are not buy-and-hold instruments.", "zh": "\u672c\u7b80\u62a5\u4ec5\u4e3a\u5e02\u573a\u7814\u7a76\uff0c\u4e0d\u662f\u6295\u8d44\u5efa\u8bae\uff0c\u4e5f\u4e0d\u662f\u4ea4\u6613\u63a8\u8350\u3002\u6760\u6746\u57fa\u91d1\u6bcf\u65e5\u91cd\u7f6e\u3001\u957f\u671f\u6301\u6709\u4f1a\u8870\u51cf\uff0c\u4e0d\u662f\u4e70\u5165\u6301\u6709\u578b\u5de5\u5177\u3002"}, {"start": 613.32, "end": 622.08, "text": "For anything only a broker can confirm, like positions, expiry, assignment, or margin, check your broker app. We will be back with the next brief.", "zh": "\u5bf9\u4e8e\u53ea\u6709\u5238\u5546\u624d\u80fd\u786e\u8ba4\u7684\u4e8b\u60c5\uff0c\u6bd4\u5982\u6301\u4ed3\u3001\u5230\u671f\u3001\u884c\u6743\u6216\u4fdd\u8bc1\u91d1\uff0c\u8bf7\u67e5\u770b\u4f60\u7684\u5238\u5546App\u3002\u6211\u4eec\u4e0b\u671f\u7b80\u62a5\u518d\u89c1\u3002"}, {"start": 622.08, "end": 622.92, "text": "See you then.", "zh": "\u518d\u89c1\u3002"}]},{"slug": "2026-10-29-pre-market", "title": "U.S. Stocks Pre-Market Brief \u2014 October 29, 2026", "mp3": "2026-10-29-pre-market/2026-10-29-pre-market.mp3", "dur": "9:40", "lines": [{"start": 0.0, "end": 6.07, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Thursday, October 29, 2026. I'm Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u524d\u7b80\u62a5\uff0c2026\u5e7410\u670829\u65e5\u661f\u671f\u56db\u3002\u6211\u662f Alex\u3002"}, {"start": 6.07, "end": 14.42, "text": "And I'm Jordan. This is pure market research, recorded before the open. No account data, no trading orders, just what is happening and what to watch.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u7eaf\u5e02\u573a\u7814\u7a76\uff0c\u5f00\u76d8\u524d\u5f55\u5236\u3002\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u6ca1\u6709\u4ea4\u6613\u6307\u4ee4\uff0c\u53ea\u6709\u53d1\u751f\u4e86\u4ec0\u4e48\u548c\u8981\u5173\u6ce8\u4ec0\u4e48\u3002"}, {"start": 14.42, "end": 19.87, "text": "Here is the headline. Thursday is the morning after the exam, and the market is grading harshly.", "zh": "\u5148\u8bf4\u5934\u6761\u3002\u5468\u56db\u662f\u8003\u8bd5\u540e\u7684\u7b2c\u4e00\u4e2a\u65e9\u6668\uff0c\u800c\u5e02\u573a\u7684\u6253\u5206\u975e\u5e38\u4e25\u5389\u3002"}, {"start": 19.87, "end": 24.72, "text": "Wednesday closed higher, but Thursday opens split. How split, exactly?", "zh": "\u5468\u4e09\u6536\u6da8\uff0c\u4f46\u5468\u56db\u5f00\u76d8\u6da8\u8dcc\u5206\u5316\u3002\u5177\u4f53\u6709\u591a\u5206\u5316\uff1f"}, {"start": 24.72, "end": 35.71, "text": "The S and P 500 rose zero point two eight percent Wednesday to seven thousand seven hundred forty-three, and the Nasdaq rose zero point two seven percent to twenty-six thousand five hundred forty-nine.", "zh": "\u6807\u666e500\u5468\u4e09\u4e0a\u6da80.28%\uff0c\u6536\u4e8e7743\u70b9\uff1b\u7eb3\u65af\u8fbe\u514b\u4e0a\u6da80.27%\uff0c\u6536\u4e8e26549\u70b9\u3002"}, {"start": 35.71, "end": 46.08, "text": "And Thursday pre-market, Nasdaq futures are down about one percent, S and P futures down about zero point three percent, but Dow futures are up about zero point four percent.", "zh": "\u800c\u5468\u56db\u76d8\u524d\uff0c\u7eb3\u6307\u671f\u8d27\u8dcc\u7ea61%\uff0c\u6807\u666e\u671f\u8d27\u8dcc\u7ea60.3%\uff0c\u4f46\u9053\u6307\u671f\u8d27\u6da8\u7ea60.4%\u3002"}, {"start": 46.08, "end": 52.99, "text": "The driver is the overnight earnings split. Alphabet is down about ten percent pre-market, while Microsoft is up about three percent.", "zh": "\u63a8\u52a8\u529b\u662f\u9694\u591c\u8d22\u62a5\u7684\u5206\u5316\u3002Alphabet\u76d8\u524d\u8dcc\u7ea610%\uff0c\u800c\u5fae\u8f6f\u6da8\u7ea63%\u3002"}, {"start": 52.99, "end": 59.59, "text": "This is a stock specific tech selloff, not a broad risk off day. Small caps are actually firmer pre-market.", "zh": "\u8fd9\u662f\u4e00\u573a\u9488\u5bf9\u4e2a\u80a1\u7684\u79d1\u6280\u80a1\u629b\u552e\uff0c\u4e0d\u662f\u5168\u9762\u7684\u907f\u9669\u884c\u60c5\u3002\u5c0f\u76d8\u80a1\u76d8\u524d\u53cd\u800c\u66f4\u7a33\u3002"}, {"start": 59.59, "end": 64.22, "text": "Start with the company that failed the market's new test: Alphabet. What did it report?", "zh": "\u5148\u8bf4\u6ca1\u901a\u8fc7\u5e02\u573a\u65b0\u8003\u9a8c\u7684\u516c\u53f8\uff1aAlphabet\u3002\u5b83\u516c\u5e03\u4e86\u4ec0\u4e48\uff1f"}, {"start": 64.22, "end": 75.55, "text": "Revenue of one hundred twenty-seven point six billion dollars, up twenty-five percent, but just below expectations. Earnings per share of two dollars twelve cents, versus about three dollars expected.", "zh": "\u8425\u65361276\u4ebf\u7f8e\u5143\uff0c\u589e\u957f25%\uff0c\u4f46\u7565\u4f4e\u4e8e\u9884\u671f\u3002\u6bcf\u80a1\u6536\u76ca2.12\u7f8e\u5143\uff0c\u8fdc\u4f4e\u4e8e\u7ea63.02\u7f8e\u5143\u7684\u9884\u671f\u3002"}, {"start": 75.55, "end": 83.06, "text": "Google Cloud more than doubled, up one hundred three percent to thirty point seven billion dollars. So why did the stock fall?", "zh": "\u8c37\u6b4c\u4e91\u6536\u5165\u7ffb\u4e86\u4e00\u500d\u591a\uff0c\u589e\u957f103%\u81f3307\u4ebf\u7f8e\u5143\u3002\u90a3\u80a1\u4ef7\u4e3a\u4ec0\u4e48\u8dcc\uff1f"}, {"start": 83.06, "end": 93.07, "text": "Because search advertising grew only twelve percent, down from seventeen percent, and free cash flow was negative nine point one billion dollars, a second straight negative quarter.", "zh": "\u56e0\u4e3a\u641c\u7d22\u5e7f\u544a\u4ec5\u589e\u957f12%\uff0c\u4f4e\u4e8e\u4e0a\u5b63\u5ea6\u768417%\uff0c\u800c\u81ea\u7531\u73b0\u91d1\u6d41\u4e3a\u8d1f91\u4ebf\u7f8e\u5143\uff0c\u5df2\u662f\u8fde\u7eed\u7b2c\u4e8c\u4e2a\u5b63\u5ea6\u4e3a\u8d1f\u3002"}, {"start": 93.07, "end": 104.54, "text": "Capital spending hit fifty-one point four billion dollars in the quarter, and management said 2027 spending will increase significantly. The market read that as search monetization lagging the AI bill.", "zh": "\u5f53\u5b63\u8d44\u672c\u5f00\u652f\u8fbe514\u4ebf\u7f8e\u5143\uff0c\u7ba1\u7406\u5c42\u8fd8\u8868\u793a2027\u5e74\u5f00\u652f\u5c06\u663e\u8457\u589e\u52a0\u3002\u5e02\u573a\u5c06\u5176\u89e3\u8bfb\u4e3a\u641c\u7d22\u53d8\u73b0\u8ddf\u4e0d\u4e0aAI\u8d26\u5355\u3002"}, {"start": 104.54, "end": 115.34, "text": "Now the company that passed: Microsoft. Revenue of ninety-two point three billion dollars, up nineteen percent, and earnings of four dollars eighty-nine cents, beating expectations.", "zh": "\u518d\u8bf4\u901a\u8fc7\u8003\u9a8c\u7684\u516c\u53f8\uff1a\u5fae\u8f6f\u3002\u8425\u6536923\u4ebf\u7f8e\u5143\uff0c\u589e\u957f19%\uff0c\u6bcf\u80a1\u6536\u76ca4.89\u7f8e\u5143\uff0c\u8d85\u9884\u671f\u3002"}, {"start": 115.34, "end": 125.54, "text": "Azure grew forty-eight percent to thirty-three point two billion dollars, and free cash flow was eighteen point six billion dollars, roughly ten billion above expectations.", "zh": "Azure\u589e\u957f48%\u81f3332\u4ebf\u7f8e\u5143\uff0c\u81ea\u7531\u73b0\u91d1\u6d41186\u4ebf\u7f8e\u5143\uff0c\u6bd4\u9884\u671f\u9ad8\u51fa\u7ea6100\u4ebf\u7f8e\u5143\u3002"}, {"start": 125.54, "end": 137.98, "text": "Microsoft also guided next quarter revenue of ninety-six to ninety-seven billion dollars, and Azure growth of forty-nine to fifty percent. Spending is not disqualifying, but the cash has to keep flowing.", "zh": "\u5fae\u8f6f\u8fd8\u6307\u5f15\u4e0b\u5b63\u5ea6\u8425\u6536960\u81f3971\u4ebf\u7f8e\u5143\uff0cAzure\u589e\u957f49%\u81f350%\u3002\u5f00\u652f\u672c\u8eab\u4e0d\u662f\u95ee\u9898\uff0c\u4f46\u73b0\u91d1\u5fc5\u987b\u6301\u7eed\u6d41\u5165\u3002"}, {"start": 137.98, "end": 146.57, "text": "Next, the Fed. It held rates at three point seven five to four percent, in a ten to two vote, with two officials dissenting in favor of an immediate hike.", "zh": "\u63a5\u4e0b\u6765\u662f\u7f8e\u8054\u50a8\u3002\u5b83\u7ef4\u6301\u5229\u7387\u57283.75%\u81f34%\uff0c\u4ee510\u6bd42\u6295\u7968\u901a\u8fc7\uff0c\u4e24\u4f4d\u5b98\u5458\u4e3b\u5f20\u7acb\u5373\u52a0\u606f\u800c\u6295\u4e86\u53cd\u5bf9\u7968\u3002"}, {"start": 146.57, "end": 156.1, "text": "December hike odds are now priced near eighty-three to eighty-five percent. So do not frame this as rate cut expectations. The story is hike risk, not cuts.", "zh": "12\u6708\u52a0\u606f\u6982\u7387\u73b0\u5df2\u5b9a\u4ef7\u7ea683%\u81f385%\u3002\u6240\u4ee5\u4e0d\u8981\u628a\u5b83\u8bf4\u6210\u964d\u606f\u9884\u671f\u3002\u5f53\u524d\u7684\u6545\u4e8b\u662f\u52a0\u606f\u98ce\u9669\uff0c\u800c\u4e0d\u662f\u964d\u606f\u3002"}, {"start": 156.1, "end": 163.25, "text": "The ten year Treasury is near five percent, the dollar is near a two week high, and gold slipped to around four thousand thirty dollars.", "zh": "10\u5e74\u671f\u7f8e\u503a\u6536\u76ca\u7387\u63a5\u8fd15%\uff0c\u7f8e\u5143\u5904\u4e8e\u4e24\u5468\u9ad8\u4f4d\u9644\u8fd1\uff0c\u9ec4\u91d1\u56de\u843d\u81f3\u7ea64030\u7f8e\u5143\u3002"}, {"start": 163.25, "end": 172.44, "text": "Oil eased about one percent to around one hundred one dollars, on reports of revived diplomacy with Iran. We mark that as reported, not confirmed.", "zh": "\u539f\u6cb9\u56e0\u4e0e\u4f0a\u6717\u6062\u590d\u5916\u4ea4\u7684\u62a5\u9053\u4e0b\u8dcc\u7ea61%\uff0c\u81f3\u7ea6101\u7f8e\u5143\u3002\u6211\u4eec\u5c06\u5176\u6807\u6ce8\u4e3a\u62a5\u9053\uff0c\u672a\u7ecf\u8bc1\u5b9e\u3002"}, {"start": 172.44, "end": 182.45, "text": "Now Asia, where yesterday's euphoria reversed. The Nikkei rose about one percent, but the KOSPI fell one point two four percent to five thousand nine hundred thirty-seven.", "zh": "\u518d\u770b\u4e9a\u6d32\uff0c\u6628\u5929\u7684\u72c2\u70ed\u4eca\u5929\u9006\u8f6c\u3002\u65e5\u7ecf\u6da8\u7ea61%\uff0c\u4f46\u97e9\u56fdKOSPI\u8dcc1.24%\uff0c\u6536\u4e8e5937\u70b9\u3002"}, {"start": 182.45, "end": 187.06, "text": "The KOSPI surrendered six thousand after just one day. What happened in Seoul?", "zh": "KOSPI\u4ec5\u4e00\u5929\u5c31\u5931\u5b886000\u70b9\u3002\u9996\u5c14\u53d1\u751f\u4e86\u4ec0\u4e48\uff1f"}, {"start": 187.06, "end": 196.7, "text": "Samsung reported a record quarter: revenue up one hundred twenty-seven percent, operating profit up seven hundred eighty-three percent to one hundred seven trillion won.", "zh": "\u4e09\u661f\u516c\u5e03\u4e86\u521b\u7eaa\u5f55\u7684\u5b63\u5ea6\u4e1a\u7ee9\uff1a\u8425\u6536\u589e\u957f127%\uff0c\u8425\u4e1a\u5229\u6da6\u589e\u957f783%\uff0c\u8fbe\u5230107\u4e07\u4ebf\u97e9\u5143\u3002"}, {"start": 196.7, "end": 206.71, "text": "But net profit missed expectations, and Samsung deferred details of its remaining shareholder returns to a January board meeting. Shares fell more than five percent intraday.", "zh": "\u4f46\u51c0\u5229\u6da6\u4e0d\u53ca\u9884\u671f\uff0c\u4e09\u661f\u8fd8\u628a\u5269\u4f59\u80a1\u4e1c\u56de\u62a5\u8ba1\u5212\u7684\u7ec6\u8282\u63a8\u8fdf\u52301\u6708\u8463\u4e8b\u4f1a\u3002\u80a1\u4ef7\u76d8\u4e2d\u8dcc\u8d855%\u3002"}, {"start": 206.71, "end": 214.99, "text": "SK Hynix, by contrast, rose about two point six percent in Seoul. A record print is not a floor when the return plan is the trade.", "zh": "\u76f8\u6bd4\u4e4b\u4e0b\uff0cSK\u6d77\u529b\u58eb\u5728\u9996\u5c14\u6da8\u7ea62.6%\u3002\u5f53\u80a1\u4e1c\u56de\u62a5\u8ba1\u5212\u672c\u8eab\u5c31\u662f\u4ea4\u6613\u4e3b\u9898\u65f6\uff0c\u521b\u7eaa\u5f55\u7684\u8d22\u62a5\u4e5f\u4e0d\u662f\u5e95\u90e8\u3002"}, {"start": 214.99, "end": 226.1, "text": "That reversal hit U.S. memory stocks pre-market. Micron is down about three percent, SanDisk down about three to four percent, and SK Hynix's U.S. listing down about three percent.", "zh": "\u8fd9\u4e00\u9006\u8f6c\u51b2\u51fb\u4e86\u7f8e\u56fd\u5b58\u50a8\u80a1\u76d8\u524d\u3002\u7f8e\u5149\u8dcc\u7ea63%\uff0c\u95ea\u8fea\u8dcc\u7ea63%\u81f34%\uff0cSK\u6d77\u529b\u58eb\u7f8e\u80a1\u8dcc\u7ea63%\u3002"}, {"start": 226.1, "end": 236.38, "text": "The semiconductor triple leveraged fund SOXL is down about six point seven percent pre-market, to about one hundred dollars. Wednesday's euphoria is retracing.", "zh": "\u534a\u5bfc\u4f53\u4e09\u500d\u505a\u591a\u57fa\u91d1SOXL\u76d8\u524d\u8dcc\u7ea66.7%\uff0c\u81f3\u7ea6100\u7f8e\u5143\u3002\u5468\u4e09\u7684\u72c2\u70ed\u6b63\u5728\u56de\u843d\u3002"}, {"start": 236.38, "end": 241.58, "text": "SanDisk reports tonight, which is the next memory verdict. What else reports after the close?", "zh": "\u95ea\u8fea\u4eca\u665a\u516c\u5e03\u8d22\u62a5\uff0c\u8fd9\u662f\u5b58\u50a8\u677f\u5757\u7684\u4e0b\u4e00\u4e2a\u88c1\u51b3\u3002\u6536\u76d8\u540e\u8fd8\u6709\u8c01\u516c\u5e03\u8d22\u62a5\uff1f"}, {"start": 241.58, "end": 249.82, "text": "Amazon and Intel headline the night, alongside SanDisk and Strategy. Amazon's print will test whether Alphabet was the exception or the rule.", "zh": "\u4e9a\u9a6c\u900a\u548c\u82f1\u7279\u5c14\u662f\u4eca\u665a\u7684\u4e3b\u89d2\uff0c\u8fd8\u6709\u95ea\u8fea\u548cStrategy\u3002\u4e9a\u9a6c\u900a\u7684\u8d22\u62a5\u5c06\u68c0\u9a8cAlphabet\u53ea\u662f\u4f8b\u5916\u8fd8\u662f\u666e\u904d\u89c4\u5f8b\u3002"}, {"start": 249.82, "end": 259.49, "text": "Before any of that, at eight thirty Eastern, minutes before the open, GDP and PCE inflation land. Then the European Central Bank decides at nine fifteen.", "zh": "\u800c\u5728\u8fd9\u4e9b\u4e4b\u524d\uff0c\u7f8e\u4e1c\u65f6\u95f48\u70b9\u534a\u3001\u4e5f\u5c31\u662f\u5f00\u76d8\u524d\u51e0\u5206\u949f\uff0cGDP\u548cPCE\u901a\u80c0\u6570\u636e\u5c06\u516c\u5e03\u3002\u968f\u540e\u6b27\u6d32\u592e\u884c\u57289\u70b915\u5206\u516c\u5e03\u51b3\u8bae\u3002"}, {"start": 259.49, "end": 266.86, "text": "A hot PCE print adds fuel to December hike pricing. A soft print is the only quick path to a volatility fade.", "zh": "PCE\u6570\u636e\u504f\u70ed\u4f1a\u52a9\u957f12\u6708\u52a0\u606f\u5b9a\u4ef7\u3002\u6570\u636e\u504f\u8f6f\u624d\u662f\u6ce2\u52a8\u7387\u5feb\u901f\u56de\u843d\u7684\u552f\u4e00\u6377\u5f84\u3002"}, {"start": 266.86, "end": 274.82, "text": "In other single names, Nvidia is down about one percent pre-market, and AMD down three point three percent, in the chip selloff.", "zh": "\u5176\u4ed6\u4e2a\u80a1\u65b9\u9762\uff0c\u82f1\u4f1f\u8fbe\u76d8\u524d\u8dcc\u7ea61%\uff0cAMD\u8dcc3.3%\uff0c\u5747\u53d7\u82af\u7247\u80a1\u629b\u552e\u62d6\u7d2f\u3002"}, {"start": 274.82, "end": 283.58, "text": "There are also reported Justice Department inquiries into Nvidia's Hugging Face deal. We mark that as reported, not confirmed by the department or by Nvidia.", "zh": "\u8fd8\u6709\u62a5\u9053\u79f0\u53f8\u6cd5\u90e8\u6b63\u5728\u8c03\u67e5\u82f1\u4f1f\u8fbe\u6536\u8d2dHugging Face\u7684\u4ea4\u6613\u3002\u6211\u4eec\u5c06\u5176\u6807\u6ce8\u4e3a\u62a5\u9053\uff0c\u672a\u7ecf\u53f8\u6cd5\u90e8\u6216\u82f1\u4f1f\u8fbe\u8bc1\u5b9e\u3002"}, {"start": 283.58, "end": 294.79, "text": "AMD got two target raises ahead of its November third earnings: one to eight hundred dollars, one to six hundred fifty. But consensus earnings figures differ across sources, so we treat them as unconfirmed.", "zh": "AMD\u572811\u67083\u65e5\u8d22\u62a5\u524d\u83b7\u5f97\u4e24\u6b21\u76ee\u6807\u4ef7\u4e0a\u8c03\uff1a\u4e00\u6b21\u81f3800\u7f8e\u5143\uff0c\u4e00\u6b21\u81f3650\u7f8e\u5143\u3002\u4f46\u5404\u6765\u6e90\u7684\u9884\u671f\u6536\u76ca\u6570\u5b57\u4e0d\u4e00\uff0c\u56e0\u6b64\u6211\u4eec\u5c06\u5176\u89c6\u4e3a\u672a\u786e\u8ba4\u3002"}, {"start": 294.79, "end": 306.48, "text": "Palantir has no new company news, but analysts split sharply: JPMorgan initiated with an Overweight rating and a two hundred sixty-two dollar target, while RBC reiterated Sell at ninety dollars.", "zh": "Palantir\u6ca1\u6709\u65b0\u7684\u516c\u53f8\u6d88\u606f\uff0c\u4f46\u5206\u6790\u5e08\u770b\u6cd5\u4e25\u91cd\u5206\u5316\uff1a\u6469\u6839\u5927\u901a\u65b0\u7ed9\u4e88\u589e\u6301\u8bc4\u7ea7\u3001\u76ee\u6807\u4ef7262\u7f8e\u5143\uff0c\u800cRBC\u91cd\u7533\u5356\u51fa\u3001\u76ee\u6807\u4ef790\u7f8e\u5143\u3002"}, {"start": 306.48, "end": 313.99, "text": "Palantir reports Monday, November second, and options imply about an eleven point six percent move. Apple reports the same day.", "zh": "Palantir\u5c06\u4e8e11\u67082\u65e5\u661f\u671f\u4e00\u516c\u5e03\u8d22\u62a5\uff0c\u671f\u6743\u9690\u542b\u6ce2\u52a8\u7ea611.6%\u3002\u82f9\u679c\u4e5f\u5728\u540c\u4e00\u5929\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 313.99, "end": 324.38, "text": "Apple unveiled its first touchscreen MacBook Pro on Wednesday, starting at two thousand eight hundred ninety-nine dollars. Its earnings consensus is about one dollar ninety-eight cents per share.", "zh": "\u82f9\u679c\u5468\u4e09\u53d1\u5e03\u4e86\u9996\u6b3e\u89e6\u5c4fMacBook Pro\uff0c\u8d77\u4ef72899\u7f8e\u5143\u3002\u5176\u8d22\u62a5\u9884\u671f\u6bcf\u80a1\u6536\u76ca\u7ea61.98\u7f8e\u5143\u3002"}, {"start": 324.38, "end": 334.39, "text": "Bloom Energy is the quiet winner in the AI power trade: third quarter revenue up one hundred thirty-eight percent, guidance raised, up four point three percent Wednesday.", "zh": "Bloom Energy\u662fAI\u7535\u529b\u4e3b\u9898\u4e2d\u4f4e\u8c03\u7684\u8d62\u5bb6\uff1a\u4e09\u5b63\u5ea6\u8425\u6536\u589e\u957f138%\uff0c\u4e0a\u8c03\u6307\u5f15\uff0c\u5468\u4e09\u6da84.3%\u3002"}, {"start": 334.39, "end": 345.96, "text": "In biotech, Moderna closed Wednesday at two hundred fourteen dollars, up about three percent. Its analysts still split: one target raised to two hundred thirty dollars, one downgrade on valuation.", "zh": "\u751f\u7269\u79d1\u6280\u65b9\u9762\uff0cModerna\u5468\u4e09\u6536\u4e8e214\u7f8e\u5143\uff0c\u6da8\u7ea63%\u3002\u5206\u6790\u5e08\u770b\u6cd5\u4ecd\u5206\u5316\uff1a\u4e00\u65b9\u5c06\u76ee\u6807\u4ef7\u4e0a\u8c03\u81f3230\u7f8e\u5143\uff0c\u53e6\u4e00\u65b9\u4ee5\u4f30\u503c\u4e3a\u7531\u4e0b\u8c03\u8bc4\u7ea7\u3002"}, {"start": 345.96, "end": 356.04, "text": "The biotech triple leveraged fund LABU is the one leveraged name firm this morning, indicated up about one point eight percent pre-market. Its Friday options imply about a seven percent move.", "zh": "\u751f\u7269\u79d1\u6280\u4e09\u500d\u505a\u591a\u57fa\u91d1LABU\u662f\u4eca\u65e9\u552f\u4e00\u575a\u633a\u7684\u6760\u6746\u57fa\u91d1\uff0c\u76d8\u524d\u6307\u793a\u6da8\u7ea61.8%\u3002\u5176\u5468\u4e94\u671f\u6743\u9690\u542b\u6ce2\u52a8\u7ea67%\u3002"}, {"start": 356.04, "end": 364.25, "text": "Strategy reports tonight, with its Bitcoin cushion down to about six percent above its average cost. Bitcoin itself is near eighty thousand dollars this morning.", "zh": "Strategy\u4eca\u665a\u516c\u5e03\u8d22\u62a5\uff0c\u5176\u6bd4\u7279\u5e01\u6301\u4ed3\u7684\u5b89\u5168\u57ab\u5df2\u964d\u81f3\u5e73\u5747\u6210\u672c\u4e0a\u65b9\u7ea66%\u3002\u6bd4\u7279\u5e01\u4eca\u65e9\u57288\u4e07\u7f8e\u5143\u9644\u8fd1\u3002"}, {"start": 364.25, "end": 375.77, "text": "Strategy bought no Bitcoin in the week to October twenty-fifth, holding eight hundred forty-eight thousand five hundred seventeen coins, and spent about two hundred five million dollars buying back preferred shares instead.", "zh": "Strategy\u5728\u622a\u81f310\u670825\u65e5\u7684\u4e00\u5468\u6ca1\u6709\u4e70\u5165\u6bd4\u7279\u5e01\uff0c\u6301\u4ed3\u7ef4\u6301\u5728848517\u679a\uff0c\u53cd\u800c\u82b1\u4e86\u7ea62.05\u4ebf\u7f8e\u5143\u56de\u8d2d\u4f18\u5148\u80a1\u3002"}, {"start": 375.77, "end": 384.1, "text": "Gold miners are quiet: GDX closed Wednesday up zero point nine one percent, but gold slipped Thursday morning on the hawkish Fed hold.", "zh": "\u91d1\u77ff\u80a1\u5e73\u9759\uff1aGDX\u5468\u4e09\u6da80.91%\uff0c\u4f46\u9ec4\u91d1\u5728\u7f8e\u8054\u50a8\u504f\u9e70\u7684\u6309\u5175\u4e0d\u52a8\u540e\u4e8e\u5468\u56db\u65e9\u76d8\u56de\u843d\u3002"}, {"start": 384.1, "end": 395.14, "text": "Tesla closed Wednesday down zero point eight percent at four hundred four dollars, and won a South Korea refund case over its driver assistance software. No reliable pre-market move was found.", "zh": "\u7279\u65af\u62c9\u5468\u4e09\u6536\u8dcc0.8%\uff0c\u62a5404\u7f8e\u5143\uff0c\u5e76\u5728\u97e9\u56fd\u8d62\u5f97\u4e86\u4e00\u8d77\u9a7e\u9a76\u8f85\u52a9\u8f6f\u4ef6\u9000\u6b3e\u6848\u3002\u6ca1\u6709\u627e\u5230\u53ef\u9760\u7684\u76d8\u524d\u6da8\u8dcc\u6570\u636e\u3002"}, {"start": 395.14, "end": 405.5, "text": "AppLovin closed Wednesday at about two hundred sixty dollars, down about one percent, with earnings due November fourth and a class action deadline on November sixteenth.", "zh": "AppLovin\u5468\u4e09\u6536\u4e8e\u7ea6260\u7f8e\u5143\uff0c\u8dcc\u7ea61%\uff0c\u8d22\u62a5\u5c06\u4e8e11\u67084\u65e5\u516c\u5e03\uff0c\u96c6\u4f53\u8bc9\u8bbc\u9996\u5e2d\u539f\u544a\u622a\u6b62\u65e5\u4e3a11\u670816\u65e5\u3002"}, {"start": 405.5, "end": 411.62, "text": "Walmart's only fresh item is a healthcare platform expansion. Its earnings are estimated for November nineteenth.", "zh": "\u6c83\u5c14\u739b\u552f\u4e00\u7684\u65b0\u6d88\u606f\u662f\u533b\u7597\u5e73\u53f0\u6269\u5f20\u3002\u5176\u8d22\u62a5\u9884\u8ba1\u572811\u670819\u65e5\u3002"}, {"start": 411.62, "end": 423.79, "text": "Now the strategy chapter. This is analysis only, read-only, no trading action taken. Spreads only, never naked shorts, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit.", "zh": "\u73b0\u5728\u8bf4\u7b56\u7565\u7ae0\u8282\u3002\u8fd9\u53ea\u662f\u5206\u6790\uff0c\u53ea\u8bfb\uff0c\u6ca1\u6709\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002\u53ea\u505a\u4ef7\u5dee\uff0c\u7edd\u4e0d\u88f8\u5356\uff0c\u5269\u4f5914\u81f330\u5929\uff0c\u5728\u8d5a\u523050%\u81f370%\u6743\u5229\u91d1\u65f6\u79bb\u573a\u3002"}, {"start": 423.79, "end": 437.52, "text": "The regime is simple to state and hard to trade: two prints resolved, but GDP, PCE, the ECB, and four earnings are still ahead. Size for a second gap, or wait for the post-print volatility crush.", "zh": "\u683c\u5c40\u8bf4\u8d77\u6765\u7b80\u5355\u3001\u505a\u8d77\u6765\u96be\uff1a\u4e24\u4efd\u8d22\u62a5\u5df2\u7ecf\u843d\u5730\uff0c\u4f46GDP\u3001PCE\u3001\u6b27\u6d32\u592e\u884c\u548c\u56db\u4efd\u8d22\u62a5\u8fd8\u5728\u524d\u9762\u3002\u8981\u6309\u4e8c\u6b21\u8df3\u7a7a\u6765\u63a7\u5236\u4ed3\u4f4d\uff0c\u6216\u8005\u7b49\u5f85\u8d22\u62a5\u540e\u7684\u6ce2\u52a8\u7387\u56de\u843d\u3002"}, {"start": 437.52, "end": 449.04, "text": "For KORU, the playbook default stays a bear call spread: far out of the money, ten to fifteen delta, three to five dollar wing width. The KOSPI round trip in forty-eight hours is exactly why.", "zh": "\u5bf9\u4e8eKORU\uff0c\u624b\u518c\u9ed8\u8ba4\u65b9\u5411\u4ecd\u662f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff1a\u6df1\u5ea6\u865a\u503c\u300110\u81f315 delta\u30013\u81f35\u7f8e\u5143\u7ffc\u5bbd\u3002KOSPI\u572848\u5c0f\u65f6\u5185\u7684\u5f80\u8fd4\u8d70\u52bf\u6b63\u662f\u539f\u56e0\u3002"}, {"start": 449.04, "end": 460.44, "text": "For LABU, the calmer triple leveraged fund, the put spread side is the trend side, with fifteen to twenty delta and slightly narrower wings. But there is no new reason to add size before the data.", "zh": "\u5bf9\u4e8e\u66f4\u5e73\u9759\u7684\u4e09\u500d\u57fa\u91d1LABU\uff0c\u770b\u8dcc\u4ef7\u5dee\u4e00\u4fa7\u987a\u5e94\u8d8b\u52bf\uff0c15\u81f320 delta\u3001\u7ffc\u5bbd\u7565\u7a84\u3002\u4f46\u5728\u6570\u636e\u516c\u5e03\u524d\uff0c\u6ca1\u6709\u65b0\u589e\u4ed3\u4f4d\u7684\u7406\u7531\u3002"}, {"start": 460.44, "end": 472.03, "text": "For SOXL, TECL and TQQQ, keep strikes far and wings wide enough to survive a one day gap, or wait. The reversal is the event, not the entry.", "zh": "\u5bf9\u4e8eSOXL\u3001TECL\u548cTQQQ\uff0c\u884c\u6743\u4ef7\u8981\u8fdc\u3001\u7ffc\u5bbd\u8981\u80fd\u627f\u53d7\u4e00\u65e5\u8df3\u7a7a\uff0c\u6216\u8005\u5e72\u8106\u7b49\u5f85\u3002\u9006\u8f6c\u672c\u8eab\u662f\u4e8b\u4ef6\uff0c\u4e0d\u662f\u5165\u573a\u70b9\u3002"}, {"start": 472.03, "end": 480.5, "text": "For SanDisk, avoid a tight spread into tonight's print. For Strategy, assume Bitcoin volatility, not equity volatility, drives the gap.", "zh": "\u5bf9\u4e8e\u95ea\u8fea\uff0c\u907f\u514d\u5728\u4eca\u665a\u8d22\u62a5\u524d\u505a\u8fc7\u7d27\u7684\u4ef7\u5dee\u3002\u5bf9\u4e8eStrategy\uff0c\u8981\u5047\u8bbe\u9a71\u52a8\u8df3\u7a7a\u7684\u662f\u6bd4\u7279\u5e01\u6ce2\u52a8\u7387\uff0c\u800c\u4e0d\u662f\u80a1\u7968\u6ce2\u52a8\u7387\u3002"}, {"start": 480.5, "end": 488.14, "text": "For Alphabet, the event has resolved and the gap has happened, so any new spread should be priced off post-print volatility, not off Wednesday's close.", "zh": "\u5bf9\u4e8eAlphabet\uff0c\u4e8b\u4ef6\u5df2\u7ecf\u843d\u5730\u3001\u8df3\u7a7a\u5df2\u7ecf\u53d1\u751f\uff0c\u6240\u4ee5\u4efb\u4f55\u65b0\u7684\u4ef7\u5dee\u90fd\u5e94\u6309\u8d22\u62a5\u540e\u7684\u6ce2\u52a8\u7387\u5b9a\u4ef7\uff0c\u800c\u4e0d\u662f\u6309\u5468\u4e09\u6536\u76d8\u4ef7\u5b9a\u4ef7\u3002"}, {"start": 488.14, "end": 499.58, "text": "And for UVXY, only short dated bear call spreads, or avoid it entirely. The selloff is tech specific, not index wide, so a volatility fade needs a soft PCE print.", "zh": "\u5bf9\u4e8eUVXY\uff0c\u53ea\u505a\u77ed\u671f\u718a\u5e02\u770b\u6da8\u4ef7\u5dee\uff0c\u6216\u8005\u5b8c\u5168\u56de\u907f\u3002\u8fd9\u8f6e\u629b\u552e\u9488\u5bf9\u79d1\u6280\u80a1\u800c\u975e\u5168\u5e02\u573a\uff0c\u6240\u4ee5\u6ce2\u52a8\u7387\u56de\u843d\u9700\u8981\u4e00\u4efd\u504f\u8f6f\u7684PCE\u6570\u636e\u3002"}, {"start": 499.58, "end": 509.54, "text": "Let's close with five things before the open. One, Wednesday closed higher but Thursday opens split. Two, Alphabet failed the cash flow test and Microsoft passed it.", "zh": "\u6700\u540e\u603b\u7ed3\u5f00\u76d8\u524d\u4e94\u4ef6\u4e8b\u3002\u7b2c\u4e00\uff0c\u5468\u4e09\u6536\u6da8\uff0c\u4f46\u5468\u56db\u5f00\u76d8\u5206\u5316\u3002\u7b2c\u4e8c\uff0cAlphabet\u6ca1\u901a\u8fc7\u73b0\u91d1\u6d41\u8003\u9a8c\uff0c\u5fae\u8f6f\u901a\u8fc7\u4e86\u3002"}, {"start": 509.54, "end": 525.46, "text": "Three, memory reversed overnight, and SanDisk reports tonight. Four, GDP and PCE land at eight thirty Eastern, minutes before the open. Five, tonight is the second exam: Amazon, Intel, SanDisk and Strategy.", "zh": "\u7b2c\u4e09\uff0c\u5b58\u50a8\u80a1\u9694\u591c\u9006\u8f6c\uff0c\u95ea\u8fea\u4eca\u665a\u516c\u5e03\u8d22\u62a5\u3002\u7b2c\u56db\uff0cGDP\u548cPCE\u5728\u7f8e\u4e1c\u65f6\u95f48\u70b9\u534a\u3001\u5f00\u76d8\u524d\u51e0\u5206\u949f\u516c\u5e03\u3002\u7b2c\u4e94\uff0c\u4eca\u665a\u662f\u7b2c\u4e8c\u573a\u8003\u8bd5\uff1a\u4e9a\u9a6c\u900a\u3001\u82f1\u7279\u5c14\u3001\u95ea\u8fea\u548cStrategy\u3002"}, {"start": 525.46, "end": 534.65, "text": "And the three things that matter most. One, the AI trade's grading rubric changed overnight: free cash flow first, growth second.", "zh": "\u800c\u6700\u91cd\u8981\u7684\u4e09\u4ef6\u4e8b\u3002\u7b2c\u4e00\uff0cAI\u4ea4\u6613\u7684\u8bc4\u5206\u6807\u51c6\u4e00\u591c\u4e4b\u95f4\u53d8\u4e86\uff1a\u5148\u770b\u81ea\u7531\u73b0\u91d1\u6d41\uff0c\u518d\u770b\u589e\u957f\u3002"}, {"start": 534.65, "end": 545.5, "text": "Two, Korea round-tripped in forty-eight hours, and leveraged holders felt both legs. Three, Thursday stacks data, a central bank, and four earnings into one session.", "zh": "\u7b2c\u4e8c\uff0c\u97e9\u56fd\u5e02\u573a48\u5c0f\u65f6\u5185\u5f80\u8fd4\uff0c\u6760\u6746\u6301\u6709\u8005\u4e24\u5934\u90fd\u611f\u53d7\u5230\u4e86\u3002\u7b2c\u4e09\uff0c\u5468\u56db\u628a\u6570\u636e\u3001\u592e\u884c\u548c\u56db\u4efd\u8d22\u62a5\u53e0\u52a0\u5728\u4e00\u4e2a\u4ea4\u6613\u65e5\u3002"}, {"start": 545.5, "end": 560.74, "text": "A final word on data gaps. Pre-market percentages vary by snapshot time and source, KORU has no reliable pre-market print, and the refinery strike claim, the Iran talks reports, and the Nvidia probe details are all unconfirmed.", "zh": "\u6700\u540e\u8bf4\u4e00\u4e0b\u6570\u636e\u7f3a\u53e3\u3002\u76d8\u524d\u6da8\u8dcc\u5e45\u56e0\u5feb\u7167\u65f6\u95f4\u548c\u6765\u6e90\u800c\u5f02\uff0cKORU\u6ca1\u6709\u53ef\u9760\u7684\u76d8\u524d\u62a5\u4ef7\uff0c\u70bc\u6cb9\u5382\u9047\u88ad\u58f0\u660e\u3001\u4f0a\u6717\u8c08\u5224\u62a5\u9053\u548c\u82f1\u4f1f\u8fbe\u8c03\u67e5\u7ec6\u8282\u5747\u672a\u786e\u8ba4\u3002"}, {"start": 560.74, "end": 570.58, "text": "This brief is market research only, not investment advice and not an order. Leveraged funds reset daily and decay over time, and Korean names carry overnight gap risk.", "zh": "\u672c\u7b80\u62a5\u4ec5\u4e3a\u5e02\u573a\u7814\u7a76\uff0c\u4e0d\u662f\u6295\u8d44\u5efa\u8bae\uff0c\u4e5f\u4e0d\u662f\u4ea4\u6613\u6307\u4ee4\u3002\u6760\u6746\u57fa\u91d1\u6bcf\u65e5\u91cd\u7f6e\u3001\u957f\u671f\u8870\u51cf\uff0c\u97e9\u56fd\u6807\u7684\u5e26\u6709\u9694\u591c\u8df3\u7a7a\u98ce\u9669\u3002"}, {"start": 570.58, "end": 579.82, "text": "Read-only, no trading action was taken. For positions, expiry or margin, check the broker app. Thanks for listening, and we will see you at the intraday brief.", "zh": "\u53ea\u8bfb\uff0c\u6ca1\u6709\u8fdb\u884c\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\u3002\u5982\u9700\u4e86\u89e3\u6301\u4ed3\u3001\u5230\u671f\u6216\u4fdd\u8bc1\u91d1\uff0c\u8bf7\u67e5\u770b\u5238\u5546App\u3002\u611f\u8c22\u6536\u542c\uff0c\u76d8\u4e2d\u7b80\u62a5\u518d\u89c1\u3002"}]},{"slug":"2026-10-28-post-market","title":"U.S. Stocks Post-Market Brief — October 28, 2026","mp3":"2026-10-28-post-market/2026-10-28-post-market.mp3","dur":"7:59","lines":[{"start":0.0,"end":6.07,"text":"Welcome to the U.S. Stocks Post-Market Brief, for Wednesday, October 28, 2026. I'm Alex.","zh":"欢迎收听美国股市盘后简报，2026年10月28日星期三。我是 Alex。"},{"start":6.07,"end":14.06,"text":"And I'm Jordan. This is pure market research. No account data, no trading orders, just what happened today and what to watch next.","zh":"我是 Jordan。这是纯市场研究，没有账户数据，没有交易指令，只有今天发生了什么和接下来要关注什么。"},{"start":14.06,"end":18.38,"text":"Here is the headline. Wednesday was a sorting day, not a rally day.","zh":"先说结论。星期三是分化的一天，而不是普涨的一天。"},{"start":18.38,"end":27.46,"text":"The Nasdaq rose about zero point nine five percent, the S and P five hundred added about zero point five eight percent, and the Dow gained about half a percent.","zh":"纳斯达克上涨约0.95%，标普500上涨约0.58%，道琼斯上涨约0.5%。"},{"start":27.46,"end":35.02,"text":"Memory stocks did the heavy lifting, the Fed did exactly what was priced, and then the after-hours tape drew the line the market had been waiting for.","zh":"存储股扛起了大旗，美联储的决定完全符合预期，随后盘后交易划出了市场一直在等的那条线。"},{"start":35.02,"end":42.5,"text":"Microsoft beat on Azure and jumped about five percent after the bell. Alphabet missed on earnings and fell about seven to eight percent.","zh":"微软凭借 Azure 的表现超出预期，盘后上涨约5%。Alphabet 盈利不及预期，盘后下跌约7%至8%。"},{"start":42.5,"end":47.35,"text":"The AI trade is no longer being bought as a basket. It is being graded name by name.","zh":"AI 交易不再是按篮子买入，而是逐只股票打分。"},{"start":47.35,"end":54.19,"text":"Let's start with the Fed. The committee held the federal funds target range unchanged at three point seven five to four percent.","zh":"先说美联储。委员会维持联邦基金目标利率区间不变，为3.75%至4%。"},{"start":54.19,"end":62.42,"text":"The vote was ten to two. Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented, preferring another quarter-point increase.","zh":"投票结果为10比2。理事 Lisa Cook 和克利夫兰联储主席 Beth Hammack 持反对意见，她们倾向于再加息25个基点。"},{"start":62.42,"end":68.66,"text":"Chair Kevin Warsh said politics played no role in the decision, and that the coming period is information-rich.","zh":"主席 Kevin Warsh 表示政治在决策中没有起任何作用，并称未来一段时间信息密集。"},{"start":68.66,"end":73.9,"text":"Traders raised December hike odds to roughly eighty percent, according to CME FedWatch.","zh":"根据 CME FedWatch，交易员把12月加息的概率提高到约80%。"},{"start":73.9,"end":82.13,"text":"Warsh also announced a calendar change. From 2027, one of the Fed's eight annual meetings will be a strategy-only session with no rate vote.","zh":"Warsh 还宣布了一项日程调整。从2027年起，美联储每年八次会议中将有一次只讨论战略，不进行利率表决。"},{"start":82.13,"end":88.13,"text":"A second strategy-only meeting follows in 2028, cutting rate-setting meetings from eight to six per year.","zh":"2028年还将再增加一次纯战略会议，利率决策会议将从每年八次减少到六次。"},{"start":88.13,"end":95.4,"text":"That landed on a day when September inflation printed three point seven percent year over year, well above the Fed's two percent target.","zh":"这一宣布恰逢9月通胀同比录得3.7%，远高于美联储2%的目标。"},{"start":95.4,"end":102.43,"text":"Rates stayed parked near five percent. The ten-year yield spent the day around four point nine nine to five point zero three percent.","zh":"利率维持在5%附近。十年期国债收益率全天在4.99%至5.03%之间波动。"},{"start":102.43,"end":109.39,"text":"The dollar index eased zero point one eight percent to one hundred two point one four, after touching a two-week high in the morning.","zh":"美元指数回落0.18%至102.14，早盘曾触及两周高点。"},{"start":109.39,"end":116.52,"text":"The VIX fell three point four eight percent to sixteen point nine one, as the Fed hold resolved the day's known binary.","zh":"VIX 下跌3.48%至16.91，因为美联储维持利率不变消除了当天已知的变数。"},{"start":116.52,"end":126.77,"text":"Oil stayed elevated. WTI rose about two point nine percent intraday to near one hundred three dollars, after a crude inventory draw of one point nine million barrels.","zh":"油价保持高位。WTI 盘中上涨约2.9%至103美元附近，此前原油库存减少190万桶。"},{"start":126.77,"end":135.05,"text":"One caution here. The Houthi claim of a missile hit on a Saudi refinery is still unconfirmed. Saudi authorities had not confirmed the strike.","zh":"这里要提醒一点。胡塞武装称导弹击中沙特炼油厂的消息仍未得到证实，沙特官方尚未确认此次袭击。"},{"start":135.05,"end":140.45,"text":"Gold held near four thousand seventy dollars, and gold miners rose zero point nine one percent.","zh":"黄金维持在4070美元附近，金矿股上涨0.91%。"},{"start":140.45,"end":148.97,"text":"Now the day's engine: memory. SK Hynix reported a record quarter, with revenue up three hundred twenty-eight percent year over year.","zh":"再说当天的引擎：存储。SK 海力士公布了创纪录的季度业绩，营收同比增长328%。"},{"start":148.97,"end":158.76,"text":"Operating profit jumped about six hundred thirty-one percent, an eighty percent margin, and the company announced about one hundred trillion won of shareholder returns for 2026.","zh":"营业利润跃升约631%，利润率达80%，公司还宣布2026年约100万亿韩元的股东回报计划。"},{"start":158.76,"end":166.92,"text":"Seoul's KOSPI surged six point six three percent through six thousand, and SK Hynix rose ten point eight nine percent in Seoul.","zh":"韩国 KOSPI 指数大涨6.63%，突破6000点，SK 海力士在首尔上涨10.89%。"},{"start":166.92,"end":175.2,"text":"But note the nuance. Net profit missed a FactSet consensus. The operating beat and the net miss are both true, on different lines.","zh":"但要注意一个细节。净利润低于 FactSet 的一致预期。营业利润超预期和净利润不及预期都是事实，只是口径不同。"},{"start":175.2,"end":184.56,"text":"In the U.S., SK Hynix shares jumped thirteen point three percent, Micron rose five point eight six percent, and SanDisk added seven point six six percent.","zh":"在美国，SK 海力士股价上涨13.3%，美光上涨5.86%，闪迪上涨7.66%。"},{"start":184.56,"end":191.81,"text":"That carried the leveraged ETFs. KORU jumped sixteen point one nine percent, and SOXL rose six point two percent.","zh":"这带动了杠杆 ETF。KORU 大涨16.19%，SOXL 上涨6.2%。"},{"start":191.81,"end":201.65,"text":"TECL added two point two eight percent, LABU rose four point nine one percent, and TQQQ was nearly flat, up just zero point zero seven percent.","zh":"TECL 上涨2.28%，LABU 上涨4.91%，TQQQ 几乎持平，仅上涨0.07%。"},{"start":201.65,"end":208.37,"text":"UVXY fell two point nine seven percent, exactly what you expect when the VIX drops after a resolved event.","zh":"UVXY 下跌2.97%，这正是 VIX 在已知变数消除后回落时的典型表现。"},{"start":208.37,"end":214.06,"text":"Nvidia was the exception in chips, falling one point one seven percent while memory names rallied.","zh":"英伟达是芯片股中的例外，在存储股大涨的同时下跌1.17%。"},{"start":214.06,"end":221.33,"text":"AMD rose three point two four percent, helped by the chip bid and headlines about a one-billion-dollar investment in Meta's equity raise.","zh":"AMD 上涨3.24%，受益于芯片板块的买盘，以及向 Meta 股权融资投资10亿美元的消息。"},{"start":221.33,"end":229.49,"text":"Among megacaps, Apple fell zero point nine four percent, Meta fell one point two four percent, and Tesla slipped zero point eight percent.","zh":"大盘科技股方面，苹果下跌0.94%，Meta 下跌1.24%，特斯拉下跌0.8%。"},{"start":229.49,"end":238.01,"text":"Palantir eased zero point nine seven percent, AppLovin fell one point zero eight percent, and Walmart slipped zero point four six percent.","zh":"Palantir 下跌0.97%，AppLovin 下跌1.08%，沃尔玛下跌0.46%。"},{"start":238.01,"end":247.2,"text":"Moderna rose two point nine eight percent with biotech, and Strategy gained two point six six percent even as bitcoin stayed near eighty-one thousand dollars.","zh":"Moderna 随生物科技板块上涨2.98%，Strategy 在比特币维持在81000美元附近时仍上涨2.66%。"},{"start":247.2,"end":255.19,"text":"Now after the bell. Microsoft reported fiscal first-quarter revenue of ninety-two point two eight billion dollars, beating consensus.","zh":"再说盘后。微软公布财年第一季度营收922.8亿美元，超出预期。"},{"start":255.19,"end":261.55,"text":"Adjusted earnings were four dollars eighty-nine cents a share, against a consensus near four dollars seventy-two cents.","zh":"调整后每股收益为4.89美元，而预期约为4.72美元。"},{"start":261.55,"end":270.02,"text":"Azure revenue grew forty-eight percent, well ahead of the forty-four point eight percent estimate, and total Microsoft Cloud revenue rose thirty percent.","zh":"Azure 营收增长48%，远高于44.8%的预期，微软云总营收增长30%。"},{"start":270.02,"end":277.06,"text":"Microsoft shares traded to five hundred fifty-six dollars sixty-six cents in extended trading, up about four point eight percent.","zh":"微软股价在盘后交易中达到556.66美元，上涨约4.8%。"},{"start":277.06,"end":288.17,"text":"Alphabet went the other way. Revenue of one hundred twenty-seven point six billion dollars was slightly below estimates, and earnings of two dollars twelve cents missed a consensus near three dollars.","zh":"Alphabet 则走了相反方向。1276亿美元的营收略低于预期，2.12美元的每股收益远低于约3美元的预期。"},{"start":288.17,"end":296.86,"text":"An eight point seven billion dollar loss on equity securities swung other income negative, and free cash flow was negative nine point one billion dollars.","zh":"87亿美元的股权证券亏损使其他收入转为负值，自由现金流为负91亿美元。"},{"start":296.86,"end":303.86,"text":"Search and YouTube advertising both missed estimates, even as Cloud revenue more than doubled to thirty point seven billion dollars.","zh":"搜索和 YouTube 广告均不及预期，尽管云业务营收翻倍多，达到307亿美元。"},{"start":303.86,"end":312.14,"text":"Alphabet also issued twenty-eight point seven billion dollars in senior notes, sold twelve point four billion dollars of stock, and suspended buybacks for the quarter.","zh":"Alphabet 还发行了287亿美元的高级债券，出售了124亿美元股票，并暂停了当季的回购。"},{"start":312.14,"end":317.9,"text":"Shares fell about seven percent immediately after the print, about eight percent on one after-hours board.","zh":"财报公布后股价立即下跌约7%，在一个盘后报价板上跌幅约为8%。"},{"start":317.9,"end":322.66,"text":"This is only Alphabet's second earnings miss in five years, and the market's message is clear.","zh":"这是 Alphabet 五年来第二次盈利不及预期，市场的信号很明确。"},{"start":322.66,"end":329.81,"text":"Spending is fine when it converts to profit, and punished when it does not. Microsoft showed that, and Alphabet did not.","zh":"支出能转化为利润时受到奖励，不能时受到惩罚。微软做到了，Alphabet 没有。"},{"start":329.81,"end":337.61,"text":"ServiceNow posted its first earnings miss since Zacks began tracking it in 2014, and fell about sixteen percent after hours.","zh":"ServiceNow 出现了自 Zacks 2014年开始追踪以来的首次盈利不及预期，盘后下跌约16%。"},{"start":337.61,"end":344.09,"text":"Fortinet fell nearly twenty-two percent despite a raised forecast. Beats and misses were both sold in software.","zh":"Fortinet 尽管上调了预期仍下跌近22%。在软件板块，超预期和不及预期的股票都被抛售。"},{"start":344.09,"end":350.98,"text":"Now strategy, and remember, this is analysis only. No trading action was taken, and nothing here is an order.","zh":"再说策略，请记住这只是分析。没有进行任何交易操作，这里的内容也不是下单指令。"},{"start":350.98,"end":360.02,"text":"The regime is calm index volatility with violent single-name gaps. That is where short spreads earn on the index side and get hurt on the single-name side.","zh":"当前环境是指数波动率平静，但个股出现剧烈跳空。这正是 short 价差在指数端赚钱、在个股端受伤的环境。"},{"start":360.02,"end":368.98,"text":"KORU's sixteen percent day is both a warning and an opportunity. The playbook default stays bear call spread: sell the rip, not the crash.","zh":"KORU 单日16%的涨幅既是警告也是机会。手册的默认方向仍是 bear call spread：在反弹时卖出，而不是在暴跌后追卖。"},{"start":368.98,"end":377.09,"text":"A day like today is the rip to sell into, with wide wings and far out-of-the-money strikes, and sized for a ten percent day in either direction.","zh":"像今天这样的日子正是可以卖出的反弹，翅膀要宽、行权价要足够虚值，仓位要按双向10%的波动来安排。"},{"start":377.09,"end":385.01,"text":"For LABU, the trend is intact, so put spreads keep the wind at their back, but new spreads into Thursday's data should be smaller than usual.","zh":"LABU 方面趋势完好，put spread 仍顺风，但赶在周四数据前新开的 spread 规模应比平时小。"},{"start":385.01,"end":394.68,"text":"For SOXL, SanDisk reports Thursday after the close, with about eight point three percent implied. A short spread there is an earnings bet, not rent collection.","zh":"SOXL 方面，闪迪周四盘后公布财报，隐含波动约8.3%。在那里做 short spread 是在赌财报，而不是收租。"},{"start":394.68,"end":403.63,"text":"For UVXY, the easy vol compression is already banked. Do not chase short vol into Thursday's data, which can re-inflate volatility fast.","zh":"UVXY 方面，轻松的波动率压缩行情已经被市场消化。不要在周四数据前追逐 short 波动率，数据可能迅速推高波动率。"},{"start":403.63,"end":412.58,"text":"And for Microsoft and Alphabet, the after-hours gaps reprice both names overnight. Spreads struck off Wednesday's closes are stale by Thursday's open.","zh":"微软和 Alphabet 方面，盘后跳空会在一夜之间重定两只股票的波动率。按周三收盘价设置的 spread 到周四开盘时已经过时。"},{"start":412.58,"end":421.34,"text":"Thursday is the other half of the exam. At eight thirty Eastern, we get third-quarter GDP, September PCE inflation, and jobless claims.","zh":"周四是考试的另一半。美东时间8点30分将公布第三季度 GDP、9月 PCE 通胀和初请失业金人数。"},{"start":421.34,"end":430.75,"text":"Before the open, Eli Lilly, Mastercard, Merck and Caterpillar report. After the close, Amazon, Intel, SanDisk and Gilead report.","zh":"开盘前，礼来、万事达、默克和卡特彼勒公布财报。收盘后，亚马逊、英特尔、闪迪和吉利德公布财报。"},{"start":430.75,"end":438.43,"text":"Friday brings the Bank of Japan decision, ExxonMobil and Chevron before the open, the Employment Cost Index, and Chicago PMI.","zh":"周五将有日本央行决议、开盘前埃克森美孚和雪佛龙的财报、就业成本指数和芝加哥 PMI。"},{"start":438.43,"end":449.76,"text":"One more flag. Some vendor prices disagree by more than a point on names like Palantir, AMD and Apple, and one EOD table mixes after-hours prices into its regular closes.","zh":"再提醒一点。部分数据商在 Palantir、AMD、苹果等股票的价格上相差超过1个百分点，还有一张收盘表把盘后价混进了常规收盘价。"},{"start":449.76,"end":455.81,"text":"We anchored regular closes to Finnhub and named the disagreements in the report, rather than smoothing them over.","zh":"我们以 Finnhub 作为常规收盘价的基准，并在报告中列出了这些分歧，而不是把它们抹平。"},{"start":455.81,"end":463.66,"text":"Also unconfirmed: the reported OpenAI plan to buy Google TPUs, and the claimed refinery strike behind part of the oil premium.","zh":"另外仍未证实的消息包括：据报道 OpenAI 计划购买谷歌 TPU，以及导致部分油价溢价的所谓炼油厂遇袭说法。"},{"start":463.66,"end":470.9,"text":"Bottom line: keep spreads wide, strikes far, and size for a post-earnings gap, not for this morning's memory bounce.","zh":"总结：保持宽翅膀、远行权价，仓位要按财报后跳空来安排，而不是按今天早上的存储股反弹来安排。"},{"start":470.9,"end":478.75,"text":"That is the post-market brief for October 28, 2026. Read-only, no trades placed. See you at the pre-market brief.","zh":"这就是2026年10月28日的盘后简报。只读分析，没有下单。盘前简报再见。"}]},{"slug": "2026-10-28-intraday", "title": "U.S. Stocks Intraday Brief \u2014 October 28, 2026", "mp3": "2026-10-28-intraday/2026-10-28-intraday.mp3", "dur": "10:12", "lines": [{"start": 0.0, "end": 5.23, "text": "Welcome to the U.S. Stocks Intraday Brief, for Wednesday, October twenty eighth. I am Alex.", "zh": "\u6b22\u8fce\u6536\u542c\u7f8e\u56fd\u80a1\u5e02\u76d8\u4e2d\u7b80\u62a5\uff0c2026\u5e7410\u670828\u65e5\u661f\u671f\u4e09\u3002\u6211\u662f Alex\u3002"}, {"start": 5.23, "end": 14.42, "text": "And I am Jordan. This is the mid-session edition, recorded around eleven thirty Eastern. It is pure market research: no account data, and no trading orders.", "zh": "\u6211\u662f Jordan\u3002\u8fd9\u662f\u76d8\u4e2d\u7248\uff0c\u7f8e\u4e1c\u65f6\u95f4\u7ea611\u70b9\u534a\u5f55\u5236\uff0c\u7eaf\u5e02\u573a\u7814\u7a76\uff1a\u6ca1\u6709\u8d26\u6237\u6570\u636e\uff0c\u4e5f\u6ca1\u6709\u4e0b\u5355\u3002"}, {"start": 14.42, "end": 26.71, "text": "At the open, the Dow slipped forty two points, while the S and P five hundred rose point one seven percent and the Nasdaq rose point two four percent. Memory chips lifted the open; the Dow lagged.", "zh": "\u5f00\u76d8\u65f6\uff0c\u9053\u6307\u8dcc42\u70b9\uff0c\u6807\u666e500\u6da80.17%\uff0c\u7eb3\u6307\u6da80.24%\u3002\u5b58\u50a8\u82af\u7247\u5e26\u8d77\u4e86\u5f00\u76d8\uff0c\u9053\u6307\u843d\u540e\u3002"}, {"start": 26.71, "end": 39.67, "text": "By mid-morning, the broad tape went flat and narrow. The S P Y was up just point one six percent, the Q Q Q up point one percent, and small caps flat. Breadth was split, not strong.", "zh": "\u5230\u4e0a\u5348\u4e2d\u6bb5\uff0c\u5927\u76d8\u8d70\u5e73\u6536\u7a84\uff1aSPY\u4ec5\u6da80.16%\uff0cQQQ\u6da80.10%\uff0c\u5c0f\u76d8\u80a1\u6301\u5e73\u3002\u5e02\u573a\u5e7f\u5ea6\u5206\u5316\uff0c\u5e76\u4e0d\u5f3a\u52b2\u3002"}, {"start": 39.67, "end": 53.04, "text": "The one real trade today is memory. S K Hynix reported record revenue of one hundred four point six trillion won, up three hundred twenty eight percent, and operating profit of eighty three point three trillion won.", "zh": "\u4eca\u5929\u552f\u4e00\u771f\u6b63\u7684\u4e3b\u7ebf\u662f\u5b58\u50a8\u3002SK\u6d77\u529b\u58eb\u4e00\u5b63\u5ea6\u8425\u6536104.6\u4e07\u4ebf\u97e9\u5143\uff0c\u540c\u6bd4\u589e\u957f328%\uff0c\u8425\u4e1a\u5229\u6da683.3\u4e07\u4ebf\u97e9\u5143\uff0c\u521b\u7eaa\u5f55\u3002"}, {"start": 53.04, "end": 65.04, "text": "It also announced about one hundred trillion won of shareholder returns for twenty twenty six, and said H B M four will pass H B M three E in the fourth quarter, with demand outrunning supply through twenty thirty.", "zh": "\u5b83\u8fd8\u5ba3\u5e032026\u5e74\u7ea6100\u4e07\u4ebf\u97e9\u5143\u7684\u80a1\u4e1c\u56de\u62a5\uff0c\u5e76\u8868\u793aHBM4\u5c06\u5728\u7b2c\u56db\u5b63\u5ea6\u8d85\u8fc7HBM3E\uff0c\u9700\u6c42\u52302030\u5e74\u90fd\u5c06\u8d85\u8fc7\u4f9b\u7ed9\u3002"}, {"start": 65.04, "end": 77.47, "text": "But keep both halves of that print in mind. Net profit of thirty nine point eight trillion won missed a FactSet consensus of about sixty one point four trillion, and fell fifty eight percent from the prior quarter.", "zh": "\u4f46\u8981\u8bb0\u4f4f\u8fd9\u4efd\u8d22\u62a5\u7684\u4e24\u9762\uff1a\u51c0\u5229\u6da639.8\u4e07\u4ebf\u97e9\u5143\u4f4e\u4e8e\u7ea661.4\u4e07\u4ebf\u97e9\u5143\u7684\u5e02\u573a\u9884\u671f\uff0c\u4e14\u73af\u6bd4\u4e0b\u8dcc58%\u3002"}, {"start": 77.47, "end": 89.71, "text": "Seoul still loved it. The KOSPI closed up six point six three percent at six thousand twelve, its first close above six thousand since October fourteenth, with a buy-side sidecar pause for a second straight session.", "zh": "\u9996\u5c14\u5e02\u573a\u4f9d\u7136\u4e70\u8d26\uff1aKOSPI\u6536\u6da86.63%\u81f36012\u70b9\uff0c\u4e3a10\u670814\u65e5\u4ee5\u6765\u9996\u6b21\u6536\u4e8e6000\u70b9\u4e0a\u65b9\uff0c\u8fde\u7eed\u7b2c\u4e8c\u5929\u89e6\u53d1\u4e70\u65b9\u7194\u65ad\u6682\u505c\u673a\u5236\u3002"}, {"start": 89.71, "end": 101.16, "text": "In the U.S. session, that carried KORU up thirteen point six percent intraday to thirteen dollars forty seven, and S K H Y up twelve point one percent to one hundred sixty two dollars ninety five.", "zh": "\u7f8e\u80a1\u76d8\u4e2d\uff0cKORU\u6da813.6%\u81f313.47\u7f8e\u5143\uff0cSKHY\u6da812.1%\u81f3162.95\u7f8e\u5143\u3002"}, {"start": 101.16, "end": 114.0, "text": "Micron rose four point seven percent to nine hundred seventy two dollars seventy seven, with an intraday high near nine hundred eighty. SanDisk rose five point five percent to one thousand three hundred seventy six dollars eighty nine.", "zh": "\u7f8e\u5149\u6da84.7%\u81f3972.77\u7f8e\u5143\uff0c\u76d8\u4e2d\u6700\u9ad8\u63a5\u8fd1980\u7f8e\u5143\uff1b\u95ea\u8fea\u6da85.5%\u81f31376.89\u7f8e\u5143\u3002"}, {"start": 114.0, "end": 127.2, "text": "The broader chip tape is thinner, though. Nvidia is flat intraday, and A M D is up just one point four percent. Morning flow put about thirteen point six billion dollars into memory names, far more than Nvidia's two point eight billion.", "zh": "\u4f46\u66f4\u5e7f\u7684\u82af\u7247\u677f\u5757\u8981\u5f31\u5f97\u591a\uff1a\u82f1\u4f1f\u8fbe\u76d8\u4e2d\u6301\u5e73\uff0cAMD\u4ec5\u6da81.4%\u3002\u4e0a\u5348\u8d44\u91d1\u6d41\u7ea6136\u4ebf\u7f8e\u5143\u6d8c\u5165\u5b58\u50a8\u80a1\uff0c\u8fdc\u8d85\u82f1\u4f1f\u8fbe\u768428\u4ebf\u7f8e\u5143\u3002"}, {"start": 127.2, "end": 135.17, "text": "So this is a memory trade, not a chip trade. Seagate is the outlier, down after earnings, with Morgan Stanley cutting its target.", "zh": "\u6240\u4ee5\u8fd9\u662f\u5b58\u50a8\u884c\u60c5\uff0c\u4e0d\u662f\u82af\u7247\u884c\u60c5\u3002\u5e0c\u6377\u662f\u4e2a\u4f8b\u5916\uff0c\u8d22\u62a5\u540e\u4e0b\u8dcc\uff0c\u6469\u6839\u58eb\u4e39\u5229\u4e0b\u8c03\u4e86\u5176\u76ee\u6807\u4ef7\u3002"}, {"start": 135.17, "end": 148.61, "text": "The other big morning story is power. Vertiv soared fourteen percent to two hundred thirty seven dollars eighty six, after earnings of two dollars twenty one a share on revenue of four point three one billion, up sixty one percent.", "zh": "\u4e0a\u5348\u53e6\u4e00\u4e2a\u5927\u6545\u4e8b\u662f\u7535\u529b\u57fa\u5efa\uff1aVertiv\u66b4\u6da814%\u81f3237.86\u7f8e\u5143\uff0c\u6bcf\u80a1\u6536\u76ca2.21\u7f8e\u5143\uff0c\u8425\u653643.1\u4ebf\u7f8e\u5143\uff0c\u540c\u6bd4\u589e\u957f61%\u3002"}, {"start": 148.61, "end": 159.17, "text": "G E Vernova also beat, with earnings of four dollars eighty one and orders up ninety six percent. But its stock faded from up three percent pre-market to down two point two percent intraday.", "zh": "GE Vernova\u540c\u6837\u8d85\u9884\u671f\uff0c\u6bcf\u80a1\u6536\u76ca4.81\u7f8e\u5143\uff0c\u8ba2\u5355\u589e\u957f96%\u3002\u4f46\u5176\u80a1\u4ef7\u4ece\u76d8\u524d\u6da83%\u8f6c\u4e3a\u76d8\u4e2d\u8dcc2.2%\u3002"}, {"start": 159.17, "end": 171.41, "text": "Barron's read is simple: faster growth and a lower multiple explain why the market paid for Vertiv and not for Vernova. For Bloom Energy, up two point six percent, the theme is still positive, just selective.", "zh": "\u5df4\u4f26\u5468\u520a\u7684\u89e3\u8bfb\u5f88\u7b80\u5355\uff1a\u66f4\u5feb\u7684\u589e\u957f\u548c\u66f4\u4f4e\u7684\u4f30\u503c\uff0c\u89e3\u91ca\u4e86\u5e02\u573a\u4e3a\u4f55\u4e70Vertiv\u800c\u4e0d\u4e70Vernova\u3002\u5bf9\u6da82.6%\u7684Bloom Energy\u6765\u8bf4\uff0c\u4e3b\u9898\u4ecd\u662f\u6b63\u9762\u7684\uff0c\u53ea\u662f\u66f4\u6311\u5254\u3002"}, {"start": 171.41, "end": 180.84, "text": "Now the macro clock. The Bank of Canada raised its rate twenty five basis points to two point five percent this morning, its first hike since July twenty twenty three.", "zh": "\u518d\u770b\u5b8f\u89c2\u65f6\u949f\uff1a\u52a0\u62ff\u5927\u592e\u884c\u4eca\u5929\u4e0a\u5348\u52a0\u606f25\u4e2a\u57fa\u70b9\u81f32.5%\uff0c\u4e3a2023\u5e747\u6708\u4ee5\u6765\u9996\u6b21\u52a0\u606f\u3002"}, {"start": 180.84, "end": 195.48, "text": "Governor Macklem said oil prices are expected to stay higher for longer, and the hike was needed so energy inflation does not spill over into generalised inflation. Canada's September inflation was three point one percent, driven almost entirely by energy.", "zh": "\u884c\u957f\u9ea6\u514b\u52d2\u59c6\u8868\u793a\uff0c\u6cb9\u4ef7\u9884\u8ba1\u5c06\u5728\u66f4\u957f\u65f6\u95f4\u5185\u4fdd\u6301\u9ad8\u4f4d\uff0c\u52a0\u606f\u662f\u4e3a\u4e86\u9632\u6b62\u80fd\u6e90\u901a\u80c0\u8513\u5ef6\u4e3a\u5168\u9762\u901a\u80c0\u3002\u52a0\u62ff\u59279\u6708\u901a\u80c0\u4e3a3.1%\uff0c\u51e0\u4e4e\u5b8c\u5168\u7531\u80fd\u6e90\u63a8\u52a8\u3002"}, {"start": 195.48, "end": 202.99, "text": "That matters because it is the clearest live example of an energy-inflation hawkish pivot, and it arrived hours before the Fed speaks.", "zh": "\u8fd9\u5f88\u91cd\u8981\uff0c\u56e0\u4e3a\u8fd9\u662f\u80fd\u6e90\u901a\u80c0\u4e0b\u9e70\u6d3e\u8f6c\u5411\u6700\u9c9c\u6d3b\u7684\u4f8b\u5b50\uff0c\u800c\u4e14\u5b83\u51fa\u73b0\u5728\u7f8e\u8054\u50a8\u8bb2\u8bdd\u524d\u51e0\u5c0f\u65f6\u3002"}, {"start": 202.99, "end": 212.28, "text": "Oil itself is holding its premium. W T I is near one hundred one dollars seventy five, up about two percent, and Brent near one hundred fifteen dollars sixty.", "zh": "\u6cb9\u4ef7\u672c\u8eab\u7ef4\u6301\u7740\u6ea2\u4ef7\uff1aWTI\u7ea6101.75\u7f8e\u5143\uff0c\u6da8\u7ea62%\uff0c\u5e03\u4f26\u7279\u7ea6115.6\u7f8e\u5143\u3002"}, {"start": 212.28, "end": 224.76, "text": "But a caution we must repeat: the spike rests on a Houthi claim of a missile hit on a Saudi refinery, which Saudi authorities had not confirmed at the time of writing. Treat it as risk premium, not a confirmed outage.", "zh": "\u4f46\u5fc5\u987b\u91cd\u590d\u4e00\u4e2a\u63d0\u9192\uff1a\u6cb9\u4ef7\u4e0a\u6da8\u57fa\u4e8e\u80e1\u585e\u6b66\u88c5\u58f0\u79f0\u5bfc\u5f39\u51fb\u4e2d\u6c99\u7279\u70bc\u5382\uff0c\u800c\u6c99\u7279\u65b9\u9762\u5728\u53d1\u7a3f\u65f6\u5c1a\u672a\u8bc1\u5b9e\u3002\u5e94\u5c06\u5176\u89c6\u4e3a\u98ce\u9669\u6ea2\u4ef7\uff0c\u800c\u975e\u5df2\u786e\u8ba4\u7684\u4f9b\u5e94\u4e2d\u65ad\u3002"}, {"start": 224.76, "end": 235.03, "text": "Rates and the dollar are firm into the Fed. The ten year yield is near five point zero one percent, the dollar index near one hundred two point four, and gold slipped to about four thousand sixty dollars after Tuesday's gain.", "zh": "\u5229\u7387\u548c\u7f8e\u5143\u5728\u7f8e\u8054\u50a8\u51b3\u8bae\u524d\u4fdd\u6301\u575a\u633a\uff1a10\u5e74\u671f\u6536\u76ca\u7387\u7ea65.01%\uff0c\u7f8e\u5143\u6307\u6570\u7ea6102.4\uff0c\u9ec4\u91d1\u5728\u5468\u4e8c\u4e0a\u6da8\u540e\u56de\u843d\u81f3\u7ea64060\u7f8e\u5143\u3002"}, {"start": 235.03, "end": 244.51, "text": "The V I X eased to about seventeen point three five, and U V X Y fell three point one percent to seventeen dollars thirty one. Nobody is paying up to hedge the Fed.", "zh": "VIX\u56de\u843d\u81f3\u7ea617.35\uff0cUVXY\u8dcc3.1%\u81f317.31\u7f8e\u5143\u3002\u6ca1\u4eba\u613f\u610f\u82b1\u5927\u4ef7\u94b1\u5bf9\u51b2\u7f8e\u8054\u50a8\u51b3\u8bae\u3002"}, {"start": 244.51, "end": 257.04, "text": "The Fed decision lands at two p.m. Eastern, with Chair Warsh's press conference at two thirty. A hold at three point seven five to four percent is about ninety to ninety four percent priced.", "zh": "\u7f8e\u8054\u50a8\u51b3\u8bae\u5c06\u4e8e\u7f8e\u4e1c\u65f6\u95f4\u4e0b\u53482\u70b9\u516c\u5e03\uff0c\u6c83\u4ec0\u4e3b\u5e2d\u8bb0\u8005\u4f1a2\u70b9\u534a\u5f00\u59cb\u3002\u7ef4\u63013.75%\u81f34%\u5229\u7387\u533a\u95f4\u7684\u6982\u7387\u7ea690%\u81f394%\u3002"}, {"start": 257.04, "end": 271.25, "text": "The real question is December. All one hundred economists in a Reuters poll expect a December hike, while futures price only about seventy one to eighty three percent. That gap, plus any dissent for a hike, is what the statement can move.", "zh": "\u771f\u6b63\u7684\u95ee\u9898\u662f12\u6708\uff1a\u8def\u900f\u8c03\u67e5\u7684100\u4f4d\u7ecf\u6d4e\u5b66\u5bb6\u5168\u90e8\u9884\u8ba112\u6708\u52a0\u606f\uff0c\u800c\u671f\u8d27\u5b9a\u4ef7\u4ec5\u7ea671%\u81f383%\u3002\u8fd9\u4e00\u5dee\u8ddd\uff0c\u52a0\u4e0a\u4efb\u4f55\u4e3b\u5f20\u52a0\u606f\u7684\u5f02\u8bae\u7968\uff0c\u624d\u662f\u58f0\u660e\u80fd\u64bc\u52a8\u7684\u4e1c\u897f\u3002"}, {"start": 271.25, "end": 282.48, "text": "Then, after the close, Microsoft and Alphabet report. Options imply a move of five point zero nine percent for Microsoft, and five point nine four to five point nine nine percent for Alphabet.", "zh": "\u6536\u76d8\u540e\uff0c\u5fae\u8f6f\u548cAlphabet\u5c06\u516c\u5e03\u8d22\u62a5\u3002\u671f\u6743\u9690\u542b\u6ce2\u52a8\u4e3a\u5fae\u8f6f\u00b15.09%\uff0cAlphabet\u00b15.94%\u81f35.99%\u3002"}, {"start": 282.48, "end": 295.73, "text": "Consensus is about ninety point six billion dollars of revenue for Microsoft, and about one hundred twenty seven point nine billion for Alphabet. The exam is the same for both: does cloud growth convert A I spending into cash?", "zh": "\u5e02\u573a\u9884\u671f\u5fae\u8f6f\u8425\u6536\u7ea6906\u4ebf\u7f8e\u5143\uff0cAlphabet\u7ea61279\u4ebf\u7f8e\u5143\u3002\u5bf9\u4e24\u5bb6\u516c\u53f8\u7684\u8003\u9898\u76f8\u540c\uff1a\u4e91\u589e\u957f\u80fd\u5426\u628aAI\u652f\u51fa\u8f6c\u5316\u4e3a\u73b0\u91d1\uff1f"}, {"start": 295.73, "end": 306.1, "text": "Intraday, Alphabet is the only megacap gainer, up one point one percent to three hundred twenty dollars twenty, helped by the reported OpenAI plan to buy Google T P Us.", "zh": "\u76d8\u4e2d\uff0cAlphabet\u662f\u552f\u4e00\u4e0a\u6da8\u7684\u5927\u578b\u79d1\u6280\u80a1\uff0c\u6da81.1%\u81f3320.20\u7f8e\u5143\uff0c\u53d7OpenAI\u8ba1\u5212\u8d2d\u4e70\u8c37\u6b4cTPU\u7684\u62a5\u9053\u63d0\u632f\u3002"}, {"start": 306.1, "end": 314.14, "text": "That T P U report is unconfirmed: a single source, no terms, no confirmation from either company. Do not trade it as fact.", "zh": "\u4f46\u8fd9\u4efdTPU\u62a5\u9053\u5c1a\u672a\u8bc1\u5b9e\uff1a\u5355\u4e00\u4fe1\u6e90\u3001\u65e0\u6761\u6b3e\u3001\u53cc\u65b9\u5747\u672a\u786e\u8ba4\u3002\u4e0d\u8981\u628a\u5b83\u5f53\u4e8b\u5b9e\u6765\u4ea4\u6613\u3002"}, {"start": 314.14, "end": 330.82, "text": "Microsoft faded point five percent to five hundred twenty eight dollars seventy five, and Meta faded one point two percent to six hundred twelve dollars seventy five, as the dilution debate around its ninety seven point five billion dollar offering won the session so far.", "zh": "\u5fae\u8f6f\u8dcc0.5%\u81f3528.75\u7f8e\u5143\uff0cMeta\u8dcc1.2%\u81f3612.75\u7f8e\u5143\uff0c\u56e0\u5176975\u4ebf\u7f8e\u5143\u589e\u53d1\u5e26\u6765\u7684\u7a00\u91ca\u4e89\u8bae\u5728\u76d8\u4e2d\u5360\u4e86\u4e0a\u98ce\u3002"}, {"start": 330.82, "end": 343.13, "text": "Elsewhere in the watchlist, Palantir fell two point four percent to one hundred ninety three dollars ninety, with no company news, extending Tuesday's lag. Tesla reversed its pre-market gain to fall one point five percent.", "zh": "\u81ea\u9009\u80a1\u5176\u4ed6\u4e2a\u80a1\u4e2d\uff0cPalantir\u65e0\u516c\u53f8\u6d88\u606f\u5374\u8dcc2.4%\u81f3193.90\u7f8e\u5143\uff0c\u5ef6\u7eed\u5468\u4e8c\u7684\u843d\u540e\u8868\u73b0\uff1b\u7279\u65af\u62c9\u5219\u7531\u76d8\u524d\u4e0a\u6da8\u8f6c\u4e3a\u8dcc1.5%\u3002"}, {"start": 343.13, "end": 355.42, "text": "Biotech ran with no new company news: L A B U up four point one percent to two hundred fifty two dollars sixteen, and Moderna up three point seven percent to two hundred fifteen dollars fifty six.", "zh": "\u751f\u7269\u79d1\u6280\u5728\u65e0\u65b0\u516c\u53f8\u6d88\u606f\u7684\u60c5\u51b5\u4e0b\u4e0a\u6da8\uff1aLABU\u6da84.1%\u81f3252.16\u7f8e\u5143\uff0cModerna\u6da83.7%\u81f3215.56\u7f8e\u5143\u3002"}, {"start": 355.42, "end": 366.89, "text": "Bitcoin holds above eighty thousand, near eighty one thousand three hundred, but crypto stocks faded: Strategy down point seven percent to one hundred forty dollars thirty five, ahead of its Thursday earnings.", "zh": "\u6bd4\u7279\u5e01\u5b88\u57288\u4e07\u7f8e\u5143\u4e0a\u65b9\uff0c\u7ea681300\u7f8e\u5143\uff0c\u4f46\u52a0\u5bc6\u80a1\u56de\u843d\uff1aStrategy\u8dcc0.7%\u81f3140.35\u7f8e\u5143\uff0c\u5468\u56db\u5c06\u516c\u5e03\u8d22\u62a5\u3002"}, {"start": 366.89, "end": 380.45, "text": "Gold miners gave back part of Tuesday's gain: G D X down one percent to eighty two dollars thirty three. And S P C X, the session's weakest watchlist name outside U V X Y, fell two point nine percent.", "zh": "\u91d1\u77ff\u80a1\u56de\u5410\u5468\u4e8c\u90e8\u5206\u6da8\u5e45\uff1aGDX\u8dcc1%\u81f382.33\u7f8e\u5143\u3002SPCX\u8dcc2.9%\uff0c\u4e3a\u9664UVXY\u5916\u76d8\u4e2d\u6700\u5f31\u7684\u81ea\u9009\u80a1\u3002"}, {"start": 380.45, "end": 392.76, "text": "Now the strategy update, read-only, no trading action taken. Spreads only, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit, max loss one to two percent per trade.", "zh": "\u73b0\u5728\u662f\u7b56\u7565\u66f4\u65b0\uff0c\u4ec5\u4f9b\u7814\u7a76\uff0c\u6ca1\u6709\u4efb\u4f55\u4ea4\u6613\u64cd\u4f5c\uff1a\u53ea\u505a\u4ef7\u5dee\uff0c\u5269\u4f5914\u81f330\u5929\uff0c\u572850%\u81f370%\u6743\u5229\u91d1\u5904\u79bb\u573a\uff0c\u5355\u7b14\u6700\u5927\u4e8f\u635f1%\u81f32%\u3002"}, {"start": 392.76, "end": 406.01, "text": "Premium sold at midday is still pre-Fed premium. The cleaner premium is the post-print vol crush, not this morning's memory-led rip. If you sell at all today, size it so a post-Fed, post-earnings gap does not matter.",
