<script>
const LINES=[{"start": 0.0, "end": 6.07, "text": "Welcome to the U.S. Stocks Pre-Market Brief, for Thursday, October 29, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘前简报，2026年10月29日星期四。我是 Alex。"}, {"start": 6.07, "end": 14.42, "text": "And I'm Jordan. This is pure market research, recorded before the open. No account data, no trading orders, just what is happening and what to watch.", "zh": "我是 Jordan。这是纯市场研究，开盘前录制。没有账户数据，没有交易指令，只有发生了什么和要关注什么。"}, {"start": 14.42, "end": 19.87, "text": "Here is the headline. Thursday is the morning after the exam, and the market is grading harshly.", "zh": "先说头条。周四是考试后的第一个早晨，而市场的打分非常严厉。"}, {"start": 19.87, "end": 24.72, "text": "Wednesday closed higher, but Thursday opens split. How split, exactly?", "zh": "周三收涨，但周四开盘涨跌分化。具体有多分化？"}, {"start": 24.72, "end": 35.71, "text": "The S and P 500 rose zero point two eight percent Wednesday to seven thousand seven hundred forty-three, and the Nasdaq rose zero point two seven percent to twenty-six thousand five hundred forty-nine.", "zh": "标普500周三上涨0.28%，收于7743点；纳斯达克上涨0.27%，收于26549点。"}, {"start": 35.71, "end": 46.08, "text": "And Thursday pre-market, Nasdaq futures are down about one percent, S and P futures down about zero point three percent, but Dow futures are up about zero point four percent.", "zh": "而周四盘前，纳指期货跌约1%，标普期货跌约0.3%，但道指期货涨约0.4%。"}, {"start": 46.08, "end": 52.99, "text": "The driver is the overnight earnings split. Alphabet is down about ten percent pre-market, while Microsoft is up about three percent.", "zh": "推动力是隔夜财报的分化。Alphabet盘前跌约10%，而微软涨约3%。"}, {"start": 52.99, "end": 59.59, "text": "This is a stock specific tech selloff, not a broad risk off day. Small caps are actually firmer pre-market.", "zh": "这是一场针对个股的科技股抛售，不是全面的避险行情。小盘股盘前反而更稳。"}, {"start": 59.59, "end": 64.22, "text": "Start with the company that failed the market's new test: Alphabet. What did it report?", "zh": "先说没通过市场新考验的公司：Alphabet。它公布了什么？"}, {"start": 64.22, "end": 75.55, "text": "Revenue of one hundred twenty-seven point six billion dollars, up twenty-five percent, but just below expectations. Earnings per share of two dollars twelve cents, versus about three dollars expected.", "zh": "营收1276亿美元，增长25%，但略低于预期。每股收益2.12美元，远低于约3.02美元的预期。"}, {"start": 75.55, "end": 83.06, "text": "Google Cloud more than doubled, up one hundred three percent to thirty point seven billion dollars. So why did the stock fall?", "zh": "谷歌云收入翻了一倍多，增长103%至307亿美元。那股价为什么跌？"}, {"start": 83.06, "end": 93.07, "text": "Because search advertising grew only twelve percent, down from seventeen percent, and free cash flow was negative nine point one billion dollars, a second straight negative quarter.", "zh": "因为搜索广告仅增长12%，低于上季度的17%，而自由现金流为负91亿美元，已是连续第二个季度为负。"}, {"start": 93.07, "end": 104.54, "text": "Capital spending hit fifty-one point four billion dollars in the quarter, and management said 2027 spending will increase significantly. The market read that as search monetization lagging the AI bill.", "zh": "当季资本开支达514亿美元，管理层还表示2027年开支将显著增加。市场将其解读为搜索变现跟不上AI账单。"}, {"start": 104.54, "end": 115.34, "text": "Now the company that passed: Microsoft. Revenue of ninety-two point three billion dollars, up nineteen percent, and earnings of four dollars eighty-nine cents, beating expectations.", "zh": "再说通过考验的公司：微软。营收923亿美元，增长19%，每股收益4.89美元，超预期。"}, {"start": 115.34, "end": 125.54, "text": "Azure grew forty-eight percent to thirty-three point two billion dollars, and free cash flow was eighteen point six billion dollars, roughly ten billion above expectations.", "zh": "Azure增长48%至332亿美元，自由现金流186亿美元，比预期高出约100亿美元。"}, {"start": 125.54, "end": 137.98, "text": "Microsoft also guided next quarter revenue of ninety-six to ninety-seven billion dollars, and Azure growth of forty-nine to fifty percent. Spending is not disqualifying, but the cash has to keep flowing.", "zh": "微软还指引下季度营收960至971亿美元，Azure增长49%至50%。开支本身不是问题，但现金必须持续流入。"}, {"start": 137.98, "end": 146.57, "text": "Next, the Fed. It held rates at three point seven five to four percent, in a ten to two vote, with two officials dissenting in favor of an immediate hike.", "zh": "接下来是美联储。它维持利率在3.75%至4%，以10比2投票通过，两位官员主张立即加息而投了反对票。"}, {"start": 146.57, "end": 156.1, "text": "December hike odds are now priced near eighty-three to eighty-five percent. So do not frame this as rate cut expectations. The story is hike risk, not cuts.", "zh": "12月加息概率现已定价约83%至85%。所以不要把它说成降息预期。当前的故事是加息风险，而不是降息。"}, {"start": 156.1, "end": 163.25, "text": "The ten year Treasury is near five percent, the dollar is near a two week high, and gold slipped to around four thousand thirty dollars.", "zh": "10年期美债收益率接近5%，美元处于两周高位附近，黄金回落至约4030美元。"}, {"start": 163.25, "end": 172.44, "text": "Oil eased about one percent to around one hundred one dollars, on reports of revived diplomacy with Iran. We mark that as reported, not confirmed.", "zh": "原油因与伊朗恢复外交的报道下跌约1%，至约101美元。我们将其标注为报道，未经证实。"}, {"start": 172.44, "end": 182.45, "text": "Now Asia, where yesterday's euphoria reversed. The Nikkei rose about one percent, but the KOSPI fell one point two four percent to five thousand nine hundred thirty-seven.", "zh": "再看亚洲，昨天的狂热今天逆转。日经涨约1%，但韩国KOSPI跌1.24%，收于5937点。"}, {"start": 182.45, "end": 187.06, "text": "The KOSPI surrendered six thousand after just one day. What happened in Seoul?", "zh": "KOSPI仅一天就失守6000点。首尔发生了什么？"}, {"start": 187.06, "end": 196.7, "text": "Samsung reported a record quarter: revenue up one hundred twenty-seven percent, operating profit up seven hundred eighty-three percent to one hundred seven trillion won.", "zh": "三星公布了创纪录的季度业绩：营收增长127%，营业利润增长783%，达到107万亿韩元。"}, {"start": 196.7, "end": 206.71, "text": "But net profit missed expectations, and Samsung deferred details of its remaining shareholder returns to a January board meeting. Shares fell more than five percent intraday.", "zh": "但净利润不及预期，三星还把剩余股东回报计划的细节推迟到1月董事会。股价盘中跌超5%。"}, {"start": 206.71, "end": 214.99, "text": "SK Hynix, by contrast, rose about two point six percent in Seoul. A record print is not a floor when the return plan is the trade.", "zh": "相比之下，SK海力士在首尔涨约2.6%。当股东回报计划本身就是交易主题时，创纪录的财报也不是底部。"}, {"start": 214.99, "end": 226.1, "text": "That reversal hit U.S. memory stocks pre-market. Micron is down about three percent, SanDisk down about three to four percent, and SK Hynix's U.S. listing down about three percent.", "zh": "这一逆转冲击了美国存储股盘前。美光跌约3%，闪迪跌约3%至4%，SK海力士美股跌约3%。"}, {"start": 226.1, "end": 236.38, "text": "The semiconductor triple leveraged fund SOXL is down about six point seven percent pre-market, to about one hundred dollars. Wednesday's euphoria is retracing.", "zh": "半导体三倍做多基金SOXL盘前跌约6.7%，至约100美元。周三的狂热正在回落。"}, {"start": 236.38, "end": 241.58, "text": "SanDisk reports tonight, which is the next memory verdict. What else reports after the close?", "zh": "闪迪今晚公布财报，这是存储板块的下一个裁决。收盘后还有谁公布财报？"}, {"start": 241.58, "end": 249.82, "text": "Amazon and Intel headline the night, alongside SanDisk and Strategy. Amazon's print will test whether Alphabet was the exception or the rule.", "zh": "亚马逊和英特尔是今晚的主角，还有闪迪和Strategy。亚马逊的财报将检验Alphabet只是例外还是普遍规律。"}, {"start": 249.82, "end": 259.49, "text": "Before any of that, at eight thirty Eastern, minutes before the open, GDP and PCE inflation land. Then the European Central Bank decides at nine fifteen.", "zh": "而在这些之前，美东时间8点半、也就是开盘前几分钟，GDP和PCE通胀数据将公布。随后欧洲央行在9点15分公布决议。"}, {"start": 259.49, "end": 266.86, "text": "A hot PCE print adds fuel to December hike pricing. A soft print is the only quick path to a volatility fade.", "zh": "PCE数据偏热会助长12月加息定价。数据偏软才是波动率快速回落的唯一捷径。"}, {"start": 266.86, "end": 274.82, "text": "In other single names, Nvidia is down about one percent pre-market, and AMD down three point three percent, in the chip selloff.", "zh": "其他个股方面，英伟达盘前跌约1%，AMD跌3.3%，均受芯片股抛售拖累。"}, {"start": 274.82, "end": 283.58, "text": "There are also reported Justice Department inquiries into Nvidia's Hugging Face deal. We mark that as reported, not confirmed by the department or by Nvidia.", "zh": "还有报道称司法部正在调查英伟达收购Hugging Face的交易。我们将其标注为报道，未经司法部或英伟达证实。"}, {"start": 283.58, "end": 294.79, "text": "AMD got two target raises ahead of its November third earnings: one to eight hundred dollars, one to six hundred fifty. But consensus earnings figures differ across sources, so we treat them as unconfirmed.", "zh": "AMD在11月3日财报前获得两次目标价上调：一次至800美元，一次至650美元。但各来源的预期收益数字不一，因此我们将其视为未确认。"}, {"start": 294.79, "end": 306.48, "text": "Palantir has no new company news, but analysts split sharply: JPMorgan initiated with an Overweight rating and a two hundred sixty-two dollar target, while RBC reiterated Sell at ninety dollars.", "zh": "Palantir没有新的公司消息，但分析师看法严重分化：摩根大通新给予增持评级、目标价262美元，而RBC重申卖出、目标价90美元。"}, {"start": 306.48, "end": 313.99, "text": "Palantir reports Monday, November second, and options imply about an eleven point six percent move. Apple reports the same day.", "zh": "Palantir将于11月2日星期一公布财报，期权隐含波动约11.6%。苹果也在同一天公布财报。"}, {"start": 313.99, "end": 324.38, "text": "Apple unveiled its first touchscreen MacBook Pro on Wednesday, starting at two thousand eight hundred ninety-nine dollars. Its earnings consensus is about one dollar ninety-eight cents per share.", "zh": "苹果周三发布了首款触屏MacBook Pro，起价2899美元。其财报预期每股收益约1.98美元。"}, {"start": 324.38, "end": 334.39, "text": "Bloom Energy is the quiet winner in the AI power trade: third quarter revenue up one hundred thirty-eight percent, guidance raised, up four point three percent Wednesday.", "zh": "Bloom Energy是AI电力主题中低调的赢家：三季度营收增长138%，上调指引，周三涨4.3%。"}, {"start": 334.39, "end": 345.96, "text": "In biotech, Moderna closed Wednesday at two hundred fourteen dollars, up about three percent. Its analysts still split: one target raised to two hundred thirty dollars, one downgrade on valuation.", "zh": "生物科技方面，Moderna周三收于214美元，涨约3%。分析师看法仍分化：一方将目标价上调至230美元，另一方以估值为由下调评级。"}, {"start": 345.96, "end": 356.04, "text": "The biotech triple leveraged fund LABU is the one leveraged name firm this morning, indicated up about one point eight percent pre-market. Its Friday options imply about a seven percent move.", "zh": "生物科技三倍做多基金LABU是今早唯一坚挺的杠杆基金，盘前指示涨约1.8%。其周五期权隐含波动约7%。"}, {"start": 356.04, "end": 364.25, "text": "Strategy reports tonight, with its Bitcoin cushion down to about six percent above its average cost. Bitcoin itself is near eighty thousand dollars this morning.", "zh": "Strategy今晚公布财报，其比特币持仓的安全垫已降至平均成本上方约6%。比特币今早在8万美元附近。"}, {"start": 364.25, "end": 375.77, "text": "Strategy bought no Bitcoin in the week to October twenty-fifth, holding eight hundred forty-eight thousand five hundred seventeen coins, and spent about two hundred five million dollars buying back preferred shares instead.", "zh": "Strategy在截至10月25日的一周没有买入比特币，持仓维持在848517枚，反而花了约2.05亿美元回购优先股。"}, {"start": 375.77, "end": 384.1, "text": "Gold miners are quiet: GDX closed Wednesday up zero point nine one percent, but gold slipped Thursday morning on the hawkish Fed hold.", "zh": "金矿股平静：GDX周三涨0.91%，但黄金在美联储偏鹰的按兵不动后于周四早盘回落。"}, {"start": 384.1, "end": 395.14, "text": "Tesla closed Wednesday down zero point eight percent at four hundred four dollars, and won a South Korea refund case over its driver assistance software. No reliable pre-market move was found.", "zh": "特斯拉周三收跌0.8%，报404美元，并在韩国赢得了一起驾驶辅助软件退款案。没有找到可靠的盘前涨跌数据。"}, {"start": 395.14, "end": 405.5, "text": "AppLovin closed Wednesday at about two hundred sixty dollars, down about one percent, with earnings due November fourth and a class action deadline on November sixteenth.", "zh": "AppLovin周三收于约260美元，跌约1%，财报将于11月4日公布，集体诉讼首席原告截止日为11月16日。"}, {"start": 405.5, "end": 411.62, "text": "Walmart's only fresh item is a healthcare platform expansion. Its earnings are estimated for November nineteenth.", "zh": "沃尔玛唯一的新消息是医疗平台扩张。其财报预计在11月19日。"}, {"start": 411.62, "end": 423.79, "text": "Now the strategy chapter. This is analysis only, read-only, no trading action taken. Spreads only, never naked shorts, fourteen to thirty days to expiry, exit at fifty to seventy percent of credit.", "zh": "现在说策略章节。这只是分析，只读，没有任何交易操作。只做价差，绝不裸卖，剩余14至30天，在赚到50%至70%权利金时离场。"}, {"start": 423.79, "end": 437.52, "text": "The regime is simple to state and hard to trade: two prints resolved, but GDP, PCE, the ECB, and four earnings are still ahead. Size for a second gap, or wait for the post-print volatility crush.", "zh": "格局说起来简单、做起来难：两份财报已经落地，但GDP、PCE、欧洲央行和四份财报还在前面。要按二次跳空来控制仓位，或者等待财报后的波动率回落。"}, {"start": 437.52, "end": 449.04, "text": "For KORU, the playbook default stays a bear call spread: far out of the money, ten to fifteen delta, three to five dollar wing width. The KOSPI round trip in forty-eight hours is exactly why.", "zh": "对于KORU，手册默认方向仍是熊市看涨价差：深度虚值、10至15 delta、3至5美元翼宽。KOSPI在48小时内的往返走势正是原因。"}, {"start": 449.04, "end": 460.44, "text": "For LABU, the calmer triple leveraged fund, the put spread side is the trend side, with fifteen to twenty delta and slightly narrower wings. But there is no new reason to add size before the data.", "zh": "对于更平静的三倍基金LABU，看跌价差一侧顺应趋势，15至20 delta、翼宽略窄。但在数据公布前，没有新增仓位的理由。"}, {"start": 460.44, "end": 472.03, "text": "For SOXL, TECL and TQQQ, keep strikes far and wings wide enough to survive a one day gap, or wait. The reversal is the event, not the entry.", "zh": "对于SOXL、TECL和TQQQ，行权价要远、翼宽要能承受一日跳空，或者干脆等待。逆转本身是事件，不是入场点。"}, {"start": 472.03, "end": 480.5, "text": "For SanDisk, avoid a tight spread into tonight's print. For Strategy, assume Bitcoin volatility, not equity volatility, drives the gap.", "zh": "对于闪迪，避免在今晚财报前做过紧的价差。对于Strategy，要假设驱动跳空的是比特币波动率，而不是股票波动率。"}, {"start": 480.5, "end": 488.14, "text": "For Alphabet, the event has resolved and the gap has happened, so any new spread should be priced off post-print volatility, not off Wednesday's close.", "zh": "对于Alphabet，事件已经落地、跳空已经发生，所以任何新的价差都应按财报后的波动率定价，而不是按周三收盘价定价。"}, {"start": 488.14, "end": 499.58, "text": "And for UVXY, only short dated bear call spreads, or avoid it entirely. The selloff is tech specific, not index wide, so a volatility fade needs a soft PCE print.", "zh": "对于UVXY，只做短期熊市看涨价差，或者完全回避。这轮抛售针对科技股而非全市场，所以波动率回落需要一份偏软的PCE数据。"}, {"start": 499.58, "end": 509.54, "text": "Let's close with five things before the open. One, Wednesday closed higher but Thursday opens split. Two, Alphabet failed the cash flow test and Microsoft passed it.", "zh": "最后总结开盘前五件事。第一，周三收涨，但周四开盘分化。第二，Alphabet没通过现金流考验，微软通过了。"}, {"start": 509.54, "end": 525.46, "text": "Three, memory reversed overnight, and SanDisk reports tonight. Four, GDP and PCE land at eight thirty Eastern, minutes before the open. Five, tonight is the second exam: Amazon, Intel, SanDisk and Strategy.", "zh": "第三，存储股隔夜逆转，闪迪今晚公布财报。第四，GDP和PCE在美东时间8点半、开盘前几分钟公布。第五，今晚是第二场考试：亚马逊、英特尔、闪迪和Strategy。"}, {"start": 525.46, "end": 534.65, "text": "And the three things that matter most. One, the AI trade's grading rubric changed overnight: free cash flow first, growth second.", "zh": "而最重要的三件事。第一，AI交易的评分标准一夜之间变了：先看自由现金流，再看增长。"}, {"start": 534.65, "end": 545.5, "text": "Two, Korea round-tripped in forty-eight hours, and leveraged holders felt both legs. Three, Thursday stacks data, a central bank, and four earnings into one session.", "zh": "第二，韩国市场48小时内往返，杠杆持有者两头都感受到了。第三，周四把数据、央行和四份财报叠加在一个交易日。"}, {"start": 545.5, "end": 560.74, "text": "A final word on data gaps. Pre-market percentages vary by snapshot time and source, KORU has no reliable pre-market print, and the refinery strike claim, the Iran talks reports, and the Nvidia probe details are all unconfirmed.", "zh": "最后说一下数据缺口。盘前涨跌幅因快照时间和来源而异，KORU没有可靠的盘前报价，炼油厂遇袭声明、伊朗谈判报道和英伟达调查细节均未确认。"}, {"start": 560.74, "end": 570.58, "text": "This brief is market research only, not investment advice and not an order. Leveraged funds reset daily and decay over time, and Korean names carry overnight gap risk.", "zh": "本简报仅为市场研究，不是投资建议，也不是交易指令。杠杆基金每日重置、长期衰减，韩国标的带有隔夜跳空风险。"}, {"start": 570.58, "end": 579.82, "text": "Read-only, no trading action was taken. For positions, expiry or margin, check the broker app. Thanks for listening, and we will see you at the intraday brief.", "zh": "只读，没有进行任何交易操作。如需了解持仓、到期或保证金，请查看券商App。感谢收听，盘中简报再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
