<script>
const LINES=[{"start": 0.0, "end": 6.55, "text": "Welcome to the U.S. Stocks Post-Market Brief, for Thursday, October 29, 2026. I'm Alex.", "zh": "欢迎收听美国股市盘后简报，2026年10月29日星期四。我是 Alex。"}, {"start": 6.55, "end": 14.18, "text": "And I'm Jordan. This is pure market research. No account data, no trading orders, just what happened today and what to watch next.", "zh": "我是 Jordan。这是纯市场研究，没有账户数据，没有交易指令，只有今天发生了什么和接下来要关注什么。"}, {"start": 14.18, "end": 20.42, "text": "Here is the headline. Thursday completed the exam Wednesday started, and the AI trade failed the second half.", "zh": "先说结论。星期四完成了星期三开始的考试，而 AI 交易在下半场不及格。"}, {"start": 20.42, "end": 31.87, "text": "The S and P five hundred ETF slipped zero point three eight percent, the Nasdaq one hundred ETF fell one point four two percent, but the Russell two thousand ETF gained zero point nine seven percent.", "zh": "标普500 ETF 下跌0.38%，纳斯达克100 ETF 下跌1.42%，但罗素2000 ETF 上涨0.97%。"}, {"start": 31.87, "end": 37.39, "text": "Nine of eleven sectors rose, even as tech fell. That is a rotation day, not a panic.", "zh": "11个板块中有9个上涨，尽管科技股下跌。这是一个轮动日，而不是恐慌日。"}, {"start": 37.39, "end": 44.54, "text": "The VIX ended near seventeen, up only about one percent. Vol stayed contained while single stocks moved violently.", "zh": "VIX 收于17附近，仅上涨约1%。指数波动率保持平静，但个股波动剧烈。"}, {"start": 44.54, "end": 54.5, "text": "Let's start with the macro data, released at eight thirty Eastern. Third-quarter GDP grew three point four percent annualized, above the three point two percent consensus.", "zh": "先说宏观数据，美东时间8点30分公布。第三季度 GDP 年化增长3.4%，高于3.2%的预期。"}, {"start": 54.5, "end": 62.66, "text": "September PCE inflation was in line with expectations: headline three point six percent year over year, core three point one percent.", "zh": "9月 PCE 通胀符合预期：总体同比3.6%，核心同比3.1%。"}, {"start": 62.66, "end": 68.59, "text": "Jobless claims came in at one hundred ninety-four thousand, below the one hundred ninety-nine thousand expected.", "zh": "初请失业金人数为19.4万，低于预期的19.9万。"}, {"start": 68.59, "end": 76.58, "text": "Strong growth plus sticky core inflation kept the December hike story alive, with hike odds still priced near eighty to eighty-five percent.", "zh": "强劲增长加上黏性的核心通胀，让12月加息的预期继续存在，加息概率仍定价在80%至85%附近。"}, {"start": 76.58, "end": 81.34, "text": "In Europe, the ECB held its deposit rate at two point five percent, unanimously.", "zh": "在欧洲，欧洲央行一致决定维持存款利率在2.5%不变。"}, {"start": 81.34, "end": 88.01, "text": "And President Christine Lagarde announced she will step down on February seventh, 2027, about nine months early.", "zh": "行长 Christine Lagarde 宣布将于2027年2月7日提前约九个月离任。"}, {"start": 88.01, "end": 95.09, "text": "Rates fell. The ten-year yield ended around four point nine four to four point nine nine percent, and the dollar eased.", "zh": "利率回落。十年期国债收益率收于4.94%至4.99%附近，美元走弱。"}, {"start": 95.09, "end": 102.12, "text": "Gold slipped to about four thousand thirty-nine dollars, and oil was essentially flat near one hundred two dollars eighty-two cents.", "zh": "黄金跌至约4039美元，油价基本持平于102.82美元附近。"}, {"start": 102.12, "end": 112.92, "text": "One caution on oil headlines. Reports of tankers hitting mines near the Strait of Hormuz are unconfirmed as a closure, and sources did not establish any sustained interruption to oil flows.", "zh": "关于油价消息要提醒一点。油轮在霍尔木兹海峡附近触雷的报道尚未证实构成封锁，也没有证实石油流动持续中断。"}, {"start": 112.92, "end": 120.84, "text": "Now the day's key stock: Alphabet. It fell twelve point two nine percent in the regular session, its worst day since 2020.", "zh": "再说当天的关键股票：Alphabet。它在常规交易时段下跌12.29%，是2020年以来最糟糕的一天。"}, {"start": 120.84, "end": 131.21, "text": "Revenue of one hundred twenty-seven point five eight billion dollars missed estimates, and free cash flow was negative nine point one billion dollars, despite Cloud revenue more than doubling.", "zh": "1275.8亿美元的营收不及预期，自由现金流为负91亿美元，尽管云业务营收翻倍还多。"}, {"start": 131.21, "end": 138.22, "text": "Microsoft gave back its post-earnings pop, slipping zero point one six percent, even though Azure grew forty-eight percent.", "zh": "微软回吐了财报后的涨幅，下跌0.16%，尽管 Azure 增长了48%。"}, {"start": 138.22, "end": 147.1, "text": "Meta rebounded one point nine six percent, snapping a five-session slide, and Apple rose one point four eight percent on defensive rotation.", "zh": "Meta 反弹1.96%，结束了连续五个交易日的下跌，苹果在防御性轮动中上涨1.48%。"}, {"start": 147.1, "end": 156.02, "text": "Now memory, the reversal. The SOX semiconductor index fell one point four percent, and Samsung fell four point one three percent in Seoul.", "zh": "再说存储板块的逆转。SOX 半导体指数下跌1.4%，三星在首尔下跌4.13%。"}, {"start": 156.02, "end": 163.75, "text": "Samsung reported a record quarter, but slightly below consensus, and deferred shareholder-return details to a January board meeting.", "zh": "三星公布了创纪录的季度业绩，但略低于预期，并把股东回报细节推迟到1月的董事会。"}, {"start": 163.75, "end": 172.46, "text": "Micron fell four point nine eight percent, SanDisk fell five point three two percent into its earnings, and AMD fell two point zero eight percent.", "zh": "美光下跌4.98%，闪迪在财报前下跌5.32%，AMD 下跌2.08%。"}, {"start": 172.46, "end": 179.71, "text": "Nvidia held up better, down only zero point eight percent, partly offset by Oracle's Vera Rubin systems news.", "zh": "英伟达表现相对较好，仅下跌0.8%，部分得益于甲骨文 Vera Rubin 系统的消息。"}, {"start": 179.71, "end": 189.02, "text": "SK hynix in the U.S. fell one point five eight percent, even though SK hynix rose two point six two percent in Seoul. Do not merge the two listings.", "zh": "SK 海力士美股下跌1.58%，尽管其在首尔上涨2.62%。不要把两个上市地混为一谈。"}, {"start": 189.02, "end": 198.26, "text": "That carried the leveraged ETFs down. KORU fell seven point six two percent, a round-trip after Wednesday's sixteen point one nine percent surge.", "zh": "这带动杠杆 ETF 下跌。KORU 下跌7.62%，在星期三上涨16.19%之后走了个来回。"}, {"start": 198.26, "end": 208.39, "text": "SOXL fell four point six two percent, TECL fell three point four two percent, and TQQQ fell five point two percent to sixty-eight dollars sixty cents.", "zh": "SOXL 下跌4.62%，TECL 下跌3.42%，TQQQ 下跌5.2%至68.60美元。"}, {"start": 208.39, "end": 215.71, "text": "UVXY fell three point three five percent, despite the Nasdaq selloff. That tells you this was not a vol event.", "zh": "UVXY 下跌3.35%，尽管纳斯达克大跌。这说明这不是一次波动率事件。"}, {"start": 215.71, "end": 224.95, "text": "Biotech was the exception. Health care rose two point four percent, the best sector, led by Eli Lilly, up six point six three percent on raised guidance.", "zh": "生物科技是个例外。医疗保健板块上涨2.4%，表现最佳，礼来因上调指引而上涨6.63%。"}, {"start": 224.95, "end": 232.8, "text": "Moderna rose four point zero one percent, and LABU rose one point one one percent, the only leveraged ETF in the green.", "zh": "Moderna 上涨4.01%，LABU 上涨1.11%，是唯一收红的杠杆 ETF。"}, {"start": 232.8, "end": 242.47, "text": "Walmart rose two point zero nine percent on the defensive rotation, Tesla was essentially flat, and AppLovin fell one point nine five percent, near its fifty-two-week low.", "zh": "沃尔玛在防御性轮动中上涨2.09%，特斯拉基本持平，AppLovin 下跌1.95%，接近52周低点。"}, {"start": 242.47, "end": 250.39, "text": "Gold miners fell three point one two percent, harder than gold itself, and Strategy fell two point four four percent as bitcoin slipped.", "zh": "金矿股下跌3.12%，跌幅大于黄金本身，Strategy 随比特币走弱下跌2.44%。"}, {"start": 250.39, "end": 262.7, "text": "Now after the bell. Amazon missed on both lines: earnings of one dollar eighty-nine cents against about one dollar ninety-seven expected, and revenue of two hundred one point nine billion dollars.", "zh": "再说盘后。亚马逊双双不及预期：每股收益1.89美元，预期约1.97美元；营收2019亿美元。"}, {"start": 262.7, "end": 273.67, "text": "AWS grew thirty-nine percent to forty-six billion dollars, its fastest in about five years, but that was not enough. Shares fell six percent or more after hours.", "zh": "AWS 增长39%至460亿美元，约五年来最快，但这还不够。股价盘后下跌6%或更多。"}, {"start": 273.67, "end": 284.66, "text": "Amazon's fourth-quarter sales guide of two hundred forty to two hundred forty-seven billion dollars, and a reaffirmed two hundred twenty billion dollar capex plan, kept the cash-flow pressure in focus.", "zh": "亚马逊第四季度营收指引为2400亿至2470亿美元，并重申2200亿美元的资本开支计划，使现金流压力继续成为焦点。"}, {"start": 284.66, "end": 294.34, "text": "Intel beat on the quarter, with adjusted earnings of fifty-two cents, but guided the fourth quarter far below consensus, and fell seventeen to twenty-two percent after hours.", "zh": "英特尔本季度超出预期，调整后每股收益52美分，但第四季度指引远低于预期，盘后下跌17%至22%。"}, {"start": 294.34, "end": 301.13, "text": "Intel also cited a factory explosion in Israel, costing about six hundred million dollars of revenue over two quarters.", "zh": "英特尔还提到以色列工厂爆炸事件，将在两个季度内造成约6亿美元的营收损失。"}, {"start": 301.13, "end": 312.46, "text": "Chip contagion followed. AMD fell about four percent after hours, Broadcom about two percent, and SOXL fell a further nine to thirteen percent, depending on the timestamp.", "zh": "芯片股随后全线下跌。AMD 盘后下跌约4%，博通约2%，SOXL 再跌9%至13%，具体取决于报价时间。"}, {"start": 312.46, "end": 323.26, "text": "SanDisk beat: revenue of eleven point zero three billion dollars, adjusted earnings of forty-nine dollars fifty-one cents, plus an eight-for-one split and a five billion dollar buyback.", "zh": "闪迪超出预期：营收110.3亿美元，调整后每股收益49.51美元，外加8拆1拆股和50亿美元回购。"}, {"start": 323.26, "end": 333.86, "text": "But SanDisk whipsawed after hours: it popped about three percent, then faded to about minus four point three percent by six eighteen Eastern. Do not quote a single after-hours figure for it.", "zh": "但闪迪盘后大幅震荡：先涨约3%，到美东时间6点18分又跌至约负4.3%。不要只引用它的某一个盘后价格。"}, {"start": 333.86, "end": 343.87, "text": "Strategy reported a record accounting profit of nineteen point five three billion dollars, almost entirely a bitcoin revaluation gain, and shares were roughly flat after hours.", "zh": "Strategy 公布了195.3亿美元的创纪录账面利润，几乎全部来自比特币重估收益，股价盘后基本持平。"}, {"start": 343.87, "end": 351.67, "text": "Elsewhere after hours, Reddit fell sixteen percent, Pinterest fell eleven percent, and Gilead rose about two point six percent.", "zh": "其他盘后个股方面，Reddit 下跌16%，Pinterest 下跌11%，吉利德上涨约2.6%。"}, {"start": 351.67, "end": 358.46, "text": "Now strategy, and remember, this is analysis only. No trading action was taken, and nothing here is an order.", "zh": "再说策略，请记住这只是分析。没有进行任何交易操作，这里的内容也不是下单指令。"}, {"start": 358.46, "end": 366.22, "text": "The regime is contained index volatility with violent single-name gaps. Short spreads earn on the index side and get hurt on the single-name side.", "zh": "当前环境是指数波动率平静，但个股出现剧烈跳空。Short 价差在指数端赚钱、在个股端受伤。"}, {"start": 366.22, "end": 375.1, "text": "KORU's two-day round-trip is the warning. The playbook default stays bear call spread: sell the rip, not the crash, with wide wings and far strikes.", "zh": "KORU 两天的来回就是警告。手册的默认方向仍是 bear call spread：在反弹时卖出，而不是在暴跌后追卖，翅膀要宽、行权价要足够虚值。"}, {"start": 375.1, "end": 386.14, "text": "For LABU, the trend is intact, but options into Friday's expiry carried extreme implied volatility, about two hundred thirty-three percent. That is expiry-event vol, not rent.", "zh": "LABU 方面趋势完好，但周五到期期权的隐含波动率极高，约233%。那是到期事件波动率，不是收租。"}, {"start": 386.14, "end": 396.34, "text": "For SOXL, TECL and TQQQ, spreads struck off Thursday's closes are stale by Friday's open. Re-mark any existing spread before assuming its risk.", "zh": "SOXL、TECL 和 TQQQ 方面，按周四收盘价设置的 spread 到周五开盘时已经过时。先重新估值，再假设其风险。"}, {"start": 396.34, "end": 404.14, "text": "For UVXY, do not chase short vol now. Friday's data can re-inflate volatility faster than contango decays it.", "zh": "UVXY 方面，现在不要追逐 short 波动率。周五的数据可能迅速推高波动率，速度超过 contango 的衰减。"}, {"start": 404.14, "end": 414.58, "text": "Friday brings the Bank of Japan decision, expected to hold at one point two five percent, plus the Employment Cost Index at eight thirty Eastern and Chicago PMI at nine forty-five.", "zh": "周五将有日本央行决议，预计维持1.25%不变，还有美东时间8点30分的就业成本指数和9点45分的芝加哥 PMI。"}, {"start": 414.58, "end": 421.78, "text": "ExxonMobil and Chevron report before the open, and the market must digest the Amazon, Intel and SanDisk after-hours moves.", "zh": "埃克森美孚和雪佛龙将在开盘前公布财报，市场还必须消化亚马逊、英特尔和闪迪的盘后走势。"}, {"start": 421.78, "end": 429.38, "text": "Next week, Palantir's earnings window opens November second, the midterms arrive November third, and Moderna reports November sixth.", "zh": "下周，Palantir 的财报窗口于11月2日开启，中期选举在11月3日举行，Moderna 将于11月6日公布财报。"}, {"start": 429.38, "end": 482.71, "text": "Two data flags. One vendor's TQQQ close differs from the dated history we used, and the SPCX ticker remains instrument-ambiguous across vendors.", "zh": "两个数据提醒。某数据商的 TQQQ 收盘价与我们采用的历史数据不同，SPCX 代码在不同数据商处的标的仍不明确。"}, {"start": 482.71, "end": 492.55, "text": "Also unconfirmed: a reported Nvidia CEO espionage story had no corroborating source, and a reported bitcoin options expiry size is single-source only.", "zh": "另外仍未证实的消息包括：据报道的英伟达 CEO 间谍事件没有佐证来源，某比特币期权到期规模也只有一个来源。"}, {"start": 492.55, "end": 498.6, "text": "Bottom line: keep spreads wide, strikes far, and size for a gap, not for today's rotation.", "zh": "总结：保持宽翅膀、远行权价，仓位要按跳空来安排，而不是按今天的轮动来安排。"}, {"start": 498.6, "end": 506.76, "text": "In Korea, the KOSPI gave back six thousand, falling one point two four percent, as institutions sold while foreigners and retail bought.", "zh": "在韩国，KOSPI 跌回6000点以下，下跌1.24%，机构卖出而外资和散户买入。"}, {"start": 506.76, "end": 516.96, "text": "Breadth actually improved into the close, with advancers beating decliners on both the NYSE and the Nasdaq. That is why this reads as repositioning, not panic.", "zh": "收盘时市场广度实际有所改善，纽交所和纳斯达克的上涨股都多于下跌股。这就是为什么这看起来是调仓，而不是恐慌。"}, {"start": 516.96, "end": 526.63, "text": "One more macro flag. A hot Employment Cost Index on Friday would strengthen December hike pricing and lift the long end, the main macro risk to short put spreads in growth names.", "zh": "再提醒一个宏观风险。周五就业成本指数若偏热，将强化12月加息定价并推高长端利率，这是 growth 股 short put spread 面临的主要宏观风险。"}, {"start": 526.63, "end": 534.19, "text": "And a reminder on risk. Leveraged ETFs decay and gap, and a single session can move them double digits in either direction.", "zh": "还要提醒风险。杠杆 ETF 会衰减也会跳空，单个交易日就可能双向波动两位数。"}, {"start": 534.19, "end": 542.18, "text": "That is the post-market brief for October 29, 2026. Read-only, no trades placed. See you at the pre-market brief.", "zh": "这就是2026年10月29日的盘后简报。只读分析，没有下单。盘前简报再见。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
