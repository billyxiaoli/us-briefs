5.65, "end": 125.04, "text": "因为即使没有信息平台，没有算法，我们把握的现实依然是被自己的偏好所建构出来的伪现实，也就是被意识形态捕获了。", "en": "Because even without information platforms and algorithms, the reality we grasp is still a pseudo-reality constructed by our own preferences — that is, captured by ideology."}, {"start": 125.04, "end": 135.43, "text": "比如一名中国男性极端厌女（换成女拳厌男也可以），我们可以说他走到这个地步是因为他在信息茧房里看了够多的煽动性文章。", "en": "For example, a Chinese man who is extremely misogynistic (or swap in a feminist man-hater) — we can say he reached this point because he read enough inflammatory articles in the information cocoon."}, {"start": 135.43, "end": 145.8, "text": "但是我们总是可以追溯到算法还没有学习到他信息偏好的时间点，在此时，我们依然无法认为他在性别议题上是中立的，即使他自己也这样认为。", "en": "But we can always trace back to the point before the algorithm had learned his information preferences. At that point, we still cannot consider him neutral on gender issues, even if he himself thinks so."}, {"start": 145.8, "end": 154.87, "text": "因为逻辑上讲，他必然首先被第一篇厌女文章而不是其他什么文章打动了，算法才会在后续继续给他推送类似的文章。", "en": "Because logically, he must first have been moved by the first misogynistic article rather than some other article, and only then did the algorithm continue pushing similar articles to him afterwards."}, {"start": 154.87, "end": 164.4, "text": "只有他具有个人差异性的心理防御机制才能解释他被第一篇厌女文章打动了（而不是没被打动，甚至反感）。", "en": "Only his individually differentiated psychological defence mechanism can explain why he was moved by the first misogynistic article (rather than not being moved, or even feeling disgusted)."}, {"start": 164.4, "end": 169.27, "text": "所以问题不仅仅出在“服务器”，也出在了“客户端”，也就是个人精神结构。", "en": "So the problem lies not only in the 'server', but also in the 'client' — that is, the individual psychic structure."}, {"start": 169.27, "end": 181.56, "text": "信息资本并没有凭空创造了一个信息茧房出来；他们只是给人们已有的心理防御机制打了补丁，让曾经就已经有的藩篱更加难以逾越。", "en": "Information capital did not create an information cocoon out of thin air; they merely patched people's existing psychological defence mechanisms, making the fences that already existed even harder to cross."}, {"start": 181.56, "end": 185.69, "text": "把内容推送关了，固然可以让我们接收更多元化的信息。", "en": "Turning off content recommendations can certainly let us receive more diverse information."}, {"start": 185.69, "end": 189.22, "text": "但是想要彻底打破信息茧房，光这么做还不够。", "en": "But to thoroughly break the information cocoon, doing only this is not enough."}, {"start": 189.22, "end": 193.06, "text": "我们还要处理我们客户端的问题，也就是我们精神结构的问题。", "en": "We must also deal with our client-side problem — that is, the problem of our psychic structure."}, {"start": 193.06, "end": 200.3, "text": "到这里，熟悉拉黑齐的朋友们，应该会想到拉康精神分析最关键的环节：穿越幻象。", "en": "At this point, friends familiar with Lacan should think of the most crucial link in Lacanian psychoanalysis: traversing the fantasy."}, {"start": 200.3, "end": 206.62, "text": "理解穿越幻象解决了开头“敢不敢”的问题，坚持穿越幻象的实践解决了“如何”的问题。", "en": "Understanding traversing the fantasy solves the opening 'dare or not dare' problem; persisting in the practice of traversing the fantasy solves the 'how' problem."}, {"start": 206.62, "end": 213.17, "text": "这个答案写到这里就结束其实相当不负责任，因为我只是把题目换成了“如何穿越幻象”。", "en": "Ending this answer here would actually be quite irresponsible, because I have only replaced the question with 'how to traverse the fantasy'."}, {"start": 213.17, "end": 218.26, "text": "但是关于穿越幻象的回答已经有珠玉在前了，推荐这个答案：", "en": "But answers about traversing the fantasy already have excellent predecessors; I recommend this answer:"}, {"start": 218.26, "end": 221.81, "text": "1、在钱有余力的情况下，去国外实地感受一下。", "en": "1. If you have spare money, go abroad and experience it in person."}, {"start": 221.81, "end": 224.28, "text": "2、科学上网。", "en": "2. Bypass the firewall scientifically."}, {"start": 224.28, "end": 227.81, "text": "3、多看国内一些非主流报道的文章。", "en": "3. Read more non-mainstream domestic reporting."}, {"start": 227.81, "end": 230.62, "text": "4、和主流媒体的思路反着来。", "en": "4. Go against the thinking of mainstream media."}, {"start": 230.62, "end": 238.22, "text": "我刷短视频时，从来都没刷到过小姐姐的视频，映入我眼帘的都是赚钱、营销、人性相关的。", "en": "When I scroll short videos, I have never scrolled to videos of pretty girls; what meets my eyes is all about making money, marketing and human nature."}, {"start": 238.22, "end": 244.3, "text": "即使我搜索“美女”，也都是分析这些美女都是如何利用美色赚钱的，而不是美女视频本身。", "en": "Even when I search 'beautiful women', the results are all analyses of how these beautiful women use their looks to make money, not videos of beautiful women themselves."}, {"start": 244.3, "end": 249.65, "text": "换句话说，在短视频平台里，好像我是一个对女色完全不感兴趣的机器人。", "en": "In other words, on short-video platforms, I seem to be a robot completely uninterested in female beauty."}, {"start": 249.65, "end": 265.49, "text": "当我卸载软件，重新下载短视频软件、还没有登录账号的时候，我就发现，给我推送的视频除了是美女跳舞，就是那些吸引人眼球的新闻事件（比如淄博烧烤、大熊猫回国、五一景区挤满了游客这些）。", "en": "When I uninstalled the app, re-downloaded the short-video app and had not yet logged into an account, I found that the videos pushed to me were either girls dancing or eye-catching news events (such as Zibo barbecue, the giant pandas returning home, and May Day scenic spots packed with tourists)."}, {"start": 265.49, "end": 270.84, "text": "但是当我登录短视频软件之后，就只给我推送特定几类视频内容了。", "en": "But after I logged into the short-video app, it only pushed me a few specific categories of video content."}, {"start": 270.84, "end": 280.99, "text": "大家看懂了吗，互联网时代，只要不刻意抵抗，那么我们每个人都会被特定类型的信息包裹、洗脑，而且根本看不到其他类型的信息。", "en": "Do you all understand? In the internet age, as long as you do not deliberately resist, each of us will be wrapped and brainwashed by specific types of information, and cannot see other types of information at all."}, {"start": 280.99, "end": 282.74, "text": "信息茧房就形成了。", "en": "The information cocoon has formed."}, {"start": 282.74, "end": 289.46, "text": "每个人筛选、处理、吸收信息的能力不同，人就会被分成三六九等。", "en": "People differ in their ability to filter, process and absorb information, and people will be divided into ranks."}, {"start": 289.46, "end": 295.63, "text": "长此以往，人与人之间会出现一个可怕的分化，大家的差距会越来越大。", "en": "Over time, a terrible differentiation will appear between people, and everyone's gaps will grow larger and larger."}, {"start": 295.63, "end": 306.0, "text": "当然，我并不是说整天在网上研究赚钱、研究营销、研究人性的人就高人一等，而是说，这样的人赚钱可能稍微容易一些。", "en": "Of course, I am not saying that people who spend all day online studying money-making, marketing and human nature are superior; I am saying that such people may find it slightly easier to make money."}, {"start": 306.0, "end": 312.17, "text": "而那些整天刷小姐姐跳舞视频的人，他们的审美能力可能会有所提升。", "en": "And those who spend all day scrolling videos of pretty girls dancing may improve their aesthetic ability."}, {"start": 312.17, "end": 318.0, "text": "在传统媒体时代，有这样一种说法：你的注意力在哪里，成长就在哪里。", "en": "In the traditional media era, there was a saying: where your attention is, there your growth is."}, {"start": 318.0, "end": 330.72, "text": "但是在新媒体时代，这句话得改了：你的注意力在哪里，那么大数据就会持续给你推送什么，长期被这类信息投喂之后，你就会变成这种特定信息的奴隶。", "en": "But in the new media era, this saying must be changed: where your attention is, big data will keep pushing you that; after being fed such information for a long time, you will become a slave to that specific information."}, {"start": 330.72, "end": 341.93, "text": "物质层面，有句话叫“人如其食”，精神层面其实也是成立的：我们每天吃什么精神食粮，摄入什么特定的信息，那么我们就会变成什么样的人。", "en": "On the material level, there is a saying 'you are what you eat'; on the spiritual level it also holds: what spiritual food we eat every day, what specific information we take in, is what kind of person we will become."}, {"start": 341.93, "end": 348.84, "text": "每天关注赚钱信息的人，会越来越有钱；每天关注不赚钱信息的人，会越来越穷。", "en": "People who focus on money-making information every day will become richer and richer; people who focus on non-money-making information every day will become poorer and poorer."}, {"start": 348.84, "end": 350.28, "text": "逻辑非常简单。", "en": "The logic is very simple."}, {"start": 350.28, "end": 362.11, "text": "这就是为什么在20年前，每个人谈论的事情都差不多，甚至大家表情都是一样的，每天都是乐呵呵的，因为大家都是看同样的电视节目、听同样的收音机电台。", "en": "This is why 20 years ago, everyone talked about roughly the same things, and even everyone's expressions were the same, cheerful every day, because everyone watched the same TV programmes and listened to the same radio stations."}, {"start": 362.11, "end": 365.71, "text": "但是到了互联网时代，人和人之间的分化就越来越大。", "en": "But in the internet age, the differentiation between people has grown larger and larger."}, {"start": 365.71, "end": 376.51, "text": "同一间教室里的同学、同一个办公室里的同事，每个人的认知、思考能力、处理信息的能力差异巨大，那么将来大家的成就也是千差万别的。", "en": "Classmates in the same classroom and colleagues in the same office differ hugely in cognition, thinking ability and information-processing ability, so their future achievements will also vary enormously."}, {"start": 376.51, "end": 386.23, "text": "有的人数十年蜷缩在一个狭小的信息茧房里不肯出来，委顿不堪；而有的人却畅游在广阔的信息海洋里，非常自在。", "en": "Some people curl up for decades in a narrow information cocoon, unwilling to come out, dejected and worn; while others swim freely in the vast ocean of information, very much at ease."}, {"start": 386.23, "end": 396.5, "text": "那么问题来了，我们该如何刺穿信息茧房、让自己的大脑不受特定信息的禁锢，从而让自己的思维更加开阔、收入更加丰厚呢？", "en": "So the question is: how can we pierce the information cocoon, free our brains from the imprisonment of specific information, and thereby make our thinking broader and our income richer?"}, {"start": 396.5, "end": 402.7, "text": "我自己有6条经验跟大家分享，前3条免费阅读，后3条比较值钱，需要付费阅读：", "en": "I have 6 pieces of experience to share with you. The first 3 are free to read; the last 3 are more valuable and require paid reading:"}, {"start": 402.7, "end": 406.13, "text": "① 尝试从多种渠道获取信息", "en": "① Try to obtain information from multiple channels."}, {"start": 406.13, "end": 411.6, "text": "比如我刚才提到的收音机，几乎是这个时代唯一不受大数据操控的平台了。", "en": "For example, the radio I just mentioned is almost the only platform in this era not manipulated by big data."}, {"start": 411.6, "end": 418.32, "text": "我每天健身的时候都会听收音机，大家不要以为收音机是上个世纪的产物，早就过时了。", "en": "I listen to the radio every day when I work out. Do not think the radio is a product of the last century and long outdated."}, {"start": 418.32, "end": 424.2, "text": "错了，现在收音机的受众是年轻的有车一族，是中产。", "en": "Wrong: today's radio audience is young car owners — the middle class."}, {"start": 424.2, "end": 428.71, "text": "他们的品味、购买力都是中等偏上的。", "en": "Their taste and purchasing power are both above average."}, {"start": 428.71, "end": 431.78, "text": "你以为现在收音机里除了评书就是卖假药的吗？", "en": "Do you think today's radio has nothing but storytelling and fake-medicine ads?"}, {"start": 431.78, "end": 438.07, "text": "收音机节目质量并不低，至少在我看来，比刷短视频有意思多了，还省眼睛。", "en": "Radio programme quality is not low; at least in my view, it is much more interesting than scrolling short videos, and easier on the eyes."}, {"start": 438.07, "end": 444.91, "text": "比如昨天我听了一个节目，就是讲马斯克发家史的，今天听了一个节目，是讲新型互联网诈骗的案例。", "en": "For example, yesterday I listened to a programme about Musk's rise to fortune; today I listened to a programme about new internet fraud cases."}, {"start": 444.91, "end": 455.71, "text": "上午九点我也会听健康节目，大家不要以为是那种卖假药的砖家，现在的电台都有自己的公众号和抖音，如果他们敢请卖假药的砖家来做节目，会被骂死的。", "en": "At nine in the morning I also listen to health programmes. Do not think they are the kind of fake-medicine 'experts'; today's radio stations all have their own official accounts and Douyin — if they dared to invite fake-medicine 'experts' onto programmes, they would be scolded to death."}, {"start": 455.71, "end": 465.38, "text": "现在电台的健康节目，请的都是三甲医院的主任，而且大多数都是有留学背景的博士、博士后，讲的都是现代医学。", "en": "Today's radio health programmes invite directors from top-tier hospitals, most of whom are doctors and postdocs with overseas study backgrounds, talking about modern medicine."}, {"start": 465.38, "end": 473.18, "text": "比如，有一期就是讲“幽门螺杆菌”的，医生讲的内容，除了有自己的临床案例，还有柳叶刀杂志的最新报道。", "en": "For example, one episode was about 'Helicobacter pylori'. Besides the doctor's own clinical cases, the content also included the latest reports from The Lancet magazine."}, {"start": 473.18, "end": 475.94, "text": "② 没事多去逛图书馆、书店", "en": "② Take time to browse libraries and bookstores."}, {"start": 475.94, "end": 482.5, "text": "我每天都需要写东西，但是我的脑子里也没有多少存货，所以我也需要“站在巨人的肩膀上”。", "en": "I need to write every day, but my mind does not have much stock either, so I also need to 'stand on the shoulders of giants'."}, {"start": 482.5, "end": 488.09, "text": "所以，我偶尔就会去大型图书馆或者书店乱逛，而且每次都是收获巨大。", "en": "So I occasionally wander around large libraries or bookstores, and each time the harvest is huge."}, {"start": 488.09, "end": 493.92, "text": "我之所以用“乱逛”这个词，因为这件事有很大的随机性，不受大数据约束。", "en": "The reason I use the word 'wander' is that this has great randomness and is not constrained by big data."}, {"start": 493.92, "end": 503.81, "text": "我撞到一本书就会随手翻翻，而且基本上在5分钟内我就能确定这本书讲的是什么内容，15分钟内我就能把这本书的精华给提取出来了。", "en": "When I bump into a book, I flip through it casually, and basically within 5 minutes I can determine what the book is about, and within 15 minutes I can extract the essence of the book."}, {"start": 503.81, "end": 519.96, "text": "更绝的是，我能把这些精华直接转化成钱（至少500元），具体的做法就是：用手机记录下大概内容（100字之内），回家就直接结合自己的经历，写成了一篇付费阅读文章。", "en": "Even better, I can directly convert these essences into money (at least 500 yuan). The specific method is: use my phone to record the general content (within 100 words), go home and directly combine it with my own experience to write a paid-reading article."}, {"start": 519.96, "end": 528.05, "text": "所以，每当有人让我推荐书籍是，我都回答说：读书没用，我已经很久不读书了，但是我经常“乱翻书”。", "en": "So whenever someone asks me to recommend books, I answer: reading is useless; I have not read books for a long time, but I often 'randomly flip through books'."}, {"start": 528.05, "end": 538.32, "text": "另外，大家不要以为我看点书就直接用来卖钱太庸俗，要知道，知识和思维，如果你不能“为我所用”，那就不算是我的。", "en": "Also, do not think it is vulgar that I read a bit and directly use it to sell money. You should know: knowledge and thinking, if you cannot 'use them for yourself', do not count as yours."}, {"start": 538.32, "end": 542.45, "text": "所以，逛书店绝对是刺破信息茧房的利器。", "en": "So browsing bookstores is definitely a sharp tool for piercing the information cocoon."}, {"start": 542.45, "end": 544.18, "text": "③ 多旅行", "en": "③ Travel more."}, {"start": 544.18, "end": 550.13, "text": "我之前说过一个比较玄的观点：人的地理空间打开了，心理空间才能打开。", "en": "I have previously stated a rather mystical view: only when a person's geographical space opens up can their psychological space open up."}, {"start": 550.13, "end": 551.21, "text": "什么意思？", "en": "What does that mean?"}, {"start": 551.21, "end": 555.24, "text": "就是说，行万里路比读万卷书还重要。", "en": "It means travelling ten thousand miles is more important than reading ten thousand books."}, {"start": 555.24, "end": 566.21, "text": "举个例子，之前很多媒体带节奏黑韩国（区别对待），最近又开始黑泰国（嘎腰子），黑美国动物园（虐待熊猫）。", "en": "For example, previously many media hyped up smearing South Korea (differential treatment), and recently started smearing Thailand (kidney harvesting) and American zoos (abusing pandas)."}, {"start": 566.21, "end": 567.46, "text": "真实情况呢？", "en": "What is the real situation?"}, {"start": 567.46, "end": 581.42, "text": "我不好在公众号里说，你想要了解真实情况，只有一种办法：去当地出入境管理局申请护照，然后分别申请韩国、泰国、美国的签证，然后买机票飞过去，亲自考察。", "en": "I cannot say it well on my official account. If you want to understand the real situation, there is only one way: go to the local entry-exit administration to apply for a passport, then apply for visas for South Korea, Thailand and the United States respectively, buy plane tickets and fly there to investigate in person."}, {"start": 581.42, "end": 588.62, "text": "有人会说，看网上的报道不就行了吗，如果不相信新闻的报道，去关注那些在外国的主播也行啊。", "en": "Some people will say: isn't it enough to read online reports? If you do not believe news reports, you can follow streamers abroad."}, {"start": 588.62, "end": 591.38, "text": "我想说，错了，不行。", "en": "I want to say: wrong, no."}, {"start": 591.38, "end": 599.86, "text": "任何一个媒体、一个个人，都是有偏向性的，即使是你亲爹在国外生活，他说的话你也不要相信。", "en": "Any media or individual has biases; even if your own father lives abroad, do not believe what he says."}, {"start": 599.86, "end": 603.58, "text": "想要了解真实情况，必须你亲自把肉身挪过去。", "en": "To understand the real situation, you must personally move your body there."}, {"start": 603.58, "end": 605.26, "text": "没有第二种办法。", "en": "There is no second way."}, {"start": 605.26, "end": 608.3, "text": "点此继续阅读剩余部分", "en": "Click here to continue reading the remaining part."}]}, {"title": "怎样避免活在信息茧房之中？ Part 11（70句，6:33）", "mp3": "upload-8-part11/audio.mp3", "dur": "6:33", "lines": [{"start": 0.0, "end": 10.13, "text": "信息茧房这个概念有一个默认的前提，即一个人只要能够获取更多的信息，就自然不会被茧房所束缚，可以看到更真实的世界。", "en": "The concept of the information cocoon has a default premise: that as long as a person can obtain more information, they will naturally not be bound by the cocoon and can see a more real world."}, {"start": 10.13, "end": 11.88, "text": "但这个假设真的成立吗？", "en": "But does this assumption really hold?"}, {"start": 11.88, "end": 26.83, "text": "你让一个小学生去听一场当前最高水平的人工智能技术的发布会，他的确接触到了最高质量的信息，但是这对他来说没什么用，因为以他目前的知识水平，他完全听不懂。", "en": "If you let a primary school pupil listen to a launch event for the current highest-level artificial intelligence technology, they will indeed be exposed to the highest-quality information, but it will be of little use to them, because at their current level of knowledge, they cannot understand it at all."}, {"start": 26.83, "end": 31.15, "text": "而换成一个这个领域的博士或者教授，他们就可以听懂。", "en": "But swap in a doctor or professor in this field, and they can understand it."}, {"start": 31.15, "end": 33.72, "text": "对于他们来说，这就是有用的信息增量。", "en": "For them, this is useful information increment."}, {"start": 33.72, "end": 40.25, "text": "显然，信息的价值从来不取决于信息本身的质量，而取决于接收者的认知框架能否承载它。", "en": "Clearly, the value of information never depends on the quality of the information itself, but on whether the receiver's cognitive framework can carry it."}, {"start": 40.25, "end": 48.82, "text": "心理学中有“图式“的概念，它就是人脑中预先存在的认知框架，决定了人如何筛选、编码和理解新信息。", "en": "Psychology has the concept of 'schema': the pre-existing cognitive framework in the human brain that determines how people filter, encode and understand new information."}, {"start": 48.82, "end": 59.09, "text": "当外部信息进入大脑时，图式就像一个过滤器——符合框架的，被吸收；不符合框架的，要么被忽略，要么被曲解，要么直接等于不存在。", "en": "When external information enters the brain, the schema acts like a filter — what fits the framework is absorbed; what does not fit is either ignored, distorted, or simply treated as non-existent."}, {"start": 59.09, "end": 66.6, "text": "所以，当小学生坐在AI发布会现场时，那些技术演讲对他来说，就等于不存在。", "en": "So when the primary school pupil sits at the AI launch event, those technical speeches are, for them, equivalent to non-existent."}, {"start": 66.6, "end": 71.16, "text": "因为他的认知框架里没有相应的概念，无法理解、编码这些信息。", "en": "Because there are no corresponding concepts in their cognitive framework, they cannot understand or encode this information."}, {"start": 71.16, "end": 79.08, "text": "同样的信息，对博士来说，却是有价值的增量，因为他的图式已经准备好了接收和处理的容器。", "en": "The same information, for the doctor, is a valuable increment, because their schema already has containers prepared to receive and process it."}, {"start": 79.08, "end": 81.89, "text": "这个道理放得更远一点，也同样成立。", "en": "This principle holds even further afield."}, {"start": 81.89, "end": 92.62, "text": "理论上，一个从未去过美国的中国经济学家对美国经济的了解程度，要远远超过在美国生活了几十年却对经济学知识不甚了解的美国土著。", "en": "In theory, a Chinese economist who has never been to America understands the American economy far better than an American native who has lived in America for decades but knows little about economics."}, {"start": 92.62, "end": 103.46, "text": "因为前者有经济学的认知框架，能把零散的现象系统化地理解；后者虽然身处其中，但缺乏框架，看到的只是现象，而非规律。", "en": "Because the former has an economics cognitive framework and can systematically understand scattered phenomena; the latter, though immersed in it, lacks a framework and sees only phenomena, not patterns."}, {"start": 103.46, "end": 109.99, "text": "认知框架先于信息接触存在，这才是信息茧房的真正本质。", "en": "That the cognitive framework exists prior to information contact is the true essence of the information cocoon."}, {"start": 109.99, "end": 116.35, "text": "现实中信息茧房的普遍性正在于人总是会优先接受那些自己认同的信息。", "en": "The universality of the information cocoon in reality lies precisely in that people always prioritise accepting information they agree with."}, {"start": 116.35, "end": 126.98, "text": "比如你是一个明星的铁粉，那么当这个明星的黑料爆出的时候，你可能首先想的不是他是不是隐瞒了什么，而是这肯定是哪个对家挖的坑。", "en": "For example, if you are a die-hard fan of a celebrity, when dirt about this celebrity breaks, your first thought may not be whether they hid something, but that this must be a trap dug by some rival camp."}, {"start": 126.98, "end": 131.35, "text": "这是因为你的认知框架已经把你锁在了一个特定的解释系统里。", "en": "This is because your cognitive framework has already locked you into a specific explanatory system."}, {"start": 131.35, "end": 135.6, "text": "传播学中还有个名词描述这种现象——回声壁效应。", "en": "Communication studies has another term to describe this phenomenon — the echo chamber effect."}, {"start": 135.6, "end": 144.89, "text": "也就是说，人们倾向于接触那些符合自己既有观点的信息，从而在一个封闭的认知环境里不断强化自己的信念。", "en": "That is, people tend to access information that matches their existing views, thereby continuously reinforcing their beliefs in a closed cognitive environment."}, {"start": 144.89, "end": 154.25, "text": "算法推荐机制只是放大了这种倾向，但根源在于人本身的选择性——人从来都不是被动的信息接收者，而是主动的信息筛选者。", "en": "Algorithmic recommendation merely amplifies this tendency, but the root lies in human selectivity itself — humans have never been passive information receivers, but active information filters."}, {"start": 154.25, "end": 158.74, "text": "这就是为什么单纯获取更多信息无法打破信息茧房的原因。", "en": "This is why simply obtaining more information cannot break the information cocoon."}, {"start": 158.74, "end": 163.85, "text": "如果你的框架不变，那么再多信息，也只是在你既有的茧房里打转。", "en": "If your framework does not change, then no matter how much information you have, it only circles within your existing cocoon."}, {"start": 163.85, "end": 169.66, "text": "事实上，一个更反直觉的现象是，信息越丰富，人越容易困在茧房里。", "en": "In fact, a more counterintuitive phenomenon is that the richer the information, the easier it is for people to be trapped in the cocoon."}, {"start": 169.66, "end": 174.34, "text": "这不是因为信息少了，而是因为认知框架筛选的能力更强了。", "en": "This is not because there is less information, but because the cognitive framework's ability to filter is stronger."}, {"start": 174.34, "end": 182.14, "text": "当你可以轻易找到海量支持你观点的内容时，你的认知框架会更自信地排除那些异质信息。", "en": "When you can easily find massive amounts of content supporting your views, your cognitive framework will more confidently exclude heterogeneous information."}, {"start": 182.14, "end": 186.98, "text": "你看到的世界，其实是你认知框架筛选后的投影。", "en": "The world you see is actually a projection filtered by your cognitive framework."}, {"start": 186.98, "end": 190.22, "text": "破茧的关键在于拓展认知框架本身。", "en": "The key to breaking out of the cocoon lies in expanding the cognitive framework itself."}, {"start": 190.22, "end": 191.38, "text": "具体怎么做？", "en": "How, specifically?"}, {"start": 191.38, "end": 193.06, "text": "可以从三个层面入手。", "en": "You can start from three levels."}, {"start": 193.06, "end": 197.18, "text": "第一个层面：从信息搜寻转向框架审视。", "en": "The first level: shift from information seeking to framework examination."}, {"start": 197.18, "end": 207.38, "text": "大多数人打破信息茧房的方式是多看不同观点——看左派媒体，也看右派媒体；看支持者的评论，也看反对者的评论。", "en": "Most people's way of breaking the information cocoon is to look at different views — reading left-wing media as well as right-wing media; reading supporters' comments as well as opponents' comments."}, {"start": 207.38, "end": 210.46, "text": "这种方式听起来很合理，但往往效果有限。", "en": "This approach sounds reasonable, but its effect is often limited."}, {"start": 210.46, "end": 219.22, "text": "因为如果你的认知框架足够强大，你会发现：你可以从两边都找到支持自己观点的证据，然后更加确信自己是对的。", "en": "Because if your cognitive framework is strong enough, you will find that you can find evidence supporting your own views from both sides, and then become even more convinced that you are right."}, {"start": 219.22, "end": 222.98, "text": "更有效的方式是：定期检视自己的底层假设。", "en": "A more effective way is: regularly examine your own underlying assumptions."}, {"start": 222.98, "end": 226.99, "text": "问自己一些元认知的问题：我为什么会这样想？", "en": "Ask yourself some metacognitive questions: Why do I think this way?"}, {"start": 226.99, "end": 228.84, "text": "这个观点的依据是什么？", "en": "What is the basis for this view?"}, {"start": 228.84, "end": 230.93, "text": "如果我错了，可能是因为什么？", "en": "If I am wrong, what might it be because of?"}, {"start": 230.93, "end": 238.06, "text": "这不是在让你怀疑一切，而是在让你意识到：自己的认知框架本身是需要被审视的。", "en": "This is not asking you to doubt everything, but to make you realise that your own cognitive framework itself needs to be examined."}, {"start": 238.06, "end": 245.5, "text": "当你能把自己的认知框架当作一个对象来观察时，你就已经走出了茧房的第一步。", "en": "When you can treat your own cognitive framework as an object to observe, you have already taken the first step out of the cocoon."}, {"start": 245.5, "end": 248.38, "text": "第二个层面：建立认知弹性。", "en": "The second level: build cognitive flexibility."}, {"start": 248.38, "end": 252.94, "text": "认知弹性，指的是认知框架容纳异质信息的能力。", "en": "Cognitive flexibility refers to the ability of a cognitive framework to accommodate heterogeneous information."}, {"start": 252.94, "end": 258.5, "text": "一个有认知弹性的人，不是没有自己的观点，而是愿意让自己的观点接触挑战。", "en": "A person with cognitive flexibility does not lack their own views, but is willing to let their views encounter challenges."}, {"start": 258.5, "end": 265.03, "text": "刻意接触那些让认知不适的信息，不是为了接受它，而是为了测试自己的框架边界。", "en": "Deliberately exposing yourself to information that causes cognitive discomfort is not about accepting it, but about testing the boundaries of your framework."}, {"start": 265.03, "end": 269.64, "text": "就像给一根绳子拉一拉，看看它还能承受多大的张力。", "en": "It is like pulling on a rope to see how much tension it can still bear."}, {"start": 269.64, "end": 275.04, "text": "如果一碰就断，说明框架太脆弱；如果能承受拉扯，说明框架有一定的弹性。", "en": "If it breaks at a touch, the framework is too fragile; if it can withstand the pulling, the framework has some flexibility."}, {"start": 275.04, "end": 279.17, "text": "需要注意的是，这里的关键不是接受，而是接触。", "en": "What needs attention here is that the key is not acceptance, but exposure."}, {"start": 279.17, "end": 287.45, "text": "你可以听完一个完全不同立场的观点，然后依然坚持自己的判断，但这个过程中，你的认知框架已经被锻炼了一次。", "en": "You can listen to a view from a completely different position, and still insist on your own judgment, but in this process, your cognitive framework has already been exercised once."}, {"start": 287.45, "end": 289.66, "text": "它变得更坚韧，也更开放。", "en": "It becomes more resilient, and also more open."}, {"start": 289.66, "end": 293.14, "text": "第三个层面：培养元认知能力。", "en": "The third level: cultivate metacognitive ability."}, {"start": 293.14, "end": 296.02, "text": "元认知，简单说就是对思考的思考。", "en": "Metacognition, simply put, is thinking about thinking."}, {"start": 296.02, "end": 300.38, "text": "观察自己如何观察世界，识别我为什么会这样想。", "en": "Observing how you observe the world, and identifying why you think the way you do."}, {"start": 300.38, "end": 302.35, "text": "这是一个可以训练的能力。", "en": "This is an ability that can be trained."}, {"start": 302.35, "end": 308.78, "text": "比如，当你对某条新闻产生强烈反应时，暂停一下，问自己：我为什么这么激动？", "en": "For example, when you have a strong reaction to a piece of news, pause and ask yourself: Why am I so excited?"}, {"start": 308.78, "end": 310.9, "text": "这个话题触动了我什么？", "en": "What has this topic touched in me?"}, {"start": 310.9, "end": 313.25, "text": "我的情绪是不是在影响我的判断？", "en": "Are my emotions affecting my judgment?"}, {"start": 313.25, "end": 319.18, "text": "再比如，当你发现自己总是在回避某种类型的信息时，问自己：我在怕什么？", "en": "For another example, when you find yourself always avoiding a certain type of information, ask yourself: What am I afraid of?"}, {"start": 319.18, "end": 321.34, "text": "这些信息会挑战我的什么信念？", "en": "What beliefs of mine would this information challenge?"}, {"start": 321.34, "end": 331.18, "text": "元认知能力不是天生的，但一旦你开始有意识地培养这种能力，你会发现自己对自己的认知过程有了更多的掌控感。", "en": "Metacognitive ability is not innate, but once you consciously start cultivating it, you will find you have more sense of control over your own cognitive process."}, {"start": 331.18, "end": 336.82, "text": "你不是被情绪和直觉推着走，而是能站在更高处，观察自己的思维活动。", "en": "You are not pushed along by emotions and intuition, but can stand higher and observe your own mental activities."}, {"start": 336.82, "end": 343.18, "text": "说到底，真正的自由不是逃离茧房，而是拥有不被单一认知框架囚禁的能力。", "en": "In the end, true freedom is not escaping the cocoon, but possessing the ability not to be imprisoned by a single cognitive framework."}, {"start": 343.18, "end": 345.7, "text": "这个世界上不存在没有框架的人。", "en": "There is no person in this world without a framework."}, {"start": 345.7, "end": 351.14, "text": "我们每个人，都必须依赖某种认知框架来理解和行动。", "en": "Each of us must rely on some cognitive framework to understand and act."}, {"start": 351.14, "end": 358.27, "text": "问题不在于有没有框架，而在于这个框架是封闭的、刚性的，还是开放的、可成长的。", "en": "The question is not whether there is a framework, but whether the framework is closed and rigid, or open and capable of growth."}, {"start": 358.27, "end": 363.31, "text": "拓展认知框架的过程，本质上是一个不断与自己对话的过程。", "en": "The process of expanding the cognitive framework is essentially a process of constantly dialoguing with yourself."}, {"start": 363.31, "end": 370.75, "text": "你需要承认自己认知的局限，接受自己的框架需要升级，然后在这个过程中，让自己的世界一点点变大。", "en": "You need to acknowledge the limitations of your cognition, accept that your framework needs upgrading, and in this process, let your world grow a little bigger."}, {"start": 370.75, "end": 372.55, "text": "这不是一个轻松的过程。", "en": "This is not an easy process."}, {"start": 372.55, "end": 377.42, "text": "承认自己的认知可能有偏差，比坚持自己没错要难得多。", "en": "Admitting that your cognition may be biased is much harder than insisting that you are right."}, {"start": 377.42, "end": 383.71, "text": "接受一个与自己长期信念不符的观点，比找到支持自己的证据要让人不适得多。", "en": "Accepting a view inconsistent with your long-held beliefs is much more uncomfortable than finding evidence supporting yourself."}, {"start": 383.71, "end": 393.55, "text": "只有当你愿意不断拓展这个边界时，才真正活在一个开放的世界里，而不是一个由自己的认知框架精心编织的茧房里。", "en": "Only when you are willing to continuously expand this boundary do you truly live in an open world, rather than in a cocoon carefully woven by your own cognitive framework."}]}, {"title": "怎样避免活在信息茧房之中？ Part 12（71句，7:47）", "mp3": "upload-8-part12/audio.mp3", "dur": "7:47", "lines": [{"start": 0.0, "end": 9.48, "text": "比如说，研究中国历史，无论哪个时期，都一定要参考外国史料，外国人的游记，回忆录等等，才能得到正确信息。", "en": "For example, when studying Chinese history, no matter which period, you must consult foreign historical materials, foreigners' travel notes, memoirs and so on, in order to obtain correct information."}, {"start": 9.48, "end": 14.16, "text": "如果你只看官史，正史，那就是活在信息茧房里。", "en": "If you only read official histories and orthodox histories, you are living in an information cocoon."}, {"start": 14.16, "end": 15.07, "text": "谢邀。", "en": "Thanks for the invitation."}, {"start": 15.07, "end": 26.3, "text": "首先意识到自己在信息茧房中，是一件好事，我曾陷入信息茧房一段时间，那时候觉得整个人都魔怔了，感觉没有了自己的主见。", "en": "First realising that you are in an information cocoon is a good thing. I was once trapped in an information cocoon for a while; at that time I felt the whole person had become obsessed, feeling I had lost my own opinions."}, {"start": 26.3, "end": 30.5, "text": "摆脱信息茧房，第一件要做的事情就是不看推荐内容。", "en": "The first thing to do to escape the information cocoon is to stop watching recommended content."}, {"start": 30.5, "end": 36.19, "text": "包括知乎的推荐，B站的首页推荐，以及其他有算法推荐的内容。", "en": "Including Zhihu recommendations, Bilibili homepage recommendations, and other algorithm-recommended content."}, {"start": 36.19, "end": 40.15, "text": "如果觉得知乎的热榜不够看，就关注一些优秀回答者：", "en": "If you find Zhihu's hot list insufficient, follow some excellent answerers:"}, {"start": 40.15, "end": 48.79, "text": "第二件事，就是找到自己兴趣的方向，这个方向的问题是可以给你带来正向情绪的，而不是越看越难受的。", "en": "The second thing is to find a direction of interest for yourself — a direction whose questions can bring you positive emotions, rather than making you feel worse the more you read."}, {"start": 48.79, "end": 53.66, "text": "多搜索这样的内容，在有价值的回答下面点赞和评论。", "en": "Search more for such content, and like and comment under valuable answers."}, {"start": 53.66, "end": 61.34, "text": "然后回头再看一眼推荐，就会发现推荐的内容有所改变，这样可以利用算法推荐为你提供对你有效的内容", "en": "Then look back at recommendations, and you will find the recommended content has changed; this way you can use algorithmic recommendations to provide you with content that is effective for you."}, {"start": 61.34, "end": 69.94, "text": "第三件事，多与朋友讨论一些问题，问问他们的看法，不同行业的人会对一些问题有不一样的观点，说不定让你耳目一新", "en": "The third thing is to discuss some issues with friends more, and ask their opinions. People from different industries will have different views on some issues, which may refresh you."}, {"start": 69.94, "end": 83.86, "text": "第四件事，永远保持开放的状态，接纳不同的信息与观点，通过自己的知识体系进行分析，最好能够将这些分析思考的过程写下来，回头再翻看这些思考过程，说不定可以让自己温故而知新。", "en": "The fourth thing is to always stay open, accept different information and views, analyse them through your own knowledge system, and preferably write down the process of analysis and thinking. Looking back at these thinking processes later may let you review the old and learn the new."}, {"start": 83.86, "end": 85.66, "text": "多看英文信息。", "en": "Read more English information."}, {"start": 85.66, "end": 91.78, "text": "世界网路上的信息百分之五十五是英语；百分之一点四是汉语。", "en": "55% of information on the world's internet is in English; 1.4% is in Chinese."}, {"start": 91.78, "end": 94.9, "text": "波兰语在网路世界都比汉语通用。", "en": "Even Polish is more widely used on the internet than Chinese."}, {"start": 94.9, "end": 103.25, "text": "不见得能读英语说英语的人就不活在信息茧房，但是假如你只会说中文读中文，你一定活在信息茧房，这个毋庸置疑。", "en": "It is not necessarily true that people who can read and speak English do not live in an information cocoon, but if you can only speak and read Chinese, you definitely live in an information cocoon — of that there is no doubt."}, {"start": 103.25, "end": 111.29, "text": "顺便说个题外话，你还真别小看俄罗斯，俄罗斯虽然被西方国家搞成这副德行，俄语还是网路第三大语言。", "en": "By the way, do not underestimate Russia. Although Russia has been made into this state by Western countries, Russian is still the third largest language on the internet."}, {"start": 111.29, "end": 117.05, "text": "而且俄罗斯文学与政治宣传一向对西方世界有强大的影响力。", "en": "Moreover, Russian literature and political propaganda have always had a powerful influence on the Western world."}, {"start": 117.05, "end": 127.56, "text": "以前我在RT上看过俄罗斯记者说“东方大国是经济的巨人，政治的侏儒，而俄罗斯是经济的侏儒，政治的巨人”这个评价基本上没错。", "en": "I once saw a Russian journalist on RT say: 'The Eastern great power is an economic giant and a political dwarf, while Russia is an economic dwarf and a political giant.' This assessment is basically correct."}, {"start": 127.56, "end": 130.13, "text": "办法自然是直白且粗陋的。", "en": "The method is naturally straightforward and crude."}, {"start": 130.13, "end": 133.2, "text": "因为大道至简，你就给我直接退出。", "en": "Because the great way is simple: just log out directly."}, {"start": 133.2, "end": 138.96, "text": "就拿知乎来说，作为这两年的重度用户，为了不让自己深陷信息糖果的漩涡。", "en": "Take Zhihu, for example. As a heavy user these past two years, in order not to sink deep into the vortex of information candy."}, {"start": 138.96, "end": 141.67, "text": "我刷知乎的时候，都是未登录状态。", "en": "When I browse Zhihu, I am always logged out."}, {"start": 141.67, "end": 144.14, "text": "我直接退出账号，我就是个游客。", "en": "I log out of my account directly; I am just a visitor."}, {"start": 144.14, "end": 150.38, "text": "所以，在情感类话题上，我既可以看到男人的想法，我也可以看到女性的想法；", "en": "So, on emotional topics, I can see both men's thoughts and women's thoughts;"}, {"start": 150.38, "end": 158.38, "text": "在政治上，我既可以看到左，也可以看到右，还可以看到绝大多数不明就里的纯扯蛋；", "en": "On politics, I can see the left, the right, and also the vast majority who have no idea what is going on and are just talking nonsense;"}, {"start": 158.38, "end": 166.97, "text": "在时事上，我既可以看到冷静的分析，也可以看到幼稚的自以为是，更多的是绝望的抖机灵；", "en": "On current affairs, I can see calm analysis, naive self-righteousness, and even more hopeless attempts at wit;"}, {"start": 166.97, "end": 177.22, "text": "在文化上，我既可以看到专注于某个领域的痴人，也可以看到招摇撞骗的竖子，更多的是学艺三分却自诩专家的自信之人；", "en": "On culture, I can see obsessives focused on a particular field, swindling scoundrels, and even more people who learned a third of a skill yet call themselves experts with confidence;"}, {"start": 177.22, "end": 185.98, "text": "科教文卫，地域差异，民族认同，历史探究等诸多领域，差不多什么都能见识一下。", "en": "In education, science, culture, health, regional differences, national identity, historical inquiry and many other fields, I can see roughly everything."}, {"start": 185.98, "end": 195.14, "text": "这就很好，你甚至可以看到千篇一律的知乎体小说居然也有不那么千篇一律的家伙在坚持写着无人问津的文字。", "en": "This is very good. You can even see that among the cookie-cutter Zhihu-style novels, there are some not-so-cookie-cutter people persisting in writing words no one reads."}, {"start": 195.14, "end": 198.74, "text": "甚至，你还能找到严肃文学的影子…", "en": "You can even find traces of serious literature…"}, {"start": 198.74, "end": 205.15, "text": "抖音亦然，因为我只有这两款社交软件，所以分享也就局限于此。", "en": "Douyin is the same. Because I only have these two social apps, my sharing is limited to them."}, {"start": 205.15, "end": 213.31, "text": "抖音你只要是游客，你看到的海量低质量视频，会大大缩减你使用它的时间，这是哥秘不示人的绝招。", "en": "On Douyin, as long as you are a visitor, the massive low-quality videos you see will greatly reduce the time you spend using it. This is my secret trick that I do not share."}, {"start": 213.31, "end": 222.86, "text": "人的意志力是有上限的，人抵抗诱惑的能力着实差到一言难尽，这都是真实存在的客观现实。", "en": "Human willpower has an upper limit, and human ability to resist temptation is truly too poor to describe — these are real, objective facts."}, {"start": 222.86, "end": 230.86, "text": "所以，本质上，如果你一直以一个登录的状态去刷抖音，那么你看到的，一定是迎合你喜好的玩意，无穷无尽。", "en": "So, essentially, if you keep scrolling Douyin while logged in, what you see must be things catering to your preferences, endless."}, {"start": 230.86, "end": 234.94, "text": "然而信息茧房的本质，是明为迎合，实则控制。", "en": "However, the essence of the information cocoon is that it appears to cater, but actually controls."}, {"start": 234.94, "end": 239.45, "text": "它是要控制你的，禁锢你思想的发育，压缩你思考的时间。", "en": "It wants to control you, imprison the development of your thought, and compress the time you spend thinking."}, {"start": 239.45, "end": 248.98, "text": "只要开心，只要爽，你不停地接受着一个虚拟的爽世界，最终就变成了一个现实生活安分守己且毫无生气的人。", "en": "As long as you are happy, as long as you feel good, you keep accepting a virtual world of pleasure, and eventually become a person who is well-behaved and lifeless in real life."}, {"start": 248.98, "end": 256.9, "text": "麻木不仁的面对生活，愚蠢迟钝的面对人生，然后把对生活的休养生息全部寄希望于手机。", "en": "Facing life numbly, facing life stupidly and slowly, and then pinning all your hopes for rest and recuperation in life on your phone."}, {"start": 256.9, "end": 263.81, "text": "躺在那里，用手机里的海量信息来麻痹自己的感官，说白了吧，就是精神吸毒。", "en": "Lying there, using the massive information on your phone to numb your senses. To put it bluntly, it is spiritual drug use."}, {"start": 263.81, "end": 270.53, "text": "日复一日看不到头，无穷尽也，绝望叩问，却不知叩问谁…", "en": "Day after day with no end in sight, endless, hopeless questioning, yet not knowing whom to question…"}, {"start": 270.53, "end": 276.41, "text": "这就是精神被禁锢的底层逻辑，这才是现代人最真实的悲哀与不幸。", "en": "This is the underlying logic of the spirit being imprisoned, and this is the truest sorrow and misfortune of modern people."}, {"start": 276.41, "end": 282.65, "text": "所以，当你能认识到这个问题的时候，你就要知道了，什么才是我们来人间一回的目的。", "en": "So, when you can recognise this problem, you should know what the purpose of our one trip to this human world is."}, {"start": 282.65, "end": 284.14, "text": "是为了体验吗？", "en": "Is it for experience?"}, {"start": 284.14, "end": 286.25, "text": "是，但不全是。", "en": "Yes, but not entirely."}, {"start": 286.25, "end": 300.22, "text": "我们体验只是肤浅的身体肌肤，感官器官综合起来的肤浅体会，你看到的，你听到的，你摸到的，你走过的，都是一种基于身体本能感知感受到的表象。", "en": "Our experience is only the superficial experience of the body's skin and sensory organs combined. What you see, hear, touch and walk past are all appearances perceived based on the body's instinctive perception."}, {"start": 300.22, "end": 305.38, "text": "我们的体验之后，应是尽可能的触碰这个人间真实的内在。", "en": "After our experience, we should try as much as possible to touch the true inner nature of this human world."}, {"start": 305.38, "end": 312.38, "text": "你想触碰的前提，就是你接触到的信息是真实的，可靠的，不带有任何主观色彩的。", "en": "The prerequisite for you to touch it is that the information you come into contact with is real, reliable, and without any subjective colouring."}, {"start": 312.38, "end": 317.35, "text": "所以，触碰才是真实的体验，才是升华，才是无比真实的快乐。", "en": "So, touching is real experience, sublimation, and incomparably real happiness."}, {"start": 317.35, "end": 318.5, "text": "你比如大腚。", "en": "Take big butts, for example."}, {"start": 318.5, "end": 328.03, "text": "大腚的观感是极佳的，触感是柔软的，但是如果你只是在手机看一个又一个大腚，那抖音自然是明白你的底色，大腚喜好者。", "en": "A big butt looks excellent and feels soft, but if you only watch one big butt after another on your phone, Douyin will naturally understand your true nature: a big-butt lover."}, {"start": 328.03, "end": 339.98, "text": "所以它的算法就给你一直推五湖四海的大腚，你看过一个大腚过后兴致盎然，你看过十个大腚以后眼光开始挑剔，觉得某些大腚并不符合审美，过于大腚，甚至是虚假的大腚，你都能看见臀垫。", "en": "So its algorithm keeps pushing you big butts from all over the world. After watching one big butt you are in high spirits; after watching ten big butts your taste starts to become picky, feeling that some big butts do not meet aesthetic standards, are too big-butt, or even fake big butts — you can even see the butt pads."}, {"start": 339.98, "end": 350.14, "text": "当你赏析过百个大腚以后，一个小时就过去了，然而，你并没有过瘾，你没有心满意足，你反而更加焦虑，口渴，不得尽兴。", "en": "After appreciating a hundred big butts, an hour has passed. Yet you are not satisfied, you are not content; instead you are more anxious, thirsty, and not fully satisfied."}, {"start": 350.14, "end": 357.17, "text": "于是你产生了一个不自知的潜意识，只要看更多的大腚，你一定会有心满意足的时刻。", "en": "Then you develop an unconscious subconscious: as long as you watch more big butts, you will definitely have a satisfying moment."}, {"start": 357.17, "end": 359.21, "text": "错了，兄弟，真的错了。", "en": "Wrong, brother, really wrong."}, {"start": 359.21, "end": 372.48, "text": "你即便花一天的时间看了天南地北上千个大腚，你依然不会满足，你只会疲累，直到累得眼眶雀青，手指僵化，动一下翻个身都费劲的时候，你才会恋恋不舍的放下手机。", "en": "Even if you spend a whole day watching thousands of big butts from all over the country, you still will not be satisfied; you will only be tired, until your eye sockets are dark, your fingers stiff, and even turning over in bed takes effort — only then will you reluctantly put down your phone."}, {"start": 372.48, "end": 379.56, "text": "这个时候，抖音得到了日活人数，大腚们得到了关注流量，你，得到了什么？", "en": "At this point, Douyin has gained daily active users, the big butts have gained attention and traffic, and you — what have you gained?"}, {"start": 379.56, "end": 382.49, "text": "所以，正确的做法是什么？", "en": "So, what is the correct approach?"}, {"start": 382.49, "end": 384.0, "text": "你再也不看大腚？", "en": "Never watch big butts again?"}, {"start": 384.0, "end": 397.27, "text": "不对，你可以看，但是你不能只在网上看，你要走出去看现实的大腚，继而想办法触碰真实的大腚，继而实现对大腚这一执念的完美闭环，这就是触碰人间真实的意义。", "en": "No: you can watch, but you cannot only watch online. You must go out and see real big butts, and then find a way to touch real big butts, thereby achieving a perfect closed loop of this obsession with big butts. This is the meaning of touching the reality of the human world."}, {"start": 397.27, "end": 399.24, "text": "这才是真的来过人间。", "en": "This is what it means to have truly been in this world."}, {"start": 399.24, "end": 401.28, "text": "你看过，不算来过。", "en": "Having seen it does not count as having been here."}, {"start": 401.28, "end": 405.77, "text": "哥，只是举了一个最浅薄的例子，方便读者理解。", "en": "I am just giving the most shallow example, to make it easier for readers to understand."}, {"start": 405.77, "end": 409.08, "text": "要么说关注哥的兄弟们年龄跨度那么大呢…", "en": "No wonder the brothers who follow me span such a wide age range…"}, {"start": 409.08, "end": 412.03, "text": "十几岁的也有，八九十岁的老叔也有…", "en": "There are teenagers, and there are old uncles in their eighties and nineties…"}, {"start": 412.03, "end": 414.36, "text": "棍哥的文字，老少咸宜。", "en": "Gun Ge's writing suits all ages."}, {"start": 414.36, "end": 421.56, "text": "信息过载着实是没必要的，你没有必要关注那么多的博主，你关注那么几十个真有料的就行，比如棍哥这样的。", "en": "Information overload is really unnecessary. You do not need to follow so many bloggers; just follow a few dozen who truly have substance, like Gun Ge here."}, {"start": 421.56, "end": 439.85, "text": "就这样吧，你们可以试试棍哥的方法，先试试抖音，当你是一个都市白领，你的抖音却开始给你推送上一个养鸭子如何赶鸭，下一个广场舞劲爆金曲，再下一个是手搓缝纫机，再再下一个是佛光普照，刷到的都是有缘人的时候…", "en": "That is all. You can try Gun Ge's method: first try Douyin. When you are an urban white-collar worker, but your Douyin starts pushing you, one after another, how to herd ducks as a duck farmer, then explosive square-dance hits, then hand-sewing machines, then Buddha's light shining everywhere, and all you scroll to are people with fate…"}, {"start": 439.85, "end": 461.57, "text": "你最多刷十分钟你就会感到无趣了，你就有时间去感受真实的世界了，或许你会在百无聊赖的时候开始尝试真实的社交，深度的阅读，完整的学习，酣畅淋漓的锻炼，甚至是做一顿饭，完整的看一部电影，不管什么吧，都比沉浸在信息糖果漩涡中无法自拔要强百倍。", "en": "You will feel bored after at most ten minutes, and then you will have time to feel the real world. Perhaps in your boredom you will start trying real socialising, deep reading, complete learning, hearty exercise, or even cooking a meal, or watching a complete film. No matter what, it is a hundred times better than being unable to extricate yourself from the vortex of information candy."}, {"start": 461.57, "end": 464.86, "text": "祝兄弟们都能拥有属于自己的人生大腚。", "en": "May all you brothers have your own life's big butt."}, {"start": 464.86, "end": 467.78, "text": "此腚非彼腚，不要肤浅了啊~", "en": "This butt is not that butt — don't be superficial~"}]}, {"title": "怎样避免活在信息茧房之中？ Part 13（68句，6:14）", "mp3": "upload-8-part13/audio.mp3", "dur": "6:14", "lines": [{"start": 0.0, "end": 6.12, "text": "全球流量前20大网站，听说不需要科学上网可以直接浏览的只有两个。", "en": "Among the world's top 20 websites by traffic, I hear only two can be browsed directly without bypassing the firewall."}, {"start": 6.12, "end": 8.47, "text": "一个是百度，另外一个是亚马逊。", "en": "One is Baidu, and the other is Amazon."}, {"start": 8.47, "end": 11.47, "text": "前者不用多说，各种广告骗子一大堆。", "en": "The former needs no introduction: all kinds of advertising scammers in droves."}, {"start": 11.47, "end": 14.28, "text": "后者是购物网站，你会海淘吗？", "en": "The latter is a shopping website — do you do overseas shopping?"}, {"start": 14.28, "end": 15.17, "text": "呵呵🙂", "en": "Heh. 🙂"}, {"start": 15.17, "end": 19.42, "text": "翻墙出去看8个小时外网，再刷几个小时科研论坛。", "en": "Bypass the firewall to browse the outside internet for 8 hours, then scroll research forums for a few more hours."}, {"start": 19.42, "end": 26.09, "text": "然后工资不会涨，阶层不会提升，跟朋友吃饭吹牛也用不到，还是该吃吃该喝喝，", "en": "Then your salary will not rise, your class will not improve, and you cannot use it when bragging with friends over dinner either — you still eat and drink as usual."}, {"start": 26.09, "end": 28.2, "text": "要那么多信息干嘛呢，够用就行了呗。", "en": "Why do you need so much information? Enough is enough."}, {"start": 28.2, "end": 31.63, "text": "其实很简单，搜与你观点相反的内容即可。", "en": "Actually, it is very simple: just search for content opposite to your views."}, {"start": 31.63, "end": 37.1, "text": "比如，我信佛十几年了，然后去搜唯物主义，他们对世界的看法，那是另外一种视角。", "en": "For example, I have believed in Buddhism for more than ten years, and then I searched for materialism — their view of the world is a different perspective."}, {"start": 37.1, "end": 42.79, "text": "比如，我会去看台湾的政论节目，他们的视角，观点跟大陆是个不同的。", "en": "For example, I watch Taiwan's political commentary programmes; their perspectives and views are different from the mainland's."}, {"start": 42.79, "end": 54.72, "text": "所有的报道都有倾向性，为了避免被误导，首先要保持最基本的逻辑，参考客观指标，再结合历史，因为太阳底下没有新鲜事。", "en": "All reporting has tendencies. To avoid being misled, first maintain basic logic, refer to objective indicators, and combine with history, because there is nothing new under the sun."}, {"start": 54.72, "end": 60.55, "text": "先看基本逻辑和客观指标，比如牢A的言论就是典型的以点概面。", "en": "First look at basic logic and objective indicators. For example, Prisoner A's remarks are a typical case of generalising from a single point."}, {"start": 60.55, "end": 65.78, "text": "美国那么坏，遍地饿殍，为什么有钱人都纷纷往美国跑。", "en": "America is so bad, with starving people everywhere — why do rich people all flock to America?"}, {"start": 65.78, "end": 76.39, "text": "中国那么好，购买力平价（PPP）计算的GDP排名第一，为什么没见过欧美日韩的人偷渡到中国扫地、刷盘子？", "en": "China is so good, with GDP ranked first calculated by purchasing power parity (PPP) — why have we never seen Europeans, Americans, Japanese or Koreans sneak into China to sweep floors or wash dishes?"}, {"start": 76.39, "end": 77.64, "text": "再看历史：", "en": "Then look at history:"}, {"start": 77.64, "end": 85.85, "text": "当年教员对于基辛格提出的，当时全国各地都刷满“打倒美帝国主义”反美口号的回应是；", "en": "Back then, the Teacher's response to what Kissinger raised, when 'Down with American imperialism' anti-American slogans were plastered all over the country, was:"}, {"start": 85.85, "end": 95.16, "text": "“像我这样的人，也放过不少空炮，什么‘全世界人民团结起来打倒帝国主义、修正主义和一切反动派’，口号嘛。", "en": "“People like me have also fired quite a few empty cannons — things like 'People of the world, unite to overthrow imperialism, revisionism and all reactionaries' — slogans, that's all."}, {"start": 95.16, "end": 99.96, "text": "”", "en": "”"}, {"start": 99.96, "end": 104.95, "text": "他笑了笑，又指了指尼克松：“你们不也常常说要消灭共产主义？", "en": "He smiled and pointed at Nixon: “Don't you also often say you want to eliminate communism?"}, {"start": 104.95, "end": 107.06, "text": "几十年了，也没消灭掉。", "en": "Decades have passed, and it hasn't been eliminated."}, {"start": 107.06, "end": 111.86, "text": "”", "en": "”"}, {"start": 111.86, "end": 113.71, "text": "我只说自己的一些技巧吧。", "en": "I will just talk about some of my own techniques."}, {"start": 113.71, "end": 121.56, "text": "作为一个每天用三个小时以后在知乎回答，内容比较杂学的答主，我的信息获取是这样的——", "en": "As an answerer who spends more than three hours a day on Zhihu answering, with rather mixed content, my information acquisition goes like this —"}, {"start": 121.56, "end": 125.93, "text": "首先，对热点新闻只看长期关注的权威博主内容。", "en": "First, for hot news, I only read content from authoritative bloggers I have followed for a long time."}, {"start": 125.93, "end": 132.84, "text": "大量自媒体号，其实都是迎合情绪，把一些核心信息翻来覆去的扩展解读。", "en": "A large number of self-media accounts actually just cater to emotions, expanding and interpreting some core information over and over."}, {"start": 132.84, "end": 134.33, "text": "有效信息很少。", "en": "There is very little effective information."}, {"start": 134.33, "end": 142.18, "text": "所以，热点新闻或者看大型媒体的第一手客观报道，或者看权威博主的解读。", "en": "So, for hot news, either read first-hand objective reporting from large media, or read interpretations from authoritative bloggers."}, {"start": 142.18, "end": 145.94, "text": "不要看那些切片或二手三手的引用再解读。", "en": "Do not read those sliced-up or second-hand, third-hand quoted reinterpretations."}, {"start": 145.94, "end": 148.7, "text": "第二，用电脑替代手机浏览", "en": "Second, use a computer instead of a phone to browse."}, {"start": 148.7, "end": 154.06, "text": "电脑有个好处，可以不授权cookie，甚至不登录的情况下查看网页。", "en": "A computer has one advantage: you can view web pages without authorising cookies, or even without logging in."}, {"start": 154.06, "end": 158.66, "text": "这就避免了用手机观看新闻、视频时候的“用户爱好推荐”。", "en": "This avoids the 'user preference recommendations' you get when watching news and videos on a phone."}, {"start": 158.66, "end": 162.7, "text": "能避免搜索了一个关键词，最近连续都给你推荐类似的东西。", "en": "It avoids the situation where, after searching for a keyword, you are continuously recommended similar things."}, {"start": 162.7, "end": 168.7, "text": "你也可以在手机端关闭“兴趣推荐、用户改进计划”等设置，单个人觉得效果有限。", "en": "You can also turn off settings like 'interest recommendations' and 'user improvement plans' on your phone, though I personally find the effect limited."}, {"start": 168.7, "end": 173.98, "text": "尤其是“百度”的搜索记录，会授权给好几个购物和娱乐平台。", "en": "Especially Baidu's search history, which is authorised to several shopping and entertainment platforms."}, {"start": 173.98, "end": 181.82, "text": "所以，只要你搜过某样东西，立刻回看到京东、淘宝都给你推荐相关物品，页面广告也围绕。", "en": "So, as soon as you search for something, you will immediately see JD and Taobao recommending related items to you, and page ads revolving around it."}, {"start": 181.82, "end": 187.15, "text": "所以，我一般是不登陆百度账号的，使用了网盘功能也会立刻退出。", "en": "So I generally do not log into a Baidu account, and I log out immediately after using the cloud drive function."}, {"start": 187.15, "end": 190.46, "text": "第三，多交叉利用平台来获取信息", "en": "Third, cross-utilise platforms to obtain information."}, {"start": 190.46, "end": 195.1, "text": "我个人日常会至少登录五个以上的平台来获取信息。", "en": "I personally log into at least five or more platforms daily to obtain information."}, {"start": 195.1, "end": 202.13, "text": "比如早晨上班，会用公众号听播，在路上听一些中长内容的新闻、时事账号。", "en": "For example, in the morning on the way to work, I use official accounts to listen to broadcasts, listening to some medium-to-long news and current affairs accounts on the road."}, {"start": 202.13, "end": 207.58, "text": "到了公司会打开anyknew 这样新闻合集网站看当日的各大网站头条。", "en": "When I get to the company, I open a news aggregation site like AnyKnew to see the day's headlines from major websites."}, {"start": 207.58, "end": 215.14, "text": "它的页面是这样瀑布流形式展现所有门户、新闻网站头条新闻的，你可以横向对比热搜。", "en": "Its page displays headlines from all portals and news websites in a waterfall format, allowing you to horizontally compare trending searches."}, {"start": 215.14, "end": 221.42, "text": "搜图片我会用360搜索和一些国外的图片搜索引擎，因为更客观而且图源更丰富。", "en": "For searching images, I use 360 Search and some foreign image search engines, because they are more objective and have richer image sources."}, {"start": 221.42, "end": 223.34, "text": "没有太多商品推荐。", "en": "Without too many product recommendations."}, {"start": 223.34, "end": 232.18, "text": "健身房，一般是听苹果自带的播客和小宇宙、喜马拉雅来听中长的播客内容来学习历史、财经、国际关系方面的内容。", "en": "At the gym, I generally listen to Apple's built-in podcasts and Xiaoyuzhou and Ximalaya to listen to medium-to-long podcast content to learn about history, finance and international relations."}, {"start": 232.18, "end": 235.13, "text": "下班后，在家我一般偏娱乐向内容是看B站。", "en": "After work, at home, I generally prefer entertainment-oriented content on Bilibili."}, {"start": 235.13, "end": 239.57, "text": "如果看书，会用Kindle下载，或者是腾讯读书。", "en": "If I read books, I download them with Kindle, or use Tencent Reading."}, {"start": 239.57, "end": 250.08, "text": "我很少刷微博、抖音、快手，因为里面的内容太碎片，有效信息很少，经常看了一两个小时发现除了杀时间没有得到任何有效内容。", "en": "I rarely scroll Weibo, Douyin or Kuaishou, because their content is too fragmented, with very little effective information. I often find that after watching for an hour or two, apart from killing time, I have gained no effective content."}, {"start": 250.08, "end": 253.87, "text": "重要，多用排行榜而不是推荐来看内容。", "en": "Important: use rankings rather than recommendations to view content."}, {"start": 253.87, "end": 261.67, "text": "其中比较重要的，是不管你用上面的哪个平台，可以多利用“分类排行榜”，来看每天排名前几的内容。", "en": "What is more important is that, no matter which of the above platforms you use, you can make more use of 'category rankings' to see the top-ranked content each day."}, {"start": 261.67, "end": 269.59, "text": "它们相对更客观反应整个平台用户的判断，而且往往能有一些你从来不关注的领域信息。", "en": "They relatively more objectively reflect the judgment of the platform's users as a whole, and often bring you information from fields you never follow."}, {"start": 269.59, "end": 271.27, "text": "我们用B站举例。", "en": "Take Bilibili as an example."}, {"start": 271.27, "end": 276.5, "text": "我无聊时打法时间的方法，不是看系统推荐给我的哪些视频。", "en": "My way of passing time when bored is not to watch the videos the system recommends to me."}, {"start": 276.5, "end": 282.67, "text": "而是点击左上角“热门”去看每天的综合热门，每周的推荐，每个专区的排行榜。", "en": "But to click 'Hot' in the top-left corner to see the daily comprehensive hot list, the weekly recommendations, and the rankings of each section."}, {"start": 282.67, "end": 292.75, "text": "比如你是个从不关心音乐领域的人，一样可以在榜单中发现原来AI作曲已经这么流行了，创作出了不少播放上千万的经典歌曲。", "en": "For example, if you are someone who never cares about the music field, you can still discover from the rankings that AI composition has become so popular, creating quite a few classic songs with tens of millions of plays."}, {"start": 292.75, "end": 299.4, "text": "或者你是个从来不爱看记录片的人，但发现热榜上又一部忽然几万人点赞的纪录片。", "en": "Or if you are someone who never likes watching documentaries, but find that another documentary on the hot list suddenly has tens of thousands of likes."}, {"start": 299.4, "end": 303.05, "text": "点进去可能发现一部大家都在套论的热门视频。", "en": "Clicking in, you might discover a popular video everyone is discussing."}, {"start": 303.05, "end": 308.69, "text": "这样“看榜单”的习惯，要比“只看系统推荐给你”的内容，更加视野开拓。", "en": "This habit of 'looking at rankings' broadens your horizons more than 'only looking at content the system recommends to you'."}, {"start": 308.69, "end": 310.73, "text": "最后，和朋友们保持交流。", "en": "Finally, stay in touch with friends."}, {"start": 310.73, "end": 319.08, "text": "很多人会发现，一旦从学校毕业，没有了“同学、舍友”这样的氛围，自己了解新事物的范围会异常狭小。", "en": "Many people find that once they graduate from school, without the atmosphere of 'classmates and roommates', the range of new things they learn becomes unusually narrow."}, {"start": 319.08, "end": 323.04, "text": "再没有了那种“发生了什么事立刻从别人那听说”的感觉。", "en": "There is no longer that feeling of 'immediately hearing from others when something happens'."}, {"start": 323.04, "end": 326.21, "text": "这就需要我们要建立新的“社交信息渠道”。", "en": "This requires us to establish new 'social information channels'."}, {"start": 326.21, "end": 338.74, "text": "比如：每天上班时，有一两个关系不错的同事，大家找空下楼抽根烟、喝杯咖啡，闲聊20分钟，交流下最近自己再看的剧、听说的新闻。", "en": "For example: every day at work, having one or two colleagues you get along well with, finding time to go downstairs for a cigarette or a coffee, chatting for 20 minutes, exchanging what shows you are watching recently and what news you have heard."}, {"start": 338.74, "end": 350.02, "text": "比如我太太喜欢的书籍和博主与我完全不同，但我俩每周会去公园散步两个小时，路上聊聊这周各自看了什么书，听到了哪些博主的有趣内容。", "en": "For example, my wife's favourite books and bloggers are completely different from mine, but every week we take a two-hour walk in the park, chatting on the way about what books we each read this week and what interesting blogger content we heard."}, {"start": 350.02, "end": 352.37, "text": "遇到都喜欢的还会晚上一起看。", "en": "When we both like something, we watch it together in the evening."}, {"start": 352.37, "end": 355.44, "text": "这些都是“保持你和他人的交流”。", "en": "These are all 'staying in touch with others'."}, {"start": 355.44, "end": 367.87, "text": "虽然很多现代人都说自己有“社交恐惧症”，但交流不一定非是当面的，加入一些讨论群，或者在手机上保持和几个好友的小群，都是交流信息不错的方式。", "en": "Although many modern people say they have 'social phobia', communication does not have to be face-to-face. Joining some discussion groups, or keeping small groups with a few good friends on your phone, are also good ways to exchange information."}, {"start": 367.87, "end": 374.78, "text": "你也可以定期周末约朋友玩桌游、拼图、打篮球，大家的交流一样会带给你很多不知道的信息。", "en": "You can also regularly meet friends on weekends to play board games, do puzzles, or play basketball; everyone's exchanges will likewise bring you a lot of information you did not know."}]}, {"title": "怎样避免活在信息茧房之中？ Part 14（96句，9:11）", "mp3": "upload-8-part14/audio.mp3", "dur": "9:11", "lines": [{"start": 0.0, "end": 4.97, "text": "学习英语，打开梯子，看英文信息，对比来看，独立思考。", "en": "Learn English, use a VPN to get over the firewall, read English information, compare, and think independently."}, {"start": 4.97, "end": 10.68, "text": "有人说国外也有信息茧房，其实这个事很好分辨，归根结底就是有没有人捂你的嘴。", "en": "Some say foreign countries also have information cocoons. Actually, this is easy to tell apart: it ultimately comes down to whether someone covers your mouth."}, {"start": 10.68, "end": 15.24, "text": "就是说，你是否可以想说什么就说什么，想听什么就听什么？", "en": "That is: can you say whatever you want to say, and listen to whatever you want to listen to?"}, {"start": 15.24, "end": 22.37, "text": "你按自己的想法，观点，发个帖子，有没有一定概率被限流，折叠，删帖，封号。", "en": "If you post something according to your own ideas and views, is there a certain probability it will be throttled, collapsed, deleted, or your account banned?"}, {"start": 22.37, "end": 23.88, "text": "甚至请喝茶。", "en": "Or even being 'invited for tea'."}, {"start": 23.88, "end": 30.55, "text": "你看了一个帖子，一篇文章，然后过几天这个帖子，文章消失了，荒原了。", "en": "You read a post, an article, and then a few days later that post, that article has disappeared, turned to wasteland."}, {"start": 30.55, "end": 34.87, "text": "如果是这样，那么你一定是处于信息茧房中，毫无疑问。", "en": "If so, then you are definitely in an information cocoon, without a doubt."}, {"start": 34.87, "end": 39.19, "text": "尽管你可能自以为知道很多事情，都没用，那就是信息茧房。", "en": "Even though you may think you know many things yourself, it is useless — that is the information cocoon."}, {"start": 39.19, "end": 41.88, "text": "什么环境不是信息茧房呢？", "en": "What kind of environment is not an information cocoon?"}, {"start": 41.88, "end": 47.23, "text": "就是你发个帖子，文章，可能有赞同的，也有反对的，你可能被支持，也可能被骂。", "en": "It is when you post something, an article, and there may be people who agree and people who disagree; you may be supported, or you may be scolded."}, {"start": 47.23, "end": 54.07, "text": "不同意你的观点的人或势力，也可能写一篇反对文驳斥你，甚至挖苦你，嘲笑你。", "en": "People or forces who disagree with your views may also write an article refuting you, or even mock you and laugh at you."}, {"start": 54.07, "end": 69.55, "text": "但无论如何，你发出的帖子，文章永远都好好地在那里，没有任何东西能删你的贴，或者折你的叠，让你的帖子仅你自己可见，偷偷摸摸给你限流。", "en": "But in any case, the posts and articles you put out stay there properly forever. Nothing can delete your posts, or collapse your posts, making your posts visible only to yourself, or secretly throttle you."}, {"start": 69.55, "end": 74.42, "text": "你的反对者可以反驳你，骂你，但是无法捂你的嘴，不让你说话。", "en": "Your opponents can refute you and scold you, but they cannot cover your mouth and stop you from speaking."}, {"start": 74.42, "end": 76.39, "text": "那就不是信息茧房。", "en": "Then it is not an information cocoon."}, {"start": 76.39, "end": 78.31, "text": "上知乎性别男", "en": "On Zhihu, set gender to male."}, {"start": 78.31, "end": 80.78, "text": "上小红书改成性别女", "en": "On Xiaohongshu, change gender to female."}, {"start": 80.78, "end": 81.86, "text": "完事", "en": "Done."}, {"start": 81.86, "end": 83.35, "text": "突然的震惊！", "en": "Sudden shock!"}, {"start": 83.35, "end": 92.47, "text": "一位特朗普铁杆支持者、拥有近200万粉丝的保守派调查记者，竟公开承认“被俄罗斯宣传骗了多年”！", "en": "A staunch Trump supporter, a conservative investigative journalist with nearly 2 million followers, has publicly admitted to having 'been deceived by Russian propaganda for years'!"}, {"start": 92.47, "end": 100.58, "text": "最近，劳拉·卢默（Laura Loomer）的立场180度大转变，在国际社交媒体上引发热议。", "en": "Recently, Laura Loomer's stance has reversed 180 degrees, sparking heated discussion on international social media."}, {"start": 100.58, "end": 112.06, "text": "她曾猛批乌克兰“充满纳粹辩护者”、泽连斯基是“圣战辩护者”，如今亲访乌克兰后却发文痛斥俄罗斯信息战，并保留所有旧帖作为证据。", "en": "She once fiercely criticised Ukraine as 'full of Nazi apologists' and Zelensky as a 'jihad apologist'; now, after personally visiting Ukraine, she has posted denouncing Russian information warfare, keeping all her old posts as evidence."}, {"start": 112.06, "end": 117.7, "text": "这不是简单的网红大反转，而是一场现代地缘政治信息战的活教材。", "en": "This is not a simple influencer reversal, but a living textbook of modern geopolitical information warfare."}, {"start": 117.7, "end": 123.22, "text": "俄罗斯精心编织的叙事，在铁一般的事实面前轰然崩塌。", "en": "Russia's carefully woven narrative has collapsed in the face of iron-clad facts."}, {"start": 123.22, "end": 130.9, "text": "一起来看看，这位“Feisty Jewess”（她自称“强悍犹太女”）到底经历了什么！", "en": "Let us see what this 'Feisty Jewess' (as she calls herself, 'tough Jewish woman') actually went through!"}, {"start": 130.9, "end": 132.05, "text": "卢默是谁？", "en": "Who is Loomer?"}, {"start": 132.05, "end": 134.09, "text": "MAGA圈的“敢死队”记者", "en": "The MAGA circle's 'daredevil' reporter."}, {"start": 134.09, "end": 137.04, "text": "1993年出生，犹太裔美国人；", "en": "Born in 1993, a Jewish American;"}, {"start": 137.04, "end": 142.27, "text": "前Project Veritas卧底调查员，曾为多家保守媒体工作；", "en": "Former undercover investigator for Project Veritas, having worked for several conservative media outlets;"}, {"start": 142.27, "end": 148.82, "text": "特朗普坚定支持者，“America First”拥护者，X平台活跃网红；", "en": "A staunch Trump supporter, an 'America First' advocate, and an active influencer on the X platform;"}, {"start": 148.82, "end": 152.71, "text": "以大胆争议言论著称，常挑战主流媒体叙事。", "en": "Known for bold, controversial statements, often challenging mainstream media narratives."}, {"start": 152.71, "end": 160.63, "text": "她长期在保守派圈子里传播反乌观点，甚至为俄罗斯国家媒体RT撰写过评论（虽未收钱）。", "en": "She long spread anti-Ukraine views in conservative circles, and even wrote commentary for the Russian state media RT (though unpaid)."}, {"start": 160.63, "end": 168.72, "text": "这一切，都源于她自己后来承认的——“生活在媒体回音室里，被俄罗斯社交媒体宣传洗脑”。", "en": "All of this stemmed from what she later admitted herself — 'living in a media echo chamber, brainwashed by Russian social media propaganda'."}, {"start": 168.72, "end": 173.76, "text": "曾经的“硬核反乌”立场：俄罗斯宣传的忠实代言。", "en": "Her former 'hardcore anti-Ukraine' stance: a faithful spokesperson for Russian propaganda."}, {"start": 173.76, "end": 176.28, "text": "过去几年，卢默反复宣称：", "en": "Over the past few years, Loomer repeatedly claimed:"}, {"start": 176.28, "end": 179.59, "text": "乌克兰是“充满纳粹辩护者的国家”；", "en": "Ukraine is a 'country full of Nazi apologists';"}, {"start": 179.59, "end": 181.51, "text": "反对美国对乌援助；", "en": "She opposed US aid to Ukraine;"}, {"start": 181.51, "end": 184.08, "text": "相信俄罗斯“去纳粹化”有理。", "en": "She believed Russia's 'denazification' was justified."}, {"start": 184.08, "end": 189.77, "text": "这些观点精准契合克里姆林宫叙事，成功在西方保守派中制造分裂。", "en": "These views precisely matched the Kremlin narrative, successfully creating divisions among Western conservatives."}, {"start": 189.77, "end": 197.93, "text": "她坦承：“我鹦鹉学舌般重复这些说法，以为自己在对抗全球主义，却没意识到被情感操纵。", "en": "She admitted: 'I parroted these claims, thinking I was fighting globalism, without realising I was being emotionally manipulated."}, {"start": 197.93, "end": 202.73, "text": "”", "en": "”"}, {"start": 202.73, "end": 213.58, "text": "信息战的高明之处就在于此——它不靠子弹，而是利用算法、回音室[1]、信息茧房[2]和地缘裂痕，让目标人群主动传播虚假信息。", "en": "The cleverness of information warfare lies precisely here — it does not rely on bullets, but uses algorithms, echo chambers [1], information cocoons [2] and geopolitical rifts to make target populations actively spread false information."}, {"start": 213.58, "end": 215.78, "text": "她是怎么意识到自己可能被骗的？", "en": "How did she realise she might have been deceived?"}, {"start": 215.78, "end": 220.22, "text": "卢默的转变始于自我反思（2026年6月左右）：", "en": "Loomer's transformation began with self-reflection (around June 2026):"}, {"start": 220.22, "end": 247.75, "text": "她发现俄罗斯一边高喊“去纳粹化乌克兰”和“保护东正教基督徒”，一边却用导弹屠杀乌克兰平民、摧毁数百座教堂，并与车臣穆斯林部队合作进行“圣战式”屠杀。", "en": "She discovered that Russia, while shouting 'denazify Ukraine' and 'protect Orthodox Christians', was at the same time using missiles to massacre Ukrainian civilians, destroying hundreds of churches, and cooperating with Chechen Muslim troops in 'jihad-style' massacres."}, {"start": 247.75, "end": 257.35, "text": "俄罗斯自称“东正教庇护者”，却支持美国本土新纳粹势力[3]、与伊朗结盟，这些巨大反差让她产生强烈认知失调。", "en": "Russia calls itself the 'protector of Orthodoxy', yet supports domestic American neo-Nazi forces [3] and allies with Iran. These huge contrasts gave her strong cognitive dissonance."}, {"start": 257.35, "end": 277.7, "text": "她反思过去因“俄罗斯疲劳”（对特朗普“通俄门”反感的反弹）而过度同情俄罗斯，承认自己“戴上了玫瑰色眼镜”，落入了社交媒体和俄罗斯宣传的回音室。", "en": "She reflected that in the past, due to 'Russia fatigue' (a backlash against disgust with Trump's 'Russiagate'), she had over-sympathised with Russia, admitting she had 'put on rose-tinted glasses' and fallen into the echo chamber of social media and Russian propaganda."}, {"start": 277.7, "end": 282.55, "text": "正是这一觉醒，让她决定不再被动接受叙事，而是主动求证。", "en": "It was precisely this awakening that made her decide to no longer passively accept narratives, but to actively seek verification."}, {"start": 282.55, "end": 287.59, "text": "劳拉·卢默（Laura Loomer）亲自前往乌克兰验证俄罗斯的宣传", "en": "Laura Loomer personally travelled to Ukraine to verify Russian propaganda."}, {"start": 287.59, "end": 291.6, "text": "亲访乌克兰：铁证如山，立场崩塌", "en": "Personal visit to Ukraine: iron-clad evidence, stance collapses."}, {"start": 291.6, "end": 308.52, "text": "基于这一觉醒，2026年7月她批准制片人安德鲁·摩尔先去乌克兰前线报道，随后自己也亲自前往，目的是“亲眼看看这个国家，寻找我被灌输的宣传证据”，并准备“如果没找到，就告诉大家”。", "en": "Based on this awakening, in July 2026 she approved producer Andrew Moore going to the Ukraine front line to report first, and then went herself, with the aim of 'seeing this country with my own eyes, looking for evidence of the propaganda I was fed', and being prepared to 'tell everyone if I did not find it'."}, {"start": 308.52, "end": 313.08, "text": "结果这一去就彻底粉碎了她先前带上的“玫瑰色眼镜”了。", "en": "As a result, this trip completely shattered the 'rose-tinted glasses' she had brought with her."}, {"start": 313.08, "end": 315.19, "text": "她在布查等地亲眼看到：", "en": "In Bucha and other places, she saw with her own eyes:"}, {"start": 315.19, "end": 318.0, "text": "俄罗斯军队杀害神父的照片；", "en": "Photos of Russian soldiers killing priests;"}, {"start": 318.0, "end": 320.69, "text": "车臣部队制造的基督徒万人坑；", "en": "Mass graves of Christians created by Chechen troops;"}, {"start": 320.69, "end": 324.65, "text": "乌克兰战俘额头被刻上纳粹符号的证据。", "en": "Evidence of Ukrainian prisoners of war having Nazi symbols carved on their foreheads."}, {"start": 324.65, "end": 327.94, "text": "她在X上发长文回应RT的嘲讽：", "en": "She posted a long article on X in response to RT's mockery:"}, {"start": 327.94, "end": 332.81, "text": "“我确实说过那些话，但我不会删除旧帖，因为我意识到自己错了…", "en": "“I did say those things, but I won't delete my old posts, because I realised I was wrong…"}, {"start": 332.81, "end": 335.5, "text": "我被俄罗斯媒体宣传洗脑了。", "en": "I was brainwashed by Russian media propaganda."}, {"start": 335.5, "end": 337.61, "text": "所以我来到乌克兰亲眼验证。", "en": "So I came to Ukraine to verify with my own eyes."}, {"start": 337.61, "end": 343.56, "text": "第一天我就看到布查死去的神父、万人坑，以及战俘被刻纳粹符号的照片。", "en": "On the first day I saw dead priests in Bucha, mass graves, and photos of prisoners of war carved with Nazi symbols."}, {"start": 343.56, "end": 345.12, "text": "谁才是纳粹？", "en": "Who are the Nazis?"}, {"start": 345.12, "end": 346.75, "text": "🤔 我被骗了多年。", "en": "🤔 I was deceived for years."}, {"start": 346.75, "end": 349.44, "text": "乌克兰和泽连斯基不是圣战辩护者…", "en": "Ukraine and Zelensky are not jihad apologists…"}, {"start": 349.44, "end": 351.31, "text": "俄罗斯和普京才是！", "en": "Russia and Putin are!"}, {"start": 351.31, "end": 353.35, "text": "俄罗斯非常擅长信息战。", "en": "Russia is very good at information warfare."}, {"start": 353.35, "end": 358.15, "text": "”", "en": "”"}, {"start": 358.15, "end": 365.54, "text": "她进一步指出：俄罗斯一边自称东正教保护者，一边屠杀乌克兰基督徒，还与伊斯兰激进势力结盟。", "en": "She further pointed out: Russia claims to be the protector of Orthodoxy on the one hand, while massacring Ukrainian Christians on the other, and allying with Islamic radical forces."}, {"start": 365.54, "end": 370.1, "text": "信息战的残酷真相：俄罗斯叙事已破产", "en": "The brutal truth of information warfare: the Russian narrative has gone bankrupt."}, {"start": 370.1, "end": 372.62, "text": "卢默的转变证明了三点：", "en": "Loomer's transformation proves three points:"}, {"start": 372.62, "end": 376.1, "text": "信息战比热战更隐蔽、更持久。", "en": "Information warfare is more covert and more enduring than hot war."}, {"start": 376.1, "end": 379.78, "text": "即使是经验丰富的调查记者，也可能中招。", "en": "Even experienced investigative journalists can fall for it."}, {"start": 379.78, "end": 381.74, "text": "回音室效应致命。", "en": "The echo chamber effect is deadly."}, {"start": 381.74, "end": 384.43, "text": "单一信息源会扭曲认知。", "en": "A single information source distorts cognition."}, {"start": 384.43, "end": 386.06, "text": "事实最终胜出。", "en": "Facts ultimately win."}, {"start": 386.06, "end": 390.7, "text": "亲身调查+多元验证，是破解虚假宣传的利器。", "en": "Personal investigation plus diverse verification is a powerful tool for cracking false propaganda."}, {"start": 390.7, "end": 398.78, "text": "俄罗斯的“去纳粹化”“自卫反击”等叙事，在布查铁证和卢默亲身经历面前彻底破产。", "en": "Russia's narratives of 'denazification' and 'self-defensive counterattack' have completely collapsed in the face of the Bucha iron-clad evidence and Loomer's personal experience."}, {"start": 398.78, "end": 406.58, "text": "这也提醒我们：在复杂国际事务中，绝不能只听一面之词，不要陷入“信息茧房”。", "en": "This also reminds us: in complex international affairs, we must never listen to only one side, and must not fall into an 'information cocoon'."}, {"start": 406.58, "end": 408.38, "text": "你怎么看这场大翻车？", "en": "What do you think of this big reversal?"}, {"start": 408.38, "end": 411.86, "text": "卢默是真心悔悟，还是另有算计？", "en": "Is Loomer genuinely repentant, or does she have other calculations?"}, {"start": 411.86, "end": 415.1, "text": "俄罗斯信息战在今天还有多大威力？", "en": "How powerful is Russian information warfare today?"}, {"start": 415.1, "end": 416.86, "text": "欢迎在评论区讨论！", "en": "Welcome to discuss in the comments section!"}, {"start": 416.86, "end": 420.82, "text": "点赞、转发、收藏，让更多人看到信息战的真相！", "en": "Like, share and save, so more people can see the truth about information warfare!"}, {"start": 420.82, "end": 421.66, "text": "参考", "en": "References"}, {"start": 421.66, "end": 431.69, "text": "^回音室（Echo Chamber）：指人们只接触与自己观点一致的信息，相互强化、不断“回音”，导致极端化和拒绝异见。", "en": "^Echo Chamber: refers to people only coming into contact with information consistent with their own views, reinforcing each other and constantly 'echoing', leading to polarisation and rejection of dissent."}, {"start": 431.69, "end": 434.76, "text": "强调群体内部放大和自我封闭。", "en": "It emphasises amplification within the group and self-enclosure."}, {"start": 434.76, "end": 447.19, "text": "^信息茧房（Information Cocoon）：更强调算法推荐和个性化推送，让用户被“茧”裹住，只看到自己喜欢/同意的内容，逐渐与外界脱节。", "en": "^Information Cocoon: places more emphasis on algorithmic recommendations and personalised pushes, wrapping users in a 'cocoon' so they only see content they like/agree with, gradually becoming disconnected from the outside world."}, {"start": 447.19, "end": 449.88, "text": "侧重技术驱动的被动隔离。", "en": "It focuses on technology-driven passive isolation."}, {"start": 449.88, "end": 459.24, "text": "^卢默在播客和帖文中反复提到的指控，但需要区分声明与证据：俄罗斯自称“东正教庇护者”：这是事实。", "en": "^An accusation Loomer repeatedly mentioned in podcasts and posts, but claims must be distinguished from evidence: Russia calling itself the 'protector of Orthodoxy': this is a fact."}, {"start": 459.24, "end": 471.65, "text": "普京多次将俄罗斯定位为全球东正教和传统基督教价值的守护者，反对西方“堕落”，并以此为入侵乌克兰的部分理由（“保护顿巴斯基督徒”等）。", "en": "Putin has repeatedly positioned Russia as the guardian of global Orthodox and traditional Christian values, opposing Western 'degeneracy', and used this as part of the justification for invading Ukraine ('protecting Donbas Christians' and so on)."}, {"start": 471.65, "end": 489.72, "text": "支持美国本土新纳粹势力：这是卢默的推论，她指出俄罗斯媒体/账号常放大或间接支持美国极右翼团体（包括部分有新纳粹背景的），尤其在反乌克兰、反犹太或反全球主义议题上。", "en": "Supporting domestic American neo-Nazi forces: this is Loomer's inference. She points out that Russian media/accounts often amplify or indirectly support American far-right groups (including some with neo-Nazi backgrounds), especially on anti-Ukraine, anti-Jewish or anti-globalist issues."}, {"start": 489.72, "end": 496.8, "text": "俄罗斯还被指通过RT、社交媒体放大西方分裂，包括白人至上主义叙事，以制造混乱。", "en": "Russia is also accused of amplifying Western divisions through RT and social media, including white-supremacist narratives, to create chaos."}, {"start": 496.8, "end": 506.23, "text": "客观事实层面：俄罗斯确实与全球极右翼/白人民族主义者有联系历史（如与某些欧洲极右政党往来）。", "en": "At the level of objective fact: Russia does have a history of connections with global far-right/white nationalist figures (such as dealings with certain European far-right parties)."}, {"start": 506.23, "end": 519.74, "text": "但“直接支持美国本土新纳粹”缺乏公开确凿的官方资助证据，更像是信息战中的相互利用：俄罗斯放大西方内部极端声音来削弱对手，美国部分极右也借俄罗斯平台发声。", "en": "But 'directly supporting domestic American neo-Nazis' lacks publicly conclusive evidence of official funding; it is more like mutual exploitation in information warfare: Russia amplifies extreme voices within the West to weaken its opponents, while some American far-right figures also use Russian platforms to speak out."}, {"start": 519.74, "end": 536.78, "text": "卢默用此对比俄罗斯宣传的虚伪：一边宣称保护基督徒，一边在信息战中与/支持“实际新纳粹”合作。", "en": "Loomer uses this to contrast the hypocrisy of Russian propaganda: claiming to protect Christians on the one hand, while cooperating with/supporting 'actual neo-Nazis' in information warfare on the other."}, {"start": 536.78, "end": 545.95, "text": "总结：这是卢默觉醒的关键矛盾点——宣传形象 vs 实际行为的反差，帮助她打破对俄罗斯的“玫瑰色滤镜”。", "en": "Summary: this is the key contradiction in Loomer's awakening — the contrast between propaganda image and actual behaviour, which helped her break through the 'rose-tinted filter' on Russia."}, {"start": 545.95, "end": 551.83, "text": "是否“支持”仍存争议，但俄罗斯利用西方极右分裂是公认的信息战策略。", "en": "Whether it counts as 'support' remains disputed, but Russia's use of Western far-right divisions is a recognised information-warfare strategy."}]}, {"title": "怎样避免活在信息茧房之中？ Part 15（147句，18:41）", "mp3": "upload-8-part15/audio.mp3", "dur": "18:41", "lines": [{"start": 0.0, "end": 1.27, "text": "「主动地被动」", "en": "'Actively Passive'"}, {"start": 1.27, "end": 3.86, "text": "在我看来，信息茧房有两种类型，", "en": "In my view, there are two types of information cocoons."}, {"start": 3.86, "end": 8.06, "text": "第一种，也就是题主提到的——「每天推送的都是类似的东西」。", "en": "The first type is what the question asker mentioned — 'being pushed similar things every day'."}, {"start": 8.06, "end": 10.15, "text": "这种信息茧房源于推荐算法。", "en": "This kind of information cocoon stems from recommendation algorithms."}, {"start": 10.15, "end": 13.99, "text": "算法认为你是某一类人，便死命推荐这类信息。", "en": "The algorithm thinks you are a certain type of person, and then desperately recommends this type of information."}, {"start": 13.99, "end": 16.39, "text": "我将这种称为「被动信息茧房」；", "en": "I call this the 'passive information cocoon';"}, {"start": 16.39, "end": 20.83, "text": "而第二种则更为可怕：主动的信息茧房。", "en": "And the second type is even more frightening: the active information cocoon."}, {"start": 20.83, "end": 24.62, "text": "你喜欢某类信息、观点，便主动去搜索。", "en": "You like a certain type of information or view, so you actively search for it."}, {"start": 24.62, "end": 28.87, "text": "同时，又对其他信息、观点充耳不闻，甚至拉黑。", "en": "At the same time, you turn a deaf ear to other information and views, and even block them."}, {"start": 28.87, "end": 30.96, "text": "对于第二点，我深有体会。", "en": "I have deep experience of the second point."}, {"start": 30.96, "end": 36.12, "text": "从2020年疫情爆发到现在，居家办公的时间较之前增长了很多。", "en": "From the outbreak of the pandemic in 2020 until now, the time I have spent working from home has grown a lot compared with before."}, {"start": 36.12, "end": 38.47, "text": "居家办公，时间自由了很多。", "en": "Working from home, time has become much freer."}, {"start": 38.47, "end": 41.23, "text": "但我获得的信息却少了太多。", "en": "But the information I obtain has decreased far too much."}, {"start": 41.23, "end": 45.62, "text": "细细想来，还是在于外界的随机信息减少了太多。", "en": "Thinking carefully, it is still because random information from the outside world has decreased far too much."}, {"start": 45.62, "end": 49.66, "text": "想想之前的一天，到处都是被动的、随机的信息：", "en": "Think about a previous day: everywhere there was passive, random information:"}, {"start": 49.66, "end": 51.86, "text": "去学校的路上会看到各种东西；", "en": "On the way to school you would see all kinds of things;"}, {"start": 51.86, "end": 54.02, "text": "学校墙上会有随机的海报；", "en": "There would be random posters on the school walls;"}, {"start": 54.02, "end": 56.59, "text": "实验室同学聊天的时候也会有各种东西。", "en": "When classmates in the lab chatted, there would also be all kinds of things."}, {"start": 56.59, "end": 59.35, "text": "这些信息都是你不会主动去搜寻的。", "en": "This information is all things you would not actively search for."}, {"start": 59.35, "end": 63.74, "text": "换句话说，你不光不知道这些信息，你甚至都不知道自己不知道。", "en": "In other words, you not only do not know this information, you do not even know that you do not know."}, {"start": 63.74, "end": 70.54, "text": "而随机、被动的获取信息正是信息茧房的一个破口，让你看到茧房之外的东西。", "en": "And randomly and passively obtaining information is precisely a breach in the information cocoon, letting you see things outside the coco
