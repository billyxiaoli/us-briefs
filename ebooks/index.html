<script>
const SECTIONS=[{"title": "35岁的我谈了个男大… — 第1部分（143句，7:02）", "mp3": "upload-7-part1/audio.mp3", "dur": "7:02", "lines": [{"start": 0.0, "end": 4.2, "text": "35 岁的我谈了个男大，他精力十分旺盛。", "en": "At 35, I'm dating a college guy, and he is bursting with energy."}, {"start": 4.2, "end": 7.14, "text": "只是在床上时，他会突然来句：", "en": "It's just that in bed, he suddenly blurts out:"}, {"start": 7.14, "end": 8.82, "text": "「姐姐，别动。」", "en": "“Sis, don't move.”"}, {"start": 8.82, "end": 12.18, "text": "「让我闻闻你身上有没有老人味。」", "en": "“Let me smell whether you have an old-person smell on you.”"}, {"start": 12.18, "end": 13.65, "text": "这话实在难听。", "en": "Those words are really harsh."}, {"start": 13.65, "end": 18.48, "text": "我强忍着将他踹翻的冲动，决定睡腻了跟他提分手。", "en": "I fought back the urge to kick him over, and decided that once I'd had enough of sleeping with him, I'd break up with him."}, {"start": 18.48, "end": 21.0, "text": "直到前两天，我俩约会时。", "en": "Until two days ago, when we were on a date."}, {"start": 21.0, "end": 22.47, "text": "周煜他爸找来，", "en": "Zhou Yu's father came looking for him,"}, {"start": 22.47, "end": 24.15, "text": "「谈女朋友了？」", "en": "“So you've got a girlfriend?”"}, {"start": 24.15, "end": 25.41, "text": "我浑身僵硬。", "en": "My whole body went stiff."}, {"start": 25.41, "end": 28.98, "text": "周煜这位古板严苛的爸，是我的前任。", "en": "Zhou Yu's old-fashioned, strict father is my ex."}, {"start": 28.98, "end": 29.19, "text": "1", "en": "1"}, {"start": 29.19, "end": 32.55, "text": "周景焕给我留下的阴影实在太深了。", "en": "The shadow Zhou Jinghuan left on me runs far too deep."}, {"start": 32.55, "end": 37.8, "text": "以至于现在，想到这三个字，我的身体就忍不住打哆嗦。", "en": "So much so that even now, just thinking of those three characters makes my body tremble involuntarily."}, {"start": 37.8, "end": 39.48, "text": "这次跟周煜见面。", "en": "This time, meeting Zhou Yu."}, {"start": 39.48, "end": 42.63, "text": "也是因为知道了他爸就是周景焕。", "en": "It was also because I knew his father was Zhou Jinghuan."}, {"start": 42.63, "end": 45.15, "text": "决定跟他再玩一次就分手。", "en": "I decided to play with him one more time and then break up."}, {"start": 45.15, "end": 49.56, "text": "因此，刚才的几个小时里，我任由着周煜胡闹。", "en": "So, during the past few hours, I let Zhou Yu fool around as he pleased."}, {"start": 49.56, "end": 50.19, "text": "毕竟。", "en": "After all."}, {"start": 50.19, "end": 52.5, "text": "他这种年轻又能力强的。", "en": "Someone young and capable like him."}, {"start": 52.5, "end": 53.76, "text": "实在不好找。", "en": "Is really hard to find."}, {"start": 53.76, "end": 56.28, "text": "我起身，慢吞吞地穿好了衣物。", "en": "I got up and slowly got dressed."}, {"start": 56.28, "end": 58.81, "text": "恰好，周煜也从浴室走了出来。", "en": "Just then, Zhou Yu also came out of the bathroom."}, {"start": 58.81, "end": 66.02, "text": "我盯着他上半身结实的腹肌，尽管满眼不舍，还是坚定地开了口：「周煜，我们分手吧。」", "en": "I stared at his firm abs on his upper body, and although I was full of reluctance, I still firmly said, “Zhou Yu, let's break up.”"}, {"start": 66.02, "end": 68.18, "text": "青年擦拭头发的动作一顿。", "en": "The young man's motion of towelling his hair paused."}, {"start": 68.18, "end": 69.45, "text": "抬眼朝我看来。", "en": "He looked up at me."}, {"start": 69.45, "end": 71.97, "text": "他唇角微勾，语气中满是戏谑。", "en": "The corner of his mouth curled up, his tone full of teasing."}, {"start": 71.97, "end": 75.21, "text": "「姐姐，别说这种气话，我会当真的。」", "en": "“Sis, don't say that in anger. I'll take it seriously.”"}, {"start": 75.21, "end": 77.92, "text": "我摇了摇头，说：「不是气话。」", "en": "I shook my head and said, “It's not said in anger.”"}, {"start": 77.92, "end": 80.08, "text": "周煜却没听进去我的解释。", "en": "But Zhou Yu didn't take in my explanation."}, {"start": 80.08, "end": 89.82, "text": "他轻叹了声，无奈道：「姐姐，我说得没错啊，你的年纪都够做我的后妈了。我要是把你带回去，我爸真的会打死我的。」", "en": "He sighed softly and said helplessly, “Sis, what I said wasn't wrong. You're old enough to be my stepmother. If I took you home, my dad would really beat me to death.”"}, {"start": 89.82, "end": 90.9, "text": "我蹙了蹙眉。", "en": "I furrowed my brow."}, {"start": 90.9, "end": 94.14, "text": "开始怀疑周煜这小子是不是听不懂人话。", "en": "I began to wonder whether this kid Zhou Yu simply couldn't understand human speech."}, {"start": 94.14, "end": 98.11, "text": "我跟他在一起，纯粹是馋他身子，只想玩玩而已。", "en": "Being with him, I was purely lusting after his body. I only wanted to play around."}, {"start": 98.11, "end": 98.83, "text": "更何况。", "en": "Besides."}, {"start": 98.83, "end": 101.1, "text": "他爸还是周景焕这尊煞神。", "en": "His father is still that terrifying figure Zhou Jinghuan."}, {"start": 101.1, "end": 102.62, "text": "谁要跟他回家啊。", "en": "Who would want to go home with him?"}, {"start": 102.62, "end": 103.94, "text": "我深吸了口气。", "en": "I took a deep breath."}, {"start": 103.94, "end": 105.83, "text": "正打算向周煜说清楚。", "en": "I was just about to make it clear to Zhou Yu."}, {"start": 105.83, "end": 108.48, "text": "下一秒，他的手机铃声却响了。", "en": "The next second, his phone rang."}, {"start": 108.48, "end": 110.38, "text": "少年毫不避讳地接听。", "en": "The young man answered without any hesitation."}, {"start": 110.38, "end": 114.35, "text": "很快，手机里传来嘈杂的声音，以及一道男声。", "en": "Soon, noisy voices came through the phone, along with a male voice."}, {"start": 114.35, "end": 117.76, "text": "「周哥，来酒吧玩儿啊，大家都在呢。」", "en": "“Brother Zhou, come play at the bar. Everyone's here.”"}, {"start": 117.76, "end": 119.65, "text": "周煜朝我这边看了眼。", "en": "Zhou Yu glanced over at me."}, {"start": 119.65, "end": 120.78, "text": "一时没说话。", "en": "He didn't speak for a moment."}, {"start": 120.78, "end": 127.6, "text": "他犹豫的空当，那边又传来一道娇软的嗓音，「阿煜，你不来的话，我就走啦。」", "en": "While he hesitated, a soft, sweet voice came from the other end: “A Yu, if you don't come, I'm leaving.”"}, {"start": 127.6, "end": 131.0, "text": "周煜喉结滚了滚，不知想到什么，笑了。", "en": "Zhou Yu's Adam's apple bobbed. Thinking of something, he laughed."}, {"start": 131.0, "end": 132.52, "text": "「行，等着我。」", "en": "“Fine, wait for me.”"}, {"start": 132.52, "end": 133.46, "text": "挂断电话。", "en": "He hung up."}, {"start": 133.46, "end": 135.54, "text": "他动作利落地穿好衣服。", "en": "He got dressed swiftly."}, {"start": 135.54, "end": 140.46, "text": "即将出门时，似乎才想起我的存在，头也不回地留下了句。", "en": "Just as he was about to leave, he seemed to remember I existed, and left a remark without even turning his head."}, {"start": 140.46, "end": 142.54, "text": "「我去跟同龄人玩玩。」", "en": "“I'm going to play with people my own age.”"}, {"start": 142.54, "end": 144.25, "text": "我平静地点了点头。", "en": "I nodded calmly."}, {"start": 144.25, "end": 147.28, "text": "周煜前脚离开，我后脚就去退了房。", "en": "Zhou Yu had barely left when I went and checked out of the room."}, {"start": 147.28, "end": 148.03, "text": "到家后。", "en": "After getting home."}, {"start": 148.03, "end": 150.14, "text": "我照常洗漱上床。", "en": "I washed up and got into bed as usual."}, {"start": 150.14, "end": 154.99, "text": "这两年，始终保持着晚上十一点前睡觉的规律作息。", "en": "For the past two years, I've kept a regular routine of sleeping before eleven at night."}, {"start": 154.99, "end": 155.88, "text": "只是。", "en": "Only."}, {"start": 155.88, "end": 157.85, "text": "今晚躺在床上。", "en": "Tonight, lying in bed."}, {"start": 157.85, "end": 160.18, "text": "却有些翻来覆去地睡不着。", "en": "I tossed and turned, unable to sleep."}, {"start": 160.18, "end": 166.18, "text": "而在深夜，孤身一人时，总是控制不住将一些记忆翻出来回味。", "en": "And late at night, when I'm alone, I always can't help turning over old memories and savouring them."}, {"start": 166.18, "end": 166.94, "text": "2", "en": "2"}, {"start": 166.94, "end": 168.55, "text": "我和周煜的相识。", "en": "How Zhou Yu and I met."}, {"start": 168.55, "end": 169.58, "text": "也是在酒吧。", "en": "Was also at a bar."}, {"start": 169.58, "end": 171.67, "text": "他给我点了杯茉莉朗姆酒。", "en": "He ordered me a jasmine rum."}, {"start": 171.67, "end": 173.28, "text": "恰好我又钟情茉莉。", "en": "And I happen to love jasmine."}, {"start": 173.28, "end": 184.08, "text": "因此，青年双手合十，用一双漂亮的桃花眼恳求：「姐姐，我输了游戏，他们让我拿到你的联系方式，可以帮帮我吗？」", "en": "So the young man put his hands together and pleaded with a pair of beautiful peach-blossom eyes: “Sis, I lost a game. They told me to get your contact information. Can you help me?”"}, {"start": 184.08, "end": 185.04, "text": "我点头。", "en": "I nodded."}, {"start": 185.04, "end": 186.53, "text": "跟他交换了联系方式。", "en": "And exchanged contact information with him."}, {"start": 186.53, "end": 187.73, "text": "从那天起。", "en": "From that day on."}, {"start": 187.73, "end": 190.32, "text": "我和周煜几乎每天都保持着联系。", "en": "Zhou Yu and I stayed in touch almost every day."}, {"start": 190.32, "end": 196.49, "text": "他说话很有趣，还总能从闲谈的三言两语中，准确地挖掘出我喜欢什么。", "en": "He's fun to talk to, and he can always pick out exactly what I like from a few casual remarks in idle chat."}, {"start": 196.49, "end": 197.93, "text": "并投其所好。", "en": "And cater to my tastes."}, {"start": 197.93, "end": 201.72, "text": "人真的很难不被旺盛的生命力吸引。", "en": "It's really hard for a person not to be drawn to such exuberant vitality."}, {"start": 201.72, "end": 202.75, "text": "更何况。", "en": "Besides."}, {"start": 202.75, "end": 204.86, "text": "周煜年轻帅气。", "en": "Zhou Yu is young and handsome."}, {"start": 204.86, "end": 207.1, "text": "还对我保持着十足的热忱。", "en": "And he remains full of enthusiasm for me."}, {"start": 207.1, "end": 208.94, "text": "察觉到自己的心意后。", "en": "After realising my own feelings."}, {"start": 208.94, "end": 211.34, "text": "我果断选择了跟周煜在一起。", "en": "I decisively chose to be with Zhou Yu."}, {"start": 211.34, "end": 214.99, "text": "而他也表现得很不错，每次都能给我完美的体验。", "en": "And he performed very well, giving me a perfect experience every time."}, {"start": 214.99, "end": 217.94, "text": "事情的转折点发生在我生日那天。", "en": "The turning point came on my birthday."}, {"start": 217.94, "end": 219.5, "text": "我发了一条朋友圈：", "en": "I posted a Moments update:"}, {"start": 219.5, "end": 222.19, "text": "【人生如此刻，一切正当时。】", "en": "“Life is like this moment; everything is just right.”"}, {"start": 222.19, "end": 226.8, "text": "配图是一个生日蛋糕，上面插着「35 岁」字样的蜡烛。", "en": "The accompanying picture was a birthday cake with candles shaped like the characters for “35”."}, {"start": 226.8, "end": 227.83, "text": "没一会儿。", "en": "Before long."}, {"start": 227.83, "end": 230.42, "text": "周煜就将这条朋友圈截图发给了我。", "en": "Zhou Yu sent me a screenshot of that Moments post."}, {"start": 230.42, "end": 235.39, "text": "【姐姐，原来你也喜欢玩儿抽象啊？哈哈哈哈。】", "en": "“Sis, so you like playing at being abstract too? Hahaha.”"}, {"start": 235.39, "end": 240.38, "text": "【明明是二十五岁，怎么还非要买三十五岁的生日蛋糕。】", "en": "“You're clearly twenty-five. Why insist on buying a thirty-five-year-old's birthday cake?”"}, {"start": 240.38, "end": 241.54, "text": "我愣了愣。", "en": "I froze."}, {"start": 241.54, "end": 243.26, "text": "一时间没反应过来。", "en": "For a moment, I didn't react."}, {"start": 243.26, "end": 248.95, "text": "下意识回复：【我确实三十五岁了。】", "en": "I replied instinctively: “I really am thirty-five.”"}, {"start": 248.95, "end": 250.82, "text": "我对自己的年龄没什么忌讳。", "en": "I have no hang-ups about my age."}, {"start": 250.82, "end": 254.9, "text": "闻言，周煜却发来一个小狗大哭的表情包。", "en": "Hearing that, Zhou Yu sent a sticker of a puppy crying its eyes out."}, {"start": 254.9, "end": 257.59, "text": "【姐姐，你别玩儿我了。】", "en": "“Sis, stop teasing me.”"}, {"start": 257.59, "end": 262.51, "text": "【你这么年轻漂亮，说是女大学生我都信，怎么可能三十五岁呢？】", "en": "“You're so young and beautiful. I'd believe it if you said you were a female university student. How could you possibly be thirty-five?”"}, {"start": 262.51, "end": 265.44, "text": "我只好将打码的身份证照片发了过去。", "en": "I had no choice but to send him a photo of my ID card with parts blurred out."}, {"start": 265.44, "end": 267.53, "text": "看清上面的出生日期后。", "en": "After seeing the date of birth on it clearly."}, {"start": 267.53, "end": 269.04, "text": "周煜沉默了。", "en": "Zhou Yu fell silent."}, {"start": 269.04, "end": 271.13, "text": "我也才后知后觉地反应过来。", "en": "Only then did I belatedly realise."}, {"start": 271.13, "end": 272.52, "text": "他猜错了我的年龄。", "en": "He had guessed my age wrong."}, {"start": 272.52, "end": 278.57, "text": "难怪之前好几次，我提到自己三十来岁时，周煜总是说我爱开玩笑。", "en": "No wonder, several times before, when I mentioned being in my thirties, Zhou Yu always said I loved to joke."}, {"start": 278.57, "end": 279.72, "text": "那次过后。", "en": "After that time."}, {"start": 279.72, "end": 282.53, "text": "我以为，周煜会向我提分手。", "en": "I thought Zhou Yu would break up with me."}, {"start": 282.53, "end": 284.04, "text": "可出乎意料的是。", "en": "But unexpectedly."}, {"start": 284.04, "end": 285.53, "text": "他没有。", "en": "He didn't."}, {"start": 285.53, "end": 290.02, "text": "大概是接受了这个事实，他照常约我出门，像个没事人一样。", "en": "Probably having accepted the fact, he kept inviting me out as usual, as if nothing had happened."}, {"start": 290.02, "end": 292.1, "text": "只是偶尔在床上时。", "en": "Only occasionally, in bed."}, {"start": 292.1, "end": 294.7, "text": "青年会嗅着我的脖颈，突然来一句：", "en": "The young man would sniff at my neck and suddenly say:"}, {"start": 294.7, "end": 296.57, "text": "「姐姐，别动。」", "en": "“Sis, don't move.”"}, {"start": 296.57, "end": 299.16, "text": "「让我闻闻你身上有没有老人味。」", "en": "“Let me smell whether you have an old-person smell on you.”"}, {"start": 299.16, "end": 301.16, "text": "周煜这句话实在难听。", "en": "That remark of Zhou Yu's is really harsh."}, {"start": 301.16, "end": 303.95, "text": "可他年轻健壮，又实在吸引我。", "en": "But he is young and strong, and really attractive to me."}, {"start": 303.95, "end": 305.55, "text": "短暂的纠结过后。", "en": "After a brief struggle."}, {"start": 305.55, "end": 310.94, "text": "我强忍住了将他一脚踹翻的冲动，决定睡腻了就向他提分手。", "en": "I held back the urge to kick him over and decided that once I'd had enough of sleeping with him, I'd break up with him."}, {"start": 310.94, "end": 311.54, "text": "毕竟。", "en": "After all."}, {"start": 311.54, "end": 314.74, "text": "在外面包一个男大学生还得花钱呢。", "en": "Keeping a male university student on the side would cost money."}, {"start": 314.74, "end": 316.33, "text": "而周煜是免费的。", "en": "But Zhou Yu is free."}, {"start": 316.33, "end": 318.53, "text": "颜值和身材还都是极品。", "en": "And his looks and figure are both top-notch."}, {"start": 318.53, "end": 324.72, "text": "如果不是突然得知他爸是周景焕，我本来打算跟周煜再……谈一周的。", "en": "If I hadn't suddenly learned that his father is Zhou Jinghuan, I had originally planned to keep dating Zhou Yu for… another week."}, {"start": 324.72, "end": 325.92, "text": "直到前两天。", "en": "Until two days ago."}, {"start": 325.92, "end": 328.12, "text": "周煜跟家里人打电话时。", "en": "When Zhou Yu was on the phone with his family."}, {"start": 328.12, "end": 330.11, "text": "没忍住冲着手机大吼。", "en": "He couldn't help shouting into the phone."}, {"start": 330.11, "end": 333.51, "text": "「周景焕，我的事情，用不着你管！」", "en": "“Zhou Jinghuan, my business is none of your concern!”"}, {"start": 333.51, "end": 335.51, "text": "听见这个熟悉的名字。", "en": "Hearing that familiar name."}, {"start": 335.51, "end": 337.1, "text": "我吓得浑身一抖。", "en": "I trembled all over in fright."}, {"start": 337.1, "end": 344.29, "text": "事后，旁敲侧击地询问他爸的身份，终于确定了这就是我之前谈过的那个周景焕。", "en": "Afterwards, I asked about his father's identity in a roundabout way, and finally confirmed that this was the Zhou Jinghuan I had dated before."}, {"start": 344.29, "end": 345.69, "text": "顿时心如死灰。", "en": "My heart instantly turned to ashes."}, {"start": 345.69, "end": 346.49, "text": "我知道。", "en": "I knew."}, {"start": 346.49, "end": 348.29, "text": "免费的鸭子要没了。", "en": "The free duck was about to be gone."}, {"start": 348.29, "end": 357.29, "text": "如果让周景焕知道，继拱了他这颗大白菜之后，我又霍霍了他儿子。", "en": "If Zhou Jinghuan found out that, after taking advantage of his prized cabbage, I had then gone after his son as well."}, {"start": 357.29, "end": 360.89, "text": "肯定会让我吃不了兜着走。", "en": "He would definitely make me pay dearly."}, {"start": 360.89, "end": 361.19, "text": "3", "en": "3"}, {"start": 361.19, "end": 365.69, "text": "次日，天刚亮，就响起了敲门声。", "en": "The next day, just as dawn broke, there was a knock on the door."}, {"start": 365.69, "end": 367.19, "text": "拉开房门。", "en": "I opened the door."}, {"start": 367.19, "end": 368.99, "text": "外面站着的。", "en": "Standing outside."}, {"start": 368.99, "end": 371.69, "text": "是一宿没睡的周煜。", "en": "Was Zhou Yu, who hadn't slept all night."}, {"start": 371.69, "end": 389.39, "text": "看见我，他露出一抹「果然如此」的笑，低声道：「姐姐，我就知道你醒了。你们这种上了年纪的女人，是不是都特别注重养生啊？」", "en": "Seeing me, he gave an “as I expected” smile and said quietly, “Sis, I knew you were awake. Do women your age all pay such attention to staying healthy?”"}, {"start": 389.39, "end": 392.4, "text": "我面无表情地看着他。", "en": "I looked at him expressionlessly."}, {"start": 392.4, "end": 396.3, "text": "一个「滚」字即将脱口而出。", "en": "The word “get lost” was about to escape my mouth."}, {"start": 396.3, "end": 404.4, "text": "下一刻，周煜却轻车熟路地走了进来，还将我一把搂进怀里。", "en": "The next moment, Zhou Yu walked in as if he knew the place well and pulled me into his arms."}, {"start": 404.4, "end": 409.5, "text": "被触碰到的肌肤瞬间生起滚烫的热意。", "en": "The skin he touched instantly burned with heat."}, {"start": 409.5, "end": 417.0, "text": "青年的下巴搁在我的发顶，半眯着眼睛，语气懒洋洋的。", "en": "The young man's chin rested on the top of my head, his eyes half-closed, his tone lazy."}, {"start": 417.0, "end": 422.38, "text": "「姐姐，才一晚上不见，我就好想你。」", "en": "“Sis, after just one night apart, I already miss you so much.”"}]}, {"title": "什么算是人生的顶级享受？ — 第1楼（20句，3:21）", "mp3": "test-zhihu-top-enjoyment/audio.mp3", "dur": "3:21", "lines": [{"start": 0.0, "end": 17.33, "text": "我是个小的不能再小的老板，公司从事农业，所以有一群给我干农活的阿姨，她们都是本地最淳朴的那一波农村人，没有受过什么教育，拿着最低的待遇，面对最毒辣的太阳，无论风吹日晒，都做着最原始的农事。", "en": "I'm the smallest boss you can imagine. My company works in agriculture, so I have a group of aunties doing farm work for me. They are the most down-to-earth local country folk, with little education, earning the lowest pay, facing the harshest sun, and doing the most basic farm work in all weather."}, {"start": 17.33, "end": 22.66, "text": "每天准时上班按时下班，没有休息，却也勤勤恳恳。", "en": "They clock in and out on time every day, with no days off, yet they work diligently."}, {"start": 22.66, "end": 28.54, "text": "我平时来去匆匆好像和他们交集不多，并没有太多的了解和交情。", "en": "I usually come and go in a hurry, so I didn't interact with them much, and didn't really know them or have much of a relationship with them."}, {"start": 28.54, "end": 37.97, "text": "前几年企业状态不是很好，所以过往三八妇女节公司里都是只考虑到管理层女性的福利，没有想过这些阿姨。", "en": "A few years ago the business wasn't doing well, so on past Women's Days the company only thought about benefits for women in management, never about these aunties."}, {"start": 37.97, "end": 48.65, "text": "今年三八节当天，恰巧我也在公司，因为又有订单，于是让阿姨他们加班到很晚，但和无数个普通的日夜一样，他们依然按时按质的完成所有的工作。", "en": "This Women's Day, I happened to be at the company, and because there was another order, I had the aunties work overtime late into the night. But just like countless ordinary days and nights, they still finished all the work on time and to standard."}, {"start": 48.65, "end": 61.18, "text": "看着他们拖着疲劳的身体，在下班后背上自己的锄头和劳动工具，还要在漆黑的乡下夜晚里步行几公里回家，突然我觉得作为老板有一丝过分和愧疚感。", "en": "Watching them drag their tired bodies home after work, carrying their hoes and tools on their backs, and still having to walk several kilometres home in the pitch-dark countryside night, I suddenly felt, as their boss, a little excessive and guilty."}, {"start": 61.18, "end": 72.86, "text": "于是三八节第二天，我决定改变一下，包了一张大巴车，包了一个温泉山庄，定了几桌饭，给这些阿姨算正常考勤，然后带着他们出游了high了一整天。", "en": "So the day after Women's Day, I decided to change things. I chartered a bus, booked a hot-spring resort, reserved several tables for dinner, counted the day as normal attendance for these aunties, and took them out for a whole day of fun."}, {"start": 72.86, "end": 86.54, "text": "在这一天里，这些平日素面朝天的阿姨翻遍了衣柜，穿上了自己最漂亮的衣服，甚至涂上了口红，一路吹着口哨唱着歌，那些他们几年都没更新过的朋友圈，一天之内如同直播一般的推送。", "en": "On that day, these aunties who normally go without makeup searched through their wardrobes, put on their prettiest clothes, even applied lipstick, and whistled and sang all the way there. Their social media feeds, untouched for years, were updated that day like a live broadcast."}, {"start": 86.54, "end": 93.91, "text": "他们也狠下心，给自己买了最红最艳的泳衣，漂亮的在泳池里用手机留着纪念。", "en": "They also treated themselves and bought the reddest, brightest swimsuits, and took beautiful photos with their phones in the pool as keepsakes."}, {"start": 93.91, "end": 101.18, "text": "我长这么大，该见的也见过了，但老阿姨比基尼派对也是第一次参加，哈哈。", "en": "I've seen a lot in my life, but an aunties' bikini party was a first for me, haha."}, {"start": 101.18, "end": 106.99, "text": "活动结束后的几天内，他们见到我，都会情不自禁眉飞色舞的回忆那一天。", "en": "In the days after the outing, whenever they saw me, they couldn't help but recall that day with great excitement."}, {"start": 106.99, "end": 115.8, "text": "有的人说这是她第一次泡温泉，有的人说这是她最近几年最快乐的一天，有的人甚至把那天的乡村比基尼自拍换成了微信头像。", "en": "Some said it was their first time in a hot spring, some said it was their happiest day in recent years, and some even changed their profile photo to that day's countryside bikini selfie."}, {"start": 115.8, "end": 121.87, "text": "在交谈中，我甚至发现我竟然叫不全他们的名字，纵使他们已经跟着我做了好几年。", "en": "In talking with them, I even discovered that I couldn't name all of them, even though they had worked with me for years."}, {"start": 121.87, "end": 125.35, "text": "但也是这次活动，感觉我和他们距离又拉进了跟多。", "en": "But through this outing, I felt the distance between us had closed a lot more."}, {"start": 125.35, "end": 154.68, "text": "后来了解了一些他们的故事，有的人在省吃俭用给大城市的儿子还房贷，有的人在节衣缩食照顾一家老小，也有人下班后还要回家干农活补贴家用，曾经她们也风华正茂，美丽动人，只是时间和生活淹没了他们的自我和快乐，也许一年到头他们都不会有属于自己的一天，或是一个节日，但很开心成为了那个让他们拥有节日且给予他们快乐的人，这是一种顶配的人生享受，真的。", "en": "Later I learned some of their stories. Some scrimp and save to help their sons pay mortgages in big cities, some live frugally to care for their whole families, and some still do farm work after work to supplement the household income. They were once young and beautiful too, but time and life buried their sense of self and their joy. Maybe for a whole year they never get a single day, or a festival, that belongs to them. I'm so glad I became the person who gave them a festival and a day of happiness. That is truly a top-tier enjoyment of life."}, {"start": 154.68, "end": 163.56, "text": "赚钱让自己花前月下，让自己豪车美女是一种享受方式，当然我相信让老阿姨开心也是。", "en": "Making money to enjoy romance, luxury cars and beautiful company is one way to enjoy life, and of course I believe making these aunties happy is another."}, {"start": 163.56, "end": 182.76, "text": "我很享受收到这些最质朴劳动人民的认可，在三八节能用不到一顿商务宴请的费用，却兑现到了十多个美丽女性快乐的一整天，让他们短暂的忘记了自己是员工，是母亲是儿女是妻子，而记起来了自己是自己。", "en": "I really enjoy earning the recognition of these most down-to-earth working people. On Women's Day, for less than the cost of one business dinner, I delivered a whole happy day to more than ten beautiful women, letting them briefly forget that they are employees, mothers, daughters and wives, and remember that they are themselves."}, {"start": 182.76, "end": 188.33, "text": "我也决定如果我公司没倒闭，往后每一年都坚持这些福利吧。", "en": "I've also decided that if my company doesn't go under, I will keep these benefits going every year from now on."}, {"start": 188.33, "end": 193.08, "text": "与其花呗会所渡佳丽，不如关心身边自己人。", "en": "Rather than spending on fancy clubs and companions, better to care for the people around you."}, {"start": 193.08, "end": 201.07, "text": "谢谢各位精神股东的支持，老规矩，如有一天有幸我能敲钟 各位点赞合伙人均有干股，一言为定。", "en": "Thank you all for your support as my spiritual shareholders. As always, if one day I am fortunate enough to ring the bell, everyone who liked this will get shares. That's a promise."}]}, {"title": "怎样避免活在信息茧房之中？ Part 1（38句，6:28）", "mp3": "upload-8-part01/audio.mp3", "dur": "6:28", "lines": [{"start": 0.0, "end": 1.39, "text": "1.看新闻。", "en": "1. Read the news."}, {"start": 1.39, "end": 11.3, "text": "我建议你把每一期的南方周末的第一版和经济版上的文章都看一遍，不管他们的标题你感不感兴趣，坚持至少三年。", "en": "I suggest you read every issue of Southern Weekly — the front page and the economics section — whether or not the headlines interest you, and keep it up for at least three years."}, {"start": 11.3, "end": 17.47, "text": "三年后你就对各种重大社会事件和经济运行逻辑有了高于普通人的认知。", "en": "After three years, you will have a better-than-average understanding of major social events and how the economy works."}, {"start": 17.47, "end": 29.78, "text": "此外，建议每年选一个社会热点，阅读各主要媒体的相关报道，遇到好的报道就复制保存起来，目前我选过的题材包括当代日本，离婚问题，各种诈骗等。", "en": "Also, each year pick one trending social topic, read the relevant coverage from the major media outlets, and save any good reporting you come across. Topics I have picked so far include contemporary Japan, divorce, and all kinds of scams."}, {"start": 29.78, "end": 41.5, "text": "特别是要关注各类诈骗的新闻，了解骗子们的各种花招，不仅能让你免于上当受骗，还能深入了解别人会怎么给你编织一个茧房来骗你。", "en": "Pay special attention to news about scams: understanding the swindlers' tricks will not only keep you from being cheated, but also help you see how someone can weave a cocoon around you to deceive you."}, {"start": 41.5, "end": 47.54, "text": "最好再去看一下新加坡《联合早报》，唯一不用FQ可以看的外刊。", "en": "It is also worth reading Singapore's Lianhe Zaobao, the only foreign newspaper you can read without bypassing the firewall."}, {"start": 47.54, "end": 49.3, "text": "2.结构化的阅读。", "en": "2. Structured reading."}, {"start": 49.3, "end": 87.02, "text": "我是只书虫，虽然眼镜片不厚，但是从小爱看书，大学时，我跑到图书馆，一个书架一个书架的扫书看，但是我有个很多人都有的毛病，就是什么历史、社会、心理之类自己感兴趣的书就一直看，自己不感兴趣的书就很少涉猎，这其实很不好，容易让自己沉溺在一个小世界里，形成不断自我强化的偏见，所以后来我要求自己除了看自己感兴趣的书，每周还要看一个小时以前比较少看的题材，先是经济，然后哲学，然后会计。", "en": "I am a bookworm. My glasses are not thick, but I have loved reading since I was a child. In university, I would run to the library and sweep through the shelves one by one. But I have a flaw many people share: I kept reading only the books I was interested in — history, society, psychology and the like — and rarely touched what did not interest me. That is actually bad: it easily traps you in a small world and builds up self-reinforcing prejudice. So later I required myself, besides reading what interested me, to spend an hour each week on subjects I used to read less — first economics, then philosophy, then accounting."}, {"start": 87.02, "end": 95.98, "text": "收获是真的觉得自己的世界变大了，看问题的角度也更多元了，比如每周听一小时黑格尔哲学以后，老婆开始听不懂我说啥了。", "en": "The payoff is real: I feel my world has genuinely grown bigger and my perspectives more diverse. For instance, after listening to an hour of Hegel's philosophy each week, my wife started not understanding what I was talking about."}, {"start": 95.98, "end": 106.22, "text": "读书到底有用没用是一个大家长期争论不休的问题，现在，我觉得机构化阅读是在有用与无用之间取得平衡的一个好办法。", "en": "Whether reading is useful at all is a question people have argued over for a long time. Now I think institutionalised reading is a good way to strike a balance between useful and useless."}, {"start": 106.22, "end": 136.42, "text": "近来，各路小姐姐们在推介的时候流行把喜欢阅读列进自己的优点，作为一条资深蛀书虫，私以为笼统的喜欢阅读并不能算什么大的加分项，喜欢读快餐文学、很大比例的网络小说，甚至是一般的畅销书对提升自己的帮助作用实在寥寥无几，晒一晒自己的阅读清单，如果上面有几本和自己业务有关的书，每年再来一两本经济金融类的书（学点金融常识能有效防止自己被杀猪盘当猪杀！", "en": "Recently, when young women promote themselves, it has become fashionable to list a love of reading among their virtues. As a veteran bookworm, I privately think that a vague love of reading is not much of a plus on its own: a love of fast-food literature, a large share of web novels, or even ordinary bestsellers does very little to improve you. Show me your reading list: if it has a few books related to your own work, plus one or two economics and finance books each year (learning some financial basics can effectively stop you from being slaughtered like a pig in a pig-butchering scam!"}, {"start": 136.42, "end": 147.14, "text": "如果有后悔药吃，薇娅肯定也想自己学点税法知识），然后再搭配点文学、社会科、历史类的经典名著，才能真正标榜自己爱看书。", "en": "If there were a regret pill, Wei Ya would surely want to learn some tax law herself), along with some classic works of literature, social science and history, then you can truly claim to love reading."}, {"start": 147.14, "end": 162.5, "text": "村上春树在《挪威的森林里》借小说人物之口说，人生苦短，作者死了不到五十年的书不值得看，这话太绝对了，但是作者死了五十年以后还能让你知道名字的书确实更值得一读。", "en": "Haruki Murakami has a character say in Norwegian Wood that life is short, and books by authors dead less than fifty years are not worth reading. That is too absolute, but books whose authors have been dead more than fifty years and whose names you still know are indeed more worth reading."}, {"start": 162.5, "end": 180.19, "text": "在这里，我要感谢一些微信阅读app，这个软件真是腾讯公司对中国人民的一大贡献，这个app让我们可以带着一个市级图书馆到处跑，还会根据你的兴趣为你推荐相关书籍，让你有了成为一个业余专家的可能。", "en": "Here I want to thank the WeRead app. This app is truly a great contribution by Tencent to the Chinese people: it lets you carry a city-level library around with you, and it recommends related books based on your interests, giving you a chance to become an amateur expert."}, {"start": 180.19, "end": 192.5, "text": "3.把知乎每日热榜排名前三的话题下，排名前三的回答都看一遍，不管是不是你感兴趣的话题都要看，坚持三年，你会发现自己对任何话题都很有见地。", "en": "3. Read the top three answers under each of the top three topics on Zhihu's daily hot list, whether or not the topic interests you. Keep it up for three years, and you will find you have real insight into any topic."}, {"start": 192.5, "end": 208.1, "text": "4.坚持上班，坚持参加从小学到大学的同学聚会，维持必要到低度的社交生活，不要封闭在自己的世界里，多听听别人在说什么，在过什么样的生活，哪怕他们的话和狗屎一样没有营养。", "en": "4. Keep going to work, keep attending class reunions from primary school through university, and maintain a necessary but low-key social life. Do not seal yourself inside your own world. Listen more to what others are saying and what kind of lives they are living, even if what they say is as devoid of substance as dog shit."}, {"start": 208.1, "end": 210.86, "text": "让你痛苦的，往往很有用。", "en": "What pains you is often very useful."}, {"start": 210.86, "end": 224.06, "text": "其实我最喜欢跟我的小学同学聚会，因为他们是家庭出身跟我最接近的一个圈子，他们的人生百态可以说是我人生的很多不同版本，他们走过的路摔过的跤对我很有借鉴意义。", "en": "Actually, I most enjoy reuniting with my primary school classmates, because they are the circle whose family backgrounds are closest to mine. The many shapes of their lives are, you could say, many different versions of my own life, and the paths they have walked and the falls they have taken are very instructive for me."}, {"start": 224.06, "end": 225.79, "text": "5.驯服算法。", "en": "5. Tame the algorithm."}, {"start": 225.79, "end": 232.44, "text": "这个年代，大数据和算法无处不在，无时无刻都想把你拖进奶头乐的深渊。", "en": "In this day and age, big data and algorithms are everywhere, always trying to drag you into the abyss of pacifying entertainment."}, {"start": 232.44, "end": 238.51, "text": "既然避免不了，你就得想办法跟他好好相处，甚至驯服她，把她变成自己的工具和助手。", "en": "Since you cannot avoid it, you have to find a way to get along with it, even tame it, and turn it into your own tool and assistant."}, {"start": 238.51, "end": 240.86, "text": "你要再买一个手机，便宜款的就行。", "en": "You should buy a second phone; a cheap model will do."}, {"start": 240.86, "end": 257.02, "text": "平时常用的手机刷视频也好，刷知乎也好，不妨想看什么就看什么，什么帅哥美女八卦都没关系，但是备用手机用来每周看一小时对自己成长有用的内容，不要污染这个备用手机的算法，这样系统会帮你找到很多你意想不到的优质内容。", "en": "On your everyday phone, watch whatever videos or Zhihu posts you like — handsome guys, beautiful girls, gossip, it does not matter. But use the spare phone for one hour a week of content that helps you grow, and do not pollute that spare phone's algorithm. That way the system will find you a lot of high-quality content you never expected."}, {"start": 257.02, "end": 262.01, "text": "6.学好一门外语，有机会就出去走走，没机会就看看外文资料。", "en": "6. Learn a foreign language well. If you get the chance, go out and see the world; if not, read foreign-language material."}, {"start": 262.01, "end": 266.74, "text": "b站上有CNN，BBC每天的国际新闻（国内的听不了）。", "en": "Bilibili has CNN and BBC international news every day (the domestic ones cannot be heard there)."}, {"start": 266.74, "end": 273.86, "text": "评论区有大佬说用微软浏览器可以直接看CNN ，美联社， 法新社， 卫报， 朝日新闻 ，雅虎。", "en": "Someone knowledgeable in the comments said that with the Microsoft Edge browser you can directly watch CNN, the Associated Press, Agence France-Presse, The Guardian, Asahi Shimbun and Yahoo."}, {"start": 273.86, "end": 275.11, "text": "我有空去试试。", "en": "I will try it when I have time."}, {"start": 275.11, "end": 284.4, "text": "7.选一个自己感兴趣的朝代，把微信读书上能找到的关于那个朝代的书都看一遍，从不同角度去了解一个历史事件。", "en": "7. Pick a dynasty that interests you, read every book about that dynasty you can find on WeRead, and get to know a historical event from different angles."}, {"start": 284.4, "end": 306.19, "text": "以唐朝为例，你把渤海小吏的《大唐气象》，士承东林的《大唐兴衰三百年》，王觉仁的《血腥的盛唐》，蒙曼的《精选隋唐大历史》看完，然后再看下《哈佛中国史》《剑桥中国史》的唐朝卷，最后还再去看看新旧唐书和《资治通鉴》。", "en": "Take the Tang dynasty as an example: read Bohai Xiaoli's The Atmosphere of the Great Tang, Shicheng Donglin's Three Hundred Years of the Tang's Rise and Fall, Wang Jueren's The Bloody Golden Age of Tang, and Meng Man's Selected Grand History of Sui and Tang. Then look at the Tang volumes of the Harvard History of China and the Cambridge History of China, and finally go and read the Old and New Books of Tang and the Zizhi Tongjian."}, {"start": 306.19, "end": 314.9, "text": "看完这些，你就能理解为什么历史是一个任人打扮的小姑娘，就能学会怎么去怀疑和证明一个历史记录的真假了。", "en": "After reading all these, you will understand why history is a little girl anyone can dress up as they please, and you will learn how to doubt a historical record and prove whether it is true or false."}, {"start": 314.9, "end": 331.58, "text": "8.多做事，家里的事，工作上的事，自己想做而还没做的事，不管大事还是小事，都要认真去做，纸上得来终觉浅，事非经过不知难，知与行是相互促进的，办好一件事，所得不输读透一本书。", "en": "8. Do more things — household matters, work matters, things you want to do but have not yet done. Big or small, do them seriously. What comes from paper is always shallow; you never know how hard something is until you have been through it. Knowing and doing promote each other, and doing one thing well teaches you no less than reading a whole book through."}, {"start": 331.58, "end": 334.03, "text": "9.看各类法律案件判决书。", "en": "9. Read all kinds of legal case judgments."}, {"start": 334.03, "end": 342.67, "text": "人在诉讼的时候互撕得最彻底，能让你看清这个世界很多被隐藏、伪装、粉饰过的人心与真相。", "en": "When people tear into each other in litigation, they do it most thoroughly, and it lets you see clearly much of the human nature and truth in this world that is hidden, disguised or whitewashed."}, {"start": 342.67, "end": 348.36, "text": "10.看日本历史，特别是1990年日本泡沫经济破灭以后的历史。", "en": "10. Read Japanese history, especially the history after Japan's bubble economy burst in 1990."}, {"start": 348.36, "end": 355.63, "text": "以日为鉴，可知兴替啊，作为东亚怪物房的前两名，现代的中国和日本太像了。", "en": "Take Japan as a mirror, and you can understand rise and fall. As the top two in East Asia's monster house, modern China and Japan are far too alike."}, {"start": 355.63, "end": 369.31, "text": "事实上，在清末新政和上世纪的改革开放，我们走的都是以日为师的道路，改革开放后大力发展外向型经济，承接世界产业转移，就是抄的日本六七十年代的作业。", "en": "In fact, in the late-Qing New Policies and in last century's reform and opening up, we followed the path of learning from Japan. After reform and opening up, vigorously developing an export-oriented economy and taking over the world's industrial transfer was simply copying Japan's homework from the 1960s and 70s."}, {"start": 369.31, "end": 384.86, "text": "这一次，我不知道咱们能不能摸着日本这块石头成功过河，但我知道，很多在事情上你们不会是例外，比如房价的暴跌，考公爆热后又遇冷，被老龄化冲击后搞降本改革的医疗等等。", "en": "This time, I do not know whether we can cross the river by feeling for this Japanese stone, but I do know that in many matters you will be no exception — for example, the plunge in housing prices, the civil-service exam going from red-hot to cooling off, and healthcare pursuing cost-cutting reform after being hit by ageing."}, {"start": 384.86, "end": 388.42, "text": "太平洋战争其实也很值得好好看看的，原因你懂的。", "en": "The Pacific War is actually well worth a good look too, for reasons you understand."}]}, {"title": "怎样避免活在信息茧房之中？ Part 2（109句，9:23）", "mp3": "upload-8-part02/audio.mp3", "dur": "9:23", "lines": [{"start": 0.0, "end": 3.84, "text": "信息茧房的本质是共鸣（或共情）成瘾。", "en": "The essence of the information cocoon is addiction to resonance (or empathy)."}, {"start": 3.84, "end": 15.91, "text": "企图用认知提升，或者专业的学习是无法打破成瘾性的，就像一个认知再高、专业技能再强的人，一旦沦入毒瘾或性瘾，也很难戒掉。", "en": "Trying to break the addiction through cognitive improvement or professional study does not work — just as a person with high cognition and strong professional skills, once addicted to drugs or sex, finds it very hard to quit."}, {"start": 15.91, "end": 30.86, "text": "从心理舒适度出发，人们会倾向相信那些，自己的经历、教育、社会身份、情绪回路、创伤、易构建情景等等可以共鸣的东西，而无论其是否真的有道理。", "en": "Out of psychological comfort, people tend to believe things that their own experience, education, social identity, emotional circuits, traumas, easily constructed scenarios and the like can resonate with, regardless of whether those things are actually reasonable."}, {"start": 30.86, "end": 42.38, "text": "而且，人们会倾向于相信，在心理暗示上带有褒义词汇，且与自身超我匹配的描述，哪怕这个描述本身换一种说法，就是明显的悖论。", "en": "Moreover, people tend to believe descriptions that carry positive words under psychological suggestion and match their own superego, even if the same description, phrased differently, is an obvious paradox."}, {"start": 42.38, "end": 54.55, "text": "由于对自己视野或认知以外的盲区缺乏基本的系统性概念，人们还会倾向于相信，用自己的经历或周边的环境结构去解释盲区的规律和结构。", "en": "Because they lack even a basic systematic concept of the blind spots beyond their own horizons or cognition, people also tend to believe in explaining the patterns and structures of those blind spots using their own experience or their surrounding environment's structure."}, {"start": 54.55, "end": 68.04, "text": "这些不仅仅是心理舒适度的需求，它们还带来（融入主流群体的）安全感、（识别敌我边界的）清晰感、（自己很优秀的心理暗示带来的）社会成就感，从而生成了大量的多巴胺反馈。", "en": "These are not merely needs for psychological comfort; they also bring a sense of security (from blending into the mainstream group), a sense of clarity (from identifying friend-or-foe boundaries), and a sense of social achievement (from the psychological suggestion that one is excellent), thereby generating large amounts of dopamine feedback."}, {"start": 68.04, "end": 104.4, "text": "这就导致，人们在选择信息和分析信息时，会围绕感性共鸣（或共情）来进行定义和筛选，将无法获得多巴胺的部分认定为假（或无价值的、邪恶的、不道德的、需要被消灭的），从而隔离了自洽圈和舒适圈以外的信息。", "en": "This causes people, when choosing and analysing information, to define and filter everything around emotional resonance (or empathy), labelling whatever yields no dopamine as false (or worthless, evil, immoral, needing to be eliminated), and thereby isolating information outside their self-consistent circle and comfort zone."}, {"start": 104.4, "end": 121.08, "text": "同时，自洽和舒适感所带来的大量多巴胺，会阻止人们用理性和方法论去推测，表面信息背后的逻辑，以及隐藏的拼图，会习惯于条件反射的用熟悉范式（而不是理性推导）去进行认知定性。", "en": "At the same time, the large amounts of dopamine brought by self-consistency and comfort stop people from using reason and methodology to infer the logic behind surface information and the hidden pieces of the puzzle; they grow accustomed to using familiar paradigms (rather than rational deduction) by reflex to characterise what they perceive."}, {"start": 121.08, "end": 127.75, "text": "综上所述，戒除共鸣（或共情）成瘾，是避免活在信息茧房中的唯一路径。", "en": "In summary, quitting resonance (or empathy) addiction is the only path to avoiding life inside an information cocoon."}, {"start": 127.75, "end": 130.27, "text": "一些相对简单的训练方法：", "en": "Some relatively simple training methods:"}, {"start": 130.27, "end": 162.55, "text": "1，学会解析信息及其包含的逻辑的底层，通过对信息的极简化处理，去掉形容词和各种诱发情绪的褒义词，把底层逻辑暴露出来，从而在规避共鸣（或共情）的情况下进行真伪和程度性的检查。", "en": "1. Learn to parse information and the underlying logic it contains: by radically simplifying the information, removing adjectives and all kinds of emotion-inducing positive words, you expose the underlying logic, and can then check truth and degree while avoiding resonance (or empathy)."}, {"start": 162.55, "end": 182.04, "text": "2，使用合订本模式，有意识的跟踪曾经对自己产生巨大共鸣，或巨大情绪刺激的信息，在热点消退和自己的情绪消退后，进行分析、复盘，寻找当时自己的共鸣点产生的原因和带来的认知偏差，以及思考如何在未来规避这种偏差。", "en": "2. Use the bound-volume model: deliberately track information that once produced huge resonance in you, or huge emotional stimulation, and after the buzz fades and your emotions subside, analyse and review it, looking for the cause of your resonance at the time and the cognitive bias it brought, and thinking about how to avoid such bias in future."}, {"start": 182.04, "end": 188.47, "text": "3，有意识的寻找你认可的信息或观点的对立面，并分析其合理性的程度。", "en": "3. Deliberately seek out the opposite side of information or views you endorse, and analyse the degree of its reasonableness."}, {"start": 188.47, "end": 196.08, "text": "4，反向代入：即不仅仅代入你条件反射的立场和角色，也代入与之对立的角色。", "en": "4. Reverse role-play: that is, do not only put yourself in the position and role you reflexively take, but also in the opposing role."}, {"start": 196.08, "end": 220.37, "text": "5，极化推断：即将信息及其逻辑，向极端化方向推演，看是否出现明显谬误，如果有这个明显谬误，再反推当前信息及其逻辑的适用范围或真伪。", "en": "5. Polarisation inference: push the information and its logic toward the extreme and see whether an obvious fallacy appears; if one does, work backwards to infer the applicable scope or truth of the current information and its logic."}, {"start": 220.37, "end": 232.42, "text": "6，非从众意识：寻找与你一样共鸣的人的共同特点和特征，并且推断，如果去掉这些特征，该信息是否还会被认可。", "en": "6. Non-conformist awareness: find the common traits and features of the people who resonate the same way you do, and infer whether the information would still be endorsed if those traits were removed."}, {"start": 232.42, "end": 254.86, "text": "以上，本文无意贬低认知提升的重要性，但在信息茧房层面，认知提升的效用非常有限，感性的认知被自洽包装成论理的辩证的认知，这种习惯非常常见，离开以上的这些训练模式，所谓的认知提升，其实很可能是自己看到更多信息数量（而非质量）之后的臆想。", "en": "That is all. This article does not intend to belittle the importance of cognitive improvement, but at the level of the information cocoon, cognitive improvement is of very limited use. Emotional cognition, packaged by self-consistency as logical, dialectical cognition, is a very common habit. Without the training modes above, so-called cognitive improvement is quite possibly just imagining things after seeing a greater quantity (rather than quality) of information."}, {"start": 254.86, "end": 258.41, "text": "不要害怕信息茧房，也不要轻视他。", "en": "Do not fear the information cocoon, and do not underestimate it."}, {"start": 258.41, "end": 261.89, "text": "要打破他、驾驭他、利用他。", "en": "Break it, master it, use it."}, {"start": 261.89, "end": 268.2, "text": "因为越是经济不好，越容易出现巨大的信息差，大环境不好，越要反着来。", "en": "Because the worse the economy is, the more likely huge information gaps appear; the worse the general environment, the more you should go against the grain."}, {"start": 268.2, "end": 269.04, "text": "1。", "en": "1."}, {"start": 269.04, "end": 275.64, "text": "花200块买国外故事大纲，AI润色写成小说，几个月赚了小几十万。", "en": "Spend 200 yuan buying a foreign story outline, polish it with AI into a novel, and earn hundreds of thousands of yuan in a few months."}, {"start": 275.64, "end": 276.24, "text": "2。", "en": "2."}, {"start": 276.24, "end": 285.0, "text": "搬国外手工黏土教程，去水印翻译成中文，小红书卖99块，售出2580单。", "en": "Take a foreign handmade clay tutorial, remove the watermark, translate it into Chinese, and sell it on Xiaohongshu for 99 yuan — 2,580 orders sold."}, {"start": 285.0, "end": 285.67, "text": "3。", "en": "3."}, {"start": 285.67, "end": 291.26, "text": "从国外二手市场100块淘黑胶唱片，国内卖300块，很多人加价抢。", "en": "Pick up a vinyl record for 100 yuan from a foreign second-hand market and sell it domestically for 300 yuan, with many people scrambling to pay extra."}, {"start": 291.26, "end": 291.94, "text": "4。", "en": "4."}, {"start": 291.94, "end": 301.01, "text": "把国外宠物搞笑视频重新剪辑配中文解说，挂小黄车卖宠物用品，双十一纯利润小20万。", "en": "Re-edit foreign funny pet videos with Chinese narration, attach the yellow cart link to sell pet supplies, and make nearly 200,000 yuan in pure profit on Double 11."}, {"start": 301.01, "end": 301.97, "text": "5。", "en": "5."}, {"start": 301.97, "end": 309.41, "text": "国外免费公开的减脂食谱，翻译整理成\"中国人能执行版\"，卖49元饮食模板。", "en": "Take a free foreign fat-loss recipe, translate and organise it into a 'version Chinese people can actually follow', and sell the diet template for 49 yuan."}, {"start": 309.41, "end": 316.73, "text": "6.TikTok上的家居收纳玩法，国内很多中年女性第一次见，直接能做成爆款账号。", "en": "6. Home storage tricks from TikTok are being seen for the first time by many middle-aged women in China, and can directly become hit accounts."}, {"start": 316.73, "end": 317.74, "text": "7。", "en": "7."}, {"start": 317.74, "end": 323.3, "text": "国外早就玩烂的\"电子数字产品\"，国内很多人还停留在卖体力。", "en": "'Electronic digital products' that have long been played out abroad are still unfamiliar to many people in China, who remain stuck selling physical labour."}, {"start": 323.3, "end": 329.26, "text": "8.AI做PPT，做海报，做文案，国外已经普及，国内还有很多小老板不会用。", "en": "8. Using AI to make PPTs, posters and copywriting is already widespread abroad, yet many small business owners in China still do not know how."}, {"start": 329.26, "end": 330.05, "text": "9。", "en": "9."}, {"start": 330.05, "end": 337.01, "text": "有人专门搬运国外冷门纪录片切片，做知识账号，一条视频几十万播放。", "en": "Some people specialise in moving slices of obscure foreign documentaries to build knowledge accounts, with a single video getting hundreds of thousands of views."}, {"start": 337.01, "end": 337.9, "text": "10。", "en": "10."}, {"start": 337.9, "end": 342.5, "text": "国外Etsy卖爆的手账模板，国内改成中文版继续卖。", "en": "Handbook templates that sell explosively on Etsy abroad get turned into Chinese versions and keep selling in China."}, {"start": 342.5, "end": 343.58, "text": "11。", "en": "11."}, {"start": 343.58, "end": 349.15, "text": "小红书很多爆款，本质上只是把国外 Pinterest内容重新本土化。", "en": "Many hit posts on Xiaohongshu are essentially just foreign Pinterest content re-localised."}, {"start": 349.15, "end": 349.94, "text": "12。", "en": "12."}, {"start": 349.94, "end": 356.06, "text": "国外流行的\"安静离职\"低欲望生活\",国内改个名字又是一波流量。", "en": "The 'quiet quitting' low-desire lifestyle popular abroad gets renamed in China and becomes another wave of traffic."}, {"start": 356.06, "end": 356.9, "text": "13。", "en": "13."}, {"start": 356.9, "end": 360.94, "text": "很多人以为赚钱靠能力，其实很多时候靠\"谁先知道\".", "en": "Many people think making money depends on ability, but often it actually depends on 'who knows first'."}, {"start": 360.94, "end": 361.9, "text": "14。", "en": "14."}, {"start": 361.9, "end": 366.34, "text": "有人专门做国外AI工具测评，接广告接到手软。", "en": "Some people specialise in reviewing foreign AI tools and get so many advertising deals they cannot keep up."}, {"start": 366.34, "end": 367.46, "text": "15。", "en": "15."}, {"start": 367.46, "end": 372.34, "text": "国外爆火的儿童感统训练，在国内很多家长还没听过。", "en": "Sensory-integration training for children, which is booming abroad, is something many parents in China have not even heard of."}, {"start": 372.34, "end": 373.34, "text": "16。", "en": "16."}, {"start": 373.34, "end": 378.22, "text": "国外宠物殡葬已经产业化，国内很多城市才刚刚开始。", "en": "Pet funeral services have already become an industry abroad, while many cities in China are only just getting started."}, {"start": 378.22, "end": 379.25, "text": "17。", "en": "17."}, {"start": 379.25, "end": 385.06, "text": "有人把国外菜谱翻译成\"减脂版中国胃\"，一年卖了几万份。", "en": "Someone translated foreign recipes into a 'fat-loss version for the Chinese stomach' and sold tens of thousands of copies in a year."}, {"start": 385.06, "end": 385.94, "text": "18。", "en": "18."}, {"start": 385.94, "end": 391.03, "text": "国外妈妈博主的育儿话术，翻译后在国内情感赛道直接起号。", "en": "Parenting scripts from foreign mum bloggers, once translated, can launch an account directly in China's emotional-content niche."}, {"start": 391.03, "end": 391.8, "text": "19。", "en": "19."}, {"start": 391.8, "end": 397.37, "text": "很多人天天焦虑失业，但真正赚钱的人，都在研究\"国外已经验证过的模式\".", "en": "Many people worry about unemployment every day, but the people who really make money are all studying 'models already proven abroad'."}, {"start": 397.37, "end": 398.04, "text": "20。", "en": "20."}, {"start": 398.04, "end": 401.59, "text": "国外火了3年的东西，国内可能才刚刚开始。", "en": "Something that has been popular abroad for three years may only just be starting in China."}, {"start": 401.59, "end": 402.74, "text": "21。", "en": "21."}, {"start": 402.74, "end": 408.58, "text": "有人专门搬国外冥想音乐，挂助眠产品，一年利润几十万。", "en": "Some people specialise in moving foreign meditation music, attach sleep-aid products, and make hundreds of thousands of yuan in profit a year."}, {"start": 408.58, "end": 409.37, "text": "22。", "en": "22."}, {"start": 409.37, "end": 415.3, "text": "国外二手奢侈品市场特别成熟，很多人低价收回来国内转卖。", "en": "The foreign second-hand luxury market is especially mature; many people buy low abroad and resell in China."}, {"start": 415.3, "end": 416.26, "text": "23。", "en": "23."}, {"start": 416.26, "end": 419.09, "text": "很多县城老板，连ChatGPT是什么都不知道。", "en": "Many small-city bosses do not even know what ChatGPT is."}, {"start": 419.09, "end": 420.22, "text": "24。", "en": "24."}, {"start": 420.22, "end": 426.5, "text": "有人把国外老年健身操翻译成中文版，在中老年赛道疯狂吸粉。", "en": "Someone translated foreign senior fitness routines into a Chinese version and wildly gained followers in the middle-aged and elderly niche."}, {"start": 426.5, "end": 427.3, "text": "25。", "en": "25."}, {"start": 427.3, "end": 432.02, "text": "国外流行的家庭整理师，在国内已经开始有人月入十万。", "en": "Family organisers, popular abroad, are already earning some people 100,000 yuan a month in China."}, {"start": 432.02, "end": 433.15, "text": "26。", "en": "26."}, {"start": 433.15, "end": 438.02, "text": "你以为自己在卷同行，其实真正的机会在\"跨国家复制\".", "en": "You think you are competing with your peers, but the real opportunity lies in 'cross-country replication'."}, {"start": 438.02, "end": 439.15, "text": "27。", "en": "27."}, {"start": 439.15, "end": 444.24, "text": "有人专门翻译国外商业访谈，剪成短视频，卖老板认知课。", "en": "Some people specialise in translating foreign business interviews, cutting them into short videos, and selling boss-mindset courses."}, {"start": 444.24, "end": 445.2, "text": "28。", "en": "28."}, {"start": 445.2, "end": 449.76, "text": "很多国外免费的PDF资料，在国内重新包装就能卖钱。", "en": "Many free foreign PDF resources, repackaged in China, can be sold for money."}, {"start": 449.76, "end": 450.89, "text": "29。", "en": "29."}, {"start": 450.89, "end": 456.82, "text": "国外做\"情绪价值\"的产业已经极度成熟，国内才刚开始爆发。", "en": "The 'emotional value' industry abroad is already extremely mature, while in China it is only just beginning to explode."}, {"start": 456.82, "end": 457.66, "text": "30。", "en": "30."}, {"start": 457.66, "end": 461.93, "text": "有人把国外儿童绘本做成AI动画，家长疯狂买单。", "en": "Someone turned foreign children's picture books into AI animations, and parents buy them like crazy."}, {"start": 461.93, "end": 463.06, "text": "31。", "en": "31."}, {"start": 463.06, "end": 471.5, "text": "国外早就成熟的\"个人IP+社群+订阅制\"，国内还很多人在靠一次性卖货。", "en": "The mature foreign model of 'personal IP + community + subscription' is still unfamiliar in China, where many people still rely on one-off sales."}, {"start": 471.5, "end": 472.46, "text": "32。", "en": "32."}, {"start": 472.46, "end": 475.06, "text": "很多人总觉得\"这个早有人做了\".", "en": "Many people always think 'someone already did this'."}, {"start": 475.06, "end": 477.82, "text": "但问题是，中国太大了。", "en": "But the problem is, China is too big."}, {"start": 477.82, "end": 479.86, "text": "你知道，不代表别人知道。", "en": "You knowing something does not mean others know it."}, {"start": 479.86, "end": 480.74, "text": "33。", "en": "33."}, {"start": 480.74, "end": 487.03, "text": "有人把国外流行穿搭做成\"150斤女生版\"，瞬间精准爆流量。", "en": "Someone turned popular foreign outfits into a 'version for 150-jin girls' and instantly hit precisely targeted viral traffic."}, {"start": 487.03, "end": 488.11, "text": "34。", "en": "34."}, {"start": 488.11, "end": 491.9, "text": "国外很多低成本创业项目，在国内甚至还没人讲。", "en": "Many low-cost foreign startup projects have not even been talked about in China yet."}, {"start": 491.9, "end": 492.98, "text": "35。", "en": "35."}, {"start": 492.98, "end": 497.66, "text": "互联网最赚钱的，从来不是原创，而是\"高级搬运\".", "en": "The most profitable thing on the internet has never been originality, but 'high-level moving'."}, {"start": 497.66, "end": 498.74, "text": "36。", "en": "36."}, {"start": 498.74, "end": 504.91, "text": "有人专门研究国外老头老太太的退休生活视频，卖银发旅游产品。", "en": "Someone specialises in studying videos of foreign retirees' lives and sells silver-hair tourism products."}, {"start": 504.91, "end": 510.36, "text": "37.TikTok上很多几千万播放的视频，搬到视频号依然能爆。", "en": "37. Videos with tens of millions of views on TikTok can still go viral when moved to Channels."}, {"start": 510.36, "end": 511.27, "text": "38。", "en": "38."}, {"start": 511.27, "end": 516.96, "text": "有人把国外儿童专注力训练做成打印资料包，一个月卖几千单。", "en": "Someone turned foreign children's focus training into printable material packs, selling thousands of orders a month."}, {"start": 516.96, "end": 522.48, "text": "真正赚钱的人，从来不是最努力的人，而是最会\"借信息差\"的人。", "en": "The people who really make money are never the hardest-working people, but the best at 'borrowing information gaps'."}, {"start": 522.48, "end": 526.92, "text": "大部分普通人，一辈子都困在自己的生活半径里。", "en": "Most ordinary people spend their whole lives trapped within their own living radius."}, {"start": 526.92, "end": 533.83, "text": "他们不知道国外在流行什么，不知道别的城市在赚钱什么，也不知道互联网到底有多少机会。", "en": "They do not know what is trending abroad, what people in other cities are making money from, or how many opportunities the internet actually holds."}, {"start": 533.83, "end": 539.76, "text": "所以很多人越穷越焦虑，越焦虑越刷短视频，最后彻底失去信息获取能力。", "en": "So many people grow poorer and more anxious, and the more anxious they get, the more short videos they scroll, until they completely lose the ability to obtain information."}, {"start": 539.76, "end": 542.57, "text": "这个时代最值钱的能力，不是吃苦。", "en": "The most valuable ability of this era is not enduring hardship."}, {"start": 542.57, "end": 543.36, "text": "而是：", "en": "It is:"}, {"start": 543.36, "end": 544.51, "text": "获取信息，", "en": "Obtaining information,"}, {"start": 544.51, "end": 546.0, "text": "筛选信息，", "en": "Filtering information,"}, {"start": 546.0, "end": 547.63, "text": "重组信息，", "en": "Recombining information,"}, {"start": 547.63, "end": 549.43, "text": "再卖给信息落后的人。", "en": "And selling it to people who are behind on information."}, {"start": 549.43, "end": 553.03, "text": "这世界上，95%的财富都藏在信息差里。", "en": "95% of the world's wealth is hidden in information gaps."}, {"start": 553.03, "end": 556.32, "text": "中国有13亿人口，10亿人没坐过飞机。", "en": "China has 1.3 billion people, and 1 billion of them have never flown on a plane."}, {"start": 556.32, "end": 558.29, "text": "信息差大到超乎想象。", "en": "The information gap is bigger than you can imagine."}, {"start": 558.29, "end": 563.09, "text": "文字来源于网络，侵删～", "en": "Text sourced from the internet; please delete if infringing."}]}];
let LINES=SECTIONS[0].lines;
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),enBox=document.getElementById('en'),audioSelect=document.getElementById('audioSelect'),secTitle=document.getElementById('secTitle');
let els=[];let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function buildLines(){box.innerHTML='';LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;const p=a.play();if(p&&p.catch)p.catch(()=>{playBtn.textContent='▶';});playBtn.textContent='⏸';};box.appendChild(d);});els=[...box.children];curIdx=-1;box.scrollTop=0;}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];enBox.textContent=LINES[i].en||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
function loadSection(idx){const s=SECTIONS[idx];a.pause();playBtn.textContent='▶';LINES=s.lines;secTitle.textContent=s.title;a.src=s.mp3;a.load();seek.value=0;cur.textContent='0:00';dur.textContent=s.dur;enBox.textContent='';buildLines();}
audioSelect.onchange=()=>{loadSection(parseInt(audioSelect.value,10));};
buildLines();
playBtn.onclick=()=>{if(a.paused){const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';const p=a.play();if(p&&p.catch){p.catch(()=>{playBtn.textContent='▶';if(st)st.textContent='音频无法播放：请刷新页面，或换 Safari/Chrome 打开（不要用微信/WhatsApp 内嵌浏览器）。';});}playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
a.onplaying=()=>{const st=document.getElementById('status');if(st)st.textContent='';};
a.onwaiting=()=>{const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';};
a.onerror=()=>{playBtn.textContent='▶';const st=document.getElementById('status');if(st)st.textContent='音频加载失败：请刷新页面，或换 Safari/Chrome 打开。';};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
<script>
(function(){
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var KEY = 'lastAudio:' + location.pathname;
  function save(){ try { localStorage.setItem(KEY, sel.value); } catch (e) {} }
  sel.addEventListener('change', save);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', save);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved !== null && saved !== '' && saved !== sel.value) {
      var ok = false;
      for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === saved) { ok = true; break; } }
      if (ok) { sel.value = saved; sel.dispatchEvent(new Event('change')); }
    }
  } catch (e) {}
})();
</script>
<script>
(function(){
  var SYNC_URL = 'https://player-sync.billyxiaoli.workers.dev';
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var HUB = location.pathname;
  var ready = false;
  function postCloud(){
    if (!ready) return;
    try {
      fetch(SYNC_URL + '/', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({hub: HUB, audio: sel.value})}).catch(function(){});
    } catch (e) {}
  }
  sel.addEventListener('change', postCloud);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', postCloud);
  try {
    var ctl = null;
    if (window.AbortController) {
      ctl = new AbortController();
      setTimeout(function(){ try { ctl.abort(); } catch (e) {} }, 4000);
    }
    var opts = {};
    if (ctl) opts.signal = ctl.signal;
    fetch(SYNC_URL + '/?hub=' + encodeURIComponent(HUB), opts).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.audio) {
        var ok = false;
        for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === d.audio) { ok = true; break; } }
        if (ok && sel.value !== d.audio) { sel.value = d.audio; sel.dispatchEvent(new Event('change')); }
      }
      ready = true;
    }).catch(function(){ ready = true; });
  } catch (e) { ready = true; }
})();
</script>
<script>
(function(){
  var a = document.getElementById('player');
  var sel = document.getElementById('audioSelect');
  if (!a || !sel) return;
  a.addEventListener('ended', function(){
    var i = sel.selectedIndex;
    if (i < 0 || i + 1 >= sel.options.length) {
      var st0 = document.getElementById('status');
      if (st0) st0.textContent = '本页音频已全部播完';
      return;
    }
    sel.selectedIndex = i + 1;
    sel.dispatchEvent(new Event('change'));
    var pb = document.getElementById('playBtn');
    if (pb) pb.textContent = '⏸';
    try {
      var p = a.play();
      if (p && p.catch) p.catch(function(){
        if (pb) pb.textContent = '▶';
        var st = document.getElementById('status');
        if (st) st.textContent = '下一首已就绪，请点一下播放';
      });
    } catch (e) {
      if (pb) pb.textContent = '▶';
    }
  });
})();
</script>
