text": "说到这儿，我自己都觉得有点啰嗦了。", "en": "Speaking of this, I feel I am being a bit long-winded."}, {"start": 692.69, "end": 696.72, "text": "其实这些事你们心里比谁都明白，我就是忍不住多说两句。", "en": "Actually, you all understand these things better than anyone; I just can't help saying a few more words."}, {"start": 696.72, "end": 698.16, "text": "说到底就三件事。", "en": "In the end, it comes down to three things."}, {"start": 698.16, "end": 699.55, "text": "你一件一件听。", "en": "Listen to them one by one."}, {"start": 699.55, "end": 705.43, "text": "第一件，累了只想刷短视频，真不是你懒，是身子骨扛不住了。", "en": "First: being tired and only wanting to scroll short videos is really not laziness; your body can't take it anymore."}, {"start": 705.43, "end": 709.22, "text": "先别骂自己，允许自己糊里糊涂歇一会儿。", "en": "Don't scold yourself first; allow yourself to rest in a daze for a while."}, {"start": 709.22, "end": 714.07, "text": "我年轻时候抢修完也那样，没见谁因为多刷了两天手机就完了。", "en": "When I was young, after emergency repairs, I was like that too. I never saw anyone ruined just because they scrolled their phone for two extra days."}, {"start": 714.07, "end": 718.82, "text": "第二件，歇够了之后，人还是会拿起手机。", "en": "Second: after resting enough, people will still pick up their phones."}, {"start": 718.82, "end": 720.02, "text": "这不是你的错。", "en": "This is not your fault."}, {"start": 720.02, "end": 721.7, "text": "这是身体记住的路径。", "en": "This is a path the body remembers."}, {"start": 721.7, "end": 726.31, "text": "真正要改的，不是意志力，是这条路径。", "en": "What truly needs changing is not willpower, but this path."}, {"start": 726.31, "end": 732.48, "text": "这条路径里，最隐蔽的一段，就是那些让你哭着转发的情绪内容。", "en": "In this path, the most hidden section is those emotional contents that make you cry and forward."}, {"start": 732.48, "end": 736.15, "text": "有一部分，是在替你消化本该变成行动的能量。", "en": "A part of them is digesting for you the energy that should have become action."}, {"start": 736.15, "end": 741.0, "text": "适度宣泄本身无可厚非，但存在一种很常见的心理现象：", "en": "Moderate venting is itself blameless, but there is a very common psychological phenomenon:"}, {"start": 741.0, "end": 752.21, "text": "对一部分人来说，如果仅仅停留在情绪解气，没有落到现实行动，情绪压力被提前释放之后，就很难再生发出改变现状的冲动。", "en": "For some people, if they only stop at emotional relief without landing on real action, after emotional pressure is released early, it becomes hard to regenerate the impulse to change the status quo."}, {"start": 752.21, "end": 758.88, "text": "下次再被戳中时，停一秒问自己：这份共鸣，是不是把该做的事儿给抵消了？", "en": "Next time you are struck, pause for a second and ask yourself: is this resonance cancelling out something I should be doing?"}, {"start": 758.88, "end": 763.8, "text": "第三件，很多你以为属于自己的偏好，其实是别人替你筛好的。", "en": "Third: many preferences you think are your own are actually screened for you by others."}, {"start": 763.8, "end": 765.0, "text": "这不是你的错。", "en": "This is not your fault."}, {"start": 765.0, "end": 769.2, "text": "看清这层窗户纸，就不用再对着它夸屋里空气好了。", "en": "Seeing through this layer of window paper, you no longer need to praise the air in the room facing it."}, {"start": 769.2, "end": 771.19, "text": "这三件事你记不住也没事。", "en": "It doesn't matter if you can't remember these three things."}, {"start": 771.19, "end": 776.35, "text": "你就记住一句：别把困住你的东西，当成你自己的选择。", "en": "Just remember one sentence: don't treat what traps you as your own choice."}, {"start": 776.35, "end": 780.79, "text": "说到这儿，你肯定想说：叔，我懂了，明天开始我就少刷。", "en": "Speaking of this, you must want to say: Uncle, I understand; starting tomorrow I'll scroll less."}, {"start": 780.79, "end": 782.18, "text": "别。", "en": "Don't."}, {"start": 782.18, "end": 788.02, "text": "你明天刻意少刷的那半小时，未必是你获得自由，很多时候只是出于内疚。", "en": "The half hour you deliberately scroll less tomorrow may not be freedom you gain; often it is just guilt."}, {"start": 788.02, "end": 794.66, "text": "内疚驱动的自律撑不过三天，紧绷过后反弹，你反而会更加责怪自己。", "en": "Guilt-driven self-discipline won't last three days; after tightening, it rebounds, and you will blame yourself even more."}, {"start": 794.66, "end": 795.86, "text": "所以别急着改。", "en": "So don't rush to change."}, {"start": 795.86, "end": 797.38, "text": "先把这个看清楚。", "en": "First see this clearly."}, {"start": 797.38, "end": 798.38, "text": "然后呢？", "en": "Then?"}, {"start": 798.38, "end": 805.3, "text": "然后如果你有余力，不是逼自己，是你哪天真的歇过来了，喘上气了，你可以想想更大的事。", "en": "Then, if you have spare energy — not forcing yourself, but when you truly recover one day and catch your breath — you can think about bigger things."}, {"start": 805.3, "end": 806.86, "text": "这些平台该归谁管？", "en": "Who should regulate these platforms?"}, {"start": 806.86, "end": 808.3, "text": "算法对谁透明？", "en": "To whom are algorithms transparent?"}, {"start": 808.3, "end": 811.18, "text": "还有你的注意力，凭什么变成别人的利润？", "en": "And your attention — why does it become someone else's profit?"}, {"start": 811.18, "end": 818.98, "text": "这些不是单靠某一个人就能解决的问题，需要更多人看见、更多人去讨论，推动规则变得更合理。", "en": "These are not problems any single person can solve alone; they require more people to see, more people to discuss, and to push rules to become more reasonable."}, {"start": 818.98, "end": 821.98, "text": "一个人看清了，是清醒。", "en": "One person seeing clearly is clarity."}, {"start": 821.98, "end": 824.57, "text": "一群人看清了，才是改变的开始。", "en": "A group of people seeing clearly is the beginning of change."}, {"start": 824.57, "end": 829.61, "text": "但第一步，是别再把困住你的东西，当成你自己的选择了。", "en": "But the first step is to stop treating what traps you as your own choice."}, {"start": 829.61, "end": 833.62, "text": "看清这件事的那天，茧房就已经裂了一条缝。", "en": "The day you see this clearly, the cocoon has already cracked a seam."}, {"start": 833.62, "end": 840.05, "text": "这条缝不会让你一夜之间跳出系统，但至少能让你在下次刷到一条特别解气的内容时，试一次：", "en": "This seam won't let you jump out of the system overnight, but at least it lets you, next time you scroll to a particularly relieving piece of content, try once:"}, {"start": 840.05, "end": 841.2, "text": "看完，别点。", "en": "After reading, don't click."}, {"start": 841.2, "end": 842.28, "text": "就那么划过去。", "en": "Just swipe past."}, {"start": 842.28, "end": 848.04, "text": "不是因为你自律，是因为那一下没点，是今天唯一一个它没预测到的动作。", "en": "Not because you are disciplined, but because that one non-click is the only action it didn't predict today."}, {"start": 848.04, "end": 855.84, "text": "说到底困住我们的，往往不是一堵密不透风的高墙，而是那一份无需反思、唾手可得的廉价情绪安慰。", "en": "In the end, what traps us is often not an airtight high wall, but that cheap emotional comfort requiring no reflection and within easy reach."}, {"start": 855.84, "end": 858.55, "text": "脚边的猫翻了个身，呼噜声没断。", "en": "The cat at my feet turned over, its purring uninterrupted."}, {"start": 858.55, "end": 861.62, "text": "它不懂什么茧房，只知道这会儿暖和。", "en": "It doesn't understand cocoons; it only knows it is warm right now."}, {"start": 861.62, "end": 863.35, "text": "窗外的路灯还亮着。", "en": "The streetlights outside the window are still on."}, {"start": 863.35, "end": 865.46, "text": "我伸手去把台灯拨到夜档。", "en": "I reach out to turn the desk lamp to night mode."}, {"start": 865.46, "end": 869.59, "text": "拨完我才想起来，这开关我上个月也拨过一回。", "en": "After turning it, I remember I also turned this switch last month."}, {"start": 869.59, "end": 872.04, "text": "那回灯亮了三秒又暗了。", "en": "That time the light stayed on for three seconds and then went dark."}, {"start": 872.04, "end": 873.79, "text": "这次不知道能亮多久。", "en": "This time, I don't know how long it will stay on."}, {"start": 873.79, "end": 875.04, "text": "手还是伸了。", "en": "My hand still reached out."}, {"start": 875.04, "end": 877.39, "text": "不是因为我逼自己，是因为灯在那儿。", "en": "Not because I forced myself, but because the lamp is there."}, {"start": 877.39, "end": 889.03, "text": "#信息茧房 #认知资源枯竭 #情绪商品化 #清醒三步法 #最小行动", "en": "#InformationCocoon #CognitiveResourceDepletion #EmotionalCommodification #ThreeStepsToClarity #MinimumAction"}]}, {"title": "怎样避免活在信息茧房之中？ Part 33（231句，12:34）", "mp3": "upload-8-part33/audio.mp3", "dur": "12:34", "lines": [{"start": 0.0, "end": 3.89, "text": "就人类那点可怜的大脑算力，就不要追求信息爆炸了。", "en": "With humans' pitiful little brain computing power, don't pursue information explosion."}, {"start": 3.89, "end": 8.69, "text": "最实用的方式不是避免信息茧房，而是去到正确的茧房。", "en": "The most practical way is not to avoid information cocoons, but to go to the right cocoon."}, {"start": 8.69, "end": 11.09, "text": "关注我就是一种正确的茧房", "en": "Following me is a kind of right cocoon."}, {"start": 11.09, "end": 20.52, "text": "其实很简单，多问为什么，问得越多，解决得问题越多，就越知道要看什么信息，哪里去找合适的信息。", "en": "Actually it's very simple: ask 'why' more. The more you ask, the more problems you solve, and the more you know what information to look at and where to find suitable information."}, {"start": 20.52, "end": 31.85, "text": "如果不知道从哪里开始，可以找限定词多的部分，越是限定，越是绝对就越有必要问，越是跳过逻辑过程给结果，就越是要问：", "en": "If you don't know where to start, you can look for parts with many qualifiers. The more qualified, the more absolute, the more necessary it is to ask. The more it skips the logical process and gives results, the more you should ask:"}, {"start": 31.85, "end": 36.48, "text": "只有…", "en": "Only…"}, {"start": 36.48, "end": 41.23, "text": "才…", "en": "…only then…"}, {"start": 41.23, "end": 42.07, "text": "没有…", "en": "Without…"}, {"start": 42.07, "end": 42.91, "text": "就没有…", "en": "…there is no…"}, {"start": 42.91, "end": 43.92, "text": "唯一的。", "en": "The only one."}, {"start": 43.92, "end": 49.08, "text": "也可以挑选生活中习以为常的习俗、看似不可动摇的叙事：", "en": "You can also pick customs you take for granted in life, and seemingly unshakable narratives:"}, {"start": 49.08, "end": 60.77, "text": "为什么父母一定要求我要结婚、为什么不能有gap year、35岁明明离退休那么远为什么公司都不要、社会时钟为什么会自发的形成并遵守，离开社会时钟的代价是什么。", "en": "Why must parents demand that I get married? Why can't there be a gap year? At 35, retirement is clearly so far away, why don't companies want us? Why does the social clock form spontaneously and get obeyed, and what is the cost of leaving the social clock?"}, {"start": 60.77, "end": 63.84, "text": "或者去挑战叙事中的逻辑漏洞：", "en": "Or challenge logical loopholes in narratives:"}, {"start": 63.84, "end": 72.07, "text": "百善孝为先，那么如果我爸要和我单挑，「站在原地被打死」和「还击把他摁在地上」哪个比较孝顺。", "en": "Filial piety is the foremost of all virtues — so if my dad wants to fight me one-on-one, which is more filial: 'standing still and being beaten to death' or 'fighting back and pinning him to the ground'?"}, {"start": 72.07, "end": 82.46, "text": "中医医生如何通过望闻问切的手段来最终得出「心脏起搏器需要换电池」的结论，并可以让患者在药房抓到规格合适的电池。", "en": "How does a TCM doctor, through observation, listening/smelling, questioning and pulse-taking, finally reach the conclusion that 'the pacemaker needs a battery change', and allow the patient to pick up a suitably sized battery at the pharmacy?"}, {"start": 82.46, "end": 93.7, "text": "不同的路由器和天线的摆放位置对家居风水有影响，那么不同的频段、信道、频宽和天线的MMIO分组分别对风水有什么直接影响。", "en": "If the placement of different routers and antennas affects home feng shui, then what direct effects do different frequency bands, channels, bandwidths and antenna MMIO groupings have on feng shui?"}, {"start": 93.7, "end": 98.33, "text": "如果这些问题你不能依靠搜索思考翻书解决，找个ai。", "en": "If you cannot solve these questions by searching, thinking or flipping through books, find an AI."}, {"start": 98.33, "end": 100.73, "text": "如果你找到的ai也不能解决，换个ai。", "en": "If the AI you find cannot solve them either, switch to another AI."}, {"start": 100.73, "end": 103.73, "text": "如果你不知道怎么换个能解决问题的ai", "en": "If you don't know how to switch to an AI that can solve problems,"}, {"start": 103.73, "end": 107.28, "text": "请打开抖音，开大音量，lets party 🎉！", "en": "Please open Douyin, turn up the volume, lets party 🎉!"}, {"start": 107.28, "end": 115.85, "text": "从小教育孩子，学好外语，哪怕被恐怖分子抓了，能喊一声大爷饶命，活着的机会就能大很多。", "en": "Educate children from a young age to learn foreign languages well. Even if caught by terrorists, being able to shout 'Grandpa, spare my life' greatly increases the chance of staying alive."}, {"start": 115.85, "end": 119.16, "text": "一个只会比划的人质和一个能聊天的人质。", "en": "A hostage who can only gesture versus a hostage who can chat."}, {"start": 119.16, "end": 121.87, "text": "会说话的人总比哑巴的生存机会大。", "en": "Someone who can speak always has a greater chance of survival than a mute."}, {"start": 121.87, "end": 123.72, "text": "瞎子和聋子。", "en": "The blind and the deaf."}, {"start": 123.72, "end": 125.52, "text": "朋友给我讲了一个小故事:", "en": "A friend told me a little story:"}, {"start": 125.52, "end": 128.28, "text": "一个聋子带着一个瞎子走路。", "en": "A deaf man walks with a blind man."}, {"start": 128.28, "end": 135.31, "text": "聋子说前面有条蛇，瞎子说，怪不得我刚刚听到浠浠索索的声音。", "en": "The deaf man says there is a snake ahead; the blind man says, no wonder I just heard rustling sounds."}, {"start": 135.31, "end": 138.14, "text": "走近了聋子又说是条死蛇。", "en": "Walking closer, the deaf man says it is a dead snake."}, {"start": 138.14, "end": 140.59, "text": "瞎子说怪不得我闻到了臭味。", "en": "The blind man says, no wonder I smelled a stink."}, {"start": 140.59, "end": 142.03, "text": "画面感很强了。", "en": "The imagery is very strong."}, {"start": 142.03, "end": 143.95, "text": "喜剧，极荒诞啊！", "en": "Comedy, extremely absurd!"}, {"start": 143.95, "end": 146.06, "text": "聋子知道瞎子看不见。", "en": "The deaf man knows the blind man cannot see."}, {"start": 146.06, "end": 147.86, "text": "瞎子说啥聋子又听不到。", "en": "Whatever the blind man says, the deaf man cannot hear."}, {"start": 147.86, "end": 155.59, "text": "聋子听不到声音，但能看见蛇并判断其生死；瞎子看不见东西，但能听到声音、闻到臭味。", "en": "The deaf man cannot hear sounds, but can see the snake and judge whether it is alive or dead; the blind man cannot see things, but can hear sounds and smell stinks."}, {"start": 155.59, "end": 160.82, "text": "两人的行为准确无误打在对方缺陷上，而又毫不违和。", "en": "Their behaviours accurately hit each other's defects, yet without any incongruity."}, {"start": 160.82, "end": 163.54, "text": "两个人的感官错位造成了信息不对称。", "en": "The two people's sensory misalignment creates information asymmetry."}, {"start": 163.54, "end": 164.74, "text": "这是生理上的。", "en": "This is physiological."}, {"start": 164.74, "end": 176.62, "text": "聋子缺失听觉信息、瞎子缺失视觉信息，本质上是因为双方的感官缺陷，无法获取对方拥有的关键信息，造成完全的信息不对称。", "en": "The deaf man lacks auditory information, the blind man lacks visual information. Essentially, because of both parties' sensory defects, they cannot obtain key information the other possesses, causing complete information asymmetry."}, {"start": 176.62, "end": 179.54, "text": "这样一分析就发现这故事太贴近生活了。", "en": "Analysing it this way, you find this story is too close to life."}, {"start": 179.54, "end": 182.02, "text": "现实中聋子和瞎子好像不少。", "en": "In reality, there seem to be quite a few deaf and blind people."}, {"start": 182.02, "end": 185.09, "text": "一是互动者都在线又都不在线。", "en": "First: interactors are both online and offline."}, {"start": 185.09, "end": 188.16, "text": "都针对对方不具备的功能展示自己。", "en": "Both display themselves targeting functions the other does not possess."}, {"start": 188.16, "end": 192.05, "text": "信息无法真正到达对方，隔离严重。", "en": "Information cannot truly reach the other party; isolation is severe."}, {"start": 192.05, "end": 194.98, "text": "为了刷存在感，鸡同鸭讲。", "en": "To brush up presence, chickens talk to ducks."}, {"start": 194.98, "end": 199.06, "text": "虚假合作，对他人的悲欢不能感同身受。", "en": "False cooperation, unable to empathise with others' joys and sorrows."}, {"start": 199.06, "end": 201.94, "text": "表面一团和气，其实各自为政。", "en": "Seemingly harmonious on the surface, but actually each doing their own thing."}, {"start": 201.94, "end": 204.65, "text": "有点像很多夫妻关系，上下级关系。", "en": "A bit like many husband-wife relationships, superior-subordinate relationships."}, {"start": 204.65, "end": 213.48, "text": "二是反过来理解，为了证明自己有能力，不懂装懂，甚至编造故事来制造效果，结果反而漏洞百出，成了一个笑话。", "en": "Second, understood in reverse: to prove oneself capable, pretending to understand when one doesn't, even fabricating stories to create effects, resulting in being full of loopholes and becoming a joke."}, {"start": 213.48, "end": 215.52, "text": "三是附和顺应。", "en": "Third: echoing and conforming."}, {"start": 215.52, "end": 223.92, "text": "这个故事里瞎子是从属者，但是瞎子为了自保，违心附和，但却忽略了关键信息，踩在了对方的无知和知识空白上。", "en": "In this story, the blind man is the subordinate, but to protect himself, the blind man insincerely echoes, yet ignores key information, stepping on the other party's ignorance and knowledge gaps."}, {"start": 223.92, "end": 225.24, "text": "后果很严重。", "en": "The consequences are serious."}, {"start": 225.24, "end": 231.48, "text": "同一件事，信息来源、信息传递和信息接收会带来信息偏差，甚至信息隔离。", "en": "For the same matter, information sources, information transmission and information reception bring information bias, even information isolation."}, {"start": 231.48, "end": 236.52, "text": "有人刷抖音只看推送的，有人只看头条，有人只看工具书…", "en": "Some people scroll Douyin and only watch pushes, some only watch headlines, some only read reference books…"}, {"start": 236.52, "end": 245.04, "text": "不论主动的还是被动的，对信息的筛选方式和吸收不同，认知结果也不同，对事件得出的结论也完全不同。", "en": "Whether active or passive, different ways of filtering and absorbing information lead to different cognitive results, and completely different conclusions about events."}, {"start": 245.04, "end": 247.8, "text": "一句话，信息差带来认知差。", "en": "In one sentence: information gaps bring cognitive gaps."}, {"start": 247.8, "end": 250.56, "text": "回到了一个热词:信息茧房", "en": "Back to a hot term: information cocoon."}, {"start": 250.56, "end": 253.32, "text": "是的，信息茧房会直接导致信息隔离。", "en": "Yes, information cocoons directly cause information isolation."}, {"start": 253.32, "end": 262.73, "text": "信息爆炸的科学时代，看似信息满天飞，思想多元化，但是信息偏差和信息隔离可能堪比没有电灯电泡之前。", "en": "In the scientific era of information explosion, seemingly information flies everywhere and thoughts are diversified, but information bias and information isolation may rival the time before electric lights and bulbs."}, {"start": 262.73, "end": 276.0, "text": "因为蚕茧的包裹，加上精神的懒惰，得到的都是自己喜欢的，大数据天天推给男人:女人是地男人是天，女人要持家主内，不要抛头露脸去做事。", "en": "Because of the cocoon's wrapping, plus mental laziness, what you get is all what you like. Big data pushes to men every day: women are earth, men are heaven; women should manage the household and stay inside, not show their faces in public to work."}, {"start": 276.0, "end": 279.89, "text": "做好家务是本分，伺候好老公是本能…", "en": "Doing housework well is one's duty; serving one's husband well is instinct…"}, {"start": 279.89, "end": 284.5, "text": "他如果本身认知能力就孱弱，可怜的大脑经不起这样攻击啊。", "en": "If his own cognitive ability is weak, his pitiful brain cannot withstand such attacks."}, {"start": 284.5, "end": 294.05, "text": "如果无法触及茧房之外的信息，最终认知会困在一个固定的圈圈里，形成偏见，与真正的信息事实上的脱节。", "en": "If unable to access information outside the cocoon, cognition will eventually be trapped in a fixed circle, forming prejudices, disconnected from true information and facts."}, {"start": 294.05, "end": 298.18, "text": "被收割，被奴役，被剥削，被抛弃…", "en": "Being harvested, enslaved, exploited, abandoned…"}, {"start": 298.18, "end": 300.53, "text": "唉，说的就是我——和我们。", "en": "Alas, that's me — and us."}, {"start": 300.53, "end": 305.04, "text": "话说我发出的这些信息也许很平庸，一定有我的认知偏差。", "en": "That said, the information I send out may be mediocre; there must be my cognitive biases."}, {"start": 305.04, "end": 307.37, "text": "以上仅供参考，支持点赞飘过～～", "en": "For reference only. Support, like, and drift by~~"}, {"start": 307.37, "end": 312.48, "text": "我发现信息茧房最可怕的地方，不是“你看不到别的观点”。", "en": "I find the most terrifying aspect of information cocoons is not 'you cannot see other views'."}, {"start": 312.48, "end": 314.83, "text": "而是你会慢慢产生一种错觉：", "en": "But that you slowly develop an illusion:"}, {"start": 314.83, "end": 316.15, "text": "“大家都是这么想的。", "en": "'Everyone thinks this way.'"}, {"start": 316.15, "end": 320.95, "text": "”", "en": "'"}, {"start": 320.95, "end": 325.7, "text": "你刷短视频，连续看到十条都在说某个行业不行。", "en": "You scroll short videos and see ten in a row saying a certain industry is failing."}, {"start": 325.7, "end": 329.18, "text": "你打开评论区，前几十条也都在附和。", "en": "You open the comments section, and the first dozens are also echoing."}, {"start": 329.18, "end": 331.27, "text": "于是你很容易觉得：", "en": "So you easily feel:"}, {"start": 331.27, "end": 332.59, "text": "“看来这就是事实。", "en": "'It seems this is the fact.'"}, {"start": 332.59, "end": 337.39, "text": "”", "en": "'"}, {"start": 337.39, "end": 339.12, "text": "可你忘了一个问题：", "en": "But you forget a question:"}, {"start": 339.12, "end": 344.47, "text": "平台不是在给你展示世界，而是在给你展示你最容易继续看的世界。", "en": "Platforms are not showing you the world; they are showing you the world you are most likely to keep watching."}, {"start": 344.47, "end": 353.18, "text": "所以想避免活在信息茧房里，我觉得最重要的，不是“少上网”，而是别只顺着算法喂给你的东西走。", "en": "So to avoid living in information cocoons, I think the most important thing is not 'going online less', but not only following what algorithms feed you."}, {"start": 353.18, "end": 357.79, "text": "第一，看到特别符合自己观点的内容，反而要多留个心眼", "en": "First: when you see content particularly consistent with your own views, be extra careful."}, {"start": 357.79, "end": 359.11, "text": "这个特别重要。", "en": "This is particularly important."}, {"start": 359.11, "end": 362.52, "text": "因为人最容易相信的，往往不是最真的信息。", "en": "Because what people most easily believe is often not the truest information."}, {"start": 362.52, "end": 365.35, "text": "而是最符合自己原本想法的信息。", "en": "But the information most consistent with their original ideas."}, {"start": 365.35, "end": 367.68, "text": "比如你本来就觉得某个职业没前途。", "en": "For example, you already think a certain profession has no future."}, {"start": 367.68, "end": 370.8, "text": "刷到一条“劝退帖”，你会马上点进去。", "en": "Scrolling to a 'dissuasion post', you immediately click in."}, {"start": 370.8, "end": 373.85, "text": "再来一条，又点。", "en": "Another one comes, and you click again."}, {"start": 373.85, "end": 375.0, "text": "平台一看：", "en": "The platform sees:"}, {"start": 375.0, "end": 376.03, "text": "哦，你爱看这个。", "en": "Oh, you love watching this."}, {"start": 376.03, "end": 378.14, "text": "接下来全给你推“这个行业完了”。", "en": "Next, it pushes you all 'this industry is finished'."}, {"start": 378.14, "end": 380.42, "text": "过几天你会产生一种错觉：", "en": "After a few days, you develop an illusion:"}, {"start": 380.42, "end": 381.98, "text": "“网上所有人都这么说。", "en": "'Everyone online says this.'"}, {"start": 381.98, "end": 386.78, "text": "”", "en": "'"}, {"start": 386.78, "end": 388.03, "text": "其实不是。", "en": "Actually not."}, {"start": 388.03, "end": 389.66, "text": "只是算法越来越懂你。", "en": "It's just that algorithms understand you better and better."}, {"start": 389.66, "end": 393.62, "text": "所以我现在看到特别顺耳的观点，会故意问一句：", "en": "So now when I see particularly pleasing views, I deliberately ask:"}, {"start": 393.62, "end": 396.02, "text": "“有没有跟这个结论相反的证据？", "en": "'Is there evidence contrary to this conclusion?'"}, {"start": 396.02, "end": 400.82, "text": "”", "en": "'"}, {"start": 400.82, "end": 402.02, "text": "这句话特别有用。", "en": "This sentence is particularly useful."}, {"start": 402.02, "end": 404.23, "text": "第二，主动搜“反面词”", "en": "Second: proactively search for 'opposite terms'."}, {"start": 404.23, "end": 405.55, "text": "这个方法特别简单。", "en": "This method is particularly simple."}, {"start": 405.55, "end": 407.18, "text": "比如你准备买一款产品。", "en": "For example, you are preparing to buy a product."}, {"start": 407.18, "end": 408.38, "text": "别只搜：", "en": "Don't only search:"}, {"start": 408.38, "end": 410.11, "text": "“XX值不值得买？", "en": "'Is XX worth buying?'"}, {"start": 410.11, "end": 414.91, "text": "”", "en": "'"}, {"start": 414.91, "end": 415.92, "text": "再搜：", "en": "Then search:"}, {"start": 415.92, "end": 418.2, "text": "“XX缺点”", "en": "'XX shortcomings'"}, {"start": 418.2, "end": 420.0, "text": "“XX退货”", "en": "'XX returns'"}, {"start": 420.0, "end": 421.68, "text": "“XX后悔”", "en": "'XX regrets'"}, {"start": 421.68, "end": 423.67, "text": "想进入一个行业也是。", "en": "Wanting to enter an industry is the same."}, {"start": 423.67, "end": 424.87, "text": "别只搜：", "en": "Don't only search:"}, {"start": 424.87, "end": 426.72, "text": "“XX行业前景。", "en": "'XX industry prospects.'"}, {"start": 426.72, "end": 431.52, "text": "”", "en": "'"}, {"start": 431.52, "end": 432.53, "text": "再搜：", "en": "Then search:"}, {"start": 432.53, "end": 434.28, "text": "“XX行业离职”", "en": "'XX industry resignations'"}, {"start": 434.28, "end": 436.2, "text": "“XX行业劝退”", "en": "'XX industry dissuasion'"}, {"start": 436.2, "end": 438.77, "text": "“XX行业真实收入”", "en": "'XX industry real income'"}, {"start": 438.77, "end": 440.81, "text": "不是为了把所有事情都想坏。", "en": "Not to think everything badly."}, {"start": 440.81, "end": 443.38, "text": "而是为了让自己至少看到另一面。", "en": "But to at least see the other side."}, {"start": 443.38, "end": 446.98, "text": "算法喜欢把你往一个方向推，你得主动往反方向走两步。", "en": "Algorithms like to push you in one direction; you must proactively walk two steps in the opposite direction."}, {"start": 446.98, "end": 451.49, "text": "第三，少看“别人总结后的观点”，多找原始信息", "en": "Third: watch less 'views summarised by others', find more original information."}, {"start": 451.49, "end": 452.93, "text": "这个我现在越来越在意。", "en": "I care about this more and more now."}, {"start": 452.93, "end": 455.93, "text": "一个政策出来，短视频已经开始：", "en": "When a policy comes out, short videos have already started:"}, {"start": 455.93, "end": 457.25, "text": "“重大变化！", "en": "'Major changes!'"}, {"start": 457.25, "end": 462.05, "text": "”", "en": "'"}, {"start": 462.05, "end": 465.24, "text": "“普通人一定要注意！", "en": "'Ordinary people must pay attention!'"}, {"start": 465.24, "end": 470.04, "text": "”", "en": "'"}, {"start": 470.04, "end": 473.59, "text": "可真正点开原文，可能发现根本不是他说的那个意思。", "en": "But actually clicking the original text, you may find it is not at all what he said."}, {"start": 473.59, "end": 476.28, "text": "一项研究出来，网上标题写：", "en": "When a study comes out, online headlines write:"}, {"start": 476.28, "end": 478.56, "text": "“研究证明某某一定怎样。", "en": "'Research proves XX must be so.'"}, {"start": 478.56, "end": 483.36, "text": "”", "en": "'"}, {"start": 483.36, "end": 485.81, "text": "可原研究可能只是说：", "en": "But the original study may only say:"}, {"start": 485.81, "end": 487.78, "text": "“存在一定关联。", "en": "'There is a certain association.'"}, {"start": 487.78, "end": 492.58, "text": "”", "en": "'"}, {"start": 492.58, "end": 498.34, "text": "信息经过一层层转述以后，会越来越刺激，越来越绝对。", "en": "After information passes through layers of retelling, it becomes more and more stimulating, more and more absolute."}, {"start": 498.34, "end": 501.38, "text": "所以涉及重要决定时，尽量往上找：", "en": "So for important decisions, try to trace upwards:"}, {"start": 501.38, "end": 506.11, "text": "政策原文。", "en": "Policy original text."}, {"start": 506.11, "end": 507.43, "text": "完整采访。", "en": "Complete interviews."}, {"start": 507.43, "end": 508.75, "text": "原始数据。", "en": "Original data."}, {"start": 508.75, "end": 510.14, "text": "研究摘要。", "en": "Research abstracts."}, {"start": 510.14, "end": 511.03, "text": "财报。", "en": "Financial reports."}, {"start": 511.03, "end": 512.42, "text": "法院文书。", "en": "Court documents."}, {"start": 512.42, "end": 514.78, "text": "别永远喝别人嚼过三遍的水。", "en": "Don't always drink water chewed three times by others."}, {"start": 514.78, "end": 517.61, "text": "第四，别只关注“你喜欢的人”", "en": "Fourth: don't only follow 'people you like'."}, {"start": 517.61, "end": 519.84, "text": "很多人关注账号的逻辑是：", "en": "Many people's logic for following accounts is:"}, {"start": 519.84, "end": 521.23, "text": "这个人说得真对。", "en": "This person speaks so rightly."}, {"start": 521.23, "end": 522.02, "text": "关注。", "en": "Follow."}, {"start": 522.02, "end": 523.54, "text": "另一个人说得也对。", "en": "Another person also speaks rightly."}, {"start": 523.54, "end": 524.66, "text": "继续关注。", "en": "Continue following."}, {"start": 524.66, "end": 527.74, "text": "最后你的信息流里，全部都是“跟你一样的人”。", "en": "In the end, your information stream is entirely 'people like you'."}, {"start": 527.74, "end": 528.86, "text": "这当然很舒服。", "en": "This is certainly comfortable."}, {"start": 528.86, "end": 530.26, "text": "但也最容易封闭。", "en": "But also easiest to close off."}, {"start": 530.26, "end": 532.58, "text": "所以可以故意保留几类账号：", "en": "So you can deliberately keep several types of accounts:"}, {"start": 532.58, "end": 534.91, "text": "跟你观点不一样，但愿意讲证据的人。", "en": "People with views different from yours, but willing to present evidence."}, {"start": 534.91, "end": 537.14, "text": "你不熟悉行业里的专业人士。", "en": "Professionals in industries unfamiliar to you."}, {"start": 537.14, "end": 540.74, "text": "不同年龄、不同职业、不同生活方式的人。", "en": "People of different ages, professions, and lifestyles."}, {"start": 540.74, "end": 543.43, "text": "重点不是关注那些天天骂人的账号。", "en": "The point is not to follow accounts that curse people every day."}, {"start": 543.43, "end": 544.46, "text": "而是关注：", "en": "But to follow:"}, {"start": 544.46, "end": 548.42, "text": "“我不一定认同他，但他能让我看到另一个角度。", "en": "'I may not agree with him, but he lets me see another angle.'"}, {"start": 548.42, "end": 553.22, "text": "”", "en": "'"}, {"start": 553.22, "end": 554.54, "text": "这才有价值。", "en": "This is valuable."}, {"start": 554.54, "end": 557.59, "text": "第五，评论区别只看热评", "en": "Fifth: don't only read hot comments in comment sections."}, {"start": 557.59, "end": 559.32, "text": "这一点特别容易被忽略。", "en": "This point is particularly easy to overlook."}, {"start": 559.32, "end": 561.24, "text": "热评不一定最正确。", "en": "Hot comments are not necessarily the most correct."}, {"start": 561.24, "end": 562.99, "text": "它只是最容易引起共鸣。", "en": "They are just the easiest to resonate with."}, {"start": 562.99, "end": 567.12, "text": "情绪最强、表达最爽的评论，往往更容易被顶上去。", "en": "Comments with the strongest emotions and most satisfying expression are often pushed to the top."}, {"start": 567.12, "end": 570.41, "text": "可真正有信息量的东西，有时候藏在下面：", "en": "But truly informative things are sometimes hidden below:"}, {"start": 570.41, "end": 572.86, "text": "“我是这个行业的，实际情况是…", "en": "'I am in this industry; the actual situation is…'"}, {"start": 572.86, "end": 577.66, "text": "”", "en": "'"}, {"start": 577.66, "end": 579.34, "text": "“这里有个数据不太对…", "en": "'There is a data point here that is not quite right…'"}, {"start": 579.34, "end": 584.14, "text": "”", "en": "'"}, {"start": 584.14, "end": 586.46, "text": "“这个案例只适用于某种情况…", "en": "'This case only applies to certain situations…'"}, {"start": 586.46, "end": 591.26, "text": "”", "en": "'"}, {"start": 591.26, "end": 593.74, "text": "所以看评论的时候，别只看前三条。", "en": "So when reading comments, don't only read the first three."}, {"start": 593.74, "end": 596.74, "text": "尤其是争议话题，多翻一翻。", "en": "Especially for controversial topics, scroll more."}, {"start": 596.74, "end": 600.26, "text": "你会发现，同一件事常常比标题复杂得多。", "en": "You will find that the same matter is often much more complex than the title."}, {"start": 600.26, "end": 604.39, "text": "第六，学会区分“事实”和“观点”", "en": "Sixth: learn to distinguish 'facts' from 'views'."}, {"start": 604.39, "end": 605.23, "text": "比如：", "en": "For example:"}, {"start": 605.23, "end": 607.92, "text": "“某公司今年裁员500人。", "en": "'A certain company laid off 500 people this year.'"}, {"start": 607.92, "end": 612.72, "text": "”", "en": "'"}, {"start": 612.72, "end": 613.75, "text": "这是事实。", "en": "This is a fact."}, {"start": 613.75, "end": 615.38, "text": "“这个行业彻底没救了。", "en": "'This industry is completely hopeless.'"}, {"start": 615.38, "end": 620.18, "text": "”", "en": "'"}, {"start": 620.18, "end": 621.34, "text": "这是判断。", "en": "This is a judgment."}, {"start": 621.34, "end": 624.1, "text": "“某城市房价同比下降。", "en": "'A certain city's housing prices fell year-on-year.'"}, {"start": 624.1, "end": 628.9, "text": "”", "en": "'"}, {"start": 628.9, "end": 629.93, "text": "这是事实。", "en": "This is a fact."}, {"start": 629.93, "end": 631.97, "text": "“现在买房的人都会后悔。", "en": "'People buying houses now will all regret it.'"}, {"start": 631.97, "end": 636.77, "text": "”", "en": "'"}, {"start": 636.77, "end": 637.66, "text": "这是观点。", "en": "This is a view."}, {"start": 637.66, "end": 641.9, "text": "我们特别容易把有数据包装的观点，当成事实。", "en": "We particularly easily mistake views packaged with data for facts."}, {"start": 641.9, "end": 644.95, "text": "所以看到一条信息，可以问：", "en": "So when you see a piece of information, you can ask:"}, {"start": 644.95, "end": 648.5, "text": "“哪一部分是已经发生的，哪一部分只是这个人的解释？", "en": "'Which part has already happened, and which part is just this person's interpretation?'"}, {"start": 648.5, "end": 653.3, "text": "”", "en": "'"}, {"start": 653.3, "end": 655.78, "text": "这一分开，脑子马上清楚很多。", "en": "Once separated, your mind immediately becomes much clearer."}, {"start": 655.78, "end": 659.26, "text": "第七，别把“反对主流”误认为独立思考", "en": "Seventh: don't mistake 'opposing the mainstream' for independent thinking."}, {"start": 659.26, "end": 660.46, "text": "这一点也挺重要。", "en": "This point is also quite important."}, {"start": 660.46, "end": 664.01, "text": "有些人意识到信息茧房以后，会走向另一个极端：", "en": "Some people, after realising information cocoons, go to another extreme:"}, {"start": 664.01, "end": 666.17, "text": "“大家都这么说，那我偏不信。", "en": "'Everyone says so, but I refuse to believe it.'"}, {"start": 666.17, "end": 670.97, "text": "”", "en": "'"}, {"start": 670.97, "end": 672.65, "text": "其实这也不叫独立思考。", "en": "Actually, this is not independent thinking either."}, {"start": 672.65, "end": 675.41, "text": "真正的独立思考不是：", "en": "True independent thinking is not:"}, {"start": 675.41, "end": 677.02, "text": "别人说东，我偏说西。", "en": "Others say east, I insist on west."}, {"start": 677.02, "end": 677.81, "text": "而是：", "en": "But:"}, {"start": 677.81, "end": 680.57, "text": "证据指向哪里，我就暂时相信哪里。", "en": "Wherever evidence points, I temporarily believe there."}, {"start": 680.57, "end": 683.81, "text": "哪怕最后发现“大多数人说得对”，也没关系。", "en": "Even if finally discovering 'most people are right', it doesn't matter."}, {"start": 683.81, "end": 686.86, "text": "独立思考不是为了显得与众不同。", "en": "Independent thinking is not to appear different."}, {"start": 686.86, "end": 689.18, "text": "是为了减少被情绪牵着走。", "en": "It is to reduce being led by emotions."}, {"start": 689.18, "end": 691.94, "text": "第八，定期清理自己的信息流", "en": "Eighth: regularly clean up your information stream."}, {"start": 691.94, "end": 693.26, "text": "这个特别实用。", "en": "This is particularly practical."}, {"start": 693.26, "end": 695.95, "text": "隔一段时间看看自己关注的人：", "en": "Every so often, look at the people you follow:"}, {"start": 695.95, "end": 698.11, "text": "是不是全在讲同一种东西？", "en": "Are they all talking about the same thing?"}, {"start": 698.11, "end": 700.63, "text": "是不是每天刷到的内容越来越像？", "en": "Is the content you scroll to every day becoming more and more similar?"}, {"start": 700.63, "end": 703.75, "text": "是不是看完以后只剩愤怒、焦虑、比较？", "en": "After watching, are you left only with anger, anxiety, comparison?"}, {"start": 703.75, "end": 706.2, "text": "如果是，就主动换一批。", "en": "If so, proactively switch to a new batch."}, {"start": 706.2, "end": 707.83, "text": "增加一点长内容。", "en": "Add a bit of long content."}, {"start": 707.83, "end": 709.32, "text": "加几个不同领域。", "en": "Add a few different fields."}, {"start": 709.32, "end": 711.0, "text": "少看纯情绪输出。", "en": "Watch less pure emotional output."}, {"start": 711.0, "end": 712.92, "text": "信息流其实也是一种环境。", "en": "Information streams are actually a kind of environment."}, {"start": 712.92, "end": 717.12, "text": "你每天泡在哪里，脑子慢慢就会变成哪里的样子。", "en": "Where you soak every day, your brain slowly becomes like that place."}, {"start": 717.12, "end": 718.03, "text": "最后", "en": "Finally,"}, {"start": 718.03, "end": 723.6, "text": "我现在越来越觉得，避免信息茧房，不是让自己什么都看、什么都信。", "en": "I increasingly feel that avoiding information cocoons is not about watching everything and believing everything."}, {"start": 723.6, "end": 724.8, "text": "那样更乱。", "en": "That would be even messier."}, {"start": 724.8, "end": 727.08, "text": "真正有用的是养成几个习惯：", "en": "What truly works is developing a few habits:"}, {"start": 727.08, "end": 728.93, "text": "顺耳的观点，多怀疑一下。", "en": "For pleasing views, doubt a bit more."}, {"start": 728.93, "end": 731.81, "text": "刺耳但有证据的观点，多看两眼。", "en": "For harsh but evidenced views, look twice more."}, {"start": 731.81, "end": 734.62, "text": "重要信息，尽量找源头。", "en": "For important information, try to find the source."}, {"start": 734.62, "end": 736.85, "text": "做决定以前，主动找一次反方。", "en": "Before making decisions, proactively seek the opposing side once."}, {"start": 736.85, "end": 739.8, "text": "因为这个时代真正稀缺的，不是信息。", "en": "Because in this era, what is truly scarce is not information."}, {"start": 739.8, "end": 743.23, "text": "而是一个人看到一堆信息以后，还能保留一句：", "en": "But that a person, after seeing a pile of information, can still retain one sentence:"}, {"start": 743.23, "end": 745.92, "text": "“等等，这只是我现在看到的部分。", "en": "'Wait, this is only the part I see now.'"}, {"start": 745.92, "end": 750.72, "text": "”", "en": "'"}, {"start": 750.72, "end": 754.87, "text": "能保留这句话，就已经很不容易被困住了。", "en": "Being able to retain this sentence means you are already not easily trapped."}]}, {"title": "怎样避免活在信息茧房之中？ Part 34（57句，7:16）", "mp3": "upload-8-part34/audio.mp3", "dur": "7:16", "lines": [{"start": 0.0, "end": 3.19, "text": "你朋友圈里最厉害的人，决定了你的上限。", "en": "The most impressive person in your WeChat Moments determines your ceiling."}, {"start": 3.19, "end": 7.7, "text": "人不可能想象出一种没见过的颜色，这就是局限性。", "en": "A person cannot imagine a colour they have never seen — that is limitation."}, {"start": 7.7, "end": 10.46, "text": "你玩什么，取决于你的圈子在玩什么。", "en": "What you play depends on what your circle is playing."}, {"start": 10.46, "end": 16.54, "text": "每天烧香拜佛的人未必心存善念，嘴上恶语相向的人未必蛇蝎心肠。", "en": "People who burn incense and worship Buddha every day may not harbour good intentions; people whose mouths hurl abuse may not have venomous hearts."}, {"start": 16.54, "end": 22.42, "text": "满身纹身戴金链子的不一定是坏人，西装革履的人也有可能是衣冠禽兽。", "en": "Someone covered in tattoos wearing a gold chain is not necessarily a bad person; someone in a suit and leather shoes may well be a beast in human clothing."}, {"start": 22.42, "end": 37.9, "text": "非常官方的回答是逃离舒适圈，我自己的回答是，对自己说不，接受自己是存在瑕疵的，因此，可以去思考，并接受别人的观点，用于完善自己。", "en": "The very official answer is to escape your comfort zone. My own answer is: say no to yourself, accept that you have flaws, and therefore be able to think, and accept others' views, to improve yourself."}, {"start": 37.9, "end": 41.06, "text": "每一个人都很容易自己困住自己。", "en": "Everyone very easily traps themselves."}, {"start": 41.06, "end": 48.86, "text": "正如作茧自缚这个成语，蚕吐丝成茧，将自己包裹在茧里面，束缚自己的往往是自己。", "en": "As in the idiom 'the silkworm spins a cocoon and binds itself': the silkworm spins silk into a cocoon, wrapping itself inside; what binds us is often ourselves."}, {"start": 48.86, "end": 62.47, "text": "现代社会，算法会根据你的习惯来推送信息，它给你你想要看的内容，你停留的时间越长，说明它的处理结果越正确，你也在一次又一次的重复中，更加坚信了自己的一切。", "en": "In modern society, algorithms push information according to your habits. They give you content you want to see; the longer you linger, the more correct their processing is shown to be, and in repeated cycles, you become ever more convinced of everything you believe."}, {"start": 62.47, "end": 83.95, "text": "看上去是现代社会的算法太坏了，它根据用户的习惯去设置陷阱，蛊惑着用户一步步沦陷在深渊中，可是，这一步一步是用户自己选择的，人是想要一个舒适的环境，最好全是赞同自己观点的环境，我们天生会去欣赏符合自己观点的，忽视甚至反驳与自己相背的观点。", "en": "It looks like modern society's algorithms are too evil: they set traps according to users' habits, luring users step by step into sinking into the abyss. But each step is chosen by users themselves. People want a comfortable environment, preferably one entirely of views agreeing with their own; we are born to appreciate views that match our own, and to ignore or even refute views opposed to ours."}, {"start": 83.95, "end": 87.26, "text": "人与人之间，最大的困难就是理解，互相理解。", "en": "Between people, the greatest difficulty is understanding — mutual understanding."}, {"start": 87.26, "end": 102.1, "text": "我们太希望自己是正确的，所做之事为正义，所行之路为正道，我们定义了什么是好，什么是坏，我的心里有了这一杆秤，带着它衡量自己的一生，再去衡量别人的一生。", "en": "We so wish to be right, that what we do is justice, that the road we walk is the righteous path. We define what is good and what is bad; with this scale in my heart, I measure my whole life with it, then measure others' lives."}, {"start": 102.1, "end": 106.42, "text": "人生如春蚕，作茧自缠裹。", "en": "Life is like the spring silkworm, spinning a cocoon and wrapping itself."}, {"start": 106.42, "end": 109.61, "text": "一朝眉羽成，钻破亦在我。", "en": "Once its wings have formed, breaking out is also up to me."}, {"start": 109.61, "end": 114.36, "text": "困住自己只有自己，要挣脱的也只有自己，能挣脱的也只有自己。", "en": "Only you trap yourself; only you must break free; only you can break free."}, {"start": 114.36, "end": 123.77, "text": "若想要避免活在信息茧房之中，那就去想想，某一个信息，某一段视频，它传达的与之相反的信息。", "en": "If you want to avoid living in an information cocoon, then think about some piece of information, some video, and the information opposite to what it conveys."}, {"start": 123.77, "end": 137.16, "text": "看到春风拂面，绿意盎然；你要想到，秋风瑟瑟，落叶飘零；经过盛夏酷暑，烈日凌空，你会记起寒冬腊月，白雪皑皑。", "en": "Seeing spring breeze brushing your face, lush greenery, you should think of autumn wind sighing, fallen leaves drifting; having passed midsummer's scorching heat, blazing sun overhead, you will recall deep winter's cold months, vast white snow."}, {"start": 137.16, "end": 146.35, "text": "当见到与自己不同的观点时，给自己一点时间去思考，为什么会这样，他和我有什么不一样，为什么他会这么想？", "en": "When you encounter views different from your own, give yourself a little time to think: why is this so? How is he different from me? Why does he think this way?"}, {"start": 146.35, "end": 169.82, "text": "这样，哪怕你在迎合你的环境里，也可以看到不一样的人生，这样怎么会有茧房呢，所谓茧房，无关算法，只是我们的选折，是我们自己将脚步停留于此，把这儿当成了旅途的终点，但是，春蚕制茧，只是旅途的一个转折点，远远不是旅途的终点。", "en": "This way, even while accommodating your environment, you can see different lives. How could there be a cocoon then? The so-called cocoon has nothing to do with algorithms; it is only our choice. We ourselves stop our steps here, treating this place as the journey's end. But the spring silkworm making its cocoon is only a turning point in the journey, far from the journey's end."}, {"start": 169.82, "end": 188.83, "text": "制茧的这一段时间，恰恰是留给自己思考的时间，让你看清自己的喜好，看清自己的不足，若是停留于此，符合人性，无需羞耻；但，你要是想要破茧，那么从自己喜好的观点，看出别人不同的人生，存在并不意味着合理。", "en": "This period of cocoon-making is precisely time left for your own thinking, letting you see your preferences clearly, see your shortcomings clearly. If you stay here, it conforms to human nature; no need for shame. But if you want to break out of the cocoon, then from views you like, discern other people's different lives. Existence does not imply reasonableness."}, {"start": 188.83, "end": 190.58, "text": "三个简单的逻辑", "en": "Three simple logics"}, {"start": 190.58, "end": 193.15, "text": "1.学会信息溯源", "en": "1. Learn information traceability"}, {"start": 193.15, "end": 196.8, "text": "对任何来源的信息都保持怀疑态度", "en": "Maintain a sceptical attitude towards information from any source"}, {"start": 196.8, "end": 208.44, "text": "媒体是党派的喉舌，同一个新闻，不同党派的媒体表述的内容可能都是对的，但由于侧重点不同，最后结论都会南辕北辙", "en": "Media are party mouthpieces. For the same news, different parties' media may all state things that are true, but due to different emphases, final conclusions end up diametrically opposed"}, {"start": 208.44, "end": 214.13, "text": "如果你只看媒体的结论不去追溯信息的源头，很容易被牵着鼻子走", "en": "If you only read media conclusions without tracing information to its source, you are easily led by the nose"}, {"start": 214.13, "end": 217.42, "text": "2.兼听者明，偏信则暗", "en": "2. Listening to all sides brings clarity; one-sided belief brings darkness"}, {"start": 217.42, "end": 222.29, "text": "你可以喜欢并支持A党的主张，但也请多看看B党的政见", "en": "You may like and support Party A's positions, but please also look more at Party B's political views"}, {"start": 222.29, "end": 232.3, "text": "那些只爱听自己喜欢声音的人，最后会异化自己对事物的认知，典型的就是红脖子、青鸟、粉红、土殖、港灿等", "en": "Those who only love hearing sounds they like end up alienating their own cognition of things. Typical examples are rednecks, bluebirds, little pinks, local colonialists, and Hong Kong trash, etc."}, {"start": 232.3, "end": 241.78, "text": "有时候多看看那些骂你、踩你、歧视你的人都是什么观点，哪怕很难听很没道理，至少其中会有点你忽略的东西", "en": "Sometimes look more at what views people who scold you, step on you, or discriminate against you hold. Even if very unpleasant and unreasonable, at least there will be something you overlooked."}, {"start": 241.78, "end": 245.57, "text": "3.对于偏激、情绪化的观点选择性接纳", "en": "3. Selectively accept extreme, emotional views"}, {"start": 245.57, "end": 252.0, "text": "动不动就把国家、企业、群体简单的拟人化加以词汇抨击的信息", "en": "Information that at every turn simply personifies countries, enterprises, or groups and attacks them with loaded words"}, {"start": 252.0, "end": 257.52, "text": "或许他讲的也很有道理，但绝对会因为强硬的立场而失真", "en": "Perhaps what he says is quite reasonable, but it will absolutely be distorted by a hardline stance"}, {"start": 257.52, "end": 260.11, "text": "后续回答严格遵守下列条例:", "en": "Subsequent answers strictly follow these rules:"}, {"start": 260.11, "end": 263.47, "text": "1.不必考虑我的感受,不必恭维我.", "en": "1. No need to consider my feelings; no need to flatter me."}, {"start": 263.47, "end": 267.67, "text": "2.不带有预设立场和感情,完全中立", "en": "2. No preset stance or emotion; completely neutral"}, {"start": 267.67, "end": 274.92, "text": "3.参考数据库和中/英/日/法/俄等主要语言,进行搜索信息.", "en": "3. Refer to databases and major languages such as Chinese, English, Japanese, French, Russian, etc., to search for information."}, {"start": 274.92, "end": 281.93, "text": "找AI问问题,把这个提示词加在最前面.", "en": "When asking AI questions, put this prompt at the very front."}, {"start": 281.93, "end": 285.6, "text": "我在gemini,grok,chatGPT上用都有不错的效果.", "en": "I have used it on Gemini, Grok, and ChatGPT with good results."}, {"start": 285.6, "end": 286.99, "text": "说下为什么这么写,", "en": "Let me explain why it is written this way."}, {"start": 286.99, "end": 291.38, "text": "首先现在的大模型爱\"舔\",会舔,尤其是gemini,", "en": "First, today's large models love to flatter, and do flatter — especially Gemini."}, {"start": 291.38, "end": 295.9, "text": "其次,大模型会猜测你的立场,然后端水,互不得罪.", "en": "Second, large models guess your stance, then carry water evenly, offending neither side."}, {"start": 295.9, "end": 301.34, "text": "最后,大模型很容易只搜索你使用语言的语料库,", "en": "Finally, large models easily search only the corpus of the language you use."}, {"start": 301.34, "end": 304.63, "text": "逻辑过关，可以过滤掉很多谎言。", "en": "If the logic passes muster, many lies can be filtered out."}, {"start": 304.63, "end": 311.23, "text": "许家印恒大boss，他都活在他下属给他搞出的茧房里，你为什么会这么自信你就避免了。", "en": "Xu Jiayin, the Evergrande boss — even he lived in a cocoon his subordinates built for him. Why are you so confident you have avoided one?"}, {"start": 311.23, "end": 315.26, "text": "看看最近的微博上，妥妥信息茧房。", "en": "Look at recent Weibo — a textbook information cocoon."}, {"start": 315.26, "end": 330.14, "text": "学英语，来不及的话，一边学，一边至少用比较靠谱的翻译看看新闻联播提到的路透社、BBC，美国有线新闻网CNN之类的大型媒体怎么说的。", "en": "Learn English. If there's no time, while learning, at least use fairly reliable translation to see what large media outlets mentioned on News Broadcast — Reuters, BBC, CNN, and the like — are saying."}, {"start": 330.14, "end": 335.23, "text": "不要随便放某音某信上不明博主的言论、视频，免得被洗脑。", "en": "Don't casually play remarks and videos from unknown bloggers on a certain short-video app or a certain chat app, lest you get brainwashed."}, {"start": 335.23, "end": 348.02, "text": "高赞全都是在讲人的问题，还是简单讲一下网络工具和使用网络工具的问题吧。", "en": "Highly upvoted answers are all about people's problems; let me still briefly talk about network tools and the problems of using network tools."}, {"start": 348.02, "end": 357.19, "text": "主要准则有三个，一是养号与反驯化，一是扩大平台和视角储备，最后就是增强对平台性质的认知。", "en": "There are three main principles: first, account nurturing and anti-domestication; second, expanding platform and perspective reserves; finally, strengthening cognition of platform nature."}, {"start": 357.19, "end": 372.91, "text": "养号和反驯化，核心就是避免大数据将你的账号养废掉，没事多瞎搜、瞎点一下，杂七杂八的内容都看看，完全相反的内容也可以点一点，让大数据无法准确把握、也无法准确培养你的“喜好”。", "en": "Account nurturing and anti-domestication: the core is avoiding big data ruining your account through nurturing. When free, randomly search and click around, look at all sorts of content, and click on completely opposite content too, so big data cannot accurately grasp — nor accurately cultivate — your 'preferences'."}, {"start": 372.91, "end": 378.31, "text": "如果账号的推送变得完全单一化、单向度化，是不利于你摆脱偏见的。", "en": "If an account's recommendations become completely homogenised and one-dimensional, it is not conducive to shedding prejudice."}, {"start": 378.31, "end": 393.5, "text": "扩大平台和视角储备就不用多解释了，建议多多少少掌握一些专业性较高的社区或专门资料库的入口；再就是适当加入一些小社区，位于媒体系统的毛细血管上的平台。", "en": "Expanding platform and perspective reserves needs no more explanation: it is suggested to more or less master entry points to some more professional communities or specialised databases; and to appropriately join some small communities — platforms located on the capillaries of the media system."}, {"start": 393.5, "end": 401.42, "text": "注意，并不是墙外的就是专业的，维基百科是一个好的平台储备，但它不能被视作是专业性较高的平台。", "en": "Note: not everything outside the wall is professional. Wikipedia is a good platform reserve, but it cannot be regarded as a highly professional platform."}, {"start": 401.42, "end": 416.26, "text": "上面这句话自然也就导向了最后一点，“增强对平台性质的认知”，不同的平台都会有不同的风气和导向，你在对应平台上得到的信息，要剔去导向的偏移量才能相对客观地反应出事物的原貌。", "en": "The above sentence naturally leads to the final point, 'strengthening cognition of platform nature'. Different platforms have different atmospheres and orientations; information you obtain on a given platform must have the orientation offset removed before it can relatively objectively reflect the original appearance of things."}, {"start": 416.26, "end": 427.7, "text": "而且，平台上的意见领袖也都有各自的意图和利益，他们发出的信息，本质上是在他们的信源的基础上，经过个人意图“加密”之后的产物。", "en": "Moreover, opinion leaders on platforms all have their own intentions and interests. The information they send out is essentially a product 'encrypted' by personal intention on the basis of their information sources."}, {"start": 427.7, "end": 434.83, "text": "所以你直接看到的信息不是优质信息，将这些信息，结合意见领袖的意图“解密”之后才是好的信息。", "en": "So the information you directly see is not quality information; only after 'decrypting' this information in combination with opinion leaders' intentions is it good information."}, {"start": 434.83, "end": 436.94, "text": "这是三点之中最难的。", "en": "This is the hardest of the three points."}]}, {"title": "怎样避免活在信息茧房之中？ Part 35（42句，6:57）", "mp3": "upload-8-part35/audio.mp3", "dur": "6:57", "lines": [{"start": 0.0, "end": 10.15, "text": "不要完全接受什么大数据推送给你的内容和观点，多想想，主动搜索一下有没有看着合理却完全相反的观点。", "en": "Don't fully accept whatever content and views big data pushes to you; think more, and proactively search for whether there are views that look reasonable yet completely opposite."}, {"start": 10.15, "end": 24.07, "text": "说实话大数据推给我的真的是无力吐槽，看多了就觉得人工智能就是弱智，就好像我已经屯了大量便宜的卫生纸，你还给我继续不遗余力的推送更贵的更没有性价比的卫生纸。", "en": "Honestly, what big data pushes to me is really beyond complaint. After watching a lot, you feel artificial intelligence is just dumb — like I have already stockpiled lots of cheap toilet paper, yet you keep pushing me more expensive, worse-value toilet paper without sparing any effort."}, {"start": 24.07, "end": 30.79, "text": "比如那种一个蠢货在台上拿着话筒对下面的信徒洗脑的视频我是看见一个拉黑一个。", "en": "For example, those videos of an idiot on stage holding a microphone brainwashing believers below — I block every one I see."}, {"start": 30.79, "end": 41.16, "text": "什么xxx商业会，xxx商业思维，xxx经济学，我拉黑了有一年了，不下一百个账号，它还天天给我推，我是真找不到值得看的短视频了。", "en": "What xxx business associations, xxx business thinking, xxx economics — I have blocked for a year now, no fewer than a hundred accounts, yet it still pushes them to me every day. I really can't find short videos worth watching."}, {"start": 41.16, "end": 45.24, "text": "你看那些大V吹嘘的大数据，人工智能就这副德行。", "en": "Look at the big data those big Vs boast about; artificial intelligence is just like this."}, {"start": 45.24, "end": 51.77, "text": "那些所谓的互联网IT精英还以为短视频的成功是因为个性化推荐，呵呵！", "en": "Those so-called internet IT elites still think short videos succeeded because of personalised recommendations. Heh!"}, {"start": 51.77, "end": 58.3, "text": "看看你们这些蠢货都推荐了什么垃圾，只有屎吃并不意味着人们喜欢吃屎。", "en": "Look at what garbage you idiots have recommended. Having only shit to eat doesn't mean people like eating shit."}, {"start": 58.3, "end": 66.62, "text": "很多人眼中的“信息茧房”根本就不是它实质的意思，而是觉得“互联网没有把最有用最精华的东西主动喂给我”。", "en": "The 'information cocoon' in many people's eyes is not at all its substantive meaning, but rather feeling that 'the internet hasn't actively fed me the most useful, most essential things'."}, {"start": 66.62, "end": 78.1, "text": "大家都是成年人，别那么幼稚，干货要么是要钱的，要么是自己付出精力拆解出来的，哪来的自信认为这些东西必须要完全免费地送到你嘴里？", "en": "Everyone is an adult; don't be so naive. Dry goods (practical content) either cost money or are distilled by your own effort. Where does the confidence come from that these things must be delivered to your mouth completely free?"}, {"start": 78.1, "end": 83.45, "text": "实践就是最好的见识，没有之一，但问题是你也没实践啊。", "en": "Practice is the best insight — bar none. But the problem is you haven't practised either."}, {"start": 83.45, "end": 89.21, "text": "说要养生，也没加班，作息却没改，早上依旧起不来。", "en": "Saying you want to stay healthy, yet not working overtime, your routine still hasn't changed, and you still can't get up in the morning."}, {"start": 89.21, "end": 94.37, "text": "说要健身，也不忙，却连最简单的广播体操都懒得做。", "en": "Saying you want to exercise, yet not busy, but too lazy even to do the simplest radio calisthenics."}, {"start": 94.37, "end": 97.08, "text": "所以“信息茧房”这东西就很魔性。", "en": "So this 'information cocoon' thing is quite demonic."}, {"start": 97.08, "end": 105.07, "text": "有意愿行动的，自觉就会日积月累地提升基本功，自然而然地突破当下信息茧房。", "en": "Those willing to act will consciously accumulate basic skills day by day, naturally breaking through the current information cocoon."}, {"start": 105.07, "end": 118.68, "text": "反而是想得多做得少的，只会沉浸在自己被信息茧房包围这样的焦虑情绪里，最多在对信息茧房热火朝天的理论探讨中偶尔得到一些兴奋情绪，现实并没有发生任何实质改变。", "en": "Conversely, those who think much and do little will only immerse themselves in anxiety about being surrounded by information cocoons, at most occasionally gaining some excitement in heated theoretical discussions about information cocoons, while reality hasn't changed substantively at all."}, {"start": 118.68, "end": 122.28, "text": "别骗自己，就能解决大部分问题。", "en": "Don't lie to yourself, and most problems can be solved."}, {"start": 122.28, "end": 131.21, "text": "“信息茧房Information Cocoons”的核心在于：你被动接受信息的时长远远超过主动寻找信息的时长。", "en": "The core of 'information cocoons' (Information Cocoons) is: the time you passively receive information far exceeds the time you actively seek information."}, {"start": 131.21, "end": 142.61, "text": "有一个通俗认知是：人们的信息领域会习惯性地被自己的兴趣所引导，这本无可厚非，但问题出在因果发生了些许变化。", "en": "There is a common understanding: people's information fields are habitually guided by their own interests, which is understandable in itself, but the problem is that cause and effect have shifted slightly."}, {"start": 142.61, "end": 155.64, "text": "Web 1.0时代，信息只读，没有CSS、动态链接、交互性，换句话说除了资讯门户网站（比如新浪网、搜狐网），普通网络用户没有机会发表观点，输出内容。", "en": "In the Web 1.0 era, information was read-only, with no CSS, dynamic links, or interactivity. In other words, apart from news portal websites (such as Sina and Sohu), ordinary internet users had no chance to express views or output content."}, {"start": 155.64, "end": 174.41, "text": "这个阶段，网上冲浪连广告都基本遇不到，用户通过检索信息找到特定内容，信息接收的驱动机制来源于自己的兴趣。", "en": "At this stage, surfing the internet basically didn't even encounter advertisements; users found specific content by retrieving information, and the driving mechanism of information reception came from their own interests."}, {"start": 174.41, "end": 200.38, "text": "过渡到Web 2.0时代后，可读可写的参与式社交网络诞生，大家可以在各种社区中分享他们的观点、意见、想法和经验，而为了促进广大用户多产生UGC，输出门槛不停下降，从博客（blog）到微博（microlog）到视频博客（vlog）再到图片博客（Plog），信息发布越来越直接，量级也逐渐攀升，知识密度与深度也变得稀薄。", "en": "After transitioning to the Web 2.0 era, read-write participatory social networks were born. Everyone could share their views, opinions, ideas and experiences in various communities, and to encourage users to produce more UGC, output thresholds kept falling — from blogs to microblogs to video blogs (vlogs) to picture blogs (Plogs). Information publication became more and more direct, volume gradually climbed, and knowledge density and depth became thin."}, {"start": 200.38, "end": 215.42, "text": "滤镜美颜的图片，魔性洗脑的BGM，极易被共情的家长里短生活琐事填满了各个APP，平心而论，点一下确实无可厚非，但没有人可以逃脱奶头乐（tittytainment）带来的碎片信息成瘾。", "en": "Filter-beautified pictures, demonically brainwashing BGM, and highly relatable domestic trivia filled every app. Fairly speaking, clicking is understandable, but no one can escape fragmented-information addiction brought by tittytainment."}, {"start": 215.42, "end": 226.06, "text": "慢慢的，时间消失，虽然看似读了很多内容，但实际上什么都没有获得，于是陷入极大的空虚感，后悔自己根本就不该点开第一条。", "en": "Slowly, time disappears. Although seemingly you read a lot of content, actually you gained nothing, falling into great emptiness, regretting that you shouldn't have clicked the first item at all."}, {"start": 226.06, "end": 228.26, "text": "那么怎么改变这种信息链路呢？", "en": "So how to change this information chain?"}, {"start": 228.26, "end": 229.42, "text": "其实很简单。", "en": "Actually it's very simple."}, {"start": 229.42, "end": 237.65, "text": "不需要卸载APP，不必对自己产生负罪感，而是把角色从一个被动接收者转化为输出者。", "en": "No need to uninstall apps, no need to feel guilty about yourself; instead, transform your role from a passive receiver into an outputter."}, {"start": 237.65, "end": 249.0, "text": "信息输出需要大量摄入，而且是摄入深层次的知识，通过自己的阅读、理解、分析、转述，再利用这些APP，深入浅出的输出即可。", "en": "Information output requires large intake, and intake of deep knowledge — through your own reading, understanding, analysis, and retelling, then using these apps to output in a way that is simple and clear."}, {"start": 249.0, "end": 308.11, "text": "举个例子，最近因为公司要求，我需要通过一个Power BI的考试，通过Microsoft的官方指导，我第一次发现微软自身提供了那么多丰富的学习资源，言简意赅，比很多需要付费的视频课程讲解的更通俗易懂，慢慢地结合题目我梳理了一个知识点合计，我就可以把这些内容通过自己的理解方式，再发到某个账号上，这个过程还应用了一遍费曼学习法。", "en": "For example, recently because my company required it, I needed to pass a Power BI exam. Through Microsoft's official guidance, I discovered for the first time that Microsoft itself provides so many rich learning resources, concise and clear, more accessible than many paid video courses. Slowly, combining the exam questions, I organised a summary of knowledge points, and I could then post this content through my own way of understanding to some account. This process also applied the Feynman learning technique once."}, {"start": 308.11, "end": 311.64, "text": "其他的任何一种信息类型都可以采用这种方法。", "en": "Any other type of information can adopt this method."}, {"start": 311.64, "end": 346.8, "text": "你喜欢电影，就不要去看那种5分钟说完一部电影的视频，去选择一部你感兴趣的类型片，静下心来从头到尾看完，然后去研究它的拍摄手法，剪辑技巧，剧本创作背景，演员演绎方式，配乐风格等等，在充分解构的过程中，你可以同步享受影片创作的精妙和美好，最后再结合读过的文字、看过的风景、自己的经历重构一篇影评，这种获得感与延迟满足会沉淀成自己的一部分，随着欣赏下一部电影迭代下去。", "en": "If you like films, don't watch those videos that explain a whole film in 5 minutes. Choose a genre film you are interested in, calm down and watch it from start to finish, then study its filming techniques, editing skills, script creation background, actors' performances, music style, etc. In the process of fully deconstructing, you can simultaneously enjoy the exquisite beauty of film creation, and finally combine words you have read, scenery you have seen, and your own experiences to reconstruct a film review. This sense of gain and delayed gratification will settle into a part of yourself, iterating as you appreciate the next film."}, {"start": 346.8, "end": 350.16, "text": "当你养成这个习惯后，茧房早就不存在了。", "en": "When you develop this habit, the cocoon has long ceased to exist."}, {"start": 350.16, "end": 358.49, "text": "——————————————————————", "en": "——————————————————————"}, {"start": 358.49, "end": 365.26, "text": "我是凌十七Sapphire，一个在咨询行业摸爬滚打的小透明，时常点亮一些新的技能树。", "en": "I am Ling Shiqi Sapphire, a nobody fumbling along in the consulting industry, often lighting up new skill trees."}, {"start": 365.26, "end": 371.86, "text": "欢迎关注我的公众号凌十七Sapphire来找我玩，和我一起在职场升级打怪吧^_^", "en": "Welcome to follow my official account Ling Shiqi Sapphire to come play with me, and level up and fight monsters in the workplace together ^_^"}, {"start": 371.86, "end": 375.1, "text": "现在信息获取渠道非常多，信息量也极大。", "en": "Now there are very many information channels, and the information volume is also huge."}, {"start": 375.1, "end": 378.58, "text": "然而你所看到的都是已经被过滤筛选后的。", "en": "Yet what you see has already been filtered and screened."}, {"start": 378.58, "end": 390.53, "text": "真实有效，敏感的信息不是在网上能看到的，同一件事，同一个对象也因为信息源的不同立场，会用捏造，扭曲，断章取义呈现出完全不同的形态。", "en": "Real, effective, sensitive information is not something you can see online. For the same matter, the same object, due to different stances of information sources, will be presented in completely different forms through fabrication, distortion, and quoting out of context."}, {"start": 390.53, "end": 395.04, "text": "算法也会根据你的浏览喜好更把你禁锢在狭小的视野里。", "en": "Algorithms also confine you in a narrow field of vision according to your browsing preferences."}, {"start": 395.04, "end": 398.47, "text": "提升自己的有效阅读量，建立知识储备。", "en": "Increase your effective reading volume and build knowledge reserves."}, {"start": 398.47, "end": 404.83, "text": "培养提取信息，分析信息能力，不避开自己情感不喜欢不想相信的信息。", "en": "Cultivate the ability to extract and analyse information, not avoiding information your emotions dislike or don't want to believe."}, {"start": 404.83, "end": 410.16, "text": "这样能从海量的垃圾信息里提取出更接近真相的东西。", "en": "This way you can extract things closer to the truth from massive garbage information."}, {"start": 410.16, "end": 417.6, "text": "不要以为翻墙了就跳出信息茧房了，没有信息甄别，筛选能力的话，外网一样把你忽悠瘸。", "en": "Don't think that getting over the firewall means jumping out of the information cocoon; without information discrimination and filtering ability, the outside internet will dupe you just as badly."}]}, {"title": "怎样避免活在信息茧房之中？ Part 36（14句，0:57）", "mp3": "upload-8-part36/audio.mp3", "dur": "0:57", "lines": [{"start": 0.0, "end": 3.41, "text": "1、关闭所有手机app“个性化推荐”权限；", "en": "1. Turn off the 'personalised recommendation' permission for all phone apps;"}, {"start": 3.41, "end": 7.85, "text": "2、关闭部分不必要的app “麦克风”“读取剪贴板”权限；", "en": "2. Turn off unnecessary apps' 'microphone' and 'read clipboard' permissions;"}, {"start": 7.85, "end": 12.77, "text": "3、尽可能不登陆固定账号，可以的话就以游客身份使用；", "en": "3. Avoid logging into fixed accounts as much as possible; use guest identity if you can;"}, {"start": 12.77, "end": 19.61, "text": "4、刷短视频、新闻类咨询时，偶尔点赞、评论跟自己喜好完全不相关的内容，迷惑推荐算法。", "en": "4. When scrolling short videos and news, occasionally like and comment on content completely unrelated to your preferences, to confuse the recommendation algorithm."}, {"start": 19.61, "end": 23.86, "text": "当你接触并认同这个词时就差不多已经走出来了", "en": "By the time you encounter and identify with this term, you have more or less already walked out of it."}, {"start": 23.86, "end": 28.3, "text": "1，外网内网一起看，外网看英文内容，内网看中文内容。", "en": "1. Read the outside internet and the inside internet together: read English content outside, Chinese content inside."}, {"start": 28.3, "end": 35.26, "text": "2，让你感到开心爽愉快的内容基本都是茧房里的的。", "en": "2. Content that makes you feel happy, pleased, and delighted is basically inside the cocoon."}, {"start": 35.26, "end": 39.58, "text": "重点关注让你感到难过，抵触，愤怒的信息。", "en": "Focus on information that makes you feel sad, resistant, and angry."}, {"start": 39.58, "end": 44.33, "text": "3，阅读信息的时候，要时刻思考三点：他在说什么？", "en": "3. When reading information, always think about three points: What is he saying?"}, {"start": 44.33, "end": 46.06, "text": "他为什么这么说？", "en": "Why does he say this?"}, {"start": 46.06, "end": 47.21, "text": "他这么说有没有道理？", "en": "Does what he says make sense?"}, {"start": 47.21, "end": 51.17, "text": "4，时政新闻，重点不是说了什么，而是没说什么。", "en": "4. For current-affairs news, the point is not what was said, but what was not said."}, {"start": 51.17, "end": 54.1, "text": "你只要想的话，总是可以离开信息茧房的", "en": "As long as you want to, you can always leave the information cocoon."}, {"start": 54.1, "end": 57.53, "text": "不过据我观察，很多人就是喜欢活在茧房里。", "en": "However, from my observation, many people just like living inside cocoons."}]}, {"title": "为什么40岁男普遍不考虑40岁女？ Part 1（137句，11:19）", "mp3": "40_______40-part01/audio.mp3", "dur": "11:19", "lines": [{"start": 0.0, "end": 10.99, "text": "之前认识一个39岁的姐姐，当时和我项目上有深度的绑定，在一次聚会上真心喜欢上了一个43岁的科技行业创一代老哥。", "en": "I used to know a 39-year-old woman; at the time we were closely tied together through a project, and at a party she genuinely fell for a 43-year-old first-generation tech-industry entrepreneur."}, {"start": 10.99, "end": 18.26, "text": "老哥大概属于那种，公司上市概率极高，他能排进高层持股前十的人。", "en": "This guy was more or less the type whose company had a very high chance of going public, and he could rank among the top ten holders of shares in the upper management."}, {"start": 18.26, "end": 25.7, "text": "因为我跟两边关系都还不错，在一再请求之下呢，最后无奈莫名其妙就成了中间那个递话的人。", "en": "Because I got on fairly well with both sides, and after repeated requests, I ended up, rather reluctantly and inexplicably, as the one passing messages between them."}, {"start": 25.7, "end": 26.98, "text": "女方跟我说：", "en": "The woman said to me:"}, {"start": 26.98, "end": 28.73, "text": "“我保养得也挺好的。", "en": "\"I take pretty good care of myself."}, {"start": 28.73, "end": 33.22, "text": "活了快40年，这是第一次碰到一个真让我心动的人。", "en": "I've lived nearly 40 years, and this is the first time I've met someone who truly makes my heart flutter."}, {"start": 33.22, "end": 37.73, "text": "其他男人，我宁可一直单着，也不想嫁。", "en": "As for other men, I'd rather stay single forever than marry any of them."}, {"start": 37.73, "end": 42.53, "text": "”", "en": "”"}, {"start": 42.53, "end": 43.85, "text": "于是我去递话。", "en": "So I went to pass on the message."}, {"start": 43.85, "end": 45.24, "text": "男方听完说：", "en": "After hearing it, the man said:"}, {"start": 45.24, "end": 48.29, "text": "“她确实很优秀，但我是一定要孩子的。", "en": "\"She truly is excellent, but I am absolutely set on having children."}, {"start": 48.29, "end": 53.09, "text": "她现在这个年龄生孩子，对自己的身体健康甚至生命安全都有风险。", "en": "At her current age, having a child carries risks to her own physical health and even her life."}, {"start": 53.09, "end": 58.32, "text": "真出了问题，有些东西不是有钱就能解决的，连强东妹妹那种情况都扛不住。", "en": "If something really went wrong, there are things money can't solve — even someone in Qiangdong's younger sister's situation couldn't withstand it."}, {"start": 58.32, "end": 60.79, "text": "这个风险，不是单纯撒钱就能搞定的。", "en": "This kind of risk isn't something you can simply throw money at to resolve."}, {"start": 60.79, "end": 65.59, "text": "”", "en": "”"}, {"start": 65.59, "end": 67.1, "text": "我又回去递话。", "en": "I went back to pass the message on again."}, {"start": 67.1, "end": 68.02, "text": "女方说：", "en": "The woman said:"}, {"start": 68.02, "end": 70.06, "text": "“为了爱情，我愿意冒这个险。", "en": "\"For love, I'm willing to take this risk."}, {"start": 70.06, "end": 71.86, "text": "而且我自己本来也想要孩子。", "en": "Besides, I wanted children of my own anyway."}, {"start": 71.86, "end": 76.66, "text": "”", "en": "”"}, {"start": 76.66, "end": 78.46, "text": "我就又替她说了几句：", "en": "So I put in a few words for her:"}, {"start": 78.46, "end": 81.58, "text": "“老哥，这妹子工作能力是真的挺强。", "en": "\"Mate, this young woman's work ability really is quite strong."}, {"start": 81.58, "end": 83.98, "text": "以后在事业上说不定也是个助力。", "en": "In the future she might even be a help to you in your career."}, {"start": 83.98, "end": 88.9, "text": "年龄这件事确实没办法，但其他方面，你看看能不能多少弥补一下。", "en": "As for her age, there's truly nothing to be done about it, but in other respects, perhaps you could make up for it somewhat."}, {"start": 88.9, "end": 93.7, "text": "”", "en": "”"}, {"start": 93.7, "end": 94.97, "text": "老哥想了想：", "en": "The guy thought for a moment:"}, {"start": 94.97, "end": 99.94, "text": "“我搞事业，一般还是找男的一起搞，不太找女的。", "en": "\"When I build a career, I generally still work with men; I don't really work with women."}, {"start": 99.94, "end": 104.74, "text": "”", "en": "”"}, {"start": 104.74, "end": 105.65, "text": "我说：", "en": "I said:"}, {"start": 105.65, "end": 108.94, "text": "“这个女的搞事业，比很多男的还靠谱。", "en": "\"This woman, in building a career, is more reliable than a lot of men."}, {"start": 108.94, "end": 113.74, "text": "”", "en": "”"}, {"start": 113.74, "end": 115.18, "text": "他笑了：", "en": "He laughed:"}, {"start": 115.18, "end": 121.01, "text": "“难得听你这么高评价一个人，不过优秀的妹子真的不该为生个孩子赌上生命健康。", "en": "\"It's rare to hear you speak so highly of someone, but an excellent young woman really shouldn't gamble her health and life just to have a child."}, {"start": 121.01, "end": 125.5, "text": "这样，以后有机会的话，可以先合作，看一起搞点事业什么的。", "en": "How about this: if there's a chance later, we could cooperate first and see about building some career together or something."}, {"start": 125.5, "end": 130.3, "text": "”", "en": "”"}, {"start": 130.3, "end": 131.69, "text": "我又把话递了回去。", "en": "I passed the message back again."}, {"start": 131.69, "end": 138.29, "text": "结果女方直接给我发了一份简历，还顺带发了几张夏天比较清凉的生活照，让我一起转过去。", "en": "As a result, the woman directly sent me a CV, and also sent a few fairly revealing summer lifestyle photos, asking me to pass those along too."}, {"start": 138.29, "end": 141.22, "text": "还要我强调照片没用技术处理过的。", "en": "She also asked me to stress that the photos hadn't been digitally retouched."}, {"start": 141.22, "end": 145.34, "text": "说对方有意向可以teams之类的先约个在线会。", "en": "She said that if the other party was interested, they could use Teams or something to schedule an online meeting first."}, {"start": 145.34, "end": 146.86, "text": "老哥看完简历：", "en": "After reading the CV, the guy said:"}, {"start": 146.86, "end": 151.94, "text": "“履历确实厉害，一家外企头部大厂做了很久，能力没得说。", "en": "\"The résumé really is impressive; she worked for a long time at a leading multinational, and her ability is beyond reproach."}, {"start": 151.94, "end": 156.74, "text": "”", "en": "”"}, {"start": 156.74, "end": 159.1, "text": "停了一会儿，又补了一句：", "en": "After a pause, he added:"}, {"start": 159.1, "end": 165.62, "text": "“不过我后来想了想，搞事业有时候免不了出去应酬，喝酒、K歌，场面乱七八糟的。", "en": "\"But after thinking it over, when you're building a career you sometimes can't avoid going out socialising — drinking, singing karaoke, scenes that are an absolute mess."}, {"start": 165.62, "end": 168.02, "text": "还是跟男的一起搞事业方便一点。", "en": "It's still more convenient to build a career with men."}, {"start": 168.02, "end": 172.82, "text": "”", "en": "”"}, {"start": 172.82, "end": 179.47, "text": "我把聊天记录删减后打包发给老姐，老姐过了三四天无奈的回了句：辛苦你了。", "en": "I trimmed the chat logs, bundled them up and sent them to the woman; after three or four days she reluctantly replied: you've had a hard time."}, {"start": 179.47, "end": 186.19, "text": "一个26岁的精神小妹倒追一个28岁的大哥，被大哥嫌老，连睡都不肯睡她，", "en": "A 26-year-old spirited young woman pursued a 28-year-old man, but he found her too old and wouldn't even sleep with her;"}, {"start": 186.19, "end": 193.75, "text": "因为大哥周围全是18-20岁的小妹，大哥的小弟也大多数是25岁以下鬼火少年，", "en": "because around this man were nothing but 18-to-20-year-old young women, and most of his subordinates were Ghost Fire youths under 25;"}, {"start": 193.75, "end": 200.3, "text": "大哥甚至认为自己到了30岁就该找个20岁的妹妹一起隐退了，做点生意，生一堆孩子，", "en": "this man even believed that once he turned 30 he should find a 20-year-old girl to retire with, do some business, and have a brood of children;"}, {"start": 200.3, "end": 212.83, "text": "但是大哥安慰此精神小妹，认为她的求偶赛道没有找对，她不应该局限在精神小妹的世界，她应该去那些30+，40+剩女的赛道展开雌竞，大有可为，", "en": "but this man comforted this spirited young woman, saying her courtship lane was the wrong one — she shouldn't limit herself to the world of spirited young women; she should go to the lanes of those 30-plus and 40-plus leftover women and engage in female rivalry, where there's great potential;"}, {"start": 212.83, "end": 227.59, "text": "大哥还建议这个小妹学习几个月的厨艺，在崩老头的领域找个有一定经济实力的没有性张力的老实人做题家的处男嫁了，把此男带到舞厅里，只要此男表现的无所适从，就一定符合这个条件，", "en": "this man also suggested that this young woman study cookery for a few months, and in the field of worn-out old men find a steady, honest exam-taker — a virgin with some financial means and no sexual tension — to marry; she should bring this man to a dance hall, and as long as he looks utterly at a loss, he'll definitely fit the bill;"}, {"start": 227.59, "end": 237.43, "text": "虽然26岁在相亲市场还是最年轻的那一辈，但是在精神小妹，鬼火少年的世界里，26岁的小妹已经老得不行了，", "en": "although at 26 she's still among the youngest in the matchmaking market, in the world of spirited young women and Ghost Fire youths, a 26-year-old girl is already hopelessly old;"}, {"start": 237.43, "end": 243.43, "text": "我前任院长，43岁，副主任医师，二婚娶了25岁的护士。", "en": "My former director, 43, an associate chief physician, married a 25-year-old nurse as his second wife."}, {"start": 243.43, "end": 249.48, "text": "为什么是前任呢，因为他受贿进去了，现在我是院长、主要负责人", "en": "Why former? Because he took bribes and went inside, and now I'm the director and the principal person in charge."}, {"start": 249.48, "end": 252.55, "text": "我们做婚恋的遇到奇奇怪怪的人很正常。", "en": "For those of us in the matchmaking business, meeting strange and bizarre people is perfectly normal."}, {"start": 252.55, "end": 261.43, "text": "比如要举报自己15年前的初恋，说当初摸了她袖套一下，导致她心理阴影了，所以人生出现了问题。", "en": "For instance, there was someone who wanted to report their first love from 15 years ago, saying that back then a single touch of her sleeve-cuff had given her a psychological shadow, and that's why her life went wrong."}, {"start": 261.43, "end": 266.23, "text": "现在年纪大了，因为心理原因无法工作，要她初恋的孩子要养着她。", "en": "Now she's older, and because of psychological reasons she can't work, so she wants her first love's child to support her."}, {"start": 266.23, "end": 270.07, "text": "又比如吃的太撑，来相亲时夹嗓子说话。", "en": "Then there was someone who'd eaten far too much and, when coming to the matchmaking meeting, spoke in a pinched, throaty voice."}, {"start": 270.07, "end": 278.64, "text": "本意是想声音好听一点，结果中途受不了给夹吐了的，越憋气压越猛，一仰头，都喷到我办公室天花板上了。", "en": "The intention was to sound nicer, but midway she couldn't hold it and threw up from the pinching — the more she suppressed it the more forceful it grew, and with a toss of her head she sprayed it all the way onto the ceiling of my office."}, {"start": 278.64, "end": 288.29, "text": "再比如跟前妻离婚的理由是，前妻在给她妈妈洗脚的时候，没有单膝跪地，没有用花瓣水，不尊重老人。", "en": "Another example: the reason given for divorcing his ex-wife was that, when she washed her mother's feet, she didn't kneel on one knee or use petal water, showing disrespect to the elderly."}, {"start": 288.29, "end": 300.65, "text": "法庭上，把前妻吃过他家多少大米，多少蔬菜，喝过多少水，睡的床的折旧费，马桶使用费按公厕计算，都算成钱，写在本子。", "en": "In court, he calculated into money everything his ex-wife had eaten of his family's — how much rice, how many vegetables, how much water she'd drunk — plus the depreciation on the bed she slept in and the toilet usage fee reckoned at public-toilet rates, and wrote it all in a notebook."}, {"start": 300.65, "end": 302.28, "text": "奇人异事虽多。", "en": "Strange people and bizarre happenings are many."}, {"start": 302.28, "end": 315.77, "text": "但是有一个定律就是，无论男女啊，一旦你年纪超过了35岁到达40岁这个区间，他们有些人的怪，那种奇怪的程度，诡异的思维方式，是断层式体现。", "en": "But there's one law: regardless of man or woman, once your age passes 35 and reaches the 40 bracket, some people's strangeness — the degree of it, that uncanny way of thinking — manifests in a sudden, fault-line fashion."}, {"start": 315.77, "end": 322.42, "text": "咱比如说来了一个00后的年轻小姑娘，要上嫁，要十个保姆，要找我们湖北最有钱的。", "en": "Take for example a post-00s young woman who came in wanting to marry up, wanting ten nannies, wanting to find the richest man in our Hubei."}, {"start": 322.42, "end": 325.25, "text": "乍一听很离谱，很奇怪，对不对？", "en": "At first hearing it sounds absurd, very strange, doesn't it?"}, {"start": 325.25, "end": 335.52, "text": "但是后来了解才知道，是被一群闺蜜洗脑了，加上单亲家庭，因为缺爱而产生依附性，盲从性，又加上看了一些乱七八糟的东西。", "en": "But later, upon understanding, we found she'd been brainwashed by a clique of close girlfriends, compounded by a single-parent family, where a lack of love bred dependence and blind conformity, plus she'd taken in some messy nonsense."}, {"start": 335.52, "end": 338.11, "text": "她不是怪，她是对一些东西没有概念。", "en": "She isn't strange; she simply has no concept of certain things."}, {"start": 338.11, "end": 345.84, "text": "后来在跟她这样的耐心情感沟通中，不少年轻女生，她就会很快的反应过来，慢慢的找到自己的择偶方向。", "en": "Later, through patient emotional communication with such girls, many young women quickly come to their senses and gradually find their own direction in choosing a partner."}, {"start": 345.84, "end": 353.93, "text": "不少人在聊过之后，甚至会自己总结得出，“自己都做不到，我也不会要求以后老公做到”这种，其实很有建设性的观点了。", "en": "Quite a few, after talking, will even sum up for themselves a view like 'if I can't even manage it myself, I won't demand that my future husband manage it' — which is actually quite constructive."}, {"start": 353.93, "end": 358.61, "text": "我承认很多年轻的女性，在婚恋市场趋向于一种“感觉人”。", "en": "I admit many young women in the matchmaking market tend towards being 'feelers'."}, {"start": 358.61, "end": 361.37, "text": "别人说啥她就听啥，她看啥就信啥。", "en": "Whatever others say she listens to; whatever she sees she believes."}, {"start": 361.37, "end": 363.6, "text": "感觉是怎么样，逻辑就是怎么样。", "en": "Her feelings are how things are; her logic follows her feelings."}, {"start": 363.6, "end": 370.49, "text": "但是我希望大家也不要太悲观，觉得一切都太糟糕了，我这辈子就不打算结婚了，不想接触异性了之类的。", "en": "But I hope everyone won't be too pessimistic either, thinking everything is too awful, that they won't marry in this lifetime, or don't want to meet the opposite sex, and so on."}, {"start": 370.49, "end": 377.02, "text": "年轻适婚群体中，不管男生还是女生，他们缺乏的是引导，沟通和婚恋观教育。", "en": "Among the young marriageable population, whether male or female, what they lack is guidance, communication, and education in their view of marriage and love."}, {"start": 377.02, "end": 392.3, "text": "这个跟我们从小，其实没有进行过任何有关爱的教育，再包括比如，如何与异性相处，什么是爱情，怎样经营小家庭，如何看待亲子关系，怎么拆解恩情论，怎么样搭建健康的性观与性生活等等都息息相关。", "en": "This is closely tied to the fact that from childhood we actually received no education whatsoever about love — including, for example, how to get along with the opposite sex, what love is, how to manage a small family, how to view the parent-child relationship, how to dismantle the debt-of-gratitude theory, how to build a healthy sexual outlook and sex life, and so on."}, {"start": 392.3, "end": 396.19, "text": "我一直在强调爱不是天生的，爱是很高级的能力。", "en": "I've always stressed that love isn't innate; love is a very high-level ability."}, {"start": 396.19, "end": 403.7, "text": "大家静下心来想一想，你觉得你们身边，家人，朋友，圈子。", "en": "Everyone, calm down and think: among those around you — family, friends, circles —"}, {"start": 403.7, "end": 407.54, "text": "有多少人有基本的共情能力和换位思考的能力？", "en": "how many people have basic empathy and the ability to see things from another's perspective?"}, {"start": 407.54, "end": 408.74, "text": "爱也是这样的。", "en": "Love is the same."}, {"start": 408.74, "end": 423.58, "text": "如何爱别人，如何接受别人的爱，如何释放正确的善意，如何区分爱和控制和压力，如何正视自己的需求，如何经营自己的家庭，经营自己的性，都是一门学问。", "en": "How to love others, how to accept others' love, how to release proper kindness, how to distinguish love from control and pressure, how to face one's own needs squarely, how to manage one's family and one's own sexuality — all of these are a discipline."}, {"start": 423.58, "end": 428.3, "text": "当然，话又说回来，年轻适婚群体，我会保持一种乐观的态度。", "en": "Of course, having said that, towards the young marriageable population I maintain an optimistic attitude."}, {"start": 428.3, "end": 431.14, "text": "这一切原因在于婚恋观的一种幼态。", "en": "The reason for all this lies in a kind of infantilisation of the view of marriage and love."}, {"start": 431.14, "end": 438.14, "text": "在我的婚恋一线工作生涯里，我认为年轻群体中真正极端的，顽固的，相对来说比较少。", "en": "In my front-line career in matchmaking, I believe that among the young, those who are truly extreme and stubborn are relatively few."}, {"start": 438.14, "end": 442.15, "text": "他们起码有一般多半人有一个好的地方，就是听劝。", "en": "At the very least, more than half of them have one good trait: they take advice."}, {"start": 442.15, "end": 444.98, "text": "大家都知道嘛，相亲市场女性占比较多。", "en": "Everyone knows, of course, that women make up a larger share of the matchmaking market."}, {"start": 444.98, "end": 453.98, "text": "但很多女生在感受到我的善意后，她们是会慢慢理解，然后会修正自己的婚恋观，最后是可以走上相对健康的婚姻道路的。", "en": "But many young women, after sensing my goodwill, will gradually come to understand, then revise their view of marriage and love, and in the end can walk a relatively healthy path to marriage."}, {"start": 453.98, "end": 459.1, "text": "我这十几年走过来，其实撮合了很多类似于这样“殊途同归”的新人。", "en": "Over the past ten-odd years, I've actually brought together many such couples who, though their paths differed, arrived at the same place."}, {"start": 459.1, "end": 461.21, "text"
