5.65, "end": 125.04, "text": "因为即使没有信息平台，没有算法，我们把握的现实依然是被自己的偏好所建构出来的伪现实，也就是被意识形态捕获了。", "en": "Because even without information platforms and algorithms, the reality we grasp is still a pseudo-reality constructed by our own preferences — that is, captured by ideology."}, {"start": 125.04, "end": 135.43, "text": "比如一名中国男性极端厌女（换成女拳厌男也可以），我们可以说他走到这个地步是因为他在信息茧房里看了够多的煽动性文章。", "en": "For example, a Chinese man who is extremely misogynistic (or swap in a feminist man-hater) — we can say he reached this point because he read enough inflammatory articles in the information cocoon."}, {"start": 135.43, "end": 145.8, "text": "但是我们总是可以追溯到算法还没有学习到他信息偏好的时间点，在此时，我们依然无法认为他在性别议题上是中立的，即使他自己也这样认为。", "en": "But we can always trace back to the point before the algorithm had learned his information preferences. At that point, we still cannot consider him neutral on gender issues, even if he himself thinks so."}, {"start": 145.8, "end": 154.87, "text": "因为逻辑上讲，他必然首先被第一篇厌女文章而不是其他什么文章打动了，算法才会在后续继续给他推送类似的文章。", "en": "Because logically, he must first have been moved by the first misogynistic article rather than some other article, and only then did the algorithm continue pushing similar articles to him afterwards."}, {"start": 154.87, "end": 164.4, "text": "只有他具有个人差异性的心理防御机制才能解释他被第一篇厌女文章打动了（而不是没被打动，甚至反感）。", "en": "Only his individually differentiated psychological defence mechanism can explain why he was moved by the first misogynistic article (rather than not being moved, or even feeling disgusted)."}, {"start": 164.4, "end": 169.27, "text": "所以问题不仅仅出在“服务器”，也出在了“客户端”，也就是个人精神结构。", "en": "So the problem lies not only in the 'server', but also in the 'client' — that is, the individual psychic structure."}, {"start": 169.27, "end": 181.56, "text": "信息资本并没有凭空创造了一个信息茧房出来；他们只是给人们已有的心理防御机制打了补丁，让曾经就已经有的藩篱更加难以逾越。", "en": "Information capital did not create an information cocoon out of thin air; they merely patched people's existing psychological defence mechanisms, making the fences that already existed even harder to cross."}, {"start": 181.56, "end": 185.69, "text": "把内容推送关了，固然可以让我们接收更多元化的信息。", "en": "Turning off content recommendations can certainly let us receive more diverse information."}, {"start": 185.69, "end": 189.22, "text": "但是想要彻底打破信息茧房，光这么做还不够。", "en": "But to thoroughly break the information cocoon, doing only this is not enough."}, {"start": 189.22, "end": 193.06, "text": "我们还要处理我们客户端的问题，也就是我们精神结构的问题。", "en": "We must also deal with our client-side problem — that is, the problem of our psychic structure."}, {"start": 193.06, "end": 200.3, "text": "到这里，熟悉拉黑齐的朋友们，应该会想到拉康精神分析最关键的环节：穿越幻象。", "en": "At this point, friends familiar with Lacan should think of the most crucial link in Lacanian psychoanalysis: traversing the fantasy."}, {"start": 200.3, "end": 206.62, "text": "理解穿越幻象解决了开头“敢不敢”的问题，坚持穿越幻象的实践解决了“如何”的问题。", "en": "Understanding traversing the fantasy solves the opening 'dare or not dare' problem; persisting in the practice of traversing the fantasy solves the 'how' problem."}, {"start": 206.62, "end": 213.17, "text": "这个答案写到这里就结束其实相当不负责任，因为我只是把题目换成了“如何穿越幻象”。", "en": "Ending this answer here would actually be quite irresponsible, because I have only replaced the question with 'how to traverse the fantasy'."}, {"start": 213.17, "end": 218.26, "text": "但是关于穿越幻象的回答已经有珠玉在前了，推荐这个答案：", "en": "But answers about traversing the fantasy already have excellent predecessors; I recommend this answer:"}, {"start": 218.26, "end": 221.81, "text": "1、在钱有余力的情况下，去国外实地感受一下。", "en": "1. If you have spare money, go abroad and experience it in person."}, {"start": 221.81, "end": 224.28, "text": "2、科学上网。", "en": "2. Bypass the firewall scientifically."}, {"start": 224.28, "end": 227.81, "text": "3、多看国内一些非主流报道的文章。", "en": "3. Read more non-mainstream domestic reporting."}, {"start": 227.81, "end": 230.62, "text": "4、和主流媒体的思路反着来。", "en": "4. Go against the thinking of mainstream media."}, {"start": 230.62, "end": 238.22, "text": "我刷短视频时，从来都没刷到过小姐姐的视频，映入我眼帘的都是赚钱、营销、人性相关的。", "en": "When I scroll short videos, I have never scrolled to videos of pretty girls; what meets my eyes is all about making money, marketing and human nature."}, {"start": 238.22, "end": 244.3, "text": "即使我搜索“美女”，也都是分析这些美女都是如何利用美色赚钱的，而不是美女视频本身。", "en": "Even when I search 'beautiful women', the results are all analyses of how these beautiful women use their looks to make money, not videos of beautiful women themselves."}, {"start": 244.3, "end": 249.65, "text": "换句话说，在短视频平台里，好像我是一个对女色完全不感兴趣的机器人。", "en": "In other words, on short-video platforms, I seem to be a robot completely uninterested in female beauty."}, {"start": 249.65, "end": 265.49, "text": "当我卸载软件，重新下载短视频软件、还没有登录账号的时候，我就发现，给我推送的视频除了是美女跳舞，就是那些吸引人眼球的新闻事件（比如淄博烧烤、大熊猫回国、五一景区挤满了游客这些）。", "en": "When I uninstalled the app, re-downloaded the short-video app and had not yet logged into an account, I found that the videos pushed to me were either girls dancing or eye-catching news events (such as Zibo barbecue, the giant pandas returning home, and May Day scenic spots packed with tourists)."}, {"start": 265.49, "end": 270.84, "text": "但是当我登录短视频软件之后，就只给我推送特定几类视频内容了。", "en": "But after I logged into the short-video app, it only pushed me a few specific categories of video content."}, {"start": 270.84, "end": 280.99, "text": "大家看懂了吗，互联网时代，只要不刻意抵抗，那么我们每个人都会被特定类型的信息包裹、洗脑，而且根本看不到其他类型的信息。", "en": "Do you all understand? In the internet age, as long as you do not deliberately resist, each of us will be wrapped and brainwashed by specific types of information, and cannot see other types of information at all."}, {"start": 280.99, "end": 282.74, "text": "信息茧房就形成了。", "en": "The information cocoon has formed."}, {"start": 282.74, "end": 289.46, "text": "每个人筛选、处理、吸收信息的能力不同，人就会被分成三六九等。", "en": "People differ in their ability to filter, process and absorb information, and people will be divided into ranks."}, {"start": 289.46, "end": 295.63, "text": "长此以往，人与人之间会出现一个可怕的分化，大家的差距会越来越大。", "en": "Over time, a terrible differentiation will appear between people, and everyone's gaps will grow larger and larger."}, {"start": 295.63, "end": 306.0, "text": "当然，我并不是说整天在网上研究赚钱、研究营销、研究人性的人就高人一等，而是说，这样的人赚钱可能稍微容易一些。", "en": "Of course, I am not saying that people who spend all day online studying money-making, marketing and human nature are superior; I am saying that such people may find it slightly easier to make money."}, {"start": 306.0, "end": 312.17, "text": "而那些整天刷小姐姐跳舞视频的人，他们的审美能力可能会有所提升。", "en": "And those who spend all day scrolling videos of pretty girls dancing may improve their aesthetic ability."}, {"start": 312.17, "end": 318.0, "text": "在传统媒体时代，有这样一种说法：你的注意力在哪里，成长就在哪里。", "en": "In the traditional media era, there was a saying: where your attention is, there your growth is."}, {"start": 318.0, "end": 330.72, "text": "但是在新媒体时代，这句话得改了：你的注意力在哪里，那么大数据就会持续给你推送什么，长期被这类信息投喂之后，你就会变成这种特定信息的奴隶。", "en": "But in the new media era, this saying must be changed: where your attention is, big data will keep pushing you that; after being fed such information for a long time, you will become a slave to that specific information."}, {"start": 330.72, "end": 341.93, "text": "物质层面，有句话叫“人如其食”，精神层面其实也是成立的：我们每天吃什么精神食粮，摄入什么特定的信息，那么我们就会变成什么样的人。", "en": "On the material level, there is a saying 'you are what you eat'; on the spiritual level it also holds: what spiritual food we eat every day, what specific information we take in, is what kind of person we will become."}, {"start": 341.93, "end": 348.84, "text": "每天关注赚钱信息的人，会越来越有钱；每天关注不赚钱信息的人，会越来越穷。", "en": "People who focus on money-making information every day will become richer and richer; people who focus on non-money-making information every day will become poorer and poorer."}, {"start": 348.84, "end": 350.28, "text": "逻辑非常简单。", "en": "The logic is very simple."}, {"start": 350.28, "end": 362.11, "text": "这就是为什么在20年前，每个人谈论的事情都差不多，甚至大家表情都是一样的，每天都是乐呵呵的，因为大家都是看同样的电视节目、听同样的收音机电台。", "en": "This is why 20 years ago, everyone talked about roughly the same things, and even everyone's expressions were the same, cheerful every day, because everyone watched the same TV programmes and listened to the same radio stations."}, {"start": 362.11, "end": 365.71, "text": "但是到了互联网时代，人和人之间的分化就越来越大。", "en": "But in the internet age, the differentiation between people has grown larger and larger."}, {"start": 365.71, "end": 376.51, "text": "同一间教室里的同学、同一个办公室里的同事，每个人的认知、思考能力、处理信息的能力差异巨大，那么将来大家的成就也是千差万别的。", "en": "Classmates in the same classroom and colleagues in the same office differ hugely in cognition, thinking ability and information-processing ability, so their future achievements will also vary enormously."}, {"start": 376.51, "end": 386.23, "text": "有的人数十年蜷缩在一个狭小的信息茧房里不肯出来，委顿不堪；而有的人却畅游在广阔的信息海洋里，非常自在。", "en": "Some people curl up for decades in a narrow information cocoon, unwilling to come out, dejected and worn; while others swim freely in the vast ocean of information, very much at ease."}, {"start": 386.23, "end": 396.5, "text": "那么问题来了，我们该如何刺穿信息茧房、让自己的大脑不受特定信息的禁锢，从而让自己的思维更加开阔、收入更加丰厚呢？", "en": "So the question is: how can we pierce the information cocoon, free our brains from the imprisonment of specific information, and thereby make our thinking broader and our income richer?"}, {"start": 396.5, "end": 402.7, "text": "我自己有6条经验跟大家分享，前3条免费阅读，后3条比较值钱，需要付费阅读：", "en": "I have 6 pieces of experience to share with you. The first 3 are free to read; the last 3 are more valuable and require paid reading:"}, {"start": 402.7, "end": 406.13, "text": "① 尝试从多种渠道获取信息", "en": "① Try to obtain information from multiple channels."}, {"start": 406.13, "end": 411.6, "text": "比如我刚才提到的收音机，几乎是这个时代唯一不受大数据操控的平台了。", "en": "For example, the radio I just mentioned is almost the only platform in this era not manipulated by big data."}, {"start": 411.6, "end": 418.32, "text": "我每天健身的时候都会听收音机，大家不要以为收音机是上个世纪的产物，早就过时了。", "en": "I listen to the radio every day when I work out. Do not think the radio is a product of the last century and long outdated."}, {"start": 418.32, "end": 424.2, "text": "错了，现在收音机的受众是年轻的有车一族，是中产。", "en": "Wrong: today's radio audience is young car owners — the middle class."}, {"start": 424.2, "end": 428.71, "text": "他们的品味、购买力都是中等偏上的。", "en": "Their taste and purchasing power are both above average."}, {"start": 428.71, "end": 431.78, "text": "你以为现在收音机里除了评书就是卖假药的吗？", "en": "Do you think today's radio has nothing but storytelling and fake-medicine ads?"}, {"start": 431.78, "end": 438.07, "text": "收音机节目质量并不低，至少在我看来，比刷短视频有意思多了，还省眼睛。", "en": "Radio programme quality is not low; at least in my view, it is much more interesting than scrolling short videos, and easier on the eyes."}, {"start": 438.07, "end": 444.91, "text": "比如昨天我听了一个节目，就是讲马斯克发家史的，今天听了一个节目，是讲新型互联网诈骗的案例。", "en": "For example, yesterday I listened to a programme about Musk's rise to fortune; today I listened to a programme about new internet fraud cases."}, {"start": 444.91, "end": 455.71, "text": "上午九点我也会听健康节目，大家不要以为是那种卖假药的砖家，现在的电台都有自己的公众号和抖音，如果他们敢请卖假药的砖家来做节目，会被骂死的。", "en": "At nine in the morning I also listen to health programmes. Do not think they are the kind of fake-medicine 'experts'; today's radio stations all have their own official accounts and Douyin — if they dared to invite fake-medicine 'experts' onto programmes, they would be scolded to death."}, {"start": 455.71, "end": 465.38, "text": "现在电台的健康节目，请的都是三甲医院的主任，而且大多数都是有留学背景的博士、博士后，讲的都是现代医学。", "en": "Today's radio health programmes invite directors from top-tier hospitals, most of whom are doctors and postdocs with overseas study backgrounds, talking about modern medicine."}, {"start": 465.38, "end": 473.18, "text": "比如，有一期就是讲“幽门螺杆菌”的，医生讲的内容，除了有自己的临床案例，还有柳叶刀杂志的最新报道。", "en": "For example, one episode was about 'Helicobacter pylori'. Besides the doctor's own clinical cases, the content also included the latest reports from The Lancet magazine."}, {"start": 473.18, "end": 475.94, "text": "② 没事多去逛图书馆、书店", "en": "② Take time to browse libraries and bookstores."}, {"start": 475.94, "end": 482.5, "text": "我每天都需要写东西，但是我的脑子里也没有多少存货，所以我也需要“站在巨人的肩膀上”。", "en": "I need to write every day, but my mind does not have much stock either, so I also need to 'stand on the shoulders of giants'."}, {"start": 482.5, "end": 488.09, "text": "所以，我偶尔就会去大型图书馆或者书店乱逛，而且每次都是收获巨大。", "en": "So I occasionally wander around large libraries or bookstores, and each time the harvest is huge."}, {"start": 488.09, "end": 493.92, "text": "我之所以用“乱逛”这个词，因为这件事有很大的随机性，不受大数据约束。", "en": "The reason I use the word 'wander' is that this has great randomness and is not constrained by big data."}, {"start": 493.92, "end": 503.81, "text": "我撞到一本书就会随手翻翻，而且基本上在5分钟内我就能确定这本书讲的是什么内容，15分钟内我就能把这本书的精华给提取出来了。", "en": "When I bump into a book, I flip through it casually, and basically within 5 minutes I can determine what the book is about, and within 15 minutes I can extract the essence of the book."}, {"start": 503.81, "end": 519.96, "text": "更绝的是，我能把这些精华直接转化成钱（至少500元），具体的做法就是：用手机记录下大概内容（100字之内），回家就直接结合自己的经历，写成了一篇付费阅读文章。", "en": "Even better, I can directly convert these essences into money (at least 500 yuan). The specific method is: use my phone to record the general content (within 100 words), go home and directly combine it with my own experience to write a paid-reading article."}, {"start": 519.96, "end": 528.05, "text": "所以，每当有人让我推荐书籍是，我都回答说：读书没用，我已经很久不读书了，但是我经常“乱翻书”。", "en": "So whenever someone asks me to recommend books, I answer: reading is useless; I have not read books for a long time, but I often 'randomly flip through books'."}, {"start": 528.05, "end": 538.32, "text": "另外，大家不要以为我看点书就直接用来卖钱太庸俗，要知道，知识和思维，如果你不能“为我所用”，那就不算是我的。", "en": "Also, do not think it is vulgar that I read a bit and directly use it to sell money. You should know: knowledge and thinking, if you cannot 'use them for yourself', do not count as yours."}, {"start": 538.32, "end": 542.45, "text": "所以，逛书店绝对是刺破信息茧房的利器。", "en": "So browsing bookstores is definitely a sharp tool for piercing the information cocoon."}, {"start": 542.45, "end": 544.18, "text": "③ 多旅行", "en": "③ Travel more."}, {"start": 544.18, "end": 550.13, "text": "我之前说过一个比较玄的观点：人的地理空间打开了，心理空间才能打开。", "en": "I have previously stated a rather mystical view: only when a person's geographical space opens up can their psychological space open up."}, {"start": 550.13, "end": 551.21, "text": "什么意思？", "en": "What does that mean?"}, {"start": 551.21, "end": 555.24, "text": "就是说，行万里路比读万卷书还重要。", "en": "It means travelling ten thousand miles is more important than reading ten thousand books."}, {"start": 555.24, "end": 566.21, "text": "举个例子，之前很多媒体带节奏黑韩国（区别对待），最近又开始黑泰国（嘎腰子），黑美国动物园（虐待熊猫）。", "en": "For example, previously many media hyped up smearing South Korea (differential treatment), and recently started smearing Thailand (kidney harvesting) and American zoos (abusing pandas)."}, {"start": 566.21, "end": 567.46, "text": "真实情况呢？", "en": "What is the real situation?"}, {"start": 567.46, "end": 581.42, "text": "我不好在公众号里说，你想要了解真实情况，只有一种办法：去当地出入境管理局申请护照，然后分别申请韩国、泰国、美国的签证，然后买机票飞过去，亲自考察。", "en": "I cannot say it well on my official account. If you want to understand the real situation, there is only one way: go to the local entry-exit administration to apply for a passport, then apply for visas for South Korea, Thailand and the United States respectively, buy plane tickets and fly there to investigate in person."}, {"start": 581.42, "end": 588.62, "text": "有人会说，看网上的报道不就行了吗，如果不相信新闻的报道，去关注那些在外国的主播也行啊。", "en": "Some people will say: isn't it enough to read online reports? If you do not believe news reports, you can follow streamers abroad."}, {"start": 588.62, "end": 591.38, "text": "我想说，错了，不行。", "en": "I want to say: wrong, no."}, {"start": 591.38, "end": 599.86, "text": "任何一个媒体、一个个人，都是有偏向性的，即使是你亲爹在国外生活，他说的话你也不要相信。", "en": "Any media or individual has biases; even if your own father lives abroad, do not believe what he says."}, {"start": 599.86, "end": 603.58, "text": "想要了解真实情况，必须你亲自把肉身挪过去。", "en": "To understand the real situation, you must personally move your body there."}, {"start": 603.58, "end": 605.26, "text": "没有第二种办法。", "en": "There is no second way."}, {"start": 605.26, "end": 608.3, "text": "点此继续阅读剩余部分", "en": "Click here to continue reading the remaining part."}]}, {"title": "怎样避免活在信息茧房之中？ Part 11（70句，6:33）", "mp3": "upload-8-part11/audio.mp3", "dur": "6:33", "lines": [{"start": 0.0, "end": 10.13, "text": "信息茧房这个概念有一个默认的前提，即一个人只要能够获取更多的信息，就自然不会被茧房所束缚，可以看到更真实的世界。", "en": "The concept of the information cocoon has a default premise: that as long as a person can obtain more information, they will naturally not be bound by the cocoon and can see a more real world."}, {"start": 10.13, "end": 11.88, "text": "但这个假设真的成立吗？", "en": "But does this assumption really hold?"}, {"start": 11.88, "end": 26.83, "text": "你让一个小学生去听一场当前最高水平的人工智能技术的发布会，他的确接触到了最高质量的信息，但是这对他来说没什么用，因为以他目前的知识水平，他完全听不懂。", "en": "If you let a primary school pupil listen to a launch event for the current highest-level artificial intelligence technology, they will indeed be exposed to the highest-quality information, but it will be of little use to them, because at their current level of knowledge, they cannot understand it at all."}, {"start": 26.83, "end": 31.15, "text": "而换成一个这个领域的博士或者教授，他们就可以听懂。", "en": "But swap in a doctor or professor in this field, and they can understand it."}, {"start": 31.15, "end": 33.72, "text": "对于他们来说，这就是有用的信息增量。", "en": "For them, this is useful information increment."}, {"start": 33.72, "end": 40.25, "text": "显然，信息的价值从来不取决于信息本身的质量，而取决于接收者的认知框架能否承载它。", "en": "Clearly, the value of information never depends on the quality of the information itself, but on whether the receiver's cognitive framework can carry it."}, {"start": 40.25, "end": 48.82, "text": "心理学中有“图式“的概念，它就是人脑中预先存在的认知框架，决定了人如何筛选、编码和理解新信息。", "en": "Psychology has the concept of 'schema': the pre-existing cognitive framework in the human brain that determines how people filter, encode and understand new information."}, {"start": 48.82, "end": 59.09, "text": "当外部信息进入大脑时，图式就像一个过滤器——符合框架的，被吸收；不符合框架的，要么被忽略，要么被曲解，要么直接等于不存在。", "en": "When external information enters the brain, the schema acts like a filter — what fits the framework is absorbed; what does not fit is either ignored, distorted, or simply treated as non-existent."}, {"start": 59.09, "end": 66.6, "text": "所以，当小学生坐在AI发布会现场时，那些技术演讲对他来说，就等于不存在。", "en": "So when the primary school pupil sits at the AI launch event, those technical speeches are, for them, equivalent to non-existent."}, {"start": 66.6, "end": 71.16, "text": "因为他的认知框架里没有相应的概念，无法理解、编码这些信息。", "en": "Because there are no corresponding concepts in their cognitive framework, they cannot understand or encode this information."}, {"start": 71.16, "end": 79.08, "text": "同样的信息，对博士来说，却是有价值的增量，因为他的图式已经准备好了接收和处理的容器。", "en": "The same information, for the doctor, is a valuable increment, because their schema already has containers prepared to receive and process it."}, {"start": 79.08, "end": 81.89, "text": "这个道理放得更远一点，也同样成立。", "en": "This principle holds even further afield."}, {"start": 81.89, "end": 92.62, "text": "理论上，一个从未去过美国的中国经济学家对美国经济的了解程度，要远远超过在美国生活了几十年却对经济学知识不甚了解的美国土著。", "en": "In theory, a Chinese economist who has never been to America understands the American economy far better than an American native who has lived in America for decades but knows little about economics."}, {"start": 92.62, "end": 103.46, "text": "因为前者有经济学的认知框架，能把零散的现象系统化地理解；后者虽然身处其中，但缺乏框架，看到的只是现象，而非规律。", "en": "Because the former has an economics cognitive framework and can systematically understand scattered phenomena; the latter, though immersed in it, lacks a framework and sees only phenomena, not patterns."}, {"start": 103.46, "end": 109.99, "text": "认知框架先于信息接触存在，这才是信息茧房的真正本质。", "en": "That the cognitive framework exists prior to information contact is the true essence of the information cocoon."}, {"start": 109.99, "end": 116.35, "text": "现实中信息茧房的普遍性正在于人总是会优先接受那些自己认同的信息。", "en": "The universality of the information cocoon in reality lies precisely in that people always prioritise accepting information they agree with."}, {"start": 116.35, "end": 126.98, "text": "比如你是一个明星的铁粉，那么当这个明星的黑料爆出的时候，你可能首先想的不是他是不是隐瞒了什么，而是这肯定是哪个对家挖的坑。", "en": "For example, if you are a die-hard fan of a celebrity, when dirt about this celebrity breaks, your first thought may not be whether they hid something, but that this must be a trap dug by some rival camp."}, {"start": 126.98, "end": 131.35, "text": "这是因为你的认知框架已经把你锁在了一个特定的解释系统里。", "en": "This is because your cognitive framework has already locked you into a specific explanatory system."}, {"start": 131.35, "end": 135.6, "text": "传播学中还有个名词描述这种现象——回声壁效应。", "en": "Communication studies has another term to describe this phenomenon — the echo chamber effect."}, {"start": 135.6, "end": 144.89, "text": "也就是说，人们倾向于接触那些符合自己既有观点的信息，从而在一个封闭的认知环境里不断强化自己的信念。", "en": "That is, people tend to access information that matches their existing views, thereby continuously reinforcing their beliefs in a closed cognitive environment."}, {"start": 144.89, "end": 154.25, "text": "算法推荐机制只是放大了这种倾向，但根源在于人本身的选择性——人从来都不是被动的信息接收者，而是主动的信息筛选者。", "en": "Algorithmic recommendation merely amplifies this tendency, but the root lies in human selectivity itself — humans have never been passive information receivers, but active information filters."}, {"start": 154.25, "end": 158.74, "text": "这就是为什么单纯获取更多信息无法打破信息茧房的原因。", "en": "This is why simply obtaining more information cannot break the information cocoon."}, {"start": 158.74, "end": 163.85, "text": "如果你的框架不变，那么再多信息，也只是在你既有的茧房里打转。", "en": "If your framework does not change, then no matter how much information you have, it only circles within your existing cocoon."}, {"start": 163.85, "end": 169.66, "text": "事实上，一个更反直觉的现象是，信息越丰富，人越容易困在茧房里。", "en": "In fact, a more counterintuitive phenomenon is that the richer the information, the easier it is for people to be trapped in the cocoon."}, {"start": 169.66, "end": 174.34, "text": "这不是因为信息少了，而是因为认知框架筛选的能力更强了。", "en": "This is not because there is less information, but because the cognitive framework's ability to filter is stronger."}, {"start": 174.34, "end": 182.14, "text": "当你可以轻易找到海量支持你观点的内容时，你的认知框架会更自信地排除那些异质信息。", "en": "When you can easily find massive amounts of content supporting your views, your cognitive framework will more confidently exclude heterogeneous information."}, {"start": 182.14, "end": 186.98, "text": "你看到的世界，其实是你认知框架筛选后的投影。", "en": "The world you see is actually a projection filtered by your cognitive framework."}, {"start": 186.98, "end": 190.22, "text": "破茧的关键在于拓展认知框架本身。", "en": "The key to breaking out of the cocoon lies in expanding the cognitive framework itself."}, {"start": 190.22, "end": 191.38, "text": "具体怎么做？", "en": "How, specifically?"}, {"start": 191.38, "end": 193.06, "text": "可以从三个层面入手。", "en": "You can start from three levels."}, {"start": 193.06, "end": 197.18, "text": "第一个层面：从信息搜寻转向框架审视。", "en": "The first level: shift from information seeking to framework examination."}, {"start": 197.18, "end": 207.38, "text": "大多数人打破信息茧房的方式是多看不同观点——看左派媒体，也看右派媒体；看支持者的评论，也看反对者的评论。", "en": "Most people's way of breaking the information cocoon is to look at different views — reading left-wing media as well as right-wing media; reading supporters' comments as well as opponents' comments."}, {"start": 207.38, "end": 210.46, "text": "这种方式听起来很合理，但往往效果有限。", "en": "This approach sounds reasonable, but its effect is often limited."}, {"start": 210.46, "end": 219.22, "text": "因为如果你的认知框架足够强大，你会发现：你可以从两边都找到支持自己观点的证据，然后更加确信自己是对的。", "en": "Because if your cognitive framework is strong enough, you will find that you can find evidence supporting your own views from both sides, and then become even more convinced that you are right."}, {"start": 219.22, "end": 222.98, "text": "更有效的方式是：定期检视自己的底层假设。", "en": "A more effective way is: regularly examine your own underlying assumptions."}, {"start": 222.98, "end": 226.99, "text": "问自己一些元认知的问题：我为什么会这样想？", "en": "Ask yourself some metacognitive questions: Why do I think this way?"}, {"start": 226.99, "end": 228.84, "text": "这个观点的依据是什么？", "en": "What is the basis for this view?"}, {"start": 228.84, "end": 230.93, "text": "如果我错了，可能是因为什么？", "en": "If I am wrong, what might it be because of?"}, {"start": 230.93, "end": 238.06, "text": "这不是在让你怀疑一切，而是在让你意识到：自己的认知框架本身是需要被审视的。", "en": "This is not asking you to doubt everything, but to make you realise that your own cognitive framework itself needs to be examined."}, {"start": 238.06, "end": 245.5, "text": "当你能把自己的认知框架当作一个对象来观察时，你就已经走出了茧房的第一步。", "en": "When you can treat your own cognitive framework as an object to observe, you have already taken the first step out of the cocoon."}, {"start": 245.5, "end": 248.38, "text": "第二个层面：建立认知弹性。", "en": "The second level: build cognitive flexibility."}, {"start": 248.38, "end": 252.94, "text": "认知弹性，指的是认知框架容纳异质信息的能力。", "en": "Cognitive flexibility refers to the ability of a cognitive framework to accommodate heterogeneous information."}, {"start": 252.94, "end": 258.5, "text": "一个有认知弹性的人，不是没有自己的观点，而是愿意让自己的观点接触挑战。", "en": "A person with cognitive flexibility does not lack their own views, but is willing to let their views encounter challenges."}, {"start": 258.5, "end": 265.03, "text": "刻意接触那些让认知不适的信息，不是为了接受它，而是为了测试自己的框架边界。", "en": "Deliberately exposing yourself to information that causes cognitive discomfort is not about accepting it, but about testing the boundaries of your framework."}, {"start": 265.03, "end": 269.64, "text": "就像给一根绳子拉一拉，看看它还能承受多大的张力。", "en": "It is like pulling on a rope to see how much tension it can still bear."}, {"start": 269.64, "end": 275.04, "text": "如果一碰就断，说明框架太脆弱；如果能承受拉扯，说明框架有一定的弹性。", "en": "If it breaks at a touch, the framework is too fragile; if it can withstand the pulling, the framework has some flexibility."}, {"start": 275.04, "end": 279.17, "text": "需要注意的是，这里的关键不是接受，而是接触。", "en": "What needs attention here is that the key is not acceptance, but exposure."}, {"start": 279.17, "end": 287.45, "text": "你可以听完一个完全不同立场的观点，然后依然坚持自己的判断，但这个过程中，你的认知框架已经被锻炼了一次。", "en": "You can listen to a view from a completely different position, and still insist on your own judgment, but in this process, your cognitive framework has already been exercised once."}, {"start": 287.45, "end": 289.66, "text": "它变得更坚韧，也更开放。", "en": "It becomes more resilient, and also more open."}, {"start": 289.66, "end": 293.14, "text": "第三个层面：培养元认知能力。", "en": "The third level: cultivate metacognitive ability."}, {"start": 293.14, "end": 296.02, "text": "元认知，简单说就是对思考的思考。", "en": "Metacognition, simply put, is thinking about thinking."}, {"start": 296.02, "end": 300.38, "text": "观察自己如何观察世界，识别我为什么会这样想。", "en": "Observing how you observe the world, and identifying why you think the way you do."}, {"start": 300.38, "end": 302.35, "text": "这是一个可以训练的能力。", "en": "This is an ability that can be trained."}, {"start": 302.35, "end": 308.78, "text": "比如，当你对某条新闻产生强烈反应时，暂停一下，问自己：我为什么这么激动？", "en": "For example, when you have a strong reaction to a piece of news, pause and ask yourself: Why am I so excited?"}, {"start": 308.78, "end": 310.9, "text": "这个话题触动了我什么？", "en": "What has this topic touched in me?"}, {"start": 310.9, "end": 313.25, "text": "我的情绪是不是在影响我的判断？", "en": "Are my emotions affecting my judgment?"}, {"start": 313.25, "end": 319.18, "text": "再比如，当你发现自己总是在回避某种类型的信息时，问自己：我在怕什么？", "en": "For another example, when you find yourself always avoiding a certain type of information, ask yourself: What am I afraid of?"}, {"start": 319.18, "end": 321.34, "text": "这些信息会挑战我的什么信念？", "en": "What beliefs of mine would this information challenge?"}, {"start": 321.34, "end": 331.18, "text": "元认知能力不是天生的，但一旦你开始有意识地培养这种能力，你会发现自己对自己的认知过程有了更多的掌控感。", "en": "Metacognitive ability is not innate, but once you consciously start cultivating it, you will find you have more sense of control over your own cognitive process."}, {"start": 331.18, "end": 336.82, "text": "你不是被情绪和直觉推着走，而是能站在更高处，观察自己的思维活动。", "en": "You are not pushed along by emotions and intuition, but can stand higher and observe your own mental activities."}, {"start": 336.82, "end": 343.18, "text": "说到底，真正的自由不是逃离茧房，而是拥有不被单一认知框架囚禁的能力。", "en": "In the end, true freedom is not escaping the cocoon, but possessing the ability not to be imprisoned by a single cognitive framework."}, {"start": 343.18, "end": 345.7, "text": "这个世界上不存在没有框架的人。", "en": "There is no person in this world without a framework."}, {"start": 345.7, "end": 351.14, "text": "我们每个人，都必须依赖某种认知框架来理解和行动。", "en": "Each of us must rely on some cognitive framework to understand and act."}, {"start": 351.14, "end": 358.27, "text": "问题不在于有没有框架，而在于这个框架是封闭的、刚性的，还是开放的、可成长的。", "en": "The question is not whether there is a framework, but whether the framework is closed and rigid, or open and capable of growth."}, {"start": 358.27, "end": 363.31, "text": "拓展认知框架的过程，本质上是一个不断与自己对话的过程。", "en": "The process of expanding the cognitive framework is essentially a process of constantly dialoguing with yourself."}, {"start": 363.31, "end": 370.75, "text": "你需要承认自己认知的局限，接受自己的框架需要升级，然后在这个过程中，让自己的世界一点点变大。", "en": "You need to acknowledge the limitations of your cognition, accept that your framework needs upgrading, and in this process, let your world grow a little bigger."}, {"start": 370.75, "end": 372.55, "text": "这不是一个轻松的过程。", "en": "This is not an easy process."}, {"start": 372.55, "end": 377.42, "text": "承认自己的认知可能有偏差，比坚持自己没错要难得多。", "en": "Admitting that your cognition may be biased is much harder than insisting that you are right."}, {"start": 377.42, "end": 383.71, "text": "接受一个与自己长期信念不符的观点，比找到支持自己的证据要让人不适得多。", "en": "Accepting a view inconsistent with your long-held beliefs is much more uncomfortable than finding evidence supporting yourself."}, {"start": 383.71, "end": 393.55, "text": "只有当你愿意不断拓展这个边界时，才真正活在一个开放的世界里，而不是一个由自己的认知框架精心编织的茧房里。", "en": "Only when you are willing to continuously expand this boundary do you truly live in an open world, rather than in a cocoon carefully woven by your own cognitive framework."}]}, {"title": "怎样避免活在信息茧房之中？ Part 12（71句，7:47）", "mp3": "upload-8-part12/audio.mp3", "dur": "7:47", "lines": [{"start": 0.0, "end": 9.48, "text": "比如说，研究中国历史，无论哪个时期，都一定要参考外国史料，外国人的游记，回忆录等等，才能得到正确信息。", "en": "For example, when studying Chinese history, no matter which period, you must consult foreign historical materials, foreigners' travel notes, memoirs and so on, in order to obtain correct information."}, {"start": 9.48, "end": 14.16, "text": "如果你只看官史，正史，那就是活在信息茧房里。", "en": "If you only read official histories and orthodox histories, you are living in an information cocoon."}, {"start": 14.16, "end": 15.07, "text": "谢邀。", "en": "Thanks for the invitation."}, {"start": 15.07, "end": 26.3, "text": "首先意识到自己在信息茧房中，是一件好事，我曾陷入信息茧房一段时间，那时候觉得整个人都魔怔了，感觉没有了自己的主见。", "en": "First realising that you are in an information cocoon is a good thing. I was once trapped in an information cocoon for a while; at that time I felt the whole person had become obsessed, feeling I had lost my own opinions."}, {"start": 26.3, "end": 30.5, "text": "摆脱信息茧房，第一件要做的事情就是不看推荐内容。", "en": "The first thing to do to escape the information cocoon is to stop watching recommended content."}, {"start": 30.5, "end": 36.19, "text": "包括知乎的推荐，B站的首页推荐，以及其他有算法推荐的内容。", "en": "Including Zhihu recommendations, Bilibili homepage recommendations, and other algorithm-recommended content."}, {"start": 36.19, "end": 40.15, "text": "如果觉得知乎的热榜不够看，就关注一些优秀回答者：", "en": "If you find Zhihu's hot list insufficient, follow some excellent answerers:"}, {"start": 40.15, "end": 48.79, "text": "第二件事，就是找到自己兴趣的方向，这个方向的问题是可以给你带来正向情绪的，而不是越看越难受的。", "en": "The second thing is to find a direction of interest for yourself — a direction whose questions can bring you positive emotions, rather than making you feel worse the more you read."}, {"start": 48.79, "end": 53.66, "text": "多搜索这样的内容，在有价值的回答下面点赞和评论。", "en": "Search more for such content, and like and comment under valuable answers."}, {"start": 53.66, "end": 61.34, "text": "然后回头再看一眼推荐，就会发现推荐的内容有所改变，这样可以利用算法推荐为你提供对你有效的内容", "en": "Then look back at recommendations, and you will find the recommended content has changed; this way you can use algorithmic recommendations to provide you with content that is effective for you."}, {"start": 61.34, "end": 69.94, "text": "第三件事，多与朋友讨论一些问题，问问他们的看法，不同行业的人会对一些问题有不一样的观点，说不定让你耳目一新", "en": "The third thing is to discuss some issues with friends more, and ask their opinions. People from different industries will have different views on some issues, which may refresh you."}, {"start": 69.94, "end": 83.86, "text": "第四件事，永远保持开放的状态，接纳不同的信息与观点，通过自己的知识体系进行分析，最好能够将这些分析思考的过程写下来，回头再翻看这些思考过程，说不定可以让自己温故而知新。", "en": "The fourth thing is to always stay open, accept different information and views, analyse them through your own knowledge system, and preferably write down the process of analysis and thinking. Looking back at these thinking processes later may let you review the old and learn the new."}, {"start": 83.86, "end": 85.66, "text": "多看英文信息。", "en": "Read more English information."}, {"start": 85.66, "end": 91.78, "text": "世界网路上的信息百分之五十五是英语；百分之一点四是汉语。", "en": "55% of information on the world's internet is in English; 1.4% is in Chinese."}, {"start": 91.78, "end": 94.9, "text": "波兰语在网路世界都比汉语通用。", "en": "Even Polish is more widely used on the internet than Chinese."}, {"start": 94.9, "end": 103.25, "text": "不见得能读英语说英语的人就不活在信息茧房，但是假如你只会说中文读中文，你一定活在信息茧房，这个毋庸置疑。", "en": "It is not necessarily true that people who can read and speak English do not live in an information cocoon, but if you can only speak and read Chinese, you definitely live in an information cocoon — of that there is no doubt."}, {"start": 103.25, "end": 111.29, "text": "顺便说个题外话，你还真别小看俄罗斯，俄罗斯虽然被西方国家搞成这副德行，俄语还是网路第三大语言。", "en": "By the way, do not underestimate Russia. Although Russia has been made into this state by Western countries, Russian is still the third largest language on the internet."}, {"start": 111.29, "end": 117.05, "text": "而且俄罗斯文学与政治宣传一向对西方世界有强大的影响力。", "en": "Moreover, Russian literature and political propaganda have always had a powerful influence on the Western world."}, {"start": 117.05, "end": 127.56, "text": "以前我在RT上看过俄罗斯记者说“东方大国是经济的巨人，政治的侏儒，而俄罗斯是经济的侏儒，政治的巨人”这个评价基本上没错。", "en": "I once saw a Russian journalist on RT say: 'The Eastern great power is an economic giant and a political dwarf, while Russia is an economic dwarf and a political giant.' This assessment is basically correct."}, {"start": 127.56, "end": 130.13, "text": "办法自然是直白且粗陋的。", "en": "The method is naturally straightforward and crude."}, {"start": 130.13, "end": 133.2, "text": "因为大道至简，你就给我直接退出。", "en": "Because the great way is simple: just log out directly."}, {"start": 133.2, "end": 138.96, "text": "就拿知乎来说，作为这两年的重度用户，为了不让自己深陷信息糖果的漩涡。", "en": "Take Zhihu, for example. As a heavy user these past two years, in order not to sink deep into the vortex of information candy."}, {"start": 138.96, "end": 141.67, "text": "我刷知乎的时候，都是未登录状态。", "en": "When I browse Zhihu, I am always logged out."}, {"start": 141.67, "end": 144.14, "text": "我直接退出账号，我就是个游客。", "en": "I log out of my account directly; I am just a visitor."}, {"start": 144.14, "end": 150.38, "text": "所以，在情感类话题上，我既可以看到男人的想法，我也可以看到女性的想法；", "en": "So, on emotional topics, I can see both men's thoughts and women's thoughts;"}, {"start": 150.38, "end": 158.38, "text": "在政治上，我既可以看到左，也可以看到右，还可以看到绝大多数不明就里的纯扯蛋；", "en": "On politics, I can see the left, the right, and also the vast majority who have no idea what is going on and are just talking nonsense;"}, {"start": 158.38, "end": 166.97, "text": "在时事上，我既可以看到冷静的分析，也可以看到幼稚的自以为是，更多的是绝望的抖机灵；", "en": "On current affairs, I can see calm analysis, naive self-righteousness, and even more hopeless attempts at wit;"}, {"start": 166.97, "end": 177.22, "text": "在文化上，我既可以看到专注于某个领域的痴人，也可以看到招摇撞骗的竖子，更多的是学艺三分却自诩专家的自信之人；", "en": "On culture, I can see obsessives focused on a particular field, swindling scoundrels, and even more people who learned a third of a skill yet call themselves experts with confidence;"}, {"start": 177.22, "end": 185.98, "text": "科教文卫，地域差异，民族认同，历史探究等诸多领域，差不多什么都能见识一下。", "en": "In education, science, culture, health, regional differences, national identity, historical inquiry and many other fields, I can see roughly everything."}, {"start": 185.98, "end": 195.14, "text": "这就很好，你甚至可以看到千篇一律的知乎体小说居然也有不那么千篇一律的家伙在坚持写着无人问津的文字。", "en": "This is very good. You can even see that among the cookie-cutter Zhihu-style novels, there are some not-so-cookie-cutter people persisting in writing words no one reads."}, {"start": 195.14, "end": 198.74, "text": "甚至，你还能找到严肃文学的影子…", "en": "You can even find traces of serious literature…"}, {"start": 198.74, "end": 205.15, "text": "抖音亦然，因为我只有这两款社交软件，所以分享也就局限于此。", "en": "Douyin is the same. Because I only have these two social apps, my sharing is limited to them."}, {"start": 205.15, "end": 213.31, "text": "抖音你只要是游客，你看到的海量低质量视频，会大大缩减你使用它的时间，这是哥秘不示人的绝招。", "en": "On Douyin, as long as you are a visitor, the massive low-quality videos you see will greatly reduce the time you spend using it. This is my secret trick that I do not share."}, {"start": 213.31, "end": 222.86, "text": "人的意志力是有上限的，人抵抗诱惑的能力着实差到一言难尽，这都是真实存在的客观现实。", "en": "Human willpower has an upper limit, and human ability to resist temptation is truly too poor to describe — these are real, objective facts."}, {"start": 222.86, "end": 230.86, "text": "所以，本质上，如果你一直以一个登录的状态去刷抖音，那么你看到的，一定是迎合你喜好的玩意，无穷无尽。", "en": "So, essentially, if you keep scrolling Douyin while logged in, what you see must be things catering to your preferences, endless."}, {"start": 230.86, "end": 234.94, "text": "然而信息茧房的本质，是明为迎合，实则控制。", "en": "However, the essence of the information cocoon is that it appears to cater, but actually controls."}, {"start": 234.94, "end": 239.45, "text": "它是要控制你的，禁锢你思想的发育，压缩你思考的时间。", "en": "It wants to control you, imprison the development of your thought, and compress the time you spend thinking."}, {"start": 239.45, "end": 248.98, "text": "只要开心，只要爽，你不停地接受着一个虚拟的爽世界，最终就变成了一个现实生活安分守己且毫无生气的人。", "en": "As long as you are happy, as long as you feel good, you keep accepting a virtual world of pleasure, and eventually become a person who is well-behaved and lifeless in real life."}, {"start": 248.98, "end": 256.9, "text": "麻木不仁的面对生活，愚蠢迟钝的面对人生，然后把对生活的休养生息全部寄希望于手机。", "en": "Facing life numbly, facing life stupidly and slowly, and then pinning all your hopes for rest and recuperation in life on your phone."}, {"start": 256.9, "end": 263.81, "text": "躺在那里，用手机里的海量信息来麻痹自己的感官，说白了吧，就是精神吸毒。", "en": "Lying there, using the massive information on your phone to numb your senses. To put it bluntly, it is spiritual drug use."}, {"start": 263.81, "end": 270.53, "text": "日复一日看不到头，无穷尽也，绝望叩问，却不知叩问谁…", "en": "Day after day with no end in sight, endless, hopeless questioning, yet not knowing whom to question…"}, {"start": 270.53, "end": 276.41, "text": "这就是精神被禁锢的底层逻辑，这才是现代人最真实的悲哀与不幸。", "en": "This is the underlying logic of the spirit being imprisoned, and this is the truest sorrow and misfortune of modern people."}, {"start": 276.41, "end": 282.65, "text": "所以，当你能认识到这个问题的时候，你就要知道了，什么才是我们来人间一回的目的。", "en": "So, when you can recognise this problem, you should know what the purpose of our one trip to this human world is."}, {"start": 282.65, "end": 284.14, "text": "是为了体验吗？", "en": "Is it for experience?"}, {"start": 284.14, "end": 286.25, "text": "是，但不全是。", "en": "Yes, but not entirely."}, {"start": 286.25, "end": 300.22, "text": "我们体验只是肤浅的身体肌肤，感官器官综合起来的肤浅体会，你看到的，你听到的，你摸到的，你走过的，都是一种基于身体本能感知感受到的表象。", "en": "Our experience is only the superficial experience of the body's skin and sensory organs combined. What you see, hear, touch and walk past are all appearances perceived based on the body's instinctive perception."}, {"start": 300.22, "end": 305.38, "text": "我们的体验之后，应是尽可能的触碰这个人间真实的内在。", "en": "After our experience, we should try as much as possible to touch the true inner nature of this human world."}, {"start": 305.38, "end": 312.38, "text": "你想触碰的前提，就是你接触到的信息是真实的，可靠的，不带有任何主观色彩的。", "en": "The prerequisite for you to touch it is that the information you come into contact with is real, reliable, and without any subjective colouring."}, {"start": 312.38, "end": 317.35, "text": "所以，触碰才是真实的体验，才是升华，才是无比真实的快乐。", "en": "So, touching is real experience, sublimation, and incomparably real happiness."}, {"start": 317.35, "end": 318.5, "text": "你比如大腚。", "en": "Take big butts, for example."}, {"start": 318.5, "end": 328.03, "text": "大腚的观感是极佳的，触感是柔软的，但是如果你只是在手机看一个又一个大腚，那抖音自然是明白你的底色，大腚喜好者。", "en": "A big butt looks excellent and feels soft, but if you only watch one big butt after another on your phone, Douyin will naturally understand your true nature: a big-butt lover."}, {"start": 328.03, "end": 339.98, "text": "所以它的算法就给你一直推五湖四海的大腚，你看过一个大腚过后兴致盎然，你看过十个大腚以后眼光开始挑剔，觉得某些大腚并不符合审美，过于大腚，甚至是虚假的大腚，你都能看见臀垫。", "en": "So its algorithm keeps pushing you big butts from all over the world. After watching one big butt you are in high spirits; after watching ten big butts your taste starts to become picky, feeling that some big butts do not meet aesthetic standards, are too big-butt, or even fake big butts — you can even see the butt pads."}, {"start": 339.98, "end": 350.14, "text": "当你赏析过百个大腚以后，一个小时就过去了，然而，你并没有过瘾，你没有心满意足，你反而更加焦虑，口渴，不得尽兴。", "en": "After appreciating a hundred big butts, an hour has passed. Yet you are not satisfied, you are not content; instead you are more anxious, thirsty, and not fully satisfied."}, {"start": 350.14, "end": 357.17, "text": "于是你产生了一个不自知的潜意识，只要看更多的大腚，你一定会有心满意足的时刻。", "en": "Then you develop an unconscious subconscious: as long as you watch more big butts, you will definitely have a satisfying moment."}, {"start": 357.17, "end": 359.21, "text": "错了，兄弟，真的错了。", "en": "Wrong, brother, really wrong."}, {"start": 359.21, "end": 372.48, "text": "你即便花一天的时间看了天南地北上千个大腚，你依然不会满足，你只会疲累，直到累得眼眶雀青，手指僵化，动一下翻个身都费劲的时候，你才会恋恋不舍的放下手机。", "en": "Even if you spend a whole day watching thousands of big butts from all over the country, you still will not be satisfied; you will only be tired, until your eye sockets are dark, your fingers stiff, and even turning over in bed takes effort — only then will you reluctantly put down your phone."}, {"start": 372.48, "end": 379.56, "text": "这个时候，抖音得到了日活人数，大腚们得到了关注流量，你，得到了什么？", "en": "At this point, Douyin has gained daily active users, the big butts have gained attention and traffic, and you — what have you gained?"}, {"start": 379.56, "end": 382.49, "text": "所以，正确的做法是什么？", "en": "So, what is the correct approach?"}, {"start": 382.49, "end": 384.0, "text": "你再也不看大腚？", "en": "Never watch big butts again?"}, {"start": 384.0, "end": 397.27, "text": "不对，你可以看，但是你不能只在网上看，你要走出去看现实的大腚，继而想办法触碰真实的大腚，继而实现对大腚这一执念的完美闭环，这就是触碰人间真实的意义。", "en": "No: you can watch, but you cannot only watch online. You must go out and see real big butts, and then find a way to touch real big butts, thereby achieving a perfect closed loop of this obsession with big butts. This is the meaning of touching the reality of the human world."}, {"start": 397.27, "end": 399.24, "text": "这才是真的来过人间。", "en": "This is what it means to have truly been in this world."}, {"start": 399.24, "end": 401.28, "text": "你看过，不算来过。", "en": "Having seen it does not count as having been here."}, {"start": 401.28, "end": 405.77, "text": "哥，只是举了一个最浅薄的例子，方便读者理解。", "en": "I am just giving the most shallow example, to make it easier for readers to understand."}, {"start": 405.77, "end": 409.08, "text": "要么说关注哥的兄弟们年龄跨度那么大呢…", "en": "No wonder the brothers who follow me span such a wide age range…"}, {"start": 409.08, "end": 412.03, "text": "十几岁的也有，八九十岁的老叔也有…", "en": "There are teenagers, and there are old uncles in their eighties and nineties…"}, {"start": 412.03, "end": 414.36, "text": "棍哥的文字，老少咸宜。", "en": "Gun Ge's writing suits all ages."}, {"start": 414.36, "end": 421.56, "text": "信息过载着实是没必要的，你没有必要关注那么多的博主，你关注那么几十个真有料的就行，比如棍哥这样的。", "en": "Information overload is really unnecessary. You do not need to follow so many bloggers; just follow a few dozen who truly have substance, like Gun Ge here."}, {"start": 421.56, "end": 439.85, "text": "就这样吧，你们可以试试棍哥的方法，先试试抖音，当你是一个都市白领，你的抖音却开始给你推送上一个养鸭子如何赶鸭，下一个广场舞劲爆金曲，再下一个是手搓缝纫机，再再下一个是佛光普照，刷到的都是有缘人的时候…", "en": "That is all. You can try Gun Ge's method: first try Douyin. When you are an urban white-collar worker, but your Douyin starts pushing you, one after another, how to herd ducks as a duck farmer, then explosive square-dance hits, then hand-sewing machines, then Buddha's light shining everywhere, and all you scroll to are people with fate…"}, {"start": 439.85, "end": 461.57, "text": "你最多刷十分钟你就会感到无趣了，你就有时间去感受真实的世界了，或许你会在百无聊赖的时候开始尝试真实的社交，深度的阅读，完整的学习，酣畅淋漓的锻炼，甚至是做一顿饭，完整的看一部电影，不管什么吧，都比沉浸在信息糖果漩涡中无法自拔要强百倍。", "en": "You will feel bored after at most ten minutes, and then you will have time to feel the real world. Perhaps in your boredom you will start trying real socialising, deep reading, complete learning, hearty exercise, or even cooking a meal, or watching a complete film. No matter what, it is a hundred times better than being unable to extricate yourself from the vortex of information candy."}, {"start": 461.57, "end": 464.86, "text": "祝兄弟们都能拥有属于自己的人生大腚。", "en": "May all you brothers have your own life's big butt."}, {"start": 464.86, "end": 467.78, "text": "此腚非彼腚，不要肤浅了啊~", "en": "This butt is not that butt — don't be superficial~"}]}];
let LINES=SECTIONS[0].lines;
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),enBox=document.getElementById('en'),audioSelect=document.getElementById('audioSelect'),secTitle=document.getElementById('secTitle');
let els=[];let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function buildLines(){box.innerHTML='';LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;const p=a.play();if(p&&p.catch)p.catch(()=>{playBtn.textContent='▶';});playBtn.textContent='⏸';};box.appendChild(d);});els=[...box.children];curIdx=-1;box.scrollTop=0;}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];enBox.textContent=LINES[i].en||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
function loadSection(idx){const s=SECTIONS[idx];a.pause();playBtn.textContent='▶';LINES=s.lines;secTitle.textContent=s.title;a.src=s.mp3;a.load();try{const _r=parseFloat(localStorage.getItem('audioRate'));if(!isNaN(_r)&&_r>0)a.playbackRate=_r;}catch(e){}seek.value=0;cur.textContent='0:00';dur.textContent=s.dur;enBox.textContent='';buildLines();}
audioSelect.onchange=()=>{loadSection(parseInt(audioSelect.value,10));};
buildLines();
playBtn.onclick=()=>{if(a.paused){const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';const p=a.play();if(p&&p.catch){p.catch(()=>{playBtn.textContent='▶';if(st)st.textContent='音频无法播放：请刷新页面，或换 Safari/Chrome 打开（不要用微信/WhatsApp 内嵌浏览器）。';});}playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
a.onplaying=()=>{const st=document.getElementById('status');if(st)st.textContent='';};

document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};

speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);try{localStorage.setItem('audioRate',String(parseFloat(b.dataset.rate)));}catch(e){}speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});

seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};

function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}

if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);try{const _r=parseFloat(localStorage.getItem('audioRate'));if(!isNaN(_r)&&_r>0){a.playbackRate=_r;speedBtn.textContent=_r.toString().replace(/\.0$/,'')+'×';speedMenu.querySelectorAll('.speed-opt').forEach(x=>{const _on=parseFloat(x.dataset.rate)===_r;x.classList.toggle('sel',_on);x.querySelector('span').textContent=_on?'●':'○';});}}catch(e){}volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}

<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
<script>
(function(){
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var KEY = 'lastAudio:' + location.pathname;
  function save(){ try { localStorage.setItem(KEY, sel.value); } catch (e) {} }
  sel.addEventListener('change', save);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', save);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved !== null && saved !== '' && saved !== sel.value) {
      var ok = false;
      for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === saved) { ok = true; break; } }
      if (ok) { sel.value = saved; sel.dispatchEvent(new Event('change')); }
    }
  } catch (e) {}
})();
</script>

(function(){
  var SYNC_URL = 'https://player-sync.billyxiaoli.workers.dev';
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var HUB = location.pathname;
  var ready = false;
  function postCloud(){
    if (!ready) return;
    try {
      fetch(SYNC_URL + '/', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({hub: HUB, audio: sel.value})}).catch(function(){});
    } catch (e) {}
  }
  sel.addEventListener('change', postCloud);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', postCloud);
  try {
    var ctl = null;
    if (window.AbortController) {
      ctl = new AbortController();
      setTimeout(function(){ try { ctl.abort(); } catch (e) {} }, 4000);
    }
    var opts = {};
    if (ctl) opts.signal = ctl.signal;
    fetch(SYNC_URL + '/?hub=' + encodeURIComponent(HUB), opts).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.audio) {
        var ok = false;
        for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === d.audio) { ok = true; break; } }
        if (ok && sel.value !== d.audio) { sel.value = d.audio; sel.dispatchEvent(new Event('change')); }
      }
      ready = true;
    }).catch(function(){ ready = true; });
  } catch (e) { ready = true; }
})();
</script>
<script>
(function(){
  var a = document.getElementById('player');
  var sel = document.getElementById('audioSelect');
  if (!a || !sel) return;
  a.addEventListener('ended', function(){
    var i = sel.selectedIndex;
    if (i < 0 || i + 1 >= sel.options.length) {
      var st0 = document.getElementById('status');
      if (st0) st0.textContent = '本页音频已全部播完';
      return;
    }
    sel.selectedIndex = i + 1;
    sel.dispatchEvent(new Event('change'));
    var pb = document.getElementById('playBtn');
    if (pb) pb.textContent = '⏸';
    try {
      var p = a.play();
      if (p && p.catch) p.catch(function(){
        if (pb) pb.textContent = '▶';
        var st = document.getElementById('status');
        if (st) st.textContent = '下一首已就绪，请点一下播放';
      });
    } catch (e) {
      if (pb) pb.textContent = '▶';
    }
  });
})();
</script>
</body>
</html>
