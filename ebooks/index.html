home turf of the left or the right, so that even if you are a centrist you can find your own concentrated section."}, {"start": 140.76, "end": 142.49, "text": "还有比这更好的新闻网站？", "en": "Is there a better news website than this?"}, {"start": 142.49, "end": 147.36, "text": "要是对比一下左右的新闻，会发现interesting 的东西真不少呢。", "en": "If you compare left and right news, you will find quite a few interesting things."}, {"start": 147.36, "end": 154.08, "text": "出版方的意识形态并不会一成不变，这个网站相当于是动态统计并标识了出版方的新闻立场。", "en": "A publisher's ideology does not stay fixed; this website effectively keeps dynamic statistics and labels publishers' news stances."}, {"start": 154.08, "end": 155.64, "text": "思考与解释。", "en": "Thinking and explaining."}, {"start": 155.64, "end": 160.27, "text": "请正确思考，而不是把解释，当成思考。", "en": "Please think correctly, rather than treating explanation as thinking."}, {"start": 160.27, "end": 162.86, "text": "解释，不是思考，是逃避思考。", "en": "Explanation is not thinking; it is escaping thinking."}, {"start": 162.86, "end": 168.86, "text": "是大脑因为懒惰，而试图找一个方法拒止思考，所以需要给自己一个解释。", "en": "It is the brain, out of laziness, trying to find a way to refuse thinking, and so needing to give itself an explanation."}, {"start": 168.86, "end": 174.26, "text": "重复一次，解释是给自己的大脑偷懒用的，其唯一作用是骗自己。", "en": "Let me repeat: explanation is for the brain to slack off; its only function is to deceive yourself."}, {"start": 174.26, "end": 177.22, "text": "当你需要解释的时候，你在互联网就来对地方了。", "en": "When you need an explanation, you have come to the right place on the internet."}, {"start": 177.22, "end": 186.14, "text": "这里一定会创造出一个你内心潜意识真正想要的信息茧房，然后由互联网大v来替你解释出你想要的一切。", "en": "Here, an information cocoon that your subconscious truly wants will definitely be created for you, and then big internet influencers will explain everything you want on your behalf."}, {"start": 186.14, "end": 188.66, "text": "最后一点点编织出你的梦境。", "en": "Finally, little by little, weaving your dream."}, {"start": 188.66, "end": 190.63, "text": "这个就是解释的魔力。", "en": "That is the magic of explanation."}, {"start": 190.63, "end": 195.19, "text": "大多数人，做的事情，是解释，而不是真正的思考。", "en": "What most people do is explain, not truly think."}, {"start": 195.19, "end": 200.52, "text": "真正的思考，是基于已有信息元素，一步一步向未知进行演绎。", "en": "True thinking is based on existing information elements, deducing step by step toward the unknown."}, {"start": 200.52, "end": 203.95, "text": "这个过程根本不知道迷宫有没有尽头，有没有出路。", "en": "In this process, you have no idea whether the maze has an end or an exit."}, {"start": 203.95, "end": 208.32, "text": "这个就是基于现实存在的元素，进行思考演绎。", "en": "This is thinking and deducing based on elements that exist in reality."}, {"start": 208.32, "end": 209.93, "text": "也是最难做的事情。", "en": "And it is the hardest thing to do."}, {"start": 209.93, "end": 213.0, "text": "大多数人所做的，是基于现状。", "en": "What most people do is start from the status quo."}, {"start": 213.0, "end": 216.6, "text": "然后对现状的原因找到一个合理化解释。", "en": "And then find a rationalising explanation for the causes of the status quo."}, {"start": 216.6, "end": 219.12, "text": "任何事情都可以合理化解释。", "en": "Anything can be rationally explained."}, {"start": 219.12, "end": 222.24, "text": "并且在三步之内就可以找到合理化解释。", "en": "And a rationalising explanation can be found within three steps."}, {"start": 222.24, "end": 226.13, "text": "比如最肤浅的合理化解释：一切都是神的力量；", "en": "For example, the most superficial rationalising explanation: everything is the power of God;"}, {"start": 226.13, "end": 229.06, "text": "进一步，打赢了的就是正义的力量；", "en": "One step further: whoever wins a war is the power of justice;"}, {"start": 229.06, "end": 232.3, "text": "进一步，ta厉害所以ta强大；", "en": "One step further: they are capable, therefore they are strong;"}, {"start": 232.3, "end": 235.42, "text": "进一步，这个国家强大，所以这个国家能创造。", "en": "One step further: this country is strong, therefore this country can create."}, {"start": 235.42, "end": 239.09, "text": "这些都是解释，跟思考任何关系都没有。", "en": "These are all explanations, and have nothing to do with thinking."}, {"start": 239.09, "end": 243.41, "text": "解释跟真正的思考，难度完全不同。", "en": "Explanation and true thinking are completely different in difficulty."}, {"start": 243.41, "end": 246.53, "text": "解释是P问题，思考是NP问题。", "en": "Explanation is a P problem; thinking is an NP problem."}, {"start": 246.53, "end": 249.89, "text": "解释，只需要符合大脑逻辑自洽就可以停止。", "en": "Explanation only needs to satisfy the brain's logical self-consistency before it can stop."}, {"start": 249.89, "end": 253.13, "text": "思考，做到大脑逻辑自洽极难。", "en": "For thinking, achieving logical self-consistency in the brain is extremely difficult."}, {"start": 253.13, "end": 255.0, "text": "并且大体上而言。", "en": "And generally speaking."}, {"start": 255.0, "end": 257.71, "text": "大脑知识网络越强，越难。", "en": "The stronger the brain's knowledge network, the harder it is."}, {"start": 257.71, "end": 266.78, "text": "解释，是一个把当下坐标点当成迷宫出口，然后回溯过去找迷宫入口的解法方式。", "en": "Explanation is a way of solving a maze by treating the current coordinate point as the maze exit, then tracing back to find the maze entrance."}, {"start": 266.78, "end": 274.3, "text": "而且可以拿着锤子的情况下，把任何一个看起来像钉子的东西，当成迷宫入口。", "en": "And with a hammer in hand, anything that looks like a nail can be treated as the maze entrance."}, {"start": 274.3, "end": 276.89, "text": "这个过程，就完成逻辑自洽闭环。", "en": "This process completes a closed loop of logical self-consistency."}, {"start": 276.89, "end": 281.98, "text": "然后进入大脑放松松懈状态：我已经完成了已知。", "en": "Then you enter a relaxed, lax state in the brain: I have completed the known."}, {"start": 281.98, "end": 283.3, "text": "比如例子：", "en": "For example:"}, {"start": 283.3, "end": 285.38, "text": "为什么国家处理教培？", "en": "Why did the state crack down on tutoring?"}, {"start": 285.38, "end": 288.07, "text": "解释：教培影响到了生育率。", "en": "Explanation: tutoring affected the fertility rate."}, {"start": 288.07, "end": 289.82, "text": "非常逻辑自洽，结束。", "en": "Perfectly logically self-consistent. End of story."}, {"start": 289.82, "end": 291.62, "text": "这个是一个典型的解释。", "en": "This is a typical explanation."}, {"start": 291.62, "end": 294.5, "text": "但是。", "en": "But."}, {"start": 294.5, "end": 295.54, "text": "这件事对吗？", "en": "Is this right?"}, {"start": 295.54, "end": 297.98, "text": "如果是对的，那你之前为什么没有预测到？", "en": "If it is right, why did you not predict it before?"}, {"start": 297.98, "end": 299.9, "text": "为什么事后如此清晰。", "en": "Why is it so clear in hindsight?"}, {"start": 299.9, "end": 302.9, "text": "因为你使用的是“解释”，而不是思考。", "en": "Because you are using 'explanation', not thinking."}, {"start": 302.9, "end": 307.1, "text": "解释，天然就吃了“后见之明”的BUFF加成。", "en": "Explanation naturally comes with the buff of 'hindsight'."}, {"start": 307.1, "end": 308.78, "text": "让你以为事情很简单。", "en": "Making you think things are very simple."}, {"start": 308.78, "end": 311.3, "text": "解释，是由果及因。", "en": "Explanation goes from effect to cause."}, {"start": 311.3, "end": 313.22, "text": "这个过程很难错。", "en": "This process is hard to get wrong."}, {"start": 313.22, "end": 316.82, "text": "但是大体上，不会得到有价值的信息。", "en": "But generally, it yields no valuable information."}, {"start": 316.82, "end": 319.3, "text": "并且会忽略大量潜在原因：", "en": "And it ignores a large number of potential causes:"}, {"start": 319.3, "end": 320.26, "text": "比如。", "en": "For example."}, {"start": 320.26, "end": 324.89, "text": "在这一层逻辑自洽的人，意识不到教培领域对学生的戕害。", "en": "People at this level of logical self-consistency do not realise the harm the tutoring sector does to students."}, {"start": 324.89, "end": 329.62, "text": "尽管非常明显，但是因为解释不是思考，所以大脑根本不会想到这一层。", "en": "Although it is very obvious, because explanation is not thinking, the brain simply never thinks of this level."}, {"start": 329.62, "end": 332.81, "text": "真正的思考，一定是有预见力的。", "en": "True thinking must have foresight."}, {"start": 332.81, "end": 339.22, "text": "而我之前确实提前预测出了七普之后国家会焦聚生育率，也预测出了教培产业会完蛋。", "en": "And I did indeed predict in advance that after the 7th census the state would focus on the fertility rate, and that the tutoring industry would be finished."}, {"start": 339.22, "end": 340.78, "text": "因为我是思考演绎。", "en": "Because I was thinking and deducing."}, {"start": 340.78, "end": 344.86, "text": "我思考的问题是，今天的学生在未来会怎么样？", "en": "The question I was thinking about was: what will today's students be like in the future?"}, {"start": 344.86, "end": 347.98, "text": "摆在我面前的要素和思考流程是：", "en": "The elements before me and the thinking process were:"}, {"start": 347.98, "end": 353.42, "text": "1.今天的学生有移动互联网进行软硬件支持，理论上限会很高。", "en": "1. Today's students have mobile internet for software and hardware support, so their theoretical ceiling will be very high."}, {"start": 353.42, "end": 359.26, "text": "2.移动互联网的娱乐场的引力太强，学生靠自制力控制不住；", "en": "2. The gravitational pull of the mobile internet entertainment arena is too strong; students cannot control it through self-discipline;"}, {"start": 359.26, "end": 368.33, "text": "3.因为控制不住，所以没有管教能力的家长被迫不得不花钱找教师辅导，以减少学生玩手机和平板的时间；", "en": "3. Because they cannot control it, parents without the ability to discipline are forced to spend money on tutors to reduce the time students spend playing on phones and tablets;"}, {"start": 368.33, "end": 373.92, "text": "4.教培产业发育做大，资本扩张，最后学生普遍进入被学习状态；", "en": "4. The tutoring industry grows big, capital expands, and eventually students generally enter a state of being made to study;"}, {"start": 373.92, "end": 385.15, "text": "5.教培一代学生在成长到叛逆期之前没有能力对抗家长和老师，进而自由时间被严重占据，忘掉休息，最终成为机械做题一代；", "en": "5. Tutoring-generation students, before reaching their rebellious phase, have no ability to resist their parents and teachers, so their free time is severely occupied, they forget rest, and ultimately become a generation of mechanical problem-solvers;"}, {"start": 385.15, "end": 390.86, "text": "6.高房价加速生育率下跌，生育率是民族的核心资产属性。", "en": "6. High housing prices accelerate the fall in fertility, and fertility is the core asset attribute of a nation."}, {"start": 390.86, "end": 395.78, "text": "同时，低生育率与教培资本野蛮生长高度共鸣。", "en": "At the same time, low fertility resonates strongly with the barbaric growth of tutoring capital."}, {"start": 395.78, "end": 399.22, "text": "最终社会承担不了压力，直到系统崩溃。", "en": "Eventually society cannot bear the pressure, until the system collapses."}, {"start": 399.22, "end": 405.26, "text": "7.教培一代学生卷入市场就业，也会导致市场其他普通就业者被迫内卷。", "en": "7. Tutoring-generation students entering the job market will also force other ordinary workers in the market into involution."}, {"start": 405.26, "end": 411.58, "text": "这个过程不可改，因为被教培长大的学生就压根儿不懂社交与休闲。", "en": "This process cannot be changed, because students raised by tutoring simply do not understand socialising and leisure."}, {"start": 411.58, "end": 415.82, "text": "——哪怕脱离开教培影响，高教育者也强关联低生育率。", "en": "— Even setting aside the tutoring influence, the highly educated are strongly associated with low fertility."}, {"start": 415.82, "end": 441.62, "text": "——于是，我在无人注意的时候大胆提前预测国家开始重点抓生育率（也为这个问题建议被该问题困住的人把视野放在无人注意的街机市场和桌游市场领域，（这里我推荐延展阅读书籍《社交天性》《村落效应》《群体性孤独》《技术垄断》《童年的消逝》《新黑暗时代》《亲密关系》等）），预测出教培会完蛋。", "en": "— So, when no one was paying attention, I boldly predicted in advance that the state would start focusing on fertility (and for those trapped by this problem, I suggested looking at the unnoticed arcade market and board-game market — here I recommend extended reading: Social, The Village Effect, Alone Together, Technopoly, The Disappearance of Childhood, The New Dark Age, Intimate Relationships, and others), and predicted that tutoring would be finished."}, {"start": 441.62, "end": 444.19, "text": "这个过程是NP的，是事先思考的。", "en": "This process is NP; it was thought through in advance."}, {"start": 444.19, "end": 447.79, "text": "并不是基于国家为什么要处理教培去逆向走迷宫。", "en": "It was not a matter of walking the maze backwards based on why the state wanted to crack down on tutoring."}, {"start": 447.79, "end": 454.22, "text": "而是正向基于现实存在的元素，进行正向推导，而被迫得到了一系列结论。", "en": "Rather, it was forward deduction based on elements that exist in reality, which forced a series of conclusions."}, {"start": 454.22, "end": 458.18, "text": "当然，得到的结论还不止这些，延伸还得到了很多很多其他结论。", "en": "Of course, the conclusions obtained were not only these; many, many other conclusions were extended from them."}, {"start": 458.18, "end": 461.74, "text": "这些结论会碎片化出现在我的其他问题中。", "en": "These conclusions appear fragmentarily in my answers to other questions."}, {"start": 461.74, "end": 464.21, "text": "然后我写了好几个相关问题的答案。", "en": "Then I wrote several answers to related questions."}, {"start": 464.21, "end": 469.01, "text": "这个过程事后看起来是P问题，但是对事前来说，完全是NP的。", "en": "This process looks like a P problem in hindsight, but beforehand it was completely NP."}, {"start": 469.01, "end": 474.24, "text": "只是因为我正确演绎了这个过程，所以，看起来像P问题。", "en": "It only looks like a P problem because I correctly deduced the process."}, {"start": 474.24, "end": 477.29, "text": "不要觉得这些问题简单。", "en": "Do not think these questions are simple."}, {"start": 477.29, "end": 484.42, "text": "只因为我想要获得答案，我在思考过程中，需要不停查阅生理学，运动，休闲相关的资料。", "en": "Just because I wanted answers, during the thinking process I had to constantly consult materials on physiology, sports and leisure."}, {"start": 484.42, "end": 502.01, "text": "这个过程我遍翻教育学资料，西方休闲史，技术文化史，亲自去线下与教培产业的老师聊天，亲自在线上接触线上教育的老师和学生，亲自付费去学习钢琴舞蹈体验并近距离观察这些学生的生活，不断验证我的想法。", "en": "In this process I searched through education materials, Western leisure history and the history of technological culture, personally went offline to chat with teachers in the tutoring industry, personally contacted online education teachers and students online, personally paid to learn piano and dance and closely observe these students' lives, constantly verifying my ideas."}, {"start": 502.01, "end": 503.57, "text": "最终我得出结论。", "en": "Finally, I reached a conclusion."}, {"start": 503.57, "end": 506.57, "text": "起码在中国，教培产业不妙。", "en": "At least in China, the tutoring industry is in trouble."}, {"start": 506.57, "end": 509.16, "text": "这个过程就是走出信息茧房的过程。", "en": "This process is the process of walking out of the information cocoon."}, {"start": 509.16, "end": 516.6, "text": "因为我是认真在思考问题，去一点点验证我的想法，最终我得到了由因到果的正确结果。", "en": "Because I was seriously thinking about problems, verifying my ideas bit by bit, and finally obtained the correct result from cause to effect."}, {"start": 516.6, "end": 518.83, "text": "这个就是我如何实现的预测。", "en": "This is how I achieved my prediction."}, {"start": 518.83, "end": 520.87, "text": "习惯解释，会活在过去。", "en": "Being accustomed to explaining means living in the past."}, {"start": 520.87, "end": 523.56, "text": "学会思考，才渴望未来。", "en": "Learning to think means longing for the future."}, {"start": 523.56, "end": 531.36, "text": "把自己的思维活动中，一定要把解释倾向区分开来。", "en": "In your thinking activities, you must distinguish the tendency to explain."}, {"start": 531.36, "end": 534.24, "text": "不要解释，不要解释，不要解释！", "en": "Do not explain, do not explain, do not explain!"}, {"start": 534.24, "end": 540.24, "text": "如果对自我管理较差，分不清自己是在思考还是在解释。", "en": "If you are poor at self-management and cannot tell whether you are thinking or explaining."}, {"start": 540.24, "end": 550.44, "text": "那你优先应该进行信源管理，留下你观察中真正在思考的ID，对于只会解释的ID，打个保留的问号。", "en": "Then you should prioritise source management: keep the IDs you observe to be truly thinking, and put a question mark on the IDs that only explain."}, {"start": 550.44, "end": 557.59, "text": "不会思考只会解释的人，永远四平八稳不会出错——除非遇到可证伪的事件才会被打脸。", "en": "People who cannot think and can only explain are always steady and never wrong — unless they encounter a falsifiable event that slaps them in the face."}, {"start": 557.59, "end": 561.12, "text": "但是历史事件有限，发现南郭先生的机会很少。", "en": "But historical events are limited, and opportunities to expose a Mr. Nanguo are rare."}, {"start": 561.12, "end": 565.99, "text": "擅长思考的人一定敢于对未来技术提出意见帮助。", "en": "People who are good at thinking will definitely dare to offer opinions on future technology to help."}, {"start": 565.99, "end": 571.27, "text": "这一条，是你辨别一个ID是否有思考能力的最佳风向标。", "en": "This is the best weather vane for telling whether an ID has thinking ability."}, {"start": 571.27, "end": 579.72, "text": "因为一个人思考路径对了，查阅的资料足够了，演绎过程反复自我验证过了，一定会尝试向未来拓展。", "en": "Because if a person's thinking path is correct, they have consulted enough materials, and their deduction process has been repeatedly self-verified, they will definitely try to extend toward the future."}, {"start": 579.72, "end": 584.95, "text": "对普通个体来说，想要脱离信息茧房，一定要学会独立思考。", "en": "For ordinary individuals, to escape the information cocoon, you must learn to think independently."}, {"start": 584.95, "end": 589.99, "text": "去学会一步步思考演绎的过程。", "en": "Learn the process of thinking and deducing step by step."}, {"start": 589.99, "end": 597.96, "text": "只有真正的思考，才会让你不受限信息干扰，为了一个个问题困惑确认，大量查阅资料。", "en": "Only true thinking will free you from information interference, leave you puzzled and seeking confirmation over one question after another, and consulting large amounts of material."}, {"start": 597.96, "end": 606.91, "text": "这个过程会自然忘掉你是谁，你只想解决困惑，你就自然而然有了多领域的应用知识，走到其他人思维以外的无人区。", "en": "This process will naturally make you forget who you are; you only want to solve the puzzle, and you will naturally gain multi-domain applied knowledge and reach uninhabited zones beyond other people's thinking."}]}, {"title": "怎样避免活在信息茧房之中？ Part 5（91句，7:04）", "mp3": "upload-8-part05/audio.mp3", "dur": "7:04", "lines": [{"start": 0.0, "end": 3.17, "text": "最近，一位“洛丽塔”女孩引起了不小的议论。", "en": "Recently, a 'Lolita' girl has sparked quite a discussion."}, {"start": 3.17, "end": 6.17, "text": "不到160的身高，体重近200斤。", "en": "Under 160 cm tall, weighing nearly 200 jin."}, {"start": 6.17, "end": 9.84, "text": "她非常喜欢穿“洛丽塔”，隔段时间就会买一套新衣服。", "en": "She loves wearing 'Lolita' very much, and buys a new outfit every so often."}, {"start": 9.84, "end": 13.32, "text": "然后，在社交平台上晒出自己的“美照”。", "en": "Then she posts her 'beautiful photos' on social platforms."}, {"start": 13.32, "end": 20.09, "text": "最开始，大家并没有很在意是不是真的“卡哇伊”，只是担心她的健康。", "en": "At first, people did not care much whether she was really 'kawaii'; they were just worried about her health."}, {"start": 20.09, "end": 23.21, "text": "有人建议她减肥，有人建议她体检。", "en": "Some suggested she lose weight; others suggested she get a check-up."}, {"start": 23.21, "end": 27.7, "text": "没想到，她直接将“只接受夸奖，不接受批评”写在简介上。", "en": "Unexpectedly, she wrote directly in her bio: 'Only compliments accepted, no criticism'."}, {"start": 27.7, "end": 31.13, "text": "但胖不胖是她自己的事，我们夸不夸是我们的事。", "en": "But whether she is fat or not is her business, and whether we compliment her or not is ours."}, {"start": 31.13, "end": 32.45, "text": "所以有网友这样说：", "en": "So one netizen said this:"}, {"start": 32.45, "end": 34.73, "text": "“我觉得，就是要实话实说啊。", "en": "“I think we should just tell the truth."}, {"start": 34.73, "end": 38.86, "text": "如果一味地夸赞，就会让人觉得这就是美、就是好看的方式。", "en": "If you just keep praising, people will think this is beauty, this is the way to look good."}, {"start": 38.86, "end": 43.82, "text": "这样久了会慢慢的变得扭曲，实话实说才好吧。", "en": "Over time it slowly becomes distorted; telling the truth is better, isn't it."}, {"start": 43.82, "end": 48.62, "text": "”", "en": "”"}, {"start": 48.62, "end": 52.1, "text": "“美的确没有定义，但是实话就是真的胖啊。", "en": "“Beauty indeed has no definition, but the truth is she really is fat."}, {"start": 52.1, "end": 56.9, "text": "”", "en": "”"}, {"start": 56.9, "end": 63.67, "text": "眼看辩驳无力，她又开始用探讨美的标准来逃避，并冠以自信等词语。", "en": "Seeing she could not win the argument, she began using discussions of beauty standards to dodge, dressing it up with words like confidence."}, {"start": 63.67, "end": 69.19, "text": "“现在满大街的瘦子和普通体型的全是亚健康，难道胖子就要十全十美？", "en": "“Nowadays the skinny people and average builds all over the street are all subhealthy — must fat people be perfect in every way?"}, {"start": 69.19, "end": 73.99, "text": "”", "en": "”"}, {"start": 73.99, "end": 80.52, "text": "“身为年轻人，我仅仅是跑不动步，爬不动楼梯，却要在我身上无限放大。", "en": "“As a young person, I merely cannot run or climb stairs, yet everything about me gets infinitely magnified."}, {"start": 80.52, "end": 85.32, "text": "”", "en": "”"}, {"start": 85.32, "end": 89.16, "text": "于是，评论区便有了这样的略带浮夸的赞美：", "en": "So the comments section had this kind of slightly exaggerated praise:"}, {"start": 89.16, "end": 91.97, "text": "太漂亮了，再胖点会更好看哦。", "en": "So beautiful! Getting a bit fatter would look even better."}, {"start": 91.97, "end": 96.96, "text": "做自己就好，生活是活给自己看的，晚上要多加两个汉堡跟可乐，开心最重要。", "en": "Just be yourself; life is lived for yourself. Have two more burgers and a cola at night — being happy matters most."}, {"start": 96.96, "end": 99.79, "text": "如果是120斤左右，可能都不会有人说胖。", "en": "If she were around 120 jin, probably no one would call her fat."}, {"start": 99.79, "end": 103.27, "text": "如果接受不了议论，完全可以选择仅自己可见。", "en": "If you cannot take discussion, you can simply choose to make it visible only to yourself."}, {"start": 103.27, "end": 105.96, "text": "可她偏偏选择了“流量”最大的方式。", "en": "But she chose the way that gets the most 'traffic'."}, {"start": 105.96, "end": 111.55, "text": "我很反感那种无脑攻击别人的人，但是也反感那种明明不好。", "en": "I really dislike people who mindlessly attack others, but I also dislike people who are clearly not good."}, {"start": 111.55, "end": 116.04, "text": "却硬生生的给自己创造了一个信息茧房，只准夸的人。", "en": "Yet stubbornly build themselves an information cocoon that only allows praise."}, {"start": 116.04, "end": 123.07, "text": "有时在网上会被一些人的言论惊讶到，我就会疑惑，为什么会说出这么没常识的话？", "en": "Sometimes I am surprised by what people say online, and I wonder: how can they say something so lacking in common sense?"}, {"start": 123.07, "end": 126.62, "text": "后来想一想，可能这就是大数据造就的信息茧房。", "en": "Later I thought about it: maybe this is the information cocoon created by big data."}, {"start": 126.62, "end": 131.47, "text": "就像曾经很有名气的方舟子，只要碰到意见不同的人就拉黑。", "en": "Take Fang Zhouzi, who was once very famous: whenever he met someone with a different opinion, he blocked them."}, {"start": 131.47, "end": 134.42, "text": "最近他发文说自己拉黑了14万人。", "en": "Recently he posted that he has blocked 140,000 people."}, {"start": 134.42, "end": 139.03, "text": "我算了一下，即使每天拉黑100个人，也得需要整整4年。", "en": "I did the math: even blocking 100 people a day would take a full 4 years."}, {"start": 139.03, "end": 145.15, "text": "人是怎么越来越偏激的，看这位就够了，自己给自己造了一个巨大的信息茧房。", "en": "To see how a person becomes more and more extreme, this example is enough: he built himself a huge information cocoon."}, {"start": 145.15, "end": 152.06, "text": "他们生活在自认为正确的观点里，我们很难借助外在信息来向他们证明。", "en": "They live inside views they think are correct, and it is hard for us to prove otherwise using outside information."}, {"start": 152.06, "end": 155.06, "text": "比如“饭圈文化”，专门追星的小圈子。", "en": "Take 'fan-circle culture', for example — small circles dedicated to chasing stars."}, {"start": 155.06, "end": 160.63, "text": "时间越长就会越来越“排外”，拉踩行为无处不在，一言不合就爆粗口。", "en": "The longer it goes on, the more 'exclusive' it becomes; trampling rivals is everywhere, and a single disagreement brings swearing."}, {"start": 160.63, "end": 165.55, "text": "可怕的是，这种现象，不只是在那些追星的群体上得以体现。", "en": "What is frightening is that this phenomenon is not only reflected in those star-chasing groups."}, {"start": 165.55, "end": 170.3, "text": "在茧房中，信息相互屏蔽，人们在自说自话中固化认知。", "en": "Inside the cocoon, information blocks each other off, and people solidify their cognition while talking to themselves."}, {"start": 170.3, "end": 176.11, "text": "更甚者，演变成群情激愤的互喷，可绝大多数人，很难意识到这一点。", "en": "Worse, it escalates into furious mutual attacks, yet the vast majority of people can hardly realise this."}, {"start": 176.11, "end": 177.14, "text": "02", "en": "02"}, {"start": 177.14, "end": 182.42, "text": "但很多时候，我们没有主动选择“信息茧房”，也会被困在其中。", "en": "But often, even when we do not actively choose an 'information cocoon', we still get trapped in one."}, {"start": 182.42, "end": 186.38, "text": "比如，长辈们总喜欢转发各种各样的谣言。", "en": "For example, elders always love forwarding all kinds of rumours."}, {"start": 186.38, "end": 191.23, "text": "有时候，我自己辟谣都辟累了，但他们依旧沉迷其中。", "en": "Sometimes I get tired of debunking them myself, but they remain obsessed."}, {"start": 191.23, "end": 196.39, "text": "后来看了爷爷的手机才知道，长辈们已经被“谣言”花式包围。", "en": "It was only after looking at my grandfather's phone that I realised the elders have been surrounded by 'rumours' in fancy forms."}, {"start": 196.39, "end": 199.75, "text": "朋友圈、微信群都充斥着这些信息。", "en": "Moments and WeChat groups are full of this information."}, {"start": 199.75, "end": 204.98, "text": "只要老人家打开手机，总有一条谣言能进入他的视线。", "en": "As long as an elderly person opens their phone, there will always be a rumour entering their sight."}, {"start": 204.98, "end": 210.31, "text": "久而久之，便将自身桎梏“茧房”，堵塞了本应获取信息的渠道。", "en": "Over time, they imprison themselves in a 'cocoon', blocking the channels through which they should obtain information."}, {"start": 210.31, "end": 213.19, "text": "但其实，我们年轻人又何尝不是？", "en": "But actually, are we young people any different?"}, {"start": 213.19, "end": 218.11, "text": "在大数据时代，如果你喜欢娱乐搞笑，那么给你推荐的都是各种八卦。", "en": "In the big data era, if you like entertainment and comedy, you get recommended all kinds of gossip."}, {"start": 218.11, "end": 222.43, "text": "如果你喜欢社会热点，那么你每天都能体会一遍世间百态。", "en": "If you like social hot topics, you can experience the whole range of human life every day."}, {"start": 222.43, "end": 227.95, "text": "如果不去主动搜索，软件中永远不会出现学习增长类的信息。", "en": "If you do not actively search, learning and growth content will never appear in the apps."}, {"start": 227.95, "end": 233.95, "text": "每天看的东西，都是大数据根据喜好推送的，被动习惯的接受后。", "en": "What you see every day is pushed according to your preferences by big data, and after passively and habitually accepting it."}, {"start": 233.95, "end": 241.08, "text": "久而久之仿佛是一张看不见的网，将我们束缚在原地，不能接触和了解更多新的东西。", "en": "Over time it is like an invisible net, binding us in place, unable to contact and understand more new things."}, {"start": 241.08, "end": 244.44, "text": "你看到的，永远都是自己想看到的。", "en": "What you see is always only what you want to see."}, {"start": 244.44, "end": 247.27, "text": "你学到的，永远都是你认同的那些观点。", "en": "What you learn is always only the views you agree with."}, {"start": 247.27, "end": 250.46, "text": "你听到的，永远都是你想听的那些声音。", "en": "What you hear is always only the voices you want to hear."}, {"start": 250.46, "end": 256.99, "text": "长此以往，便带来一个非常可怕的后果：你从此丧失了全面看待事物的能力。", "en": "In the long run, this brings a very terrible consequence: you lose the ability to see things comprehensively."}, {"start": 256.99, "end": 261.43, "text": "你看到的，也许都是你赞同的信息，但绝非世界的本来面目。", "en": "What you see may all be information you agree with, but it is by no means the world as it really is."}, {"start": 261.43, "end": 266.3, "text": "比如，有网友患有抑郁症，大数据以为他喜欢这方面的信息。", "en": "For example, a netizen suffers from depression, and big data thinks he likes this kind of information."}, {"start": 266.3, "end": 271.27, "text": "源源不断的推荐这方面的东西，却一度让他产生“厌世”情绪。", "en": "It keeps recommending such things, which once made him feel 'world-weary'."}, {"start": 271.27, "end": 275.52, "text": "如果我们不主动去看书、去阅读，去搜索信息。", "en": "If we do not actively read books, read, and search for information."}, {"start": 275.52, "end": 280.13, "text": "那么我们就只能知道，自己想知道的事情，或者已经知道的事情。", "en": "Then we can only know what we want to know, or what we already know."}, {"start": 280.13, "end": 284.88, "text": "生活在互联网时代，如果我们觉得网络的观点与我们的观点一致。", "en": "Living in the internet age, if we feel that online views agree with our views."}, {"start": 284.88, "end": 289.01, "text": "不是因为我们有多聪明，而是因为我们太笨了。", "en": "It is not because we are so smart, but because we are too foolish."}, {"start": 289.01, "end": 293.98, "text": "不懂得去主动搜寻自己不知道的事情，所以一直封闭在自己的角落。", "en": "Not knowing how to actively search for things we do not know, we stay closed in our own corner."}, {"start": 293.98, "end": 299.66, "text": "而网络看似给我们提供了不少信息，实际上也无形给我们加了一道壁垒。", "en": "And the internet, while seemingly providing us with a lot of information, has also invisibly added a barrier for us."}, {"start": 299.66, "end": 300.91, "text": "03", "en": "03"}, {"start": 300.91, "end": 308.59, "text": "心理学上，曾提到过两种认知偏差：朴素现实主义和朴素犬儒主义。", "en": "In psychology, two cognitive biases have been mentioned: naive realism and naive cynicism."}, {"start": 308.59, "end": 315.72, "text": "“朴素现实主义”的人，总相信自己掌握真理，他人是不理性，甚至有偏见的。", "en": "A 'naive realism' person always believes they grasp the truth, while others are irrational or even biased."}, {"start": 315.72, "end": 321.96, "text": "而“朴素犬儒主义”的人，总认为自己是客观的，他人在以自我为中心。", "en": "A 'naive cynicism' person always thinks they are objective, while others are self-centred."}, {"start": 321.96, "end": 326.45, "text": "这两种都是典型的窄化视野，为自己筑造信息茧房。", "en": "Both are typical narrow vision, building an information cocoon for oneself."}, {"start": 326.45, "end": 331.42, "text": "长期只吃自己喜欢的某一种食物，会营养不良的。", "en": "Eating only one kind of food you like for a long time will cause malnutrition."}, {"start": 331.42, "end": 336.22, "text": "同样，长期只看自己喜欢的信息，也会让自己包容性下降。", "en": "Similarly, only reading information you like for a long time will reduce your tolerance."}, {"start": 336.22, "end": 341.45, "text": "其实，正常的价值观体系，会在一个大框架里有小范围波动的。", "en": "Actually, a normal value system fluctuates within a small range inside a large framework."}, {"start": 341.45, "end": 347.5, "text": "如果一成不变，那证明你一直没有接触到新的信息，也没有任何主动的思考。", "en": "If it never changes, that proves you have never encountered new information, nor done any active thinking."}, {"start": 347.5, "end": 354.53, "text": "比如有网友偶然认识一个级别非常高的大佬，她每次讲那么一点点，网友都觉得受益匪浅。", "en": "For example, a netizen happened to meet a very high-level big shot; every little bit he said, the netizen felt greatly benefited."}, {"start": 354.53, "end": 358.08, "text": "因为他讲的这些，是普通人根本不会接触到的信息。", "en": "Because what he said was information ordinary people would never encounter."}, {"start": 358.08, "end": 364.15, "text": "但实际上，信息就在那里，只是我们不去主动寻找，也就永远看不到。", "en": "But actually, the information is right there; it is just that we do not actively seek it, so we never see it."}, {"start": 364.15, "end": 369.24, "text": "所以，我们要主动创造一个信息潮，去接触不同的信息。", "en": "So we must actively create an information tide, to encounter different information."}, {"start": 369.24, "end": 372.91, "text": "听多了赞美者的声音，也要去听一下批评的声音。", "en": "Having heard many voices of praise, you should also listen to voices of criticism."}, {"start": 372.91, "end": 377.83, "text": "同一个事件，尝试从不同的角度、不同的群体去获取信息。", "en": "For the same event, try to obtain information from different angles and different groups."}, {"start": 377.83, "end": 382.7, "text": "不同的平台、不同知识层面的人，或许会给你带来意想不到的信息增量。", "en": "Different platforms and people of different knowledge levels may bring you unexpected information gains."}, {"start": 382.7, "end": 387.82, "text": "而愿意了解更多信息的人，可以根据信息内容，自由作出选择。", "en": "And people willing to learn more information can freely choose based on the information content."}, {"start": 387.82, "end": 392.9, "text": "不需要正确，不需要引导，就能建立在信息基础上的自由意志。", "en": "No need for correctness, no need for guidance, and free will can be built on the basis of information."}, {"start": 392.9, "end": 400.42, "text": "而自由意志的前提就是足够多的信息，在不了解事实的情况下，人其实并没有自由意志。", "en": "And the premise of free will is enough information; without understanding the facts, a person actually has no free will."}, {"start": 400.42, "end": 405.17, "text": "了解越深层次的事实，人就会越智慧，慈悲，平和待人。", "en": "The deeper you understand the facts, the wiser, more compassionate and more peaceful you become toward others."}, {"start": 405.17, "end": 412.06, "text": "这不是教导出来的正确观念，而是见多识广之后，自然呈现的生命状态。", "en": "This is not a correct concept taught to you, but a state of life that naturally emerges after seeing much and knowing much."}, {"start": 412.06, "end": 416.78, "text": "尼采曾说，我们的认知边界，就是我们世界的边界。", "en": "Nietzsche once said: the boundaries of our cognition are the boundaries of our world."}, {"start": 416.78, "end": 423.31, "text": "所以我们要尽可能的多走多看多听，毕竟命运会区别对待认知水平不同的人。", "en": "So we should walk more, see more and listen more; after all, fate treats people of different cognitive levels differently."}, {"start": 423.31, "end": 424.39, "text": "共勉！", "en": "Let us encourage each other!"}]}, {"title": "怎样避免活在信息茧房之中？ Part 6（83句，12:30）", "mp3": "upload-8-part06/audio.mp3", "dur": "12:30", "lines": [{"start": 0.0, "end": 4.99, "text": "内外结合，很多事情，看了国内的报道，再看看外面是怎么说的。", "en": "Combine inside and outside: for many things, read the domestic reporting, then look at what the outside world says."}, {"start": 4.99, "end": 10.39, "text": "下面这两个网站不用梯子就能直接打开，上班没事时就瞎逛逛。", "en": "The two websites below can be opened directly without a VPN; I browse them idly when I have nothing to do at work."}, {"start": 10.39, "end": 15.02, "text": "雅虎的很多报道是源自路透社、华盛顿邮报、华尔街日报等等。", "en": "Much of Yahoo's reporting comes from Reuters, The Washington Post, The Wall Street Journal and others."}, {"start": 15.02, "end": 23.26, "text": "早报的新闻，多数都不算秘闻，但至少能看到一些这里看不到的，比如，去年8月南海的视频。", "en": "The Zaobao's news is mostly not secret, but at least you can see some things you cannot see here — for example, last August's video from the South China Sea."}, {"start": 23.26, "end": 36.46, "text": "大辞海、术语库、语料库，维基百科，知网，Newdu网、Thpku网，Zlibrary，The Internet Portal（互联网传送门），Internet Archive（互联网档案馆）。", "en": "Da Cihai, terminology databases, corpora, Wikipedia, CNKI, Newdu, Thpku, Zlibrary, The Internet Portal, Internet Archive."}, {"start": 36.46, "end": 40.01, "text": "以上网站基本涵盖了整个互联网的知识。", "en": "These websites basically cover the entire internet's knowledge."}, {"start": 40.01, "end": 46.44, "text": "用【知识】形成认知，不要用【信息】形成认知。", "en": "Use 'knowledge' to form cognition, not 'information'."}, {"start": 46.44, "end": 49.03, "text": "之所以有“茧房”，还是你对那个领域不了解。", "en": "The reason there is a 'cocoon' is that you do not understand that field."}, {"start": 49.03, "end": 51.14, "text": "你专业领域就很少有“茧房“吧。", "en": "In your own professional field, you rarely have a 'cocoon', right?"}, {"start": 51.14, "end": 55.34, "text": "对专业不了解，就算信源很多，你也很难判断对错。", "en": "If you do not understand a field, even with many sources you will find it hard to judge right from wrong."}, {"start": 55.34, "end": 60.46, "text": "所以尽可能多跨几个领域扩大知识面，知识积累多了，就没那么多“茧房”了。", "en": "So expand your knowledge across as many fields as possible; once you have accumulated enough knowledge, there will not be so many 'cocoons'."}, {"start": 60.46, "end": 67.42, "text": "当美媒说美国负面新闻的时候，它是可信的，证据确凿的，是可以被印度国内权威媒体引用的", "en": "When the US media reports negative news about America, it is credible, well-evidenced, and can be cited by authoritative Indian domestic media."}, {"start": 67.42, "end": 74.09, "text": "当同一家美媒说正义联盟的负面消息的时候，它是无中生有，是不可信的，是可以忽略的", "en": "When the same US media reports negative news about the Justice League, it is fabricated, untrustworthy, and can be ignored."}, {"start": 74.09, "end": 79.9, "text": "这家美媒说印度的正面新闻的时候，这是可以骄傲的，可以大幅宣传的", "en": "When this US media reports positive news about India, it is something to be proud of and can be widely publicised."}, {"start": 79.9, "end": 94.82, "text": "还是这家美媒说印度负面新闻的时候，这是戴有色眼镜，胡搅蛮缠，颠倒黑白，是需要全国从上至下全民慷慨激昂批判的，但是有一点要尤其注意，就算是全民批判也不能发出原文", "en": "But when this same US media reports negative news about India, it is wearing tinted glasses, stirring up trouble, inverting right and wrong, and needs to be criticised passionately by the whole nation from top to bottom — but one thing to be especially careful about is that even during nationwide criticism, the original text must not be circulated."}, {"start": 94.82, "end": 102.43, "text": "这样就可以有效避免信息茧房，因为印度已经过滤了无效虚假的信息，剩下的都是真知灼见", "en": "This way you can effectively avoid the information cocoon, because India has already filtered out invalid, false information, and what remains is all true insight."}, {"start": 102.43, "end": 104.16, "text": "首先我举个假想的例子：", "en": "First, let me give a hypothetical example:"}, {"start": 104.16, "end": 120.91, "text": "小明是一位很普通的大城市上班族，在现如今的社会环境下，小明每天八九点下班，上下班通勤一两个小时，周末不能保证双休，五险一金没缴满，加班费无偿，一个月几千块钱工资。", "en": "Xiao Ming is a very ordinary office worker in a big city. In today's social environment, Xiao Ming gets off work at eight or nine every evening, commutes one or two hours each way, cannot guarantee two days off on weekends, has not fully paid the five insurances and one fund, gets no overtime pay, and earns a few thousand yuan a month."}, {"start": 120.91, "end": 125.78, "text": "整体而言，在大城市漂着的小明，大部分时间并不幸福。", "en": "Overall, Xiao Ming, drifting in a big city, is mostly unhappy."}, {"start": 125.78, "end": 135.94, "text": "小明最快乐的时光，就是在上下班的地铁上，还有深夜在被窝里，刷上一些不怎么需要走脑的视频和段子，然后在那边傻乐。", "en": "Xiao Ming's happiest moments are on the subway commuting to and from work, and late at night under the covers, scrolling through videos and jokes that do not require much thought, and giggling foolishly."}, {"start": 135.94, "end": 144.46, "text": "除此以外，小明还特别喜欢在各个社交网站上，就某件实事，某个游戏，某项比赛，和别人交流自己的看法。", "en": "Besides that, Xiao Ming particularly likes to exchange his views with others on various social websites about some real event, some game, or some competition."}, {"start": 144.46, "end": 153.46, "text": "小明特别喜欢看那些符合自己立场的观点，小明希望这些观点的帖子写的越多越好，读起来仿佛读爽文一样内心舒适。", "en": "Xiao Ming particularly likes reading views that match his own position, and hopes there are as many posts with these views as possible; reading them feels as comfortable as reading a feel-good novel."}, {"start": 153.46, "end": 167.9, "text": "而那些和自己观点不和的文章和视频，无论文章内容，视频长短，小明基本都看不下去，一头扎进评论区对线，维护自身立场神圣不可侵犯，即便有些内容其实很有道理。", "en": "As for articles and videos that disagree with his views, no matter the article's content or the video's length, Xiao Ming basically cannot get through them, and instead dives headfirst into the comments to argue, defending the sacred inviolability of his own position, even though some of the content actually makes a lot of sense."}, {"start": 167.9, "end": 179.66, "text": "这样的生活过了很久，小明突然有种虚度时间的感受，千篇一律的工作下，自己好像也没啥思想和技能上的进步，是时候扩大下自己的认知了。", "en": "After living like this for a long time, Xiao Ming suddenly feels he has wasted his time: under the monotonous work, he seems to have made no progress in thinking or skills. It is time to broaden his cognition."}, {"start": 179.66, "end": 192.34, "text": "那么该如何学习呢，下班回家后脑袋一片浆糊，读书这种慢慢积累的事情显然坚持不下去，难得的宝贵时间，还是尽可能用在刀刃上或者让自己乐呵乐呵比较好。", "en": "So how should he learn? After getting home from work, his head is mush; reading, which accumulates slowly, is clearly unsustainable. His precious spare time is better spent on what matters most or on making himself happy."}, {"start": 192.34, "end": 201.74, "text": "这时小明想起来，自己在社交媒体上有看到很多知识类和启发类的文章视频，一边刷手机一边获取知识，岂不美哉？", "en": "Then Xiao Ming remembers that he has seen many knowledge and inspiration articles and videos on social media — acquiring knowledge while scrolling on his phone, wouldn't that be wonderful?"}, {"start": 201.74, "end": 205.7, "text": "于是小明拿起手机，在社交软件中搜索着。", "en": "So Xiao Ming picks up his phone and searches in social apps."}, {"start": 205.7, "end": 214.15, "text": "小明没什么耐心，希望在有限的时间里学到尽可能多的干货，一般看下开头结尾，评论区看下省流的总结，就上滑下滑了。", "en": "Xiao Ming has little patience and hopes to learn as much substantive content as possible in limited time. He generally reads the beginning and end, checks the comments for a TL;DR summary, and then scrolls up and down."}, {"start": 214.15, "end": 226.46, "text": "所以小明最喜欢那些几百字的短文章和几十秒的短视频，言简意赅，直接说结论和观点，在小明看来这才是又有干货又不墨迹。", "en": "So Xiao Ming likes short articles of a few hundred words and short videos of a few dozen seconds best: concise and to the point, directly stating conclusions and views. In Xiao Ming's view, this is substantive content without beating around the bush."}, {"start": 226.46, "end": 236.26, "text": "至于长文长视频，看看开头，瞅一眼结尾，找一找文章和视频中的“省流观点”，如果觉得写的不错就点点赞投投币，然后直接上滑下滑了。", "en": "As for long articles and long videos, he reads the beginning, glances at the end, looks for the 'TL;DR view' in the article or video, and if he thinks it is well written, he likes and upvotes it, then directly scrolls on."}, {"start": 236.26, "end": 245.98, "text": "同样的，小明还是只爱看那些符合自己立场的文章视频，其他观点不和的内容，要么瞥一眼直接略过，要么直接去评论区对线。", "en": "Similarly, Xiao Ming still only loves reading articles and videos that match his position; content with disagreeing views he either glances at and skips, or goes straight to the comments to argue."}, {"start": 245.98, "end": 255.22, "text": "到了该睡觉的时间，小明放下了手机，回忆一下刚才刷到的文章和视频，好像没什么收获，啥也没记住。", "en": "When it is time to sleep, Xiao Ming puts down his phone and recalls the articles and videos he just scrolled through. He seems to have gained nothing and remembers nothing."}, {"start": 255.22, "end": 257.45, "text": "算了睡觉吧，第二天还得继续加班呢。", "en": "Forget it, time to sleep; tomorrow he has to work overtime again."}, {"start": 257.45, "end": 275.69, "text": "有一天，小明突然认为，自己之前的阅读方式有问题，所谓干货满满的碎片化阅读，既不讲前因后果，又不讲理论分析，内容也都是附和自己立场的爽文模式，死记硬背这些直接抛出来的知识点，自然是记不住的。", "en": "One day, Xiao Ming suddenly thinks his previous reading style is problematic: so-called substantive fragmented reading neither explains causes and consequences nor theoretical analysis, and its content is all feel-good essays that cater to his position. Memorising these directly presented knowledge points by rote naturally means he cannot remember them."}, {"start": 275.69, "end": 291.1, "text": "小明认为自己陷入了碎片化阅读和奶头乐的漩涡，他决定克服困难，即便自己下班后没多少时间，也要读一读长文，看看正经的科普视频，至少小明认为，这可以让自己的生活稍微正能量一些。", "en": "Xiao Ming thinks he has fallen into the vortex of fragmented reading and pacifying entertainment. He decides to overcome the difficulty: even if he does not have much time after work, he will read long articles and watch proper science videos. At least, Xiao Ming thinks, this can make his life a little more positive."}, {"start": 291.1, "end": 294.86, "text": "于是小明拿出手机，满怀信心地上滑下滑。", "en": "So Xiao Ming takes out his phone, full of confidence, scrolling up and down."}, {"start": 294.86, "end": 303.94, "text": "然后小明发现，他只能搜索到那些短文章和短视频，而且这些文章视频讲述的，基本都是附和自己立场的观点。", "en": "Then Xiao Ming discovers that he can only search for those short articles and short videos, and what these articles and videos tell is basically views that cater to his position."}, {"start": 303.94, "end": 312.7, "text": "小明希望的干货文章和科普视频，如果不知道它起的什么标题的话，自己已经搜索不到了，自然也就看不到。", "en": "The substantive articles and science videos Xiao Ming hopes for, if he does not know what title they were given, he can no longer search for them, and naturally cannot see them."}, {"start": 312.7, "end": 317.06, "text": "小明十分苦恼，他打开了某网站，搜索话题：", "en": "Xiao Ming is very troubled. He opens a certain website and searches for the topic:"}, {"start": 317.06, "end": 319.99, "text": "如何避免活在信息茧房之中？", "en": "How can I avoid living in an information cocoon?"}, {"start": 319.99, "end": 325.32, "text": "在上面这个例子中，小明的状态多少可以反映现如今咱们的一些共同点。", "en": "In the above example, Xiao Ming's state can somewhat reflect some commonalities among us today."}, {"start": 325.32, "end": 338.57, "text": "人每天的时间精力是有限的，人们在白天消耗精力，晚上通过休息恢复精力把血回满，第二天继续迎接白天的消耗，周而复始。", "en": "A person's time and energy each day are limited. People expend energy during the day and restore it through rest at night, replenishing their health, and then continue to face the day's consumption the next day, over and over."}, {"start": 338.57, "end": 352.44, "text": "很多人轻视了加班的负面影响，它除了大幅压缩人们的休息时间外，还因为过长工作时间的耗竭，让人们的精力大幅受损，并因为休息和娱乐时间不够，导致第二天的精力来不及补满。", "en": "Many people underestimate the negative impact of overtime: besides greatly compressing people's rest time, it also greatly damages people's energy due to exhaustion from excessively long working hours, and because rest and entertainment time is insufficient, the next day's energy cannot be replenished in time."}, {"start": 352.44, "end": 365.21, "text": "长此以往下去，精力不足会明显体现在人的精神面貌上，反应迟钝，注意力不集中，社交恐惧，对生活中的各种事情提不起兴趣，等等。", "en": "Over time, insufficient energy will clearly show in a person's mental state: slow reactions, lack of concentration, social fear, lack of interest in all kinds of things in life, and so on."}, {"start": 365.21, "end": 379.54, "text": "这种“精力枯竭”的状态，让人没办法集中脑力和精神，专心认真地学习和思考一些事情，只能在闲暇和碎片化的时间当中，干一些不太走脑又能放松心情的事情。", "en": "This state of 'energy depletion' leaves people unable to concentrate their brainpower and spirit to seriously study and think about things; they can only, in their leisure and fragmented time, do things that do not require much thought and can relax their mood."}, {"start": 379.54, "end": 392.02, "text": "就像小明那样，在车里，沙发上或者床上，找一个葛优瘫的姿势，看一些短视频，放松心情或者干脆傻乐呵，享受属于自己支配的自由时光。", "en": "Like Xiao Ming, in the car, on the sofa or in bed, finding a Ge You-style slouching pose, watching some short videos, relaxing or simply giggling foolishly, enjoying the free time under their own control."}, {"start": 392.02, "end": 400.22, "text": "然而在这个过程中，人们虽然可以享受自由时光，并且无需消耗多少精力，但却也让人们只能接受一些无效信息。", "en": "However, in this process, although people can enjoy their free time and need not expend much energy, they can only accept some invalid information."}, {"start": 400.22, "end": 413.14, "text": "从放松的角度讲，它当然是有积极意义的，但是从信息获取的角度来讲，这种无效信息的输入是不利于人们认知范围提升的，它提供的只是放松心情和支配自由时间的快感。", "en": "From a relaxation perspective, this certainly has positive significance, but from an information-acquisition perspective, this input of invalid information is not conducive to improving people's cognitive range; it only provides the pleasure of relaxing and controlling free time."}, {"start": 413.14, "end": 424.25, "text": "不过仅从这点看，这还不至于让人们生活在信息茧房中，它只是阻断了人们获取有效信息的渠道和方式，让人们的认知扩展变得缓慢而已。", "en": "But judging from this point alone, this is not enough to make people live in an information cocoon; it only blocks people's channels and methods of obtaining effective information, making the expansion of people's cognition slower."}, {"start": 424.25, "end": 433.73, "text": "更关键的因素在于，人们会选择性地接受那些自己青睐的信息，阻止自己反感的信息注入大脑，即便它们当中很多信息干货满满。", "en": "The more critical factor is that people selectively accept information they favour, and prevent information they dislike from entering their brains, even though much of it is full of substantive content."}, {"start": 433.73, "end": 440.62, "text": "通俗来说就是，人们更倾向于寻找共鸣，而不是理性地看待别人的所有观点。", "en": "In plain terms, people tend to seek resonance rather than rationally view all of other people's opinions."}, {"start": 440.62, "end": 452.54, "text": "如果在社交软件上，某个人的文章或者视频爆火，得到了很多浏览点赞和关注，这并不完全意味着它展现的观点是正确客观权威的。", "en": "If, on social software, someone's article or video goes viral and gets many views, likes and follows, this does not entirely mean the view it presents is correct, objective and authoritative."}, {"start": 452.54, "end": 462.98, "text": "更准确的说法是，这个回答引起了人们的共鸣，顺应了绝大部分人既有的思想观念，因而很多人愿意仔细读一读并为此点赞关注。", "en": "More accurately, this answer resonated with people and conformed to most people's existing ideas, so many people are willing to read it carefully and like and follow it."}, {"start": 462.98, "end": 477.79, "text": "反之，即便一种观点客观正确又逻辑缜密，但如果它不符合大众主流的思想观念，甚至有点超前的话，大众就会拒绝仔细阅读甚至直接略过，也就是小明在手机APP里上滑下滑的操作。", "en": "Conversely, even if a view is objectively correct and logically rigorous, if it does not conform to the mainstream ideas of the masses, or is even a bit ahead of its time, the masses will refuse to read it carefully or even skip it directly — which is Xiao Ming's scrolling up and down in his phone app."}, {"start": 477.79, "end": 498.24, "text": "暴躁一些的，看到与自己不合的观点，不光是连读都不读，更会借助社交软件的相关功能，用自己的观点直接和别人对线争论。", "en": "The more irritable ones, upon seeing views that disagree with them, do not even read them, but use the social software's relevant functions to directly argue with others using their own views."}, {"start": 498.24, "end": 510.89, "text": "上面描述的这种情况，普遍存在于各种话题中，特别是那些没有固定答案的，每个人可以各抒己见的开放性话题上，连答案较为固定的科学类话题都不能避免。", "en": "The situation described above is common across all kinds of topics, especially those open topics with no fixed answers, where everyone can express their own views, and even science topics with relatively fixed answers cannot avoid it."}, {"start": 510.89, "end": 517.01, "text": "人的这种心理倾向，会自发地拒绝外界信息的注入，让自己的认知难以扩大。", "en": "This psychological tendency of people spontaneously rejects the injection of outside information, making it difficult for their cognition to expand."}, {"start": 517.01, "end": 524.26, "text": "长此以往下去，人会逐渐构筑一个封闭自洽的自我世界，并在这个世界中获得安全感和舒适体验。", "en": "Over time, people gradually build a closed, self-consistent inner world, and gain a sense of security and comfort in this world."}, {"start": 524.26, "end": 533.02, "text": "这就像吐丝的蚕宝宝一样，把自己封闭在一个狭小但是安全的空间内，信息茧房由此出现。", "en": "This is like a silkworm spinning silk, enclosing itself in a small but safe space, and the information cocoon thus appears."}, {"start": 533.02, "end": 544.1, "text": "而高压的社会环境，则会加剧这种信息茧房的形成，让蚕宝宝们更加急于寻找这种安全感和舒适体验，习惯于缩在茧房内把自己保护起来。", "en": "A high-pressure social environment aggravates the formation of this information cocoon, making the silkworms even more eager to find this sense of security and comfort, accustomed to shrinking inside the cocoon to protect themselves."}, {"start": 544.1, "end": 556.27, "text": "当一位上班被领导骂，开会和同事拌嘴，想正常下班却被迫加班摸鱼的打工人，终于熬到下班的那一刻时，全身已经积累一大堆负能量了。", "en": "When a working stiff who was scolded by their boss at work, bickered with colleagues in meetings, and wanted to get off work normally but was forced to work overtime and slack off, finally reaches the moment of getting off work, their whole body has accumulated a pile of negative energy."}, {"start": 556.27, "end": 568.82, "text": "这种情况下，人们更希望追求内心的愉悦和舒适感，活在一个以自我为中心的世界中，而不是活在那个以老板为中心，需要想办法和他人相处共存的世界中。", "en": "In this situation, people prefer to pursue inner pleasure and comfort, living in a world centred on themselves, rather than living in a world centred on the boss, where they need to figure out how to get along and coexist with others."}, {"start": 568.82, "end": 577.39, "text": "人们希望打游戏百战百胜，希望小事琐事一切顺利，希望看到让自己舒服的言论。", "en": "People hope to win every game, hope everything small goes smoothly, and hope to see statements that make them comfortable."}, {"start": 577.39, "end": 589.8, "text": "对于与自己观点不和的内容，人们会据理力争，最好把别人一次性驳倒，体验那种捍卫自己立场的快感，工作生活不易，再给自己找不爽快，那就是找罪受。", "en": "For content that disagrees with their views, people will argue with reason, preferably refuting the other person in one go, experiencing the pleasure of defending their position. Work and life are not easy; finding more unpleasantness for oneself is asking for trouble."}, {"start": 589.8, "end": 603.89, "text": "而在这样的心态中，信息茧房也变得更快构建，茧房本身也变得更厚更难戳破，越来越多的人选择缩在茧房里不出来，信息茧房成为当代人热议的话题，也就不奇怪了。", "en": "And in this mindset, the information cocoon is built even faster, the cocoon itself becomes thicker and harder to puncture, and more and more people choose to stay inside the cocoon and not come out. It is no wonder the information cocoon has become a hot topic among contemporary people."}, {"start": 603.89, "end": 610.92, "text": "最后，发现人们处在信息茧房中的洞察者，未必会选择善意的提醒。", "en": "Finally, those who perceive that people are in information cocoons may not necessarily choose to kindly remind them."}, {"start": 610.92, "end": 622.44, "text": "互联网公司知道现代人的信息茧房很严重，但它们肯定不会选择戳破茧房，而是借助这一点，尽可能地将蚕宝宝们更想看到的信息精准推送。", "en": "Internet companies know that modern people's information cocoons are severe, but they certainly will not choose to puncture the cocoon; instead, they will use this to push information that the silkworms want to see even more precisely."}, {"start": 622.44, "end": 635.47, "text": "于是当小明发现自己处在碎片化阅读中难以自拔，想要改变点什么的时候，除非主动搜索，否则广告和信息推送已经全都是短视频短文章附和的观点了。", "en": "So when Xiao Ming finds himself unable to extricate himself from fragmented reading and wants to change something, unless he actively searches, the advertisements and information pushes are already all short videos and short articles with conforming views."}, {"start": 635.47, "end": 645.67, "text": "同样的，一个人如果想得到大量的舆论支持，只需要借助自身势力，将信息进行人为筛选，然后将那些有利于自己的信息注入到蚕宝宝的茧中。", "en": "Similarly, if a person wants to gain a lot of public support, they only need to use their own power to manually filter information, and then inject information favourable to themselves into the silkworms' cocoons."}, {"start": 645.67, "end": 654.12, "text": "这样，这个人就可以收获一大堆狂热的粉丝，无论这个人做的对还是不对，它都会得到一众无脑追随的蚕宝宝们。", "en": "In this way, this person can harvest a large group of fanatical fans; no matter whether this person is right or wrong, they will gain a crowd of mindless following silkworms."}, {"start": 654.12, "end": 666.29, "text": "而那些善意提醒的好心人，甚至会被蚕宝宝认为是坏人，因为这些好心人的建议与它们希望看到的言论是不相符的，蚕宝宝们会自发地捍卫自己的立场。", "en": "And those well-meaning people who kindly remind them may even be regarded as bad people by the silkworms, because these good people's suggestions do not match the statements they hope to see, and the silkworms will spontaneously defend their positions."}, {"start": 666.29, "end": 676.97, "text": "就好比高明的骗子骗了一个人之后，如果好心人提醒它上当受骗了，它反而会骂那个好心人一顿，然后对骗子说一句：“谢谢啊”", "en": "It is like a skilled liar who deceives a person; if a good person reminds them they have been deceived, they will instead scold the good person, and then say to the liar: 'Thank you'."}, {"start": 676.97, "end": 683.64, "text": "至于避免活在信息茧房中的方法，根据前面的分析探讨，可以总结出几种有效的方向：", "en": "As for methods to avoid living in an information cocoon, based on the preceding analysis and discussion, several effective directions can be summarised:"}, {"start": 683.64, "end": 691.8, "text": "1.想办法逃离那些过于耗竭时间精力的工作，确保自己有足够的时间精力辨别和接受信息。", "en": "1. Find ways to escape work that excessively drains time and energy, ensuring you have enough time and energy to distinguish and accept information."}, {"start": 691.8, "end": 699.89, "text": "2.将更多时间放在精细化的信息获取上，无论是看书听课还是浏览更有质量的文章视频。", "en": "2. Spend more time on refined information acquisition, whether reading books, taking courses, or browsing higher-quality articles and videos."}, {"start": 699.89, "end": 709.01, "text": "3.勤于思考，特别是基于已有事实的思想推演，往往能得到客观事实或者较为准确的预测。", "en": "3. Think diligently, especially ideological deduction based on existing facts, which often yields objective facts or relatively accurate predictions."}, {"start": 709.01, "end": 716.14, "text": "4.尝试浏览与自己既有观点不太相符的干货内容，适度地克服人性以扩展自己的认知。", "en": "4. Try browsing substantive content that does not quite match your existing views, moderately overcoming human nature to expand your cognition."}, {"start": 716.14, "end": 723.22, "text": "5.扩大信息获取的渠道，通过多种渠道组合信息，得到客观真相并作出正确判断。", "en": "5. Expand the channels for obtaining information, and combine information through multiple channels to obtain objective truth and make correct judgments."}, {"start": 723.22, "end": 729.94, "text": "最后说一下，信息茧房并不见得一定是坏事，很多人知道的越多反而越痛苦。", "en": "Finally, the information cocoon is not necessarily a bad thing; the more many people know, the more pain they feel."}, {"start": 729.94, "end": 734.66, "text": "相比之下，活在自洽的小空间里，反而是件比较舒适的事情。", "en": "In comparison, living in a self-consistent little space is a more comfortable thing."}, {"start": 734.66, "end": 741.46, "text": "而如果一位蚕宝宝的茧房破裂，蚕宝宝看到了外面的世界，被迫重建认知的话。", "en": "And if a silkworm's cocoon breaks, and the silkworm sees the outside world and is forced to rebuild its cognition."}, {"start": 741.46, "end": 748.82, "text": "对于蚕宝宝来说，这会是个非常痛苦的经历，但也可能是破茧成蝶和强大的开始。", "en": "For the silkworm, this will be a very painful experience, but it may also be the beginning of breaking out of the cocoon, becoming a butterfly, and becoming strong."}, {"start": 748.82, "end": 750.5, "text": "个人观点，仅供参考。", "en": "Personal views, for reference only."}]}, {"title": "怎样避免活在信息茧房之中？ Part 7（138句，14:29）", "mp3": "upload-8-part07/audio.mp3", "dur": "14:29", "lines": [{"start": 0.0, "end": 8.76, "text": "我很生气，因为我我打开短视频平台刷了好久，推荐的视频一个比一个无聊，我根本看不进去。", "en": "I am very angry, because when I opened short-video platforms and scrolled for a long time, the recommended videos were each more boring than the last, and I simply could not get into them."}, {"start": 8.76, "end": 10.08, "text": "这是怎么了？", "en": "What is going on?"}, {"start": 10.08, "end": 11.57, "text": "你的大数据呢？", "en": "Where is your big data?"}, {"start": 11.57, "end": 12.58, "text": "算法呢？", "en": "Where is the algorithm?"}, {"start": 12.58, "end": 14.3, "text": "个性化推送呢？", "en": "Where is personalised recommendation?"}, {"start": 14.3, "end": 16.06, "text": "对我爱好的精准把控呢？", "en": "Where is the precise grasp of my preferences?"}, {"start": 16.06, "end": 18.77, "text": "拿了我这么多数据，就这？", "en": "You took so much of my data, and this is it?"}, {"start": 18.77, "end": 20.26, "text": "你得支棱起来呀。", "en": "You need to shape up."}, {"start": 20.26, "end": 30.77, "text": "于是我开始一个个手动给那些不喜欢的视频打标记，点不感兴趣，寻找稍微有意思一点的视频，给它们转发点赞评论。", "en": "So I started manually marking the videos I did not like one by one, tapping 'not interested', looking for slightly more interesting videos, and forwarding, liking and commenting on them."}, {"start": 30.77, "end": 33.29, "text": "累了一上午，终于好看点了。", "en": "After a tiring morning, they finally looked a bit better."}, {"start": 33.29, "end": 35.04, "text": "网上有人说了这个现象，", "en": "Someone online described this phenomenon:"}, {"start": 35.04, "end": 40.99, "text": "“我点赞转发评论，不是因为我想点赞转发评论，是因为我怕大数据忘了我”。", "en": "'I like, forward and comment not because I want to like, forward and comment, but because I am afraid big data will forget me'."}, {"start": 40.99, "end": 42.48, "text": "这个说法其实挺有趣的。", "en": "This statement is actually quite interesting."}, {"start": 42.48, "end": 46.56, "text": "大数据搜集所有人的喜好，并不执着于某一个人。", "en": "Big data collects everyone's preferences and is not fixated on any one person."}, {"start": 46.56, "end": 50.45, "text": "你不表达自己的倾向，它就按照别人的喜好去推送了。", "en": "If you do not express your tendencies, it pushes according to other people's preferences."}, {"start": 50.45, "end": 54.05, "text": "会哭的孩子才有奶喝，会养号的用户才有奶头乐。", "en": "The child who cries gets milk; the user who nurtures their account gets pacifying entertainment."}, {"start": 54.05, "end": 61.13, "text": "同样是奶头乐，也分奥力给味的和草莓味的，既然躲不掉，不如让它变成自己喜欢的口味。", "en": "Pacifying entertainment also comes in flavours — Aoli-gei flavour and strawberry flavour. Since you cannot escape it, you might as well make it a flavour you like."}, {"start": 61.13, "end": 70.37, "text": "我的短视频APP打开来，首页都是各种烤肉火锅小龙虾，牛老师打开来，首页都是黑丝小哥哥，半裸小哥哥。", "en": "When I open my short-video app, the homepage is all barbecue, hotpot and crayfish; when Teacher Niu opens his, the homepage is all guys in black stockings and half-naked guys."}, {"start": 70.37, "end": 80.74, "text": "同样的APP，在我们的手里实际上已经变成了完全不同的两种生物，我们的一部分已经融进了平台的算法里，就像基因编码一样记录了我们的灵魂。", "en": "The same app, in our hands, has actually become two completely different creatures. Part of us has melted into the platform's algorithm, recording our souls like genetic code."}, {"start": 80.74, "end": 84.82, "text": "我的那个APP只有给我才最有吸引力，给别人会变成什么东西。", "en": "My app is only most attractive to me; what would it become for someone else?"}, {"start": 84.82, "end": 90.29, "text": "算法只推荐你喜欢的内容，这是一种诡异的忠诚，魔幻的契约。", "en": "The algorithm only recommending content you like is a strange kind of loyalty, a magical contract."}, {"start": 90.29, "end": 91.92, "text": "有点坏，又有点好。", "en": "A bit bad, and a bit good."}, {"start": 91.92, "end": 92.83, "text": "很魔幻。", "en": "Very magical."}, {"start": 92.83, "end": 105.31, "text": "如果有一天，一切都归于混沌，牛老师的陌生人社交APP不推送他最爱的富老头了，富老头都推给我了，对我来说是一种负担，对牛老师来说更是一种背叛。", "en": "If one day everything returns to chaos, and Teacher Niu's stranger-social app no longer pushes his beloved rich old men, but pushes the rich old men to me instead, that would be a burden for me, and even more a betrayal for Teacher Niu."}, {"start": 105.31, "end": 109.8, "text": "所以我仔细筛选，捏紧手里的硬币，吝惜每一个点赞。", "en": "So I screen carefully, clutching the coins in my hand, sparing every like."}, {"start": 109.8, "end": 116.93, "text": "那些不够喜欢的内容，我绝不投币，不是因为我喜欢白嫖，只是不想让大数据误会我和它们的关系。", "en": "Content I do not like enough, I absolutely will not tip — not because I like getting things for free, but because I do not want big data to misunderstand my relationship with them."}, {"start": 116.93, "end": 124.9, "text": "如果你把内容平台的算法理解成一个监视者，搜集你的喜好是为了暗搓搓做坏事，那当然会毛骨悚然。", "en": "If you understand a content platform's algorithm as a watcher, collecting your preferences to secretly do bad things, then of course it feels creepy."}, {"start": 124.9, "end": 128.09, "text": "但我们为什么不能反过来调教大数据呢？", "en": "But why can't we turn around and train big data instead?"}, {"start": 128.09, "end": 135.17, "text": "只要你明白了算法的推送原理，那它可以被你玩儿成一个24小时不睡觉搜集你喜好的舔狗。", "en": "As long as you understand the algorithm's recommendation principle, it can be played by you as a simp that never sleeps, collecting your preferences around the clock."}, {"start": 135.17, "end": 144.12, "text": "你想看什么，它就给你推什么，如果你给的是正反馈，就继续推，加大力度，如果是负反馈，就减少推送，改为其他随机内容。", "en": "Whatever you want to watch, it pushes to you; if you give positive feedback, it keeps pushing, with greater force; if negative feedback, it reduces the pushing and switches to other random content."}, {"start": 144.12, "end": 157.15, "text": "不惜代价和运算量，不惜成本和时间，一点点测试出你的喜好，根据变化实时调整策略，只为了能够让你多看一眼，能够再见你一面。", "en": "Sparing no cost and computing power, sparing no cost and time, testing out your preferences bit by bit, adjusting its strategy in real time according to changes, just so you will look one more time, just so it can see you again."}, {"start": 157.15, "end": 161.83, "text": "这已经不是舔狗精神所能概况的了，舔狗科学。", "en": "This is beyond what simp spirit can summarise — simp science."}, {"start": 161.83, "end": 169.03, "text": "至于这些信息会不会变成你的弱点，拿来投放广告，只要你打死不掏钱，大数据又能拿你怎么样？", "en": "As for whether this information will become your weakness and be used to serve ads, as long as you refuse to pay a cent, what can big data do to you?"}, {"start": 169.03, "end": 174.43, "text": "穷才是最没有破绽的自保方法，我没什么可失去的，那我就是无敌的。", "en": "Being poor is the most flawless method of self-protection: I have nothing to lose, so I am invincible."}, {"start": 174.43, "end": 177.67, "text": "当然，别开通网贷功能。", "en": "Of course, do not activate the online loan function."}, {"start": 177.67, "end": 181.32, "text": "调教信息茧房容易，改变自己的内心很难。", "en": "Training the information cocoon is easy; changing your own heart is hard."}, {"start": 181.32, "end": 194.81, "text": "牛老师有一段时间为了提升自己，开始故意点进那些自己不喜欢的短视频，给根本看不进去的科普内容点赞，给黑丝小哥哥和扭腰跳舞视频点不感兴趣，试图欺骗大数据。", "en": "For a time, Teacher Niu, in order to improve himself, deliberately clicked into short videos he did not like, liked science content he could not get into at all, and tapped 'not interested' on guys in black stockings and waist-twisting dance videos, trying to deceive big data."}, {"start": 194.81, "end": 200.86, "text": "他成功了，几个月后他的首页全是金融一百年，剑桥中国史，东汉生死观。", "en": "He succeeded: a few months later his homepage was all 'One Hundred Years of Finance', Cambridge History of China, and Views on Life and Death in the Eastern Han."}, {"start": 200.86, "end": 204.89, "text": "但他也失败了，因为他骗得了大数据，骗不了自己。", "en": "But he also failed, because he could deceive big data but not himself."}, {"start": 204.89, "end": 208.08, "text": "他哭着对我说，自己还是喜欢小哥哥。", "en": "Crying, he told me he still likes young guys."}, {"start": 208.08, "end": 211.03, "text": "不喜欢就是不喜欢，与大数据无关。", "en": "Not liking something is not liking it, and it has nothing to do with big data."}, {"start": 211.03, "end": 213.72, "text": "这时候，一个魔幻的事情就发生了。", "en": "At this point, a magical thing happened."}, {"start": 213.72, "end": 218.95, "text": "我们都知道自己被算法绑架了，但同时我们也被算法驯化了。", "en": "We all know we have been hijacked by algorithms, but at the same time we have also been tamed by algorithms."}, {"start": 218.95, "end": 225.98, "text": "我的生活不会因为离开这个基地变得更好，也不会因为被牢笼困住变得更差。", "en": "My life will not get better because I leave this base, nor will it get worse because I am trapped in this cage."}, {"start": 225.98, "end": 233.9, "text": "甚至可以这样想，在现实中买房子很难，但是每个人都可以在虚拟世界里建设自己的信息茧房。", "en": "You could even think of it this way: in reality it is hard to buy a house, but everyone can build their own information cocoon in the virtual world."}, {"start": 233.9, "end": 241.63, "text": "无论贫穷富有，贤与不肖，都平等地拥有装修信息茧房的能力，算法公平地对待每一个人。", "en": "Whether poor or rich, worthy or unworthy, all equally have the ability to decorate their information cocoon, and the algorithm treats everyone fairly."}, {"start": 241.63, "end": 250.27, "text": "我的每一个点赞关注转发，都是在挑选自己喜欢的地砖和三合板，建造出合乎心意的房子。", "en": "Every like, follow and forward of mine is choosing my favourite floor tiles and plywood, building a house to my liking."}, {"start": 250.27, "end": 254.35, "text": "如果是老色皮，那么这个房子就是KTV包间的样子。", "en": "If you are an old lecher, then this house looks like a KTV private room."}, {"start": 254.35, "end": 275.47, "text": "如果热爱数学，在漫长的时间里，只给微偏分方程和几何分析点赞，那你的信息茧房会变成菲尔兹风格的，砖石是不定义的原词和公理，支柱是几何和代数，地板砖是解析几何、数论和微积分，装饰物是数学分析，天花板是拓扑学，是群论，是纯粹数学。", "en": "If you love mathematics, and over a long time only like partial differential equations and geometric analysis, then your information cocoon will become Fields-style: its bricks are undefined primitive terms and axioms, its pillars are geometry and algebra, its floor tiles are analytic geometry, number theory and calculus, its decorations are mathematical analysis, and its ceiling is topology, group theory, and pure mathematics."}, {"start": 275.47, "end": 277.32, "text": "这样的信息茧房有什么不好？", "en": "What is wrong with such an information cocoon?"}, {"start": 277.32, "end": 278.71, "text": "谁能说没有营养？", "en": "Who can say it has no nutritional value?"}, {"start": 278.71, "end": 281.66, "text": "只不过大多数人并不喜欢，并不愿意住进去。", "en": "It is just that most people do not like it and are unwilling to live in it."}, {"start": 281.66, "end": 287.95, "text": "就好像读书的时候老师天天说要你好好学习，大家都知道老师说得对，但依然不喜欢。", "en": "It is like when teachers told you every day in school to study hard: everyone knew the teacher was right, but still did not like it."}, {"start": 287.95, "end": 295.1, "text": "不过我又想到了一个很有趣的东西，现在智能手机也不贵，我完全可以买两个手机，用两个账号。", "en": "But then I thought of something very interesting: smartphones are not expensive now, and I could simply buy two phones and use two accounts."}, {"start": 295.1, "end": 301.75, "text": "一个账号都是学习的内容，有益的内容，另一个账号全都是各种人性的低级欲望，五毒俱全。", "en": "One account is all study content and beneficial content; the other account is all kinds of base human desires, complete with all five poisons."}, {"start": 301.75, "end": 309.48, "text": "就好像B站有个梗，叫号已经养好了，首页可以全是骚东西，也可以全是各种科学的东西。", "en": "It is like a Bilibili meme: once the account has been nurtured, the homepage can be all racy stuff, or all kinds of scientific stuff."}, {"start": 309.48, "end": 320.76, "text": "我想自我满足的时候就看第二个手机，我心怀内疚想痛改前非的时候就看第一个手机，在两个不同的信息茧房之间反复横跳。", "en": "When I want to satisfy myself, I watch the second phone; when I feel guilty and want to mend my ways, I watch the first phone, jumping back and forth between two different information cocoons."}, {"start": 320.76, "end": 325.85, "text": "我们逃不出信息茧房，但我们可以在不同的信息茧房之间串门。", "en": "We cannot escape the information cocoon, but we can visit between different information cocoons."}, {"start": 325.85, "end": 330.24, "text": "这个时候，到底是大数据绑架了我，还是我绑架了大数据？", "en": "At this point, is it big data hijacking me, or me hijacking big data?"}, {"start": 330.24, "end": 333.65, "text": "到底是算法控制了我，还是我玩弄了算法？", "en": "Is it the algorithm controlling me, or me playing with the algorithm?"}, {"start": 333.65, "end": 337.13, "text": "是斯德哥尔摩，还是PTSD？", "en": "Is it Stockholm, or PTSD?"}, {"start": 337.13, "end": 339.58, "text": "说实话，我也不知道。", "en": "To be honest, I do not know either."}, {"start": 339.58, "end": 342.77, "text": "这可真是，大数据年代的伦理学啊。", "en": "This is truly the ethics of the big data era."}, {"start": 342.77, "end": 345.65, "text": "今晚就做一个实验，以知乎为例，", "en": "Tonight, do an experiment, taking Zhihu as an example:"}, {"start": 345.65, "end": 350.5, "text": "新建一个账号，接下来的一周，每天给它分配一小时，", "en": "Create a new account, and over the next week, allocate one hour to it each day."}, {"start": 350.5, "end": 357.82, "text": "要点在于——只要发现新号推荐的帖子在大号上已经看过，立刻点不喜欢，原因选择内容低质，", "en": "The key point is — whenever you find that a post recommended by the new account has already been seen on the main account, immediately tap 'dislike' and select 'low-quality content' as the reason."}, {"start": 357.82, "end": 364.66, "text": "如此一周，新号的算法训练便初步完成，你会发现一个完全不同的世界。", "en": "After a week like this, the new account's algorithm training will be preliminarily complete, and you will discover a completely different world."}, {"start": 364.66, "end": 368.98, "text": "其他诸如抖音、快手、小红书之类的APP，也是类似道理。", "en": "Other apps like Douyin, Kuaishou and Xiaohongshu follow similar principles."}, {"start": 368.98, "end": 377.02, "text": "如果有兴趣，可以拿两台手机，同时打开APP，把大号和新号推荐的内容进行对比，", "en": "If you are interested, you can take two phones, open the app on both, and compare what the main account and the new account recommend."}, {"start": 377.02, "end": 382.25, "text": "你会产生一种神奇的感觉：这居然都是我爱逛的虚拟空间？", "en": "You will have a magical feeling: these are all the virtual spaces I love to visit?"}, {"start": 382.25, "end": 386.93, "text": "这个实验可以使普通人直观感受算法推荐时代的神奇，", "en": "This experiment allows ordinary people to intuitively feel the magic of the algorithm recommendation era."}, {"start": 386.93, "end": 391.32, "text": "世界是一面棱镜，在不同人眼中呈现完全不同的样子，", "en": "The world is a prism, presenting a completely different appearance in different people's eyes."}, {"start": 391.32, "end": 397.25, "text": "同样一款APP，在不同人的手上，每天流淌着完全不同的讯息，", "en": "The same app, in different people's hands, flows with completely different messages every day."}, {"start": 397.25, "end": 403.37, "text": "都是抖音，有人听芯片科普，有人听古典音乐，有人看搞笑段子，有人刷擦边视频，", "en": "All on Douyin: some listen to chip science, some listen to classical music, some watch funny jokes, some scroll borderline videos."}, {"start": 403.37, "end": 417.41, "text": "不要说你不知道领导同事的手机算法会推荐什么内容，就连枕边的伴侣，也有不为你所知的一面，在你看不见的地方，偷偷刷某些你难以想象TA会感兴趣的视频，", "en": "Not to mention that you do not know what content your boss's and colleagues' phone algorithms will recommend — even your partner beside your pillow has a side unknown to you, secretly scrolling videos in places you cannot see that you would hardly imagine they are interested in."}, {"start": 417.41, "end": 422.02, "text": "重新部落化，这是移动互联网时代的大趋势，我们无可躲避。", "en": "Re-tribalisation is the major trend of the mobile internet era, and we cannot avoid it."}, {"start": 422.02, "end": 429.1, "text": "但如果你想成为头脑开放之人，如果你不想总是听到一种声音，以下是几条建议，", "en": "But if you want to become an open-minded person, if you do not always want to hear only one voice, here are a few suggestions."}, {"start": 429.1, "end": 434.9, "text": "1、刻意训练围绕自己的信息流，包括文章、短讯、短视频，", "en": "1. Deliberately train the information flow around you, including articles, short messages and short videos."}, {"start": 434.9, "end": 441.86, "text": "在这个时代，被算法推荐内容不可避免，那就要建立训练算法的意识，", "en": "In this era, being recommended content by algorithms is unavoidable, so you must build awareness of training algorithms."}, {"start": 441.86, "end": 454.34, "text": "对具备启发性的内容，释放点赞收藏喜欢标注等正反馈，对试图廉价调动情绪的讯息（名人新闻、明星八卦），果断点击不喜欢之类的负反馈。", "en": "For content that is enlightening, release positive feedback such as likes, favourites and 'like' tags; for messages that try to cheaply stir emotions (celebrity news, star gossip), decisively click 'dislike' and other negative feedback."}, {"start": 454.34, "end": 463.42, "text": "值得一提的是使自己感到不快、但具备一定思考价值的信息，建议不要轻易拒绝这类信息，", "en": "It is worth mentioning that for information that makes you uncomfortable but has some thinking value, it is recommended not to reject it lightly,"}, {"start": 463.42, "end": 467.74, "text": "因为使你不快的观点，往往是让你成长的契机，", "en": "Because views that make you uncomfortable are often the opportunity for your growth,"}, {"start": 467.74, "end": 475.18, "text": "检验一流智力的标准，是头脑中能同时持有两种相反的观点，仍能正常运作。", "en": "The test of a first-rate intelligence is the ability to hold two opposed ideas in the mind at the same time, and still retain the ability to function."}, {"start": 475.18, "end": 484.46, "text": "移动互联网时代，每天有无数信息扑面而来，试图吸引我们的注意力，你选择接收哪些信息，决定未来的生活前景。", "en": "In the mobile internet era, countless pieces of information come at you every day, trying to attract your attention; which information you choose to receive determines your future life prospects."}, {"start": 484.46, "end": 492.26, "text": "把自己想象成君主，每天在现实和网络中映入眼帘的巨量信息，都是呈递给自己的奏折，", "en": "Imagine yourself as a monarch: the huge amount of information that comes into view every day in reality and online is all memorials presented to you."}, {"start": 492.26, "end": 499.51, "text": "平庸之辈不能识别高价值信息，在那些写满垃圾信息的奏折上，徒耗心力，", "en": "Mediocre people cannot identify high-value information, and waste their energy on memorials filled with garbage information."}, {"start": 499.51, "end": 509.66, "text": "成功人士会有意识控制自己接收信息的频带，自动过滤那些垃圾信息，将有限的精力用于批阅高价值奏折，", "en": "Successful people consciously control the frequency band of information they receive, automatically filtering out garbage information, and using their limited energy to review high-value memorials."}, {"start": 509.66, "end": 515.02, "text": "每天在高价值奏折上多花2小时，坚持一年，就会产生巨大差距。", "en": "Spending 2 more hours a day on high-value memorials, persisting for a year, will produce a huge gap."}, {"start": 515.02, "end": 518.78, "text": "2、刻意回归“人找信息”的互联网逻辑，", "en": "2. Deliberately return to the 'people seek information' logic of the internet."}, {"start": 518.78, "end": 530.78, "text": "最近十余年，字节系算法带来互联网底层逻辑之变更，从原先的人找信息（百度一下），到如今的信息找人（算法推荐内容），", "en": "In the past decade or so, ByteDance-style algorithms have changed the underlying logic of the internet, from the original 'people seek information' (Baidu it) to today's 'information seeks people' (algorithm-recommended content)."}, {"start": 530.78, "end": 538.58, "text": "在无数次滑动中，多数人陷入同质信息的茧房，不知不觉被规训，丧失主动寻找信息的能力。", "en": "In countless scrolls, most people fall into homogeneous information cocoons, unconsciously disciplined, losing the ability to actively seek information."}, {"start": 538.58, "end": 540.02, "text": "解决方案是什么？", "en": "What is the solution?"}, {"start": 540.02, "end": 549.26, "text": "一方面是如上一条所说，刻意训练算法，拒绝被推荐垃圾信息；另一方面则是要适当回归“人找信息”的互联网逻辑，", "en": "On one hand, as the previous item says, deliberately train algorithms and refuse to be recommended garbage information; on the other hand, appropriately return to the 'people seek information' logic of the internet."}, {"start": 549.26, "end": 550.75, "text": "具体包括两条，", "en": "Specifically, this includes two points:"}, {"start": 550.75, "end": 555.74, "text": "1）主动检索信息，建立周期性检索高质量信息的习惯，", "en": "1) Actively retrieve information, and establish the habit of periodically retrieving high-quality information."}, {"start": 555.74, "end": 565.7, "text": "2）建立付费获取信息的意识，无论是得到的各种专栏，还是知识星球的私域讯息，抑或付费咨询行业大佬，都可以。", "en": "2) Establish awareness of paying for information, whether it is various columns on Dedao, private-domain messages on Zhishi Xingqiu, or paid consultations with industry leaders — all are fine."}, {"start": 565.7, "end": 568.51, "text": "3、培养使用学术资源的习惯，", "en": "3. Cultivate the habit of using academic resources."}, {"start": 568.51, "end": 575.3, "text": "首先要熟悉本领域主要数据库，比如理科生常用的是Web of Science和IEEE，", "en": "First, familiarise yourself with the main databases in your field; for example, science students commonly use Web of Science and IEEE."}, {"start": 575.3, "end": 579.91, "text": "多数领域，学术资料仍然是最具参考价值的优质信息，", "en": "In most fields, academic materials remain the most valuable high-quality information."}, {"start": 579.91, "end": 589.51, "text": "东土大唐的信息是分层的，越往上，信息广度、信息深度以及信息真实度越强大，", "en": "Information in the Eastern Land of Great Tang is layered: the higher up you go, the greater the breadth, depth and authenticity of information."}, {"start": 589.51, "end": 603.36, "text": "而对信息的宽容度与信息的传播效率成反比，即，越晦涩难懂的知识or信息，监管越松，尺度越大，越通俗易懂的知识or信息，监管越严，尺度越小。", "en": "And tolerance for information is inversely proportional to the efficiency of information dissemination: that is, the more obscure and difficult the knowledge or information, the looser the regulation and the larger the latitude; the more popular and easy-to-understand the knowledge or information, the stricter the regulation and the smaller the latitude."}, {"start": 603.36, "end": 609.24, "text": "从信息宽容度的角度看，学术著作论文＞通俗读物＞音频＞影视剧，", "en": "From the perspective of information tolerance, academic works and papers > popular books > audio > films and TV dramas."}, {"start": 609.24, "end": 621.91, "text": "作为被管理者，可以通过这条规律反推自己的行动策略——如果你想了解更接近真实的信息，必须探索那些晦涩难懂的区域，因为那里的污染程度较轻。", "en": "As a managed person, you can use this rule to infer your own action strategy — if you want to understand information closer to the truth, you must explore those obscure and difficult areas, because the pollution there is lighter."}, {"start": 621.91, "end": 627.62, "text": "4、为这句话单列一条——“使你不快的观点，往往是让你成长的契机”，", "en": "4. Give this sentence its own item — 'Views that make you uncomfortable are often the opportunity for your growth'."}, {"start": 627.62, "end": 639.02, "text": "所谓信息茧房，所谓回音室效应，都在说这个道理：一旦认定某种观点，就不自觉地执着于相似的理论，看得越多越坚信不疑，", "en": "The so-called information cocoon and echo chamber effect all speak to this truth: once you affirm a certain view, you unconsciously cling to similar theories, and the more you read, the more convinced you become."}, {"start": 639.02, "end": 649.15, "text": "这时再看到不同观点，会不自觉地生出一种抵触情绪，膝跳反应般地用阴谋论之类的逻辑来解释，质疑对方的立场和动机，", "en": "When you then see different views, you unconsciously develop a resistance, reflexively using conspiracy theories and similar logic to explain them, questioning the other party's position and motives."}, {"start": 649.15, "end": 651.98, "text": "我总以为这其中有某种心理投射效应，", "en": "I always think there is some kind of psychological projection effect in this."}, {"start": 651.98, "end": 659.11, "text": "即，认知较低的家伙一旦对某种理论表示信服，就会不自觉地将自身投射到这理论上，", "en": "That is, once a person with lower cognition expresses belief in a certain theory, they unconsciously project themselves onto that theory."}, {"start": 659.11, "end": 665.18, "text": "看到反对观点，就会不假思索地觉得自己受到了侮辱，觉得对方是在骂自己。", "en": "Seeing opposing views, they think without hesitation that they have been insulted, feeling that the other party is scolding them."}, {"start": 665.18, "end": 671.42, "text": "其实这种现象很常见，不管是饭圈的明星，还是体育圈的球星，甚至著名历史人物，", "en": "Actually, this phenomenon is very common, whether it is celebrities in fan circles, stars in sports circles, or even famous historical figures."}, {"start": 671.42, "end": 682.06, "text": "共性是——将自身投射于某种理论、某位名人，想象出一个虚幻的偶像，不允许任何人对其有一丝批评。", "en": "The common thread is — projecting oneself onto a certain theory or celebrity, imagining an illusory idol, and not allowing anyone the slightest criticism of it."}, {"start": 682.06, "end": 691.78, "text": "这种行为的本质，是自身不具备主体性，于是将自己希冀的特点和能力寄托于理论or名人，将其神格化。", "en": "The essence of this behaviour is that one lacks subjectivity, and so pins the characteristics and abilities one hopes for onto a theory or celebrity, deifying them."}, {"start": 691.78, "end": 695.3, "text": "本质上是没有建立自我，没有真正想做的事情，", "en": "Essentially, it is not having established a self, not having something one truly wants to do."}, {"start": 695.3, "end": 701.74, "text": "面对虚无的恐惧，总想找一个救命稻草，抓住后就不允许别人有一丝批评。", "en": "Facing the fear of nothingness, one always wants to find a life-saving straw, and once grasped, will not allow others the slightest criticism of it."}, {"start": 701.74, "end": 711.65, "text": "建议将这种迹象作为提醒自己的信号，一旦出现，就要问问自己，是否陷入了信息茧房，是否将观点与自身绑定？", "en": "It is recommended to use this sign as a reminder to yourself: once it appears, ask yourself whether you have fallen into an information cocoon, and whether you have bound your views to yourself."}, {"start": 711.65, "end": 735.77, "text": "5、区分如下几个基本概念，“事实”（fact）、“观点”(opinion)、“立场”（position）和“理论”（theory），", "en": "5. Distinguish the following basic concepts: 'fact', 'opinion', 'position' and 'theory'."}, {"start": 735.77, "end": 740.09, "text": "这可以助你判断互联网上各种声音的可信度，", "en": "This can help you judge the credibility of various voices on the internet."}, {"start": 740.09, "end": 741.48, "text": "何为“事实”？", "en": "What is a 'fact'?"}, {"start": 741.48, "end": 749.64, "text": "答：外界给定的材料，是人类思考之素材，在此时此刻，它不会随着你的思考结论的变化而变化。", "en": "Answer: material given by the outside world, the raw material of human thought; at this moment, it does not change with changes in your thinking conclusions."}, {"start": 749.64, "end": 751.03, "text": "何为“观点”?", "en": "What is an 'opinion'?"}, {"start": 751.03, "end": 769.44, "text": "答：根据外界给定材料，每个人思考后（甚至不经思考后）得出的结论，它可以在下一秒就发生180度逆转。", "en": "Answer: conclusions drawn by each person after thinking (
