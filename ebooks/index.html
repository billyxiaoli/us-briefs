on."}, {"start": 70.54, "end": 72.77, "text": "所以，解决方法也非常直接：", "en": "So, the solution is also very direct:"}, {"start": 72.77, "end": 75.72, "text": "少居家办公，多面对面接触。", "en": "Work from home less, and have more face-to-face contact."}, {"start": 75.72, "end": 78.6, "text": "这样可以增加被动、随机的信息；", "en": "This can increase passive, random information;"}, {"start": 78.6, "end": 80.11, "text": "关闭算法推荐。", "en": "Turn off algorithmic recommendations."}, {"start": 80.11, "end": 83.47, "text": "像B站除了推荐页面之外，还有分区视频；", "en": "Like Bilibili, besides the recommendation page, there are also section videos;"}, {"start": 83.47, "end": 84.48, "text": "多读书。", "en": "Read more books."}, {"start": 84.48, "end": 87.55, "text": "相比于知乎的回答，书籍通常更为全面。", "en": "Compared with Zhihu answers, books are usually more comprehensive."}, {"start": 87.55, "end": 91.03, "text": "而「全面」恰恰也能破除茧房；", "en": "And 'comprehensive' precisely can also break the cocoon;"}, {"start": 91.03, "end": 92.76, "text": "订阅杂志、播客。", "en": "Subscribe to magazines and podcasts."}, {"start": 92.76, "end": 97.49, "text": "虽然这也是你的主动选择，但具体的内容则是创作者的选择。", "en": "Although this is also your active choice, the specific content is the creator's choice."}, {"start": 97.49, "end": 99.96, "text": "所以只需要在一开始注意一下广度就可以了。", "en": "So you only need to pay attention to breadth at the beginning."}, {"start": 99.96, "end": 105.53, "text": "我每个周日都会跟我妈换手机用一天，坚持半年了，现在母慈子孝。", "en": "Every Sunday I swap phones with my mum for a day. I have kept it up for half a year, and now mother is kind and child is filial."}, {"start": 105.53, "end": 106.97, "text": "别“刷”手机", "en": "Don't 'scroll' your phone."}, {"start": 106.97, "end": 118.54, "text": "以知乎为例，给个人的所有推送都是按照个人爱好和情感来的，几乎给你推送的每个回答你都想骂两句或者夸两句，这样通过限制问题来获得你的反馈", "en": "Take Zhihu as an example: all pushes to individuals are based on personal preferences and emotions; almost every answer pushed to you makes you want to curse a couple of sentences or praise a couple of sentences, in this way obtaining your feedback by restricting the questions."}, {"start": 118.54, "end": 123.77, "text": "再比如，目前的个人主页可以简要分为左和右两种。", "en": "For another example, the current personal homepage can be briefly divided into two types: left and right."}, {"start": 123.77, "end": 132.12, "text": "有的人刷出来的内容都是爱国，国家很棒，正能量；还有的人刷出来的都是顶真 越南 谷爱凌。", "en": "Some people scroll and all they get is patriotism, the country is great, positive energy; others scroll and all they get is Dingzhen, Vietnam, Eileen Gu."}, {"start": 132.12, "end": 135.65, "text": "当然，我是后者，估计刷到我这个回答的人都是后者。", "en": "Of course, I am the latter, and presumably people who scroll to this answer of mine are also the latter."}, {"start": 135.65, "end": 143.69, "text": "所以要想摆脱这种影响，拜托这种发泄情绪的无意义重复性动作，不要看主页是个十分不错的办法。", "en": "So to escape this influence, and to get rid of this meaningless repetitive act of venting emotions, not looking at the homepage is quite a good method."}, {"start": 143.69, "end": 148.18, "text": "毕竟不是所有人都可以把b站贴吧知乎微博全部删掉还能活下去的", "en": "After all, not everyone can delete Bilibili, Tieba, Zhihu and Weibo entirely and still survive."}, {"start": 148.18, "end": 157.06, "text": "同一件事，我一般都是知乎和quora、哔哩哔哩和utube对比着看，那很多事就明了挺多了", "en": "For the same matter, I generally compare Zhihu with Quora, and Bilibili with YouTube; then many things become much clearer."}, {"start": 157.06, "end": 162.53, "text": "T_T 我来睡前搞怪一下吧，分享几个我自己喜欢干的事。", "en": "T_T Let me be silly before bed, and share a few things I like to do myself."}, {"start": 162.53, "end": 167.45, "text": "(1) 搜搜几年前的热搜，看看当年的大事后来怎么样了。", "en": "(1) Search for hot searches from a few years ago, and see what happened later to the big events of those years."}, {"start": 167.45, "end": 172.3, "text": "比如，当年号称能颠覆行业的技术，现在落地了吗？", "en": "For example, technology that was claimed to disrupt the industry back then — has it been implemented now?"}, {"start": 172.3, "end": 176.26, "text": "曾经闹得沸沸扬扬的争议，最后有什么调查结果？", "en": "Controversies that caused a huge uproar — what investigation results were there in the end?"}, {"start": 176.26, "end": 182.86, "text": "很多新闻只报道事情发生时的情况，后续发展和最终结果反而很少有人关注。", "en": "Many news stories only report the situation when things happen; follow-up developments and final results receive little attention."}, {"start": 182.86, "end": 187.42, "text": "(2) 看到很多博主讨论同一件事，可以查查他们的消息来源。", "en": "(2) When you see many bloggers discussing the same matter, you can check their sources of information."}, {"start": 187.42, "end": 196.18, "text": "比如，十几个博主都在转发一条新闻，看起来有很多人证实，但追溯来源后，可能发现他们都引用了同一篇报道。", "en": "For example, a dozen or so bloggers are all forwarding a piece of news, and it looks like many people have confirmed it, but after tracing the source, you may find they all cited the same report."}, {"start": 196.18, "end": 200.9, "text": "消息被重复传播很多次，并不代表它得到了独立验证。", "en": "A message being repeatedly spread many times does not mean it has been independently verified."}, {"start": 200.9, "end": 204.91, "text": "(3) 看到成功案例时，也去看看失败的案例。", "en": "(3) When you see success stories, also look at failure stories."}, {"start": 204.91, "end": 210.84, "text": "比如，有人靠 AI 创业赚了几千万，就去看看那些创业失败的人。", "en": "For example, someone made tens of millions starting a business with AI — go and look at those who failed in business."}, {"start": 210.84, "end": 216.31, "text": "成功案例更容易传播，只看这些故事，很容易高估成功的概率。", "en": "Success stories spread more easily; only looking at these stories makes it easy to overestimate the probability of success."}, {"start": 216.31, "end": 220.46, "text": "(4) 看到热门观点，可以查查提出者以前的判断。", "en": "(4) When you see popular views, you can check the proposer's past judgments."}, {"start": 220.46, "end": 226.27, "text": "比如，找出某位专家五年前的预测，看看如今有多少应验了。", "en": "For example, find an expert's predictions from five years ago, and see how many have come true now."}, {"start": 226.27, "end": 233.78, "text": "因为很多人更愿意谈论自己预测成功的经历，只听他们现在的说法，很容易高估其判断能力。", "en": "Because many people prefer to talk about their successful predictions; only listening to what they say now makes it easy to overestimate their judgment ability."}, {"start": 233.78, "end": 236.66, "text": "(5) 多看看一线从业者的实际经历。", "en": "(5) Look more at the actual experiences of front-line practitioners."}, {"start": 236.66, "end": 244.78, "text": "比如，了解新能源汽车，可以看看维修师傅遇到的故障；了解 AI 编程，可以看看工程师遇到的问题。", "en": "For example, to understand new energy vehicles, you can look at the faults repair technicians encounter; to understand AI programming, you can look at the problems engineers encounter."}, {"start": 244.78, "end": 249.05, "text": "宣传往往强调优势，实际使用才能暴露问题。", "en": "Publicity often emphasises advantages; actual use is what exposes problems."}, {"start": 249.05, "end": 252.7, "text": "(6) 看到惊人的数据，先查清统计背景。", "en": "(6) When you see astonishing data, first check the statistical background."}, {"start": 252.7, "end": 261.98, "text": "比如，某种疾病的发病人数增加了多少、某个行业裁员了多少人，都要结合总体规模、统计口径和历史数据来看。", "en": "For example, by how much the number of cases of a certain disease has increased, or how many people an industry has laid off — all must be viewed together with overall scale, statistical calibre and historical data."}, {"start": 261.98, "end": 265.54, "text": "单看一个数字，很容易误判事情的严重程度。", "en": "Looking at a single number alone makes it easy to misjudge the severity of things."}, {"start": 265.54, "end": 269.81, "text": "(7) 多看看新闻更正声明和学术论文的撤稿记录。", "en": "(7) Look more at news correction statements and retraction records of academic papers."}, {"start": 269.81, "end": 277.44, "text": "比如，去 Retraction Watch 看看最近有哪些论文被撤稿，或者查查新闻媒体的更正记录。", "en": "For example, go to Retraction Watch to see which papers have recently been retracted, or check news media correction records."}, {"start": 277.44, "end": 284.33, "text": "很多曾经广泛传播的结论后来被纠正了，但看到更正的人往往比看到原消息的人少得多。", "en": "Many conclusions that were once widely spread were later corrected, but far fewer people see the corrections than saw the original news."}, {"start": 284.33, "end": 292.61, "text": "Anyway，个人认为，跳出信息茧房，最根本的是学会区分一件事在现实中发生的概率，和它被自己看到的概率。", "en": "Anyway, personally I believe that to jump out of the information cocoon, the most fundamental thing is to learn to distinguish the probability of something happening in reality from the probability of it being seen by yourself."}, {"start": 292.61, "end": 306.41, "text": "否则，我们很容易把反复看到的当成普遍存在的，把很少看到的当成无足轻重的，哪怕换了平台、换了算法，也不过是换一种方式误解世界。", "en": "Otherwise, we easily take what we see repeatedly as universally existing, and what we rarely see as insignificant — even if we change platforms and algorithms, it is only misunderstanding the world in a different way."}, {"start": 306.41, "end": 308.09, "text": "文 | 佘宗明", "en": "Text | She Zongming"}, {"start": 308.09, "end": 315.7, "text": "在当下，有两个舶来的传播学概念近乎被用烂，一个是“娱乐至死”，另一个是“信息茧房”。", "en": "At present, there are two imported communication concepts that have been almost used to death: one is 'amusing ourselves to death', and the other is 'information cocoon'."}, {"start": 315.7, "end": 325.82, "text": "这两个词本来有其特定的适用情境，可很多人总是拿着搜索出的词条解释四处对号入座，将其据为大批判的话语武器。", "en": "These two terms originally had their specific applicable contexts, but many people always take dictionary explanations they searched for and apply them everywhere, appropriating them as discursive weapons for grand criticism."}, {"start": 325.82, "end": 335.54, "text": "在“深刻癖”的引路下，他们动辄抡起道德皮鞭，以反“娱乐至死”的名义反娱乐，以批“信息茧房”的名义批算法。", "en": "Under the guidance of a 'profundity fetish', they readily wield the moral whip, opposing entertainment in the name of opposing 'amusing ourselves to death', and criticising algorithms in the name of criticising 'information cocoons'."}, {"start": 335.54, "end": 342.5, "text": "不得不说，这番景象本就是在娱（消）乐（遣）“娱乐至死”，也表明“认知茧房”真的存在。", "en": "It must be said that this spectacle is itself entertaining (diverting) 'amusing ourselves to death', and also shows that 'cognitive cocoons' really exist."}, {"start": 342.5, "end": 356.3, "text": "就拿“信息茧房”来说，这年头，面对民粹、饭圈、打着男权/女权名义的两性对立几股极端势力的肆虐，很多人总是倾向归咎于信息茧房。", "en": "Take 'information cocoon' as an example: nowadays, in the face of the rampage of several extreme forces — populism, fan circles, and gender opposition in the name of men's rights/women's rights — many people always tend to blame the information cocoon."}, {"start": 356.3, "end": 368.02, "text": "秦朗巴黎丢作业事件中出现偏听盲信现象，怪信息茧房；胖猫事件中出现“厌女VS仇男”群际撕裂景象，怪信息茧房…", "en": "In the Qin Lang Paris lost-homework incident, there was a phenomenon of listening only to one side and blindly believing — blame the information cocoon; in the Fat Cat incident, there was a scene of 'misogyny vs misandry' inter-group tearing — blame the information cocoon…"}, {"start": 368.02, "end": 373.42, "text": "在许多社会事件引发舆论内耗后，“信息茧房”也经常被迫承受了所有。", "en": "After many social events trigger public opinion infighting, 'information cocoon' is also often forced to bear everything."}, {"start": 373.42, "end": 385.82, "text": "在某些人看来，是“信息茧房”将人们困在回音室里，让人们看到的都是自己想看到的、听到的都是自己想听到的，才导致人们越来越自以为是、极端偏执。", "en": "In some people's view, it is the 'information cocoon' that traps people in echo chambers, making people see only what they want to see and hear only what they want to hear, which causes people to become increasingly self-righteous and extremely paranoid."}, {"start": 385.82, "end": 392.54, "text": "“遇事不决，量子力学；归因无方，信息茧房”，已成时髦的归纳总结法。", "en": "'When in doubt about anything, quantum mechanics; when at a loss for attribution, information cocoon' has become a fashionable summary method."}, {"start": 392.54, "end": 403.18, "text": "左一个“信息茧房有多可怕”，右一个“信息茧房是围猎认知的隐秘陷阱”，“信息茧房”正被吊打1008610010遍。", "en": "One 'how terrible is the information cocoon' after another, and one 'information cocoon is a secret trap for hunting cognition' after another — 'information cocoon' is being flogged 1008610010 times."}, {"start": 403.18, "end": 418.7, "text": "有意思的是，我上网搜“信息茧房”，发现很多惯于贩卖焦虑的营销号都开始将“信息茧房”跟“高认知”等鸡汤文话术、“毁掉一代人”等毁掉体句式一锅烩，生怕大众的焦虑值还没爆表。", "en": "Interestingly, when I searched 'information cocoon' online, I found that many marketing accounts accustomed to selling anxiety have begun to mix 'information cocoon' with 'high cognition' and other chicken-soup phrases, and 'ruining a generation' and other 'ruining' sentence patterns, in one pot, afraid that the public's anxiety level has not yet exploded."}, {"start": 418.7, "end": 426.7, "text": "在“后真相时代”满天飞、“网络巴尔干化”遍地跑的今日，担心人们失去开放的意识和兼听的能力，很正常。", "en": "In today's world where the 'post-truth era' flies everywhere and 'internet Balkanisation' runs rampant, worrying that people will lose open awareness and the ability to listen to all sides is normal."}, {"start": 426.7, "end": 433.61, "text": "问题是，所谓的“信息茧房”，到底是真实存在的“赛博囚笼”，还是想象出来的稻草人议题？", "en": "The question is: is the so-called 'information cocoon' a real 'cyber prison', or an imagined straw-man issue?"}, {"start": 433.61, "end": 440.4, "text": "当批判“信息茧房”的终点是反技术的卢德主义时，这确定不是困在自己的偏狭里？", "en": "When the endpoint of criticising the 'information cocoon' is anti-technology Luddism, is this certainly not being trapped in one's own narrowness?"}, {"start": 440.4, "end": 441.67, "text": "01", "en": "01"}, {"start": 441.67, "end": 451.87, "text": "甲跟乙说的是A，乙跟丙说甲说的是A+B，丙于是以为甲说的是B，这是信息传播中常见的谬传场景。", "en": "A tells B that it is A; B tells C that A said A+B; C then thinks A said B. This is a common miscommunication scenario in information transmission."}, {"start": 451.87, "end": 455.18, "text": "现在看，“信息茧房”也遭遇了这样的谬传。", "en": "Now, 'information cocoon' has also suffered such miscommunication."}, {"start": 455.18, "end": 462.91, "text": "追溯其前世今生会发现，最早被桑斯坦提出的“信息茧房”，在今天已脱离原有语境被人重新定义。", "en": "Tracing its past and present, we find that the 'information cocoon' first proposed by Sunstein has now been redefined out of its original context."}, {"start": 462.91, "end": 471.36, "text": "18年前，桑斯坦在《信息乌托邦》中提出“信息茧房”一词时，互联网还处在Web1.0阶段。", "en": "18 years ago, when Sunstein proposed the term 'information cocoon' in Information Utopia, the internet was still in the Web 1.0 stage."}, {"start": 471.36, "end": 480.17, "text": "当时包括尼葛洛庞帝在内的不少大神都预言，个性化定制的“我的日报”（The Daily Me）将会出现。", "en": "At that time, many great minds, including Negroponte, predicted that a personalised 'My Daily' (The Daily Me) would appear."}, {"start": 480.17, "end": 482.76, "text": "桑斯坦亦在此列。", "en": "Sunstein was also among them."}, {"start": 482.76, "end": 497.09, "text": "他认为，互联网的确为公众提供了“资讯汪洋”，但人们接触信息不是全盘接收，而是根据个人喜好选择性吸收，这可能会将自身桎梏于蚕茧般的“茧房”中。", "en": "He believed that although the internet did provide the public with an 'ocean of information', people's contact with information is not wholesale reception, but selective absorption according to personal preference, which might confine them in a silkworm-like 'cocoon'."}, {"start": 497.09, "end": 505.56, "text": "桑斯坦确实将“信息茧房”跟互联网时代背景联系在了一起，但他认为“信息茧房”症结在于“信息偏食”。", "en": "Sunstein did indeed link 'information cocoon' with the internet-era background, but he believed the crux of 'information cocoon' lies in 'information picky eating'."}, {"start": 505.56, "end": 514.75, "text": "信息偏食跟传播学中的“选择性接触”、心理学中的“确认偏误”有相通之处，本质是依托人脑“过滤罩”的自我保护机制。", "en": "'Information picky eating' has similarities with 'selective exposure' in communication studies and 'confirmation bias' in psychology; its essence is a self-protection mechanism relying on the brain's 'filter'."}, {"start": 514.75, "end": 523.58, "text": "信息爆炸跟脑容量有限的矛盾，是人们长期面临的难题，但数字社会的到来让它变得更为显著。", "en": "The contradiction between information explosion and limited brain capacity is a long-standing problem for people, but the arrival of digital society has made it more pronounced."}, {"start": 523.58, "end": 533.38, "text": "定位学大师杰克·特劳特在《与众不同》中就讲到：过去30年人类社会产生的信息比之前5000年产生的信息还多。", "en": "Positioning master Jack Trout said in Differentiate or Die: in the past 30 years, human society has produced more information than in the previous 5,000 years."}, {"start": 533.38, "end": 541.58, "text": "梁永安老师也说过，现在的年轻人十几岁时获得的知识和信息，可能比一个古人在60岁时知道的还多。", "en": "Teacher Liang Yong'an also said that the knowledge and information young people now obtain in their teens may be more than an ancient person knew at 60."}, {"start": 541.58, "end": 548.71, "text": "为了避免信息过载，脑部会基于人的喜同恶异、趋利避害本性自动开启信息筛选。", "en": "To avoid information overload, the brain automatically starts information screening based on people's nature of liking the same and disliking the different, and seeking benefit and avoiding harm."}, {"start": 548.71, "end": 554.28, "text": "也因为是本性，信息偏食的情况在任何时候都存在，包括Web1.0时代。", "en": "Also because it is nature, information picky eating exists at all times, including in the Web 1.0 era."}, {"start": 554.28, "end": 565.51, "text": "这类不是照单全收而是有所筛选的信息接收模式，正面看，是将人带到认知舒适区里；负面看，是把人带入认知板结化状态。", "en": "This information reception model of not accepting everything but screening is, viewed positively, bringing people into a cognitive comfort zone; viewed negatively, bringing people into a state of cognitive hardening."}, {"start": 565.51, "end": 576.36, "text": "这反映了信息偏食的两面性：A面是对信息负荷超标的抵御，能够帮脑部减压；B面是对“异文化视野”的抑制，容易导致思维局限。", "en": "This reflects the two sides of information picky eating: side A is resistance to information overload exceeding the limit, which can help the brain decompress; side B is suppression of 'heterogeneous cultural horizons', which easily leads to limited thinking."}, {"start": 576.36, "end": 582.6, "text": "结合信息过载的情境看，A面的正向作用其实要大于B面的负面效应。", "en": "Combined with the context of information overload, the positive effect of side A is actually greater than the negative effect of side B."}, {"start": 582.6, "end": 594.24, "text": "而现在网上流行的“信息茧房”，更多的是强调茧房是互联网信息供给模式和传递路径的产物，认为信息技术是因、信息偏食是果。", "en": "And the 'information cocoon' popular online now places more emphasis on the cocoon being a product of the internet information supply model and transmission path, believing information technology is the cause and information picky eating is the effect."}, {"start": 594.24, "end": 599.11, "text": "将算法推荐跟信息茧房嵌入因果链中，就是常见的归因。", "en": "Embedding algorithmic recommendation and information cocoon in a causal chain is a common attribution."}, {"start": 599.11, "end": 610.92, "text": "这大概是桑斯坦始料未及的：他将“信息茧房”的生成原因归为信息偏食而非信息技术，他提出信息茧房时算法技术也还没大面积应用。", "en": "This is probably beyond what Sunstein expected: he attributed the cause of the information cocoon to information picky eating rather than information technology, and when he proposed the information cocoon, algorithm technology had not yet been widely applied."}, {"start": 610.92, "end": 611.95, "text": "02", "en": "02"}, {"start": 611.95, "end": 616.56, "text": "那，互联网到底会不会让人们的视野收窄？", "en": "So, will the internet narrow people's horizons?"}, {"start": 616.56, "end": 620.64, "text": "信息技术是不是会加剧人们的信息偏食习惯？", "en": "Will information technology aggravate people's information picky eating habits?"}, {"start": 620.64, "end": 622.49, "text": "目前看来，争议不小。", "en": "At present, the controversy is considerable."}, {"start": 622.49, "end": 626.88, "text": "就连“信息茧房”情况是否存在，学界都不乏争论。", "en": "Even whether the 'information cocoon' situation exists is much debated in academia."}, {"start": 626.88, "end": 635.95, "text": "在知乎上的“如何理解【信息茧房】”问题下面，大V答主“苏伦”就说道，我们惯于使用的“信息茧房”只是个伪概念。", "en": "Under the Zhihu question 'How to understand [information cocoon]', big-V answerer 'Su Lun' said that the 'information cocoon' we habitually use is just a pseudo-concept."}, {"start": 635.95, "end": 666.62, "text": "他在帖中说出了几个观点：1，信息偏食是人的本性，在传统媒体时代就开始有了，在没有个性化算法的时代，我们看报纸杂志，碰到不感兴趣的也会跳过去；2，网络并非无菌室，而是芜杂交融的信息环境，互联网打破了信息封闭局面；3，信息偏食后果没那么严重，只是人们在信息不对称情况下天生会对新技术带来的改变过分戒备。", "en": "He put forward several views in his post: 1, information picky eating is human nature, which began in the traditional media era; in an era without personalised algorithms, when we read newspapers and magazines, we would skip things we were not interested in; 2, the internet is not a sterile room, but a mixed and blended information environment; the internet has broken the closed information situation; 3, the consequences of information picky eating are not so serious — it is just that people, under information asymmetry, are naturally overly wary of changes brought by new technology."}, {"start": 666.62, "end": 675.22, "text": "认为“信息茧房”是个似是而非的伪命题的，在学界不乏其人，如国内传播学界两位知名学者陈昌凤和喻国明。", "en": "Those who consider 'information cocoon' a specious pseudo-proposition are not few in academia, such as two well-known scholars in domestic communication studies, Chen Changfeng and Yu Guoming."}, {"start": 675.22, "end": 681.26, "text": "他们都曾表示，“信息茧房”的假说在学术性实证研究中从未被证实过。", "en": "They have both said that the 'information cocoon' hypothesis has never been confirmed in academic empirical research."}, {"start": 681.26, "end": 691.63, "text": "在我看来，“信息茧房”确实很容易引发大众共鸣，因为它挠到了很多人的痒点：对“大众传播-分众传播-窄众传播”的信息传", "en": "In my view, 'information cocoon' does indeed easily resonate with the public, because it scratches many people's itch: the information transmission of 'mass communication – segmented communication – narrowcast communication'…"}, {"start": 691.63, "end": 709.32, "text": "无论如何，互联网有没有造成“信息茧房”，得多维度而非单向度地考量：互联网时代的信息多元与窄众传播等复杂结构在“造茧/破茧”上的对冲作用，使得互联网导致“信息茧房”的全称命题显得有些武断。", "en": "In any case, whether the internet has caused an 'information cocoon' must be considered in multiple dimensions rather than a single dimension: the hedging effect of the internet era's diverse information and narrowcast communication and other complex structures on 'cocoon-making/cocoon-breaking' makes the blanket proposition that the internet causes an 'information cocoon' seem somewhat arbitrary."}, {"start": 709.32, "end": 723.67, "text": "耐人寻味的是，“信息茧房”研究向来是西冷中热：资料显示，截至2020年2月6日，中国学者已在CNKI文献库中发表584篇以“信息茧房”为主题的文章。", "en": "It is worth pondering that 'information cocoon' research has always been cold in the West and hot in China: data shows that as of 6 February 2020, Chinese scholars had published 584 articles on the theme of 'information cocoon' in the CNKI literature database."}, {"start": 723.67, "end": 742.51, "text": "同时段内，国内的Web of Science数据库中发表的以“information cocoons（信息茧房）”为主题的文献只有1篇，讨论“echo chamber（信息回音室）”“filter bubble（过滤气泡）”的也微乎其微。", "en": "In the same period, only 1 article on the theme of 'information cocoons' was published in the domestic Web of Science database, and discussions of 'echo chamber' and 'filter bubble' were also minimal."}, {"start": 742.51, "end": 749.11, "text": "难不成“信息茧房”也“橘生淮南则为橘，生于淮北则为枳”了？", "en": "Could it be that 'information cocoon' also follows 'oranges grown south of the Huai are oranges, but grown north of the Huai they become trifoliate oranges'?"}, {"start": 749.11, "end": 750.36, "text": "03", "en": "03"}, {"start": 750.36, "end": 756.72, "text": "颇堪玩味的是，有的人对“信息茧房”的批评经常会通向对算法技术的猎巫。", "en": "What is quite worth pondering is that some people's criticism of the 'information cocoon' often leads to a witch hunt against algorithm technology."}, {"start": 756.72, "end": 762.17, "text": "算法原理他们未必懂，但“奶头乐”学说是他们流行的理论武装。", "en": "They may not understand algorithm principles, but the 'tittytainment' doctrine is their popular theoretical weapon."}, {"start": 762.17, "end": 768.72, "text": "算法是根据兴趣推荐，会过滤掉不感兴趣的异质内容，可不就是制造“信息茧房”的推手吗？", "en": "Algorithms recommend based on interest and filter out heterogeneous content one is not interested in — isn't that the pusher creating the 'information cocoon'?"}, {"start": 768.72, "end": 770.33, "text": "这是他们的惯有认知。", "en": "This is their habitual cognition."}, {"start": 770.33, "end": 778.01, "text": "他们以为的算法就是：我喜欢什么观点，算法就拼命给我推什么观点，帮我屏蔽反向观点。", "en": "The algorithm they imagine is: whatever viewpoint I like, the algorithm desperately pushes me that viewpoint, helping me block opposing viewpoints."}, {"start": 778.01, "end": 784.44, "text": "算法要是会说话，估计恨不得击鼓鸣冤：我没这么弱智，你没这么无辜。", "en": "If algorithms could speak, they would probably want to beat drums and cry out injustice: I am not that stupid, and you are not that innocent."}, {"start": 784.44, "end": 853.13, "text": "做点科普：算法模型包括协同过滤算法、监督学习算法Logistic Regression、深度学习、Factorization Machine、GBDT等，许多人理解的兴趣匹配，不是基于单一维度去分析，什么内容的语义特征（关键词、Topic、实体词）、文本相似性特征、时空特征，什么用户的聚类、性别、年龄、地点等身份特征和过滤噪声、热点惩罚、时间衰减、惩罚展现等，都会成为分析指标。", "en": "Some popular science: algorithm models include collaborative filtering algorithms, supervised learning algorithms Logistic Regression, deep learning, Factorization Machine, GBDT, and so on. What many people understand as interest matching is not analysed based on a single dimension — what content semantic features (keywords, topics, entity words), text similarity features, spatiotemporal features, what user clustering, gender, age, location and other identity features, and filtering noise, hotspot penalties, time decay, impression penalties, etc., all become analysis indicators."}, {"start": 853.13, "end": 863.76, "text": "算法不会简单粗暴地认为某个人喜欢1就不给他推2，而是会用多样化信息来覆盖人们多元、善变和阈值持续提升的兴趣点。", "en": "Algorithms do not crudely assume that if a person likes 1, they will not be pushed 2; instead, they use diverse information to cover people's diverse, changeable interests and continuously rising thresholds."}, {"start": 863.76, "end": 871.32, "text": "毕竟，不是每个人都知道自己会对哪些事物感兴趣，就算知道人的兴趣也可能因时因地而变。", "en": "After all, not everyone knows what they will be interested in, and even if they know, people's interests may change with time and place."}, {"start": 871.32, "end": 885.43, "text": "如果你细看算法推荐内容就会发现，算法不光会推来你喜欢的篮球运动员詹姆斯，还会推荐乔丹库里姚明，推荐C罗李娜林丹，更多文体娱教内容都可能推到你面前。", "en": "If you look closely at algorithm-recommended content, you will find that algorithms not only push you your favourite basketball player James, but also recommend Jordan, Curry and Yao Ming, recommend Cristiano Ronaldo, Li Na and Lin Dan — more cultural, sports, entertainment and education content may be pushed before you."}, {"start": 885.43, "end": 894.91, "text": "用户怕接收的信息单一化，平台同样怕供给的信息单一化，那样无益于用户长期留存，所以平台会持续对算法加以优化——", "en": "Users fear receiving homogenised information, and platforms likewise fear supplying homogenised information, which is not conducive to long-term user retention, so platforms continue to optimise algorithms —"}, {"start": 894.91, "end": 904.08, "text": "谷歌浏览器推出了“逃离泡沫”的插件，可以根据用户的阅读习惯，反向推荐调性积极、易于接受的内容。", "en": "Google Chrome launched an 'Escape the Bubble' plugin, which can reversely recommend content with a positive tone and easy to accept based on users' reading habits."}, {"start": 904.08, "end": 916.85, "text": "新闻类APP“跨越分歧的阅读”(Read Across the Aisle)创立了包含20个新闻品牌的图谱，当用户阅读习惯偏向于一方时，程序会建议受众调整阅读内容。", "en": "The news app 'Read Across the Aisle' created a map containing 20 news brands; when a user's reading habits lean to one side, the programme suggests the audience adjust their reading content."}, {"start": 916.85, "end": 953.45, "text": "抖音会努力让知识库、内容池成为百科全书式的存在，凭着算法模型自动学习积累的数以几十亿的“向量特征”，探索算法测量指标的优化，综合运用内容消重、打散和对用户多元兴趣的主动探索等策略，避免信息呈现一元化…", "en": "Douyin strives to make its knowledge base and content pool encyclopaedia-like, relying on the billions of 'vector features' automatically learned and accumulated by its algorithm models, exploring optimisation of algorithm measurement indicators, and comprehensively using content deduplication, scattering, and active exploration of users' diverse interests to avoid monolithic information presentation…"}, {"start": 953.45, "end": 973.2, "text": "再说了，算法推荐往往能跟其他分发形式“组合使用”：编辑分发带来的是“你应该知道的”，搜索带来“你想知道的”，推荐带来“你可能感兴趣的”，关注带来“你关心的人的动态”，平台会将这些信息获取途径整合，以解决信息偏食难题。", "en": "Moreover, algorithm recommendations often can be 'combined' with other distribution forms: editorial distribution brings 'what you should know', search brings 'what you want to know', recommendation brings 'what you might be interested in', following brings 'updates from people you care about' — platforms integrate these information acquisition channels to solve the information picky eating problem."}, {"start": 973.2, "end": 979.37, "text": "根据“算法+热点+关注+搜索”推荐内容，已是内容平台常见做法。", "en": "Recommending content based on 'algorithm + hot topics + following + search' is already a common practice among content platforms."}, {"start": 979.37, "end": 980.52, "text": "04", "en": "04"}, {"start": 980.52, "end": 986.47, "text": "在著作《必然》里，著名互联网学者凯文·凯利抛出了“理想的过滤器”一说。", "en": "In his work The Inevitable, the famous internet scholar Kevin Kelly put forward the idea of the 'ideal filter'."}, {"start": 986.47, "end": 1000.2, "text": "他认为，理想的过滤器应该推荐那些“我想知道我的朋友喜欢什么，而那又是我现在还不了解的”，以及“它将是一种会向我建议某些我现在不喜欢，但想尝试着喜欢的东西的信息流”。", "en": "He believed that the ideal filter should recommend those things like 'I want to know what my friends like, which I do not yet know', and 'it will be an information flow that suggests to me things I do not like now but want to try to like'."}, {"start": 1000.2, "end": 1003.08, "text": "现在的算法，已经实现了这点。", "en": "Today's algorithms have already achieved this."}, {"start": 1003.08, "end": 1010.81, "text": "着力实现提高信息筛选效率和避免信息单一呈现的平衡，成了算法加载的“任务进度条”。", "en": "Striving to achieve a balance between improving information screening efficiency and avoiding monolithic information presentation has become the 'task progress bar' loaded onto algorithms."}, {"start": 1010.81, "end": 1027.73, "text": "而今，在信息分发平台、短视频平台、电商平台、社交平台及餐饮外卖平台，生成合成类、个性化推送类、排序精选类、检索过滤类、调度决策类等算法技术已得到广泛应用。", "en": "And now, on information distribution platforms, short video platforms, e-commerce platforms, social platforms and food delivery platforms, generative, personalised push, ranking and selection, retrieval and filtering, and scheduling and decision-making algorithm technologies have been widely applied."}, {"start": 1027.73, "end": 1040.04, "text": "我们打车，导航会把最短或最快路径推荐给我们；我们点外卖，平台会将评分最高、距离较近的餐馆呈现给我们…", "en": "When we hail a ride, navigation recommends the shortest or fastest route to us; when we order takeaway, the platform presents us with the highest-rated, nearest restaurants…"}, {"start": 1040.04, "end": 1050.41, "text": "算法与其说是帮我们提高了信息撮合效率，不如说是帮我们节省了信息筛选成本——在海量信息面前，算法满足了我们的“脑部减负刚需”。", "en": "Rather than saying algorithms help us improve information matching efficiency, it is better to say they help us save information screening costs — in the face of massive information, algorithms satisfy our 'brain decompression rigid demand'."}, {"start": 1050.41, "end": 1057.37, "text": "而在信息多样化的当下，算法也在着力将人们信息接收模式调至“多样化”制式。", "en": "And in today's diverse information environment, algorithms are also striving to adjust people's information reception models to a 'diversified' standard."}, {"start": 1057.37, "end": 1064.74, "text": "信息平台就如超市，它会更想让顾客消费更多的商品，而不是每次来都只看同类商品。", "en": "An information platform is like a supermarket: it would rather have customers consume more goods than come every time and only look at the same type of goods."}, {"start": 1064.74, "end": 1085.38, "text": "喻国明就认为，智能算法推荐具有反信息茧房的本质，“采用多种算法的信息分发平台所具有的社会构造，从信息流动来说，总体上能够有效地避免‘茧房效应’的发生”，且从商业利益初衷看，算法在更新迭代中逐步挖掘出个体尚未被开掘的信息消费潜能是更优解。", "en": "Yu Guoming believes that intelligent algorithm recommendation is essentially anti-information-cocoon: information distribution platforms using multiple algorithms, in terms of their social construction, can overall effectively avoid the occurrence of the 'cocoon effect' in terms of information flow, and from the original intention of commercial interests, it is a better solution for algorithms to gradually tap into individuals' as-yet-undeveloped information consumption potential in iterative updates."}, {"start": 1085.38, "end": 1099.82, "text": "传播学教授杨洸也用实证调研给出结论：用户和算法之间始终处于相互响应、相互发展的状态，算法技术创造了很多新闻偶遇的机会，开阔了用户的信息视野。", "en": "Communication professor Yang Guang also gave a conclusion with empirical research: users and algorithms are always in a state of mutual response and mutual development; algorithm technology has created many opportunities for news encounters, broadening users' information horizons."}, {"start": 1099.82, "end": 1111.27, "text": "毋庸讳言，算法是放大器，它的放大效应会在“人塑造环境”和“环境塑造人”的双向交互中倍数级还原出人的多面性来。", "en": "There is no denying that algorithms are amplifiers; their amplification effect will multiply people's multifaceted nature in the two-way interaction of 'people shaping the environment' and 'the environment shaping people'."}, {"start": 1111.27, "end": 1121.95, "text": "算法会在同频共振中放大向美向善的力量，之前烧烤、冰雪大世界、麻辣烫的热门短视频先后带火淄博、哈尔滨、天水的文旅", "en": "Algorithms amplify the power of moving towards beauty and goodness in same-frequency resonance; previously, popular short videos of barbecue, the Ice and Snow World, and malatang successively boosted the cultural tourism of Zibo, Harbin and Tianshui"}]}, {"title": "怎样避免活在信息茧房之中？ Part 16（65句，8:55）", "mp3": "upload-8-part16/audio.mp3", "dur": "8:55", "lines": [{"start": 0.0, "end": 4.92, "text": "其实，要是真的能活在所谓的信息茧房中，可能还是一种幸运。", "en": "Actually, if you could really live in a so-called information cocoon, it might be a kind of luck."}, {"start": 4.92, "end": 14.04, "text": "因为我以前学过一点传播学的东西，了解过【信息茧房】，所以很长一段时间里，自己都在有意无意地避免自己被信息束缚住。", "en": "Because I previously studied a bit of communication, and understood [information cocoon], for a long time I consciously or unconsciously avoided being bound by information."}, {"start": 14.04, "end": 32.88, "text": "但是后来我发现，能一直被推送自己喜欢的东西，未尝不是一种幸福，毕竟生活已经够累了，已经做了够多自己不喜欢的事情，为什么不能有一隅小空间让自己消遣，去看自己喜欢的东西，反而要撕破这层隔绝烦恼、保护自己的茧呢？", "en": "But later I discovered that being constantly pushed things you like is not necessarily unhappiness. After all, life is already tiring enough, and you have already done enough things you do not like — why can't you have a small corner of space to entertain yourself, to watch things you like, instead of tearing apart this cocoon that isolates troubles and protects you?"}, {"start": 32.88, "end": 47.52, "text": "不要用信息做坏事，自己消化就可以了(比如不要看到什么引起共鸣的信息就去网爆啥的)。", "en": "Don't use information to do bad things; just digest it yourself (for example, don't go cyberbully someone just because you see some information that resonates with you)."}, {"start": 47.52, "end": 52.08, "text": "另外，知识是知识，信息是信息，不要混为一谈。", "en": "Also, knowledge is knowledge, and information is information — do not confuse them."}, {"start": 52.08, "end": 59.71, "text": "用来消遣的，各种碎片化的东西，是【信息】。", "en": "Things used for entertainment, various fragmented things, are [information]."}, {"start": 59.71, "end": 63.67, "text": "能帮助自己提升进步的，是系统的【知识】。", "en": "Things that can help you improve and progress are systematic [knowledge]."}, {"start": 63.67, "end": 67.99, "text": "从几分钟视频个几篇小短文获得的，是前者。", "en": "What you get from a few minutes of video and a few short articles is the former."}, {"start": 67.99, "end": 73.94, "text": "从书本、论文中甚至是与各种人打交道中获得的，才是后者。", "en": "What you get from books, papers, and even dealing with various people is the latter."}, {"start": 73.94, "end": 77.3, "text": "所以，想娱乐的时候，就去看信息。", "en": "So, when you want entertainment, go watch information."}, {"start": 77.3, "end": 81.7, "text": "想学习的话，就去看知识，知识不会成为困住你的牢笼。", "en": "When you want to learn, go look at knowledge — knowledge will not become a cage that traps you."}, {"start": 81.7, "end": 87.58, "text": "一句老生常谈的话——“学的时候好好学，玩的时候就好好玩”也是这个道理。", "en": "An old saying — 'study hard when studying, play hard when playing' — is the same logic."}, {"start": 87.58, "end": 94.78, "text": "不要硬在娱乐中找知识，这样出发点就是错的，你能指望种下苹果种子长出葡萄吗？", "en": "Don't force yourself to find knowledge in entertainment; the starting point is wrong. Can you expect grapes to grow from apple seeds you plant?"}, {"start": 94.78, "end": 98.54, "text": "而且，信息茧房是可以被利用的。", "en": "Moreover, the information cocoon can be used."}, {"start": 98.54, "end": 113.47, "text": "如果你对某个东西很感兴趣，你可以自己多去搜索观看这个东西，让大数据记住你，反而能帮助你培养更大的兴趣，甚至让你从信息开始，对知识产生兴趣，转而去看各种书。", "en": "If you are very interested in something, you can search for and watch more of it yourself, letting big data remember you; this can instead help you cultivate greater interest, and even let you start from information, become interested in knowledge, and turn to reading various books."}, {"start": 113.47, "end": 116.54, "text": "你要是真想学知识，这不也是一个好途径吗？", "en": "If you really want to learn knowledge, isn't this also a good path?"}, {"start": 116.54, "end": 119.5, "text": "工具是死的，人是活的。", "en": "Tools are dead; people are alive."}, {"start": 119.5, "end": 121.73, "text": "改变不了环境，但可以利用环境。", "en": "You cannot change the environment, but you can use the environment."}, {"start": 121.73, "end": 124.2, "text": "(以上皆为个人看法，不喜勿喷)", "en": "(All of the above are personal views; if you don't like them, don't flame me.)"}, {"start": 124.2, "end": 127.51, "text": "观点和我一样 = 觉醒了", "en": "Views same as mine = awakened."}, {"start": 127.51, "end": 130.68, "text": "观点和我不同 = 被洗脑了", "en": "Views different from mine = brainwashed."}, {"start": 130.68, "end": 134.47, "text": "三观正 = 三观正好和我一样", "en": "Correct values = values that happen to be the same as mine."}, {"start": 134.47, "end": 138.67, "text": "当代人不喜欢逻辑和因果；喜欢立场和情绪。", "en": "Contemporary people do not like logic and causality; they like stances and emotions."}, {"start": 138.67, "end": 156.98, "text": "看了一条俄粉内容，就被连续推送“乌军崩溃在即”“普大帝飒爽检阅”“西欧怂了”；看了一条乌粉内容，就会不停收到“20万人大反攻在即”“必将收复全部失地”“俄高层密谋投降”。", "en": "After watching a pro-Russia piece, you get continuously pushed 'Ukrainian army collapse imminent', 'Emperor Pu dashingly reviewing troops', 'Western Europe chickened out'; after watching a pro-Ukraine piece, you keep receiving '200,000-strong grand counteroffensive imminent', 'will definitely retake all lost territory', 'Russian top brass secretly plotting surrender'."}, {"start": 156.98, "end": 161.02, "text": "看了半天，愣是没看出最近哪方在推进战线…", "en": "After watching for a long time, I still couldn't tell which side has recently been advancing the front line…"}, {"start": 161.02, "end": 167.62, "text": "你真正支持哪一方的话，难道不是应该很关心他们的软肋短板、忧心忡忡码？", "en": "If you truly support one side, shouldn't you be very concerned about their soft spots and shortcomings, worried sick?"}, {"start": 167.62, "end": 169.78, "text": "可惜现在不兴这样思考。", "en": "Unfortunately, this kind of thinking is not in fashion now."}, {"start": 169.78, "end": 177.58, "text": "当前互联网社会放大了西方式洗脑愚民的策略：关怀个体主要聚焦于让其一时情绪好一点。", "en": "The current internet society has amplified the Western-style brainwashing and dumbing-down strategy: caring for individuals mainly focuses on making their emotions feel a bit better for a moment."}, {"start": 177.58, "end": 182.69, "text": "这很顺应人性，但对大家是个温水煮青蛙的长期陷阱。", "en": "This conforms to human nature, but for everyone it is a long-term trap of boiling a frog in warm water."}, {"start": 182.69, "end": 194.88, "text": "而我们中国文化崇尚的“良药苦口利于病”，虽然重视对症、建设性发展，但短期看是反人性的，所以无法被互联网精神鸦片用户喜爱。", "en": "And our Chinese culture's advocacy of 'good medicine tastes bitter but benefits the illness', although it values targeted, constructive development, in the short term it is anti-human-nature, so it cannot be loved by internet spiritual-opium users."}, {"start": 194.88, "end": 198.48, "text": "时代沉疴，一时解决不了，个体只能自救。", "en": "The chronic illness of the times cannot be solved in a moment; individuals can only save themselves."}, {"start": 198.48, "end": 211.99, "text": "要有意识去克服一些人性的弱点，尽量习惯去用“逻辑”“因果”“利弊”看待问题，避免抛开事实不论只顾情绪；以思想和行为去评判人，而不是以标签。", "en": "You must consciously overcome some weaknesses of human nature, try to get used to looking at problems with 'logic', 'causality' and 'pros and cons', avoid ignoring facts and only caring about emotions; judge people by their thoughts and actions, not by labels."}, {"start": 211.99, "end": 214.03, "text": "当然了，很少人可以做到这些。", "en": "Of course, very few people can do these things."}, {"start": 214.03, "end": 225.5, "text": "实际上欧美社会就是这样自动筛选精英和底层的，我们既然现在也难逃影响，那就努力不要被那些搞标签对立情绪煽动的乐色，拖进底层思维。", "en": "In fact, European and American society automatically screens elites and the bottom tier this way. Since we now cannot escape the influence either, strive not to be dragged into bottom-tier thinking by those trash who stir up label-based opposition and emotional incitement."}, {"start": 225.5, "end": 234.5, "text": "一定要记住，有成千上万人相信并点赞评论的东西，不一定就是真的，比如说简中网那么多年最爱传的图之一：", "en": "You must remember: things believed and liked and commented on by tens of thousands of people are not necessarily true — for example, one of the most circulated images on the Chinese internet over so many years:"}, {"start": 234.5, "end": 235.9, "text": "而实际上的图片：", "en": "And the actual image:"}, {"start": 235.9, "end": 265.18, "text": "AAPI指Asian Americans and Pacific Islanders，实际翻译为“亚裔美国人与太平洋岛原住民反对仇视”（并且全大写表示强调语气）", "en": "AAPI refers to Asian Americans and Pacific Islanders, actually translated as 'Asian Americans and Pacific Islanders Against Hate' (and all caps indicate emphasis)."}, {"start": 265.18, "end": 271.7, "text": "而且在P图的时候还把“美国人不打美国人”写成了繁体中文，实在是太贴心啦", "en": "And when photoshopping the image, they even wrote 'Americans don't hit Americans' in traditional Chinese — how thoughtful."}, {"start": 271.7, "end": 286.03, "text": "评论区还有人已经被石锤打脸了都能想到办法再嘴硬阴阳两句的，看来有的人其实根本就不在乎真相是啥，只要听到的故事能让他们赢，他们就宁愿终身活在信息茧房之中", "en": "In the comments section, there are even people who, after being conclusively debunked, can still find ways to be stubborn and sarcastic — it seems some people simply don't care what the truth is; as long as the story they hear lets them win, they'd rather live in an information cocoon for life."}, {"start": 286.03, "end": 294.5, "text": "不想看内宣N手废料，也不想折腾去海外网络的话，一个好的信息来源是财经要问和快讯", "en": "If you don't want to read Nth-hand waste from domestic propaganda, and don't want to bother going to overseas networks, a good information source is financial Q&A and flash news."}, {"start": 294.5, "end": 300.7, "text": "这类新闻审查较少，基本上和海外媒体同步，要审核也多是事后下架，", "en": "This type of news is less censored, basically synchronised with overseas media, and even if censored, it is mostly taken down afterwards."}, {"start": 300.7, "end": 306.34, "text": "比如财新，金十数据，雪球，财联社", "en": "For example, Caixin, Jinshi Data, Xueqiu, Cailian Press."}, {"start": 306.34, "end": 311.74, "text": "把情绪茧房从信息中剥离开，这可能有些麻烦，但尝试往这个方向去做。", "en": "Peeling the emotional cocoon away from information may be troublesome, but try to move in this direction."}, {"start": 311.74, "end": 322.94, "text": "情绪茧房是个我临时想的词：就是比如你就想看美女跳舞，那你就关注1000个跳舞美女，其它推给你你就点不感兴趣，很快你就有一个茧房了。", "en": "Emotional cocoon is a term I just coined: for example, if you just want to watch beautiful women dance, you follow 1,000 dancing beauties, and click 'not interested' on anything else pushed to you — soon you have a cocoon."}, {"start": 322.94, "end": 332.86, "text": "按原教旨定义它是不是信息茧房，是的，但实际上它不提供信息，你也并不用它获取信息，你只是看美女跳舞爽，所以我把它称为情绪茧房。", "en": "By the original definition, is it an information cocoon? Yes, but in fact it does not provide information, and you do not use it to obtain information — you just enjoy watching beautiful women dance, so I call it an emotional cocoon."}, {"start": 332.86, "end": 338.93, "text": "而很多人的爽点不是看美女跳舞这么简单，他们是需要借助一些信息爽起来的。", "en": "And many people's pleasure points are not as simple as watching beautiful women dance; they need to use some information to get their pleasure."}, {"start": 338.93, "end": 342.65, "text": "或者说「爽」可能也不确切，就是调动自己的情绪。", "en": "Or to say 'pleasure' may not be quite accurate — it is stirring up one's own emotions."}, {"start": 342.65, "end": 357.53, "text": "那么问题来了：这些人的实际需求是找个情绪茧房来满足自己的情绪，但情绪过去是很快的，之后则只有用来引发情绪的信息残留下来了——这才是实质上造成很多人问题的「信息茧房」。", "en": "Then the question arises: these people's actual need is to find an emotional cocoon to satisfy their emotions, but emotions pass quickly, and afterwards only the information used to trigger the emotions remains — this is the 'information cocoon' that substantively causes problems for many people."}, {"start": 357.53, "end": 383.57, "text": "比如最近的TGA例子，开奖前客观信息是「年度游戏获奖的大热门是宇宙机器人，黑神话悟空是第二热门但存在一定差距」，但大量观众需要被满足的情绪是「黑神话输了是意外」，所以这些观众会去寻找，且众多自媒体愿意提供的内容就是这个方向：TGA段子啊，西方话语权啊，索尼塞钱啊，这些是相对比较文明的了。", "en": "For example, the recent TGA example: before the awards, the objective information was 'the hot favourite to win Game of the Year is Astro Bot, and Black Myth: Wukong is the second favourite but with a certain gap', but the emotion many viewers needed satisfied was 'Black Myth losing was an upset', so these viewers go looking for it, and the content many self-media are willing to provide is in this direction: TGA jokes, Western discourse power, Sony stuffing money — these are the relatively civilised ones."}, {"start": 383.57, "end": 393.41, "text": "如果有人被它们满足了情绪，那么他就会更容易记住，并强化自己获知的这些信息——4399小游戏也配？", "en": "If someone has their emotions satisfied by them, then they will more easily remember and reinforce the information they obtained — is a 4399 mini-game worthy too?"}, {"start": 393.41, "end": 399.05, "text": "还是TGA例子，我记得大概一个月前，冒出了个「TGA修改规则允许DLC参评」的新闻。", "en": "Still the TGA example: I remember about a month ago, a piece of news popped up: 'TGA changed its rules to allow DLC to be nominated'."}, {"start": 399.05, "end": 405.34, "text": "当然这就是个Q&A，不是啥新规，但不妨碍业务精进的自媒体把它包装成这样。", "en": "Of course, this was just a Q&A, not a new rule, but that doesn't stop business-savvy self-media from packaging it as such."}, {"start": 405.34, "end": 419.74, "text": "因为虽然观众本身不知道这条信息，但它可以满足一个长久存在的情绪需求「总有刁民想害朕」——你允许DLC参评，可不就是想妨碍黑神话拿年度游戏？", "en": "Because although viewers themselves do not know this piece of information, it can satisfy a long-standing emotional need: 'there are always unruly subjects trying to harm me' — you allow DLC to be nominated, isn't that just to obstruct Black Myth from winning Game of the Year?"}, {"start": 419.74, "end": 428.5, "text": "仇恨需求也是情绪需求的一种，虽然法环DLC最后啥也没拿（且赔率也一直倒数），但就是得被骂，惨呐。", "en": "Hatred needs are also a kind of emotional need. Although the Elden Ring DLC ended up winning nothing in the end (and its odds were always at the bottom), it still had to be scolded — how miserable."}, {"start": 428.5, "end": 437.5, "text": "这表明了一个非常浅显的事实：满足情绪需求的「信息」和真实世界的「信息」，两者通常都是不兼容的。", "en": "This shows a very obvious fact: 'information' that satisfies emotional needs and 'information' from the real world are usually incompatible."}, {"start": 437.5, "end": 443.9, "text": "如果你用一条信息来满足自己的情绪需求，那就最好不要把它带进真实世界。", "en": "If you use a piece of information to satisfy your emotional needs, then it is best not to bring it into the real world."}, {"start": 443.9, "end": 456.26, "text": "当你看「智能路障」、「直言trigger」这种自媒体来产生情绪共鸣时，你就当自己在看美女跳舞，跳完直接信息清零，毕竟我估摸着看美女跳舞总是记不住什么有效信息的吧。", "en": "When you watch self-media like 'Smart Roadblock' and 'Zhiyan Trigger' to generate emotional resonance, treat it as watching beautiful women dance — after dancing, directly reset the information to zero. After all, I figure watching beautiful women dance never leaves you remembering any useful information."}, {"start": 456.26, "end": 469.63, "text": "当然，上面这段话过于高高在上和没有可行性了，因为如果你要抛开从过往情绪中沉淀下来的信息并寻找新的、真实世界的信息来替换它，要付出不止双倍的努力。", "en": "Of course, the above passage is too condescending and infeasible, because if you want to discard information settled from past emotions and find new, real-world information to replace it, you have to put in more than double the effort."}, {"start": 469.63, "end": 478.39, "text": "所以一个可行的尝试是做一些妥协：不要那么沉迷于满足情绪，但让这些时候获知的信息有那么一丁点用。", "en": "So a feasible attempt is to make some compromises: don't be so obsessed with satisfying emotions, but let the information obtained in these moments be a tiny bit useful."}, {"start": 478.39, "end": 498.07, "text": "这里是有两个大方向的，一个是广开言路，比如有意识搜一些其他信息、反对面的观点等等，但其实能走到这步的，大概也不太容易被信息茧房所困了；另一个其实更难一些但也更基础一些，就是去怀疑那些主动引导你情绪的信息——这应当是不难辨别的。", "en": "There are two main directions here: one is to open up to more voices, for example consciously searching for other information, opposing views, etc. — but those who can reach this step are probably not easily trapped by information cocoons anyway; the other is actually harder but more fundamental, which is to doubt information that actively guides your emotions — this should not be hard to identify."}, {"start": 498.07, "end": 505.87, "text": "该爱了，该恨了，该同情了，该狂欢了——因为它们能调动你的情绪，所以伴随它们的信息，一般都不会特别可靠。", "en": "Time to love, time to hate, time to sympathise, time to celebrate — because they can stir your emotions, the information accompanying them generally will not be particularly reliable."}, {"start": 505.87, "end": 514.56, "text": "我有两句习惯说的话：一曰「什么样的观众配什么样的媒体」，二曰「信息茧房都是自己选的」，也一并放在这里。", "en": "I have two sayings I habitually use: one is 'what kind of audience deserves what kind of media', and the other is 'information cocoons are all self-chosen' — I'll put them here as well."}, {"start": 514.56, "end": 520.75, "text": "能把情绪茧房剥离出来的话，你会同时发现，其实你也能驾驭情绪茧房了。", "en": "If you can peel the emotional cocoon away, you will also discover that you can actually master the emotional cocoon."}, {"start": 520.75, "end": 529.82, "text": "当你想看美女跳舞的时候就去看，想抒发黑神话落选的不甘就去一起喷，甚至想看赢学家们时你都能跟着赢。", "en": "When you want to watch beautiful women dance, go watch; when you want to vent the disappointment of Black Myth's loss, go rant together; even when you want to watch the 'win-ologists', you can join in the winning."}, {"start": 529.82, "end": 535.9, "text": "但回过头面对自己的生活时，你还是知道哪些信息更可靠，这其实是很不错的一件事。", "en": "But when you turn back to face your own life, you still know which information is more reliable — this is actually quite a good thing."}]}, {"title": "怎样避免活在信息茧房之中？ Part 17（55句，7:03）", "mp3": "upload-8-part17/audio.mp3", "dur": "7:03", "lines": [{"start": 0.0, "end": 1.73, "text": "果壳中的国王", "en": "The King in the Nutshell"}, {"start": 1.73, "end": 12.48, "text": "虽然许多人都在批判信息茧房，但这种看法低估了群众，而且没有确实的证据来证明人们真的被信息茧房所困（调查结果其实与人们设想的相反）。", "en": "Although many people criticise the information cocoon, this view underestimates the masses, and there is no solid evidence to prove that people are really trapped by information cocoons (survey results are actually the opposite of what people imagine)."}, {"start": 12.48, "end": 17.28, "text": "问题在于，既然如此之多的人对它进行批判，那为什么事情无法被改变呢？", "en": "The problem is: since so many people criticise it, why can't things be changed?"}, {"start": 17.28, "end": 21.12, "text": "因为终究，这仍是文化与习性的疾病。", "en": "Because ultimately, this is still a disease of culture and habit."}, {"start": 21.12, "end": 27.89, "text": "无论我们把问题归结为历史终结，还是技术算法，都仅仅是一种客观化的进程。", "en": "Whether we attribute the problem to the end of history or to technical algorithms, it is merely a process of objectification."}, {"start": 27.89, "end": 44.45, "text": "对异化的批判，既神话了技术，也神话了人，从而忽略了两者之间互相交叠、褶皱与干涉的作用，并提供了一种理性的幻觉。", "en": "Criticism of alienation both mythologises technology and mythologises people, thereby ignoring the overlapping, folding and interfering effects between the two, and providing a rational illusion."}, {"start": 44.45, "end": 59.09, "text": "解释与批判现在都只是在褶皱当中激起的微小波澜：对技术的批判现在服务于人，但人本身又是被技术重构的现象，这便导致人们的讨论通常都只是重言式。", "en": "Explanation and criticism are now only small ripples stirred up within the folds: criticism of technology now serves people, but people themselves are phenomena reconstructed by technology, which leads people's discussions to usually be mere tautologies."}, {"start": 59.09, "end": 64.2, "text": "一个简单的图示常常被无数人重复——难道不是构成了茧房本身？", "en": "A simple diagram repeated by countless people — does it not itself constitute a cocoon?"}, {"start": 64.2, "end": 76.39, "text": "所以在这里我们发现，恰恰是对信息茧房的批判主导了公众意识和思想——让他们对信息与权力保持迷信，从而在不自知当中陷入所谓的茧房。", "en": "So here we discover that it is precisely criticism of the information cocoon that dominates public consciousness and thought — making them superstitious about information and power, and thus unknowingly falling into the so-called cocoon."}, {"start": 76.39, "end": 79.94, "text": "文化与习性只是在其中不断地自我加强。", "en": "Culture and habit only continuously strengthen themselves within it."}, {"start": 79.94, "end": 82.1, "text": "所以左派的批评意味着什么？", "en": "So what does leftist criticism mean?"}, {"start": 82.1, "end": 95.26, "text": "贬低群众是为了形成所谓理性的权威，而高估群众则主要是因为要为人的需求寻找一个历史进程，使公众服从他们的解释，从而让他们产生人推动历史的幻觉。", "en": "Belittling the masses is to form so-called rational authority, while overestimating the masses is mainly to find a historical process for human needs, making the public obey their explanations, thereby giving them the illusion that people drive history."}, {"start": 95.26, "end": 99.58, "text": "这样一来，便形成了一种庸俗的技术官吏阶层。", "en": "This in turn forms a vulgar class of technocrats."}, {"start": 99.58, "end": 105.26, "text": "然而，技术带来的问题是，双重链接（正如德勒兹在《千高原》中指出的）。", "en": "However, the problem brought by technology is double articulation (as Deleuze pointed out in A Thousand Plateaus)."}, {"start": 105.26, "end": 119.23, "text": "就好比一个铁匠挥舞铁锤敲击铁砧，经历了一个碎裂的过程——由关节的撞击引起；另一方面，他也因此获得了一种人的新形式所特有的关节（链接），专门为劳作而设。", "en": "It is like a blacksmith swinging a hammer to strike an anvil, undergoing a process of fragmentation — caused by the impact of joints; on the other hand, he also thereby obtains a new form of human joints (articulations) specific to labour."}, {"start": 119.23, "end": 124.2, "text": "一面是碎裂的分子化过程，另一面是克分子的沉积过程。", "en": "On one side is a fragmenting molecular process; on the other side is a depositing process of molar aggregates."}, {"start": 124.2, "end": 126.48, "text": "其实这正是结构主义的方法。", "en": "This is actually the structuralist method."}, {"start": 126.48, "end": 138.24, "text": "首先它把原始形式弄碎，然后再通过劳作的总体化机制，生产的配置与超编码，重新使之结构化（能指链的构建），于是一种有机体或国家的治理便形成了。", "en": "First it shatters the original form, and then through the totalising mechanism of labour, the configuration of production and overcoding, it restructures it (the construction of the signifier chain), and thus an organism or state governance is formed."}, {"start": 138.24, "end": 141.19, "text": "这同样是网络用户体验如何被安排的。", "en": "This is also how the network user experience is arranged."}, {"start": 141.19, "end": 155.88, "text": "它导致结构之中的用户产生新的迷信，就如同哈姆雷特，果壳中的国王：人人都有一种中心的幻觉，以及对权力的狂热；人人都想操控一切，像水军那样。", "en": "It leads users within the structure to develop new superstitions, just like Hamlet, the king in the nutshell: everyone has an illusion of centrality, and a fanaticism for power; everyone wants to control everything, like paid posters."}, {"start": 155.88, "end": 160.68, "text": "人人都成了审判官和殖民者，疯狂地掠夺土地。", "en": "Everyone has become a judge and a coloniser, madly plundering land."}, {"start": 160.68, "end": 164.64, "text": "但恰恰因为如此，一种信息茧房的幻影产生了。", "en": "But precisely because of this, a phantom of the information cocoon is produced."}, {"start": 164.64, "end": 175.03, "text": "果壳中的国王并非对外界一无所知，但是他需要果壳来成为王；他疯狂地需要群众，以便在群众当中构筑边缘与中心的等级。", "en": "The king in the nutshell is not ignorant of the outside world, but he needs the nutshell to become king; he madly needs the masses, in order to construct hierarchies of margin and centre among the masses."}, {"start": 175.03, "end": 190.68, "text": "虽然王的位置只有一个，根本没有办法被任何人占据，但是人们只要通过对普遍性的宣称——在自己的果壳中占据群众的权威——自居为群众发号施令，同时又排斥其它群众，便可产生果壳之王。", "en": "Although there is only one king's position, which cannot be occupied by anyone at all, people only need to claim universality — occupying the authority of the masses in their own nutshell — to order the masses around as if they were the masses, while excluding other masses, and a nutshell king can be produced."}, {"start": 190.68, "end": 193.13, "text": "所以信息茧房的本质是什么呢？", "en": "So what is the essence of the information cocoon?"}, {"start": 193.13, "end": 195.84, "text": "其实是一套权力机制导致的愚昧。", "en": "It is actually ignorance caused by a set of power mechanisms."}, {"start": 195.84, "end": 199.97, "text": "并不是墙规定了意识，而是意识的自我规定塑造了墙。", "en": "It is not the wall that determines consciousness, but consciousness's self-determination that shapes the wall."}, {"start": 199.97, "end": 209.38, "text": "它是一种幻觉，却被人们用来自我说服——通过虚伪的批判，他们不断地以理性自居，不过却是为了占据王的位置。", "en": "It is an illusion, yet people use it to persuade themselves — through hypocritical criticism, they constantly pose as rational, but only in order to occupy the king's position."}, {"start": 209.38, "end": 216.65, "text": "在此，他们只要服从与流量经济的规则，服从于理性，便可成为一个主体——但其实只是乌合之众。", "en": "Here, they only need to obey the rules of the traffic economy and obey rationality to become a subject — but in fact they are just a mob."}, {"start": 216.65, "end": 238.66, "text": "在质疑解放激情的过程中展示“我思”，在聒噪中寻求“我在”，在美颜摄像头和调音设备中成为网红，在大多数的名义下发号施令。", "en": "Displaying 'I think' in the process of questioning liberating passions, seeking 'I am' in the noise, becoming influencers with beauty cameras and audio-tuning equipment, giving orders in the name of the majority."}, {"start": 238.66, "end": 245.3, "text": "正所谓“水浅王八多”，信息茧房因池中之物的肤浅而显得格外强大。", "en": "As the saying goes, 'shallow water breeds many turtles' — the information cocoon appears particularly powerful because of the shallowness of the things in the pond."}, {"start": 245.3, "end": 252.62, "text": "正因为毒蟾蜍的鸣叫盖过了百灵鸟的歌唱，所以信息茧房开始突兀地展示自身。", "en": "Precisely because the croaking of poisonous toads has drowned out the singing of larks, the information cocoon begins to conspicuously display itself."}, {"start": 252.62, "end": 268.27, "text": "正因为对中心与等级的执着，果壳之王们聚集在一个又一个信息热点、一个又一个洼地当中，争吵不休的同时对边缘采取排斥和忽略的态度，所以信息茧房又成了它们用来庸人自扰的问题。", "en": "Precisely because of the obsession with centre and hierarchy, the nutshell kings gather in one information hotspot after another, in one lowland after another, quarrelling endlessly while adopting an attitude of exclusion and neglect towards the margins, so the information cocoon has become a problem they use to trouble themselves with."}, {"start": 268.27, "end": 270.72, "text": "果壳之王，当然还是最在意果壳。", "en": "The nutshell king, of course, cares most about the nutshell."}, {"start": 270.72, "end": 280.8, "text": "信息社会矛盾的地方在于，你发现的信息茧房这一问题，并且意识到它的危害性，极力想要避免它，却发现怎么也避免不了。", "en": "The contradictory aspect of the information society is that you discover the problem of the information cocoon, realise its harmfulness, and desperately want to avoid it, yet find you cannot avoid it no matter what."}, {"start": 280.8, "end": 291.48, "text": "一个比较极端的方式：不上网，并且在生活中，对于你接触到的一切信息，持怀疑审慎的态度，辩证地对待。", "en": "A more extreme way: don't go online, and in life, maintain a sceptical and cautious attitude towards all information you come into contact with, and treat it dialectically."}, {"start": 291.48, "end": 294.36, "text": "但我并不推荐这种方式，因为大多数人做不到。", "en": "But I do not recommend this way, because most people cannot do it."}, {"start": 294.36, "end": 301.68, "text": "每个人每天即使不看微信微博这些高噪音密集App，也能通过互联网接触到其他千万条信息。", "en": "Even if each person does not look at high-noise, dense apps like WeChat and Weibo every day, they can still come into contact with tens of millions of other pieces of information through the internet."}, {"start": 301.68, "end": 309.96, "text": "即使你不带手机出门，走在大街上，各路广告营销商都带有目的地呈现在你眼前，诱惑你买买买。", "en": "Even if you go out without your phone, walking on the street, all kinds of advertising marketers present themselves before your eyes with purpose, tempting you to buy, buy, buy."}, {"start": 309.96, "end": 311.4, "text": "信息无处不在。", "en": "Information is everywhere."}, {"start": 311.4, "end": 315.96, "text": "但我们大致可以把它分为两类：有用的和无用的。", "en": "But we can roughly divide it into two categories: useful and useless."}, {"start": 315.96, "end": 323.11, "text": "有用的信息，应该是围绕你自身活动任务为主的信息，尽量主动获取他们。", "en": "Useful information should be information centred on your own activities and tasks; try to actively obtain it."}, {"start": 323.11, "end": 327.19, "text": "你可以从朋友口中得知，也可以通过搜索引擎获取。", "en": "You can learn it from friends' mouths, or obtain it through search engines."}, {"start": 327.19, "end": 333.48, "text": "比如你是一个python开发工程师，你首要接触的，是你的项目，你的相关领域的探索。", "en": "For example, if you are a Python development engineer, what you first come into contact with is your project and exploration in your related field."}, {"start": 333.48, "end": 340.27, "text": "这个时候，你需要关注的，就是尽量在程序员的圈子里找到有价值的帮助信息。", "en": "At this time, what you need to focus on is finding valuable help information within the programmer community as much as possible."}, {"start": 340.27, "end": 343.58, "text": "无用的信息，这可能是我们平常接触更多的。", "en": "Useless information is probably what we come into contact with more in ordinary times."}, {"start": 343.58, "end": 350.74, "text": "微信里的群聊，微博知乎的热榜，朋友圈无关痛痒的推广，大多数和我们无关。", "en": "Group chats in WeChat, hot lists on Weibo and Zhihu, irrelevant promotions in Moments — most of them have nothing to do with us."}, {"start": 350.74, "end": 355.78, "text": "而媒体和商家正在尽全力诱导我们去关注这些。", "en": "And media and businesses are doing their utmost to induce us to pay attention to these."}, {"start": 355.78, "end": 370.01, "text": "面对这些无用的信息，意识到生活中那些事情对你才是最重要的，不断提醒自己，什么才是最重要的，然后你会下意识地尽可能去忽略无关信息，而把精力和心思放在重要的事情上。", "en": "Faced with this useless information, realise what things in life are most important to you, constantly remind yourself what is most important, and then you will subconsciously try to ignore irrelevant information as much as possible, and put your energy and thought into important things."}, {"start": 370.01, "end": 380.74, "text": "比如阅读，和朋友谈心，学习一门新技术等等，明确了目的，清楚了任务，你自然能从噪音中筛选出有用的信息。", "en": "For example, reading, talking heart-to-heart with friends, learning a new technology, etc. Once the purpose is clear and the task is clear, you can naturally filter useful information from the noise."}, {"start": 380.74, "end": 383.69, "text": "学生时代的学霸通常就能做到这一点。", "en": "Top students in their student days can usually do this."}, {"start": 383.69, "end": 394.3, "text": "和那些成天开小差的人相比，学霸接触到的噪音其实并不比他们少，但学霸的专注程度，绝对是那些学渣们所望尘莫及的。", "en": "Compared with those who daydream all day, top students actually come into contact with no less noise, but their level of focus is absolutely beyond the reach of underachieving students."}, {"start": 394.3, "end": 408.17, "text": "因为他们早已意识到，把学校教的知识学到手，成绩排名提高到第一第二，才是应试教育下最应该做的事情，否则就会在终极一考的比赛中被分配到资源匮乏的地方。", "en": "Because they have long realised that mastering the knowledge taught in school and raising their grade ranking to first or second is the most important thing under exam-oriented education; otherwise, they will be assigned to resource-poor places in the ultimate exam competition."}, {"start": 408.17, "end": 411.36, "text": "当然，这并不是教你去做一个无趣的人。", "en": "Of course, this is not teaching you to be a boring person."}, {"start": 411.36, "end": 423.65, "text": "不过多数时候，我们也会发现，过分关注那些与我们并不相关的信息，其实并不见得能够让我们更有趣，生活更好，反而分散了注意力，徒增了各种嘈杂情绪。", "en": "But most of the time, we also find that excessively paying attention to information irrelevant to us does not necessarily make us more interesting or life better; instead, it disperses attention and adds various noisy emotions."}]}, {"title": "怎样避免活在信息茧房之中？ Part 18（89句，12:22）", "mp3": "upload-8-part18/audio.mp3", "dur": "12:22", "lines": [{"start": 0.0, "end": 3.67, "text": "再封闭的地方当中就很难逃脱出信息茧房里", "en": "It is hard to escape the information cocoon in an even more closed place."}, {"start": 3.67, "end": 12.38, "text": "尝试性的去看不同观点的文章以及分析，看看别人怎么说，以你的知识储备水平去分析这样的行为合理不合理。", "en": "Try reading articles and analyses from different viewpoints, see what others say, and use your own knowledge reserves to analyse whether such behaviour is reasonable or not."}, {"start": 12.38, "end": 19.66, "text": "多动手去搜索，不要什么都听别人跟你说，这样你的信息渠道就来自于别人给你提供的而不是你自己。", "en": "Search more with your own hands; don't listen to everything others tell you — otherwise your information channels come from what others provide you, not from yourself."}, {"start": 19.66, "end": 35.3, "text": "对比很重要，还有就是常识性的思维，多用多种不同角度的人称去思考，尽可能的忘记自己，试图的以他人的角度去想，在宏观点就是能够尝试着像观看电视一样带入读者看者的身份去看就会有不一样的收获。", "en": "Comparison is important, and so is common-sense thinking. Think from multiple different personal perspectives as much as possible; forget yourself as much as possible, and try to think from others' perspectives. At a macro level, trying to watch like a television viewer, taking on the identity of a reader or viewer, will bring different gains."}, {"start": 35.3, "end": 44.14, "text": "多去看一些推理类的书籍或者逻辑学，没有一定的知识储备量你以为的觉醒，实际上是别人给你挖的一个更大的坑。", "en": "Read more reasoning books or logic. Without a certain reserve of knowledge, what you think is awakening is actually a bigger pit someone else has dug for you."}, {"start": 44.14, "end": 53.54, "text": "同时一定要保持一个思想，那就是个人利益至上，你得利益高于一切，只有持有这个观点，你才不会被集体性的思维所洗脑。", "en": "At the same time, you must maintain one thought: personal interest comes first. Your interests are above all else. Only by holding this view will you not be brainwashed by collective thinking."}, {"start": 53.54, "end": 59.95, "text": "逻辑是保持清醒的唯一的思考方法，多问几个为什么，一切如梦幻泡影。", "en": "Logic is the only way of thinking that keeps you awake. Ask a few more 'whys', and everything is like a dream, an illusion, a bubble, a shadow."}, {"start": 59.95, "end": 62.04, "text": "语言是知识的钥匙", "en": "Language is the key to knowledge."}, {"start": 62.04, "end": 67.08, "text": "学英语，日语，德语，西班牙语", "en": "Learn English, Japanese, German, Spanish."}, {"start": 67.08, "end": 70.32, "text": "互联网链接世界 到墙外看一下看", "en": "The internet connects the world — go look outside the wall."}, {"start": 70.32, "end": 73.61, "text": "中文主流社交平台也全都逛一遍", "en": "Browse all the mainstream Chinese social platforms too."}, {"start": 73.61, "end": 75.12, "text": "各种专业书读一下", "en": "Read various professional books."}, {"start": 75.12, "end": 76.75, "text": "跳槽各行各业试一下", "en": "Try switching jobs across all walks of life."}, {"start": 76.75, "end": 80.35, "text": "信息的真实性要各个信息来源相互验证", "en": "Verify the authenticity of information across information sources."}, {"start": 80.35, "end": 83.4, "text": "多看历史，要连着看，", "en": "Read more history, and read it continuously."}, {"start": 83.4, "end": 87.72, "text": "和不同思想阶层的人聊天", "en": "Chat with people from different ideological strata."}, {"start": 87.72, "end": 91.27, "text": "真正的大师永远怀着一颗学徒的心", "en": "A true master always keeps an apprentice's heart."}, {"start": 91.27, "end": 96.0, "text": "爱你的人会骗你，怕你的人会骗你，有求于你得人会骗你！", "en": "People who love you will deceive you, people who fear you will deceive you, people who want something from you will deceive you!"}, {"start": 96.0, "end": 98.88, "text": "这是春秋战国时期就总结出的道理！", "en": "This is a truth summed up as early as the Spring and Autumn and Warring States periods!"}, {"start": 98.88, "end": 104.21, "text": "“信息茧房”这个说法，正在从学术研究快速走向日常生活。", "en": "The term 'information cocoon' is rapidly moving from academic research into everyday life."}, {"start": 104.21, "end": 107.57, "text": "比如有年轻人吐槽“你们看过爸妈的手机吗？", "en": "For example, when young people complain, 'Have you seen your parents' phones?"}, {"start": 107.57, "end": 116.81, "text": "他们刷到的内容和我完全不一样，这简直就是信息茧房”时，这类说法其实混淆了“信息茧房”和“个性化推荐”概念。", "en": "The content they scroll to is completely different from mine — this is simply an information cocoon' — such statements actually confuse the concepts of 'information cocoon' and 'personalised recommendation'."}, {"start": 116.81, "end": 135.46, "text": "当人们使用个性化推荐，因个人兴趣、场景等因素而得到不同的推荐结果，其实是很正常的，但将千人千面的推荐效果等同于信息茧房，有失偏颇，容易导致信息茧房概念的泛化与滥用。", "en": "When people use personalised recommendations and get different recommendation results due to personal interests, scenarios and other factors, it is actually quite normal. But equating the 'thousands of people, thousands of faces' recommendation effect with information cocoons is biased, and easily leads to the generalisation and abuse of the information cocoon concept."}, {"start": 135.46, "end": 139.18, "text": "这种近乎直觉式的推断，让人喜忧参半。", "en": "This almost intuitive inference is bittersweet."}, {"start": 139.18, "end": 143.93, "text": "喜的是，人们对新技术的社会影响保持了认知上的敏感和反思。", "en": "The good news is that people remain cognitively sensitive to and reflective about the social impact of new technologies."}, {"start": 143.93, "end": 157.01, "text": "忧的是，信息茧房概念逐渐泛化，陷入了过于简单化的归因，对算法技术的评判有失公允，并且有可能滑向不利于社会创新的技术悲观论调。", "en": "The worrying part is that the information cocoon concept is gradually becoming generalised, falling into overly simplistic attribution, making unfair judgments about algorithm technology, and possibly sliding into techno-pessimistic rhetoric unfavourable to social innovation."}, {"start": 157.01, "end": 159.53, "text": "信息茧房这个术语有两层含义。", "en": "The term information cocoon has two layers of meaning."}, {"start": 159.53, "end": 164.04, "text": "首先，这个词语描述了个人所感知的同质化信息环境。", "en": "First, this term describes the homogeneous information environment perceived by individuals."}, {"start": 164.04, "end": 187.87, "text": "早在2006年，美国政治学家、法学家卡斯·桑斯坦在《信息乌托邦》（Infotopia: How Many Minds Produce Knowledge）一书中，用“茧房”来比喻这样一个环境：因为个性化的信息过滤，个体只能接受到符合自己观点的信息，因此陷入到了一个同质化的信息环境中。", "en": "As early as 2006, American political scientist and jurist Cass Sunstein, in Information Utopia (Infotopia: How Many Minds Produce Knowledge), used 'cocoon' as a metaphor for such an environment: because of personalised information filtering, individuals can only receive information consistent with their own views, and thus fall into a homogeneous information environment."}, {"start": 187.87, "end": 193.82, "text": "其次，在学术研究中，过滤泡、回声室是比信息茧房更常用的概念。", "en": "Second, in academic research, filter bubbles and echo chambers are more commonly used concepts than information cocoons."}, {"start": 193.82, "end": 206.42, "text": "人们上网时都有类似的体验，立场不同的双方就某个争议话题展开论战，结果不仅谁也说服不了谁、谁也不愿意理解谁，甚至还会加强自己原先的立场。", "en": "People have similar experiences online: two sides with different stances debate a controversial topic, and the result is not only that neither can convince the other, nor is willing to understand the other, but they even strengthen their original stances."}, {"start": 206.42, "end": 222.02, "text": "回声室就描述了这样一种状况：人们生活在一个封闭的社交圈中，同质化的信息不断重复、放大，导致回声室内的成员对外界的信息接触越来越少，而只能听到和自己一致观点的声音。", "en": "The echo chamber describes just such a situation: people live in a closed social circle, where homogeneous information is constantly repeated and amplified, so that members of the echo chamber come into contact with outside information less and less, and can only hear voices consistent with their own views."}, {"start": 222.02, "end": 228.82, "text": "不过，算法和茧房的因果关系也未经证实。", "en": "However, the causal relationship between algorithms and cocoons is also unproven."}, {"start": 228.82, "end": 244.22, "text": "《打破社交媒体棱镜》一书中，美国杜克大学政治学与公共政策教授克里斯·贝尔做了一个实验，当给用户提供了对立的观点时，人们反而更极端、更捍卫自己原来的立场了。", "en": "In Breaking the Social Media Prism, Chris Bail, professor of political science and public policy at Duke University, conducted an experiment: when users were provided with opposing views, people became more extreme and defended their original stances even more."}, {"start": 244.22, "end": 255.34, "text": "这个实验说明，哪怕我们接触的是多样化的信息，仍然会拥护自己的立场，甚至变得极端，这个过程并不一定需要经过“过滤泡”或“信息茧房”的中介。", "en": "This experiment shows that even when we come into contact with diverse information, we still uphold our own stances, and even become extreme — a process that does not necessarily require the mediation of 'filter bubbles' or 'information cocoons'."}, {"start": 255.34, "end": 283.66, "text": "信息茧房、过滤泡、回声室等概念都描述了一个共同的担忧：在选择性的信息接触中，人们可能会陷入一种自我强化的反馈循环，从而失去了接触多种信息、不同观点的机会。", "en": "Concepts such as information cocoons, filter bubbles and echo chambers all describe a common concern: in selective information contact, people may fall into a self-reinforcing feedback loop, thereby losing opportunities to contact diverse information and different views."}, {"start": 283.66, "end": 292.34, "text": "这个复杂的社会问题有很多成因，受到包括个体、技术、场景与社会等多种因素的共同影响。", "en": "This complex social problem has many causes, influenced by multiple factors including individuals, technology, scenarios and society."}, {"start": 292.34, "end": 302.78, "text": "但是在人们的日常认知中经常把这个多因——多果的问题，简化为“算法导致信息茧房”形式的单因——单果的说法。", "en": "But in people's everyday cognition, this multi-cause, multi-effect problem is often simplified into a single-cause, single-effect statement in the form of 'algorithms cause information cocoons'."}, {"start": 302.78, "end": 306.22, "text": "要弄清楚这个问题，我们需要全面地认识算法。", "en": "To understand this problem clearly, we need a comprehensive understanding of algorithms."}, {"start": 306.22, "end": 309.14, "text": "首先，在技术上，算法就是计算方法。", "en": "First, technically, an algorithm is a calculation method."}, {"start": 309.14, "end": 314.66, "text": "我们对数学中的鸡兔同笼问题的求解，就是最简单的计算方法。", "en": "Our solving of the chickens-and-rabbits-in-a-cage problem in mathematics is the simplest calculation method."}, {"start": 314.66, "end": 320.23, "text": "推荐算法要解决的问题是随互联网而来的海量信息的分发难题。", "en": "The problem recommendation algorithms must solve is the distribution problem of massive information that came with the internet."}, {"start": 320.23, "end": 330.72, "text": "“猜你想看”也是一道算法题，信息平台根据人们的地理位置数据、已有浏览记录、朋友的兴趣等，完成信息的高效分发。", "en": "'Guess what you'd like to see' is also an algorithm problem: information platforms complete efficient information distribution based on people's geographic location data, existing browsing records, friends' interests, and so on."}, {"start": 330.72, "end": 336.55, "text": "推荐算法在用户和内容之间建立起有效的、符合偏好和需求的桥梁。", "en": "Recommendation algorithms build an effective bridge between users and content that matches preferences and needs."}, {"start": 336.55, "end": 351.26, "text": "如果没有推荐算法，我们可能会淹没在无边无际的信息海洋中，感到迷茫和不知所措，我们无法有效地获取所需的信息，甚至可能引发更严重的问题，比如信息瘫痪和信息回避。", "en": "Without recommendation algorithms, we might drown in a boundless ocean of information, feeling lost and at a loss; we would be unable to effectively obtain needed information, and might even trigger more serious problems, such as information paralysis and information avoidance."}, {"start": 351.26, "end": 358.99, "text": "因此，从全局上看，算法是服务民众需求、有利社会发展的，这一基本判断应是主流共识。", "en": "Therefore, from an overall perspective, algorithms serve the needs of the people and benefit social development — this basic judgment should be the mainstream consensus."}, {"start": 358.99, "end": 370.32, "text": "其次，从市场经济角度看，提供这项服务的平台公司需要盈利，因此推荐算法还要解决留住用户，然后将用户注意力有效售卖给广告商的问题。", "en": "Second, from a market economy perspective, platform companies providing this service need to make a profit, so recommendation algorithms must also solve the problem of retaining users and then effectively selling user attention to advertisers."}, {"start": 370.32, "end": 385.51, "text": "正如纪录片《监视资本主义：智能陷阱》（The Social Dilemma）中指出的，社交媒体平台和搜索引擎使用的推荐算法，根据用户的历史行为和偏好，个性化地推送信息。", "en": "As pointed out in the documentary The Social Dilemma, social media platforms and search engines use recommendation algorithms to push information personalised according to users' historical behaviour and preferences."}, {"start": 385.51, "end": 395.23, "text": "平台就像商场，如果商场总提供某一类或某几类商品，无法提供更多品类的商品，消费者可能会减少使用甚至抛弃它。", "en": "A platform is like a shopping mall: if the mall always provides one or a few categories of goods and cannot provide more categories, consumers may use it less or even abandon it."}, {"start": 395.23, "end": 402.07, "text": "从商业角度，平台也会通过分发多样性信息，来留存用户，而不是刻意制造茧房。", "en": "From a commercial perspective, platforms also retain users by distributing diverse information, rather than deliberately creating cocoons."}, {"start": 402.07, "end": 408.62, "text": "也有研究显示，用户仍然有主观能动性，也并非一味被动接受算法的投喂。", "en": "Research also shows that users still have subjective initiative, and do not blindly passively accept algorithm feeding."}, {"start": 408.62, "end": 417.1, "text": "宾夕法尼亚大学的杨天、黄圣淳等研究发现，喜欢用今日头条看娱乐信息的人，也顺便看了新闻。", "en": "Research by Tian Yang, Huang Shengchun and others at the University of Pennsylvania found that people who like to use Toutiao to read entertainment information also incidentally read news."}, {"start": 417.1, "end": 429.34, "text": "也就是说，人们使用算法驱动的信息分发平台之后，并没有陷入娱乐的茧房中不可自拔，而是随着娱乐信息消费的增加，新闻信息的消费也增加。", "en": "That is to say, after people use algorithm-driven information distribution platforms, they do not fall into entertainment cocoons and become unable to extricate themselves; instead, as entertainment information consumption increases, news information consumption also increases."}, {"start": 429.34, "end": 440.62, "text": "从传播的角度上讲，这个研究的结果很有意义，因为它提出了一个反常识的发现：算法平台上的消费者不仅没有娱乐至死，而是也履行着“好公民”的职责。", "en": "From a communication perspective, this research result is very meaningful, because it proposes a counter-intuitive discovery: consumers on algorithm platforms not only do not amuse themselves to death, but also fulfil their duties as 'good citizens'."}, {"start": 440.62, "end": 444.77, "text": "此外，从技术哲学的视角，技术与社会相互建构。", "en": "In addition, from the perspective of philosophy of technology, technology and society mutually construct each other."}, {"start": 444.77, "end": 451.8, "text": "推荐算法并不是一个完全独立的存在，而是与多种社会因素相互交织、共同发展的结果。", "en": "Recommendation algorithms are not a completely independent existence, but the result of intertwining and co-developing with various social factors."}, {"start": 451.8, "end": 462.17, "text": "它根据我们的个人兴趣来推荐信息，但也受到政府、公司、用户等多种社会因素共同影响，进而产生了“千人千面”的推荐效果。", "en": "They recommend information according to our personal interests, but are also jointly influenced by governments, companies, users and other social factors, thereby producing the 'thousands of people, thousands of faces' recommendation effect."}, {"start": 462.17, "end": 470.21, "text": "而当我们搞清楚了何为算法、何为茧房，我们也就可以理解为什么算法成了信息茧房的替罪羊。", "en": "And when we understand what algorithms are and what cocoons are, we can also understand why algorithms have become the scapegoat for information cocoons."}, {"start": 470.21, "end": 475.54, "text": "第一，这个替罪羊现象是大众认知仓促简化的结果。", "en": "First, this scapegoat phenomenon is the result of hasty simplification of mass cognition."}, {"start": 475.54, "end": 481.85, "text": "算法技术深度嵌入日常生活后，和各样社会问题产生了复杂的勾连。", "en": "After algorithm technology became deeply embedded in daily life, it became intricately linked with various social problems."}, {"start": 481.85, "end": 497.02, "text": "但人们并没有时间、或没有心力去进行明辨，就想要寻求一个易懂的、易交流的说法，来描述这种“千人千面”的信息体验，却找不到除茧房、过滤泡这类比喻之外的词汇。", "en": "But people do not have the time, or do not have the energy, to distinguish clearly, and want to seek an easy-to-understand, easy-to-communicate statement to describe this 'thousands of people, thousands of faces' information experience, yet cannot find vocabulary other than metaphors like cocoons and filter bubbles."}, {"start": 497.02, "end": 505.13, "text": "于是，在大众讨论中，信息茧房的概念被挪用和滥用，相应地，概念语义也出现了泛化。", "en": "Thus, in public discussion, the information cocoon concept has been appropriated and abused, and accordingly, the concept's semantics have also become generalised."}, {"start": 505.13, "end": 511.66, "text": "把对信息茧房、沟通困难等的担忧，都仓促地挪用到了推荐算法上。", "en": "Concerns about information cocoons, communication difficulties, etc., have all been hastily appropriated to recommendation algorithms."}, {"start": 511.66, "end": 522.26, "text": "如果人们不愿意充分全面地去认知算法的原理，信息茧房的含义，就匆匆地将信息茧房完全归咎于算法，也是有失公允的。", "en": "If people are unwilling to fully and comprehensively understand the principles of algorithms, hastily attributing the meaning of information cocoons entirely to algorithms is also unfair."}, {"start": 522.26, "end": 529.1, "text": "第二，正如社会心理学的“替罪羊理论”所说，人们往往会把负面体验归因于外群体。", "en": "Second, as social psychology's 'scapegoat theory' says, people often attribute negative experiences to out-groups."}, {"start": 529.1, "end": 532.18, "text": "在这里，人们把社会问题归因于技术。", "en": "Here, people attribute social problems to technology."}, {"start": 532.18, "end": 541.94, "text": "人们如果在现实生活中意义感缺失，更倾向在信息流中花费更多时间，放下手机后，人们就容易将自己的空虚感归因到算法身上。", "en": "If people lack a sense of meaning in real life, they are more inclined to spend more time in information streams; after putting down their phones, people easily attribute their sense of emptiness to algorithms."}, {"start": 541.94, "end": 554.66, "text": "心理学家戈登·W·阿尔波特的“替罪羊理论”（scapegoat theory）提出，当人们经受负面的情绪时，会倾向于把这种感受去归咎于另一个群体或个人。", "en": "Psychologist Gordon W. Allport's 'scapegoat theory' proposes that when people experience negative emotions, they tend to attribute such feelings to another group or individual."}, {"start": 554.66, "end": 564.79, "text": "如果让算法作为信息茧房的背锅侠，蕴含了一个前提：用户是被动的，没有主动性的，技术为刀俎，网民为鱼肉。", "en": "Making algorithms the scapegoat for information cocoons implies a premise: users are passive, without initiative; technology is the knife and chopping block, and netizens are the meat on the block."}, {"start": 564.79, "end": 570.02, "text": "但实际上，推荐算法在技术上也给用户的兴趣赋予了很多能动性。", "en": "But in fact, recommendation algorithms technically also give users' interests a lot of initiative."}, {"start": 570.02, "end": 575.71, "text": "如果用户对京剧感兴趣，在京剧类型内容上停留时间长，就会得到更多的推送。", "en": "If a user is interested in Peking opera and stays long on Peking opera content, they will get more pushes."}, {"start": 575.71, "end": 582.43, "text": "其实，就算是没有算法的时代里，人们也会不同程度地生活在自己构建的同质化信息圈中。", "en": "In fact, even in an era without algorithms, people would live to varying degrees in homogeneous information circles th
