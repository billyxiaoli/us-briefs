one cannot be brainwashed by some grand-narrative media."}, {"start": 24.67, "end": 28.51, "text": "你每天看的新闻，有多少是你主动搜索的？", "en": "Of the news you read every day, how much did you actively search for?"}, {"start": 28.51, "end": 39.96, "text": "我认真回忆了一下自己的手机使用习惯，发现一个让人不太舒服的事实：过去一周，我在手机上点开的内容，90%以上是平台推给我的。", "en": "I seriously recalled my own phone usage habits and discovered an uncomfortable fact: in the past week, over 90% of the content I clicked on my phone was pushed to me by platforms."}, {"start": 39.96, "end": 44.71, "text": "我几乎没有主动打开过任何新闻客户端的”推荐”以外的栏目。", "en": "I almost never actively opened any column other than the 'recommendations' of any news client."}, {"start": 44.71, "end": 45.72, "text": "这不是个案。", "en": "This is not an isolated case."}, {"start": 45.72, "end": 56.35, "text": "哈佛大学尼曼新闻实验室曾有一项研究指出：超过60%的社交媒体用户，从未主动搜索过与他们政治观点相悖的信息。", "en": "Harvard University's Nieman Journalism Lab once had a study pointing out that over 60% of social media users have never actively searched for information contrary to their political views."}, {"start": 56.35, "end": 65.23, "text": "换句话说，大多数人以为自己在”看新闻”，实际上只是在算法的精心安排下，不断地看自己想看的东西。", "en": "In other words, most people think they are 'reading news', but in fact they are only, under the algorithm's careful arrangement, constantly reading things they want to read."}, {"start": 65.23, "end": 66.74, "text": "这就是信息茧房。", "en": "This is the information cocoon."}, {"start": 66.74, "end": 73.27, "text": "作为一个在大厂做了6年AI开发的工程师，我几乎每天都在和推荐算法打交道。", "en": "As an engineer who has done AI development at a big tech company for 6 years, I deal with recommendation algorithms almost every day."}, {"start": 73.27, "end": 78.43, "text": "我既参与过推荐系统的设计，也深刻感受到它对普通人认知的塑造力。", "en": "I have participated in designing recommendation systems, and also deeply feel their power in shaping ordinary people's cognition."}, {"start": 78.43, "end": 86.11, "text": "今天不聊技术细节，只想用最直白的话跟你聊聊：信息茧房到底是怎么把我们困住的，以及怎么真的走出去。", "en": "Today I won't discuss technical details; I just want to talk with you in the plainest words: how information cocoons trap us, and how to really walk out."}, {"start": 86.11, "end": 89.76, "text": "一、你以为的”视野开阔”，可能只是幻觉", "en": "I. The 'broad horizons' you think you have may just be an illusion."}, {"start": 89.76, "end": 97.2, "text": "信息茧房这个概念，最早是哈佛法学院教授凯斯·桑斯坦在2006年提出的。", "en": "The concept of information cocoons was first proposed by Harvard Law School professor Cass Sunstein in 2006."}, {"start": 97.2, "end": 103.25, "text": "他在《信息乌托邦》里写道：”人们总是倾向于听他们想听的话，看他们想看的东西。", "en": "He wrote in Information Utopia: 'People always tend to listen to what they want to hear, and watch what they want to watch."}, {"start": 103.25, "end": 107.74, "text": "长此以往，就会把自己封闭在一个越来越小的信息气泡里。", "en": "Over time, they enclose themselves in an ever-smaller information bubble."}, {"start": 107.74, "end": 112.54, "text": "”", "en": "''"}, {"start": 112.54, "end": 121.49, "text": "我在读研究生的时候对此深以为然——那时候我觉得自己每天刷知乎、刷微博，接触各路观点，视野足够开阔。", "en": "When I was in graduate school, I deeply agreed with this — at that time I felt that scrolling Zhihu and Weibo every day, contacting various views, gave me sufficiently broad horizons."}, {"start": 121.49, "end": 130.13, "text": "直到有一年，我在知乎上持续关注AI方向的讨论，算法敏锐地捕捉到了我的兴趣，开始疯狂给我推相关内容。", "en": "Until one year, I continuously followed AI discussions on Zhihu, and the algorithm keenly captured my interest and began frantically pushing me related content."}, {"start": 130.13, "end": 132.65, "text": "一开始我还挺开心，觉得平台懂我。", "en": "At first I was quite happy, feeling the platform understood me."}, {"start": 132.65, "end": 140.21, "text": "但三个月后我突然意识到：我已经很久没有在首页刷到任何与我立场不同、或者我不熟悉领域的观点了。", "en": "But three months later I suddenly realised: I had not scrolled to any views different from my stance, or in fields unfamiliar to me, on my homepage for a long time."}, {"start": 140.21, "end": 145.8, "text": "算法不是帮你拓展视野的工具，它是帮你高效获取”熟悉感”的工具。", "en": "Algorithms are not tools to help you expand horizons; they are tools to help you efficiently obtain 'familiarity'."}, {"start": 145.8, "end": 148.75, "text": "而熟悉感不等于全面认知。", "en": "And familiarity does not equal comprehensive cognition."}, {"start": 148.75, "end": 151.82, "text": "越依赖算法，茧房就越厚。", "en": "The more you rely on algorithms, the thicker the cocoon becomes."}, {"start": 151.82, "end": 155.14, "text": "二、茧房是怎么织起来的：三股力量", "en": "II. How cocoons are woven: three forces."}, {"start": 155.14, "end": 159.74, "text": "1. 推荐算法：你看什么，算法就喂你什么", "en": "1. Recommendation algorithms: whatever you watch, algorithms feed you."}, {"start": 159.74, "end": 168.14, "text": "推荐算法的底层逻辑并不复杂：你点了什么，平台就认为你喜欢什么；你停留时间长，平台就认为你越喜欢。", "en": "The underlying logic of recommendation algorithms is not complicated: whatever you click, the platform thinks you like; the longer you stay, the more the platform thinks you like it."}, {"start": 168.14, "end": 175.54, "text": "然后它会把更多同类内容推到你面前，形成一个不断自我强化的循环。", "en": "Then it pushes more similar content before you, forming a continuously self-reinforcing cycle."}, {"start": 175.54, "end": 189.14, "text": "很多人以为算法是”中性”的，但实际上，任何推荐系统都有”热门偏差”——它天然倾向于推送已经被大量互动验证过的内容，也就是大多数人都喜欢的内容。", "en": "Many people think algorithms are 'neutral', but in fact, any recommendation system has 'popularity bias' — it naturally tends to push content already validated by massive interaction, i.e., content most people like."}, {"start": 189.14, "end": 196.46, "text": "这在商业上是合理的，但代价是：小众的、边缘的、少数派的观点，会被系统性地边缘化。", "en": "This is commercially reasonable, but the cost is: niche, marginal, minority views are systematically marginalised."}, {"start": 196.46, "end": 201.58, "text": "久而久之，你以为你在看”全世界在发生什么”，实际上你只是在看”全世界都在讨论什么”。", "en": "Over time, you think you are watching 'what is happening in the whole world', but in fact you are only watching 'what the whole world is discussing'."}, {"start": 201.58, "end": 205.42, "text": "2. 社交圈层：你的朋友，决定你的信息边界", "en": "2. Social circles: your friends determine your information boundaries."}, {"start": 205.42, "end": 211.94, "text": "有一句话很形象：你以为你是鹤立鸡群，实际上只是鸡圈里的一只低着头的鸡。", "en": "There is a vivid saying: you think you are a crane among chickens, but in fact you are just a head-bowed chicken in the chicken pen."}, {"start": 211.94, "end": 218.26, "text": "你的朋友圈、转发的文章、讨论的话题，在很大程度上由你的社交圈层决定。", "en": "Your Moments, forwarded articles, and discussion topics are largely determined by your social circles."}, {"start": 218.26, "end": 225.58, "text": "如果你的朋友圈里大多是和你背景相似、观点相近的人，那么你们讨论的信息天然就是同质化的。", "en": "If most people in your Moments have similar backgrounds and similar views to yours, then the information you discuss is naturally homogenised."}, {"start": 225.58, "end": 229.61, "text": "不同意见不是不存在，而是根本进不了你的视野。", "en": "Different opinions do not not exist; they simply cannot enter your field of vision at all."}, {"start": 229.61, "end": 241.08, "text": "这是人类社交的本能，我们天然倾向于和与自己相似的人交往，这在进化上是合理的，但在信息获取上，它是一个隐形的墙。", "en": "This is human social instinct: we naturally tend to associate with people similar to ourselves. This is reasonable evolutionarily, but in information acquisition, it is an invisible wall."}, {"start": 241.08, "end": 246.31, "text": "3. 认知惯性：你自己也在拒绝不同的声音", "en": "3. Cognitive inertia: you yourself are also rejecting different voices."}, {"start": 246.31, "end": 254.66, "text": "这是最容易被忽视的一点：茧房不只是算法和社交圈造成的，你自己的认知惯性也在主动维护它。", "en": "This is the most easily overlooked point: cocoons are not only caused by algorithms and social circles; your own cognitive inertia is also actively maintaining them."}, {"start": 254.66, "end": 260.95, "text": "你有没有过这样的经历：看到一篇与你观点完全相反的文章，标题还没看完就关了？", "en": "Have you had this experience: seeing an article completely opposite to your view, closing it before even finishing the title?"}, {"start": 260.95, "end": 265.22, "text": "或者读了几句就怒火中烧，觉得对方简直不可理喻？", "en": "Or reading a few sentences and becoming furious, feeling the other party is simply unreasonable?"}, {"start": 265.22, "end": 267.82, "text": "这就是认知失调带来的本能排斥。", "en": "This is instinctive rejection brought by cognitive dissonance."}, {"start": 267.82, "end": 276.65, "text": "当新信息与已有认知产生冲突时，大脑会自动启动防御机制：不是去理解对方，而是去否定对方。", "en": "When new information conflicts with existing cognition, the brain automatically activates defence mechanisms: not to understand the other party, but to deny the other party."}, {"start": 276.65, "end": 283.85, "text": "这是人类进化出来的自我保护机制，但在信息时代，它让我们越来越难以接受异见。", "en": "This is a self-protection mechanism evolved by humans, but in the information age, it makes it increasingly difficult for us to accept dissent."}, {"start": 283.85, "end": 286.32, "text": "算法没有门，是你自己在关门。", "en": "Algorithms have no doors; you yourself are closing the door."}, {"start": 286.32, "end": 288.6, "text": "三、茧房里的局限", "en": "III. Limitations inside cocoons."}, {"start": 288.6, "end": 290.76, "text": "说几个我自己的真实经历。", "en": "Let me share a few of my own real experiences."}, {"start": 290.76, "end": 293.09, "text": "第一坑：技术优越感。", "en": "First pitfall: technological superiority."}, {"start": 293.09, "end": 300.1, "text": "前几年AI领域特别火的时候，我刷到大量关于”AI将改变一切”“传统行业将被颠覆”的文章。", "en": "A few years ago, when the AI field was particularly hot, I scrolled to a large number of articles about 'AI will change everything' and 'traditional industries will be disrupted'."}, {"start": 300.1, "end": 309.58, "text": "看多了以后，我开始形成一种强烈的技术决定论思维：一切问题的答案都在技术进步里，传统行业不拥抱AI就是等死。", "en": "After reading a lot, I began forming a strong technological determinism mindset: the answers to all problems lie in technological progress, and traditional industries that don't embrace AI are waiting to die."}, {"start": 309.58, "end": 321.98, "text": "直到有一年过年回家，我一个做制造业的亲戚跟我说，他现在工厂里引入了某套AI系统，结果工人不会用、维护成本高、产线效率反而下降了。", "en": "Until one year when I went home for Chinese New Year, a relative of mine in manufacturing told me that his factory had introduced a certain AI system, but workers couldn't use it, maintenance costs were high, and production line efficiency actually decreased."}, {"start": 321.98, "end": 325.15, "text": "我当时的第一反应就是：”那是因为你们没用对。", "en": "My first reaction at the time was: 'That's because you didn't use it right."}, {"start": 325.15, "end": 329.95, "text": "”", "en": "'"}, {"start": 329.95, "end": 337.75, "text": "但其实冷静下来想想，我的判断力已经被算法喂养得很单一了，我甚至没有兴趣去理解他的具体处境。", "en": "But actually, calming down and thinking about it, my judgment had already been fed very one-sidedly by algorithms, and I didn't even have interest in understanding his specific situation."}, {"start": 337.75, "end": 341.78, "text": "第二坑：信息偏食导致的视野收窄。", "en": "Second pitfall: narrowed horizons caused by information picky eating."}, {"start": 341.78, "end": 346.7, "text": "我有一段时间对某个AI技术特别感兴趣，天天刷相关论坛。", "en": "For a period, I was particularly interested in a certain AI technology and scrolled related forums every day."}, {"start": 346.7, "end": 356.23, "text": "结果算法认定这是我深度关注的话题，给我推了连续两周的高强度论文，几乎全是同一个角度和立场。", "en": "As a result, the algorithm determined this was a topic I followed deeply, and pushed me two consecutive weeks of high-intensity papers, almost all from the same angle and stance."}, {"start": 356.23, "end": 367.99, "text": "我一度以为自己掌握了事件的”全貌”，在公司的分享会上面侃侃而谈，在会后讨论的时候才发现，我看到的，只是冰山一角，有很多的信息根本没有进入到我的视野中。", "en": "I once thought I had mastered the 'full picture' of the event, talking eloquently at the company's sharing meeting, only to discover in post-meeting discussions that what I saw was just the tip of the iceberg, with a lot of information never entering my field of vision at all."}, {"start": 367.99, "end": 371.16, "text": "第三坑：把”听过”当成”懂过”。", "en": "Third pitfall: mistaking 'having heard' for 'having understood'."}, {"start": 371.16, "end": 379.56, "text": "算法时代还有一个幻觉：我觉得自己什么都了解了一点，财经、科技、文化、国际，都知道一点。", "en": "There is another illusion in the algorithm era: I feel I understand a bit of everything — finance, technology, culture, international affairs, a bit of all."}, {"start": 379.56, "end": 386.76, "text": "但实际上，”知道”和”理解”是两回事。", "en": "But in fact, 'knowing' and 'understanding' are two different things."}, {"start": 386.76, "end": 391.56, "text": "前者只需要刷到标题，后者需要系统性的学习和深度的思考。", "en": "The former only requires scrolling to a title; the latter requires systematic learning and deep thinking."}, {"start": 391.56, "end": 404.64, "text": "当我尝试把某个话题讲给别人听的时候，才发现我根本讲不清楚——因为我的”了解”只是算法喂给我的碎片化标签，不是真正的认知。", "en": "When I tried to explain a topic to others, I discovered I couldn't explain it clearly at all — because my 'understanding' was just fragmented labels fed to me by algorithms, not real cognition."}, {"start": 404.64, "end": 406.75, "text": "四、怎么真的打破茧房？", "en": "IV. How to really break cocoons?"}, {"start": 406.75, "end": 409.68, "text": "1. 主动搜索，而不是被动接收", "en": "1. Actively search, rather than passively receive."}, {"start": 409.68, "end": 416.81, "text": "每天给自己定一个很小的目标：至少有一次信息获取，是通过主动搜索完成的，而不是刷出来的。", "en": "Set yourself a very small goal every day: at least one information acquisition is completed through active searching, not scrolling."}, {"start": 416.81, "end": 417.96, "text": "具体怎么做？", "en": "How specifically?"}, {"start": 417.96, "end": 418.8, "text": "很简单。", "en": "Very simple."}, {"start": 418.8, "end": 427.2, "text": "你今天在朋友圈看到一篇文章，不要直接转发，而是先打开搜索引擎，输几个关键词，看看其他来源怎么说。", "en": "If you see an article in Moments today, don't forward it directly; instead, first open a search engine, enter a few keywords, and see what other sources say."}, {"start": 427.2, "end": 432.89, "text": "你不需要花很多时间，关键是你在建立一种”主动”的信息习惯，而不是被算法安排。", "en": "You don't need to spend much time; the key is that you are building an 'active' information habit, rather than being arranged by algorithms."}, {"start": 432.89, "end": 435.7, "text": "这就是在主动打破算法的壁垒。", "en": "This is actively breaking the algorithm's barriers."}, {"start": 435.7, "end": 438.38, "text": "2. 刻意关注一个”反对账号”", "en": "2. Deliberately follow an 'opposition account'."}, {"start": 438.38, "end": 449.38, "text": "人天生喜欢和自己同一阵营的人站在一起，但是我么你可以刻意找到几个和你观点相左、但内容质量还不错的账号，人后定期看一看。", "en": "People naturally like to stand with those in the same camp, but you can deliberately find a few accounts with views opposite to yours but with decent content quality, and then regularly look at them."}, {"start": 449.38, "end": 452.54, "text": "一开始肯定会很不舒服，甚至会生气，这很正常。", "en": "At first it will definitely be uncomfortable, even angering — this is normal."}, {"start": 452.54, "end": 461.42, "text": "关键是你要意识到：不舒服不等于对方说的没道理，只是你的认知在受到挑战，这只是在拓宽你的认知边界。", "en": "The key is to realise: discomfort does not mean the other party is unreasonable; it just means your cognition is being challenged, and this is just broadening your cognitive boundaries."}, {"start": 461.42, "end": 471.5, "text": "我在工作里也有类似的体验：我们团队做技术方案评审，最怕的就是”一致通过”——那往往意味着没人认真想过问题在哪。", "en": "I have similar experiences at work: when our team reviews technical proposals, what we fear most is 'unanimous approval' — that often means no one seriously thought about where the problems are."}, {"start": 471.5, "end": 475.03, "text": "有反对意见，才是接近真相的开始。", "en": "Having opposing opinions is the beginning of approaching truth."}, {"start": 475.03, "end": 477.19, "text": "3. 定期清理你的信息源", "en": "3. Regularly clean up your information sources."}, {"start": 477.19, "end": 490.56, "text": "每隔一段时间，我会做一次信息源”大扫除”：把过去一段时间在各个平台关注的账号重新过一遍，保留真正有价值的，取关那些只提供情绪共鸣但没有新信息的。", "en": "Every so often, I do a major 'clean-up' of information sources: re-examine the accounts followed on various platforms over the past period, keep those truly valuable, and unfollow those that only provide emotional resonance but no new information."}, {"start": 490.56, "end": 494.95, "text": "4. 学会区分”事实层”和”观点层”", "en": "4. Learn to distinguish the 'fact layer' from the 'view layer'."}, {"start": 494.95, "end": 500.9, "text": "信息茧房里最大的问题之一，是把观点当事实，把立场当真相。", "en": "One of the biggest problems in information cocoons is treating views as facts, and stances as truth."}, {"start": 500.9, "end": 508.34, "text": "遇到任何争议性话题，先问自己一个问题：什么是这件事的硬事实，什么是不同人的解读？", "en": "When encountering any controversial topic, first ask yourself a question: what are the hard facts of this matter, and what are different people's interpretations?"}, {"start": 508.34, "end": 512.06, "text": "事实是相对客观的，而解读是可以多元的。", "en": "Facts are relatively objective, while interpretations can be diverse."}, {"start": 512.06, "end": 517.3, "text": "不要在观点的层面吵得不可开交，而忘了先去对齐事实。", "en": "Don't quarrel endlessly at the level of views, forgetting to first align on facts."}, {"start": 517.3, "end": 521.38, "text": "5. 把你学到的讲给别人听", "en": "5. Tell what you've learned to others."}, {"start": 521.38, "end": 529.58, "text": "这是我认为最有效的方法：把一个你刚了解到的观点或信息，用自己的话完整地讲给一个不了解这个话题的人。", "en": "This is what I think is the most effective method: take a view or piece of information you just learned, and completely explain it in your own words to someone unfamiliar with the topic."}, {"start": 529.58, "end": 532.9, "text": "在讲的过程中，你会发现自己的理解到底有多深。", "en": "In the process of explaining, you will discover how deep your understanding really is."}, {"start": 532.9, "end": 536.57, "text": "很多你以为”懂了”的东西，讲出来才发现漏洞百出。", "en": "Many things you thought you 'understood', when spoken out, turn out to be full of holes."}, {"start": 536.57, "end": 540.58, "text": "这不是丢人的事，恰恰是学习的开始。", "en": "This is not shameful; it is precisely the beginning of learning."}, {"start": 540.58, "end": 544.13, "text": "五、茧房不会消失，但你可以不被它困住", "en": "V. Cocoons won't disappear, but you can avoid being trapped by them."}, {"start": 544.13, "end": 550.06, "text": "必须承认一件事：信息茧房不是任何一个个体能从根本上解决的问题。", "en": "One thing must be admitted: information cocoons are not a problem any individual can fundamentally solve."}, {"start": 550.06, "end": 556.18, "text": "算法的逻辑、社交的本能、认知的惯性，这些力量会一直存在，而且会越来越强。", "en": "The logic of algorithms, social instincts, cognitive inertia — these forces will always exist, and will only grow stronger."}, {"start": 556.18, "end": 559.73, "text": "AI推荐只会越来越精准，个性化只会越来越极致。", "en": "AI recommendations will only become more precise, and personalisation will only become more extreme."}, {"start": 559.73, "end": 562.42, "text": "但这不意味着我们只能束手就擒。", "en": "But this does not mean we can only surrender."}, {"start": 562.42, "end": 568.94, "text": "茧房不是一个物理的墙，它更像地心引力——你感觉不到它，但它一直在把你往下拉。", "en": "A cocoon is not a physical wall; it is more like gravity — you cannot feel it, but it is constantly pulling you down."}, {"start": 568.94, "end": 580.82, "text": "打破它的方法，不是去对抗整个系统，而是建立一些微小的日常习惯：主动搜索、接触异见、定期清理信息源、区分事实和观点、把你知道的讲出来。", "en": "The way to break it is not to fight the entire system, but to build some small daily habits: actively searching, contacting dissent, regularly cleaning information sources, distinguishing facts from views, and speaking out what you know."}, {"start": 580.82, "end": 590.83, "text": "这些习惯不会让你变成一个”全知全能”的人，但至少可以让你在面对一个复杂问题的时候，不只听到一种声音。", "en": "These habits won't make you an 'omniscient' person, but at least they allow you, when facing a complex problem, to hear more than one voice."}, {"start": 590.83, "end": 598.94, "text": "最后留一个问题给你：你上一次主动去听一个你不认同、甚至有点讨厌的观点，是在什么时候？", "en": "Finally, a question for you: when was the last time you proactively listened to a view you disagree with, or even somewhat dislike?"}, {"start": 598.94, "end": 602.62, "text": "如果你想了很久想不起来，也许答案已经很明显了。", "en": "If you thought for a long time and cannot recall, perhaps the answer is already obvious."}, {"start": 602.62, "end": 608.14, "text": "更多职场思考、技术实践分享，欢迎关注同名公众号四点半的理一", "en": "For more workplace thoughts and technical practice sharing, welcome to follow the official account of the same name, Si Dian Ban de Li Yi."}]}, {"title": "怎样避免活在信息茧房之中？ Part 29（78句，6:24）", "mp3": "upload-8-part29/audio.mp3", "dur": "6:24", "lines": [{"start": 0.0, "end": 5.04, "text": "你看什么、信什么，就会被塑造成什么样，且自己根本意识不到。", "en": "What you watch and what you believe shapes what you become, without you realising it at all."}, {"start": 5.04, "end": 7.87, "text": "你只会觉得：我所见为真，我所想是对。", "en": "You only feel: what I see is true, what I think is right."}, {"start": 7.87, "end": 14.47, "text": "你会发现，现在网上不管出个什么事，只要稍微有点争议，评论区立马变为两个阵营。", "en": "You will find that now, no matter what happens online, as long as it is slightly controversial, the comments section immediately becomes two camps."}, {"start": 14.47, "end": 19.75, "text": "一边是这么说的，一边是那么说的，两边都觉得自己占着理，都觉得对面那帮人不是蠢就是坏。", "en": "One side says this, the other side says that; both sides feel they are in the right, and feel the people on the other side are either stupid or bad."}, {"start": 19.75, "end": 24.24, "text": "并且，这两边用的所谓“事实”都不是一回事。", "en": "Moreover, the so-called 'facts' used by both sides are not the same thing at all."}, {"start": 24.24, "end": 29.35, "text": "比方说，同样一件事，A看到的是一套截图、一段视频、一个分析。", "en": "For example, for the same matter, A sees one set of screenshots, one video, one analysis."}, {"start": 29.35, "end": 34.27, "text": "B看到的则是另一套截图、另一段视频、另一个分析。", "en": "B sees another set of screenshots, another video, another analysis."}, {"start": 34.27, "end": 38.66, "text": "两边人拿到的所谓“证据”完全是反的，那你让他们怎么聊？", "en": "The so-called 'evidence' obtained by both sides is completely opposite — so how do you expect them to talk?"}, {"start": 38.66, "end": 40.39, "text": "聊不到一起去。", "en": "They cannot talk together."}, {"start": 40.39, "end": 45.26, "text": "更可怕的是：两边都觉得自己是那个掌握了真相的人。", "en": "Even more terrifying: both sides feel they are the ones who grasp the truth."}, {"start": 45.26, "end": 51.46, "text": "我原来也觉得，只要我多看、多听、多查，我就能离真相近一点。", "en": "I used to think that as long as I read more, listened more, and checked more, I could get closer to the truth."}, {"start": 51.46, "end": 59.18, "text": "后来我发现我太天真了，现在的问题并非是你查得够不够多，是你查到的那些东西，本身就是被人筛过一遍的。", "en": "Later I discovered I was too naive. The problem now is not whether you check enough; it is that the things you find have themselves been filtered by others."}, {"start": 59.18, "end": 70.58, "text": "你打开手机，刷出来的每一条，背后都站着一堆人，他们的工作就是研究你，研究你喜欢看什么、讨厌看什么、会对什么生气、会对什么感动。", "en": "You open your phone, and behind every item you scroll to stands a bunch of people whose job is to study you — studying what you like to watch, what you dislike, what makes you angry, what moves you."}, {"start": 70.58, "end": 75.19, "text": "然后他们就把这些内容喂到你嘴边，一条一条，一天一天。", "en": "Then they feed this content to your mouth, one by one, day by day."}, {"start": 75.19, "end": 78.98, "text": "时间长了，你看见的世界，就是他们想让你看见的世界。", "en": "Over time, the world you see is the world they want you to see."}, {"start": 78.98, "end": 84.55, "text": "你以为你在做选择，其实你只是在几个预设好的选项里头挑一个相对顺眼的。", "en": "You think you are making choices, but in fact you are only picking a relatively pleasing one among several preset options."}, {"start": 84.55, "end": 89.9, "text": "这话题聊到这里，你可能觉得我是在骂那些做平台的、做算法的。", "en": "Talking about this topic here, you may think I am scolding those who run platforms and make algorithms."}, {"start": 89.9, "end": 93.14, "text": "并不是的，其实人家也只是干活挣钱罢了。", "en": "Not at all. Actually, they are just working to earn money."}, {"start": 93.14, "end": 98.38, "text": "我真正想要表达的是：我们自己在这里边，到底起到了多大的作用？", "en": "What I really want to express is: how big a role do we ourselves play in this?"}, {"start": 98.38, "end": 102.14, "text": "我们老说“信息茧房”，老觉得是别人把我们关起来了。", "en": "We keep saying 'information cocoons', always feeling others have locked us up."}, {"start": 102.14, "end": 105.79, "text": "但其实，我们自己也在拼命往里头添砖加瓦。", "en": "But in fact, we ourselves are desperately adding bricks and tiles to it."}, {"start": 105.79, "end": 111.38, "text": "我们只选我们爱看的，只信我们想信的，只跟聊得来的人待着。", "en": "We only choose what we love to watch, only believe what we want to believe, and only stay with people we get along with."}, {"start": 111.38, "end": 116.02, "text": "谁要是跟我们想的不一样，我们就不搭理他，或者骂他。", "en": "Whoever thinks differently from us, we ignore him, or scold him."}, {"start": 116.02, "end": 118.34, "text": "这不就是自己把自己关进去了吗？", "en": "Isn't this locking ourselves in?"}, {"start": 118.34, "end": 122.95, "text": "而且这里头最悲哀的一点是：你关得越久，就越出不来。", "en": "And the saddest point here is: the longer you stay locked in, the harder it is to get out."}, {"start": 122.95, "end": 132.91, "text": "因为你已经不习惯外面的空气了，你看见不同意见，第一反应不会是好奇“他为什么这么想”，只会反感“他怎么这么想”。", "en": "Because you are no longer used to the air outside. When you see different opinions, your first reaction is not curiosity — 'why does he think this way' — but only disgust — 'how can he think this way'."}, {"start": 132.91, "end": 137.18, "text": "你失去了那种对未知的好奇，对不同的宽容。", "en": "You have lost that curiosity about the unknown, and tolerance for differences."}, {"start": 137.18, "end": 141.46, "text": "你把自己活成了一个闭环，进来的都是你认得的，出去的都是你不待见的。", "en": "You have lived yourself into a closed loop: what comes in is all what you recognise, what goes out is all what you dislike."}, {"start": 141.46, "end": 148.94, "text": "我经常在想，我们现在这么容易生气，这么容易站队，这么容易把别人当敌人，是不是也跟这有关系？", "en": "I often wonder: are we now so easily angered, so easily taking sides, so easily treating others as enemies — is it also related to this?"}, {"start": 148.94, "end": 152.66, "text": "因为你每天看到的，都是那些被挑出来刺激你的东西。", "en": "Because what you see every day are things picked out to stimulate you."}, {"start": 152.66, "end": 159.94, "text": "你看不到对方的难处，看不到事情的复杂，看不到这世上大多数人都只是在挣扎着过自己的日子。", "en": "You cannot see the other party's difficulties, cannot see the complexity of matters, cannot see that most people in this world are just struggling to live their own lives."}, {"start": 159.94, "end": 167.06, "text": "你看到的，是一个被简化过的、非黑即白的世界：好人是全好，坏人是全坏。", "en": "What you see is a simplified, black-and-white world: good people are entirely good, bad people are entirely bad."}, {"start": 167.06, "end": 170.35, "text": "对的事是绝对的对，错的事是彻底的错。", "en": "Right things are absolutely right, wrong things are thoroughly wrong."}, {"start": 170.35, "end": 172.51, "text": "但真实的生活不是这样的。", "en": "But real life is not like this."}, {"start": 172.51, "end": 177.74, "text": "真实的生活是：好人也会干混蛋事，坏人也有心疼的人。", "en": "Real life is: good people also do bastard things, and bad people also have people they care about."}, {"start": 177.74, "end": 180.74, "text": "你以为对的事，换个人看可能就是错的。", "en": "What you think is right may be wrong in someone else's eyes."}, {"start": 180.74, "end": 184.51, "text": "你恨得牙痒痒的人，也有他的理由和苦衷。", "en": "The people you hate to the point of gritted teeth also have their reasons and difficulties."}, {"start": 184.51, "end": 196.08, "text": "这事我到现在也还没完全整明白，但一点我比以前清楚了，就是别那么急着下结论，别那么急着把跟自己不一样的人推出去。", "en": "I still haven't fully figured this out, but one thing is clearer to me than before: don't rush to conclusions, and don't rush to push away people different from yourself."}, {"start": 196.08, "end": 199.27, "text": "你可以不认同他，但你得知道他为什么那么想。", "en": "You may disagree with him, but you must know why he thinks that way."}, {"start": 199.27, "end": 202.56, "text": "因为知道了，你才能真的说清楚你为什么不同意。", "en": "Because only by knowing can you really explain clearly why you disagree."}, {"start": 202.56, "end": 206.4, "text": "不然你骂半天，骂的都是你自己脑子里想象出来的那种靶子。", "en": "Otherwise, after scolding for a long time, what you scold are targets imagined in your own mind."}, {"start": 206.4, "end": 209.64, "text": "还有一点，就是别太相信自己的“独立思考”。", "en": "Another point: don't trust your own 'independent thinking' too much."}, {"start": 209.64, "end": 216.07, "text": "这话可能不太好听，但我越来越觉得，所谓的独立思考，很多时候就是个幻觉。", "en": "This may not sound pleasant, but I increasingly feel that so-called independent thinking is often an illusion."}, {"start": 216.07, "end": 220.51, "text": "你想的那些东西，往前倒几层，全是别人喂给你的。", "en": "The things you think, traced back a few layers, are all fed to you by others."}, {"start": 220.51, "end": 225.55, "text": "你以为是你自己想出来的，其实是你刷多了、听多了，自然就长在脑子里了。", "en": "You think you came up with them yourself, but in fact, after scrolling and listening a lot, they naturally grew in your brain."}, {"start": 225.55, "end": 231.26, "text": "真正能称得上独立思考的，是你能把自己的想法拆开来看：这个想法哪里来的？", "en": "What can truly be called independent thinking is being able to take your own ideas apart and look at them: where did this idea come from?"}, {"start": 231.26, "end": 232.7, "text": "我为什么信它？", "en": "Why do I believe it?"}, {"start": 232.7, "end": 234.46, "text": "有没有可能我信错了？", "en": "Is it possible I believe wrongly?"}, {"start": 234.46, "end": 237.46, "text": "如果错了，我愿不愿意改？", "en": "If wrong, am I willing to change?"}, {"start": 237.46, "end": 240.58, "text": "能做到这一点的人，说实话，不多。", "en": "People who can do this, honestly, are not many."}, {"start": 240.58, "end": 242.9, "text": "包括我自己，也经常做不到。", "en": "Including myself — I often cannot do it either."}, {"start": 242.9, "end": 251.78, "text": "但知道了，起码会在自己又开始上头的时候，愣上一楞，扪心自问上一句：这是我自己想的，还是别人想让我这么想的？", "en": "But knowing it, at least when I start getting worked up again, I pause for a moment and ask myself: is this my own thought, or is it what others want me to think?"}, {"start": 251.78, "end": 256.42, "text": "既然没人能看见全貌，那你就得时刻提醒自己，你看见的只是一部分。", "en": "Since no one can see the whole picture, you must constantly remind yourself that what you see is only a part."}, {"start": 256.42, "end": 259.94, "text": "你的那部分，不假，但也不全。", "en": "Your part is not false, but neither is it complete."}, {"start": 259.94, "end": 265.94, "text": "你信的那些东西，可能有一部分是真的，但也有一部分，是你想让它真的。", "en": "The things you believe may partly be true, but partly, they are what you want to be true."}, {"start": 265.94, "end": 271.78, "text": "你讨厌的那些人，可能有一部分是坏的，但也有一部分，是你把他们想坏的。", "en": "The people you hate may partly be bad, but partly, they are what you imagine to be bad."}, {"start": 271.78, "end": 274.7, "text": "你得给自己留个心眼，留个口子。", "en": "You must leave yourself a watchful eye, leave an opening."}, {"start": 274.7, "end": 281.54, "text": "这个口子，是用来装那些你不爱听、不想听、甚至一听就烦的东西的。", "en": "This opening is for holding things you don't like to hear, don't want to hear, and even feel annoyed as soon as you hear them."}, {"start": 281.54, "end": 285.62, "text": "这事难就难在这里，因为往这个口子里装东西，太难受了。", "en": "The difficulty lies precisely here, because putting things into this opening is very uncomfortable."}, {"start": 285.62, "end": 289.87, "text": "比方说，要你去看一个你讨厌的人的文章，你会气得想摔手机。", "en": "For example, asking you to read an article by someone you hate will make you so angry you want to smash your phone."}, {"start": 289.87, "end": 293.95, "text": "要你去了解一个你反对的观点，你会觉得脑子极其混乱。", "en": "Asking you to understand a view you oppose will make your brain feel extremely confused."}, {"start": 293.95, "end": 297.79, "text": "要你去跟一个跟你三观完全不同的人聊天，你恨不得扭头就走。", "en": "Asking you to chat with someone whose values are completely different from yours will make you want to turn around and leave."}, {"start": 297.79, "end": 299.18, "text": "但你得忍住。", "en": "But you must endure it."}, {"start": 299.18, "end": 303.67, "text": "因为只有在这些让你难受的时刻，你的脑子才是在转的。", "en": "Because only in these moments that make you uncomfortable is your brain actually turning."}, {"start": 303.67, "end": 307.2, "text": "只有在这些让你不舒服的瞬间，你才是在长进。", "en": "Only in these uncomfortable moments are you actually growing."}, {"start": 307.2, "end": 317.95, "text": "你天天舒舒服服地待在自己那一亩三分地里，听人说你爱听的话，信你愿意信的理，那你十年之后，还是今天的你。", "en": "If you comfortably stay in your own little patch every day, listening to people say what you love to hear, believing reasons you are willing to believe, then ten years later, you will still be today's you."}, {"start": 317.95, "end": 322.92, "text": "不，你比今天还糟，因为你的壳更硬了，更听不进人话了。", "en": "No — you will be worse than today, because your shell is harder, and you listen to people even less."}, {"start": 322.92, "end": 331.27, "text": "我这些年最大的一个体会就是：当你发现自己跟谁都能聊两句，不再急着反驳人，不再觉得自己天下第一对的时候，你是真的变强了。", "en": "My biggest realisation over these years is: when you find you can chat with anyone, no longer rush to refute people, and no longer feel you are the most right in the world, you have truly become stronger."}, {"start": 331.27, "end": 334.87, "text": "并非是那种咋咋呼呼的强，是那种心里有底的强。", "en": "Not that loud, blustering kind of strength, but the kind of strength with a solid foundation in your heart."}, {"start": 334.87, "end": 339.26, "text": "你知道这世界复杂，你知道自己有限，但你也不慌。", "en": "You know this world is complex, you know you are limited, but you are not panicked."}, {"start": 339.26, "end": 343.99, "text": "因为你能看懂别人为啥那么想，你能理解那些跟你不一样的人，也有他们的道理。", "en": "Because you can understand why others think that way, and you can understand that people different from you also have their reasons."}, {"start": 343.99, "end": 356.16, "text": "这种感觉，比你天天刷手机刷出来的那种“我对了”的快感，要踏实得多。", "en": "This feeling is much more solid than the 'I'm right' pleasure you get from scrolling your phone every day."}, {"start": 356.16, "end": 359.81, "text": "人这一辈子，其实就是在跟自己脑子里那点东西较劲。", "en": "A person's life is actually spent wrestling with the things in one's own mind."}, {"start": 359.81, "end": 361.97, "text": "你装进去什么，你就信什么。", "en": "Whatever you put in, you believe."}, {"start": 361.97, "end": 363.96, "text": "你信什么，你就活成什么样。", "en": "Whatever you believe, you live as."}, {"start": 363.96, "end": 371.81, "text": "你若是只装那些顺溜的、舒服的、哄你开心的东西，那你活到最后，就是一场自欺欺人的梦。", "en": "If you only put in smooth, comfortable things that coax you into happiness, then living to the end, you live a self-deceiving dream."}, {"start": 371.81, "end": 373.9, "text": "梦醒了，啥也没剩下。", "en": "When the dream wakes, nothing is left."}, {"start": 373.9, "end": 385.01, "text": "你若是愿意往里装点硌得慌的、难嚼的、让你难受的东西，那你活的这一辈子，至少是真真切切地跟这个世界撞过，疼过，也懂过。", "en": "If you are willing to put in things that are jarring, hard to chew, and make you uncomfortable, then this life you live has at least truly collided with this world, hurt, and understood."}]}, {"title": "怎样避免活在信息茧房之中？ Part 30（19句，4:02）", "mp3": "upload-8-part30/audio.mp3", "dur": "4:02", "lines": [{"start": 0.0, "end": 9.36, "text": "你其实已经找到答案了，就是「尝试搜索其他信息」，而要实现这一点最好的办法还是换语言、换平台", "en": "You have actually already found the answer, which is 'trying to search for other information', and the best way to achieve this is to change languages and change platforms."}, {"start": 9.36, "end": 20.88, "text": "得知「黑山共和国取消对華免签」，我还是偶然在公众号「地球知识局」上看到的，当时有许多自媒体也纷纷这样表述。", "en": "I learned that 'Montenegro cancelled visa-free access for China' only by chance when I saw it on the official account 'Earth Knowledge Bureau'; at the time, many self-media also expressed it this way."}, {"start": 20.88, "end": 40.32, "text": "文章说黑山将自2026年11月1日取消对中国等五国的免签政策，给出了权威出处，并指出黑山之前也从没有真正对華免签，原本的优惠政策，即「持有申根区和英爱美加澳新日韩签证或居留卡的可以免签30天」是否还有效需要进一步核实。", "en": "The article said Montenegro would cancel visa-free policies for China and four other countries from 1 November 2026, gave authoritative sources, and pointed out that Montenegro had never truly given visa-free access to China before, and whether the original preferential policy — 'holders of Schengen Area and UK, Ireland, US, Canada, Australia, New Zealand, Japan and South Korea visas or residence cards can enter visa-free for 30 days' — was still valid needed further verification."}, {"start": 40.32, "end": 51.6, "text": "黑山政府虽然明确通告「中国等国公民将需要办理黑山签证」，问AI和自己查资料都说取消了，不论是中国的还是美国的都建议我办理签证。", "en": "Although the Montenegrin government explicitly announced that 'citizens of China and other countries will need to apply for Montenegrin visas', asking AI and checking materials myself both said it was cancelled, and both Chinese and American sources advised me to apply for a visa."}, {"start": 51.6, "end": 59.45, "text": "但取消这些政策的目的在加入欧盟，因此我相信了公众号的说法，认为还需要进一步考证", "en": "But the purpose of cancelling these policies was joining the EU, so I believed the official account's statement, thinking further verification was needed."}, {"start": 59.45, "end": 70.92, "text": "今天又有知友在我的相关评论区里提到这件事情，我就决定再去查查看，先用英语搜「Montenegrin visa policy for Chinese citizens with valid Schengen residence permits」，", "en": "Today, another Zhihu friend mentioned this matter in my related comment section, so I decided to check again. First I searched in English for 'Montenegrin visa policy for Chinese citizens with valid Schengen residence permits'."}, {"start": 70.92, "end": 95.81, "text": "發现这次AI改口了，再点进信息来源，一篇土耳其人用英语写的政策详解，阅读漢语机翻，遇到不明白的就切换看英语原文（这么做是为了省时省力），", "en": "I discovered the AI changed its tune this time. Clicking into the information source, an article in English written by a Turk explaining the policy in detail, I read the Chinese machine translation, switching to the English original when I didn't understand something (this was to save time and effort)."}, {"start": 95.81, "end": 110.4, "text": "得出初步结论：确实可以继续凭特定第三国签证或居留卡免签入境黑山共和国30天，但阅读文章给出的黑山政府官网链接（PDF，塞尔维亚-克罗地亚语）没有找到信息来源", "en": "I reached a preliminary conclusion: it is indeed possible to continue entering Montenegro visa-free for 30 days with specific third-country visas or residence cards, but I could not find the information source in the Montenegrin government official website link (PDF, Serbian-Croatian) given by the article."}, {"start": 110.4, "end": 130.85, "text": "这时候就该我运用专业能力了，于是用塞尔维亚-克罗地亚语搜索文章给出的法条名字，再进入官网链接阅读原文并逐个翻译生词（可恶的PDF文档无法自动翻译，我也是看完了才想起来其实可以截图机翻先看大概意思），终于找到了需要的权威信息：", "en": "This is where I had to use my professional ability: I searched in Serbian-Croatian for the article names given by the article, then entered the official website link to read the original text and translate unfamiliar words one by one (damn PDF documents cannot be automatically translated; I only remembered after reading it all that I could have screenshotted and machine-translated to get the gist first), and finally found the authoritative information needed:"}, {"start": 130.85, "end": 132.41, "text": "Uredbu 法规", "en": "Uredbu — Regulation"}, {"start": 132.41, "end": 135.58, "text": "O izmjeni i dopunama uredbe o viznom režimu 关于《签证制度条例》的修订和补充", "en": "O izmjeni i dopunama uredbe o viznom režimu — On Amendments and Supplements to the Visa Regime Regulation"}, {"start": 135.58, "end": 137.02, "text": "Član 4 第4条", "en": "Član 4 — Article 4"}, {"start": 137.02, "end": 146.66, "text": "在第六条（这里指《签证制度条例》第六条）「他们可以」一词後加上「直到2026年10月31日」", "en": "In Article 6 (here referring to Article 6 of the Visa Regime Regulation), after the words 'they may', add the words 'until 31 October 2026'."}, {"start": 146.66, "end": 168.02, "text": "而没有对第7条和第9条做出任何修订，其中第7条是针对申根区签证和居留卡的免签政策，第9条是针对英爱美加澳新日韩的，也就是说这两条仍然有效，持这些证件的中国公民仍然可以免签前往黑山共和国30天，所以国内的信息直到我写文之前都还是错误和不准确的", "en": "But no amendments were made to Articles 7 and 9, of which Article 7 is the visa-free policy for Schengen Area visas and residence cards, and Article 9 is for the UK, Ireland, US, Canada, Australia, New Zealand, Japan and South Korea. In other words, these two articles remain valid, and Chinese citizens holding these documents can still travel to Montenegro visa-free for 30 days. So domestic information was still wrong and inaccurate up until I wrote this article."}, {"start": 168.02, "end": 171.1, "text": "Član 6 第六条（基于原文加上修订内容後的版本）", "en": "Član 6 — Article 6 (version based on the original text plus amendments)"}, {"start": 171.1, "end": 198.98, "text": "中华人民共和国公民，持有依照该国法规签发的有效旅行证件，可在2026年10月31日之前，作为共同入境、停留并离开黑山的组织旅游团，入境、过境黑山领土并在黑山停留最多30天，前提是持有已支付旅游行程的确认凭证，以及已确保返回原籍国或过境国的证明", "en": "Citizens of the People's Republic of China holding valid travel documents issued in accordance with that country's regulations may, until 31 October 2026, as an organised tourist group entering, staying in and leaving Montenegro together, enter, transit through and stay in Montenegro for up to 30 days, provided they hold confirmation of a paid tourist arrangement and proof of secured return to the country of origin or transit."}, {"start": 198.98, "end": 220.54, "text": "中华人民共和国公民，持有依照该国法规签发的有效商务护照，可在2026年10月31日之前，入境、过境黑山领土并在黑山停留最多30天，前提是持有符合短期停留签证（C类签证）签发具体条件法规的邀请函。", "en": "Citizens of the People's Republic of China holding valid business passports issued in accordance with that country's regulations may, until 31 October 2026, enter, transit through and stay in Montenegro for up to 30 days, provided they hold an invitation letter within the meaning of regulations governing detailed conditions for issuing short-stay visas (C visas)."}, {"start": 220.54, "end": 237.29, "text": "而如果你留在信息茧房里，那么你对这件事的看法大概率会是「一个不知道在哪的小国（这倒确实）出尔反尔（本来就没给过免签），为了跪舔西方针对我们中国人（不是针对中国人），我们不去了！", "en": "But if you stay in the information cocoon, your view of this matter would most likely be: 'A small country you don't even know where it is (which is indeed true) going back on its word (it never actually gave visa-free access), to kowtow to the West targeting us Chinese (not targeting Chinese people) — we're not going!"}, {"start": 237.29, "end": 242.09, "text": "」", "en": "」"}]}, {"title": "怎样避免活在信息茧房之中？ Part 31（41句，7:30）", "mp3": "upload-8-part31/audio.mp3", "dur": "7:30", "lines": [{"start": 0.0, "end": 11.23, "text": "中文互联网上，关注外国驻华使馆、驻华领事馆公开的新闻消息，以及外国企业驻华商会、企业联合会公开分享的新闻消息。", "en": "On the Chinese internet, follow news publicly released by foreign embassies and consulates in China, as well as news publicly shared by foreign companies' chambers of commerce and business federations in China."}, {"start": 11.23, "end": 18.31, "text": "另外这些渠道一般会有自己的订阅和其他分享新闻信息的途径，不只是通过主流社交媒体。", "en": "Additionally, these channels generally have their own subscriptions and other channels for sharing news information, not only through mainstream social media."}, {"start": 18.31, "end": 27.86, "text": "其余可以关注涉外法律、涉外金融等行业的案例、行业会议、内部交流，他们也像使馆、商会拥有自己的信息途径。", "en": "You can also follow cases, industry conferences and internal exchanges in foreign-related law, foreign-related finance and other industries; like embassies and chambers of commerce, they have their own information channels."}, {"start": 27.86, "end": 42.07, "text": "活在信息茧房中也不见得是绝对意义上的坏事，信息茧房大多数只是降低你与众不同的概率，通常不会直接损害你的利益，并且对于一些人而言，在信息茧房中可以免去很多烦恼。", "en": "Living in an information cocoon is not necessarily an absolutely bad thing. Information cocoons mostly just reduce your probability of being different, and usually do not directly harm your interests; and for some people, being in an information cocoon can spare them many worries."}, {"start": 42.07, "end": 56.28, "text": "干说理论太无聊，我随手举个例子，就拿已经多年成为热搜话题的PM2.5来说，假如你从头至尾都不知道什么是PM2.5，始终觉得今天天气有雾气、视线中有“薄白纱”，会如何呢？", "en": "Talking theory alone is too boring. Let me casually give an example: take PM2.5, which has been a hot search topic for years. Suppose from beginning to end you don't know what PM2.5 is, and always feel that today's weather is foggy, with a 'thin white gauze' in your vision — what would happen?"}, {"start": 56.28, "end": 82.39, "text": "如果你自身并不是PM2.5诱变肺腺癌基因携带人群，或许就在PM2.5的颗粒中日常工作和生活，该吃吃该喝喝，反倒是如果你了解到PM2.5的危害，你或许从此就会陷入焦虑，诸如家里一直要开空气净化器，出门必戴N95，一旦产生不戴口罩的GAP时间，你就担心你吸入了多少PM2.5颗粒，这些颗粒到底能否排出、代谢出人体等焦虑。", "en": "If you yourself are not in the population carrying genes for PM2.5-induced lung adenocarcinoma, perhaps you would just work and live daily among PM2.5 particles, eating and drinking as usual. On the contrary, if you learn about the harms of PM2.5, you might fall into anxiety from then on: keeping the air purifier on at home, always wearing an N95 when going out, and once there is a gap time without a mask, worrying about how many PM2.5 particles you inhaled, and whether these particles can be expelled or metabolised from the body."}, {"start": 82.39, "end": 102.38, "text": "PM2.5根据学术研究来看可能与肺腺癌尤其是磨玻璃影像、EGFR突变有关联，就如同抽烟和肺鳞癌、肺小细胞癌的关系，可是这也不是绝对的，否则河北、河南、山东等PM2.5浓度值较高的地区早就大规模爆发了。", "en": "According to academic research, PM2.5 may be associated with lung adenocarcinoma, especially ground-glass opacities and EGFR mutations, just like the relationship between smoking and lung squamous cell carcinoma and small cell lung cancer. But this is not absolute; otherwise, regions with higher PM2.5 concentrations such as Hebei, Henan and Shandong would have had large-scale outbreaks long ago."}, {"start": 102.38, "end": 111.55, "text": "不过有一说一，北京的居民明显会比周边省份对PM2.5更在意一些，可能还是北京的居民受教育程度更高一些所致。", "en": "However, to be fair, Beijing residents are clearly more concerned about PM2.5 than residents of surrounding provinces, possibly because Beijing residents have higher education levels."}, {"start": 111.55, "end": 116.88, "text": "我能想到信息茧房会直接伤害一个普通人可能常见的途径有两类：", "en": "The ways I can think of in which information cocoons might directly harm an ordinary person fall into two common categories:"}, {"start": 116.88, "end": 137.59, "text": "1.证券投资，信息茧房群体会存在投资的滞后性，对涨跌尤其主要是\"在自己一片茫然，自己得到的信息是形势一片大好\"中大跌，缺乏一手信息，而信息渠道活络的群体早就及时离场，最终承受较大的经济损失。", "en": "1. Securities investment: groups in information cocoons experience investment lag, especially crashing amid 'in their own confusion, the information they get is that the situation is excellent across the board', lacking first-hand information, while groups with active information channels have already exited in time, ultimately bearing larger economic losses."}, {"start": 137.59, "end": 152.4, "text": "2.医疗健康，因为缺乏现代医学的科普渠道或者被传统医学或伪科普包裹，没能及时检查或治疗尚在早期的恶疾，最终导致生命健康出现令人遗憾、无法挽回的损失。", "en": "2. Medical health: because of lacking modern medical science channels, or being wrapped in traditional medicine or pseudo-science, failing to check or treat early-stage serious diseases in time, ultimately causing regrettable, irreversible losses to life and health."}, {"start": 152.4, "end": 163.75, "text": "总结下来就是，对于少数突破信息茧房的，受益手段五花八门，对于处于信息茧房的人来说大多数人也不会直接受害。", "en": "In summary, for the few who break through information cocoons, the means of benefiting are varied; for people in information cocoons, most will not be directly harmed either."}, {"start": 163.75, "end": 177.26, "text": "让一个人沉迷碎片信息、热点和争论，把收藏资料当成学习，把加班和重复劳动当成努力，再给他一些快速成功的幻觉，他自然就很难真正成长。", "en": "Make a person addicted to fragmented information, hot topics and arguments, treat collecting materials as learning, treat overtime and repetitive labour as effort, and give him some illusions of quick success — and he will naturally find it hard to truly grow."}, {"start": 177.26, "end": 188.18, "text": "找到更好的一手信息，把零散认知整理成系统知识，再通过实践、犯错、复盘和跟高手切磋，把知识练成真正的技能。", "en": "Find better first-hand information, organise scattered cognition into systematic knowledge, and then through practice, making mistakes, reviewing, and sparring with experts, turn knowledge into real skills."}, {"start": 188.18, "end": 193.22, "text": "最后拼的是自己的天赋、兴趣、习惯，以及能不能长期坚持。", "en": "In the end, it comes down to your own talent, interests, habits, and whether you can persist long-term."}, {"start": 193.22, "end": 203.35, "text": "只要愿意亲自花一点时间去追溯信息源，一层一层往下挖，去读、去看最原始的材料，就已经领先了至少 99% 的人。", "en": "As long as you are willing to personally spend a little time tracing information sources, digging down layer by layer, reading and watching the most original materials, you are already ahead of at least 99% of people."}, {"start": 203.35, "end": 211.58, "text": "以今年美国几项重磅的加密法案为例，完整演讲视频其实都公开在 SEC 官方的频道上。", "en": "Take this year's several blockbuster US crypto bills as an example: the complete speech videos are actually all public on the SEC's official channel."}, {"start": 211.58, "end": 214.27, "text": "点进去看了一下，播放量竟然只有几千次。", "en": "Clicking in to look, the play counts were surprisingly only a few thousand."}, {"start": 214.27, "end": 225.38, "text": "这意味着，绝大多数人接收到的，都是经过二次剪辑、解读、甚至被算法包装过的“二手信息”，甚至只是短视频里的片段。", "en": "This means that what the vast majority of people receive is 'second-hand information' that has been re-edited, interpreted, and even packaged by algorithms — or even just clips in short videos."}, {"start": 225.38, "end": 229.46, "text": "你别不信，再说一个简单的，查一个地区的工资水平", "en": "Don't believe me? Let me give another simple one: checking a region's salary level"}, {"start": 229.46, "end": 234.5, "text": "很多人是不是第一时间看什么智联招聘的报告，现在可能会问豆包", "en": "Do many people first look at Zhaopin recruitment reports, and now possibly ask Doubao?"}, {"start": 234.5, "end": 272.26, "text": "但是要看到真实的，你要直接查当地“社保基数”，这个数据就是上一年所有用人单位上报的员工平均月薪，是包括五险一金和所得税在里面的月薪最大值，经过税务老师认证，是最接近实际情况的信息，你可以永远相信中国税务认证。", "en": "But to see the real picture, you must directly check the local 'social insurance contribution base'. This data is the average monthly salary of all employees reported by all employers in the previous year, including the five insurances, one fund and income tax — the maximum monthly salary figure, certified by tax officers, the information closest to reality. You can always trust Chinese tax certification."}, {"start": 272.26, "end": 279.58, "text": "这个数决定了公司的用工税，也就决定了人效的下限，也就决定了这个地区企业能选择的业务范围", "en": "This number determines companies' employment taxes, which determines the floor of human efficiency, which determines the range of businesses companies in this region can choose."}, {"start": 279.58, "end": 308.26, "text": "不管是投资还是生活，避免毁灭性损失的一个要点是：尽量避免参与任何信息不对称，信息上自己没有优势的博弈，否则即使看似有短期局部的利益，因为放弃验证而选择盲从，因为信息不对称，所以对未来的某个必然的变化，就是看不到，导致自己突然满盘皆输，如果信息的传播，叙事的设定，都是由对手随意主导，无法独立验证，尤其需要警惕。", "en": "Whether investing or living, one key point in avoiding devastating losses is: try to avoid participating in any game with information asymmetry, where you have no information advantage. Otherwise, even if there seem to be short-term partial benefits, because you give up verification and choose blind obedience, because of information asymmetry, you cannot see a certain inevitable future change, leading to suddenly losing everything. If the dissemination of information and the setting of narratives are arbitrarily dominated by opponents, and cannot be independently verified, special vigilance is needed."}, {"start": 308.26, "end": 317.45, "text": "经验不足的人，容易因为短期利益的诱惑，因为懒惰，而放弃对信息的持续的独立验证，最终沦为接盘者", "en": "People lacking experience easily, because of the temptation of short-term benefits and because of laziness, give up continuous independent verification of information, and ultimately become bag holders."}, {"start": 317.45, "end": 320.21, "text": "给你几个小方法，你可以试试", "en": "Here are a few small methods you can try:"}, {"start": 320.21, "end": 331.78, "text": "别听别人说什么，大部分人其实最大问题反而就是太在乎社会的大潮流，太好奇别人知不知道什么自己不知道的信息，而忽视了自身，导致没有自我。", "en": "Don't listen to what others say. Most people's biggest problem is actually caring too much about society's major trends, being too curious about what others know that they don't, while neglecting themselves, leading to having no self."}, {"start": 331.78, "end": 336.58, "text": "不知道自己喜欢什么，不知道自己擅长什么，更不相信自己能做什么。", "en": "Not knowing what you like, not knowing what you are good at, and not believing what you can do."}, {"start": 336.58, "end": 345.46, "text": "把目光放回自己身上，整合一切关于自己的信息，尽可能把自己的优势发挥到最大，这才是大部分人最急需研究的道路。", "en": "Turn your attention back to yourself, integrate all information about yourself, and maximise your advantages as much as possible — this is the path most people most urgently need to study."}, {"start": 345.46, "end": 358.1, "text": "我们太擅长做符合趋势的大多数而不擅长做自己了，等到环境改变导致你发现衡量自身价值的标准原则变了的时候，就又会陷入存在主义的困境。", "en": "We are too good at being the majority conforming to trends, and not good at being ourselves. When environmental changes make you discover that the standards and principles for measuring your own value have changed, you fall into an existential dilemma."}, {"start": 358.1, "end": 364.9, "text": "所以与其追寻外界给予自身价值，不如自己为自己努力，去发掘自身独特的价值。", "en": "So rather than pursuing value given by the outside world, work hard for yourself and discover your own unique value."}, {"start": 364.9, "end": 393.62, "text": "比如我对一件事情自己有5个想法在权衡，我需要尽可能到处去采集别的各种不同人对此的10种其他想法，然后这15个想法放在一起，在心里给它们每个标上当下认为的重要度、靠谱度，比如说1号想法是80%，2号想法是30%，3号想法是-60%，然后再得出，我初步应持有一个，或多个怎么样的整体看法、行动策略，是能比较比如应对这些不同概率情况的。", "en": "For example, if I have 5 ideas about something that I am weighing, I need to collect as many as possible of 10 other ideas from various different people about it. Then put these 15 ideas together, and in my mind mark each with its currently perceived importance and reliability — for example, idea 1 is 80%, idea 2 is 30%, idea 3 is -60% — and then conclude what overall view or views and action strategies I should preliminarily hold, which can better handle these different probability situations."}, {"start": 393.62, "end": 402.5, "text": "如果是多个看法和策略选项，那么需要自知其中哪个是较保守型，哪个是较激进型的，程度分别是多少，对我意味着什么。", "en": "If there are multiple views and strategy options, you need to know which is more conservative, which is more aggressive, to what degree respectively, and what they mean for you."}, {"start": 402.5, "end": 409.1, "text": "最后是随着时间和事情的发展，所释放出的新信息，将上述适时调整。", "en": "Finally, as time and matters develop, adjust the above in a timely manner with newly released information."}, {"start": 409.1, "end": 424.39, "text": "在这个过程中，你要对不同想法的获取应该抱有积极，甚至感觉到有热情兴奋的态度，才能更好地完成第一步“尽可能到处采集”，这也是你进行第二步的基础。", "en": "In this process, you should approach acquiring different ideas with a positive, even enthusiastic and excited attitude, to better complete the first step of 'collecting as much as possible everywhere' — which is also the foundation for your second step."}, {"start": 424.39, "end": 431.16, "text": "要学会加杠杆，别给资金加杠杆，而是给人生加杠杆，怎么阅读更少的信息？", "en": "Learn to leverage — not to leverage funds, but to leverage life. How to read less information?"}, {"start": 431.16, "end": 432.48, "text": "这是时间杠杆。", "en": "This is time leverage."}, {"start": 432.48, "end": 439.63, "text": "怎么更大范围地接触，用更高的标准过滤，然后和一小部分朋友深度交往？", "en": "How to reach a wider range, filter with higher standards, and then deeply interact with a small number of friends?"}, {"start": 439.63, "end": 443.06, "text": "这是社交杠杆，怎么理解那些不变的事物？", "en": "This is social leverage. How to understand things that don't change?"}, {"start": 443.06, "end": 447.38, "text": "这是思考杠杆，比如，怎么感受每一刻的拥有和幸运？", "en": "This is thinking leverage. For example, how to feel each moment's possession and luck?"}, {"start": 447.38, "end": 450.91, "text": "这是幸福杠杆，生活是发现，更是创造。", "en": "This is happiness leverage. Life is discovery, and even more, creation."}]}, {"title": "怎样避免活在信息茧房之中？ Part 32（217句，14:49）", "mp3": "upload-8-part32/audio.mp3", "dur": "14:49", "lines": [{"start": 0.0, "end": 3.84, "text": "你每刷一次手机，都在给未来的自己挖坟。", "en": "Every time you scroll your phone, you are digging a grave for your future self."}, {"start": 3.84, "end": 11.28, "text": "三年后，你会发现自己活在一个由算法亲手打造的活棺材里，连喊救命都只听见自己的回音。", "en": "Three years later, you will find yourself living in a living coffin hand-built by algorithms, where even crying for help only echoes back to yourself."}, {"start": 11.28, "end": 18.91, "text": "公元前210年，秦始皇死在沙丘，赵高扣下遗诏，逼死扶苏，扶胡亥登基。", "en": "In 210 BC, Qin Shi Huang died at Shaqiu. Zhao Gao withheld the final edict, forced Fusu to death, and installed Hu Hai on the throne."}, {"start": 18.91, "end": 24.0, "text": "从此，胡亥听到的每一句话，都经过赵高过滤。", "en": "From then on, every word Hu Hai heard had been filtered by Zhao Gao."}, {"start": 24.0, "end": 28.13, "text": "赵高牵来一头鹿，当着满朝文武说：“这是马。", "en": "Zhao Gao led a deer before the full court and said: 'This is a horse."}, {"start": 28.13, "end": 32.45, "text": "”胡亥笑了：“丞相错了，这是鹿。", "en": "' Hu Hai laughed: 'Chancellor, you are wrong; this is a deer."}, {"start": 32.45, "end": 37.25, "text": "”", "en": "'"}, {"start": 37.25, "end": 48.24, "text": "他问左右，有人沉默，有人说是马，胡亥开始怀疑自己的眼睛，最后被赵高软禁，逼他自杀，他死前想吃一口粗粮，都没人给他。", "en": "He asked those around him: some were silent, some said it was a horse. Hu Hai began doubting his own eyes, and was finally placed under house arrest by Zhao Gao and forced to commit suicide. Before dying, he wanted a bite of coarse grain, and no one gave it to him."}, {"start": 48.24, "end": 51.79, "text": "一个皇帝，被信息茧房活活饿死。", "en": "An emperor starved to death by an information cocoon."}, {"start": 51.79, "end": 53.28, "text": "这不是古代专利。", "en": "This is not exclusive to ancient times."}, {"start": 53.28, "end": 57.72, "text": "今天你手机里的算法，就是赵高。", "en": "Today, the algorithm in your phone is Zhao Gao."}, {"start": 57.72, "end": 60.17, "text": "它知道你爱看什么，恨什么，怕什么。", "en": "It knows what you love to watch, hate, and fear."}, {"start": 60.17, "end": 64.13, "text": "你点了一个“男人没一个好东西”，它给你推一百条“渣男实录”。", "en": "You click one 'no man is any good', and it pushes you a hundred 'scumbag chronicles'."}, {"start": 64.13, "end": 70.37, "text": "你点了一个“穷人就是懒”，它给你推一千条“底层互害”，你以为你在看世界，其实是世界在看你的笑话。", "en": "You click one 'poor people are just lazy', and it pushes you a thousand 'bottom-level mutual harm' pieces. You think you are watching the world, but in fact the world is laughing at you."}, {"start": 70.37, "end": 72.82, "text": "心理学上，这叫“确认偏误”。", "en": "In psychology, this is called 'confirmation bias'."}, {"start": 72.82, "end": 78.05, "text": "你只相信你愿意相信的，大脑为了省能量，自动屏蔽反对声音。", "en": "You only believe what you are willing to believe; to save energy, the brain automatically blocks opposing voices."}, {"start": 78.05, "end": 86.76, "text": "算法把这套本能放大了一万倍，再加上“回音室效应”，你身边全是和你一样的人，你们互相点头，越点越极端。", "en": "Algorithms amplify this instinct ten thousand times, plus the 'echo chamber effect': everyone around you is like you, nodding at each other, nodding ever more extremely."}, {"start": 86.76, "end": 89.69, "text": "最后你不是在思考，你是在被喂养。", "en": "In the end, you are not thinking; you are being fed."}, {"start": 89.69, "end": 90.72, "text": "怎么破？", "en": "How to break it?"}, {"start": 90.72, "end": 93.07, "text": "给你五个极其落地的操作。", "en": "Here are five extremely practical operations."}, {"start": 93.07, "end": 96.86, "text": "第一、主动关注三个你讨厌但理性的人", "en": "First: proactively follow three people you dislike but who are rational."}, {"start": 96.86, "end": 100.03, "text": "不是让你认同他们，是让你知道他们怎么想。", "en": "Not to make you agree with them, but to let you know how they think."}, {"start": 100.03, "end": 105.26, "text": "每次刷到他们的内容，别急着划走，问一句：“他为什么这么想？", "en": "Every time you scroll to their content, don't rush to swipe away; ask: 'Why does he think this way?"}, {"start": 105.26, "end": 106.7, "text": "他的证据是什么？", "en": "What is his evidence?"}, {"start": 106.7, "end": 109.39, "text": "”这叫“认知多样性疫苗”。", "en": "' This is called a 'cognitive diversity vaccine'."}, {"start": 109.39, "end": 112.39, "text": "第二、每周做一次“信息断食”", "en": "Second: do an 'information fast' once a week."}, {"start": 112.39, "end": 118.1, "text": "选半天，关掉所有推送，去线下和人面对面聊天。", "en": "Pick half a day, turn off all pushes, and go chat face-to-face with people offline."}, {"start": 118.1, "end": 122.74, "text": "去菜市场听大妈骂菜价，去公园听大爷吹牛。", "en": "Go to the wet market and listen to aunties cursing vegetable prices; go to the park and listen to uncles bragging."}, {"start": 122.74, "end": 127.01, "text": "真实世界的噪音，比算法的精准更接近真相。", "en": "The noise of the real world is closer to truth than the precision of algorithms."}, {"start": 127.01, "end": 129.89, "text": "第三、对任何信息问三个问题", "en": "Third: ask three questions about any piece of information."}, {"start": 129.89, "end": 131.02, "text": "谁说的？", "en": "Who said it?"}, {"start": 131.02, "end": 132.41, "text": "他有什么利益？", "en": "What interests does he have?"}, {"start": 132.41, "end": 133.49, "text": "反方怎么说？", "en": "What does the other side say?"}, {"start": 133.49, "end": 136.8, "text": "别急着转发，先查原始信源。", "en": "Don't rush to forward it; first check the original source."}, {"start": 136.8, "end": 141.31, "text": "你转发的每一条谣言，都是在给别人的镰刀递韭菜。", "en": "Every rumour you forward is handing leeks to someone else's sickle."}, {"start": 141.31, "end": 144.38, "text": "第四、建立“反脆弱信息食谱”", "en": "Fourth: build an 'antifragile information diet'."}, {"start": 144.38, "end": 149.62, "text": "30%你认同的，30%你反对的，30%你完全陌生的。", "en": "30% what you agree with, 30% what you oppose, 30% completely unfamiliar to you."}, {"start": 149.62, "end": 155.09, "text": "强制自己每个月读一本你以前绝不会碰的书，关注一个你完全不懂的领域。", "en": "Force yourself to read one book every month that you would never have touched before, and follow a field you completely don't understand."}, {"start": 155.09, "end": 158.33, "text": "你的大脑需要异见，就像身体需要维生素。", "en": "Your brain needs dissent, just as the body needs vitamins."}, {"start": 158.33, "end": 161.26, "text": "第五、每月做一次“观点拆迁”", "en": "Fifth: do a 'view demolition' once a month."}, {"start": 161.26, "end": 166.34, "text": "写一篇你反对的观点，用最强论据，写到你自己都快被说服。", "en": "Write an article for a view you oppose, using the strongest arguments, until you almost convince yourself."}, {"start": 166.34, "end": 171.46, "text": "这个动作，比读一百篇鸡汤更能拆掉你思维里的墙。", "en": "This action dismantles the walls in your thinking better than reading a hundred chicken-soup articles."}, {"start": 171.46, "end": 176.78, "text": "信息茧房最可怕的地方，不是你不知道世界，而是你以为你知道。", "en": "The most terrifying aspect of information cocoons is not that you don't know the world, but that you think you know it."}, {"start": 176.78, "end": 183.02, "text": "别让算法替你思考，别让舒适区成为你的坟墓，你的大脑，不是别人的跑马场。", "en": "Don't let algorithms think for you; don't let your comfort zone become your grave. Your brain is not someone else's racetrack."}, {"start": 183.02, "end": 185.06, "text": "最简单的方法就是学习逻辑。", "en": "The simplest method is to learn logic."}, {"start": 185.06, "end": 196.46, "text": "逻辑可以让你拥有预测功能，错误的信息很容易被识破，当然这样需要你有基本的正确信息，即底层逻辑，但是，大部分人的底层逻辑都是错的。", "en": "Logic gives you predictive ability; wrong information is easily seen through. Of course, this requires you to have basically correct information, i.e., underlying logic. However, most people's underlying logic is wrong."}, {"start": 196.46, "end": 210.31, "text": "其实大多数人是被洗脑造成的底层逻辑错误，要想恢复自然的科学的逻辑实际上是非常困难的，这需要你有主动摆脱错误的底层逻辑的观念，自然也不是什么难事。", "en": "In fact, most people have wrong underlying logic caused by brainwashing. To restore natural, scientific logic is actually very difficult, requiring you to have the concept of proactively getting rid of wrong underlying logic — but naturally, it is not that difficult either."}, {"start": 210.31, "end": 213.43, "text": "在知乎看到这样的提问，不免感到错愕。", "en": "Seeing such a question on Zhihu, I can't help feeling surprised."}, {"start": 213.43, "end": 216.55, "text": "知乎的左中右派网友俱全。", "en": "Zhihu has netizens from the left, centre and right all present."}, {"start": 216.55, "end": 219.26, "text": "各种观念激烈碰撞，信源丰富。", "en": "All kinds of views collide fiercely, with rich sources."}, {"start": 219.26, "end": 225.79, "text": "只要注重独立思考，常来知乎了解时政，就可以脱离信息茧房。", "en": "As long as you focus on independent thinking and often come to Zhihu to learn about current affairs, you can escape information cocoons."}, {"start": 225.79, "end": 228.55, "text": "当然这仅对独立思考的人有效。", "en": "Of course, this only works for people who think independently."}, {"start": 228.55, "end": 234.02, "text": "如果某人缺乏独立思考的习惯，那么他永远无法脱离信息茧房。", "en": "If someone lacks the habit of independent thinking, he can never escape information cocoons."}, {"start": 234.02, "end": 237.91, "text": "因为他的大脑已经被自我囚禁，他的大脑就是他的信息茧房。", "en": "Because his brain has already imprisoned itself; his brain is his information cocoon."}, {"start": 237.91, "end": 242.06, "text": "就算他处在完全开放的信息时空也无济于事。", "en": "Even if he is in a completely open information space-time, it will not help."}, {"start": 242.06, "end": 245.18, "text": "首先是不能听一面之词，要看多方的信息。", "en": "First, you cannot listen to only one side; you must look at information from multiple sides."}, {"start": 245.18, "end": 249.14, "text": "其次是要符合逻辑，有些东西看着就不符合逻辑，那肯定有鬼。", "en": "Second, it must conform to logic. Some things look illogical at a glance — there must be something fishy."}, {"start": 249.14, "end": 256.03, "text": "哪怕是同一个事儿，事实骨架差不多，但包的“意义外衣”一换，味道就完全相反了。", "en": "Even for the same matter, with roughly the same factual skeleton, once the 'cloak of meaning' wrapped around it changes, the flavour becomes completely opposite."}, {"start": 256.03, "end": 259.56, "text": "但是事情还是那个事儿，意思和理解就南辕北辙了。", "en": "But the matter is still that matter; the meaning and understanding become diametrically opposed."}, {"start": 259.56, "end": 260.59, "text": "我举个例子：", "en": "Let me give an example:"}, {"start": 260.59, "end": 270.6, "text": "美国主流叙事：日本帝国主义卑鄙无耻的偷袭、不宣而战、背信弃义的“国耻日”，把美国彻底拖入正义的反法西斯战争。", "en": "Mainstream American narrative: Japan's despicable, shameless surprise attack, undeclared war, treacherous 'Day of National Humiliation', dragging America completely into the just anti-fascist war."}, {"start": 270.6, "end": 286.56, "text": "日本右翼/部分军国主义叙事视角：绝望中被迫的自卫反击战，美国通过石油禁运等早已把日本逼到绝境，珍珠港是“破釜沉舟”的最后一搏，是“哀兵”之举。", "en": "Japanese right-wing / partial militarist narrative perspective: a desperate self-defensive counterattack, with America having already driven Japan to a dead end through oil embargoes and the like; Pearl Harbor was a 'burning one's boats' last gamble, an act of a 'grieving army'."}, {"start": 286.56, "end": 292.15, "text": "从“无耻偷袭”到“被迫殊死一搏”，动机与道德评价完全颠倒。", "en": "From 'shameless surprise attack' to 'forced fight to the death', motives and moral evaluations are completely reversed."}, {"start": 292.15, "end": 296.71, "text": "然后洗的那些昭和青年群情激愤，上赶着玉碎。", "en": "Then those brainwashed Showa youths were filled with righteous indignation, rushing to die honourably."}, {"start": 296.71, "end": 302.64, "text": "甚至同一个事情，同一个立场，因为春秋笔法也能意义和意思南辕北辙。", "en": "Even for the same matter and the same stance, Spring and Autumn Annals-style wording can make meaning and sense diametrically opposed."}, {"start": 302.64, "end": 304.8, "text": "总之还是那句话：带点脑子", "en": "In short, still that saying: use your brain a bit."}, {"start": 304.8, "end": 311.81, "text": "下班回到家，累得连饭都不想吃，往沙发上一瘫，手指开始下意识地往下滑。", "en": "After work, returning home, so tired you don't even want to eat, collapsing onto the sofa, fingers starting to slide subconsciously."}, {"start": 311.81, "end": 315.29, "text": "一个视频接一个视频，一条段子接一条段子。", "en": "One video after another, one joke after another."}, {"start": 315.29, "end": 317.86, "text": "你也知道这些东西没什么营养，但就是停不下来。", "en": "You know these things have no nutrition, but you just can't stop."}, {"start": 317.86, "end": 319.34, "text": "你有没有过这种经历？", "en": "Have you had this experience?"}, {"start": 319.34, "end": 322.18, "text": "等你回过神来，已经凌晨一点了。", "en": "When you come to your senses, it is already 1 am."}, {"start": 322.18, "end": 325.49, "text": "你感到一阵巨大的空虚，然后开始自责。", "en": "You feel a huge emptiness, then start blaming yourself."}, {"start": 325.49, "end": 327.0, "text": "我怎么这么不自律？", "en": "'Why am I so undisciplined?"}, {"start": 327.0, "end": 328.39, "text": "又浪费了一晚上。", "en": "Wasted another evening.'"}, {"start": 328.39, "end": 329.3, "text": "先停一下。", "en": "Stop for a moment."}, {"start": 329.3, "end": 332.35, "text": "今天我想替你说句实话，这不怪你。", "en": "Today I want to speak a truth for you: this is not your fault."}, {"start": 332.35, "end": 335.54, "text": "但有一件事，比怪你更让人不舒服。", "en": "But there is something more uncomfortable than blaming you."}, {"start": 335.54, "end": 341.98, "text": "不是你的意志力出了问题，是你掉进了一个经过精密设计的心理圈套里。", "en": "It is not your willpower that has a problem; you have fallen into a precisely designed psychological trap."}, {"start": 341.98, "end": 345.77, "text": "而这个圈套，恰恰是利用了你最脆弱的时候。", "en": "And this trap precisely exploits your most vulnerable moments."}, {"start": 345.77, "end": 349.92, "text": "最先困住人的，是心力被一点点耗干。", "en": "What traps people first is mental energy being drained bit by bit."}, {"start": 349.92, "end": 356.64, "text": "你白天在单位，要忍受老板的脾气，要处理同事的推诿，要应付无穷无尽的琐事。", "en": "During the day at work, you must endure your boss's temper, handle colleagues' buck-passing, and deal with endless trivial matters."}, {"start": 356.64, "end": 360.72, "text": "这一天下来，你的大脑已经累了，只会挑不用动脑的东西看。", "en": "After a day like this, your brain is already tired and only picks things that require no thinking."}, {"start": 360.72, "end": 363.77, "text": "它不是懒，是自动进入了省电模式。", "en": "It is not laziness; it automatically enters power-saving mode."}, {"start": 363.77, "end": 366.1, "text": "心力被榨干是什么感觉？", "en": "What does it feel like to have your mental energy drained?"}, {"start": 366.1, "end": 368.9, "text": "就是你知道刷手机没意义，但你就是控制不住。", "en": "It is knowing that scrolling your phone is meaningless, but you just cannot control yourself."}, {"start": 368.9, "end": 371.71, "text": "你知道早睡对身体好，但你就是不想动。", "en": "You know going to bed early is good for your health, but you just don't want to move."}, {"start": 371.71, "end": 373.15, "text": "不是不想改变。", "en": "It is not that you don't want to change."}, {"start": 373.15, "end": 374.47, "text": "是真没力气了。", "en": "It is that you really have no energy left."}, {"start": 374.47, "end": 379.2, "text": "这时候，短视频、爽文、情绪骂战刚好凑过来。", "en": "At this time, short videos, feel-good articles and emotional flame wars happen to come over."}, {"start": 379.2, "end": 385.08, "text": "它们不需要你费劲，就能给你一种我好像学到了什么、我好像参与了什么的错觉。", "en": "They don't require you to exert effort, yet give you an illusion that 'I seem to have learned something, I seem to have participated in something'."}, {"start": 385.08, "end": 389.69, "text": "我年轻那会儿在车间干活，干完活回宿舍就是累。", "en": "When I was young working in a workshop, after work I returned to the dormitory exhausted."}, {"start": 389.69, "end": 393.24, "text": "一身汗都没擦，就会先刷几条没营养的网文。", "en": "Without even wiping off my sweat, I would first scroll a few nutrition-free web articles."}, {"start": 393.24, "end": 398.47, "text": "那时候还没有算法这回事，就是觉得脑子已经转不动了，得看点不用动脑子的东西。", "en": "At that time there was no such thing as algorithms; I just felt my brain could no longer turn, and needed to watch something that required no thinking."}, {"start": 398.47, "end": 402.86, "text": "后来我才琢磨明白，那种不用动脑子的感觉，才是最贵的。", "en": "Later I figured out that the feeling of not needing to think is the most expensive."}, {"start": 402.86, "end": 406.7, "text": "你以为你是在放松，其实只是被动接受投喂。", "en": "You think you are relaxing, but in fact you are just passively accepting feeding."}, {"start": 406.7, "end": 410.78, "text": "而且平台利用完你之后，还会让你觉得是自己不行。", "en": "And after platforms use you up, they make you feel it is your own fault."}, {"start": 410.78, "end": 414.86, "text": "它拿走了你的注意力，再让你为管不住自己内疚一遍。", "en": "They take your attention, then make you feel guilty again for not controlling yourself."}, {"start": 414.86, "end": 418.15, "text": "你在它眼里，就是一块还能用的电池。", "en": "In their eyes, you are just a battery that can still be used."}, {"start": 418.15, "end": 421.94, "text": "有人会说，既然被动不行，我主动去搜总行了吧？", "en": "Someone might say: since passivity doesn't work, actively searching should work, right?"}, {"start": 421.94, "end": 424.1, "text": "你试过主动搜相反观点吧？", "en": "Have you tried actively searching for opposing views?"}, {"start": 424.1, "end": 424.9, "text": "没用。", "en": "Useless."}, {"start": 424.9, "end": 433.73, "text": "不是因为你搜得不够努力，是因为你搜东西用的工具、搜到的范围、用来判断什么是相反的标准，全都是这个系统给你的。", "en": "Not because you didn't search hard enough, but because the tools you use to search, the scope of what you find, and the standards you use to judge what counts as opposite are all given to you by this system."}, {"start": 433.73, "end": 438.46, "text": "你以为你在四处漫游，其实只是走在预设好的草径上。", "en": "You think you are roaming everywhere, but in fact you are only walking on preset grass paths."}, {"start": 438.46, "end": 443.86, "text": "路边长的全是你爱吃的草，吃得自在，却始终跨不出划定的地界。", "en": "All growing by the roadside is grass you love to eat. You eat comfortably, but never step beyond the demarcated boundary."}, {"start": 443.86, "end": 446.98, "text": "我有个朋友，不知道从哪听来的，说要戒算法。", "en": "I have a friend who, hearing from somewhere that one should quit algorithms,"}, {"start": 446.98, "end": 449.9, "text": "把常用的平台卸了，下了个冷门的。", "en": "uninstalled commonly used platforms and downloaded an obscure one."}, {"start": 449.9, "end": 455.98, "text": "折腾仨月，有天跑来跟我说：那边更狠，连骂算法的帖子都往我脸上推。", "en": "After three months of fussing, one day he came to me and said: that side is even worse — even posts cursing algorithms are pushed in my face."}, {"start": 455.98, "end": 457.37, "text": "他以为他翻出去了。", "en": "He thought he had climbed out."}, {"start": 457.37, "end": 460.2, "text": "其实他只是翻进了另一面镜子。", "en": "In fact, he had only climbed into another mirror."}, {"start": 460.2, "end": 463.08, "text": "草径还是那条草径，只是换了个方向长。", "en": "The grass path is still that grass path, only growing in a different direction."}, {"start": 463.08, "end": 467.09, "text": "它不光要你待在里面，它还要你觉得自己在往外走。", "en": "It not only wants you to stay inside; it also wants you to feel you are walking out."}, {"start": 467.09, "end": 471.05, "text": "因为往外走这个动作，比待着不动产生的数据更多。", "en": "Because the act of walking out generates more data than staying still."}, {"start": 471.05, "end": 473.93, "text": "说到这儿，我突然想起小时候见过的一只山雀。", "en": "Speaking of this, I suddenly remember a titmouse I saw as a child."}, {"start": 473.93, "end": 480.46, "text": "有人把鸟笼靠墙放着，那山雀天天扑腾着去够墙上的一小块光斑。", "en": "Someone placed a birdcage against a wall, and the titmouse fluttered every day trying to reach a small patch of light on the wall."}, {"start": 480.46, "end": 488.14, "text": "旁人以为它渴望外面的天地，好心把笼子挪到院子，眼前整片山野都敞开了。", "en": "Others thought it longed for the outside world, and kindly moved the cage to the yard, where the whole mountain wilderness opened before its eyes."}, {"start": 488.14, "end": 495.05, "text": "可山雀反而慌了，乱飞了一阵，最后缩回角落，继续盯着那一小片阳光。", "en": "But the titmouse panicked instead, flew around wildly, and finally shrank back into a corner, continuing to stare at that small patch of sunlight."}, {"start": 495.05, "end": 501.94, "text": "它或许根本不是向往广阔的天地，只是贪恋那一点不用费力就能抓到手的光亮。", "en": "Perhaps it never longed for the vast world; it just coveted that bit of light it could grasp without effort."}, {"start": 501.94, "end": 505.34, "text": "真把自由摆在面前，它反倒不敢接了。", "en": "When freedom was truly placed before it, it dared not accept it."}, {"start": 505.34, "end": 512.47, "text": "我们嘴上说着想跳出茧房，实际上贪恋的，也不过是算法随手递过来的那点廉价安慰。", "en": "We say we want to jump out of cocoons, but in fact what we covet is just the cheap comfort algorithms casually hand over."}, {"start": 512.47, "end": 517.58, "text": "不是没有别的信息，是舍不得放下那份不用动脑子的轻松。", "en": "It is not that there is no other information; it is that we cannot bear to put down that effortless ease."}, {"start": 517.58, "end": 521.83, "text": "更狠的是，你以为你至少还保留了一样东西，你的愤怒。", "en": "Even worse: you think you at least retain one thing — your anger."}, {"start": 521.83, "end": 525.79, "text": "可你仔细想想，连这个，也早就被算计进去了。", "en": "But think carefully: even this was calculated long ago."}, {"start": 525.79, "end": 528.5, "text": "还有一件藏得更深的事，放到后面慢慢说。", "en": "There is something hidden even deeper; I'll tell it slowly later."}, {"start": 528.5, "end": 532.18, "text": "你白天被老板骂了，心里憋着一团火。", "en": "During the day, your boss scolded you, and you held a ball of fire in your heart."}, {"start": 532.18, "end": 537.41, "text": "晚上你刷手机，刚好刷到一条吐槽老板、宣泄委屈的段子。", "en": "At night, you scroll your phone and happen to scroll to a joke venting about bosses and grievances."}, {"start": 537.41, "end": 541.78, "text": "你看完笑了一下，觉得解气了，顺手点了个赞，转发到群里。", "en": "After watching, you laughed, felt relieved, casually liked it, and forwarded it to a group."}, {"start": 541.78, "end": 547.58, "text": "你想过没有，那个解气的一下，恰恰把你原本可以用来干正事的劲给卸了。", "en": "Have you thought about it? That moment of relief precisely discharged the energy you could have used for proper business."}, {"start": 547.58, "end": 553.9, "text": "你本来可以拿那团火去投简历、去学个新东西、去跟你老板把话说清楚。", "en": "You could have used that fire to send résumés, learn something new, or talk things through with your boss."}, {"start": 553.9, "end": 555.77, "text": "但你把它吐在一个段子里了。", "en": "But you vented it in a joke."}, {"start": 555.77, "end": 561.17, "text": "那团火没烧向该烧的地方，烧完你就累了，睡了，第二天照常上班。", "en": "That fire did not burn where it should have; after burning, you were tired, slept, and went to work as usual the next day."}, {"start": 561.17, "end": 564.46, "text": "你那团火，最后结算进它的流量报表里。", "en": "Your fire was finally settled into its traffic report."}, {"start": 564.46, "end": 567.74, "text": "你骂完之后那点痛快，就是它这个月发出去的奖金。", "en": "That bit of pleasure after you cursed is the bonus it handed out this month."}, {"start": 567.74, "end": 570.07, "text": "你在它的账本上，就是一串数字。", "en": "On its ledger, you are just a string of numbers."}, {"start": 570.07, "end": 573.74, "text": "可你自己过的日子，不只是一串数字。", "en": "But the life you live is not just a string of numbers."}, {"start": 573.74, "end": 578.54, "text": "它未必不让你看见真相，却会慢慢让你懒得去戳破真相。", "en": "It may not stop you from seeing the truth, but it will slowly make you too lazy to puncture the truth."}, {"start": 578.54, "end": 580.78, "text": "你可能会想，那我至少还可以恨它。", "en": "You might think: at least I can still hate it."}, {"start": 580.78, "end": 581.86, "text": "别急着恨。", "en": "Don't rush to hate."}, {"start": 581.86, "end": 583.73, "text": "恨，也是它留的一个按钮。", "en": "Hate is also a button it left for you."}, {"start": 583.73, "end": 587.26, "text": "你越恨，停留时长越长，它越开心。", "en": "The more you hate, the longer you stay, the happier it is."}, {"start": 587.26, "end": 588.26, "text": "你不信？", "en": "Don't believe me?"}, {"start": 588.26, "end": 589.3, "text": "再想想。", "en": "Think again."}, {"start": 589.3, "end": 591.74, "text": "你骂完它之后，是不是觉得痛快了一点？", "en": "After cursing it, do you feel a bit relieved?"}, {"start": 591.74, "end": 594.67, "text": "那点痛快，就是你给它的续费。", "en": "That bit of relief is the renewal fee you paid it."}, {"start": 594.67, "end": 597.74, "text": "而且最邪门的是，你越骂它，它越活。", "en": "And the strangest thing is: the more you curse it, the more alive it becomes."}, {"start": 597.74, "end": 605.23, "text": "你每一条愤怒的评论、每一次转发骂它的帖子，后台都记着：用户活跃度加一。", "en": "Every angry comment you make, every forwarded post cursing it, is recorded in the backend: user activity +1."}, {"start": 605.23, "end": 608.28, "text": "你以为你在反抗，你其实在给它续命。", "en": "You think you are resisting, but in fact you are renewing its life."}, {"start": 608.28, "end": 612.24, "text": "愤怒本身可以促人觉醒，有它的社会价值。", "en": "Anger itself can awaken people and has its social value."}, {"start": 612.24, "end": 619.2, "text": "但从流量机制上看，仅仅是在为这一条内容增加热度，不等于你的批判本身毫无意义。", "en": "But from the traffic mechanism's perspective, it merely adds heat to this piece of content; this does not mean your criticism itself is meaningless."}, {"start": 619.2, "end": 620.59, "text": "它没打算害你。", "en": "It did not intend to harm you."}, {"start": 620.59, "end": 625.87, "text": "从你下载那天起，每一步都是算过的，它只是转起来就停不住。", "en": "From the day you downloaded it, every step was calculated; it just keeps spinning and cannot stop."}, {"start": 625.87, "end": 630.24, "text": "这不是偶然出的漏洞，是它自诞生起就写好的逻辑。", "en": "This is not an accidental loophole; it is logic written since its birth."}, {"start": 630.24, "end": 631.51, "text": "那怎么办？", "en": "So what to do?"}, {"start": 631.51, "end": 638.54, "text": "网上不少高赞回答，教人主动搜相反观点、少点赞少评论去规避算法。", "en": "Many highly praised answers online teach people to actively search for opposing views, like and comment less to avoid algorithms."}, {"start": 638.54, "end": 645.19, "text": "这些办法不能说错，但往往漏掉一个前提：人得先有余力，才能谈选择。", "en": "These methods cannot be said to be wrong, but they often miss a premise: a person must first have spare energy before talking about choices."}, {"start": 645.19, "end": 649.51, "text": "你去问一个刚下流水线的姑娘，她晚上刷不刷短视频。", "en": "Ask a girl who just got off the assembly line whether she scrolls short videos at night."}, {"start": 649.51, "end": 653.66, "text": "她肯定刷。", "en": "She definitely does."}, {"start": 653.66, "end": 655.06, "text": "你让她交叉验证？", "en": "You ask her to cross-verify?"}, {"start": 655.06, "end": 656.33, "text": "她连澡都不想洗。", "en": "She doesn't even want to take a shower."}, {"start": 656.33, "end": 662.62, "text": "或者你哪天点外卖注意看一眼，骑手等红灯那几十秒，十有八九在刷手机。", "en": "Or one day when you order takeaway, look: in the tens of seconds a delivery rider waits at a red light, nine times out of ten he is scrolling his phone."}, {"start": 662.62, "end": 665.21, "text": "那是他一天里唯一不疼的片刻。", "en": "That is the only painless moment in his day."}, {"start": 665.21, "end": 666.89, "text": "你跟他说拓宽信源？", "en": "You tell him to broaden his sources?"}, {"start": 666.89, "end": 674.76, "text": "你让一个连喘息缝隙都没有的人靠意志力去打破一堵墙，不是励志，是站着说话不腰疼。", "en": "Asking a person who doesn't even have a breathing gap to break down a wall by willpower is not inspirational; it is talking without feeling the pain."}, {"start": 674.76, "end": 685.01, "text": "你能看见什么样的信息，往往不全是好奇心说了算，更多取决于你的工时、收入，还有一天下来还剩下多少精力这些实打实的现实。", "en": "What kind of information you can see often depends not entirely on curiosity, but more on solid realities like your working hours, income, and how much energy you have left after a day."}, {"start": 685.01, "end": 688.3, "text": "所以，别再拿自律来PUA自己了。", "en": "So stop using self-discipline to PUA yourself."}, {"start": 688.3, "end": 690.65, "text": "你需要的不是鸡汤，是清醒。", "en": "What you need is not chicken soup, but clarity."}, {"start": 690.65, "end": 692.69, "
