: "真正顽固认死理的很少，", "en": "Those who are truly stubborn and wedded to their own logic are few;"}, {"start": 461.21, "end": 463.08, "text": "基本上都是一些极端人士。", "en": "essentially they're all extreme types."}, {"start": 463.08, "end": 472.51, "text": "她们来我这不是为了找另一半，要不就是来搞我，要不然就是找一个应声虫，让我给她们的糟糕人生进行情绪站队而已。", "en": "They come to me not to find a partner; they either come to mess with me, or to find a yes-man, just to have me take their side emotionally over their wretched lives."}, {"start": 472.51, "end": 474.67, "text": "岁月有的时候真的很无情的。", "en": "Time is sometimes truly merciless."}, {"start": 474.67, "end": 485.78, "text": "它不但带走了你的青春，还固化了你的一些认知和思想，以及让你不再保持那种两性敏感度与接受新事物的能力。", "en": "It not only carries away your youth, but also freezes certain of your cognitions and thoughts, and stops you from keeping that sensitivity between the sexes and the ability to accept new things."}, {"start": 485.78, "end": 492.74, "text": "所以每当我接受一些35岁以上的待婚人群，不管是领导还是普通人，有钱没钱，我都会压力很大。", "en": "So whenever I take on some marriage-waiting people over 35 — whether leaders or ordinary folk, rich or not — I feel a great deal of pressure."}, {"start": 492.74, "end": 495.74, "text": "因为每一次沟通都有可能被冲破阈值。", "en": "Because every single communication risks breaching the threshold."}, {"start": 495.74, "end": 499.78, "text": "就比如说我的国庆这个期间，接待了一个38岁的一个女性。", "en": "For example, during this National Day period, I received a 38-year-old woman."}, {"start": 499.78, "end": 510.82, "text": "这个人说话做事，条件，各方面都没有什么问题，但是她有一个非常离谱的一个习惯，就是没法专心的做一件事，没法专心的跟我聊天。", "en": "This person's way of speaking and acting, her conditions, everything — none of it was a problem; but she had one utterly absurd habit: she couldn't focus on doing one thing, couldn't focus on chatting with me."}, {"start": 510.82, "end": 515.81, "text": "她在跟我一对一沟通中，必须开一个手机，摆着电视剧外放在旁边看。", "en": "In our one-on-one communication, she had to switch on a phone and set it beside her with a TV drama playing out loud to watch."}, {"start": 515.81, "end": 518.62, "text": "你跟她说话，她眼睛不看人，永远盯着电视。", "en": "When you spoke to her, her eyes never looked at you; they were always fixed on the TV."}, {"start": 518.62, "end": 521.98, "text": "但是呢，却能对答如流，你说什么她都知道。", "en": "And yet, she could reply fluently — whatever you said, she knew it all."}, {"start": 521.98, "end": 529.13, "text": "你说你整我可以，你捅我天花板可以，你说一些怪言怪语，新词新论点可以。", "en": "You can mess with me, you can poke holes in my ceiling, you can spout weird words and new-fangled arguments — that's fine."}, {"start": 529.13, "end": 531.72, "text": "你不能整这种诡异的方式来折磨人。", "en": "But you can't use this kind of uncanny method to torment people."}, {"start": 531.72, "end": 535.87, "text": "这就是我为什么说上年纪了，怪就断层了，让你接受不了了。", "en": "This is why I say that once people get older, their strangeness jumps a fault line, and becomes unacceptable to you."}, {"start": 535.87, "end": 538.32, "text": "这是一个，还有一个是去年接触过的。", "en": "That's one; another was someone I met last year."}, {"start": 538.32, "end": 542.95, "text": "大家千万不要认为异样，只是处于一个普通人群中。", "en": "Everyone must not think that the bizarre appears only among ordinary people."}, {"start": 542.95, "end": 546.74, "text": "很多相当优秀的人，事业有成的人，他们依然会有。", "en": "Many quite excellent people, successful in their careers, still have it too."}, {"start": 546.74, "end": 549.7, "text": "一个87年男嘉宾，是个老板。", "en": "A male guest, born in '87, who was a boss."}, {"start": 549.7, "end": 554.09, "text": "我细心观察过，他跟我每说三句话，必须总结一个道理。", "en": "I observed carefully: for every three sentences he spoke to me, he had to sum up a principle."}, {"start": 554.09, "end": 556.13, "text": "到后期我实在接受不了了，为什么呢？", "en": "By the later stage I genuinely couldn't take it — why?"}, {"start": 556.13, "end": 558.94, "text": "我就跟他说句你好，今天天气怎么样？", "en": "I'd just say to him, 'Hello, how's the weather today?'"}, {"start": 558.94, "end": 560.9, "text": "他也能总结出来一个道理来。", "en": "And he could still distil a principle from it."}, {"start": 560.9, "end": 562.46, "text": "给大家模仿一下啊。", "en": "Let me imitate it for everyone, alright."}, {"start": 562.46, "end": 565.46, "text": "你好，今天天气不错，这天空挺蓝的。", "en": "'Hello, the weather's nice today, the sky is quite blue.'"}, {"start": 565.46, "end": 569.95, "text": "是啊，天空好蓝啊，蓝蓝的天纯净的，就像我们人的心灵。", "en": "'Yes, the sky is so blue, that blue sky is pure, just like the human soul.'"}, {"start": 569.95, "end": 577.99, "text": "我们做人做事呢，有时候需要剥开那层心灵上的云彩，扫清昨日的灰尘，才能拨开云雾见光明。", "en": "'In how we conduct ourselves, sometimes we need to peel away that layer of clouds on the soul, sweep clear the dust of yesterday, so as to disperse the mist and see the light.'"}, {"start": 577.99, "end": 581.18, "text": "大家自己品吧，你说这样谁能受得了？", "en": "Everyone can savour that for themselves; tell me, who could stand that?"}, {"start": 581.18, "end": 590.47, "text": "我在接受95后00后的男男女女，遇到难处理难沟通的，过程再难起码我们在某一个时刻可以站在相同的频道上。", "en": "When I take on post-95s and post-00s, both men and women, even those hard to handle and hard to communicate with — however difficult the process, at least at some moment we can stand on the same wavelength."}, {"start": 590.47, "end": 595.92, "text": "比如这个女生再异想天开，要什么创一代，富二代，她起码我们是可以交流，可以说话的。", "en": "For instance, even if a girl is fanciful beyond reason, wanting a first-generation founder or a rich second-generation heir, at least we can communicate, we can talk."}, {"start": 595.92, "end": 603.72, "text": "而且相当多的人，记吃也记打，被多拒绝几次，被同位的女生竞争时候多打击几次，她自己也就清醒了。", "en": "And quite a lot of them remember both the carrot and the stick: after being rejected a few times, after being knocked down a few times by peer competition with other girls, they sober up on their own."}, {"start": 603.72, "end": 605.11, "text": "而且成长的特别快。", "en": "And they grow up especially fast."}, {"start": 605.11, "end": 611.52, "text": "总的来说，只要能说上话有机会， 就有平衡婚恋观的可能。", "en": "All in all, as long as they can talk and there's a chance, there's the possibility of balancing out their view of marriage and love."}, {"start": 611.52, "end": 615.17, "text": "而一旦从适婚跨到大龄，或者到了40岁这个节点。", "en": "But once one crosses from marriageable to advanced age, or reaches the 40-year mark,"}, {"start": 615.17, "end": 617.33, "text": "那个难完全不是一个位面的难。", "en": "that difficulty is utterly not a difficulty on the same plane."}, {"start": 617.33, "end": 628.56, "text": "40岁这个节点，很多问题型待婚人士，她们身上既有年轻人的一些幻想臆想浮躁的成分，又慢慢兼具了一些老辈人的腐朽顽固。", "en": "At the 40-year mark, many problem-type marriage-waiting people carry both the fanciful, delusional, restless elements of the young, and gradually also the decayed stubbornness of the older generation."}, {"start": 628.56, "end": 632.45, "text": "之前说的求神拜佛烧纸讲过了，我就不讲了。", "en": "I've already spoken about the ones who pray to gods and buddhas and burn paper money, so I won't go into that."}, {"start": 632.45, "end": 636.65, "text": "竟然还有给手里面放了一个留置针，要借此改自己的气质的。", "en": "There was even one who had an indwelling needle placed in their hand, hoping to use it to change their temperament."}, {"start": 636.65, "end": 643.06, "text": "妹妹在我这相亲结婚了，姐姐要来打人了，说什么她妹妹把她家的姻缘运抢走了。", "en": "A younger sister matched and married through me, and the elder sister came to attack someone, claiming her younger sister had stolen away her family's marriage luck."}, {"start": 643.06, "end": 649.61, "text": "我都没张嘴，这个女士像埃米纳姆一样的语速，疯狂说了一个小时，连哭带嚎。", "en": "Before I'd even opened my mouth, this lady, at a speed like Eminem's, ranted madly for an hour, weeping and wailing."}, {"start": 649.61, "end": 653.57, "text": "一直让我给她评评理，感受感受她的难度。", "en": "She kept making me judge who was in the right and feel her difficulty."}, {"start": 653.57, "end": 657.53, "text": "愣是把旁边小景观水缸里的一个风水鱼给吓死了。", "en": "She actually frightened to death a feng shui fish in the little ornamental water tank beside her."}, {"start": 657.53, "end": 666.65, "text": "更有的当妈的要结婚睡儿子地铺，把40岁大儿子带来我这相亲，以后跟老婆亲嘴还要写报告，经过她允许。", "en": "Even more so, there was a mother who wanted to marry and sleep on a floor mat with her son; she brought her 40-year-old eldest son here to matchmake, and said that in future when he kisses his wife he must write a report and have her permission."}, {"start": 666.65, "end": 667.42, "text": "唉…", "en": "Sigh…"}, {"start": 667.42, "end": 671.62, "text": "如果年轻婚恋遇到的难题是让人抓耳挠腮，", "en": "If the difficulties of young people's matchmaking make one scratch one's head,"}, {"start": 671.62, "end": 676.13, "text": "那么年上婚恋的难题，是真正意义上的", "en": "then the difficulties of older-age matchmaking are, in the true sense,"}, {"start": 676.13, "end": 677.33, "text": "不可名状，", "en": "ineffable,"}, {"start": 677.33, "end": 678.84, "text": "不可直视，", "en": "unbearable to behold,"}, {"start": 678.84, "end": 679.97, "text": "不可言说。", "en": "unspeakable."}]}, {"title": "为什么40岁男普遍不考虑40岁女？ Part 2（60句，6:04）", "mp3": "40_______40-part02/audio.mp3", "dur": "6:04", "lines": [{"start": 0.0, "end": 5.11, "text": "十几岁的高中男生精力旺盛之时，对一个女字都能产生兴奋。", "en": "When a teenage high-school boy is brimming with energy, he can grow excited even at the mere character for 'woman'."}, {"start": 5.11, "end": 14.35, "text": "到了20多岁的时候，即使没有真人，对墙上挂的女性海报，不管里面的人是阿姨还是姐姐，也能充满幻想。", "en": "By the time he reaches his twenties, even with no real person there, he can be full of fantasy about a female poster on the wall, whether the person in it is an auntie or an older sister."}, {"start": 14.35, "end": 28.56, "text": "到了30多岁的时候，如果没有之前积累的感情，那对陌生异性的追求已经不再主动，都是被动等别人介绍，而且只有遇到同龄或者比自己更小的女性，才会答应去见一面。", "en": "By his thirties, if he has not accumulated any feelings beforehand, he is no longer proactive in pursuing strangers of the opposite sex; he simply waits passively for others to make introductions, and will only agree to meet a woman his own age or younger than himself."}, {"start": 28.56, "end": 37.97, "text": "再到了40多岁的时候，若这个男人还是单身，那就只有20多岁的妹妹，才能让自己回想当年书生意气的辉煌时刻。", "en": "And by his forties, if this man is still single, then only a twenty-something younger woman can make him recall the glorious, spirited days of his youth as a student."}, {"start": 37.97, "end": 40.92, "text": "来个30岁的，拜拜了您嘞。", "en": "A thirty-year-old shows up? Cheerio, off you go."}, {"start": 40.92, "end": 43.68, "text": "来个40岁的，走你。", "en": "A forty-year-old shows up? Beat it."}, {"start": 43.68, "end": 46.75, "text": "为什么40岁男普遍不考虑40岁女？", "en": "Why do forty-year-old men generally not consider forty-year-old women?"}, {"start": 46.75, "end": 53.04, "text": "因为40岁男的生理机能下降，40岁女无法使他产生兴趣。", "en": "Because a forty-year-old man's physiological functions decline, and a forty-year-old woman can no longer arouse his interest."}, {"start": 53.04, "end": 54.96, "text": "40岁女也应该是一样的。", "en": "The same should hold for forty-year-old women."}, {"start": 54.96, "end": 62.4, "text": "知乎感情类、男女类的问题，很多回答总是扭扭捏捏，我都不想看了，就不能直白一点吗。", "en": "On Zhihu, for questions about relationships and the sexes, so many answers are forever timid and evasive that I don't even want to read them—can't they just be more straightforward?"}, {"start": 62.4, "end": 67.01, "text": "40岁男直接去找20岁女，40岁女直接去找20岁男，找得到就找，找不到就不找。", "en": "Forty-year-old men go straight to twenty-year-old women; forty-year-old women go straight to twenty-year-old men. If you can find one, go for it; if not, don't."}, {"start": 67.01, "end": 76.66, "text": "人生最长也就80年，按现在的食品卫生、空气质量和工作强度，能活到70多岁已经算不错的了。", "en": "Life is at longest some eighty years; given today's food hygiene, air quality, and work intensity, reaching your seventies already counts as not bad."}, {"start": 76.66, "end": 85.58, "text": "满打满算你还有30年，过去40多年都没解决得了的事情，未来30年以你的个人魅力还能解决得到吗？", "en": "Even counting generously, you have only thirty years left. Something you failed to resolve across the past forty-odd years—could you still resolve it in the next thirty with your personal charm?"}, {"start": 85.58, "end": 87.26, "text": "因为男女双方思想不一样。", "en": "Because men and women think differently."}, {"start": 87.26, "end": 90.5, "text": "按男的思想，刘强东娶了奶茶妹。", "en": "By the man's logic, Qiangdong Liu married the Milk Tea Girl."}, {"start": 90.5, "end": 93.62, "text": "按女的思想，刘强东应该娶董明珠。", "en": "By the woman's logic, Qiangdong Liu should have married Mingzhu Dong."}, {"start": 93.62, "end": 95.83, "text": "很多女性50岁就能退休。", "en": "Many women can retire at fifty."}, {"start": 95.83, "end": 100.58, "text": "那么你娶一个差10年退休的女孩子，是指望她帮你带孙子吗？", "en": "So when you marry a girl who is ten years from retirement, are you expecting her to help you look after your grandson?"}, {"start": 100.58, "end": 102.79, "text": "哦，你这个令人讨厌的土拨鼠", "en": "Oh, you annoying groundhog."}, {"start": 102.79, "end": 104.66, "text": "“彼此势均力敌”", "en": "“Each side is evenly matched”"}, {"start": 104.66, "end": 106.54, "text": "“配你绰绰有余”.......", "en": "“More than enough for you”......."}, {"start": 106.54, "end": 111.53, "text": "之类的话术，是相亲市场研究出来麻痹男性的。", "en": "Phrases of this sort are tactics the matchmaking market devised to numb men."}, {"start": 111.53, "end": 116.57, "text": "真实的情况是，四十岁男性的比较对象从来不是四十岁女性。", "en": "The real situation is that a forty-year-old man's object of comparison was never the forty-year-old woman."}, {"start": 116.57, "end": 119.74, "text": "他只要战胜别的男性，就能娶到想娶的女性。", "en": "He only needs to defeat other men to marry the woman he wishes to marry."}, {"start": 119.74, "end": 126.46, "text": "同样，四十岁的女性希望获得爱情，需要比较的，也不是男性，而是别的女性。", "en": "Likewise, when a forty-year-old woman hopes to find love, the one she must compare herself with is not the man but other women."}, {"start": 126.46, "end": 131.14, "text": "原始社会也好，动物世界也好，求偶不都是同性竞争吗？", "en": "Whether in primitive society or the animal world, isn't courtship always same-sex competition?"}, {"start": 131.14, "end": 133.25, "text": "难不成猴王要找个女猴王？", "en": "Surely the monkey king isn't going to go looking for a female monkey king?"}, {"start": 133.25, "end": 135.12, "text": "蚁后要找个蚁国王？", "en": "The ant queen is going to find an ant king?"}, {"start": 135.12, "end": 142.56, "text": "因为两性的核心资源不同，月入3000的25岁女性，也不会考虑月入3000的25岁男性。", "en": "Because the core resources of the two sexes differ, even a twenty-five-year-old woman earning 3,000 a month would not consider a twenty-five-year-old man earning 3,000 a month."}, {"start": 142.56, "end": 147.72, "text": "相亲市场是功利且赤裸裸的，不用讲什么政治正确，一切都看资源匹配。", "en": "The matchmaking market is utilitarian and naked to the bone; there is no need to talk of political correctness—everything comes down to resource matching."}, {"start": 147.72, "end": 152.88, "text": "在这个社会上，钱对男人有多残忍，年龄对女人就有多残忍。", "en": "In this society, money is as cruel to men as age is to women."}, {"start": 152.88, "end": 168.12, "text": "不同的是，一个月入3000没房没车的男人，大多数是不敢进相亲市场的，因为他们知道自己在雄性竞争中败下阵来，知道即便参加相亲也会遭受白眼，不如先赚钱。", "en": "The difference is that most men earning 3,000 a month with no house and no car dare not enter the matchmaking market, because they know they have been beaten in male competition, know that even if they join the matchmaking they will be met with dirty looks, and would rather make money first."}, {"start": 168.12, "end": 179.45, "text": "但女性对于年龄红利的感知，往往是后知后觉的，有一些清醒的，能意识到颜值红利只有短短十几年，需要在最高点变现。", "en": "But women's awareness of the age dividend tends to come late; a few who are clear-eyed realise that the looks dividend lasts only a short dozen years or so and must be cashed in at its peak."}, {"start": 179.45, "end": 195.29, "text": "她们会提前布局，要么是作为职场优势“颜值+另一优势”获取资源，哪怕做个财经自媒体都好涨粉；要么就作为婚恋红利，在适当的年纪找个家境好的或者潜力股，让自己后半生有保底的安稳。", "en": "They plan ahead: either they use their looks as a workplace advantage—'looks plus another strength'—to acquire resources, and even running a finance self-media account helps them gain followers; or they treat it as a marriage dividend, finding someone from a good family or a man with prospects at the right age, so as to secure a stable fallback for the rest of their lives."}, {"start": 195.29, "end": 200.69, "text": "但对于不清醒的，这种红利逐渐丧失的感觉，就很残忍很残忍。", "en": "But for those who are not clear-eyed, the feeling of this dividend gradually slipping away is cruelly, cruelly harsh."}, {"start": 200.69, "end": 213.53, "text": "很多女性会迷失在颜值红利期的特权中，以为一生都会如此，毕竟只要长得好看，就会自动刷新男人嘘寒问暖，解决工作上乃至人生中的各种问题。", "en": "Many women lose themselves in the privileges of the looks-dividend period, believing life will always be this way, for as long as they are attractive, men will automatically keep up a constant stream of attentive care, solving all sorts of problems at work and even in life itself."}, {"start": 213.53, "end": 219.46, "text": "她们没意识到这种潇洒并非生命体验本身，而是在一直透支红利。", "en": "They do not realise that this ease and freedom is not life experience itself, but a constant overdraft on the dividend."}, {"start": 219.46, "end": 234.5, "text": "再次重申，相亲市场功利且赤裸裸，别扯什么三观契合灵魂共鸣，也不聊什么女性主义，物化和主体性，这个市场就是很看男人的钱，女人的颜值和生育。", "en": "To reiterate, the matchmaking market is utilitarian and naked: don't drag in talk of aligned values and soul resonance, nor discuss feminism, objectification, and subjectivity. This market simply cares about men's money and women's looks and fertility."}, {"start": 234.5, "end": 249.14, "text": "要么就做好准备潇洒一辈子，想要个稳定的婚姻就提前布局，不要认为年龄红利能伴随自己一生，等到40岁，胶原蛋白流失皮肤松弛，那些红利会被收回。", "en": "Either prepare to live freely your whole life, or if you want a stable marriage, plan ahead. Do not think the age dividend can stay with you for life; by the time you are forty, with collagen lost and skin slack, those dividends will be reclaimed."}, {"start": 249.14, "end": 259.1, "text": "到了这个时候，如果发现除了脸蛋身材之外的东西，诸如资源人脉能力认知一个都拿不出手，那种落差感是极强的。", "en": "When that time comes, if you find that apart from your face and figure you have nothing presentable to offer—no resources, no network, no ability, no insight—the sense of disparity will be acute indeed."}, {"start": 259.1, "end": 265.18, "text": "很多女性认为这是社会对大龄女性的恶意，其实只是年龄红利的回收。", "en": "Many women believe this is society's malice towards older women; in truth it is merely the reclaiming of the age dividend."}, {"start": 265.18, "end": 283.73, "text": "但其实在相亲市场上，女性依然是有优势的，一个40岁月薪3000没房没车的女人依然有选择的权力，只是要降低标准，而40岁月薪3000没房没车的男人就只能自嘲“社会底层”，别说找对象，就连说话都不敢太大声。", "en": "But in fact, in the matchmaking market, women still hold the advantage: a forty-year-old woman earning 3,000 a month with no house and no car still has the power to choose, only she must lower her standards; whereas a forty-year-old man earning 3,000 a month with no house and no car can only mock himself as “the bottom of society”—not only can he not find a partner, he dare not even speak too loudly."}, {"start": 283.73, "end": 290.62, "text": "所以对于有颜值红利的女性而言，必须要提前建仓，想好走雌竞还是雄竞路线，", "en": "So for women who possess the looks dividend, they must build their position early and decide whether to take the female-competition or male-competition route;"}, {"start": 290.62, "end": 295.85, "text": "选雌竞就边练情商边筛选，上嫁或找个潜力股；", "en": "Choose female competition and you hone your emotional intelligence while screening, marrying up or finding a man with prospects;"}, {"start": 295.85, "end": 310.42, "text": "选雄竞就把颜值当职场亮点，早点搞钱搞资源，以后情感市场上就很自由，很有钱你可以找帅气的小弟弟，条件一般自给自足也可以抛却经济考量找志趣相投的。", "en": "Choose male competition and treat your looks as a workplace strength, make money and gather resources early, and you will be very free in the relationship market later: if you are very wealthy you can find a handsome younger man; if your circumstances are merely average and you are self-sufficient, you can also set aside economic considerations and find someone kindred in interest."}, {"start": 310.42, "end": 320.81, "text": "不至于像题目中一样，40岁才反应过来，想用颜值价值生育价值换后半生安稳，发现在市场中早已没有自己的位置。", "en": "You will not end up as in the question, only realising at forty that you wished to trade your looks and fertility for stability in later life, only to find you long since have no place in the market."}, {"start": 320.81, "end": 321.77, "text": "以上", "en": "That is all."}, {"start": 321.77, "end": 323.81, "text": "我是宏桑，一个心理咨询师，", "en": "I am Hong Sang, a psychological counsellor,"}, {"start": 323.81, "end": 326.26, "text": "咨询情感问题可加v：hongsanghit", "en": "For relationship counselling you can add me on WeChat: hongsanghit"}, {"start": 326.26, "end": 329.33, "text": "原回答被删除了，重新写。", "en": "The original answer was deleted, so I am writing it again."}, {"start": 329.33, "end": 332.26, "text": "有一件事，可能在知识的盲区里。", "en": "There is one thing that may sit in a blind spot of knowledge."}, {"start": 332.26, "end": 338.98, "text": "40岁的女人总是端着，这也不愿，那也不愿，或者说了好久才象征性的用嘴唇碰一下就不干了。", "en": "A forty-year-old woman always holds herself aloof—unwilling to do this, unwilling to do that—or only after much coaxing will she symbolically touch with her lips and then stop."}, {"start": 338.98, "end": 343.9, "text": "20岁的、10几岁的女孩都乐于尝试，即使眼泪呛出来了也会继续。", "en": "Twenty-year-old and teenage girls are eager to experiment, and will keep going even when tears well up."}, {"start": 343.9, "end": 346.78, "text": "如果你是一个40岁的男人，你会怎么选？", "en": "If you were a forty-year-old man, which would you choose?"}, {"start": 346.78, "end": 349.01, "text": "现在真实的情况是…", "en": "The real situation now is…"}, {"start": 349.01, "end": 351.89, "text": "40岁的女人觉得40岁的男人没卵用。", "en": "A forty-year-old woman thinks a forty-year-old man is utterly useless."}, {"start": 351.89, "end": 355.18, "text": "40岁的男人觉得40岁的女人也没卵用。", "en": "A forty-year-old man thinks a forty-year-old woman is just as useless."}, {"start": 355.18, "end": 358.82, "text": "男性很专一，只喜欢18岁的。", "en": "Men are very single-minded; they only like eighteen-year-olds."}, {"start": 358.82, "end": 361.66, "text": "女性也很专一，只喜欢有钱的。", "en": "Women are likewise very single-minded; they only like those with money."}, {"start": 361.66, "end": 364.34, "text": "按照这个标准理解问题基本就没啥错了。", "en": "Understanding the matter by this standard, you will basically not go wrong."}]}, {"title": "为什么40岁男普遍不考虑40岁女？ Part 3（90句，8:33）", "mp3": "40_______40-part03/audio.mp3", "dur": "8:33", "lines": [{"start": 0.0, "end": 14.04, "text": "其实以现在的一般社会化水平，二十多岁的年轻人普遍有很多非常执着的对爱的误解，不经历好几次彻底的关系危机是很难成长到能成熟的、低损耗的维持长期积极亲密关系的。", "en": "Actually, at the current general level of socialisation, young people in their twenties universally hold many very stubborn misconceptions about love; without going through several thorough relationship crises it is very difficult to grow to the point of being able to maintain a long-term positive intimate relationship in a mature, low-cost way."}, {"start": 14.04, "end": 39.05, "text": "真正理解人——不仅仅是异性，也包括自身——是怎么回事，什么话不能那样说，什么事不能那样做，什么做法会适得其反，什么东西不能强求，并且在这乱石嶙峋的海域里找到一条可以从容通航的道路，还练出可靠的操帆技巧，这是需要足够的经历去浇灌的。", "en": "Truly understanding people — not only the opposite sex, but also oneself — what they are really like, what words must not be said in that way, what things must not be done in that way, what behaviour will backfire, what cannot be forced, and finding a route through this jagged rocky sea where one can navigate at ease, and developing reliable sailing skills besides, all of this needs enough experience to nourish it."}, {"start": 39.05, "end": 46.61, "text": "如果有非常好的群体抚慰引导、再加上一点运气，二十大几岁可以进入一个健康的婚姻，自然是好。", "en": "If there is very good communal comfort and guidance, plus a little luck, entering a healthy marriage in one's late twenties is of course good."}, {"start": 46.61, "end": 60.36, "text": "但是很多人其实都需要几次糟糕的恋爱和一次婚姻的失败，外加长期的工作上、社会上的历练，才会真的达成成熟——前提还是最后悟出了自己的错处，有机缘经忏悔而圆满。", "en": "But in fact many people need several bad romances and one failed marriage, plus long-term tempering through work and society, before they truly achieve maturity — provided that in the end they perceive their own faults and have the good fortune to attain fulfilment through repentance."}, {"start": 60.36, "end": 64.92, "text": "这一般都要三十多岁才达得到，四十才真正成熟并不少见。", "en": "This is generally only attained in one's thirties; reaching true maturity only at forty is not uncommon."}, {"start": 64.92, "end": 83.11, "text": "一个四十多岁的人还在寻找伴侣，如果还是只看所谓的颜值冲动，贪图所谓的青春活力，只能说要么是前半生有特殊原因没有经历可怕的感情危机，要么就是有了一套行之有效的脱身之策，自信可以安全享受。", "en": "If a person in their forties is still looking for a partner and still only values so-called physical-attraction impulses and covets so-called youthful vitality, one can only say that either in the first half of their life there was a special reason they never went through a terrible emotional crisis, or that they have developed an effective strategy for slipping away, and are confident they can enjoy themselves safely."}, {"start": 83.11, "end": 93.14, "text": "不成熟的价值观乘以亲密关系带来的侵彻力，会给人带来的伤害是能致命的，这一点四十多岁的人应该差不多都明白了。", "en": "Immature values multiplied by the penetrating force that intimate relationships bring can inflict harm on a person that is fatal; people in their forties should more or less all understand this."}, {"start": 93.14, "end": 102.02, "text": "虽然年轻异性有青春魅力，但是真正经寻求宁静生活的中年人并不会把这一点看得多么的重要。", "en": "Although young people of the opposite sex have youthful charm, middle-aged people who genuinely seek a tranquil life do not regard this as being of much importance."}, {"start": 102.02, "end": 117.26, "text": "一些刁蛮任性的东西一发作，人被前女友、前妻留下的创伤记忆就立刻被唤醒了，马上就知道这之后是吵不完的架、不死不休的勉强和要挟，一轮一轮的zs威胁，你美若天仙都没用。", "en": "Once some wayward and wilful trait flares up, the trauma memories left by former girlfriends and ex-wives are instantly awakened, and one immediately knows that what follows are endless quarrels, relentless coercion and threats that will not rest until death, and round after round of suicide threats — and it would be of no use even if you were beautiful as a fairy."}, {"start": 117.26, "end": 119.83, "text": "所以根本就谈不上“普遍都找年轻的”。", "en": "So it is simply not the case that “everyone universally looks for younger ones”."}, {"start": 119.83, "end": 128.9, "text": "大部分是要么不找，要找必须是成熟善良坚强自立的，在这基础上才谈得上年轻、美貌这些次要因素。", "en": "For the most part they either do not look at all, or if they do look it must be for someone mature, kind, strong and self-reliant; only on that foundation do secondary factors such as youth and beauty come into consideration."}, {"start": 128.9, "end": 135.34, "text": "觉得“肯定喜欢年轻的”，其实是自己还太年轻的人们对自己将来的想象而已。", "en": "Thinking “they definitely prefer younger ones” is in fact merely the imagination that people who are themselves still too young have about their own future."}, {"start": 135.34, "end": 137.06, "text": "这种人其实不是主流。", "en": "Such people are in fact not the mainstream."}, {"start": 137.06, "end": 146.83, "text": "四十多岁的人和四十多岁异性终成眷属的例子多得很，只是这些平凡而务实的选择不太是通过相亲这类方式进行的罢了。", "en": "There are very many examples of people in their forties and people of the opposite sex in their forties ending up as husband and wife; it is merely that these ordinary and pragmatic choices are not really made through means such as blind dates."}, {"start": 146.83, "end": 152.42, "text": "一想到10年后就是和一个50岁的大妈一起过日子，就觉得不寒而栗。", "en": "The mere thought that ten years later one would be sharing daily life with a 50-year-old woman makes one shudder."}, {"start": 152.42, "end": 153.91, "text": "我今年刚刚40岁。", "en": "I have only just turned 40 this year."}, {"start": 153.91, "end": 156.6, "text": "三年前跟前妻离婚。", "en": "Three years ago I divorced my ex-wife."}, {"start": 156.6, "end": 159.79, "text": "中间有几个同事给我介绍，我去见了两个，", "en": "In between, a few colleagues introduced some people to me, and I went to meet two of them,"}, {"start": 159.79, "end": 165.26, "text": "其中一个35岁，双方都有意愿，后来聊了两个星期，觉得挺累的，", "en": "One of them was 35; both sides were willing, and later we chatted for two weeks, but I found it quite exhausting,"}, {"start": 165.26, "end": 168.62, "text": "她有孩子，经常聊了一会，她去给孩子找这个找那个，", "en": "She had a child, and often after chatting for a while she would go off to fetch this or that for the child,"}, {"start": 168.62, "end": 171.31, "text": "慢慢的就觉得没啥意思，后来就不聊了。", "en": "And gradually I felt there was not much to it, and later we stopped chatting."}, {"start": 171.31, "end": 174.84, "text": "后来还认识一个20多岁的，还没有发展到确定关系，", "en": "Later I also got to know a woman in her twenties; we had not yet developed to the point of confirming a relationship,"}, {"start": 174.84, "end": 176.45, "text": "我也觉得累就不谈了。", "en": "And I also felt tired, so I let it drop."}, {"start": 176.45, "end": 179.5, "text": "20多岁的时候，可以为了她花光所有积蓄，", "en": "At twenty-something, I could spend every last bit of my savings on her,"}, {"start": 179.5, "end": 183.86, "text": "因为她不喜欢我玩游戏，把玩了五年的梦幻西游送人，", "en": "Because she did not like me playing games, I gave away the Fantasy Westward Journey I had played for five years,"}, {"start": 183.86, "end": 189.62, "text": "可以离开家，放弃更好的工作去1500公里外的福建，", "en": "I could leave home and give up a better job to go to Fujian, 1,500 kilometres away,"}, {"start": 189.62, "end": 193.7, "text": "不见睡不着的想她，见了就乐不可支。", "en": "When apart I could not sleep for longing for her, and when together I was beside myself with joy."}, {"start": 193.7, "end": 197.59, "text": "现在40岁，不管漂亮还是丑，都不会有任何的情绪波动。", "en": "Now at 40, whether beautiful or plain, there is not the slightest emotional fluctuation."}, {"start": 197.59, "end": 202.82, "text": "以前打电话，亲情号码999分钟免费，一个星期就打完了。", "en": "In the past when making phone calls, the family-number plan gave 999 free minutes, and I used them all up in a single week."}, {"start": 202.82, "end": 207.82, "text": "现在聊十分钟就觉得没话说，不管是30岁还是20岁，都一样。", "en": "Now after chatting for ten minutes I feel there is nothing to say, whether she is 30 or 20, it is all the same."}, {"start": 207.82, "end": 213.05, "text": "还是更喜欢自己一个人独处，玩玩游戏，跑跑步，钓钓鱼。", "en": "I still prefer to be alone by myself, playing games, going for a run, fishing."}, {"start": 213.05, "end": 218.74, "text": "离婚的时候把钱和房子都留给孩子了，现在工资给爸妈一点，自己留一点，", "en": "When I divorced I left the money and the house to the child; now I give a bit of my salary to my parents and keep a bit for myself,"}, {"start": 218.74, "end": 221.14, "text": "剩下的就到处走走，我觉得挺好的。", "en": "And with the rest I travel about a little; I think it is rather good."}, {"start": 221.14, "end": 222.89, "text": "我也奇怪！", "en": "I also find it strange!"}, {"start": 222.89, "end": 230.26, "text": "为什么 28岁月薪5000 无房无车的姑娘，不考虑28岁月薪5000 无房无车的男人！", "en": "Why would a 28-year-old girl on a monthly salary of 5,000 with no house and no car not consider a 28-year-old man on a monthly salary of 5,000 with no house and no car!"}, {"start": 230.26, "end": 233.26, "text": "为什么刘强东选奶茶妹妹而不选董明珠呢？", "en": "Why did Qiangdong Liu choose Sister Milk Tea rather than Mingzhu Dong?"}, {"start": 233.26, "end": 242.54, "text": "身边熟人，女，长得绝对漂亮，公务员，博士，老公是大学同学，也是公务员，双方家庭条件和外形都好。", "en": "An acquaintance of mine, female, absolutely beautiful, a civil servant, a doctorate holder; her husband was a university classmate, also a civil servant; both families' circumstances and appearances were good."}, {"start": 242.54, "end": 245.66, "text": "34岁那年，双方小孩2岁。", "en": "The year she was 34, their child was 2 years old."}, {"start": 245.66, "end": 249.86, "text": "男方公派去美国学习一年，女方考上在职博士。", "en": "The husband was sent on official assignment to study in the United States for a year; the wife was admitted to a part-time doctorate."}, {"start": 249.86, "end": 255.1, "text": "结果据说男方和一同赴美学习的某女同学搞上了，其被女方发现。", "en": "As a result, it is said the husband got involved with a certain female classmate who had gone to America to study with him, and this was discovered by the wife."}, {"start": 255.1, "end": 258.1, "text": "女方无法接受，坚决要求离婚。", "en": "The wife could not accept it and firmly demanded a divorce."}, {"start": 258.1, "end": 261.5, "text": "最后，双方协议离婚，女儿归女方抚养。", "en": "In the end, the two parties divorced by agreement, and the daughter was placed in the wife's custody."}, {"start": 261.5, "end": 264.62, "text": "分割财产女方分得超过千万市值。", "en": "In the division of property, the wife received assets with a market value of over ten million."}, {"start": 264.62, "end": 272.14, "text": "男方后来也没跟那个女同学结婚，而是找了一个20多岁的未婚姑娘再婚，双方又有了孩子。", "en": "The husband later did not marry that female classmate either, but instead found an unmarried woman in her twenties and remarried, and the two had a child again."}, {"start": 272.14, "end": 274.18, "text": "男方现在已官居厅长。", "en": "The husband now holds the post of department director."}, {"start": 274.18, "end": 275.3, "text": "女方呢？", "en": "And the wife?"}, {"start": 275.3, "end": 282.43, "text": "一直没有再婚，到现在已经50多了，女儿已经长大，送到国外读书，她仍孑然一身。", "en": "She has never remarried; now she is already over 50, the daughter has grown up and been sent abroad to study, and she remains entirely alone."}, {"start": 282.43, "end": 289.34, "text": "容颜嘛，10年前有一次住院后脸上绑了绷带，我猜可能是拉皮去了。", "en": "As for her looks, ten years ago, after one hospital stay, her face was bound with bandages; I suspect she probably went for a facelift."}, {"start": 289.34, "end": 295.15, "text": "现在呢，毕竟岁月不饶人，年龄摆在那，虽不难看，但美貌不再。", "en": "Now, after all, time waits for no one and age is there for all to see; she is not unpleasant to look at, but her beauty is gone."}, {"start": 295.15, "end": 298.2, "text": "早年，时常因被母亲唠叨而黯然泪下。", "en": "In earlier years, she would often be brought to tears by her mother's nagging."}, {"start": 298.2, "end": 303.36, "text": "她母亲见到熟人总是说，自己什么都好，就是女儿没有一个家。", "en": "Her mother, whenever she met acquaintances, would always say that everything about her daughter was good, except that her daughter had no family of her own."}, {"start": 303.36, "end": 316.13, "text": "以她的条件，当年不过35岁，外形靓丽，家庭优渥，高学历，关键部门公务员，除了带一个孩子拖累外，可以说条件相当好了，为什么没结婚？", "en": "Given her conditions — at the time only 35, attractive, from a well-off family, highly educated, a civil servant in a key department — apart from the drag of bringing a child, one could say her circumstances were quite good; so why did she not marry?"}, {"start": 316.13, "end": 317.86, "text": "主要原因在于：", "en": "The main reasons are:"}, {"start": 317.86, "end": 321.29, "text": "1、条件好的女性对男方要求也高。", "en": "1. Women with good conditions also set high demands on the man."}, {"start": 321.29, "end": 325.49, "text": "以本例看，年轻时候找男朋友本就是百里挑一。", "en": "Taking this case as an example, when she was young finding a boyfriend was already one in a hundred."}, {"start": 325.49, "end": 331.37, "text": "虽然35岁了，因自己身条件不错，心里仍然住着白马王子，傲娇得不行。", "en": "Although she was 35, because her own conditions were good, there still lived in her heart a Prince Charming, and she was insufferably proud."}, {"start": 331.37, "end": 340.85, "text": "她不可能找低学历的，不可能找家庭差的，不可能找长得一般的男人，也不可能去找45岁以上的老男人。", "en": "She could not look for a man with low education, could not look for one from a poor family, could not look for one of ordinary looks, nor could she look for an old man over 45."}, {"start": 340.85, "end": 349.08, "text": "这样，形式上符合她条件的人，周围本来就十分稀少，再考虑到要双方三观一致，就更少了。", "en": "Thus those who formally met her conditions were already extremely few around her, and once one also takes into account the need for both sides to share the same values, there were even fewer."}, {"start": 349.08, "end": 352.15, "text": "结果是，她看得上的，基本上都是早已结婚。", "en": "The result was that those she looked up to were basically all already married."}, {"start": 352.15, "end": 355.51, "text": "2、条件好的男性对女性要求也高。", "en": "2. Men with good conditions also set high demands on women."}, {"start": 355.51, "end": 368.52, "text": "如果一个40岁男性，多金、多才、帅气，就算离婚后再婚，他也一般会找一个年轻、漂亮、学历好、家庭条件较好、性格温柔、甚至未婚的女性。", "en": "If a 40-year-old man is wealthy, talented and handsome, even if he remarries after divorce he will generally look for a woman who is young, beautiful, well educated, from a fairly good family, gentle in character, and even unmarried."}, {"start": 368.52, "end": 375.05, "text": "很难看得上一个35岁，离异、个性很强、带孩的女人，即便她长得漂亮。", "en": "It is hard for him to take a fancy to a 35-year-old divorced woman with a strong personality and a child, even if she is beautiful."}, {"start": 375.05, "end": 378.24, "text": "因为同样漂亮，但年轻、未婚的女孩多的是。", "en": "Because there are plenty of girls who are just as beautiful but young and unmarried."}, {"start": 378.24, "end": 380.4, "text": "最终的结果，就是无法匹配。", "en": "The eventual outcome is simply that they cannot match."}, {"start": 380.4, "end": 383.33, "text": "要么女方看不上男方，要么男方看不上女方。", "en": "Either the woman looks down on the man, or the man looks down on the woman."}, {"start": 383.33, "end": 389.21, "text": "这个案例，引发的思考不仅仅是再婚问题，还有如何经营婚姻。", "en": "This case prompts reflection not only on the issue of remarriage, but also on how to manage a marriage."}, {"start": 389.21, "end": 391.01, "text": "当年很多人劝她不要离婚。", "en": "Back then many people advised her not to divorce."}, {"start": 391.01, "end": 395.09, "text": "15年后回头看，她是做对了，还是做错了呢？", "en": "Looking back after 15 years, did she do the right thing, or the wrong thing?"}, {"start": 395.09, "end": 401.21, "text": "除了父母和女儿的遗憾外，我不知道她这15年多来，是否有过男人。", "en": "Apart from the regret felt by her parents and daughter, I do not know whether in these past 15-odd years she has had any man."}, {"start": 401.21, "end": 405.48, "text": "如果有，很可能她自己也跟前夫一样犯了错，当了第三者。", "en": "If she has, very likely she herself, like her ex-husband, made a mistake and became the other woman."}, {"start": 405.48, "end": 412.92, "text": "如果没有，她的确坚守了自己的信条，然而人这一生啊，到底为何坚守，为谁坚守？", "en": "If she has not, she has indeed held fast to her own creed; yet in this life of ours, in the end why do we hold fast, and for whom?"}, {"start": 412.92, "end": 417.67, "text": "p.s：评论区老有好事者揪住“千万市值”涉嫌腐败说事。", "en": "P.S.: In the comments section there are always busybodies who seize on the “ten-million market value” as suspected corruption and make an issue of it."}, {"start": 417.67, "end": 419.06, "text": "这里说明一下：", "en": "Here is a clarification:"}, {"start": 419.06, "end": 430.42, "text": "1、本帖的主旨是以案例来讨论婚姻问题，情节当然必须符合生活逻辑，至于具体人和事是否完全真实，其实并不重要。", "en": "1. The main purpose of this post is to discuss the issue of marriage through a case; the plot of course must accord with the logic of life, and as for whether the specific people and events are entirely true, it does not really matter."}, {"start": 430.42, "end": 434.3, "text": "我提到的一些信息，也只是听说，并未调查。", "en": "Some of the information I mentioned was merely heard by rumour and was not investigated."}, {"start": 434.3, "end": 441.26, "text": "2、体制内人员各有各的背景，身家几千万，几亿的，组织部门都会要求申报并核查。", "en": "2. People within the system each have their own background; those worth tens of millions or hundreds of millions, the organisation department will require them to declare and verify."}, {"start": 441.26, "end": 444.07, "text": "只要能说明合法来源，并不违法。", "en": "So long as one can account for a lawful source, it is not unlawful."}, {"start": 444.07, "end": 448.27, "text": "不能简单说谁有几千万，就是腐败分子。", "en": "One cannot simply say that whoever has tens of millions is a corrupt element."}, {"start": 448.27, "end": 454.92, "text": "3、人家前夫是国企人员后来转任公务员的，这种发展路径在体制内很常见。", "en": "3. Her ex-husband was a state-owned-enterprise employee who later transferred to become a civil servant; such a career path is very common within the system."}, {"start": 454.92, "end": 463.01, "text": "90年代，很多国企改制，股票根本没人要，需要动员企业人员甚至体制内人员购买，以便顺利推进改革。", "en": "In the 1990s, many state-owned enterprises were restructured; shares were simply unwanted, and enterprise staff and even people within the system had to be mobilised to purchase them, so as to advance the reform smoothly."}, {"start": 463.01, "end": 467.74, "text": "购买者不仅不违法，甚至还被视之为改革做贡献之举。", "en": "The purchasers were not only not breaking the law, but were even regarded as having made a contribution to the reform."}, {"start": 467.74, "end": 472.1, "text": "这些原始股是一种风险投资，命运各不相同。", "en": "These original shares were a kind of venture investment, with varied fates."}, {"start": 472.1, "end": 475.03, "text": "有的改革经营失败，变成了废纸。", "en": "Some reforms failed in their management, and the shares turned into waste paper."}, {"start": 475.03, "end": 478.03, "text": "也有的企业后来上市了，股份增值巨大。", "en": "Some enterprises later listed on the market, and their shares appreciated enormously."}, {"start": 478.03, "end": 484.7, "text": "比如大家熟悉的紫金矿业，2000年股改时，当地不少体制内的人都有购买。", "en": "Take the well-known Zijin Mining, for instance: at the time of its 2000 share reform, many people within the system locally bought some."}, {"start": 484.7, "end": 491.71, "text": "当时的原始股面值0.1元，实际只值几分钱，据说很多人拿股票到食堂兑换馒头。", "en": "At the time the face value of the original shares was 0.1 yuan, but they were actually worth only a few fen; it is said many people took their shares to the canteen to exchange for steamed buns."}, {"start": 491.71, "end": 493.94, "text": "谁知道后面上市后这么值钱？", "en": "Who could have known that afterwards, once listed, they would be worth so much?"}, {"start": 493.94, "end": 495.46, "text": "价值翻了几百倍。", "en": "Their value multiplied several hundredfold."}, {"start": 495.46, "end": 506.54, "text": "有熟悉的体制内人员科长，就是因为持有紫金矿业的原始股，现在身家超过5000万，周围的同事大家都知道，他也如实向组织申报了。", "en": "A section chief I know within the system, precisely because he held original shares of Zijin Mining, now has a net worth of over 50 million; his colleagues around him all know this, and he also truthfully declared it to the organisation."}, {"start": 506.54, "end": 513.5, "text": "这种情况，在紫金矿业的老家长汀县绝不是个案，不涉及违纪违法。", "en": "Such a situation is by no means an isolated case in Changting County, the old home of Zijin Mining, and involves no violation of discipline or law."}]}, {"title": "为什么40岁男普遍不考虑40岁女？ Part 4（101句，10:33）", "mp3": "40_______40-part04/audio.mp3", "dur": "10:33", "lines": [{"start": 0.0, "end": 2.09, "text": "“你投诉我也要找个18的", "en": "Even if you report me, I'd still want to find an 18-year-old."}, {"start": 2.09, "end": 6.89, "text": "”", "en": "”"}, {"start": 6.89, "end": 10.13, "text": "鄙人43，老婆41。", "en": "I am 43, my wife is 41."}, {"start": 10.13, "end": 16.44, "text": "老婆常年健身，当然她建模不行，身高矮，除此之外脸型、身材比例都不错。", "en": "My wife works out all year round. Of course, she isn't much to look at and she's on the short side, but apart from that her face shape and body proportions are quite good."}, {"start": 16.44, "end": 21.67, "text": "就这，我还愿意碰她，是因为家里饭吃着放心，完全不是因为她有姿色。", "en": "Even so, the reason I'm still willing to be intimate with her is that I can eat at home without a worry, and it's absolutely not because she's attractive."}, {"start": 21.67, "end": 29.54, "text": "而到了外头，40岁的女人，相信我，年老色衰可能是你能接受的她们最小的弱点。", "en": "But out in the world, women of 40 — believe me — having lost their looks with age is likely the least of their flaws that you could accept."}, {"start": 29.54, "end": 35.38, "text": "除非你本人建模特别好，否则，你搞定她们的代价高于20岁的小姑娘！", "en": "Unless you yourself are exceptionally good-looking, the cost of winning them over is higher than that of a 20-year-old girl!"}, {"start": 35.38, "end": 42.46, "text": "我自己身边82-87年的上海男人（市区郊区都有），37—42岁，未婚的还有不少。", "en": "Among the Shanghai men I know, born between 1982 and 1987 (both in the city centre and the suburbs), aged 37 to 42, quite a few are still unmarried."}, {"start": 42.46, "end": 47.42, "text": "条件好的，找95后（上海苏南浙北，独生女）", "en": "Those in good circumstances find post-95 girls (Shanghai, southern Jiangsu, northern Zhejiang; only daughters)."}, {"start": 47.42, "end": 51.86, "text": "条件一般的，找90后（江浙沪皖，独生优先）", "en": "Those in average circumstances find post-90 girls (Jiangsu, Zhejiang, Shanghai, Anhui; only children prioritised)."}, {"start": 51.86, "end": 56.95, "text": "条件差的，找95后（经济欠发达地区，非独生）", "en": "Those in poor circumstances find post-95 girls (less developed regions; not only children)."}, {"start": 56.95, "end": 61.7, "text": "我目前还没听说过，84年男的会找84年女的，至少上海是这样子。", "en": "So far I haven't heard of an 84-born man seeking an 84-born woman; at least that is how it is in Shanghai."}, {"start": 61.7, "end": 64.54, "text": "电影《霸道总裁爱上即将绝经的我》", "en": "The film *The Domineering CEO Falls for Menopausal Me*"}, {"start": 64.54, "end": 66.14, "text": "票房会有多少？", "en": "What would the box-office take be?"}, {"start": 66.14, "end": 71.54, "text": "我身边一个领导79年好多年前离婚无娃，今年想着还是再婚要个娃儿。", "en": "A boss I know, born in 1979, divorced many years ago with no children, thought this year he'd remarry and have a child."}, {"start": 71.54, "end": 86.18, "text": "同事给他介绍的91年未婚，身体健康，身高偏矮些皮肤稍微黑一点，颜值算普通也愿意结婚生娃儿的女生，他看了一眼就说，也不是什么都要，好歹要睡得下嘛。", "en": "A colleague introduced him to an unmarried woman born in 1991, physically healthy, a bit on the short side with slightly darker skin; her looks were merely ordinary, but she was willing to marry and have children. He took one look and said, it's not that I want everything, but at least she should be someone I can sleep with."}, {"start": 86.18, "end": 90.94, "text": "后面介绍个同龄的离异带娃的老师，颜值身材都还好。", "en": "Later they introduced a same-age divorced teacher with a child, whose looks and figure were both decent enough."}, {"start": 90.94, "end": 94.9, "text": "立马屁颠屁颠约起，也不考虑能不能下崽儿的事了。", "en": "He eagerly set up a meeting straight away, and no longer bothered about whether she could bear children."}, {"start": 94.9, "end": 99.53, "text": "40岁女颜值在线，你看是哪个考虑哪个？", "en": "A 40-year-old woman whose looks still hold up — which of the two do you think he'd go for?"}, {"start": 99.53, "end": 104.4, "text": "昨天遇见一个60岁的大哥，离异，所以最近疯狂相亲找女朋友。", "en": "Yesterday I met a 60-year-old chap, divorced, who has lately been frantically going on matchmaking dates to find a girlfriend."}, {"start": 104.4, "end": 107.23, "text": "他最后挑来挑去的选了个32岁的。", "en": "After much picking and choosing, he finally settled on a 32-year-old."}, {"start": 107.23, "end": 111.84, "text": "我们问他，这个年纪了不是应该找个年纪相仿的有共同语言吗？", "en": "We asked him, at this age shouldn't you find someone of a similar age, someone you share common ground with?"}, {"start": 111.84, "end": 129.72, "text": "他说，其实跟20多，30多，40多，甚至更大岁数的女人在一起将来的结局都是一样的，都不会太好，那不如找个年轻的，漂亮的，自己看着喜欢，高兴，整个人都觉得充满了活力，多好，有机会的话再生个孩子，感觉生命又重活一次，多好的。", "en": "He said, actually, being with a woman in her twenties, thirties, forties, or even older, the eventual outcome is all the same — none of it good. So why not find a younger, prettier one, someone you like to look at, who makes you happy and fills you with vitality again — how lovely — and if there's a chance, have another child and feel as though life is being lived all over again, how wonderful."}, {"start": 129.72, "end": 132.31, "text": "我现在感觉自己状态非常年轻。", "en": "I now feel incredibly youthful."}, {"start": 132.31, "end": 138.84, "text": "然后，在我们吃饭的间隙，他不停接他小女友的视频邀请，他都是跑的远远的。", "en": "Then, in the gaps between our meal, he kept taking his young girlfriend's video calls, always running off to some distant spot to do so."}, {"start": 138.84, "end": 147.17, "text": "他的同班同学就一直给我吐槽，他说成天哄小孩有啥意思，这个年纪了就该跟原配一起相伴到老就是最好的。", "en": "His classmate kept grumbling to me, saying what's the point of pandering to a child all day; at this age you ought to grow old together with your first wife — that's the best there is."}, {"start": 147.17, "end": 153.36, "text": "我看着他满头的白发，再看看他那个恋爱中的男同学一头黑发，似乎懂了一点。", "en": "I looked at his head of white hair, then at his lovesick male classmate's head of black hair, and felt I understood a little."}, {"start": 153.36, "end": 157.08, "text": "前几年的时候，我老公做了一回媒人，很顺利的成功了。", "en": "A few years back, my husband played matchmaker once, and it went very smoothly."}, {"start": 157.08, "end": 169.08, "text": "男方当时四十七岁，有个男孩国外留学正读大三，爱人猝然去世，我们两家关系很好，他爱人我也熟悉，噩耗传来痛哭了几场。", "en": "The man was then 47, with a son studying abroad in his third year of university; his wife had passed away suddenly. Our two families were close, and I knew his wife well; when the terrible news arrived I wept on several occasions."}, {"start": 169.08, "end": 172.2, "text": "他们夫妻感情极好，同学时代走过来的。", "en": "The couple had been extremely close; they had come through their student days together."}, {"start": 172.2, "end": 183.6, "text": "夫人过世不久就有人给介绍了，毕竟条件不错的，央企副总，稳定年入几十万，家里大平层别墅都有的，个子北方人180，长相一般也绝对不丑。", "en": "Not long after his wife passed, someone introduced him to a prospect, for his conditions were decent enough: a vice president at a central state-owned enterprise, a steady annual income of several hundred thousand, with both a large flat and a villa at home, a northerner standing 180cm tall, of average looks but certainly not ugly."}, {"start": 183.6, "end": 194.16, "text": "不是秃头大肚子油腻男，情商能力都在线——当然这条件达不到小🍠和知乎人均百万收入的要求，我们三线城市，要求不高。", "en": "Not a balding, pot-bellied, greasy sort; his emotional intelligence and ability were both up to scratch — of course such conditions fall short of the per-capita-million-income standards of Xiaohongshu and Zhihu; we're a third-tier city, so our expectations aren't high."}, {"start": 194.16, "end": 198.53, "text": "当时他拒绝考虑这个问题，亡妻尸骨未寒，走不出来。", "en": "At the time he refused even to consider the matter; his late wife's bones were not yet cold, and he could not move on."}, {"start": 198.53, "end": 202.8, "text": "这样过了一年多，慢慢的开始有选择的去见人。", "en": "After more than a year like this, he gradually began to meet people on a selective basis."}, {"start": 202.8, "end": 209.45, "text": "介绍的条件很好，有刚毕业新入职的小姑娘，也有离婚无孩的，有漂亮的也有一般的。", "en": "The introductions were of good quality: there were fresh graduates just starting work, as well as divorced women without children, pretty ones and plain ones."}, {"start": 209.45, "end": 211.18, "text": "当然，都比他年轻多了。", "en": "Of course, they were all far younger than him."}, {"start": 211.18, "end": 219.74, "text": "他态度是不拒绝，不积极，找到合适的就找，不合适单着也可以，所以有选择的去见。", "en": "His attitude was to neither refuse nor push: if he found a suitable one he'd go for it, and if not he was happy to stay single, so he met people selectively."}, {"start": 219.74, "end": 223.03, "text": "一个系统的他都pass，主动往上扑的更不可能。", "en": "He passed on all those from the same system; those who threw themselves at him were even more out of the question."}, {"start": 223.03, "end": 226.32, "text": "毕竟要注意影响的，人家图啥他心知肚明。", "en": "After all, he had to mind his reputation; what they were after he knew full well."}, {"start": 226.32, "end": 236.47, "text": "年轻的也pass，他们上班搞业绩开会各种关系应酬要累死了，没精力再哄小姑娘提供情绪价值那一套。", "en": "The young ones he passed on too; they were at work chasing targets, in meetings, and worn out juggling all sorts of networking and social obligations — with no energy left to pamper some young girl and play that emotional-value game."}, {"start": 236.47, "end": 239.16, "text": "都有代沟了，共同语言基本没有。", "en": "There was already a generation gap, and basically no common ground."}, {"start": 239.16, "end": 246.6, "text": "小姑娘提供的激情和肉体，敬谢不敏，不是所有男人脑子都在下半部的。", "en": "The passion and physical intimacy offered by young girls — he politely declined; not every man has his brains below the waist."}, {"start": 246.6, "end": 256.68, "text": "离婚有娃的pass，男娃女娃都不行，带不带都不行，他自己的孩子毕业已经独立了，不想再操心别人的事。", "en": "Divorced women with children he passed on — whether a boy or a girl, whether she had custody or not, none would do; his own child had graduated and become independent, and he didn't want to fret over someone else's affairs again."}, {"start": 256.68, "end": 258.36, "text": "关系复杂懒得处理。", "en": "The relationships were too tangled to bother dealing with."}, {"start": 258.36, "end": 263.52, "text": "太漂亮的不见，自持美貌的更加pass，他说配不上人家。", "en": "The very beautiful ones he wouldn't meet; those who traded on their looks he passed on all the more, saying he wasn't worthy of them."}, {"start": 263.52, "end": 281.76, "text": "这种情况下，我老公的同学找来了，这同学介绍她的同事，gwy，比男方小五岁，未婚，长相一般，有点书生气，年轻时恋爱过没结果，蹉跎下来一直单身，独生女，自己有车有房，父母县城有退休金。", "en": "In this situation, a classmate of my husband's came forward, and this classmate introduced a colleague of hers, a civil servant, five years younger than the man, unmarried, of average looks, with a somewhat bookish air; she had been in love when young but it came to nothing, and had drifted along single ever since — an only daughter, with her own car and flat, her parents drawing a pension in a county town."}, {"start": 281.76, "end": 293.21, "text": "俩人相见后都有好感，处了一年左右，现在已经结婚了（多说一句，婚礼他没大办，但是我我也没参加，想起他亡妻实在是难过）。", "en": "After they met, both took a liking to each other, and after about a year of seeing one another they are now married (one more thing: he didn't hold a grand wedding, and I myself didn't attend either, for the thought of his late wife was simply too painful)."}, {"start": 293.21, "end": 304.68, "text": "婚前，男方把自己名下的房子给孩子两套，一套市中心大平层，一套小别墅——都卖了，后来孩子在杭州工作，买了那边的房子。", "en": "Before the marriage, the man gave two of the flats under his name to his child: one a large city-centre flat, one a small villa — both were sold; later the child worked in Hangzhou and bought a flat there."}, {"start": 304.68, "end": 320.57, "text": "存款啥的也做好隔离——孩子母亲那份以后都给孩子，他自己的一半也以后也会给孩子（他说的，全家财产的一半算亡妻的，给孩子；另一半是他的，他从这分一半给孩子。", "en": "Savings and such were also properly ring-fenced — the portion that belonged to the child's mother would later all go to the child, and his own half would also later go to the child (as he put it: half of the family's assets counted as the late wife's, to the child; the other half was his, and from that he would give half to the child."}, {"start": 320.57, "end": 328.25, "text": "另外，他收入是新娶妻子的大概四到五倍，婚后收入归新家庭，婚后他购买的房子俩人名字。", "en": "Additionally, his income is roughly four to five times that of his new wife; their post-marriage income goes to the new family, and the flat he bought after the marriage is in both their names."}, {"start": 328.25, "end": 331.37, "text": "）", "en": ")"}, {"start": 331.37, "end": 341.4, "text": "婚后，买了新房子，依然是大平层（惭愧，我说错了，140平米不算大平层，被嘲笑～但就此说明不改了）。", "en": "After the marriage they bought a new flat, still a large flat (I'm embarrassed to admit I was wrong — 140 square metres doesn't count as a large flat, and I got teased about it ~ but I'll leave it as it is)."}, {"start": 341.4, "end": 346.44, "text": "我们三线小城市，房价和省会及一线城市比不了 ，大家原谅我没见识。", "en": "We're a small third-tier city; our house prices can't compare with those of the provincial capital and first-tier cities, so please forgive my lack of worldly experience."}, {"start": 346.44, "end": 350.95, "text": "因为尊重新婚妻子，他是卖了一套房子又加了点钱换的这套，", "en": "Out of respect for his new wife, he sold one flat and added some money to trade up to this one,"}, {"start": 350.95, "end": 353.76, "text": "俩人安安静静的过着日子，老夫老妻一样。", "en": "The two of them live quietly, like an old married couple."}, {"start": 353.76, "end": 357.48, "text": "年龄相差五岁，都是七零后。", "en": "They are five years apart in age, both of the post-70s generation."}, {"start": 357.48, "end": 364.08, "text": "他爱做饭，平时俩人吃食堂只有晚饭能一起吃，只要在家都是他下厨。", "en": "He loves to cook; normally they eat in the canteen and can only have dinner together, but whenever they're at home he is the one who cooks."}, {"start": 364.08, "end": 375.6, "text": "新娶的妻子想要孩子，他不反对也配合，但是私下里跟我们说是不想要的，随缘吧，目前是没有，应该也不会有了，五十多岁了。", "en": "His new wife wants a child; he doesn't object and goes along with it, but in private he told us he doesn't actually want one — leave it to fate, he said; there isn't one at present and probably won't be, as he's already in his fifties."}, {"start": 375.6, "end": 381.12, "text": "我周围的人离婚的不多，再婚找的基本相差五六岁没超过十岁的。", "en": "Among the people around me, not many are divorced; those who remarry generally find someone five or six years apart, not exceeding ten."}, {"start": 381.12, "end": 390.48, "text": "大家都是普通人，互相所图基本都能看出来，有些东西是不值得用婚姻交换的，安稳生活才是真正需要的。", "en": "We're all ordinary people; what each side is after is plainly visible, and some things aren't worth trading for in marriage — a stable life is what's truly needed."}, {"start": 390.48, "end": 395.21, "text": "———-", "en": "———-"}, {"start": 395.21, "end": 403.97, "text": "刚说过周围离婚人不多，想想参加工作三十多年，同学同事朋友认识的人，也有五六个离婚的。", "en": "I just said few around me are divorced, but thinking back over more than thirty years of work, among the classmates, colleagues and friends I know, there are also five or six who divorced."}, {"start": 403.97, "end": 407.5, "text": "还有一对，依然是再婚夫妻相差五岁的。", "en": "There is another couple, also a remarried pair five years apart."}, {"start": 407.5, "end": 415.06, "text": "男，再婚时41岁，我们市这边央企副总，现在已经退休，退休前做到了省副总。", "en": "The man, when he remarried, was 41, a vice president at a central state-owned enterprise in our city; now retired, he had before retirement risen to provincial vice president."}, {"start": 415.06, "end": 421.61, "text": "收入同上（我老公的同事们，熟悉的过来过去就是这些人），后来更高。", "en": "His income was as above (my husband's colleagues — the familiar faces coming and going are just these people), and later it was even higher."}, {"start": 421.61, "end": 429.94, "text": "长得特别有男人味，高大魁梧，作风硬朗，讲义气，我总联想到乔峰。", "en": "He looked especially masculine, tall and burly, with a brisk, decisive style and a loyal streak; I always think of Qiao Feng."}, {"start": 429.94, "end": 443.33, "text": "他是离异，前妻也是女强人，俩人同系统级别差不多，都是强势的性格，工作原因聚少离多，有个儿子，离婚时初中，后来国外留学，现在拿了身份不回来了。", "en": "He was divorced; his ex-wife was also a strong, capable woman. The two were in the same system with similar ranks, both strong-willed; work kept them apart much of the time, and they had a son who was in junior high when they divorced, later studied abroad, and now has obtained residency and won't come back."}, {"start": 443.33, "end": 448.2, "text": "夫妻俩也算好聚好散吧，内情不知道，总之离婚也没啥流言。", "en": "The couple parted on reasonably amicable terms, I don't know the inside story, but in any case the divorce gave rise to no real gossip."}, {"start": 448.2, "end": 451.32, "text": "儿子归他，具体家产怎么分不清楚。", "en": "The son stayed with him; exactly how the assets were divided isn't clear."}, {"start": 451.32, "end": 454.15, "text": "离婚后三年经介绍认识的女方。", "en": "The woman he met through an introduction three years after the divorce."}, {"start": 454.15, "end": 457.7, "text": "女方再婚时36，离异，跟前夫没孩子。", "en": "The woman, when she remarried, was 36, divorced, with no children by her ex-husband."}, {"start": 457.7, "end": 462.79, "text": "不是同系统，算关联单位吧，一般工作人员。", "en": "Not the same system, but an affiliated unit — a regular member of staff."}, {"start": 462.79, "end": 469.39, "text": "长得非常漂亮，一米七多的个子，身材玲珑有致，也会爱打扮，现在五十多了风韵犹存。", "en": "She was extremely beautiful, over 1.7 metres tall, with a graceful, well-proportioned figure, and she liked to dress up; now in her fifties she still retains her charm."}, {"start": 469.39, "end": 473.04, "text": "俩人谈了半年结婚，一起出来实在赏心悦目。", "en": "The two dated for half a year then married; going out together they were truly a pleasure to behold."}, {"start": 473.04, "end": 477.05, "text": "现在俩人儿子在国外留学，听说毕业后应该回来。", "en": "Now their son is studying abroad; I hear he should come back after graduating."}, {"start": 477.05, "end": 481.08, "text": "他家里绝对是男人说了算，家务完全不做不管，当大爷一样。", "en": "In his home he absolutely calls the shots; he does none of the housework and takes no part in it, living like a lord."}, {"start": 481.08, "end": 493.8, "text": "俩孩子都归老婆操心（他自己父母在外地，有兄弟照顾，不需他特别照顾），情绪价值没有，会在聚会时发现老婆哪里做的不合心意指着老婆鼻子骂。", "en": "Both children were left for the wife to look after (his own parents are out of town, cared for by his brothers, so he needn't specially tend to them); he provided no emotional value, and at gatherings would point at his wife's face and scold her over anything that displeased him."}, {"start": 493.8, "end": 497.88, "text": "工资完全上交给老婆管，但是支出他说了算。", "en": "His salary was handed entirely to his wife to manage, but he had the final say on spending."}, {"start": 497.88, "end": 506.83, "text": "给岳父岳母买了同小区的房子，自家别墅和海南的房子俩老人随便住，大舅子小舅子的生计他关照。", "en": "He bought a flat in the same complex for his parents-in-law; the old couple could stay as they pleased in his own villa and his flat in Hainan, and he looked after the livelihoods of his wife's elder and younger brothers."}, {"start": 506.83, "end": 512.71, "text": "女方性格绵软，对前妻的孩子无微不至，百依百顺，不敢说一个不字。", "en": "The woman has a soft, gentle nature; towards the ex-wife's child she was attentive to the last detail and utterly compliant, not daring to utter a single word of objection."}, {"start": 512.71, "end": 519.6, "text": "男孩子高中住校，回家时间有限，后来留学，基本共同生活时间不多。", "en": "The boy boarded at school in high school, with limited time at home, and later studied abroad, so they spent little time actually living together."}, {"start": 519.6, "end": 526.13, "text": "现在俩人都退休了，没事开车自驾，招呼老朋友打打牌，过着悠闲自在的生活。", "en": "Now both of them are retired; with time on their hands they drive off on road trips and call old friends round for cards, living a leisurely, carefree life."}, {"start": 526.13, "end": 530.62, "text": "婚姻没啥对错，只看合适不合适，舒服不舒服。", "en": "Marriage has no right or wrong to it; it only comes down to whether it suits or not, whether it's comfortable or not."}, {"start": 530.62, "end": 533.21, "text": "—————————————", "en": "—————————————"}, {"start": 533.21, "end": 535.3, "text": "还有一对再婚的，也过的挺好。", "en": "There's another remarried couple who also get along quite well."}, {"start": 535.3, "end": 540.89, "text": "女方比较熟悉，我老公的下属，比我们小几岁，现在也五十出头了。", "en": "The woman I know fairly well; she's a subordinate of my husband's, a few years younger than us, now just past fifty."}, {"start": 540.89, "end": 544.73, "text": "当年也是一方诸侯吧，开疆辟土的非常能干。", "en": "In those days she was a power in her own sphere, blazing new trails and extremely capable."}, {"start": 544.73, "end": 547.44, "text": "长得也可以，就比较精英那种气质。", "en": "She was good-looking too, with that elite sort of bearing."}, {"start": 547.44, "end": 558.19, "text": "前夫也是同单位的，但长期外派，外面有人了，俩人就离了，男的算净身出户吧，儿子那时初中，归她，房子车子也都归她。", "en": "Her ex-husband was also at the same unit, but was posted away long-term and took up with someone else, so the two divorced; the man basically left with nothing, their son was in junior high then and went to her, and the flat and car also went to her."}, {"start": 558.19, "end": 563.42, "text": "后来孩子出国留学，费用前夫也负担了一半，现在孩子定居漂亮国了。", "en": "Later the child studied abroad, and the ex-husband covered half the costs; now the child has settled in America."}, {"start": 563.42, "end": 574.15, "text": "娘家是当地的，孩子就在姥姥家吃住了两三年，大事小情的哥嫂也关照的好，生活不需要她操心，过的悠闲自在。", "en": "Her natal family was local; the child ate and stayed at the maternal grandmother's home for two or three years, and her elder brother and his wife looked after all the big and small matters well, so she had no need to worry about daily life and lived at her leisure."}, {"start": 574.15, "end": 584.88, "text": "然后遇到现任，现任是兄弟单位的中层，比她大五六岁，大肚腩，但是才子，口才一流，参看胖子时代的矮大紧。", "en": "Then she met her current husband, a mid-level manager at a sister unit, five or six years older than her, with a sizeable paunch, but a gifted talent and first-rate speaker — think Gao Xiaosong in his portly days."}, {"start": 584.88, "end": 587.71, "text": "离异，有一子，跟她儿子同龄。", "en": "Divorced, with a son the same age as her own."}, {"start": 587.71, "end": 588.74, "text": "俩人挺浪漫…", "en": "The two of them were quite romantic…"}, {"start": 588.74, "end": 604.27, "text": "海边相依看月亮，落雪时跑山里看山舞银蛇，送花啥的不在话下，更厉害的是这男的做的一手好菜，征服了她的胃，羡慕死我了，聚会时我老公他们每次都一起上把这死胖子喝懵。", "en": "They leaned on each other watching the moon by the sea; when snow fell they'd run to the hills to watch the mountains dance like silver serpents; sending flowers and such was nothing to him, but what was even more impressive was that this man was a superb cook who conquered her stomach — I was green with envy; at gatherings my husband and the others would all pile in and drink this fatso into a stupor every single time."}, {"start": 604.27, "end": 607.44, "text": "这些都是这男的自己喝多了说的，也是活该挨灌。", "en": "All of this was said by the man himself when he was drunk, and he thoroughly deserved to be plied with drink."}, {"start": 607.44, "end": 615.31, "text": "俩人现在结婚也快十年了，男的婚后不久跳槽到北京——赚钱多点，儿子留学费用要负担。", "en": "The two have now been married nearly ten years; not long after the wedding the man changed jobs and moved to Beijing — to earn a bit more, since he had to cover their son's study-abroad expenses."}, {"start": 615.31, "end": 620.47, "text": "婚后这男的住女方的房子里，他自己也有房子，但女方嫌弃不舒服，就这么住着了。", "en": "After the marriage this man lived in the woman's flat; he had his own place too, but the woman found it uncomfortable, so that's where they ended up living."}, {"start": 620.47, "end": 625.34, "text": "过几年退休她去北京夫妻团聚，然后再男的退休一起回来。", "en": "In a few years, when she retires, she'll go to Beijing to be reunited with her husband, and then when he retires they'll come back together."}, {"start": 625.34, "end": 630.7, "text": "俩人收入女的略高，到北京后男方收入上来了，但负担重点。", "en": "The two earn slightly more on her side; after the move to Beijing the man's income rose, but his burden is the heavier one."}, {"start": 630.7, "end": 633.29, "text": "还是那句话，俩人觉得舒服就好。", "en": "As the old saying goes, as long as the two of them feel comfortable, that's all that matters."}]}, {"title": "为什么40岁男普遍不考虑40岁女？ Part 5（86句，8:51）", "mp3": "40_______40-part05/audio.mp3", "dur": "8:51", "lines": [{"start": 0.0, "end": 6.6, "text": "我们医院扫卫生间的阿姨就是40多岁的大龄剩女，大家嘘嘘时，她就在一旁拖地。", "en": "Our hospital's toilet-cleaning lady is a woman in her forties who is still unmarried, and when people go for a wee she mops the floor right beside them."}, {"start": 6.6, "end": 10.92, "text": "粗略看一下各位答主的答案，真的惊掉下巴。", "en": "Skimming through the answers from the various respondents, I was genuinely gobsmacked."}, {"start": 10.92, "end": 19.13, "text": "题主或者是绝大多数男人把40岁的男人想象成头发浓密，身材保持很好，又有钱的中年男人了吧？", "en": "The OP, or perhaps the vast majority of men, picture a 40-year-old man as a middle-aged man with a thick head of hair, a well-maintained figure, and money, don't they?"}, {"start": 19.13, "end": 25.9, "text": "可是事实上，地中海，堪比怀孕五个月甚至七个月的大肚子，又穷，这种比比皆是。", "en": "But in reality, the bald-on-top type, with a belly rivalling a five-month, even seven-month pregnancy, and broke to boot—such men are ten a penny."}, {"start": 25.9, "end": 38.45, "text": "球球了，拜托了，醒一醒，40岁的单身男女根本相互看不上，单到这个年龄的优质男女都喜欢年轻人，有活力，有激情，有恋爱的味道。", "en": "I'm begging you, please, wake up. Single men and women at 40 simply don't fancy each other; the high-quality single men and women who've remained unmarried to this age all like young people—full of energy, passion, the flavour of romance."}, {"start": 38.45, "end": 43.8, "text": "劣质的就甭提了，都往上找，55以上男女能嫁娶就不错了。", "en": "As for the low-quality ones, let's not even mention them; they all look upward in age, and for men and women over 55, just managing to marry at all is good enough."}, {"start": 43.8, "end": 46.75, "text": "看完答案，午饭差点没吐出来。", "en": "After reading the answers, I nearly threw up my lunch."}, {"start": 46.75, "end": 53.83, "text": "女网友说：今天脚崴了，口腔溃疡，姨妈来了，手腕脱臼了，腰闪了，拉肚子，痔疮还犯了.", "en": "A female netizen said: today I twisted my ankle, got a mouth ulcer, got my period, dislocated my wrist, threw my back out, have diarrhoea, and my haemorrhoids flared up again."}, {"start": 53.83, "end": 54.98, "text": "我该怎么办？", "en": "What should I do?"}, {"start": 54.98, "end": 57.58, "text": "要是我没干过律师我就真的信了", "en": "If I hadn't worked as a lawyer, I would have truly believed it."}, {"start": 57.58, "end": 71.9, "text": "我认识的四十岁左右、履历优秀的男性多了去了，有年入百万以上的精英、有年营业额上亿公司的老板、有专业性极强的科技从业者，个个拿出来都能在知乎上算优质男。", "en": "I know plenty of men around forty with excellent CVs—elites earning over a million a year, bosses of companies with annual turnovers in the hundreds of millions, highly specialised tech professionals. Any one of them, taken on his own, would count as a high-quality man on Zhihu."}, {"start": 71.9, "end": 73.9, "text": "但也没有普遍性娶年轻姑娘。", "en": "But there's no general pattern of them marrying young girls either."}, {"start": 73.9, "end": 79.06, "text": "四十多+不喜欢老女人只喜欢小姑娘，基本都这样，半点不稀奇。", "en": "A man in his forties who doesn't like older women and only likes young girls—that's basically the norm, and not the least bit surprising."}, {"start": 79.06, "end": 95.45, "text": "问题是再优秀的男的也仅仅是男的，不是皇帝，只能自由恋爱不能选妃，光自己看上了没用，得二十岁小姑娘能同意，另外搞定只比自己大几岁的老丈人+丈母娘，才能抱得美人归。", "en": "The problem is, no matter how outstanding the man is, he's still just a man, not an emperor; he can only pursue free love, not select concubines. It's useless if only he's keen—the twenty-year-old girl has to agree, and on top of that you have to win over the father-in-law and mother-in-law who are only a few years older than him, before you can win the beauty's hand."}, {"start": 95.45, "end": 99.1, "text": "所以他们共同特点不仅仅是年纪大，还包括", "en": "So their common traits are not only being older, but also include"}, {"start": 99.1, "end": 100.78, "text": "多金且肯砸钱", "en": "Wealthy and willing to splash the cash"}, {"start": 100.78, "end": 102.58, "text": "成熟且能包容", "en": "Mature and tolerant"}, {"start": 102.58, "end": 103.9, "text": "能说会道", "en": "Eloquent"}, {"start": 103.9, "end": 105.29, "text": "保养良好", "en": "Takes good care of himself"}, {"start": 105.29, "end": 106.8, "text": "愿意共同生孩子", "en": "Willing to have children together"}, {"start": 106.8, "end": 120.53, "text": "满足上述多数条件（是指异性普遍认为满足，不参考任何同性意见）只要想结婚，确实都娶到了年轻、长相身材学历工作都拿得出手、家庭不拖后腿的小姑娘。", "en": "Those who meet most of the above conditions (meaning as generally recognised by the opposite sex, without reference to any same-sex opinion)—as long as they wanted to marry, genuinely all ended up wedding young girls who measured up in looks, figure, education and job, and whose families didn't hold them back."}, {"start": 120.53, "end": 124.32, "text": "不满足条件但愿意大幅度下娶的，娶到了年轻…", "en": "Those who didn't meet the conditions but were willing to marry considerably beneath themselves, married young…"}, {"start": 124.32, "end": 126.05, "text": "的小姑娘。", "en": "girls."}, {"start": 126.05, "end": 130.32, "text": "多数人还是老老实实娶了同龄门当户对的老婆。", "en": "Most people still honestly married wives of the same age and matching family background."}, {"start": 130.32, "end": 141.29, "text": "当然，以上前提都是结婚意愿比较高，事实上精英男女很多都对婚姻毫无兴趣，就最近我了解到的一些dy内幕而言…", "en": "Of course, the above premise is that the willingness to marry is fairly high; in fact many elite men and women have zero interest in marriage, and going by some surrogacy inside information I recently learned…"}, {"start": 141.29, "end": 145.13, "text": "只考虑钱和获得孩子的角度，结婚性价比完败。", "en": "Considered only from the angles of money and obtaining a child, marriage loses comprehensively on value for money."}, {"start": 145.13, "end": 149.26, "text": "没事少上点网，多看看身边，唠唠八卦什么的，有惊喜。", "en": "When you've nothing to do, go online a bit less, look more at the world around you, have a gossip and so on—you'll get a pleasant surprise."}, {"start": 149.26, "end": 152.21, "text": "小呀么小花狸", "en": "Xiao Ya Me Xiao Hua Li"}, {"start": 152.21, "end": 154.42, "text": "180 次咨询", "en": "180 consultations"}, {"start": 154.42, "end": 155.5, "text": "5.0", "en": "5.0"}, {"start": 155.5, "end": 158.81, "text": "333043 次赞同", "en": "333043 upvotes"}, {"start": 158.81, "end": 163.56, "text": "去咨询", "en": "Consult"}, {"start": 163.56, "end": 167.04, "text": "对40岁女人兴趣最大的是20岁的男人。", "en": "The men most interested in 40-year-old women are 20-year-old men."}, {"start": 167.04, "end": 171.36, "text": "如果一个40岁男人的条件能够打动一个40岁的女人。", "en": "If a 40-year-old man's qualities could move a 40-year-old woman,"}, {"start": 171.36, "end": 173.93, "text": "那么他肯定能打动2个20岁的女人！", "en": "then he could certainly move two 20-year-old women!"}, {"start": 173.93, "end": 176.81, "text": "20岁女有几个考虑20岁男？", "en": "How many 20-year-old women consider 20-year-old men?"}, {"start": 176.81, "end": 179.98, "text": "此一时，彼一时，天道轮回罢了", "en": "Times change, the wheel of fortune turns—that's all."}, {"start": 179.98, "end": 182.66, "text": "人在美的，刚下飞机，打开X！", "en": "Currently in the US, just got off the plane, opening X!"}, {"start": 182.66, "end": 185.42, "text": "我比鸡哥蔡徐坤帅一万倍！", "en": "I'm ten thousand times better-looking than Brother Chicken, Xukun Cai!"}, {"start": 185.42, "end": 192.82, "text": "我在X上面发了一条朋友圈，一个身价百亿的58岁富婆要包养我，闻了一下，没有老人味！", "en": "I posted on X that a 58-year-old rich woman worth tens of billions wants to keep me as her boy toy; I gave her a sniff and there was no old-person smell!"}, {"start": 192.82, "end": 201.82, "text": "条件是一辆辆库里南，一辆跑车，北上广深港澳杭和一套大别野，还有一个月五百万现金！", "en": "The conditions are a Cullinan, a sports car, a villa in Beijing, Shanghai, Guangzhou, Shenzhen, Hong Kong, Macau and Hangzhou, plus five million in cash every month!"}, {"start": 201.82, "end": 205.06, "text": "中国人不骗中国人，中国人不噶中国人腰子！", "en": "Chinese don't scam Chinese; Chinese don't harvest Chinese kidneys!"}, {"start": 205.06, "end": 207.22, "text": "下面是富婆图片：", "en": "Below is a picture of the rich woman:"}, {"start": 207.22, "end": 214.34, "text": "不管他以任何理由如何委婉地拒绝，也总能总结出来一个起决定性作用的重点:嫌老。", "en": "No matter how tactfully he rejects her, for whatever reason, one can always distil the decisive point: he minds the age."}, {"start": 214.34, "end": 221.23, "text": "去年，单位组织联谊类活动，可巧碰到一起入职的至今仍单身的男同事。", "en": "Last year, my workplace organised a matchmaking-type event, and by a coincidence I ran into a male colleague who joined at the same time as me and is still single."}, {"start": 221.23, "end": 227.9, "text": "寒暄之际得知他至今未婚，也没对象，提到如果有合适的给他提提牵牵线之类的。", "en": "While exchanging pleasantries I learned he's still unmarried and has no partner, and I mentioned that if there were a suitable match I could play matchmaker for him or something."}, {"start": 227.9, "end": 244.18, "text": "我真把这个当回事了，小区里有一个跟我年龄相仿的女大龄未婚女，人家还是体制内的，她母亲好几年前便常说让给她女儿遇遇，不提条件，无车无房也行，只要俩年轻人对眼就行。", "en": "I took it seriously. In my residential compound there's an older unmarried woman around my age, and she's actually within the system; her mother had been saying for years that she'd like to let her daughter meet someone—no conditions, no car or house required, as long as the two young people hit it off."}, {"start": 244.18, "end": 253.82, "text": "我们就是普通工人，要说找到一个年龄相仿的体制内甚至很有可能从来没有谈过恋爱的女性，也是美事一桩，我这样想的。", "en": "We're just ordinary workers. To find a woman around the same age, within the system, and very likely someone who's never been in a relationship—that would be a fine thing, I thought."}, {"start": 253.82, "end": 258.22, "text": "结果，很快，男方就以女方工作为由，拒绝了。", "en": "In the end, very quickly, the man rejected her on the grounds of the woman's job."}, {"start": 258.22, "end": 270.02, "text": "不说身高长相，不谈家庭性格，素未谋面，线上线下从未说过一句话，只是拿对方最为优势的“工作”来拒绝，是我始料不及的。", "en": "Not mentioning height or looks, not discussing family or character, having never met, never having exchanged a single word online or offline—to reject her solely on the basis of her strongest asset, her “job”, was beyond my expectations."}, {"start": 270.02, "end": 276.1, "text": "马上40了，我步入婚姻多年，也能听懂人家的弦外之音、言外之意。", "en": "I'm nearly 40 and have been married for years, so I can read between the lines and grasp what people really mean."}, {"start": 276.1, "end": 287.21, "text": "很快我意识到，男方是嫌女方年龄大，他希望找个比自己年轻几岁的，这边女方最能拿得出手的“工作”反而是男方最不在意的那个条件。", "en": "Soon I realised the man minded the woman's age; he wanted to find someone a few years younger than himself, and the woman's most marketable asset, her “job”, was precisely the condition he cared least about."}, {"start": 287.21, "end": 289.3, "text": "作为女性，我完全能理解。", "en": "As a woman, I can completely understand."}, {"start": 289.3, "end": 306.74, "text": "年近40的年龄，现实点说，但凡有生育需求的男士不得不考虑到女方的生育能力，已经远远错过了最佳生育期，加上现在人的饮食习惯、精神压力，医院生殖科挂号的年轻夫妻也越来越多。", "en": "At an age nearing 40, to be realistic, any man with a need to have children cannot help but consider the woman's fertility; she has long missed her optimal childbearing window, and added to that, given people's diets and mental stress nowadays, more and more young couples are registering at hospital reproductive medicine departments."}, {"start": 306.74, "end": 308.35, "text": "这是最真实的原因。", "en": "This is the most genuine reason."}, {"start": 308.35, "end": 313.63, "text": "再说对异性外表的看重，40岁的吸引力真是大打折扣。", "en": "As for valuing the opposite sex's appearance, a 40-year-old's appeal really takes a nosedive."}, {"start": 313.63, "end": 316.03, "text": "就事论事，请大家不要喷我。", "en": "Speaking objectively, please everyone, don't flame me."}, {"start": 316.03, "end": 317.66, "text": "因为睁眼看世界啦", "en": "Because I've opened my eyes and seen the world, la."}, {"start": 317.66, "end": 328.78, "text": "我们男人40+50+真能去老挝 尼泊尔 菲律宾 巴基斯坦 娶18的小姑娘啊，我在老挝和尼泊尔的时候，很多年轻妹子都会上来搭话，", "en": "We men in our 40s and 50s really can go to Laos, Nepal, the Philippines, Pakistan to marry 18-year-old girls, you know. When I was in Laos and Nepal, lots of young girls would come up and chat me up,"}, {"start": 328.78, "end": 330.74, "text": "问我喜欢老挝姑娘吗？", "en": "asking if I liked Lao girls?"}, {"start": 330.74, "end": 332.74, "text": "要娶老挝妹子吗？", "en": "want to marry a Lao girl?"}, {"start": 332.74, "end": 334.46, "text": "你看我怎么样", "en": "what do you think of me"}, {"start": 334.46, "end": 350.23, "text": "我之前在老挝的时候经常遇到国男来外娶，半个月必成，所有成本加起来才1W，有的是妹子想崩你想嫁给你，她们还勤俭持家，愿意生孩子做饭照顾你，尊重你的努力工作和对家庭的付出", "en": "When I was in Laos before, I often met Chinese men coming to marry abroad; it's always settled within half a month, and all the costs add up to just 10,000. Some girls want to be with you and marry you; they're also thrifty and good at running the home, willing to have children, cook and look after you, and respect your hard work and devotion to the family."}, {"start": 350.23, "end": 369.02, "text": "哦 俄罗斯和乌克兰现在也是男女比率差极大的地方，毛妹夏天在沈阳，黑河，哈尔滨很多，冬天都去越南度假，那个地方叫啥来着，叫岘港，不喜欢越南妹可以去把把毛妹，那地方在惠安下面，名字非常难记", "en": "Oh, Russia and Ukraine are also places with a huge gender ratio gap now. Russian girls are all over Shenyang, Heihe and Harbin in summer, and in winter they all go to Vietnam for holiday—that place is called, what's it called, Da Nang. If you don't like Vietnamese girls you can have a go with the Russian girls; that place is below Hui'an, and the name is really hard to remember."}, {"start": 369.02, "end": 374.98, "text": "提问者还是年轻，没有和真正的40岁男人接触过，在这里异想天开。", "en": "The question asker is still young and hasn't had contact with real 40-year-old men, just daydreaming here."}, {"start": 374.98, "end": 383.06, "text": "其实40岁男找的最多的就是40岁女，哪个年龄段的男人结婚都是绝大部分找和自己上下年龄差不超过3岁的。", "en": "In fact the women 40-year-old men look for most are 40-year-old women; men of any age group, when they marry, mostly find someone whose age differs from theirs by no more than three years either way."}, {"start": 383.06, "end": 388.94, "text": "因为真正40岁还一直没结婚的男人在相亲市场非常稀少，而且就两个极端。", "en": "Because men who are truly 40 and have never married are extremely rare in the matchmaking market, and they come in just two extremes."}, {"start": 388.94, "end": 397.94, "text": "一个是特别有钱私生活混乱的，例如王思聪，一种是特别穷的，例如农村的未婚大爷，这种未婚大爷基本上一辈子都不会结婚了。", "en": "One is the filthy-rich with a chaotic private life, such as Sicong Wang; the other is the destitute, such as unmarried old bachelors in the countryside—such old bachelors basically never marry in their whole lives."}, {"start": 397.94, "end": 401.26, "text": "这两种男人基本上不会进入相亲市场。", "en": "These two types of men basically don't enter the matchmaking market."}, {"start": 401.26, "end": 422.21, "text": "40岁男人能够结婚的，进入相亲市场的，基本上不可能40岁那一刻才突然有房有车，工资一瞬间变高了，而是他们年轻的时候父母就给积攒资本，有房有车，工资尚可，他们大概率年轻的时候都结过婚，到了40岁应该是离异有娃阶段。", "en": "The 40-year-old men who are able to marry and enter the matchmaking market basically couldn't have suddenly acquired a house and car the moment they turned 40, with their salary shooting up in an instant; rather, their parents accumulated capital for them when they were young, so they had a house and car and a decent salary, and they most likely married when young—by 40 they should be in the divorced-with-kids phase."}, {"start": 422.21, "end": 428.04, "text": "这么和你说吧，40岁还有资本能够再结婚的男人，大概率他25岁就有资本能够结婚。", "en": "Let me put it this way: a man who at 40 still has the means to marry again most likely already had the means to marry at 25."}, {"start": 428.04, "end": 432.36, "text": "你说一个40岁普通收入的男人，找一个18岁的女人靠谱吗？", "en": "Tell me, is it realistic for an ordinary-income 40-year-old man to find an 18-year-old woman?"}, {"start": 432.36, "end": 435.96, "text": "自己孩子15岁，娶个18岁的后妈？", "en": "Your own child is 15, and you'd marry an 18-year-old stepmother?"}, {"start": 435.96, "end": 448.99, "text": "要是女儿还好，是儿子，说句实话，自古嫦娥爱少年，她和你儿子才是同龄人，发生爱情的概率都比和你这个老头发生爱情的概率大得多。", "en": "If it were a daughter it'd be fine, but if it's a son, to be honest, since ancient times Chang'e has loved the young; she and your son are the same age, and the chance of love sparking between them is far greater than between her and you, an old man."}, {"start": 448.99, "end": 454.51, "text": "题主大概率没和自己小6岁以上的人深入恋爱接触过吧？", "en": "The OP most likely has never been in a deep romantic relationship with someone more than six years younger, right?"}, {"start": 454.51, "end": 466.94, "text": "年龄代沟这个问题是很严重的，40岁男人还是和40岁女人聊得来，毕竟两人孩子年龄相仿共同话题也多，小6岁以上就已经两眼一摸黑了。", "en": "The generation gap in age is a very serious matter; a 40-year-old man still gets on better with a 40-year-old woman, since after all their children are of similar age and they have more in common. Once the age gap exceeds six years, it's pitch dark—you're completely in the dark."}, {"start": 466.94, "end": 469.99, "text": "至于世界上有多少男人是刘强东那样的富豪？", "en": "As for how many men
