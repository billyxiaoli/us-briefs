home turf of the left or the right, so that even if you are a centrist you can find your own concentrated section."}, {"start": 140.76, "end": 142.49, "text": "还有比这更好的新闻网站？", "en": "Is there a better news website than this?"}, {"start": 142.49, "end": 147.36, "text": "要是对比一下左右的新闻，会发现interesting 的东西真不少呢。", "en": "If you compare left and right news, you will find quite a few interesting things."}, {"start": 147.36, "end": 154.08, "text": "出版方的意识形态并不会一成不变，这个网站相当于是动态统计并标识了出版方的新闻立场。", "en": "A publisher's ideology does not stay fixed; this website effectively keeps dynamic statistics and labels publishers' news stances."}, {"start": 154.08, "end": 155.64, "text": "思考与解释。", "en": "Thinking and explaining."}, {"start": 155.64, "end": 160.27, "text": "请正确思考，而不是把解释，当成思考。", "en": "Please think correctly, rather than treating explanation as thinking."}, {"start": 160.27, "end": 162.86, "text": "解释，不是思考，是逃避思考。", "en": "Explanation is not thinking; it is escaping thinking."}, {"start": 162.86, "end": 168.86, "text": "是大脑因为懒惰，而试图找一个方法拒止思考，所以需要给自己一个解释。", "en": "It is the brain, out of laziness, trying to find a way to refuse thinking, and so needing to give itself an explanation."}, {"start": 168.86, "end": 174.26, "text": "重复一次，解释是给自己的大脑偷懒用的，其唯一作用是骗自己。", "en": "Let me repeat: explanation is for the brain to slack off; its only function is to deceive yourself."}, {"start": 174.26, "end": 177.22, "text": "当你需要解释的时候，你在互联网就来对地方了。", "en": "When you need an explanation, you have come to the right place on the internet."}, {"start": 177.22, "end": 186.14, "text": "这里一定会创造出一个你内心潜意识真正想要的信息茧房，然后由互联网大v来替你解释出你想要的一切。", "en": "Here, an information cocoon that your subconscious truly wants will definitely be created for you, and then big internet influencers will explain everything you want on your behalf."}, {"start": 186.14, "end": 188.66, "text": "最后一点点编织出你的梦境。", "en": "Finally, little by little, weaving your dream."}, {"start": 188.66, "end": 190.63, "text": "这个就是解释的魔力。", "en": "That is the magic of explanation."}, {"start": 190.63, "end": 195.19, "text": "大多数人，做的事情，是解释，而不是真正的思考。", "en": "What most people do is explain, not truly think."}, {"start": 195.19, "end": 200.52, "text": "真正的思考，是基于已有信息元素，一步一步向未知进行演绎。", "en": "True thinking is based on existing information elements, deducing step by step toward the unknown."}, {"start": 200.52, "end": 203.95, "text": "这个过程根本不知道迷宫有没有尽头，有没有出路。", "en": "In this process, you have no idea whether the maze has an end or an exit."}, {"start": 203.95, "end": 208.32, "text": "这个就是基于现实存在的元素，进行思考演绎。", "en": "This is thinking and deducing based on elements that exist in reality."}, {"start": 208.32, "end": 209.93, "text": "也是最难做的事情。", "en": "And it is the hardest thing to do."}, {"start": 209.93, "end": 213.0, "text": "大多数人所做的，是基于现状。", "en": "What most people do is start from the status quo."}, {"start": 213.0, "end": 216.6, "text": "然后对现状的原因找到一个合理化解释。", "en": "And then find a rationalising explanation for the causes of the status quo."}, {"start": 216.6, "end": 219.12, "text": "任何事情都可以合理化解释。", "en": "Anything can be rationally explained."}, {"start": 219.12, "end": 222.24, "text": "并且在三步之内就可以找到合理化解释。", "en": "And a rationalising explanation can be found within three steps."}, {"start": 222.24, "end": 226.13, "text": "比如最肤浅的合理化解释：一切都是神的力量；", "en": "For example, the most superficial rationalising explanation: everything is the power of God;"}, {"start": 226.13, "end": 229.06, "text": "进一步，打赢了的就是正义的力量；", "en": "One step further: whoever wins a war is the power of justice;"}, {"start": 229.06, "end": 232.3, "text": "进一步，ta厉害所以ta强大；", "en": "One step further: they are capable, therefore they are strong;"}, {"start": 232.3, "end": 235.42, "text": "进一步，这个国家强大，所以这个国家能创造。", "en": "One step further: this country is strong, therefore this country can create."}, {"start": 235.42, "end": 239.09, "text": "这些都是解释，跟思考任何关系都没有。", "en": "These are all explanations, and have nothing to do with thinking."}, {"start": 239.09, "end": 243.41, "text": "解释跟真正的思考，难度完全不同。", "en": "Explanation and true thinking are completely different in difficulty."}, {"start": 243.41, "end": 246.53, "text": "解释是P问题，思考是NP问题。", "en": "Explanation is a P problem; thinking is an NP problem."}, {"start": 246.53, "end": 249.89, "text": "解释，只需要符合大脑逻辑自洽就可以停止。", "en": "Explanation only needs to satisfy the brain's logical self-consistency before it can stop."}, {"start": 249.89, "end": 253.13, "text": "思考，做到大脑逻辑自洽极难。", "en": "For thinking, achieving logical self-consistency in the brain is extremely difficult."}, {"start": 253.13, "end": 255.0, "text": "并且大体上而言。", "en": "And generally speaking."}, {"start": 255.0, "end": 257.71, "text": "大脑知识网络越强，越难。", "en": "The stronger the brain's knowledge network, the harder it is."}, {"start": 257.71, "end": 266.78, "text": "解释，是一个把当下坐标点当成迷宫出口，然后回溯过去找迷宫入口的解法方式。", "en": "Explanation is a way of solving a maze by treating the current coordinate point as the maze exit, then tracing back to find the maze entrance."}, {"start": 266.78, "end": 274.3, "text": "而且可以拿着锤子的情况下，把任何一个看起来像钉子的东西，当成迷宫入口。", "en": "And with a hammer in hand, anything that looks like a nail can be treated as the maze entrance."}, {"start": 274.3, "end": 276.89, "text": "这个过程，就完成逻辑自洽闭环。", "en": "This process completes a closed loop of logical self-consistency."}, {"start": 276.89, "end": 281.98, "text": "然后进入大脑放松松懈状态：我已经完成了已知。", "en": "Then you enter a relaxed, lax state in the brain: I have completed the known."}, {"start": 281.98, "end": 283.3, "text": "比如例子：", "en": "For example:"}, {"start": 283.3, "end": 285.38, "text": "为什么国家处理教培？", "en": "Why did the state crack down on tutoring?"}, {"start": 285.38, "end": 288.07, "text": "解释：教培影响到了生育率。", "en": "Explanation: tutoring affected the fertility rate."}, {"start": 288.07, "end": 289.82, "text": "非常逻辑自洽，结束。", "en": "Perfectly logically self-consistent. End of story."}, {"start": 289.82, "end": 291.62, "text": "这个是一个典型的解释。", "en": "This is a typical explanation."}, {"start": 291.62, "end": 294.5, "text": "但是。", "en": "But."}, {"start": 294.5, "end": 295.54, "text": "这件事对吗？", "en": "Is this right?"}, {"start": 295.54, "end": 297.98, "text": "如果是对的，那你之前为什么没有预测到？", "en": "If it is right, why did you not predict it before?"}, {"start": 297.98, "end": 299.9, "text": "为什么事后如此清晰。", "en": "Why is it so clear in hindsight?"}, {"start": 299.9, "end": 302.9, "text": "因为你使用的是“解释”，而不是思考。", "en": "Because you are using 'explanation', not thinking."}, {"start": 302.9, "end": 307.1, "text": "解释，天然就吃了“后见之明”的BUFF加成。", "en": "Explanation naturally comes with the buff of 'hindsight'."}, {"start": 307.1, "end": 308.78, "text": "让你以为事情很简单。", "en": "Making you think things are very simple."}, {"start": 308.78, "end": 311.3, "text": "解释，是由果及因。", "en": "Explanation goes from effect to cause."}, {"start": 311.3, "end": 313.22, "text": "这个过程很难错。", "en": "This process is hard to get wrong."}, {"start": 313.22, "end": 316.82, "text": "但是大体上，不会得到有价值的信息。", "en": "But generally, it yields no valuable information."}, {"start": 316.82, "end": 319.3, "text": "并且会忽略大量潜在原因：", "en": "And it ignores a large number of potential causes:"}, {"start": 319.3, "end": 320.26, "text": "比如。", "en": "For example."}, {"start": 320.26, "end": 324.89, "text": "在这一层逻辑自洽的人，意识不到教培领域对学生的戕害。", "en": "People at this level of logical self-consistency do not realise the harm the tutoring sector does to students."}, {"start": 324.89, "end": 329.62, "text": "尽管非常明显，但是因为解释不是思考，所以大脑根本不会想到这一层。", "en": "Although it is very obvious, because explanation is not thinking, the brain simply never thinks of this level."}, {"start": 329.62, "end": 332.81, "text": "真正的思考，一定是有预见力的。", "en": "True thinking must have foresight."}, {"start": 332.81, "end": 339.22, "text": "而我之前确实提前预测出了七普之后国家会焦聚生育率，也预测出了教培产业会完蛋。", "en": "And I did indeed predict in advance that after the 7th census the state would focus on the fertility rate, and that the tutoring industry would be finished."}, {"start": 339.22, "end": 340.78, "text": "因为我是思考演绎。", "en": "Because I was thinking and deducing."}, {"start": 340.78, "end": 344.86, "text": "我思考的问题是，今天的学生在未来会怎么样？", "en": "The question I was thinking about was: what will today's students be like in the future?"}, {"start": 344.86, "end": 347.98, "text": "摆在我面前的要素和思考流程是：", "en": "The elements before me and the thinking process were:"}, {"start": 347.98, "end": 353.42, "text": "1.今天的学生有移动互联网进行软硬件支持，理论上限会很高。", "en": "1. Today's students have mobile internet for software and hardware support, so their theoretical ceiling will be very high."}, {"start": 353.42, "end": 359.26, "text": "2.移动互联网的娱乐场的引力太强，学生靠自制力控制不住；", "en": "2. The gravitational pull of the mobile internet entertainment arena is too strong; students cannot control it through self-discipline;"}, {"start": 359.26, "end": 368.33, "text": "3.因为控制不住，所以没有管教能力的家长被迫不得不花钱找教师辅导，以减少学生玩手机和平板的时间；", "en": "3. Because they cannot control it, parents without the ability to discipline are forced to spend money on tutors to reduce the time students spend playing on phones and tablets;"}, {"start": 368.33, "end": 373.92, "text": "4.教培产业发育做大，资本扩张，最后学生普遍进入被学习状态；", "en": "4. The tutoring industry grows big, capital expands, and eventually students generally enter a state of being made to study;"}, {"start": 373.92, "end": 385.15, "text": "5.教培一代学生在成长到叛逆期之前没有能力对抗家长和老师，进而自由时间被严重占据，忘掉休息，最终成为机械做题一代；", "en": "5. Tutoring-generation students, before reaching their rebellious phase, have no ability to resist their parents and teachers, so their free time is severely occupied, they forget rest, and ultimately become a generation of mechanical problem-solvers;"}, {"start": 385.15, "end": 390.86, "text": "6.高房价加速生育率下跌，生育率是民族的核心资产属性。", "en": "6. High housing prices accelerate the fall in fertility, and fertility is the core asset attribute of a nation."}, {"start": 390.86, "end": 395.78, "text": "同时，低生育率与教培资本野蛮生长高度共鸣。", "en": "At the same time, low fertility resonates strongly with the barbaric growth of tutoring capital."}, {"start": 395.78, "end": 399.22, "text": "最终社会承担不了压力，直到系统崩溃。", "en": "Eventually society cannot bear the pressure, until the system collapses."}, {"start": 399.22, "end": 405.26, "text": "7.教培一代学生卷入市场就业，也会导致市场其他普通就业者被迫内卷。", "en": "7. Tutoring-generation students entering the job market will also force other ordinary workers in the market into involution."}, {"start": 405.26, "end": 411.58, "text": "这个过程不可改，因为被教培长大的学生就压根儿不懂社交与休闲。", "en": "This process cannot be changed, because students raised by tutoring simply do not understand socialising and leisure."}, {"start": 411.58, "end": 415.82, "text": "——哪怕脱离开教培影响，高教育者也强关联低生育率。", "en": "— Even setting aside the tutoring influence, the highly educated are strongly associated with low fertility."}, {"start": 415.82, "end": 441.62, "text": "——于是，我在无人注意的时候大胆提前预测国家开始重点抓生育率（也为这个问题建议被该问题困住的人把视野放在无人注意的街机市场和桌游市场领域，（这里我推荐延展阅读书籍《社交天性》《村落效应》《群体性孤独》《技术垄断》《童年的消逝》《新黑暗时代》《亲密关系》等）），预测出教培会完蛋。", "en": "— So, when no one was paying attention, I boldly predicted in advance that the state would start focusing on fertility (and for those trapped by this problem, I suggested looking at the unnoticed arcade market and board-game market — here I recommend extended reading: Social, The Village Effect, Alone Together, Technopoly, The Disappearance of Childhood, The New Dark Age, Intimate Relationships, and others), and predicted that tutoring would be finished."}, {"start": 441.62, "end": 444.19, "text": "这个过程是NP的，是事先思考的。", "en": "This process is NP; it was thought through in advance."}, {"start": 444.19, "end": 447.79, "text": "并不是基于国家为什么要处理教培去逆向走迷宫。", "en": "It was not a matter of walking the maze backwards based on why the state wanted to crack down on tutoring."}, {"start": 447.79, "end": 454.22, "text": "而是正向基于现实存在的元素，进行正向推导，而被迫得到了一系列结论。", "en": "Rather, it was forward deduction based on elements that exist in reality, which forced a series of conclusions."}, {"start": 454.22, "end": 458.18, "text": "当然，得到的结论还不止这些，延伸还得到了很多很多其他结论。", "en": "Of course, the conclusions obtained were not only these; many, many other conclusions were extended from them."}, {"start": 458.18, "end": 461.74, "text": "这些结论会碎片化出现在我的其他问题中。", "en": "These conclusions appear fragmentarily in my answers to other questions."}, {"start": 461.74, "end": 464.21, "text": "然后我写了好几个相关问题的答案。", "en": "Then I wrote several answers to related questions."}, {"start": 464.21, "end": 469.01, "text": "这个过程事后看起来是P问题，但是对事前来说，完全是NP的。", "en": "This process looks like a P problem in hindsight, but beforehand it was completely NP."}, {"start": 469.01, "end": 474.24, "text": "只是因为我正确演绎了这个过程，所以，看起来像P问题。", "en": "It only looks like a P problem because I correctly deduced the process."}, {"start": 474.24, "end": 477.29, "text": "不要觉得这些问题简单。", "en": "Do not think these questions are simple."}, {"start": 477.29, "end": 484.42, "text": "只因为我想要获得答案，我在思考过程中，需要不停查阅生理学，运动，休闲相关的资料。", "en": "Just because I wanted answers, during the thinking process I had to constantly consult materials on physiology, sports and leisure."}, {"start": 484.42, "end": 502.01, "text": "这个过程我遍翻教育学资料，西方休闲史，技术文化史，亲自去线下与教培产业的老师聊天，亲自在线上接触线上教育的老师和学生，亲自付费去学习钢琴舞蹈体验并近距离观察这些学生的生活，不断验证我的想法。", "en": "In this process I searched through education materials, Western leisure history and the history of technological culture, personally went offline to chat with teachers in the tutoring industry, personally contacted online education teachers and students online, personally paid to learn piano and dance and closely observe these students' lives, constantly verifying my ideas."}, {"start": 502.01, "end": 503.57, "text": "最终我得出结论。", "en": "Finally, I reached a conclusion."}, {"start": 503.57, "end": 506.57, "text": "起码在中国，教培产业不妙。", "en": "At least in China, the tutoring industry is in trouble."}, {"start": 506.57, "end": 509.16, "text": "这个过程就是走出信息茧房的过程。", "en": "This process is the process of walking out of the information cocoon."}, {"start": 509.16, "end": 516.6, "text": "因为我是认真在思考问题，去一点点验证我的想法，最终我得到了由因到果的正确结果。", "en": "Because I was seriously thinking about problems, verifying my ideas bit by bit, and finally obtained the correct result from cause to effect."}, {"start": 516.6, "end": 518.83, "text": "这个就是我如何实现的预测。", "en": "This is how I achieved my prediction."}, {"start": 518.83, "end": 520.87, "text": "习惯解释，会活在过去。", "en": "Being accustomed to explaining means living in the past."}, {"start": 520.87, "end": 523.56, "text": "学会思考，才渴望未来。", "en": "Learning to think means longing for the future."}, {"start": 523.56, "end": 531.36, "text": "把自己的思维活动中，一定要把解释倾向区分开来。", "en": "In your thinking activities, you must distinguish the tendency to explain."}, {"start": 531.36, "end": 534.24, "text": "不要解释，不要解释，不要解释！", "en": "Do not explain, do not explain, do not explain!"}, {"start": 534.24, "end": 540.24, "text": "如果对自我管理较差，分不清自己是在思考还是在解释。", "en": "If you are poor at self-management and cannot tell whether you are thinking or explaining."}, {"start": 540.24, "end": 550.44, "text": "那你优先应该进行信源管理，留下你观察中真正在思考的ID，对于只会解释的ID，打个保留的问号。", "en": "Then you should prioritise source management: keep the IDs you observe to be truly thinking, and put a question mark on the IDs that only explain."}, {"start": 550.44, "end": 557.59, "text": "不会思考只会解释的人，永远四平八稳不会出错——除非遇到可证伪的事件才会被打脸。", "en": "People who cannot think and can only explain are always steady and never wrong — unless they encounter a falsifiable event that slaps them in the face."}, {"start": 557.59, "end": 561.12, "text": "但是历史事件有限，发现南郭先生的机会很少。", "en": "But historical events are limited, and opportunities to expose a Mr. Nanguo are rare."}, {"start": 561.12, "end": 565.99, "text": "擅长思考的人一定敢于对未来技术提出意见帮助。", "en": "People who are good at thinking will definitely dare to offer opinions on future technology to help."}, {"start": 565.99, "end": 571.27, "text": "这一条，是你辨别一个ID是否有思考能力的最佳风向标。", "en": "This is the best weather vane for telling whether an ID has thinking ability."}, {"start": 571.27, "end": 579.72, "text": "因为一个人思考路径对了，查阅的资料足够了，演绎过程反复自我验证过了，一定会尝试向未来拓展。", "en": "Because if a person's thinking path is correct, they have consulted enough materials, and their deduction process has been repeatedly self-verified, they will definitely try to extend toward the future."}, {"start": 579.72, "end": 584.95, "text": "对普通个体来说，想要脱离信息茧房，一定要学会独立思考。", "en": "For ordinary individuals, to escape the information cocoon, you must learn to think independently."}, {"start": 584.95, "end": 589.99, "text": "去学会一步步思考演绎的过程。", "en": "Learn the process of thinking and deducing step by step."}, {"start": 589.99, "end": 597.96, "text": "只有真正的思考，才会让你不受限信息干扰，为了一个个问题困惑确认，大量查阅资料。", "en": "Only true thinking will free you from information interference, leave you puzzled and seeking confirmation over one question after another, and consulting large amounts of material."}, {"start": 597.96, "end": 606.91, "text": "这个过程会自然忘掉你是谁，你只想解决困惑，你就自然而然有了多领域的应用知识，走到其他人思维以外的无人区。", "en": "This process will naturally make you forget who you are; you only want to solve the puzzle, and you will naturally gain multi-domain applied knowledge and reach uninhabited zones beyond other people's thinking."}]}];
let LINES=SECTIONS[0].lines;
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),enBox=document.getElementById('en'),audioSelect=document.getElementById('audioSelect'),secTitle=document.getElementById('secTitle');
let els=[];let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function buildLines(){box.innerHTML='';LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;const p=a.play();if(p&&p.catch)p.catch(()=>{playBtn.textContent='▶';});playBtn.textContent='⏸';};box.appendChild(d);});els=[...box.children];curIdx=-1;box.scrollTop=0;}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];enBox.textContent=LINES[i].en||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
function loadSection(idx){const s=SECTIONS[idx];a.pause();playBtn.textContent='▶';LINES=s.lines;secTitle.textContent=s.title;a.src=s.mp3;a.load();seek.value=0;cur.textContent='0:00';dur.textContent=s.dur;enBox.textContent='';buildLines();}
audioSelect.onchange=()=>{loadSection(parseInt(audioSelect.value,10));};
buildLines();
playBtn.onclick=()=>{if(a.paused){const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';const p=a.play();if(p&&p.catch){p.catch(()=>{playBtn.textContent='▶';if(st)st.textContent='音频无法播放：请刷新页面，或换 Safari/Chrome 打开（不要用微信/WhatsApp 内嵌浏览器）。';});}playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
a.onplaying=()=>{const st=document.getElementById('status');if(st)st.textContent='';};
a.onwaiting=()=>{const st=document.getElementById('status');if(st)st.textContent='正在加载音频…';};
a.onerror=()=>{playBtn.textContent='▶';const st=document.getElementById('status');if(st)st.textContent='音频加载失败：请刷新页面，或换 Safari/Chrome 打开。';};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
<script>
(function(){
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var KEY = 'lastAudio:' + location.pathname;
  function save(){ try { localStorage.setItem(KEY, sel.value); } catch (e) {} }
  sel.addEventListener('change', save);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', save);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved !== null && saved !== '' && saved !== sel.value) {
      var ok = false;
      for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === saved) { ok = true; break; } }
      if (ok) { sel.value = saved; sel.dispatchEvent(new Event('change')); }
    }
  } catch (e) {}
})();
</script>
<script>
(function(){
  var SYNC_URL = 'https://player-sync.billyxiaoli.workers.dev';
  var sel = document.getElementById('audioSelect');
  if (!sel) return;
  var HUB = location.pathname;
  var ready = false;
  function postCloud(){
    if (!ready) return;
    try {
      fetch(SYNC_URL + '/', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({hub: HUB, audio: sel.value})}).catch(function(){});
    } catch (e) {}
  }
  sel.addEventListener('change', postCloud);
  var a = document.getElementById('player');
  if (a) a.addEventListener('play', postCloud);
  try {
    var ctl = null;
    if (window.AbortController) {
      ctl = new AbortController();
      setTimeout(function(){ try { ctl.abort(); } catch (e) {} }, 4000);
    }
    var opts = {};
    if (ctl) opts.signal = ctl.signal;
    fetch(SYNC_URL + '/?hub=' + encodeURIComponent(HUB), opts).then(function(r){ return r.json(); }).then(function(d){
      if (d && d.audio) {
        var ok = false;
        for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === d.audio) { ok = true; break; } }
        if (ok && sel.value !== d.audio) { sel.value = d.audio; sel.dispatchEvent(new Event('change')); }
      }
      ready = true;
    }).catch(function(){ ready = true; });
  } catch (e) { ready = true; }
})();
</script>
<script>
(function(){
  var a = document.getElementById('player');
  var sel = document.getElementById('audioSelect');
  if (!a || !sel) return;
  a.addEventListener('ended', function(){
    var i = sel.selectedIndex;
    if (i < 0 || i + 1 >= sel.options.length) {
      var st0 = document.getElementById('status');
      if (st0) st0.textContent = '本页音频已全部播完';
      return;
    }
    sel.selectedIndex = i + 1;
    sel.dispatchEvent(new Event('change'));
    var pb = document.getElementById('playBtn');
    if (pb) pb.textContent = '⏸';
    try {
      var p = a.play();
      if (p && p.catch) p.catch(function(){
        if (pb) pb.textContent = '▶';
        var st = document.getElementById('status');
        if (st) st.textContent = '下一首已就绪，请点一下播放';
      });
    } catch (e) {
      if (pb) pb.textContent = '▶';
    }
  });
})();
</script>
