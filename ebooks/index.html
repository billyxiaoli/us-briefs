ey built themselves."}, {"start": 582.43, "end": 589.08, "text": "报刊时代，也有人只看社会新闻；电视时代，也有人只看体育频道。", "en": "In the newspaper era, some people only read social news; in the television era, some people only watched sports channels."}, {"start": 589.08, "end": 594.65, "text": "但人们并没有把这种单一化、同质化的信息消费归咎于报刊和电视。", "en": "But people did not attribute this single, homogeneous information consumption to newspapers and television."}, {"start": 594.65, "end": 607.9, "text": "真正能打破信息茧房的，并不是对一个传播技术的讨伐和绞杀，而是对受众或用户的信息素养、社会公共信息生态治理等等多方面能力的考验。", "en": "What can truly break information cocoons is not the condemnation and strangulation of a communication technology, but a test of many capabilities such as the information literacy of audiences or users, and the governance of the social public information ecology."}, {"start": 607.9, "end": 613.54, "text": "可见，面对复杂的社会问题时，人们总会想寻找一个简化易懂的说法。", "en": "It can be seen that when facing complex social problems, people always want to find a simplified, easy-to-understand statement."}, {"start": 613.54, "end": 625.18, "text": "这个替罪羊可能是另一群人，也可能是技术，而“信息茧房”就成为了信息同质化、娱乐至死、意义虚无等复杂社会症候的简化替罪羊。", "en": "This scapegoat may be another group of people, or it may be technology, and 'information cocoon' has become a simplified scapegoat for complex social symptoms such as information homogenisation, amusing ourselves to death, and meaninglessness."}, {"start": 625.18, "end": 635.42, "text": "第三，纵观媒介发展史，算法既不是第一只为负面情绪赎罪的替罪羊，也不会是最后一位替社会问题挡枪的背锅侠。", "en": "Third, looking at the history of media development, algorithms are neither the first scapegoat to atone for negative emotions, nor will they be the last to take the bullet for social problems."}, {"start": 635.42, "end": 642.94, "text": "新兴的传播技术带来的变革如果超出了人们能够驾驭的范围，就很容易成为更广泛问题归咎对象。", "en": "When changes brought by emerging communication technologies exceed the range people can handle, they easily become the object of blame for broader problems."}, {"start": 642.94, "end": 652.13, "text": "例如，柏拉图在《菲德罗篇》中猛烈批评“文字”这种当时的新技术，认为它破坏了口头交流增长智慧的方式。", "en": "For example, Plato fiercely criticised 'writing', the new technology of the time, in Phaedrus, believing it destroyed the way oral communication grows wisdom."}, {"start": 652.13, "end": 665.62, "text": "清朝末年，被喻为“顺风耳”的电报技术传入当时面对内忧外患的清朝，电报本可以用于提高军事情报的传递效率，但也遭到了很多大臣的反对。", "en": "At the end of the Qing dynasty, telegraph technology, likened to 'clairaudient ears', was introduced to the Qing dynasty facing internal troubles and external threats. Telegraphs could have been used to improve the transmission efficiency of military intelligence, but they were opposed by many ministers."}, {"start": 665.62, "end": 675.98, "text": "其中一位名叫崇厚的大臣认为，这种新技术“贻害无穷”，因为电报杆插得太深，可能破坏风水，吸走大清的地气。", "en": "One minister named Chonghou believed this new technology was 'endlessly harmful', because telegraph poles inserted too deeply might destroy feng shui and drain the Qing dynasty's earth energy."}, {"start": 675.98, "end": 680.83, "text": "21世纪初，网络游戏一度成了“网瘾”的替罪羊。", "en": "At the beginning of the 21st century, online games once became the scapegoat for 'internet addiction'."}, {"start": 680.83, "end": 686.06, "text": "当网络上的喷子太多，我们又武断地抓出社交媒体来做祸首。", "en": "When there are too many trolls online, we arbitrarily grab social media as the culprit."}, {"start": 686.06, "end": 692.98, "text": "如今，人们又捉住了算法和大数据，作为信息同质化和观点极化的替罪羊。", "en": "Today, people have caught algorithms and big data as scapegoats for information homogenisation and opinion polarisation."}, {"start": 692.98, "end": 700.42, "text": "认识到这个算法是替罪羊现象，克制地使用简化归因，对个人和社会都是有益的。", "en": "Recognising this algorithm-as-scapegoat phenomenon and restraining the use of simplified attribution is beneficial to both individuals and society."}, {"start": 700.42, "end": 711.02, "text": "对个人而言，我们应该有意识地培养自己的自控力，为自己设计更加健康的信息套餐，运用科学和积极的思维来使用算法。", "en": "For individuals, we should consciously cultivate our self-control, design healthier information packages for ourselves, and use algorithms with scientific and positive thinking."}, {"start": 711.02, "end": 718.99, "text": "例如，通过算法推荐，用户找到了独特品味的图书、小众出版商也觅得了投缘的小众读者群。", "en": "For example, through algorithm recommendations, users found books of unique taste, and niche publishers also found congenial niche reader groups."}, {"start": 718.99, "end": 742.22, "text": "对社会来说，我们保持开放包容的心态，才能在社会认知上为新技术创新作好准备，助力孵化更多的创意产品来方便我们的生活，而代际沟通困难、意义虚无、错失焦虑、意见极化等结构性的社会问题，也不能把责任简单推到用户或技术身上，还需要通过系统设计思维，推动全社会一起来改善", "en": "For society, maintaining an open and inclusive mindset is what prepares social cognition for new technological innovation, helping incubate more creative products to make our lives convenient, while structural social problems such as intergenerational communication difficulties, meaninglessness, fear of missing out, and opinion polarisation cannot simply have their responsibility pushed onto users or technology — they also need systematic design thinking to push the whole society to improve together"}]}, {"title": "怎样避免活在信息茧房之中？ Part 19（90句，7:58）", "mp3": "upload-8-part19/audio.mp3", "dur": "7:58", "lines": [{"start": 0.0, "end": 2.93, "text": "用不着长篇大论，一句话直击核心点：", "en": "No need for long speeches — one sentence hits the core point:"}, {"start": 2.93, "end": 10.25, "text": "如果你不想一辈子被人（包括但不限于媒体、组织、集体、Party）牵着鼻子走，被人当帮着数钱的煞笔…", "en": "If you don't want to spend your whole life being led by the nose by others (including but not limited to media, organisations, collectives, parties), being treated as the idiot who helps others count their money…"}, {"start": 10.25, "end": 14.93, "text": "那就———", "en": "Then ———"}, {"start": 14.93, "end": 16.73, "text": "放弃立场优先原则！", "en": "Abandon the stance-first principle!"}, {"start": 16.73, "end": 21.05, "text": "放弃立场优先不是叛变，不是违背信仰，不是舍弃立场。", "en": "Abandoning stance-first is not betrayal, not violating faith, not abandoning stance."}, {"start": 21.05, "end": 24.46, "text": "而且把寻求事实真相作为优先考量条件。", "en": "It is making the search for factual truth the priority consideration."}, {"start": 24.46, "end": 34.18, "text": "对待信息要学会先筛选平台，再多渠道求证，然后逻辑推理，最后根据你自己的认知决定选择或观望。", "en": "When dealing with information, learn to first filter platforms, then verify through multiple channels, then reason logically, and finally decide to choose or wait according to your own cognition."}, {"start": 34.18, "end": 40.54, "text": "而不是一味立场至上，而掩耳盗铃，刻舟求剑，任由智商放在地上摩擦。", "en": "Rather than blindly putting stance above all, deceiving yourself, rigidly clinging to outdated methods, and letting your IQ be rubbed on the ground."}, {"start": 40.54, "end": 44.06, "text": "如果你看到这里都比较认同，那我再说进阶模式：", "en": "If you agree with what you have read so far, let me talk about the advanced mode:"}, {"start": 44.06, "end": 46.9, "text": "不站队，做一个怀疑主义者。", "en": "Don't take sides; be a skeptic."}, {"start": 46.9, "end": 53.57, "text": "不做任何人的粉（包括但不限于媒体、组织、集体、Party），不为任何事物疯狂，理智面对一切。", "en": "Don't be anyone's fan (including but not limited to media, organisations, collectives, parties), don't go crazy for anything, and face everything rationally."}, {"start": 53.57, "end": 57.94, "text": "对所有信息保持怀疑，从利害关系里分析所有角色的动机。", "en": "Stay sceptical of all information, and analyse all roles' motives from the perspective of interests."}, {"start": 57.94, "end": 61.9, "text": "所谓信息茧房是因为有人不愿意你知道发生了什么。", "en": "The so-called information cocoon exists because someone does not want you to know what happened."}, {"start": 61.9, "end": 63.94, "text": "信息茧房太可怕了。", "en": "Information cocoons are too terrifying."}, {"start": 63.94, "end": 65.14, "text": "举几个人的例子。", "en": "Let me give a few people's examples."}, {"start": 65.14, "end": 68.06, "text": "一个是李隆基，一个是杨广，一个是李世民。", "en": "One is Li Longji, one is Yang Guang, and one is Li Shimin."}, {"start": 68.06, "end": 74.66, "text": "当一个人身居高位，低下围满了阿谀奉承之徒，那么他就很难得知真相。", "en": "When a person is in a high position, surrounded below by flatterers and sycophants, it is hard for him to learn the truth."}, {"start": 74.66, "end": 80.18, "text": "康熙微服私访不过是杜撰，被臣子们忽悠瘸了才是常态。", "en": "Kangxi's incognito private visits are merely fabrications; being fooled lame by his ministers is the norm."}, {"start": 80.18, "end": 87.74, "text": "因为真实信息无法上达，必然陷入 覆舟水是苍生泪，不到横流君不知 的极端境地。", "en": "Because real information cannot reach the top, one inevitably falls into the extreme situation of 'the water that capsizes the boat is the tears of the common people; until the flood runs wild, the ruler does not know'."}, {"start": 87.74, "end": 106.18, "text": "对好大喜功的李隆基而言，社会现实已经是 朱门酒肉臭路有冻死骨 了，当老大的还在那里睥睨四方洋洋自得唯我独尊不可一世笑谈宏图大业天下我有呢，殊不知转眼就是马嵬兵变。", "en": "For the vainglorious Li Longji, social reality was already 'behind vermilion gates, wine and meat rot, while on the road lie bones frozen to death', yet the boss was still there looking down on all sides, complacent, self-important, peerless, laughing and talking about grand plans and great causes, 'the world is mine' — little knowing that in the blink of an eye came the Mawei Mutiny."}, {"start": 106.18, "end": 110.54, "text": "他命好，要不然就是杨广的下场“好头颅谁当取之？", "en": "He was lucky; otherwise it would have been Yang Guang's fate: 'A fine head — whose hands will take it?"}, {"start": 110.54, "end": 115.34, "text": "”", "en": "”"}, {"start": 115.34, "end": 116.38, "text": "怎么办？", "en": "What to do?"}, {"start": 116.38, "end": 118.01, "text": "没有人是全知全能的。", "en": "No one is omniscient and omnipotent."}, {"start": 118.01, "end": 119.52, "text": "每个人都能力有限。", "en": "Everyone has limited ability."}, {"start": 119.52, "end": 121.2, "text": "每个人都是有局限性的。", "en": "Everyone has limitations."}, {"start": 121.2, "end": 122.11, "text": "这是常识。", "en": "This is common sense."}, {"start": 122.11, "end": 138.38, "text": "因此不要盲目相信自己总是对的，自己永远不会错，要学唐太宗，兼听则明偏信则暗，不要拒绝难堪没面子，否则真正丢人的在后面呢，而不是魏征的犯颜直谏下发现自己错了。", "en": "Therefore, don't blindly believe you are always right and will never be wrong. Learn from Emperor Taizong: listening to both sides makes one enlightened, trusting only one side makes one benighted. Don't refuse embarrassing, face-losing moments — otherwise the truly shameful thing comes later, rather than discovering you were wrong under Wei Zheng's blunt remonstrance that offended the emperor's dignity."}, {"start": 138.38, "end": 146.18, "text": "观察者网，海外网，环球网，中国网，环球时报，环球时报新媒体，参考消息。", "en": "Guancha, Haiwai Net, Huanqiu, China.org.cn, Global Times, Global Times New Media, Reference News."}, {"start": 146.18, "end": 150.43, "text": "报道的新闻，从来都是：据俄媒报道，据俄媒报道。", "en": "The news they report is always: 'according to Russian media reports, according to Russian media reports'."}, {"start": 150.43, "end": 153.67, "text": "都是虚假的篡改的消息，屁股已经歪的不行了！", "en": "It's all false, doctored news — their bias is already beyond crooked!"}, {"start": 153.67, "end": 154.75, "text": "少上网。", "en": "Go online less."}, {"start": 154.75, "end": 155.71, "text": "少上班。", "en": "Work less."}, {"start": 155.71, "end": 160.63, "text": "出国去发达国家旅游，百闻不如一见，别去免签国。", "en": "Travel to developed countries abroad; seeing is believing — don't go to visa-free countries."}, {"start": 160.63, "end": 163.8, "text": "但是几乎所有活在茧房里的人也办不下来签证。", "en": "But almost everyone living in a cocoon cannot get a visa either."}, {"start": 163.8, "end": 171.67, "text": "打开你的上帝视角，把所有的知觉系统，丢进它的视角里，让它去观察一切，并观察你自己。", "en": "Open your God's-eye view, throw all your perceptual systems into its perspective, let it observe everything, and observe yourself."}, {"start": 171.67, "end": 178.92, "text": "1.当你呱呱坠地，你便进入了一个沉浸式的游戏体验中，你的基因告诉你：饿了就哭。", "en": "1. When you are born with a cry, you enter an immersive gaming experience. Your genes tell you: cry when hungry."}, {"start": 178.92, "end": 185.57, "text": "那一刻，你因没有打开上帝视角，故而看不见自己作为一个婴儿的所有状态。", "en": "At that moment, because you have not opened the God's-eye view, you cannot see all your states as an infant."}, {"start": 185.57, "end": 194.93, "text": "2.你的父母也因没有打开上帝视角，看不见自己为人父母的状态呈现，他们只能根据基因的驱动和历史经验去照顾你。", "en": "2. Your parents, also because they have not opened the God's-eye view, cannot see their own states as parents. They can only care for you according to genetic drives and historical experience."}, {"start": 194.93, "end": 199.3, "text": "比如：你一哭，他们便知道你饿了，要给你喂奶。", "en": "For example: as soon as you cry, they know you are hungry and need to be fed milk."}, {"start": 199.3, "end": 202.37, "text": "3.你的父母并不懂得什么是真正的培育。", "en": "3. Your parents do not understand what true nurturing is."}, {"start": 202.37, "end": 209.04, "text": "他们不懂人类社会从农耕到手工，再进化到工业、电气乃至信息化时代。", "en": "They do not understand how human society evolved from farming to handicrafts, and then to industrial, electrical and even information ages."}, {"start": 209.04, "end": 218.45, "text": "他们不懂什么叫DNA、细胞，也并不懂什么叫细胞的分裂增殖，更不懂人体的器官组织结构是如何形成的。", "en": "They do not understand what DNA and cells are, nor what cell division and proliferation are, let alone how the body's organ and tissue structures are formed."}, {"start": 218.45, "end": 225.58, "text": "他们不懂力的作用，不懂天体运动，不懂什么叫原子、分子，不懂什么是化学元素周期表。", "en": "They do not understand the action of forces, do not understand celestial motion, do not understand what atoms and molecules are, and do not understand the periodic table of chemical elements."}, {"start": 225.58, "end": 241.06, "text": "他们不知道什么是恒星，不知道地球所处在太阳系，不知道太阳系之外还有银河系，不知道银河系之内拥有几千亿颗恒星，也不知道银河系之外，还有10亿多个庞大的星系。", "en": "They do not know what stars are, do not know the Earth is in the solar system, do not know that beyond the solar system there is the Milky Way, do not know that within the Milky Way there are hundreds of billions of stars, and do not know that beyond the Milky Way there are more than a billion vast galaxies."}, {"start": 241.06, "end": 254.18, "text": "他们不懂什么叫宇宙大爆炸，不懂什么叫第一推动力，不懂什么是质子、中子、电子、光子、中微子和夸克，更不懂什么叫作量子化和超弦。", "en": "They do not understand what the Big Bang is, do not understand what the first mover is, do not understand what protons, neutrons, electrons, photons, neutrinos and quarks are, let alone what quantisation and superstrings are."}, {"start": 254.18, "end": 258.46, "text": "4.故而，你的父母并不能教你如何去理解这个世界。", "en": "4. Therefore, your parents cannot teach you how to understand this world."}, {"start": 258.46, "end": 259.78, "text": "学校可以吗？", "en": "Can schools?"}, {"start": 259.78, "end": 260.81, "text": "也不能。", "en": "No, either."}, {"start": 260.81, "end": 265.61, "text": "因为学校在教给你这些知识的时候，并没有向你提出问题：", "en": "Because when schools teach you this knowledge, they do not pose the question to you:"}, {"start": 265.61, "end": 268.92, "text": "这个世界，从何而来？", "en": "Where did this world come from?"}, {"start": 268.92, "end": 272.47, "text": "你，又为何会存在于这个世界之中？", "en": "And why do you exist in this world?"}, {"start": 272.47, "end": 281.66, "text": "正是因为少问了这样的问题，所以无法引发你们的思考，更不能彻底打开你们的第三视角：上帝视角。", "en": "Precisely because such questions are rarely asked, they cannot trigger your thinking, let alone fully open your third perspective: the God's-eye view."}, {"start": 281.66, "end": 290.5, "text": "5.以至于，所有人拿着这些学校所教的知识，带着一颗聪明的脑袋，跑到社会中，用它来挣钱…", "en": "5. As a result, everyone takes the knowledge taught in schools, with a clever head, runs into society, and uses it to make money…"}, {"start": 290.5, "end": 299.69, "text": "6.当你打开了上帝视角，你才能真正的展开独立思考，看待任何问题，都能站在整个宇宙的立场上，去解读，去辨析。", "en": "6. When you open the God's-eye view, you can truly engage in independent thinking; looking at any problem, you can stand on the position of the entire universe to interpret and distinguish."}, {"start": 299.69, "end": 306.48, "text": "7.而当你学会用宇宙的那双眼睛去观察你自己乃至整个世界的时候，你将惊叹：", "en": "7. And when you learn to use the universe's eyes to observe yourself and the entire world, you will marvel:"}, {"start": 306.48, "end": 319.32, "text": "这个世界，尽然存在着；你我他，尽然也存在着；不仅存在，尽然还能思考；不仅能思考，尽然还能通过思考，去理解这个世界。", "en": "This world actually exists; you, I and he actually also exist; not only do they exist, they can actually think; not only can they think, they can actually, through thinking, understand this world."}, {"start": 319.32, "end": 321.77, "text": "8.什么是信息茧房？", "en": "8. What is an information cocoon?"}, {"start": 321.77, "end": 325.97, "text": "并非你的兴趣所涉猎的范围，才是茧房。", "en": "It is not the range covered by your interests that is the cocoon."}, {"start": 325.97, "end": 332.16, "text": "而是无法突破生死线段，触达生死之外的一切信息，皆是茧房。", "en": "Rather, whatever cannot break through the life-death line segment and reach everything beyond life and death is a cocoon."}, {"start": 332.16, "end": 342.05, "text": "9.一个生命，倘若无法突破生死观，那么这个生命的视线范围，将永远被局限于生死之内。", "en": "9. If a life cannot break through its view of life and death, then that life's field of vision will forever be confined within life and death."}, {"start": 342.05, "end": 343.49, "text": "卸载一切app。", "en": "Uninstall all apps."}, {"start": 343.49, "end": 347.86, "text": "每天看：新闻联播，人民日报，参考消息。", "en": "Watch every day: News Broadcast, People's Daily, Reference News."}, {"start": 347.86, "end": 350.45, "text": "1、可以考虑刻意留下脏信息。", "en": "1. You can consider deliberately leaving dirty information."}, {"start": 350.45, "end": 352.44, "text": "用于污染自己的用户画像。", "en": "Used to pollute your user profile."}, {"start": 352.44, "end": 357.96, "text": "脏信息的选取要选大点、热点，不能太偏门。", "en": "Dirty information should be chosen big and hot, not too obscure."}, {"start": 357.96, "end": 365.64, "text": "比如要在B站混入脏信息，可以找“京阿尼”、“学日语”、“观察者网”这些热门内容。", "en": "For example, to mix dirty information into Bilibili, you can look for hot content like 'Kyoto Animation', 'learning Japanese', 'Guancha'."}, {"start": 365.64, "end": 372.43, "text": "然后跟着相关推荐多点几次，持续几天就能让APP误以为你真的喜欢这些内容。", "en": "Then follow related recommendations and click a few more times; after a few days, the app will mistakenly think you really like this content."}, {"start": 372.43, "end": 375.12, "text": "脏信息最好能形成脏画像。", "en": "Dirty information is best formed into a dirty profile."}, {"start": 375.12, "end": 385.63, "text": "偶尔几个脏信息起到的效果比较一般，但如果这几个脏信息能组合成某个画像，起到的混淆效果就能倍增。", "en": "Occasionally a few pieces of dirty information have mediocre effect, but if these pieces of dirty information can combine into a profile, the confusion effect can multiply."}, {"start": 385.63, "end": 387.79, "text": "最好是和自己画像完全相反。", "en": "Best if it is completely opposite to your own profile."}, {"start": 387.79, "end": 391.39, "text": "女生可以用数码、游戏等混淆。", "en": "Girls can use digital products, games, etc. to confuse."}, {"start": 391.39, "end": 394.1, "text": "男生可以用女生的三大坑混淆。", "en": "Boys can use girls' three big pits to confuse."}, {"start": 394.1, "end": 397.22, "text": "年轻人可以用股票、足球等混淆。", "en": "Young people can use stocks, football, etc. to confuse."}, {"start": 397.22, "end": 402.86, "text": "2、有精神洁癖、对艺术有矜持感的，就尽量远离热门、主流的作品。", "en": "2. Those with mysophobia and a sense of restraint towards art should stay away from popular, mainstream works as much as possible."}, {"start": 402.86, "end": 405.43, "text": "同时也要小心热门的漩涡。", "en": "At the same time, beware of the vortex of popularity."}, {"start": 405.43, "end": 417.31, "text": "任何一个轻百合作品都有可能拐到轻音，然后拐到山田尚子、拐到CLANNAD等时泪，最后让京阿尼占领你的首页，比如最近的《孤独摇滚》，就有很大往轻音拐的趋势。", "en": "Any light yuri work could lead you to K-On!, then to Naoko Yamada, then to CLANNAD and other tearjerkers, and finally let Kyoto Animation occupy your homepage — for example, the recent Bocchi the Rock! shows a strong trend towards K-On!."}, {"start": 417.31, "end": 421.15, "text": "动漫远离京阿尼、新海诚、大V的新番漫评。", "en": "For anime, stay away from Kyoto Animation, Makoto Shinkai, and big-V new-season anime reviews."}, {"start": 421.15, "end": 423.0, "text": "小说远离东野圭吾。", "en": "For novels, stay away from Keigo Higashino."}, {"start": 423.0, "end": 427.44, "text": "当个矜持的婆罗门，是避免信息茧房的好办法。", "en": "Being a reserved Brahmin is a good way to avoid information cocoons."}, {"start": 427.44, "end": 431.95, "text": "3、一些与主流相悖的圈子其实可以不畏惧信息茧房。", "en": "3. Some circles that go against the mainstream actually need not fear information cocoons."}, {"start": 431.95, "end": 434.9, "text": "与主流相悖的信息不太可能会频繁推荐。", "en": "Information that goes against the mainstream is unlikely to be frequently recommended."}, {"start": 434.9, "end": 444.1, "text": "比如百合作品，现在主流价值观对女孩子之间的爱情是反对态度的，平台方一般会限流这类内容。", "en": "For example, for yuri works, mainstream values now oppose love between girls, and platforms generally restrict the traffic of such content."}, {"start": 444.1, "end": 447.29, "text": "大胆的去点这类内容也不会让你的首页被占领。", "en": "Boldly clicking such content will not let your homepage be occupied."}, {"start": 447.29, "end": 451.44, "text": "4、相似推荐算法主要是依赖“特征-标签”体系。", "en": "4. Similar recommendation algorithms mainly rely on a 'feature-tag' system."}, {"start": 451.44, "end": 460.68, "text": "在浏览信息的时候，可以下意识的自行分辨一下这个信息的标签，下次遇到可能是相同标签的作品时可以少点。", "en": "When browsing information, you can subconsciously distinguish the tags of this information yourself, and when you encounter works that may have the same tags next time, click less."}, {"start": 460.68, "end": 463.92, "text": "其实我很反感别人给我贴标签，很多时候贴的标签都不对。", "en": "Actually, I really dislike others labelling me; often the labels are wrong."}, {"start": 463.92, "end": 469.99, "text": "比如下图这首曲子是《近月少女的礼仪》里的BGM，是比较舒缓、令人安心的曲子。", "en": "For example, the piece in the picture below is the BGM from Tsuki ni Yorisou Otome no Sahou — a relatively soothing, reassuring piece."}, {"start": 469.99, "end": 473.78, "text": "然而网易云给它贴的标签是“朋克、新世纪”。", "en": "However, NetEase Cloud Music labels it as 'punk, new age'."}, {"start": 473.78, "end": 478.94, "text": "我不太懂什么是新世纪，但这首曲子绝对和朋克不沾边。", "en": "I don't quite understand what new age is, but this piece is definitely not punk."}]}, {"title": "怎样避免活在信息茧房之中？ Part 20（89句，8:39）", "mp3": "upload-8-part20/audio.mp3", "dur": "8:39", "lines": [{"start": 0.0, "end": 1.39, "text": "摘要（标签）", "en": "Summary (tags)"}, {"start": 1.39, "end": 7.03, "text": "关于信息茧房和如何打破信息茧房，获得对世界的全面理性认知。", "en": "About information cocoons and how to break out of information cocoons to obtain a comprehensive, rational understanding of the world."}, {"start": 7.03, "end": 11.83, "text": "️ 目录", "en": "Contents"}, {"start": 11.83, "end": 13.68, "text": "** 摘要（标签）**", "en": "** Summary (tags) **"}, {"start": 13.68, "end": 16.25, "text": "1.关于信息茧房你需要知道", "en": "1. What you need to know about information cocoons"}, {"start": 16.25, "end": 18.17, "text": "什么是信息茧房", "en": "What is an information cocoon"}, {"start": 18.17, "end": 23.57, "text": "**自我验证理论、和确认性偏见**指出，茧房是往往自己制造的。", "en": "** Self-verification theory and confirmation bias ** point out that cocoons are often self-made."}, {"start": 23.57, "end": 32.14, "text": "推荐算法让你很容易在网上找到一个心理上互相支持的网络，并因此变得过度自信。", "en": "Recommendation algorithms make it easy for you to find a psychologically mutually supportive network online, and therefore become overconfident."}, {"start": 32.14, "end": 36.89, "text": "2. 信息的特点", "en": "2. Characteristics of information"}, {"start": 36.89, "end": 41.64, "text": "3. 破茧而出的道：良好的习惯事半功倍", "en": "3. The way to break out of the cocoon: good habits yield twice the result with half the effort"}, {"start": 41.64, "end": 45.19, "text": "4. 破茧而出的术：获取优质信息源", "en": "4. The techniques to break out of the cocoon: obtaining high-quality information sources"}, {"start": 45.19, "end": 46.63, "text": "线下圈子", "en": "Offline circles"}, {"start": 46.63, "end": 49.34, "text": "专业人士的付费原创信息", "en": "Paid original information from professionals"}, {"start": 49.34, "end": 50.59, "text": "付费社群", "en": "Paid communities"}, {"start": 50.59, "end": 53.4, "text": "互联网论坛/博客/开源社区", "en": "Internet forums/blogs/open-source communities"}, {"start": 53.4, "end": 54.53, "text": "优质博客", "en": "High-quality blogs"}, {"start": 54.53, "end": 62.4, "text": "5.AI工具——==普通人的能力倍增器==", "en": "5. AI tools — == a capability multiplier for ordinary people =="}, {"start": 62.4, "end": 64.97, "text": "1.关于信息茧房你需要知道", "en": "1. What you need to know about information cocoons"}, {"start": 64.97, "end": 66.89, "text": "什么是信息茧房", "en": "What is an information cocoon"}, {"start": 66.89, "end": 82.54, "text": "又称回声室效应,指在新闻和社交媒体上,拥 有相近想法的群体借由不断沟通与认同彼此想法，使得那 些相似的想法不断被放大与加强，进而忽略甚至不相信世 界的多样性。", "en": "Also known as the echo chamber effect, it refers to groups with similar ideas on news and social media continuously communicating and affirming each other's ideas, so that those similar ideas are constantly amplified and strengthened, thereby ignoring or even disbelieving the diversity of the world."}, {"start": 82.54, "end": 84.82, "text": "一叶障目，不见泰山。", "en": "A single leaf blinds the eye, hiding Mount Tai."}, {"start": 84.82, "end": 90.22, "text": "自我验证理论、和确认性偏见指出，茧房是往往自己制造的。", "en": "Self-verification theory and confirmation bias point out that cocoons are often self-made."}, {"start": 90.22, "end": 93.94, "text": "（“兼听则明，偏信则暗”并不容易做到）", "en": "(Listening to both sides makes one enlightened, trusting only one side makes one benighted — is not easy to achieve.)"}, {"start": 93.94, "end": 102.5, "text": "推荐算法让你很容易在网上找到一个心理上互相支持的网络，并因此变得过度自信。", "en": "Recommendation algorithms make it easy for you to find a psychologically mutually supportive network online, and therefore become overconfident."}, {"start": 102.5, "end": 107.26, "text": "2. 信息的特点", "en": "2. Characteristics of information"}, {"start": 107.26, "end": 112.49, "text": "信息的本质是对不确定性的度量，信息的价值是消除不确定性。", "en": "The essence of information is a measure of uncertainty; the value of information is eliminating uncertainty."}, {"start": 112.49, "end": 116.5, "text": "通过关注信息增量，而不是存量，可以极大提高效率。", "en": "By focusing on information increments rather than stock, efficiency can be greatly improved."}, {"start": 116.5, "end": 119.5, "text": "或 者说“不同点”包含更大的信息量。", "en": "Or rather, 'differences' contain greater amounts of information."}, {"start": 119.5, "end": 130.13, "text": "一流的智慧存在于顶级大佬的脑袋里，二流的思想交流于 普通大佬们的小圈子里，三流的技术“老师”愿意收费/免费卖给你。", "en": "First-rate wisdom exists in the heads of top big shots; second-rate ideas circulate in the small circles of ordinary big shots; third-rate technical 'teachers' are willing to sell to you, paid or free."}, {"start": 130.13, "end": 134.28, "text": "门槛的高度与信息的优质程度往往成正比。", "en": "The height of the threshold is often directly proportional to the quality of the information."}, {"start": 134.28, "end": 140.35, "text": "在信息传输过程中，由于噪声和其他干扰，熵增是确定发生的。", "en": "During information transmission, due to noise and other interference, entropy increase definitely occurs."}, {"start": 140.35, "end": 147.31, "text": "如果对信息不做选择,随波逐流或者平均地分配注意力，系统会变得越来越无序。", "en": "If you do not select information, drift with the tide, or distribute attention evenly, the system will become increasingly disordered."}, {"start": 147.31, "end": 152.06, "text": "3. 破茧而出的道：良好的习惯事半功倍", "en": "3. The way to break out of the cocoon: good habits yield twice the result with half the effort"}, {"start": 152.06, "end": 159.07, "text": "比做什么更重要的不做什么，离开高噪声源：以传播情绪为主的短视频平台", "en": "More important than what to do is what not to do: leave high-noise sources — short video platforms mainly spreading emotions."}, {"start": 159.07, "end": 161.04, "text": "批判性思维看待问题", "en": "View problems with critical thinking."}, {"start": 161.04, "end": 163.92, "text": "优质输出倒逼优质输入", "en": "High-quality output forces high-quality input."}, {"start": 163.92, "end": 167.64, "text": "付费的本质是买时间，有时很划算", "en": "The essence of paying is buying time; sometimes it is very cost-effective."}, {"start": 167.64, "end": 171.67, "text": "绝技：从被动输入到主动搜寻信息很重要", "en": "Secret skill: moving from passive input to actively searching for information is important."}, {"start": 171.67, "end": 175.22, "text": "4. 破茧而出的术：获取优质信息源", "en": "4. The techniques to break out of the cocoon: obtaining high-quality information sources"}, {"start": 175.22, "end": 176.66, "text": "线下圈子", "en": "Offline circles"}, {"start": 176.66, "end": 179.5, "text": "有些大佬乐于分享，但只是阶段性的。", "en": "Some big shots enjoy sharing, but only at certain stages."}, {"start": 179.5, "end": 181.78, "text": "你最好有可以交换的资源。", "en": "You had better have resources to exchange."}, {"start": 181.78, "end": 186.62, "text": "有些大佬不会主动分享，机缘巧合也可能教你几招。", "en": "Some big shots will not share proactively, but by chance may teach you a few tricks."}, {"start": 186.62, "end": 188.62, "text": "你要主动降低姿态。", "en": "You must proactively lower your posture."}, {"start": 188.62, "end": 191.33, "text": "专业人士的付费原创信息", "en": "Paid original information from professionals"}, {"start": 191.33, "end": 195.82, "text": "付费课程(如果不看重时效性，也可以免费获得)", "en": "Paid courses (if timeliness is not important, they can also be obtained for free)"}, {"start": 195.82, "end": 199.18, "text": "付费咨询（提出一个好问题是很牛的能力）", "en": "Paid consultation (asking a good question is a great ability)"}, {"start": 199.18, "end": 200.42, "text": "付费社群", "en": "Paid communities"}, {"start": 200.42, "end": 202.78, "text": "知识星球、小宇宙等", "en": "Zhishi Xingqiu, Xiaoyuzhou, etc."}, {"start": 202.78, "end": 205.58, "text": "互联网论坛/博客/开源社区", "en": "Internet forums/blogs/open-source communities"}, {"start": 205.58, "end": 210.02, "text": "俗称白嫖，性价比很高", "en": "Commonly known as freeloading, very cost-effective."}, {"start": 210.02, "end": 211.99, "text": "Way to AIGC", "en": "Way to AIGC"}, {"start": 211.99, "end": 216.43, "text": "CSDN/吾爱破解/飞书", "en": "CSDN / 52pojie / Feishu"}, {"start": 216.43, "end": 217.68, "text": "贴吧/知乎（沙里淘金）", "en": "Tieba / Zhihu (panning for gold in sand)"}, {"start": 217.68, "end": 218.81, "text": "优质博客", "en": "High-quality blogs"}, {"start": 218.81, "end": 221.86, "text": "土木坛子：加密货币、金融、互联网等", "en": "Tumu Tanzi: cryptocurrency, finance, internet, etc."}, {"start": 221.86, "end": 226.3, "text": "阮一峰的网络日志：IT技术&经济学，包罗万象", "en": "Ruan Yifeng's Weblog: IT technology & economics, covering everything."}, {"start": 226.3, "end": 229.18, "text": "万维钢得到APP：理性思维看世界", "en": "Wan Weigang on the Dedao app: viewing the world with rational thinking."}, {"start": 229.18, "end": 233.14, "text": "和菜头槽边往事：互联网行观察&吃货", "en": "He Caitou's Cao Bian Wang Shi: internet industry observations & food."}, {"start": 233.14, "end": 237.53, "text": "最好金龟换酒（傅真）：旅行、自然", "en": "Best to Exchange a Golden Tortoise for Wine (Fu Zhen): travel, nature."}, {"start": 237.53, "end": 241.49, "text": "核桃壳（王佩）：戏剧与人生", "en": "Walnut Shell (Wang Pei): drama and life."}, {"start": 241.49, "end": 249.36, "text": "5.AI工具——==普通人的能力倍增器==", "en": "5. AI tools — == a capability multiplier for ordinary people =="}, {"start": 249.36, "end": 254.88, "text": "先挖个坑，有关AI工具的使用，后续会写文章分享", "en": "Digging a hole first: regarding the use of AI tools, I will write articles to share later."}, {"start": 254.88, "end": 259.44, "text": "少看油管、谷歌，假信息太多，西方管控太严。", "en": "Watch less YouTube and Google — too much false information, Western control too strict."}, {"start": 259.44, "end": 261.31, "text": "学会真正的独立思考。", "en": "Learn true independent thinking."}, {"start": 261.31, "end": 269.16, "text": "最近一直陷入一个怪圈，沉浸在自己的信息茧房里，看了一些关于信息茧房的推文，感觉很在理，摘抄分享给大家", "en": "Recently I have been stuck in a strange loop, immersed in my own information cocoon. I read some tweets about information cocoons, felt they made sense, and excerpted them to share with everyone."}, {"start": 269.16, "end": 298.63, "text": "现在互联网已成为人们获取信息的主要渠道，搜索引擎的智能化、社交媒体的普及以及个性化推荐算法的广泛应用，在为人们带来便捷的同时，也在不知不觉中促成了信息茧房的形成。", "en": "Now the internet has become the main channel for people to obtain information. The intelligentisation of search engines, the popularisation of social media, and the wide application of personalised recommendation algorithms have brought convenience to people, while also unconsciously promoting the formation of information cocoons."}, {"start": 298.63, "end": 300.98, "text": "首先，大家要知道信息茧房是什么。", "en": "First, everyone should know what an information cocoon is."}, {"start": 300.98, "end": 310.06, "text": "信息茧房指人们的信息领域会习惯性地被自己的兴趣所引导，从而将自己的生活桎梏于像蚕茧一般的“茧房”中的现象。", "en": "An information cocoon refers to the phenomenon where people's information fields are habitually guided by their own interests, thereby confining their lives in a 'cocoon' like a silkworm's."}, {"start": 310.06, "end": 319.01, "text": "一方面，个性化推荐算法根据用户的浏览历史、搜索记录和社交关系等数据，为用户精准推送他们可能感兴趣的内容。", "en": "On the one hand, personalised recommendation algorithms precisely push content users may be interested in based on data such as users' browsing history, search records and social relationships."}, {"start": 319.01, "end": 326.98, "text": "另一方面，在社交媒体平台上，人们往往倾向于关注与自己观点一致的人，加入与自己兴趣相符的群组。", "en": "On the other hand, on social media platforms, people tend to follow people with views consistent with their own, and join groups matching their interests."}, {"start": 326.98, "end": 329.93, "text": "其次，你要知道信息茧房的害处。", "en": "Second, you should know the harms of information cocoons."}, {"start": 329.93, "end": 350.09, "text": "它限制了人们的认知视野、使得思维变得狭窄，影响对事物的准确判断；不利于创新思维的培养，更可能对社会和谐稳定造成威胁，当不同群体之间的信息交流和理解越来越少，彼此间的隔阂和误解就会加深，加剧社会的分裂和对立。", "en": "They limit people's cognitive horizons, narrow thinking, and affect accurate judgment of things; they are not conducive to cultivating innovative thinking, and may even threaten social harmony and stability. When information exchange and understanding between different groups become less and less, the barriers and misunderstandings between them deepen, aggravating social division and opposition."}, {"start": 350.09, "end": 362.62, "text": "很赞同后者微信推文的观点，现在社会的最大问题是“傻X共振”现象太严重，平台“算法”的产生又加剧了这个现象，你越喜欢什么就越给你推荐什么。", "en": "I very much agree with the latter WeChat article's view: the biggest problem in society now is the 'idiot resonance' phenomenon being too serious, and the emergence of platform 'algorithms' has aggravated this phenomenon — the more you like something, the more it recommends it to you."}, {"start": 362.62, "end": 374.18, "text": "它让每个人都沉溺在自己的世界里，每个人只能看到自己喜欢看、愿意看的东西，于是人们视野变的越来越狭窄、观点变的越来越偏激。", "en": "It makes everyone indulge in their own world, where everyone can only see what they like and are willing to see, so people's horizons become narrower and narrower, and their views more and more extreme."}, {"start": 374.18, "end": 394.78, "text": "也就是说，如果你只关注自己愉悦的东西，久而久之便会像蚕一样，将自己桎梏于自我编织的茧房之中，从而丧失看清真相的能力。", "en": "That is to say, if you only focus on things that please you, over time you will be like a silkworm, confining yourself in a cocoon woven by yourself, thereby losing the ability to see the truth clearly."}, {"start": 394.78, "end": 402.41, "text": "最后，告诫大家，世界很大、多出去走走，不要沉浸在自己的网络世界中，“作茧自缚”！", "en": "Finally, a word of advice to everyone: the world is big — go out and walk around more, don't immerse yourself in your own online world, 'weaving a cocoon to trap yourself'!"}, {"start": 402.41, "end": 408.94, "text": "参考1：浙江宣传微信号：打破信息茧房：在数字时代拓展认知边界", "en": "Reference 1: Zhejiang Publicity WeChat account: Breaking Information Cocoons: Expanding Cognitive Boundaries in the Digital Age"}, {"start": 408.94, "end": 415.46, "text": "参考2：互联网思维微信号：现在社会最可怕的现象：傻 X 共振", "en": "Reference 2: Internet Thinking WeChat account: The most frightening phenomenon in society now: idiot resonance"}, {"start": 415.46, "end": 419.47, "text": "信息茧房的本质，是共鸣（或共情）成瘾。", "en": "The essence of an information cocoon is resonance (or empathy) addiction."}, {"start": 419.47, "end": 424.32, "text": "避免活在信息茧房中的唯一路径，就是戒除这种成瘾。", "en": "The only path to avoid living in an information cocoon is to quit this addiction."}, {"start": 424.32, "end": 427.03, "text": "这里有一些相对简单的训练方法：", "en": "Here are some relatively simple training methods:"}, {"start": 427.03, "end": 459.72, "text": "1、学会解析信息及其包含的逻辑的底层，通过对信息的极简化处理，去掉形容词和各种诱发情绪的褒义词，把底层逻辑暴露出来，从而在规避共鸣（或共情）的情况下，进行真伪和程度性的检查。", "en": "1. Learn to parse information and the underlying logic it contains; through extreme simplification of information, removing adjectives and various emotion-inducing laudatory words, expose the underlying logic, so that under the avoidance of resonance (or empathy), truth and degree checks can be carried out."}, {"start": 459.72, "end": 481.32, "text": "2、使用合订本模式，有意识的跟踪曾经对自己产生巨大共鸣，或巨大情绪刺激的信息，在热点消退和自己的情绪消退后，进行分析、复盘，寻找当时自己的共鸣点产生的原因和带来的认知偏差，以及思考如何在未来规避这种偏差。", "en": "2. Use the bound-volume model: consciously track information that once produced huge resonance in you, or huge emotional stimulation, and after the hotspot fades and your emotions fade, analyse and review it, looking for the causes of your resonance at the time and the cognitive biases it brought, and thinking about how to avoid such biases in the future."}, {"start": 481.32, "end": 488.59, "text": "3、有意识的寻找认可的信息或观点的对立面，并分析其合理性的程度。", "en": "3. Consciously seek the opposite of recognised information or views, and analyse the degree of its rationality."}, {"start": 488.59, "end": 495.62, "text": "4、反向代入，即不仅仅代入条件反射的立场和角色，也代入与之对立的角色。", "en": "4. Reverse role-play: not only role-play the reflexively conditioned stance and role, but also the opposing role."}, {"start": 495.62, "end": 503.54, "text": "5、极化推断，即将信息及其逻辑，向极端化方向推演，看是否出现明显谬误。", "en": "5. Polarised inference: push information and its logic towards extremes, and see if obvious fallacies appear."}, {"start": 503.54, "end": 509.02, "text": "如果有明显谬误，再反推当前信息及其逻辑的适用范围或真伪。", "en": "If obvious fallacies appear, then infer back the applicable scope or truth of the current information and its logic."}, {"start": 509.02, "end": 519.38, "text": "6、非从众意识，寻找与你一样共鸣的人的共同特点和特征，并且推断，如果去掉这些特征，该信息是否还会被认可。", "en": "6. Non-conformist awareness: find the common characteristics and features of people who resonate like you, and infer whether the information would still be recognised if these features were removed."}]}, {"title": "怎样避免活在信息茧房之中？ Part 21（62句，6:16）", "mp3": "upload-8-part21/audio.mp3", "dur": "6:16", "lines": [{"start": 0.0, "end": 4.68, "text": "用搜索引擎查找需要的信息，不要关注热榜和推荐内容就行。", "en": "Use search engines to find the information you need; just don't follow hot lists and recommended content."}, {"start": 4.68, "end": 7.49, "text": "真正的茧房不是算法建的，是你自己盖的。", "en": "The real cocoon is not built by algorithms; you build it yourself."}, {"start": 7.49, "end": 9.1, "text": "平台只是顺着你走。", "en": "Platforms just follow your lead."}, {"start": 9.1, "end": 17.09, "text": "刷到不同意见，手指比脑子快，一划就过去了；刷到顺耳的，多看两眼还顺手点个赞。", "en": "When you scroll to a dissenting opinion, your fingers are faster than your brain — one swipe and it's gone; when you scroll to something pleasing to the ear, you look a couple more times and casually give it a like."}, {"start": 17.09, "end": 20.09, "text": "久而久之，喂到你面前的当然全是一个调子。", "en": "Over time, what is fed to you is naturally all one tune."}, {"start": 20.09, "end": 24.94, "text": "想出去，别急着卸载app，先改掉这个条件反射。", "en": "If you want to get out, don't rush to uninstall apps — first change this conditioned reflex."}, {"start": 24.94, "end": 35.66, "text": "刻意挑几个让你别扭的说法看完整，找出它最有道理的那句，再问自己一句：万一是我错了呢？", "en": "Deliberately pick a few statements that make you uncomfortable and read them through, find the most reasonable sentence in them, and then ask yourself: what if I'm wrong?"}, {"start": 35.66, "end": 39.46, "text": "茧房不怕你信息少，怕的是你压根没打算出来。", "en": "The cocoon is not afraid that you have little information; it fears that you have no intention of coming out at all."}, {"start": 39.46, "end": 41.9, "text": "为什么你讨厌信息茧房？", "en": "Why do you hate information cocoons?"}, {"start": 41.9, "end": 44.83, "text": "信息茧房很多时候是帮你过滤掉了毒素。", "en": "Information cocoons often help you filter out toxins."}, {"start": 44.83, "end": 52.08, "text": "我经常看国内的人民日报、新华社，也看cnn这种左翼主流媒体，还看fox这种明显偏向川普的。", "en": "I often read domestic People's Daily and Xinhua, as well as left-leaning mainstream media like CNN, and Fox, which is clearly biased towards Trump."}, {"start": 52.08, "end": 58.25, "text": "我很清楚做得最好的是人民日报和新华社，他们避免了老百姓接触到很多不良信息。", "en": "I am well aware that the best performers are People's Daily and Xinhua — they prevent ordinary people from coming into contact with a lot of bad information."}, {"start": 58.25, "end": 70.73, "text": "我们国家对一些书籍的删改也很不错，难道你想让《the dictator’s handbook》、奥威尔和福山的那些书，未经删改直接原文出版，来毒害我们善良的老百姓？", "en": "Our country's deletion and editing of some books is also quite good. Do you want books like The Dictator's Handbook, Orwell's and Fukuyama's books, to be published directly in their original text without deletions, to poison our kind ordinary people?"}, {"start": 70.73, "end": 77.14, "text": "多刷知乎，我发现任何主流声音，知乎都有反对的，知乎帮助你辩证看待", "en": "Scrolling Zhihu more, I find that for any mainstream voice, Zhihu has opposition — Zhihu helps you view things dialectically."}, {"start": 77.14, "end": 80.09, "text": "信息茧房问题，实际上是一个人的三观问题", "en": "The information cocoon problem is actually a person's values problem."}, {"start": 80.09, "end": 83.86, "text": "你意识到信息茧房存在的时候，基本上就走出了信息茧房。", "en": "When you realise the information cocoon exists, you have basically walked out of the information cocoon."}, {"start": 83.86, "end": 87.89, "text": "哪怕你不打算跳槽，手机里也永远留一个BOSS直聘。", "en": "Even if you don't plan to switch jobs, always keep a Boss Zhipin app on your phone."}, {"start": 87.89, "end": 94.18, "text": "没事刷下所在的行业、上下游行业，以及那些所谓风口行业的真实JD和底薪。", "en": "When you have nothing to do, scroll through the real JDs and base salaries of your industry, upstream and downstream industries, and those so-called booming industries."}, {"start": 94.18, "end": 101.54, "text": "七点新闻里天天喊产业升级和红利，那tm是吹给韭菜看的；挂出来的薪水，才是真实定价。", "en": "The industrial upgrading and dividends shouted about in the 7 o'clock news — that's damn hype for the leeks to watch; the salaries posted are the real pricing."}, {"start": 101.54, "end": 105.62, "text": "睡前别老刷微博热搜，就看“文书网”随便盲抽5份判决书。", "en": "Before bed, don't keep scrolling Weibo hot searches — just look at 'Wenshu Net' and randomly draw 5 judgment documents."}, {"start": 105.62, "end": 111.7, "text": "你就主要看民间借贷纠纷、离婚财产分割、基层劳务索赔。", "en": "You mainly look at private lending disputes, divorce property division, and grassroots labour claims."}, {"start": 111.7, "end": 117.17, "text": "热搜是公关和情绪，而判决书那就是人性、算计和底层互害。", "en": "Hot searches are PR and emotions, while judgment documents are human nature, calculation, and bottom-level mutual harm."}, {"start": 117.17, "end": 121.37, "text": "看上三个月，绝对对真实社会的认知上升一个层次。", "en": "After reading for three months, your understanding of real society will definitely rise a level."}, {"start": 121.37, "end": 131.88, "text": "买包华子，去跟你小区楼下开了五六年的小卖部、沙县小吃或者五金店老板聊半个小时，这事我以前跑步时候最爱干。", "en": "Buy a pack of Zhonghua, and go chat for half an hour with the owner of the small shop, Shaxian snacks stall, or hardware store downstairs in your neighbourhood that's been open for five or six years — this is what I loved doing most when I used to run."}, {"start": 131.88, "end": 139.75, "text": "问问房租涨跌、水电费、进货价波动啥的，，听小老板骂两句娘，比看十份投行研报都管用。", "en": "Ask about rent rises and falls, water and electricity bills, purchase price fluctuations, and listen to the small boss curse a couple of times — more useful than reading ten investment bank research reports."}, {"start": 139.75, "end": 158.54, "text": "戒掉所有自媒体的政策解读，直接去翻你们市/区政府网站的“年度财政预算执行报告”和“公共资源交易招标网”。", "en": "Quit all self-media policy interpretations, and directly flip through your city/district government website's 'Annual Fiscal Budget Execution Report' and 'Public Resources Trading and Bidding Website'."}, {"start": 158.54, "end": 169.22, "text": "你就顺着表格往下看，看看今年的真金白银到底砸给了哪个新区的基建、转移给了哪家城投公司、砍掉了哪块的民生支出。", "en": "Just follow the tables down, and see where this year's real money was actually spent — which new district's infrastructure, which city investment company it was transferred to, which livelihood expenditure was cut."}, {"start": 169.22, "end": 175.39, "text": "钱的流向是最诚实的，看懂了政府的账本，起码了解你们城市运转一般逻辑。", "en": "The flow of money is the most honest. Once you understand your city's account books, you at least understand the general logic of how your city operates."}, {"start": 175.39, "end": 182.83, "text": "挑三个你极度讨厌、价值观完全相左，但确实在社会上赚到了大钱的人。", "en": "Pick three people you extremely dislike, whose values are completely opposite to yours, but who have indeed made big money in society."}, {"start": 182.83, "end": 186.72, "text": "强迫自己捏着鼻子，去把他们的发家史和访谈看完。", "en": "Force yourself to hold your nose and read through their rise-to-riches stories and interviews."}, {"start": 186.72, "end": 194.09, "text": "放下你的道德洁癖，去拆解这帮傻逼到底切中了哪些人的痛点，完成了怎样的商业闭环。", "en": "Put aside your moral cleanliness, and dissect how these dumbasses hit the pain points of which people, and completed what kind of commercial closed loop."}, {"start": 194.09, "end": 196.9, "text": "理解并解剖你不认同的运行规则，", "en": "Understand and dissect operating rules you do not agree with,"}, {"start": 196.9, "end": 198.89, "text": "有人喜欢的话，我再写点。", "en": "If people like it, I'll write more."}, {"start": 198.89, "end": 205.25, "text": "有的是我自己个人习惯，有的是我听几个大佬在闲聊时候听到的，分享给爱看干货朋友。", "en": "Some are my own personal habits, some I heard from a few big shots chatting idly — sharing with friends who love practical content."}, {"start": 205.25, "end": 209.5, "text": "不要被自媒体被动的推荐，自己主动的选择！", "en": "Don't be passively recommended by self-media; actively choose yourself!"}, {"start": 209.5, "end": 210.89, "text": "推荐几个网站：", "en": "Recommend a few websites:"}, {"start": 210.89, "end": 212.45, "text": "1. 中国新闻网", "en": "1. China News Service"}, {"start": 212.45, "end": 214.18, "text": "别以为只有公务员看！", "en": "Don't think only civil servants read it!"}, {"start": 214.18, "end": 216.62, "text": "这里是最权威的政策风向标。", "en": "This is the most authoritative policy weathervane."}, {"start": 216.62, "end": 218.5, "text": "2. [城市名]+发布", "en": "2. [City name] + Fabu"}, {"start": 218.5, "end": 220.85, "text": "直通本地官方情报站！", "en": "Direct access to the local official intelligence station!"}, {"start": 220.85, "end": 227.21, "text": "拆迁、学区、落户新政第一时间知晓。", "en": "Demolition, school districts, and new settlement policies known at the first opportunity."}, {"start": 227.21, "end": 229.2, "text": "3. [城市名]+本地宝", "en": "3. [City name] + Bendibao"}, {"start": 229.2, "end": 236.52, "text": "领补贴、查社保、找攻略，一键Get全城实用信息，省钱又省心。", "en": "Get subsidies, check social security, find guides — one click gets all the city's practical information, saving money and worry."}, {"start": 236.52, "end": 238.99, "text": "4. 今日热榜", "en": "4. Today's Hot List"}, {"start": 238.99, "end": 241.44, "text": "全网热搜聚合器！", "en": "Aggregator of hot searches across the internet!"}, {"start": 241.44, "end": 245.21, "text": "微博、抖音、知乎等全网各大媒体的热点一目了然。", "en": "Hot topics from Weibo, Douyin, Zhihu and other major media across the internet at a glance."}, {"start": 245.21, "end": 246.89, "text": "5. 雪球", "en": "5. Xueqiu"}, {"start": 246.89, "end": 248.5, "text": "投资人的实战场！", "en": "The actual battlefield for investors!"}, {"start": 248.5, "end": 250.97, "text": "看大牛逻辑、读财报解读。", "en": "Read big shots' logic, read financial report interpretations."}, {"start": 250.97, "end": 255.89, "text": "最后，终极搞钱三件套：36氪+虎嗅+钛媒体", "en": "Finally, the ultimate money-making trio: 36Kr + Huxiu + TMTpost."}, {"start": 255.89, "end": 259.42, "text": "早看36氪：盯融资快讯，抓下一个风口；", "en": "Read 36Kr in the morning: watch financing news, catch the next trend;"}, {"start": 259.42, "end": 264.02, "text": "午刷虎嗅：扒商业潜规则，看透巨头博弈；", "en": "Scroll Huxiu at noon: expose unspoken business rules, see through giant rivalries;"}, {"start": 264.02, "end": 268.06, "text": "晚啃钛媒体：死磕技术趋势，预判未来赛道。", "en": "Study TMTpost in the evening: focus on technology trends, predict future tracks."}, {"start": 268.06, "end": 276.86, "text": "从逻辑上说，这个世界上只有美国配谈信息茧房，中国根本不可能实现国家范围的信息茧房，很多人连这个基础问题都理解不了。", "en": "Logically speaking, in this world only America is qualified to talk about information cocoons; China simply cannot achieve a nationwide information cocoon. Many people cannot even understand this basic issue."}, {"start": 276.86, "end": 295.66, "text": "总有人说“简中互联网信息茧房balabala”，动动脑子，以中国的宣传能力，即便想塑造信息茧房都没那个能力，因为中国人根本不可能看不见来自美国的宣传内容，简中互联网至少有中美两个信息源，你见过漏了两个大洞的茧？", "en": "There are always people saying 'simplified Chinese internet information cocoon blah blah blah' — use your brain: with China's propaganda capability, even if it wanted to shape an information cocoon, it doesn't have that ability, because Chinese people simply cannot fail to see propaganda content from America. The simplified Chinese internet has at least two information sources, Chinese and American — have you ever seen a cocoon with two big holes in it?"}, {"start": 295.66, "end": 316.82, "text": "不仅中国，俄罗斯乃至西欧国家、日本都不配建立信息茧房，因为他们连中国都不如，中国好歹有道墙能打压美国声音的音量，这几个难兄难弟直接被美国社交媒体喇叭堵门，还有没有本土舆论还要打个问号，别说建立信息茧房，不跟美国人住在同一个茧房里就谢天谢地了。", "en": "Not only China — Russia, Western European countries, and Japan are not even qualified to build information cocoons, because they are worse off than China. China at least has a wall that can dampen the volume of American voices; these fellow sufferers have American social media loudspeakers directly blocking their doors — whether they even have local public opinion is questionable, let alone building information cocoons. Not living in the same cocoon as Americans would be something to thank heavens for."}, {"start": 316.82, "end": 331.15, "text": "拥有垄断信息源能力的人在制造信息茧房，而不是反过来由用户自己给自己制造茧房，互联网时代网民并没有筛选信息的能力和资格，我们看到的是别人想让我们看的。", "en": "Those with the ability to monopolise information sources are the ones creating information cocoons, not the other way around with users creating cocoons for themselves. In the internet era, netizens do not have the ability or qualification to filter information; what we see is what others want us to see."}, {"start": 331.15, "end": 348.55, "text": "这个世界上有且仅有一个地方能够实现完全遮蔽来自外界的声音，那就是美国，更准确的说是美国西海岸，他们的能力强大到连本国铁锈带的声音都被屏蔽了，部分美国民主党支持者完全活在别人修筑的茧房里。", "en": "There is one and only one place in this world that can achieve complete shielding from outside voices, and that is America — more precisely, America's West Coast. Their capability is so strong that even the voices of their own Rust Belt are blocked. Some American Democratic Party supporters live entirely in cocoons built by others."}, {"start": 348.55, "end": 353.88, "text": "而在中国这个整天吵成一团的网络环境里，谁能真的掉进茧房？", "en": "And in China's online environment, which is noisy all day long, who can really fall into a cocoon?"}, {"start": 353.88, "end": 367.56, "text": "互相冲突的信息到处都是，会造成偏执的是你自己内心傲慢，选择性无视了其他信息，这种人不是茧房里的虫子，而是把脑袋埋起来的鸵鸟，井底之蛙尚且有看到天空的机会，鸵鸟没有。", "en": "Conflicting information is everywhere. What causes paranoia is your own inner arrogance, selectively ignoring other information. Such people are not insects in a cocoon, but ostriches burying their heads. Even a frog at the bottom of a well has a chance to see the sky; ostriches do not."}, {"start": 367.56, "end": 376.73, "text": "想要避免也容易，如果看见某个新闻、某个回答惹你不高兴，只要还有实际内容，至少先看完再说，兼听则明。", "en": "Avoiding it is also easy: if you see a piece of news or an answer that makes you unhappy, as long as it still has actual content, at least finish reading it first — listening to both sides makes one enlightened."}]}, {"title": "怎样避免活在信息茧房之中？ Part 22（66句，6:52）", "mp3": "upload-8-part22/audio.mp3", "dur": "6:52", "lines": [{"start": 0.0, "end": 2.47, "text": "上策：肉身出去", "en": "Best strategy: physically go abroad."}, {"start": 2.47, "end": 5.66, "text": "中策：梯子只看英文报道", "en": "Middle strategy: use a VPN to read only English reports."}, {"start": 5.66, "end": 7.63, "text": "下策：财新开个会员", "en": "Worst strategy: get a Caixin membership."}, {"start": 7.63, "end": 12.6, "text": "无需避免，做好选择就行——选择适合自己的信息茧房。", "en": "No need to avoid it; just make good choices — choose an information cocoon that suits you."}, {"start": 12.6, "end": 17.09, "text": "你以为移动互联网时代，少玩手机就能避免信息茧房了？", "en": "Do you think that in the mobile internet era, playing less with your phone can help you avoid information cocoons?"}, {"start": 17.09, "end": 25.9, "text": "能不能避免信息茧房我不知道，但是不看手机你绝对会脱离社会，脱离时代，甚至错过很多赚钱的机会。", "en": "I don't know whether you can avoid information cocoons, but if you don't look at your phone, you will definitely detach from society, detach from the times, and even miss many money-making opportunities."}, {"start": 25.9, "end": 30.41, "text": "放心，我不是来给你推荐赚钱项目的，也不是来割韭菜收学费的。", "en": "Rest assured, I'm not here to recommend money-making projects to you, nor to harvest leeks and charge tuition."}, {"start": 30.41, "end": 34.3, "text": "我来讲一下我对信息茧房的两点看法：", "en": "Let me talk about my two views on information cocoons:"}, {"start": 34.3, "end": 39.58, "text": "1、人是环境的产物，每个人都有自己的信息茧房", "en": "1. People are products of their environment; everyone has their own information cocoon."}, {"start": 39.58, "end": 47.69, "text": "很多人总是把信息茧房狭隘的理解成各种互联网平台尤其是短视频的算法推荐机制，这是狭隘的。", "en": "Many people always narrowly understand information cocoons as the algorithm recommendation mechanisms of various internet platforms, especially short videos. This is narrow."}, {"start": 47.69, "end": 55.3, "text": "更有奇葩说什么放下手机，把省下来的时间看书就不会陷入信息茧房了。", "en": "Even stranger are those who say that putting down your phone and spending the saved time reading books will keep you from falling into information cocoons."}, {"start": 55.3, "end": 56.18, "text": "P嘞~", "en": "Pfft~"}, {"start": 56.18, "end": 66.79, "text": "你每天抱着金庸武侠小说看，看着看着都觉得自己学会降龙十八掌就能独步武林，天下无敌了，这是不是信息茧房？", "en": "If you hold Jin Yong martial arts novels every day, reading until you feel that learning the Eighteen Dragon-Subduing Palms will let you roam the martial world unrivalled and invincible under heaven — is this not an information cocoon?"}, {"start": 66.79, "end": 77.3, "text": "你每天抱着言情小说，诗词歌赋看的自己四体不勤五谷不分、不食人间烟火，整天活在空气中，就不叫信息茧房了？", "en": "If you hold romance novels, poetry and songs every day, reading until your limbs are idle, grains undistinguished, detached from worldly life, living in thin air all day — is that not called an information cocoon?"}, {"start": 77.3, "end": 81.38, "text": "人生而自由，却无往不在枷锁之中。", "en": "Man is born free, and everywhere he is in chains."}, {"start": 81.38, "end": 86.9, "text": "你以为自己从手机这个火坑解脱出来了，殊不知又跳进了另一个火坑。", "en": "You think you have escaped from the fire pit of the phone, little knowing you have jumped into another fire pit."}, {"start": 86.9, "end": 89.11, "text": "脱离手机就万事大吉了？", "en": "Does leaving your phone mean everything is fine?"}, {"start": 89.11, "end": 95.95, "text": "不仅不会让你获得自由，在这个信息爆炸的时代，你反而很容易就被时代的洪流抛弃。", "en": "Not only will it not give you freedom, but in this era of information explosion, you will instead easily be abandoned by the torrent of the times."}, {"start": 95.95, "end": 100.63, "text": "两个星期不看手机，你甚至参加朋友聚会的时候，你自己都不知道他们在聊什么。", "en": "If you don't look at your phone for two weeks, you won't even know what they are talking about when you attend a friends' gathering."}, {"start": 100.63, "end": 106.8, "text": "还想着过着复古的生活，最后只能接受社会的毒打，让自己的贫穷为自己的生活买单。", "en": "Still dreaming of living a retro life, you can only end up accepting society's harsh beatings, letting your poverty pay for your life."}, {"start": 106.8, "end": 113.57, "text": "看到网红带货一个晚上销售2个亿，你说自己从来不看网红，也不在直播间买东西。", "en": "Seeing an influencer sell 200 million yuan in one night of livestreaming, you say you never watch influencers and never buy things in livestreams."}, {"start": 113.57, "end": 121.25, "text": "不仅不觉得自己脱离了时代，脱离了社会，还在那里沾沾自喜，觉得自己与众不同，充满高级感。", "en": "Not only do you not feel detached from the times and society, you are there feeling smug, thinking you are different, full of superiority."}, {"start": 121.25, "end": 124.44, "text": "然后说人家直播间都是注水造假的，根本不赚钱。", "en": "Then you say their livestream rooms are all inflated and fake, and don't make money at all."}, {"start": 124.44, "end": 130.03, "text": "直到看到薇娅被罚13.14个亿，你破防了，你不理解了。", "en": "Until you see Viya fined 1.314 billion yuan, your defences break, and you don't understand."}, {"start": 130.03, "end": 138.38, "text": "为什么有的人高学历辛辛苦苦工作一个月挣不到几个钱，那个没啥学历的网红一个晚上就能赚到别人一辈子都赚不到的钱。", "en": "Why do highly educated people work hard for a month and earn little money, while that influencer with little education can earn in one night what others cannot earn in a lifetime?"}, {"start": 138.38, "end": 140.06, "text": "你不是看不起网红吗？", "en": "Didn't you look down on influencers?"}, {"start": 140.06, "end": 142.34, "text": "你不是说直播间都是骗人的吗？", "en": "Didn't you say livestream rooms are all scams?"}, {"start": 142.34, "end": 145.7, "text": "你不是说你自己从来不在直播间买东西吗？", "en": "Didn't you say you never buy things in livestreams?"}, {"start": 145.7, "end": 148.7, "text": "你不是说那都是公司操作的，根本不赚钱吗？", "en": "Didn't you say it was all company manipulation and doesn't make money at all?"}, {"start": 148.7, "end": 157.78, "text": "怎么，你这个自诩自己不看手机，不刷短视频也不看直播，逃脱了信息茧房的人，也有破防的那一天？", "en": "So, you who pride yourself on not looking at your phone, not scrolling short videos, not watching livestreams, having escaped the information cocoon — do you also have a day when your defences break?"}, {"start": 157.78, "end": 168.65, "text": "到底是刷短视频看直播的人进入了信息茧房，还是你这个不刷手机爱好看书的人进入了自己的信息茧房，自己还在那里沾沾自喜？", "en": "Is it the people who scroll short videos and watch livestreams who entered information cocoons, or is it you, the book-loving person who doesn't scroll your phone, who entered your own information cocoon, still feeling smug there?"}, {"start": 168.65, "end": 169.92, "text": "都不尽然。", "en": "Neither is entirely the case."}, {"start": 169.92, "end": 172.68, "text": "事实是，每个人都有自己信息茧房。", "en": "The fact is, everyone has their own information cocoon."}, {"start": 172.68, "end": 183.17, "text": "你之所以会看不起网红，无非就是看到自己靠刷题内卷出的一直学历文凭，还没有他们装疯卖傻、扭腰晃腚赚得多，有点气不过。", "en": "The reason you look down on influencers is simply that you see your academic credentials earned through grinding problems in involution are worth less than their acting crazy and stupid, twisting waists and shaking butts — which makes you a bit angry."}, {"start": 183.17, "end": 196.92, "text": "要是谁高考考的分数高，谁大学学分绩高，谁获得奖多，就能赚的钱多，住的房子大就好了，那估计很多小镇做题家该觉得社会突然就公平了，世界突然就美好了。", "en": "If only whoever scored higher in the gaokao, whoever had a higher university GPA, whoever won more awards, could earn more money and live in a bigger house — then many small-town problem-solvers would probably feel society suddenly became fair, and the world suddenly became beautiful."}, {"start": 196.92, "end": 199.03, "text": "不过可惜，社会不是那么运转的。", "en": "Unfortunately, society does not operate that way."}, {"start": 199.03, "end": 204.55, "text": "你到售楼处问问人家，你的高数满分能抵多少首付，你看看人家搭不搭理你。", "en": "Go ask at a sales office: how much of a down payment can your perfect score in advanced mathematics offset? See whether they pay any attention to you."}, {"start": 204.55, "end": 211.46, "text": "你整天看一些学术论文是你的信息获取方式，别人整天刷一些网络毒鸡汤也是别人的信息获取方式。", "en": "Your reading academic papers all day is your way of obtaining information; others scrolling toxic chicken soup all day is their way of obtaining information."}, {"start": 211.46, "end": 215.98, "text": "别觉得自己是在做正事，被人都是被信息茧房困住了出不来。", "en": "Don't think you are doing serious business while others are all trapped in information cocoons and cannot get out."}, {"start": 215.98, "end": 229.1, "text": "没那么多人需要你解救，没那么多人需要你瞧不起，你觉得举世皆醉我独醒的时候，也许你也在你自己的信息茧房里——只不过你觉得你在做正事，不愿承认罢了。", "en": "Not so many people need you to save them, not so many people need you to look down on them. When you feel that all are drunk but you alone are sober, perhaps you are also in your own information cocoon — only you feel you are doing serious business and are unwilling to admit it."}, {"start": 229.1, "end": 234.55, "text": "人是社会的产物，更是信息的产物，没有人能够逃离。", "en": "People are products of society, and even more products of information; no one can escape."}, {"start": 234.55, "end": 237.79, "text": "2、既然无法逃离，不如主动选择", "en": "2. Since you cannot escape, you might as well actively choose."}, {"start": 237.79, "end": 243.67, "text": "既然每个人都无法逃离信息茧房，那不如自己给自己选择一个好的信息茧房。", "en": "Since everyone cannot escape information cocoons, you might as well choose a good information cocoon for yourself."}, {"start": 243.67, "end": 244.51, "text": "什么？", "en": "What?"}, {"start": 244.51, "end": 246.36, "text": "信息茧房还能选？", "en": "Information cocoons can be chosen?"}, {"start": 246.36, "end": 250.61, "text": "对的，你每天关注的那些博主，就是你的信息茧房的构成部分。", "en": "Yes — the bloggers you follow every day are components of your information cocoon."}, {"start": 250.61, "end": 265.06, "text": "你关注拳师博主，整天看一些女拳言论，你估计看天底下所有男人都是潜在的家暴猥琐男，甚至连自己的老爸老公和儿子都看不顺眼，动不动总有刁民想害本宫；", "en": "If you follow boxer bloggers, watching feminist-boxer remarks all day, you will probably see all men in the world as potential domestic-violence creeps, and even find your own father, husband and son displeasing, always feeling unruly subjects are trying to harm me;"}, {"start": 265.06, "end": 275.33, "text": "你关注体育博主，整天看各种球星比赛，估计你一有空闲就想着往球场跑，甚至看到中国队输了，都会口吐芬芳：“rnm，退钱！", "en": "If you follow sports bloggers, watching various star matches all day, you will probably want to run to the court whenever you have free time, and even when you see the Chinese team lose, you will blurt out vulgarities: 'rnm, refund!"}, {"start": 275.33, "end": 280.13, "text": "”", "en": "”"}, {"start": 280.13, "end": 290.62, "text": "你关注美食博主，整天看别人怎么做菜的，估计不用小半年，两个月你都能成为一个对美食一知半解的美食家，甚至自己做出来不错的菜品；", "en": "If you follow food bloggers, watching how others cook all day, you will probably become a half-knowledgeable foodie within less than half a year — two months — and even cook decent dishes yourself;"}, {"start": 290.62, "end": 311.57, "text": "你关注赚钱高知博主，比如 @温水公爵，整天看别人怎么分析社会讨论赚钱方法，提升思维水平，小半年你就能看懂社会的运行机制，知道赚钱的机会在哪里，砸碎学生思维，成为一个思路清晰行动力强的人了。", "en": "If you follow money-making knowledgeable bloggers, such as @Wen Shui Gong Jue, watching how others analyse society, discuss money-making methods, and improve thinking levels all day, within half a year you will understand society's operating mechanisms, know where money-making opportunities are, shatter student thinking, and become a person with clear ideas and strong execution."}, {"start": 311.57, "end": 314.64, "text": "所以，如果无法逃脱，不如主动选择。", "en": "So, if you cannot escape, you might as well actively choose."}, {"start": 314.64, "end": 323.88, "text": "当你发现自己根本不可能脱离信息茧房、游走于主流社会之外的时候，最明智的做法就是主动选择适合自己的信息茧房。", "en": "When you discover that you simply cannot detach from information cocoons and wander outside mainstream society, the wisest approach is to actively choose an information cocoon that suits you."}, {"start": 323.88, "end": 326.83, "text": "什么是适合自己的信息茧房？", "en": "What is an information cocoon that suits you?"}, {"start": 326.83, "end": 328.87, "text": "简而言之，符合你自己的价值观。", "en": "In short, one that matches your own values."}, {"start": 328.87, "end": 330.55, "text": "什么是价值观？", "en": "What are values?"}, {"start": 330.55, "end": 332.9, "text": "就是什么事情对于你来说更重要。", "en": "They are what matters more to you."}, {"start": 332.9, "end": 339.98, "text": "你觉得爱情最重要，离了爱情你不能活，那你就整天看甜甜的剧，幻想某一天一个霸道总裁爱上你；", "en": "If you think love is most important, and you cannot live without love, then watch sweet dramas all day, fantasising that one day a domineering CEO will fall in love with you;"}, {"start": 339.98, "end": 349.66, "text": "你觉得女拳最重要，那你就整天关注各种拳师，看她们是怎么帮助姐妹甄别猥琐男的，和你一起骂男人，把生活中的不顺都骂出去；", "en": "If you think feminist boxing is most important, then follow various boxers all day, watch how they help sisters identify creeps, scold men together with you, and scold away life's frustrations;"}, {"start": 349.66, "end": 362.06, "text": "你觉得赚钱最重要，那你每天就关注各种优质的赚钱博主，比如 @温水公爵 提早认清社会的现实，辨析社会机理，抓住社会趋势，找准自己的位置，分得一杯羹。", "en": "If you think making money is most important, then follow various high-quality money-making bloggers every day, such as @Wen Shui Gong Jue, to recognise social reality early, analyse social mechanisms, grasp social trends, find your own position, and get a share."}, {"start": 362.06, "end": 372.19, "text": "我经常做的事情就是，看看自己关注的哪些博主已经不在适合自己，又发现了哪些博主越来越适合自己，不断去完善自己的信息茧房。", "en": "What I often do is look at which bloggers I follow are no longer suitable for me, and which bloggers I have discovered are increasingly suitable for me, constantly improving my information cocoon."}, {"start": 372.19, "end": 380.9, "text": "不要害怕自己会陷入信息茧房，你要做的不是拒绝，而是主动作为，主动选择，给自己搭建一个适合自己信息茧房。", "en": "Don't fear falling into information cocoons. What you should do is not refuse, but actively act, actively choose, and build an information cocoon that suits you."}, {"start": 380.9, "end": 385.46, "text": "如果真的让我给一个人的信息茧房评价一下，我的评判标准就是：", "en": "If I were really asked to evaluate a person's information cocoon, my evaluation criterion would be:"}, {"start": 385.46, "end": 397.87, "text": "你的信息茧房是让你过的越来越好了，还是过的越来越差了，评判标准就用比较俗的吧——你的信息茧房是让你赚的钱越来越多了，还是让你赚钱越来越难，过得越来越差了？", "en": "Is your information cocoon making your life better and better, or worse and worse? Let's use a rather vulgar criterion — is your information cocoon making you earn more and more money, or making it harder and harder to earn money, and your life worse and worse?"}, {"start": 397.87, "end": 408.72, "text": "你比如我的信息茧房就是：及时发现社会发展趋势，什么赚钱，就想着尽快跟进，争取分一杯羹。", "en": "For example, my information cocoon is: promptly discovering social development trends, and whatever makes money, thinking about following up as soon as possible to get a share."}, {"start": 408.72, "end": 412.44, "text": "我的信息茧房是以“赚钱”为中心，你的信息茧房呢？", "en": "My information cocoon centres on 'making money'. What about yours?"}]}, {"title": "怎样避免活在信息茧房之中？ Part 23（81句，8:09）", "mp3": "upload-8-part23/audio.mp3", "dur": "8:09", "lines": [{"start": 0.0, "end": 3.19, "text": "信息茧房分自找的与强加的。", "en": "Information cocoons come in self-sought and imposed kinds."}, {"start": 3.19, "end": 8.18, "text": "自找的代表就是抖淫系，“你关心的，才是头条”。", "en": "The self-sought kind is exemplified by the Douyin family: 'What you care about is the headline'."}, {"start": 8.18, "end": 16.03, "text": "不同的年龄，不同的性别，不同的出身认知，他/她的抖淫，你去看看简直就是两个截然不同的世界。", "en": "Different ages, different genders, different backgrounds and cognitions — his/her Douyin, if you look at it, is simply two completely different worlds."}, {"start": 16.03, "end": 21.55, "text": "举个最简单的日常的例子，后入时你眼中看到的与女人眼中看到的。", "en": "Take the simplest everyday example: during rear entry, what you see with your eyes versus what a woman sees with her eyes."}, {"start": 21.55, "end": 22.82, "text": "你的视角是：", "en": "Your perspective is:"}, {"start": 22.82, "end": 24.22, "text": "而她的视角是：", "en": "And her perspective is:"}, {"start": 24.22, "end": 27.17, "text": "同一件事，你们都是完全不同的视角。", "en": "For the same matter, you both have completely different perspectives."}, {"start": 27.17, "end": 32.04, "text": "老天天然的就给了你们不同的视角，就不想不能让你们看到的是一样的东西。", "en": "Heaven naturally gave you different perspectives — it simply doesn't want what you see to be the same thing."}, {"start": 32.04, "end": 34.73, "text": "而强加的就是强尼懂得。", "en": "And the imposed kind is what Johnny understands."}, {"start": 34.73, "end": 36.12, "text": "你问怎么避免？", "en": "You ask how to avoid it?"}, {"start": 36.12, "end": 36.84, "text": "不能。", "en": "You can't."}, {"start": 36.84, "end": 38.33, "text": "美国人也不能。", "en": "Americans can't either."}, {"start": 38.33, "end": 43.32, "text": "例如电视，美国人的电视频道是订阅的，你看一眼就是看一年。", "en": "Take television, for example: American TV channels are subscription-based — one look and you're watching for a year."}, {"start": 43.32, "end": 47.16, "text": "而美国的电视系统是分民主党与共和党的。", "en": "And the American television system is divided between Democrats and Republicans."}, {"start": 47.16, "end": 54.84, "text": "在传播媒体，民主党几乎居于绝对的统治（CNN），但是共和党有家fox。", "en": "In communication media, the Democrats are almost absolutely dominant (CNN), but the Republicans have a Fox."}, {"start": 54.84, "end": 60.77, "text": "你订阅了民主党的电视系统，你基本就活在了民主党给你构造的世界里。", "en": "If you subscribe to the Democratic television system, you basically live in the world the Democrats constructed for you."}, {"start": 60.77, "end": 62.28, "text": "那你说怎么办呢？", "en": "So what do you do?"}, {"start": 62.28, "end": 66.29, "text": "怎么避免人们只活在为自己构造的信息茧房呢？", "en": "How can we prevent people from living only in information cocoons constructed for themselves?"}, {"start": 66.29, "end": 69.65, "text": "答案是教育阶段的逻辑学教学。", "en": "The answer is logic teaching during the education stage."}, {"start": 69.65, "end": 71.64, "text": "无法避免，但可提醒。", "en": "It cannot be avoided, but it can be warned against."}, {"start": 71.64, "end": 73.39, "text": "美帝用的就是这个办法。", "en": "This is the method the American empire uses."}, {"start": 73.39, "end": 76.15, "text": "也就是把“逻辑能力”这个能力事先就赋予你。", "en": "That is, the ability of 'logical ability' is given to you in advance."}, {"start": 76.15, "end": 79.22, "text": "把“辩谎能力”这个能力事先先赋予你。", "en": "The ability of 'lie-detecting ability' is given to you in advance."}, {"start": 79.22, "end": 83.42, "text": "先锻炼你的“辩谎”能力，再把你撒入一个撒谎社会。", "en": "First train your 'lie-detecting' ability, then throw you into a lying society."}, {"start": 83.42, "end": 86.11, "text": "我们的祖宗也告诉过你的事情：", "en": "Our ancestors also told you things:"}, {"start": 86.11, "end": 90.24, "text": "远看成岭侧成峰，远近高低各不同。", "en": "Seen from afar, a range; from the side, a peak — different from far, near, high and low."}, {"start": 90.24, "end": 93.19, "text": "还告诉了你：盲人摸象这个故事。", "en": "And they told you the story of blind men feeling an elephant."}, {"start": 93.19, "end": 99.62, "text": "这就是告诉你，你看到的，即使是真的，也未必全面，甚至可以说，“一定不全面”。", "en": "This tells you that what you see, even if it is true, may not be comprehensive — indeed, it can be said to be 'certainly not comprehensive'."}, {"start": 99.62, "end": 106.66, "text": "你看到的，基于你的能力、精力，以及别人想要你看到的，大概率的，只是事情的一个面。", "en": "What you see, based on your ability, energy, and what others want you to see, is most likely just one face of the matter."}, {"start": 106.66, "end": 109.42, "text": "即使是真的，也只是事情的一个面。", "en": "Even if it is true, it is only one face of the matter."}, {"start": 109.42, "end": 114.5, "text": "于是A坚信自己看到的世界是方的，B坚信自己看到的世界是圆的。", "en": "So A firmly believes the world he sees is square, and B firmly believes the world he sees is round."}, {"start": 114.5, "end": 119.5, "text": "AB各自都有无数的理由，觉得自己是真理，自己才是真理。", "en": "A and B each have countless reasons, feeling they are the truth, that they alone are the truth."}, {"start": 119.5, "end": 123.17, "text": "觉得对方是错误的，应该把对方非人道消灭。", "en": "Feeling the other is wrong, and should be inhumanely eliminated."}, {"start": 123.17, "end": 129.0, "text": "而逻辑学，则从根本上就告诉你，你们都对，但是都不全。", "en": "Logic, however, fundamentally tells you: you are both right, but neither is complete."}, {"start": 129.0, "end": 132.72, "text": "因为，你们理解世界的工具，是语言。", "en": "Because the tool you use to understand the world is language."}, {"start": 132.72, "end": 135.53, "text": "语言是你们进行思维的工具。", "en": "Language is the tool you use to think."}, {"start": 135.53, "end": 141.72, "text": "也就是维特根斯坦的“语言即世界”“语言是我理解世界的边界”。", "en": "That is Wittgenstein's 'language is the world' and 'language is the boundary of my understanding of the world'."}, {"start": 141.72, "end": 144.55, "text": "而语言只是真实的世界的一个投影。", "en": "And language is only a projection of the real world."}, {"start": 144.55, "end": 151.27, "text": "语言是无法去表达与描述完全的真实的世界的，因为“不可说的东西，保持沉默”。", "en": "Language cannot express and describe the completely real world, because 'whereof one cannot speak, thereof one must be silent'."}, {"start": 151.27, "end": 156.26, "text": "举的例子就是“鸡生蛋还是蛋生鸡”，这个经典的逻辑学问题。", "en": "The example given is 'the chicken or the egg', this classic logic question."}, {"start": 156.26, "end": 167.35, "text": "而维特根斯坦的解读，就是真实的世界，就没有“鸡”这个东西，因为鸡是连贯的从恐龙一直延续到今天的一个动态物品，而只是你把其中的一个片段，命名叫做“鸡”。", "en": "And Wittgenstein's interpretation is that in the real world there is no such thing as a 'chicken', because a chicken is a dynamic thing continuing coherently from dinosaurs to today, and you merely name one fragment of it 'chicken'."}, {"start": 167.35, "end": 177.79, "text": "所以，语言是不能直接、全面反馈真实与全面的世界的，语言只是为“达成共识”，而不是“认真、严谨、全面”的去表达世界。", "en": "So language cannot directly and comprehensively reflect the real and comprehensive world; language is only for 'reaching consensus', not for expressing the world 'seriously, rigorously and comprehensively'."}, {"start": 177.79, "end": 180.19, "text": "所以，“不可说的东西，保持沉默”。", "en": "So, 'whereof one cannot speak, thereof one must be silent'."}, {"start": 180.19, "end": 188.42, "text": "而维特根斯坦想要一种“理想语言”，就是这种语言“为唯一的一个事务取唯一的一个名字”“每一个词语都表示唯一的一个事务”。", "en": "And Wittgenstein wanted an 'ideal language', in which 'a unique name is given to a unique affair' and 'each word represents a unique affair'."}, {"start": 188.42, "end": 190.94, "text": "这种语言会最大可能得接近真实世界。", "en": "This language would come as close as possible to the real world."}, {"start": 190.94, "end": 195.19, "text": "但是不可能，因为语言具有自翻译、自进化、自演绎的功能。", "en": "But it is impossible, because language has the functions of self-translation, self-evolution and self-deduction."}, {"start": 195.19, "end": 204.02, "text": "你不可能去创造一种“理想语言”，为每一个事务都取上唯一的名字，并每一个单词都代表唯一的一个事务。", "en": "You cannot create an 'ideal language' that gives a unique name to every affair, with every word representing a unique affair."}, {"start": 204.02, "end": 208.1, "text": "例如，维特根斯坦举的例子，就是失业。", "en": "For example, Wittgenstein's example is unemployment."}, {"start": 208.1, "end": 219.22, "text": "失业就是失业，对于失业这个唯一的事务，你就用唯一的词语失业来描述，而不要用“准备新的就业”“下岗”“待就业”“灵活就业”“待富人群”。", "en": "Unemployment is unemployment. For this unique affair of unemployment, you use the unique word unemployment to describe it, and do not use 'preparing for new employment', 'laid off', 'awaiting employment', 'flexible employment', 'people awaiting prosperity'."}, {"start": 219.22, "end": 220.22, "text": "来表达。", "en": "To express it."}, {"start": 220.22, "end": 247.06, "text": "例如征兵，这个唯一的事务，你就用唯一的词语去表达，你可以选择征兵，可以选择动员，但是在同一状态下，你应该用同一个词语去表达，例如一战二战，如果描述的是同一件事，你就应该用同一个词汇，例如西方通常用“mobilize”也就是动员、动员率来统一表达，而不能在一个事务上，一会用“踊跃参军”，一会用“拉丁抓夫”来表达。", "en": "For example, conscription: for this unique affair, you express it with a unique word. You can choose conscription, you can choose mobilisation, but in the same state, you should use the same word to express it. For example, World War I and World War II: if describing the same thing, you should use the same vocabulary — for example, the West usually uses 'mobilize', that is, mobilisation and mobilisation rate, to express it uniformly, and cannot, for one affair, at one moment use 'enthusiastic enlistment' and at another use 'press-ganging' to express it."}, {"start": 247.06, "end": 272.45, "text": "例如，对乙酰氨基酚就是对乙酰氨基酚，你不能一会用对乙酰氨基酚，一会用感冒通、一会用感冒灵、一会用维C银翘片、一会用复方小儿退热栓来表达。", "en": "For example, paracetamol is paracetamol. You cannot at one moment use paracetamol, at another use Ganmaotong, at another Ganmaoling, at another Vitamin C Yinqiao Tablets, at another Compound Paediatric Antipyretic Suppositories to express it."}, {"start": 272.45, "end": 277.08, "text": "例如，格列本脲就是格列本脲，你不能一会用格列本脲，一会用消渴丸来表达。", "en": "For example, glibenclamide is glibenclamide. You cannot at one moment use glibenclamide, at another use Xiaoke Pills to express it."}, {"start": 277.08, "end": 285.96, "text": "例如，马来酸氯苯那敏就是马来酸氯苯那敏，你不能一会用马来酸氯苯那敏，一会用咳特灵来表达。", "en": "For example, chlorphenamine maleate is chlorphenamine maleate. You cannot at one moment use chlorphenamine maleate, at another use Ke Te Ling to express it."}, {"start": 285.96, "end": 290.69, "text": "例如，蝙蝠shi就是蝙蝠shi，你不能一会用蝙蝠shi，一会用夜明砂来表达。", "en": "For example, bat shit is bat shit. You cannot at one moment use bat shit, at another use Night-Shining Sand to express it."}, {"start": 290.69, "end": 295.49, "text": "例如，老鼠shi就是老鼠shi，你不能一会用老鼠shi，一会用五灵脂来表达。", "en": "For example, rat shit is rat shit. You cannot at one moment use rat shit, at another use Five Spirits Fat to express it."}, {"start": 295.49, "end": 301.13, "text": "例如，猫咪shi就是猫咪shi，你不能一会用猫咪shi，一会用月明砂来表达。", "en": "For example, cat shit is cat shit. You cannot at one moment use cat shit, at another use Moon-Bright Sand to express it."}, {"start": 301.13, "end": 306.05, "text": "例如，农村旱厕就是农村旱厕，你不能一会用农村旱厕，一会用人中黄来表达。", "en": "For example, a rural dry toilet is a rural dry toilet. You cannot at one moment use rural dry toilet, at another use Ren Zhong Huang to express it."}, {"start": 306.05, "end": 309.77, "text": "例如，qu就是qu，你不能一会用qu，一会用水仙子来表达。", "en": "For example, maggots are maggots. You cannot at one moment use maggots, at another use Water Fairies to express it."}, {"start": 309.77, "end": 312.48, "text": "避免信息茧房的办法就是逻辑学。", "en": "The way to avoid information cocoons is logic."}, {"start": 312.48, "end": 316.73, "text": "所以国内出版的维特根斯坦哲学论，封面是个梯子。", "en": "So the domestically published Wittgenstein's Tractatus has a ladder on its cover."}, {"start": 316.73, "end": 318.0, "text": "就是让你出坑的。", "en": "It is to let you climb out of the pit."}, {"start": 318.0, "end": 323.95, "text": "所以，1930年代开始，苏联全苏禁止了逻辑学教学。", "en": "So, starting in the 1930s, the Soviet Union banned logic teaching across the whole union."}, {"start": 323.95, "end": 344.9, "text": "“信息茧房”是一个比喻，指的是人们在互联网上只接触到与自己现有观点和兴趣相一致的信息，从而限制了视野和思想的多样性。", "en": "'Information cocoon' is a metaphor referring to people only coming into contact on the internet with information consistent with their existing views and interests, thereby limiting the diversity of their horizons and thoughts."}, {"start": 344.9, "end": 348.07, "text": "要突破信息茧房，可以尝试以下方法：", "en": "To break through information cocoons, you can try the following methods:"}, {"start": 348.07, "end": 357.07, "text": "1. 多元化信息源：主动寻找和订阅不同观点和领域的信息来源，包括新闻网站、博客、社交媒体账号等", "en": "1. Diversify information sources: actively seek and subscribe to information sources with different views and fields, including news websites, blogs, social media accounts, etc."}, {"start": 357.07, "end": 372.38, "text": "2. 批判性思维：培养批判性思维能力，对接触到的信息进行分析和质疑，而不是被动接受。", "en": "2. Critical thinking: cultivate critical thinking ability, analyse and question the information you come into contact with, rather than passively accepting it."}, {"start": 372.38, "end": 380.35, "text": "3. 跨领域学习：定期学习新的领域或话题，这有助于拓宽知识面和理解不同的观点。", "en": "3. Cross-field learning: regularly learn new fields or topics, which helps broaden your knowledge and understand different views."}, {"start": 380.35, "end": 388.15, "text": "4. 使用推荐系统：利用社交媒体和新闻平台的推荐系统探索不熟悉的主题和观点。", "en": "4. Use recommendation systems: use social media and news platform recommendation systems to explore unfamiliar topics and views."}, {"start": 388.15, "end": 397.94, "text": "5. 社交媒体设置：调整社交媒体算法偏好，减少过滤泡泡效应，即算法根据用户历史行为推荐相似内容的倾向。", "en": "5. Social media settings: adjust social media algorithm preferences to reduce the filter bubble effect, i.e., the tendency of algorithms to recommend similar content based on user history."}, {"start": 397.94, "end": 407.14, "text": "6. 讨论和辩论：与持有不同观点的人进行讨论和辩论，这有助于理解多样性并促进个人成长。", "en": "6. Discussion and debate: discuss and debate with people holding different views, which helps understand diversity and promote personal growth."}, {"start": 407.14, "end": 420.74, "text": "7. 阅读书：阅读不同类型和主题的书籍，尤其是那些挑战你现有观点的书籍。", "en": "7. Reading books: read books of different types and topics, especially those that challenge your existing views."}, {"start": 420.74, "end": 426.86, "text": "8. 多语言内容：尝试阅读或观看不同语言的内容，这有助于了解不同文化和视", "en": "8. Multilingual content: try reading or watching content in different languages, which helps understand different cultures and perspectives."}, {"start": 426.86, "end": 435.14, "text": "9. 避免快速判断：在形成观点之前，给予自己充分的时间来考虑和评估信息。", "en": "9. Avoid quick judgments: before forming a view, give yourself sufficient time to consider and evaluate information."}, {"start": 435.14, "end": 443.59, "text": "10. 开放态度：保持开放的心态，愿意接受新的想法和观点，即使它们与你的现有信念相冲突。", "en": "10. Open attitude: keep an open mind, willing to accept new ideas and views, even if they conflict with your existing beliefs."}, {"start": 443.59, "end": 452.23, "text": "11. 定期反思：定期反思自己的信息消费习惯和信念，看看是否有偏差或局限性。", "en": "11. Regular reflection: regularly reflect on your information consumption habits and beliefs, to see if there are biases or limitations."}, {"start": 452.23, "end": 459.74, "text": "12. 使用工具：利用一些工具和浏览器插件来打破过滤泡泡，比如推荐系统调节工具。", "en": "12. Use tools: use some tools and browser plugins to break filter bubbles, such as recommendation system adjustment tools."}, {"start": 459.74, "end": 466.27, "text": "13. 参与线下活动：参加社区活动、讲座、研讨会等，与不同背景的人面对面交流。", "en": "13. Participate in offline activities: attend community activities, lectures, seminars, etc., and communicate face-to-face with people from different backgrounds."}, {"start": 466.27, "end": 474.26, "text": "14.教育自己：通过正规教育途径，如参加课程或研讨会，系统地学习新知识。", "en": "14. Educate yourself: through formal education channels, such as attending courses o
