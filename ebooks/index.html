<script>
const SECTIONS=[{"title": "35岁的我谈了个男大… — 第1部分（143句，7:02）", "mp3": "upload-7-part1/audio.mp3", "dur": "7:02", "lines": [{"start": 0.0, "end": 4.2, "text": "35 岁的我谈了个男大，他精力十分旺盛。", "en": "At 35, I'm dating a college guy, and he is bursting with energy."}, {"start": 4.2, "end": 7.14, "text": "只是在床上时，他会突然来句：", "en": "It's just that in bed, he suddenly blurts out:"}, {"start": 7.14, "end": 8.82, "text": "「姐姐，别动。」", "en": "“Sis, don't move.”"}, {"start": 8.82, "end": 12.18, "text": "「让我闻闻你身上有没有老人味。」", "en": "“Let me smell whether you have an old-person smell on you.”"}, {"start": 12.18, "end": 13.65, "text": "这话实在难听。", "en": "Those words are really harsh."}, {"start": 13.65, "end": 18.48, "text": "我强忍着将他踹翻的冲动，决定睡腻了跟他提分手。", "en": "I fought back the urge to kick him over, and decided that once I'd had enough of sleeping with him, I'd break up with him."}, {"start": 18.48, "end": 21.0, "text": "直到前两天，我俩约会时。", "en": "Until two days ago, when we were on a date."}, {"start": 21.0, "end": 22.47, "text": "周煜他爸找来，", "en": "Zhou Yu's father came looking for him,"}, {"start": 22.47, "end": 24.15, "text": "「谈女朋友了？」", "en": "“So you've got a girlfriend?”"}, {"start": 24.15, "end": 25.41, "text": "我浑身僵硬。", "en": "My whole body went stiff."}, {"start": 25.41, "end": 28.98, "text": "周煜这位古板严苛的爸，是我的前任。", "en": "Zhou Yu's old-fashioned, strict father is my ex."}, {"start": 28.98, "end": 29.19, "text": "1", "en": "1"}, {"start": 29.19, "end": 32.55, "text": "周景焕给我留下的阴影实在太深了。", "en": "The shadow Zhou Jinghuan left on me runs far too deep."}, {"start": 32.55, "end": 37.8, "text": "以至于现在，想到这三个字，我的身体就忍不住打哆嗦。", "en": "So much so that even now, just thinking of those three characters makes my body tremble involuntarily."}, {"start": 37.8, "end": 39.48, "text": "这次跟周煜见面。", "en": "This time, meeting Zhou Yu."}, {"start": 39.48, "end": 42.63, "text": "也是因为知道了他爸就是周景焕。", "en": "It was also because I knew his father was Zhou Jinghuan."}, {"start": 42.63, "end": 45.15, "text": "决定跟他再玩一次就分手。", "en": "I decided to play with him one more time and then break up."}, {"start": 45.15, "end": 49.56, "text": "因此，刚才的几个小时里，我任由着周煜胡闹。", "en": "So, during the past few hours, I let Zhou Yu fool around as he pleased."}, {"start": 49.56, "end": 50.19, "text": "毕竟。", "en": "After all."}, {"start": 50.19, "end": 52.5, "text": "他这种年轻又能力强的。", "en": "Someone young and capable like him."}, {"start": 52.5, "end": 53.76, "text": "实在不好找。", "en": "Is really hard to find."}, {"start": 53.76, "end": 56.28, "text": "我起身，慢吞吞地穿好了衣物。", "en": "I got up and slowly got dressed."}, {"start": 56.28, "end": 58.81, "text": "恰好，周煜也从浴室走了出来。", "en": "Just then, Zhou Yu also came out of the bathroom."}, {"start": 58.81, "end": 66.02, "text": "我盯着他上半身结实的腹肌，尽管满眼不舍，还是坚定地开了口：「周煜，我们分手吧。」", "en": "I stared at his firm abs on his upper body, and although I was full of reluctance, I still firmly said, “Zhou Yu, let's break up.”"}, {"start": 66.02, "end": 68.18, "text": "青年擦拭头发的动作一顿。", "en": "The young man's motion of towelling his hair paused."}, {"start": 68.18, "end": 69.45, "text": "抬眼朝我看来。", "en": "He looked up at me."}, {"start": 69.45, "end": 71.97, "text": "他唇角微勾，语气中满是戏谑。", "en": "The corner of his mouth curled up, his tone full of teasing."}, {"start": 71.97, "end": 75.21, "text": "「姐姐，别说这种气话，我会当真的。」", "en": "“Sis, don't say that in anger. I'll take it seriously.”"}, {"start": 75.21, "end": 77.92, "text": "我摇了摇头，说：「不是气话。」", "en": "I shook my head and said, “It's not said in anger.”"}, {"start": 77.92, "end": 80.08, "text": "周煜却没听进去我的解释。", "en": "But Zhou Yu didn't take in my explanation."}, {"start": 80.08, "end": 89.82, "text": "他轻叹了声，无奈道：「姐姐，我说得没错啊，你的年纪都够做我的后妈了。我要是把你带回去，我爸真的会打死我的。」", "en": "He sighed softly and said helplessly, “Sis, what I said wasn't wrong. You're old enough to be my stepmother. If I took you home, my dad would really beat me to death.”"}, {"start": 89.82, "end": 90.9, "text": "我蹙了蹙眉。", "en": "I furrowed my brow."}, {"start": 90.9, "end": 94.14, "text": "开始怀疑周煜这小子是不是听不懂人话。", "en": "I began to wonder whether this kid Zhou Yu simply couldn't understand human speech."}, {"start": 94.14, "end": 98.11, "text": "我跟他在一起，纯粹是馋他身子，只想玩玩而已。", "en": "Being with him, I was purely lusting after his body. I only wanted to play around."}, {"start": 98.11, "end": 98.83, "text": "更何况。", "en": "Besides."}, {"start": 98.83, "end": 101.1, "text": "他爸还是周景焕这尊煞神。", "en": "His father is still that terrifying figure Zhou Jinghuan."}, {"start": 101.1, "end": 102.62, "text": "谁要跟他回家啊。", "en": "Who would want to go home with him?"}, {"start": 102.62, "end": 103.94, "text": "我深吸了口气。", "en": "I took a deep breath."}, {"start": 103.94, "end": 105.83, "text": "正打算向周煜说清楚。", "en": "I was just about to make it clear to Zhou Yu."}, {"start": 105.83, "end": 108.48, "text": "下一秒，他的手机铃声却响了。", "en": "The next second, his phone rang."}, {"start": 108.48, "end": 110.38, "text": "少年毫不避讳地接听。", "en": "The young man answered without any hesitation."}, {"start": 110.38, "end": 114.35, "text": "很快，手机里传来嘈杂的声音，以及一道男声。", "en": "Soon, noisy voices came through the phone, along with a male voice."}, {"start": 114.35, "end": 117.76, "text": "「周哥，来酒吧玩儿啊，大家都在呢。」", "en": "“Brother Zhou, come play at the bar. Everyone's here.”"}, {"start": 117.76, "end": 119.65, "text": "周煜朝我这边看了眼。", "en": "Zhou Yu glanced over at me."}, {"start": 119.65, "end": 120.78, "text": "一时没说话。", "en": "He didn't speak for a moment."}, {"start": 120.78, "end": 127.6, "text": "他犹豫的空当，那边又传来一道娇软的嗓音，「阿煜，你不来的话，我就走啦。」", "en": "While he hesitated, a soft, sweet voice came from the other end: “A Yu, if you don't come, I'm leaving.”"}, {"start": 127.6, "end": 131.0, "text": "周煜喉结滚了滚，不知想到什么，笑了。", "en": "Zhou Yu's Adam's apple bobbed. Thinking of something, he laughed."}, {"start": 131.0, "end": 132.52, "text": "「行，等着我。」", "en": "“Fine, wait for me.”"}, {"start": 132.52, "end": 133.46, "text": "挂断电话。", "en": "He hung up."}, {"start": 133.46, "end": 135.54, "text": "他动作利落地穿好衣服。", "en": "He got dressed swiftly."}, {"start": 135.54, "end": 140.46, "text": "即将出门时，似乎才想起我的存在，头也不回地留下了句。", "en": "Just as he was about to leave, he seemed to remember I existed, and left a remark without even turning his head."}, {"start": 140.46, "end": 142.54, "text": "「我去跟同龄人玩玩。」", "en": "“I'm going to play with people my own age.”"}, {"start": 142.54, "end": 144.25, "text": "我平静地点了点头。", "en": "I nodded calmly."}, {"start": 144.25, "end": 147.28, "text": "周煜前脚离开，我后脚就去退了房。", "en": "Zhou Yu had barely left when I went and checked out of the room."}, {"start": 147.28, "end": 148.03, "text": "到家后。", "en": "After getting home."}, {"start": 148.03, "end": 150.14, "text": "我照常洗漱上床。", "en": "I washed up and got into bed as usual."}, {"start": 150.14, "end": 154.99, "text": "这两年，始终保持着晚上十一点前睡觉的规律作息。", "en": "For the past two years, I've kept a regular routine of sleeping before eleven at night."}, {"start": 154.99, "end": 155.88, "text": "只是。", "en": "Only."}, {"start": 155.88, "end": 157.85, "text": "今晚躺在床上。", "en": "Tonight, lying in bed."}, {"start": 157.85, "end": 160.18, "text": "却有些翻来覆去地睡不着。", "en": "I tossed and turned, unable to sleep."}, {"start": 160.18, "end": 166.18, "text": "而在深夜，孤身一人时，总是控制不住将一些记忆翻出来回味。", "en": "And late at night, when I'm alone, I always can't help turning over old memories and savouring them."}, {"start": 166.18, "end": 166.94, "text": "2", "en": "2"}, {"start": 166.94, "end": 168.55, "text": "我和周煜的相识。", "en": "How Zhou Yu and I met."}, {"start": 168.55, "end": 169.58, "text": "也是在酒吧。", "en": "Was also at a bar."}, {"start": 169.58, "end": 171.67, "text": "他给我点了杯茉莉朗姆酒。", "en": "He ordered me a jasmine rum."}, {"start": 171.67, "end": 173.28, "text": "恰好我又钟情茉莉。", "en": "And I happen to love jasmine."}, {"start": 173.28, "end": 184.08, "text": "因此，青年双手合十，用一双漂亮的桃花眼恳求：「姐姐，我输了游戏，他们让我拿到你的联系方式，可以帮帮我吗？」", "en": "So the young man put his hands together and pleaded with a pair of beautiful peach-blossom eyes: “Sis, I lost a game. They told me to get your contact information. Can you help me?”"}, {"start": 184.08, "end": 185.04, "text": "我点头。", "en": "I nodded."}, {"start": 185.04, "end": 186.53, "text": "跟他交换了联系方式。", "en": "And exchanged contact information with him."}, {"start": 186.53, "end": 187.73, "text": "从那天起。", "en": "From that day on."}, {"start": 187.73, "end": 190.32, "text": "我和周煜几乎每天都保持着联系。", "en": "Zhou Yu and I stayed in touch almost every day."}, {"start": 190.32, "end": 196.49, "text": "他说话很有趣，还总能从闲谈的三言两语中，准确地挖掘出我喜欢什么。", "en": "He's fun to talk to, and he can always pick out exactly what I like from a few casual remarks in idle chat."}, {"start": 196.49, "end": 197.93, "text": "并投其所好。", "en": "And cater to my tastes."}, {"start": 197.93, "end": 201.72, "text": "人真的很难不被旺盛的生命力吸引。", "en": "It's really hard for a person not to be drawn to such exuberant vitality."}, {"start": 201.72, "end": 202.75, "text": "更何况。", "en": "Besides."}, {"start": 202.75, "end": 204.86, "text": "周煜年轻帅气。", "en": "Zhou Yu is young and handsome."}, {"start": 204.86, "end": 207.1, "text": "还对我保持着十足的热忱。", "en": "And he remains full of enthusiasm for me."}, {"start": 207.1, "end": 208.94, "text": "察觉到自己的心意后。", "en": "After realising my own feelings."}, {"start": 208.94, "end": 211.34, "text": "我果断选择了跟周煜在一起。", "en": "I decisively chose to be with Zhou Yu."}, {"start": 211.34, "end": 214.99, "text": "而他也表现得很不错，每次都能给我完美的体验。", "en": "And he performed very well, giving me a perfect experience every time."}, {"start": 214.99, "end": 217.94, "text": "事情的转折点发生在我生日那天。", "en": "The turning point came on my birthday."}, {"start": 217.94, "end": 219.5, "text": "我发了一条朋友圈：", "en": "I posted a Moments update:"}, {"start": 219.5, "end": 222.19, "text": "【人生如此刻，一切正当时。】", "en": "“Life is like this moment; everything is just right.”"}, {"start": 222.19, "end": 226.8, "text": "配图是一个生日蛋糕，上面插着「35 岁」字样的蜡烛。", "en": "The accompanying picture was a birthday cake with candles shaped like the characters for “35”."}, {"start": 226.8, "end": 227.83, "text": "没一会儿。", "en": "Before long."}, {"start": 227.83, "end": 230.42, "text": "周煜就将这条朋友圈截图发给了我。", "en": "Zhou Yu sent me a screenshot of that Moments post."}, {"start": 230.42, "end": 235.39, "text": "【姐姐，原来你也喜欢玩儿抽象啊？哈哈哈哈。】", "en": "“Sis, so you like playing at being abstract too? Hahaha.”"}, {"start": 235.39, "end": 240.38, "text": "【明明是二十五岁，怎么还非要买三十五岁的生日蛋糕。】", "en": "“You're clearly twenty-five. Why insist on buying a thirty-five-year-old's birthday cake?”"}, {"start": 240.38, "end": 241.54, "text": "我愣了愣。", "en": "I froze."}, {"start": 241.54, "end": 243.26, "text": "一时间没反应过来。", "en": "For a moment, I didn't react."}, {"start": 243.26, "end": 248.95, "text": "下意识回复：【我确实三十五岁了。】", "en": "I replied instinctively: “I really am thirty-five.”"}, {"start": 248.95, "end": 250.82, "text": "我对自己的年龄没什么忌讳。", "en": "I have no hang-ups about my age."}, {"start": 250.82, "end": 254.9, "text": "闻言，周煜却发来一个小狗大哭的表情包。", "en": "Hearing that, Zhou Yu sent a sticker of a puppy crying its eyes out."}, {"start": 254.9, "end": 257.59, "text": "【姐姐，你别玩儿我了。】", "en": "“Sis, stop teasing me.”"}, {"start": 257.59, "end": 262.51, "text": "【你这么年轻漂亮，说是女大学生我都信，怎么可能三十五岁呢？】", "en": "“You're so young and beautiful. I'd believe it if you said you were a female university student. How could you possibly be thirty-five?”"}, {"start": 262.51, "end": 265.44, "text": "我只好将打码的身份证照片发了过去。", "en": "I had no choice but to send him a photo of my ID card with parts blurred out."}, {"start": 265.44, "end": 267.53, "text": "看清上面的出生日期后。", "en": "After seeing the date of birth on it clearly."}, {"start": 267.53, "end": 269.04, "text": "周煜沉默了。", "en": "Zhou Yu fell silent."}, {"start": 269.04, "end": 271.13, "text": "我也才后知后觉地反应过来。", "en": "Only then did I belatedly realise."}, {"start": 271.13, "end": 272.52, "text": "他猜错了我的年龄。", "en": "He had guessed my age wrong."}, {"start": 272.52, "end": 278.57, "text": "难怪之前好几次，我提到自己三十来岁时，周煜总是说我爱开玩笑。", "en": "No wonder, several times before, when I mentioned being in my thirties, Zhou Yu always said I loved to joke."}, {"start": 278.57, "end": 279.72, "text": "那次过后。", "en": "After that time."}, {"start": 279.72, "end": 282.53, "text": "我以为，周煜会向我提分手。", "en": "I thought Zhou Yu would break up with me."}, {"start": 282.53, "end": 284.04, "text": "可出乎意料的是。", "en": "But unexpectedly."}, {"start": 284.04, "end": 285.53, "text": "他没有。", "en": "He didn't."}, {"start": 285.53, "end": 290.02, "text": "大概是接受了这个事实，他照常约我出门，像个没事人一样。", "en": "Probably having accepted the fact, he kept inviting me out as usual, as if nothing had happened."}, {"start": 290.02, "end": 292.1, "text": "只是偶尔在床上时。", "en": "Only occasionally, in bed."}, {"start": 292.1, "end": 294.7, "text": "青年会嗅着我的脖颈，突然来一句：", "en": "The young man would sniff at my neck and suddenly say:"}, {"start": 294.7, "end": 296.57, "text": "「姐姐，别动。」", "en": "“Sis, don't move.”"}, {"start": 296.57, "end": 299.16, "text": "「让我闻闻你身上有没有老人味。」", "en": "“Let me smell whether you have an old-person smell on you.”"}, {"start": 299.16, "end": 301.16, "text": "周煜这句话实在难听。", "en": "That remark of Zhou Yu's is really harsh."}, {"start": 301.16, "end": 303.95, "text": "可他年轻健壮，又实在吸引我。", "en": "But he is young and strong, and really attractive to me."}, {"start": 303.95, "end": 305.55, "text": "短暂的纠结过后。", "en": "After a brief struggle."}, {"start": 305.55, "end": 310.94, "text": "我强忍住了将他一脚踹翻的冲动，决定睡腻了就向他提分手。", "en": "I held back the urge to kick him over and decided that once I'd had enough of sleeping with him, I'd break up with him."}, {"start": 310.94, "end": 311.54, "text": "毕竟。", "en": "After all."}, {"start": 311.54, "end": 314.74, "text": "在外面包一个男大学生还得花钱呢。", "en": "Keeping a male university student on the side would cost money."}, {"start": 314.74, "end": 316.33, "text": "而周煜是免费的。", "en": "But Zhou Yu is free."}, {"start": 316.33, "end": 318.53, "text": "颜值和身材还都是极品。", "en": "And his looks and figure are both top-notch."}, {"start": 318.53, "end": 324.72, "text": "如果不是突然得知他爸是周景焕，我本来打算跟周煜再……谈一周的。", "en": "If I hadn't suddenly learned that his father is Zhou Jinghuan, I had originally planned to keep dating Zhou Yu for… another week."}, {"start": 324.72, "end": 325.92, "text": "直到前两天。", "en": "Until two days ago."}, {"start": 325.92, "end": 328.12, "text": "周煜跟家里人打电话时。", "en": "When Zhou Yu was on the phone with his family."}, {"start": 328.12, "end": 330.11, "text": "没忍住冲着手机大吼。", "en": "He couldn't help shouting into the phone."}, {"start": 330.11, "end": 333.51, "text": "「周景焕，我的事情，用不着你管！」", "en": "“Zhou Jinghuan, my business is none of your concern!”"}, {"start": 333.51, "end": 335.51, "text": "听见这个熟悉的名字。", "en": "Hearing that familiar name."}, {"start": 335.51, "end": 337.1, "text": "我吓得浑身一抖。", "en": "I trembled all over in fright."}, {"start": 337.1, "end": 344.29, "text": "事后，旁敲侧击地询问他爸的身份，终于确定了这就是我之前谈过的那个周景焕。", "en": "Afterwards, I asked about his father's identity in a roundabout way, and finally confirmed that this was the Zhou Jinghuan I had dated before."}, {"start": 344.29, "end": 345.69, "text": "顿时心如死灰。", "en": "My heart instantly turned to ashes."}, {"start": 345.69, "end": 346.49, "text": "我知道。", "en": "I knew."}, {"start": 346.49, "end": 348.29, "text": "免费的鸭子要没了。", "en": "The free duck was about to be gone."}, {"start": 348.29, "end": 357.29, "text": "如果让周景焕知道，继拱了他这颗大白菜之后，我又霍霍了他儿子。", "en": "If Zhou Jinghuan found out that, after taking advantage of his prized cabbage, I had then gone after his son as well."}, {"start": 357.29, "end": 360.89, "text": "肯定会让我吃不了兜着走。", "en": "He would definitely make me pay dearly."}, {"start": 360.89, "end": 361.19, "text": "3", "en": "3"}, {"start": 361.19, "end": 365.69, "text": "次日，天刚亮，就响起了敲门声。", "en": "The next day, just as dawn broke, there was a knock on the door."}, {"start": 365.69, "end": 367.19, "text": "拉开房门。", "en": "I opened the door."}, {"start": 367.19, "end": 368.99, "text": "外面站着的。", "en": "Standing outside."}, {"start": 368.99, "end": 371.69, "text": "是一宿没睡的周煜。", "en": "Was Zhou Yu, who hadn't slept all night."}, {"start": 371.69, "end": 389.39, "text": "看见我，他露出一抹「果然如此」的笑，低声道：「姐姐，我就知道你醒了。你们这种上了年纪的女人，是不是都特别注重养生啊？」", "en": "Seeing me, he gave an “as I expected” smile and said quietly, “Sis, I knew you were awake. Do women your age all pay such attention to staying healthy?”"}, {"start": 389.39, "end": 392.4, "text": "我面无表情地看着他。", "en": "I looked at him expressionlessly."}, {"start": 392.4, "end": 396.3, "text": "一个「滚」字即将脱口而出。", "en": "The word “get lost” was about to escape my mouth."}, {"start": 396.3, "end": 404.4, "text": "下一刻，周煜却轻车熟路地走了进来，还将我一把搂进怀里。", "en": "The next moment, Zhou Yu walked in as if he knew the place well and pulled me into his arms."}, {"start": 404.4, "end": 409.5, "text": "被触碰到的肌肤瞬间生起滚烫的热意。", "en": "The skin he touched instantly burned with heat."}, {"start": 409.5, "end": 417.0, "text": "青年的下巴搁在我的发顶，半眯着眼睛，语气懒洋洋的。", "en": "The young man's chin rested on the top of my head, his eyes half-closed, his tone lazy."}, {"start": 417.0, "end": 422.38, "text": "「姐姐，才一晚上不见，我就好想你。」", "en": "“Sis, after just one night apart, I already miss you so much.”"}]}, {"title": "什么算是人生的顶级享受？ — 第1楼（20句，3:21）", "mp3": "test-zhihu-top-enjoyment/audio.mp3", "dur": "3:21", "lines": [{"start": 0.0, "end": 17.33, "text": "我是个小的不能再小的老板，公司从事农业，所以有一群给我干农活的阿姨，她们都是本地最淳朴的那一波农村人，没有受过什么教育，拿着最低的待遇，面对最毒辣的太阳，无论风吹日晒，都做着最原始的农事。", "en": "I'm the smallest boss you can imagine. My company works in agriculture, so I have a group of aunties doing farm work for me. They are the most down-to-earth local country folk, with little education, earning the lowest pay, facing the harshest sun, and doing the most basic farm work in all weather."}, {"start": 17.33, "end": 22.66, "text": "每天准时上班按时下班，没有休息，却也勤勤恳恳。", "en": "They clock in and out on time every day, with no days off, yet they work diligently."}, {"start": 22.66, "end": 28.54, "text": "我平时来去匆匆好像和他们交集不多，并没有太多的了解和交情。", "en": "I usually come and go in a hurry, so I didn't interact with them much, and didn't really know them or have much of a relationship with them."}, {"start": 28.54, "end": 37.97, "text": "前几年企业状态不是很好，所以过往三八妇女节公司里都是只考虑到管理层女性的福利，没有想过这些阿姨。", "en": "A few years ago the business wasn't doing well, so on past Women's Days the company only thought about benefits for women in management, never about these aunties."}, {"start": 37.97, "end": 48.65, "text": "今年三八节当天，恰巧我也在公司，因为又有订单，于是让阿姨他们加班到很晚，但和无数个普通的日夜一样，他们依然按时按质的完成所有的工作。", "en": "This Women's Day, I happened to be at the company, and because there was another order, I had the aunties work overtime late into the night. But just like countless ordinary days and nights, they still finished all the work on time and to standard."}, {"start": 48.65, "end": 61.18, "text": "看着他们拖着疲劳的身体，在下班后背上自己的锄头和劳动工具，还要在漆黑的乡下夜晚里步行几公里回家，突然我觉得作为老板有一丝过分和愧疚感。", "en": "Watching them drag their tired bodies home after work, carrying their hoes and tools on their backs, and still having to walk several kilometres home in the pitch-dark countryside night, I suddenly felt, as their boss, a little excessive and guilty."}, {"start": 61.18, "end": 72.86, "text": "于是三八节第二天，我决定改变一下，包了一张大巴车，包了一个温泉山庄，定了几桌饭，给这些阿姨算正常考勤，然后带着他们出游了high了一整天。", "en": "So the day after Women's Day, I decided to change things. I chartered a bus, booked a hot-spring resort, reserved several tables for dinner, counted the day as normal attendance for these aunties, and took them out for a whole day of fun."}, {"start": 72.86, "end": 86.54, "text": "在这一天里，这些平日素面朝天的阿姨翻遍了衣柜，穿上了自己最漂亮的衣服，甚至涂上了口红，一路吹着口哨唱着歌，那些他们几年都没更新过的朋友圈，一天之内如同直播一般的推送。", "en": "On that day, these aunties who normally go without makeup searched through their wardrobes, put on their prettiest clothes, even applied lipstick, and whistled and sang all the way there. Their social media feeds, untouched for years, were updated that day like a live broadcast."}, {"start": 86.54, "end": 93.91, "text": "他们也狠下心，给自己买了最红最艳的泳衣，漂亮的在泳池里用手机留着纪念。", "en": "They also treated themselves and bought the reddest, brightest swimsuits, and took beautiful photos with their phones in the pool as keepsakes."}, {"start": 93.91, "end": 101.18, "text": "我长这么大，该见的也见过了，但老阿姨比基尼派对也是第一次参加，哈哈。", "en": "I've seen a lot in my life, but an aunties' bikini party was a first for me, haha."}, {"start": 101.18, "end": 106.99, "text": "活动结束后的几天内，他们见到我，都会情不自禁眉飞色舞的回忆那一天。", "en": "In the days after the outing, whenever they saw me, they couldn't help but recall that day with great excitement."}, {"start": 106.99, "end": 115.8, "text": "有的人说这是她第一次泡温泉，有的人说这是她最近几年最快乐的一天，有的人甚至把那天的乡村比基尼自拍换成了微信头像。", "en": "Some said it was their first time in a hot spring, some said it was their happiest day in recent years, and some even changed their profile photo to that day's countryside bikini selfie."}, {"start": 115.8, "end": 121.87, "text": "在交谈中，我甚至发现我竟然叫不全他们的名字，纵使他们已经跟着我做了好几年。", "en": "In talking with them, I even discovered that I couldn't name all of them, even though they had worked with me for years."}, {"start": 121.87, "end": 125.35, "text": "但也是这次活动，感觉我和他们距离又拉进了跟多。", "en": "But through this outing, I felt the distance between us had closed a lot more."}, {"start": 125.35, "end": 154.68, "text": "后来了解了一些他们的故事，有的人在省吃俭用给大城市的儿子还房贷，有的人在节衣缩食照顾一家老小，也有人下班后还要回家干农活补贴家用，曾经她们也风华正茂，美丽动人，只是时间和生活淹没了他们的自我和快乐，也许一年到头他们都不会有属于自己的一天，或是一个节日，但很开心成为了那个让他们拥有节日且给予他们快乐的人，这是一种顶配的人生享受，真的。", "en": "Later I learned some of their stories. Some scrimp and save to help their sons pay mortgages in big cities, some live frugally to care for their whole families, and some still do farm work after work to supplement the household income. They were once young and beautiful too, but time and life buried their sense of self and their joy. Maybe for a whole year they never get a single day, or a festival, that belongs to them. I'm so glad I became the person who gave them a festival and a day of happiness. That is truly a top-tier enjoyment of life."}, {"start": 154.68, "end": 163.56, "text": "赚钱让自己花前月下，让自己豪车美女是一种享受方式，当然我相信让老阿姨开心也是。", "en": "Making money to enjoy romance, luxury cars and beautiful company is one way to enjoy life, and of course I believe making these aunties happy is another."}, {"start": 163.56, "end": 182.76, "text": "我很享受收到这些最质朴劳动人民的认可，在三八节能用不到一顿商务宴请的费用，却兑现到了十多个美丽女性快乐的一整天，让他们短暂的忘记了自己是员工，是母亲是儿女是妻子，而记起来了自己是自己。", "en": "I really enjoy earning the recognition of these most down-to-earth working people. On Women's Day, for less than the cost of one business dinner, I delivered a whole happy day to more than ten beautiful women, letting them briefly forget that they are employees, mothers, daughters and wives, and remember that they are themselves."}, {"start": 182.76, "end": 188.33, "text": "我也决定如果我公司没倒闭，往后每一年都坚持这些福利吧。", "en": "I've also decided that if my company doesn't go under, I will keep these benefits going every year from now on."}, {"start": 188.33, "end": 193.08, "text": "与其花呗会所渡佳丽，不如关心身边自己人。", "en": "Rather than spending on fancy clubs and companions, better to care for the people around you."}, {"start": 193.08, "end": 201.07, "text": "谢谢各位精神股东的支持，老规矩，如有一天有幸我能敲钟 各位点赞合伙人均有干股，一言为定。", "en": "Thank you all for your support as my spiritual shareholders. As always, if one day I am fortunate enough to ring the bell, everyone who liked this will get shares. That's a promise."}]}];

speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
<script>
document.addEventListener('keydown', function(e) {
  if (e.key === 'PageDown') {
    var t = e.target;
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    var a = document.querySelector('audio');
    if (a && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      a.currentTime = Math.max(0, a.currentTime - 5);
    }
  }
});
</script>
