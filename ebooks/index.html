or even without thinking) based on material given by the outside world; they can reverse 180 degrees in the next second."}, {"start": 769.44, "end": 770.59, "text": "何为“立场？", "en": "What is a “position?"}, {"start": 770.59, "end": 775.39, "text": "”", "en": "”"}, {"start": 775.39, "end": 784.99, "text": "答：植根于每个人内心深处，最根深蒂固的“观点”，它并非不可改变，但改变的过程往往非常痛苦。", "en": "Answer: rooted deep in each person's heart, the most deep-rooted 'opinion'; it is not unchangeable, but the process of change is often very painful."}, {"start": 784.99, "end": 786.31, "text": "何为“理论”？", "en": "What is a 'theory'?"}, {"start": 786.31, "end": 792.67, "text": "答：将诸多“事实”串联在一起形成“观点”，这一逻辑过程即为“理论”。", "en": "Answer: stringing together many 'facts' to form an 'opinion'; this logical process is a 'theory'."}, {"start": 792.67, "end": 795.5, "text": "批判性思维的核心是什么？", "en": "What is the core of critical thinking?"}, {"start": 795.5, "end": 798.74, "text": "是评估，是一种不断逼近真相的活动，", "en": "It is evaluation, an activity of constantly approaching the truth."}, {"start": 798.74, "end": 807.82, "text": "对别人吐出的每一句话，你需要问自己，这里面哪些是“事实”，哪些是对方的“观点”，是否预设了某种“立场”，是否串联成某种“理论”，", "en": "For every sentence others utter, you need to ask yourself: which parts are 'facts', which are the other party's 'opinions', whether some 'position' is presupposed, and whether they are strung together into some 'theory'."}, {"start": 807.82, "end": 817.01, "text": "若你发现某些博主，永远只强调“观点”和“立场”，毫无“事实”的成分，看第一条建议，不要让TA出现在自己的信息流里。", "en": "If you find that certain bloggers always emphasise only 'opinions' and 'positions', with no 'fact' component at all, see the first suggestion: do not let them appear in your information flow."}, {"start": 817.01, "end": 821.69, "text": "6、建立交叉验证的意识，兼听则明，", "en": "6. Establish awareness of cross-validation: listening to both sides makes you wise."}, {"start": 821.69, "end": 827.88, "text": "比如你想了解某个历史事件，假使有3个利益相关方ABC，你只有3个小时，", "en": "For example, if you want to understand a historical event, suppose there are 3 stakeholders A, B and C, and you have only 3 hours."}, {"start": 827.88, "end": 848.45, "text": "那最佳策略是——找到3份分别由A、B、C关于这一事件出具的资料，将他们所说的事实互相映证，将他们的观点互相对比，", "en": "Then the best strategy is — find 3 documents issued by A, B and C respectively about this event, verify the facts they state against each other, and compare their views with each other."}, {"start": 848.45, "end": 852.22, "text": "而不是把所有时间都用来看A这边的人出具的资料。", "en": "Rather than spending all your time reading documents issued by people on A's side."}, {"start": 852.22, "end": 859.42, "text": "换言之，有意识地让自己站在不同立场上看待同一个问题，才可能逼近事情的全貌。", "en": "In other words, consciously standing on different positions to view the same problem is what may bring you closer to the full picture."}, {"start": 859.42, "end": 863.69, "text": "欢迎加入理工生职场破局圈，理解职场的底层逻辑～", "en": "Welcome to join the Science-and-Engineering Students' Workplace Breakthrough Circle, and understand the underlying logic of the workplace~"}, {"start": 863.69, "end": 865.85, "text": "理工生职场破局", "en": "Science-and-Engineering Students' Workplace Breakthrough"}, {"start": 865.85, "end": 869.14, "text": "关注 @晏北 ，理解芯片与经济~", "en": "Follow @Yanbei, and understand chips and the economy~"}]}, {"title": "怎样避免活在信息茧房之中？ Part 8（422句，24:40）", "mp3": "upload-8-part08/audio.mp3", "dur": "24:40", "lines": [{"start": 0.0, "end": 4.87, "text": "我有一个习惯，就是隔段时间就调教一下网易云，B站，知乎。", "en": "I have a habit: every so often I tweak NetEase Cloud Music, Bilibili and Zhihu."}, {"start": 4.87, "end": 8.83, "text": "怎么调教呢，就是搜索与我喜好完全相反的东西。", "en": "How do I tweak them? By searching for things completely opposite to my preferences."}, {"start": 8.83, "end": 18.98, "text": "虽然调教过后会有一段时间打开新世界大门，但毕竟还是压根不喜欢，过一段时间就会恢复成原来的样子，所以每隔一段时间就得调教一次。", "en": "Although after tweaking, there is a period of opening the door to a new world, I still fundamentally do not like those things, and after a while it reverts to the way it was, so I have to tweak it again every so often."}, {"start": 18.98, "end": 26.9, "text": "说点我自己的经验之谈，虽然可能未必正确，但是也足够给读者们提供一些借鉴和参考的角度。", "en": "Let me share some of my own experience. It may not necessarily be correct, but it is enough to offer readers some angles for reference."}, {"start": 26.9, "end": 32.3, "text": "1、不管用什么方式，一定要维持皮质醇的相对低水平以及情绪的稳定。", "en": "1. No matter what method you use, maintain relatively low cortisol levels and emotional stability."}, {"start": 32.3, "end": 55.22, "text": "很多人之所以难以突破信息茧房本身，除了正能量教育之外，还在于注意力被过分的占用，也就是“情绪被各种自媒体逗猫棒挑动”，导致整个人一直处于情绪的过山车模式之下，你说这你还怎么静心筛选信息、整合有用的内容、怎么去具体执行修正、怎么复盘交流、怎么最终拿到结果呢？", "en": "Many people find it hard to break out of the information cocoon not only because of positive-energy education, but also because their attention is excessively occupied — that is, 'emotions being teased by various self-media cat teasers', leaving the whole person in emotional roller-coaster mode. How, then, can you calmly filter information, integrate useful content, concretely execute corrections, review and exchange, and finally get results?"}, {"start": 55.22, "end": 61.03, "text": "答案是不可能，你只想“赢”，只想让自己支持的某个观点、某个“赛博偶像”赢下去。", "en": "The answer is: impossible. You only want to 'win', only want some view you support, some 'cyber idol', to keep winning."}, {"start": 61.03, "end": 67.44, "text": "2、尽可能保证自己有“质疑的能力”、“搜寻信息的能力”、“增加信息渠道的能力”。", "en": "2. Ensure as much as possible that you have the 'ability to question', the 'ability to search for information', and the 'ability to increase information channels'."}, {"start": 67.44, "end": 76.85, "text": "顾名思义，很多过去20年、15年前有价值的信息，当时被发布在互联网上，如今已经“销声匿迹”。", "en": "As the name implies, much information that was valuable 20 years ago, 15 years ago, published on the internet at the time, has now 'vanished without a trace'."}, {"start": 76.85, "end": 83.28, "text": "大家打开搜索引擎、短视频平台搜到的到底是什么，现在只能说懂得都懂。", "en": "What everyone finds when they open search engines and short-video platforms today — well, those who understand, understand."}, {"start": 83.28, "end": 92.83, "text": "那么如何拓宽信息渠道、不要人云亦云、怎么在搜集到的信息里整合出对自己有用的，就需要结合自己的生存实际来看了。", "en": "So how to broaden information channels, avoid parroting others, and integrate useful information from what you gather — that depends on your actual survival situation."}, {"start": 92.83, "end": 99.6, "text": "3、提高自己社交能力，在现实里增加“和真人社交过程里获得信息的能力”", "en": "3. Improve your social skills, and increase in real life your 'ability to obtain information through socialising with real people'."}, {"start": 99.6, "end": 102.29, "text": "关于这一点我还是很有发言权的。", "en": "On this point I am quite qualified to speak."}, {"start": 102.29, "end": 121.37, "text": "无他，我长期就在做田野调查和案例样本收集，基于对个体生存的观摩、成败经验的总结、与具体个人所进行交流过程中的信息互换，就能总结提炼出很多真正站得住脚、有说服力的结论，而这些结论往往是“反直觉”的。", "en": "For no other reason than that I have long been doing field surveys and case sample collection. Based on observing individual survival, summarising success and failure experiences, and exchanging information in conversations with specific individuals, I can summarise and refine many conclusions that truly hold up and are persuasive — and these conclusions are often 'counterintuitive'."}, {"start": 121.37, "end": 144.89, "text": "比如女性用脚投票去大城市、比如流量池效应、比如颜值红利还在扩大、比如躺润骗卷四字真经的提出，无一不是我大量田野调查之后，系统性在知乎总结阐述和落笔形成文字过程中诞生的，老读者们都知道这些东西到底有没有价值、对自己有什么指导性功能。", "en": "For example, women voting with their feet for big cities, the traffic pool effect, the expanding good-looks dividend, and the four-character mantra of lying flat, profiting, deceiving and involuting — none of these were born without my extensive field surveys and the systematic process of summarising, expounding and writing them on Zhihu. Long-time readers know whether these things have value and what guiding function they have for them."}, {"start": 144.89, "end": 173.86, "text": "由于现在原子化进程下，人和人之间信任的崩溃，社交环节里的沟通成本其实上升了很多，那么对于个体而言，“脱口秀能力”其实非常非常重要——短时间内通过合理的沟通，让对方信任自己、愿意升级和推进关系，这不仅仅是局限于男女之间，更多的也可以适用于销售、职场等多个场景下，而且由于现在原子人的情绪过于极端化，更加剧了社交能力的退化。", "en": "Because under today's atomisation, the collapse of trust between people has actually raised the cost of communication in social settings, so for individuals, 'talk-show ability' is actually very, very important — using reasonable communication in a short time to make the other party trust you and be willing to upgrade and advance the relationship. This is not limited to between men and women; it can also apply to sales, the workplace and many other scenarios. And because today's atomised people have overly extreme emotions, the degradation of social skills is further aggravated."}, {"start": 173.86, "end": 179.02, "text": "尤其是我在和一些女性咨询者接触的过程中，体会的尤其深。", "en": "I feel this especially deeply in my contact with some female advisees."}, {"start": 179.02, "end": 203.21, "text": "现在男女对立加剧以后，很多人把情绪带到线下开始整活，最后就是自己既压抑、又解决不了需求、还搞得别人也很难受，当然肯定有人要嘴硬说双输好过单赢，都这么说的人，不用回应了其实，只需要让他去赢就好了，毕竟正常人的社交是在合理成本之下，怎么开心怎么来，学会筛选很重要。", "en": "Now that gender antagonism has intensified, many people bring their emotions offline and start making trouble, and in the end they themselves are both repressed and unable to solve their needs, while also making others very uncomfortable. Of course, some people will stubbornly say that a lose-lose is better than a single win. For people who say that, there is no need to respond, really — just let them win. After all, normal people's socialising is about having fun at reasonable cost, and learning to filter is important."}, {"start": 203.21, "end": 225.6, "text": "一旦增强社交能力，你就会发现，你在线下接触的三教九流、不同圈子和行业的人，其实都能提供大量鲜活的生存范本，所以我一直强调销售是个好岗位，可以在相对短的时间内调动和锻炼人的社交能力、脱口秀能力、临场反应能力，都是对个人发展非常有帮助的。", "en": "Once you strengthen your social skills, you will find that the all kinds of people you meet offline, from different circles and industries, can actually provide a large number of vivid survival models. That is why I have always stressed that sales is a good position: in a relatively short time it can mobilise and train a person's social skills, talk-show ability and on-the-spot responsiveness, all of which are very helpful for personal development."}, {"start": 225.6, "end": 240.43, "text": "而线下的真实信息收集，能够很大程度上避免信息茧房——要不说有个概念叫“脱产玩网人”，说的就是纯扣字的小鬼，对现实生活缺乏感知和实践。", "en": "And offline real information collection can largely avoid the information cocoon — there is a concept called 'people who play online detached from production', referring to little brats who just type words and lack perception of and practice in real life."}, {"start": 240.43, "end": 252.36, "text": "再一个重要的意义在于，你在现实里收集信息，一定也是基于你自己的生活圈子、生存赛道、社交辐射面开展的，这反过来对你理解自己的生存现状也很有帮助。", "en": "Another important significance is that when you collect information in reality, it is necessarily based on your own life circle, survival track and social reach — which in turn is very helpful for understanding your own survival situation."}, {"start": 252.36, "end": 273.05, "text": "信息茧房不是这个时代独有的东西，只是自媒体和短视频放大了这种“楚门的世界”所呈现的恐怖效应和对人的影响，过于恐慌和焦虑倒也不必，只需要多想办法找找信息渠道、多去接纳和倾听不同的信息源所传递的内容，相信能发现和过去仅仅从短视频就“知晓天下事”完全不同的认知。", "en": "The information cocoon is not unique to this era; it is just that self-media and short videos have amplified the terrifying effect of this 'Truman Show' world and its impact on people. There is no need for excessive panic and anxiety; just think of more ways to find information channels, and accept and listen to content delivered by different information sources. I believe you will discover a cognition completely different from merely 'knowing the world's affairs' from short videos in the past."}, {"start": 273.05, "end": 276.24, "text": "交叉验证是个好东西，希望读者们多用用。", "en": "Cross-validation is a good thing; I hope readers use it more."}, {"start": 276.24, "end": 277.49, "text": "随便说说，就这。", "en": "Just saying casually, that is all."}, {"start": 277.49, "end": 280.49, "text": "很简单啊，按照下面这个日程来就可以了：", "en": "It is very simple; just follow this schedule:"}, {"start": 280.49, "end": 289.61, "text": "周一看CNN，周二看Fox news，周三卫报，周四新闻联播，周五太阳报，周六查理周刊，周日半岛电视台。", "en": "Monday CNN, Tuesday Fox News, Wednesday The Guardian, Thursday Xinwen Lianbo, Friday The Sun, Saturday Charlie Hebdo, Sunday Al Jazeera."}, {"start": 289.61, "end": 302.74, "text": "如果还觉得不够的话，美国的纽约时报，华尔街日报和华盛顿邮报，英国的泰晤士报和每日邮报，法国的费加罗报和解放报，香港的明报和大公报都可以纳入考虑哦。", "en": "If that still feels insufficient, America's New York Times, Wall Street Journal and Washington Post, Britain's The Times and Daily Mail, France's Le Figaro and Libération, and Hong Kong's Ming Pao and Ta Kung Pao can all be considered."}, {"start": 302.74, "end": 306.86, "text": "当然也不能忘了人民日报和环球时报这对官媒大小王。", "en": "And of course, do not forget People's Daily and Global Times, the big and small kings of official media."}, {"start": 306.86, "end": 310.03, "text": "缺点可能就是会左右脑互搏和精神分裂了吧。", "en": "The downside might be left-brain-right-brain fighting and schizophrenia."}, {"start": 310.03, "end": 313.56, "text": "举个例子，多下几个app看信息", "en": "For example, download a few more apps to read information."}, {"start": 313.56, "end": 318.43, "text": "据统计，小红书2026年有23万人拒了腾讯的offer", "en": "According to statistics, in 2026, 230,000 people on Xiaohongshu rejected Tencent's offers."}, {"start": 318.43, "end": 321.24, "text": "腾讯2026年发了一万多一点offer", "en": "Tencent issued just over 10,000 offers in 2026."}, {"start": 321.24, "end": 324.05, "text": "我先说一个可能有点扎心的结论：", "en": "Let me first state a conclusion that may sting a little:"}, {"start": 324.05, "end": 343.97, "text": "如果你最近明显感觉到，短视频越刷越像、新闻越看越顺眼、观点越来越符合自己，甚至你开始觉得“网上大多数正常人都和我想得差不多”——那你大概率已经住进信息茧房里了。", "en": "If you have recently clearly felt that short videos look more and more alike, news looks more and more pleasing, and views increasingly match your own — even starting to feel that 'most normal people online think like me' — then you have most likely already moved into an information cocoon."}, {"start": 343.97, "end": 346.01, "text": "而且，别急着怪自己。", "en": "And do not rush to blame yourself."}, {"start": 346.01, "end": 351.65, "text": "因为今天的信息平台，本来就不是以“让你全面认识世界”为第一目标设计的。", "en": "Because today's information platforms were not designed with 'letting you comprehensively understand the world' as their first goal."}, {"start": 351.65, "end": 353.62, "text": "它更关心的是另一件事：", "en": "What they care more about is something else:"}, {"start": 353.62, "end": 354.77, "text": "怎么让你别走。", "en": "How to keep you from leaving."}, {"start": 354.77, "end": 356.88, "text": "你喜欢什么，就继续给你什么。", "en": "Whatever you like, they keep giving you more of it."}, {"start": 356.88, "end": 359.59, "text": "你愤怒什么，就反复刺激你什么。", "en": "Whatever angers you, they repeatedly stimulate it."}, {"start": 359.59, "end": 362.88, "text": "你赞同什么，就不断找证据证明你是对的。", "en": "Whatever you agree with, they keep finding evidence to prove you right."}, {"start": 362.88, "end": 366.41, "text": "久而久之，我们会产生一个非常危险的错觉：", "en": "Over time, we develop a very dangerous illusion:"}, {"start": 366.41, "end": 369.77, "text": "我看到的世界，就是世界本身。", "en": "The world I see is the world itself."}, {"start": 369.77, "end": 378.96, "text": "但实际上，你看到的，可能只是算法根据你的点击、停留、点赞、收藏和评论，给你私人定制的一个“世界切片”。", "en": "But in fact, what you see may just be a 'world slice' privately customised for you by algorithms based on your clicks, dwell time, likes, favourites and comments."}, {"start": 378.96, "end": 381.07, "text": "一、什么是信息茧房？", "en": "I. What is an information cocoon?"}, {"start": 381.07, "end": 383.23, "text": "简单说，信息茧房就是：", "en": "Simply put, an information cocoon is:"}, {"start": 383.23, "end": 393.48, "text": "你长期接触的信息，越来越集中在自己熟悉、喜欢、认同的范围内，最终像蚕一样，被自己偏好的信息一层一层包起来。", "en": "Information you are exposed to over a long time becomes increasingly concentrated within the range you are familiar with, like and agree with, until, like a silkworm, you are wrapped layer by layer by information you prefer."}, {"start": 393.48, "end": 395.23, "text": "比如你开始刷减肥视频。", "en": "For example, you start watching weight-loss videos."}, {"start": 395.23, "end": 398.83, "text": "你看了几个“碳水害人”的内容，停留时间比较长。", "en": "You watched a few pieces of 'carbs are harmful' content and lingered relatively long."}, {"start": 398.83, "end": 400.58, "text": "接下来平台开始给你推：", "en": "Next, the platform starts pushing to you:"}, {"start": 400.58, "end": 403.51, "text": "“戒掉碳水，我瘦了30斤。", "en": "“Quit carbs, and I lost 30 jin."}, {"start": 403.51, "end": 408.31, "text": "”", "en": "”"}, {"start": 408.31, "end": 411.38, "text": "“为什么中国人胖，都是因为米饭吃太多。", "en": "“Why Chinese people are fat: all because they eat too much rice."}, {"start": 411.38, "end": 416.18, "text": "”", "en": "”"}, {"start": 416.18, "end": 418.3, "text": "“主食才是肥胖元凶。", "en": "“Staple foods are the culprit of obesity."}, {"start": 418.3, "end": 423.1, "text": "”", "en": "”"}, {"start": 423.1, "end": 427.7, "text": "再过两周，你打开手机一看，会发现全世界似乎都在反对碳水。", "en": "Two weeks later, when you open your phone, you will find that the whole world seems to be against carbs."}, {"start": 427.7, "end": 429.55, "text": "然后有一天，有人告诉你：", "en": "Then one day, someone tells you:"}, {"start": 429.55, "end": 434.3, "text": "“其实肥胖核心还是长期能量过剩，碳水本身并不是原罪。", "en": "“Actually, the core of obesity is still long-term energy surplus; carbs themselves are not the original sin."}, {"start": 434.3, "end": 439.1, "text": "”", "en": "”"}, {"start": 439.1, "end": 442.75, "text": "你第一反应可能不是思考，而是：", "en": "Your first reaction may not be to think, but:"}, {"start": 442.75, "end": 444.19, "text": "这人怎么还在洗地？", "en": "Why is this person still whitewashing?"}, {"start": 444.19, "end": 445.34, "text": "问题来了。", "en": "Here comes the question."}, {"start": 445.34, "end": 450.07, "text": "到底是世界都这么认为，还是你的首页只剩下这么认为的人？", "en": "Is it that the whole world thinks this way, or is it that your homepage only has people left who think this way?"}, {"start": 450.07, "end": 452.76, "text": "这就是信息茧房最厉害的地方。", "en": "This is the most powerful thing about the information cocoon."}, {"start": 452.76, "end": 455.52, "text": "它不会在屏幕上弹出来提醒你：", "en": "It will not pop up on the screen to remind you:"}, {"start": 455.52, "end": 460.03, "text": "“您好，您现在看到的只是经过个性化过滤后的世界。", "en": "“Hello, what you are seeing now is only the world after personalised filtering."}, {"start": 460.03, "end": 464.83, "text": "”", "en": "”"}, {"start": 464.83, "end": 466.56, "text": "它反而会让你感觉：", "en": "Instead, it will make you feel:"}, {"start": 466.56, "end": 470.4, "text": "“我已经看了这么多内容，事实难道还不够明显吗？", "en": "“I have already seen so much content; surely the facts are obvious enough?"}, {"start": 470.4, "end": 475.2, "text": "”", "en": "”"}, {"start": 475.2, "end": 479.71, "text": "二、生活中有哪些现象，说明你可能已经进入信息茧房？", "en": "II. What phenomena in life indicate you may have entered an information cocoon?"}, {"start": 479.71, "end": 481.32, "text": "其实非常容易判断。", "en": "It is actually very easy to judge."}, {"start": 481.32, "end": 484.56, "text": "1. 你刷到的内容开始高度重复", "en": "1. The content you scroll through starts to repeat highly."}, {"start": 484.56, "end": 487.37, "text": "比如你关注职场焦虑，首页全是：", "en": "For example, if you follow workplace anxiety, your homepage is all:"}, {"start": 487.37, "end": 488.81, "text": "“35岁失业。", "en": "“Unemployed at 35."}, {"start": 488.81, "end": 493.61, "text": "”", "en": "”"}, {"start": 493.61, "end": 495.1, "text": "“大厂裁员。", "en": "“Big companies laying off."}, {"start": 495.1, "end": 499.9, "text": "”", "en": "”"}, {"start": 499.9, "end": 501.41, "text": "“普通人根本没有出路。", "en": "“Ordinary people have no way out at all."}, {"start": 501.41, "end": 506.21, "text": "”", "en": "”"}, {"start": 506.21, "end": 507.77, "text": "“经济越来越差。", "en": "“The economy is getting worse and worse."}, {"start": 507.77, "end": 512.57, "text": "”", "en": "”"}, {"start": 512.57, "end": 515.26, "text": "刷久以后，你真的会觉得所有人都在失业。", "en": "After scrolling for a long time, you will really feel that everyone is unemployed."}, {"start": 515.26, "end": 517.94, "text": "但你换一个账号，可能看到的却是：", "en": "But if you switch to another account, you might see:"}, {"start": 517.94, "end": 521.14, "text": "“今年跳槽涨薪50%。", "en": "“Switched jobs this year with a 50% raise."}, {"start": 521.14, "end": 525.94, "text": "”", "en": "”"}, {"start": 525.94, "end": 527.57, "text": "“年轻人出海创业。", "en": "“Young people starting businesses overseas."}, {"start": 527.57, "end": 532.37, "text": "”", "en": "”"}, {"start": 532.37, "end": 535.2, "text": "“某行业人才严重短缺。", "en": "“A certain industry is severely short of talent."}, {"start": 535.2, "end": 540.0, "text": "”", "en": "”"}, {"start": 540.0, "end": 545.35, "text": "同一个时代，两个人的手机里，可能生活着两个完全不同的中国。", "en": "In the same era, two people's phones may hold two completely different Chinas."}, {"start": 545.35, "end": 548.71, "text": "2. 你越来越难刷到真正让自己不舒服的观点", "en": "2. You find it increasingly hard to scroll to views that truly make you uncomfortable."}, {"start": 548.71, "end": 550.87, "text": "这其实是一个非常重要的信号。", "en": "This is actually a very important signal."}, {"start": 550.87, "end": 553.7, "text": "因为人天然喜欢听自己认同的话。", "en": "Because people naturally like to hear what they agree with."}, {"start": 553.7, "end": 556.87, "text": "一个观点如果符合你的认知，你会觉得：", "en": "If a view matches your cognition, you will feel:"}, {"start": 556.87, "end": 558.26, "text": "“说得太对了。", "en": "“So true."}, {"start": 558.26, "end": 563.06, "text": "”", "en": "”"}, {"start": 563.06, "end": 565.03, "text": "“终于有人敢说真话。", "en": "“Finally someone dares to tell the truth."}, {"start": 565.03, "end": 569.83, "text": "”", "en": "”"}, {"start": 569.83, "end": 573.07, "text": "但一个观点如果挑战你，你会本能地划走。", "en": "But if a view challenges you, you will instinctively scroll past it."}, {"start": 573.07, "end": 574.75, "text": "算法很快就学会了：", "en": "The algorithm quickly learns:"}, {"start": 574.75, "end": 577.03, "text": "这个人喜欢什么，讨厌什么。", "en": "What this person likes, and what they dislike."}, {"start": 577.03, "end": 579.62, "text": "于是慢慢地，你看到的世界越来越舒服。", "en": "So slowly, the world you see becomes more and more comfortable."}, {"start": 579.62, "end": 580.94, "text": "可问题是：", "en": "But the problem is:"}, {"start": 580.94, "end": 583.75, "text": "现实世界本来就不应该这么舒服。", "en": "The real world should not be this comfortable in the first place."}, {"start": 583.75, "end": 589.44, "text": "如果你每天获取的信息，都在证明你原来的观点是正确的，那么有两种可能：", "en": "If the information you obtain every day is all proving that your original views are correct, then there are two possibilities:"}, {"start": 589.44, "end": 592.2, "text": "第一，你是百年一遇的天才。", "en": "First, you are a once-in-a-century genius."}, {"start": 592.2, "end": 594.89, "text": "第二，算法把反对意见都给你过滤掉了。", "en": "Second, the algorithm has filtered out all opposing opinions for you."}, {"start": 594.89, "end": 596.28, "text": "通常是第二种。", "en": "Usually it is the second."}, {"start": 596.28, "end": 599.45, "text": "3. 你开始觉得“正常人都这么想”", "en": "3. You start to feel that 'normal people all think this way'."}, {"start": 599.45, "end": 602.26, "text": "这是信息茧房最典型的症状之一。", "en": "This is one of the most typical symptoms of the information cocoon."}, {"start": 602.26, "end": 603.1, "text": "比如：", "en": "For example:"}, {"start": 603.1, "end": 605.09, "text": "“现在年轻人谁还结婚？", "en": "“Who among young people still gets married nowadays?"}, {"start": 605.09, "end": 609.89, "text": "”", "en": "”"}, {"start": 609.89, "end": 611.33, "text": "“现在谁还买房？", "en": "“Who still buys a house nowadays?"}, {"start": 611.33, "end": 616.13, "text": "”", "en": "”"}, {"start": 616.13, "end": 617.4, "text": "“现在大家都不生孩子。", "en": "“Nowadays nobody has children."}, {"start": 617.4, "end": 622.2, "text": "”", "en": "”"}, {"start": 622.2, "end": 623.83, "text": "“现在有钱人都润了。", "en": "“Nowadays all the rich people have fled abroad."}, {"start": 623.83, "end": 628.63, "text": "”", "en": "”"}, {"start": 628.63, "end": 630.43, "text": "“现在年轻人都躺平。", "en": "“Nowadays young people all lie flat."}, {"start": 630.43, "end": 635.23, "text": "”", "en": "”"}, {"start": 635.23, "end": 639.19, "text": "注意，这些说法有时候可能反映了一部分现实。", "en": "Note: these claims sometimes may reflect part of reality."}, {"start": 639.19, "end": 640.46, "text": "但问题在于：", "en": "But the problem is:"}, {"start": 640.46, "end": 648.58, "text": "“我身边”“我首页”“我关注的人”，不等于整个社会。", "en": "“People around me”, “my homepage”, “people I follow” do not equal the whole of society."}, {"start": 648.58, "end": 654.14, "text": "当你大量接触某一类人之后，就很容易高估这类人在现实中的比例。", "en": "When you are exposed to a large number of one type of people, it is easy to overestimate the proportion of such people in reality."}, {"start": 654.14, "end": 661.58, "text": "这和你在医学中心工作久了，会觉得周围到处都是病人，是一个道理。", "en": "This is the same logic as working in a medical centre for a long time and feeling that patients are everywhere around you."}, {"start": 661.58, "end": 665.14, "text": "你看到的是一个经过筛选的样本，不是总体。", "en": "What you see is a filtered sample, not the whole population."}, {"start": 665.14, "end": 669.7, "text": "4. 你对某些群体形成了非常简单粗暴的印象", "en": "4. You have formed a very simple and crude impression of certain groups."}, {"start": 669.7, "end": 670.54, "text": "比如：", "en": "For example:"}, {"start": 670.54, "end": 672.22, "text": "“有钱人都是靠关系。", "en": "“Rich people all rely on connections."}, {"start": 672.22, "end": 677.02, "text": "”", "en": "”"}, {"start": 677.02, "end": 678.94, "text": "“穷人都是因为不努力。", "en": "“Poor people are all poor because they do not work hard."}, {"start": 678.94, "end": 683.74, "text": "”", "en": "”"}, {"start": 683.74, "end": 685.73, "text": "“医生都只想着赚钱。", "en": "“Doctors only think about making money."}, {"start": 685.73, "end": 690.53, "text": "”", "en": "”"}, {"start": 690.53, "end": 691.92, "text": "“病人都不讲道理。", "en": "“Patients are all unreasonable."}, {"start": 691.92, "end": 696.72, "text": "”", "en": "”"}, {"start": 696.72, "end": 698.28, "text": "“年轻人都吃不了苦。", "en": "“Young people cannot endure hardship."}, {"start": 698.28, "end": 703.08, "text": "”", "en": "”"}, {"start": 703.08, "end": 704.57, "text": "“老年人都固执。", "en": "“Old people are all stubborn."}, {"start": 704.57, "end": 709.37, "text": "”", "en": "”"}, {"start": 709.37, "end": 716.21, "text": "当一个复杂群体，在你的认知里只剩下一两个标签时，往往不是因为世界变简单了。", "en": "When a complex group is reduced in your cognition to just one or two labels, it is often not because the world has become simpler."}, {"start": 716.21, "end": 719.62, "text": "而是因为你长期接受了高度同质化的信息。", "en": "But because you have long accepted highly homogeneous information."}, {"start": 719.62, "end": 722.69, "text": "真实社会最大的特点恰恰是：", "en": "The greatest characteristic of real society is precisely:"}, {"start": 722.69, "end": 723.6, "text": "复杂。", "en": "Complexity."}, {"start": 723.6, "end": 729.24, "text": "凡是一个视频能用30秒给你解释清楚一个社会问题，都应该稍微警惕一点。", "en": "Whenever a video can explain a social problem to you clearly in 30 seconds, you should be a little wary."}, {"start": 729.24, "end": 733.08, "text": "三、为什么平台会把你关进信息茧房？", "en": "III. Why do platforms lock you into an information cocoon?"}, {"start": 733.08, "end": 734.59, "text": "很多人会认为：", "en": "Many people will think:"}, {"start": 734.59, "end": 737.16, "text": "“是不是平台故意控制思想？", "en": "“Is the platform deliberately controlling thought?"}, {"start": 737.16, "end": 741.96, "text": "”", "en": "”"}, {"start": 741.96, "end": 744.65, "text": "其实大多数时候，事情没有这么阴谋论。", "en": "Actually, most of the time, things are not so conspiratorial."}, {"start": 744.65, "end": 747.34, "text": "更直接的原因只有四个字：", "en": "The more direct reason is just four words:"}, {"start": 747.34, "end": 748.73, "text": "商业效率。", "en": "Commercial efficiency."}, {"start": 748.73, "end": 751.42, "text": "平台最关心的指标，通常包括：", "en": "The metrics the platform cares most about usually include:"}, {"start": 751.42, "end": 752.5, "text": "你看了多久。", "en": "How long you watched."}, {"start": 752.5, "end": 753.62, "text": "你点了几个。", "en": "How many you clicked."}, {"start": 753.62, "end": 754.66, "text": "你有没有互动。", "en": "Whether you interacted."}, {"start": 754.66, "end": 756.5, "text": "你明天还会不会回来。", "en": "Whether you will come back tomorrow."}, {"start": 756.5, "end": 759.34, "text": "那么什么内容最容易让一个人留下来？", "en": "So what content is most likely to make a person stay?"}, {"start": 759.34, "end": 762.02, "text": "不是“最全面的信息”。", "en": "Not 'the most comprehensive information'."}, {"start": 762.02, "end": 762.82, "text": "而是：", "en": "But:"}, {"start": 762.82, "end": 764.26, "text": "他最喜欢的信息。", "en": "The information they like most."}, {"start": 764.26, "end": 767.57, "text": "你爱看美女，就继续给你美女。", "en": "If you love watching beautiful women, it keeps giving you beautiful women."}, {"start": 767.57, "end": 770.62, "text": "你爱看社会黑暗，就继续给你社会黑暗。", "en": "If you love watching society's dark side, it keeps giving you society's dark side."}, {"start": 770.62, "end": 775.42, "text": "你喜欢成功学，就天天有人告诉你“普通人翻身的底层逻辑”。", "en": "If you like success studies, every day someone tells you 'the underlying logic for ordinary people to turn their lives around'."}, {"start": 775.42, "end": 780.94, "text": "你喜欢反成功学，就天天有人告诉你“努力根本没用，都是阶级固化”。", "en": "If you like anti-success studies, every day someone tells you 'hard work is simply useless; it is all class solidification'."}, {"start": 780.94, "end": 782.54, "text": "两边都能活得很好。", "en": "Both sides can live very well."}, {"start": 782.54, "end": 785.06, "text": "因为平台不一定在乎你相信哪一种。", "en": "Because the platform does not necessarily care which one you believe."}, {"start": 785.06, "end": 786.86, "text": "平台真正关心的是：", "en": "What the platform truly cares about is:"}, {"start": 786.86, "end": 787.7, "text": "你还在看。", "en": "You are still watching."}, {"start": 787.7, "end": 791.59, "text": "所以推荐算法的逻辑天然倾向于：", "en": "So the recommendation algorithm's logic naturally tends toward:"}, {"start": 791.59, "end": 799.68, "text": "相似内容 → 更精准 → 更容易点击 → 停留更久 → 继续推荐相似内容。", "en": "Similar content → more precise → easier to click → longer dwell → continue recommending similar content."}, {"start": 799.68, "end": 802.87, "text": "从产品角度，这是成功。", "en": "From a product perspective, this is success."}, {"start": 802.87, "end": 806.64, "text": "从用户认知角度，这可能就是一个逐渐收紧的笼子。", "en": "From the user's cognitive perspective, this may be a gradually tightening cage."}, {"start": 806.64, "end": 808.8, "text": "四、为什么信息茧房非常危险？", "en": "IV. Why is the information cocoon so dangerous?"}, {"start": 808.8, "end": 812.4, "text": "因为它最可怕的后果，不是让你“少知道几个新闻”。", "en": "Because its most terrible consequence is not that you 'know a few fewer news items'."}, {"start": 812.4, "end": 815.16, "text": "而是它会慢慢改变你的判断方式。", "en": "Rather, it slowly changes your way of judging."}, {"start": 815.16, "end": 817.2, "text": "第一，你会高估自己的正确率", "en": "First, you will overestimate your accuracy rate."}, {"start": 817.2, "end": 822.43, "text": "当你接触的大部分信息都支持自己，人非常容易产生一种感觉：", "en": "When most of the information you encounter supports you, people very easily develop a feeling:"}, {"start": 822.43, "end": 824.16, "text": "“事实已经很清楚了。", "en": "“The facts are already very clear."}, {"start": 824.16, "end": 828.96, "text": "”", "en": "”"}, {"start": 828.96, "end": 830.93, "text": "然后慢慢失去一个能力：", "en": "And then slowly lose an ability:"}, {"start": 830.93, "end": 832.32, "text": "怀疑自己。", "en": "Doubting yourself."}, {"start": 832.32, "end": 835.44, "text": "真正危险的人，不一定是无知的人。", "en": "Truly dangerous people are not necessarily ignorant people."}, {"start": 835.44, "end": 840.77, "text": "而是一个只看到了20%的事实，却拥有100%确信的人。", "en": "But a person who has only seen 20% of the facts, yet possesses 100% certainty."}, {"start": 840.77, "end": 842.57, "text": "第二，你会越来越极端", "en": "Second, you will become more and more extreme."}, {"start": 842.57, "end": 845.26, "text": "因为温和观点通常没有传播力。", "en": "Because moderate views usually have no power to spread."}, {"start": 845.26, "end": 848.93, "text": "“这个问题比较复杂，需要具体情况具体分析。", "en": "“This issue is rather complex and needs case-by-case analysis."}, {"start": 848.93, "end": 853.73, "text": "”", "en": "”"}, {"start": 853.73, "end": 854.76, "text": "没人爱看。", "en": "Nobody likes to watch it."}, {"start": 854.76, "end": 855.84, "text": "但是：", "en": "But:"}, {"start": 855.84, "end": 857.76, "text": "“终于有人敢说真话了！", "en": "“Finally someone dares to tell the truth!"}, {"start": 857.76, "end": 862.56, "text": "”", "en": "”"}, {"start": 862.56, "end": 865.27, "text": "“99%的人都不知道！", "en": "“99% of people do not know this!"}, {"start": 865.27, "end": 870.07, "text": "”", "en": "”"}, {"start": 870.07, "end": 872.78, "text": "“这个群体已经彻底完了！", "en": "“This group is completely finished!"}, {"start": 872.78, "end": 877.58, "text": "”", "en": "”"}, {"start": 877.58, "end": 879.14, "text": "传播力极强。", "en": "Extremely powerful in spreading."}, {"start": 879.14, "end": 886.39, "text": "所以算法不断竞争用户注意力的结果之一，就是观点会不断向情绪化、极端化发展。", "en": "So one result of algorithms constantly competing for users' attention is that views continuously develop toward emotionalisation and extremism."}, {"start": 886.39, "end": 887.83, "text": "今天你看到：", "en": "Today you see:"}, {"start": 887.83, "end": 890.52, "text": "“这个政策可能存在一些问题。", "en": "“This policy may have some problems."}, {"start": 890.52, "end": 895.32, "text": "”", "en": "”"}, {"start": 895.32, "end": 896.88, "text": "明天就变成：", "en": "Tomorrow it becomes:"}, {"start": 896.88, "end": 898.39, "text": "“这届人彻底没救了。", "en": "“This generation of people is completely hopeless."}, {"start": 898.39, "end": 903.19, "text": "”", "en": "”"}, {"start": 903.19, "end": 904.75, "text": "后天可能就是：", "en": "The day after tomorrow it may be:"}, {"start": 904.75, "end": 906.19, "text": "“一切都是阴谋。", "en": "“Everything is a conspiracy."}, {"start": 906.19, "end": 910.99, "text": "”", "en": "”"}, {"start": 910.99, "end": 913.46, "text": "这不是因为世界每天都在变得更极端。", "en": "This is not because the world is becoming more extreme every day."}, {"start": 913.46, "end": 916.63, "text": "而是因为更极端的内容，更容易获得点击。", "en": "But because more extreme content more easily gains clicks."}, {"start": 916.63, "end": 918.98, "text": "第三，你会失去理解别人的能力", "en": "Third, you will lose the ability to understand others."}, {"start": 918.98, "end": 920.78, "text": "这是我认为最严重的问题。", "en": "This is what I consider the most serious problem."}, {"start": 920.78, "end": 926.14, "text": "当一个人长期生活在某种单一叙事里，他会慢慢无法理解：", "en": "When a person lives for a long time in a single narrative, they slowly become unable to understand:"}, {"start": 926.14, "end": 928.37, "text": "“为什么居然有人和我想得不一样？", "en": "“Why on earth would someone think differently from me?"}, {"start": 928.37, "end": 933.17, "text": "”", "en": "”"}, {"start": 933.17, "end": 934.42, "text": "最后变成：", "en": "It finally becomes:"}, {"start": 934.42, "end": 937.1, "text": "不认同我的，不是立场不同。", "en": "Those who disagree with me do not have a different position."}, {"start": 937.1, "end": 938.02, "text": "而是蠢。", "en": "They are stupid."}, {"start": 938.02, "end": 939.02, "text": "或者坏。", "en": "Or evil."}, {"start": 939.02, "end": 941.18, "text": "于是讨论消失了，只剩站队。", "en": "So discussion disappears, leaving only taking sides."}, {"start": 941.18, "end": 944.9, "text": "五、那怎么从已经形成的信息茧房里爬出来？", "en": "V. So how do you climb out of an already formed information cocoon?"}, {"start": 944.9, "end": 946.9, "text": "我觉得有一个原则特别重要：", "en": "I think one principle is especially important:"}, {"start": 946.9, "end": 949.18, "text": "不要指望算法主动把你放出来。", "en": "Do not expect the algorithm to take the initiative to release you."}, {"start": 949.18, "end": 953.14, "text": "因为算法没有义务帮你形成完整世界观。", "en": "Because the algorithm has no obligation to help you form a complete worldview."}, {"start": 953.14, "end": 957.29, "text": "你必须主动给自己的信息结构“掺沙子”。", "en": "You must actively 'mix sand' into your own information structure."}, {"start": 957.29, "end": 960.96, "text": "下面是一套我自己觉得真正有操作性的办法。", "en": "Below is a set of methods I personally find truly workable."}, {"start": 960.96, "end": 965.21, "text": "方法一：定期“主动搜索”，不要只靠首页推荐", "en": "Method 1: Regularly 'actively search'; do not rely only on homepage recommendations."}, {"start": 965.21, "end": 967.06, "text": "这是最重要的一条。", "en": "This is the most important one."}, {"start": 967.06, "end": 968.86, "text": "一定要养成一个习惯：", "en": "You must develop a habit:"}, {"start": 968.86, "end": 973.13, "text": "推荐流用来看娱乐，搜索框用来认识世界。", "en": "Use the recommendation feed for entertainment, and use the search box to understand the world."}, {"start": 973.13, "end": 974.88, "text": "两者完全不是一回事。", "en": "The two are completely different things."}, {"start": 974.88, "end": 977.23, "text": "推荐是算法决定你看什么。", "en": "Recommendation is the algorithm deciding what you watch."}, {"start": 977.23, "end": 979.32, "text": "搜索是你决定自己看什么。", "en": "Searching is you deciding what you watch."}, {"start": 979.32, "end": 980.93, "text": "比如你看到一个观点：", "en": "For example, you see a view:"}, {"start": 980.93, "end": 983.21, "text": "“年轻人都不愿意结婚了。", "en": "“Young people are unwilling to get married anymore."}, {"start": 983.21, "end": 988.01, "text": "”", "en": "”"}, {"start": 988.01, "end": 989.81, "text": "不要马上去看评论区。", "en": "Do not immediately go read the comments."}, {"start": 989.81, "end": 991.32, "text": "你应该主动搜索：", "en": "You should actively search:"}, {"start": 991.32, "end": 993.91, "text": "“近十年结婚登记人数变化。", "en": "“Changes in marriage registrations over the past decade."}, {"start": 993.91, "end": 998.71, "text": "”", "en": "”"}, {"start": 998.71, "end": 1001.64, "text": "“不同年龄结婚意愿调查。", "en": "“Marriage willingness surveys by age."}, {"start": 1001.64, "end": 1006.44, "text": "”", "en": "”"}, {"start": 1006.44, "end": 1008.67, "text": "“东亚国家婚姻率变化。", "en": "“Changes in marriage rates in East Asian countries."}, {"start": 1008.67, "end": 1013.47, "text": "”", "en": "”"}, {"start": 1013.47, "end": 1016.59, "text": "“支持年轻人结婚意愿下降的证据。", "en": "“Evidence supporting the decline in young people's willingness to marry."}, {"start": 1016.59, "end": 1021.39, "text": "”", "en": "”"}, {"start": 1021.39, "end": 1025.06, "text": "“反对年轻人结婚意愿全面下降的证据。", "en": "“Evidence against a comprehensive decline in young people's willingness to marry."}, {"start": 1025.06, "end": 1029.86, "text": "”", "en": "”"}, {"start": 1029.86, "end": 1033.15, "text": "这时候你获得的信息质量，才会发生质变。", "en": "Only then will the quality of information you obtain undergo a qualitative change."}, {"start": 1033.15, "end": 1036.44, "text": "一个非常实用的搜索原则叫：", "en": "A very practical search principle is called:"}, {"start": 1036.44, "end": 1039.13, "text": "正搜一次，反搜一次。", "en": "Search once for, and once against."}, {"start": 1039.13, "end": 1040.52, "text": "比如你认为：", "en": "For example, you believe:"}, {"start": 1040.52, "end": 1042.87, "text": "“人工智能会造成大规模失业。", "en": "“Artificial intelligence will cause large-scale unemployment."}, {"start": 1042.87, "end": 1047.67, "text": "”", "en": "”"}, {"start": 1047.67, "end": 1049.35, "text": "你就同时搜索：", "en": "Then search simultaneously:"}, {"start": 1049.35, "end": 1051.46, "text": "“AI导致失业的证据。", "en": "“Evidence that AI causes unemployment."}, {"start": 1051.46, "end": 1056.26, "text": "”", "en": "”"}, {"start": 1056.26, "end": 1057.18, "text": "以及：", "en": "And:"}, {"start": 1057.18, "end": 1060.9, "text": "“AI为什么不会造成长期大规模失业。", "en": "“Why AI will not cause long-term large-scale unemployment."}, {"start": 1060.9, "end": 1065.7, "text": "”", "en": "”"}, {"start": 1065.7, "end": 1069.18, "text": "先强迫自己看完双方最有力的论据。", "en": "First force yourself to read the strongest arguments from both sides."}, {"start": 1069.18, "end": 1070.42, "text": "最后再判断。", "en": "Then judge."}, {"start": 1070.42, "end": 1073.95, "text": "方法二：主动关注“让你不爽的人”", "en": "Method 2: Actively follow 'people who make you uncomfortable'."}, {"start": 1073.95, "end": 1076.52, "text": "这听起来很奇怪，但特别有效。", "en": "This sounds strange, but it is especially effective."}, {"start": 1076.52, "end": 1078.73, "text": "我建议每个人都可以建立一个：", "en": "I suggest everyone can build a:"}, {"start": 1078.73, "end": 1080.94, "text": "反方关注列表。", "en": "Opposition follow list."}, {"start": 1080.94, "end": 1082.57, "text": "比如你支持A观点。", "en": "For example, you support view A."}, {"start": 1082.57, "end": 1085.81, "text": "不要只关注10个支持A的人。", "en": "Do not only follow 10 people who support A."}, {"start": 1085.81, "end": 1089.29, "text": "至少关注2—3个真正高质量的B观点作者。", "en": "Follow at least 2–3 genuinely high-quality authors of view B."}, {"start": 1089.29, "end": 1090.56, "text": "重点是高质量。", "en": "The key is high quality."}, {"start": 1090.56, "end": 1092.36, "text": "不是去看极端反对者。", "en": "Do not go watch extreme opponents."}, {"start": 1092.36, "end": 1096.39, "text": "因为极端反对者只会进一步让你确信自己是对的。", "en": "Because extreme opponents will only further convince you that you are right."}, {"start": 1096.39, "end": 1098.12, "text": "你真正应该看的是：", "en": "What you should really watch is:"}, {"start": 1098.12, "end": 1101.89, "text": "那些你不同意，但你不得不承认他说得有道理的人。", "en": "Those you disagree with, but have to admit make sense."}, {"start": 1101.89, "end": 1103.45, "text": "这种人最有价值。", "en": "Such people are the most valuable."}, {"start": 1103.45, "end": 1106.26, "text": "因为他们会暴露你认知里的漏洞。", "en": "Because they expose loopholes in your cognition."}, {"start": 1106.26, "end": 1110.26, "text": "方法三：刻意跨圈层获取信息", "en": "Method 3: Deliberately obtain information across circles."}, {"start": 1110.26, "end": 1115.3, "text": "绝大多数人所谓的“了解社会”，其实只是了解自己的圈子。", "en": "What most people call 'understanding society' is actually just understanding their own circle."}, {"start": 1115.3, "end": 1117.06, "text": "医生看到的是医院。", "en": "Doctors see hospitals."}, {"start": 1117.06, "end": 1119.82, "text": "程序员看到的是互联网。", "en": "Programmers see the internet."}, {"start": 1119.82, "end": 1124.45, "text": "公务员看到的是体制。", "en": "Civil servants see the system."}, {"start": 1124.45, "end": 1127.74, "text": "投资人看到的是资本市场。", "en": "Investors see the capital market."}, {"start": 1127.74, "end": 1130.98, "text": "农民看到的是土地和农产品价格。", "en": "Farmers see land and agricultural product prices."}, {"start": 1130.98, "end": 1134.02, "text": "你不能拿一个圈层的经验去解释整个世界。", "en": "You cannot use one circle's experience to explain the whole world."}, {"start": 1134.02, "end": 1135.94, "text": "所以可以刻意做一件事：", "en": "So you can deliberately do one thing:"}, {"start": 1135.94, "end": 1139.62, "text": "每周进入一个和自己完全无关的信息领域。", "en": "Each week, enter an information field completely unrelated to you."}, {"start": 1139.62, "end": 1140.46, "text": "比如：", "en": "For example:"}, {"start": 1140.46, "end": 1143.74, "text": "医生看看制造业工人的真实生活。", "en": "Doctors look at the real lives of manufacturing workers."}, {"start": 1143.74, "end": 1145.78, "text": "白领看看县城商业。", "en": "White-collar workers look at county-town commerce."}, {"start": 1145.78, "end": 1147.94, "text": "一线城市的人看看农村老人。", "en": "People in first-tier cities look at rural elderly."}, {"start": 1147.94, "end": 1150.66, "text": "体制内看看民营企业。", "en": "People inside the system look at private enterprises."}, {"start": 1150.66, "end": 1154.81, "text": "年轻人看看老年人的信息世界。", "en": "Young people look at the elderly's information world."}, {"start": 1154.81, "end": 1157.5, "text": "男性看看女性长期讨论的问题。", "en": "Men look at issues women have long discussed."}, {"start": 1157.5, "end": 1158.94, "text": "你未必需要认同。", "en": "You do not necessarily need to agree."}, {"start": 1158.94, "end": 1160.57, "text": "但你至少应该知道：", "en": "But you should at least know:"}, {"start": 1160.57, "end": 1164.17, "text": "这个世界上还有一群人，他们面对的问题和你完全不同。", "en": "There is a group of people in this world whose problems are completely different from yours."}, {"start": 1164.17, "end": 1168.25, "text": "方法四：减少“无限信息流”，增加“有限信息源”", "en": "Method 4: Reduce 'infinite information flow' and increase 'finite information sources'."}, {"start": 1168.25, "end": 1171.85, "text": "短视频、信息流最大的特点是什么？", "en": "What is the biggest characteristic of short videos and information flows?"}, {"start": 1171.85, "end": 1173.72, "text": "你永远不知道下一条是什么。", "en": "You never know what the next one is."}, {"start": 1173.72, "end": 1176.41, "text": "于是大脑处于持续刺激状态。", "en": "So the brain is in a state of continuous stimulation."}, {"start": 1176.41, "end": 1180.66, "text": "相比之下，我更建议把部分信息获取方式改成：", "en": "In comparison, I would rather suggest changing part of your information acquisition to:"}, {"start": 1180.66, "end": 1181.33, "text": "书。", "en": "Books."}, {"start": 1181.33, "end": 1182.22, "text": "长文章。", "en": "Long articles."}, {"start": 1182.22, "end": 1183.13, "text": "纪录片。", "en": "Documentaries."}, {"start": 1183.13, "end": 1184.38, "text": "完整访谈。", "en": "Complete interviews."}, {"start": 1184.38, "end": 1185.77, "text": "专题报告。", "en": "Feature reports."}, {"start": 1185.77, "end": 1187.02, "text": "行业报告。", "en": "Industry reports."}, {"start": 1187.02, "end": 1188.34, "text": "系统课程。", "en": "Systematic courses."}, {"start": 1188.34, "end": 1190.74, "text": "因为这些内容是有边界的。", "en": "Because this content has boundaries."}, {"start": 1190.74, "end": 1192.9, "text": "一本书300页，你会看完。", "en": "A book of 300 pages, you will finish it."}, {"start": 1192.9, "end": 1195.97, "text": "一份报告50页，你会看完。", "en": "A report of 50 pages, you will finish it."}, {"start": 1195.97, "end": 1197.7, "text": "但推荐流是没有尽头的。", "en": "But the recommendation feed has no end."}, {"start": 1197.7, "end": 1201.25, "text": "无限信息流最大的问题不是浪费时间。", "en": "The biggest problem with infinite information flow is not wasting time."}, {"start": 1201.25, "end": 1203.94, "text": "而是它会让你的认知变得：", "en": "But that it makes your cognition become:"}, {"start": 1203.94, "end": 1206.53, "text": "碎片化、情绪化、缺乏上下文。", "en": "Fragmented, emotional, and lacking context."}, {"start": 1206.53, "end": 1209.84, "text": "方法五：建立“信息配餐制度”", "en": "Method 5: Establish an 'information meal plan'."}, {"start": 1209.84, "end": 1212.31, "text": "我一直觉得，信息和吃饭特别像。", "en": "I have always felt that information is very much like food."}, {"start": 1212.31, "end": 1215.31, "text": "人不能天天只吃自己喜欢的东西。", "en": "People cannot eat only what they like every day."}, {"start": 1215.31, "end": 1216.75, "text": "信息也一样。", "en": "Information is the same."}, {"start": 1216.75, "end": 1219.56, "text": "你可以给自己做一个非常简单的信息配比。", "en": "You can make yourself a very simple information ratio."}, {"start": 1219.56, "end": 1221.53, "text": "比如每天的信息摄入：", "en": "For example, your daily information intake:"}, {"start": 1221.53, "end": 1224.22, "text": "50%自己真正需要的信息。", "en": "50% information you truly need."}, {"start": 1224.22, "end": 1227.29, "text": "20%与自己观点相反的信息。", "en": "20% information contrary to your views."}, {"start": 1227.29, "end": 1230.17, "text": "20%完全陌生领域的信息。", "en": "20% information from completely unfamiliar fields."}, {"start": 1230.17, "end": 1231.8, "text": "10%纯娱乐。", "en": "10% pure entertainment."}, {"start": 1231.8, "end": 1233.43, "text": "比例不用这么精确。", "en": "The ratio does not need to be this precise."}, {"start": 1233.43, "end": 1234.63, "text": "核心是：", "en": "The core is:"}, {"start": 1234.63, "end": 1242.14, "text": "不要让推荐算法承包你100%的精神食谱。", "en": "Do not let the recommendation algorithm take over 100% of your mental diet."}, {"start": 1242.14, "end": 1249.22, "text": "否则你相当于每天去一家自助餐厅，然后让服务员根据你昨天吃什么，今天继续给你端什么。", "en": "Otherwise you are like going to a buffet restaurant every day, and letting the waiter serve you today based on what you ate yesterday."}, {"start": 1249.22, "end": 1251.07, "text": "最后你以为世界上只有炸鸡。", "en": "In the end you think the world has only fried chicken."}, {"start": 1251.07, "end": 1255.56, "text": "方法六：看到特别让你愤怒的内容，先暂停传播", "en": "Method 6: When you see content that makes you particularly angry, pause before spreading it."}, {"start": 1255.56, "end": 1257.65, "text": "这是现在特别重要的信息素养。", "en": "This is especially important information literacy now."}, {"start": 1257.65, "end": 1261.49, "text": "因为一个内容如果让你产生非常强烈的情绪：", "en": "Because if a piece of content produces a very strong emotion in you:"}, {"start": 1261.49, "end": 1262.45, "text": "愤怒。", "en": "Anger."}, {"start": 1262.45, "end": 1263.41, "text": "恐惧。", "en": "Fear."}, {"start": 1263.41, "end": 1264.37, "text": "仇恨。", "en": "Hatred."}, {"start": 1264.37, "end": 1265.21, "text": "兴奋。", "en": "Excitement."}, {"start": 1265.21, "end": 1266.12, "text": "优越感。", "en": "Superiority."}, {"start": 1266.12, "end": 1267.99, "text": "你都应该先问自己一句：", "en": "You should first ask yourself:"}, {"start": 1267.99, "end": 1270.08, "text": "它是不是在利用我的情绪？", "en": "Is it exploiting my emotions?"}, {"start": 1270.08, "end": 1272.65, "text": "很多爆款内容的逻辑就是：", "en": "The logic of many hit contents is:"}, {"start": 1272.65, "end": 1274.28, "text": "先给你制造情绪。", "en": "First give you an emotion."}, {"start": 1274.28, "end": 1275.79, "text": "再给你一个简单解释。", "en": "Then give you a simple explanation."}, {"start": 1275.79, "end": 1277.28, "text": "最后给你一个敌人。", "en": "Finally give you an enemy."}, {"start": 1277.28, "end": 1279.44, "text": "这是最低成本的传播模型。", "en": "This is the lowest-cost dissemination model."}, {"start": 1279.44, "end": 1281.53, "text": "所以我现在有一个简单原则：", "en": "So I now have a simple principle:"}, {"start": 1281.53, "end": 1284.41, "text": "越让我愤怒的信息，我越晚下结论。", "en": "The angrier the information makes me, the later I conclude."}, {"start": 1284.41, "end": 1286.28, "text": "至少看三个不同来源。", "en": "At least read three different sources."}, {"start": 1286.28, "end": 1287.96, "text": "很多时候你会发现：", "en": "Many times you will find:"}, {"start": 1287.96, "end": 1289.4, "text": "原视频是真的。", "en": "The original video is real."}, {"start": 1289.4, "end": 1290.79, "text": "但被剪辑过。", "en": "But it has been edited."}, {"start": 1290.79, "end": 1291.99, "text": "新闻是真的。", "en": "The news is real."}, {"start": 1291.99, "end": 1293.38, "text": "但省略了背景。", "en": "But the background has been omitted."}, {"start": 1293.38, "end": 1294.78, "text": "数据是真的。", "en": "The data is real."}, {"start": 1294.78, "end": 1297.13, "text": "但时间范围被刻意选择了。", "en": "But the time range has been deliberately chosen."}, {"start": 1297.13, "end": 1300.66, "text": "方法七：每隔一段时间，主动“污染”自己的算法", "en": "Method 7: Every so often, actively 'pollute' your own algorithm."}, {"start": 1300.66, "end": 1302.46, "text": "这是一个非常实际的小技巧。", "en": "This is a very practical little trick."}, {"start": 1302.46, "end": 1305.89, "text": "既然算法通过行为训练，那你也可以反过来训练算法。", "en": "Since the algorithm is trained through behaviour, you can also train the algorithm in reverse."}, {"start": 1305.89, "end": 1307.45, "text": "比如连续几天：", "en": "For example, for several consecutive days:"}, {"start": 1307.45, "end": 1309.2, "text": "搜索完全不同的领域。", "en": "Search completely different fields."}, {"start": 1309.2, "end": 1311.43, "text": "主动点赞不同类型内容。", "en": "Actively like different types of content."}, {"start": 1311.43, "end": 1313.28, "text": "关注不同立场账号。", "en": "Follow accounts with different positions."}, {"start": 1313.28, "end": 1315.51, "text": "点击自己平时不会看的主题。", "en": "Click topics you would not normally watch."}, {"start": 1315.51, "end": 1317.98, "text": "主动搜索而不是下拉首页。", "en": "Actively search rather than pull down the homepage."}, {"start": 1317.98, "end": 1320.86, "text": "把明显同质化内容点“不感兴趣”。", "en": "Mark obviously homogeneous content as 'not interested'."}, {"start": 1320.86, "end": 1323.55, "text": "一段时间后，你会发现推荐流开始变化。", "en": "After a while, you will find the recommendation feed starting to change."}, {"start": 1323.55, "end": 1324.56, "text": "这叫：", "en": "This is called:"}, {"start": 1324.56, "end": 1326.48, "text": "反向驯化算法。", "en": "Reverse-taming the algorithm."}, {"start": 1326.48, "end": 1328.71, "text": "不要让算法只研究你。", "en": "Do not let the algorithm only study you."}, {"start": 1328.71, "end": 1330.44, "text": "你也研究一下它。", "en": "You should also study it."}, {"start": 1330.44, "end": 1333.44, "text": "方法八：定期问自己三个问题", "en": "Method 8: Regularly ask yourself three questions."}, {"start": 1333.44, "end": 1336.27, "text": "我觉得这是成本最低，也最有效的方法。", "en": "I think this is the lowest-cost and most effective method."}, {"start": 1336.27, "end": 1339.99, "text": "每次你对一个社会问题特别确信时，问自己：", "en": "Each time you are particularly certain about a social issue, ask yourself:"}, {"start": 1339.99, "end": 1344.07, "text": "1. 什么证据可以证明我是错的？", "en": "1. What evidence could prove me wrong?"}, {"start": 1344.07, "end": 1345.51, "text": "如果你的答案是：", "en": "If your answer is:"}, {"start": 1345.51, "end": 1347.79, "text": "“没有任何证据能证明我错。", "en": "“No evidence can prove me wrong."}, {"start": 1347.79, "end": 1352.59, "text": "”", "en": "”"}, {"start": 1352.59, "end": 1354.8, "text": "那通常不是你特别正确。", "en": "Then usually it is not that you are particularly correct."}, {"start": 1354.8, "end": 1357.08, "text": "而是你的观点已经变成信仰了。", "en": "But that your view has become a belief."}, {"start": 1357.08, "end": 1361.35, "text": "2. 如果反方是对的，最合理的理由是什么？", "en": "2. If the other side is right, what is the most reasonable argument?"}, {"start": 1361.35, "end": 1364.23, "text": "注意，不是找最蠢的反方。", "en": "Note: do not look for the stupidest opposition."}, {"start": 1364.23, "end": 1366.94, "text": "而是帮反方构建最强论点。", "en": "But help the opposition build its strongest argument."}, {"start": 1366.94, "end": 1371.79, "text": "3. 我现在看到的是总体，还是一个被筛选出来的样本？", "en": "3. What I see now: is it the whole population, or a filtered sample?"}, {"start": 1371.79, "end": 1373.23, "text": "这句话特别重要。", "en": "This sentence is especially important."}, {"start": 1373.23, "end": 1375.2, "text": "微博热搜不是总体。", "en": "Weibo trending is not the whole population."}, {"start": 1375.2, "end": 1377.05, "text": "知乎用户不是总体。", "en": "Zhihu users are not the whole population."}, {"start": 1377.05, "end": 1378.3, "text": "小红书不是总体。", "en": "Xiaohongshu is not the whole population."}, {"start": 1378.3, "end": 1380.5, "text": "抖音评论区不是总体。", "en": "The Douyin comments section is not the whole population."}, {"start": 1380.5, "end": 1382.18, "text": "朋友圈更不是总体。", "en": "Moments is even less the whole population."}, {"start": 1382.18, "end": 1385.78, "text": "网络舆论只是社会的一部分切片。", "en": "Online public opinion is only a slice of society."}, {"start": 1385.78, "end": 1389.31, "text": "六、最后说一个可能比较反直觉的观点", "en": "VI. Finally, a view that may be rather counterintuitive."}, {"start": 1389.31, "end": 1394.23, "text": "我觉得，真正成熟的信息获取方式，不是“获得更多信息”。", "en": "I think the truly mature way of obtaining information is not 'obtaining more information'."}, {"start": 1394.23, "end": 1395.02, "text": "而是：", "en": "But:"}, {"start": 1395.02, "end": 1397.18, "text": "主动管理自己的信息结构。", "en": "Actively managing your own information structure."}, {"start": 1397.18, "end": 1401.19, "text": "今天这个时代，我们真正缺的已经不是信息。", "en": "In this era, what we truly lack is no longer information."}, {"start": 1401.19, "end": 1402.7, "text": "而是信息太多。", "en": "But too much information."}, {"start": 1402.7, "end": 1404.26, "text": "过去的人担心：", "en": "People in the past worried:"}, {"start": 1404.26, "end": 1405.34, "text": "“我不知道。", "en": "“I don't know."}, {"start": 1405.34, "end": 1410.14, "text": "”", "en": "”"}, {"start": 1410.14, "end": 1412.11, "text": "今天的人更应该担心：", "en": "People today should worry more:"}, {"start": 1412.11, "end": 1416.43, "text": "“我知道的东西，是不是别人根据我的喜好专门挑给我看的？", "en": "“Is what I know specially selected for me by others according to my preferences?"}, {"start": 1416.43, "end": 1421.23, "text": "”", "en": "”"}, {"start": 1421.23, "end": 1426.92, "text": "所以脱离信息茧房，最重要的并不是卸载某个平台。", "en": "So to escape the information cocoon, the most important thing is not uninstalling a platform."}, {"start": 1426.92, "end": 1430.23, "text": "因为你卸载一个，还会去另一个。", "en": "Because if you uninstall one, you will go to another."}, {"start": 1430.23, "end": 1432.58, "text": "真正的核心是建立一种习惯：", "en": "The truly core thing is to establish a habit:"}, {"start": 1432.58, "end": 1438.42, "text": "不要只消费被推送的信息，要主动寻找那些你没有被推送的信息。", "en": "Do not only consume information that is pushed to you; actively seek information that has not been pushed to you."}, {"start": 1438.42, "end": 1440.7, "text": "尤其要去寻找三种东西：", "en": "Especially seek three kinds of things:"}, {"start": 1440.7, "end": 1441.94, "text": "你不知道的。", "en": "Things you do not know."}, {"start": 1441.94, "end": 1443.22, "text": "你不同意的。", "en": "Things you disagree with."}, {"start": 1443.22, "end": 1446.22, "text": "让你感觉不舒服，但有可能是对的。", "en": "Things that make you feel uncomfortable, but may be right."}, {"start": 1446.22, "end": 1451.33, "text": "一个人的认知真正开始成长，往往不是在他不断听到：", "en": "A person's cognition truly begins to grow, often not when they constantly hear:"}, {"start": 1451.33, "end": 1452.36, "text": "“你是对的。", "en": "“You are right."}, {"start": 1452.36, "end": 1457.16, "text": "”", "en": "”"}, {"start": 1457.16, "end": 1460.21, "text": "而是在某一天，他突然发现：", "en": "But on a certain day, when they suddenly discover:"}, {"start": 1460.21, "end": 1464.7, "text": "原来这个世界，比我的首页复杂得多。", "en": "It turns out this world is much more complex than my homepage."}, {"start": 1464.7, "end": 1469.78, "text": "我甚至觉得，每个人都应该时不时主动给自己的认知“开一扇窗”。", "en": "I even feel that everyone should from time to time actively open a 'window' in their cognition."}, {"start": 1469.78, "end": 1472.9, "text": "哪怕窗外吹进来的风并不舒服。", "en": "Even if the wind blowing in through the window is not comfortable."}, {"start": 1472.9, "end": 1476.86, "text": "因为信息茧房最大的危险，从来不是有人把门锁上了。", "en": "Because the greatest danger of the information cocoon has never been that someone locked the door."}, {"start": 1476.86, "end": 1478.66, "text": "而是你在里面住久了以后，", "en": "But that after living inside it for a long time,"}, {"start": 1478.66, "end": 1480.75, "text": "开始觉得外面根本没有世界。", "en": "You start to feel that there is no world outside at all."}]}, {"title": "怎样避免活在信息茧房之中？ Part 9（112句，9:04）", "mp3": "upload-8-part09/audio.mp3", "dur": "9:04", "lines": [{"start": 0.0, "end": 25.44, "text": "善用客制化 AI 的 RSS 信息汇总，把 OpenClaw (龙虾), Codex, Claude Code 等 Agent 用利索。", "en": "Make good use of customised AI RSS information aggregation, and master Agents like OpenClaw (the Lobster), Codex and Claude Code."}, {"start": 25.44, "end": 42.19, "text": "如果没听过RSS (Really Simple Syndication) 的话, 其本质可以理解为一个自动更新的信息收件箱，把原本分散在各个平台上的内容统一汇集起来，不需要逐个打开网站刷新页面，更新会自动送达。", "en": "If you have never heard of RSS (Really Simple Syndication), its essence can be understood as an automatically updating information inbox, gathering content originally scattered across platforms into one place. You do not need to open websites one by one to refresh pages; updates are delivered automatically."}, {"start": 42.19, "end": 54.5, "text": "比如微信公众号、知乎、Bilibili、微博、小红书、即刻、抖音、GitHub、路透社、彭博社、华尔街、各国大使馆、各大新闻社、推特、INS -- 你能想到的信息源都可以汇总。", "en": "For example, WeChat official accounts, Zhihu, Bilibili, Weibo, Xiaohongshu, Jike, Douyin, GitHub, Reuters, Bloomberg, Wall Street, embassies of various countries, major news agencies, Twitter, Instagram — any information source you can think of can be aggregated."}, {"start": 54.5, "end": 63.1, "text": "不管是按照频道，按照创作者、按照榜单、按照话题、按照标签、按照关键词，能想到的汇总方式都能做到。", "en": "Whether by channel, by creator, by ranking, by topic, by tag, or by keyword — every aggregation method you can think of can be done."}, {"start": 63.1, "end": 78.26, "text": "结合小龙虾这样的 Agent，这些内容通过各自的 RSS feed 被聚合进同一个阅读器或接入 AI 工具后，就变成一个持续流动、可被筛选总结甚至自动处理的信息流，本质是把“到处刷内容”变成“内容自动汇总过来”。", "en": "Combined with an Agent like Little Lobster, once this content is aggregated through its own RSS feeds into the same reader or connected to AI tools, it becomes a continuously flowing information stream that can be filtered, summarised and even automatically processed. Its essence is turning 'brushing content everywhere' into 'content automatically aggregated to you'."}, {"start": 78.26, "end": 91.94, "text": "现在答主就能做到每天每三个小时，用龙虾在Discord 里（其他微信，Telegram，飞书，邮箱，各种常见聊天软件应该都支持）帮忙汇总一下刚刚三小时内发生的重点事件。", "en": "Now the answerer can, every three hours each day, use Little Lobster in Discord (other WeChat, Telegram, Feishu, email and various common chat software should all be supported) to help summarise the key events that happened in the just-past three hours."}, {"start": 91.94, "end": 94.82, "text": "还可以跟它继续对话让它深挖某一个事件。", "en": "You can also continue conversing with it to dig deeper into a particular event."}, {"start": 94.82, "end": 97.87, "text": "信息收集和整合效率高到爆炸。", "en": "The efficiency of information collection and integration is explosively high."}, {"start": 97.87, "end": 108.02, "text": "以下是一些截止到 2026年 3月底市面上比较有影响力，具有一定规模的现存 RSS 站点，工具，以及已经可以直接接入龙虾的 skills 汇总。", "en": "Below is a summary, as of the end of March 2026, of RSS sites, tools and skills currently on the market that are relatively influential, of a certain scale, and already directly connectable to Little Lobster."}, {"start": 108.02, "end": 112.06, "text": "可以自行探索配置，欢迎评论区交流究竟效果如何。", "en": "Feel free to explore and configure them yourself, and welcome to exchange in the comments about how well they actually work."}, {"start": 112.06, "end": 116.62, "text": "对古人来说，这种程度的信息收集和整合简直就是魔法。", "en": "For ancient people, this level of information collection and integration would simply be magic."}, {"start": 116.62, "end": 124.1, "text": "建议有条件的朋友都搭一下，也呼吁一下知乎的朋友们把知乎上出现的幼稚信息源汇总贴到评论区！", "en": "I suggest friends who are able to set one up, and also call on Zhihu friends to post summaries of naive information sources appearing on Zhihu in the comments!"}, {"start": 124.1, "end": 127.34, "text": "可以搞出一个更好的开源 RSS 生态。", "en": "We can build a better open-source RSS ecosystem."}, {"start": 127.34, "end": 132.07, "text": "教育系统三番五次取消逻辑课，难道是为了帮助你思考？", "en": "The education system has repeatedly cancelled logic courses. Is that to help you think?"}, {"start": 132.07, "end": 133.75, "text": "行为背后目的是什么？", "en": "What is the purpose behind the behaviour?"}, {"start": 133.75, "end": 139.63, "text": "某些群体多年来始终成为诈骗分子主要目标，背后原因是什么？", "en": "Why have certain groups consistently been the main targets of fraudsters for years?"}, {"start": 139.63, "end": 146.88, "text": "内在思维模式+外在信息管控，导致大部分人很难摆脱信息茧房。", "en": "An inward thinking pattern plus outward information control makes it hard for most people to escape the information cocoon."}, {"start": 146.88, "end": 154.32, "text": "缺少逻辑思维、批判性思维，缺少独立思考和质疑精神，长期接受劣质信息。", "en": "Lacking logical thinking and critical thinking, lacking independent thinking and a questioning spirit, and long accepting low-quality information."}, {"start": 154.32, "end": 161.88, "text": "走出一个茧房，又会掉进另一个茧房；摆脱一个骗局，又会走进下一个骗局。", "en": "Escaping one cocoon, you fall into another; escaping one scam, you walk into the next scam."}, {"start": 161.88, "end": 165.67, "text": "1、这两年发生了很多事情对我的冲击很大。", "en": "1. These past two years, many things have happened that have greatly impacted me."}, {"start": 165.67, "end": 175.94, "text": "做自媒体的过程中，我接触到了很多很多优秀的人，我逐渐意识到一个问题就是，认知就是能力的边界。", "en": "In the process of doing self-media, I came into contact with many, many excellent people, and I gradually realised a problem: cognition is the boundary of ability."}, {"start": 175.94, "end": 182.26, "text": "不同的圈层带给你的认知是不一样的，突破信息茧房的关键在于“走出去”。", "en": "Different circles bring you different cognition. The key to breaking through the information cocoon is to 'go out'."}, {"start": 182.26, "end": 192.05, "text": "去加入一个又一个好的圈子，身处高质量的信息平台，能让我们提高对未知事物的判断，洞察事物真实的发展规律。", "en": "Join one good circle after another; being in high-quality information platforms allows us to improve our judgment of unknown things and perceive the true development patterns of things."}, {"start": 192.05, "end": 195.22, "text": "2、看到一个信息时，先问问自己：", "en": "2. When you see a piece of information, first ask yourself:"}, {"start": 195.22, "end": 196.66, "text": "对这件事知道什么？", "en": "What do I know about this?"}, {"start": 196.66, "end": 197.62, "text": "不知道什么？", "en": "What do I not know?"}, {"start": 197.62, "end": 199.3, "text": "这个信息来源可靠吗？", "en": "Is this information source reliable?"}, {"start": 199.3, "end": 200.81, "text": "这个观点是谁说的？", "en": "Who said this view?"}, {"start": 200.81, "end": 210.6, "text": "3、适当关注一些粉丝不少、但争议很大的博主，偶尔接受一些和自己观念相悖的信息，有助于避免思维困在信息茧房。", "en": "3. Appropriately follow some bloggers with quite a few fans but great controversy, and occasionally accept some information contrary to your own views, which helps prevent your thinking from being trapped in an information cocoon."}, {"start": 210.6, "end": 212.04, "text": "远离简中网！", "en": "Stay away from the Simplified-Chinese internet!"}, {"start": 212.04, "end": 216.0, "text": "，看几个不同立场偏好的英文主流媒体就OK了！", "en": "Just read a few mainstream English media outlets with different position preferences, and you will be OK!"}, {"start": 216.0, "end": 220.97, "text": "钱多，分别去台北，平壤，东京，纽约，耶路撒冷等城市住一个月；", "en": "With more money, live a month each in Taipei, Pyongyang, Tokyo, New York, Jerusalem and other cities;"}, {"start": 220.97, "end": 228.7, "text": "钱少，在孔夫子旧书网上淘几本不常见的外国游记及当代史书，或者偶而上知乎；", "en": "With less money, scour the Confucius Old Books Network for a few uncommon foreign travelogues and contemporary history books, or occasionally browse Zhihu;"}, {"start": 228.7, "end": 233.69, "text": "钱再少，打开电视，专听各路“专家”论道，反着想。", "en": "With even less money, turn on the television and listen specifically to all kinds of 'experts' expounding, and think in reverse."}, {"start": 233.69, "end": 238.49, "text": "避开简中媒体，多看BBC,CNN,ABC,路透社，彭博社。", "en": "Avoid Simplified-Chinese media; read more BBC, CNN, ABC, Reuters and Bloomberg."}, {"start": 238.49, "end": 239.64, "text": "联合早报…", "en": "Lianhe Zaobao…"}, {"start": 239.64, "end": 244.44, "text": "先承认一个事实：你之所以被困住，是因为你懒，且贪。", "en": "First admit a fact: the reason you are trapped is that you are lazy and greedy."}, {"start": 244.44, "end": 247.75, "text": "懒在不愿思考，贪在只求舒适。", "en": "Lazy in unwillingness to think, greedy in only seeking comfort."}, {"start": 247.75, "end": 254.06, "text": "很多人把“信息茧房”当成一个技术问题，以为换个算法、多装几个 APP 就能解决。", "en": "Many people treat the 'information cocoon' as a technical problem, thinking that changing the algorithm or installing a few more apps can solve it."}, {"start": 254.06, "end": 254.98, "text": "错。", "en": "Wrong."}, {"start": 254.98, "end": 257.93, "text": "这是个人性问题，还是个利益问题。", "en": "This is a human-nature problem, and also an interest problem."}, {"start": 257.93, "end": 261.0, "text": "要想不被茧房困死，你得做到以下四点。", "en": "To avoid being trapped to death by the cocoon, you must do the following four things."}, {"start": 261.0, "end": 262.97, "text": "这不是建议，是规则。", "en": "This is not advice; it is rules."}, {"start": 262.97, "end": 265.92, "text": "第一，戒掉“情绪共鸣”，那是毒药。", "en": "First, quit 'emotional resonance' — that is poison."}, {"start": 265.92, "end": 271.87, "text": "你要明白，互联网上 95% 的内容，都是为了迎合你的情绪而生产的。", "en": "You must understand that 95% of content on the internet is produced to cater to your emotions."}, {"start": 271.87, "end": 279.24, "text": "当你看到一篇文章，觉得“说得太对了”、“简直就是在说我”、\"热血沸腾”的时候，警惕了。", "en": "When you read an article and feel 'so true', 'this is exactly about me', 'my blood is boiling', be alert."}, {"start": 279.24, "end": 282.65, "text": "这不是知音，这是猎手在撒网。", "en": "This is not a kindred spirit; this is a hunter casting a net."}, {"start": 282.65, "end": 286.25, "text": "信息茧房的本质，是共鸣成瘾。", "en": "The essence of the information cocoon is resonance addiction."}, {"start": 286.25, "end": 289.61, "text": "大脑喜欢熟悉的东西，因为处理起来不耗能。", "en": "The brain likes familiar things, because they cost no energy to process."}, {"start": 289.61, "end": 299.64, "text": "那些带着褒义词、符合你超我想象、能让你产生多巴胺的信息，都是精心包装的糖衣炮弹。", "en": "Those messages carrying positive words, matching your superego imagination, and giving you dopamine are carefully packaged sugar-coated cannonballs."}, {"start": 299.64, "end": 301.08, "text": "我怎么看信息？", "en": "How do I view information?"}, {"start": 301.08, "end": 303.05, "text": "我先把里面的形容词全删了。", "en": "I first delete all the adjectives inside."}, {"start": 303.05, "end": 308.09, "text": "把“感人”、“愤怒”、“震惊”这些词去掉，只剩下主谓宾。", "en": "Remove words like 'touching', 'angry' and 'shocking', leaving only subject, verb and object."}, {"start": 308.09, "end": 310.66, "text": "这时候你再看，逻辑还通吗？", "en": "Then look again: does the logic still hold?"}, {"start": 310.66, "end": 311.74, "text": "利益链在哪？", "en": "Where is the interest chain?"}, {"start": 311.74, "end": 312.94, "text": "谁在受益？", "en": "Who benefits?"}, {"start": 312.94, "end": 315.62, "text": "舒服，是废掉的开始。", "en": "Comfort is the beginning of being ruined."}, {"start": 315.62, "end": 320.5, "text": "真正有价值的信息，往往带着刺，甚至让你不爽。", "en": "Truly valuable information often carries thorns, and even makes you uncomfortable."}, {"start": 320.5, "end": 322.78, "text": "因为它在挑战你的认知边界。", "en": "Because it challenges your cognitive boundaries."}, {"start": 322.78, "end": 328.66, "text": "如果你每天刷手机都很开心，那你不是在获取信息，你是在被喂养。", "en": "If you are happy scrolling on your phone every day, you are not acquiring information; you are being fed."}, {"start": 328.66, "end": 332.14, "text": "第二，为信息付费，不要总想白嫖。", "en": "Second, pay for information; do not always want it for free."}, {"start": 332.14, "end": 333.94, "text": "这话很世俗，但很真实。", "en": "This sounds worldly, but it is true."}, {"start": 333.94, "end": 336.1, "text": "免费的信息，你就是产品。", "en": "For free information, you are the product."}, {"start": 336.1, "end": 337.58, "text": "算法为什么懂你？", "en": "Why does the algorithm understand you?"}, {"start": 337.58, "end": 342.34, "text": "因为它不需要对你负责，它只需要留住你的时间，把你卖给广告商。", "en": "Because it does not need to be responsible to you; it only needs to keep your time and sell you to advertisers."}, {"start": 342.34, "end": 345.82, "text": "它推给你的，永远是你想看到的，而不是你需要看到的。", "en": "What it pushes to you is always what you want to see, not what you need to see."}, {"start": 345.82, "end": 349.94, "text": "要想破局，你得建立自己的“信息护城河”。", "en": "To break through, you must build your own 'information moat'."}, {"start": 349.94, "end": 357.22, "text": "我手机里没几个娱乐软件，但我订了几份昂贵的研报，付费订阅了几家权威媒体的数字刊。", "en": "I do not have many entertainment apps on my phone, but I subscribe to several expensive research reports and paid digital editions of authoritative media."}, {"start": 357.22, "end": 358.18, "text": "为什么？", "en": "Why?"}, {"start": 358.18, "end": 360.62, "text": "因为高质量的信息是有成本的。", "en": "Because high-quality information has a cost."}, {"start": 360.62, "end": 369.82, "text": "那些经过严肃调查、有数据支撑、有逻辑推演的内容，往往藏在付费墙后面，或者藏在那些枯燥的纸质刊物里。", "en": "Content that has undergone serious investigation, is supported by data, and has logical deduction often hides behind paywalls, or in those boring paper publications."}, {"start": 369.82, "end": 375.05, "text": "你不想花钱，不想花精力去筛选，那就只能吃别人嚼过的二手粮。", "en": "If you do not want to spend money or energy on filtering, you can only eat second-hand grain chewed by others."}, {"start": 375.05, "end": 380.02, "text": "别怪大数据困住你，大数据是服务于你的“消费能力”的。", "en": "Do not blame big data for trapping you; big data serves your 'spending power'."}, {"start": 380.02, "end": 382.94, "text": "你不愿为知识买单，就只能用认知买单。", "en": "If you are unwilling to pay for knowledge, you can only pay with cognition."}, {"start": 382.94, "end": 386.71, "text": "第三，主动找“不舒服”，去现实里碰壁。", "en": "Third, actively seek 'discomfort' and bump into walls in reality."}, {"start": 386.71, "end": 391.75, "text": "网上看再多“社会分析”，不如去菜市场、去工地，去餐厅…", "en": "No matter how much 'social analysis' you read online, it is not as good as going to wet markets, construction sites, restaurants…"}, {"start": 391.75, "end": 393.62, "text": "跟不同圈子的人聊聊天。", "en": "And chatting with people from different circles."}, {"start": 393.62, "end": 400.03, "text": "信息茧房最大的敌人，不是资本，是你自己不敢面对真实的世界。", "en": "The greatest enemy of the information cocoon is not capital; it is your own fear of facing the real world."}, {"start": 400.03, "end": 402.74, "text": "我有个习惯，专门去听反对我的声音。", "en": "I have a habit of specifically listening to voices opposing me."}, {"start": 402.74, "end": 410.26, "text": "当我做一个决策时，我会强制自己找几个持相反观点的人喝酒，听他们骂我，听他们挑刺。", "en": "When I make a decision, I force myself to find several people with opposing views to drink with, listen to them scold me, listen to them pick faults."}, {"start": 410.26, "end": 413.26, "text": "这不是为了纠结，是为了压力测试。", "en": "This is not about being torn; it is for stress testing."}, {"start": 413.26, "end": 417.86, "text": "如果你只跟认可你的人在一起，你听到的全是回音。", "en": "If you only stay with people who agree with you, all you hear are echoes."}, {"start": 417.86, "end": 421.7, "text": "你得去主动接触那些跟你阶层不同、三观不同的人。", "en": "You must actively contact people of different class and different values from you."}, {"start": 421.7, "end": 423.91, "text": "哪怕被拒绝，哪怕掉面子。", "en": "Even if rejected, even if you lose face."}, {"start": 423.91, "end": 426.5, "text": "面子不值钱，但视野值钱。", "en": "Face is worthless, but vision is valuable."}, {"start": 426.5, "end": 432.02, "text": "当年教员写《社会各阶级的分析》，是坐在窑洞里空想出来的吗？", "en": "Back then, when the Teacher wrote 'Analysis of the Classes in Chinese Society', was it dreamed up sitting in a cave dwelling?"}, {"start": 432.02, "end": 433.82, "text": "那是走访调查出来的。", "en": "That came from visiting and investigating."}, {"start": 433.82, "end": 439.39, "text": "你躲在屏幕后面键政，永远不知道真实的底层逻辑是什么。", "en": "Hiding behind a screen doing keyboard politics, you will never know what the real underlying logic is."}, {"start": 439.39, "end": 443.35, "text": "肉身在场，是打破茧房的最强物理手段。", "en": "Physical presence is the strongest physical means to break the cocoon."}, {"start": 443.35, "end": 448.34, "text": "去现场，去一线，去闻一闻那里的味道，看一看那里的眼神。", "en": "Go to the scene, go to the front line, smell the smells there, look at the eyes there."}, {"start": 448.34, "end": 451.03, "text": "大数据骗得了你，但现实骗不了你。", "en": "Big data can deceive you, but reality cannot."}, {"start": 451.03, "end": 453.84, "text": "第四，接受“无解”，拥抱复杂。", "en": "Fourth, accept 'no solution' and embrace complexity."}, {"start": 453.84, "end": 457.87, "text": "人脑经过几万年进化，天生喜欢简单的答案。", "en": "After tens of thousands of years of evolution, the human brain naturally likes simple answers."}, {"start": 457.87, "end": 461.16, "text": "是非分明，善恶立判，这样大脑才省力。", "en": "Clear right and wrong, good and evil sharply distinguished — that saves the brain energy."}, {"start": 461.16, "end": 465.48, "text": "但真实世界是灰色的，是复杂的，往往是没有简单答案的。", "en": "But the real world is grey and complex, and often has no simple answers."}, {"start": 465.48, "end": 474.79, "text": "当你通过“对冲阅读”，脑子里同时存在两个相反的观点，并且感到矛盾、困扰、不爽的时候，恭喜你，你摸到真相的边了。", "en": "When, through 'hedged reading', two opposite views exist in your mind at the same time, and you feel contradiction, distress and discomfort, congratulations — you have touched the edge of truth."}, {"start": 474.79, "end": 477.31, "text": "这种不爽，值得承受。", "en": "This discomfort is worth enduring."}, {"start": 477.31, "end": 484.03, "text": "很多人为了逃避这种不爽，宁愿回到茧房里，找一个简单的替罪羊，信一个极端的观点。", "en": "Many people, to escape this discomfort, would rather return to the cocoon, find a simple scapegoat, and believe an extreme view."}, {"start": 484.03, "end": 489.55, "text": "这就是为什么有些人越活越偏激，最后成了春蚕，自己吐丝把自己裹死。", "en": "This is why some people become more and more extreme as they live, finally becoming silkworms, spinning silk to wrap themselves to death."}, {"start": 489.55, "end": 492.14, "text": "真正的强者，能容纳矛盾。", "en": "Truly strong people can accommodate contradiction."}, {"start": 492.14, "end": 496.7, "text": "他知道世界不是非黑即白，他知道任何观点都有适用范围。", "en": "They know the world is not black and white; they know any view has its scope of application."}, {"start": 496.7, "end": 500.5, "text": "他不追求绝对的“正确”，他追求的是“概率”。", "en": "They do not pursue absolute 'correctness'; they pursue 'probability'."}, {"start": 500.5, "end": 502.34, "text": "最后，记住这句话：", "en": "Finally, remember this sentence:"}, {"start": 502.34, "end": 506.18, "text": "你的认知边界，就是你世界的边界。", "en": "Your cognitive boundary is the boundary of your world."}, {"start": 506.18, "end": 511.99, "text": "如果你看到的观点都与你一致，不是因为你聪明，是因为你被圈养得很好。", "en": "If the views you see all agree with yours, it is not because you are smart, but because you have been fed very well."}, {"start": 511.99, "end": 514.2, "text": "自由意志是有门槛的。", "en": "Free will has a threshold."}, {"start": 514.2, "end": 519.65, "text": "在不了解事实的情况下，人其实并没有自由意志，只有被操控的条件反射。", "en": "Without understanding the facts, a person actually has no free will, only conditioned reflexes of being manipulated."}, {"start": 519.65, "end": 527.04, "text": "只有当你打破了茧房，知道了世界的参差、人性的复杂，你才会真正掌握自己的命运。", "en": "Only when you break the cocoon and know the unevenness of the world and the complexity of human nature will you truly control your own destiny."}, {"start": 527.04, "end": 530.64, "text": "命运会区别对待认知水平不同的人。", "en": "Fate treats people of different cognitive levels differently."}, {"start": 530.64, "end": 539.83, "text": "你是想继续活在温暖的茧房里做一只快乐的蚕，还是想咬破口子面对风雨交加的真实世界？", "en": "Do you want to continue living in the warm cocoon as a happy silkworm, or bite open a hole and face the stormy real world?"}, {"start": 539.83, "end": 541.27, "text": "选择权在你。", "en": "The choice is yours."}, {"start": 541.27, "end": 544.99, "text": "但记住，茧房不破，成长无从谈起。", "en": "But remember: if the cocoon does not break, growth has nowhere to start."}]}, {"title": "怎样避免活在信息茧房之中？ Part 10（91句，10:08）", "mp3": "upload-8-part10/audio.mp3", "dur": "10:08", "lines": [{"start": 0.0, "end": 5.35, "text": "从小我妈就告诉我，所有信息源都可以看，多看多读永远没错。", "en": "Since I was a child, my mum told me: all information sources can be read; reading more is never wrong."}, {"start": 5.35, "end": 16.82, "text": "多看《环球时报》、《参考消息》，多看《南华早报》、《联合早报》、《中时新闻》，多看BBC、CNN、路透、彭博。", "en": "Read more Global Times and Reference News; read more South China Morning Post, Lianhe Zaobao and China Times News; read more BBC, CNN, Reuters and Bloomberg."}, {"start": 16.82, "end": 20.11, "text": "多看多读，互相比较，才能有全面的认识。", "en": "Only by reading more and comparing with each other can you have a comprehensive understanding."}, {"start": 20.11, "end": 23.35, "text": "实际上，任何媒体、任何个人都有立场。", "en": "In fact, any media and any individual has a position."}, {"start": 23.35, "end": 25.27, "text": "客观中立也是立场。", "en": "Objectivity and neutrality are also positions."}, {"start": 25.27, "end": 32.42, "text": "避免活在信息茧房中，首先是一个“敢不敢”的问题，其次才是一个“如何”的问题。", "en": "Avoiding life in an information cocoon is first a question of 'dare or not dare', and only secondarily a question of 'how'."}, {"start": 32.42, "end": 40.63, "text": "很多答案说，题主意识到自己活在信息茧房之中，已经迈出重要一步了，接下来只要拓宽视野，敞开自己…", "en": "Many answers say that the questioner realising they live in an information cocoon has already taken an important step, and next they only need to broaden their horizons, open themselves up…"}, {"start": 40.63, "end": 41.52, "text": "blabla", "en": "Blah blah."}, {"start": 41.52, "end": 44.11, "text": "我认为这样的答案是无效的。", "en": "I think such answers are ineffective."}, {"start": 44.11, "end": 51.98, "text": "这样的回答显然缺少了一个自我反思的维度：我如何证明我所叙述的东西不是信息茧房里的内容？", "en": "Such answers clearly lack a dimension of self-reflection: how do I prove that what I narrate is not content inside an information cocoon?"}, {"start": 51.98, "end": 58.87, "text": "换言之，这样的答案的问题是：我在怀疑，但是我没有怀疑我的怀疑，我怎么保证我的怀疑的有效性？", "en": "In other words, the problem with such answers is: I am doubting, but I am not doubting my doubt. How do I guarantee the validity of my doubt?"}, {"start": 58.87, "end": 72.67, "text": "而所谓的“信息茧房”（我愿意将它替换为意识形态）之所以能够成为“信息茧房”，恰恰建立在自我不敢进行第二阶怀疑的基础上。", "en": "And the reason the so-called 'information cocoon' (which I would like to replace with 'ideology') can become an 'information cocoon' is precisely built on the self's refusal to engage in second-order doubt."}, {"start": 72.67, "end": 73.63, "text": "为什么不敢？", "en": "Why dare not?"}, {"start": 73.63, "end": 83.4, "text": "用精神分析笼统的术语来说，在这里正是心理防御机制在起作用；用拉康的术语来说，这里就是幻象。", "en": "In the general terms of psychoanalysis, it is precisely the psychological defence mechanism at work here; in Lacan's terms, this is the fantasy."}, {"start": 83.4, "end": 85.97, "text": "我们不敢突破自己的心理防御机制。", "en": "We dare not break through our own psychological defence mechanisms."}, {"start": 85.97, "end": 89.69, "text": "回过头来，我们审视信息茧房本身的定义。", "en": "Looking back, we examine the definition of the information cocoon itself."}, {"start": 89.69, "end": 102.05, "text": "信息茧房，就是信息平台利用算法主动向用户推送ta偏好的信息所造成的这么一种现象：用户所把握到的现实其实是被他自己的偏好所建构出的伪现实。", "en": "The information cocoon is a phenomenon caused by information platforms using algorithms to actively push users information they prefer: the reality users grasp is actually a pseudo-reality constructed by their own preferences."}, {"start": 102.05, "end": 105.65, "text": "为什么我认为信息茧房可以替换成意识形态？", "en": "Why do I think the information cocoon can be replaced by ideology?"}, {"start": 10
