<script>
const LINES=[{"start": 0, "end": 1.0, "text": "Operator: Good afternoon.", "zh": "Operator：下午好。"}, {"start": 1.0, "end": 5.18, "text": "My name is Krista and I will be your conference operator today.", "zh": "我是 Krista，今天担任本次电话会议的主持人。"}, {"start": 5.18, "end": 11.89, "text": "At this time, I would like to welcome everyone to Meta's third quarter 2026 earnings conference call.", "zh": "现在，我欢迎大家参加 Meta 2026 年第三季度财报电话会议。"}, {"start": 11.89, "end": 16.35, "text": "All lines have been placed on mute to prevent any background noise.", "zh": "所有线路已静音，以防背景噪音。"}, {"start": 16.35, "end": 21.2, "text": "After the speaker's remarks, there will be a question and answer session.", "zh": "在发言结束后，将进行问答环节。"}, {"start": 21.2, "end": 26.78, "text": "If you would like to ask a question, please press star one on your telephone keypad.", "zh": "如果您想提问，请按电话键盘上的星号键加 1。"}, {"start": 26.78, "end": 30.04, "text": "To withdraw your question, again, press star one.", "zh": "如需撤回问题，请再次按星号键加 1。"}, {"start": 30.04, "end": 35.29, "text": "We ask that you limit yourself to one question, and this call will be recorded.", "zh": "我们请您只提一个问题，本次电话会议将被录音。"}, {"start": 35.29, "end": 36.61, "text": "Thank you very much.", "zh": "非常感谢。"}, {"start": 36.61, "end": 41, "text": "Rob Bevegni, Meta's Director of Investor Relations, you may begin.", "zh": "下面有请 Meta 投资者关系总监 Rob Bevegni 开始。"}, {"start": 41, "end": 41.53, "text": "Rob Bevegni: Thank you.", "zh": "Rob Bevegni：谢谢。"}, {"start": 41.53, "end": 46.33, "text": "Good afternoon, and welcome to Meta Platforms third quarter 2026 earnings conference call.", "zh": "下午好，欢迎参加 Meta Platforms 2026 年第三季度财报电话会议。"}, {"start": 46.33, "end": 50.82, "text": "Joining me today to discuss our results are Mark Zuckerberg, CEO, and Susan Li, CFO.", "zh": "今天与我一起讨论业绩的是首席执行官 Mark Zuckerberg 和首席财务官 Susan Li。"}, {"start": 50.82, "end": 56.2, "text": "Our remarks today will include forward-looking statements which are based on assumptions as of today.", "zh": "我们今天的发言将包含基于今天假设的前瞻性陈述。"}, {"start": 56.2, "end": 66.29, "text": "Actual results may differ materially as a result of various factors, including those set forth in today's earnings press release and in our quarterly report on Form 10-Q filed with the SEC.", "zh": "实际结果可能因多种因素而与预期有重大差异，包括今天财报新闻稿以及向美国证券交易委员会提交的 10-Q 季报中列出的因素。"}, {"start": 66.29, "end": 69.86, "text": "We undertake no obligation to update any forward-looking statement.", "zh": "我们没有义务更新任何前瞻性陈述。"}, {"start": 69.86, "end": 74.34, "text": "During this call, we will present both GAAP and certain non-GAAP financial measures.", "zh": "在本次电话会议中，我们将介绍通用会计准则以及某些非通用会计准则财务指标。"}, {"start": 74.34, "end": 79.25, "text": "A reconciliation of GAAP to non-GAAP measures is included in today's earnings press release.", "zh": "通用会计准则与非通用会计准则指标的调节表包含在今天的财报新闻稿中。"}, {"start": 79.25, "end": 85.71, "text": "The earnings press release and an accompanying investor presentation are available on our website at investor.atmeta.com.", "zh": "财报新闻稿及随附的投资者演示文稿可在我们的网站 investor.atmeta.com 上查阅。"}, {"start": 85.71, "end": 88, "text": "I would like to turn the call over to Mark.", "zh": "现在，我把电话交给 Mark。"}, {"start": 88, "end": 88.65, "text": "Mark Zuckerberg: All right.", "zh": "Mark Zuckerberg：好的。"}, {"start": 88.65, "end": 89.57, "text": "Hey, everyone.", "zh": "大家好。"}, {"start": 89.57, "end": 91.2, "text": "Thanks for joining today.", "zh": "感谢大家今天参加。"}, {"start": 91.2, "end": 94.14, "text": "This has been a busy and exciting few months.", "zh": "过去几个月非常忙碌，也令人振奋。"}, {"start": 94.14, "end": 105.64, "text": "Our family of apps is now used by 3.64 billion people each day, and we are seeing all-time highs in engagement on both Facebook and Instagram, driven by strong growth in video.", "zh": "我们的应用家族每天已有 36.4 亿人使用，Facebook 和 Instagram 的互动均创历史新高，这主要得益于视频的强劲增长。"}, {"start": 105.64, "end": 110.67, "text": "Threads has now overtaken X in monthly actives and continues to grow quickly.", "zh": "Threads 的月活跃用户已超过 X，并继续快速增长。"}, {"start": 110.67, "end": 118.37, "text": "WhatsApp is hitting all-time highs in messaging and is becoming an increasingly important platform for agents as well.", "zh": "WhatsApp 的消息量也创历史新高，并且正日益成为智能体的重要平台。"}, {"start": 118.37, "end": 126.93, "text": "In the last few months, we have had several major milestones towards our goal of delivering personal superintelligence to everyone.", "zh": "在过去几个月里，我们在实现向每个人提供个人超级智能的目标方面取得了几个重大里程碑。"}, {"start": 126.93, "end": 131.96, "text": "We had one of our most successful launches ever with the Muse personal agent.", "zh": "我们最成功的发布之一就是 Muse 个人智能体。"}, {"start": 131.96, "end": 143, "text": "We shipped Muse Wonder as our first frontier model, and we shipped several new glasses and gadgets with Muse integration, including coming soon to our new audio glasses.", "zh": "我们发布了首个前沿模型 Muse Wonder，还发布了多款集成 Muse 的新眼镜和小设备，包括即将推出的新款音频眼镜。"}, {"start": 143, "end": 148.48, "text": "Mark Zuckerberg: We have been discussing our vision for personal superintelligence for more than a year now.", "zh": "Mark Zuckerberg：一年多来，我们一直在讨论个人超级智能的愿景。"}, {"start": 148.48, "end": 168.68, "text": "We want to help every person have an extremely capable personal agent that understands their goals and can help you achieve them and improve your life in whatever ways you want, whether that is improving your relationships, helping you save time, save money, build a business, create new things, or anything else that you can dream of.", "zh": "我们希望帮助每个人拥有一个极其强大的个人智能体，它了解你的目标，能帮助你实现目标、改善生活，无论是改善人际关系、节省时间、省钱、创业、创造新事物，还是你能想到的任何事。"}, {"start": 168.68, "end": 171.09, "text": "Muse is the product form of this vision.", "zh": "Muse 就是这一愿景的产品形态。"}, {"start": 171.09, "end": 175.06, "text": "Now, we have the foundational technology in place to deliver this.", "zh": "现在，我们已经具备了实现这一愿景的基础技术。"}, {"start": 175.06, "end": 179.64, "text": "There is still a lot of work ahead, but our initial position is very strong.", "zh": "前面还有很多工作要做，但我们的初始位置非常强。"}, {"start": 179.64, "end": 186.39, "text": "In just a month and a half, more than 10 million people in the U.S. and Canada have set up Muse personal agents.", "zh": "仅一个半月，就有超过 1000 万美国和加拿大用户设置了 Muse 个人智能体。"}, {"start": 186.39, "end": 192, "text": "Growth continues to be strong, and we have been number one in the App Store almost every day.", "zh": "增长势头依然强劲，我们几乎每天都位居 App Store 第一名。"}, {"start": 192, "end": 195.54, "text": "Mark Zuckerberg: Engagement and retention are also off to a strong start.", "zh": "Mark Zuckerberg：互动和留存也有了一个良好的开端。"}, {"start": 195.54, "end": 199.64, "text": "About 25% of people who have set up Muse use it on any given day.", "zh": "设置了 Muse 的用户中，约 25% 每天都会使用它。"}, {"start": 199.64, "end": 205.71, "text": "For our earliest adopters, the longer that they use Muse, the better the retention seems to get.", "zh": "对于最早的用户来说，使用时间越长，留存似乎越好。"}, {"start": 205.71, "end": 214.86, "text": "To put this in perspective, this is more than twice the level that Threads started at, or where we believe that other AI apps started at as well.", "zh": "换个角度看，这一水平是 Threads 起步水平的两倍多，也高于我们认为的其他 AI 应用的起步水平。"}, {"start": 214.86, "end": 232.29, "text": "The most common use case for Muse is shopping, with more than a quarter of people who are using Muse engaging in this with an average purchase size of over $200. Plaid told us that they hadn't seen activity like they're seeing with their connector on any other service before.", "zh": "Muse 最常见的使用场景是购物，超过四分之一的 Muse 用户参与其中，平均购买金额超过 200 美元。Plaid 告诉我们，他们从未在其他服务的连接器上看到过这样的活跃度。"}, {"start": 232.29, "end": 240, "text": "In the first week, we had to work with Stripe to raise credit limits since the volumes were above what any of us expected.", "zh": "第一周，我们不得不与 Stripe 合作提高信用额度，因为交易量超出了我们所有人的预期。"}, {"start": 240, "end": 248.93, "text": "Mark Zuckerberg: Beyond shopping, the most common connectors are for personal productivity and connecting Muse to your other services like email and calendar.", "zh": "Mark Zuckerberg：除了购物，最常见的连接器是个人生产力类，以及将 Muse 连接到你的其他服务，例如电子邮件和日历。"}, {"start": 248.93, "end": 264.97, "text": "This shows the importance of the Muse secure VM that we've built to provide state-of-the-art privacy and security, and we are looking forward to following up soon with a Muse confidential VM, which will make it so that even Meta cannot see your content.", "zh": "这凸显了我们打造的 Muse 安全虚拟机的重要性，它提供最先进的隐私和安全保护，我们期待很快推出 Muse 机密虚拟机，届时连 Meta 也无法看到你的内容。"}, {"start": 264.97, "end": 277.13, "text": "We've also seen that Muse Wonder improves quality, engagement, and retention further, which suggests that as we continue to improve intelligence, Muse will perform better and better over time.", "zh": "我们还看到，Muse Wonder 进一步提升了质量、互动和留存，这表明随着智能水平的不断提升，Muse 的表现会越来越好。"}, {"start": 277.13, "end": 285.43, "text": "Now that Muse has clear product market fit, we are entering a new phase and a more operational phase that is focused on scaling it.", "zh": "现在 Muse 已明显找到产品与市场的契合点，我们正进入一个更注重规模化的新阶段、更运营化的阶段。"}, {"start": 285.43, "end": 289.42, "text": "The goals for this next phase play to many of Meta's strengths.", "zh": "下一阶段的目标契合 Meta 的许多优势。"}, {"start": 289.42, "end": 295, "text": "We need to do three things: scale the product, grow revenue, and optimize compute costs.", "zh": "我们需要做三件事：扩大产品规模、增加收入、优化算力成本。"}, {"start": 295, "end": 298.1, "text": "Mark Zuckerberg: We expect to grow Muse to serve billions of people.", "zh": "Mark Zuckerberg：我们预计将把 Muse 扩展到服务数十亿人。"}, {"start": 298.1, "end": 300.65, "text": "This is both our mission and our strategy.", "zh": "这既是我们的使命，也是我们的战略。"}, {"start": 300.65, "end": 307.15, "text": "It's our mission in that we believe in putting the power of personal superintelligence in everyone's hands.", "zh": "之所以是使命，是因为我们相信要把个人超级智能的力量交到每个人手中。"}, {"start": 307.15, "end": 318.22, "text": "We believe that that is the path to ensuring a positive future for everyone with individual empowerment as the source of prosperity and balance of power as the foundation for safety.", "zh": "我们相信，这是确保每个人都有美好未来的道路，个人赋权是繁荣之源，权力制衡是安全之基。"}, {"start": 318.22, "end": 324.78, "text": "On a values level, we believe that delivering this capability widely is the best thing that we can be doing.", "zh": "从价值观层面看，我们相信广泛地提供这一能力是我们能做的最好的事。"}, {"start": 324.78, "end": 334.75, "text": "This is also our strategy because we think that billions of Muses in a network at scale will be able to get more done for people and businesses by working together.", "zh": "之所以也是战略，是因为我们认为，规模化网络中的数十亿个 Muse 协同工作，能为人们和企业完成更多事情。"}, {"start": 334.75, "end": 339, "text": "We'd like to create a large-scale Muse network as quickly as possible.", "zh": "我们希望尽快创建一个大规模的 Muse 网络。"}, {"start": 339, "end": 360.7, "text": "Mark Zuckerberg: From a business perspective, the average revenue per American user for our existing Muse users, sorry, for our existing family of apps users, is several hundreds of dollars annually, and we expect that Muse will reach an even higher level over time due to the amount of commerce that we already see taking place.", "zh": "Mark Zuckerberg：从商业角度看，我们现有 Muse 用户（抱歉，是现有应用家族用户）中每位美国用户的年均收入为数百美元，由于我们已经看到的大量交易，我们预计 Muse 未来会达到更高的水平。"}, {"start": 360.7, "end": 365.22, "text": "This will take some time, but we're starting to work on this now.", "zh": "这需要一些时间，但我们现在已经开始着手了。"}, {"start": 365.22, "end": 368.42, "text": "Our business model will have a few components.", "zh": "我们的商业模式将有几个组成部分。"}, {"start": 368.42, "end": 378.78, "text": "For most people, the product should be free, and we will build commerce tools so we get paid a fee based on the transactions that we help facilitate.", "zh": "对大多数人来说，产品应该是免费的，我们将打造商务工具，根据我们帮助促成的交易收取费用。"}, {"start": 378.78, "end": 381.98, "text": "We expect this will be paid for by businesses.", "zh": "我们预计这部分费用将由企业支付。"}, {"start": 381.98, "end": 389, "text": "For people who want the most advanced models or to use extra tokens, they subscribe directly and pay.", "zh": "对于想要最先进模型或使用额外 token 的用户，他们可以直接订阅并付费。"}, {"start": 389, "end": 400.09, "text": "Mark Zuckerberg: For business owners who want additional features to use Muse to grow their businesses or for companies that want people to use Muse for work, they will be able to subscribe directly and pay as well.", "zh": "Mark Zuckerberg：对于想要更多功能、用 Muse 发展业务的企业主，或者希望员工使用 Muse 工作的公司，他们也可以直接订阅并付费。"}, {"start": 400.09, "end": 409.5, "text": "For those who want Muse to help improve the personalization and quality of their content and ads across Meta, they will be able to connect to those experiences as well.", "zh": "对于希望 Muse 帮助提升其在 Meta 的内容和广告的个性化与质量的用户，他们也可以连接到这些体验。"}, {"start": 409.5, "end": 416.61, "text": "Just to clarify, the average revenue that I was talking about before is the family of apps revenue for our existing Muse users.", "zh": "澄清一下，我之前说的平均收入是指我们现有 Muse 用户的应用家族收入。"}, {"start": 416.61, "end": 423, "text": "On the compute side, we are building out the capacity to serve more than 1 billion people over the next few years.", "zh": "在算力方面，我们正在建设未来几年服务超过 10 亿人的能力。"}, {"start": 423, "end": 436.32, "text": "Mark Zuckerberg: In the near term, Muse is very compute-intensive to run, but we expect to improve its cost efficiency by more than 10x in the next year, which will enable it to be profitable once the revenue lines are at scale.", "zh": "Mark Zuckerberg：短期内，Muse 的运行非常耗费算力，但我们预计明年将其成本效率提高 10 倍以上，这将使它在收入规模上来后实现盈利。"}, {"start": 436.32, "end": 446.54, "text": "If compute efficiency continues improving quickly for another few years, which we think is highly likely, then Muse will be highly profitable over multiple years.", "zh": "如果算力效率在未来几年继续快速提升——我们认为这很有可能——那么 Muse 将在多年内实现高盈利。"}, {"start": 446.54, "end": 457.97, "text": "In the near term, the strength of our core business enables us to scale the Muse network before then, and we believe that we are the best-positioned company to pursue this strategy.", "zh": "短期内，核心业务的实力使我们能够在此之前扩大 Muse 网络的规模，我们相信我们是追求这一战略的最佳位置的公司。"}, {"start": 457.97, "end": 469.39, "text": "One other note on compute economics is that since training is a large fixed cost, now that we have leading models, we want to serve as much high-margin inference demand as possible.", "zh": "关于算力经济学的另一点是，由于训练是一项很大的固定成本，现在我们有了领先的模型，我们希望尽可能多地服务高利润的推理需求。"}, {"start": 469.39, "end": 474, "text": "That is why we are building the Meta Enterprise platform led by CJ Desai.", "zh": "这就是我们正在打造由 CJ Desai 领导的 Meta 企业平台的原因。"}, {"start": 474, "end": 486.15, "text": "Mark Zuckerberg: Muse Wonder and even more advanced models that we're training can serve additional high-margin services beyond the Muse network, including our API, Muse Code, and other enterprise services.", "zh": "Mark Zuckerberg：Muse Wonder 以及我们正在训练的更先进模型，可以服务 Muse 网络之外的其他高利润服务，包括我们的 API、Muse Code 和其他企业服务。"}, {"start": 486.15, "end": 491.67, "text": "A fundamental feature of our business is that we have many good uses for this compute.", "zh": "我们业务的一个基本特征是，我们的算力有很多好的用途。"}, {"start": 491.67, "end": 502.66, "text": "It is difficult to forecast the exact growth rates for the Muse network, for our Enterprise platform, and for how Muse Wonder and beyond will accelerate our core business.", "zh": "很难准确预测 Muse 网络、企业平台以及 Muse Wonder 及后续模型加速核心业务的增长率。"}, {"start": 502.66, "end": 513.14, "text": "But through building up multiple ways to deploy these advanced models, we increase the chances that one or more of them significantly outperforms our expectations.", "zh": "但通过打造多种部署这些先进模型的方式，我们增加了其中一个或多个大幅超出预期的机会。"}, {"start": 513.14, "end": 522.32, "text": "Beyond serving other businesses, we have not yet found the limit of how effectively we can apply compute to accelerating our own core business.", "zh": "除了服务其他企业，我们还没有找到算力在加速自身核心业务方面的有效性上限。"}, {"start": 522.32, "end": 531, "text": "We have implemented an eval with Muse Wonder to improve how effectively it can autonomously improve our recommendations and ad systems.", "zh": "我们已经用 Muse Wonder 做了一个评估，以提高它自主改善我们的推荐和广告系统的有效性。"}, {"start": 531, "end": 539.55, "text": "Mark Zuckerberg: As our upcoming models get even more advanced, I expect that we're going to see an increasing rate of improvement in these systems.", "zh": "Mark Zuckerberg：随着我们未来的模型变得更加先进，我预计这些系统的改善速度会越来越快。"}, {"start": 539.55, "end": 540.21, "text": "All right.", "zh": "好的。"}, {"start": 540.21, "end": 542.3, "text": "Let's talk about the models now.", "zh": "现在谈谈模型。"}, {"start": 542.3, "end": 548.7, "text": "Muse Wonder is state-of-the-art across many dimensions that matter for personal superintelligence.", "zh": "Muse Wonder 在与个人超级智能相关的许多维度上都达到了最先进水平。"}, {"start": 548.7, "end": 554.57, "text": "This validates the importance of training models ourselves to deliver the best experience.", "zh": "这验证了我们自己训练模型以提供最佳体验的重要性。"}, {"start": 554.57, "end": 564.63, "text": "In addition to Muse, we have also seen that engagement per person in Meta AI has more than doubled since April when we started rolling out our new models.", "zh": "除了 Muse，我们还看到，自 4 月开始推出新模型以来，Meta AI 的人均互动已经翻了一番多。"}, {"start": 564.63, "end": 571.81, "text": "While Muse Wonder has been our most important release, I've been very pleased with our pace of execution here.", "zh": "虽然 Muse Wonder 是我们最重要的发布，但我对我们在这里的执行速度非常满意。"}, {"start": 571.81, "end": 582, "text": "In the last few months, we've shipped Muse Spark 1.2 and 1.3, Muse Code, two open weights models with Muse Glimmer and Muse Spark Open, and also Muse Voice.", "zh": "在过去几个月里，我们发布了 Muse Spark 1.2 和 1.3、Muse Code、两个开放权重模型 Muse Glimmer 和 Muse Spark Open，还有 Muse Voice。"}, {"start": 582, "end": 595.71, "text": "Mark Zuckerberg: Going forward, with the field advancing quickly, we plan to focus on both pushing the frontier of intelligence and distilling those models into much smaller and more efficient product models that will be optimized for personal agents.", "zh": "Mark Zuckerberg：展望未来，随着领域快速发展，我们计划既推动智能前沿，也把这些模型蒸馏成更小、更高效、为个人智能体优化的产品模型。"}, {"start": 595.71, "end": 603.62, "text": "My view is that we will be able to build superintelligence through scaling, so we are methodically working our way up the ladder there.", "zh": "我的看法是，我们可以通过规模化来打造超级智能，所以我们正在有条不紊地沿着这条路往上走。"}, {"start": 603.62, "end": 610.19, "text": "We are already working on larger models after Muse Wonder, and they are going to be very impressive and capable.", "zh": "我们已经在开发 Muse Wonder 之后的更大模型，它们将非常令人印象深刻、非常强大。"}, {"start": 610.19, "end": 617.98, "text": "We are also working on new smaller models that are coming out soon that will deliver Muse Wonder-level intelligence more efficiently.", "zh": "我们也在开发即将推出的新款更小模型，它们将更高效地提供 Muse Wonder 级别的智能。"}, {"start": 617.98, "end": 623.14, "text": "Moving on, our work on personal superintelligence is now also the focus of Reality Labs.", "zh": "接下来，我们在个人超级智能方面的工作现在也是 Reality Labs 的重点。"}, {"start": 623.14, "end": 629, "text": "Muse is coming to Meta Glasses starting next month, and that will be an important step towards this.", "zh": "从下个月开始，Muse 将登陆 Meta 眼镜，这将是重要的一步。"}, {"start": 629, "end": 636.36, "text": "Mark Zuckerberg: People already love many features of the glasses already, music, calling, capturing moments, hearing assistance, and more.", "zh": "Mark Zuckerberg：人们已经非常喜欢眼镜的许多功能，音乐、通话、记录瞬间、助听等等。"}, {"start": 636.36, "end": 645.46, "text": "But over time, we expect Muse and having your personal superintelligence with you throughout the day will be the most important part of the experience.", "zh": "但随着时间的推移，我们预计 Muse 以及全天陪伴你的个人超级智能将成为体验中最重要的部分。"}, {"start": 645.46, "end": 649.02, "text": "Muse is also central to the business model for the glasses.", "zh": "Muse 也是眼镜商业模式的核心。"}, {"start": 649.02, "end": 652.58, "text": "Again, our mission and strategy are to serve everyone here.", "zh": "再说一次，我们的使命和战略就是服务所有人。"}, {"start": 652.58, "end": 656.86, "text": "We believe in putting the power of this technology in everyone's hands.", "zh": "我们相信要把这项技术的力量交到每个人手中。"}, {"start": 656.86, "end": 666.51, "text": "So we have priced our devices not to make a large profit on the hardware, but to build a large software and superintelligence business on top of them over time.", "zh": "因此，我们为设备定价时并不是为了在硬件上赚取高额利润，而是为了长期在其之上打造大型的软件和超级智能业务。"}, {"start": 666.51, "end": 677, "text": "Glasses sales continue to grow rapidly, and now with Muse, we expect that paid subscriptions will increase and that this business will begin improving meaningfully from here.", "zh": "眼镜销量继续快速增长，现在有了 Muse，我们预计付费订阅会增加，这项业务将从此开始明显改善。"}, {"start": 677, "end": 693.03, "text": "Mark Zuckerberg: I also shared at Connect that we are changing our approach to virtual reality to only ship new devices when we have major breakthroughs like we had with the Meta VR Glasses this year, which of course are the first VR experience ever in a pair of glasses.", "zh": "Mark Zuckerberg：我在 Connect 大会上也分享过，我们正在改变虚拟现实的做法，只在有重大突破时才发布新设备，就像今年的 Meta VR 眼镜，这是第一款真正装进一副眼镜里的 VR 体验。"}, {"start": 693.03, "end": 710.83, "text": "I continue to believe that the path to delivering holographic experience of bringing together the physical and digital worlds in everyday glasses will come through VR first, but we will pace this aspect of our investment more to focus on delivering personal superintelligence first.", "zh": "我仍然相信，通过 VR 率先实现将物理世界和数字世界结合的全息体验、并装进日常眼镜的道路是可行的，但我们会放缓这方面的投资节奏，优先实现个人超级智能。"}, {"start": 710.83, "end": 723.57, "text": "So with these factors combined, we expect that the P&L of Reality Labs to improve from here with operating loss coming down to around $15 billion next year and trending towards profitability from there.", "zh": "综合这些因素，我们预计 Reality Labs 的损益将从此改善，明年运营亏损将降至约 150 亿美元左右，并从此趋向盈利。"}, {"start": 723.57, "end": 729, "text": "Before we conclude, I want to spend a moment on the sheer velocity that we are seeing.", "zh": "在结束之前，我想花一点时间谈谈我们看到的惊人速度。"}, {"start": 729, "end": 736.09, "text": "Mark Zuckerberg: An important part of our approach has always been to move fast so we can learn quickly and serve people better at scale.", "zh": "Mark Zuckerberg：我们方法的一个重要部分一直是快速行动，这样我们就能快速学习、更好地大规模服务人们。"}, {"start": 736.09, "end": 738.05, "text": "Recently things have accelerated.", "zh": "最近，事情加速了。"}, {"start": 738.05, "end": 742.83, "text": "In the last year, we shipped Edits, and it has already passed 50 million actives.", "zh": "过去一年，我们发布了 Edits，它已经超过 5000 万活跃用户。"}, {"start": 742.83, "end": 748.86, "text": "New apps like Forum and Seller were built by small teams and are scaling quickly to serve power users.", "zh": "像 Forum 和 Seller 这样的新应用由小团队打造，正快速扩展，服务重度用户。"}, {"start": 748.86, "end": 754.18, "text": "Muse went from an idea on a whiteboard to a successful product in just about eight months.", "zh": "Muse 从白板上的一个想法到一款成功的产品只用了大约八个月。"}, {"start": 754.18, "end": 761.75, "text": "We are about to ship Muse Charm, which will have gone from concept to a hardware device in people's pockets in less than a year.", "zh": "我们即将发布 Muse Charm，它从概念到装进口袋的硬件设备不到一年。"}, {"start": 761.75, "end": 763.82, "text": "I am proud of what we are building.", "zh": "我为我们正在打造的东西感到自豪。"}, {"start": 763.82, "end": 774.46, "text": "People have all kinds of different opinions about the future, but at Meta, we believe that the future is for everyone, and that putting power in people's hands is how we get there.", "zh": "人们对未来有各种各样的看法，但在 Meta，我们相信未来属于每个人，相信把力量交到人们手中就是实现这一未来的方式。"}, {"start": 774.46, "end": 776, "text": "I think that this matters.", "zh": "我认为这很重要。"}, {"start": 776, "end": 780.41, "text": "Mark Zuckerberg: There needs to be a company out there that represents these ideas.", "zh": "Mark Zuckerberg：需要有一家公司代表这些理念。"}, {"start": 780.41, "end": 784.09, "text": "This isn't just about ideas, it's also about execution.", "zh": "这不仅仅是理念问题，也是执行问题。"}, {"start": 784.09, "end": 791.58, "text": "I am grateful for everyone who is working so hard to deliver all of this to billions of people around the world.", "zh": "我感谢所有为把这一切带给全球数十亿人而努力工作的人。"}, {"start": 791.58, "end": 795.86, "text": "As always, thank you to everyone who is on this journey with us.", "zh": "一如既往，感谢所有与我们同行的人。"}, {"start": 795.86, "end": 797, "text": "Now here's Susan.", "zh": "现在有请 Susan。"}, {"start": 797, "end": 800.15, "text": "Susan Li: Thanks, Mark, and good afternoon, everyone.", "zh": "Susan Li：谢谢 Mark，大家下午好。"}, {"start": 800.15, "end": 802.85, "text": "Let's begin with our segment results.", "zh": "让我们从分部业绩开始。"}, {"start": 802.85, "end": 807.9, "text": "All comparisons are on a year-over-year basis unless otherwise noted.", "zh": "除非另有说明，所有比较均为同比。"}, {"start": 807.9, "end": 812.14, "text": "Q3 total family of apps revenue was $64.2 billion, up 26%.", "zh": "第三季度应用家族总收入为 642 亿美元，同比增长 26%。"}, {"start": 812.14, "end": 819.6, "text": "Q3 family of apps ad revenue was $63.1 billion, up 26% on both a reported and constant currency basis.", "zh": "第三季度应用家族广告收入为 631 亿美元，按报告口径和固定汇率口径均同比增长 26%。"}, {"start": 819.6, "end": 825.67, "text": "In Q3, the total number of ad impressions served across our services increased 10%.", "zh": "第三季度，我们各服务上展示的广告总展示次数增加了 10%。"}, {"start": 825.67, "end": 834.82, "text": "Impression growth was healthy across all regions, driven by growth in engagement and users, as well as ad load optimizations.", "zh": "展示次数增长在各个地区都很健康，这得益于互动和用户增长以及广告加载优化。"}, {"start": 834.82, "end": 846.37, "text": "The global average price per ad increased 14% year-over-year, driven by ad performance gains and improvements in macro conditions relative to Q3 of last year.", "zh": "全球每条广告的平均价格同比上涨 14%，这得益于广告效果提升以及相对于去年第三季度宏观环境的改善。"}, {"start": 846.37, "end": 854.49, "text": "This was partially offset by strong impression growth, particularly from lower monetizing surfaces and regions.", "zh": "这部分被强劲的展示次数增长所抵消，尤其是来自变现能力较低的版块和地区。"}, {"start": 854.49, "end": 864, "text": "Family of apps other revenue was $1.1 billion and grew 59%, driven primarily by WhatsApp paid messaging and subscriptions revenue.", "zh": "应用家族其他收入为 11 亿美元，增长 59%，主要得益于 WhatsApp 付费消息和订阅收入。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
</body>
</html>
