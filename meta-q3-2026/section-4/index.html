<script>
const LINES=[{"start": 0, "end": 5.71, "text": "Operator: Your next question comes from the line of Doug Anmuth with J.P. Morgan.", "zh": "Operator：下一个问题来自摩根大通的 Doug Anmuth。"}, {"start": 5.71, "end": 7, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 7, "end": 7.45, "text": "Doug Anmuth: Great.", "zh": "Doug Anmuth：很好。"}, {"start": 7.45, "end": 9.82, "text": "Thanks for taking the questions.", "zh": "感谢接受提问。"}, {"start": 9.82, "end": 10.64, "text": "I have two.", "zh": "我有两个问题。"}, {"start": 10.64, "end": 15.09, "text": "First, just wanted to follow up on your last comment, Susan.", "zh": "首先，我想跟进一下你刚才的评论，Susan。"}, {"start": 15.09, "end": 32.47, "text": "Just around as Muse evolves and more businesses adopt agents, just wanted to get your sense of how things change and shift as you go to more permission-based and agent-to-agent transactions, and what does that really unlock over time.", "zh": "关于随着 Muse 的发展和更多企业采用智能体，你如何看待向更多基于许可的、智能体与智能体之间的交易转变，以及这长期来看真正释放了什么。"}, {"start": 32.47, "end": 62.09, "text": "Then secondly, just on expenses and CapEx, thinking about 2027, I know you're not really there yet, but if I go back to some previous comments, you've talked about maximizing compute in 2026 and 2027 and then having more flexibility in 2028. A year ago, you talked about notably larger dollar increase in 2026 than 2025, and then you've also used growing operating income on an annual basis as well.", "zh": "然后第二个问题是关于费用和资本支出，考虑到 2027 年，我知道你们还没有真正到那一步，但回顾你们之前的评论，你们谈过在 2026 年和 2027 年最大化算力，然后在 2028 年有更大的灵活性。一年前，你们谈过 2026 年比 2025 年有明显更大的美元增长，你们也一直用年度运营利润增长作为衡量标准。"}, {"start": 62.09, "end": 69, "text": "Just curious if there's any of those that you can tie or to help us think about 2027. Thanks.", "zh": "我只是好奇，你们能否把其中任何一点联系起来，或者帮助我们思考 2027 年。谢谢。"}, {"start": 69, "end": 69.8, "text": "Susan Li: Thanks, Doug.", "zh": "Susan Li：谢谢 Doug。"}, {"start": 69.8, "end": 77.05, "text": "So on your first question about how the agentic ecosystem evolves, I wish I could sort of predict that more perfectly.", "zh": "关于你的第一个问题，即智能生态系统如何演变，我希望我能更准确地预测这一点。"}, {"start": 77.05, "end": 81.85, "text": "I think it will take some time, and again, I think it will be a little uneven.", "zh": "我认为这需要一些时间，再说一次，我认为这会有些不均衡。"}, {"start": 81.85, "end": 95.43, "text": "But I definitely think that, when I use Muse today, it's clear that there are a lot of parts of the experience that would be even better if Muse was able to interact more seamlessly with business agents on the other side.", "zh": "但我确实认为，当我今天使用 Muse 时，很明显，如果 Muse 能够与另一边的商务智能体更无缝地互动，体验的许多部分会变得更好。"}, {"start": 95.43, "end": 106, "text": "For example, if Muse has to call a business on my behalf, I think it would be easier for the business if that call was handled by business agents that were representing it.", "zh": "例如，如果 Muse 需要代表我给一家企业打电话，我认为如果这个电话由代表该企业的商务智能体来处理，对企业来说会更容易。"}, {"start": 106, "end": 118.86, "text": "Susan Li: I think also one of the things that is really distinctive about Muse, and one of the things that makes the product experience so great, is the degree of proactivity that it exhibits on my behalf, right?", "zh": "Susan Li：我认为 Muse 的一个非常独特之处，也是让产品体验如此出色的原因之一，就是它代表我表现出的主动性，对吧？"}, {"start": 118.86, "end": 133, "text": "I can give it a task and Muse is going to go execute against that task for me, even as it encounters some obstacles or can't quite find the right thing and needs to chart a new path to helping me look for the thing I want.", "zh": "我可以给它一个任务，Muse 就会去执行这个任务，即使它遇到一些障碍，或者不太能找到正确的东西，需要开辟一条新路径来帮助我寻找我想要的东西。"}, {"start": 133, "end": 166.39, "text": "Susan Li: I think that sort of dimension of proactivity exhibited by either consumer agents or business agents, I think, are going to enable more transactions to happen or more activity to happen broadly than happens today where when more actions are taken, primarily when the latent demand expresses itself versus things where I can have Muse searching for things for me on an ongoing basis, giving me regular updates on things I'm looking for, sending me 10 new books a month.", "zh": "Susan Li：我认为，无论是消费者智能体还是商务智能体表现出的这种主动性，都会让更多的交易发生，或者更广泛的活动发生，相比今天——当更多的行动被采取时，主要是当潜在需求表达出来时，而不是我让 Muse 持续为我搜索东西，定期向我更新我在寻找的东西，每月给我发 10 本新书。"}, {"start": 166.39, "end": 181.23, "text": "Agents should be doing similar things for businesses, and I think that creates sort of opportunities again for a new, more proactive sort of framework for what agent-to-agent interactions look like over time.", "zh": "智能体也应该为企业做类似的事情，我认为这再次为智能体与智能体互动在未来是什么样子创造了一个新的、更主动的框架的机会。"}, {"start": 181.23, "end": 190, "text": "On your second question, which is about 2027, we are quite early in developing our budget and capacity plans for next year.", "zh": "关于你的第二个问题，即 2027 年，我们在制定明年的预算和产能计划方面还处于非常早期的阶段。"}, {"start": 190, "end": 200.83, "text": "Susan Li: We are, I would say, at the point where we are both evaluating a lot of investment proposals that have attractive return profiles over different time horizons.", "zh": "Susan Li：我想说，我们正处于评估许多投资提案的阶段，这些提案在不同时间范围内都有吸引人的回报。"}, {"start": 200.83, "end": 209.69, "text": "We want to figure out how we can fund as many of those as possible within the construct of our overall budget and financial goals.", "zh": "我们希望弄清楚，在整体预算和财务目标的框架内，我们如何能够为尽可能多的提案提供资金。"}, {"start": 209.69, "end": 224, "text": "But it's very dynamic, and it's still pretty early, and so we don't have anything more specific or quantitative to share until we get to the Q4 call, which is typically when we share guidance for the next year.", "zh": "但情况非常动态，而且还很早，所以在第四季度电话会议之前，我们没有什么更具体或量化的内容可以分享，而第四季度电话会议通常是我们分享下一年度指引的时候。"}, {"start": 224, "end": 228.95, "text": "Operator: Your next question comes from the line of Justin Post with Bank of America.", "zh": "Operator：下一个问题来自美国银行的 Justin Post。"}, {"start": 228.95, "end": 230, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 230, "end": 230.92, "text": "Justin Post: Great, thanks.", "zh": "Justin Post：很好，谢谢。"}, {"start": 230.92, "end": 232.76, "text": "One for Mark, one for Susan.", "zh": "一个问题给 Mark，一个给 Susan。"}, {"start": 232.76, "end": 241.45, "text": "Mark, you've got this powerful new model on your hands, and it seems like there is a lot you could do internally besides externally.", "zh": "Mark，你手头有一个强大的新模型，似乎除了外部应用之外，你在内部也可以做很多事情。"}, {"start": 241.45, "end": 246.51, "text": "Specifically to the ad business, you've rearchitected your systems around AI.", "zh": "具体到广告业务，你们已经围绕 AI 重新设计了系统。"}, {"start": 246.51, "end": 250.99, "text": "How much room is there for improvement as you deploy that new model?", "zh": "随着你们部署这个新模型，还有多大的改进空间？"}, {"start": 250.99, "end": 253.09, "text": "How are you thinking about that?", "zh": "你们是如何思考这个问题的？"}, {"start": 253.09, "end": 257.17, "text": "Then for Susan, you mentioned strong revenue growth next year.", "zh": "然后对于 Susan，你提到了明年强劲的收入增长。"}, {"start": 257.17, "end": 264.34, "text": "Just wondering if that's advertising or does that incorporate some incremental AI revenues hitting next year?", "zh": "我想知道那是广告，还是也包括明年开始的一些增量 AI 收入？"}, {"start": 264.34, "end": 265, "text": "Thank you.", "zh": "谢谢。"}, {"start": 265, "end": 268, "text": "Susan Li: I'm happy to take both of those.", "zh": "Susan Li：我很乐意回答这两个问题。"}, {"start": 268, "end": 268, "text": "Justin Post: Go for it.", "zh": "Justin Post：请讲。"}, {"start": 268, "end": 268.42, "text": "Susan Li: Great.", "zh": "Susan Li：很好。"}, {"start": 268.42, "end": 286.11, "text": "On your first question, I think our ads business has been benefiting for now many years from our ongoing investments in both what we would have called traditional AI machine learning models, and then, of course, from the more recent generation of models.", "zh": "关于你的第一个问题，我认为我们的广告业务多年来一直受益于我们在传统 AI 机器学习模型方面的持续投资，当然还有更新一代的模型。"}, {"start": 286.11, "end": 291.61, "text": "I would say that there are three themes there that I think are worth outlining.", "zh": "我想说，有三个主题值得概述。"}, {"start": 291.61, "end": 299.07, "text": "The first is just the kind of traditional roadmap of performance improvements that we have in the pipeline.", "zh": "第一个就是传统的、基于我们现有产品线的业绩改进路线图。"}, {"start": 299.07, "end": 304.5, "text": "That is what I would describe more as business-as-usual machine learning work.", "zh": "这就是我所说的更像是日常机器学习工作。"}, {"start": 304.5, "end": 327, "text": "That continues to be a robust and healthy pipeline, and as we are looking into 2027, again, we're not providing an outlook, but I would say that our investments and product improvements across both engagement and ads initiatives give us confidence that we have a meaningful runway to grow our core business throughout 2027.", "zh": "这仍然是一个稳健健康的渠道，随着我们展望 2027 年，再说一次，我们没有提供展望，但我想说，我们在互动和广告方面的投资和产品改进让我们有信心，在 2027 年全年我们的核心业务有显著的增长空间。"}, {"start": 327, "end": 329.82, "text": "Susan Li: That also gets to your second question also.", "zh": "Susan Li：这也回答了你的第二个问题。"}, {"start": 329.82, "end": 335.26, "text": "I should say, basically, I think the ranking and recommendations pipeline is healthy.", "zh": "我想说，基本上，我认为排序和推荐渠道是健康的。"}, {"start": 335.26, "end": 354.27, "text": "The second theme I would say is that we are excited about some of the new research bets that we have as we move into sort of a more LLM-oriented AI infrastructure to help us more deeply reason about people's preferences, what they're interested in, both across organic content and recommendations.", "zh": "第二个主题是，我们对一些新的研究押注感到兴奋，随着我们转向更面向大语言模型的 AI 基础设施，以更深入地推理人们的偏好、他们感兴趣的东西，涵盖自然内容和推荐。"}, {"start": 354.27, "end": 361.64, "text": "We expect that we will be able to unlock benefits to our ranking and recommendations engine from that research too.", "zh": "我们预计，我们也将能够从这项研究中为我们的排序和推荐引擎释放好处。"}, {"start": 361.64, "end": 377, "text": "The third thing is that we expect that generative AI tools, which have already been very valuable for advertisers, will continue to grow in terms of the features that we make available to advertisers, primarily through the Advantage+ suite.", "zh": "第三件事是，我们预计生成式 AI 工具已经对广告主非常有价值，未来将继续在功能上增长，主要是通过 Advantage+ 套件。"}, {"start": 377, "end": 394.85, "text": "Susan Li: Features that make it easier for advertisers to quickly and seamlessly generate, whether it is creative or take an image and generate video or generate sound, all, I think, in service of making the ads increasingly personalized for the person that they're being served to.", "zh": "Susan Li：这些功能让广告主能够快速、无缝地生成，无论是创意，还是拿一张图片生成视频或生成声音，所有这些，我认为都是为了让广告对接受者来说越来越个性化。"}, {"start": 394.85, "end": 400.62, "text": "So I would say we feel like there is meaningful runway across all three of those things.", "zh": "所以我想说，我们觉得在这三个方面都有显著的增长空间。"}, {"start": 400.62, "end": 415.25, "text": "Your second question was about revenue growth next year, and so as I mentioned, I think we're both feeling good about the budget investments that we expect we will make in both core ads and engagement initiatives next year.", "zh": "你的第二个问题是关于明年的收入增长，正如我提到的，我认为我们对明年核心广告和互动方面的预算投资都感觉良好。"}, {"start": 415.25, "end": 427, "text": "We're also building several new AI businesses, and we expect that those can begin contributing incremental revenue in 2027, but more importantly, can scale meaningfully over time.", "zh": "我们也在打造几个新的 AI 业务，我们预计它们可以在 2027 年开始贡献增量收入，但更重要的是，随着时间的推移能够 显著 地扩大规模。"}, {"start": 427, "end": 437.81, "text": "Susan Li: Those will include monetizing our AI products through subscriptions, transactions, advertising, developing enterprise offerings, as we talked about in one of the earlier questions.", "zh": "Susan Li：这些将包括通过订阅、交易、广告、开发企业产品来变现我们的 AI 产品，正如我们在之前的一个问题中谈到的。"}, {"start": 437.81, "end": 461, "text": "So I would say while many of these opportunities remain early and our near-term focus is really on building high-quality products and achieving product market fit and scaled product market fit, I think our track record of reaching billions of people and building businesses at scale makes us feel good that AI is going to become a meaningful source of revenue diversification over time.", "zh": "所以我想说，虽然许多这些机会还处于早期，我们近期的重点确实是打造高质量产品、实现产品市场契合和规模化的产品市场契合，但我认为我们在触达数十亿人和大规模打造业务方面的记录让我们感到有信心，AI 将随着时间的推移成为收入多元化的重要来源。"}, {"start": 461, "end": 465.88, "text": "Operator: Your next question comes from the line of Mark Shmulik with Bernstein.", "zh": "Operator：下一个问题来自 Bernstein 的 Mark Shmulik。"}, {"start": 465.88, "end": 467, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 467, "end": 467.24, "text": "Mark Shmulik: Yes.", "zh": "Mark Shmulik：是的。"}, {"start": 467.24, "end": 469.07, "text": "Thanks for taking my questions.", "zh": "感谢接受我的提问。"}, {"start": 469.07, "end": 478.99, "text": "Mark, coming out of Connect, it kind of felt like we were ushering in the next era of the company, and the business reorienting around Muse at the center of everything.", "zh": "Mark，从 Connect 大会出来后，感觉我们似乎正在进入公司的新时代，业务围绕 Muse 重新定位。"}, {"start": 478.99, "end": 482.59, "text": "Is that a fair assessment of how things are going internally?", "zh": "这是对内部情况的公平评估吗？"}, {"start": 482.59, "end": 489.27, "text": "If so, can you just talk a little bit more about how some of the business mandates and outcomes may have changed?", "zh": "如果是，你能否多谈谈一些业务授权和成果可能发生了怎样的变化？"}, {"start": 489.27, "end": 497.07, "text": "Susan, it was interesting to see the launch cadence where enterprise announcements kind of preceded some of the small business ones.", "zh": "Susan，看到企业公告的发布节奏先于一些小企业公告很有意思。"}, {"start": 497.07, "end": 508.41, "text": "I appreciate your comments on some of what's going on there around the SMB agent opportunity, but can you just share more details on the work required to serve and scale the offerings to SMBs?", "zh": "我很感谢你对 SMB 智能体机会的评论，但你能否分享更多关于服务和扩展面向中小企业的产品所需工作的细节？"}, {"start": 508.41, "end": 509, "text": "Thank you.", "zh": "谢谢。"}, {"start": 509, "end": 512.34, "text": "Mark Zuckerberg: Yeah, I can talk briefly about the first one.", "zh": "Mark Zuckerberg：是的，我可以简要谈谈第一个问题。"}, {"start": 512.34, "end": 523.6, "text": "Look, it was more than a year ago that I think I wrote the letter about personal superintelligence as the North Star for the work that we're doing here.", "zh": "你看，一年多以前，我想我写过一封关于个人超级智能的信，把它作为我们工作的北极星。"}, {"start": 523.6, "end": 540.13, "text": "It basically fits with this line of work that we've done for more than 20 years at the company that is focused on empowering individuals, giving people a voice, giving people the tools to connect in the ways that they want.", "zh": "它基本上符合我们 20 多年来一直专注的工作，即赋予个人权力，给人们发声的机会，给人们提供以他们想要的方式连接的工具。"}, {"start": 540.13, "end": 560, "text": "When you extend that to the work around AI now, we think that the most important thing that we can be building for this next generation of technology is basically putting the power of this technology in everyone's hands, which is the personal superintelligence vision.", "zh": "当你把这一点延伸到现在的 AI 工作时，我们认为，对于这一代技术，我们能打造的最重要的东西基本上就是把这项技术的力量交到每个人手中，这就是个人超级智能的愿景。"}, {"start": 560, "end": 567.61, "text": "Mark Zuckerberg: We've been working on this for a while, and this is when we did the reboot around MSL and building the lab.", "zh": "Mark Zuckerberg：我们已经为此工作了一段时间，这就是我们围绕 MSL 进行重组并建立实验室的时候。"}, {"start": 567.61, "end": 583.19, "text": "A lot of it was this idea that we need to build models specifically to be good as personal agents, that we'd be able to build the best experience by owning and building and designing ourselves the end-to-end technology.", "zh": "很多想法是，我们需要打造专门擅长作为个人智能体的模型，这样通过拥有并自己设计端到端技术，我们就能够打造最佳体验。"}, {"start": 583.19, "end": 586.6, "text": "So that includes the models and then the agents.", "zh": "这包括模型，然后是智能体。"}, {"start": 586.6, "end": 589.95, "text": "This has kind of been in the works for a while.", "zh": "这已经酝酿了一段时间。"}, {"start": 589.95, "end": 593.43, "text": "The vision around the glasses has also been this.", "zh": "围绕眼镜的愿景也是如此。"}, {"start": 593.43, "end": 602.61, "text": "We've wanted to build the next generation of hardware platforms so that we can deliver the best end-to-end experiences to people.", "zh": "我们一直想打造下一代硬件平台，以便提供最佳的端到端体验。"}, {"start": 602.61, "end": 610.01, "text": "I think that that's starting to come together as well, and I think will even more over the coming years.", "zh": "我认为这一点也开始汇聚，我认为在未来几年还会更加如此。"}, {"start": 610.01, "end": 612, "text": "So these are long-term bets.", "zh": "我的意思是，这些都是长期押注。"}, {"start": 612, "end": 621.35, "text": "Mark Zuckerberg: I feel like this is what we're here to do, is make long-term technology bets and design the best experiences end to end that we can for billions of people around the world.", "zh": "Mark Zuckerberg：我觉得这就是我们在这里要做的事情，就是做出长期的技术押注，设计我们能够为全球数十亿人提供的最佳端到端体验。"}, {"start": 621.35, "end": 632, "text": "I think as long as we continue to do that, then over time, the business takes care of itself, as long as we continue executing well, which I'm really proud of the team for how we're doing on that.", "zh": "我认为，只要我们继续这样做，随着时间的推移，业务自然会好起来，只要我们继续执行得好，我为团队在这方面的表现感到非常自豪。"}, {"start": 632, "end": 632.84, "text": "Susan Li: Thanks, Mark.", "zh": "Susan Li：谢谢 Mark。"}, {"start": 632.84, "end": 636.48, "text": "Your second question was around Muse for small business.", "zh": "你的第二个问题是关于面向小企业的 Muse。"}, {"start": 636.48, "end": 641.99, "text": "We launched that, which you can think of as an expansion for Muse, in late September.", "zh": "我们是在 9 月下旬推出的，你可以把它看作是 Muse 的一个扩展。"}, {"start": 641.99, "end": 653.21, "text": "Rather than a separate product, it is kind of a set of new skills and connectors inside the existing Muse app aimed at helping SMB owners run operations, find new customers.", "zh": "它不是一个独立的产品，而是一套新的技能和连接器，内置在现有的 Muse 应用中，旨在帮助中小企业主运营业务、寻找新客户。"}, {"start": 653.21, "end": 669.03, "text": "It connects to a business's, for example, Instagram account analytics or Facebook pages or Meta ad accounts in a few clicks, along with dozens of third-party connectors that businesses already run on, like Shopify, QuickBooks, Canva, et cetera.", "zh": "它可以连接企业的 Instagram 账号分析或 Facebook 主页或 Meta 广告账号，只需点击几下，还有企业已经在使用的几十个第三方连接器，例如 Shopify、QuickBooks、Canva 等。"}, {"start": 669.03, "end": 675, "text": "It already understands what businesses sell, its brand voice, what customers are asking for.", "zh": "它已经了解企业销售什么、品牌声音、客户在问什么。"}, {"start": 675, "end": 683.33, "text": "Susan Li: Muse can take actions, including analyze ad and content performance, draft campaigns, customer responses, flag issues.", "zh": "Susan Li：Muse 可以采取行动，包括分析广告和内容表现、起草广告活动、客户回复、标记问题。"}, {"start": 683.33, "end": 689.41, "text": "We are actively listening to our SMB users to understand what their top use cases are.", "zh": "我们正在积极倾听我们的中小企业用户，了解他们的首要使用场景。"}, {"start": 689.41, "end": 706, "text": "We are seeing them use it for ads optimization, for direct message organizing, use it to expand their sales footprint, to keep their website current based on things like inventory and new products, to deal with employee load balancing.", "zh": "我们看到他们用它来优化广告、整理直接消息、扩大销售版图、根据库存和新产品保持网站更新、处理员工工作量平衡。"}, {"start": 706, "end": 719.33, "text": "Susan Li: We are pretty closely following how businesses use Muse to make sure that we are being thoughtful about new features that we release in Muse to make it maximally useful and productive for SMBs.", "zh": "Susan Li：我们正在密切关注企业如何使用 Muse，以确保我们对在 Muse 中发布的新功能深思熟虑，使其对中小企业尽可能有用和高效。"}, {"start": 719.33, "end": 738.18, "text": "I would also say we have unique touch points to, again, I mentioned in my opening remarks, 500 million self-identified small businesses, and we think that many of the investments that we make in consumer products are going to carry over to help power those businesses also.", "zh": "我还想说，我们有独特的触点，再说一次，我在开场白中提到，5 亿自认为是小企业的企业，我们认为我们在消费产品方面的许多投资也将延续，帮助这些企业。"}, {"start": 738.18, "end": 744.81, "text": "We have multiple excellent channels to surface those opportunities to small businesses globally.", "zh": "我们有多个出色的渠道，可以在全球范围内向小企业展示这些机会。"}, {"start": 744.81, "end": 752.75, "text": "This is a place where we feel like we have an existing extremely strong platform, and we are very excited about it.", "zh": "这是一个我们觉得已经拥有非常强大的平台的地方，我们对此非常兴奋。"}, {"start": 752.75, "end": 760, "text": "We also believe the transition to AI has broadly unlocked enterprise as a new opportunity for us as well.", "zh": "我们也相信，向 AI 的过渡已经广泛地为企业开启了新的机会。"}, {"start": 760, "end": 764.87, "text": "Operator: Your next question comes from the line of Ross Sandler with Barclays.", "zh": "Operator：下一个问题来自巴克莱的 Ross Sandler。"}, {"start": 764.87, "end": 766, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 766, "end": 766.45, "text": "Ross Sandler: Great.", "zh": "Ross Sandler：很好。"}, {"start": 766.45, "end": 782.92, "text": "Mark, you touched on this earlier, but could you elaborate a little bit on maybe some high-level metrics around the per-user cost structure of Muse today, and then how you see that cost curve coming down as you go forward?", "zh": "Mark，你之前提到过这一点，但你能否详细说明一下今天 Muse 的每用户成本结构的一些高层指标，以及你如何看待这条成本曲线在未来下降？"}, {"start": 782.92, "end": 788.26, "text": "What are some of the things you are doing to bring that cost curve down?", "zh": "你们正在做些什么来降低这条成本曲线？"}, {"start": 788.26, "end": 789, "text": "Thank you.", "zh": "谢谢。"}, {"start": 789, "end": 790.82, "text": "Susan Li: I am happy to answer that.", "zh": "Susan Li：我很乐意回答这个问题。"}, {"start": 790.82, "end": 795.15, "text": "Mark, you should add anything that you feel like I am missing.", "zh": "Mark，你应该补充任何你觉得我遗漏的内容。"}, {"start": 795.15, "end": 805.09, "text": "We do not have specific numbers to share around the cost structure of Muse today, but of course it is, as Mark said, pretty compute expensive.", "zh": "我们目前没有关于今天 Muse 成本结构的具体数字可以分享，但当然，正如 Mark 所说，它的算力成本相当高。"}, {"start": 805.09, "end": 817.19, "text": "Making sure that we are focused on compute efficiency is going to be one of the key vectors towards being able to both scale Muse and grow it into the business that we want.", "zh": "确保我们专注于算力效率将是能够扩大 Muse 规模并将其发展成我们想要的业务的关键因素之一。"}, {"start": 817.19, "end": 821.87, "text": "I think there are a couple dimensions of achieving that efficiency.", "zh": "我认为实现这种效率有几个维度。"}, {"start": 821.87, "end": 832.92, "text": "I think some of the more nearer-term pieces include things like leveraging off-peak or spare computing capacity to run some sets of jobs using smaller models.", "zh": "我认为一些更近期的部分包括利用非高峰或闲置计算能力来运行一些使用较小模型的作业。"}, {"start": 832.92, "end": 846, "text": "There is a lot of work to be done across different inference efficiency initiatives, all in service effectively of higher GPU utilization and other product efficiency work we can do also.", "zh": "在不同的推理效率举措方面还有很多工作要做，所有这些实际上都是为了提高 GPU 利用率和其他我们也可以做的产品效率工作。"}, {"start": 846, "end": 866.32, "text": "Susan Li: I think over the longer term, I think this is a place where we expect that we are going to be able to, over time, as LLM scale, get more tasks done with fewer tokens and also rely on AI models themselves to help us improve the efficiency of the software that we use to run the models.", "zh": "Susan Li：我认为从长远来看，我认为这是一个我们预计能够随着时间的推移，随着大语言模型的扩展，用更少的 token 完成更多的任务，并且依靠 AI 模型本身来帮助我们提高运行模型所用软件的效率的地方。"}, {"start": 866.32, "end": 876.48, "text": "I think it is a place where we both feel like there is a lot more work on our efficiency roadmap that is going to help us bend the curve here.", "zh": "我认为这是一个我们都觉得在效率路线图上还有很多工作要做的地方，这将帮助我们压低成本曲线。"}, {"start": 876.48, "end": 887, "text": "We also expect that the arc of how the AI-driven technological advances are going to apply here will also help us achieve larger savings over time.", "zh": "我们也预计，AI 驱动的技术进步将如何应用的弧线也将帮助我们随着时间的推移实现更大的节约。"}, {"start": 887, "end": 891.92, "text": "Operator: Your next question comes from the line of Mark Mahaney with Evercore ISI.", "zh": "Operator：下一个问题来自 Evercore ISI 的 Mark Mahaney。"}, {"start": 891.92, "end": 893, "text": "Please go ahead.", "zh": "请提问。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    a.currentTime = Math.max(0, a.currentTime - 5);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
