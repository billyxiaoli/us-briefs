<script>
const LINES=[{"start": 0, "end": 0.6, "text": "Operator: Thank you.", "zh": "Operator：谢谢。"}, {"start": 0.6, "end": 4.27, "text": "We will now open the lines for a question and answer session.", "zh": "现在我们将开放提问环节。"}, {"start": 4.27, "end": 8.23, "text": "To ask a question, please press star one on your touch-tone phone.", "zh": "如需提问，请按按键电话上的星号键加 1。"}, {"start": 8.23, "end": 11.6, "text": "To withdraw your question, you may press star one again.", "zh": "如需撤回问题，可以再次按星号键加 1。"}, {"start": 11.6, "end": 13.88, "text": "Please limit yourself to one question.", "zh": "请只提一个问题。"}, {"start": 13.88, "end": 18.33, "text": "Please pick up your handset before asking your question to ensure clarity.", "zh": "提问前请拿起话筒，以确保清晰。"}, {"start": 18.33, "end": 22.53, "text": "If you are streaming today's call, please mute your computer speakers.", "zh": "如果您正在流式收听今天的电话会议，请将电脑扬声器静音。"}, {"start": 22.53, "end": 27.04, "text": "Your first question comes from the line of Brian Nowak with Morgan Stanley.", "zh": "第一个问题来自摩根士丹利的 Brian Nowak。"}, {"start": 27.04, "end": 28, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 28, "end": 29.8, "text": "Brian Nowak: Thanks for taking my questions.", "zh": "Brian Nowak：感谢接受我的提问。"}, {"start": 29.8, "end": 32.3, "text": "I have two, one on Muse, one on Enterprise.", "zh": "我有两个问题，一个关于 Muse，一个关于企业业务。"}, {"start": 32.3, "end": 35.09, "text": "Maybe at first, congrats on the success of Muse.", "zh": "首先，祝贺 Muse 取得成功。"}, {"start": 35.09, "end": 55.73, "text": "As you analyze the user behavior and the product, can you talk with us a little bit about any of the constraints to the slope of forward user growth that you're most focused on addressing, whether it's capabilities, model efficiency, capacity, et cetera, just so we understand what are the limiting factors to forward user growth that you want to address?", "zh": "在分析用户行为和产品时，您能否谈谈您最关注的、制约未来用户增长斜率的因素，无论是能力、模型效率、算力等等，让我们了解您想解决的、限制未来用户增长的因素？"}, {"start": 55.73, "end": 57.59, "text": "The second one is on enterprise.", "zh": "第二个问题是关于企业业务的。"}, {"start": 57.59, "end": 68, "text": "Mark, can you sort of walk us through your vision for the Meta Enterprise platform offering and the key value drivers you hope to provide for the enterprises adopting the service?", "zh": "Mark，您能否介绍一下您对 Meta 企业平台产品的愿景，以及您希望为采用该服务的企业提供的主要价值驱动因素？"}, {"start": 68, "end": 74.16, "text": "Mark Zuckerberg: Yeah, I think I can talk about both of those, and then Susan can jump in with anything else.", "zh": "Mark Zuckerberg：是的，我想我可以谈谈这两个问题，然后 Susan 可以补充其他内容。"}, {"start": 74.16, "end": 92.99, "text": "Right now for Muse, one of the things I pointed out is we have more than 10 million people in the U.S. and Canada who have set it up, but I think one of the biggest constraints so far is that because this is a compute-intensive service to run, we have not launched it globally yet.", "zh": "现在对于 Muse，我指出的一点是，我们已有超过 1000 万美国和加拿大用户设置了它，但我认为迄今最大的制约因素之一是，由于这是一项算力密集型服务，我们还没有在全球推出它。"}, {"start": 92.99, "end": 100.7, "text": "That's partially because of wanting to optimize it for each place, and there's some workaround connectors for that.", "zh": "部分原因是想为每个地方进行优化，还有一些连接器方面的工作。"}, {"start": 100.7, "end": 105.59, "text": "But it's partially that we want to make sure that we do this efficiently.", "zh": "但部分原因也是我们想确保高效地做到这一点。"}, {"start": 105.59, "end": 108, "text": "I mean, there's pros and cons there.", "zh": "我的意思是，这有利有弊。"}, {"start": 108, "end": 123.94, "text": "Mark Zuckerberg: The pro, of course, is that just makes it even more impressive that you have 10 million people using it and signing up to use it in the first six weeks, because those are all Americans and Canadians in a small number of markets.", "zh": "Mark Zuckerberg：当然，好的一面是，仅仅这一点就更令人印象深刻：头六周就有 1000 万人使用并注册它，因为这些人全部是少数市场中的美国人和加拿大人。"}, {"start": 123.94, "end": 133.37, "text": "If we actually did roll it out more broadly, then you would expect that number to be significantly larger than what we're seeing today.", "zh": "如果我们真的更广泛地推出它，那么这个数字预计会比我们今天看到的要大得多。"}, {"start": 133.37, "end": 140.99, "text": "On the flip side, we actually have to go do the work to bring the efficiency in line to make that make sense.", "zh": "另一方面，我们确实需要去做工作，使效率达到合理水平。"}, {"start": 140.99, "end": 144, "text": "That's a big part of it that we need to do.", "zh": "这是我们需要做的一大部分工作。"}, {"start": 144, "end": 158.83, "text": "Mark Zuckerberg: The compute efficiency work is going to be important on this also because we want to make sure that we've built enough compute to be able to serve what we think is going to be a billion plus people if we can achieve certain compute efficiency targets.", "zh": "Mark Zuckerberg：算力效率工作也很重要，因为我们希望确保我们已经建设了足够的算力，能够服务我们认为的 10 亿以上用户——如果我们能够实现某些算力效率目标的话。"}, {"start": 158.83, "end": 165.86, "text": "But we obviously have a lot of work to do there as well, and that'll be one of the limiting factors over the next year.", "zh": "但显然我们在这方面也有很多工作要做，这将是明年的一个限制因素。"}, {"start": 165.86, "end": 168.46, "text": "We want to build out the business around it.", "zh": "我们希望围绕它打造业务。"}, {"start": 168.46, "end": 182.4, "text": "I mean, I talked about that, and I think doing that in tandem with bringing down the compute or increasing the compute efficiency is going to be important for getting this to work from a business perspective, which I'm optimistic about.", "zh": "我的意思是，我谈过这一点，我认为与降低算力成本或提高算力效率同步推进业务建设，对于从商业角度让这一切行得通很重要，我对此感到乐观。"}, {"start": 182.4, "end": 186, "text": "But I think that that's one of the things that we need to do.", "zh": "但我认为这是我们需要做的事情之一。"}, {"start": 186, "end": 194.34, "text": "Mark Zuckerberg: There's just continuing to increase the value in the product, which I think we will largely do by continuing to develop new models.", "zh": "Mark Zuckerberg：还有就是不断提升产品价值，我认为这在很大程度上将通过不断开发新模型来实现。"}, {"start": 194.34, "end": 202.49, "text": "That's why I mentioned that we launched Muse first on Muse Spark, and that's what is currently the default across the free tier.", "zh": "这就是为什么我说我们首先在 Muse Spark 上推出了 Muse，这也是目前免费版的默认模型。"}, {"start": 202.49, "end": 207.39, "text": "We rolled out Muse Wonder, and people can access that in the paid tier today.", "zh": "我们推出了 Muse Wonder，人们今天可以在付费版中使用它。"}, {"start": 207.39, "end": 217, "text": "We know that it performs a lot better, so we're working on getting a more efficient version of Muse Wonder that we'll be able to roll out more broadly.", "zh": "我们知道它的表现要好得多，所以我们正在努力推出一个更高效的 Muse Wonder 版本，以便更广泛地推广。"}, {"start": 217, "end": 237.61, "text": "Mark Zuckerberg: You can imagine just as we iterate forward and two, three models into the future, when you have significantly higher intelligence and capability to solve many more problems for people and the ability to deliver that at a much more affordable price point, I think that that's going to just unlock a lot more value to people.", "zh": "Mark Zuckerberg：你可以想象，随着我们向前迭代，再经过两三个模型，当智能和能力显著提高、能为人们解决更多问题，并且价格更加实惠时，我认为这将为人们释放更多的价值。"}, {"start": 237.61, "end": 239.71, "text": "So we're very excited about that.", "zh": "所以我们对此非常兴奋。"}, {"start": 239.71, "end": 253.69, "text": "Transitioning to talking about the enterprise piece, because I think that these two pieces, there is some connection here, in that the main enterprise offering in the near term is going to be the model API in Muse Code.", "zh": "转向企业业务部分，因为我认为这两部分之间存在一些联系，近期主要的企业产品将是模型 API 和 Muse Code。"}, {"start": 253.69, "end": 263, "text": "We have business agents that we've been scaling for a while, and each of those three things is growing quite quickly, so we're excited about that.", "zh": "我们已经扩展了一段时间的商务智能体，这三项业务都在快速增长，所以我们对此感到兴奋。"}, {"start": 263, "end": 269.42, "text": "Mark Zuckerberg: Over time, we would like to make it so that we have a whole business network of Muse agents as well.", "zh": "Mark Zuckerberg：随着时间的推移，我们希望能够打造一个完整的 Muse 商务智能体网络。"}, {"start": 269.42, "end": 278.34, "text": "There's the business agent, which we've talked about on previous earnings calls for businesses to help out with sales and customer support.", "zh": "其中有商务智能体，我们在之前的财报电话会议上谈过，它帮助企业进行销售和客户支持。"}, {"start": 278.34, "end": 284.82, "text": "What we see is a lot of people are actually using Muse today to help run especially small businesses.", "zh": "我们看到，实际上很多人今天都在使用 Muse 来帮助经营尤其是小企业。"}, {"start": 284.82, "end": 302.35, "text": "We think that there's both an opportunity to help create an agent that people use to really enable them to automate and do a lot of the parts of spinning up a small business that are just difficult and time-consuming but aren't the core thing that a person is trying to do.", "zh": "我们认为，有机会帮助打造一个智能体，让人们真正能够自动化处理创办小企业过程中许多困难且耗时、但并非一个人真正想做的部分。"}, {"start": 302.35, "end": 304.27, "text": "So we think that's a big deal.", "zh": "所以我们认为这是一件大事。"}, {"start": 304.27, "end": 313, "text": "Making a version of Muse that people can bring into different corporate environments and work there, we think is going to be a big deal.", "zh": "打造一个人们可以带入不同企业环境中工作的 Muse 版本，我们认为也将是一件大事。"}, {"start": 313, "end": 326.45, "text": "Mark Zuckerberg: Beyond that, building what I refer to as the Muse network, which is making it so that Muse is not just a single-player game where you have your Muse, but making it so that your Muses can work with your friends and your families.", "zh": "Mark Zuckerberg：除此之外，打造我所说的 Muse 网络，也就是让 Muse 不仅仅是一个单人游戏——你有你的 Muse——而是让你的 Muse 能与朋友和家人的 Muse 协同工作。"}, {"start": 326.45, "end": 333.0, "text": "If you want to buy something, it's not just navigating to that business's website, it's talking to their agent.", "zh": "如果你想买东西，不只是浏览那家企业的网站，而是与他们的智能体对话。"}, {"start": 333.0, "end": 338.72, "text": "I think that getting that all to work well together is going to unlock tremendous value at scale.", "zh": "我认为，让这一切很好地协同工作，将在规模上释放巨大的价值。"}, {"start": 338.72, "end": 340.97, "text": "So I'm very excited about all of that.", "zh": "所以我对此非常兴奋。"}, {"start": 340.97, "end": 349.64, "text": "I think the enterprise use is going to be a big part of it, but it's also going to have this very valuable boost in the utility for consumers, too.", "zh": "我认为企业用途将是其中很大一部分，但它也会为消费者带来非常有价值的效用提升。"}, {"start": 349.64, "end": 352, "text": "So I'm very excited about both of those.", "zh": "所以我对这两方面都非常兴奋。"}, {"start": 352, "end": 354.66, "text": "Susan Li: I would add to Mark's comments on enterprise.", "zh": "Susan Li：我想补充一下 Mark 关于企业业务的评论。"}, {"start": 354.66, "end": 358.32, "text": "AI is creating huge amounts of disruption in enterprise today.", "zh": "AI 今天正在企业领域造成巨大的颠覆。"}, {"start": 358.32, "end": 364.59, "text": "From what we can see, we really don't believe that traditional enterprise companies have this locked down.", "zh": "从我们看到的情况来看，我们真的不认为传统企业公司已经锁定了这一领域。"}, {"start": 364.59, "end": 369.79, "text": "In fact, some of the leading companies in this space today didn't exist a few years ago.", "zh": "事实上，今天这一领域的一些领先公司几年前还不存在。"}, {"start": 369.79, "end": 383.8, "text": "Those companies made large investments in model development, and we've done the same, and we have increasingly competitive models to bring to bear for the benefit of all of our users, including small businesses and including enterprises.", "zh": "这些公司在模型开发上进行了大量投资，我们也同样如此，我们有越来越有竞争力的模型，可以为所有用户（包括小企业和企业）带来好处。"}, {"start": 383.8, "end": 387.58, "text": "Already today, we have 500 million businesses using our product.", "zh": "今天，我们已经有 5 亿企业在使用我们的产品。"}, {"start": 387.58, "end": 391.66, "text": "We really believe that AI is going to reshape how businesses operate.", "zh": "我们真的相信 AI 将重塑企业的运营方式。"}, {"start": 391.66, "end": 401, "text": "We expect that businesses of all sizes are going to use AI agents across software development and productivity, sales, marketing, customer service, et cetera.", "zh": "我们预计，各种规模的企业都将在软件开发和生产力、销售、营销、客户服务等方面使用 AI 智能体。"}, {"start": 401, "end": 411.29, "text": "Susan Li: We have differentiated assets to serve this market, bringing together models, infrastructure, global distribution, and long-standing relationships with businesses.", "zh": "Susan Li：我们拥有差异化的资产来服务这一市场，汇集了模型、基础设施、全球分发以及与企业的长期关系。"}, {"start": 411.29, "end": 425.88, "text": "It's our hope that this will be able to be a new diversified, recurring revenue stream for us that will be able to support multiple business models, including subscriptions and usage-based API and messaging and other revenue lines.", "zh": "我们希望这能成为一个新的多元化、经常性收入来源，能够支持多种商业模式，包括订阅、基于使用量的 API、消息传递和其他收入来源。"}, {"start": 425.88, "end": 438, "text": "We expect that this will be an opportunity that will develop over multiple years, and we intend to scale our investment behind demonstrated customer demand and product market fit in this area.", "zh": "我们预计这将是一个多年发展的机会，我们打算根据已证明的客户需求和产品市场契合度来扩大投资。"}, {"start": 438, "end": 442.95, "text": "Operator: Your next question comes from the line of Eric Sheridan with Goldman Sachs.", "zh": "Operator：下一个问题来自高盛的 Eric Sheridan。"}, {"start": 442.95, "end": 444, "text": "Please go ahead.", "zh": "请提问。"}, {"start": 444, "end": 446.31, "text": "Eric Sheridan: Thanks so much for taking the questions.", "zh": "Eric Sheridan：非常感谢接受提问。"}, {"start": 446.31, "end": 478, "text": "Maybe just the first one building on Brian's question, when you think about the friction points around agentic commerce, how do you guys as a company think about solving for friction that's rising where there are aggregators or suppliers that don't want agents to interact with their platforms or their services, and how you think about lowering that friction or creating the right balance between the existing services that consumers access today relative to how this might all be changed or altered by agentic behavior over the medium to long term?", "zh": "也许第一个问题是基于 Brian 的问题，当你们思考智能商务的摩擦点时，作为一家公司，你们如何看待解决聚合商或供应商不希望智能体与其平台或服务互动所带来的摩擦，以及你们如何看待降低这种摩擦，或在消费者今天使用的现有服务与未来几年智能行为可能带来的变化之间创造适当的平衡？"}, {"start": 478, "end": 500.03, "text": "Eric Sheridan: And the second one would be with the announcement of the new class of shares tonight with earnings, any updated thoughts broadly about how you think about sources of capital and optimizing your capital structure to make sure you invest the proper amounts to capitalize on the opportunities that AI are presenting in the next couple of years?", "zh": "Eric Sheridan：第二个问题是关于今晚与财报一起宣布的新股类别，关于资本来源和优化资本结构，以确保你们投入适当的资金来把握 AI 在未来几年带来的机会，你们有什么最新的想法？"}, {"start": 500.03, "end": 501, "text": "Thanks so much.", "zh": "非常感谢。"}, {"start": 501, "end": 504.97, "text": "Mark Zuckerberg: I can answer the first one.", "zh": "Mark Zuckerberg：我可以回答第一个问题。"}, {"start": 504.97, "end": 511, "text": "Sorry, what was the first question there?", "zh": "抱歉，第一个问题是什么？"}, {"start": 511, "end": 513, "text": "Susan Li: Friction points around agentic commerce.", "zh": "Susan Li：智能商务的摩擦点。"}, {"start": 513, "end": 513.39, "text": "Mark Zuckerberg: Yeah.", "zh": "Mark Zuckerberg：是的。"}, {"start": 513.39, "end": 513.93, "text": "Got it.", "zh": "明白了。"}, {"start": 513.93, "end": 514.7, "text": "All right.", "zh": "好的。"}, {"start": 514.7, "end": 515.08, "text": "Yeah.", "zh": "是的。"}, {"start": 515.08, "end": 539.02, "text": "So right now what we're seeing is that overwhelmingly businesses are very excited about enabling this because they recognize that it's going to be a new opportunity for them not only to increase the sales and the quality of the experience for existing customers, but also potentially to bring in new customers.", "zh": "所以现在我们看到的是，绝大多数企业都非常热衷于实现这一点，因为他们认识到，这不仅是增加现有客户销售额和体验质量的新机会，也可能带来新客户。"}, {"start": 539.02, "end": 547.36, "text": "So I mean, across the whole business ecosystem, different people will kind of adopt this at different paces.", "zh": "所以我的意思是，在整个商业生态系统中，不同的人会以不同的速度采用。"}, {"start": 547.36, "end": 554.38, "text": "And how our strategy evolves on that to develop the ecosystem will depend on how that goes.", "zh": "我们的战略如何演变以发展生态系统将取决于这一进展。"}, {"start": 554.38, "end": 575, "text": "But overall, I would say we've been very positively surprised by how quickly, I think a huge amount of businesses have wanted to not only figure out how to make it so that Muse can use their services more effectively but have reached out to us to integrate around it.", "zh": "但总体而言，我要说的是，我们对企业希望不仅弄清楚如何让 Muse 更有效地使用他们的服务，而且主动联系我们进行整合的速度感到非常惊喜。"}, {"start": 575, "end": 576.8, "text": "Mark Zuckerberg: I view that as a very good sign.", "zh": "Mark Zuckerberg：我认为这是一个非常好的信号。"}, {"start": 576.8, "end": 579.15, "text": "Not everyone wants to be an early adopter.", "zh": "不是每个人都想成为早期采用者。"}, {"start": 579.15, "end": 579.88, "text": "That is fine.", "zh": "这没关系。"}, {"start": 579.88, "end": 583.42, "text": "We will work with folks on the terms that makes sense for them.", "zh": "我们将按照对他们有意义的条款与他们合作。"}, {"start": 583.42, "end": 592, "text": "I do think that over time this is going to be quite valuable for everyone to make this work well, and I think we are on a good trajectory on that so far.", "zh": "我确实认为，随着时间的推移，让这一切很好地运转对每个人来说都将非常有价值，我认为到目前为止我们走在正确的轨道上。"}, {"start": 592, "end": 606.76, "text": "Susan Li: I would add to that, and I will also answer your second question and just say I think agents are going to be an important part of how reality evolves, and I think everyone is going to have to adapt to what that means, the new age of agentic commerce.", "zh": "Susan Li：我想补充一下，我也将回答你的第二个问题，我想说的是，智能体将成为现实演变的重要组成部分，我认为每个人都必须适应这意味着什么，即智能商务的新时代。"}, {"start": 606.76, "end": 611.6, "text": "We obviously have had a lot of businesses who are very excited to partner with us.", "zh": "显然，我们有很多企业非常热衷于与我们合作。"}, {"start": 611.6, "end": 625.05, "text": "There are also businesses that are understandably focused on protecting customer relationships, and we expect the market I think ultimately to evolve away from agents attempting to navigate every digital experience like a human.", "zh": "也有一些企业可以理解地专注于保护客户关系，我们预计市场最终会演变，不再是智能体像人类一样试图浏览每一种数字体验。"}, {"start": 625.05, "end": 639.99, "text": "I think over the long run, this will move towards more permissioned, structured interactions, and that will include authenticated APIs, approved agent partnerships, or direct communications between a consumer's personal agent and a business's own agent.", "zh": "我认为从长远来看，这将转向更多基于许可的、结构化的互动，包括经过认证的 API、经批准的智能体合作关系，或者消费者个人智能体与企业自有智能体之间的直接沟通。"}, {"start": 639.99, "end": 644, "text": "We are helping establish the standards needed to support that model.", "zh": "我们正在帮助建立支持这种模式所需的标准。"}, {"start": 644, "end": 658.68, "text": "Susan Li: Earlier this month, we previewed the Personal Agent Protocol, an open standard across Muse and Meta Business Agents that we are developing with industry partners like Sierra, Walmart, Stripe, Shopify, et cetera.", "zh": "Susan Li：本月早些时候，我们预览了个人智能体协议，这是一个跨 Muse 和 Meta 商务智能体的开放标准，我们正在与 Sierra、沃尔玛、Stripe、Shopify 等行业伙伴共同开发。"}, {"start": 658.68, "end": 672.39, "text": "The protocol is intended to define how a consumer's personal agent can interact securely and reliably with the business's agent and preserve appropriate controls for both the business and customer.", "zh": "该协议旨在定义消费者的个人智能体如何安全可靠地与企业的智能体互动，并为企业和客户保留适当的控制权。"}, {"start": 672.39, "end": 684.01, "text": "Again, I think adoption will likely be uneven and will take time, and in the near term we expect many experiences will remain AI-assisted rather than fully autonomous.", "zh": "再说一次，我认为采用可能会不均衡，需要时间，近期我们预计许多体验仍将是 AI 辅助的，而不是完全自主的。"}, {"start": 684.01, "end": 697.78, "text": "As trusted integrations develop and agents demonstrate that they can generate incremental value and demand and operate safely, we expect that more and more businesses will be excited to participate.", "zh": "随着可信集成的开发，以及智能体证明它们能够创造增量价值和需求并安全运行，我们预计越来越多的企业会热衷于参与。"}, {"start": 697.78, "end": 703, "text": "Your second question was about the announcement of the new class of shares.", "zh": "你的第二个问题是关于新股类别的公告。"}, {"start": 703, "end": 720.34, "text": "Susan Li: I should say we created this new class of shares with the purpose of creating a publicly traded non-voting stock usable for capital raising, employee compensation, acquisitions, other general corporate purposes while preserving the voting power of existing Class A and B shareholders.", "zh": "Susan Li：我要说的是，我们创建这个新股类别的目的是创建一个可公开交易的无投票权股票，可用于融资、员工薪酬、收购和其他一般公司用途，同时保留现有 A 类和 B 类股东的投票权。"}, {"start": 720.34, "end": 724.43, "text": "We believe the share class will maintain our founder-led structure.", "zh": "我们相信该股类别将维持我们创始人主导的结构。"}, {"start": 724.43, "end": 734.32, "text": "It will expand our funding tools and give us flexibility to invest behind the unprecedented momentum we are seeing across every part of our business driven by AI.", "zh": "它将扩大我们的融资工具，并给我们灵活性，以投资于我们在 AI 驱动的业务各个部分看到的前所未有的势头。"}, {"start": 734.32, "end": 748, "text": "We do not have any specific financing plans to announce at this time, but we thought it was prudent to establish the appropriate capital structure framework to ensure that we have access to a diverse pool of funding sources.", "zh": "我们目前没有具体的融资计划要宣布，但我们认为建立适当的资本结构框架是审慎的，以确保我们能够获得多样化的资金来源。"}];
const a=document.getElementById('player'),playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),cur=document.getElementById('cur'),dur=document.getElementById('dur'),speedBtn=document.getElementById('speedBtn'),speedMenu=document.getElementById('speedMenu'),box=document.getElementById('transcript'),zhBox=document.getElementById('zh');
LINES.forEach((l,i)=>{const d=document.createElement('div');d.className='line';d.textContent=l.text;d.onclick=()=>{a.currentTime=l.start;a.play();playBtn.textContent='⏸';};box.appendChild(d);});
const els=[...box.children];
let curIdx=-1;
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function setActive(i){if(i===curIdx)return;curIdx=i;els.forEach((el,j)=>{el.className='line'+(j===i?' active':(j<i&&i-j<=2?' near':''));});if(i>=0){const el=els[i];zhBox.textContent=LINES[i].zh||'';box.scrollTop+=el.getBoundingClientRect().bottom-box.getBoundingClientRect().bottom;}}
playBtn.onclick=()=>{if(a.paused){a.play();playBtn.textContent='⏸';}else{a.pause();playBtn.textContent='▶';}};
document.getElementById('back5Btn').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-5);};
document.getElementById('fwd5Btn').onclick=()=>{a.currentTime=Math.min(a.duration||0,a.currentTime+5);};
speedBtn.onclick=()=>{if(speedMenu.hidden){speedMenu.hidden=false;const sel=speedMenu.querySelector('.speed-opt.sel');if(sel)sel.scrollIntoView({block:'center'});}else{speedMenu.hidden=true;}};
speedMenu.onclick=(e)=>{if(e.target===speedMenu)speedMenu.hidden=true;};
speedMenu.querySelectorAll('.speed-opt').forEach(b=>{b.onclick=()=>{a.playbackRate=parseFloat(b.dataset.rate);speedBtn.textContent=b.textContent.replace(/[●○]/,'').trim();speedMenu.querySelectorAll('.speed-opt').forEach(x=>{x.classList.remove('sel');x.querySelector('span').textContent='○';});b.classList.add('sel');b.querySelector('span').textContent='●';speedMenu.hidden=true;};});
a.onloadedmetadata=()=>{dur.textContent=fmt(a.duration);seek.max=a.duration;};
a.ontimeupdate=()=>{cur.textContent=fmt(a.currentTime);if(document.activeElement!==seek)seek.value=a.currentTime;let idx=-1;for(let i=0;i<LINES.length;i++){if(a.currentTime>=LINES[i].start)idx=i;else break;}setActive(idx);};
seek.oninput=()=>{a.currentTime=parseFloat(seek.value);cur.textContent=fmt(a.currentTime);};
a.onended=()=>{playBtn.textContent='▶';};

/* resume per MP3 + volume, added 2026-10-25 */
function posKey(){try{return 'audioPos:'+new URL(a.src, location.href).pathname;}catch(e){return 'audioPos:'+a.src;}}
function savePos(){try{if(a.currentTime>5&&a.duration&&a.currentTime<a.duration-5)localStorage.setItem(posKey(), String(a.currentTime));}catch(e){}}
function restorePos(){try{const v=parseFloat(localStorage.getItem(posKey()));if(!isNaN(v)&&v>5&&a.duration&&v<a.duration-5){a.currentTime=v;cur.textContent=fmt(v);const st=document.getElementById('status');if(st)st.textContent='已回到上次位置 '+fmt(v);}}catch(e){}}
let lastSave=0;
a.addEventListener('timeupdate',()=>{const now=Date.now();if(now-lastSave>5000){lastSave=now;savePos();}});
a.addEventListener('pause',savePos);
window.addEventListener('pagehide',savePos);
a.addEventListener('loadedmetadata',restorePos);
a.addEventListener('ended',()=>{try{localStorage.removeItem(posKey());}catch(e){}});
if(a.readyState>=1&&a.duration)restorePos();
const volBtn=document.getElementById('volBtn'),volMenu=document.getElementById('volMenu'),volRange=document.getElementById('volRange'),volLabel=document.getElementById('volLabel');
function applyVol(v){a.volume=v/100;if(volRange)volRange.value=v;if(volLabel)volLabel.textContent='音量 '+v+'%';if(volBtn)volBtn.textContent=v==0?'🔇':(v<50?'🔈':'🔊');try{localStorage.setItem('audioVol',String(v));}catch(e){}}
if(volBtn&&volMenu&&volRange){let savedVol=100;try{savedVol=parseInt(localStorage.getItem('audioVol'));if(isNaN(savedVol))savedVol=100;}catch(e){}applyVol(savedVol);volBtn.onclick=()=>{volMenu.hidden=!volMenu.hidden;};volMenu.onclick=(e)=>{if(e.target===volMenu)volMenu.hidden=true;};volRange.oninput=()=>{applyVol(parseInt(volRange.value,10));};}
</script>
<script>
document.addEventListener('keydown', function(e) {
  var a = document.querySelector('audio');
  if (!a || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (e.key === 'PageDown' || e.key === 'Next') {
    if (t && ((t.tagName === 'INPUT' && t.type === 'text') || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    document.dispatchEvent(new KeyboardEvent('keydown', {key: 'ArrowLeft', bubbles: true, cancelable: true}));
  } else if (e.key === 'ArrowUp') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    var pb = document.getElementById('playBtn');
    if (pb) { pb.click(); }
    else if (a.paused) { var pr = a.play(); if (pr && pr.catch) pr.catch(function(){}); }
    else { a.pause(); }
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      a.currentTime = Math.max(0, a.currentTime - 5);
    } else if (isFinite(a.duration)) {
      a.currentTime = Math.min(a.duration, a.currentTime + 5);
    } else {
      a.currentTime = a.currentTime + 5;
    }
  }
});
</script>
</body>
